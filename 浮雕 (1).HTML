<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文字特效生成器 · 多效果版</title>
<style>
  :root{
    --bg:#1b1e24;
    --panel:#22262e;
    --line:#313742;
    --txt:#e7ebf2;
    --muted:#9aa4b4;
    --accent:#5b8cff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;display:flex;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:13px;-webkit-font-smoothing:antialiased;
  }

  /* ---------- 左侧面板 ---------- */
  .panel{
    width:358px;flex:none;padding:20px 20px 40px;overflow-y:auto;
    background:var(--bg);border-right:1px solid var(--line);
  }
  .panel::-webkit-scrollbar{width:8px;}
  .panel::-webkit-scrollbar-thumb{background:#3a414d;border-radius:4px;}

  h1{font-size:15px;font-weight:600;margin:0 0 4px;letter-spacing:.3px;}
  h1 em{color:var(--accent);font-style:normal;}
  .sub{font-size:11px;color:var(--muted);margin:0 0 20px;line-height:1.6;}

  .row{margin-bottom:14px;}
  .head{
    display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:var(--muted);margin-bottom:6px;
  }
  .head .val{color:var(--txt);font-variant-numeric:tabular-nums;font-size:12px;}

  textarea,select{
    width:100%;background:var(--panel);color:var(--txt);
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;
    font-size:13px;font-family:inherit;outline:none;transition:border-color .15s;
  }
  textarea{resize:vertical;min-height:56px;line-height:1.5;}
  textarea:focus,select:focus{border-color:var(--accent);}
  select{cursor:pointer;appearance:none;padding-right:30px;
    background-image:linear-gradient(45deg,transparent 50%,#8b94a5 50%),linear-gradient(135deg,#8b94a5 50%,transparent 50%);
    background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;}

  input[type=range]{
    width:100%;height:4px;border-radius:2px;background:var(--line);
    outline:none;-webkit-appearance:none;appearance:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:var(--accent);border:2px solid #fff2;cursor:pointer;transition:transform .12s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15);}
  input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border-radius:50%;background:var(--accent);
    border:2px solid #fff2;cursor:pointer;
  }

  /* 效果网格 */
  .effect-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .effect-grid button{
    padding:8px 2px;font-size:11.5px;background:var(--panel);
    border:1px solid var(--line);border-radius:7px;color:var(--muted);
    cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap;
  }
  .effect-grid button:hover{color:var(--txt);border-color:#444c5c;}
  .effect-grid button.active{
    background:var(--accent);border-color:var(--accent);color:#fff;
    box-shadow:0 2px 10px #5b8cff44;
  }

  /* 颜色 */
  .colors{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .colorItem{
    display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);
    background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:6px 8px;cursor:pointer;transition:border-color .15s,opacity .15s;
  }
  .colorItem:hover{border-color:#444c5c;}
  input[type=color]{
    -webkit-appearance:none;appearance:none;width:26px;height:26px;flex:none;
    border:none;padding:0;background:none;cursor:pointer;border-radius:6px;overflow:hidden;
  }
  input[type=color]::-webkit-color-swatch-wrapper{padding:0;}
  input[type=color]::-webkit-color-swatch{border:1px solid #ffffff26;border-radius:6px;}
  input[type=color]::-moz-color-swatch{border:1px solid #ffffff26;border-radius:6px;}

  .check{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);cursor:pointer;margin:12px 0 16px;}
  .check input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;}

  .hr{height:1px;background:var(--line);margin:18px 0;}

  .btn{
    width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel);color:var(--txt);cursor:pointer;font-family:inherit;
    font-size:13px;transition:.15s;
  }
  .btn:hover{filter:brightness(1.15);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px #5b8cff33;}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

  /* ---------- 预览区 ---------- */
  .stage{
    flex:1;min-width:0;display:grid;place-items:center;padding:40px;overflow:auto;
    background:#e4e7ec;transition:background .2s;
  }
  #output{
    text-align:center;line-height:1.25;white-space:pre-wrap;word-break:break-word;
    max-width:100%;user-select:none;-webkit-user-select:none;
  }

  .toast{
    position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);
    background:#2b3140;color:#fff;padding:10px 20px;border-radius:9px;
    font-size:13px;opacity:0;pointer-events:none;transition:.25s;
    border:1px solid #3c4454;box-shadow:0 8px 24px #0008;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  @media (max-width:780px){
    body{flex-direction:column;}
    .panel{width:100%;max-height:58vh;border-right:none;border-bottom:1px solid var(--line);}
    .stage{padding:24px;min-height:42vh;}
  }
</style>
</head>
<body>

<!-- ================= 控制面板 ================= -->
<aside class="panel">
  <h1>文字特效<em>生成器</em></h1>
  <p class="sub">11 种效果 · 实时调节 · 一键复制 CSS</p>

  <div class="row">
    <div class="head"><span>文字内容</span></div>
    <textarea id="text" spellcheck="false">浮雕效果</textarea>
  </div>

  <div class="row">
    <div class="head"><span>字体</span></div>
    <select id="fontFamily">
      <option value="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">系统默认</option>
      <option value="'Helvetica Neue', Arial, sans-serif">Helvetica / Arial</option>
      <option value="Impact, 'Arial Black', sans-serif">Impact 超粗</option>
      <option value="Georgia, 'Times New Roman', serif">Georgia 衬线</option>
      <option value="'Courier New', Consolas, monospace">等宽字体</option>
      <option value="'PingFang SC', 'Microsoft YaHei', sans-serif">中文黑体</option>
      <option value="'Songti SC', 'SimSun', serif">中文宋体</option>
    </select>
  </div>

  <div class="row">
    <div class="head"><span>字号</span><span class="val" id="fontSizeVal"></span></div>
    <input type="range" id="fontSize" min="20" max="220" step="1" value="96">
  </div>

  <div class="row">
    <div class="head"><span>字重</span><span class="val" id="fontWeightVal"></span></div>
    <input type="range" id="fontWeight" min="100" max="900" step="100" value="700">
  </div>

  <div class="row">
    <div class="head"><span>字间距</span><span class="val" id="letterSpacingVal"></span></div>
    <input type="range" id="letterSpacing" min="-10" max="40" step="0.5" value="4">
  </div>

  <div class="hr"></div>

  <!-- 效果选择 -->
  <div class="row">
    <div class="head"><span>效果类型</span></div>
    <div class="effect-grid" id="effectGrid">
      <button data-mode="raised" class="active">凸起浮雕</button>
      <button data-mode="inset">凹陷雕刻</button>
      <button data-mode="shadow3d">3D 立体</button>
      <button data-mode="neon">霓虹发光</button>
      <button data-mode="pixel">像素化</button>
      <button data-mode="wave">波浪扭曲</button>
      <button data-mode="glitch">故障抖动</button>
      <button data-mode="outline">描边空心</button>
      <button data-mode="gradient">渐变文字</button>
      <button data-mode="blur">柔焦模糊</button>
      <button data-mode="none">纯净文字</button>
    </div>
  </div>

  <!-- 各参数行，按效果显隐 -->
  <div class="row" data-param="depth">
    <div class="head"><span>浮雕深度</span><span class="val" id="depthVal"></span></div>
    <input type="range" id="depth" min="0" max="30" step="0.5" value="8">
  </div>

  <div class="row" data-param="blur">
    <div class="head"><span>边缘柔化</span><span class="val" id="blurVal"></span></div>
    <input type="range" id="blur" min="0" max="25" step="0.5" value="2">
  </div>

  <div class="row" data-param="angle">
    <div class="head"><span>光照角度</span><span class="val" id="angleVal"></span></div>
    <input type="range" id="angle" min="0" max="360" step="1" value="135">
  </div>

  <div class="row" data-param="strength">
    <div class="head"><span id="strengthLabel">效果强度</span><span class="val" id="strengthVal"></span></div>
    <input type="range" id="strength" min="0" max="30" step="0.5" value="8">
  </div>

  <div class="row" data-param="freq">
    <div class="head"><span>扭曲频率</span><span class="val" id="freqVal"></span></div>
    <input type="range" id="freq" min="5" max="80" step="1" value="20">
  </div>

  <div class="row" data-param="hue">
    <div class="head"><span>色相旋转</span><span class="val" id="hueVal"></span></div>
    <input type="range" id="hue" min="0" max="360" step="1" value="0">
  </div>

  <div class="hr"></div>

  <div class="row">
    <div class="head"><span>配色</span></div>
    <div class="colors">
      <label class="colorItem"><input type="color" id="bg" value="#e4e7ec"><span>背景</span></label>
      <label class="colorItem" id="colorWrap"><input type="color" id="color" value="#e4e7ec" disabled><span>文字</span></label>
      <label class="colorItem"><input type="color" id="hl" value="#ffffff"><span>高光</span></label>
      <label class="colorItem"><input type="color" id="sh" value="#9aa3b2"><span>暗部</span></label>
    </div>
  </div>

  <label class="check">
    <input type="checkbox" id="matchBg" checked>
    浮雕类文字颜色跟随背景
  </label>

  <div class="btn-row">
    <button class="btn primary" id="copyBtn">复制 CSS</button>
    <button class="btn" id="resetBtn">重置</button>
  </div>
</aside>

<!-- ================= 预览区 ================= -->
<main class="stage" id="stage">
  <div id="output">浮雕效果</div>
</main>

<!-- SVG 滤镜（波浪扭曲） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="wave-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="2" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="10"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div class="toast" id="toast">已复制</div>

<script>
(function () {
  'use strict';

  const $ = id => document.getElementById(id);

  const els = {
    text:          $('text'),
    stage:         $('stage'),
    output:        $('output'),
    fontFamily:    $('fontFamily'),
    fontSize:      $('fontSize'),
    fontWeight:    $('fontWeight'),
    letterSpacing: $('letterSpacing'),
    depth:         $('depth'),
    blur:          $('blur'),
    angle:         $('angle'),
    strength:      $('strength'),
    freq:          $('freq'),
    hue:           $('hue'),
    bg:            $('bg'),
    color:         $('color'),
    colorWrap:     $('colorWrap'),
    hl:            $('hl'),
    sh:            $('sh'),
    matchBg:       $('matchBg')
  };

  let mode = 'raised';
  const fmt = n => String(Math.round(n * 100) / 100);

  /* ============ 各效果生成函数 ============ */

  // 浮雕 / 雕刻阴影
  function buildShadow(type) {
    const depth = +els.depth.value;
    const blur  = +els.blur.value;
    const rad   = (+els.angle.value) * Math.PI / 180;
    const lx =  Math.cos(rad) * depth;
    const ly = -Math.sin(rad) * depth;
    const raised = type === 'raised';
    const hx = raised ?  lx : -lx;
    const hy = raised ?  ly : -ly;
    return `${fmt(hx)}px ${fmt(hy)}px ${fmt(blur)}px ${els.hl.value}, ` +
           `${fmt(-hx)}px ${fmt(-hy)}px ${fmt(blur * 1.4)}px ${els.sh.value}`;
  }

  // 霓虹发光
  function buildNeon(color, s) {
    return [
      `0 0 ${fmt(s * 0.3)}px ${color}`,
      `0 0 ${fmt(s * 0.8)}px ${color}`,
      `0 0 ${fmt(s * 1.6)}px ${color}`,
      `0 0 ${fmt(s * 0.08)}px #ffffff`
    ].join(', ');
  }

  // 3D 阶梯立体
  function build3d(s) {
    const steps = Math.max(2, Math.round(s / 1.5));
    const layers = [];
    for (let i = 1; i <= steps; i++) {
      layers.push(`${i}px ${i}px 0 ${els.sh.value}`);
    }
    return layers.join(', ');
  }

  // 故障红蓝分离
  function buildGlitch(s) {
    const k = s * 0.6;
    return `${fmt(-k)}px 0 0 #ff004d, ` +
           `${fmt(k)}px 0 0 #00e5ff, ` +
           `${fmt(-k * 0.5)}px ${fmt(k * 0.35)}px 0 #ffe600`;
  }

  /* ============ SVG 波浪滤镜参数 ============ */
  const waveTurb = document.querySelector('#wave-filter feTurbulence');
  const waveDisp = document.querySelector('#wave-filter feDisplacementMap');
  function updateWave(freq, scale) {
    waveTurb.setAttribute('baseFrequency', freq);
    waveDisp.setAttribute('scale', scale);
  }

  /* ============ 参数行显隐 ============ */
  const paramMap = {
    depth:    ['raised', 'inset'],
    blur:     ['raised', 'inset', 'neon', 'glitch', 'shadow3d', 'blur'],
    angle:    ['raised', 'inset'],
    strength: ['shadow3d', 'neon', 'pixel', 'wave', 'glitch', 'outline', 'blur'],
    freq:     ['wave'],
    hue:      ['raised','inset','shadow3d','neon','pixel','wave','glitch','outline','gradient','blur','none']
  };

  const strengthLabels = {
    shadow3d: '立体层数',
    neon:     '发光强度',
    pixel:    '像素化强度',
    wave:     '扭曲强度',
    glitch:   '故障偏移',
    outline:  '描边宽度',
    blur:     '模糊程度'
  };

  function updateParamVisibility() {
    document.querySelectorAll('[data-param]').forEach(row => {
      const key = row.dataset.param;
      const list = paramMap[key] || [];
      row.style.display = list.includes(mode) ? '' : 'none';
    });
    if (strengthLabels[mode]) {
      $('strengthLabel').textContent = strengthLabels[mode];
    }
  }

  /* ============ 主更新 ============ */
  function update() {
    const bg      = els.bg.value;
    const hlColor = els.hl.value;
    const shColor = els.sh.value;
    const strength = +els.strength.value;
    const hue     = +els.hue.value;

    // 背景
    els.stage.style.background = bg;

    // 浮雕类：文字与背景同色；其他：文字需可见
    const embossLike = (mode === 'raised' || mode === 'inset');
    let color;
    if (embossLike && els.matchBg.checked) color = bg;
    else if (els.matchBg.checked)          color = hlColor;
    else                                   color = els.color.value;

    const o = els.output.style;

    // ---- 基础重置 ----
    o.fontFamily          = els.fontFamily.value;
    o.fontSize            = els.fontSize.value + 'px';
    o.fontWeight          = els.fontWeight.value;
    o.letterSpacing       = els.letterSpacing.value + 'px';
    o.color               = color;
    o.webkitTextFillColor = color;
    o.textShadow          = 'none';
    o.webkitTextStroke    = '0px transparent';
    o.filter              = 'none';
    o.background          = 'none';
    o.webkitBackgroundClip = 'border-box';
    o.backgroundClip      = 'border-box';

    // ---- 色相旋转（可叠加）----
    const filters = [];
    if (hue) filters.push(`hue-rotate(${hue}deg)`);

    // ---- 按效果应用 ----
    switch (mode) {
      case 'raised':
      case 'inset':
        o.textShadow = buildShadow(mode);
        break;

      case 'shadow3d':
        o.color = hlColor;
        o.textShadow = build3d(strength);
        break;

      case 'neon':
        o.color = hlColor;
        o.textShadow = buildNeon(hlColor, strength);
        break;

      case 'pixel':
        o.color = hlColor;
        filters.push(`blur(${fmt(strength * 0.12)}px) contrast(${fmt(4 + strength * 0.6)})`);
        break;

      case 'wave':
        o.color = hlColor;
        filters.push('url(#wave-filter)');
        updateWave(fmt(+els.freq.value / 1000), fmt(strength * 1.6));
        break;

      case 'glitch':
        o.color = hlColor;
        o.textShadow = buildGlitch(strength);
        break;

      case 'outline':
        o.webkitTextFillColor = 'transparent';
        o.webkitTextStroke = `${fmt(strength * 0.15)}px ${hlColor}`;
        break;

      case 'gradient':
        o.background = `linear-gradient(135deg, ${hlColor}, ${shColor})`;
        o.webkitBackgroundClip = 'text';
        o.backgroundClip = 'text';
        o.webkitTextFillColor = 'transparent';
        break;

      case 'blur':
        o.color = hlColor;
        filters.push(`blur(${fmt(strength * 0.3)}px)`);
        break;

      case 'none':
      default:
        break;
    }

    o.filter = filters.length ? filters.join(' ') : 'none';

    // ---- 数值回显 ----
    $('fontSizeVal').textContent      = els.fontSize.value + ' px';
    $('fontWeightVal').textContent    = els.fontWeight.value;
    $('letterSpacingVal').textContent = els.letterSpacing.value + ' px';
    $('depthVal').textContent         = els.depth.value + ' px';
    $('blurVal').textContent          = els.blur.value + ' px';
    $('angleVal').textContent         = els.angle.value + ' °';
    $('strengthVal').textContent      = els.strength.value;
    $('freqVal').textContent          = fmt(+els.freq.value / 1000);
    $('hueVal').textContent           = els.hue.value + ' °';
  }

  /* ============ 事件绑定 ============ */
  const inputs = ['fontFamily','fontSize','fontWeight','letterSpacing',
                  'depth','blur','angle','strength','freq','hue',
                  'bg','color','hl','sh'];
  inputs.forEach(id => {
    els[id].addEventListener('input', update);
    els[id].addEventListener('change', update);
  });

  els.text.addEventListener('input', () => {
    els.output.textContent = els.text.value;
    update();
  });

  els.matchBg.addEventListener('change', () => {
    const on = els.matchBg.checked;
    els.color.disabled = on;
    els.colorWrap.style.opacity = on ? .45 : 1;
    els.colorWrap.style.pointerEvents = on ? 'none' : 'auto';
    update();
  });

  // 效果切换
  document.querySelectorAll('#effectGrid button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#effectGrid button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      mode = btn.dataset.mode;
      updateParamVisibility();
      update();
    });
  });

  /* ============ 复制 CSS ============ */
  const toast = $('toast');
  let toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  $('copyBtn').addEventListener('click', () => {
    const o = els.output.style;
    const lines = [
      '.effect-text {',
      `  font-family: ${o.fontFamily};`,
      `  font-size: ${o.fontSize};`,
      `  font-weight: ${o.fontWeight};`,
      `  letter-spacing: ${o.letterSpacing};`,
      `  color: ${o.color};`
    ];
    if (o.webkitTextFillColor && o.webkitTextFillColor !== o.color) {
      lines.push(`  -webkit-text-fill-color: ${o.webkitTextFillColor};`);
    }
    if (o.textShadow && o.textShadow !== 'none') {
      lines.push(`  text-shadow: ${o.textShadow};`);
    }
    if (o.webkitTextStroke && o.webkitTextStroke !== '0px transparent') {
      lines.push(`  -webkit-text-stroke: ${o.webkitTextStroke};`);
    }
    if (o.background && o.background !== 'none') {
      lines.push(`  background: ${o.background};`);
      lines.push(`  -webkit-background-clip: text;`);
      lines.push(`  background-clip: text;`);
    }
    if (o.filter && o.filter !== 'none') {
      lines.push(`  filter: ${o.filter};`);
    }
    lines.push(`}`);
    lines.push(`/* 背景色: ${els.bg.value} */`);
    if (mode === 'wave') {
      lines.push(`/* 注意：波浪扭曲需要配套 SVG 滤镜 #wave-filter */`);
    }

    const css = lines.join('\n');
    const done = () => showToast('CSS 已复制到剪贴板 ✓');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(css).then(done).catch(fallback);
    } else fallback();

    function fallback() {
      const ta = document.createElement('textarea');
      ta.value = css;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); }
      catch (e) { showToast('复制失败，请手动选择'); }
      ta.remove();
    }
  });

  /* ============ 重置 ============ */
  $('resetBtn').addEventListener('click', () => {
    els.text.value          = '浮雕效果';
    els.output.textContent  = '浮雕效果';
    els.fontFamily.value    = "system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif";
    els.fontSize.value      = 96;
    els.fontWeight.value    = 700;
    els.letterSpacing.value = 4;
    els.depth.value         = 8;
    els.blur.value          = 2;
    els.angle.value         = 135;
    els.strength.value      = 8;
    els.freq.value          = 20;
    els.hue.value           = 0;
    els.bg.value            = '#e4e7ec';
    els.color.value         = '#e4e7ec';
    els.hl.value            = '#ffffff';
    els.sh.value            = '#9aa3b2';
    els.matchBg.checked     = true;
    els.color.disabled      = true;
    els.colorWrap.style.opacity = .45;
    els.colorWrap.style.pointerEvents = 'none';
    mode = 'raised';
    document.querySelectorAll('#effectGrid button').forEach(b =>
      b.classList.toggle('active', b.dataset.mode === 'raised')
    );
    updateParamVisibility();
    update();
  });

  /* ============ 初始化 ============ */
  els.colorWrap.style.opacity = .45;
  els.colorWrap.style.pointerEvents = 'none';
  els.output.textContent = els.text.value;
  updateParamVisibility();
  update();
})();
</script>
</body>
</html>
