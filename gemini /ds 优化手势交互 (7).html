<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR 双手手势交互特效</title>
    
    <!-- 尝试多个 CDN 源 -->
    <script>
        // 动态加载 MediaPipe，尝试多个源
        (function loadMediaPipe() {
            const sources = [
                // 方案1: 官方 CDN (可能被墙)
                {
                    camera: 'https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js',
                    hands: 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js'
                },
                // 方案2: unpkg 镜像
                {
                    camera: 'https://unpkg.com/@mediapipe/camera_utils/camera_utils.js',
                    hands: 'https://unpkg.com/@mediapipe/hands/hands.js'
                },
                // 方案3: cdnjs
                {
                    camera: 'https://cdnjs.cloudflare.com/ajax/libs/mediapipe/0.8.1/camera_utils.js',
                    hands: 'https://cdnjs.cloudflare.com/ajax/libs/mediapipe/0.8.1/hands.js'
                },
                // 方案4: 国内镜像 (知乎)
                {
                    camera: 'https://unpkg.zhimg.com/@mediapipe/camera_utils@0.3/camera_utils.js',
                    hands: 'https://unpkg.zhimg.com/@mediapipe/hands@0.4/hands.js'
                }
            ];

            let currentIndex = 0;
            let loadTimer = null;

            function tryLoad() {
                if (currentIndex >= sources.length) {
                    console.error('所有 CDN 源加载失败');
                    document.dispatchEvent(new CustomEvent('mediapipe-load-failed'));
                    return;
                }

                const src = sources[currentIndex];
                console.log(`尝试加载 MediaPipe (${currentIndex + 1}/${sources.length}): ${src.camera}`);

                // 清除之前的脚本
                const oldScripts = document.querySelectorAll('script[data-mediapipe]');
                oldScripts.forEach(s => s.remove());

                let loadedCount = 0;
                let hasError = false;

                function onLoad() {
                    loadedCount++;
                    if (loadedCount === 2 && !hasError) {
                        clearTimeout(loadTimer);
                        console.log('✅ MediaPipe 加载成功！');
                        document.dispatchEvent(new CustomEvent('mediapipe-loaded'));
                    }
                }

                function onError() {
                    if (!hasError) {
                        hasError = true;
                        clearTimeout(loadTimer);
                        console.warn(`❌ 第 ${currentIndex + 1} 个源加载失败，尝试下一个...`);
                        currentIndex++;
                        // 移除可能部分加载的脚本
                        document.querySelectorAll('script[data-mediapipe]').forEach(s => s.remove());
                        tryLoad();
                    }
                }

                // 加载 camera_utils
                const script1 = document.createElement('script');
                script1.setAttribute('data-mediapipe', 'true');
                script1.src = src.camera;
                script1.crossOrigin = 'anonymous';
                script1.onload = onLoad;
                script1.onerror = onError;
                document.head.appendChild(script1);

                // 加载 hands
                const script2 = document.createElement('script');
                script2.setAttribute('data-mediapipe', 'true');
                script2.src = src.hands;
                script2.crossOrigin = 'anonymous';
                script2.onload = onLoad;
                script2.onerror = onError;
                document.head.appendChild(script2);

                // 超时检测（10秒）
                loadTimer = setTimeout(() => {
                    if (!hasError) {
                        hasError = true;
                        console.warn(`⏱️ 第 ${currentIndex + 1} 个源加载超时，尝试下一个...`);
                        document.querySelectorAll('script[data-mediapipe]').forEach(s => s.remove());
                        currentIndex++;
                        tryLoad();
                    }
                }, 10000);
            }

            // 开始尝试加载
            tryLoad();
        })();
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a0a0c;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #e2e8f0;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            display: none;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #control-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        #control-panel.minimized {
            opacity: 0.15;
        }
        #control-panel.minimized:hover, 
        #control-panel.minimized:active {
            opacity: 0.95;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            color: white;
        }
        .btn-primary:active {
            background: #3b82f6;
        }
        .btn-primary:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
        }
        .btn-secondary:active {
            background: rgba(255, 255, 255, 0.2);
        }
        .btn-secondary:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .slider-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 12px;
            color: #94a3b8;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            outline: none;
            accent-color: #3b82f6;
        }

        #status-toast {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            pointer-events: none;
            z-index: 100;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        #error-dialog {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 320px;
            background: rgba(30, 10, 10, 0.95);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            z-index: 200;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #error-dialog h4 {
            color: #f87171;
            margin-bottom: 8px;
        }

        #error-dialog p {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 16px;
        }

        #error-dialog button {
            flex: none;
            padding: 8px 30px;
        }

        /* 加载进度条 */
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 12, 0.92);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 300;
        }

        #loading-overlay.show {
            display: flex;
        }

        #loading-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #e2e8f0;
            letter-spacing: 1px;
        }

        #loading-progress-container {
            width: 80%;
            max-width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        #loading-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4f46e5, #3b82f6, #06b6d4);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        #loading-percent {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 12px;
        }

        #loading-detail {
            font-size: 12px;
            color: #64748b;
            margin-top: 6px;
            min-height: 18px;
        }

        #loading-retry {
            margin-top: 16px;
            padding: 4px 18px;
            background: rgba(239, 68, 68, 0.3);
            border: 1px solid rgba(239, 68, 68, 0.5);
            border-radius: 14px;
            color: #f87171;
            font-size: 12px;
            line-height: 1.4;
            cursor: pointer;
            display: none;
            transition: all 0.3s ease;
            height: 28px;
            flex: 0 0 auto;
            width: auto;
            min-width: 50px;
        }

        #loading-retry:hover {
            background: rgba(239, 68, 68, 0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -10px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
    </style>
</head>
<body>

    <div id="container">
        <video id="webcam" playsinline autoplay muted></video>
        <canvas id="output-canvas"></canvas>

        <!-- 加载进度条 -->
        <div id="loading-overlay">
            <div id="loading-title">🚀 加载 MediaPipe</div>
            <div id="loading-progress-container">
                <div id="loading-progress-bar"></div>
            </div>
            <div id="loading-percent">0%</div>
            <div id="loading-detail">准备加载...</div>
            <button id="loading-retry">重试</button>
        </div>

        <div id="control-panel">
            <div class="btn-group">
                <button class="btn-primary" id="btn-start" disabled>启动摄像头</button>
                <button class="btn-secondary" id="btn-demo">演示模式</button>
                <button class="btn-secondary" id="btn-reset">重置</button>
            </div>
            <div class="slider-container">
                <span>跟随平滑度</span>
                <input type="range" id="slider-smooth" min="0" max="95" value="65">
                <span id="smooth-val">0.65</span>
            </div>
        </div>

        <div id="status-toast">系统就绪</div>

        <div id="error-dialog">
            <h4 id="err-title">提示</h4>
            <p id="err-msg">错误信息</p>
            <button class="btn-secondary" onclick="closeError()">确定</button>
        </div>
    </div>

    <script>
        // ============================================================
        // 等待 MediaPipe 加载完成或失败
        // ============================================================
        let mediaPipeReady = false;
        let mediaPipeFailed = false;

        document.addEventListener('mediapipe-loaded', function() {
            mediaPipeReady = true;
            console.log('🎉 MediaPipe 已就绪');
            document.getElementById('btn-start').disabled = false;
            showToast('✅ MediaPipe 加载成功！', 2000);
            // 如果加载层显示着，隐藏它
            hideLoading();
        });

        document.addEventListener('mediapipe-load-failed', function() {
            mediaPipeFailed = true;
            console.log('❌ 所有 CDN 源加载失败');
            document.getElementById('btn-start').disabled = true;
            // 显示友好提示，让用户用演示模式
            showError('加载失败', 'MediaPipe 库加载失败，请检查网络连接。\n您可以点击「演示模式」体验效果。');
            hideLoading();
        });

        // ============================================================
        // 核心代码
        // ============================================================
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusToast = document.getElementById('status-toast');
        const errorDialog = document.getElementById('error-dialog');
        const controlPanel = document.getElementById('control-panel');
        const smoothSlider = document.getElementById('slider-smooth');
        const smoothValText = document.getElementById('smooth-val');

        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingBar = document.getElementById('loading-progress-bar');
        const loadingPercent = document.getElementById('loading-percent');
        const loadingDetail = document.getElementById('loading-detail');
        const loadingRetry = document.getElementById('loading-retry');

        const btnStart = document.getElementById('btn-start');
        const btnDemo = document.getElementById('btn-demo');

        let hands = null;
        let camera = null;
        let isDemoMode = false;
        let isCameraActive = false;
        let animationFrameId = null;
        let loadTimeout = null;
        let isLoading = false;

        let smoothFactor = 0.65;

        let prevPoints = {
            left: { 4: null, 8: null, 12: null, 20: null },
            right: { 4: null, 8: null, 12: null, 20: null }
        };

        smoothSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value) / 100;
            smoothFactor = val;
            smoothValText.textContent = val.toFixed(2);
        });

        btnStart.addEventListener('click', startRealCamera);
        btnDemo.addEventListener('click', startDemoMode);
        document.getElementById('btn-reset').addEventListener('click', resetAll);
        loadingRetry.addEventListener('click', function() {
            // 刷新页面重新加载
            window.location.reload();
        });

        function showToast(text, duration = 2000) {
            statusToast.innerText = text;
            statusToast.style.display = 'block';
            clearTimeout(statusToast._timer);
            statusToast._timer = setTimeout(() => { statusToast.style.display = 'none'; }, duration);
        }

        function showError(title, message) {
            document.getElementById('err-title').innerText = title;
            document.getElementById('err-msg').innerText = message;
            errorDialog.style.display = 'block';
        }

        function closeError() {
            errorDialog.style.display = 'none';
        }

        function resetAll() {
            isDemoMode = false;
            prevPoints = {
                left: { 4: null, 8: null, 12: null, 20: null },
                right: { 4: null, 8: null, 12: null, 20: null }
            };
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            controlPanel.classList.remove('minimized');
            showToast("已重置系统");
        }

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function updateProgress(percent, detail, showRetryBtn = false) {
            const clamped = Math.min(100, Math.max(0, percent));
            loadingBar.style.width = clamped + '%';
            loadingPercent.textContent = Math.round(clamped) + '%';
            if (detail) {
                loadingDetail.textContent = detail;
            }
            loadingRetry.style.display = showRetryBtn ? 'block' : 'none';
        }

        function hideLoading() {
            loadingOverlay.classList.remove('show');
            setTimeout(() => {
                loadingOverlay.style.display = 'none';
            }, 100);
        }

        function showLoading() {
            loadingOverlay.style.display = 'flex';
            loadingOverlay.classList.add('show');
        }

        function smoothPoint(handKey, fingerIndex, currentPoint) {
            const prev = prevPoints[handKey][fingerIndex];
            if (!prev) {
                prevPoints[handKey][fingerIndex] = { ...currentPoint };
                return currentPoint;
            }
            const smoothed = {
                x: smoothFactor * prev.x + (1 - smoothFactor) * currentPoint.x,
                y: smoothFactor * prev.y + (1 - smoothFactor) * currentPoint.y
            };
            prevPoints[handKey][fingerIndex] = smoothed;
            return smoothed;
        }

        function drawVisualEffects(landmarksLeft, landmarksRight) {
            const w = canvasElement.width;
            const h = canvasElement.height;

            const lp4  = smoothPoint('left',  4,  { x: landmarksLeft[4].x * w,  y: landmarksLeft[4].y * h });
            const lp8  = smoothPoint('left',  8,  { x: landmarksLeft[8].x * w,  y: landmarksLeft[8].y * h });
            const lp12 = smoothPoint('left',  12, { x: landmarksLeft[12].x * w, y: landmarksLeft[12].y * h });
            const lp20 = smoothPoint('left',  20, { x: landmarksLeft[20].x * w, y: landmarksLeft[20].y * h });

            const rp4  = smoothPoint('right', 4,  { x: landmarksRight[4].x * w,  y: landmarksRight[4].y * h });
            const rp8  = smoothPoint('right', 8,  { x: landmarksRight[8].x * w,  y: landmarksRight[8].y * h });
            const rp12 = smoothPoint('right', 12, { x: landmarksRight[12].x * w, y: landmarksRight[12].y * h });
            const rp20 = smoothPoint('right', 20, { x: landmarksRight[20].x * w, y: landmarksRight[20].y * h });

            renderQuad(lp4, rp4, rp8, lp8, 'red');
            renderQuad(lp8, rp8, rp12, lp12, 'blue');
            renderQuad(lp12, rp12, rp20, lp20, 'green');
        }

        function renderQuad(p1, p2, p3, p4, styleType) {
            canvasCtx.save();
            
            canvasCtx.beginPath();
            canvasCtx.moveTo(p1.x, p1.y);
            canvasCtx.lineTo(p2.x, p2.y);
            canvasCtx.lineTo(p3.x, p3.y);
            canvasCtx.lineTo(p4.x, p4.y);
            canvasCtx.closePath();
            canvasCtx.clip();

            canvasCtx.save();
            canvasCtx.scale(-1, 1);
            canvasCtx.translate(-canvasElement.width, 0);
            canvasCtx.drawImage(canvasElement, 0, 0);
            canvasCtx.restore();

            if (styleType === 'red') {
                canvasCtx.fillStyle = 'rgba(215, 38, 56, 0.4)';
                canvasCtx.globalCompositeOperation = 'color';
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

                canvasCtx.globalCompositeOperation = 'multiply';
                canvasCtx.fillStyle = 'rgba(255, 253, 240, 0.15)';
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

                canvasCtx.globalCompositeOperation = 'overlay';
                drawHalftoneLines('#111111', 5);

            } else if (styleType === 'blue') {
                canvasCtx.fillStyle = 'rgba(15, 76, 129, 0.45)';
                canvasCtx.globalCompositeOperation = 'color';
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

                canvasCtx.globalCompositeOperation = 'screen';
                canvasCtx.fillStyle = 'rgba(120, 220, 255, 0.15)';
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

                canvasCtx.globalCompositeOperation = 'overlay';
                drawScanlines('rgba(255,255,255,0.08)', 4);

            } else if (styleType === 'green') {
                canvasCtx.fillStyle = 'rgba(40, 95, 70, 0.5)';
                canvasCtx.globalCompositeOperation = 'color';
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

                canvasCtx.globalCompositeOperation = 'multiply';
                canvasCtx.fillStyle = 'rgba(240, 240, 220, 0.2)';
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

                canvasCtx.globalCompositeOperation = 'source-over';
                canvasCtx.lineWidth = 2;
                canvasCtx.strokeStyle = 'rgba(144, 238, 144, 0.4)';
                canvasCtx.stroke();
            }

            canvasCtx.restore();

            canvasCtx.save();
            canvasCtx.beginPath();
            canvasCtx.moveTo(p1.x, p1.y);
            canvasCtx.lineTo(p2.x, p2.y);
            canvasCtx.lineTo(p3.x, p3.y);
            canvasCtx.lineTo(p4.x, p4.y);
            canvasCtx.closePath();
            
            let color = 'rgba(255,255,255,0.5)';
            if (styleType === 'red') color = 'rgba(239, 68, 68, 0.8)';
            if (styleType === 'blue') color = 'rgba(59, 130, 246, 0.8)';
            if (styleType === 'green') color = 'rgba(34, 197, 94, 0.8)';
            
            canvasCtx.strokeStyle = color;
            canvasCtx.shadowBlur = 10;
            canvasCtx.shadowColor = color;
            canvasCtx.lineWidth = 1.5;
            canvasCtx.stroke();
            canvasCtx.restore();
        }

        function drawHalftoneLines(color, spacing) {
            canvasCtx.strokeStyle = color;
            canvasCtx.lineWidth = 0.5;
            for (let i = 0; i < canvasElement.width + canvasElement.height; i += spacing) {
                canvasCtx.beginPath();
                canvasCtx.moveTo(i, 0);
                canvasCtx.lineTo(0, i);
                canvasCtx.stroke();
            }
        }

        function drawScanlines(color, spacing) {
            canvasCtx.strokeStyle = color;
            canvasCtx.lineWidth = 1;
            for (let y = 0; y < canvasElement.height; y += spacing) {
                canvasCtx.beginPath();
                canvasCtx.moveTo(0, y);
                canvasCtx.lineTo(canvasElement.width, y);
                canvasCtx.stroke();
            }
        }

        function initMediaPipe() {
            if (!mediaPipeReady) {
                updateProgress(0, '⏳ 等待库加载...', false);
                // 等待 mediapipe 加载
                const waitForLoad = setInterval(() => {
                    if (mediaPipeReady) {
                        clearInterval(waitForLoad);
                        initMediaPipe();
                    } else if (mediaPipeFailed) {
                        clearInterval(waitForLoad);
                        updateProgress(0, '❌ 库加载失败，点击重试', true);
                    }
                }, 1000);
                return;
            }

            if (hands || isLoading) return;
            isLoading = true;

            updateProgress(5, '初始化 MediaPipe...');

            try {
                hands = new Hands({
                    locateFile: (file) => {
                        console.log(`[MediaPipe] 加载: ${file}`);
                        if (file.includes('wasm')) {
                            updateProgress(30, '加载 WASM...');
                        } else if (file.includes('model')) {
                            updateProgress(60, '加载模型...');
                        } else if (file.includes('solution')) {
                            updateProgress(80, '加载方案...');
                        }
                        // 使用 jsdelivr 加载模型文件
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                    }
                });

                hands.setOptions({
                    maxNumHands: 2,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                let isLoaded = false;
                
                hands.onResults((results) => {
                    if (!isLoaded) {
                        isLoaded = true;
                        isLoading = false;
                        if (loadTimeout) {
                            clearTimeout(loadTimeout);
                            loadTimeout = null;
                        }
                        updateProgress(100, '✅ 完成！');
                        setTimeout(hideLoading, 500);
                        showToast('模型加载成功！', 1500);
                        btnStart.disabled = false;
                    }
                    onHandResults(results);
                });

                hands.onError = (error) => {
                    console.error('MediaPipe 错误:', error);
                    isLoading = false;
                    if (loadTimeout) {
                        clearTimeout(loadTimeout);
                        loadTimeout = null;
                    }
                    updateProgress(0, '❌ 加载失败，点击重试', true);
                    showToast('加载失败，请点击重试', 3000);
                };

                loadTimeout = setTimeout(() => {
                    if (!isLoaded) {
                        isLoading = false;
                        console.warn('MediaPipe 加载超时');
                        updateProgress(0, '⏱️ 加载超时，点击重试', true);
                        showToast('加载超时，请点击重试', 3000);
                    }
                }, 25000);

            } catch (error) {
                console.error('初始化失败:', error);
                isLoading = false;
                updateProgress(0, '❌ 初始化失败，点击重试', true);
                showToast('初始化失败，请点击重试', 3000);
            }
        }

        function onHandResults(results) {
            if (isDemoMode) return;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.restore();

            if (results.multiHandLandmarks && results.multiHandLandmarks.length >= 2) {
                const sortedHands = [...results.multiHandLandmarks].sort((a, b) => a[0].x - b[0].x);
                const leftHand = sortedHands[0];
                const rightHand = sortedHands[1];
                drawVisualEffects(leftHand, rightHand);
            } else if (results.multiHandLandmarks && results.multiHandLandmarks.length === 1) {
                canvasCtx.save();
                canvasCtx.fillStyle = 'rgba(239, 68, 68, 0.8)';
                canvasCtx.font = 'bold 16px sans-serif';
                canvasCtx.textAlign = 'center';
                canvasCtx.scale(-1, 1);
                canvasCtx.fillText("检测到单手，请伸出双手", -canvasElement.width / 2, 50);
                canvasCtx.restore();
            }
        }

        function startRealCamera() {
            if (!mediaPipeReady) {
                showError('库未就绪', 'MediaPipe 还在加载中，请稍候再试。');
                return;
            }

            isDemoMode = false;
            
            if (!hands || isLoading) {
                showLoading();
                updateProgress(0, '初始化摄像头...');
                initMediaPipe();
                const checkReady = setInterval(() => {
                    if (hands && !isLoading) {
                        clearInterval(checkReady);
                        startCameraStream();
                    }
                }, 500);
                setTimeout(() => {
                    clearInterval(checkReady);
                }, 30000);
                return;
            }
            
            showLoading();
            updateProgress(90, '准备摄像头...');
            startCameraStream();
        }

        function startCameraStream() {
            updateProgress(10, '请求权限...');
            
            const constraints = {
                video: {
                    facingMode: "user",
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };

            navigator.mediaDevices.getUserMedia(constraints)
            .then((stream) => {
                updateProgress(20, '摄像头已连接...');
                videoElement.srcObject = stream;
                isCameraActive = true;
                
                camera = new Camera(videoElement, {
                    onFrame: async () => {
                        if (!isDemoMode && isCameraActive && hands) {
                            await hands.send({ image: videoElement });
                        }
                    },
                    width: 1280,
                    height: 720
                });
                
                camera.start()
                .then(() => {
                    updateProgress(100, '✅ 启动成功！');
                    setTimeout(hideLoading, 400);
                    showToast("摄像头启动成功");
                    controlPanel.classList.add('minimized');
                })
                .catch(err => {
                    hideLoading();
                    showError("摄像头异常", "无法连接硬件。");
                });
            })
            .catch((err) => {
                hideLoading();
                if (err.name === 'NotAllowedError') {
                    showError("权限拒绝", "请允许摄像头权限。");
                } else if (err.name === 'NotFoundError') {
                    showError("硬件未找到", "没有检测到摄像头。");
                } else {
                    showError("启动失败", err.message);
                }
            });
        }

        let demoTick = 0;
        function startDemoMode() {
            isDemoMode = true;
            if (videoElement.srcObject) {
                videoElement.srcObject.getTracks().forEach(track => track.stop());
            }
            isCameraActive = false;
            controlPanel.classList.remove('minimized');
            
            // 如果库还没加载好，直接进入演示（不需要库也能演示）
            hideLoading();
            
            showToast("进入演示模式", 2000);

            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            function loopDemo() {
                if (!isDemoMode) return;

                demoTick += 0.02;
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

                canvasCtx.fillStyle = '#0f0f15';
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
                drawScanlines('rgba(255,255,255,0.03)', 10);

                const cx = canvasElement.width / 2;
                const cy = canvasElement.height / 2;
                const baseSpan = Math.min(canvasElement.width, canvasElement.height) * 0.35;

                const breathX = Math.sin(demoTick) * 20;
                const breathY = Math.cos(demoTick * 1.5) * 15;

                const leftHandDemo = {
                    4:  { x: (cx - baseSpan - breathX) / canvasElement.width, y: (cy - 100 + breathY) / canvasElement.height },
                    8:  { x: (cx - baseSpan + 20 - breathX) / canvasElement.width, y: (cy - 30 + Math.sin(demoTick * 2) * 20) / canvasElement.height },
                    12: { x: (cx - baseSpan + 10 - breathX) / canvasElement.width, y: (cy + 40 + Math.cos(demoTick * 2.3) * 15) / canvasElement.height },
                    20: { x: (cx - baseSpan - 30 - breathX) / canvasElement.width, y: (cy + 110 + breathY) / canvasElement.height }
                };

                const rightHandDemo = {
                    4:  { x: (cx + baseSpan + breathX) / canvasElement.width, y: (cy - 120 - breathY) / canvasElement.height },
                    8:  { x: (cx + baseSpan - 20 + breathX) / canvasElement.width, y: (cy - 20 + Math.cos(demoTick * 1.8) * 25) / canvasElement.height },
                    12: { x: (cx + baseSpan - 10 + breathX) / canvasElement.width, y: (cy + 50 + Math.sin(demoTick * 2.1) * 20) / canvasElement.height },
                    20: { x: (cx + baseSpan + 40 + breathX) / canvasElement.width, y: (cy + 130 - breathY) / canvasElement.height }
                };

                drawVisualEffects(leftHandDemo, rightHandDemo);
                drawDemoSkeleton(leftHandDemo, rightHandDemo);

                animationFrameId = requestAnimationFrame(loopDemo);
            }
            loopDemo();
        }

        function drawDemoSkeleton(lh, rh) {
            canvasCtx.fillStyle = 'rgba(255,255,255,0.7)';
            const w = canvasElement.width;
            const h = canvasElement.height;
            [lh, rh].forEach(hand => {
                [4, 8, 12, 20].forEach(idx => {
                    canvasCtx.beginPath();
                    canvasCtx.arc(hand[idx].x * w, hand[idx].y * h, 6, 0, Math.PI * 2);
                    canvasCtx.fill();
                });
            });
        }

        // ============================================================
        // 页面加载完成
        // ============================================================
        console.log('📱 页面已加载，等待 MediaPipe 加载...');
        showToast('正在加载 MediaPipe...', 3000);

        // 如果 15 秒后还没加载成功，提示用户
        setTimeout(() => {
            if (!mediaPipeReady && !mediaPipeFailed) {
                showToast('⏳ 加载中，请稍候...', 2000);
            }
        }, 15000);
    </script>
</body>
</html>
