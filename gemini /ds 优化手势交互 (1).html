<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR 双手手势交互特效</title>
    
    <!-- 引入 MediaPipe 依赖 - 使用国内镜像加速 -->
    <script src="https://unpkg.zhimg.com/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.zhimg.com/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a0a0c;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #e2e8f0;
        }

        /* 全屏画布与视频 */
        #container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            display: none; /* 隐藏原始视频，全部由 Canvas 渲染 */
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* 镜像画面 */
        }

        /* 极简控制面板 */
        #control-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        /* 隐藏或弱化控制面板 */
        #control-panel.minimized {
            opacity: 0.15;
        }
        #control-panel.minimized:hover, 
        #control-panel.minimized:active {
            opacity: 0.95;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            color: white;
        }
        .btn-primary:active {
            background: #3b82f6;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
        }
        .btn-secondary:active {
            background: rgba(255, 255, 255, 0.2);
        }

        /* 滑动条样式 */
        .slider-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 12px;
            color: #94a3b8;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            outline: none;
            accent-color: #3b82f6;
        }

        /* 状态提示与错误弹窗 */
        #status-toast {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            pointer-events: none;
            z-index: 100;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        #error-dialog {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 320px;
            background: rgba(30, 10, 10, 0.95);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            z-index: 200;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #error-dialog h4 {
            color: #f87171;
            margin-bottom: 8px;
        }

        #error-dialog p {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 16px;
        }

        /* ===== 新增：加载进度条样式 ===== */
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 12, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 300;
            transition: opacity 0.8s ease;
        }

        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #e2e8f0;
            letter-spacing: 1px;
        }

        #loading-progress-container {
            width: 80%;
            max-width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        #loading-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4f46e5, #3b82f6, #06b6d4);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        #loading-percent {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 12px;
            font-variant-numeric: tabular-nums;
        }

        #loading-detail {
            font-size: 12px;
            color: #64748b;
            margin-top: 6px;
            min-height: 18px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -10px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
    </style>
</head>
<body>

    <div id="container">
        <!-- 用于流输入的隐藏 Video -->
        <video id="webcam" playsinline autoplay muted></video>
        <!-- 主渲染 Canvas -->
        <canvas id="output-canvas"></canvas>

        <!-- ===== 新增：加载进度条 ===== -->
        <div id="loading-overlay">
            <div id="loading-title">🚀 加载 MediaPipe 模型</div>
            <div id="loading-progress-container">
                <div id="loading-progress-bar"></div>
            </div>
            <div id="loading-percent">0%</div>
            <div id="loading-detail">正在初始化...</div>
        </div>

        <!-- 极简控制面板 -->
        <div id="control-panel">
            <div class="btn-group">
                <button class="btn-primary" id="btn-start">启动摄像头</button>
                <button class="btn-secondary" id="btn-demo">演示模式</button>
                <button class="btn-secondary" id="btn-reset">重置</button>
            </div>
            <div class="slider-container">
                <span>跟随平滑度</span>
                <input type="range" id="slider-smooth" min="0" max="95" value="65">
                <span id="smooth-val">0.65</span>
            </div>
        </div>

        <!-- 浮动提示 -->
        <div id="status-toast">系统就绪</div>

        <!-- 错误弹窗 -->
        <div id="error-dialog">
            <h4 id="err-title">提示</h4>
            <p id="err-msg">错误信息</p>
            <button class="btn-secondary" onclick="closeError()">确定</button>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusToast = document.getElementById('status-toast');
        const errorDialog = document.getElementById('error-dialog');
        const controlPanel = document.getElementById('control-panel');
        const smoothSlider = document.getElementById('slider-smooth');
        const smoothValText = document.getElementById('smooth-val');

        // ===== 新增：加载进度条元素 =====
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingBar = document.getElementById('loading-progress-bar');
        const loadingPercent = document.getElementById('loading-percent');
        const loadingDetail = document.getElementById('loading-detail');

        let hands = null;
        let camera = null;
        let isDemoMode = false;
        let isCameraActive = false;
        let animationFrameId = null;

        // 平滑系数 (0为不平滑，接近100为极度平滑延迟大)
        let smoothFactor = 0.65; 

        // 缓存平滑后的指尖坐标 
        // 关键点索引: 拇指(4), 食指(8), 中指(12), 小指(20)
        let prevPoints = {
            left: { 4: null, 8: null, 12: null, 20: null },
            right: { 4: null, 8: null, 12: null, 20: null }
        };

        // --- 初始化 UI 绑定 ---
        smoothSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value) / 100;
            smoothFactor = val;
            smoothValText.textContent = val.toFixed(2);
        });

        document.getElementById('btn-start').addEventListener('click', startRealCamera);
        document.getElementById('btn-demo').addEventListener('click', startDemoMode);
        document.getElementById('btn-reset').addEventListener('click', resetAll);

        // --- 核心工具函数 ---
        function showToast(text, duration = 2000) {
            statusToast.innerText = text;
            statusToast.style.display = 'block';
            setTimeout(() => { statusToast.style.display = 'none'; }, duration);
        }

        function showError(title, message) {
            document.getElementById('err-title').innerText = title;
            document.getElementById('err-msg').innerText = message;
            errorDialog.style.style = 'block';
            errorDialog.style.display = 'block';
        }

        function closeError() {
            errorDialog.style.display = 'none';
        }

        function resetAll() {
            isDemoMode = false;
            prevPoints = {
                left: { 4: null, 8: null, 12: null, 20: null },
                right: { 4: null, 8: null, 12: null, 20: null }
            };
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            controlPanel.classList.remove('minimized');
            showToast("已重置系统");
        }

        // 窗口尺寸自适应
        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ===== 新增：更新进度条函数 =====
        function updateProgress(percent, detail) {
            const clamped = Math.min(100, Math.max(0, percent));
            loadingBar.style.width = clamped + '%';
            loadingPercent.textContent = Math.round(clamped) + '%';
            if (detail) {
                loadingDetail.textContent = detail;
            }
        }

        function hideLoading() {
            loadingOverlay.classList.add('hidden');
            // 等待淡出动画完成后彻底隐藏
            setTimeout(() => {
                loadingOverlay.style.display = 'none';
            }, 800);
        }

        // --- 1. 指数平滑算法 ---
        function smoothPoint(handKey, fingerIndex, currentPoint) {
            const prev = prevPoints[handKey][fingerIndex];
            if (!prev) {
                prevPoints[handKey][fingerIndex] = { ...currentPoint };
                return currentPoint;
            }
            // 经典指数平滑公式: S = a * S_prev + (1 - a) * X_curr
            const smoothed = {
                x: smoothFactor * prev.x + (1 - smoothFactor) * currentPoint.x,
                y: smoothFactor * prev.y + (1 - smoothFactor) * currentPoint.y
            };
            prevPoints[handKey][fingerIndex] = smoothed;
            return smoothed;
        }

        // --- 2. 核心滤镜渲染管道 ---
        function drawVisualEffects(landmarksLeft, landmarksRight) {
            // 获取画布物理尺寸
            const w = canvasElement.width;
            const h = canvasElement.height;

            // 获取指尖在画布上的具体位置并进行平滑
            const lp4  = smoothPoint('left',  4,  { x: landmarksLeft[4].x * w,  y: landmarksLeft[4].y * h });
            const lp8  = smoothPoint('left',  8,  { x: landmarksLeft[8].x * w,  y: landmarksLeft[8].y * h });
            const lp12 = smoothPoint('left',  12, { x: landmarksLeft[12].x * w, y: landmarksLeft[12].y * h });
            const lp20 = smoothPoint('left',  20, { x: landmarksLeft[20].x * w, y: landmarksLeft[20].y * h });

            const rp4  = smoothPoint('right', 4,  { x: landmarksRight[4].x * w,  y: landmarksRight[4].y * h });
            const rp8  = smoothPoint('right', 8,  { x: landmarksRight[8].x * w,  y: landmarksRight[8].y * h });
            const rp12 = smoothPoint('right', 12, { x: landmarksRight[12].x * w, y: landmarksRight[12].y * h });
            const rp20 = smoothPoint('right', 20, { x: landmarksRight[20].x * w, y: landmarksRight[20].y * h });

            // 【红色面片】：拇指 4 与 食指 8 围成的区域
            renderQuad(lp4, rp4, rp8, lp8, 'red');

            // 【蓝色面片】：食指 8 与 中指 12 围成的区域
            renderQuad(lp8, rp8, rp12, lp12, 'blue');

            // 【绿色面片】：中指 12 与 小指 20 围成的区域
            renderQuad(lp12, rp12, rp20, lp20, 'green');
        }

        // 绘制单个滤镜面片
        function renderQuad(p1, p2, p3, p4, styleType) {
            canvasCtx.save();
            
            // 1. 建立四边形裁剪区域
            canvasCtx.beginPath();
            canvasCtx.moveTo(p1.x, p1.y);
            canvasCtx.lineTo(p2.x, p2.y);
            canvasCtx.lineTo(p3.x, p3.y);
            canvasCtx.lineTo(p4.x, p4.y);
            canvasCtx.closePath();
            canvasCtx.clip();

            // 2. 提取并绘制当前裁剪区域的底层影像（制造滤镜透视质感）
            // 在画布镜像的情况下，我们需要正确把画布图像二次投射回裁切区
            canvasCtx.save();
            canvasCtx.scale(-1, 1);
            canvasCtx.translate(-canvasElement.width, 0);
            canvasCtx.drawImage(canvasElement, 0, 0);
            canvasCtx.restore();

            // 3. 应用特调艺术滤镜效果
            if (styleType === 'red') {
                // 红色复古半调网点效果
                canvasCtx.fillStyle = 'rgba(215, 38, 56, 0.4)'; // 复古红
                canvasCtx.globalCompositeOperation = 'color';
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

                canvasCtx.globalCompositeOperation = 'multiply';
                canvasCtx.fillStyle = 'rgba(255, 253, 240, 0.15)'; // 米白底纸感
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

                // 绘制半调模拟网格线（极轻微）
                canvasCtx.globalCompositeOperation = 'overlay';
                drawHalftoneLines('#111111', 5);

            } else if (styleType === 'blue') {
                // 蓝色冷调、低饱和、重影双色调效果
                canvasCtx.fillStyle = 'rgba(15, 76, 129, 0.45)'; // 经典蓝
                canvasCtx.globalCompositeOperation = 'color';
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

                canvasCtx.globalCompositeOperation = 'screen';
                canvasCtx.fillStyle = 'rgba(120, 220, 255, 0.15)'; // 灰白冷光
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

                // 轻微行扫描线（旧电视机效果）
                canvasCtx.globalCompositeOperation = 'overlay';
                drawScanlines('rgba(255,255,255,0.08)', 4);

            } else if (styleType === 'green') {
                // 墨绿、灰绿和米白复古伪彩（带错位重影质感）
                canvasCtx.fillStyle = 'rgba(40, 95, 70, 0.5)'; // 墨绿
                canvasCtx.globalCompositeOperation = 'color';
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

                canvasCtx.globalCompositeOperation = 'multiply';
                canvasCtx.fillStyle = 'rgba(240, 240, 220, 0.2)'; // 怀旧米黄色
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

                // 模拟丝网印刷的轻微色彩错位溢出
                canvasCtx.globalCompositeOperation = 'source-over';
                canvasCtx.lineWidth = 2;
                canvasCtx.strokeStyle = 'rgba(144, 238, 144, 0.4)';
                canvasCtx.stroke();
            }

            canvasCtx.restore();

            // 绘制面片的优雅边界发光线
            canvasCtx.save();
            canvasCtx.beginPath();
            canvasCtx.moveTo(p1.x, p1.y);
            canvasCtx.lineTo(p2.x, p2.y);
            canvasCtx.lineTo(p3.x, p3.y);
            canvasCtx.lineTo(p4.x, p4.y);
            canvasCtx.closePath();
            
            let color = 'rgba(255,255,255,0.5)';
            if (styleType === 'red') color = 'rgba(239, 68, 68, 0.8)';
            if (styleType === 'blue') color = 'rgba(59, 130, 246, 0.8)';
            if (styleType === 'green') color = 'rgba(34, 197, 94, 0.8)';
            
            canvasCtx.strokeStyle = color;
            canvasCtx.shadowBlur = 10;
            canvasCtx.shadowColor = color;
            canvasCtx.lineWidth = 1.5;
            canvasCtx.stroke();
            canvasCtx.restore();
        }

        // 辅助绘制半调纹理
        function drawHalftoneLines(color, spacing) {
            canvasCtx.strokeStyle = color;
            canvasCtx.lineWidth = 0.5;
            for (let i = 0; i < canvasElement.width + canvasElement.height; i += spacing) {
                canvasCtx.beginPath();
                canvasCtx.moveTo(i, 0);
                canvasCtx.lineTo(0, i);
                canvasCtx.stroke();
            }
        }

        // 辅助绘制旧电视扫描线
        function drawScanlines(color, spacing) {
            canvasCtx.strokeStyle = color;
            canvasCtx.lineWidth = 1;
            for (let y = 0; y < canvasElement.height; y += spacing) {
                canvasCtx.beginPath();
                canvasCtx.moveTo(0, y);
                canvasCtx.lineTo(canvasElement.width, y);
                canvasCtx.stroke();
            }
        }


        // --- 3. 初始化 MediaPipe Hands ---
        function initMediaPipe() {
            if (hands) return Promise.resolve();

            updateProgress(5, '正在加载 MediaPipe 核心库...');
            showToast("正在加载 MediaPipe 模型...", 3000);

            // 模拟进度：由于无法精确跟踪模型下载进度，使用分段模拟
            let progress = 5;
            const progressInterval = setInterval(() => {
                if (progress < 90) {
                    progress += Math.random() * 3 + 1;
                    if (progress > 90) progress = 90;
                    updateProgress(progress, '正在下载模型文件...');
                }
            }, 500);

            hands = new Hands({
                locateFile: (file) => {
                    // 使用国内镜像加速
                    console.log(`[MediaPipe] 加载: ${file}`);
                    // 当加载具体模型文件时更新进度
                    if (file.includes('model')) {
                        updateProgress(70, '正在加载手部识别模型...');
                    }
                    if (file.includes('wasm')) {
                        updateProgress(50, '正在加载 WASM 运行时...');
                    }
                    return `https://unpkg.zhimg.com/@mediapipe/hands@0.4/${file}`;
                }
            });

            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults((results) => {
                // 加载完成后隐藏进度条
                if (!loadingOverlay.classList.contains('hidden')) {
                    clearInterval(progressInterval);
                    updateProgress(100, '✅ 模型加载完成！');
                    setTimeout(() => {
                        hideLoading();
                    }, 500);
                }
                onHandResults(results);
            });

            // 添加错误处理
            hands.onError = (error) => {
                clearInterval(progressInterval);
                console.error('MediaPipe 错误:', error);
                updateProgress(100, '❌ 加载失败');
                setTimeout(() => {
                    hideLoading();
                    showError("模型加载失败", "请检查网络连接后刷新重试。如持续失败，可点击「演示模式」体验。");
                }, 1000);
            };

            return Promise.resolve();
        }

        // 核心检测回调
        function onHandResults(results) {
            if (isDemoMode) return;

            // 清空并绘制底层摄像头原始画面（已镜像）
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.restore();

            // 双手检测
            if (results.multiHandLandmarks && results.multiHandLandmarks.length >= 2) {
                // 1. 严格按照屏幕实际 X 坐标排序双手，确保左侧的一定是"左手模型数据"，右侧为"右手模型数据"
                const sortedHands = [...results.multiHandLandmarks].sort((a, b) => a[0].x - b[0].x);
                const leftHand = sortedHands[0];
                const rightHand = sortedHands[1];

                // 2. 渲染特效
                drawVisualEffects(leftHand, rightHand);
            } else if (results.multiHandLandmarks && results.multiHandLandmarks.length === 1) {
                // 单手警示
                canvasCtx.save();
                canvasCtx.fillStyle = 'rgba(239, 68, 68, 0.8)';
                canvasCtx.font = 'bold 16px sans-serif';
                canvasCtx.textAlign = 'center';
                // 考虑到画布镜面对齐文字
                canvasCtx.scale(-1, 1);
                canvasCtx.fillText("检测到单手，请伸出双手开启 AR 特效", -canvasElement.width / 2, 50);
                canvasCtx.restore();
            }
        }

        // --- 4. 摄像头硬件控制与异常处理 ---
        function startRealCamera() {
            isDemoMode = false;
            
            // 如果加载层已隐藏，重新显示
            if (loadingOverlay.style.display === 'none') {
                loadingOverlay.style.display = 'flex';
                loadingOverlay.classList.remove('hidden');
            }
            updateProgress(0, '正在初始化摄像头...');

            initMediaPipe().then(() => {
                updateProgress(10, '正在请求摄像头授权...');
                showToast("正在请求摄像头授权...");
                
                // 优化移动端前置摄像头选择
                const constraints = {
                    video: {
                        facingMode: "user",
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };

                navigator.mediaDevices.getUserMedia(constraints)
                .then((stream) => {
                    updateProgress(20, '摄像头已连接，正在启动...');
                    videoElement.srcObject = stream;
                    isCameraActive = true;
                    
                    camera = new Camera(videoElement, {
                        onFrame: async () => {
                            if (!isDemoMode && isCameraActive) {
                                await hands.send({ image: videoElement });
                            }
                        },
                        width: 1280,
                        height: 720
                    });
                    
                    camera.start()
                    .then(() => {
                        updateProgress(100, '✅ 启动成功！');
                        setTimeout(() => {
                            hideLoading();
                        }, 500);
                        showToast("摄像头启动成功");
                        // 启动成功，弱化控制面板
                        controlPanel.classList.add('minimized');
                    })
                    .catch(err => {
                        hideLoading();
                        showError("摄像头异常", "无法连接硬件，摄像头可能已被其他应用占用。");
                    });
                })
                .catch((err) => {
                    hideLoading();
                    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                        showError("权限拒绝", "请在浏览器设置中允许此网页访问您的麦克风与摄像头权限。");
                    } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                        showError("硬件未找到", "没有在当前设备上检测到可用的摄像头。");
                    } else {
                        showError("启动失败", `无法访问摄像头: ${err.message}`);
                    }
                });
            }).catch(e => {
                hideLoading();
                showError("初始化失败", "MediaPipe 模型库下载超时，请检查您的移动网络状态。");
            });
        }

        // --- 5. 完全本地模拟的演示模式 (无需摄像头) ---
        let demoTick = 0;
        function startDemoMode() {
            // 停止真实摄像头流
            isDemoMode = true;
            if (videoElement.srcObject) {
                videoElement.srcObject.getTracks().forEach(track => track.stop());
            }
            isCameraActive = false;
            controlPanel.classList.remove('minimized');
            
            // 隐藏加载层
            hideLoading();
            showToast("进入演示模式 (动态数学曲线模拟)", 3000);

            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            function loopDemo() {
                if (!isDemoMode) return;

                demoTick += 0.02;
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

                // 绘制极具科技感的深色科幻背景线条作为测试参照
                canvasCtx.fillStyle = '#0f0f15';
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
                drawScanlines('rgba(255,255,255,0.03)', 10);

                const cx = canvasElement.width / 2;
                const cy = canvasElement.height / 2;
                const baseSpan = Math.min(canvasElement.width, canvasElement.height) * 0.35;

                // 呼吸式浮动和旋转，模拟双手抓取拉伸的自然抖动轨迹
                const breathX = Math.sin(demoTick) * 20;
                const breathY = Math.cos(demoTick * 1.5) * 15;

                // 构建虚拟左手关键点
                const leftHandDemo = {
                    4:  { x: (cx - baseSpan - breathX) / canvasElement.width, y: (cy - 100 + breathY) / canvasElement.height },
                    8:  { x: (cx - baseSpan + 20 - breathX) / canvasElement.width, y: (cy - 30 + Math.sin(demoTick * 2) * 20) / canvasElement.height },
                    12: { x: (cx - baseSpan + 10 - breathX) / canvasElement.width, y: (cy + 40 + Math.cos(demoTick * 2.3) * 15) / canvasElement.height },
                    20: { x: (cx - baseSpan - 30 - breathX) / canvasElement.width, y: (cy + 110 + breathY) / canvasElement.height }
                };

                // 构建虚拟右手关键点
                const rightHandDemo = {
                    4:  { x: (cx + baseSpan + breathX) / canvasElement.width, y: (cy - 120 - breathY) / canvasElement.height },
                    8:  { x: (cx + baseSpan - 20 + breathX) / canvasElement.width, y: (cy - 20 + Math.cos(demoTick * 1.8) * 25) / canvasElement.height },
                    12: { x: (cx + baseSpan - 10 + breathX) / canvasElement.width, y: (cy + 50 + Math.sin(demoTick * 2.1) * 20) / canvasElement.height },
                    20: { x: (cx + baseSpan + 40 + breathX) / canvasElement.width, y: (cy + 130 - breathY) / canvasElement.height }
                };

                // 核心渲染
                drawVisualEffects(leftHandDemo, rightHandDemo);

                // 绘制虚拟骨架提示
                drawDemoSkeleton(leftHandDemo, rightHandDemo);

                animationFrameId = requestAnimationFrame(loopDemo);
            }
            loopDemo();
        }

        // 仅在演示模式中绘制淡色指尖锚点，方便调试
        function drawDemoSkeleton(lh, rh) {
            canvasCtx.fillStyle = 'rgba(255,255,255,0.7)';
            const w = canvasElement.width;
            const h = canvasElement.height;
            [lh, rh].forEach(hand => {
                [4, 8, 12, 20].forEach(idx => {
                    canvasCtx.beginPath();
                    canvasCtx.arc(hand[idx].x * w, hand[idx].y * h, 6, 0, Math.PI * 2);
                    canvasCtx.fill();
                });
            });
        }

        // ===== 页面加载时自动初始化并显示进度 =====
        window.addEventListener('load', () => {
            // 显示加载层，准备初始化
            updateProgress(0, '准备加载 MediaPipe...');
            // 预加载 MediaPipe（但不启动摄像头）
            initMediaPipe().then(() => {
                // 模型已预加载，但保留加载层，等用户点击启动时再隐藏
                updateProgress(100, '✅ 模型就绪，点击"启动摄像头"开始');
                // 3秒后自动隐藏加载层
                setTimeout(() => {
                    hideLoading();
                }, 2000);
            });
        });
    </script>
</body>
</html>
