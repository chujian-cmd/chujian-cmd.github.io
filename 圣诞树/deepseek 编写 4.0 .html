<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>by 初见.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            overflow: hidden;
            background: #080a08;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            touch-action: none;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(212, 175, 55, 0.85);
            font-size: 13px;
            letter-spacing: 2px;
            text-shadow: 0 0 20px #000;
            z-index: 20;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 22px;
            border-radius: 40px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            font-weight: 300;
            white-space: nowrap;
        }
        #upload-ui {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 30;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end;
        }
        .glass-btn {
            background: rgba(20, 20, 22, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #f0e2b0;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            font-weight: 400;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            user-select: none;
        }
        .glass-btn:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: #d4af37;
            color: #fff;
        }
        .glass-btn input[type="file"] {
            display: none;
        }
        #webcam-container {
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 160px;
            height: 120px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            z-index: 25;
            background: #0a0c0a;
            opacity: 0.85;
            transition: opacity 0.3s;
        }
        #webcam-container:hover {
            opacity: 1;
        }
        #webcam-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            display: block;
        }
        #status-dot {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #550000;
            box-shadow: 0 0 10px #ff0000;
            transition: 0.15s;
            z-index: 5;
        }
        #status-dot.active {
            background: #00ff88;
            box-shadow: 0 0 14px #00ff88;
        }
        #gesture-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 8px;
        }
        #gesture-label {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 4px 16px;
            border-radius: 40px;
            color: #f0e2b0;
            font-size: 12px;
            letter-spacing: 1px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            font-weight: 400;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
            transition: all 0.1s ease;
        }
        #loader {
            position: absolute;
            inset: 0;
            z-index: 100;
            background: #080a08;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-top: 2px solid #d4af37;
            border-radius: 50%;
            animation: spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .loader-text {
            color: #d4af37;
            font-size: 12px;
            letter-spacing: 6px;
            margin-top: 24px;
            opacity: 0.6;
            font-weight: 300;
        }
        @media (max-width: 600px) {
            #webcam-container {
                width: 110px;
                height: 84px;
                bottom: 10px;
                right: 10px;
            }
            #info {
                font-size: 10px;
                padding: 4px 14px;
                bottom: 10px;
                letter-spacing: 1px;
            }
            .glass-btn {
                font-size: 10px;
                padding: 4px 10px;
            }
            #gesture-label {
                font-size: 10px;
                padding: 3px 12px;
            }
            #upload-ui {
                top: 10px;
                right: 10px;
                gap: 6px;
            }
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>

<body>
    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">INITIALIZING</div>
    </div>
    <div id="info">✧ 握拳 · 聚合 ｜ 张开 · 散开 ｜ 抓取 · 聚焦 ✧</div>
    <div id="upload-ui"><label class="glass-btn">✦ 上传照片<input type="file" id="photo-input" multiple accept="image/*"></label><button class="glass-btn" id="reset-view-btn">⟲ 重置</button></div>
    <div id="webcam-container"><video id="webcam-video" autoplay playsinline muted style="display:none;"></video><canvas id="webcam-canvas" width="160" height="120"></canvas>
        <div id="status-dot"></div>
        <div id="gesture-overlay">
            <div id="gesture-label">等待手势...</div>
        </div>
    </div>
    <div id="canvas-container"></div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
            }
        }
    </script>
    <script type="module">
        // ============================================================
        // 极限优化版 · 奢金圣诞树
        // 核心优化：InstancedMesh + Points + 降频手势 + 低像素比
        // ============================================================
        
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';
        
        // ---------- 配置 ----------
        const CFG = {
            treeParticles: 1200, // 树粒子总数
            dustCount: 1500, // 星尘数 (Points)
            snowCount: 600, // 雪花数
            treeHeight: 22,
            treeRadius: 7,
            cameraZ: 46,
            bloomStrength: 0.45,
            bloomRadius: 0.3,
            pixelRatio: Math.min(window.devicePixelRatio, 1.6), // 限制像素比
            gestureInterval: 3, // 每N帧处理一次手势
        };
        
        // ---------- 状态 ----------
        const STATE = {
            mode: 'TREE', // 'TREE' | 'SCATTER' | 'FOCUS'
            focusTarget: null, // 聚焦的照片Mesh
            focusType: 0,
            rotY: 0,
            rotX: 0,
            hand: { detected: false, x: 0, y: 0 },
            frameCount: 0,
        };
        
        // ---------- DOM ----------
        const container = document.getElementById('canvas-container');
        const videoEl = document.getElementById('webcam-video');
        const canvasEl = document.getElementById('webcam-canvas');
        const statusDot = document.getElementById('status-dot');
        const gestureLabel = document.getElementById('gesture-label');
        const loader = document.getElementById('loader');
        const infoEl = document.getElementById('info');
        
        // ---------- Three.js 核心 ----------
        let scene, camera, renderer, composer;
        let mainGroup, photoGroup;
        let snowInstanced = null;
        let dustPoints = null;
        let starMesh = null;
        
        // 树粒子 InstancedMesh 组
        const treeInstances = [];
        const treeParticleData = [];
        
        // 照片列表
        const photoMeshes = [];
        
        const clock = new THREE.Clock();
        
        // ---------- 初始化场景 ----------
        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x080a08);
            scene.fog = new THREE.FogExp2(0x080a08, 0.007);
        
            camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.set(0, 1.5, CFG.cameraZ);
            camera.lookAt(0, 0, 0);
        
            renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: false,
                powerPreference: 'high-performance',
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(CFG.pixelRatio);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.6;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            container.appendChild(renderer.domElement);
        
            // 环境光照
            const pmrem = new THREE.PMREMGenerator(renderer);
            scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
            pmrem.dispose();
        
            // 后期
            composer = new EffectComposer(renderer);
            composer.addPass(new RenderPass(scene, camera));
            const bloom = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                CFG.bloomStrength, CFG.bloomRadius, 0.5
            );
            bloom.threshold = 0.2;
            composer.addPass(bloom);
        
            // 主组
            mainGroup = new THREE.Group();
            scene.add(mainGroup);
            photoGroup = new THREE.Group();
            mainGroup.add(photoGroup);
        
            // 灯光
            const ambient = new THREE.AmbientLight(0x443322, 0.7);
            scene.add(ambient);
            const key = new THREE.DirectionalLight(0xffdd99, 1.5);
            key.position.set(10, 20, 20);
            scene.add(key);
            const fill = new THREE.DirectionalLight(0x88aaff, 0.5);
            fill.position.set(-15, 5, -10);
            scene.add(fill);
            const rim = new THREE.DirectionalLight(0xffcc88, 0.7);
            rim.position.set(0, -5, 25);
            scene.add(rim);
            const point = new THREE.PointLight(0xffaa44, 0.4, 30);
            point.position.set(0, 8, 0);
            mainGroup.add(point);
        
            window.addEventListener('resize', onResize);
        }
        
        function onResize() {
            const w = window.innerWidth,
                h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            composer.setSize(w, h);
        }
        
        // ---------- 创建树粒子 (InstancedMesh) ----------
        function createTreeParticles() {
            // 定义粒子类型
            const types = [
                { id: 'green', geo: new THREE.BoxGeometry(0.45, 0.45, 0.45), color: 0x1a3a1a, metalness: 0.1, roughness: 0.7,
                    emissive: 0x0a1a0a, emissiveIntensity: 0.15, ratio: 0.38 },
                { id: 'goldBox', geo: new THREE.BoxGeometry(0.45, 0.45, 0.45), color: 0xd4af37, metalness: 0.9,
                    roughness: 0.2, emissive: 0x332200, emissiveIntensity: 0.2, ratio: 0.28 },
                { id: 'goldSph', geo: new THREE.SphereGeometry(0.35, 16, 16), color: 0xd4af37, metalness: 0.9,
                    roughness: 0.2, emissive: 0x332200, emissiveIntensity: 0.2, ratio: 0.20 },
                { id: 'redSph', geo: new THREE.SphereGeometry(0.35, 16, 16), color: 0xaa2233, metalness: 0.3,
                    roughness: 0.3, emissive: 0x440000, emissiveIntensity: 0.2, ratio: 0.14 },
            ];
        
            const total = CFG.treeParticles;
            const counts = types.map(t => Math.round(total * t.ratio));
            // 修正总数
            let sum = counts.reduce((a, b) => a + b, 0);
            if (sum !== total) counts[counts.length - 1] += total - sum;
        
            let globalIdx = 0;
            const matrices = [];
            const tempMat = new THREE.Matrix4();
            const tempPos = new THREE.Vector3();
            const tempQuat = new THREE.Quaternion();
            const tempScale = new THREE.Vector3();
        
            types.forEach((type, ti) => {
                const count = counts[ti];
                if (count <= 0) return;
                const mat = new THREE.MeshStandardMaterial({
                    color: type.color,
                    metalness: type.metalness,
                    roughness: type.roughness,
                    emissive: type.emissive,
                    emissiveIntensity: type.emissiveIntensity,
                });
                const inst = new THREE.InstancedMesh(type.geo, mat, count);
                inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
                inst.frustumCulled = true;
                mainGroup.add(inst);
        
                const dataArr = [];
                for (let i = 0; i < count; i++) {
                    // 位置
                    const t = Math.pow(Math.random(), 0.7);
                    const y = t * CFG.treeHeight - CFG.treeHeight / 2;
                    const radius = CFG.treeRadius * (1 - t) * (0.7 + 0.3 * Math.random());
                    const angle = t * 40 * Math.PI + Math.random() * 2 * Math.PI;
                    const posTree = new THREE.Vector3(
                        Math.cos(angle) * radius,
                        y,
                        Math.sin(angle) * radius
                    );
                    // 散开位置
                    const rScatter = 10 + Math.random() * 18;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const posScatter = new THREE.Vector3(
                        rScatter * Math.sin(phi) * Math.cos(theta),
                        rScatter * Math.sin(phi) * Math.sin(theta) * 0.5,
                        rScatter * Math.cos(phi)
                    );
                    const baseScale = 0.5 + Math.random() * 0.6;
                    const spinSpeed = new THREE.Vector3(
                        (Math.random() - 0.5) * 2,
                        (Math.random() - 0.5) * 2,
                        (Math.random() - 0.5) * 2
                    );
                    // 初始矩阵
                    tempPos.copy(posTree);
                    tempQuat.setFromEuler(new THREE.Euler(
                        Math.random() * 6, Math.random() * 6, Math.random() * 6
                    ));
                    tempScale.set(baseScale, baseScale, baseScale);
                    tempMat.compose(tempPos, tempQuat, tempScale);
                    inst.setMatrixAt(i, tempMat);
        
                    dataArr.push({
                        posTree: posTree.clone(),
                        posScatter: posScatter.clone(),
                        baseScale: baseScale,
                        spinSpeed: spinSpeed.clone(),
                        currentPos: posTree.clone(),
                        currentScale: baseScale,
                        rotX: Math.random() * 6,
                        rotY: Math.random() * 6,
                        rotZ: Math.random() * 6,
                        typeIdx: ti,
                        instIdx: i,
                    });
                }
                inst.instanceMatrix.needsUpdate = true;
                treeInstances.push(inst);
                treeParticleData.push(...dataArr);
                globalIdx += count;
            });
        }
        
        // ---------- 星尘 (Points) ----------
        function createDust() {
            const count = CFG.dustCount;
            const positions = new Float32Array(count * 3);
            const sizes = new Float32Array(count);
            for (let i = 0; i < count; i++) {
                const r = 22 + Math.random() * 38;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta) * 0.4;
                positions[i * 3 + 2] = r * Math.cos(phi);
                sizes[i] = 0.4 + Math.random() * 0.8;
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
        
            const mat = new THREE.PointsMaterial({
                color: 0xffeebb,
                size: 0.12,
                transparent: true,
                opacity: 0.5,
                sizeAttenuation: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
            });
            dustPoints = new THREE.Points(geo, mat);
            dustPoints.frustumCulled = true;
            mainGroup.add(dustPoints);
        }
        
        // ---------- 雪花 (InstancedMesh) ----------
        function createSnow() {
            if (snowInstanced) {
                mainGroup.remove(snowInstanced);
                snowInstanced.geometry.dispose();
                snowInstanced.material.dispose();
            }
            const count = CFG.snowCount;
            if (count <= 0) return;
            const geo = new THREE.IcosahedronGeometry(0.10, 0);
            const mat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                metalness: 0,
                roughness: 0.1,
                transmission: 0.8,
                thickness: 0.2,
                envMapIntensity: 1.0,
                clearcoat: 0.6,
                ior: 1.33,
                transparent: true,
                opacity: 0.9,
            });
            snowInstanced = new THREE.InstancedMesh(geo, mat, count);
            snowInstanced.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            snowInstanced.frustumCulled = true;
            const dummy = new THREE.Object3D();
            const range = 60;
            for (let i = 0; i < count; i++) {
                dummy.position.set(
                    (Math.random() - 0.5) * range,
                    Math.random() * range - 10,
                    (Math.random() - 0.5) * range
                );
                dummy.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
                const s = 0.6 + Math.random() * 1.2;
                dummy.scale.set(s, s, s);
                dummy.updateMatrix();
                snowInstanced.setMatrixAt(i, dummy.matrix);
            }
            snowInstanced.instanceMatrix.needsUpdate = true;
            mainGroup.add(snowInstanced);
        }
        
        // ---------- 星星 ----------
        function createStar() {
            const starMat = new THREE.MeshStandardMaterial({
                color: 0xffdd44,
                emissive: 0xff8800,
                emissiveIntensity: 2.0,
                metalness: 0.8,
                roughness: 0.1,
            });
            starMesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.85, 0), starMat);
            starMesh.position.set(0, CFG.treeHeight / 2 + 1.0, 0);
            mainGroup.add(starMesh);
        }
        
        // ---------- 创建照片 ----------
        function createPhotoMesh(dataURL, id) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const texture = new THREE.Texture(img);
                    texture.colorSpace = THREE.SRGBColorSpace;
                    texture.needsUpdate = true;
                    const aspect = img.width / img.height;
                    let w = 1.0,
                        h = 1.0;
                    if (aspect > 1) h = w / aspect;
                    else w = h * aspect;
        
                    const group = new THREE.Group();
                    const frameMat = new THREE.MeshStandardMaterial({
                        color: 0xc5a059,
                        metalness: 0.7,
                        roughness: 0.4,
                    });
                    const frame = new THREE.Mesh(new THREE.BoxGeometry(w + 0.12, h + 0.12, 0.035), frameMat);
                    group.add(frame);
                    const photoMat = new THREE.MeshBasicMaterial({ map: texture });
                    const photo = new THREE.Mesh(new THREE.PlaneGeometry(w, h), photoMat);
                    photo.position.z = 0.02;
                    group.add(photo);
        
                    const scale = 0.65 + Math.random() * 0.3;
                    group.scale.set(scale, scale, scale);
        
                    const t = 0.25 + Math.random() * 0.6;
                    const y = t * CFG.treeHeight - CFG.treeHeight / 2;
                    const radius = CFG.treeRadius * (1 - t) * 0.85;
                    const angle = t * 30 * Math.PI + Math.random() * 2 * Math.PI;
                    const posTree = new THREE.Vector3(
                        Math.cos(angle) * radius,
                        y,
                        Math.sin(angle) * radius
                    );
                    const rScatter = 8 + Math.random() * 16;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const posScatter = new THREE.Vector3(
                        rScatter * Math.sin(phi) * Math.cos(theta),
                        rScatter * Math.sin(phi) * Math.sin(theta) * 0.5,
                        rScatter * Math.cos(phi)
                    );
        
                    group.position.copy(posTree);
                    group.userData = {
                        posTree: posTree.clone(),
                        posScatter: posScatter.clone(),
                        baseScale: scale,
                        photoId: id,
                        isPhoto: true,
                    };
                    photoGroup.add(group);
                    photoMeshes.push(group);
                    resolve(group);
                };
                img.src = dataURL;
            });
        }
        
        // ---------- 默认照片 ----------
        function createDefaultPhotos() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0a0c0a';
            ctx.fillRect(0, 0, 512, 512);
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 12;
            ctx.strokeRect(30, 30, 452, 452);
            ctx.fillStyle = '#d4af37';
            ctx.font = 'bold 80px "Times New Roman", serif';
            ctx.textAlign = 'center';
            ctx.fillText('✦', 256, 200);
            ctx.font = '36px "Georgia", serif';
            ctx.fillText('NOEL', 256, 320);
            ctx.font = '20px "Georgia", serif';
            ctx.fillStyle = '#bb9955';
            ctx.fillText('upload your photos', 256, 400);
            const dataURL = canvas.toDataURL('image/png');
            createPhotoMesh(dataURL, 'default-' + Date.now());
        }
        
        // ---------- 更新树粒子 (InstancedMesh 矩阵) ----------
        function updateTreeParticles(delta) {
            const mode = STATE.mode;
            const focusMesh = STATE.focusTarget;
            const tempMat = new THREE.Matrix4();
            const tempPos = new THREE.Vector3();
            const tempQuat = new THREE.Quaternion();
            const tempScale = new THREE.Vector3();
            const euler = new THREE.Euler();
        
            // 按 InstancedMesh 分组更新
            const instMap = new Map();
            treeInstances.forEach((inst, idx) => {
                instMap.set(idx, []);
            });
        
            treeParticleData.forEach((d, idx) => {
                const ti = d.typeIdx;
                const inst = treeInstances[ti];
                if (!inst) return;
        
                let targetPos;
                if (mode === 'TREE') targetPos = d.posTree;
                else if (mode === 'SCATTER') targetPos = d.posScatter;
                else if (mode === 'FOCUS') {
                    // 聚焦模式：照片在 focusTarget，其他粒子散开
                    targetPos = d.posScatter;
                }
        
                const lerpSpeed = (mode === 'FOCUS') ? 5.0 : 4.0;
                d.currentPos.lerp(targetPos, lerpSpeed * delta);
        
                // 旋转
                if (mode === 'SCATTER' || mode === 'FOCUS') {
                    d.rotX += d.spinSpeed.x * delta;
                    d.rotY += d.spinSpeed.y * delta;
                    d.rotZ += d.spinSpeed.z * delta;
                } else {
                    d.rotX = THREE.MathUtils.lerp(d.rotX, 0, delta * 3);
                    d.rotZ = THREE.MathUtils.lerp(d.rotZ, 0, delta * 3);
                    d.rotY += 0.3 * delta;
                }
        
                // 缩放
                let targetScale = d.baseScale;
                if (mode === 'SCATTER') {
                    targetScale = d.baseScale * 1.1;
                }
                d.currentScale = THREE.MathUtils.lerp(d.currentScale, targetScale, delta * 5);
        
                tempPos.copy(d.currentPos);
                euler.set(d.rotX, d.rotY, d.rotZ);
                tempQuat.setFromEuler(euler);
                tempScale.set(d.currentScale, d.currentScale, d.currentScale);
                tempMat.compose(tempPos, tempQuat, tempScale);
                inst.setMatrixAt(d.instIdx, tempMat);
            });
        
            treeInstances.forEach(inst => {
                inst.instanceMatrix.needsUpdate = true;
            });
        }
        
        // ---------- 更新照片 ----------
        function updatePhotos(delta) {
            const mode = STATE.mode;
            const focusMesh = STATE.focusTarget;
        
            photoMeshes.forEach(mesh => {
                const ud = mesh.userData;
                let targetPos;
                if (mode === 'TREE') targetPos = ud.posTree;
                else if (mode === 'SCATTER') targetPos = ud.posScatter;
                else if (mode === 'FOCUS') {
                    if (mesh === focusMesh) {
                        // 聚焦照片：移到相机前方
                        const offset = new THREE.Vector3(0, 0, 7.5);
                        if (STATE.focusType === 1) offset.set(-1.8, 1.2, 7);
                        else if (STATE.focusType === 2) offset.set(1.8, -1.0, 6.5);
                        const worldPos = offset.clone().applyMatrix4(camera.matrixWorld);
                        const localPos = worldPos.clone().applyMatrix4(mainGroup.matrixWorld)
                            .applyMatrix4(new THREE.Matrix4().invert(mainGroup.matrixWorld));
                        targetPos = localPos;
                    } else {
                        targetPos = ud.posScatter;
                    }
                }
                const speed = (mesh === focusMesh && mode === 'FOCUS') ? 7.0 : 4.0;
                mesh.position.lerp(targetPos, speed * delta);
        
                // 旋转
                if (mode === 'SCATTER' || (mode === 'FOCUS' && mesh !== focusMesh)) {
                    mesh.rotation.x += 0.3 * delta;
                    mesh.rotation.y += 0.5 * delta;
                    mesh.rotation.z += 0.2 * delta;
                } else if (mode === 'TREE') {
                    mesh.rotation.x = THREE.MathUtils.lerp(mesh.rotation.x, 0, delta * 3);
                    mesh.rotation.z = THREE.MathUtils.lerp(mesh.rotation.z, 0, delta * 3);
                    mesh.rotation.y += 0.25 * delta;
                }
        
                // 缩放
                let targetScale = ud.baseScale;
                if (mode === 'FOCUS' && mesh === focusMesh) {
                    targetScale = ud.baseScale * 3.0;
                } else if (mode === 'SCATTER') {
                    targetScale = ud.baseScale * 1.5;
                }
                const cs = mesh.scale.x;
                const ns = THREE.MathUtils.lerp(cs, targetScale, delta * 5);
                mesh.scale.set(ns, ns, ns);
        
                if (mode === 'FOCUS' && mesh === focusMesh) {
                    mesh.lookAt(camera.position);
                    if (STATE.focusType === 1) mesh.rotateY(0.2);
                    else if (STATE.focusType === 2) mesh.rotateX(-0.3);
                }
            });
        }
        
        // ---------- 更新雪花 ----------
        function updateSnow(delta) {
            if (!snowInstanced) return;
            const count = CFG.snowCount;
            const dummy = new THREE.Object3D();
            const range = 60;
            const speed = 2.2;
            const elapsed = clock.elapsedTime;
            for (let i = 0; i < count; i++) {
                snowInstanced.getMatrixAt(i, dummy.matrix);
                dummy.matrix.decompose(dummy.position, dummy.quaternion, dummy.scale);
                dummy.position.y -= speed * delta * 2.5;
                dummy.position.x += Math.sin(elapsed * 0.5 + i * 0.7) * 0.25 * delta;
                dummy.position.z += Math.cos(elapsed * 0.3 + i * 0.5) * 0.18 * delta;
                if (dummy.position.y < -20) {
                    dummy.position.y = 30 + Math.random() * 10;
                    dummy.position.x = (Math.random() - 0.5) * range;
                    dummy.position.z = (Math.random() - 0.5) * range;
                }
                dummy.rotation.x += delta * 0.15;
                dummy.rotation.y += delta * 0.25;
                dummy.updateMatrix();
                snowInstanced.setMatrixAt(i, dummy.matrix);
            }
            snowInstanced.instanceMatrix.needsUpdate = true;
        }
        
        // ---------- 更新星尘 (Points 动画) ----------
        function updateDust(delta) {
            if (!dustPoints) return;
            const pos = dustPoints.geometry.attributes.position.array;
            const elapsed = clock.elapsedTime;
            const count = CFG.dustCount;
            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                // 微弱的浮动
                pos[i3 + 1] += Math.sin(elapsed * 0.2 + i * 0.01) * 0.002;
                pos[i3] += Math.cos(elapsed * 0.15 + i * 0.007) * 0.001;
                pos[i3 + 2] += Math.sin(elapsed * 0.1 + i * 0.005) * 0.001;
            }
            dustPoints.geometry.attributes.position.needsUpdate = true;
        }
        
        // ---------- 更新星星 ----------
        function updateStar(delta) {
            if (starMesh) {
                starMesh.rotation.y += 0.5 * delta;
                starMesh.rotation.x += 0.15 * delta;
                const pulse = 1 + 0.08 * Math.sin(clock.elapsedTime * 2.5);
                starMesh.scale.set(pulse, pulse, pulse);
            }
        }
        
        // ---------- 手势识别 (MediaPipe) ----------
        let handLandmarker = null;
        let lastVideoTime = -1;
        let lastGesture = 'none';
        let gestureFrameSkip = 0;
        
        async function initMediaPipe() {
            try {
                const vision = await FilesetResolver.forVisionTasks(
                    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm'
                );
                handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
                        delegate: 'GPU'
                    },
                    runningMode: 'VIDEO',
                    numHands: 1,
                });
                startWebcam();
            } catch (e) {
                console.warn('MediaPipe init failed:', e);
                gestureLabel.innerHTML = ' 手势未启动';
            }
        }
        
        async function startWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 160, height: 120, frameRate: { ideal: 15 } }
                });
                videoEl.srcObject = stream;
                await videoEl.play();
                renderWebcamPreview();
                predictLoop();
            } catch (e) {
                console.warn('Camera error:', e);
                gestureLabel.innerHTML = '摄像头不可用';
            }
        }
        
        function renderWebcamPreview() {
            const ctx = canvasEl.getContext('2d');
            function draw() {
                if (videoEl.readyState >= 2) {
                    ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);
                }
                requestAnimationFrame(draw);
            }
            draw();
        }
        
        function predictLoop() {
            // 降频处理：每 N 帧处理一次
            STATE.frameCount++;
            if (STATE.frameCount % CFG.gestureInterval !== 0) {
                requestAnimationFrame(predictLoop);
                return;
            }
        
            if (handLandmarker && videoEl.readyState >= 2 && videoEl.currentTime !== lastVideoTime) {
                lastVideoTime = videoEl.currentTime;
                try {
                    const result = handLandmarker.detectForVideo(videoEl, performance.now());
                    processHand(result);
                    statusDot.classList.toggle('active', result.landmarks && result.landmarks.length > 0);
                } catch (e) { /* ignore */ }
            }
            requestAnimationFrame(predictLoop);
        }
        
        function processHand(result) {
            if (!result.landmarks || result.landmarks.length === 0) {
                STATE.hand.detected = false;
                if (lastGesture !== 'none') {
                    gestureLabel.innerHTML = ' 无手势';
                    lastGesture = 'none';
                }
                return;
            }
            STATE.hand.detected = true;
            const lm = result.landmarks[0];
            STATE.hand.x = (lm[9].x - 0.5) * 2;
            STATE.hand.y = (lm[9].y - 0.5) * 2;
        
            const wrist = lm[0];
            const thumbTip = lm[4];
            const indexTip = lm[8];
            const middleTip = lm[12];
            const ringTip = lm[16];
            const pinkyTip = lm[20];
        
            const distThumb = Math.hypot(thumbTip.x - wrist.x, thumbTip.y - wrist.y, thumbTip.z - wrist.z);
            const distIndex = Math.hypot(indexTip.x - wrist.x, indexTip.y - wrist.y, indexTip.z - wrist.z);
            const distMiddle = Math.hypot(middleTip.x - wrist.x, middleTip.y - wrist.y, middleTip.z - wrist.z);
            const distRing = Math.hypot(ringTip.x - wrist.x, ringTip.y - wrist.y, ringTip.z - wrist.z);
            const distPinky = Math.hypot(pinkyTip.x - wrist.x, pinkyTip.y - wrist.y, pinkyTip.z - wrist.z);
        
            const avgDist = (distThumb + distIndex + distMiddle + distRing + distPinky) / 5;
            const isFist = avgDist < 0.22 && distIndex < 0.28 && distMiddle < 0.28;
            const isSpread = avgDist > 0.42 && distIndex > 0.32 && distMiddle > 0.32 && distPinky > 0.28;
            const pinchDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y, thumbTip.z - indexTip.z);
            const isPinch = pinchDist < 0.08 && distMiddle > 0.28 && distRing > 0.22;
        
            let gestureText = '';
            let currentGesture = 'none';
        
            if (isFist) {
                currentGesture = 'fist';
                gestureText = ' 握拳 · 聚合';
                if (STATE.mode !== 'TREE') {
                    STATE.mode = 'TREE';
                    STATE.focusTarget = null;
                    infoEl.innerText = '✧ 聚合 · 圣诞树 ✧';
                }
            } else if (isSpread) {
                currentGesture = 'spread';
                gestureText = ' 张开 · 散开';
                if (STATE.mode !== 'SCATTER') {
                    STATE.mode = 'SCATTER';
                    STATE.focusTarget = null;
                    infoEl.innerText = '✧ 散开 · 星云 ✧';
                }
            } else if (isPinch && STATE.mode === 'SCATTER' && !STATE.focusTarget) {
                currentGesture = 'pinch';
                gestureText = '🤏 抓取 · 聚焦';
                grabNearestPhoto();
            } else {
                currentGesture = 'none';
                gestureText = '✋ 识别中...';
            }
        
            if (currentGesture !== lastGesture) {
                gestureLabel.innerHTML = gestureText;
                lastGesture = currentGesture;
            }
        
            // 散开态下手控制旋转 (灵敏度调低，更平滑)
            if (STATE.mode === 'SCATTER' && STATE.hand.detected) {
                const sens = 0.028;
                STATE.rotY += STATE.hand.x * sens;
                STATE.rotX += -STATE.hand.y * sens * 0.5;
            }
        }
        
        function grabNearestPhoto() {
            if (photoMeshes.length === 0) return;
            let nearest = null,
                minDist = Infinity;
            const camDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            photoMeshes.forEach(m => {
                const pos = new THREE.Vector3();
                m.getWorldPosition(pos);
                const dir = pos.clone().sub(camera.position).normalize();
                const dist = dir.dot(camDir);
                if (dist < minDist && dist > 0) {
                    minDist = dist;
                    nearest = m;
                }
            });
            if (nearest) {
                STATE.mode = 'FOCUS';
                STATE.focusTarget = nearest;
                STATE.focusType = Math.floor(Math.random() * 3);
                infoEl.innerText = '✧ 聚焦照片 ✧';
                gestureLabel.innerHTML = ' 聚焦照片';
                lastGesture = 'focus';
            }
        }
        
        // ---------- 上传照片 ----------
        function setupUpload() {
            const input = document.getElementById('photo-input');
            input.addEventListener('change', async (e) => {
                const files = e.target.files;
                for (const file of files) {
                    const reader = new FileReader();
                    reader.onload = async (ev) => {
                        await createPhotoMesh(ev.target.result, 'upload-' + Date.now() + '-' + Math.random());
                    };
                    reader.readAsDataURL(file);
                }
                input.value = '';
            });
        }
        
        document.getElementById('reset-view-btn').addEventListener('click', () => {
            STATE.rotX = 0;
            STATE.rotY = 0;
            if (STATE.mode !== 'TREE') {
                STATE.mode = 'TREE';
                STATE.focusTarget = null;
                infoEl.innerText = '✧ 聚合 · 圣诞树 ✧';
                gestureLabel.innerHTML = ' 握拳 · 聚合';
                lastGesture = 'fist';
            }
        });
        
        // ---------- 主循环 ----------
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.04);
            const elapsed = clock.elapsedTime;
        
            // 更新雪花
            updateSnow(delta);
        
            // 更新树粒子
            updateTreeParticles(delta);
        
            // 更新照片
            updatePhotos(delta);
        
            // 更新星尘
            updateDust(delta);
        
            // 更新星星
            updateStar(delta);
        
            // 主组旋转
            if (STATE.mode === 'TREE') {
                STATE.rotY += 0.12 * delta;
                STATE.rotX = THREE.MathUtils.lerp(STATE.rotX, 0, delta * 2);
            } else if (STATE.mode === 'SCATTER') {
                STATE.rotY += 0.04 * delta;
            }
            mainGroup.rotation.y = STATE.rotY;
            mainGroup.rotation.x = STATE.rotX;
        
            composer.render();
        }
        
        // ---------- 启动 ----------
        function init() {
            initScene();
            createTreeParticles();
            createDust();
            createSnow();
            createStar();
            createDefaultPhotos();
            setupUpload();
            initMediaPipe();
        
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 600);
            }, 500);
        
            animate();
        }
        
        init();
        
        // 暴露状态用于调试
        window.__STATE = STATE;
        
        // 清理资源 (可选)
        window.addEventListener('beforeunload', () => {
            treeInstances.forEach(inst => {
                inst.geometry.dispose();
                inst.material.dispose();
            });
            if (snowInstanced) {
                snowInstanced.geometry.dispose();
                snowInstanced.material.dispose();
            }
            if (dustPoints) {
                dustPoints.geometry.dispose();
                dustPoints.material.dispose();
            }
            renderer.dispose();
        });
    </script>
</body>

</html>
