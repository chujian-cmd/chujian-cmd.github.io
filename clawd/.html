<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Mascot - Clawd</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Fira Code', monospace;
            background-color: #0F172A;
            color: #F8FAFC;
        }

        .pixel-art {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .terminal-box {
            background-color: #1E293B;
            border: 2px solid #334155;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .floating {
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(217, 119, 6, 0.4)); }
            50% { filter: drop-shadow(0 0 25px rgba(217, 119, 6, 0.8)); }
        }

        .glow {
            animation: pulse-glow 2s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Terminal Window -->
    <div class="terminal-box rounded-xl w-full max-w-2xl overflow-hidden border border-slate-700">
        <!-- Terminal Header -->
        <div class="bg-slate-800 px-4 py-3 flex items-center justify-between border-b border-slate-700">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                <span class="ml-2 text-xs text-slate-400 font-mono">claude-code — ~/project</span>
            </div>
            <div class="text-xs text-slate-500">8-bit ASCII Mascot</div>
        </div>

        <!-- Terminal Content -->
        <div class="p-8 flex flex-col items-center justify-center space-y-6">
            
            <!-- SVG Pixel Art of Clawd -->
            <div class="floating glow relative my-4">
                <svg width="256" height="256" viewBox="0 0 16 16" class="pixel-art w-48 h-48 md:w-64 md:h-64">
                    <!-- Color Palette:
                         #D97706 - Base Orange (Claude Brand Color accent)
                         #F59E0B - Light Orange Highlight
                         #B45309 - Dark Orange Shadow
                         #0F172A - Eyes Dark Blue/Black
                         #FFFFFF - Eye Highlight
                    -->
                    
                    <!-- Antennas / Top Claws -->
                    <rect x="2" y="1" width="2" height="2" fill="#F59E0B"/>
                    <rect x="12" y="1" width="2" height="2" fill="#F59E0B"/>
                    <rect x="3" y="3" width="2" height="2" fill="#D97706"/>
                    <rect x="11" y="3" width="2" height="2" fill="#D97706"/>

                    <!-- Main Body Top -->
                    <rect x="4" y="4" width="8" height="2" fill="#F59E0B"/>

                    <!-- Main Body Middle -->
                    <rect x="2" y="6" width="12" height="6" fill="#D97706"/>
                    <!-- Highlight lines -->
                    <rect x="3" y="6" width="10" height="1" fill="#F59E0B"/>
                    
                    <!-- Eyes (Big Cute 8-bit Eyes) -->
                    <!-- Left Eye -->
                    <rect x="4" y="7" width="3" height="3" fill="#0F172A"/>
                    <rect x="4" y="7" width="1" height="1" fill="#FFFFFF"/>
                    <!-- Right Eye -->
                    <rect x="9" y="7" width="3" height="3" fill="#0F172A"/>
                    <rect x="9" y="7" width="1" height="1" fill="#FFFFFF"/>

                    <!-- Cute Cheek Blush -->
                    <rect x="3" y="9" width="1" height="1" fill="#EF4444" opacity="0.6"/>
                    <rect x="12" y="9" width="1" height="1" fill="#EF4444" opacity="0.6"/>

                    <!-- Main Body Bottom & Shadow -->
                    <rect x="3" y="12" width="10" height="1" fill="#B45309"/>

                    <!-- Legs / Claws Bottom -->
                    <!-- Left Legs -->
                    <rect x="2" y="13" width="2" height="2" fill="#D97706"/>
                    <rect x="1" y="14" width="1" height="2" fill="#B45309"/>
                    
                    <rect x="5" y="13" width="2" height="2" fill="#D97706"/>
                    <rect x="5" y="14" width="1" height="2" fill="#B45309"/>

                    <!-- Right Legs -->
                    <rect x="9" y="13" width="2" height="2" fill="#D97706"/>
                    <rect x="10" y="14" width="1" height="2" fill="#B45309"/>

                    <rect x="12" y="13" width="2" height="2" fill="#D97706"/>
                    <rect x="14" y="14" width="1" height="2" fill="#B45309"/>
                </svg>
            </div>

            <!-- Terminal Text Header -->
            <div class="text-center space-y-2">
                <h1 class="text-2xl font-bold text-amber-500 tracking-wider">CLAWD</h1>
                <p class="text-sm text-slate-400">Official Mascot for Claude Code</p>
            </div>

            <!-- Code/Command Output Simulation -->
            <div class="w-full bg-slate-900 rounded border border-slate-800 p-4 font-mono text-xs text-slate-300 space-y-1">
                <div class="flex items-center space-x-2">
                    <span class="text-emerald-400">➜</span>
                    <span class="text-cyan-400">~</span>
                    <span class="text-slate-100">claude --version</span>
                </div>
                <div class="text-amber-500 font-semibold pt-1">
                    ✦ Clawd v2.0 is online and happy to help! 🦀
                </div>
                <div class="text-slate-500 pt-2 flex items-center">
                    <span>Status: Boogieing...</span>
                    <span class="inline-block w-2 h-4 bg-amber-500 ml-2 animate-pulse"></span>
                </div>
            </div>

        </div>
    </div>

    <!-- Description Footer -->
    <div class="mt-6 text-center text-xs text-slate-500 max-w-md">
        <p>This is <span class="text-amber-400 font-semibold">Clawd</span>, the retro 8-bit mascot that greets developers when running Claude Code in the CLI.</p>
    </div>

</body>
</html>
