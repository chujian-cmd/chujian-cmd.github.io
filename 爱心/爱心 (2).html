<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李峋的爱心代码</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            cursor: pointer;
            background: #0a0a0a;
        }

        .banner {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #0a0a0a;
        }

        .banner video {
            position: absolute;
            top: 0;
            left: 0;
            object-fit: cover;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* ===== 如果视频加载失败，显示彩色背景 ===== */
        .banner .fallback {
            position: absolute;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at center, #1a0011 0%, #0a0a0a 70%);
            display: none;
        }

        .banner .fallback .heart-emoji {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            animation: heartbeat 1.2s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
            }
            14% {
                transform: translate(-50%, -50%) scale(1.3);
            }
            28% {
                transform: translate(-50%, -50%) scale(1);
            }
            42% {
                transform: translate(-50%, -50%) scale(1.3);
            }
            70% {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .banner::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .banner .content {
            position: relative;
            z-index: 2;
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }

        .banner .content h1 {
            margin: 0;
            padding: 0;
            font-size: clamp(2.5rem, 10vw, 4.5rem);
            text-transform: uppercase;
            color: #d11090;
            position: relative;
            display: inline-block;
        }

        .banner .content h1::after {
            content: '✨ 李峋的爱心 ✨';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: transparent;
            background-image: linear-gradient(to right,
                    #c23616, #192a56, #00d2d3, yellow,
                    #6d214f, #2e86de, #4cd137, #e84118);
            background-size: 200% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            clip-path: circle(80px at 0% 50%);
            -webkit-clip-path: circle(80px at 0% 50%);
            animation: move 5s ease-in-out infinite;
        }

        @keyframes move {
            0% {
                clip-path: circle(80px at 0% 50%);
                -webkit-clip-path: circle(80px at 0% 50%);
            }
            50% {
                clip-path: circle(80px at 100% 50%);
                -webkit-clip-path: circle(80px at 100% 50%);
            }
            100% {
                clip-path: circle(80px at 0% 50%);
                -webkit-clip-path: circle(80px at 0% 50%);
            }
        }

        .hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 24px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            user-select: none;
            pointer-events: none;
            transition: opacity 0.8s;
        }

        .hint.hidden {
            opacity: 0;
        }

        /* ===== 调试信息 ===== */
        #debug {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 16px;
            border-radius: 8px;
            font-family: monospace;
            text-align: center;
            max-width: 90%;
            display: none;
        }

        @media (max-width: 600px) {
            .banner .content h1::after {
                clip-path: circle(40px at 0% 50%);
                -webkit-clip-path: circle(40px at 0% 50%);
            }
            @keyframes move {
                0% {
                    clip-path: circle(40px at 0% 50%);
                    -webkit-clip-path: circle(40px at 0% 50%);
                }
                50% {
                    clip-path: circle(40px at 100% 50%);
                    -webkit-clip-path: circle(40px at 100% 50%);
                }
                100% {
                    clip-path: circle(40px at 0% 50%);
                    -webkit-clip-path: circle(40px at 0% 50%);
                }
            }
        }
    </style>
</head>
<body>

    <div class="banner">
        <!-- ===== 视频 ===== -->
        <video id="bgVideo" autoplay muted loop playsinline>
            <source src="李峋的爱心代码.mp4" type="video/mp4">
            你的浏览器不支持视频播放
        </video>

        <!-- ===== 备用：如果视频加载失败，显示跳动爱心 ===== -->
        <div class="fallback" id="fallback">
            <div class="heart-emoji">💖</div>
        </div>

        <div class="content">
            <h1></h1>
        </div>
    </div>

    <div class="hint" id="hint">♡ 点击页面 · 播放音乐 ♡</div>
    <div id="debug"></div>

    <audio id="bgMusic" loop preload="auto">
        <source src="http://music.163.com/song/media/outer/url?id=1963443271.mp3" type="audio/mpeg">
    </audio>

    <script>
        const video = document.getElementById('bgVideo');
        const audio = document.getElementById('bgMusic');
        const hint = document.getElementById('hint');
        const debug = document.getElementById('debug');
        const fallback = document.getElementById('fallback');
        let played = false;

        // ===== 调试函数 =====
        function log(msg) {
            debug.style.display = 'block';
            debug.textContent = msg;
            console.log('[调试]', msg);
        }

        // ===== 检查视频状态 =====
        video.addEventListener('loadeddata', function() {
            log('✅ 视频加载成功！尺寸：' + video.videoWidth + 'x' + video.videoHeight);
            fallback.style.display = 'none';
        });

        video.addEventListener('error', function(e) {
            log('❌ 视频加载失败！错误码：' + video.error?.code + '，请检查文件是否存在');
            fallback.style.display = 'block';
            // 尝试用另一种方式加载
            video.src = './李峋的爱心代码.mp4';
            video.load();
        });

        video.addEventListener('stalled', function() {
            log('⏳ 视频加载停滞，正在重试...');
        });

        // ===== 如果3秒后视频还没加载，显示备用 =====
        setTimeout(() => {
            if (video.readyState === 0) {
                log('⚠️ 视频加载超时，请检查文件路径');
                fallback.style.display = 'block';
            }
        }, 3000);

        // ===== 音乐播放 =====
        function playMusic() {
            if (played) return;
            audio.play()
                .then(() => {
                    played = true;
                    hint.classList.add('hidden');
                    log('🎵 音乐已播放');
                })
                .catch((e) => {
                    log('⚠️ 音乐播放失败：' + e.message);
                });
        }

        document.addEventListener('click', playMusic);
        document.addEventListener('touchstart', playMusic);

        window.addEventListener('load', function() {
            setTimeout(() => {
                audio.play()
                    .then(() => {
                        played = true;
                        hint.classList.add('hidden');
                        log('🎵 音乐自动播放成功');
                    })
                    .catch(() => {
                        log('👆 点击页面播放音乐');
                    });
            }, 500);
        });

        audio.volume = 0.6;

        // ===== 尝试用绝对路径 =====
        // 如果你知道完整路径，可以取消注释下面这行，替换成你的路径
        // video.src = '/storage/emulated/0/html存放地/李峋的爱心代码.mp4';
    </script>

</body>
</html>
