<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李峋的爱心代码</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            cursor: pointer;
            background: #000;
        }

        .banner {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .banner video {
            position: absolute;
            top: 0;
            left: 0;
            object-fit: cover;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* ===== 半透明遮罩 ===== */
        .banner::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .banner .content {
            position: relative;
            z-index: 2;
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }

        .banner .content h1 {
            margin: 0;
            padding: 0;
            font-size: clamp(2.5rem, 10vw, 4.5rem);
            text-transform: uppercase;
            color: #d11090;
            position: relative;
            display: inline-block;
        }

        /* ===== 彩虹渐变扫光 ===== */
        .banner .content h1::after {
            content: '✨ 李峋的爱心 ✨';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: transparent;
            background-image: linear-gradient(to right,
                    #c23616, #192a56, #00d2d3, yellow,
                    #6d214f, #2e86de, #4cd137, #e84118);
            background-size: 200% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            clip-path: circle(80px at 0% 50%);
            -webkit-clip-path: circle(80px at 0% 50%);
            animation: move 5s ease-in-out infinite;
        }

        @keyframes move {
            0% {
                clip-path: circle(80px at 0% 50%);
                -webkit-clip-path: circle(80px at 0% 50%);
            }
            50% {
                clip-path: circle(80px at 100% 50%);
                -webkit-clip-path: circle(80px at 100% 50%);
            }
            100% {
                clip-path: circle(80px at 0% 50%);
                -webkit-clip-path: circle(80px at 0% 50%);
            }
        }

        /* ===== 提示 ===== */
        .hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 24px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            user-select: none;
            pointer-events: none;
            transition: opacity 0.8s;
        }

        .hint.hidden {
            opacity: 0;
        }

        @media (max-width: 600px) {
            .banner .content h1::after {
                clip-path: circle(40px at 0% 50%);
                -webkit-clip-path: circle(40px at 0% 50%);
            }
            @keyframes move {
                0% {
                    clip-path: circle(40px at 0% 50%);
                    -webkit-clip-path: circle(40px at 0% 50%);
                }
                50% {
                    clip-path: circle(40px at 100% 50%);
                    -webkit-clip-path: circle(40px at 100% 50%);
                }
                100% {
                    clip-path: circle(40px at 0% 50%);
                    -webkit-clip-path: circle(40px at 0% 50%);
                }
            }
        }
    </style>
</head>
<body>

    <div class="banner">
        <!-- ★ 视频：直接用你手机里的那个 ★ -->
        <video autoplay muted loop playsinline>
            <source src="李峋的爱心代码.mp4" type="video/mp4">
            你的浏览器不支持视频播放
        </video>
        <div class="content">
            <h1></h1>
        </div>
    </div>

    <div class="hint" id="hint">♡ 点击页面 · 播放音乐 ♡</div>

    <!-- ===== 音频 ===== -->
    <audio id="bgMusic" loop preload="auto">
        <source src="http://music.163.com/song/media/outer/url?id=1963443271.mp3" type="audio/mpeg">
        你的浏览器不支持音频
    </audio>

    <script>
        const audio = document.getElementById('bgMusic');
        const hint = document.getElementById('hint');
        let played = false;

        function playMusic() {
            if (played) return;
            audio.play()
                .then(() => {
                    played = true;
                    hint.classList.add('hidden');
                })
                .catch(() => {});
        }

        document.addEventListener('click', playMusic);
        document.addEventListener('touchstart', playMusic);

        // 页面加载后尝试自动播放
        window.addEventListener('load', function() {
            setTimeout(() => {
                audio.play()
                    .then(() => {
                        played = true;
                        hint.classList.add('hidden');
                    })
                    .catch(() => {});
            }, 500);
        });

        audio.volume = 0.6;
    </script>

</body>
</html>
