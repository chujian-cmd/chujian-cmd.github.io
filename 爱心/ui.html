<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>模板 · 玻璃质感</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #4facfe;
      --accent: #00f2fe;
      --glass-border: rgba(255, 255, 255, 0.14);
      --text: #eaf6ff;
      --subtext: #91a4b8;
    }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, 'Cascadia Code', 'Consolas', monospace;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(79, 172, 254, 0.45), transparent 28%),
        radial-gradient(circle at 90% 20%, rgba(0, 242, 254, 0.35), transparent 32%),
        linear-gradient(135deg, #050a18 0%, #081229 45%, #050c22 100%);
      background-attachment: fixed;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app {
      max-width: 600px;
      width: 100%;
      flex: 1;
    }

    .hero {
      text-align: center;
      margin-bottom: 24px;
    }

    .hero h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ffffff, #a8d8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      color: var(--subtext);
      margin-top: 8px;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 18px;
      padding: 6px;
      border: 1px solid var(--glass-border);
    }

    .tab-btn {
      flex: 1;
      border: none;
      border-radius: 14px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      color: var(--subtext);
      font-family: inherit;
      backdrop-filter: blur(4px);
      text-align: center;
      transition: 0.25s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(79, 172, 254, 0.25), rgba(0, 242, 254, 0.15));
      color: #fff;
      border: 1px solid rgba(79, 172, 254, 0.25);
      box-shadow: 0 2px 12px rgba(79, 172, 254, 0.15);
    }

    .tab-btn:hover:not(.active) {
      color: #c8dfff;
      background: rgba(255, 255, 255, 0.04);
    }

    .page {
      display: none;
      animation: fade 0.35s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fade {
      0% { opacity: 0.3; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      padding: 16px 18px;
      margin-bottom: 12px;
    }

    .card-label {
      font-size: 12px;
      color: var(--subtext);
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .card-label span {
      color: var(--primary);
      font-weight: 500;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      color: #eaf6ff;
      padding: 12px 14px;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: 13px;
      line-height: 1.55;
      resize: vertical;
      tab-size: 4;
    }

    textarea:focus {
      outline: none;
      border-color: rgba(79, 172, 254, 0.45);
      box-shadow: 0 0 0 2px rgba(79, 172, 254, 0.14);
    }

    canvas {
      width: 100%;
      height: 100px;
      background: rgba(0, 4, 12, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      display: block;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .btn {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: #eaf6ff;
      padding: 8px 16px;
      font-size: 13px;
      cursor: default;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.05));
      font-family: inherit;
      backdrop-filter: blur(4px);
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: rgba(79, 172, 254, 0.35);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.08));
    }

    .btn.disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    select {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #eaf6ff;
      padding: 6px 10px;
      font-size: 13px;
      font-family: inherit;
      backdrop-filter: blur(4px);
    }

    select:focus {
      outline: none;
      border-color: rgba(79, 172, 254, 0.35);
    }

    input[type='range'] {
      width: 80px;
      accent-color: #4facfe;
      background: transparent;
    }

    input[type='number'] {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #eaf6ff;
      padding: 6px 8px;
      font-size: 13px;
      font-family: inherit;
      width: 50px;
    }

    input[type='number']:focus {
      outline: none;
      border-color: rgba(79, 172, 254, 0.35);
    }

    .flex-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .flex-row label {
      color: var(--subtext);
      font-size: 13px;
    }

    .badge {
      color: var(--subtext);
      font-size: 12px;
    }

    .info {
      color: var(--subtext);
      font-size: 12px;
      margin-left: auto;
      white-space: nowrap;
    }

    .error-text {
      color: #ff7b7b;
      font-size: 13px;
    }

    .success-text {
      color: #4facfe;
      font-size: 13px;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .library-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 12px 14px;
      cursor: default;
      transition: 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .library-item:hover {
      background: rgba(79, 172, 254, 0.12);
      border-color: rgba(79, 172, 254, 0.3);
      transform: translateY(-2px);
    }

    .library-item .name {
      font-size: 14px;
      color: var(--text);
    }

    .library-item .desc {
      font-size: 11px;
      color: var(--subtext);
      font-family: 'Cascadia Code', 'Consolas', monospace;
    }

    .library-item .tag {
      font-size: 10px;
      background: rgba(79, 172, 254, 0.2);
      border-radius: 6px;
      padding: 2px 8px;
      display: inline-block;
      color: var(--primary);
      align-self: flex-start;
      margin-top: 4px;
    }

    .footer {
      text-align: center;
      padding: 20px 0 10px 0;
      color: var(--subtext);
      font-size: 14px;
      opacity: 0.7;
      letter-spacing: 1px;
      font-weight: 300;
      width: 100%;
      max-width: 600px;
    }

    .footer span {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 500;
    }

    .page-empty {
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--subtext);
      font-size: 16px;
      opacity: 0.4;
    }

    @media (max-width: 640px) {
      body {
        padding: 12px;
      }
      .app {
        max-width: 100%;
      }
      .hero h1 {
        font-size: 22px;
      }
      textarea {
        min-height: 80px;
        font-size: 12px;
      }
      canvas {
        height: 80px;
      }
      .footer {
        font-size: 12px;
        padding: 15px 0 5px 0;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 头部 -->
    <div class="hero">
      <h1>UI 模板</h1>
      <p>初见原创 UI</p>
    </div>

    <!-- 标签 -->
    <div class="tabs">
      <button class="tab-btn active" data-page="page1">标签一</button>
      <button class="tab-btn" data-page="page2">标签二</button>
    </div>

    <!-- ============================================================ -->
    <!-- 页面一 -->
    <!-- ============================================================ -->
    <div id="page1" class="page active">

      <!-- 分类一：输入区 -->
      <div class="card">
        <div class="card-label">。<span>分类一</span> · 说明一</div>
        <textarea>内容一</textarea>
      </div>

      <!-- 分类二：可视化 -->
      <div class="card">
        <div class="card-label">。<span>分类二</span> · 说明二</div>
        <canvas width="800" height="100"></canvas>
      </div>

      <!-- 分类三：控制按钮 -->
      <div class="card">
        <div class="card-label">。<span>分类三</span> · 说明三</div>
        <div class="controls">
          <button class="btn">按钮一</button>
          <button class="btn disabled">按钮二</button>
          <select>
            <option>选项一</option>
            <option selected>选项二</option>
          </select>
          <span>滑杆一<input type="range" min="0" max="100" value="35" /></span>
          <span class="info">信息一</span>
        </div>
      </div>

      <!-- 分类四：功能按钮 -->
      <div class="card">
        <div class="card-label">。<span>分类四</span> · 说明四</div>
        <div class="flex-row">
          <label>标签一 <input type="number" value="10" /> 标签二</label>
          <button class="btn">功能一</button>
          <span class="badge">状态一</span>
        </div>
      </div>

      <!-- 分类五：状态反馈 -->
      <div class="card">
        <div class="card-label">。<span>分类五</span> · 说明五</div>
        <div class="error-text">提示一</div>
        <div class="success-text" style="margin-top:4px;">✅ 提示二</div>
      </div>

    </div>

    <!-- ============================================================ -->
    <!-- 页面二：完全留空 -->
    <!-- ============================================================ -->
    <div id="page2" class="page">
      <div class="card">
        <div class="page-empty">（空）</div>
      </div>
    </div>

  </div>

  <!-- 底部 -->
  <div class="footer">
    <span>by 初见.</span>
  </div>

  <script>
    const tabBtns = document.querySelectorAll('.tab-btn');
    const pages = {
      page1: document.getElementById('page1'),
      page2: document.getElementById('page2')
    };

    tabBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        tabBtns.forEach(b => b.classList.remove('active'));
        this.classList.add('active');

        const pageId = this.dataset.page;
        Object.values(pages).forEach(p => p.classList.remove('active'));
        pages[pageId].classList.add('active');
      });
    });
  </script>
</body>
</html>
