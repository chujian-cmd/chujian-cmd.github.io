<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 李峋的爱心代码 💖</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            font-family: 'Poppins', 'Microsoft YaHei', sans-serif;
            background: #0a0a0a;
            cursor: pointer;
            /* 点击任意位置触发音乐 */;
        }

        /* ===== 视频背景层 ===== */
        .banner {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .banner video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            pointer-events: none;
            /* 让点击穿透到 body */;
        }

        /* ===== 半透明遮罩（让文字更清晰） ===== */
        .banner::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1;
        }

        /* ===== 标题内容层 ===== */
        .banner .content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 0 20px;
        }

        .banner .content h1 {
            font-size: clamp(2.8rem, 12vw, 6rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 40px rgba(209, 16, 144, 0.6);
            position: relative;
            display: inline-block;
        }

        /* ===== 流动彩虹渐变伪元素 ===== */
        .banner .content h1::before {
            content: '✨ 李峋的爱心 ✨';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: transparent;
            background-image: linear-gradient(90deg,
                    #ff6b6b, #feca57, #48dbfb, #ff9ff3,
                    #54a0ff, #5f27cd, #ff6b6b);
            background-size: 300% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            animation: flowGradient 6s ease-in-out infinite alternate;
            clip-path: circle(80px at 0% 50%);
            -webkit-clip-path: circle(80px at 0% 50%);
        }

        /* ===== 动画：左右扫光 ===== */
        @keyframes flowGradient {
            0% {
                clip-path: circle(80px at 0% 50%);
                -webkit-clip-path: circle(80px at 0% 50%);
            }
            50% {
                clip-path: circle(80px at 100% 50%);
                -webkit-clip-path: circle(80px at 100% 50%);
            }
            100% {
                clip-path: circle(80px at 0% 50%);
                -webkit-clip-path: circle(80px at 0% 50%);
            }
        }

        /* ===== 底部小提示 ===== */
        .hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            letter-spacing: 2px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 20px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: opacity 0.8s ease;
            user-select: none;
            pointer-events: none;
        }

        .hint.hidden {
            opacity: 0;
        }

        /* ===== 响应式微调 ===== */
        @media (max-width: 600px) {
            .banner .content h1::before {
                clip-path: circle(40px at 0% 50%);
                -webkit-clip-path: circle(40px at 0% 50%);
            }
            @keyframes flowGradient {
                0% {
                    clip-path: circle(40px at 0% 50%);
                    -webkit-clip-path: circle(40px at 0% 50%);
                }
                50% {
                    clip-path: circle(40px at 100% 50%);
                    -webkit-clip-path: circle(40px at 100% 50%);
                }
                100% {
                    clip-path: circle(40px at 0% 50%);
                    -webkit-clip-path: circle(40px at 0% 50%);
                }
            }
        }
    </style>
</head>
<body>

    <!-- ===== 视频背景 ===== -->
    <div class="banner">
        <video autoplay muted loop playsinline>
            <!-- ★ 使用 Base64 内嵌的极简爱心动画（无需外部视频） ★ -->
            <source src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAAQxtZGF0AAAAMgAAACh3cnZrbG9n" type="video/mp4">
            <!-- 如果上面的内嵌视频无法播放，可尝试改为你的本地视频文件名 -->
            <!-- <source src="李峋的爱心代码.mp4" type="video/mp4"> -->
            你的浏览器不支持 HTML5 视频。
        </video>
        <div class="content">
            <h1></h1>
            <!-- h1 的内容由伪元素显示，此处留空 -->
        </div>
    </div>

    <!-- ===== 提示文字 ===== -->
    <div class="hint" id="hint">♡ 点击任意位置 · 聆听心动 ♡</div>

    <!-- ===== 音频（隐藏） ===== -->
    <audio id="bgMusic" loop preload="auto">
        <!-- ★ 替换成你喜欢的音乐链接（MP3格式） ★ -->
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        <!-- 备用：网易云外链（可能失效） -->
        <!-- <source src="http://music.163.com/song/media/outer/url?id=1963443271.mp3" type="audio/mpeg"> -->
        你的浏览器不支持音频元素。
    </audio>

    <script>
        (function() {
            'use strict';

            // ===== 获取元素 =====
            const audio = document.getElementById('bgMusic');
            const hint = document.getElementById('hint');

            // ===== 标记：是否已首次播放 =====
            let hasPlayed = false;

            // ===== 播放音乐的函数 =====
            function playMusic() {
                if (hasPlayed) return; // 已经播放过，不再重复触发

                audio.play()
                    .then(() => {
                        hasPlayed = true;
                        // 隐藏提示
                        hint.classList.add('hidden');
                        console.log('🎵 音乐已开始播放');
                    })
                    .catch((err) => {
                        // 如果自动播放被浏览器阻止，提示用户手动操作
                        console.warn('⚠️ 自动播放被阻止，请手动点击页面:', err);
                        // 仍然允许用户通过点击触发
                    });
            }

            // ===== 监听全局点击 =====
            document.addEventListener('click', playMusic, { once: false });

            // ===== 如果用户触摸了屏幕（移动端兼容） =====
            document.addEventListener('touchstart', playMusic, { once: false });

            // ===== 页面加载完成后，尝试自动播放（部分浏览器允许） =====
            window.addEventListener('load', function() {
                // 延迟一点点，确保 DOM 完全渲染
                setTimeout(() => {
                    // 尝试自动播放（静音视频不受限制，音频可能被拦截）
                    audio.play()
                        .then(() => {
                            hasPlayed = true;
                            hint.classList.add('hidden');
                            console.log('🎵 自动播放成功');
                        })
                        .catch(() => {
                            console.log('⏳ 等待用户点击以播放音乐');
                            // 显示提示，让用户点击
                            hint.classList.remove('hidden');
                        });
                }, 300);
            });

            // ===== 当音频播放结束后，重新播放（循环） =====
            audio.addEventListener('ended', function() {
                this.currentTime = 0;
                this.play().catch(() => {});
            });

            // ===== 音量控制（可选） =====
            audio.volume = 0.6; // 设置音量为 60%

            console.log('💖 李峋的爱心代码已加载，点击页面播放音乐！');
        })();
    </script>

</body>
</html>
