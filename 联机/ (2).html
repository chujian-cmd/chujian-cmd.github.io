<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>联机控制灯 · 自动探测</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #111; min-height: 100vh; display: flex;
            justify-content: center; align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 16px; margin: 0;
        }
        .card {
            background: #1e1e1e; border-radius: 48px; padding: 36px 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 0 2px #2a2a2a inset;
            width: 100%; max-width: 440px; text-align: center;
        }
        h1 {
            font-size: 1.7rem; font-weight: 500; letter-spacing: 1px;
            color: #ddd; margin-bottom: 8px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .sub { color: #777; font-size: 0.9rem; margin-bottom: 32px; border-bottom: 1px solid #333; padding-bottom: 16px; }
        .lamp {
            margin: 20px auto; width: 200px; height: 200px; border-radius: 50%;
            background: #2a2a2a;
            box-shadow: 0 0 0 12px #1a1a1a, 0 0 40px 8px rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
            transition: background 0.3s, box-shadow 0.4s;
        }
        .lamp.on { background: #ffdd44; box-shadow: 0 0 0 12px #1a1a1a, 0 0 60px 20px rgba(255,220,80,0.7); }
        .bulb-icon { font-size: 5rem; line-height: 1; filter: drop-shadow(0 0 12px rgba(255,255,180,0.8)); transition: filter 0.3s, transform 0.2s; }
        .lamp.on .bulb-icon { filter: drop-shadow(0 0 30px #fff9b0) brightness(1.4); transform: scale(1.02); }
        .status-badge {
            display: inline-block; background: #2a2a2a; color: #bbb;
            padding: 8px 20px; border-radius: 40px; font-size: 0.95rem;
            font-weight: 500; margin: 16px 0 8px; border: 1px solid #3a3a3a;
            transition: all 0.2s;
        }
        .status-badge.on { background: #2c3e2f; color: #b3ffb3; border-color: #4a7a4a; }
        button {
            background: #2d2d2d; border: none; color: white;
            padding: 18px 36px; font-size: 1.4rem; font-weight: 600;
            border-radius: 80px; cursor: pointer; margin: 24px 0 12px;
            width: 100%; letter-spacing: 0.5px;
            box-shadow: 0 10px 0 #0a0a0a, 0 8px 20px rgba(0,0,0,0.5);
            transition: transform 0.08s, box-shadow 0.12s, background 0.2s;
            -webkit-tap-highlight-color: transparent; touch-action: manipulation;
            border: 1px solid #444;
        }
        button:active {
            transform: translateY(6px);
            box-shadow: 0 4px 0 #0a0a0a, 0 8px 18px rgba(0,0,0,0.5);
            background: #3d3d3d;
        }
        .hint {
            font-size: 0.8rem; color: #666; margin-top: 16px;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .sync-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #3a7a3a; display: inline-block;
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.6; transform: scale(0.9); }
        }
        .player-tag {
            color: #888; font-size: 0.8rem; background: #222;
            padding: 6px 14px; border-radius: 30px;
            display: inline-block; margin-top: 8px; border: 1px solid #333;
            word-break: break-all;
        }
        .conn-indicator {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 0.7rem; color: #888; margin-top: 6px;
        }
        .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #666; transition: background 0.2s; }
        .conn-dot.connected { background: #3a7a3a; }
        .conn-dot.scanning { background: #aa8800; }
    </style>
</head>
<body>
    <div class="card">
        <h1><span>💡</span> 联机控制灯</h1>
        <div class="sub">自动探测服务器 · 实时同步</div>

        <div class="lamp" id="lamp">
            <div class="bulb-icon">💡</div>
        </div>

        <div class="status-badge" id="statusBadge">灯是关着的</div>
        <button id="toggleBtn">切换灯</button>

        <div class="hint">
            <span class="sync-dot"></span> 双方操作实时同步
        </div>
        <div class="player-tag" id="playerTag">正在探测服务器...</div>
        <div class="conn-indicator">
            <span class="conn-dot" id="connDot"></span>
            <span id="connText">探测中...</span>
        </div>
    </div>

    <script>
        (function() {
            const PORT = 8765;                  // 服务器端口，与 server.py 一致
            const STORAGE_KEY = 'lamp_server_url';

            let ws = null;
            let reconnectTimer = null;
            let scanTimer = null;
            let isConnected = false;
            let currentServerUrl = null;

            const lampDiv = document.getElementById('lamp');
            const statusBadge = document.getElementById('statusBadge');
            const toggleBtn = document.getElementById('toggleBtn');
            const connDot = document.getElementById('connDot');
            const connText = document.getElementById('connText');
            const playerTag = document.getElementById('playerTag');

            // ---------- UI ----------
            function updateUI(isOn) {
                if (isOn) {
                    lampDiv.classList.add('on');
                    statusBadge.classList.add('on');
                    statusBadge.textContent = '💡 灯是开着的';
                } else {
                    lampDiv.classList.remove('on');
                    statusBadge.classList.remove('on');
                    statusBadge.textContent = '灯是关着的';
                }
            }

            function setState(state, text) {
                connDot.classList.remove('connected', 'scanning');
                if (state === 'connected') connDot.classList.add('connected');
                else if (state === 'scanning') connDot.classList.add('scanning');
                connText.textContent = text;
            }

            // ---------- 连接 ----------
            function tryConnect(url, isScan = false) {
                return new Promise((resolve) => {
                    let settled = false;
                    let socket;
                    try {
                        socket = new WebSocket(url);
                    } catch (e) {
                        resolve(null);
                        return;
                    }

                    const timeout = setTimeout(() => {
                        if (!settled) {
                            settled = true;
                            try { socket.close(); } catch(e) {}
                            resolve(null);
                        }
                    }, isScan ? 1500 : 3000); // 扫描时超时更短

                    socket.onopen = () => {
                        if (settled) return;
                        settled = true;
                        clearTimeout(timeout);
                        resolve(socket);
                    };

                    socket.onerror = () => {
                        if (settled) return;
                        settled = true;
                        clearTimeout(timeout);
                        try { socket.close(); } catch(e) {}
                        resolve(null);
                    };

                    socket.onclose = () => {
                        if (settled) return;
                        settled = true;
                        clearTimeout(timeout);
                        resolve(null);
                    };
                });
            }

            // ---------- 生成候选地址 ----------
            function getCandidateUrls() {
                const urls = [];

                // 1. 上次成功的地址
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) urls.push(saved);

                // 2. 当前页面的 host（如果 HTML 和服务器在同一台机器上，这个最靠谱）
                if (location.hostname && location.hostname !== 'localhost') {
                    urls.push(`ws://${location.hostname}:${PORT}`);
                }

                // 3. 常见网段扫描
                const subnets = [
                    '192.168.0', '192.168.1', '192.168.2', '192.168.3',
                    '192.168.4', '192.168.5', '192.168.10', '192.168.31',
                    '10.0.0', '10.0.1', '10.0.2', '10.0.3',
                    '172.16.0', '172.16.1', '172.16.2'
                ];
                for (const subnet of subnets) {
                    for (let i = 1; i <= 254; i++) {
                        urls.push(`ws://${subnet}.${i}:${PORT}`);
                    }
                }

                // 去重
                return [...new Set(urls)];
            }

            // ---------- 扫描并连接 ----------
            async function scanAndConnect() {
                if (isConnected) return;
                setState('scanning', '正在扫描局域网...');
                playerTag.textContent = '正在扫描局域网，请稍候...';

                const urls = getCandidateUrls();
                const total = urls.length;
                let scanned = 0;

                // 分批并发扫描，每批 30 个
                const BATCH = 30;
                for (let i = 0; i < urls.length; i += BATCH) {
                    if (isConnected) return;
                    const batch = urls.slice(i, i + BATCH);
                    const results = await Promise.all(
                        batch.map(url => tryConnect(url, true))
                    );
                    scanned += batch.length;
                    playerTag.textContent = `正在扫描局域网... ${scanned}/${total}`;

                    for (const socket of results) {
                        if (socket) {
                            // 找到了！取消其他扫描
                            if (isConnected) {
                                try { socket.close(); } catch(e) {}
                                return;
                            }
                            // 使用这个连接
                            const url = socket.url;
                            currentServerUrl = url;
                            localStorage.setItem(STORAGE_KEY, url);
                            setupConnection(socket);
                            return;
                        }
                    }
                }

                // 全部扫完没找到
                setState('disconnected', '未找到服务器，重试中...');
                playerTag.textContent = '未找到服务器，请确认 Termux 已启动 server.py';
                scheduleReconnect();
            }

            // ---------- 使用已建立的连接 ----------
            function setupConnection(socket) {
                ws = socket;
                isConnected = true;
                setState('connected', '已连接');
                playerTag.textContent = `已连接: ${currentServerUrl}`;
                console.log('已连接:', currentServerUrl);

                ws.onmessage = (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.type === 'init' || msg.type === 'state') {
                            updateUI(msg.state);
                        }
                    } catch (e) {}
                };

                ws.onclose = () => {
                    isConnected = false;
                    setState('disconnected', '断开，重连中...');
                    playerTag.textContent = '连接断开，正在重新探测...';
                    currentServerUrl = null;
                    scheduleReconnect();
                };

                ws.onerror = () => {
                    isConnected = false;
                };
            }

            // ---------- 重连 ----------
            function scheduleReconnect() {
                if (reconnectTimer) clearTimeout(reconnectTimer);
                reconnectTimer = setTimeout(() => {
                    // 如果之前连上过，先尝试保存的地址
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        tryConnect(saved).then(socket => {
                            if (socket) {
                                currentServerUrl = saved;
                                setupConnection(socket);
                            } else {
                                scanAndConnect();
                            }
                        });
                    } else {
                        scanAndConnect();
                    }
                }, 2000);
            }

            // ---------- 切换灯 ----------
            toggleBtn.addEventListener('click', () => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'toggle' }));
                }
            });

            // ---------- 初始化 ----------
            updateUI(false);
            setState('scanning', '探测中...');

            // 先尝试上次的地址，如果没有就扫描
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                tryConnect(saved).then(socket => {
                    if (socket) {
                        currentServerUrl = saved;
                        setupConnection(socket);
                    } else {
                        scanAndConnect();
                    }
                });
            } else {
                scanAndConnect();
            }

            window.addEventListener('beforeunload', () => {
                if (ws) ws.close();
                if (reconnectTimer) clearTimeout(reconnectTimer);
                if (scanTimer) clearTimeout(scanTimer);
            });
        })();
    </script>
</body>
</html>
