<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG 合集 · 极简</title>
<style>
  :root{
    --bg:#fafafa;
    --card:#ffffff;
    --text:#171717;
    --muted:#a3a3a3;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:48px 24px 96px;
  }
  header{max-width:1200px;margin:0 auto 48px;}
  h1{font-size:22px;font-weight:600;letter-spacing:-0.02em;margin-bottom:8px;}
  .sub{font-size:13px;color:var(--muted);margin-bottom:24px;}
  nav{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;}
  nav a{color:var(--muted);text-decoration:none;transition:color .15s;}
  nav a:hover{color:var(--text);}
  section{max-width:1200px;margin:0 auto 56px;}
  h2{
    font-size:12px;font-weight:500;text-transform:uppercase;
    letter-spacing:0.12em;color:var(--muted);
    margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid #ececec;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(88px,1fr));
    gap:12px;
  }
  .item{
    background:var(--card);border:1px solid #f0f0f0;border-radius:var(--radius);
    aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:border-color .15s, transform .15s;position:relative;
  }
  .item:hover{border-color:#e0e0e0;transform:translateY(-1px);}
  .item svg{width:26px;height:26px;color:#404040;transition:color .15s;pointer-events:none;}
  .item:hover svg{color:#000;}
  .toast{
    position:fixed;bottom:24px;left:50%;
    transform:translateX(-50%) translateY(10px);
    background:#000;color:#fff;font-size:12px;padding:8px 16px;
    border-radius:999px;opacity:0;pointer-events:none;
    transition:opacity .2s, transform .2s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

<header>
  <h1>SVG 合集</h1>

  </nav>
</header>

const toast = document.getElementById('toast');
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toast.classList.remove('show'), 1200);
}

document.querySelectorAll('.grid').forEach(grid=>{
  const cat = grid.dataset.cat;
  const list = DATA[cat] || [];
  list.forEach(svg=>{
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = svg;
    div.addEventListener('click', async ()=>{
      try{
        await navigator.clipboard.writeText(svg);
        showToast('已复制 SVG');
      }catch(e){
        showToast('复制失败，请手动选择');
      }
    });
    grid.appendChild(div);
  });
});
</script>
