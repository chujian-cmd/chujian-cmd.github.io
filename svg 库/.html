<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG 合集 · 极简</title>
<style>
  :root{
    --bg:#fafafa;
    --card:#ffffff;
    --line:#d4d4d4;
    --text:#171717;
    --muted:#a3a3a3;
    --hover:#000000;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:48px 24px 96px;
  }
  header{
    max-width:1200px;
    margin:0 auto 48px;
  }
  h1{
    font-size:22px;
    font-weight:600;
    letter-spacing:-0.02em;
    margin-bottom:8px;
  }
  .sub{
    font-size:13px;
    color:var(--muted);
    margin-bottom:24px;
  }
  nav{
    display:flex;
    flex-wrap:wrap;
    gap:8px 20px;
    font-size:13px;
  }
  nav a{
    color:var(--muted);
    text-decoration:none;
    transition:color .15s;
  }
  nav a:hover{color:var(--text);}

  section{
    max-width:1200px;
    margin:0 auto 56px;
  }
  h2{
    font-size:12px;
    font-weight:500;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:var(--muted);
    margin-bottom:20px;
    padding-bottom:10px;
    border-bottom:1px solid #ececec;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(88px,1fr));
    gap:12px;
  }
  .item{
    background:var(--card);
    border:1px solid #f0f0f0;
    border-radius:var(--radius);
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:border-color .15s, transform .15s;
    position:relative;
  }
  .item:hover{
    border-color:#e0e0e0;
    transform:translateY(-1px);
  }
  .item svg{
    width:26px;
    height:26px;
    color:#404040;
    transition:color .15s;
    pointer-events:none;
  }
  .item:hover svg{color:#000;}
  .item.copied::after{
    content:"已复制";
    position:absolute;
    bottom:6px;
    left:50%;
    transform:translateX(-50%);
    font-size:9px;
    color:#000;
    background:#fff;
    padding:1px 4px;
    border-radius:4px;
    white-space:nowrap;
  }
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(10px);
    background:#000;
    color:#fff;
    font-size:12px;
    padding:8px 16px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<header>
  <h1>SVG 合集</h1>
  <p class="sub">极简 · 混合风格 · 点击复制代码</p>
  <nav>
    <a href="#linear">线性</a>
    <a href="#solid">实心</a>
    <a href="#geo">几何</a>
    <a href="#arrows">箭头</a>
    <a href="#weather">天气</a>
    <a href="#ui">界面</a>
    <a href="#symbols">符号</a>
    <a href="#social">社交</a>
    <a href="#files">文件</a>
  </nav>
</header>

<!-- 线性 -->
<section id="linear">
  <h2>线性</h2>
  <div class="grid" data-cat="linear"></div>
</section>

<!-- 实心 -->
<section id="solid">
  <h2>实心</h2>
  <div class="grid" data-cat="solid"></div>
</section>

<!-- 几何 -->
<section id="geo">
  <h2>几何</h2>
  <div class="grid" data-cat="geo"></div>
</section>

<!-- 箭头 -->
<section id="arrows">
  <h2>箭头</h2>
  <div class="grid" data-cat="arrows"></div>
</section>

<!-- 天气 -->
<section id="weather">
  <h2>天气</h2>
  <div class="grid" data-cat="weather"></div>
</section>

<!-- 界面 -->
<section id="ui">
  <h2>界面</h2>
  <div class="grid" data-cat="ui"></div>
</section>

<!-- 符号 -->
<section id="symbols">
  <h2>符号</h2>
  <div class="grid" data-cat="symbols"></div>
</section>

<!-- 社交 -->
<section id="social">
  <h2>社交</h2>
  <div class="grid" data-cat="social"></div>
</section>

<!-- 文件 -->
<section id="files">
  <h2>文件</h2>
  <div class="grid" data-cat="files"></div>
</section>

<div class="toast" id="toast">已复制 SVG</div>

<script>
const S = (inner, opts={}) => {
  const stroke = opts.fill ? 'none' : 'currentColor';
  const fill = opts.fill ? 'currentColor' : 'none';
  const sw = opts.sw || 1.5;
  return `<svg viewBox="0 0 24 24" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
};

/* ---------- 线性 ---------- */
const linear = [
  // 基础
  S('<circle cx="12" cy="12" r="9"/>'),
  S('<rect x="4" y="4" width="16" height="16" rx="2"/>'),
  S('<path d="M12 3l9 16H3z"/>'),
  S('<path d="M12 3l2.5 5.5L20 10l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-1.5z"/>'),
  S('<path d="M4 12h16M12 4v16"/>'),
  S('<path d="M5 12l4 4L19 6"/>'),
  S('<path d="M6 6l12 12M18 6L6 18"/>'),
  S('<path d="M12 5v14M5 12h14"/>'),
  S('<circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/>'),
  S('<path d="M4 7h16M4 12h16M4 17h16"/>'),

  // 用户
  S('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'),
  S('<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><path d="M16 4a3 3 0 010 6"/><path d="M18 20c0-2-1-3.5-3-4.5"/>'),
  S('<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>'),

  // 通信
  S('<path d="M4 5h16v11H8l-4 4z"/>'),
  S('<path d="M3 6h18v12H3z"/><path d="M3 6l9 7 9-7"/>'),
  S('<path d="M4 6h16v12H4z"/><path d="M8 10h8M8 14h5"/>'),
  S('<path d="M12 3a6 6 0 00-6 6v4l-2 3h16l-2-3V9a6 6 0 00-6-6z"/><path d="M10 19a2 2 0 004 0"/>'),

  // 媒体
  S('<path d="M5 4l14 8-14 8z"/>'),
  S('<rect x="4" y="6" width="16" height="12" rx="2"/><path d="M10 9l5 3-5 3z"/>'),
  S('<path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/>'),
  S('<path d="M12 3v18M8 7v10M16 7v10M4 10v4M20 10v4"/>'),

  // 编辑
  S('<path d="M4 20h4l10-10-4-4L4 16z"/><path d="M13 7l4 4"/>'),
  S('<path d="M5 4h14v16H5z"/><path d="M9 4v16"/>'),
  S('<path d="M4 7h16M4 12h10M4 17h13"/>'),
  S('<path d="M6 4h12v16l-6-4-6 4z"/>'),

  // 设备
  S('<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/>'),
  S('<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>'),
  S('<rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9 4V2h6v2"/>'),
  S('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
];
