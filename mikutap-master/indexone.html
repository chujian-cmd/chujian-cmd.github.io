  <script>
  (function () {
    var table = {
      'data/main/main.json': 'mk-data-main',
      'data/track/track.json': 'mk-data-track'
    };
    function inlineFor(url) {
      var key = String(url == null ? '' : url)
        .replace(/^[a-z]+:\/\/[^\/]*/i, '')
        .replace(/[?#].*$/, '')
        .replace(/^\.\//, '')
        .replace(/^\/+/, '');
      var id = table[key];
      if (!id) return null;
      var el = document.getElementById(id);
      return el ? el.textContent : null;
    }
    function blobURL(text) {
      return URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    }
    var _open = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function (method, url) {
      var text = inlineFor(url);
      if (text !== null) {
        var a = Array.prototype.slice.call(arguments);
        a[1] = blobURL(text);
        return _open.apply(this, a);
      }
      return _open.apply(this, arguments);
    };
    if (window.fetch) {
      var _fetch = window.fetch;
      window.fetch = function (input, init) {
        var url = (typeof input === 'string') ? input : ((input && input.url) || '');
        var text = inlineFor(url);
        if (text !== null) {
          return Promise.resolve(new Response(text, {
            status: 200,
            headers: { 'Content-Type': 'application/json' }
          }));
        }
        return _fetch.call(this, input, init);
      };
    }
  })();
  </script>
