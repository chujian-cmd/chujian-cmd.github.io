  (function () {

        .replace(/^\/+/, '');

      if (text !== null) {

        a[1] = blobURL(text);
        return _open.apply(this, a);
      }
      return _open.apply(this, arguments);

            headers: { 'Content-Type': 'application/json' }
          }));
        }
        return _fetch.call(this, input, init);
      };
    }
  })();
