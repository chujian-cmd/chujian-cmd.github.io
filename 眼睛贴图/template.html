<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>眼睛贴图</title>
<style>
  body{font-family:sans-serif;padding:16px;background:#f0f0f0;max-width:720px;margin:0 auto}
  canvas{max-width:100%;border:1px solid #ccc;background:#fff;display:block;margin:10px 0}
  button,input{margin:6px 0;padding:8px 16px;font-size:16px}
  #log{color:#666;font-size:13px;white-space:pre-wrap;margin-top:8px}
  #stickerBox{position:fixed;bottom:10px;left:10px;background:#fff;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:12px}
  #stickerBox img{width:48px;vertical-align:middle;margin-left:6px}
</style>
</head>
<body>
<h2>眼睛贴图</h2>
<input type="file" id="file" accept="image/*">
<canvas id="canvas"></canvas>
<button id="download" disabled>下载结果</button>
<div id="log">等待选图…</div>
<div id="stickerBox">贴纸:<img id="stickerPreview"></div>

<script src="./ort.min.js"></script>
<script>
// ===== 内嵌资源（占位符，稍后替换） =====
const MODEL_B64   = "__MODEL_B64__";
const STICKER_B64 = "__STICKER_B64__";
const INPUT_SIZE  = 640;
const CONF_THRESH = 0.9;
const IOU_THRESH  = 0.3;

const log = m => document.getElementById("log").textContent = m;
let stickerImg = null, session = null;

// base64 → Uint8Array
function b64ToBytes(b64){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return arr;
}

// base64 → Image
function b64ToImage(b64){
  return new Promise((res,rej)=>{
    const img = new Image();
    img.onload=()=>res(img);
    img.onerror=rej;
    img.src="data:image/png;base64,"+b64;
  });
}

// 模型初始化
async function initModel(){
  log("加载模型…");
  ort.env.wasm.wasmPaths = "./";
  session = await ort.InferenceSession.create(b64ToBytes(MODEL_B64), {executionProviders:["wasm"]});
  stickerImg = await b64ToImage(STICKER_B64);
  document.getElementById("stickerPreview").src = stickerImg.src;
  log("就绪，请选图");
}

// 图片 → 归一化张量 [1,3,640,640]
function imgToTensor(img){
  const c = document.createElement("canvas");
  c.width=INPUT_SIZE; c.height=INPUT_SIZE;
  const ctx=c.getContext("2d");
  ctx.drawImage(img,0,0,INPUT_SIZE,INPUT_SIZE);
  const d=ctx.getImageData(0,0,INPUT_SIZE,INPUT_SIZE).data;
  const f=new Float32Array(3*INPUT_SIZE*INPUT_SIZE);
  const N=INPUT_SIZE*INPUT_SIZE;
  for(let i=0;i<N;i++){
    f[i]     = d[i*4];
    f[i+N]   = d[i*4+1];
    f[i+N*2] = d[i*4+2];
  }
  return new ort.Tensor("float32", f, [1,3,INPUT_SIZE,INPUT_SIZE]);
}

// 后处理
function decode(out){
  const strides=[8,16,32];
  const boxes=[], scores=[], kpss=[];
  for(const s of strides){
    const cls=out["cls_"+s].data, obj=out["obj_"+s].data;
    const bbox=out["bbox_"+s].data, kps=out["kps_"+s].data;
    const fw=INPUT_SIZE/s, N=cls.length;
    for(let idx=0; idx<N; idx++){
      const sc=Math.sqrt(Math.max(0,Math.min(1,cls[idx]))*Math.max(0,Math.min(1,obj[idx])));
      if(sc<CONF_THRESH) continue;
      const row=Math.floor(idx/fw), col=idx%fw;
      const cx=(col+bbox[idx*4])*s, cy=(row+bbox[idx*4+1])*s;
      const w=Math.exp(bbox[idx*4+2])*s, h=Math.exp(bbox[idx*4+3])*s;
      boxes.push([cx-w/2,cy-h/2,cx+w/2,cy+h/2]);
      scores.push(sc);
      const kp=[];
      for(let k=0;k<5;k++){
        kp.push([(col+kps[idx*10+k*2])*s, (row+kps[idx*10+k*2+1])*s]);
      }
      kpss.push(kp);
    }
  }
  return {boxes,scores,kpss};
}

function nms(boxes,scores,thr){
  const idx=scores.map((_,i)=>i).sort((a,b)=>scores[b]-scores[a]);
  const keep=[];
  while(idx.length){
    const i=idx.shift(); keep.push(i);
    for(let j=idx.length-1;j>=0;j--){
      const k=idx[j];
      const x1=Math.max(boxes[i][0],boxes[k][0]);
      const y1=Math.max(boxes[i][1],boxes[k][1]);
      const x2=Math.min(boxes[i][2],boxes[k][2]);
      const y2=Math.min(boxes[i][3],boxes[k][3]);
      const inter=Math.max(0,x2-x1)*Math.max(0,y2-y1);
      const ai=(boxes[i][2]-boxes[i][0])*(boxes[i][3]-boxes[i][1]);
      const ak=(boxes[k][2]-boxes[k][0])*(boxes[k][3]-boxes[k][1]);
      if(inter/(ai+ak-inter)>thr) idx.splice(j,1);
    }
  }
  return keep;
}

// 主流程
document.getElementById("file").onchange = async e => {
  const file=e.target.files[0];
  if(!file) return;
  const img=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=URL.createObjectURL(file);});

  log("推理中…");
  const tensor=imgToTensor(img);
  const feeds={};
  feeds[session.inputNames[0]]=tensor;
  const out=await session.run(feeds);

  const {boxes,scores,kpss}=decode(out);
  if(!boxes.length){ log("未检测到人脸"); return; }
  const keep=nms(boxes,scores,IOU_THRESH);

  // 画到 canvas
  const canvas=document.getElementById("canvas");
  canvas.width=img.width; canvas.height=img.height;
  const ctx=canvas.getContext("2d");
  ctx.drawImage(img,0,0);

  const sx=img.width/INPUT_SIZE, sy=img.height/INPUT_SIZE;
  for(const i of keep){
    const kp=kpss[i];
    const rEye=[kp[0][0]*sx, kp[0][1]*sy];
    const lEye=[kp[1][0]*sx, kp[1][1]*sy];
    const cx=(rEye[0]+lEye[0])/2, cy=(rEye[1]+lEye[1])/2;
    const dx=rEye[0]-lEye[0], dy=rEye[1]-lEye[1];
    const angle=Math.atan2(dy,dx);
    const dist=Math.hypot(dx,dy);

    const tw=dist*1.6;
    const th=tw*stickerImg.height/stickerImg.width;
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(angle);
    ctx.drawImage(stickerImg, -tw/2, -th/2, tw, th);
    ctx.restore();
  }

  log("完成，共 "+keep.length+" 张脸");
  document.getElementById("download").disabled=false;
};

// 下载
document.getElementById("download").onclick=()=>{
  const a=document.createElement("a");
  a.download="output.png";
  a.href=document.getElementById("canvas").toDataURL("image/png");
  a.click();
};

initModel().catch(e=>log("出错: "+e.message));
</script>
</body>
</html>
