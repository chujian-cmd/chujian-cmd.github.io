<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>实时眼睛贴图</title>
<style>
  body{font-family:sans-serif;padding:8px;background:#111;color:#eee;margin:0}
  #wrap{position:relative;display:inline-block}
  video,canvas{display:block;max-width:100%;border-radius:8px}
  #log{font-size:12px;color:#aaa;margin:6px 0;white-space:pre-wrap}
  button{padding:8px 16px;font-size:15px;margin:6px 4px 0 0}
</style>
</head>
<body>
<h3>实时眼睛贴图</h3>
<button id="start">开启摄像头</button>
<button id="stop" disabled>停止</button>
<div id="log">未开始</div>
<div id="wrap">
  <video id="video" autoplay playsinline muted style="display:none"></video>
  <canvas id="canvas"></canvas>
</div>

<script src="./ort.min.js"></script>
<script>
const MODEL_B64   = "__MODEL_B64__";
const STICKER_B64 = "__STICKER_B64__";
const INPUT_SIZE  = 640;
const CONF_THRESH = 0.9;
const IOU_THRESH  = 0.3;
const STICKER_SCALE = 2.2;   // 贴纸大小系数

const log = m => document.getElementById("log").textContent = m;
let stickerImg = null, session = null, running = false;

function b64ToBytes(b64){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return arr;
}
function b64ToImage(b64){
  return new Promise((res,rej)=>{
    const img = new Image();
    img.onload=()=>res(img);
    img.onerror=rej;
    img.src="data:image/png;base64,"+b64;
  });
}

async function initModel(){
  log("加载模型…");
  ort.env.wasm.wasmPaths = "./";
  session = await ort.InferenceSession.create(b64ToBytes(MODEL_B64), {executionProviders:["wasm"]});
  stickerImg = await b64ToImage(STICKER_B64);
  log("模型就绪");
}

function imgToTensor(img, w, h){
  const c = document.createElement("canvas");
  c.width=INPUT_SIZE; c.height=INPUT_SIZE;
  const ctx=c.getContext("2d");
  ctx.drawImage(img,0,0,w,h,0,0,INPUT_SIZE,INPUT_SIZE);
  const d=ctx.getImageData(0,0,INPUT_SIZE,INPUT_SIZE).data;
  const f=new Float32Array(3*INPUT_SIZE*INPUT_SIZE);
  const N=INPUT_SIZE*INPUT_SIZE;
  for(let i=0;i<N;i++){
    f[i]=d[i*4]; f[i+N]=d[i*4+1]; f[i+N*2]=d[i*4+2];
  }
  return new ort.Tensor("float32", f, [1,3,INPUT_SIZE,INPUT_SIZE]);
}

function decode(out){
  const strides=[8,16,32];
  const boxes=[], scores=[], kpss=[];
  for(const s of strides){
    const cls=out["cls_"+s].data, obj=out["obj_"+s].data;
    const bbox=out["bbox_"+s].data, kps=out["kps_"+s].data;
    const fw=INPUT_SIZE/s, N=cls.length;
    for(let idx=0; idx<N; idx++){
      const sc=Math.sqrt(Math.max(0,Math.min(1,cls[idx]))*Math.max(0,Math.min(1,obj[idx])));
      if(sc<CONF_THRESH) continue;
      const row=Math.floor(idx/fw), col=idx%fw;
      const cx=(col+bbox[idx*4])*s, cy=(row+bbox[idx*4+1])*s;
      const w=Math.exp(bbox[idx*4+2])*s, h=Math.exp(bbox[idx*4+3])*s;
      boxes.push([cx-w/2,cy-h/2,cx+w/2,cy+h/2]);
      scores.push(sc);
      const kp=[];
      for(let k=0;k<5;k++) kp.push([(col+kps[idx*10+k*2])*s, (row+kps[idx*10+k*2+1])*s]);
      kpss.push(kp);
    }
  }
  return {boxes,scores,kpss};
}

function nms(boxes,scores,thr){
  const idx=scores.map((_,i)=>i).sort((a,b)=>scores[b]-scores[a]);
  const keep=[];
  while(idx.length){
    const i=idx.shift(); keep.push(i);
    for(let j=idx.length-1;j>=0;j--){
      const k=idx[j];
      const x1=Math.max(boxes[i][0],boxes[k][0]);
      const y1=Math.max(boxes[i][1],boxes[k][1]);
      const x2=Math.min(boxes[i][2],boxes[k][2]);
      const y2=Math.min(boxes[i][3],boxes[k][3]);
      const inter=Math.max(0,x2-x1)*Math.max(0,y2-y1);
      const ai=(boxes[i][2]-boxes[i][0])*(boxes[i][3]-boxes[i][1]);
      const ak=(boxes[k][2]-boxes[k][0])*(boxes[k][3]-boxes[k][1]);
      if(inter/(ai+ak-inter)>thr) idx.splice(j,1);
    }
  }
  return keep;
}

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

async function loop(){
  if(!running) return;
  if(video.readyState < 2){ requestAnimationFrame(loop); return; }

  const vw = video.videoWidth, vh = video.videoHeight;
  canvas.width = vw; canvas.height = vh;

  const t0 = performance.now();
  const tensor = imgToTensor(video, vw, vh);
  const feeds = {};
  feeds[session.inputNames[0]] = tensor;
  const out = await session.run(feeds);
  const {boxes,scores,kpss} = decode(out);
  const keep = boxes.length ? nms(boxes,scores,IOU_THRESH) : [];

  ctx.drawImage(video,0,0,vw,vh);
  const sx = vw/INPUT_SIZE, sy = vh/INPUT_SIZE;
  for(const i of keep){
    const kp = kpss[i];
    const rEye=[kp[0][0]*sx, kp[0][1]*sy];
    const lEye=[kp[1][0]*sx, kp[1][1]*sy];
    const cx=(rEye[0]+lEye[0])/2, cy=(rEye[1]+lEye[1])/2;
    const dx=rEye[0]-lEye[0], dy=rEye[1]-lEye[1];
    const angle=Math.atan2(dy,dx);
    const dist=Math.hypot(dx,dy);
    const tw=dist*STICKER_SCALE;
    const th=tw*stickerImg.height/stickerImg.width;
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(angle);
    ctx.drawImage(stickerImg, -tw/2, -th/2, tw, th);
    ctx.restore();
  }

  const dt = performance.now()-t0;
  log(`脸:${keep.length}  耗时:${dt.toFixed(0)}ms  ~${(1000/dt).toFixed(1)}FPS`);
  requestAnimationFrame(loop);
}

document.getElementById("start").onclick = async () => {
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: 640, height: 480 }
    });
    video.srcObject = stream;
    await video.play();
    running = true;
    document.getElementById("start").disabled = true;
    document.getElementById("stop").disabled = false;
    loop();
  }catch(e){ log("摄像头失败: "+e.message); }
};

document.getElementById("stop").onclick = () => {
  running = false;
  const s = video.srcObject;
  if(s) s.getTracks().forEach(t=>t.stop());
  video.srcObject = null;
  document.getElementById("start").disabled = false;
  document.getElementById("stop").disabled = true;
  log("已停止");
};

initModel().catch(e=>log("初始化出错: "+e.message));
</script>
</body>
</html>
