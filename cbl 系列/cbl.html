<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>灵动魔方 · 形态跃迁</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 30% 30%, #1a2533, #080d13);
      touch-action: none; /* 禁止浏览器默认手势，提升触摸体验 */
    }
    #info {
      position: fixed;
      top: 24px;
      right: 24px;
      background: rgba(10, 18, 28, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 8px 24px;
      border-radius: 40px;
      color: #eef5ff;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.8px;
      border: 1px solid rgba(255, 255, 250, 0.25);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      pointer-events: none;
      z-index: 100;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    @media (max-width: 600px) {
      #info {
        top: 16px;
        right: 16px;
        font-size: 12px;
        padding: 6px 18px;
      }
    }
    .instruction-hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 30, 42, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ccddee;
      padding: 6px 20px;
      border-radius: 30px;
      font-size: 13px;
      white-space: nowrap;
      border: 1px solid rgba(255,255,240,0.2);
      z-index: 100;
      pointer-events: none;
      opacity: 0.85;
    }
    @media (max-width: 600px) {
      .instruction-hint {
        font-size: 11px;
        padding: 5px 16px;
        bottom: 20px;
      }
    }
  </style>
</head>
<body>
  <div id="info">⬡ 立方体</div>
  <div class="instruction-hint">拖动旋转 | 滚轮变形 | 双击螺旋 | 中键复位</div>

  <!-- 引入 Three.js 核心库以及扩展 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // ---------- 初始化场景、相机、渲染器 ----------
    const scene = new THREE.Scene();
    scene.background = null; // 透明，由CSS渐变背景呈现
    
    // 主渲染器 (WebGL)
    const renderer = new THREE.WebGLRenderer({ 
      antialias: true, 
      alpha: true 
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 限制过高像素比以防性能问题
    renderer.setClearColor(0x000000, 0);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);
    
    // 辅助CSS2渲染器用于显示文字标签（优雅）
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0px';
    labelRenderer.domElement.style.left = '0px';
    labelRenderer.domElement.style.pointerEvents = 'none'; // 让点击穿透
    document.body.appendChild(labelRenderer.domElement);
    
    // 相机
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(4, 2.5, 5);
    camera.lookAt(0, 0, 0);
    
    // 控制器 (实现拖拽旋转、缩放等)
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.8;
    controls.zoomSpeed = 1.2;
    controls.panSpeed = 0.7;
    controls.target.set(0, 0, 0);
    controls.update();
    controls.minDistance = 2.8;
    controls.maxDistance = 12;
    controls.maxPolarAngle = Math.PI; // 允许任意角度
    controls.enablePan = false; // 禁用平移保持焦点
    
    // ---------- 灯光系统 (营造立体光泽) ----------
    // 环境光提供基础亮度
    const ambientLight = new THREE.AmbientLight(0x404066);
    scene.add(ambientLight);
    
    // 主光源方向光，产生阴影和立体感
    const dirLight1 = new THREE.DirectionalLight(0xfff5e6, 1.1);
    dirLight1.position.set(1, 3, 2);
    dirLight1.castShadow = true;
    dirLight1.receiveShadow = true;
    dirLight1.shadow.mapSize.width = 512;
    dirLight1.shadow.mapSize.height = 512;
    dirLight1.shadow.camera.near = 0.5;
    dirLight1.shadow.camera.far = 20;
    dirLight1.shadow.camera.left = -5;
    dirLight1.shadow.camera.right = 5;
    dirLight1.shadow.camera.top = 5;
    dirLight1.shadow.camera.bottom = -5;
    scene.add(dirLight1);
    
    // 补光，从背面和底部增加色彩层次
    const dirLight2 = new THREE.DirectionalLight(0xccddff, 0.9);
    dirLight2.position.set(-2, -0.5, -2);
    scene.add(dirLight2);
    
    const backLight = new THREE.PointLight(0x4466aa, 0.6);
    backLight.position.set(-1.5, 0.8, -2.2);
    scene.add(backLight);
    
    // 一个点光源在内部产生辉光感 (但物体内部看不到，用于反射)
    const fillLight = new THREE.PointLight(0xaaccff, 0.5);
    fillLight.position.set(0.5, -0.3, 1.2);
    scene.add(fillLight);
    
    // ---------- 创建核心魔方组 ----------
    const cubeGroup = new THREE.Group();
    scene.add(cubeGroup);
    
    // 当前形态索引与名称
    const shapes = [
      { name: '⬡ 完美立方', scale: new THREE.Vector3(1, 1, 1) },
      { name: '▯ 电影宽屏', scale: new THREE.Vector3(1.9, 0.68, 0.68) },
      { name: '▯ 羽翼薄片', scale: new THREE.Vector3(1.4, 1.35, 0.28) },
      { name: '▮ 摩天立柱', scale: new THREE.Vector3(0.62, 1.92, 0.62) },
      { name: '◧ 浮空石板', scale: new THREE.Vector3(1.58, 0.45, 1.58) },
      { name: '◨ 光之棱柱', scale: new THREE.Vector3(0.56, 0.56, 1.95) },
      { name: '⬚ 超薄晶元', scale: new THREE.Vector3(1.68, 1.68, 0.2) },
      { name: '◫ 优雅长砖', scale: new THREE.Vector3(2.05, 0.58, 0.58) }
    ];
    let currentShapeIndex = 0;
    
    // 存储六个面的材质引用，以便动态更新颜色或效果
    const faceMaterials = [];
    
    // 创建圆角立方体效果：通过多个平面组合或者使用BoxGeometry配合边缘高光。
    // 这里使用标准BoxGeometry，但为每个面赋予不同颜色的半透明材质，并添加边框效果。
    const geometry = new THREE.BoxGeometry(1, 1, 1);
    
    // 定义六种高级配色：柔白、淡蓝、暖杏、冰紫、薄荷、粉灰
    const colors = [
      new THREE.Color('#f8f9fc'), // 前
      new THREE.Color('#e6ecf8'), // 后
      new THREE.Color('#fff6ed'), // 右
      new THREE.Color('#eaf0ff'), // 左
      new THREE.Color('#fff3e0'), // 上
      new THREE.Color('#e4ebf5')  // 下
    ];
    
    // 为每个面创建材质
    for (let i = 0; i < 6; i++) {
      const material = new THREE.MeshStandardMaterial({
        color: colors[i],
        roughness: 0.28,
        metalness: 0.15,
        transparent: true,
        opacity: 0.92,
        emissive: new THREE.Color(0x000000),
        side: THREE.DoubleSide // 双面渲染以便在薄片形态时看到内部边缘
      });
      faceMaterials.push(material);
    }
    
    const cube = new THREE.Mesh(geometry, faceMaterials);
    cube.castShadow = true;
    cube.receiveShadow = true;
    cubeGroup.add(cube);
    
    // 添加精致的边框线框，提升科技感
    const edgesGeometry = new THREE.EdgesGeometry(geometry);
    const lineMaterial = new THREE.LineBasicMaterial({ 
      color: 0x2c4052, 
      linewidth: 1, // WebGL渲染器通常不支持宽度 >1，但视觉效果足够
      transparent: true,
      opacity: 0.45
    });
    const wireframe = new THREE.LineSegments(edgesGeometry, lineMaterial);
    cube.add(wireframe);
    
    // 内部微光粒子 (围绕中心点缀)
    const particleGeo = new THREE.BufferGeometry();
    const particleCount = 18;
    const particlePositions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i += 3) {
      particlePositions[i] = (Math.random() - 0.5) * 1.2;
      particlePositions[i+1] = (Math.random() - 0.5) * 1.2;
      particlePositions[i+2] = (Math.random() - 0.5) * 1.2;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    const particleMat = new THREE.PointsMaterial({
      color: 0xd4e0ff,
      size: 0.025,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      transparent: true,
      opacity: 0.7
    });
    const particles = new THREE.Points(particleGeo, particleMat);
    cube.add(particles);
    
    // UI元素更新
    const infoDiv = document.getElementById('info');
    
    // 应用形态
    function applyShape(index, animate = true) {
      const shape = shapes[index];
      if (!shape) return;
      currentShapeIndex = index;
      infoDiv.textContent = shape.name;
      
      const targetScale = shape.scale;
      
      if (animate) {
        // 简单动画过渡缩放
        const startScale = cube.scale.clone();
        const duration = 280;
        const startTime = performance.now();
        
        function animateScale(now) {
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1.0);
          // 缓出函数
          const easeOut = 1 - Math.pow(1 - progress, 2.5);
          cube.scale.lerpVectors(startScale, targetScale, easeOut);
          
          if (progress < 1) {
            requestAnimationFrame(animateScale);
          } else {
            cube.scale.copy(targetScale);
          }
        }
        requestAnimationFrame(animateScale);
      } else {
        cube.scale.copy(targetScale);
      }
      
      // 触发视觉脉冲：短暂改变发光属性
      faceMaterials.forEach(mat => {
        mat.emissive.set(0x332211);
        mat.emissiveIntensity = 0.25;
      });
      setTimeout(() => {
        faceMaterials.forEach(mat => {
          mat.emissive.set(0x000000);
          mat.emissiveIntensity = 0;
        });
      }, 200);
    }
    
    // 初始化默认立方体
    applyShape(0, false);
    
    // ---------- 交互逻辑 ----------
    // 滚轮切换形态
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY;
      if (delta > 0) {
        currentShapeIndex = (currentShapeIndex + 1) % shapes.length;
      } else {
        currentShapeIndex = (currentShapeIndex - 1 + shapes.length) % shapes.length;
      }
      applyShape(currentShapeIndex, true);
      
      // 创建波纹反馈 (CSS动画)
      createRipple(e.clientX, e.clientY);
    }, { passive: false });
    
    // 双击螺旋动画
    renderer.domElement.addEventListener('dblclick', (event) => {
      event.stopPropagation();
      triggerSpinAnimation();
      createRipple(event.clientX, event.clientY, true);
    });
    
    // 中键重置视角和形态
    renderer.domElement.addEventListener('auxclick', (event) => {
      if (event.button === 1) {
        event.preventDefault();
        resetToDefault();
        createRipple(event.clientX, event.clientY, true);
      }
    });
    
    // 点击波纹 (左键单击)
    renderer.domElement.addEventListener('click', (event) => {
      // 避免与双击冲突，简单处理：只触发波纹
      createRipple(event.clientX, event.clientY, false);
    });
    
    // 禁止右键菜单
    renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
    
    // 螺旋动画状态
    let isSpinning = false;
    let spinAnimationId = null;
    
    function triggerSpinAnimation() {
      if (isSpinning) return;
      isSpinning = true;
      
      const startRotation = cube.rotation.y;
      const targetRotation = startRotation + Math.PI * 2.8;
      const duration = 750;
      const startTime = performance.now();
      
      function spin(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1.0);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        cube.rotation.y = startRotation + (targetRotation - startRotation) * easeOut;
        // 轻微上下浮动
        cube.rotation.x = Math.sin(progress * Math.PI) * 0.12;
        
        if (progress < 1) {
          spinAnimationId = requestAnimationFrame(spin);
        } else {
          cube.rotation.y = targetRotation % (Math.PI * 2);
          cube.rotation.x = 0;
          isSpinning = false;
          spinAnimationId = null;
          // 归一化角度
        }
      }
      spinAnimationId = requestAnimationFrame(spin);
    }
    
    function resetToDefault() {
      if (isSpinning) {
        if (spinAnimationId) cancelAnimationFrame(spinAnimationId);
        isSpinning = false;
      }
      // 重置形态为立方体
      applyShape(0, true);
      // 重置相机视角
      camera.position.set(4, 2.5, 5);
      controls.target.set(0, 0, 0);
      controls.update();
      cube.rotation.set(0, 0, 0);
    }
    
    // 波纹特效 (CSS)
    function createRipple(clientX, clientY, small = false) {
      const ripple = document.createElement('div');
      ripple.style.position = 'fixed';
      ripple.style.left = clientX + 'px';
      ripple.style.top = clientY + 'px';
      ripple.style.width = small ? '20px' : '28px';
      ripple.style.height = small ? '20px' : '28px';
      ripple.style.border = '2px solid rgba(255, 255, 240, 0.85)';
      ripple.style.borderRadius = '50%';
      ripple.style.transform = 'translate(-50%, -50%) scale(0)';
      ripple.style.opacity = '0.8';
      ripple.style.pointerEvents = 'none';
      ripple.style.zIndex = '1000';
      ripple.style.boxShadow = '0 0 12px rgba(255,240,160,0.5)';
      ripple.style.animation = 'rippleExpand 0.75s cubic-bezier(0.2, 0.9, 0.3, 1.1) forwards';
      document.body.appendChild(ripple);
      
      setTimeout(() => {
        ripple.remove();
      }, 800);
    }
    
    // 添加全局CSS动画
    const styleSheet = document.createElement("style");
    styleSheet.textContent = `
      @keyframes rippleExpand {
        0% { transform: translate(-50%, -50%) scale(0); opacity: 0.8; border-width: 3px; }
        40% { opacity: 0.5; }
        100% { transform: translate(-50%, -50%) scale(7); opacity: 0; border-width: 0.5px; }
      }
    `;
    document.head.appendChild(styleSheet);
    
    // 窗口大小调整
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    // 动画循环
    function animate() {
      requestAnimationFrame(animate);
      
      // 更新控制器
      controls.update();
      
      // 让内部粒子缓慢旋转
      if (particles) {
        particles.rotation.y += 0.0008;
        particles.rotation.x += 0.0004;
      }
      
      // 渲染主场景
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }
    
    animate();
    
    // 移动端触摸优化：避免拖动时页面滚动已在CSS处理(touch-action)
    console.log('✨ 灵动魔方已启动 — 拖拽旋转 | 滚轮变形 | 双击螺旋');
  </script>
</body>
</html>
