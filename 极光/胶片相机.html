<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>胶片相机 Film</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#08090d;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
  #bar{position:fixed;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 12px 12px;
    display:flex;gap:8px;align-items:center;background:linear-gradient(180deg,rgba(8,9,13,.85),rgba(8,9,13,0));
    z-index:10;pointer-events:none;font:13px -apple-system,"PingFang SC",sans-serif;color:#c3c9d4}
  #bar>*{pointer-events:auto}
  #bar .mode{flex:1;color:#8a8f98}
  #bar .mode b{color:#f7f8f8;font-weight:600}
  .btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.06);color:#f7f8f8;font:500 13px -apple-system,"PingFang SC",sans-serif;
    cursor:pointer;-webkit-user-select:none;user-select:none}
  .btn:active{background:rgba(255,255,255,.14)}
  .btn.pri{background:rgba(232,169,44,.24);border-color:rgba(232,169,44,.6);color:#ffeec8}
  #hint{position:fixed;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));text-align:center;
    color:#6a6f7a;font:12px -apple-system,"PingFang SC",sans-serif;pointer-events:none;z-index:10}

  #panel{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:14px 14px max(14px,env(safe-area-inset-bottom));
    background:rgba(14,15,22,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid rgba(255,255,255,.1);
    transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
    font:14px -apple-system,"PingFang SC",sans-serif;color:#eef1ff;
  }
  #panel.open{transform:translateY(0)}
  #panel label{display:block;font-size:11px;color:#8a8f98;margin-bottom:6px;letter-spacing:.4px}
  #panel .row{display:flex;gap:8px;align-items:flex-start}
  #panel textarea{
    flex:1;min-height:60px;max-height:160px;padding:9px 12px;border-radius:10px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
    color:#fff;font:14px -apple-system,"PingFang SC",sans-serif;outline:none;resize:none;
  }
  #panel textarea:focus{border-color:rgba(232,169,44,.7)}
  #panel .ok{
    height:42px;padding:0 18px;border-radius:10px;border:1px solid rgba(232,169,44,.6);
    background:rgba(232,169,44,.3);color:#241800;font:600 14px -apple-system,"PingFang SC",sans-serif;
    cursor:pointer;
  }
  #panel .ok:active{background:rgba(232,169,44,.5)}
  #backdrop{position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .28s}
  #backdrop.open{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="bar">
  <div class="mode">胶片相机 <b id="m">人像柔肤</b></div>
  <button class="btn" id="btn-preset">换预设</button>
  <button class="btn" id="btn-text">换文字</button>
  <button class="btn pri" id="btn-custom">自定义</button>
</div>

<div id="hint">胶卷 LUT · 颗粒 · Halation · 漏光 · 暗角 · 日期戳</div>

<div id="backdrop"></div>
<div id="panel">
  <label>文字内容（支持换行）</label>
  <div class="row">
    <textarea id="inp" rows="2" spellcheck="false" placeholder="AURORA"></textarea>
    <button class="ok" id="btn-ok">确定</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');

  var CFG = {
    text: 'AURORA',
    weight: 900,
    font: '"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif',
    stock: 'portra',        // portra | superia | gold | bw | slide
    grain: 0.35,
    fade: 0.15,
    vignette: 0.35,
    leak: false,
    leakPos: 'tr',
    leakColor: '#ff5a2a',
    leakStrength: 0.5,
    frame: true,
    dateStamp: true,
    halation: 0.4,
    background: '#08090d'
  };

  // 胶卷风格参数
  var STOCKS = {
    portra:  { lift: [0.045,0.035,0.02], gain: [1,0.97,0.90], gamma: [1.06,1.02,0.96], s: 0.25, sat: 0.88 },
    superia: { lift: [0.02,0.045,0.035], gain: [1,0.98,0.94],  gamma: [1,1.07,0.98],   s: 0.38, sat: 1.05 },
    gold:    { lift: [0.06,0.04,0],      gain: [1,0.93,0.80],  gamma: [1.10,1.04,0.93], s: 0.30, sat: 1.06 },
    bw:      { lift: [0.01,0.01,0.01],   gain: [1,1,1],        gamma: [1,1,1],         s: 0.85, sat: 0 },
    slide:   { lift: [0,0,0],            gain: [1,1,0.97],     gamma: [1.03,1,0.97],   s: 0.60, sat: 1.32 }
  };

  var PRESETS = [
    { text: 'AURORA',  stock: 'portra',  grain: 0.18, fade: 0.12, vignette: 0.28, halation: 0.35, leak: false, frame: true,  dateStamp: false, background: '#08090d' },
    { text: '旅行',    stock: 'slide',   grain: 0.25, fade: 0.05, vignette: 0.4,  halation: 0.3,  leak: false, frame: false, dateStamp: true,  background: '#08090d' },
    { text: '街头',    stock: 'bw',      grain: 0.6,  fade: 0.08, vignette: 0.55, halation: 0.1,  leak: false, frame: false, dateStamp: false, background: '#08090d' },
    { text: '过期',    stock: 'gold',    grain: 0.55, fade: 0.65, vignette: 0.45, halation: 0.5,  leak: true,  leakPos: 'tr', leakColor: '#ff5a2a', leakStrength: 0.75, frame: false, dateStamp: true, background: '#08090d' },
    { text: 'NEON',    stock: 'superia', grain: 0.4,  fade: 0.2,  vignette: 0.5,  halation: 0.6,  leak: true,  leakPos: 'tl', leakColor: '#ff2fd6', leakStrength: 0.8, frame: false, dateStamp: false, background: '#08090d' }
  ];
  var presetIdx = 0;

  var W = 0, H = 0, dpr = 1;
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    if (!w || !h) return false;
    W = w; H = h;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dirty = true; sig = '';
    return true;
  }

  var dirty = true;
  var sig = '';

  // ---------- 掩膜 ----------
  var maskCanvas = document.createElement('canvas');
  var mctx = maskCanvas.getContext('2d', { willReadFrequently: true });
  var maskData = null;
  var maskKey = '';

  function buildMask() {
    if (!W || !H) return;
    var key = CFG.text + '|' + W + 'x' + H + '|' + CFG.weight + '|' + CFG.font;
    if (key === maskKey && maskData) return;
    maskKey = key;

    maskCanvas.width = W; maskCanvas.height = H;
    mctx.clearRect(0, 0, W, H);
    mctx.fillStyle = '#fff';
    mctx.textAlign = 'center';
    mctx.textBaseline = 'middle';

    var lines = CFG.text.split('\n').filter(function (l) { return l.length > 0; });
    if (!lines.length) { maskData = mctx.getImageData(0, 0, W, H).data; return; }

    var maxW = W * 0.88, maxH = H * 0.82;
    var lh = maxH / lines.length;
    var size = Math.floor(lh * 0.82);
    var setF = function (s) { mctx.font = CFG.weight + ' ' + s + 'px ' + CFG.font; };
    setF(size);

    var widest = 0;
    for (var i = 0; i < lines.length; i++) {
      var m = mctx.measureText(lines[i]).width;
      if (m > widest) widest = m;
    }
    if (widest > maxW) {
      size = Math.max(6, Math.floor(size * maxW / widest));
      setF(size);
    }
    var totalH = size * 1.15 * lines.length;
    if (totalH > maxH) {
      size = Math.max(6, Math.floor(size * maxH / totalH));
      setF(size);
    }
    var startY = H / 2 - (lines.length - 1) * size * 1.15 / 2;
    for (var j = 0; j < lines.length; j++) {
      mctx.fillText(lines[j], W / 2, startY + j * size * 1.15);
    }
    maskData = mctx.getImageData(0, 0, W, H).data;
  }

  function alphaAt(x, y) {
    if (!maskData) return 0;
    x = x | 0; y = y | 0;
    if (x < 0 || y < 0 || x >= W || y >= H) return 0;
    return maskData[(y * W + x) * 4 + 3] / 255;
  }

  // ---------- LUT 构建 ----------
  var lutR = new Uint8Array(256);
  var lutG = new Uint8Array(256);
  var lutB = new Uint8Array(256);
  var lutKey = '';

  function buildLUT(stock, fade) {
    var key = stock + '|' + fade.toFixed(3);
    if (key === lutKey) return;
    lutKey = key;
    var p = STOCKS[stock] || STOCKS.portra;
    var build = function (out, ch) {
      for (var i = 0; i < 256; i++) {
        var v = Math.pow(i / 255, 1 / p.gamma[ch]);
        // 平滑
        var sm = v * v * (3 - 2 * v);
        v += (sm - v) * p.s;
        // lift + gain
        v = p.lift[ch] + v * (p.gain[ch] - p.lift[ch]);
        // fade：抬黑压白
        v = v * (1 - 0.38 * fade) + 0.16 * fade;
        out[i] = Math.max(0, Math.min(255, Math.round(v * 255)));
      }
    };
    build(lutR, 0);
    build(lutG, 1);
    build(lutB, 2);
  }

  // ---------- Halation 小图 ----------
  var halCv = document.createElement('canvas');
  var halCtx = halCv.getContext('2d', { willReadFrequently: true });

  // ---------- 渲染 ----------
  function render() {
    if (!W || !H) { requestAnimationFrame(render); return; }
    buildMask();

    var key = W + 'x' + H + '@' + dpr + '|' + maskKey + '|' +
              CFG.stock + '|' + CFG.grain + '|' + CFG.fade + '|' +
              CFG.vignette + '|' + CFG.leak + '|' + CFG.leakPos + '|' +
              CFG.leakColor + '|' + CFG.leakStrength + '|' + CFG.frame + '|' +
              CFG.dateStamp + '|' + CFG.halation + '|' + CFG.background;

    if (dirty || key !== sig) {
      drawFrame(CFG);
      sig = key;
      dirty = false;
    }
    requestAnimationFrame(render);
  }

  function drawFrame(cfg) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = cfg.background;
    ctx.fillRect(0, 0, W, H);

    // 中间处理分辨率
    var maxSide = 720;
    var scale = Math.min(1, maxSide / Math.max(W * dpr, H * dpr));
    var pw = Math.max(2, Math.round(W * dpr * scale));
    var ph = Math.max(2, Math.round(H * dpr * scale));

    // 采样掩膜 → 明度
    var gray = new Float32Array(pw * ph);
    for (var y = 0; y < ph; y++) {
      for (var x = 0; x < pw; x++) {
        var sx = (x / pw) * W;
        var sy = (y / ph) * H;
        gray[y * pw + x] = alphaAt(sx, sy);
      }
    }

    // LUT
    buildLUT(cfg.stock, cfg.fade);
    var p = STOCKS[cfg.stock] || STOCKS.portra;
    var sat = p.sat * (1 - 0.45 * cfg.fade);
    var grainAmp = cfg.grain * 48;

    // Halation：只在亮部
    var halation = cfg.halation;

    // 像素处理
    var img = ctx.createImageData(pw, ph);
    var data = img.data;

    // 中心暗角
    var cx = pw / 2, cy = ph / 2;
    var maxR = Math.hypot(cx, cy);
    var vigAmt = cfg.vignette;

    // 漏光位置
    var leakPos = cfg.leakPos;
    var leakR = 0, leakG = 0, leakB = 0;
    if (cfg.leak) {
      var lc = hex2rgb(cfg.leakColor);
      leakR = lc[0]; leakG = lc[1]; leakB = lc[2];
    }
    var leakX = (leakPos === 'tl' || leakPos === 'bl') ? 0 : pw;
    var leakY = (leakPos === 'tl' || leakPos === 'tr') ? 0 : ph;
    var leakRadius = Math.max(pw, ph) * 0.8;

    for (var py = 0; py < ph; py++) {
      for (var px = 0; px < pw; px++) {
        var i = (py * pw + px);
        var o = i * 4;
        var lum = gray[i];

        // 1. 掩膜 → 灰度图（文字：暗底亮字？为了接近真实胶片，用亮底暗字反相也可以）
        // 这里用"字内亮"，因为胶片曝光是亮的
        var r = lum * 255;
        var g = lum * 255;
        var b = lum * 255;

        // 2. 上 LUT（转成"最终照片风格"）
        r = lutR[r | 0];
        g = lutG[g | 0];
        b = lutB[b | 0];

        // 3. 饱和度
        var lumAvg = 0.299 * r + 0.587 * g + 0.114 * b;
        r = lumAvg + (r - lumAvg) * sat;
        g = lumAvg + (g - lumAvg) * sat;
        b = lumAvg + (b - lumAvg) * sat;

        // 4. Halation：亮部溢出到周围的"红橙色光晕"
        // 近似做法：用当前亮度做局部 gaussian 太贵，用 lum 直接给亮部加红光
        if (halation > 0.01 && lum > 0.7) {
          var k = (lum - 0.7) / 0.3;
          var hk = k * halation * 1.8;
          r += 255 * hk * 0.35;
          g += 105 * hk * 0.35;
          b += 50  * hk * 0.35;
        }

        // 5. 颗粒：暗部颗粒更明显
        if (grainAmp > 0.3) {
          var gp = (hash21(px, py, 17) - 0.5) * 2 * grainAmp;
          var gk = 0.35 + 0.65 * (1 - lum);
          r += gp * gk;
          g += gp * gk;
          b += gp * gk;
        }

        // 6. 暗角
        if (vigAmt > 0.01) {
          var vx = px - cx, vy = py - cy;
          var vr = Math.hypot(vx, vy) / maxR;
          // 中心 0.35 半径内不压暗
          var vk = 1 - Math.max(0, (vr - 0.35) / 0.65) * vigAmt;
          r *= vk;
          g *= vk;
          b *= vk;
        }

        // 7. 漏光
        if (cfg.leak && cfg.leakStrength > 0.01) {
          var dxl = px - leakX;
          var dyl = py - leakY;
          var dr = Math.hypot(dxl, dyl);
          var leakFactor = Math.max(0, 1 - dr / leakRadius);
          leakFactor = leakFactor * leakFactor * cfg.leakStrength;
          r = 255 - ((255 - r) * (1 - leakFactor * 0.7));
          g = 255 - ((255 - g) * (1 - leakFactor * 0.55));
          b = 255 - ((255 - b) * (1 - leakFactor * 0.25));
          // 加暖色
          r += leakR * leakFactor * 0.35;
          g += leakG * leakFactor * 0.25;
          b += leakB * leakFactor * 0.15;
        }

        data[o] = clamp255(r);
        data[o + 1] = clamp255(g);
        data[o + 2] = clamp255(b);
        data[o + 3] = 255;
      }
    }

    // 写到临时画布
    var tmp = document.createElement('canvas');
    tmp.width = pw;
    tmp.height = ph;
    tmp.getContext('2d').putImageData(img, 0, 0);

    // 白边相框
    var frameMargin = 0;
    if (cfg.frame) {
      frameMargin = Math.min(W, H) * 0.055;
      ctx.fillStyle = '#f8f6f0';
      ctx.fillRect(0, 0, W, H);
    }

    var dx0 = frameMargin;
    var dy0 = frameMargin;
    var dw = W - frameMargin * 2;
    var dh = H - frameMargin * 2;

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(tmp, dx0, dy0, dw, dh);

    // 日期戳
    if (cfg.dateStamp) {
      var now = new Date();
      var stamp = ('0' + (now.getFullYear() % 100)).slice(-2) + ' ' +
                  (now.getMonth() + 1) + ' ' + now.getDate();
      var fs = Math.max(11, Math.min(dw, dh) * 0.045);
      ctx.font = 'bold ' + fs + 'px ui-monospace, "SF Mono", Menlo, monospace';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'bottom';
      ctx.save();
      ctx.shadowColor = 'rgba(255,120,20,0.85)';
      ctx.shadowBlur = fs * 0.6;
      ctx.fillStyle = '#ff9b2f';
      ctx.fillText(stamp, dx0 + dw - fs * 0.8, dy0 + dh - fs * 0.6);
      ctx.restore();
      ctx.textAlign = 'left';
    }
  }

  function clamp255(v) { return v < 0 ? 0 : v > 255 ? 255 : v; }
  function hash21(x, y, s) {
    var t = Math.sin(x * 127.1 + y * 311.7 + s * 0.37) * 43758.5453;
    return t - Math.floor(t);
  }
  function hex2rgb(h) {
    var s = h.replace('#', '');
    var n = parseInt(s.length === 3 ? s.split('').map(function (c) { return c + c; }).join('') : s, 16);
    return [n >> 16 & 255, n >> 8 & 255, n & 255];
  }

  // ---------- 按钮 ----------
  var mLabel = document.getElementById('m');
  document.getElementById('btn-preset').addEventListener('click', function () {
    presetIdx = (presetIdx + 1) % PRESETS.length;
    var p = PRESETS[presetIdx];
    for (var k in p) if (p.hasOwnProperty(k)) CFG[k] = p[k];
    mLabel.textContent = p.text;
    maskData = null; maskKey = '';
    lutKey = '';
    dirty = true;
  });

  var CONTENTS = [
    { text: 'AURORA' },
    { text: '胶片' },
    { text: 'FILM' },
    { text: '1984' },
    { text: 'PORTA\n400' },
    { text: '⚡' }
  ];
  var contentIdx = 0;
  document.getElementById('btn-text').addEventListener('click', function () {
    contentIdx = (contentIdx + 1) % CONTENTS.length;
    CFG.text = CONTENTS[contentIdx].text;
    maskData = null; maskKey = '';
    dirty = true;
  });

  // ---------- 自定义 ----------
  var panel = document.getElementById('panel');
  var backdrop = document.getElementById('backdrop');
  var inp = document.getElementById('inp');

  function openPanel() {
    inp.value = CFG.text;
    panel.classList.add('open');
    backdrop.classList.add('open');
    setTimeout(function () { inp.focus(); inp.select(); }, 320);
  }
  function closePanel() {
    panel.classList.remove('open');
    backdrop.classList.remove('open');
    inp.blur();
  }
  function confirmInput() {
    var v = inp.value;
    if (!v.replace(/\s/g, '').length) v = 'AURORA';
    CFG.text = v;
    maskData = null; maskKey = '';
    dirty = true;
  }

  document.getElementById('btn-custom').addEventListener('click', openPanel);
  document.getElementById('btn-ok').addEventListener('click', function () {
    confirmInput();
    closePanel();
  });
  backdrop.addEventListener('click', closePanel);
  inp.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); confirmInput(); closePanel(); }
  });
  inp.addEventListener('input', function () {
    inp.style.height = 'auto';
    inp.style.height = Math.min(160, inp.scrollHeight) + 'px';
  });

  // ---------- 启动 ----------
  function boot() {
    if (!resize()) { requestAnimationFrame(boot); return; }
    requestAnimationFrame(render);
  }
  boot();
  window.addEventListener('resize', function () { setTimeout(resize, 100); });
  window.addEventListener('orientationchange', function () { setTimeout(resize, 250); });
})();
</script>
</body>
</html>
