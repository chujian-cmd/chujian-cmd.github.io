<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>CRT 扫描线</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05060a;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
  #bar{position:fixed;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 12px 12px;
    display:flex;gap:8px;align-items:center;background:linear-gradient(180deg,rgba(5,6,10,.85),rgba(5,6,10,0));
    z-index:10;pointer-events:none;font:13px -apple-system,"PingFang SC",sans-serif;color:#c3c9d4}
  #bar>*{pointer-events:auto}
  #bar .mode{flex:1;color:#8a8f98}
  #bar .mode b{color:#f7f8f8;font-weight:600}
  .btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.06);color:#f7f8f8;font:500 13px -apple-system,"PingFang SC",sans-serif;
    cursor:pointer;-webkit-user-select:none;user-select:none}
  .btn:active{background:rgba(255,255,255,.14)}
  .btn.pri{background:rgba(63,169,255,.28);border-color:rgba(63,169,255,.6);color:#eaf5ff}
  #hint{position:fixed;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));text-align:center;
    color:#6a6f7a;font:12px -apple-system,"PingFang SC",sans-serif;pointer-events:none;z-index:10}

  #panel{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:14px 14px max(14px,env(safe-area-inset-bottom));
    background:rgba(14,15,22,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid rgba(255,255,255,.1);
    transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
    font:14px -apple-system,"PingFang SC",sans-serif;color:#eef1ff;
  }
  #panel.open{transform:translateY(0)}
  #panel label{display:block;font-size:11px;color:#8a8f98;margin-bottom:6px;letter-spacing:.4px}
  #panel .row{display:flex;gap:8px;align-items:flex-start}
  #panel textarea{
    flex:1;min-height:60px;max-height:160px;padding:9px 12px;border-radius:10px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
    color:#fff;font:14px -apple-system,"PingFang SC",sans-serif;outline:none;resize:none;
  }
  #panel textarea:focus{border-color:rgba(63,169,255,.7)}
  #panel .ok{
    height:42px;padding:0 18px;border-radius:10px;border:1px solid rgba(63,169,255,.6);
    background:rgba(63,169,255,.3);color:#fff;font:600 14px -apple-system,"PingFang SC",sans-serif;
    cursor:pointer;
  }
  #panel .ok:active{background:rgba(63,169,255,.5)}
  #backdrop{position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .28s}
  #backdrop.open{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="bar">
  <div class="mode">CRT 扫描线 <b id="m">经典彩监</b></div>
  <button class="btn" id="btn-preset">换预设</button>
  <button class="btn" id="btn-text">换文字</button>
  <button class="btn pri" id="btn-custom">自定义</button>
</div>

<div id="hint">弯曲屏面 · 扫描线 · RGB 偏移 · 暗角噪点</div>

<div id="backdrop"></div>
<div id="panel">
  <label>文字内容（支持换行）</label>
  <div class="row">
    <textarea id="inp" rows="2" spellcheck="false" placeholder="AURORA"></textarea>
    <button class="ok" id="btn-ok">确定</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');

  var CFG = {
    text: 'AURORA',
    weight: 900,
    font: '"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif',
    curve: 0.12,
    scan: 0.4,
    rgb: 0.8,
    vignette: 0.5,
    noise: 0.08,
    bright: 1.15,
    colorMode: 'mono',     // mono | green | amber
    colorA: '#eaf2ff',
    background: '#05060a'
  };

  var PRESETS = [
    { text: 'AURORA', colorMode: 'mono',  colorA: '#eaf2ff', curve: 0.16, scan: 0.5, rgb: 0.9, vignette: 0.6, noise: 0.1, bright: 1.15, background: '#05060a' },
    { text: 'GREEN',  colorMode: 'green', colorA: '#5bff96', curve: 0.14, scan: 0.55, rgb: 0.6, vignette: 0.55, noise: 0.12, bright: 1.2, background: '#02120a' },
    { text: 'AMBER',  colorMode: 'amber', colorA: '#ffb320', curve: 0.18, scan: 0.6, rgb: 0.7, vignette: 0.65, noise: 0.14, bright: 1.25, background: '#0a0600' },
    { text: 'VHS',    colorMode: 'mono',  colorA: '#eaf2ff', curve: 0.08, scan: 0.35, rgb: 1.6, vignette: 0.4, noise: 0.18, bright: 1.2, background: '#05060a' },
    { text: '故障',   colorMode: 'mono',  colorA: '#eaf2ff', curve: 0.2, scan: 0.6, rgb: 2.4, vignette: 0.7, noise: 0.3, bright: 1.1, background: '#05060a' }
  ];
  var presetIdx = 0;

  var W = 0, H = 0, dpr = 1;
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    if (!w || !h) return false;
    W = w; H = h;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buf.width = cv.width; buf.height = cv.height;
    bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dirty = true; sig = '';
    return true;
  }

  var buf = document.createElement('canvas');
  var bctx = buf.getContext('2d');
  var dirty = true;
  var sig = '';

  // ---------- 掩膜 ----------
  var maskCanvas = document.createElement('canvas');
  var mctx = maskCanvas.getContext('2d', { willReadFrequently: true });
  var maskData = null;
  var maskKey = '';

  function buildMask() {
    if (!W || !H) return;
    var key = CFG.text + '|' + W + 'x' + H + '|' + CFG.weight + '|' + CFG.font;
    if (key === maskKey && maskData) return;
    maskKey = key;

    maskCanvas.width = W; maskCanvas.height = H;
    mctx.clearRect(0, 0, W, H);
    mctx.fillStyle = '#fff';
    mctx.textAlign = 'center';
    mctx.textBaseline = 'middle';

    var lines = CFG.text.split('\n').filter(function (l) { return l.length > 0; });
    if (!lines.length) { maskData = mctx.getImageData(0, 0, W, H).data; return; }

    var maxW = W * 0.86, maxH = H * 0.78;
    var lh = maxH / lines.length;
    var size = Math.floor(lh * 0.82);
    var setF = function (s) { mctx.font = CFG.weight + ' ' + s + 'px ' + CFG.font; };
    setF(size);

    var widest = 0;
    for (var i = 0; i < lines.length; i++) {
      var m = mctx.measureText(lines[i]).width;
      if (m > widest) widest = m;
    }
    if (widest > maxW) {
      size = Math.max(6, Math.floor(size * maxW / widest));
      setF(size);
    }
    var totalH = size * 1.15 * lines.length;
    if (totalH > maxH) {
      size = Math.max(6, Math.floor(size * maxH / totalH));
      setF(size);
    }
    var startY = H / 2 - (lines.length - 1) * size * 1.15 / 2;
    for (var j = 0; j < lines.length; j++) {
      mctx.fillText(lines[j], W / 2, startY + j * size * 1.15);
    }
    maskData = mctx.getImageData(0, 0, W, H).data;
  }

  function alphaAt(x, y) {
    if (!maskData) return 0;
    x = x | 0; y = y | 0;
    if (x < 0 || y < 0 || x >= W || y >= H) return 0;
    return maskData[(y * W + x) * 4 + 3] / 255;
  }

  // 用双线性采样掩膜
  function alphaAtBilinear(x, y) {
    if (x < 0 || y < 0 || x >= W || y >= H) return 0;
    var x0 = x | 0, y0 = y | 0;
    var x1 = x0 + 1 < W ? x0 + 1 : x0;
    var y1 = y0 + 1 < H ? y0 + 1 : y0;
    var fx = x - x0, fy = y - y0;
    var a = alphaAt(x0, y0), b = alphaAt(x1, y0), c = alphaAt(x0, y1), d = alphaAt(x1, y1);
    return (a * (1 - fx) + b * fx) * (1 - fy) + (c * (1 - fx) + d * fx) * fy;
  }

  // ---------- 渲染 ----------
  var time = 0, lastT = performance.now();

  function render(now) {
    var dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;
    time += dt;

    if (!W || !H) { requestAnimationFrame(render); return; }
    buildMask();

    // 每帧都刷（因为噪点随时间变化）
    drawFrame(CFG, time);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.drawImage(buf, 0, 0, W, H);

    requestAnimationFrame(render);
  }

  function drawFrame(cfg, t) {
    var cw = W, ch = H;

    // 处理分辨率（限制长边）
    var maxSide = 720;
    var scale = Math.min(1, maxSide / Math.max(cw * dpr, ch * dpr));
    var pw = Math.max(2, Math.round(cw * dpr * scale));
    var ph = Math.max(2, Math.round(ch * dpr * scale));

    // 颜色
    var col;
    if (cfg.colorMode === 'green') col = [91, 255, 150];
    else if (cfg.colorMode === 'amber') col = [255, 179, 32];
    else col = hex2rgb(cfg.colorA);

    var bg = hex2rgb(cfg.background);

    var curve = cfg.curve;
    var scanAmp = cfg.scan;
    var rgbShift = cfg.rgb;
    var vignette = cfg.vignette;
    var noiseAmp = cfg.noise * 255;
    var bright = cfg.bright;

    var img = bctx.createImageData(pw, ph);
    var data = img.data;

    var cx = pw / 2, cy = ph / 2;
    // 归一化半径参考
    var halfDiag = Math.hypot(cx, cy);

    // 噪点种子（随时间变化）
    var noiseSeed = Math.floor(t * 24);

    for (var y = 0; y < ph; y++) {
      for (var x = 0; x < pw; x++) {
        // 桶形畸变：把屏幕坐标映射回源坐标
        var nx = (x - cx) / cx;
        var ny = (y - cy) / cy;
        var r2 = nx * nx + ny * ny;
        var k = 1 + curve * r2 * 2.2;
        var sxp = nx * k;
        var syp = ny * k;

        // 映射回源屏幕像素
        var sx = (sxp * cx + cx) / scale / dpr;
        var sy = (syp * cy + cy) / scale / dpr;

        var o = (y * pw + x) * 4;

        // 边界外：暗色
        if (sx < 0 || sy < 0 || sx >= W || sy >= H) {
          data[o] = bg[0] * 0.15;
          data[o + 1] = bg[1] * 0.15;
          data[o + 2] = bg[2] * 0.15;
          data[o + 3] = 255;
          continue;
        }

        // RGB 通道偏移
        var dx = rgbShift;
        var aR = alphaAtBilinear(sx + dx, sy);
        var aG = alphaAtBilinear(sx, sy);
        var aB = alphaAtBilinear(sx - dx, sy);

        // 三通道合成
        var r = col[0] * aR * bright;
        var g = col[1] * aG * bright;
        var b = col[2] * aB * bright;

        // 扫描线
        var sline = 0.5 + 0.5 * Math.sin(sy * dpr * 1.6);
        var scanMul = 1 - scanAmp * (1 - sline);
        r *= scanMul;
        g *= scanMul;
        b *= scanMul;

        // 荫罩（横向细纹）
        var mask = 0.5 + 0.5 * Math.sin(sx * dpr * Math.PI);
        var maskMul = 1 - scanAmp * 0.22 * (1 - mask);
        r *= maskMul;
        g *= maskMul;
        b *= maskMul;

        // 暗角
        var vr = Math.sqrt(r2) * 1.05;
        var vig = clamp01(1 - Math.max(0, vr - 0.35) * 1.6);
        vig = 1 - (1 - vig) * vignette;
        r *= vig;
        g *= vig;
        b *= vig;

        // 噪点
        if (noiseAmp > 0.5) {
          var nv = hash21(x, y, noiseSeed) - 0.5;
          var noise = nv * noiseAmp;
          r += noise;
          g += noise;
          b += noise;
        }

        data[o] = clamp255(r);
        data[o + 1] = clamp255(g);
        data[o + 2] = clamp255(b);
        data[o + 3] = 255;
      }
    }

    // 写到临时画布再放大
    var tmp = document.createElement('canvas');
    tmp.width = pw; tmp.height = ph;
    tmp.getContext('2d').putImageData(img, 0, 0);

    bctx.setTransform(1, 0, 0, 1, 0, 0);
    bctx.fillStyle = cfg.background;
    bctx.fillRect(0, 0, buf.width, buf.height);
    bctx.imageSmoothingEnabled = true;
    bctx.imageSmoothingQuality = 'high';
    bctx.drawImage(tmp, 0, 0, buf.width, buf.height);
    bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function hash21(x, y, seed) {
    var v = Math.sin(x * 12.9898 + y * 78.233 + seed * 0.13) * 43758.5453;
    return v - Math.floor(v);
  }
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function clamp255(v) { return v < 0 ? 0 : v > 255 ? 255 : v; }
  function hex2rgb(h) {
    var s = h.replace('#', '');
    var n = parseInt(s.length === 3 ? s.split('').map(function (c) { return c + c; }).join('') : s, 16);
    return [n >> 16 & 255, n >> 8 & 255, n & 255];
  }

  // ---------- 按钮 ----------
  var mLabel = document.getElementById('m');
  document.getElementById('btn-preset').addEventListener('click', function () {
    presetIdx = (presetIdx + 1) % PRESETS.length;
    var p = PRESETS[presetIdx];
    for (var k in p) if (p.hasOwnProperty(k)) CFG[k] = p[k];
    mLabel.textContent = p.text;
    maskData = null; maskKey = '';
    dirty = true;
  });

  var CONTENTS = [
    { text: 'AURORA' },
    { text: 'CRT' },
    { text: '1984' },
    { text: '扫描线' },
    { text: 'VHS\nPLAY' },
    { text: '⚡' }
  ];
  var contentIdx = 0;
  document.getElementById('btn-text').addEventListener('click', function () {
    contentIdx = (contentIdx + 1) % CONTENTS.length;
    CFG.text = CONTENTS[contentIdx].text;
    maskData = null; maskKey = '';
    dirty = true;
  });

  // ---------- 自定义 ----------
  var panel = document.getElementById('panel');
  var backdrop = document.getElementById('backdrop');
  var inp = document.getElementById('inp');

  function openPanel() {
    inp.value = CFG.text;
    panel.classList.add('open');
    backdrop.classList.add('open');
    setTimeout(function () { inp.focus(); inp.select(); }, 320);
  }
  function closePanel() {
    panel.classList.remove('open');
    backdrop.classList.remove('open');
    inp.blur();
  }
  function confirmInput() {
    var v = inp.value;
    if (!v.replace(/\s/g, '').length) v = 'AURORA';
    CFG.text = v;
    maskData = null; maskKey = '';
    dirty = true;
  }

  document.getElementById('btn-custom').addEventListener('click', openPanel);
  document.getElementById('btn-ok').addEventListener('click', function () {
    confirmInput();
    closePanel();
  });
  backdrop.addEventListener('click', closePanel);
  inp.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); confirmInput(); closePanel(); }
  });
  inp.addEventListener('input', function () {
    inp.style.height = 'auto';
    inp.style.height = Math.min(160, inp.scrollHeight) + 'px';
  });

  // ---------- 启动 ----------
  function boot() {
    if (!resize()) { requestAnimationFrame(boot); return; }
    requestAnimationFrame(render);
  }
  boot();
  window.addEventListener('resize', function () { setTimeout(resize, 100); });
  window.addEventListener('orientationchange', function () { setTimeout(resize, 250); });
})();
</script>
</body>
</html>
