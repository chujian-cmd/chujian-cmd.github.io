<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>星空星云 Star Nebula</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #03030a;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }

  #bar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: max(12px, env(safe-area-inset-top)) 12px 12px;
    display: flex; gap: 8px; align-items: center;
    background: linear-gradient(180deg, rgba(3,3,10,0.8), rgba(3,3,10,0));
    z-index: 10; pointer-events: none;
    font: 13px -apple-system, "PingFang SC", sans-serif;
    color: #c3c9d4;
  }
  #bar > * { pointer-events: auto; }
  #bar .mode { flex: 1; color: #8a8f98; }
  #bar .mode b { color: #f7f8f8; font-weight: 600; }

  .btn {
    height: 38px; padding: 0 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    color: #f7f8f8; font: 500 13px -apple-system, "PingFang SC", sans-serif;
    cursor: pointer; -webkit-user-select: none; user-select: none;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .btn:active { background: rgba(255,255,255,0.14); }
  .btn.pri { background: rgba(94,106,210,0.32); border-color: rgba(94,106,210,0.6); }

  #hint {
    position: fixed; left: 0; right: 0;
    bottom: max(20px, env(safe-area-inset-bottom));
    text-align: center; color: #6a6f7a;
    font: 12px -apple-system, "PingFang SC", sans-serif;
    pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="bar">
  <div class="mode">星云 <b id="m">玫瑰星云</b></div>
  <button class="btn" id="btn-reset">重置</button>
  <button class="btn pri" id="btn-change">换配色</button>
</div>

<div id="hint">拖动屏幕 = 改变飞行方向</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
              || (navigator.maxTouchPoints > 1);

// ---------- 参数 ----------
const CFG = {
  speed: 0.35,          // 飞行速度
  nebulaScale: 1.2,     // 星云缩放
  nebulaDensity: 0.8,   // 星云密度（层数）
  starDensity: 1.0,     // 星空密度
  starBright: 1.2,      // 星亮
  nebulaBright: 1.0,    // 星云亮度
  colorA: '#ff5ac8',    // 星云主色
  colorB: '#4b5fff',    // 星云副色
  colorStar: '#ffffff', // 星空色
  background: '#03030a'
};

const PIXEL_RATIO = isMobile ? 0.6 : 0.85;

const canvasEl = document.getElementById('cv');
const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: false });
renderer.setPixelRatio(PIXEL_RATIO);
renderer.setSize(innerWidth, innerHeight, false);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const vert = /* glsl */`
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = vec4(position.xy, 0.0, 1.0);
  }
`;

const frag = /* glsl */`
  precision highp float;
  varying vec2 vUv;

  uniform vec2  uResolution;
  uniform vec2  uMouse;
  uniform float uTime;
  uniform float uSpeed;
  uniform float uNebulaScale;
  uniform float uNebulaDensity;
  uniform float uStarDensity;
  uniform float uStarBright;
  uniform float uNebulaBright;
  uniform vec3  uColorA;
  uniform vec3  uColorB;
  uniform vec3  uColorStar;
  uniform vec3  uBackground;

  #define PI 3.14159265359
  #define TAU 6.28318530718

  // 2D 噪声（用于星云）
  float hash21(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }
  float noise2(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash21(i);
    float b = hash21(i + vec2(1.0, 0.0));
    float c = hash21(i + vec2(0.0, 1.0));
    float d = hash21(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
  }
  // 3D 噪声（用于 3D 星云）
  float hash31(vec3 p) {
    p = fract(p * vec3(0.1031, 0.1030, 0.0973));
    p += dot(p, p.yxz + 33.33);
    return fract((p.x + p.y) * p.z);
  }
  float noise3(vec3 p) {
    vec3 i = floor(p);
    vec3 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash31(i);
    float b = hash31(i + vec3(1,0,0));
    float c = hash31(i + vec3(0,1,0));
    float d = hash31(i + vec3(1,1,0));
    float e = hash31(i + vec3(0,0,1));
    float f1 = hash31(i + vec3(1,0,1));
    float g = hash31(i + vec3(0,1,1));
    float h = hash31(i + vec3(1,1,1));
    return mix(
      mix(mix(a, b, f.x), mix(c, d, f.x), f.y),
      mix(mix(e, f1, f.x), mix(g, h, f.x), f.y),
      f.z
    );
  }
  float fbm3(vec3 p, int octaves) {
    float s = 0.0, a = 0.5, f = 1.0;
    for (int i = 0; i < 6; i++) {
      if (i >= octaves) break;
      s += a * noise3(p * f);
      f *= 2.0;
      a *= 0.5;
    }
    return s;
  }

  // 星空：在球面上撒点
  float starfield(vec3 dir, float density) {
    vec3 p = dir * density * 14.0;
    vec3 i = floor(p);
    vec3 f = fract(p);
    float best = 0.0;
    for (int x = -1; x <= 1; x++) {
      for (int y = -1; y <= 1; y++) {
        for (int z = -1; z <= 1; z++) {
          vec3 g = vec3(float(x), float(y), float(z));
          vec3 cellId = i + g;
          float h1 = hash31(cellId);
          if (h1 < 0.85) continue;
          float h2 = hash31(cellId + 17.0);
          float h3 = hash31(cellId + 31.0);
          float h4 = hash31(cellId + 53.0);
          vec3 point = g + 0.5 + 0.5 * vec3(h2 - 0.5, h3 - 0.5, h4 - 0.5);
          float d = length(point - f);
          float s = smoothstep(0.08, 0.0, d);
          s *= 0.4 + 0.6 * hash31(cellId + 91.0);
          best = max(best, s);
        }
      }
    }
    return best;
  }

  void main() {
    vec2 uv = (vUv - 0.5) * 2.0;
    uv.x *= uResolution.x / uResolution.y;

    // 相机在空间中飞行
    float z = uTime * uSpeed;

    // 鼠标控制方向
    vec2 mouseOffset = (uMouse - 0.5) * 2.0;
    vec3 forward = normalize(vec3(mouseOffset.x * 0.5, mouseOffset.y * 0.5, 1.0));
    vec3 camPos = vec3(0.0, 0.0, z);

    // 构造相机坐标系
    vec3 worldUp = vec3(0.0, 1.0, 0.0);
    vec3 right = normalize(cross(worldUp, forward));
    vec3 up = cross(forward, right);

    // 屏幕像素 → 世界方向
    vec3 dir = normalize(forward + uv.x * right * 0.7 + uv.y * up * 0.7);

    // ---- 星云（沿光线穿过的体积） ----
    vec3 nebulaAccum = vec3(0.0);
    float nebulaAlpha = 0.0;
    const int STEPS = 24;
    float stepSize = 0.55;

    for (int i = 0; i < STEPS; i++) {
      float s = float(i) * stepSize + mod(uTime * uSpeed * 4.0, stepSize);
      vec3 p = camPos + dir * s;
      p *= uNebulaScale;

      // 3D fbm 星云密度
      float d = fbm3(p + vec3(0.0, 0.0, -z * uNebulaScale), int(uNebulaDensity * 4.0 + 2.0));
      d = smoothstep(0.4, 0.75, d);

      if (d > 0.01) {
        // 双色混合
        float t2 = fbm3(p * 1.7 + 33.0, 3);
        vec3 col = mix(uColorA, uColorB, t2);

        // 透明度累积
        float alpha = d * 0.08;
        nebulaAccum += col * alpha * (1.0 - nebulaAlpha) * uNebulaBright;
        nebulaAlpha += alpha * (1.0 - nebulaAlpha);
        if (nebulaAlpha > 0.98) break;
      }
    }

    // ---- 星空（远处球面） ----
    float star = starfield(normalize(dir), uStarDensity) * uStarBright;
    vec3 starCol = uColorStar * star;

    // 合成
    vec3 col = uBackground;
    col = mix(col, nebulaAccum, 1.0);
    col += starCol * (1.0 - nebulaAlpha * 0.5);

    // 色调映射
    col = col / (1.0 + col * 0.4);
    col = pow(max(col, 0.0), vec3(0.9));

    gl_FragColor = vec4(col, 1.0);
  }
`;

const material = new THREE.ShaderMaterial({
  vertexShader: vert,
  fragmentShader: frag,
  uniforms: {
    uResolution: { value: new THREE.Vector2(1, 1) },
    uMouse: { value: new THREE.Vector2(0.5, 0.5) },
    uTime: { value: 0 },
    uSpeed: { value: CFG.speed },
    uNebulaScale: { value: CFG.nebulaScale },
    uNebulaDensity: { value: CFG.nebulaDensity },
    uStarDensity: { value: CFG.starDensity },
    uStarBright: { value: CFG.starBright },
    uNebulaBright: { value: CFG.nebulaBright },
    uColorA: { value: new THREE.Color(CFG.colorA) },
    uColorB: { value: new THREE.Color(CFG.colorB) },
    uColorStar: { value: new THREE.Color(CFG.colorStar) },
    uBackground: { value: new THREE.Color(CFG.background) }
  }
});

const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
mesh.frustumCulled = false;
scene.add(mesh);

function resize() {
  const W = innerWidth;
  const H = innerHeight;
  renderer.setPixelRatio(PIXEL_RATIO);
  renderer.setSize(W, H, false);
  material.uniforms.uResolution.value.set(W * PIXEL_RATIO, H * PIXEL_RATIO);
}
resize();

const pointer = { x: 0.5, y: 0.5, targetX: 0.5, targetY: 0.5, down: false };
const rect = () => canvasEl.getBoundingClientRect();

const onDown = e => {
  const t = e.touches ? e.touches[0] : e;
  const r = rect();
  pointer.targetX = (t.clientX - r.left) / r.width;
  pointer.targetY = (t.clientY - r.top) / r.height;
  pointer.down = true;
  if (e.touches) e.preventDefault();
};
const onMove = e => {
  const t = e.touches ? e.touches[0] : e;
  const r = rect();
  pointer.targetX = (t.clientX - r.left) / r.width;
  pointer.targetY = (t.clientY - r.top) / r.height;
  if (e.touches) e.preventDefault();
};
const onUp = () => { pointer.down = false; };

canvasEl.addEventListener('touchstart', onDown, { passive: false });
canvasEl.addEventListener('touchmove', onMove, { passive: false });
canvasEl.addEventListener('touchend', onUp);
canvasEl.addEventListener('touchcancel', onUp);
canvasEl.addEventListener('mousedown', onDown);
canvasEl.addEventListener('mousemove', onMove);
canvasEl.addEventListener('mouseup', onUp);
canvasEl.addEventListener('mouseleave', onUp);

let startTime = performance.now();
function loop(now) {
  const t = (now - startTime) / 1000;
  pointer.x += (pointer.targetX - pointer.x) * 0.08;
  pointer.y += (pointer.targetY - pointer.y) * 0.08;

  const u = material.uniforms;
  u.uTime.value = t;
  u.uMouse.value.set(pointer.x, pointer.y);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

const mEl = document.getElementById('m');

const SCHEMES = [
  { name: '玫瑰星云', colorA: '#ff5ac8', colorB: '#4b5fff',
    colorStar: '#ffffff', background: '#03030a', nebulaScale: 1.2, nebulaDensity: 0.8 },
  { name: '马头星云', colorA: '#ff8a5c', colorB: '#3a0a5a',
    colorStar: '#ffe0c0', background: '#050210', nebulaScale: 1.0, nebulaDensity: 0.9 },
  { name: '深空蓝', colorA: '#3a5aff', colorB: '#0a0a3a',
    colorStar: '#ffffff', background: '#010104', nebulaScale: 1.4, nebulaDensity: 0.7 },
  { name: '猎户座', colorA: '#ff9d5c', colorB: '#7c3aff',
    colorStar: '#c0e0ff', background: '#040110', nebulaScale: 1.1, nebulaDensity: 1.0 },
  { name: '翡翠极光', colorA: '#4ecb8d', colorB: '#2a1a5a',
    colorStar: '#dff6ff', background: '#020508', nebulaScale: 1.0, nebulaDensity: 0.9 },
  { name: '黄金尘埃', colorA: '#ffd86b', colorB: '#8a2b5a',
    colorStar: '#ffffff', background: '#050201', nebulaScale: 1.3, nebulaDensity: 0.8 }
];
let schemeIdx = 0;

function applyScheme(s) {
  const u = material.uniforms;
  u.uColorA.value.set(s.colorA);
  u.uColorB.value.set(s.colorB);
  u.uColorStar.value.set(s.colorStar);
  u.uBackground.value.set(s.background);
  u.uNebulaScale.value = s.nebulaScale;
  u.uNebulaDensity.value = s.nebulaDensity;
}

document.getElementById('btn-reset').addEventListener('click', () => {
  startTime = performance.now();
  pointer.targetX = 0.5;
  pointer.targetY = 0.5;
});

document.getElementById('btn-change').addEventListener('click', () => {
  schemeIdx = (schemeIdx + 1) % SCHEMES.length;
  applyScheme(SCHEMES[schemeIdx]);
  mEl.textContent = SCHEMES[schemeIdx].name;
});

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

applyScheme(SCHEMES[0]);
mEl.textContent = SCHEMES[0].name;
requestAnimationFrame(loop);
</script>
</body>
</html>
