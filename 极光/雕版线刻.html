<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>雕版线刻 Engraving</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0c;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
  #bar{position:fixed;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 12px 12px;
    display:flex;gap:8px;align-items:center;background:linear-gradient(180deg,rgba(10,10,12,.85),rgba(10,10,12,0));
    z-index:10;pointer-events:none;font:13px -apple-system,"PingFang SC",sans-serif;color:#c3c9d4}
  #bar>*{pointer-events:auto}
  #bar .mode{flex:1;color:#8a8f98}
  #bar .mode b{color:#f7f8f8;font-weight:600}
  .btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.06);color:#f7f8f8;font:500 13px -apple-system,"PingFang SC",sans-serif;
    cursor:pointer;-webkit-user-select:none;user-select:none}
  .btn:active{background:rgba(255,255,255,.14)}
  .btn.pri{background:rgba(232,169,44,.24);border-color:rgba(232,169,44,.6);color:#ffeec8}
  #hint{position:fixed;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));text-align:center;
    color:#6a6f7a;font:12px -apple-system,"PingFang SC",sans-serif;pointer-events:none;z-index:10}

  #panel{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:14px 14px max(14px,env(safe-area-inset-bottom));
    background:rgba(14,15,22,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid rgba(255,255,255,.1);
    transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
    font:14px -apple-system,"PingFang SC",sans-serif;color:#eef1ff;
  }
  #panel.open{transform:translateY(0)}
  #panel label{display:block;font-size:11px;color:#8a8f98;margin-bottom:6px;letter-spacing:.4px}
  #panel .row{display:flex;gap:8px;align-items:flex-start}
  #panel textarea{
    flex:1;min-height:60px;max-height:160px;padding:9px 12px;border-radius:10px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
    color:#fff;font:14px -apple-system,"PingFang SC",sans-serif;outline:none;resize:none;
  }
  #panel textarea:focus{border-color:rgba(232,169,44,.7)}
  #panel .ok{
    height:42px;padding:0 18px;border-radius:10px;border:1px solid rgba(232,169,44,.6);
    background:rgba(232,169,44,.3);color:#241800;font:600 14px -apple-system,"PingFang SC",sans-serif;
    cursor:pointer;
  }
  #panel .ok:active{background:rgba(232,169,44,.5)}
  #backdrop{position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .28s}
  #backdrop.open{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="bar">
  <div class="mode">雕版线刻 <b id="m">铜版画</b></div>
  <button class="btn" id="btn-preset">换预设</button>
  <button class="btn" id="btn-text">换文字</button>
  <button class="btn pri" id="btn-custom">自定义</button>
</div>

<div id="hint">沿轮廓等距排线 · 暗粗亮细 · 交叉层</div>

<div id="backdrop"></div>
<div id="panel">
  <label>文字内容（支持换行）</label>
  <div class="row">
    <textarea id="inp" rows="2" spellcheck="false" placeholder="AURORA"></textarea>
    <button class="ok" id="btn-ok">确定</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');

  var CFG = {
    text: 'AURORA',
    weight: 900,
    font: '"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif',
    spacing: 6,
    direction: 'contour',
    crossLayers: 2,
    gain: 1,
    ink: '#1c1712',
    paper: '#efe7d2',
    background: '#101012'
  };

  var PRESETS = [
    { text: 'AURORA', direction: 'contour', crossLayers: 2, spacing: 6,   gain: 1,    ink: '#1c1712', paper: '#efe7d2', background: '#101012' },
    { text: '钞票',   direction: 'contour', crossLayers: 2, spacing: 4.5, gain: 1.15, ink: '#1c3a2a', paper: '#e9e4cf', background: '#0f120f' },
    { text: '铜版',   direction: 'contour', crossLayers: 3, spacing: 5,   gain: 1.25, ink: '#241a10', paper: '#efe6d0', background: '#0c0b09' },
    { text: '素描',   direction: 'diag',    crossLayers: 1, spacing: 4.5, gain: 0.9,  ink: '#2c2c33', paper: '#f4f2ec', background: '#101014' },
    { text: '丝印',   direction: 'wave',    crossLayers: 1, spacing: 6.5, gain: 1.35, ink: '#1b2a8a', paper: '#f0ede1', background: '#0d0f16' }
  ];
  var presetIdx = 0;

  var W = 0, H = 0, dpr = 1;
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    if (!w || !h) return false;
    W = w; H = h;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dirty = true; sig = '';
    return true;
  }

  var dirty = true;
  var sig = '';

  // ---------- 掩膜 ----------
  var maskCanvas = document.createElement('canvas');
  var mctx = maskCanvas.getContext('2d', { willReadFrequently: true });
  var maskData = null;
  var maskKey = '';
  var maskW = 0, maskH = 0;

  function buildMask() {
    if (!W || !H) return;
    var key = CFG.text + '|' + W + 'x' + H + '|' + CFG.weight + '|' + CFG.font;
    if (key === maskKey && maskData) return;
    maskKey = key;
    maskW = W; maskH = H;
    maskCanvas.width = W;
    maskCanvas.height = H;
    mctx.clearRect(0, 0, W, H);
    mctx.fillStyle = '#fff';
    mctx.textAlign = 'center';
    mctx.textBaseline = 'middle';

    var lines = CFG.text.split('\n').filter(function (l) { return l.length > 0; });
    if (!lines.length) {
      maskData = mctx.getImageData(0, 0, W, H).data;
      return;
    }

    var maxW = W * 0.9, maxH = H * 0.86;
    var lh = maxH / lines.length;
    var size = Math.floor(lh * 0.84);
    var setF = function (s) { mctx.font = CFG.weight + ' ' + s + 'px ' + CFG.font; };
    setF(size);

    var widest = 0;
    for (var i = 0; i < lines.length; i++) {
      var m = mctx.measureText(lines[i]).width;
      if (m > widest) widest = m;
    }
    if (widest > maxW) {
      size = Math.max(6, Math.floor(size * maxW / widest));
      setF(size);
    }
    var totalH = size * 1.15 * lines.length;
    if (totalH > maxH) {
      size = Math.max(6, Math.floor(size * maxH / totalH));
      setF(size);
    }
    var startY = H / 2 - (lines.length - 1) * size * 1.15 / 2;
    for (var j = 0; j < lines.length; j++) {
      mctx.fillText(lines[j], W / 2, startY + j * size * 1.15);
    }
    maskData = mctx.getImageData(0, 0, W, H).data;
  }

  function alphaAt(x, y) {
    if (!maskData) return 0;
    x = x | 0; y = y | 0;
    if (x < 0 || y < 0 || x >= maskW || y >= maskH) return 0;
    return maskData[(y * maskW + x) * 4 + 3] / 255;
  }

  // ---------- 渲染 ----------
  function render() {
    if (!W || !H) { requestAnimationFrame(render); return; }
    buildMask();

    var key = W + 'x' + H + '@' + dpr + '|' + maskKey + '|' +
              CFG.spacing + '|' + CFG.direction + '|' + CFG.crossLayers + '|' +
              CFG.gain + '|' + CFG.ink + '|' + CFG.paper + '|' + CFG.background;

    if (dirty || key !== sig) {
      drawFrame(CFG);
      sig = key;
      dirty = false;
    }
    requestAnimationFrame(render);
  }

  function drawFrame(cfg) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = cfg.paper;
    ctx.fillRect(0, 0, W, H);

    var ink = hex2rgb(cfg.ink);
    var inkR = ink[0], inkG = ink[1], inkB = ink[2];
    var spacing = Math.max(2, cfg.spacing);
    var layers = Math.max(1, Math.min(3, Math.round(cfg.crossLayers)));
    var gain = cfg.gain;
    var dir = cfg.direction;

    // 采样灰度场（降采样）
    var scale = Math.min(1, 320 / Math.max(W, H));
    var gw = Math.max(8, Math.round(W * scale));
    var gh = Math.max(8, Math.round(H * scale));
    var cellW = W / gw, cellH = H / gh;
    var lum = new Float32Array(gw * gh);
    for (var y = 0; y < gh; y++) {
      for (var x = 0; x < gw; x++) {
        lum[y * gw + x] = alphaAt((x + 0.5) * cellW, (y + 0.5) * cellH);
      }
    }

    function sampleLum(u, v) {
      var x = u * gw - 0.5;
      var y = v * gh - 0.5;
      var x0 = Math.max(0, Math.min(gw - 1, Math.floor(x)));
      var y0 = Math.max(0, Math.min(gh - 1, Math.floor(y)));
      var x1 = Math.min(gw - 1, x0 + 1);
      var y1 = Math.min(gh - 1, y0 + 1);
      var fx = x - x0, fy = y - y0;
      var a = lum[y0 * gw + x0];
      var b = lum[y0 * gw + x1];
      var c = lum[y1 * gw + x0];
      var d = lum[y1 * gw + x1];
      return (a * (1 - fx) + b * fx) * (1 - fy) + (c * (1 - fx) + d * fx) * fy;
    }

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 每层排线
    for (var L = 0; L < layers; L++) {
      var layerAngle = 0;
      if (L === 1) layerAngle = Math.PI / 5;
      else if (L === 2) layerAngle = -Math.PI / 5;
      if (dir === 'diag' && L === 0) layerAngle = -Math.PI / 4;

      var cosA = Math.cos(layerAngle);
      var sinA = Math.sin(layerAngle);

      var halfDiag = Math.hypot(W, H) / 2 + spacing * 2;
      var cx = W / 2, cy = H / 2;

      for (var v0 = -halfDiag; v0 <= halfDiag; v0 += spacing) {
        var inRun = false;
        var runStart = 0;

        for (var u0 = -halfDiag; u0 <= halfDiag; u0 += 2) {
          var sx = cx + u0 * cosA - v0 * sinA;
          var sy = cy + u0 * sinA + v0 * cosA;
          var uu = sx / W, vv = sy / H;
          var lv = (uu >= 0 && uu <= 1 && vv >= 0 && vv <= 1) ? sampleLum(uu, vv) : 0;
          var inside = lv > 0.15;

          if (inside) {
            if (!inRun) { inRun = true; runStart = u0; }
          } else if (inRun) {
            inRun = false;
            var midU = (runStart + u0) / 2;
            var midSx = cx + midU * cosA - v0 * sinA;
            var midSy = cy + midU * sinA + v0 * cosA;
            var midUu = midSx / W, midVv = midSy / H;
            var midLv = (midUu >= 0 && midUu <= 1 && midVv >= 0 && midVv <= 1) ? sampleLum(midUu, midVv) : 0;
            var w = 0.6 + midLv * gain * 1.4 * (L === 0 ? 1 : 0.7);
            w = Math.min(spacing * 0.9, w);

            var sx0 = cx + runStart * cosA - v0 * sinA;
            var sy0 = cy + runStart * sinA + v0 * cosA;
            var sx1 = cx + u0 * cosA - v0 * sinA;
            var sy1 = cy + u0 * sinA + v0 * cosA;

            ctx.strokeStyle = 'rgb(' + inkR + ',' + inkG + ',' + inkB + ')';
            ctx.lineWidth = w;
            ctx.beginPath();
            ctx.moveTo(sx0, sy0);
            ctx.lineTo(sx1, sy1);
            ctx.stroke();
          }
        }
      }
    }
  }

  function hex2rgb(h) {
    var s = h.replace('#', '');
    var n = parseInt(s.length === 3 ? s.split('').map(function (c) { return c + c; }).join('') : s, 16);
    return [n >> 16 & 255, n >> 8 & 255, n & 255];
  }

  // ---------- 按钮 ----------
  var mLabel = document.getElementById('m');
  document.getElementById('btn-preset').addEventListener('click', function () {
    presetIdx = (presetIdx + 1) % PRESETS.length;
    var p = PRESETS[presetIdx];
    for (var k in p) if (p.hasOwnProperty(k)) CFG[k] = p[k];
    mLabel.textContent = p.text;
    maskData = null; maskKey = '';
    dirty = true;
  });

  var CONTENTS = ['AURORA', '雕版', 'ENGRAVE', '钞票', '铜版画', '⚡'];
  var contentIdx = 0;
  document.getElementById('btn-text').addEventListener('click', function () {
    contentIdx = (contentIdx + 1) % CONTENTS.length;
    CFG.text = CONTENTS[contentIdx];
    maskData = null; maskKey = '';
    dirty = true;
  });

  // ---------- 自定义 ----------
  var panel = document.getElementById('panel');
  var backdrop = document.getElementById('backdrop');
  var inp = document.getElementById('inp');

  function openPanel() {
    inp.value = CFG.text;
    panel.classList.add('open');
    backdrop.classList.add('open');
    setTimeout(function () { inp.focus(); inp.select(); }, 320);
  }
  function closePanel() {
    panel.classList.remove('open');
    backdrop.classList.remove('open');
    inp.blur();
  }
  function confirmInput() {
    var v = inp.value;
    if (!v.replace(/\s/g, '').length) v = 'AURORA';
    CFG.text = v;
    maskData = null; maskKey = '';
    dirty = true;
  }

  document.getElementById('btn-custom').addEventListener('click', openPanel);
  document.getElementById('btn-ok').addEventListener('click', function () {
    confirmInput();
    closePanel();
  });
  backdrop.addEventListener('click', closePanel);
  inp.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); confirmInput(); closePanel(); }
  });
  inp.addEventListener('input', function () {
    inp.style.height = 'auto';
    inp.style.height = Math.min(160, inp.scrollHeight) + 'px';
  });

  // ---------- 启动 ----------
  function boot() {
    if (!resize()) { requestAnimationFrame(boot); return; }
    requestAnimationFrame(render);
  }
  boot();
  window.addEventListener('resize', function () { setTimeout(resize, 100); });
  window.addEventListener('orientationchange', function () { setTimeout(resize, 250); });
})();
</script>
</body>
</html>
