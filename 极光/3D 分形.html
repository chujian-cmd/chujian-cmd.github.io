<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mandelbulb 3D</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #05060c;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }

  #bar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: max(12px, env(safe-area-inset-top)) 12px 12px;
    display: flex; gap: 8px; align-items: center;
    background: linear-gradient(180deg, rgba(5,6,12,0.8), rgba(5,6,12,0));
    z-index: 10; pointer-events: none;
    font: 13px -apple-system, "PingFang SC", sans-serif;
    color: #c3c9d4;
  }
  #bar > * { pointer-events: auto; }
  #bar .mode { flex: 1; color: #8a8f98; }
  #bar .mode b { color: #f7f8f8; font-weight: 600; }

  .btn {
    height: 38px; padding: 0 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    color: #f7f8f8; font: 500 13px -apple-system, "PingFang SC", sans-serif;
    cursor: pointer; -webkit-user-select: none; user-select: none;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .btn:active { background: rgba(255,255,255,0.14); }
  .btn.pri { background: rgba(94,106,210,0.32); border-color: rgba(94,106,210,0.6); }

  #hint {
    position: fixed; left: 0; right: 0;
    bottom: max(20px, env(safe-area-inset-bottom));
    text-align: center; color: #6a6f7a;
    font: 12px -apple-system, "PingFang SC", sans-serif;
    pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="bar">
  <div class="mode">Mandelbulb <b id="m">铜焰</b></div>
  <button class="btn" id="btn-reset">重置</button>
  <button class="btn pri" id="btn-change">换配色</button>
</div>

<div id="hint">拖动屏幕 = 绕分形旋转 · 双指捏合 = 缩放</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
              || (navigator.maxTouchPoints > 1);

// ---------- 参数 ----------
const CFG = {
  power: 8.0,          // Mandelbulb 幂次（8 是经典）
  iterations: 6,       // 迭代次数（手机上 4~6）
  camDist: 2.6,        // 相机距离
  spin: 0.15,          // 自动旋转
  glow: 0.6,           // 辉光
  brightness: 1.1,
  colorA: '#ff9d5c',   // 基色
  colorB: '#402010',   // 相位色
  background: '#05060c'
};

const PIXEL_RATIO = isMobile ? 0.5 : 0.75;

const canvasEl = document.getElementById('cv');
const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: false });
renderer.setPixelRatio(PIXEL_RATIO);
renderer.setSize(innerWidth, innerHeight, false);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const vert = /* glsl */`
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = vec4(position.xy, 0.0, 1.0);
  }
`;

const frag = /* glsl */`
  precision highp float;
  varying vec2 vUv;

  uniform vec2  uResolution;
  uniform vec2  uMouse;
  uniform float uTime;
  uniform float uPower;
  uniform float uIterations;
  uniform float uCamDist;
  uniform float uSpin;
  uniform float uGlow;
  uniform float uBrightness;
  uniform vec3  uColorA;
  uniform vec3  uColorB;
  uniform vec3  uBackground;

  #define PI 3.14159265359
  #define TAU 6.28318530718

  mat2 rot(float a) {
    float s = sin(a), c = cos(a);
    return mat2(c, -s, s, c);
  }

  // ---- Mandelbulb 距离估计 ----
  float mandelbulbDE(vec3 pos, float power, float iterations) {
    vec3 z = pos;
    float dr = 1.0;
    float r = 0.0;
    for (int i = 0; i < 8; i++) {
      if (float(i) >= iterations) break;
      r = length(z);
      if (r > 2.0) break;
      float theta = acos(z.z / r);
      float phi = atan(z.y, z.x);
      dr = pow(r, power - 1.0) * power * dr + 1.0;
      float zr = pow(r, power);
      theta *= power;
      phi *= power;
      z = zr * vec3(
        sin(theta) * cos(phi),
        sin(theta) * sin(phi),
        cos(theta)
      ) + pos;
    }
    return 0.5 * log(r) * r / dr;
  }

  float map(vec3 p) {
    // 缓慢自转
    float t = uTime * uSpin * 0.5;
    p.xz = rot(t) * p.xz;
    p.yz = rot(t * 0.6) * p.yz;
    return mandelbulbDE(p, uPower, uIterations);
  }

  vec3 calcNormal(vec3 p) {
    vec2 e = vec2(0.001, 0.0);
    return normalize(vec3(
      map(p + e.xyy) - map(p - e.xyy),
      map(p + e.yxy) - map(p - e.yxy),
      map(p + e.yyx) - map(p - e.yyx)
    ));
  }

  vec3 palette(float t, vec3 a, vec3 b, vec3 c, vec3 d) {
    return a + b * cos(TAU * (c * t + d));
  }

  void main() {
    vec2 uv = (vUv - 0.5) * 2.0;
    uv.x *= uResolution.x / uResolution.y;

    // 相机位置 + 鼠标旋转
    vec2 mouseOffset = (uMouse - 0.5) * 2.0;
    float yaw = mouseOffset.x * 3.14;
    float pitch = mouseOffset.y * 1.2;

    vec3 camPos = vec3(
      sin(yaw) * cos(pitch) * uCamDist,
      sin(pitch) * uCamDist,
      cos(yaw) * cos(pitch) * uCamDist
    );

    vec3 forward = normalize(-camPos);
    vec3 worldUp = vec3(0.0, 1.0, 0.0);
    vec3 right = normalize(cross(worldUp, forward));
    vec3 up = cross(forward, right);

    vec3 rd = normalize(forward + uv.x * right * 0.7 + uv.y * up * 0.7);
    vec3 ro = camPos;

    // ray march
    float t = 0.0;
    float glow = 0.0;
    bool hit = false;
    vec3 p = ro;

    for (int i = 0; i < 100; i++) {
      p = ro + rd * t;
      float d = map(p);
      glow += 0.006 / (0.02 + abs(d));
      if (d < 0.001) { hit = true; break; }
      t += d * 0.7;
      if (t > 8.0) break;
    }

    vec3 col = uBackground;
    if (hit) {
      vec3 n = calcNormal(p);
      vec3 lightDir = normalize(vec3(0.6, 0.8, 0.5));
      float diff = clamp(dot(n, lightDir), 0.0, 1.0);
      float fres = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 3.0);
      float tone = 0.5 + 0.5 * sin(p.x * 1.5 + p.y * 1.5 + p.z * 1.5 + uTime * 0.2);
      vec3 base = palette(tone, uColorA, vec3(0.5), vec3(1.0, 1.0, 1.0), uColorB);
      col = base * (0.25 + 0.85 * diff) + fres * base * 1.2;
      col = mix(col, uBackground, clamp(t / 8.0, 0.0, 0.7));
    }
    col += uColorA * glow * uGlow * 0.03;
    col *= uBrightness;

    // 色调映射
    col = col / (1.0 + col * 0.4);
    col = pow(max(col, 0.0), vec3(0.9));

    gl_FragColor = vec4(col, 1.0);
  }
`;

const material = new THREE.ShaderMaterial({
  vertexShader: vert,
  fragmentShader: frag,
  uniforms: {
    uResolution: { value: new THREE.Vector2(1, 1) },
    uMouse: { value: new THREE.Vector2(0.5, 0.5) },
    uTime: { value: 0 },
    uPower: { value: CFG.power },
    uIterations: { value: CFG.iterations },
    uCamDist: { value: CFG.camDist },
    uSpin: { value: CFG.spin },
    uGlow: { value: CFG.glow },
    uBrightness: { value: CFG.brightness },
    uColorA: { value: new THREE.Color(CFG.colorA) },
    uColorB: { value: new THREE.Color(CFG.colorB) },
    uBackground: { value: new THREE.Color(CFG.background) }
  }
});

const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
mesh.frustumCulled = false;
scene.add(mesh);

function resize() {
  const W = innerWidth;
  const H = innerHeight;
  renderer.setPixelRatio(PIXEL_RATIO);
  renderer.setSize(W, H, false);
  material.uniforms.uResolution.value.set(W * PIXEL_RATIO, H * PIXEL_RATIO);
}
resize();

// ---------- 指针：拖动旋转 + 双指缩放 ----------
const pointer = { x: 0.5, y: 0.5, targetX: 0.5, targetY: 0.5, down: false };
const rect = () => canvasEl.getBoundingClientRect();
let camDist = CFG.camDist;
let pinchStartDist = 0;
let pinchStartCam = 1;

const onDown = e => {
  if (e.touches && e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.hypot(dx, dy);
    pinchStartCam = camDist;
    return;
  }
  const t = e.touches ? e.touches[0] : e;
  const r = rect();
  pointer.targetX = (t.clientX - r.left) / r.width;
  pointer.targetY = (t.clientY - r.top) / r.height;
  pointer.down = true;
  if (e.touches) e.preventDefault();
};

const onMove = e => {
  if (e.touches && e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const d = Math.hypot(dx, dy);
    if (pinchStartDist > 0) {
      camDist = Math.max(1.4, Math.min(6, pinchStartCam * pinchStartDist / d));
    }
    return;
  }
  const t = e.touches ? e.touches[0] : e;
  const r = rect();
  pointer.targetX = (t.clientX - r.left) / r.width;
  pointer.targetY = (t.clientY - r.top) / r.height;
  if (e.touches) e.preventDefault();
};

const onUp = () => { pointer.down = false; pinchStartDist = 0; };

canvasEl.addEventListener('touchstart', onDown, { passive: false });
canvasEl.addEventListener('touchmove', onMove, { passive: false });
canvasEl.addEventListener('touchend', onUp);
canvasEl.addEventListener('touchcancel', onUp);
canvasEl.addEventListener('mousedown', onDown);
canvasEl.addEventListener('mousemove', onMove);
canvasEl.addEventListener('mouseup', onUp);
canvasEl.addEventListener('mouseleave', onUp);
canvasEl.addEventListener('wheel', e => {
  e.preventDefault();
  camDist = Math.max(1.4, Math.min(6, camDist * Math.exp(e.deltaY * 0.001)));
}, { passive: false });

let startTime = performance.now();
function loop(now) {
  const t = (now - startTime) / 1000;
  pointer.x += (pointer.targetX - pointer.x) * 0.08;
  pointer.y += (pointer.targetY - pointer.y) * 0.08;

  const u = material.uniforms;
  u.uTime.value = t;
  u.uMouse.value.set(pointer.x, pointer.y);
  u.uCamDist.value = camDist;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

const mEl = document.getElementById('m');

const SCHEMES = [
  { name: '铜焰',   colorA: '#ff9d5c', colorB: '#402010', power: 8.0, iterations: 6,
    glow: 0.6, brightness: 1.1 },
  { name: '蓝钢',   colorA: '#8fd4ff', colorB: '#203050', power: 8.0, iterations: 6,
    glow: 0.8, brightness: 1.2 },
  { name: '霓虹',   colorA: '#ff5ac8', colorB: '#402060', power: 8.0, iterations: 6,
    glow: 1.0, brightness: 1.3 },
  { name: '翡翠',   colorA: '#4ecb8d', colorB: '#123024', power: 8.0, iterations: 6,
    glow: 0.7, brightness: 1.1 },
  { name: '粉紫',   colorA: '#ffc4dd', colorB: '#40205a', power: 8.0, iterations: 6,
    glow: 0.9, brightness: 1.2 },
  { name: '黄金',   colorA: '#ffd86b', colorB: '#402000', power: 8.0, iterations: 6,
    glow: 0.8, brightness: 1.15 }
];
let schemeIdx = 0;

function applyScheme(s) {
  const u = material.uniforms;
  u.uColorA.value.set(s.colorA);
  u.uColorB.value.set(s.colorB);
  u.uPower.value = s.power;
  u.uIterations.value = s.iterations;
  u.uGlow.value = s.glow;
  u.uBrightness.value = s.brightness;
  camDist = 2.6;
  u.uCamDist.value = camDist;
}

document.getElementById('btn-reset').addEventListener('click', () => {
  startTime = performance.now();
  pointer.targetX = 0.5;
  pointer.targetY = 0.5;
  camDist = 2.6;
});

document.getElementById('btn-change').addEventListener('click', () => {
  schemeIdx = (schemeIdx + 1) % SCHEMES.length;
  applyScheme(SCHEMES[schemeIdx]);
  mEl.textContent = SCHEMES[schemeIdx].name;
});

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

applyScheme(SCHEMES[0]);
mEl.textContent = SCHEMES[0].name;
requestAnimationFrame(loop);
</script>
</body>
</html>
