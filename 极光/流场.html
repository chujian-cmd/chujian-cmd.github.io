<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>流场 Flow Field</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #06070c;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }

  #bar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: max(12px, env(safe-area-inset-top)) 12px 12px;
    display: flex; gap: 8px; align-items: center;
    background: linear-gradient(180deg, rgba(6,7,12,0.8), rgba(6,7,12,0));
    z-index: 10; pointer-events: none;
    font: 13px -apple-system, "PingFang SC", sans-serif;
    color: #c3c9d4;
  }
  #bar > * { pointer-events: auto; }
  #bar .mode { flex: 1; color: #8a8f98; }
  #bar .mode b { color: #f7f8f8; font-weight: 600; }

  .btn {
    height: 38px; padding: 0 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    color: #f7f8f8; font: 500 13px -apple-system, "PingFang SC", sans-serif;
    cursor: pointer; -webkit-user-select: none; user-select: none;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .btn:active { background: rgba(255,255,255,0.14); }
  .btn.pri { background: rgba(94,106,210,0.32); border-color: rgba(94,106,210,0.6); }

  #hint {
    position: fixed; left: 0; right: 0;
    bottom: max(20px, env(safe-area-inset-bottom));
    text-align: center; color: #6a6f7a;
    font: 12px -apple-system, "PingFang SC", sans-serif;
    pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="bar">
  <div class="mode">流场 <b id="m">Fidenza 流</b></div>
  <button class="btn" id="btn-reset">重新播种</button>
  <button class="btn pri" id="btn-change">换配色</button>
</div>

<div id="hint">按住拖动 = 施力（可切换模式）· 右键 = 翻转旋向</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
                || (navigator.maxTouchPoints > 1);

  // ========== 参数 ==========
  const CFG = {
    count: isMobile ? 2200 : 3200,   // 粒子数
    noiseScale: 0.0018,               // 噪声密度
    speed: 1.6,                       // 流速
    evolve: 0.12,                     // 场演化
    colorMode: 'angle',               // angle | speed | solid
    trail: 0.06,                      // 拖尾（越小越长）
    lineWidth: 0.9,
    color: '#8ea2ff',
    background: '#06070c',
    glow: true,
    mouseForce: 1.4,
    mouseMode: 'attract',             // attract | repel
    mouseRadius: 130
  };

  // ========== 工具 ==========
  const hex2rgb = h => {
    const s = h.replace('#', '');
    const n = parseInt(s.length === 3 ? s.split('').map(c => c + c).join('') : s, 16);
    return [n >> 16 & 255, n >> 8 & 255, n & 255];
  };
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const TAU = Math.PI * 2;

  // ========== 3D Simplex 噪声 ==========
  class SimplexNoise {
    constructor(seed = 0) {
      this.perm = new Uint8Array(512);
      this.permMod12 = new Uint8Array(512);
      const p = new Uint8Array(256);
      for (let i = 0; i < 256; i++) p[i] = i;
      // 用简单 LCG 打乱
      let s = (seed | 0) ^ 2654435769;
      const rnd = () => {
        s ^= s << 13; s ^= s >>> 17; s ^= s << 5;
        return ((s >>> 0) % 1e6) / 1e6;
      };
      for (let i = 255; i > 0; i--) {
        const j = Math.floor(rnd() * (i + 1));
        [p[i], p[j]] = [p[j], p[i]];
      }
      for (let i = 0; i < 512; i++) {
        this.perm[i] = p[i & 255];
        this.permMod12[i] = this.perm[i] % 12;
      }
    }
    noise3D(x, y, z) {
      const p = this.perm;
      const pm = this.permMod12;
      const F3 = 1 / 3, G3 = 1 / 6;
      const s = (x + y + z) * F3;
      const i = Math.floor(x + s), j = Math.floor(y + s), k = Math.floor(z + s);
      const t = (i + j + k) * G3;
      const x0 = x - (i - t), y0 = y - (j - t), z0 = z - (k - t);
      let i1, j1, k1, i2, j2, k2;
      if (x0 >= y0) {
        if (y0 >= z0) { i1 = 1; j1 = 0; k1 = 0; i2 = 1; j2 = 1; k2 = 0; }
        else if (x0 >= z0) { i1 = 1; j1 = 0; k1 = 0; i2 = 1; j2 = 0; k2 = 1; }
        else { i1 = 0; j1 = 0; k1 = 1; i2 = 1; j2 = 0; k2 = 1; }
      } else {
        if (y0 < z0) { i1 = 0; j1 = 0; k1 = 1; i2 = 0; j2 = 1; k2 = 1; }
        else if (x0 < z0) { i1 = 0; j1 = 1; k1 = 0; i2 = 0; j2 = 1; k2 = 1; }
        else { i1 = 0; j1 = 1; k1 = 0; i2 = 1; j2 = 1; k2 = 0; }
      }
      const x1 = x0 - i1 + G3, y1 = y0 - j1 + G3, z1 = z0 - k1 + G3;
      const x2 = x0 - i2 + 2 * G3, y2 = y0 - j2 + 2 * G3, z2 = z0 - k2 + 2 * G3;
      const x3 = x0 - 1 + 3 * G3, y3 = y0 - 1 + 3 * G3, z3 = z0 - 1 + 3 * G3;
      const ii = i & 255, jj = j & 255, kk = k & 255;
      // grad 函数：从 hash 取 12 个方向之一
      const grad = (h, x, y, z) => {
        switch (h) {
          case 0: return x + y;
          case 1: return -x + y;
          case 2: return x - y;
          case 3: return -x - y;
          case 4: return x + z;
          case 5: return -x + z;
          case 6: return x - z;
          case 7: return -x - z;
          case 8: return y + z;
          case 9: return -y + z;
          case 10: return y - z;
          case 11: return -y - z;
        }
        return 0;
      };
      let n0 = 0, n1 = 0, n2 = 0, n3 = 0;
      let t0 = 0.6 - x0 * x0 - y0 * y0 - z0 * z0;
      if (t0 > 0) {
        const g = pm[ii + p[jj + p[kk]]];
        t0 *= t0; n0 = t0 * t0 * grad(g, x0, y0, z0);
      }
      let t1 = 0.6 - x1 * x1 - y1 * y1 - z1 * z1;
      if (t1 > 0) {
        const g = pm[ii + i1 + p[jj + j1 + p[kk + k1]]];
        t1 *= t1; n1 = t1 * t1 * grad(g, x1, y1, z1);
      }
      let t2 = 0.6 - x2 * x2 - y2 * y2 - z2 * z2;
      if (t2 > 0) {
        const g = pm[ii + i2 + p[jj + j2 + p[kk + k2]]];
        t2 *= t2; n2 = t2 * t2 * grad(g, x2, y2, z2);
      }
      let t3 = 0.6 - x3 * x3 - y3 * y3 - z3 * z3;
      if (t3 > 0) {
        const g = pm[ii + 1 + p[jj + 1 + p[kk + 1]]];
        t3 *= t3; n3 = t3 * t3 * grad(g, x3, y3, z3);
      }
      return 32 * (n0 + n1 + n2 + n3);
    }
  }

  const noise = new SimplexNoise(1);

  // ========== 尺寸 ==========
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (px.length) seed();
  }

  // ========== 粒子 ==========
  const N = CFG.count;
  const px = new Float32Array(N);
  const py = new Float32Array(N);

  function seed() {
    for (let i = 0; i < N; i++) {
      px[i] = Math.random() * W;
      py[i] = Math.random() * H;
    }
  }
  seed();

  // ========== 指针 ==========
  const pointer = {
    x: 0, y: 0, down: false, inside: false,
    rightClicks: 0
  };
  let swirlDir = 1;
  let lastRightClicks = 0;
  let rightDownX = 0, rightDownY = 0, rightMoved = false;
  const rect = () => cv.getBoundingClientRect();

  const onDown = e => {
    if (e.touches && e.touches.length > 1) return;
    const t = e.touches ? e.touches[0] : e;
    const r = rect();
    pointer.x = t.clientX - r.left;
    pointer.y = t.clientY - r.top;
    pointer.inside = true;
    pointer.down = true;
    if (e.button === 2) {
      rightDownX = t.clientX;
      rightDownY = t.clientY;
      rightMoved = false;
    }
    if (e.touches) e.preventDefault();
  };
  const onMove = e => {
    const t = e.touches ? e.touches[0] : e;
    const r = rect();
    pointer.x = t.clientX - r.left;
    pointer.y = t.clientY - r.top;
    pointer.inside = true;
    if (e.buttons & 2 && Math.hypot(t.clientX - rightDownX, t.clientY - rightDownY) > 6) {
      rightMoved = true;
    }
    if (e.touches) e.preventDefault();
  };
  const onUp = () => { pointer.down = false; };

  cv.addEventListener('touchstart', onDown, { passive: false });
  cv.addEventListener('touchmove', onMove, { passive: false });
  cv.addEventListener('touchend', onUp);
  cv.addEventListener('touchcancel', onUp);
  cv.addEventListener('mousedown', onDown);
  cv.addEventListener('mousemove', onMove);
  cv.addEventListener('mouseup', onUp);
  cv.addEventListener('mouseleave', () => { pointer.inside = false; pointer.down = false; });
  cv.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (!rightMoved) pointer.rightClicks++;
  });

  // ========== 主循环 ==========
  let startTime = performance.now();

  function frame(now) {
    const t = (now - startTime) / 1000;
    const dt = 1 / 60;

    const [br, bg, bb] = hex2rgb(CFG.background);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = `rgba(${br},${bg},${bb},${CFG.trail})`;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = CFG.glow ? 'lighter' : 'source-over';
    ctx.lineWidth = CFG.lineWidth;
    ctx.lineCap = 'round';

    const ns = CFG.noiseScale;
    const sp = CFG.speed * Math.min(dt * 60, 3);
    const ev = t * CFG.evolve;
    const [cr, cg, cb] = hex2rgb(CFG.color);

    // 右键翻转旋向
    if (pointer.rightClicks !== lastRightClicks) {
      swirlDir *= -1;
      lastRightClicks = pointer.rightClicks;
    }

    const mActive = pointer.inside && pointer.down && CFG.mouseForce > 0;
    const mx = pointer.x, my = pointer.y;
    const mR = CFG.mouseRadius;
    const mR2 = mR * mR;
    const mF = CFG.mouseForce;
    const mMode = CFG.mouseMode;

    for (let i = 0; i < N; i++) {
      let x = px[i];
      let y = py[i];

      // 噪声场给出方向角
      const ang = noise.noise3D(x * ns, y * ns, ev) * TAU * 1.6;
      let nx = x + Math.cos(ang) * sp;
      let ny = y + Math.sin(ang) * sp;

      // 鼠标力
      if (mActive) {
        const dx = x - mx;
        const dy = y - my;
        const d2 = dx * dx + dy * dy;
        if (d2 < mR2 && d2 > 1) {
          const d = Math.sqrt(d2);
          const f = (1 - d / mR) * mF * mR * 0.6 * 1.7;
          const ux = dx / d, uy = dy / d;
          if (mMode === 'attract') {
            nx -= ux * f;
            ny -= uy * f;
          } else {
            nx += ux * f;
            ny += uy * f;
          }
        }
      }

      // 出界重生
      if (nx < -5 || nx > W + 5 || ny < -5 || ny > H + 5) {
        px[i] = Math.random() * W;
        py[i] = Math.random() * H;
        continue;
      }

      // 绘制
      let strokeColor;
      if (CFG.colorMode === 'angle') {
        const hue = ((ang / TAU) * 360 + 360) % 360;
        strokeColor = `hsla(${hue | 0}, 72%, 56%, ${CFG.glow ? 0.3 : 0.8})`;
      } else if (CFG.colorMode === 'speed') {
        const spd = Math.hypot(nx - x, ny - y) / (sp * 2.2);
        const k = clamp(spd, 0, 1);
        const hue = 210 + k * 120;
        strokeColor = `hsla(${hue | 0}, 75%, ${44 + k * 22}%, ${CFG.glow ? 0.5 : 0.85})`;
      } else {
        strokeColor = `rgba(${cr},${cg},${cb},${CFG.glow ? 0.5 : 0.85})`;
      }

      ctx.strokeStyle = strokeColor;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(nx, ny);
      ctx.stroke();

      px[i] = nx;
      py[i] = ny;
    }

    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(frame);
  }

  // ========== 按钮 ==========
  const mEl = document.getElementById('m');

  const SCHEMES = [
    { name: 'Fidenza 流',
      noiseScale: 0.0009, speed: 1.0, trail: 0.03,
      colorMode: 'solid', color: '#e8caa4', background: '#351330',
      glow: true, lineWidth: 0.9 },
    { name: '赭土',
      noiseScale: 0.0014, speed: 1.2, trail: 0.04,
      colorMode: 'solid', color: '#ffb88c', background: '#241a18',
      glow: true, lineWidth: 0.9 },
    { name: '丝绸',
      noiseScale: 0.0012, speed: 1.2, trail: 0.04,
      colorMode: 'angle', color: '#8ea2ff', background: '#06070c',
      glow: true, lineWidth: 0.9 },
    { name: '星云',
      noiseScale: 0.0009, speed: 0.9, trail: 0.03,
      colorMode: 'speed', color: '#a06bff', background: '#06070c',
      glow: true, lineWidth: 0.9 },
    { name: '电流',
      noiseScale: 0.0032, speed: 3.2, trail: 0.12,
      colorMode: 'solid', color: '#5be0ff', background: '#06070c',
      glow: true, lineWidth: 0.6 },
    { name: '极简墨线',
      noiseScale: 0.0016, speed: 1.4, trail: 0.5,
      colorMode: 'solid', color: '#e7e9ef', background: '#0c0d11',
      glow: false, lineWidth: 1.1 },
    { name: '身体画笔',
      noiseScale: 0.0012, speed: 1.1, trail: 0.03,
      colorMode: 'angle', color: '#8ea2ff', background: '#06070c',
      glow: true, lineWidth: 0.9, count: 3600 }
  ];
  let schemeIdx = 0;

  function applyScheme(s) {
    Object.assign(CFG, s);
    mEl.textContent = s.name;
    if (s.count && s.count !== N) {
      // 粒子数变了需要重新分配数组
      location.reload();
    } else {
      seed();
    }
  }

  document.getElementById('btn-reset').addEventListener('click', seed);

  document.getElementById('btn-change').addEventListener('click', () => {
    schemeIdx = (schemeIdx + 1) % SCHEMES.length;
    applyScheme(SCHEMES[schemeIdx]);
  });

  // ========== 启动 ==========
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
