<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>网点印刷字 Halftone</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f6f1e6;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
  #bar{position:fixed;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 12px 12px;
    display:flex;gap:8px;align-items:center;background:linear-gradient(180deg,rgba(246,241,230,.85),rgba(246,241,230,0));
    z-index:10;pointer-events:none;font:13px -apple-system,"PingFang SC",sans-serif;color:#3a3326}
  #bar>*{pointer-events:auto}
  #bar .mode{flex:1;color:#8a7f6a}
  #bar .mode b{color:#2a241a;font-weight:600}
  .btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid rgba(0,0,0,.14);
    background:rgba(0,0,0,.05);color:#2a241a;font:500 13px -apple-system,"PingFang SC",sans-serif;
    cursor:pointer;-webkit-user-select:none;user-select:none}
  .btn:active{background:rgba(0,0,0,.12)}
  .btn.pri{background:rgba(255,95,158,.28);border-color:rgba(255,95,158,.6);color:#4a0a24}
  #hint{position:fixed;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));text-align:center;
    color:#a5957a;font:12px -apple-system,"PingFang SC",sans-serif;pointer-events:none;z-index:10}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bar">
  <div class="mode">网点印刷字 <b id="m">Riso 粉蓝</b></div>
  <button class="btn" id="btn-palette">换色板</button>
  <button class="btn pri" id="btn-text">换文字</button>
</div>
<div id="hint">旋转网格 · 点径调制 · 双色套印 · 纸纹</div>

<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');

  var CFG = {
    text: 'AURORA',
    density: 64,
    angle: 15,
    shape: 'circle',
    palette: 'riso',
    layer2: true,
    misreg: 3,
    paper: 0.35,
    weight: 900,
    font: '"PingFang SC","Microsoft YaHei",sans-serif',
    colorA: '#ff5f9e',
    colorB: '#3f7bd9',
    background: '#f6f1e6'
  };

  var PALETTES = {
    riso:        { a: '#ff5f9e', b: '#3f7bd9' },
    blackred:    { a: '#26221e', b: '#e63946' },
    yellowblack: { a: '#f2a93b', b: '#211d18' }
  };
  var PAL_NAMES = [
    { key: 'riso',        label: 'Riso 粉蓝' },
    { key: 'blackred',    label: '黑红' },
    { key: 'yellowblack', label: '黄黑' }
  ];

  var W = 0, H = 0, dpr = 1;
  var maskData = null;
  var cells1 = [], cells2 = [];
  var pitch = 10;

  var raster = document.createElement('canvas');
  var rctx = raster.getContext('2d');
  var paperCv = document.createElement('canvas');

  function hash(n) {
    var t = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return t - Math.floor(t);
  }

  function hex2rgb(h) {
    var s = h.replace('#', '');
    var n = parseInt(s.length === 3 ? s.split('').map(function(c){return c+c;}).join('') : s, 16);
    return [n >> 16 & 255, n >> 8 & 255, n & 255];
  }

  function mulberry(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ---------- 尺寸 ----------
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    if (!w || !h) return false;
    W = w; H = h;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    maskData = null;
    cells1 = []; cells2 = [];
    return true;
  }

  // ---------- 掩膜：白色字 + 透明底 ----------
  function buildMask() {
    if (!W || !H) return;
    raster.width = W; raster.height = H;
    rctx.clearRect(0, 0, W, H);
    rctx.fillStyle = '#ffffff';
    rctx.textAlign = 'center';
    rctx.textBaseline = 'middle';

    var lines = CFG.text.split('\n').filter(function(l){ return l.length > 0; });
    if (!lines.length) { maskData = rctx.getImageData(0, 0, W, H).data; return; }

    var maxW = W * 0.9, maxH = H * 0.86;
    var lh = maxH / Math.max(1, lines.length);
    var size = Math.floor(lh * 0.8);
    var setF = function(s){ rctx.font = CFG.weight + ' ' + s + 'px ' + CFG.font; };
    setF(size);

    var widest = 0;
    for (var i = 0; i < lines.length; i++) {
      var m = rctx.measureText(lines[i]).width;
      if (m > widest) widest = m;
    }
    if (widest > maxW) {
      size = Math.max(6, Math.floor(size * maxW / widest));
      setF(size);
    }
    var totalH = size * 1.15 * lines.length;
    if (totalH > maxH) {
      size = Math.max(6, Math.floor(size * maxH / totalH));
      setF(size);
    }
    var startY = H / 2 - (lines.length - 1) * size * 1.15 / 2;
    for (var j = 0; j < lines.length; j++) {
      rctx.fillText(lines[j], W / 2, startY + j * size * 1.15);
    }
    maskData = rctx.getImageData(0, 0, W, H).data;
  }

  // ★ 修复点：取整 (x | 0) 和 (y | 0)，否则 maskData 索引会返回 undefined → NaN → 画不出点
  function alphaAt(x, y) {
    if (!maskData) return 0;
    x = x | 0;
    y = y | 0;
    if (x < 0) x = 0; else if (x >= W) x = W - 1;
    if (y < 0) y = 0; else if (y >= H) y = H - 1;
    return maskData[(y * W + x) * 4 + 3] / 255;
  }

  function feather(x, y, r) {
    return (alphaAt(x, y) + alphaAt(x - r, y) + alphaAt(x + r, y) + alphaAt(x, y - r) + alphaAt(x, y + r)) / 5;
  }

  // ---------- 采样网点 ----------
  function collect(angle, p) {
    var cx = W / 2, cy = H / 2;
    var cosA = Math.cos(angle), sinA = Math.sin(angle);
    var half = Math.hypot(W, H) / 2 + p;
    var featherR = Math.max(1, Math.round(p * 0.36));
    var out = [];
    for (var v = -half; v <= half; v += p) {
      for (var u = -half; u <= half; u += p) {
        var x = cx + u * cosA - v * sinA;
        var y = cy + u * sinA + v * cosA;
        if (x < -p || x > W + p || y < -p || y > H + p) continue;
        var a = feather(x, y, featherR);
        if (a < 0.05) continue;
        out.push({
          u: u, v: v, a: a,
          ph: hash(u * 3.1 + v * 7.7) * Math.PI * 2
        });
      }
    }
    return out;
  }

  function buildCells() {
    if (!W || !H) return;
    pitch = Math.max(4, W / CFG.density);
    var a1 = CFG.angle * Math.PI / 180;
    cells1 = collect(a1, pitch);
    cells2 = CFG.layer2 ? collect(a1 + 15 * Math.PI / 180, pitch) : [];
  }

  // ---------- 纸纹 ----------
  function buildPaper() {
    paperCv.width = Math.max(2, W); paperCv.height = Math.max(2, H);
    var c = paperCv.getContext('2d');
    var rnd = mulberry(1337);
    var total = Math.floor(W * H / 160);
    for (var i = 0; i < total; i++) {
      var x = rnd() * W, y = rnd() * H;
      var light = rnd() < 0.6;
      c.fillStyle = light
        ? 'rgba(70,58,42,' + (0.05 + rnd() * 0.1).toFixed(3) + ')'
        : 'rgba(255,252,240,' + (0.08 + rnd() * 0.12).toFixed(3) + ')';
      var s = 0.6 + rnd() * 1.6;
      c.fillRect(x, y, s, s);
    }
    c.strokeStyle = 'rgba(90,76,56,0.06)';
    for (var k = 0; k < Math.floor(W / 18); k++) {
      var x2 = rnd() * W, y2 = rnd() * H;
      c.beginPath();
      c.moveTo(x2, y2);
      c.quadraticCurveTo(x2 + (rnd() - 0.5) * 40, y2 + (rnd() - 0.5) * 40,
                         x2 + (rnd() - 0.5) * 80, y2 + (rnd() - 0.5) * 80);
      c.stroke();
    }
  }

  // ---------- 绘制 ----------
  function drawLayer(c, cells, angle, color, shape, offX, offY) {
    c.save();
    c.translate(W / 2 + offX, H / 2 + offY);
    c.rotate(angle);
    c.fillStyle = color;
    var pitchHalf = pitch * 0.62;
    for (var i = 0; i < cells.length; i++) {
      var cell = cells[i];
      var r = Math.sqrt(cell.a) * pitchHalf;
      if (r < 0.3) continue;
      if (shape === 'square') {
        var s = r * 1.72;
        c.fillRect(cell.u - s / 2, cell.v - s / 2, s, s);
      } else if (shape === 'line') {
        var hh = r * 1.4;
        c.fillRect(cell.u - pitchHalf * 0.53, cell.v - hh / 2, pitchHalf * 1.06, hh);
      } else {
        c.beginPath();
        c.arc(cell.u, cell.v, r, 0, Math.PI * 2);
        c.fill();
      }
    }
    c.restore();
  }

  function draw(c) {
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.fillStyle = CFG.background;
    c.fillRect(0, 0, W, H);

    var a = CFG.colorA, b = CFG.colorB;
    if (CFG.palette !== 'custom' && PALETTES[CFG.palette]) {
      a = PALETTES[CFG.palette].a;
      b = PALETTES[CFG.palette].b;
    }

    var ang1 = CFG.angle * Math.PI / 180;
    var ang2 = ang1 + 15 * Math.PI / 180;

    if (CFG.layer2 && cells2.length) {
      // 第一层（A 色）
      drawLayer(c, cells1, ang1, a, CFG.shape, 0, 0);
      // 第二层（B 色），轻微错位 + 半透明叠加
      c.globalAlpha = 0.72;
      drawLayer(c, cells2, ang2, b, CFG.shape, CFG.misreg * 0.7, CFG.misreg * 0.7);
      c.globalAlpha = 1;
    } else {
      // 单层：按 u 位置从 A 到 B 渐变
      var rgb0 = hex2rgb(a);
      var rgb1 = hex2rgb(b);
      var lastColor = '';
      c.save();
      c.translate(W / 2, H / 2);
      c.rotate(ang1);
      var pitchHalf = pitch * 0.62;
      for (var i = 0; i < cells1.length; i++) {
        var cell = cells1[i];
        var r = Math.sqrt(cell.a) * pitchHalf;
        if (r < 0.3) continue;
        var t = (cell.u / (W / 2) + 1) / 2;
        t = Math.max(0, Math.min(1, t));
        var col = 'rgb(' +
          Math.round(rgb0[0] + (rgb1[0] - rgb0[0]) * t) + ',' +
          Math.round(rgb0[1] + (rgb1[1] - rgb0[1]) * t) + ',' +
          Math.round(rgb0[2] + (rgb1[2] - rgb0[2]) * t) + ')';
        if (col !== lastColor) { c.fillStyle = col; lastColor = col; }
        c.beginPath();
        c.arc(cell.u, cell.v, r, 0, Math.PI * 2);
        c.fill();
      }
      c.restore();
    }

    if (CFG.paper > 0) {
      buildPaper();
      c.globalAlpha = CFG.paper * 0.75;
      c.drawImage(paperCv, 0, 0, W, H);
      c.globalAlpha = 1;
    }
  }

  // ---------- 主循环 ----------
  function loop() {
    if (!W || !H) {
      if (!resize()) { requestAnimationFrame(loop); return; }
    }
    if (!maskData) buildMask();
    if (!cells1.length) buildCells();

    draw(ctx);
    requestAnimationFrame(loop);
  }

  function boot() {
    if (!resize()) { requestAnimationFrame(boot); return; }
    requestAnimationFrame(loop);
  }
  boot();

  window.addEventListener('resize', function(){ setTimeout(resize, 100); });
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 250); });

  // ---------- 按钮 ----------
  var palIdx = 0;
  var mLabel = document.getElementById('m');

  document.getElementById('btn-palette').addEventListener('click', function(){
    palIdx = (palIdx + 1) % PAL_NAMES.length;
    CFG.palette = PAL_NAMES[palIdx].key;
    mLabel.textContent = PAL_NAMES[palIdx].label;
    cells1 = []; cells2 = [];
  });

  var CONTENTS = [
    { text: 'AURORA', palette: 'riso' },
    { text: '波普',   palette: 'blackred' },
    { text: 'POP',    palette: 'yellowblack' },
    { text: '印刷',   palette: 'riso' },
    { text: 'RISO',   palette: 'riso' },
    { text: '⚡',    palette: 'yellowblack' }
  ];
  var contentIdx = 0;
  document.getElementById('btn-text').addEventListener('click', function(){
    contentIdx = (contentIdx + 1) % CONTENTS.length;
    var c = CONTENTS[contentIdx];
    CFG.text = c.text;
    CFG.palette = c.palette;
    for (var i = 0; i < PAL_NAMES.length; i++) {
      if (PAL_NAMES[i].key === c.palette) { palIdx = i; mLabel.textContent = PAL_NAMES[i].label; }
    }
    maskData = null;
    cells1 = []; cells2 = [];
  });
})();
</script>
</body>
</html>
