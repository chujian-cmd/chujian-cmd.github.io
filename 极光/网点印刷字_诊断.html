<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>诊断</title>
<style>html,body{margin:0;height:100%;background:#f6f1e6;overflow:hidden}
canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function(){
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var W = window.innerWidth, H = window.innerHeight;

  // 屏幕上直接打印诊断数据
  var dbg = document.createElement('div');
  dbg.style.cssText = 'position:fixed;top:60px;left:12px;right:12px;font:12px monospace;color:#333;z-index:99;white-space:pre-wrap;background:rgba(255,255,255,.9);padding:8px;border:1px solid #ccc';
  document.body.appendChild(dbg);

  cv.width = W; cv.height = H;
  ctx.fillStyle = '#f6f1e6';
  ctx.fillRect(0, 0, W, H);

  // 直接在主画布上画白字，看能不能看见（先假设能看见，那就只剩掩膜/采样问题）
  ctx.fillStyle = '#000';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // 直接大字号，不缩放
  ctx.font = '900 80px sans-serif';
  ctx.fillText('AURORA', W/2, H/2);

  // 诊断 1：字体测量
  var w1 = ctx.measureText('AURORA').width;

  // 诊断 2：离屏画白字 + getImageData 看 alpha
  var off = document.createElement('canvas');
  off.width = W; off.height = H;
  var oc = off.getContext('2d');
  oc.fillStyle = '#ffffff';
  oc.textAlign = 'center';
  oc.textBaseline = 'middle';
  oc.font = '900 80px sans-serif';
  oc.fillText('AURORA', W/2, H/2);
  var data = oc.getImageData(0, 0, W, H).data;
  var cnt = 0;
  for (var i = 3; i < data.length; i += 4) if (data[i] > 128) cnt++;

  // 诊断 3：主画布 getImageData 是否可用
  var mainAlphaCnt = 0;
  try {
    var md = ctx.getImageData(0, 0, W, H).data;
    for (var j = 3; j < md.length; j += 4) if (md[j] > 128) mainAlphaCnt++;
  } catch(e) {
    mainAlphaCnt = 'ERR: ' + e.message;
  }

  dbg.textContent =
    '窗口 W×H = ' + W + ' × ' + H + '\n' +
    'devicePixelRatio = ' + (window.devicePixelRatio||1) + '\n' +
    '主画布 width/height = ' + cv.width + ' × ' + cv.height + '\n' +
    'measureText(AURORA @80px) = ' + w1.toFixed(1) + '\n' +
    '离屏 alpha>128 像素数 = ' + cnt + '\n' +
    '主画布 alpha>128 像素数 = ' + mainAlphaCnt;
})();
</script>
</body>
</html>
