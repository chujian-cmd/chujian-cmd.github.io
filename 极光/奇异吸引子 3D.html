<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>奇异吸引子 3D</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #06060c;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #bar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: max(12px, env(safe-area-inset-top)) 12px 12px;
    display: flex; gap: 8px; align-items: center;
    background: linear-gradient(180deg, rgba(6,6,12,0.8), rgba(6,6,12,0));
    z-index: 10; pointer-events: none;
    font: 13px -apple-system, "PingFang SC", sans-serif;
    color: #c3c9d4;
  }
  #bar > * { pointer-events: auto; }
  #bar .mode { flex: 1; color: #8a8f98; }
  #bar .mode b { color: #f7f8f8; font-weight: 600; }

  .btn {
    height: 38px; padding: 0 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    color: #f7f8f8; font: 500 13px -apple-system, "PingFang SC", sans-serif;
    cursor: pointer; -webkit-user-select: none; user-select: none;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .btn:active { background: rgba(255,255,255,0.14); }
  .btn.pri { background: rgba(94,106,210,0.32); border-color: rgba(94,106,210,0.6); }

  #hint {
    position: fixed; left: 0; right: 0;
    bottom: max(20px, env(safe-area-inset-bottom));
    text-align: center; color: #6a6f7a;
    font: 12px -apple-system, "PingFang SC", sans-serif;
    pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="bar">
  <div class="mode">吸引子 <b id="m">洛伦兹蝶</b></div>
  <button class="btn" id="btn-reset">重生</button>
  <button class="btn pri" id="btn-change">换方程</button>
</div>

<div id="hint">单指拖动 = 旋转 · 双指捏合 = 缩放</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
                || (navigator.maxTouchPoints > 1);

  // ---------- 参数 ----------
  const CFG = {
    type: 'lorenz',                 // lorenz | aizawa | thomas | dadras
    points: isMobile ? 12000 : 24000,  // 轨迹点数
    size: isMobile ? 1.0 : 0.9,         // 点大小
    spin: 0,                         // 自转速度
    trail: 0.12,                        // 拖尾（背景覆盖比例）
    colorA: '#4be0ff',                  // 起始色
    colorB: '#ff5ac8',                  // 结束色
    background: '#06060c'
  };

  const hex2rgb = h => {
    const s = h.replace('#', '');
    const n = parseInt(s.length === 3 ? s.split('').map(c => c + c).join('') : s, 16);
    return [n >> 16 & 255, n >> 8 & 255, n & 255];
  };
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  // ---------- 尺寸 ----------
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ---------- 四种吸引子方程 ----------
  const EQUATIONS = {
    lorenz: {
      name: '洛伦兹蝶',
      dt: 0.006,
      seed: [0.1, 0, 0],
      step: (s, dt) => {
        const [x, y, z] = s;
        s[0] = x + 10 * (y - x) * dt;
        s[1] = y + (x * (28 - z) - y) * dt;
        s[2] = z + (x * y - 8 / 3 * z) * dt;
      }
    },
    aizawa: {
      name: 'Aizawa 环',
      dt: 0.01,
      seed: [0.1, 0, 0],
      step: (s, dt) => {
        const [x, y, z] = s;
        const a = 0.95, b = 0.7, c = 0.6, d = 3.5, e = 0.25, f = 0.1;
        s[0] = x + ((z - b) * x - d * y) * dt;
        s[1] = y + (d * x + (z - b) * y) * dt;
        s[2] = z + (c + a * z - z * z * z / 3 - (x * x + y * y) * (1 + e * z) + f * z * x * x * x) * dt;
      }
    },
    thomas: {
      name: 'Thomas 网',
      dt: 0.03,
      seed: [0.1, 0.2, 0.3],
      step: (s, dt) => {
        const [x, y, z] = s;
        const b = 0.208;
        s[0] = x + (Math.sin(y) - b * x) * dt;
        s[1] = y + (Math.sin(z) - b * y) * dt;
        s[2] = z + (Math.sin(x) - b * z) * dt;
      }
    },
    dadras: {
      name: 'Dadras 涡',
      dt: 0.012,
      seed: [1.1, 2.1, -2],
      step: (s, dt) => {
        const [x, y, z] = s;
        const a = 3, b = 2.7, c = 1.7, d = 2, e = 9;
        s[0] = x + (y - a * x + b * y * z) * dt;
        s[1] = y + (c * y - x * z + z) * dt;
        s[2] = z + (d * x * y - e * z) * dt;
      }
    }
  };

  // ---------- 生成点云 ----------
  let positions = null;   // Float32Array, [x,y,z] * N
  let tArr = null;        // Float32Array, 0~1
  let N = 0;
  let bounds = { min: [-1,-1,-1], max: [1,1,1], center: [0,0,0], scale: 1 };

  function generate() {
    const eq = EQUATIONS[CFG.type];
    const n = CFG.points;
    const s = eq.seed.slice();

    // 预热：让轨迹进入吸引子
    for (let i = 0; i < 1500; i++) eq.step(s, eq.dt);

    positions = new Float32Array(n * 3);
    tArr = new Float32Array(n);

    // 找包围盒
    let minX = Infinity, minY = Infinity, minZ = Infinity;
    let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;

    for (let i = 0; i < n; i++) {
      eq.step(s, eq.dt);
      positions[i * 3]     = s[0];
      positions[i * 3 + 1] = s[1];
      positions[i * 3 + 2] = s[2];
      tArr[i] = i / n;
      if (s[0] < minX) minX = s[0];
      if (s[0] > maxX) maxX = s[0];
      if (s[1] < minY) minY = s[1];
      if (s[1] > maxY) maxY = s[1];
      if (s[2] < minZ) minZ = s[2];
      if (s[2] > maxZ) maxZ = s[2];
    }

    // 归一化到 [-1, 1] 立方体（保持比例）
    const cx = (minX + maxX) / 2;
    const cy = (minY + maxY) / 2;
    const cz = (minZ + maxZ) / 2;
    const size = Math.max(maxX - minX, maxY - minY, maxZ - minZ);
    const scale = 2 / (size || 1);

    for (let i = 0; i < n; i++) {
      positions[i * 3]     = (positions[i * 3]     - cx) * scale;
      positions[i * 3 + 1] = (positions[i * 3 + 1] - cy) * scale;
      positions[i * 3 + 2] = (positions[i * 3 + 2] - cz) * scale;
    }

    N = n;
    bounds = { center: [0, 0, 0], scale: 1 };
    console.log('[吸引子]', CFG.type, '生成', n, '个点');
  }

  // ---------- 3D 投影 ----------
  let rotX = 0.6, rotY = 0, rotZ = 0;
  let camDist = 3.2;
  let camFov = 1.4;

  function projectPoint(x, y, z) {
    // 绕 X 轴旋转
    const cy = Math.cos(rotX), sy = Math.sin(rotX);
    let y1 = y * cy - z * sy;
    let z1 = y * sy + z * cy;
    // 绕 Y 轴旋转
    const cx = Math.cos(rotY), sx = Math.sin(rotY);
    let x2 = x * cx + z1 * sx;
    let z2 = -x * sx + z1 * cx;
    // 透视投影
    const perspective = camFov / (camDist + z2);
    return {
      x: W / 2 + x2 * W * 0.35 * perspective,
      y: H / 2 + y1 * H * 0.35 * perspective,
      z: z2
    };
  }

  // ---------- 指针 ----------
  const pointer = { x: 0, y: 0 };
  let dragging = false;
  let prevX = 0, prevY = 0;
  let pinchDist = 0;
  let pinchZoom = 1;

  const rect = () => cv.getBoundingClientRect();

  cv.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      dragging = true;
      prevX = e.touches[0].clientX;
      prevY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      dragging = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchDist = Math.hypot(dx, dy);
      pinchZoom = camDist;
    }
    e.preventDefault();
  }, { passive: false });

  cv.addEventListener('touchmove', e => {
    if (e.touches.length === 1 && dragging) {
      const dx = e.touches[0].clientX - prevX;
      const dy = e.touches[0].clientY - prevY;
      prevX = e.touches[0].clientX;
      prevY = e.touches[0].clientY;
      rotY += dx * 0.008;
      rotX += dy * 0.008;
      rotX = clamp(rotX, -Math.PI / 2, Math.PI / 2);
    } else if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const d = Math.hypot(dx, dy);
      if (pinchDist > 0) {
        camDist = clamp(pinchZoom * pinchDist / d, 1.4, 12);
      }
    }
    e.preventDefault();
  }, { passive: false });

  cv.addEventListener('touchend', () => { dragging = false; });
  cv.addEventListener('touchcancel', () => { dragging = false; });

  cv.addEventListener('mousedown', e => {
    dragging = true;
    prevX = e.clientX;
    prevY = e.clientY;
  });
  cv.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = e.clientX - prevX;
    const dy = e.clientY - prevY;
    prevX = e.clientX;
    prevY = e.clientY;
    rotY += dx * 0.008;
    rotX += dy * 0.008;
    rotX = clamp(rotX, -Math.PI / 2, Math.PI / 2);
  });
  cv.addEventListener('mouseup', () => { dragging = false; });
  cv.addEventListener('mouseleave', () => { dragging = false; });

  cv.addEventListener('wheel', e => {
    e.preventDefault();
    camDist = clamp(camDist * Math.exp(e.deltaY * 0.001), 1.4, 12);
  }, { passive: false });

  // ---------- 渲染 ----------
  function render() {
    const [br, bg, bb] = hex2rgb(CFG.background);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = `rgba(${br},${bg},${bb},${CFG.trail})`;
    ctx.fillRect(0, 0, W, H);

    if (!positions) return;

    const [ar, ag, ab] = hex2rgb(CFG.colorA);
    const [cr, cg, cb] = hex2rgb(CFG.colorB);
    const sz = CFG.size;

    ctx.globalCompositeOperation = 'lighter';

    // 按 z 排序，远的先画
    // 为性能考虑，手机版不排序，直接画（粒子足够小，视觉差异不大）
    const doSort = !isMobile && N < 16000;
    let order = null;
    if (doSort) {
      order = new Array(N);
      for (let i = 0; i < N; i++) order[i] = i;
      order.sort((a, b) => {
        const za = positions[a*3+2], zb = positions[b*3+2];
        return za - zb;
      });
    }

    const step = 1;
    const end = N;
    const autoRotY = rotY + performance.now() * 0.0005 * CFG.spin * 60;

    for (let idx = 0; idx < end; idx += step) {
      const i = order ? order[idx] : idx;
      const x = positions[i * 3];
      const y = positions[i * 3 + 1];
      const z = positions[i * 3 + 2];

      // 应用自动旋转
      const cY = Math.cos(autoRotY), sY = Math.sin(autoRotY);
      const x1 = x * cY + z * sY;
      const z1 = -x * sY + z * cY;

      const cX = Math.cos(rotX), sX = Math.sin(rotX);
      const y1 = y * cX - z1 * sX;
      const z2 = y * sX + z1 * cX;

      const perspective = camFov / (camDist + z2);
      const sx = W / 2 + x1 * W * 0.32 * perspective;
      const sy = H / 2 + y1 * H * 0.32 * perspective;

      // 深度着色：远的暗
      const depth = clamp((z2 + 1.5) / 3, 0, 1);
      const alpha = 0.4 + (1 - depth) * 0.55;

      const t = tArr[i];
      const R = ar + (cr - ar) * t | 0;
      const G = ag + (cg - ag) * t | 0;
      const B = ab + (cb - ab) * t | 0;

      ctx.fillStyle = `rgba(${R},${G},${B},${alpha})`;
      ctx.fillRect(sx - sz * 0.5, sy - sz * 0.5, sz, sz);
    }

    ctx.globalCompositeOperation = 'source-over';
  }

  // ---------- 主循环 ----------
  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    // 自动旋转
    if (!dragging) {
      rotY += CFG.spin * dt * 0.5;
    }

    render();
    requestAnimationFrame(loop);
  }

  // ---------- 按钮 ----------
  const mEl = document.getElementById('m');
  document.getElementById('btn-reset').addEventListener('click', generate);

  const TYPES = ['lorenz', 'aizawa', 'thomas', 'dadras'];
  let typeIdx = 0;

  document.getElementById('btn-change').addEventListener('click', () => {
    typeIdx = (typeIdx + 1) % TYPES.length;
    CFG.type = TYPES[typeIdx];
    mEl.textContent = EQUATIONS[CFG.type].name;
    generate();
  });

  // ---------- 启动 ----------
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));

  generate();
  mEl.textContent = EQUATIONS[CFG.type].name;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
