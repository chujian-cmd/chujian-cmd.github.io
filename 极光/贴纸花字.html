<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>贴纸花字 Sticker</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#fdf3e2;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
  #bar{position:fixed;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 12px 12px;
    display:flex;gap:8px;align-items:center;background:linear-gradient(180deg,rgba(253,243,226,.85),rgba(253,243,226,0));
    z-index:10;pointer-events:none;font:13px -apple-system,"PingFang SC",sans-serif;color:#3a3326}
  #bar>*{pointer-events:auto}
  #bar .mode{flex:1;color:#8a7f6a}
  #bar .mode b{color:#2a241a;font-weight:600}
  .btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid rgba(0,0,0,.14);
    background:rgba(0,0,0,.05);color:#2a241a;font:500 13px -apple-system,"PingFang SC",sans-serif;
    cursor:pointer;-webkit-user-select:none;user-select:none;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .btn:active{background:rgba(0,0,0,.12)}
  .btn.pri{background:rgba(255,90,140,.28);border-color:rgba(255,90,140,.6);color:#4a0a1c}
  #hint{position:fixed;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));text-align:center;
    color:#a5957a;font:12px -apple-system,"PingFang SC",sans-serif;pointer-events:none;z-index:10}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bar">
  <div class="mode">贴纸花字 <b id="m">糖果红白</b></div>
  <button class="btn" id="btn-scheme">换配色</button>
  <button class="btn pri" id="btn-text">换文字</button>
</div>
<div id="hint">逐字错落旋转 · 多重描边贴纸边 · 弹性抖动</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1);

  const CFG = {
    text: 'AURORA',
    layers: 2,           // 描边层数（1-4）
    stagger: 0.5,        // 错落幅度
    rotate: 0.5,         // 逐字旋转
    scheme: 'candy',     // candy | cream | mint | gold | rainbow | custom
    edgeW: 12,           // 白边宽（相对字号 %）
    ringW: 5,            // 彩边宽
    shadowDist: 10,      // 投影距离
    shadowAngle: 55,     // 投影角度
    bounce: 0.35,        // 弹性抖动
    bounceSpeed: 2.5,
    weight: 900,
    font: '"PingFang SC","Microsoft YaHei",sans-serif',
    gloss: true,         // 高光斜杠
    customFill: '#ff5a8c',
    customStroke: '#4b7bff',
    background: '#fdf3e2'
  };

  // 配色方案
  const Z = {
    candy:   { fillA:'#ff93a8', fillB:'#ff2e5f', ring:'#c9184a', edge:'#ffffff', deep:'#8f0f35', shadow:'#801433' },
    cream:   { fillA:'#ffefad', fillB:'#ffc24b', ring:'#3a76e0', edge:'#fffdf4', deep:'#2a56a8', shadow:'#2c4f96' },
    mint:    { fillA:'#c9f7e6', fillB:'#5fe0bd', ring:'#ff7fb3', edge:'#ffffff', deep:'#1f8a70', shadow:'#237a66' },
    gold:    { fillA:'#ffe9a3', fillB:'#e8a92c', ring:'#2b2416', edge:'#f7ecc9', deep:'#151007', shadow:'#000000' },
    rainbow: { fillA:'', fillB:'', ring:'#ffffff', edge:'#312a4e', deep:'#ffffff', shadow:'#241d3d' }
  };

  const SCHEMES = [
    { key: 'candy',   label: '糖果红白' },
    { key: 'cream',   label: '奶黄蓝' },
    { key: 'mint',    label: '薄荷粉' },
    { key: 'gold',    label: '黑金' },
    { key: 'rainbow', label: '彩虹逐字' },
    { key: 'custom',  label: '自定' }
  ];

  // ========== 尺寸 ==========
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layoutKey = '';
  }

  // ========== 布局：把文字拆成逐字 glyphs ==========
  const meas = document.createElement('canvas').getContext('2d');
  let glyphs = [];
  let fs = 60;
  let layoutKey = '';

  function hash(n) {
    const t = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return t - Math.floor(t);
  }

  function buildLayout() {
    const key = `${CFG.text}|${W}x${H}|${CFG.weight}|${CFG.stagger}|${CFG.rotate}|${CFG.font}`;
    if (key === layoutKey) return;
    layoutKey = key;
    glyphs = [];

    const lines = CFG.text.split('\n').filter(l => l.length > 0);
    if (!lines.length) return;

    const fontStr = s => `${CFG.weight} ${s}px ${CFG.font}`;
    meas.font = fontStr(60);
    const charGap = 0.08;

    // 估算字号
    const cw = H * 0.76 / lines.length;
    let size = Math.floor(Math.min(cw * 0.72, W * 0.3));
    const measure = (str, s) => {
      meas.font = fontStr(s);
      const g = s * charGap;
      let total = 0, n = 0;
      for (const ch of str) { total += meas.measureText(ch).width + g; n++; }
      return n ? total - g : 0;
    };
    let maxW = 0;
    for (const l of lines) maxW = Math.max(maxW, measure(l, size));
    const maxAllowed = W * 0.84;
    if (maxW > maxAllowed) {
      size = Math.max(6, Math.floor(size * maxAllowed / maxW));
    }
    fs = size;
    meas.font = fontStr(fs);

    const lh = fs * 1.3;
    const startY = H / 2 - (lines.length - 1) * lh / 2;

    let idx = 0;
    for (let y = 0; y < lines.length; y++) {
      const chars = Array.from(lines[y]);
      const widths = chars.map(ch => meas.measureText(ch).width);
      const gap = fs * charGap;
      const total = widths.reduce((a, b) => a + b, 0) + gap * Math.max(0, chars.length - 1);
      let cx = W / 2 - total / 2;
      for (let i = 0; i < chars.length; i++) {
        const w = widths[i];
        const hx = hash(idx * 7.31 + y * 13.7);
        const hy = hash(idx * 3.17 + 47.9);
        const hz = hash(idx * 11.7 + 5.3);
        glyphs.push({
          ch: chars[i],
          x: cx + w / 2,
          y: startY + y * lh + (hy * 2 - 1) * CFG.stagger * fs * 0.16,
          rot: (hx * 2 - 1) * CFG.rotate * 0.2,
          ph: hz * Math.PI * 2,
          i: idx
        });
        cx += w + gap;
        idx++;
      }
    }
  }

  // ========== 计算配色 ==========
  function shade(hex, mul) {
    const s = hex.replace('#', '');
    const n = parseInt(s.length === 3 ? s.split('').map(c => c + c).join('') : s, 16);
    const r = Math.round((n >> 16 & 255) * mul);
    const g = Math.round((n >> 8 & 255) * mul);
    const b = Math.round((n & 255) * mul);
    return `rgb(${Math.min(255, r)},${Math.min(255, g)},${Math.min(255, b)})`;
  }

  function buildPalette() {
    if (CFG.scheme === 'custom') {
      return {
        fillA: shade(CFG.customFill, 1.35),
        fillB: CFG.customFill,
        ring: CFG.customStroke,
        edge: '#ffffff',
        deep: shade(CFG.customStroke, 0.55),
        shadow: shade(CFG.customStroke, 0.45)
      };
    }
    return Z[CFG.scheme] || Z.candy;
  }

  // ========== 渲染 ==========
  let time = 0, lastT = performance.now();

  function render(now) {
    const dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now; time += dt;

    buildLayout();

    ctx.fillStyle = CFG.background;
    ctx.fillRect(0, 0, W, H);

    if (!glyphs.length) {
      requestAnimationFrame(render);
      return;
    }

    const pal = buildPalette();
    const layers = Math.max(1, Math.min(4, Math.round(CFG.layers)));
    const r = fs;
    const ringW = CFG.ringW / 100 * r;
    const edgeW = CFG.edgeW / 100 * r;
    const widths = [ringW, edgeW, ringW * 0.7, edgeW * 0.6];
    const colors = [pal.ring, pal.edge, pal.deep, pal.edge];
    const offs = [];
    let acc = 0;
    for (let i = 0; i < layers; i++) { acc += widths[i]; offs.push(acc); }
    const maxLayer = acc;

    const shadowDist = CFG.shadowDist / 100 * r;
    const shadowAng = CFG.shadowAngle * Math.PI / 180;
    const shx = Math.cos(shadowAng) * shadowDist;
    const shy = Math.sin(shadowAng) * shadowDist;

    const bounce = CFG.bounce;
    const bspd = CFG.bounceSpeed;
    const gloss = CFG.gloss;

    // ========== 逐字绘制 ==========
    for (const g of glyphs) {
      // 弹性抖动：每个字独立相位
      const wob = bounce * 0.11 * Math.sin(time * bspd * 2 + g.ph);
      const sx = 1 - wob * 0.85;
      const sy = 1 + wob * 1.25;

      let fillA = pal.fillA, fillB = pal.fillB;
      if (CFG.scheme === 'rainbow') {
        const hue = (g.i * 47) % 360;
        fillA = `hsl(${hue} 95% 72%)`;
        fillB = `hsl(${hue} 85% 52%)`;
      }

      // ---- 投影 + 多层描边（合成在同一 save 里）----
      if (shadowDist > 0.01) {
        ctx.save();
        ctx.translate(g.x + shx, g.y + shy);
        ctx.rotate(g.rot);
        ctx.scale(sx, sy);
        ctx.strokeStyle = pal.shadow;
        ctx.fillStyle = pal.shadow;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        if (maxLayer > 0) {
          ctx.lineWidth = maxLayer * 2;
          ctx.strokeText(g.ch, 0, 0);
        }
        ctx.fillText(g.ch, 0, 0);
        ctx.restore();
      }

      ctx.save();
      ctx.translate(g.x, g.y);
      ctx.rotate(g.rot);
      ctx.scale(sx, sy);

      // 由外向内画描边层
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      for (let i = layers - 1; i >= 0; i--) {
        if (offs[i] <= 0) continue;
        ctx.lineWidth = offs[i] * 2;
        ctx.strokeStyle = colors[i];
        ctx.strokeText(g.ch, 0, 0);
      }

      // 填充渐变
      const grad = ctx.createLinearGradient(0, -r * 0.52, 0, r * 0.48);
      grad.addColorStop(0, fillA);
      grad.addColorStop(1, fillB);
      ctx.fillStyle = grad;
      ctx.fillText(g.ch, 0, 0);

      // 高光斜杠
      if (gloss) {
        const gl = ctx.createLinearGradient(-r * 0.5, -r * 0.5, r * 0.5, r * 0.5);
        gl.addColorStop(0, 'rgba(255,255,255,0)');
        gl.addColorStop(0.32, 'rgba(255,255,255,0)');
        gl.addColorStop(0.40, 'rgba(255,255,255,0.8)');
        gl.addColorStop(0.52, 'rgba(255,255,255,0.75)');
        gl.addColorStop(0.60, 'rgba(255,255,255,0)');
        gl.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = gl;
        ctx.fillText(g.ch, 0, 0);
      }

      ctx.restore();
    }

    requestAnimationFrame(render);
  }

  // ========== 按钮 ==========
  let schemeIdx = 0;
  const mLabel = document.getElementById('m');

  document.getElementById('btn-scheme').addEventListener('click', () => {
    schemeIdx = (schemeIdx + 1) % SCHEMES.length;
    CFG.scheme = SCHEMES[schemeIdx].key;
    mLabel.textContent = SCHEMES[schemeIdx].label;
  });

  const CONTENTS = [
    { text: 'AURORA', scheme: 'candy' },
    { text: '打 CALL', scheme: 'rainbow' },
    { text: '可爱', scheme: 'mint' },
    { text: 'SUGOI', scheme: 'cream' },
    { text: '发光吧', scheme: 'gold' },
    { text: '⚡', scheme: 'custom', customFill: '#ff4d9d', customStroke: '#4b7bff' }
  ];
  let contentIdx = 0;
  document.getElementById('btn-text').addEventListener('click', () => {
    contentIdx = (contentIdx + 1) % CONTENTS.length;
    const c = CONTENTS[contentIdx];
    CFG.text = c.text;
    CFG.scheme = c.scheme;
    if (c.customFill) CFG.customFill = c.customFill;
    if (c.customStroke) CFG.customStroke = c.customStroke;
    // 更新标签
    const s = SCHEMES.findIndex(x => x.key === c.scheme);
    if (s >= 0) { schemeIdx = s; mLabel.textContent = SCHEMES[s].label; }
    layoutKey = '';
  });

  // ========== 启动 ==========
  resize();
  window.addEventListener('resize', () => setTimeout(resize, 80));
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
