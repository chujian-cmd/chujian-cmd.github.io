<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>万花筒 Kaleidoscope</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0a0b12;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }

  #bar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: max(12px, env(safe-area-inset-top)) 12px 12px;
    display: flex; gap: 8px; align-items: center;
    background: linear-gradient(180deg, rgba(10,11,18,0.8), rgba(10,11,18,0));
    z-index: 10; pointer-events: none;
    font: 13px -apple-system, "PingFang SC", sans-serif;
    color: #c3c9d4;
  }
  #bar > * { pointer-events: auto; }
  #bar .mode { flex: 1; color: #8a8f98; }
  #bar .mode b { color: #f7f8f8; font-weight: 600; }

  .btn {
    height: 38px; padding: 0 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    color: #f7f8f8; font: 500 13px -apple-system, "PingFang SC", sans-serif;
    cursor: pointer; -webkit-user-select: none; user-select: none;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .btn:active { background: rgba(255,255,255,0.14); }
  .btn.pri { background: rgba(94,106,210,0.32); border-color: rgba(94,106,210,0.6); }

  #hint {
    position: fixed; left: 0; right: 0;
    bottom: max(20px, env(safe-area-inset-bottom));
    text-align: center; color: #6a6f7a;
    font: 12px -apple-system, "PingFang SC", sans-serif;
    pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="bar">
  <div class="mode">万花筒 <b id="m">宝石</b></div>
  <button class="btn" id="btn-reset">重置</button>
  <button class="btn pri" id="btn-change">换样式</button>
</div>

<div id="hint">按住屏幕 = 万花筒中心跟着手指</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
              || (navigator.maxTouchPoints > 1);

// ---------- 参数 ----------
const CFG = {
  segments: 8,       // 分段数（对称的份数）
  zoom: 2.0,         // 缩放
  scale: 1.6,        // 图案密度
  rotate: 0.12,      // 旋转速度
  drift: 0.1,        // 漂移
  bands: 4,          // 条纹密度
  detail: 4,         // 噪声层数
  brightness: 1.1,
  colorBias: '#5a6bff',
  colorPhase: '#334d80',
  background: '#0a0b12'
};

const PIXEL_RATIO = isMobile ? 0.6 : 0.9;

// ---------- three.js ----------
const canvasEl = document.getElementById('cv');

const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: false });
renderer.setPixelRatio(PIXEL_RATIO);
renderer.setSize(innerWidth, innerHeight, false);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const vert = /* glsl */`
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = vec4(position.xy, 0.0, 1.0);
  }
`;

const frag = /* glsl */`
  precision highp float;
  varying vec2 vUv;

  uniform vec2  uResolution;
  uniform vec2  uMouse;
  uniform float uTime;
  uniform float uSegments;
  uniform float uZoom;
  uniform float uScale;
  uniform float uRotate;
  uniform float uDrift;
  uniform float uBands;
  uniform float uDetail;
  uniform float uBrightness;
  uniform vec3  uColorBias;
  uniform vec3  uColorPhase;
  uniform vec3  uBackground;

  #define TAU 6.28318530718
  #define PI 3.14159265359

  // 2D simplex 噪声
  vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
  vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
  vec3 permute(vec3 x) { return mod289(((x * 34.0) + 1.0) * x); }
  float snoise(vec2 v) {
    const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                       -0.577350269189626, 0.024390243902439);
    vec2 i = floor(v + dot(v, C.yy));
    vec2 x0 = v - i + dot(i, C.xx);
    vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
    vec4 x12 = x0.xyxy + C.xxzz;
    x12.xy -= i1;
    i = mod289(i);
    vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0))
                            + i.x + vec3(0.0, i1.x, 1.0));
    vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy),
                            dot(x12.zw, x12.zw)), 0.0);
    m = m * m; m = m * m;
    vec3 x = 2.0 * fract(p * C.www) - 1.0;
    vec3 h = abs(x) - 0.5;
    vec3 ox = floor(x + 0.5);
    vec3 a0 = x - ox;
    m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
    vec3 g;
    g.x = a0.x * x0.x + h.x * x0.y;
    g.yz = a0.yz * x12.xz + h.yz * x12.yw;
    return 130.0 * dot(m, g);
  }

  float fbm(vec2 p) {
    float s = 0.0, a = 0.5, f = 1.0;
    for (int i = 0; i < 6; i++) {
      if (float(i) >= uDetail) break;
      s += a * snoise(p * f);
      f *= 2.0;
      a *= 0.5;
    }
    return s;
  }

  vec3 palette(float t, vec3 a, vec3 b, vec3 c, vec3 d) {
    return a + b * cos(TAU * (c * t + d));
  }

  void main() {
    vec2 uv = (vUv - 0.5) * 2.0;
    uv.x *= uResolution.x / uResolution.y;

    // 指针作为万花筒中心
    vec2 mouseNdc = (uMouse - 0.5) * 2.0;
    mouseNdc.x *= uResolution.x / uResolution.y;
    uv -= mouseNdc * 0.5;

    float r = length(uv);
    float a = atan(uv.y, uv.x) + uTime * uRotate;

    // 极坐标折叠：把角度限制在一个扇区里，并镜像
    float seg = TAU / uSegments;
    a = mod(a, seg);
    a = abs(a - seg * 0.5);

    // 用折叠后的角度 + 半径 构造采样坐标
    vec2 p = vec2(cos(a), sin(a)) * r * uZoom;
    p += vec2(uTime * uDrift, 0.0);

    // 两层 fbm 叠加
    float n = fbm(p * uScale);
    float m = fbm(p * uScale * 2.0 + n);
    float v = 0.5 + 0.5 * sin((n + m) * PI * uBands + uTime * 0.4);

    // 调色
    vec3 col = palette(
      v,
      uColorBias,
      vec3(0.5),
      vec3(1.0, 1.0, 1.0),
      uColorPhase
    );

    // 径向渐隐：中心亮，外圈暗
    col *= smoothstep(1.15, 0.2, r) * uBrightness;

    // 背景融合
    col = mix(uBackground, col, smoothstep(1.2, 0.9, r) * 0.0 + 1.0);
    // （保持 col 不变，让外圈自然衰减到 0）

    gl_FragColor = vec4(col, 1.0);
  }
`;

const material = new THREE.ShaderMaterial({
  vertexShader: vert,
  fragmentShader: frag,
  uniforms: {
    uResolution: { value: new THREE.Vector2(1, 1) },
    uMouse: { value: new THREE.Vector2(0.5, 0.5) },
    uTime: { value: 0 },
    uSegments: { value: CFG.segments },
    uZoom: { value: CFG.zoom },
    uScale: { value: CFG.scale },
    uRotate: { value: CFG.rotate },
    uDrift: { value: CFG.drift },
    uBands: { value: CFG.bands },
    uDetail: { value: CFG.detail },
    uBrightness: { value: CFG.brightness },
    uColorBias: { value: new THREE.Color(CFG.colorBias) },
    uColorPhase: { value: new THREE.Color(CFG.colorPhase) },
    uBackground: { value: new THREE.Color(CFG.background) }
  }
});

const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
mesh.frustumCulled = false;
scene.add(mesh);

// ---------- 尺寸 ----------
function resize() {
  const W = innerWidth;
  const H = innerHeight;
  renderer.setPixelRatio(PIXEL_RATIO);
  renderer.setSize(W, H, false);
  material.uniforms.uResolution.value.set(W * PIXEL_RATIO, H * PIXEL_RATIO);
}
resize();

// ---------- 指针 ----------
const pointer = { x: 0.5, y: 0.5, targetX: 0.5, targetY: 0.5, down: false };
const rect = () => canvasEl.getBoundingClientRect();

const onDown = e => {
  const t = e.touches ? e.touches[0] : e;
  const r = rect();
  pointer.targetX = (t.clientX - r.left) / r.width;
  pointer.targetY = (t.clientY - r.top) / r.height;
  pointer.down = true;
  if (e.touches) e.preventDefault();
};
const onMove = e => {
  const t = e.touches ? e.touches[0] : e;
  const r = rect();
  pointer.targetX = (t.clientX - r.left) / r.width;
  pointer.targetY = (t.clientY - r.top) / r.height;
  if (e.touches) e.preventDefault();
};
const onUp = () => { pointer.down = false; };

canvasEl.addEventListener('touchstart', onDown, { passive: false });
canvasEl.addEventListener('touchmove', onMove, { passive: false });
canvasEl.addEventListener('touchend', onUp);
canvasEl.addEventListener('touchcancel', onUp);
canvasEl.addEventListener('mousedown', onDown);
canvasEl.addEventListener('mousemove', onMove);
canvasEl.addEventListener('mouseup', onUp);
canvasEl.addEventListener('mouseleave', onUp);

// ---------- 主循环 ----------
let startTime = performance.now();
function loop(now) {
  const t = (now - startTime) / 1000;
  pointer.x += (pointer.targetX - pointer.x) * 0.08;
  pointer.y += (pointer.targetY - pointer.y) * 0.08;

  const u = material.uniforms;
  u.uTime.value = t;
  u.uMouse.value.set(pointer.x, pointer.y);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// ---------- 按钮 ----------
const mEl = document.getElementById('m');

const STYLES = [
  { name: '宝石',   segments: 6,  zoom: 2.4, scale: 1.6, bands: 5, rotate: 0.12, drift: 0.1,
    colorBias: '#7c86ff', colorPhase: '#264d80', brightness: 1.1 },
  { name: '花窗',   segments: 12, zoom: 2.0, scale: 1.4, bands: 3, rotate: 0.06, drift: 0.08,
    colorBias: '#ff8a5c', colorPhase: '#803333', brightness: 1.1 },
  { name: '冰晶',   segments: 6,  zoom: 2.6, scale: 2.2, bands: 4, rotate: 0.1, drift: 0.12,
    colorBias: '#8fd4ff', colorPhase: '#204060', brightness: 1.3 },
  { name: '迷幻',   segments: 16, zoom: 1.8, scale: 1.8, bands: 7, rotate: 0.3, drift: 0.3,
    colorBias: '#ff5ac8', colorPhase: '#402060', brightness: 1.15 },
  { name: '极光',   segments: 4,  zoom: 3.2, scale: 1.2, bands: 6, rotate: 0.08, drift: 0.2,
    colorBias: '#4ecb8d', colorPhase: '#1a4050', brightness: 1.2 }
];
let styleIdx = 0;

function applyStyle(s) {
  CFG.segments = s.segments;
  CFG.zoom = s.zoom;
  CFG.scale = s.scale;
  CFG.bands = s.bands;
  CFG.rotate = s.rotate;
  CFG.drift = s.drift;
  CFG.colorBias = s.colorBias;
  CFG.colorPhase = s.colorPhase;
  CFG.brightness = s.brightness;

  const u = material.uniforms;
  u.uSegments.value = CFG.segments;
  u.uZoom.value = CFG.zoom;
  u.uScale.value = CFG.scale;
  u.uBands.value = CFG.bands;
  u.uRotate.value = CFG.rotate;
  u.uDrift.value = CFG.drift;
  u.uColorBias.value.set(CFG.colorBias);
  u.uColorPhase.value.set(CFG.colorPhase);
  u.uBrightness.value = CFG.brightness;
}

document.getElementById('btn-reset').addEventListener('click', () => {
  startTime = performance.now();
  pointer.targetX = 0.5;
  pointer.targetY = 0.5;
});

document.getElementById('btn-change').addEventListener('click', () => {
  styleIdx = (styleIdx + 1) % STYLES.length;
  applyStyle(STYLES[styleIdx]);
  mEl.textContent = STYLES[styleIdx].name;
});

// ---------- 启动 ----------
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

applyStyle(STYLES[0]);
mEl.textContent = STYLES[0].name;
requestAnimationFrame(loop);
</script>
</body>
</html>
