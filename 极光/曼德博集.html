<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>曼德博集 Mandelbrot</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #06060c;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #bar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: max(12px, env(safe-area-inset-top)) 12px 12px;
    display: flex; gap: 8px; align-items: center;
    background: linear-gradient(180deg, rgba(6,6,12,0.8), rgba(6,6,12,0));
    z-index: 10; pointer-events: none;
    font: 13px -apple-system, "PingFang SC", sans-serif;
    color: #c3c9d4;
  }
  #bar > * { pointer-events: auto; }
  #bar .mode { flex: 1; color: #8a8f98; font-variant-numeric: tabular-nums; }
  #bar .mode b { color: #f7f8f8; font-weight: 600; }

  .btn {
    height: 38px; padding: 0 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    color: #f7f8f8; font: 500 13px -apple-system, "PingFang SC", sans-serif;
    cursor: pointer; -webkit-user-select: none; user-select: none;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .btn:active { background: rgba(255,255,255,0.14); }
  .btn.pri { background: rgba(94,106,210,0.32); border-color: rgba(94,106,210,0.6); }

  #hint {
    position: fixed; left: 0; right: 0;
    bottom: max(20px, env(safe-area-inset-bottom));
    text-align: center; color: #6a6f7a;
    font: 12px -apple-system, "PingFang SC", sans-serif;
    pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="bar">
  <div class="mode">曼德博 <b id="m">×1.2</b></div>
  <button class="btn" id="btn-reset">回到全景</button>
  <button class="btn pri" id="btn-change">换配色</button>
</div>

<div id="hint">单指拖动 = 平移 · 双指捏合 = 放大 · 自动缓慢放大</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
                || (navigator.maxTouchPoints > 1);

  // ---------- 参数 ----------
  const CFG = {
    // 视图
    centerX: -0.745,
    centerY: 0.113,
    zoom: 1.2,
    zoomSpeed: 0.15,        // 自动缩放速度（每秒倍率）0=关闭

    // 精度
    maxIter: isMobile ? 160 : 240,

    // 分辨率（渲染时使用的像素大小，越大越快）
    renderScale: isMobile ? 0.55 : 0.7,

    // 配色
    scheme: 0,
    schemes: [
      { name: '海马谷', bias: '#3a6bff', phase: '#20304d', shift: 0.05, bright: 1.1, bg: '#06060c' },
      { name: '闪电',   bias: '#fff35c', phase: '#1a1a00', shift: 0.15, bright: 1.3, bg: '#05060c' },
      { name: '螺旋深渊', bias: '#b366ff', phase: '#10052a', shift: 0.30, bright: 1.2, bg: '#04020c' },
      { name: '铜焰',   bias: '#ff8a3d', phase: '#2a0f00', shift: 0.08, bright: 1.15, bg: '#0a0503' },
      { name: '翡翠',   bias: '#4ecb8d', phase: '#0a2418', shift: 0.22, bright: 1.2, bg: '#030c08' }
    ]
  };

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  // ---------- 尺寸 ----------
  let W = 0, H = 0, dpr = 1;
  const off = document.createElement('canvas');
  const octx = off.getContext('2d');
  let imgData = null;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    computeBuffer();
  }

  let RW = 0, RH = 0;
  function computeBuffer() {
    const scale = CFG.renderScale * dpr;
    RW = Math.max(2, Math.floor(W * scale));
    RH = Math.max(2, Math.floor(H * scale));
    off.width = RW;
    off.height = RH;
    imgData = octx.createImageData(RW, RH);
    needsRedraw = true;
  }

  // ---------- 坐标变换 ----------
  // 视口：宽 W、高 H（CSS 像素），映射到复平面
  // 中心 centerX, centerY；缩放 zoom（zoom=1 时视野宽 3.5）
  function viewBounds() {
    const aspect = W / H;
    const viewW = 3.5 / CFG.zoom;
    const viewH = viewW / aspect;
    return {
      x0: CFG.centerX - viewW / 2,
      y0: CFG.centerY - viewH / 2,
      x1: CFG.centerX + viewW / 2,
      y1: CFG.centerY + viewH / 2
    };
  }

  // ---------- 曼德博迭代 ----------
  function mandelbrot(cr, ci, maxIter) {
    let zr = 0, zi = 0;
    let zr2 = 0, zi2 = 0;
    for (let i = 0; i < maxIter; i++) {
      zi = 2 * zr * zi + ci;
      zr = zr2 - zi2 + cr;
      zr2 = zr * zr;
      zi2 = zi * zi;
      if (zr2 + zi2 > 4) return i;
    }
    return maxIter;
  }

  // 平滑逃逸值（消除色带断层）
  function smoothIter(cr, ci, maxIter) {
    let zr = 0, zi = 0;
    let zr2 = 0, zi2 = 0;
    let i;
    for (i = 0; i < maxIter; i++) {
      zi = 2 * zr * zi + ci;
      zr = zr2 - zi2 + cr;
      zr2 = zr * zr;
      zi2 = zi * zi;
      if (zr2 + zi2 > 4) break;
    }
    if (i >= maxIter) return -1;   // 集合内
    const mod = Math.sqrt(zr2 + zi2);
    return i + 1 - Math.log(Math.log(mod)) / Math.LN2;
  }

  // ---------- 配色 ----------
  let colLUT = null;   // Uint8Array 256*3
  function buildLUT() {
    const s = CFG.schemes[CFG.scheme];
    const hex2rgb = h => {
      const x = h.replace('#', '');
      const n = parseInt(x.length === 3 ? x.split('').map(c => c + c).join('') : x, 16);
      return [n >> 16 & 255, n >> 8 & 255, n & 255];
    };
    const [br, bg, bb] = hex2rgb(s.bias);
    colLUT = new Uint8Array(256 * 3);
    for (let i = 0; i < 256; i++) {
      const t = i / 255;
      // 用 cos 调色板
      const r = br * (0.5 + 0.5 * Math.cos(6.28318 * (t + s.shift + 0.0))) * s.bright;
      const g = bg * (0.5 + 0.5 * Math.cos(6.28318 * (t + s.shift + 0.33))) * s.bright;
      const b = bb * (0.5 + 0.5 * Math.cos(6.28318 * (t + s.shift + 0.67))) * s.bright;
      colLUT[i * 3]     = clamp(r, 0, 255);
      colLUT[i * 3 + 1] = clamp(g, 0, 255);
      colLUT[i * 3 + 2] = clamp(b, 0, 255);
    }
  }

  // ---------- 渲染 ----------
  let needsRedraw = true;
  let rendering = false;

  function renderFrame() {
    if (!needsRedraw) return;
    needsRedraw = false;

    const b = viewBounds();
    const maxIter = CFG.maxIter;
    const data = imgData.data;
    const s = CFG.schemes[CFG.scheme];

    // 背景色
    const hex2rgb = h => {
      const x = h.replace('#', '');
      const n = parseInt(x.length === 3 ? x.split('').map(c => c + c).join('') : x, 16);
      return [n >> 16 & 255, n >> 8 & 255, n & 255];
    };
    const [bgR, bgG, bgB] = hex2rgb(s.bg);

    for (let y = 0; y < RH; y++) {
      const ci = b.y0 + (y / RH) * (b.y1 - b.y0);
      for (let x = 0; x < RW; x++) {
        const cr = b.x0 + (x / RW) * (b.x1 - b.x0);
        const it = smoothIter(cr, ci, maxIter);
        const p = (y * RW + x) * 4;
        if (it < 0) {
          data[p] = 0;
          data[p + 1] = 0;
          data[p + 2] = 0;
          data[p + 3] = 255;
        } else {
          // 平滑值映射到 0~255
          const t = (it / maxIter);
          const k = ((t * 256) | 0) & 255;
          data[p]     = colLUT[k * 3];
          data[p + 1] = colLUT[k * 3 + 1];
          data[p + 2] = colLUT[k * 3 + 2];
          data[p + 3] = 255;
        }
      }
    }

    octx.putImageData(imgData, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(off, 0, 0, RW, RH, 0, 0, W, H);
  }

  // ---------- 指针：拖动平移 ----------
  let dragging = false;
  let dragStartX = 0, dragStartY = 0;
  let centerStartX = 0, centerStartY = 0;
  let pinchStartDist = 0;
  let pinchStartZoom = 1;

  function screenToComplex(sx, sy) {
    const b = viewBounds();
    return {
      x: b.x0 + (sx / W) * (b.x1 - b.x0),
      y: b.y0 + (sy / H) * (b.y1 - b.y0)
    };
  }

  // 触摸
  cv.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      const t = e.touches[0];
      dragging = true;
      dragStartX = t.clientX;
      dragStartY = t.clientY;
      centerStartX = CFG.centerX;
      centerStartY = CFG.centerY;
    } else if (e.touches.length === 2) {
      dragging = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchStartDist = Math.hypot(dx, dy);
      pinchStartZoom = CFG.zoom;
    }
    e.preventDefault();
  }, { passive: false });

  cv.addEventListener('touchmove', e => {
    if (e.touches.length === 1 && dragging) {
      const t = e.touches[0];
      const r = cv.getBoundingClientRect();
      const sx = t.clientX - r.left;
      const sy = t.clientY - r.top;
      const startC = screenToComplex(dragStartX - r.left, dragStartY - r.top);
      const curC = screenToComplex(sx, sy);
      CFG.centerX = centerStartX - (curC.x - startC.x);
      CFG.centerY = centerStartY - (curC.y - startC.y);
      needsRedraw = true;
      updateZoomLabel();
    } else if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const d = Math.hypot(dx, dy);
      if (pinchStartDist > 0) {
        CFG.zoom = clamp(pinchStartZoom * (d / pinchStartDist), 0.3, 500);
        needsRedraw = true;
        updateZoomLabel();
      }
    }
    e.preventDefault();
  }, { passive: false });

  cv.addEventListener('touchend', e => {
    if (e.touches.length === 0) dragging = false;
  });

  // 鼠标
  cv.addEventListener('mousedown', e => {
    const r = cv.getBoundingClientRect();
    dragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    centerStartX = CFG.centerX;
    centerStartY = CFG.centerY;
  });
  cv.addEventListener('mousemove', e => {
    if (!dragging) return;
    const r = cv.getBoundingClientRect();
    const sx = e.clientX - r.left;
    const sy = e.clientY - r.top;
    const startC = screenToComplex(dragStartX - r.left, dragStartY - r.top);
    const curC = screenToComplex(sx, sy);
    CFG.centerX = centerStartX - (curC.x - startC.x);
    CFG.centerY = centerStartY - (curC.y - startC.y);
    needsRedraw = true;
    updateZoomLabel();
  });
  cv.addEventListener('mouseup', () => { dragging = false; });
  cv.addEventListener('mouseleave', () => { dragging = false; });

  cv.addEventListener('wheel', e => {
    e.preventDefault();
    CFG.zoom = clamp(CFG.zoom * Math.exp(-e.deltaY * 0.0015), 0.3, 500);
    needsRedraw = true;
    updateZoomLabel();
  }, { passive: false });

  // ---------- 自动缩放 ----------
  let lastAutoTime = 0;

  // ---------- 主循环 ----------
  let lastTime = performance.now();
  const mEl = document.getElementById('m');
  function updateZoomLabel() {
    mEl.textContent = `×${CFG.zoom.toFixed(1)}`;
  }

  function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    // 自动缓慢放大
    if (CFG.zoomSpeed > 0 && !dragging) {
      CFG.zoom *= Math.exp(CFG.zoomSpeed * dt);
      if (CFG.zoom > 500) CFG.zoom = 500;
      needsRedraw = true;
      updateZoomLabel();
    }

    // 每帧最多重绘一次（用 requestAnimationFrame 节流）
    if (needsRedraw) renderFrame();

    requestAnimationFrame(loop);
  }

  // ---------- 按钮 ----------
  document.getElementById('btn-reset').addEventListener('click', () => {
    CFG.centerX = -0.745;
    CFG.centerY = 0.113;
    CFG.zoom = 1.2;
    needsRedraw = true;
    updateZoomLabel();
  });

  document.getElementById('btn-change').addEventListener('click', () => {
    CFG.scheme = (CFG.scheme + 1) % CFG.schemes.length;
    buildLUT();
    needsRedraw = true;
    mEl.textContent = CFG.schemes[CFG.scheme].name;
  });

  // ---------- 启动 ----------
  resize();
  window.addEventListener('resize', () => {
    resize();
    needsRedraw = true;
  });
  window.addEventListener('orientationchange', () => setTimeout(() => {
    resize();
    needsRedraw = true;
  }, 200));

  buildLUT();
  mEl.textContent = CFG.schemes[CFG.scheme].name;
  updateZoomLabel();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
