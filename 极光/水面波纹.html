<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>水面波纹 Ripple</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #04080f;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }

  #bar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: max(12px, env(safe-area-inset-top)) 12px 12px;
    display: flex; gap: 8px; align-items: center;
    background: linear-gradient(180deg, rgba(4,8,15,0.8), rgba(4,8,15,0));
    z-index: 10; pointer-events: none;
    font: 13px -apple-system, "PingFang SC", sans-serif;
    color: #c3c9d4;
  }
  #bar > * { pointer-events: auto; }
  #bar .mode { flex: 1; color: #8a8f98; }
  #bar .mode b { color: #f7f8f8; font-weight: 600; }

  .btn {
    height: 38px; padding: 0 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    color: #f7f8f8; font: 500 13px -apple-system, "PingFang SC", sans-serif;
    cursor: pointer; -webkit-user-select: none; user-select: none;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .btn:active { background: rgba(255,255,255,0.14); }
  .btn.pri { background: rgba(94,106,210,0.32); border-color: rgba(94,106,210,0.6); }

  #hint {
    position: fixed; left: 0; right: 0;
    bottom: max(20px, env(safe-area-inset-bottom));
    text-align: center; color: #6a6f7a;
    font: 12px -apple-system, "PingFang SC", sans-serif;
    pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="bar">
  <div class="mode">水面 <b id="m">静湖</b></div>
  <button class="btn" id="btn-reset">平静</button>
  <button class="btn pri" id="btn-change">换配色</button>
</div>

<div id="hint">按住 / 划过屏幕 = 拨动水面 · 涟漪互相干涉</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
              || (navigator.maxTouchPoints > 1);

// ---------- 参数 ----------
const CFG = {
  tension: 0.4,      // 波速（<=0.5 稳定）
  damping: 0.996,    // 阻尼
  auto: 0.35,        // 环境涟漪（自动荡漾）
  normalStrength: 16,
  brightness: 1.0,
  mouseForce: 1.2,   // 拨水力
  brush: 1.0,        // 笔刷大小
  specular: 0.8,
  caustic: 1.2,
  colorDeep: '#0a1a3a',
  colorShallow: '#6be6ff'
};

const PIXEL_RATIO = isMobile ? 0.55 : 0.8;

// ---------- three.js ----------
const canvasEl = document.getElementById('cv');

const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: false });
renderer.setPixelRatio(PIXEL_RATIO);
renderer.setSize(innerWidth, innerHeight, false);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// ---------- 波动方程仿真 ----------
// 用两个 RT 交替：cur（当前）+ prev（上一帧）
const SIM_RES = isMobile ? 220 : 320;

function makeRT(w, h) {
  return new THREE.WebGLRenderTarget(w, h, {
    minFilter: THREE.NearestFilter,
    magFilter: THREE.NearestFilter,
    type: THREE.HalfFloatType,
    format: THREE.RGBAFormat,
    depthBuffer: false,
    stencilBuffer: false
  });
}

let rtA = makeRT(SIM_RES, SIM_RES);
let rtB = makeRT(SIM_RES, SIM_RES);

const simScene = new THREE.Scene();
const simCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const simVert = /* glsl */`
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = vec4(position.xy, 0.0, 1.0);
  }
`;

const simFrag = /* glsl */`
  precision highp float;
  varying vec2 vUv;
  uniform sampler2D uPrev;
  uniform vec2 uTexel;
  uniform float uTension;
  uniform float uDamping;
  uniform float uTime;
  uniform float uAuto;
  uniform float uMouseForce;
  uniform float uBrush;
  uniform vec2 uMouse;
  uniform vec2 uPrevMouse;
  uniform float uMouseDown;

  void main() {
    // 状态编码：r = 当前高度，g = 上一帧高度
    vec2 s = texture2D(uPrev, vUv).rg;
    float cur = s.r;
    float prev = s.g;

    // 4 邻拉普拉斯
    float l = texture2D(uPrev, vUv + vec2(-uTexel.x, 0.0)).r;
    float r = texture2D(uPrev, vUv + vec2( uTexel.x, 0.0)).r;
    float u = texture2D(uPrev, vUv + vec2(0.0, -uTexel.y)).r;
    float d = texture2D(uPrev, vUv + vec2(0.0,  uTexel.y)).r;
    float lap = (l + r + u + d) - 4.0 * cur;

    // 波动方程：next = 2*cur - prev + C*lap
    float next = 2.0 * cur - prev + uTension * lap;
    next *= uDamping;

    // 指针拨水
    if (uMouseDown > 0.5) {
      vec2 m = (vUv - uMouse) * vec2(1.0, 1.0);
      vec2 mPrev = (vUv - uPrevMouse) * vec2(1.0, 1.0);
      float dm = length(m);
      float dmPrev = length(mPrev);
      float stamp = smoothstep(uBrush * 0.06, 0.0, dm) + smoothstep(uBrush * 0.06, 0.0, dmPrev);
      next += stamp * uMouseForce;
    }

    // 环境涟漪：两个漫游的正弦点源
    if (uAuto > 0.0) {
      vec2 p1 = 0.5 + 0.3 * vec2(cos(uTime * 0.41), sin(uTime * 0.53));
      vec2 p2 = 0.5 + 0.32 * vec2(sin(uTime * 0.37), cos(uTime * 0.61));
      float d1 = length(vUv - p1);
      float d2 = length(vUv - p2);
      next += sin(uTime * 6.0) * smoothstep(0.03, 0.0, d1) * uAuto * 0.5;
      next += sin(uTime * 7.3) * smoothstep(0.03, 0.0, d2) * uAuto * 0.5;
    }

    next = clamp(next, -2.0, 2.0);
    gl_FragColor = vec4(next, cur, 0.0, 1.0);
  }
`;

const simMat = new THREE.ShaderMaterial({
  vertexShader: simVert,
  fragmentShader: simFrag,
  uniforms: {
    uPrev: { value: null },
    uTexel: { value: new THREE.Vector2(1 / SIM_RES, 1 / SIM_RES) },
    uTension: { value: CFG.tension },
    uDamping: { value: CFG.damping },
    uTime: { value: 0 },
    uAuto: { value: CFG.auto },
    uMouseForce: { value: CFG.mouseForce },
    uBrush: { value: CFG.brush },
    uMouse: { value: new THREE.Vector2(-1, -1) },
    uPrevMouse: { value: new THREE.Vector2(-1, -1) },
    uMouseDown: { value: 0 }
  }
});

const simQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), simMat);
simQuad.frustumCulled = false;
simScene.add(simQuad);

// ---------- 显示 shader ----------
const displayVert = simVert;

const displayFrag = /* glsl */`
  precision highp float;
  varying vec2 vUv;

  uniform sampler2D uState;
  uniform vec2 uTexel;
  uniform float uNormalStrength;
  uniform float uBrightness;
  uniform float uSpecular;
  uniform float uCaustic;
  uniform vec3 uColorDeep;
  uniform vec3 uColorShallow;

  void main() {
    // 从状态 RT 采样高度
    float h = texture2D(uState, vUv).r;
    float hx = texture2D(uState, vUv + vec2(uTexel.x, 0.0)).r
             - texture2D(uState, vUv - vec2(uTexel.x, 0.0)).r;
    float hy = texture2D(uState, vUv + vec2(0.0, uTexel.y)).r
             - texture2D(uState, vUv - vec2(0.0, uTexel.y)).r;

    // 从高度梯度计算法线
    vec3 n = normalize(vec3(-hx * uNormalStrength, -hy * uNormalStrength, 1.0));

    // 光照：主光源从左上
    vec3 L = normalize(vec3(0.5, 0.6, 0.7));
    float diff = 0.5 + 0.5 * dot(n, L);

    // 高光
    float spec = pow(clamp(dot(reflect(-L, n), vec3(0.0, 0.0, 1.0)), 0.0, 1.0), 40.0);

    // 高度染色：高 → 浅色，低 → 深色
    vec3 base = mix(uColorDeep, uColorShallow, clamp(h * 1.6 + 0.5, 0.0, 1.0));
    vec3 col = base * diff + spec * uSpecular;

    // 焦散：坡度越陡越亮
    col += uColorShallow * clamp(length(vec2(hx, hy)) * uCaustic, 0.0, 1.0);

    col *= uBrightness;
    gl_FragColor = vec4(col, 1.0);
  }
`;

const displayMat = new THREE.ShaderMaterial({
  vertexShader: displayVert,
  fragmentShader: displayFrag,
  uniforms: {
    uState: { value: null },
    uTexel: { value: new THREE.Vector2(1 / SIM_RES, 1 / SIM_RES) },
    uNormalStrength: { value: CFG.normalStrength },
    uBrightness: { value: CFG.brightness },
    uSpecular: { value: CFG.specular },
    uCaustic: { value: CFG.caustic },
    uColorDeep: { value: new THREE.Color(CFG.colorDeep) },
    uColorShallow: { value: new THREE.Color(CFG.colorShallow) }
  }
});

const displayQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), displayMat);
displayQuad.frustumCulled = false;
const displayScene = new THREE.Scene();
displayScene.add(displayQuad);

// 初始状态：把 g 通道置为 1（保证 cur 和 prev 都从 0 开始，用一次模拟初始化）
function initState() {
  renderer.setRenderTarget(rtA);
  renderer.setClearColor(0x000000, 1);
  renderer.clear();
  renderer.setRenderTarget(rtB);
  renderer.clear();
  renderer.setRenderTarget(null);
}
initState();

// ---------- 尺寸 ----------
function resize() {
  const W = innerWidth;
  const H = innerHeight;
  renderer.setPixelRatio(PIXEL_RATIO);
  renderer.setSize(W, H, false);
}
resize();

// ---------- 指针 ----------
const pointer = {
  x: 0.5, y: 0.5,
  prevX: 0.5, prevY: 0.5,
  down: false
};
const rect = () => canvasEl.getBoundingClientRect();

function updatePointer(e, isDown) {
  const t = e.touches ? e.touches[0] : e;
  const r = rect();
  // 注意：WebGL 的 vUv 是 (0,0) 在左下，屏幕 Y 要翻转
  pointer.prevX = pointer.x;
  pointer.prevY = pointer.y;
  pointer.x = (t.clientX - r.left) / r.width;
  pointer.y = 1 - (t.clientY - r.top) / r.height;
  if (isDown !== undefined) pointer.down = isDown;
}

const onDown = e => {
  const t = e.touches ? e.touches[0] : e;
  const r = rect();
  pointer.x = (t.clientX - r.left) / r.width;
  pointer.y = 1 - (t.clientY - r.top) / r.height;
  pointer.prevX = pointer.x;
  pointer.prevY = pointer.y;
  pointer.down = true;
  if (e.touches) e.preventDefault();
};
const onMove = e => {
  const t = e.touches ? e.touches[0] : e;
  const r = rect();
  pointer.prevX = pointer.x;
  pointer.prevY = pointer.y;
  pointer.x = (t.clientX - r.left) / r.width;
  pointer.y = 1 - (t.clientY - r.top) / r.height;
  if (e.touches) e.preventDefault();
};
const onUp = () => { pointer.down = false; };

canvasEl.addEventListener('touchstart', onDown, { passive: false });
canvasEl.addEventListener('touchmove', onMove, { passive: false });
canvasEl.addEventListener('touchend', onUp);
canvasEl.addEventListener('touchcancel', onUp);
canvasEl.addEventListener('mousedown', onDown);
canvasEl.addEventListener('mousemove', onMove);
canvasEl.addEventListener('mouseup', onUp);
canvasEl.addEventListener('mouseleave', onUp);

// ---------- 主循环 ----------
let startTime = performance.now();
function loop(now) {
  const t = (now - startTime) / 1000;

  // 1) 跑两步仿真（两个 substep，让波更"快"）
  for (let i = 0; i < 2; i++) {
    simMat.uniforms.uPrev.value = rtA.texture;
    simMat.uniforms.uTime.value = t;
    simMat.uniforms.uMouse.value.set(pointer.x, pointer.y);
    simMat.uniforms.uPrevMouse.value.set(pointer.prevX, pointer.prevY);
    simMat.uniforms.uMouseDown.value = pointer.down ? 1 : 0;

    renderer.setRenderTarget(rtB);
    renderer.render(simScene, simCamera);

    // swap
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }

  // 2) 显示
  displayMat.uniforms.uState.value = rtA.texture;
  renderer.setRenderTarget(null);
  renderer.render(displayScene, camera);

  requestAnimationFrame(loop);
}

// ---------- 按钮 ----------
const mEl = document.getElementById('m');

const SCHEMES = [
  { name: '静湖',   colorDeep: '#0a1a3a', colorShallow: '#6be6ff',
    tension: 0.35, damping: 0.997, auto: 0.25, brightness: 1.0, specular: 0.8, caustic: 1.2 },
  { name: '雨夜',   colorDeep: '#0a0a18', colorShallow: '#8fa8ff',
    tension: 0.42, damping: 0.992, auto: 0.6, brightness: 1.0, specular: 1.0, caustic: 1.0 },
  { name: '熔金',   colorDeep: '#2a1005', colorShallow: '#ffcf6b',
    tension: 0.40, damping: 0.994, auto: 0.4, brightness: 1.1, specular: 1.2, caustic: 1.4 },
  { name: '翡翠池', colorDeep: '#04231a', colorShallow: '#4effb0',
    tension: 0.38, damping: 0.996, auto: 0.3, brightness: 1.05, specular: 0.9, caustic: 1.2 },
  { name: '血池',   colorDeep: '#1a0005', colorShallow: '#ff5a7a',
    tension: 0.42, damping: 0.995, auto: 0.5, brightness: 1.05, specular: 1.0, caustic: 1.3 }
];
let schemeIdx = 0;

function applyScheme(s) {
  const u = simMat.uniforms;
  u.uTension.value = s.tension;
  u.uDamping.value = s.damping;
  u.uAuto.value = s.auto;

  const d = displayMat.uniforms;
  d.uColorDeep.value.set(s.colorDeep);
  d.uColorShallow.value.set(s.colorShallow);
  d.uBrightness.value = s.brightness;
  d.uSpecular.value = s.specular;
  d.uCaustic.value = s.caustic;
}

document.getElementById('btn-reset').addEventListener('click', () => {
  initState();
});

document.getElementById('btn-change').addEventListener('click', () => {
  schemeIdx = (schemeIdx + 1) % SCHEMES.length;
  applyScheme(SCHEMES[schemeIdx]);
  mEl.textContent = SCHEMES[schemeIdx].name;
});

// ---------- 启动 ----------
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

applyScheme(SCHEMES[0]);
mEl.textContent = SCHEMES[0].name;
requestAnimationFrame(loop);
</script>
</body>
</html>
