<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>流场飘散 · 你好</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06070c; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  // ---------- 可调参数 ----------
  const CFG = {
    text: '你好',
    font: '"PingFang SC","Microsoft YaHei","Heiti SC","Noto Sans CJK SC",sans-serif',
    weight: 800,
    step: 4,                // 采样步长：越小粒子越多越清晰
    dotSize: 2.2,           // 粒子大小
    alphaThreshold: 0.5,    // alpha 阈值
    trail: 0.2,             // 拖尾：越小拖尾越长（流场飘散建议 0.15~0.3）
    glow: true,             // 辉光叠加
    background: '#06070c',
    colorMode: 'rainbow',   // white | rainbow | duo

    // —— 流场动态 ——
    flowForce: 1.4,         // 流场强度：越大吹得越散
    flowScale: 0.0022,      // 噪声缩放：越小涡旋越大
    evolve: 0.15,           // 场演化速度
    attract: 0.04,          // 回聚力：越大越快聚回字

    // —— 交互 ——
    mouseForce: 1.5,        // 鼠标力
    mouseRadius: 130,       // 作用半径

    colorA: '#8ea2ff',
    colorB: '#ff7de0',
    maxParticles: 55000
  };

  const hex2rgb = h => {
    const s = h.replace('#', '');
    const n = parseInt(s.length === 3 ? s.split('').map(c => c + c).join('') : s, 16);
    return [n >> 16 & 255, n >> 8 & 255, n & 255];
  };
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  // ---------- 简易 Simplex 噪声（够用就行） ----------
  class Noise {
    constructor(seed = 0) {
      this.perm = new Uint8Array(512);
      const p = new Uint8Array(256);
      for (let i = 0; i < 256; i++) p[i] = i;
      let s = (seed | 0) ^ 2654435769;
      const rnd = () => {
        s ^= s << 13; s ^= s >>> 17; s ^= s << 5;
        return ((s >>> 0) % 1e6) / 1e6;
      };
      for (let i = 255; i > 0; i--) {
        const j = Math.floor(rnd() * (i + 1));
        [p[i], p[j]] = [p[j], p[i]];
      }
      for (let i = 0; i < 512; i++) this.perm[i] = p[i & 255];
    }
    // 3D simplex 的近似实现（够做流场用）
    noise3D(x, y, z) {
      const p = this.perm;
      const F3 = 1 / 3, G3 = 1 / 6;
      const s = (x + y + z) * F3;
      const i = Math.floor(x + s), j = Math.floor(y + s), k = Math.floor(z + s);
      const t = (i + j + k) * G3;
      const X0 = i - t, Y0 = j - t, Z0 = k - t;
      const x0 = x - X0, y0 = y - Y0, z0 = z - Z0;

      let i1, j1, k1, i2, j2, k2;
      if (x0 >= y0) {
        if (y0 >= z0) { i1 = 1; j1 = 0; k1 = 0; i2 = 1; j2 = 1; k2 = 0; }
        else if (x0 >= z0) { i1 = 1; j1 = 0; k1 = 0; i2 = 1; j2 = 0; k2 = 1; }
        else { i1 = 0; j1 = 0; k1 = 1; i2 = 1; j2 = 0; k2 = 1; }
      } else {
        if (y0 < z0) { i1 = 0; j1 = 0; k1 = 1; i2 = 0; j2 = 1; k2 = 1; }
        else if (x0 < z0) { i1 = 0; j1 = 1; k1 = 0; i2 = 0; j2 = 1; k2 = 1; }
        else { i1 = 0; j1 = 1; k1 = 0; i2 = 1; j2 = 1; k2 = 0; }
      }

      const x1 = x0 - i1 + G3, y1 = y0 - j1 + G3, z1 = z0 - k1 + G3;
      const x2 = x0 - i2 + 2 * G3, y2 = y0 - j2 + 2 * G3, z2 = z0 - k2 + 2 * G3;
      const x3 = x0 - 1 + 3 * G3, y3 = y0 - 1 + 3 * G3, z3 = z0 - 1 + 3 * G3;

      const ii = i & 255, jj = j & 255, kk = k & 255;
      let n = 0;
      const grad = (hash, x, y, z) => {
        const h = hash & 15;
        const u = h < 8 ? x : y;
        const v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
        return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
      };
      let t0 = 0.6 - x0 * x0 - y0 * y0 - z0 * z0;
      if (t0 > 0) n += (t0 *= t0) * t0 * grad(p[ii + p[jj + p[kk]]], x0, y0, z0);
      let t1 = 0.6 - x1 * x1 - y1 * y1 - z1 * z1;
      if (t1 > 0) n += (t1 *= t1) * t1 * grad(p[ii + i1 + p[jj + j1 + p[kk + k1]]], x1, y1, z1);
      let t2 = 0.6 - x2 * x2 - y2 * y2 - z2 * z2;
      if (t2 > 0) n += (t2 *= t2) * t2 * grad(p[ii + i2 + p[jj + j2 + p[kk + k2]]], x2, y2, z2);
      let t3 = 0.6 - x3 * x3 - y3 * y3 - z3 * z3;
      if (t3 > 0) n += (t3 *= t3) * t3 * grad(p[ii + 1 + p[jj + 1 + p[kk + 1]]], x3, y3, z3);
      return 32 * n;
    }
  }

  // ---------- 文字栅格化 ----------
  const raster = {
    big: document.createElement('canvas'),
    grid: document.createElement('canvas'),
    bigCtx: null,
    gridCtx: null,
    init() {
      this.bigCtx = this.big.getContext('2d');
      this.gridCtx = this.grid.getContext('2d', { willReadFrequently: true });
    },
    sample(text, gw, gh, weight, font, aspect) {
      const BIG_H = 1024;
      const BIG_W = Math.max(64, Math.round(BIG_H * aspect));
      this.big.width = BIG_W;
      this.big.height = BIG_H;

      const bc = this.bigCtx;
      bc.clearRect(0, 0, BIG_W, BIG_H);
      bc.fillStyle = '#fff';
      bc.textAlign = 'center';
      bc.textBaseline = 'middle';

      const lines = (text || '你好').split('\n').filter(l => l.length > 0);
      if (!lines.length) return null;

      const maxW = BIG_W * 0.82;
      const maxH = BIG_H * 0.82;

      let size = Math.floor(Math.min(maxH / lines.length, maxW) * 0.85);
      const setFont = s => { bc.font = `${weight} ${s}px ${font}`; };
      setFont(size);

      let widest = 0;
      for (const l of lines) widest = Math.max(widest, bc.measureText(l).width);
      if (widest > maxW) {
        size = Math.max(4, Math.floor(size * maxW / widest));
        setFont(size);
      }
      const totalH = size * 1.15 * lines.length;
      if (totalH > maxH) {
        size = Math.max(4, Math.floor(size * maxH / totalH));
        setFont(size);
      }

      const lineH = size * 1.15;
      const startY = BIG_H / 2 - (lines.length - 1) * lineH / 2;
      for (let i = 0; i < lines.length; i++) {
        bc.fillText(lines[i], BIG_W / 2, startY + i * lineH);
      }

      this.grid.width = gw;
      this.grid.height = gh;
      const gc = this.gridCtx;
      gc.clearRect(0, 0, gw, gh);
      gc.imageSmoothingEnabled = true;
      gc.imageSmoothingQuality = 'high';
      gc.drawImage(this.big, 0, 0, BIG_W, BIG_H, 0, 0, gw, gh);

      return gc.getImageData(0, 0, gw, gh);
    }
  };
  raster.init();

  const noise = new Noise(7);

  // ---------- 粒子 ----------
  class FlowParticles {
    constructor(w, h) {
      this.w = w; this.h = h;
      this.n = 0;
      this.x = this.y = null;
      this.tx = this.ty = null;
      this.sig = '';
    }
    resize(w, h) { this.w = w; this.h = h; this.sig = ''; }

    rebuild() {
      const w = this.w, h = this.h;
      const fit = 0.9;
      const rw = w * fit, rh = h * fit;

      let gw = Math.max(2, Math.round(rw / CFG.step));
      let gh = Math.max(2, Math.round(rh / CFG.step));

      if (gw * gh > CFG.maxParticles) {
        const k = Math.sqrt(gw * gh / CFG.maxParticles);
        gw = Math.max(2, Math.round(gw / k));
        gh = Math.max(2, Math.round(gh / k));
      }

      const img = raster.sample(CFG.text, gw, gh, CFG.weight, CFG.font, gw / gh);
      if (!img) { this.n = 0; this.sig = ''; return; }

      const data = img.data;
      const total = gw * gh;
      const T = CFG.alphaThreshold * 255;
      const valid = [];
      for (let i = 0; i < total; i++) {
        if (data[i * 4 + 3] > T) valid.push(i);
      }
      const n = valid.length;
      console.log('[流场] 网格', gw, 'x', gh, '有效粒子', n, '/', total);

      const ox = (w - rw) / 2, oy = (h - rh) / 2;
      const cw = rw / gw, ch = rh / gh;

      if (n !== this.n) {
        this.x = new Float32Array(n);
        this.y = new Float32Array(n);
        this.tx = new Float32Array(n);
        this.ty = new Float32Array(n);
      }
      for (let k = 0; k < n; k++) {
        const i = valid[k];
        const gx = i % gw;
        const gy = (i / gw) | 0;
        this.tx[k] = ox + (gx + 0.5) * cw;
        this.ty[k] = oy + (gy + 0.5) * ch;
        // 初始稍微散开一点
        const a = Math.random() * Math.PI * 2;
        const r = 30 + Math.random() * 200;
        this.x[k] = this.tx[k] + Math.cos(a) * r;
        this.y[k] = this.ty[k] + Math.sin(a) * r;
      }
      this.n = n;
      this.sig = `${CFG.text}|${CFG.weight}|${CFG.font}|${w}x${h}`;
    }

    update(frame) {
      const { ctx2d, pointer, time, dt } = frame;
      const w = this.w, h = this.h;

      const sig = `${CFG.text}|${CFG.weight}|${CFG.font}|${w}x${h}`;
      if (sig !== this.sig) this.rebuild();

      const [br, bg, bb] = hex2rgb(CFG.background);
      ctx2d.globalCompositeOperation = 'source-over';
      ctx2d.fillStyle = `rgba(${br},${bg},${bb},${CFG.trail})`;
      ctx2d.fillRect(0, 0, w, h);

      if (this.n === 0) return;

      ctx2d.globalCompositeOperation = CFG.glow ? 'lighter' : 'source-over';

      const dot = CFG.dotSize;
      const half = dot / 2;
      const [caR, caG, caB] = hex2rgb(CFG.colorA);
      const [cbR, cbG, cbB] = hex2rgb(CFG.colorB);

      const flowF = CFG.flowForce;
      const scale = CFG.flowScale;
      const attr = CFG.attract;
      const evo = time * CFG.evolve;
      const z = clamp(dt * 60, 0, 3);

      const mActive = pointer.inside;
      const mx = pointer.x, my = pointer.y;
      const RAD = CFG.mouseRadius;
      const MF = CFG.mouseForce;

      const mode = CFG.colorMode;
      const P = time * 20;

      for (let i = 0; i < this.n; i++) {
        const px = this.x[i], py = this.y[i];
        const tx = this.tx[i], ty = this.ty[i];

        // 流场方向：noise 采样得到角度
        const ang = noise.noise3D(px * scale, py * scale, evo) * Math.PI * 2;
        let vx = Math.cos(ang) * flowF;
        let vy = Math.sin(ang) * flowF;

        // 回聚力：把粒子拉回文字目标
        vx += (tx - px) * attr;
        vy += (ty - py) * attr;

        // 鼠标力
        if (mActive) {
          const dx = px - mx, dy = py - my;
          const d = Math.hypot(dx, dy) + 0.001;
          if (d < RAD) {
            const f = (1 - d / RAD) * MF * 3;
            vx += dx / d * f;
            vy += dy / d * f;
          }
        }

        const nx = px + vx * z;
        const ny = py + vy * z;
        this.x[i] = nx;
        this.y[i] = ny;

        if (mode === 'white') {
          ctx2d.fillStyle = 'rgba(255,255,255,0.85)';
        } else if (mode === 'rainbow') {
          const hue = ((nx / w) * 180 + (ny / h) * 180 + P) % 360;
          ctx2d.fillStyle = `hsl(${hue},80%,64%)`;
        } else {
          const t = clamp(Math.hypot(nx - tx, ny - ty) / 200, 0, 1);
          const r = caR + (cbR - caR) * t | 0;
          const g = caG + (cbG - caG) * t | 0;
          const b = caB + (cbB - caB) * t | 0;
          ctx2d.fillStyle = `rgba(${r},${g},${b},0.9)`;
        }

        ctx2d.fillRect(nx - half, ny - half, dot, dot);
      }

      ctx2d.globalCompositeOperation = 'source-over';
    }
  }

  let W = 0, H = 0, particles = null;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (particles) particles.resize(W, H);
  }

  const pointer = { x: 0, y: 0, down: false, inside: false };
  cv.addEventListener('pointermove', e => {
    pointer.x = e.clientX; pointer.y = e.clientY; pointer.inside = true;
  });
  cv.addEventListener('pointerenter', () => { pointer.inside = true; });
  cv.addEventListener('pointerleave', () => { pointer.inside = false; });
  cv.addEventListener('pointerdown', e => {
    pointer.x = e.clientX; pointer.y = e.clientY; pointer.inside = true;
  });

  let startTime = performance.now();
  let lastTime = startTime;

  function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    const time = (now - startTime) / 1000;
    if (!particles) particles = new FlowParticles(W, H);
    particles.update({ ctx2d: ctx, pointer, time, dt });
    requestAnimationFrame(loop);
  }

  resize();
  window.addEventListener('resize', resize);

  const start = () => requestAnimationFrame(loop);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => setTimeout(start, 80));
  } else {
    setTimeout(start, 300);
  }
})();
</script>
</body>
</html>
