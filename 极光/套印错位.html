<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>套印错位 CMYK</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f6f2e7;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
  #bar{position:fixed;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 12px 12px;
    display:flex;gap:8px;align-items:center;background:linear-gradient(180deg,rgba(246,242,231,.85),rgba(246,242,231,0));
    z-index:10;pointer-events:none;font:13px -apple-system,"PingFang SC",sans-serif;color:#3a3326}
  #bar>*{pointer-events:auto}
  #bar .mode{flex:1;color:#8a7f6a}
  #bar .mode b{color:#2a241a;font-weight:600}
  .btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid rgba(0,0,0,.14);
    background:rgba(0,0,0,.05);color:#2a241a;font:500 13px -apple-system,"PingFang SC",sans-serif;
    cursor:pointer;-webkit-user-select:none;user-select:none}
  .btn:active{background:rgba(0,0,0,.12)}
  .btn.pri{background:rgba(0,150,214,.24);border-color:rgba(0,150,214,.6);color:#04212e}
  #hint{position:fixed;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));text-align:center;
    color:#a5957a;font:12px -apple-system,"PingFang SC",sans-serif;pointer-events:none;z-index:10}

  #panel{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:14px 14px max(14px,env(safe-area-inset-bottom));
    background:rgba(20,16,14,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid rgba(255,255,255,.1);
    transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
    font:14px -apple-system,"PingFang SC",sans-serif;color:#f2ead6;
  }
  #panel.open{transform:translateY(0)}
  #panel label{display:block;font-size:11px;color:#a5957a;margin-bottom:6px;letter-spacing:.4px}
  #panel .row{display:flex;gap:8px;align-items:flex-start}
  #panel textarea{
    flex:1;min-height:60px;max-height:160px;padding:9px 12px;border-radius:10px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
    color:#fff;font:14px -apple-system,"PingFang SC",sans-serif;outline:none;resize:none;
  }
  #panel textarea:focus{border-color:rgba(0,150,214,.7)}
  #panel .ok{
    height:42px;padding:0 18px;border-radius:10px;border:1px solid rgba(0,150,214,.6);
    background:rgba(0,150,214,.32);color:#fff;font:600 14px -apple-system,"PingFang SC",sans-serif;
    cursor:pointer;
  }
  #panel .ok:active{background:rgba(0,150,214,.5)}
  #backdrop{position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .28s}
  #backdrop.open{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="bar">
  <div class="mode">套印错位 <b id="m">报纸印刷</b></div>
  <button class="btn" id="btn-preset">换预设</button>
  <button class="btn" id="btn-text">换文字</button>
  <button class="btn pri" id="btn-custom">自定义</button>
</div>

<div id="hint">CMYK 四色分版 · 套印错位 · rosette 网花露色</div>

<div id="backdrop"></div>
<div id="panel">
  <label>文字内容（支持换行）</label>
  <div class="row">
    <textarea id="inp" rows="2" spellcheck="false" placeholder="AURORA"></textarea>
    <button class="ok" id="btn-ok">确定</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');

  var CFG = {
    text: 'AURORA',
    weight: 900,
    font: '"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif',
    density: 70,
    offset: 6,
    dotShape: 'circle',      // circle | diamond | line
    ink: 1,
    seed: 7,
    missingPlate: 'none',    // none | c | m | y
    paper: '#f6f2e7',
    paperTexture: 0.25,
    unevenness: 0.2
  };

  var PLATES = [
    { key: 'c', ang: 15, color: [0, 174, 239] },
    { key: 'm', ang: 75, color: [236, 0, 140] },
    { key: 'y', ang: 0,  color: [255, 242, 0] },
    { key: 'k', ang: 45, color: [30, 28, 28] }
  ];

  var PRESETS = [
    { text: 'AURORA',  density: 92, offset: 2,  dotShape: 'circle',  ink: 0.9,  paper: '#e8e4d6', paperTexture: 0.5,  unevenness: 0.3,  missingPlate: 'none', seed: 7 },
    { text: '荧光',    density: 62, offset: 14, dotShape: 'circle',  ink: 1.25, paper: '#f8f5ec', paperTexture: 0.15, unevenness: 0.15, missingPlate: 'none', seed: 21 },
    { text: '缺版',    density: 70, offset: 10, dotShape: 'line',    ink: 1.1,  paper: '#f4f0e4', paperTexture: 0.3,  unevenness: 0.35, missingPlate: 'm',    seed: 42 },
    { text: '画册',    density: 100,offset: 1,  dotShape: 'circle',  ink: 1,    paper: '#faf8f2', paperTexture: 0.05, unevenness: 0.05, missingPlate: 'none', seed: 3 },
    { text: 'C/M/Y/K', density: 70, offset: 20, dotShape: 'diamond', ink: 1.15, paper: '#f6f2e7', paperTexture: 0.2,  unevenness: 0.25, missingPlate: 'y',    seed: 88 }
  ];
  var presetIdx = 0;

  var W = 0, H = 0, dpr = 1;
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    if (!w || !h) return false;
    W = w; H = h;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dirty = true; sig = '';
    return true;
  }

  var dirty = true;
  var sig = '';

  // ---------- 掩膜 ----------
  var maskCanvas = document.createElement('canvas');
  var mctx = maskCanvas.getContext('2d', { willReadFrequently: true });
  var maskData = null;
  var maskKey = '';

  function buildMask() {
    if (!W || !H) return;
    var key = CFG.text + '|' + W + 'x' + H + '|' + CFG.weight + '|' + CFG.font;
    if (key === maskKey && maskData) return;
    maskKey = key;

    maskCanvas.width = W; maskCanvas.height = H;
    mctx.clearRect(0, 0, W, H);
    mctx.fillStyle = '#fff';
    mctx.textAlign = 'center';
    mctx.textBaseline = 'middle';

    var lines = CFG.text.split('\n').filter(function (l) { return l.length > 0; });
    if (!lines.length) { maskData = mctx.getImageData(0, 0, W, H).data; return; }

    var maxW = W * 0.9, maxH = H * 0.86;
    var lh = maxH / lines.length;
    var size = Math.floor(lh * 0.84);
    var setF = function (s) { mctx.font = CFG.weight + ' ' + s + 'px ' + CFG.font; };
    setF(size);

    var widest = 0;
    for (var i = 0; i < lines.length; i++) {
      var m = mctx.measureText(lines[i]).width;
      if (m > widest) widest = m;
    }
    if (widest > maxW) {
      size = Math.max(6, Math.floor(size * maxW / widest));
      setF(size);
    }
    var totalH = size * 1.15 * lines.length;
    if (totalH > maxH) {
      size = Math.max(6, Math.floor(size * maxH / totalH));
      setF(size);
    }
    var startY = H / 2 - (lines.length - 1) * size * 1.15 / 2;
    for (var j = 0; j < lines.length; j++) {
      mctx.fillText(lines[j], W / 2, startY + j * size * 1.15);
    }
    maskData = mctx.getImageData(0, 0, W, H).data;
  }

  function alphaAt(x, y) {
    if (!maskData) return 0;
    x = x | 0; y = y | 0;
    if (x < 0 || y < 0 || x >= W || y >= H) return 0;
    return maskData[(y * W + x) * 4 + 3] / 255;
  }

  // ---------- 纸纹 ----------
  var paperCv = document.createElement('canvas');
  var paperKey = '';
  function buildPaper() {
    var key = W + 'x' + H;
    if (key === paperKey) return;
    paperKey = key;
    paperCv.width = Math.max(2, W);
    paperCv.height = Math.max(2, H);
    var c = paperCv.getContext('2d');
    var rnd = mulberry(1337);
    var total = Math.floor(W * H / 160);
    for (var i = 0; i < total; i++) {
      var x = rnd() * W, y = rnd() * H;
      var light = rnd() < 0.6;
      c.fillStyle = light
        ? 'rgba(70,58,42,' + (0.05 + rnd() * 0.1).toFixed(3) + ')'
        : 'rgba(255,252,240,' + (0.08 + rnd() * 0.12).toFixed(3) + ')';
      var s = 0.6 + rnd() * 1.6;
      c.fillRect(x, y, s, s);
    }
  }

  function mulberry(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ---------- 渲染 ----------
  function render() {
    if (!W || !H) { requestAnimationFrame(render); return; }
    buildMask();

    var key = W + 'x' + H + '@' + dpr + '|' + maskKey + '|' +
              CFG.density + '|' + CFG.offset + '|' + CFG.dotShape + '|' +
              CFG.ink + '|' + CFG.seed + '|' + CFG.missingPlate + '|' +
              CFG.paper + '|' + CFG.paperTexture + '|' + CFG.unevenness;

    if (dirty || key !== sig) {
      drawFrame(CFG);
      sig = key;
      dirty = false;
    }
    requestAnimationFrame(render);
  }

  function drawFrame(cfg) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = cfg.paper;
    ctx.fillRect(0, 0, W, H);

    // 纸纹
    if (cfg.paperTexture > 0.01) {
      buildPaper();
      ctx.save();
      ctx.globalCompositeOperation = 'multiply';
      ctx.globalAlpha = cfg.paperTexture * 0.6;
      ctx.drawImage(paperCv, 0, 0, W, H);
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // 文字区
    var aspect = W / H;
    var margin = 0.92;
    var vw = W * margin, vh = H * margin;
    if (aspect > W / H) { vh = vw * H / W; } else { vw = vh * W / H; }
    var dx = (W - vw) / 2;
    var dy = (H - vh) / 2;
    var halfW = vw / 2, halfH = vh / 2;
    var cx0 = W / 2, cy0 = H / 2;

    // 灰度场（用于 4 版分色）
    // 从掩膜采样得到"暗度" d = 1 - alpha
    var gw = Math.max(2, Math.round(cfg.density));
    var gh = Math.max(2, Math.round(gw * H / W));
    var gw2 = gw, gh2 = gh;
    var gray = new Float32Array(gw2 * gh2);
    for (var y = 0; y < gh2; y++) {
      for (var x = 0; x < gw2; x++) {
        var sx = dx + (x + 0.5) / gw2 * vw;
        var sy = dy + (y + 0.5) / gh2 * vh;
        var a = alphaAt(sx, sy);
        gray[y * gw2 + x] = 1 - a; // 字内黑、字外白
      }
    }

    // 网点间距（CSS px）
    var pitch = Math.min(vw, vh) / cfg.density;

    // 四版
    var missing = cfg.missingPlate;
    for (var pi = 0; pi < PLATES.length; pi++) {
      var P = PLATES[pi];
      if (P.key === missing) continue;

      var ang = P.ang * Math.PI / 180;
      var cosA = Math.cos(ang), sinA = Math.sin(ang);

      // 套印偏移：每版一个小随机向量（用种子 + 版 key 决定）
      var rng = mulberry(cfg.seed * 7919 + pi * 131);
      var offsetAng = rng() * Math.PI * 2;
      var offsetMag = cfg.offset * (0.55 + rng() * 0.45) * (P.key === 'k' ? 0.3 : 1);
      var offX = Math.cos(offsetAng) * offsetMag;
      var offY = Math.sin(offsetAng) * offsetMag;

      ctx.save();
      ctx.translate(cx0 + offX, cy0 + offY);
      ctx.rotate(ang);

      // 网点绘制范围
      var halfDiag = Math.hypot(halfW, halfH) + pitch;

      ctx.fillStyle = 'rgb(' + P.color[0] + ',' + P.color[1] + ',' + P.color[2] + ')';

      for (var gv = -halfDiag; gv <= halfDiag; gv += pitch) {
        for (var gu = -halfDiag; gu <= halfDiag; gu += pitch) {
          // 网点中心（旋转坐标里）
          var gx = gu, gy = gv;
          // 回到原图坐标
          var px = gx * cosA - gy * sinA + cx0 + offX;
          var py = gx * sinA + gy * cosA + cy0 + offY;
          // 是不是在文字区内
          var uu = (px - dx) / vw;
          var vv = (py - dy) / vh;
          if (uu < -0.02 || uu > 1.02 || vv < -0.02 || vv > 1.02) continue;

          // 采样灰度
          var gi = Math.max(0, Math.min(gw2 - 1, Math.floor(uu * gw2)));
          var gj = Math.max(0, Math.min(gh2 - 1, Math.floor(vv * gh2)));
          var d = gray[gj * gw2 + gi];

          // 分版暗度：C 版主要吃 dark, M 版也吃 dark, Y 版吃中灰, K 版吃深灰
          var plateD = d;
          if (P.key === 'c') plateD = d;
          else if (P.key === 'm') plateD = d;
          else if (P.key === 'y') plateD = d * 0.85;
          else if (P.key === 'k') plateD = Math.max(0, d - 0.25) / 0.75;

          plateD *= cfg.ink;

          // 不均匀
          var jit = (hash21(Math.floor(gx / pitch), Math.floor(gy / pitch)) - 0.5) * cfg.unevenness * 0.6;
          plateD += jit * 0.5;
          if (plateD < 0.02) continue;

          // 点径 = sqrt(plateD) 调制
          var rBase = pitch * 0.72 * Math.sqrt(Math.max(0, Math.min(1, plateD)));

          ctx.globalAlpha = 0.88;

          if (cfg.dotShape === 'line') {
            ctx.lineWidth = rBase * 1.9;
            ctx.beginPath();
            ctx.moveTo(gx - pitch * 0.55, gy);
            ctx.lineTo(gx + pitch * 0.55, gy);
            ctx.stroke();
          } else if (cfg.dotShape === 'diamond') {
            var rd = rBase * 0.95;
            ctx.beginPath();
            ctx.moveTo(gx, gy - rd);
            ctx.lineTo(gx + rd, gy);
            ctx.lineTo(gx, gy + rd);
            ctx.lineTo(gx - rd, gy);
            ctx.closePath();
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.arc(gx, gy, rBase, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  function hash21(x, y) {
    var t = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
    return t - Math.floor(t);
  }

  // ---------- 按钮 ----------
  var mLabel = document.getElementById('m');
  document.getElementById('btn-preset').addEventListener('click', function () {
    presetIdx = (presetIdx + 1) % PRESETS.length;
    var p = PRESETS[presetIdx];
    for (var k in p) if (p.hasOwnProperty(k)) CFG[k] = p[k];
    mLabel.textContent = p.text;
    maskData = null; maskKey = '';
    paperKey = '';
    dirty = true;
  });

  var CONTENTS = [
    { text: 'AURORA' },
    { text: '印刷' },
    { text: 'CMYK' },
    { text: 'OFFSET' },
    { text: '套印\n错位' },
    { text: '⚡' }
  ];
  var contentIdx = 0;
  document.getElementById('btn-text').addEventListener('click', function () {
    contentIdx = (contentIdx + 1) % CONTENTS.length;
    CFG.text = CONTENTS[contentIdx].text;
    maskData = null; maskKey = '';
    dirty = true;
  });

  // ---------- 自定义 ----------
  var panel = document.getElementById('panel');
  var backdrop = document.getElementById('backdrop');
  var inp = document.getElementById('inp');

  function openPanel() {
    inp.value = CFG.text;
    panel.classList.add('open');
    backdrop.classList.add('open');
    setTimeout(function () { inp.focus(); inp.select(); }, 320);
  }
  function closePanel() {
    panel.classList.remove('open');
    backdrop.classList.remove('open');
    inp.blur();
  }
  function confirmInput() {
    var v = inp.value;
    if (!v.replace(/\s/g, '').length) v = 'AURORA';
    CFG.text = v;
    maskData = null; maskKey = '';
    dirty = true;
  }

  document.getElementById('btn-custom').addEventListener('click', openPanel);
  document.getElementById('btn-ok').addEventListener('click', function () {
    confirmInput();
    closePanel();
  });
  backdrop.addEventListener('click', closePanel);
  inp.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); confirmInput(); closePanel(); }
  });
  inp.addEventListener('input', function () {
    inp.style.height = 'auto';
    inp.style.height = Math.min(160, inp.scrollHeight) + 'px';
  });

  // ---------- 启动 ----------
  function boot() {
    if (!resize()) { requestAnimationFrame(boot); return; }
    requestAnimationFrame(render);
  }
  boot();
  window.addEventListener('resize', function () { setTimeout(resize, 100); });
  window.addEventListener('orientationchange', function () { setTimeout(resize, 250); });
})();
</script>
</body>
</html>
