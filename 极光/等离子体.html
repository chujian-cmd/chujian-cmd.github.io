<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>等离子体 Plasma</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #06060c;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }

  #bar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: max(12px, env(safe-area-inset-top)) 12px 12px;
    display: flex; gap: 8px; align-items: center;
    background: linear-gradient(180deg, rgba(6,6,12,0.8), rgba(6,6,12,0));
    z-index: 10; pointer-events: none;
    font: 13px -apple-system, "PingFang SC", sans-serif;
    color: #c3c9d4;
  }
  #bar > * { pointer-events: auto; }
  #bar .mode { flex: 1; color: #8a8f98; }
  #bar .mode b { color: #f7f8f8; font-weight: 600; }

  .btn {
    height: 38px; padding: 0 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    color: #f7f8f8; font: 500 13px -apple-system, "PingFang SC", sans-serif;
    cursor: pointer; -webkit-user-select: none; user-select: none;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .btn:active { background: rgba(255,255,255,0.14); }
  .btn.pri { background: rgba(94,106,210,0.32); border-color: rgba(94,106,210,0.6); }

  #hint {
    position: fixed; left: 0; right: 0;
    bottom: max(20px, env(safe-area-inset-bottom));
    text-align: center; color: #6a6f7a;
    font: 12px -apple-system, "PingFang SC", sans-serif;
    pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="bar">
  <div class="mode">等离子 <b id="m">熔岩灯</b></div>
  <button class="btn" id="btn-reset">重置</button>
  <button class="btn pri" id="btn-change">换配色</button>
</div>

<div id="hint">按住屏幕 = 中心跟随手指</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
              || (navigator.maxTouchPoints > 1);

// ---------- 参数 ----------
const CFG = {
  speed: 0.35,        // 流动速度
  scale: 3.2,         // 图案密度
  complexity: 4,      // 叠加的层数（1~6）
  hueShift: 0.0,      // 色相偏移
  colorA: '#ff3d6a',
  colorB: '#4bd7ff',
  colorC: '#ffe066',
  background: '#06060c'
};

const PIXEL_RATIO = isMobile ? 0.6 : 0.9;

const canvasEl = document.getElementById('cv');
const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: false });
renderer.setPixelRatio(PIXEL_RATIO);
renderer.setSize(innerWidth, innerHeight, false);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const vert = /* glsl */`
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = vec4(position.xy, 0.0, 1.0);
  }
`;

const frag = /* glsl */`
  precision highp float;
  varying vec2 vUv;

  uniform vec2  uResolution;
  uniform vec2  uMouse;
  uniform float uTime;
  uniform float uSpeed;
  uniform float uScale;
  uniform float uComplexity;
  uniform vec3  uColorA;
  uniform vec3  uColorB;
  uniform vec3  uColorC;
  uniform vec3  uBackground;

  #define TAU 6.28318530718
  #define PI 3.14159265359

  // 经典等离子公式：叠加多个 sin
  float plasma(vec2 p, float t, float complexity) {
    float v = 0.0;

    // 第 1 层：径向正弦
    v += sin((p.x + t) * 0.7);

    // 第 2 层：径向正弦（另一方向）
    v += sin((p.y + t) * 0.7);

    // 第 3 层：旋转正弦
    v += sin((p.x + p.y + t) * 0.6);

    // 第 4 层：径向距离
    v += sin(sqrt(p.x * p.x + p.y * p.y) * 1.2 + t);

    if (complexity >= 5.0) {
      // 第 5 层：双螺旋
      float a = atan(p.y, p.x);
      v += sin(a * 3.0 + t * 0.5);
    }

    if (complexity >= 6.0) {
      // 第 6 层：交叉高频
      v += sin(p.x * 1.5 + p.y * 0.8 + t * 0.7);
      v += sin(p.y * 1.5 - p.x * 0.8 + t * 0.5);
    }

    v /= complexity;
    return v * 0.5 + 0.5;   // 映射到 0~1
  }

  // 余弦调色板
  vec3 palette(float t, vec3 a, vec3 b, vec3 c, vec3 d) {
    return a + b * cos(TAU * (c * t + d));
  }

  void main() {
    vec2 uv = (vUv - 0.5) * 2.0;
    uv.x *= uResolution.x / uResolution.y;

    // 指针作为中心偏移
    vec2 mouseOffset = (uMouse - 0.5) * 2.0;
    mouseOffset.x *= uResolution.x / uResolution.y;
    vec2 p = (uv - mouseOffset * 0.5) * uScale;

    float t = uTime * uSpeed;

    // 等离子
    float v = plasma(p, t, uComplexity);

    // 用 v 作为调色板参数
    vec3 col = palette(v,
      uColorA,
      (uColorB - uColorA) * 0.5,
      vec3(1.0),
      vec3(0.0, 0.15, 0.3)
    );

    // 用 colorC 做点缀：在 v 接近极值时混入
    float accent = smoothstep(0.75, 0.95, v) + smoothstep(0.25, 0.05, v);
    col = mix(col, uColorC, accent * 0.5);

    // 提亮中心
    float r = length(uv);
    col *= 1.0 - r * 0.3;

    // 色调映射
    col = col / (1.0 + col * 0.3);
    col = pow(max(col, 0.0), vec3(0.9));

    gl_FragColor = vec4(col, 1.0);
  }
`;

const material = new THREE.ShaderMaterial({
  vertexShader: vert,
  fragmentShader: frag,
  uniforms: {
    uResolution: { value: new THREE.Vector2(1, 1) },
    uMouse: { value: new THREE.Vector2(0.5, 0.5) },
    uTime: { value: 0 },
    uSpeed: { value: CFG.speed },
    uScale: { value: CFG.scale },
    uComplexity: { value: CFG.complexity },
    uColorA: { value: new THREE.Color(CFG.colorA) },
    uColorB: { value: new THREE.Color(CFG.colorB) },
    uColorC: { value: new THREE.Color(CFG.colorC) },
    uBackground: { value: new THREE.Color(CFG.background) }
  }
});

const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
mesh.frustumCulled = false;
scene.add(mesh);

function resize() {
  const W = innerWidth;
  const H = innerHeight;
  renderer.setPixelRatio(PIXEL_RATIO);
  renderer.setSize(W, H, false);
  material.uniforms.uResolution.value.set(W * PIXEL_RATIO, H * PIXEL_RATIO);
}
resize();

const pointer = { x: 0.5, y: 0.5, targetX: 0.5, targetY: 0.5, down: false };
const rect = () => canvasEl.getBoundingClientRect();

const onDown = e => {
  const t = e.touches ? e.touches[0] : e;
  const r = rect();
  pointer.targetX = (t.clientX - r.left) / r.width;
  pointer.targetY = (t.clientY - r.top) / r.height;
  pointer.down = true;
  if (e.touches) e.preventDefault();
};
const onMove = e => {
  const t = e.touches ? e.touches[0] : e;
  const r = rect();
  pointer.targetX = (t.clientX - r.left) / r.width;
  pointer.targetY = (t.clientY - r.top) / r.height;
  if (e.touches) e.preventDefault();
};
const onUp = () => { pointer.down = false; };

canvasEl.addEventListener('touchstart', onDown, { passive: false });
canvasEl.addEventListener('touchmove', onMove, { passive: false });
canvasEl.addEventListener('touchend', onUp);
canvasEl.addEventListener('touchcancel', onUp);
canvasEl.addEventListener('mousedown', onDown);
canvasEl.addEventListener('mousemove', onMove);
canvasEl.addEventListener('mouseup', onUp);
canvasEl.addEventListener('mouseleave', onUp);

let startTime = performance.now();
function loop(now) {
  const t = (now - startTime) / 1000;
  pointer.x += (pointer.targetX - pointer.x) * 0.08;
  pointer.y += (pointer.targetY - pointer.y) * 0.08;

  const u = material.uniforms;
  u.uTime.value = t;
  u.uMouse.value.set(pointer.x, pointer.y);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

const mEl = document.getElementById('m');

const SCHEMES = [
  { name: '熔岩灯', colorA: '#ff3d6a', colorB: '#4bd7ff', colorC: '#ffe066',
    scale: 3.2, complexity: 4, speed: 0.35 },
  { name: '赛博', colorA: '#ff2bd6', colorB: '#00ffd5', colorC: '#ffe066',
    scale: 3.5, complexity: 5, speed: 0.5 },
  { name: '霓虹夜', colorA: '#5b3dff', colorB: '#ff3d9a', colorC: '#4be0ff',
    scale: 3.0, complexity: 4, speed: 0.3 },
  { name: '深海', colorA: '#04223a', colorB: '#4be0ff', colorC: '#b8fff0',
    scale: 2.5, complexity: 4, speed: 0.25 },
  { name: '极光', colorA: '#1a006b', colorB: '#4ecb8d', colorC: '#e0ffc0',
    scale: 2.8, complexity: 5, speed: 0.2 },
  { name: '日落', colorA: '#ff6b3d', colorB: '#7c1e5e', colorC: '#ffd166',
    scale: 3.2, complexity: 4, speed: 0.3 }
];
let schemeIdx = 0;

function applyScheme(s) {
  const u = material.uniforms;
  u.uColorA.value.set(s.colorA);
  u.uColorB.value.set(s.colorB);
  u.uColorC.value.set(s.colorC);
  u.uScale.value = s.scale;
  u.uComplexity.value = s.complexity;
  u.uSpeed.value = s.speed;
}

document.getElementById('btn-reset').addEventListener('click', () => {
  startTime = performance.now();
  pointer.targetX = 0.5;
  pointer.targetY = 0.5;
});

document.getElementById('btn-change').addEventListener('click', () => {
  schemeIdx = (schemeIdx + 1) % SCHEMES.length;
  applyScheme(SCHEMES[schemeIdx]);
  mEl.textContent = SCHEMES[schemeIdx].name;
});

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

applyScheme(SCHEMES[0]);
mEl.textContent = SCHEMES[0].name;
requestAnimationFrame(loop);
</script>
</body>
</html>
