<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>双摆混沌 Double Pendulum</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #08080e;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #bar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: max(12px, env(safe-area-inset-top)) 12px 12px;
    display: flex; gap: 8px; align-items: center;
    background: linear-gradient(180deg, rgba(8,8,14,0.8), rgba(8,8,14,0));
    z-index: 10; pointer-events: none;
    font: 13px -apple-system, "PingFang SC", sans-serif;
    color: #c3c9d4;
  }
  #bar > * { pointer-events: auto; }
  #bar .mode { flex: 1; color: #8a8f98; }
  #bar .mode b { color: #f7f8f8; font-weight: 600; }

  .btn {
    height: 38px; padding: 0 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    color: #f7f8f8; font: 500 13px -apple-system, "PingFang SC", sans-serif;
    cursor: pointer; -webkit-user-select: none; user-select: none;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .btn:active { background: rgba(255,255,255,0.14); }
  .btn.pri { background: rgba(94,106,210,0.32); border-color: rgba(94,106,210,0.6); }

  #hint {
    position: fixed; left: 0; right: 0;
    bottom: max(20px, env(safe-area-inset-bottom));
    text-align: center; color: #6a6f7a;
    font: 12px -apple-system, "PingFang SC", sans-serif;
    pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="bar">
  <div class="mode">双摆 <b id="m">混沌</b></div>
  <button class="btn" id="btn-reset">重置</button>
  <button class="btn pri" id="btn-change">换配色</button>
</div>

<div id="hint">十几个双摆只差 0.001° · 几秒后完全发散</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
                || (navigator.maxTouchPoints > 1);

  // ---------- 参数 ----------
  const CFG = {
    count: isMobile ? 24 : 36,      // 摆的数量
    gravity: 18,                     // 重力
    length1: 120,                    // 上摆杆长
    length2: 120,                    // 下摆杆长
    mass1: 1,                        // 上摆质量
    mass2: 1,                        // 下摆质量
    damping: 0.002,                  // 阻尼
    startAngle: 1100000000008,                 // 初始角度（度）——越大越混沌
    trail: 0.04,                     // 拖尾（0.02~0.08 好看）
    lineWidth: 1.0,
    colorMode: 'rainbow',            // rainbow | mono

    color: '#7de0ff',
    background: '#08080e',

    // 手机
    substeps: isMobile ? 8 : 12      // 物理子步（越多越精确）
  };

  const hex2rgb = h => {
    const s = h.replace('#', '');
    const n = parseInt(s.length === 3 ? s.split('').map(c => c + c).join('') : s, 16);
    return [n >> 16 & 255, n >> 8 & 255, n & 255];
  };
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  // ---------- 尺寸 ----------
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ---------- 双摆数组 ----------
  const N = CFG.count;
  const th1 = new Float32Array(N);
  const th2 = new Float32Array(N);
  const w1  = new Float32Array(N);
  const w2  = new Float32Array(N);
  const px2 = new Float32Array(N);
  const py2 = new Float32Array(N);
  const primed = new Uint8Array(N);

  function seed() {
    const a0 = CFG.startAngle * Math.PI / 180;
    for (let i = 0; i < N; i++) {
      // 每个摆的初始角只差千分之一度
      th1[i] = a0;
      th2[i] = a0 + i * 0.002;
      w1[i] = 0;
      w2[i] = 0;
      primed[i] = 0;
    }
  }

  // ---------- 物理一步 ----------
  const SUB_DT = 0.003;
  function physics() {
    const g = CFG.gravity;
    const l1 = CFG.length1;
    const l2 = CFG.length2;
    const m1 = CFG.mass1;
    const m2 = CFG.mass2;
    const damping = 1 - CFG.damping;

    for (let i = 0; i < N; i++) {
      let a1 = th1[i], a2 = th2[i];
      let v1 = w1[i], v2 = w2[i];

      // 双摆运动方程（经典形式）
      const delta = a1 - a2;
      const denom1 = 2 * m1 + m2 - m2 * Math.cos(2 * delta);
      const denom2 = 2 * m1 + m2 - m2 * Math.cos(2 * delta);

      const num1 = -g * (2 * m1 + m2) * Math.sin(a1)
                 - m2 * g * Math.sin(a1 - 2 * a2)
                 - 2 * Math.sin(delta) * m2 * (v2 * v2 * l2 + v1 * v1 * l1 * Math.cos(delta));
      const num2 = 2 * Math.sin(delta) * (
          v1 * v1 * l1 * (m1 + m2)
        + g * (m1 + m2) * Math.cos(a1)
        + v2 * v2 * l2 * m2 * Math.cos(delta)
      );

      const acc1 = num1 / (l1 * denom1);
      const acc2 = num2 / (l2 * denom2);

      v1 += acc1 * SUB_DT;
      v2 += acc2 * SUB_DT;
      v1 *= damping;
      v2 *= damping;
      a1 += v1 * SUB_DT;
      a2 += v2 * SUB_DT;

      th1[i] = a1; th2[i] = a2;
      w1[i] = v1; w2[i] = v2;
    }
  }

  // ---------- 渲染 ----------
  function render() {
    const [br, bg, bb] = hex2rgb(CFG.background);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = `rgba(${br},${bg},${bb},${CFG.trail})`;
    ctx.fillRect(0, 0, W, H);

    const l1 = CFG.length1;
    const l2 = CFG.length2;
    const cx = W / 2;
    const cy = H * 0.22;
    const [cr, cg, cb] = hex2rgb(CFG.color);
    const mode = CFG.colorMode;

    ctx.lineWidth = CFG.lineWidth;
    ctx.lineCap = 'round';
    ctx.globalCompositeOperation = 'lighter';

    for (let i = 0; i < N; i++) {
      const a1 = th1[i], a2 = th2[i];
      const x1 = cx + Math.sin(a1) * l1;
      const y1 = cy + Math.cos(a1) * l1;
      const x2 = x1 + Math.sin(a2) * l2;
      const y2 = y1 + Math.cos(a2) * l2;

      // 拖尾（只画下摆末端到上次末端）
      if (primed[i]) {
        if (mode === 'rainbow') {
          const hue = ((i / N) * 360) | 0;
          ctx.strokeStyle = `hsla(${hue},78%,62%,0.55)`;
        } else {
          ctx.strokeStyle = `rgba(${cr},${cg},${cb},0.55)`;
        }
        ctx.beginPath();
        ctx.moveTo(px2[i], py2[i]);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      px2[i] = x2;
      py2[i] = y2;
      primed[i] = 1;

      // 末端光点
      if (mode === 'rainbow') {
        const hue = ((i / N) * 360) | 0;
        ctx.fillStyle = `hsla(${hue},80%,68%,0.9)`;
      } else {
        ctx.fillStyle = `rgba(${cr},${cg},${cb},0.9)`;
      }
      ctx.beginPath();
      ctx.arc(x2, y2, Math.max(0.8, CFG.lineWidth * 0.9), 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over';
  }

  // ---------- 指针 ----------
  const pointer = { x: 0, y: 0, down: false, inside: false };
  const rect = () => cv.getBoundingClientRect();

  cv.addEventListener('touchstart', e => {
    const r = rect(); const t = e.touches[0];
    pointer.x = t.clientX - r.left;
    pointer.y = t.clientY - r.top;
    pointer.inside = true; pointer.down = true;
    e.preventDefault();
  }, { passive: false });
  cv.addEventListener('touchmove', e => {
    const r = rect(); const t = e.touches[0];
    pointer.x = t.clientX - r.left;
    pointer.y = t.clientY - r.top;
    pointer.inside = true;
    e.preventDefault();
  }, { passive: false });
  cv.addEventListener('touchend', () => { pointer.down = false; });
  cv.addEventListener('mousedown', e => {
    const r = rect();
    pointer.x = e.clientX - r.left;
    pointer.y = e.clientY - r.top;
    pointer.inside = true; pointer.down = true;
  });
  cv.addEventListener('mousemove', e => {
    const r = rect();
    pointer.x = e.clientX - r.left;
    pointer.y = e.clientY - r.top;
    pointer.inside = true;
  });
  cv.addEventListener('mouseup', () => { pointer.down = false; });
  cv.addEventListener('mouseleave', () => { pointer.down = false; });

  // ---------- 主循环 ----------
  let lastTime = performance.now();
  function loop(now) {
    lastTime = now;

    // 指针推挤：拖动时给近处摆一个"吹"的效果
    if (pointer.down && pointer.inside) {
      const R = 120;
      const cx = W / 2;
      const cy = H * 0.22;
      for (let i = 0; i < N; i++) {
        const a1 = th1[i], a2 = th2[i];
        const x2 = cx + Math.sin(a1) * CFG.length1 + Math.sin(a2) * CFG.length2;
        const y2 = cy + Math.cos(a1) * CFG.length1 + Math.cos(a2) * CFG.length2;
        const dx = pointer.x - x2;
        const dy = pointer.y - y2;
        const d2 = dx * dx + dy * dy;
        if (d2 < R * R && d2 > 1) {
          const d = Math.sqrt(d2);
          const f = (1 - d / R) * 0.8;
          w1[i] += dx / d * f * 0.06;
          w2[i] += dy / d * f * 0.06;
        }
      }
    }

    for (let s = 0; s < CFG.substeps; s++) physics();
    render();
    requestAnimationFrame(loop);
  }

  // ---------- 按钮 ----------
  const mEl = document.getElementById('m');
  document.getElementById('btn-reset').addEventListener('click', seed);

  const SCHEMES = [
    { name: '混沌彩带', colorMode: 'rainbow', color: '#7de0ff', background: '#08080e',
      count: isMobile ? 24 : 36, trail: 0.04, damping: 0.002, startAngle: 118, lineWidth: 1.0 },
    { name: '单摆写迹', colorMode: 'mono', color: '#eae6ff', background: '#08080e',
      count: isMobile ? 8 : 12, trail: 0.03, damping: 0.0015, startAngle: 125, lineWidth: 1.2 },
    { name: '金摆群', colorMode: 'mono', color: '#ffbe5c', background: '#140d05',
      count: isMobile ? 16 : 24, trail: 0.07, damping: 0.002, startAngle: 100, lineWidth: 0.9 },
    { name: '发散', colorMode: 'rainbow', color: '#7de0ff', background: '#08080e',
      count: isMobile ? 30 : 48, trail: 0.06, damping: 0.0004, startAngle: 174, lineWidth: 0.9 },
    { name: '密林', colorMode: 'mono', color: '#5bffb0', background: '#04100a',
      count: isMobile ? 32 : 44, trail: 0.05, damping: 0.001, startAngle: 150, lineWidth: 0.7 }
  ];
  let schemeIdx = 0;

  document.getElementById('btn-change').addEventListener('click', () => {
    schemeIdx = (schemeIdx + 1) % SCHEMES.length;
    const s = SCHEMES[schemeIdx];
    Object.assign(CFG, s);
    mEl.textContent = s.name;
    // 重新分配数组（数量变了）
    seed();
  });

  // ---------- 启动 ----------
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));

  Object.assign(CFG, SCHEMES[0]);
  mEl.textContent = SCHEMES[0].name;
  seed();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
