<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>反应扩散 Reaction-Diffusion</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #060a14;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #bar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: max(12px, env(safe-area-inset-top)) 12px 12px;
    display: flex; gap: 8px; align-items: center;
    background: linear-gradient(180deg, rgba(6,10,20,0.8), rgba(6,10,20,0));
    z-index: 10; pointer-events: none;
    font: 13px -apple-system, "PingFang SC", sans-serif;
    color: #c3c9d4;
  }
  #bar > * { pointer-events: auto; }
  #bar .mode { flex: 1; color: #8a8f98; }
  #bar .mode b { color: #f7f8f8; font-weight: 600; }

  .btn {
    height: 38px; padding: 0 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    color: #f7f8f8; font: 500 13px -apple-system, "PingFang SC", sans-serif;
    cursor: pointer; -webkit-user-select: none; user-select: none;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .btn:active { background: rgba(255,255,255,0.14); }
  .btn.pri { background: rgba(94,106,210,0.32); border-color: rgba(94,106,210,0.6); }

  #hint {
    position: fixed; left: 0; right: 0;
    bottom: max(20px, env(safe-area-inset-bottom));
    text-align: center; color: #6a6f7a;
    font: 12px -apple-system, "PingFang SC", sans-serif;
    pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="bar">
  <div class="mode">反应扩散 <b id="m">珊瑚</b></div>
  <button class="btn" id="btn-reset">重新播种</button>
  <button class="btn pri" id="btn-change">换参数</button>
</div>

<div id="hint">按住屏幕播种 · 松手看它蔓延</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
                || (navigator.maxTouchPoints > 1);

  // ---------- 参数 ----------
  const CFG = {
    // 物理
    feed: 0.037,           // 投放率（feed）
    kill: 0.060,           // 消亡率（kill）
    dA: 1.0,               // A 扩散
    dB: 0.5,               // B 扩散
    dt: 1.0,               // 时间步
    substeps: isMobile ? 6 : 10,   // 每帧仿真次数

    // 视觉
    brightness: 1.2,
    brush: 1.0,            // 笔刷大小（手指播种半径）

    // 配色
    scheme: 0,
    schemes: [
      { name: '珊瑚', low: '#0a0512', high: '#ff9d5c', edge: '#ffe27a' },
      { name: '迷宫', low: '#060a14', high: '#6be6ff', edge: '#ffffff' },
      { name: '斑点', low: '#0a0810', high: '#a06bff', edge: '#ff9de0' },
      { name: '脑回', low: '#08120c', high: '#4ecb8d', edge: '#eafff2' },
      { name: '血丝', low: '#050205', high: '#ff2e4e', edge: '#ffc4b0' }
    ]
  };

  const hex2rgb = h => {
    const s = h.replace('#', '');
    const n = parseInt(s.length === 3 ? s.split('').map(c => c + c).join('') : s, 16);
    return [n >> 16 & 255, n >> 8 & 255, n & 255];
  };
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  // ---------- 网格 ----------
  let W = 0, H = 0, dpr = 1;
  let GW = 0, GH = 0;    // 仿真网格
  const SIM_LONG = isMobile ? 300 : 420;

  let A, B, nextA, nextB;
  const off = document.createElement('canvas');
  const octx = off.getContext('2d');
  let imgData;

  function buildGrid() {
    const long = Math.max(W, H);
    const scale = Math.min(1, SIM_LONG / long);
    GW = Math.max(2, Math.round(W * scale));
    GH = Math.max(2, Math.round(H * scale));
    const n = GW * GH;
    A = new Float32Array(n).fill(1);
    B = new Float32Array(n);
    nextA = new Float32Array(n);
    nextB = new Float32Array(n);
    off.width = GW;
    off.height = GH;
    imgData = octx.createImageData(GW, GH);
    seed();
  }

  function seed() {
    A.fill(1);
    B.fill(0);
    // 随机撒一些 B 种子
    const n = GW * GH;
    const cnt = Math.floor(n * 0.02);
    for (let i = 0; i < cnt; i++) {
      const idx = (Math.random() * n) | 0;
      B[idx] = 1;
    }
  }

  // ---------- 指针 ----------
  const pointer = { x: 0, y: 0, down: false, inside: false };
  const rect = () => cv.getBoundingClientRect();
  let pendingSeeds = [];

  const onDown = e => {
    const r = rect();
    const t = e.touches ? e.touches[0] : e;
    pointer.x = t.clientX - r.left;
    pointer.y = t.clientY - r.top;
    pointer.inside = true;
    pointer.down = true;
    if (e.touches) e.preventDefault();
  };
  const onMove = e => {
    const r = rect();
    const t = e.touches ? e.touches[0] : e;
    pointer.x = t.clientX - r.left;
    pointer.y = t.clientY - r.top;
    pointer.inside = true;
    if (e.touches) e.preventDefault();
  };
  const onUp = () => { pointer.down = false; };

  cv.addEventListener('touchstart', onDown, { passive: false });
  cv.addEventListener('touchmove', onMove, { passive: false });
  cv.addEventListener('touchend', onUp);
  cv.addEventListener('touchcancel', onUp);
  cv.addEventListener('mousedown', onDown);
  cv.addEventListener('mousemove', onMove);
  cv.addEventListener('mouseup', onUp);
  cv.addEventListener('mouseleave', onUp);

  // ---------- 仿真一步（Gray-Scott） ----------
  function step() {
    const feed = CFG.feed, kill = CFG.kill;
    const dA = CFG.dA, dB = CFG.dB, dt = CFG.dt;

    for (let y = 0; y < GH; y++) {
      const yUp = (y - 1 + GH) % GH;
      const yDn = (y + 1) % GH;
      const row = y * GW;
      const rowU = yUp * GW;
      const rowD = yDn * GW;
      for (let x = 0; x < GW; x++) {
        const xL = (x - 1 + GW) % GW;
        const xR = (x + 1) % GW;
        const i = row + x;

        // 拉普拉斯（4 邻 + 对角加权）
        const aL = 0.2 * (A[row + xL] + A[row + xR] + A[rowU + x] + A[rowD + x])
                 + 0.05 * (A[rowU + xL] + A[rowU + xR] + A[rowD + xL] + A[rowD + xR])
                 - A[i];
        const bL = 0.2 * (B[row + xL] + B[row + xR] + B[rowU + x] + B[rowD + x])
                 + 0.05 * (B[rowU + xL] + B[rowU + xR] + B[rowD + xL] + B[rowD + xR])
                 - B[i];

        const a = A[i], b = B[i];
        const reaction = a * b * b;

        let na = a + (dA * aL - reaction + feed * (1 - a)) * dt;
        let nb = b + (dB * bL + reaction - (kill + feed) * b) * dt;

        nextA[i] = clamp(na, 0, 1);
        nextB[i] = clamp(nb, 0, 1);
      }
    }

    // 交换缓冲
    const tA = A; A = nextA; nextA = tA;
    const tB = B; B = nextB; nextB = tB;
  }

  // ---------- 手指播种 ----------
  function applySeeds() {
    if (!pointer.down || !pointer.inside) return;
    const px = (pointer.x / W) * GW;
    const py = (pointer.y / H) * GH;
    const R = CFG.brush * 8;
    const r2 = R * R;
    const x0 = Math.max(0, Math.floor(px - R));
    const x1 = Math.min(GW - 1, Math.ceil(px + R));
    const y0 = Math.max(0, Math.floor(py - R));
    const y1 = Math.min(GH - 1, Math.ceil(py + R));
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const dx = x - px, dy = y - py;
        if (dx * dx + dy * dy < r2) {
          B[y * GW + x] = 1;
        }
      }
    }
  }

  // ---------- 渲染 ----------
  let colL, colH, colE, bgR, bgG, bgB;
  function buildColors() {
    const s = CFG.schemes[CFG.scheme];
    colL = hex2rgb(s.low);
    colH = hex2rgb(s.high);
    colE = hex2rgb(s.edge);
    bgR = colL[0]; bgG = colL[1]; bgB = colL[2];
  }

  function render() {
    const n = GW * GH;
    const data = imgData.data;
    const bright = CFG.brightness;

    for (let i = 0; i < n; i++) {
      const b = B[i];
      const v = clamp(Math.pow(b, 0.5) * bright, 0, 1);

      // 用 B 的空间梯度做描边
      const x = i % GW, y = (i / GW) | 0;
      const xL = (x - 1 + GW) % GW;
      const yU = (y - 1 + GH) % GH;
      const bx = B[y * GW + xL];
      const by = B[yU * GW + x];
      const edge = clamp((Math.abs(b - bx) + Math.abs(b - by)) * 15, 0, 1);

      let R = colL[0] + (colH[0] - colL[0]) * v;
      let G = colL[1] + (colH[1] - colL[1]) * v;
      let Bl = colL[2] + (colH[2] - colL[2]) * v;

      // 描边 → 加亮边缘色
      R = R + (colE[0] - R) * edge * 0.7;
      G = G + (colE[1] - G) * edge * 0.7;
      Bl = Bl + (colE[2] - Bl) * edge * 0.7;

      const p = i * 4;
      data[p]     = clamp(R, 0, 255);
      data[p + 1] = clamp(G, 0, 255);
      data[p + 2] = clamp(Bl, 0, 255);
      data[p + 3] = 255;
    }

    octx.putImageData(imgData, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(off, 0, 0, GW, GH, 0, 0, W, H);
  }

  // ---------- 尺寸 ----------
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildGrid();
  }

  // ---------- 主循环 ----------
  let lastTime = performance.now();
  function loop(now) {
    lastTime = now;

    applySeeds();

    const subs = CFG.substeps;
    for (let i = 0; i < subs; i++) step();

    render();
    requestAnimationFrame(loop);
  }

  // ---------- 按钮 ----------
  const mEl = document.getElementById('m');
  document.getElementById('btn-reset').addEventListener('click', seed);

  // 循环 5 组参数（feed/kill 组合，视觉不同）
  const PARAMS = [
    { feed: 0.0545, kill: 0.062, name: '珊瑚' },
    { feed: 0.029,  kill: 0.057, name: '迷宫' },
    { feed: 0.026,  kill: 0.061, name: '斑点' },
    { feed: 0.037,  kill: 0.060, name: '脑回' },
    { feed: 0.018,  kill: 0.051, name: '血丝' }
  ];
  let paramIdx = 0;

  document.getElementById('btn-change').addEventListener('click', () => {
    paramIdx = (paramIdx + 1) % PARAMS.length;
    CFG.feed = PARAMS[paramIdx].feed;
    CFG.kill = PARAMS[paramIdx].kill;
    CFG.scheme = paramIdx;
    buildColors();
    seed();
    mEl.textContent = PARAMS[paramIdx].name;
  });

  // ---------- 启动 ----------
  resize();
  window.addEventListener('resize', () => { resize(); });
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));

  CFG.feed = PARAMS[0].feed;
  CFG.kill = PARAMS[0].kill;
  buildColors();
  mEl.textContent = PARAMS[0].name;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
