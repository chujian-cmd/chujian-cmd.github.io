<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>黑洞 Blackhole</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #000;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }

  #bar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: max(12px, env(safe-area-inset-top)) 12px 12px;
    display: flex; gap: 8px; align-items: center;
    background: linear-gradient(180deg, rgba(0,0,0,0.7), rgba(0,0,0,0));
    z-index: 10; pointer-events: none;
    font: 13px -apple-system, "PingFang SC", sans-serif;
    color: #c3c9d4;
  }
  #bar > * { pointer-events: auto; }
  #bar .mode { flex: 1; color: #8a8f98; }
  #bar .mode b { color: #f7f8f8; font-weight: 600; }

  .btn {
    height: 38px; padding: 0 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    color: #f7f8f8; font: 500 13px -apple-system, "PingFang SC", sans-serif;
    cursor: pointer; -webkit-user-select: none; user-select: none;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .btn:active { background: rgba(255,255,255,0.14); }
  .btn.pri { background: rgba(94,106,210,0.32); border-color: rgba(94,106,210,0.6); }

  #hint {
    position: fixed; left: 0; right: 0;
    bottom: max(20px, env(safe-area-inset-bottom));
    text-align: center; color: #6a6f7a;
    font: 12px -apple-system, "PingFang SC", sans-serif;
    pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="bar">
  <div class="mode">黑洞 <b id="m">Gargantua</b></div>
  <button class="btn" id="btn-reset">重置</button>
  <button class="btn pri" id="btn-change">换配色</button>
</div>

<div id="hint">拖动屏幕 = 绕黑洞转 · 左右移动看吸积盘变形</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
              || (navigator.maxTouchPoints > 1);

const CFG = {
  spin: 0.05,
  diskBright: 1.6,
  diskInner: 1.2,
  diskOuter: 3.0,
  starDensity: 1.0,
  starBright: 1.0,
  lens: 1.0,
  photonRing: 1.0,
  colorDiskA: '#ffe0a0',
  colorDiskB: '#ff8c1a',
  colorStar: '#ffffff',
  background: '#000000'
};

const PIXEL_RATIO = isMobile ? 0.5 : 0.75;

const canvasEl = document.getElementById('cv');
const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: false });
renderer.setPixelRatio(PIXEL_RATIO);
renderer.setSize(innerWidth, innerHeight, false);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const vert = /* glsl */`
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = vec4(position.xy, 0.0, 1.0);
  }
`;

const frag = /* glsl */`
  precision highp float;
  varying vec2 vUv;

  uniform vec2  uResolution;
  uniform vec2  uMouse;
  uniform float uTime;
  uniform float uSpin;
  uniform float uDiskBright;
  uniform float uDiskInner;
  uniform float uDiskOuter;
  uniform float uStarDensity;
  uniform float uStarBright;
  uniform float uLens;
  uniform float uPhotonRing;
  uniform vec3  uColorDiskA;
  uniform vec3  uColorDiskB;
  uniform vec3  uColorStar;
  uniform vec3  uBackground;

  #define PI 3.14159265359

  float hash21(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }
  float hash31(vec3 p) {
    p = fract(p * vec3(0.1031, 0.1030, 0.0973));
    p += dot(p, p.yxz + 33.33);
    return fract((p.x + p.y) * p.z);
  }

  // 星空
  float starfield(vec3 dir, float density) {
    vec3 p = dir * density * 14.0;
    vec3 i = floor(p);
    vec3 f = fract(p);
    float best = 0.0;
    for (int x = -1; x <= 1; x++) {
      for (int y = -1; y <= 1; y++) {
        for (int z = -1; z <= 1; z++) {
          vec3 g = vec3(float(x), float(y), float(z));
          vec3 cellId = i + g;
          float h1 = hash31(cellId);
          if (h1 < 0.8) continue;
          float h2 = hash31(cellId + 17.0);
          float h3 = hash31(cellId + 31.0);
          float h4 = hash31(cellId + 53.0);
          vec3 point = g + 0.5 + 0.5 * vec3(h2 - 0.5, h3 - 0.5, h4 - 0.5);
          float d = length(point - f);
          float s = smoothstep(0.09, 0.0, d);
          s *= 0.5 + 0.5 * hash31(cellId + 91.0);
          best = max(best, s);
        }
      }
    }
    return best;
  }

  // 吸积盘颜色
  vec3 diskColor(float r, float angle, float t) {
    float t01 = (r - uDiskInner) / (uDiskOuter - uDiskInner);
    t01 = clamp(t01, 0.0, 1.0);
    float fade = pow(1.0 - t01, 1.5);
    float heat = pow(1.0 - t01, 2.0);
    vec3 col = mix(uColorDiskB, uColorDiskA, heat);
    // 旋臂：用角度 + 半径 + 时间产生螺旋纹
    float spiral = sin(angle * 3.0 + r * 4.0 - t * 1.5) * 0.5 + 0.5;
    spiral = 0.7 + 0.3 * spiral;
    // 细噪声
    float n = hash21(vec2(r * 6.0, angle * 3.0) + t * 0.1);
    col *= spiral * (0.8 + 0.4 * n);
    return col * fade * uDiskBright;
  }

  void main() {
    vec2 uv = (vUv - 0.5) * 2.0;
    uv.x *= uResolution.x / uResolution.y;

    // 相机
    vec2 mouseOffset = (uMouse - 0.5) * 2.0;
    float yaw = mouseOffset.x * 3.14;
    float pitch = mouseOffset.y * 1.0;

    float camDist = 8.0;
    float autoYaw = uTime * uSpin * 0.5;

    // 相机位置
    vec3 camPos = vec3(
      sin(yaw + autoYaw) * cos(pitch) * camDist,
      sin(pitch) * camDist,
      cos(yaw + autoYaw) * cos(pitch) * camDist
    );

    vec3 forward = normalize(-camPos);
    vec3 worldUp = vec3(0.0, 1.0, 0.0);
    vec3 right = normalize(cross(worldUp, forward));
    vec3 up = cross(forward, right);

    float fov = 0.55;
    vec3 dir = normalize(forward + uv.x * right * fov + uv.y * up * fov);

    // ---- 光线追踪 ----
    vec3 p = camPos;
    vec3 d = dir;
    vec3 L = cross(p, d);
    float h2 = dot(L, L);

    vec3 color = uBackground;
    bool captured = false;

    // 用较大的步长，保证穿盘不会跳过
    for (int i = 0; i < 120; i++) {
      float r = length(p);
      if (r < 1.0) { captured = true; break; }
      if (r > 25.0) break;

      // 检查是否穿盘：光线从 y>0 跨到 y<0，或反之
      float dt = 0.15 * (1.0 + 0.3 * r);
      vec3 pNext = p + d * dt;
      float rr = length(p.xz);
      // 只在外环内部检测
      if (rr < uDiskOuter && rr > uDiskInner) {
        if ((p.y > 0.0 && pNext.y < 0.0) || (p.y < 0.0 && pNext.y > 0.0)) {
          // 二分找到交点
          float yA = p.y, yB = pNext.y;
          float tHit = abs(yA) / (abs(yA) + abs(yB));
          vec3 pCross = p + (pNext - p) * tHit;
          float rCross = length(pCross.xz);
          if (rCross < uDiskOuter && rCross > uDiskInner) {
            float ang = atan(pCross.z, pCross.x);
            color += diskColor(rCross, ang, uTime);
          }
        }
      }

      // 引力加速度
      vec3 acc = -1.5 * h2 * p / pow(r, 5.0) * uLens;
      d = normalize(d + acc * dt);
      p = pNext;
    }

    // 逃逸：看星空
    if (!captured) {
      float star = starfield(normalize(d), uStarDensity) * uStarBright;
      color += uColorStar * star;
    }

    // 光子环：靠近视界的亮环
    // 用每个像素光线的最终距离近似
    float rEnd = length(p);
    float photon = smoothstep(1.4, 1.0, rEnd) - smoothstep(1.15, 1.0, rEnd);
    color += vec3(1.0, 0.8, 0.5) * photon * uPhotonRing * 0.8;

    // 色调映射
    color = color / (1.0 + color * 0.5);
    color = pow(max(color, 0.0), vec3(0.9));

    gl_FragColor = vec4(color, 1.0);
  }
`;

const material = new THREE.ShaderMaterial({
  vertexShader: vert,
  fragmentShader: frag,
  uniforms: {
    uResolution: { value: new THREE.Vector2(1, 1) },
    uMouse: { value: new THREE.Vector2(0.5, 0.5) },
    uTime: { value: 0 },
    uSpin: { value: CFG.spin },
    uDiskBright: { value: CFG.diskBright },
    uDiskInner: { value: CFG.diskInner },
    uDiskOuter: { value: CFG.diskOuter },
    uStarDensity: { value: CFG.starDensity },
    uStarBright: { value: CFG.starBright },
    uLens: { value: CFG.lens },
    uPhotonRing: { value: CFG.photonRing },
    uColorDiskA: { value: new THREE.Color(CFG.colorDiskA) },
    uColorDiskB: { value: new THREE.Color(CFG.colorDiskB) },
    uColorStar: { value: new THREE.Color(CFG.colorStar) },
    uBackground: { value: new THREE.Color(CFG.background) }
  }
});

const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
mesh.frustumCulled = false;
scene.add(mesh);

function resize() {
  const W = innerWidth;
  const H = innerHeight;
  renderer.setPixelRatio(PIXEL_RATIO);
  renderer.setSize(W, H, false);
  material.uniforms.uResolution.value.set(W * PIXEL_RATIO, H * PIXEL_RATIO);
}
resize();

const pointer = { x: 0.5, y: 0.5, targetX: 0.5, targetY: 0.5, down: false };
const rect = () => canvasEl.getBoundingClientRect();

const onDown = e => {
  const t = e.touches ? e.touches[0] : e;
  const r = rect();
  pointer.targetX = (t.clientX - r.left) / r.width;
  pointer.targetY = (t.clientY - r.top) / r.height;
  pointer.down = true;
  if (e.touches) e.preventDefault();
};
const onMove = e => {
  const t = e.touches ? e.touches[0] : e;
  const r = rect();
  pointer.targetX = (t.clientX - r.left) / r.width;
  pointer.targetY = (t.clientY - r.top) / r.height;
  if (e.touches) e.preventDefault();
};
const onUp = () => { pointer.down = false; };

canvasEl.addEventListener('touchstart', onDown, { passive: false });
canvasEl.addEventListener('touchmove', onMove, { passive: false });
canvasEl.addEventListener('touchend', onUp);
canvasEl.addEventListener('touchcancel', onUp);
canvasEl.addEventListener('mousedown', onDown);
canvasEl.addEventListener('mousemove', onMove);
canvasEl.addEventListener('mouseup', onUp);
canvasEl.addEventListener('mouseleave', onUp);

let startTime = performance.now();
function loop(now) {
  const t = (now - startTime) / 1000;
  pointer.x += (pointer.targetX - pointer.x) * 0.08;
  pointer.y += (pointer.targetY - pointer.y) * 0.08;

  const u = material.uniforms;
  u.uTime.value = t;
  u.uMouse.value.set(pointer.x, pointer.y);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

const mEl = document.getElementById('m');
const SCHEMES = [
  { name: 'Gargantua', colorDiskA: '#ffe0a0', colorDiskB: '#ff8c1a',
    colorStar: '#ffffff', background: '#000000', diskBright: 1.6, spin: 0.05 },
  { name: '蓝巨星', colorDiskA: '#ffffff', colorDiskB: '#5b9bff',
    colorStar: '#d8e8ff', background: '#000010', diskBright: 1.7, spin: 0.08 },
  { name: '紫罗兰', colorDiskA: '#ffd0ff', colorDiskB: '#8a2bff',
    colorStar: '#ffffff', background: '#05000f', diskBright: 1.5, spin: 0.06 },
  { name: '翡翠', colorDiskA: '#eafff0', colorDiskB: '#12b76a',
    colorStar: '#e0fff0', background: '#000a05', diskBright: 1.6, spin: 0.04 },
  { name: '深红', colorDiskA: '#ffdada', colorDiskB: '#a01224',
    colorStar: '#ff9090', background: '#0a0000', diskBright: 1.6, spin: 0.07 }
];
let schemeIdx = 0;

function applyScheme(s) {
  const u = material.uniforms;
  u.uColorDiskA.value.set(s.colorDiskA);
  u.uColorDiskB.value.set(s.colorDiskB);
  u.uColorStar.value.set(s.colorStar);
  u.uBackground.value.set(s.background);
  u.uDiskBright.value = s.diskBright;
  u.uSpin.value = s.spin;
}

document.getElementById('btn-reset').addEventListener('click', () => {
  startTime = performance.now();
  pointer.targetX = 0.5;
  pointer.targetY = 0.5;
});

document.getElementById('btn-change').addEventListener('click', () => {
  schemeIdx = (schemeIdx + 1) % SCHEMES.length;
  applyScheme(SCHEMES[schemeIdx]);
  mEl.textContent = SCHEMES[schemeIdx].name;
});

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

applyScheme(SCHEMES[0]);
mEl.textContent = SCHEMES[0].name;
requestAnimationFrame(loop);
</script>
</body>
</html>
