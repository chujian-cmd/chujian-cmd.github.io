<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Menger 海绵</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #05060c;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }

  #bar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: max(12px, env(safe-area-inset-top)) 12px 12px;
    display: flex; gap: 8px; align-items: center;
    background: linear-gradient(180deg, rgba(5,6,12,0.8), rgba(5,6,12,0));
    z-index: 10; pointer-events: none;
    font: 13px -apple-system, "PingFang SC", sans-serif;
    color: #c3c9d4;
  }
  #bar > * { pointer-events: auto; }
  #bar .mode { flex: 1; color: #8a8f98; }
  #bar .mode b { color: #f7f8f8; font-weight: 600; }

  .btn {
    height: 38px; padding: 0 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    color: #f7f8f8; font: 500 13px -apple-system, "PingFang SC", sans-serif;
    cursor: pointer; -webkit-user-select: none; user-select: none;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .btn:active { background: rgba(255,255,255,0.14); }
  .btn.pri { background: rgba(94,106,210,0.32); border-color: rgba(94,106,210,0.6); }

  #hint {
    position: fixed; left: 0; right: 0;
    bottom: max(20px, env(safe-area-inset-bottom));
    text-align: center; color: #6a6f7a;
    font: 12px -apple-system, "PingFang SC", sans-serif;
    pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="bar">
  <div class="mode">Menger <b id="m">琥珀</b></div>
  <button class="btn" id="btn-reset">重置</button>
  <button class="btn pri" id="btn-change">换配色</button>
</div>

<div id="hint">拖动 = 旋转 · 双指捏合 = 缩放</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
              || (navigator.maxTouchPoints > 1);

// ---------- 参数 ----------
const CFG = {
  iterations: 4,      // 迭代次数
  scale: 1.0,         // 整体缩放
  spin: 0.1,          // 自转速度
  camDist: 4.0,
  glow: 0.6,
  hueShift: 0.0,
  colorA: '#ffb347',
  colorB: '#402010',
  background: '#05060c'
};

const PIXEL_RATIO = isMobile ? 0.5 : 0.75;

const canvasEl = document.getElementById('cv');
const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: false });
renderer.setPixelRatio(PIXEL_RATIO);
renderer.setSize(innerWidth, innerHeight, false);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const vert = /* glsl */`
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = vec4(position.xy, 0.0, 1.0);
  }
`;

const frag = /* glsl */`
  precision highp float;
  varying vec2 vUv;

  uniform vec2  uResolution;
  uniform vec2  uMouse;
  uniform float uTime;
  uniform float uIterations;
  uniform float uScale;
  uniform float uSpin;
  uniform float uCamDist;
  uniform float uGlow;
  uniform float uHueShift;
  uniform vec3  uColorA;
  uniform vec3  uColorB;
  uniform vec3  uBackground;

  #define PI 3.14159265359
  #define TAU 6.28318530718

  mat3 rotX(float a) {
    float s = sin(a), c = cos(a);
    return mat3(1.0, 0.0, 0.0, 0.0, c, -s, 0.0, s, c);
  }
  mat3 rotY(float a) {
    float s = sin(a), c = cos(a);
    return mat3(c, 0.0, s, 0.0, 1.0, 0.0, -s, 0.0, c);
  }

  // Menger 海绵距离场
  float sdMenger(vec3 p, float iterations) {
    // 归一化到 [-1,1] 立方体
    p = abs(p) - 1.0;

    // 取到立方体表面的距离
    float d = max(p.x, max(p.y, p.z));

    // 迭代挖孔
    float s = 1.0;
    for (int i = 0; i < 8; i++) {
      if (float(i) >= iterations) break;

      // 乘 3 缩放到下一个尺度
      vec3 a = mod(p * s, 2.0) - 1.0;
      s *= 3.0;
      vec3 r = abs(1.0 - 3.0 * abs(a));

      // 三种方向的"十字"挖孔
      float da = max(r.x, r.y);
      float db = max(r.y, r.z);
      float dc = max(r.z, r.x);
      float c = (min(da, min(db, dc)) - 1.0) / s;

      d = max(d, c);
    }

    return d;
  }

  float map(vec3 p) {
    // 全局旋转
    float t = uTime * uSpin * 0.5;
    p = rotY(t) * p;
    p = rotX(t * 0.4) * p;

    // 缩放
    p /= uScale;

    return sdMenger(p, uIterations) * uScale;
  }

  vec3 calcNormal(vec3 p) {
    vec2 e = vec2(0.0015, 0.0);
    return normalize(vec3(
      map(p + e.xyy) - map(p - e.xyy),
      map(p + e.yxy) - map(p - e.yxy),
      map(p + e.yyx) - map(p - e.yyx)
    ));
  }

  vec3 palette(float t, vec3 a, vec3 b, vec3 c, vec3 d) {
    return a + b * cos(TAU * (c * t + d));
  }

  void main() {
    vec2 uv = (vUv - 0.5) * 2.0;
    uv.x *= uResolution.x / uResolution.y;

    // 相机
    vec2 mouseOffset = (uMouse - 0.5) * 2.0;
    float yaw = mouseOffset.x * 3.14;
    float pitch = mouseOffset.y * 1.2;

    vec3 camPos = vec3(
      sin(yaw) * cos(pitch) * uCamDist,
      sin(pitch) * uCamDist,
      cos(yaw) * cos(pitch) * uCamDist
    );

    vec3 forward = normalize(-camPos);
    vec3 worldUp = vec3(0.0, 1.0, 0.0);
    vec3 right = normalize(cross(worldUp, forward));
    vec3 up = cross(forward, right);

    vec3 rd = normalize(forward + uv.x * right * 0.75 + uv.y * up * 0.75);
    vec3 ro = camPos;

    // ray march
    float t = 0.0;
    float glow = 0.0;
    bool hit = false;
    vec3 p = ro;

    for (int i = 0; i < 128; i++) {
      p = ro + rd * t;
      float d = map(p);
      glow += 0.006 / (0.02 + abs(d));
      if (d < 0.001) { hit = true; break; }
      t += d * 0.7;
      if (t > 12.0) break;
    }

    vec3 col = uBackground;
    if (hit) {
      vec3 n = calcNormal(p);
      vec3 lightDir = normalize(vec3(0.5, 0.8, 0.6));
      float diff = clamp(dot(n, lightDir), 0.0, 1.0);
      float fres = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 3.0);

      // 用世界坐标驱动色相
      float tone = 0.5 + 0.5 * sin(p.x * 0.5 + p.y * 0.5 + p.z * 0.5 + uTime * 0.3 + uHueShift);
      vec3 base = palette(tone,
        (uColorA + uColorB) * 0.5,
        (uColorB - uColorA) * 0.5,
        vec3(1.0),
        vec3(0.0, 0.15, 0.3)
      );

      col = base * (0.25 + 0.9 * diff) + fres * base * 1.4;
      col = mix(col, uBackground, clamp(t / 12.0, 0.0, 0.75));
    }

    col += mix(uColorA, uColorB, 0.5) * glow * uGlow * 0.03;

    // 色调映射
    col = col / (1.0 + col * 0.4);
    col = pow(max(col, 0.0), vec3(0.9));

    gl_FragColor = vec4(col, 1.0);
  }
`;

const material = new THREE.ShaderMaterial({
  vertexShader: vert,
  fragmentShader: frag,
  uniforms: {
    uResolution: { value: new THREE.Vector2(1, 1) },
    uMouse: { value: new THREE.Vector2(0.5, 0.5) },
    uTime: { value: 0 },
    uIterations: { value: CFG.iterations },
    uScale: { value: CFG.scale },
    uSpin: { value: CFG.spin },
    uCamDist: { value: CFG.camDist },
    uGlow: { value: CFG.glow },
    uHueShift: { value: CFG.hueShift },
    uColorA: { value: new THREE.Color(CFG.colorA) },
    uColorB: { value: new THREE.Color(CFG.colorB) },
    uBackground: { value: new THREE.Color(CFG.background) }
  }
});

const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
mesh.frustumCulled = false;
scene.add(mesh);

function resize() {
  const W = innerWidth;
  const H = innerHeight;
  renderer.setPixelRatio(PIXEL_RATIO);
  renderer.setSize(W, H, false);
  material.uniforms.uResolution.value.set(W * PIXEL_RATIO, H * PIXEL_RATIO);
}
resize();

const pointer = { x: 0.5, y: 0.5, targetX: 0.5, targetY: 0.5 };
let camDist = CFG.camDist;
let pinchStartDist = 0;
let pinchStartCam = 1;
const rect = () => canvasEl.getBoundingClientRect();

const onDown = e => {
  if (e.touches && e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.hypot(dx, dy);
    pinchStartCam = camDist;
    return;
  }
  const t = e.touches ? e.touches[0] : e;
  const r = rect();
  pointer.targetX = (t.clientX - r.left) / r.width;
  pointer.targetY = (t.clientY - r.top) / r.height;
  if (e.touches) e.preventDefault();
};
const onMove = e => {
  if (e.touches && e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const d = Math.hypot(dx, dy);
    if (pinchStartDist > 0) camDist = Math.max(2, Math.min(10, pinchStartCam * pinchStartDist / d));
    return;
  }
  const t = e.touches ? e.touches[0] : e;
  const r = rect();
  pointer.targetX = (t.clientX - r.left) / r.width;
  pointer.targetY = (t.clientY - r.top) / r.height;
  if (e.touches) e.preventDefault();
};
const onUp = () => { pinchStartDist = 0; };

canvasEl.addEventListener('touchstart', onDown, { passive: false });
canvasEl.addEventListener('touchmove', onMove, { passive: false });
canvasEl.addEventListener('touchend', onUp);
canvasEl.addEventListener('touchcancel', onUp);
canvasEl.addEventListener('mousedown', onDown);
canvasEl.addEventListener('mousemove', onMove);
canvasEl.addEventListener('mouseup', onUp);
canvasEl.addEventListener('mouseleave', onUp);
canvasEl.addEventListener('wheel', e => {
  e.preventDefault();
  camDist = Math.max(2, Math.min(10, camDist * Math.exp(e.deltaY * 0.001)));
}, { passive: false });

let startTime = performance.now();
function loop(now) {
  const t = (now - startTime) / 1000;
  pointer.x += (pointer.targetX - pointer.x) * 0.08;
  pointer.y += (pointer.targetY - pointer.y) * 0.08;

  const u = material.uniforms;
  u.uTime.value = t;
  u.uMouse.value.set(pointer.x, pointer.y);
  u.uCamDist.value = camDist;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

const mEl = document.getElementById('m');
const SCHEMES = [
  { name: '琥珀',   colorA: '#ffb347', colorB: '#402010', background: '#05060c',
    iterations: 4, scale: 1.0, spin: 0.1, glow: 0.6 },
  { name: '冰晶',   colorA: '#8fd4ff', colorB: '#203050', background: '#020610',
    iterations: 4, scale: 1.0, spin: 0.08, glow: 0.8 },
  { name: '翡翠',   colorA: '#4ecb8d', colorB: '#0d3024', background: '#030a05',
    iterations: 4, scale: 1.0, spin: 0.12, glow: 0.7 },
  { name: '紫晶',   colorA: '#b26bff', colorB: '#2a1a50', background: '#06020c',
    iterations: 4, scale: 1.0, spin: 0.1, glow: 0.75 },
  { name: '深红',   colorA: '#ff4d6d', colorB: '#40101a', background: '#0a0205',
    iterations: 4, scale: 1.0, spin: 0.15, glow: 0.9 },
  { name: '白金',   colorA: '#e8ecf5', colorB: '#5a6070', background: '#0a0b10',
    iterations: 4, scale: 1.0, spin: 0.06, glow: 0.5 }
];
let schemeIdx = 0;

function applyScheme(s) {
  CFG.colorA = s.colorA;
  CFG.colorB = s.colorB;
  CFG.background = s.background;
  CFG.iterations = s.iterations;
  CFG.scale = s.scale;
  CFG.spin = s.spin;
  CFG.glow = s.glow;
  const u = material.uniforms;
  u.uColorA.value.set(s.colorA);
  u.uColorB.value.set(s.colorB);
  u.uBackground.value.set(s.background);
  u.uIterations.value = s.iterations;
  u.uScale.value = s.scale;
  u.uSpin.value = s.spin;
  u.uGlow.value = s.glow;
  camDist = CFG.camDist;
  u.uCamDist.value = camDist;
}

document.getElementById('btn-reset').addEventListener('click', () => {
  startTime = performance.now();
  pointer.targetX = 0.5;
  pointer.targetY = 0.5;
  camDist = CFG.camDist;
});

document.getElementById('btn-change').addEventListener('click', () => {
  schemeIdx = (schemeIdx + 1) % SCHEMES.length;
  applyScheme(SCHEMES[schemeIdx]);
  mEl.textContent = SCHEMES[schemeIdx].name;
});

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

applyScheme(SCHEMES[0]);
mEl.textContent = SCHEMES[0].name;
requestAnimationFrame(loop);
</script>
</body>
</html>
