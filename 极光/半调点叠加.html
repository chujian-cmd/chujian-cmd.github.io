<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>半调点叠加 Halftone Overlay</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0d12;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
  #bar{position:fixed;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 12px 12px;
    display:flex;gap:8px;align-items:center;background:linear-gradient(180deg,rgba(11,13,18,.85),rgba(11,13,18,0));
    z-index:10;pointer-events:none;font:13px -apple-system,"PingFang SC",sans-serif;color:#c3c9d4}
  #bar>*{pointer-events:auto}
  #bar .mode{flex:1;color:#8a8f98}
  #bar .mode b{color:#f7f8f8;font-weight:600}
  .btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.06);color:#f7f8f8;font:500 13px -apple-system,"PingFang SC",sans-serif;
    cursor:pointer;-webkit-user-select:none;user-select:none}
  .btn:active{background:rgba(255,255,255,.14)}
  .btn.pri{background:rgba(63,169,255,.28);border-color:rgba(63,169,255,.6);color:#eaf5ff}
  #hint{position:fixed;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));text-align:center;
    color:#6a6f7a;font:12px -apple-system,"PingFang SC",sans-serif;pointer-events:none;z-index:10}

  #panel{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:14px 14px max(14px,env(safe-area-inset-bottom));
    background:rgba(14,15,22,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid rgba(255,255,255,.1);
    transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
    font:14px -apple-system,"PingFang SC",sans-serif;color:#eef1ff;
  }
  #panel.open{transform:translateY(0)}
  #panel label{display:block;font-size:11px;color:#8a8f98;margin-bottom:6px;letter-spacing:.4px}
  #panel .row{display:flex;gap:8px;align-items:flex-start}
  #panel textarea{
    flex:1;min-height:60px;max-height:160px;padding:9px 12px;border-radius:10px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
    color:#fff;font:14px -apple-system,"PingFang SC",sans-serif;outline:none;resize:none;
  }
  #panel textarea:focus{border-color:rgba(63,169,255,.7)}
  #panel .ok{
    height:42px;padding:0 18px;border-radius:10px;border:1px solid rgba(63,169,255,.6);
    background:rgba(63,169,255,.3);color:#fff;font:600 14px -apple-system,"PingFang SC",sans-serif;
    cursor:pointer;
  }
  #panel .ok:active{background:rgba(63,169,255,.5)}
  #backdrop{position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .28s}
  #backdrop.open{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="bar">
  <div class="mode">半调点叠加 <b id="m">双色印刷</b></div>
  <button class="btn" id="btn-mode">换模式</button>
  <button class="btn" id="btn-text">换文字</button>
  <button class="btn pri" id="btn-custom">自定义</button>
</div>

<div id="hint">旋转网点 · 双色印刷 / 墨点叠字 · 波普海报</div>

<div id="backdrop"></div>
<div id="panel">
  <label>文字内容（支持换行）</label>
  <div class="row">
    <textarea id="inp" rows="2" spellcheck="false" placeholder="AURORA"></textarea>
    <button class="ok" id="btn-ok">确定</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');

  var CFG = {
    text: 'AURORA',
    weight: 900,
    font: '"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif',
    style: 'duo',           // duo | over
    dotCell: 10,
    angle: 15,
    disperse: 0,
    contrast: 1.2,
    inkStrength: 0.9,
    ink: '#0f0f10',
    paper: '#f4f1e8',
    background: '#f4f1e8'
  };

  var MODES = [
    { key: 'duo',  label: '双色印刷' },
    { key: 'over', label: '墨点叠字' }
  ];

  var W = 0, H = 0, dpr = 1;
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    if (!w || !h) return false;
    W = w; H = h;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    maskData = null; maskKey = '';
    return true;
  }

  // ---------- 掩膜：白字 + 透明底 ----------
  var maskCanvas = document.createElement('canvas');
  var mctx = maskCanvas.getContext('2d', { willReadFrequently: true });
  var maskData = null;
  var maskKey = '';
  var maskW = 0, maskH = 0;

  function buildMask() {
    if (!W || !H) return;
    var key = CFG.text + '|' + W + 'x' + H + '|' + CFG.weight + '|' + CFG.font;
    if (key === maskKey && maskData) return;
    maskKey = key;
    maskW = W; maskH = H;
    maskCanvas.width = W; maskCanvas.height = H;
    mctx.clearRect(0, 0, W, H);
    mctx.fillStyle = '#fff';
    mctx.textAlign = 'center';
    mctx.textBaseline = 'middle';

    var lines = CFG.text.split('\n').filter(function (l) { return l.length > 0; });
    if (!lines.length) { maskData = mctx.getImageData(0, 0, W, H).data; return; }

    var maxW = W * 0.88, maxH = H * 0.82;
    var lh = maxH / lines.length;
    var size = Math.floor(lh * 0.82);
    var setF = function (s) { mctx.font = CFG.weight + ' ' + s + 'px ' + CFG.font; };
    setF(size);

    var widest = 0;
    for (var i = 0; i < lines.length; i++) {
      var m = mctx.measureText(lines[i]).width;
      if (m > widest) widest = m;
    }
    if (widest > maxW) {
      size = Math.max(6, Math.floor(size * maxW / widest));
      setF(size);
    }
    var totalH = size * 1.15 * lines.length;
    if (totalH > maxH) {
      size = Math.max(6, Math.floor(size * maxH / totalH));
      setF(size);
    }
    var startY = H / 2 - (lines.length - 1) * size * 1.15 / 2;
    for (var j = 0; j < lines.length; j++) {
      mctx.fillText(lines[j], W / 2, startY + j * size * 1.15);
    }
    maskData = mctx.getImageData(0, 0, W, H).data;
  }

  function alphaAt(x, y) {
    if (!maskData) return 0;
    x = x | 0; y = y | 0;
    if (x < 0) x = 0; else if (x >= maskW) x = maskW - 1;
    if (y < 0) y = 0; else if (y >= maskH) y = maskH - 1;
    return maskData[(y * maskW + x) * 4 + 3] / 255;
  }

  function feather(x, y, r) {
    return (alphaAt(x, y) + alphaAt(x - r, y) + alphaAt(x + r, y) + alphaAt(x, y - r) + alphaAt(x, y + r)) / 5;
  }

  // ---------- 渲染 ----------
  var time = 0, lastT = performance.now();

  function render(now) {
    var dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;
    time += dt;

    if (!W || !H) { requestAnimationFrame(render); return; }
    buildMask();

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = CFG.background;
    ctx.fillRect(0, 0, W, H);

    var dotCell = CFG.dotCell;
    var angle = CFG.angle * Math.PI / 180;
    var cosA = Math.cos(angle), sinA = Math.sin(angle);
    var cx = W / 2, cy = H / 2;
    var half = Math.hypot(W, H) / 2 + dotCell;
    var featherR = Math.max(1, Math.round(dotCell * 0.36));
    var contrast = CFG.contrast;
    var disperse = CFG.disperse;
    var ink = CFG.ink;
    var paper = CFG.paper;
    var style = CFG.style;
    var inkStrength = CFG.inkStrength;

    // 遍历旋转网格
    for (var v = -half; v <= half; v += dotCell) {
      for (var u = -half; u <= half; u += dotCell) {
        var x = cx + u * cosA - v * sinA;
        var y = cy + u * sinA + v * cosA;
        if (x < -dotCell || x > W + dotCell || y < -dotCell || y > H + dotCell) continue;

        var cov = feather(x, y, featherR);
        if (cov < 0.04) continue;

        // 对比
        var d = cov;
        d = (d - 0.5) * contrast + 0.5;
        if (d < 0) d = 0; else if (d > 1) d = 1;
        var dark = 1 - d;

        // 消散
        var rnd = hash((Math.floor(u / dotCell) * 7919) ^ (Math.floor(v / dotCell) * 31));
        var dis = 0;
        if (disperse > 0.001) {
          var nx = x / W;
          var th = nx + (rnd - 0.5) * 0.55;
          var t0 = 1 - disperse - 0.28;
          var t1 = 1 - disperse + 0.28;
          dis = clamp((th - t0) / (t1 - t0), 0, 1);
        }

        // 点半径
        var radius = Math.sqrt(dark) * 0.72 * (1 - dis);
        if (radius < 0.02) continue;

        var pxR = radius * dotCell;

        if (style === 'duo') {
          ctx.fillStyle = ink;
          ctx.globalAlpha = inkStrength;
        } else {
          ctx.fillStyle = ink;
          ctx.globalAlpha = inkStrength * (0.6 + 0.4 * dark);
        }

        ctx.beginPath();
        ctx.arc(x, y, pxR, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    requestAnimationFrame(render);
  }

  function hash(n) {
    var t = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return t - Math.floor(t);
  }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  // ---------- 预设 ----------
  var PRESETS = [
    { text: 'AURORA', style: 'duo',  dotCell: 10, angle: 15, contrast: 1.2, ink: '#0f0f10', paper: '#f4f1e8', background: '#f4f1e8' },
    { text: '波普',   style: 'duo',  dotCell: 9,  angle: 45, contrast: 1.3, ink: '#1a1a1a', paper: '#e6e2d6', background: '#e6e2d6' },
    { text: 'DOT',    style: 'over', dotCell: 8,  angle: 20, contrast: 1.1, ink: '#101012', inkStrength: 0.85, background: '#0a0a0c' },
    { text: '破碎',   style: 'duo',  dotCell: 8,  angle: 15, contrast: 1.15, disperse: 0.55, ink: '#111114', paper: '#f2efe6', background: '#f2efe6' },
    { text: 'NEON',   style: 'over', dotCell: 10, angle: 0,  contrast: 1.3, ink: '#00eaff', inkStrength: 0.9, background: '#05060a' }
  ];
  var presetIdx = 0;

  function applyPreset(p) {
    for (var k in p) if (p.hasOwnProperty(k)) CFG[k] = p[k];
    maskData = null; maskKey = '';
    var mm = MODES.find(function (x) { return x.key === CFG.style; });
    if (mm) mLabel.textContent = mm.label;
    var mi = MODES.findIndex(function (x) { return x.key === CFG.style; });
    if (mi >= 0) modeIdx = mi;
  }

  document.getElementById('btn-text').addEventListener('click', function () {
    presetIdx = (presetIdx + 1) % PRESETS.length;
    applyPreset(PRESETS[presetIdx]);
  });

  // ---------- 换模式 ----------
  var modeIdx = 0;
  var mLabel = document.getElementById('m');
  document.getElementById('btn-mode').addEventListener('click', function () {
    modeIdx = (modeIdx + 1) % MODES.length;
    CFG.style = MODES[modeIdx].key;
    mLabel.textContent = MODES[modeIdx].label;
  });

  // ---------- 自定义 ----------
  var panel = document.getElementById('panel');
  var backdrop = document.getElementById('backdrop');
  var inp = document.getElementById('inp');

  function openPanel() {
    inp.value = CFG.text;
    panel.classList.add('open');
    backdrop.classList.add('open');
    setTimeout(function () { inp.focus(); inp.select(); }, 320);
  }
  function closePanel() {
    panel.classList.remove('open');
    backdrop.classList.remove('open');
    inp.blur();
  }
  function confirmInput() {
    var v = inp.value;
    if (!v.replace(/\s/g, '').length) v = 'AURORA';
    CFG.text = v;
    maskData = null; maskKey = '';
  }

  document.getElementById('btn-custom').addEventListener('click', openPanel);
  document.getElementById('btn-ok').addEventListener('click', function () {
    confirmInput();
    closePanel();
  });
  backdrop.addEventListener('click', closePanel);
  inp.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); confirmInput(); closePanel(); }
  });
  inp.addEventListener('input', function () {
    inp.style.height = 'auto';
    inp.style.height = Math.min(160, inp.scrollHeight) + 'px';
  });

  // ---------- 启动 ----------
  function boot() {
    if (!resize()) { requestAnimationFrame(boot); return; }
    requestAnimationFrame(render);
  }
  boot();
  window.addEventListener('resize', function () { setTimeout(resize, 100); });
  window.addEventListener('orientationchange', function () { setTimeout(resize, 250); });
})();
</script>
</body>
</html>
