<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fractal 无限放大</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #06060c;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }

  #bar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: max(12px, env(safe-area-inset-top)) 12px 12px;
    display: flex; gap: 8px; align-items: center;
    background: linear-gradient(180deg, rgba(6,6,12,0.8), rgba(6,6,12,0));
    z-index: 10; pointer-events: none;
    font: 13px -apple-system, "PingFang SC", sans-serif;
    color: #c3c9d4;
  }
  #bar > * { pointer-events: auto; }
  #bar .mode { flex: 1; color: #8a8f98; font-variant-numeric: tabular-nums; }
  #bar .mode b { color: #f7f8f8; font-weight: 600; }

  .btn {
    height: 38px; padding: 0 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    color: #f7f8f8; font: 500 13px -apple-system, "PingFang SC", sans-serif;
    cursor: pointer; -webkit-user-select: none; user-select: none;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .btn:active { background: rgba(255,255,255,0.14); }
  .btn.pri { background: rgba(94,106,210,0.32); border-color: rgba(94,106,210,0.6); }

  #hint {
    position: fixed; left: 0; right: 0;
    bottom: max(20px, env(safe-area-inset-bottom));
    text-align: center; color: #6a6f7a;
    font: 12px -apple-system, "PingFang SC", sans-serif;
    pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="bar">
  <div class="mode">分形 <b id="m">×1.0</b></div>
  <button class="btn" id="btn-pause">暂停</button>
  <button class="btn pri" id="btn-change">换配色</button>
</div>

<div id="hint">双指捏合 = 缩放 · 单指拖动 = 平移 · 点屏幕 = 跳到那里</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
                || (navigator.maxTouchPoints > 1);

  // ---------- 参数 ----------
  const CFG = {
    // 视图
    centerX: -0.7453,
    centerY: 0.1127,
    zoom: 1.2,
    zoomSpeed: 0.5,      // 每秒放大倍率（指数），0 = 停
    paused: false,

    // 精度
    maxIter: isMobile ? 200 : 400,

    // 分辨率
    renderScale: isMobile ? 0.45 : 0.7,

    // 配色
    scheme: 0,
    schemes: [
      { name: '海马谷', bias: '#3a6bff', phase: '#20304d', shift: 0.05, bright: 1.1, bg: '#06060c' },
      { name: '闪电',   bias: '#fff35c', phase: '#1a1a00', shift: 0.15, bright: 1.3, bg: '#05060c' },
      { name: '螺旋深渊', bias: '#b366ff', phase: '#10052a', shift: 0.30, bright: 1.2, bg: '#04020c' },
      { name: '铜焰',   bias: '#ff8a3d', phase: '#2a0f00', shift: 0.08, bright: 1.15, bg: '#0a0503' },
      { name: '翡翠',   bias: '#4ecb8d', phase: '#0a2418', shift: 0.22, bright: 1.2, bg: '#030c08' }
    ]
  };

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  // ---------- 尺寸 ----------
  let W = 0, H = 0, dpr = 1;
  let RW = 0, RH = 0;
  const off = document.createElement('canvas');
  const octx = off.getContext('2d', { willReadFrequently: true });
  let imgData = null;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    computeBuffer();
  }

  function computeBuffer() {
    const scale = CFG.renderScale;
    RW = Math.max(2, Math.floor(W * scale));
    RH = Math.max(2, Math.floor(H * scale));
    off.width = RW;
    off.height = RH;
    imgData = octx.createImageData(RW, RH);
    needsRedraw = true;
  }

  // ---------- 视图坐标 ----------
  function viewBounds() {
    const aspect = W / H;
    const viewW = 3.5 / CFG.zoom;
    const viewH = viewW / aspect;
    return {
      x0: CFG.centerX - viewW / 2,
      y0: CFG.centerY - viewH / 2,
      x1: CFG.centerX + viewW / 2,
      y1: CFG.centerY + viewH / 2
    };
  }

  // ---------- 曼德博 ----------
  function mandelbrot(cr, ci, maxIter) {
    let zr = 0, zi = 0;
    let zr2 = 0, zi2 = 0;
    for (let i = 0; i < maxIter; i++) {
      zi = 2 * zr * zi + ci;
      zr = zr2 - zi2 + cr;
      zr2 = zr * zr;
      zi2 = zi * zi;
      if (zr2 + zi2 > 4) {
        // 平滑逃逸值
        const mod = Math.sqrt(zr2 + zi2);
        return i + 1 - Math.log(Math.log(mod)) / Math.LN2;
      }
    }
    return -1;
  }

  // ---------- 配色 LUT ----------
  let colLUT = null;
  function buildLUT() {
    const s = CFG.schemes[CFG.scheme];
    const hex2rgb = h => {
      const x = h.replace('#', '');
      const n = parseInt(x.length === 3 ? x.split('').map(c => c + c).join('') : x, 16);
      return [n >> 16 & 255, n >> 8 & 255, n & 255];
    };
    const [br, bg, bb] = hex2rgb(s.bias);
    const [pr, pg, pb] = hex2rgb(s.phase);
    const N = 512;
    colLUT = new Uint8Array(N * 3);
    for (let i = 0; i < N; i++) {
      const t = i / (N - 1);
      const r = (br + pr * 0.5) + (br * 0.5 + pr) * Math.cos(6.28318 * (t + s.shift + 0.0));
      const g = (bg + pg * 0.5) + (bg * 0.5 + pg) * Math.cos(6.28318 * (t + s.shift + 0.33));
      const b = (bb + pb * 0.5) + (bb * 0.5 + pb) * Math.cos(6.28318 * (t + s.shift + 0.67));
      colLUT[i * 3] = clamp(r * s.bright, 0, 255);
      colLUT[i * 3 + 1] = clamp(g * s.bright, 0, 255);
      colLUT[i * 3 + 2] = clamp(b * s.bright, 0, 255);
    }
  }

  // ---------- 渲染 ----------
  let needsRedraw = true;

  function render() {
    if (!needsRedraw) return;
    needsRedraw = false;

    const b = viewBounds();
    const maxIter = CFG.maxIter;
    const data = imgData.data;
    const s = CFG.schemes[CFG.scheme];
    const hex2rgb = h => {
      const x = h.replace('#', '');
      const n = parseInt(x.length === 3 ? x.split('').map(c => c + c).join('') : x, 16);
      return [n >> 16 & 255, n >> 8 & 255, n & 255];
    };
    const [bgR, bgG, bgB] = hex2rgb(s.bg);
    const N = 512;

    for (let y = 0; y < RH; y++) {
      const ci = b.y0 + (y / RH) * (b.y1 - b.y0);
      for (let x = 0; x < RW; x++) {
        const cr = b.x0 + (x / RW) * (b.x1 - b.x0);
        const it = mandelbrot(cr, ci, maxIter);
        const p = (y * RW + x) * 4;
        if (it < 0) {
          data[p] = 0;
          data[p + 1] = 0;
          data[p + 2] = 0;
          data[p + 3] = 255;
        } else {
          const t = (it / maxIter);
          const k = ((t * N) | 0) % N;
          data[p] = colLUT[k * 3];
          data[p + 1] = colLUT[k * 3 + 1];
          data[p + 2] = colLUT[k * 3 + 2];
          data[p + 3] = 255;
        }
      }
    }

    octx.putImageData(imgData, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(off, 0, 0, RW, RH, 0, 0, W, H);
  }

  // ---------- 指针：拖动平移 + 双指缩放 + 单击跳转 ----------
  let dragging = false;
  let dragStartX = 0, dragStartY = 0;
  let centerStartX = 0, centerStartY = 0;
  let pinchStartDist = 0;
  let pinchStartZoom = 1;
  let tapStartX = 0, tapStartY = 0, tapStartTime = 0;

  function screenToComplex(sx, sy) {
    const b = viewBounds();
    return {
      x: b.x0 + (sx / W) * (b.x1 - b.x0),
      y: b.y0 + (sy / H) * (b.y1 - b.y0)
    };
  }

  const onDown = e => {
    if (e.touches && e.touches.length === 2) {
      dragging = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchStartDist = Math.hypot(dx, dy);
      pinchStartZoom = CFG.zoom;
      return;
    }
    const t = e.touches ? e.touches[0] : e;
    dragging = true;
    dragStartX = t.clientX;
    dragStartY = t.clientY;
    tapStartX = t.clientX;
    tapStartY = t.clientY;
    tapStartTime = performance.now();
    centerStartX = CFG.centerX;
    centerStartY = CFG.centerY;
    if (e.touches) e.preventDefault();
  };

  const onMove = e => {
    if (e.touches && e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const d = Math.hypot(dx, dy);
      if (pinchStartDist > 0) {
        CFG.zoom = clamp(pinchStartZoom * (d / pinchStartDist), 1, 1e12);
        needsRedraw = true;
      }
      return;
    }
    if (!dragging) return;
    const t = e.touches ? e.touches[0] : e;
    const r = cv.getBoundingClientRect();
    const startC = screenToComplex(dragStartX - r.left, dragStartY - r.top);
    const curC = screenToComplex(t.clientX - r.left, t.clientY - r.top);
    CFG.centerX = centerStartX - (curC.x - startC.x);
    CFG.centerY = centerStartY - (curC.y - startC.y);
    needsRedraw = true;
    if (e.touches) e.preventDefault();
  };

  const onUp = e => {
    const wasDragging = dragging;
    dragging = false;
    pinchStartDist = 0;
    // 单击跳转
    if (wasDragging) {
      const dt = performance.now() - tapStartTime;
      const moved = Math.hypot((e.changedTouches ? e.changedTouches[0].clientX : e.clientX) - tapStartX,
                              (e.changedTouches ? e.changedTouches[0].clientY : e.clientY) - tapStartY);
      if (dt < 300 && moved < 8 && !e.touches) {
        // 单击：以点击处为中心，放大 2 倍
        const r = cv.getBoundingClientRect();
        const cx = (e.changedTouches ? e.changedTouches[0].clientX : e.clientX) - r.left;
        const cy = (e.changedTouches ? e.changedTouches[0].clientY : e.clientY) - r.top;
        const c = screenToComplex(cx, cy);
        CFG.centerX = c.x;
        CFG.centerY = c.y;
        CFG.zoom *= 2;
        needsRedraw = true;
      }
    }
  };

  cv.addEventListener('touchstart', onDown, { passive: false });
  cv.addEventListener('touchmove', onMove, { passive: false });
  cv.addEventListener('touchend', onUp);
  cv.addEventListener('touchcancel', onUp);
  cv.addEventListener('mousedown', onDown);
  cv.addEventListener('mousemove', onMove);
  cv.addEventListener('mouseup', onUp);
  cv.addEventListener('mouseleave', () => { dragging = false; });
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    // 以鼠标位置为中心缩放
    const r = cv.getBoundingClientRect();
    const cx = e.clientX - r.left;
    const cy = e.clientY - r.top;
    const before = screenToComplex(cx, cy);
    CFG.zoom = clamp(CFG.zoom * Math.exp(-e.deltaY * 0.0015), 1, 1e12);
    // 需要先更新视图再算
    const after = screenToComplex(cx, cy);
    CFG.centerX += before.x - after.x;
    CFG.centerY += before.y - after.y;
    needsRedraw = true;
  }, { passive: false });

  // ---------- 主循环 ----------
  let lastTime = performance.now();
  const mEl = document.getElementById('m');

  function updateLabel() {
    const z = CFG.zoom;
    let s;
    if (z < 1e3) s = `×${z.toFixed(1)}`;
    else if (z < 1e6) s = `×${(z / 1e3).toFixed(1)}k`;
    else if (z < 1e9) s = `×${(z / 1e6).toFixed(1)}M`;
    else s = `×${(z / 1e9).toFixed(1)}B`;
    mEl.textContent = s;
  }

  function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    if (!CFG.paused && CFG.zoomSpeed > 0 && !dragging && pinchStartDist === 0) {
      CFG.zoom *= Math.exp(CFG.zoomSpeed * dt);
      if (CFG.zoom > 1e12) CFG.zoom = 1e12;
      needsRedraw = true;
      updateLabel();
    }

    if (needsRedraw) render();
    requestAnimationFrame(loop);
  }

  // ---------- 按钮 ----------
  const btnPause = document.getElementById('btn-pause');

  btnPause.addEventListener('click', () => {
    CFG.paused = !CFG.paused;
    btnPause.textContent = CFG.paused ? '继续' : '暂停';
    btnPause.classList.toggle('pri', CFG.paused);
  });

  document.getElementById('btn-change').addEventListener('click', () => {
    CFG.scheme = (CFG.scheme + 1) % CFG.schemes.length;
    buildLUT();
    needsRedraw = true;
    mEl.textContent = CFG.schemes[CFG.scheme].name;
    // 重新显示 zoom
    setTimeout(updateLabel, 50);
  });

  // ---------- 启动 ----------
  resize();
  window.addEventListener('resize', () => { resize(); });
  window.addEventListener('orientationchange', () => setTimeout(() => { resize(); }, 200));

  buildLUT();
  updateLabel();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
