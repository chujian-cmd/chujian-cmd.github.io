<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>经典小游戏 · 合集</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; overscroll-behavior:none; background:#f5f7fa;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#1e293b; }
  body { display:flex; align-items:center; justify-content:center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  /* 首页卡片 */
  .game-hub { max-width:800px; width:100%; max-height:100%; display:grid; grid-template-columns:repeat(2,1fr);
    gap:16px; padding:16px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .game-card { background:#fff; border-radius:20px; box-shadow:0 4px 12px rgba(0,0,0,.03),0 1px 2px rgba(0,0,0,.05);
    aspect-ratio:1/1; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer;
    transition:transform .1s ease, box-shadow .1s ease; padding:12px; border:1px solid rgba(0,0,0,.02); }
  .game-card:active { transform:scale(.97); box-shadow:0 2px 6px rgba(0,0,0,.05); }
  .game-icon { width:72px; height:72px; margin-bottom:8px; display:flex; align-items:center; justify-content:center; }
  .game-icon svg { width:100%; height:100%; display:block; }
  .game-title { font-size:1.3rem; font-weight:500; letter-spacing:.5px; color:#0f172a; }

  /* 游戏视图 */
  .game-view { position:fixed; inset:0; background:#f5f7fa; display:none; align-items:center; justify-content:center;
    padding:16px; z-index:100; overflow:auto; -webkit-overflow-scrolling:touch;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  .game-view.active { display:flex; }
  .game-panel { max-width:500px; width:100%; background:#fff; border-radius:24px; box-shadow:0 8px 30px rgba(0,0,0,.05);
    padding:20px; display:flex; flex-direction:column; align-items:center; position:relative; max-height:100%; }
  .game-header { width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px; }
  .btn { background:#f1f5f9; border:none; border-radius:40px; padding:8px 18px; font-size:.95rem; font-weight:500;
    color:#1e293b; cursor:pointer; transition:background .1s, transform .1s; display:flex; align-items:center;
    justify-content:center; gap:6px; border:1px solid rgba(0,0,0,.02); font-family:inherit; line-height:1;
    white-space:nowrap; min-height:40px; }
  .btn:active { background:#e2e8f0; transform:scale(.96); }
  .btn-primary { background:#1e293b; color:#fff; }
  .btn-primary:active { background:#0f172a; }

  /* 通用画布 */
  .canvas-wrapper { display:flex; justify-content:center; align-items:center; width:100%; aspect-ratio:1/1;
    max-width:min(400px,80vw); margin:0 auto; }
  canvas { display:block; width:100%; height:100%; background:#f8fafc; border-radius:16px;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.02); touch-action:none; }

  /* 扫雷 */
  .minesweeper-grid { display:grid; gap:3px; background:#cbd5e1; padding:4px; border-radius:12px;
    width:100%; aspect-ratio:1/1; max-width:min(400px,80vw); margin:0 auto; }
  .mine-cell { background:#f1f5f9; border-radius:6px; display:flex; align-items:center; justify-content:center;
    font-weight:600; font-size:.9rem; color:#0f172a; cursor:pointer; aspect-ratio:1/1; transition:background .05s; }
  .mine-cell:active { background:#e2e8f0; }
  .mine-cell.revealed { background:#e2e8f0; color:#334155; cursor:default; }
  .mine-cell.mine { background:#fee2e2; color:#b91c1c; }

  .status-text { font-size:1rem; color:#475569; margin:8px 0 0; text-align:center; font-weight:500; min-height:1.4em; }

  /* ===== 2048 自定义渲染（稳定版） ===== */
  .game-2048-wrap { width:100%; max-width:min(400px,80vw); margin:0 auto; aspect-ratio:1/1; position:relative; }
  .game-2048-board {
    position:absolute; inset:0;
    background:#bbada0; border-radius:12px; padding:8px;
    display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr);
    gap:8px;
  }
  .cell-bg { background:rgba(238,228,218,.35); border-radius:6px; }
  .tile-layer { position:absolute; inset:8px; pointer-events:none; }
  .tile-2d {
    position:absolute; display:flex; align-items:center; justify-content:center;
    border-radius:6px; font-weight:700; color:#776e65;
    transition: left .1s ease, top .1s ease, width .1s ease, height .1s ease;
    will-change: left, top;
  }
  .tile-2d .inner { width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    border-radius:6px; }
  /* 数值配色 */
  .v2   .inner { background:#eee4da; color:#776e65; }
  .v4   .inner { background:#ede0c8; color:#776e65; }
  .v8   .inner { background:#f2b179; color:#f9f6f2; }
  .v16  .inner { background:#f59563; color:#f9f6f2; }
  .v32  .inner { background:#f67c5f; color:#f9f6f2; }
  .v64  .inner { background:#f65e3b; color:#f9f6f2; }
  .v128 .inner { background:#edcf72; color:#f9f6f2; }
  .v256 .inner { background:#edcc61; color:#f9f6f2; }
  .v512 .inner { background:#edc850; color:#f9f6f2; }
  .v1024 .inner { background:#edc53f; color:#f9f6f2; }
  .v2048 .inner { background:#edc22e; color:#f9f6f2; }
  .vsuper .inner { background:#3c3a32; color:#f9f6f2; }

  @media (max-width:600px) {
    .game-hub { gap:12px; padding:12px; }
    .game-card { border-radius:16px; padding:10px; }
    .game-icon { width:52px; height:52px; margin-bottom:6px; }
    .game-title { font-size:1rem; }
    .game-panel { padding:14px; border-radius:20px; }
    .btn { padding:6px 14px; font-size:.85rem; min-height:36px; }
    .mine-cell { font-size:.75rem; border-radius:4px; }
    .minesweeper-grid { gap:2px; padding:3px; border-radius:10px; }
    .status-text { font-size:.9rem; }
    .tile-2d { font-size:1.2rem; }
  }
  @media (max-width:380px) {
    .game-icon { width:44px; height:44px; }
    .game-title { font-size:.9rem; }
    .btn { padding:5px 12px; font-size:.8rem; }
    .tile-2d { font-size:1rem; }
  }
</style>
</head>
<body>

<!-- 首页 -->
<div class="game-hub" id="gameHub">
  <div class="game-card" data-game="snake">
    <div class="game-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 16c0-2 2-4 4-4h4c2 0 4-2 4-4V6a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v2"/>
        <circle cx="16" cy="16" r="3" fill="#000" stroke="none"/>
        <circle cx="19" cy="19" r="1.5" fill="#000" stroke="none"/>
      </svg>
    </div>
    <div class="game-title">贪吃蛇</div>
  </div>
  <div class="game-card" data-game="2048">
    <div class="game-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        <text x="12" y="15" font-size="6" fill="#000" stroke="none" text-anchor="middle" font-weight="bold">2</text>
      </svg>
    </div>
    <div class="game-title">2048</div>
  </div>
  <div class="game-card" data-game="tetris">
    <div class="game-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="6" height="6" rx="1"/>
        <rect x="9" y="3" width="6" height="6" rx="1"/>
        <rect x="15" y="3" width="6" height="6" rx="1"/>
        <rect x="9" y="9" width="6" height="6" rx="1"/>
        <rect x="9" y="15" width="6" height="6" rx="1"/>
        <rect x="15" y="15" width="6" height="6" rx="1"/>
      </svg>
    </div>
    <div class="game-title">俄罗斯方块</div>
  </div>
  <div class="game-card" data-game="minesweeper">
    <div class="game-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3" fill="#000" stroke="none"/>
        <line x1="12" y1="3" x2="12" y2="7"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
        <line x1="3" y1="12" x2="7" y2="12"/>
        <line x1="17" y1="12" x2="21" y2="12"/>
        <line x1="5.6" y1="5.6" x2="8.5" y2="8.5"/>
        <line x1="15.5" y1="15.5" x2="18.4" y2="18.4"/>
        <line x1="5.6" y1="18.4" x2="8.5" y2="15.5"/>
        <line x1="15.5" y1="8.5" x2="18.4" y2="5.6"/>
      </svg>
    </div>
    <div class="game-title">扫雷</div>
  </div>
</div>

<!-- 游戏视图 -->
<div class="game-view" id="gameView">
  <div class="game-panel" id="gamePanel">
    <div class="game-header">
      <button class="btn" id="backBtn">← 返回</button>
      <button class="btn btn-primary" id="restartBtn">↻ 重开</button>
    </div>
    <div id="gameContent"></div>
    <div class="status-text" id="statusText"></div>
  </div>
</div>

<script>
/* ============================================================
   polyfill 与经典 2048 核心类
   ============================================================ */
// animframe_polyfill
(function () {
  var lastTime = 0, vendors = ['webkit', 'moz'];
  for (var x = 0; x < vendors.length && !window.requestAnimationFrame; ++x) {
    window.requestAnimationFrame = window[vendors[x] + 'RequestAnimationFrame'];
    window.cancelAnimationFrame = window[vendors[x] + 'CancelAnimationFrame'] || window[vendors[x] + 'CancelRequestAnimationFrame'];
  }
  if (!window.requestAnimationFrame) {
    window.requestAnimationFrame = function (cb) {
      var curr = new Date().getTime(), wait = Math.max(0, 16 - (curr - lastTime));
      var id = setTimeout(function(){ cb(curr + wait); }, wait); lastTime = curr + wait; return id;
    };
  }
  if (!window.cancelAnimationFrame) { window.cancelAnimationFrame = function (id) { clearTimeout(id); }; }
})();

// bind_polyfill
Function.prototype.bind = Function.prototype.bind || function (target) {
  var self = this;
  return function (args) { if (!(args instanceof Array)) args = [args]; self.apply(target, args); };
};

// classlist_polyfill
(function () {
  if (typeof window.Element === "undefined" || "classList" in document.documentElement) return;
  var prototype = Array.prototype, push = prototype.push, splice = prototype.splice, join = prototype.join;
  function DOMTokenList(el) {
    this.el = el;
    var classes = el.className.replace(/^\s+|\s+$/g, '').split(/\s+/);
    for (var i = 0; i < classes.length; i++) push.call(this, classes[i]);
  }
  DOMTokenList.prototype = {
    add: function (t) { if (this.contains(t)) return; push.call(this, t); this.el.className = this.toString(); },
    contains: function (t) { return this.el.className.indexOf(t) != -1; },
    item: function (i) { return this[i] || null; },
    remove: function (t) {
      if (!this.contains(t)) return;
      for (var i = 0; i < this.length; i++) if (this[i] == t) break;
      splice.call(this, i, 1); this.el.className = this.toString();
    },
    toString: function () { return join.call(this, ' '); },
    toggle: function (t) { if (!this.contains(t)) this.add(t); else this.remove(t); return this.contains(t); }
  };
  window.DOMTokenList = DOMTokenList;
  function defGetter(obj, prop, getter) {
    if (Object.defineProperty) Object.defineProperty(obj, prop, { get: getter });
    else obj.__defineGetter__(prop, getter);
  }
  defGetter(HTMLElement.prototype, 'classList', function () { return new DOMTokenList(this); });
})();

// game_manager.js
function GameManager(size, InputManager, Actuator, StorageManager) {
  this.size = size;
  this.inputManager = new InputManager;
  this.storageManager = new StorageManager;
  this.actuator = new Actuator;
  this.startTiles = 2;
  this.inputManager.on("move", this.move.bind(this));
  this.inputManager.on("restart", this.restart.bind(this));
  this.inputManager.on("keepPlaying", this.keepPlaying.bind(this));
  this.setup();
}
GameManager.prototype.restart = function () {
  this.storageManager.clearGameState(); this.actuator.continueGame(); this.setup();
};
GameManager.prototype.keepPlaying = function () {
  this.keepPlaying = true; this.actuator.continueGame();
};
GameManager.prototype.isGameTerminated = function () {
  return this.over || (this.won && !this.keepPlaying);
};
GameManager.prototype.setup = function () {
  var prev = this.storageManager.getGameState();
  if (prev) {
    this.grid = new Grid(prev.grid.size, prev.grid.cells);
    this.score = prev.score; this.over = prev.over; this.won = prev.won; this.keepPlaying = prev.keepPlaying;
  } else {
    this.grid = new Grid(this.size); this.score = 0; this.over = false; this.won = false; this.keepPlaying = false;
    this.addStartTiles();
  }
  this.actuate();
};
GameManager.prototype.addStartTiles = function () { for (var i = 0; i < this.startTiles; i++) this.addRandomTile(); };
GameManager.prototype.addRandomTile = function () {
  if (this.grid.cellsAvailable()) {
    var value = Math.random() < 0.9 ? 2 : 4;
    var tile = new Tile(this.grid.randomAvailableCell(), value);
    this.grid.insertTile(tile);
  }
};
GameManager.prototype.actuate = function () {
  if (this.storageManager.getBestScore() < this.score) this.storageManager.setBestScore(this.score);
  if (this.over) this.storageManager.clearGameState();
  else this.storageManager.setGameState(this.serialize());
  this.actuator.actuate(this.grid, {
    score: this.score, over: this.over, won: this.won,
    bestScore: this.storageManager.getBestScore(),
    terminated: this.isGameTerminated()
  });
};
GameManager.prototype.serialize = function () {
  return { grid: this.grid.serialize(), score: this.score, over: this.over, won: this.won, keepPlaying: this.keepPlaying };
};
GameManager.prototype.prepareTiles = function () {
  this.grid.eachCell(function (x, y, tile) { if (tile) { tile.mergedFrom = null; tile.savePosition(); } });
};
GameManager.prototype.moveTile = function (tile, cell) {
  this.grid.cells[tile.x][tile.y] = null;
  this.grid.cells[cell.x][cell.y] = tile;
  tile.updatePosition(cell);
};
GameManager.prototype.move = function (direction) {
  var self = this;
  if (this.isGameTerminated()) return;
  var cell, tile;
  var vector = this.getVector(direction);
  var traversals = this.buildTraversals(vector);
  var moved = false;
  this.prepareTiles();
  traversals.x.forEach(function (x) {
    traversals.y.forEach(function (y) {
      cell = { x: x, y: y }; tile = self.grid.cellContent(cell);
      if (tile) {
        var positions = self.findFarthestPosition(cell, vector);
        var next = self.grid.cellContent(positions.next);
        if (next && next.value === tile.value && !next.mergedFrom) {
          var merged = new Tile(positions.next, tile.value * 2);
          merged.mergedFrom = [tile, next];
          self.grid.insertTile(merged); self.grid.removeTile(tile);
          tile.updatePosition(positions.next);
          self.score += merged.value;
          if (merged.value === 2048) self.won = true;
        } else { self.moveTile(tile, positions.farthest); }
        if (!self.positionsEqual(cell, tile)) moved = true;
      }
    });
  });
  if (moved) {
    this.addRandomTile();
    if (!this.movesAvailable()) this.over = true;
    this.actuate();
  }
};
GameManager.prototype.getVector = function (direction) {
  var map = { 0:{x:0,y:-1}, 1:{x:1,y:0}, 2:{x:0,y:1}, 3:{x:-1,y:0} };
  return map[direction];
};
GameManager.prototype.buildTraversals = function (vector) {
  var traversals = { x: [], y: [] };
  for (var pos = 0; pos < this.size; pos++) { traversals.x.push(pos); traversals.y.push(pos); }
  if (vector.x === 1) traversals.x = traversals.x.reverse();
  if (vector.y === 1) traversals.y = traversals.y.reverse();
  return traversals;
};
GameManager.prototype.findFarthestPosition = function (cell, vector) {
  var previous;
  do { previous = cell; cell = { x: previous.x + vector.x, y: previous.y + vector.y }; }
  while (this.grid.withinBounds(cell) && this.grid.cellAvailable(cell));
  return { farthest: previous, next: cell };
};
GameManager.prototype.movesAvailable = function () { return this.grid.cellsAvailable() || this.tileMatchesAvailable(); };
GameManager.prototype.tileMatchesAvailable = function () {
  var self = this, tile;
  for (var x = 0; x < this.size; x++) {
    for (var y = 0; y < this.size; y++) {
      tile = this.grid.cellContent({ x: x, y: y });
      if (tile) {
        for (var d = 0; d < 4; d++) {
          var vector = self.getVector(d);
          var cell = { x: x + vector.x, y: y + vector.y };
          var other = self.grid.cellContent(cell);
          if (other && other.value === tile.value) return true;
        }
      }
    }
  }
  return false;
};
GameManager.prototype.positionsEqual = function (a, b) { return a.x === b.x && a.y === b.y; };

// grid.js
function Grid(size, previousState) {
  this.size = size;
  this.cells = previousState ? this.fromState(previousState) : this.empty();
}
Grid.prototype.empty = function () {
  var cells = [];
  for (var x = 0; x < this.size; x++) { var row = cells[x] = []; for (var y = 0; y < this.size; y++) row.push(null); }
  return cells;
};
Grid.prototype.fromState = function (state) {
  var cells = [];
  for (var x = 0; x < this.size; x++) {
    var row = cells[x] = [];
    for (var y = 0; y < this.size; y++) {
      var tile = state[x][y];
      row.push(tile ? new Tile(tile.position, tile.value) : null);
    }
  }
  return cells;
};
Grid.prototype.randomAvailableCell = function () {
  var cells = this.availableCells();
  if (cells.length) return cells[Math.floor(Math.random() * cells.length)];
};
Grid.prototype.availableCells = function () {
  var cells = [];
  this.eachCell(function (x, y, tile) { if (!tile) cells.push({ x: x, y: y }); });
  return cells;
};
Grid.prototype.eachCell = function (cb) {
  for (var x = 0; x < this.size; x++) for (var y = 0; y < this.size; y++) cb(x, y, this.cells[x][y]);
};
Grid.prototype.cellsAvailable = function () { return !!this.availableCells().length; };
Grid.prototype.cellAvailable = function (cell) { return !this.cellOccupied(cell); };
Grid.prototype.cellOccupied = function (cell) { return !!this.cellContent(cell); };
Grid.prototype.cellContent = function (cell) {
  if (this.withinBounds(cell)) return this.cells[cell.x][cell.y]; else return null;
};
Grid.prototype.insertTile = function (tile) { this.cells[tile.x][tile.y] = tile; };
Grid.prototype.removeTile = function (tile) { this.cells[tile.x][tile.y] = null; };
Grid.prototype.withinBounds = function (p) { return p.x >= 0 && p.x < this.size && p.y >= 0 && p.y < this.size; };
Grid.prototype.serialize = function () {
  var state = [];
  for (var x = 0; x < this.size; x++) {
    var row = state[x] = [];
    for (var y = 0; y < this.size; y++) row.push(this.cells[x][y] ? this.cells[x][y].serialize() : null);
  }
  return { size: this.size, cells: state };
};

// tile.js
function Tile(position, value) {
  this.x = position.x; this.y = position.y; this.value = value || 2;
  this.previousPosition = null; this.mergedFrom = null;
}
Tile.prototype.savePosition = function () { this.previousPosition = { x: this.x, y: this.y }; };
Tile.prototype.updatePosition = function (p) { this.x = p.x; this.y = p.y; };
Tile.prototype.serialize = function () { return { position: { x: this.x, y: this.y }, value: this.value }; };

// local_storage_manager.js
window.fakeStorage = {
  _data: {},
  setItem: function (id, val) { return this._data[id] = String(val); },
  getItem: function (id) { return this._data.hasOwnProperty(id) ? this._data[id] : undefined; },
  removeItem: function (id) { return delete this._data[id]; },
  clear: function () { return this._data = {}; }
};
function LocalStorageManager() {
  this.bestScoreKey = "bestScore"; this.gameStateKey = "gameState";
  var supported = this.localStorageSupported();
  this.storage = supported ? window.localStorage : window.fakeStorage;
}
LocalStorageManager.prototype.localStorageSupported = function () {
  var k = "test";
  try { var s = window.localStorage; s.setItem(k, "1"); s.removeItem(k); return true; } catch (e) { return false; }
};
LocalStorageManager.prototype.getBestScore = function () { return this.storage.getItem(this.bestScoreKey) || 0; };
LocalStorageManager.prototype.setBestScore = function (v) { this.storage.setItem(this.bestScoreKey, v); };
LocalStorageManager.prototype.getGameState = function () {
  var j = this.storage.getItem(this.gameStateKey); return j ? JSON.parse(j) : null;
};
LocalStorageManager.prototype.setGameState = function (s) { this.storage.setItem(this.gameStateKey, JSON.stringify(s)); };
LocalStorageManager.prototype.clearGameState = function () { this.storage.removeItem(this.gameStateKey); };

/* ============================================================
   自定义 2048 渲染器（不再用 HTMLActuator 的 class 定位）
   ============================================================ */
function Custom2048Actuator() {
  this.layer = null;
  this.statusText = null;
}
Custom2048Actuator.prototype.bind = function (layer, statusText) {
  this.layer = layer;
  this.statusText = statusText;
};
Custom2048Actuator.prototype.actuate = function (grid, metadata) {
  var self = this;
  if (!self.layer) return;

  // 清理旧方块
  self.layer.innerHTML = '';

  // 计算每个格子的位置与尺寸
  var size = grid.size;
  // layer 的宽高 = 100%（相对 game-2048-wrap），内部 padding 8px（由外层 board 提供）

  var layerRect = self.layer.getBoundingClientRect();
  var W = layerRect.width, H = layerRect.height;
  var gap = 8; // 与 CSS 中 gap 一致
  var cellW = (W - gap * (size - 1)) / size;
  var cellH = (H - gap * (size - 1)) / size;

  grid.cells.forEach(function (column) {
    column.forEach(function (cell) {
      if (cell) self.addTile(cell, cellW, cellH, gap);
    });
  });

  if (metadata.over) {
    self.statusText.textContent = '游戏结束，点击重开';
  } else if (metadata.won && metadata.terminated) {
    self.statusText.textContent = '你赢了！点击重开继续';
  } else {
    self.statusText.textContent = '方向键 / 滑动合并';
  }

Custom2048Actuator.prototype.addTile = function (tile, cellW, cellH, gap) {

  el.style.top = top + 'px';
  el.style.width = cellW + 'px';
  el.style.height = cellH + 'px';

(function () {

  /* ---------- 贪吃蛇 ---------- */
  function initSnake() {
    clearContent();

    wrapper.appendChild(canvas);

    let snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    let direction = {dx:1,dy:0}, nextDirection = {dx:1,dy:0};
    let food = {x:15,y:10};
    let gameOver = false, gameInterval = null;

    function generateFood() {
      for (let i = 0; i < 1000; i++) {
        const fx = Math.floor(Math.random()*gridSize), fy = Math.floor(Math.random()*gridSize);
        if (!snake.some(s=>s.x===fx&&s.y===fy)) { food = {x:fx,y:fy}; return; }
      }

      if (gameInterval) clearInterval(gameInterval);
      snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];

      gameOver = false; statusText.textContent = '方向键 / 滑动屏幕';
      generateFood(); draw();
      gameInterval = setInterval(update, 150);
    }
    function update() {
      if (gameOver) return;
      if ((nextDirection.dx!==0||nextDirection.dy!==0) && (direction.dx!==-nextDirection.dx||direction.dy!==-nextDirection.dy)) {
        direction = {...nextDirection};
      }
      const head = snake[0];
      const newHead = {x:head.x+direction.dx, y:head.y+direction.dy};
      if (newHead.x<0||newHead.x>=gridSize||newHead.y<0||newHead.y>=gridSize) {
        gameOver = true; statusText.textContent = '游戏结束，点击重开';
        if (gameInterval) clearInterval(gameInterval); draw(); return;
      }
      const willEat = newHead.x===food.x && newHead.y===food.y;
      let bodyCheck = [...snake]; if (!willEat) bodyCheck.pop();
      if (bodyCheck.some(s=>s.x===newHead.x&&s.y===newHead.y)) {
        gameOver = true; statusText.textContent = '游戏结束，点击重开';
        if (gameInterval) clearInterval(gameInterval); draw(); return;

      ctx.clearRect(0,0,canvas.width,canvas.height);

        ctx.beginPath(); ctx.moveTo(0,i*cellSize); ctx.lineTo(canvas.width,i*cellSize); ctx.stroke();
      }

      ctx.beginPath(); ctx.arc(food.x*cellSize+cellSize/2, food.y*cellSize+cellSize/2, cellSize*0.35, 0, 2*Math.PI); ctx.fill();
      snake.forEach((seg,idx)=>{

    const keyHandler = (e)=>{
      if (e.key==='ArrowUp') setDirection(0,-1);
      else if (e.key==='ArrowDown') setDirection(0,1);
      else if (e.key==='ArrowLeft') setDirection(-1,0);
      else if (e.key==='ArrowRight') setDirection(1,0);

    const removeKey = addKeyListener(keyHandler);
    let touchStart = null;
    const ts = (e)=>{ e.preventDefault(); const t = e.touches[0]; touchStart = {x:t.clientX,y:t.clientY}; };
    const tm = (e)=>{

    canvas.addEventListener('touchmove', tm, {passive:false});
    canvas.addEventListener('touchend', te, {passive:false});

    currentGame.cleanup = ()=>{

  CanvasRenderingContext2D.prototype.roundRect = function (x,y,w,h,r) {

    this.lineTo(x+w,y+h-r); this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    this.lineTo(x+r,y+h); this.quadraticCurveTo(x,y+h,x,y+h-r);
    this.lineTo(x,y+r); this.quadraticCurveTo(x,y,x+r,y);

  };

  /* ---------- 2048（自定义渲染 + 经典逻辑） ---------- */
  function init2048() {
    clearContent();

    // DOM：外层 wrap > board(背景格) + layer(方块层)
    const wrap = document.createElement('div');
    wrap.className = 'game-2048-wrap';

    const board = document.createElement('div');
    board.className = 'game-2048-board';
    for (let i = 0; i < 16; i++) {
      const bg = document.createElement('div');
      bg.className = 'cell-bg';
      board.appendChild(bg);
    }

    const layer = document.createElement('div');
    layer.className = 'tile-layer';

    wrap.appendChild(board);
    wrap.appendChild(layer);
    gameContent.appendChild(wrap);

    statusText.textContent = '方向键 / 滑动合并';

    // 自定义 Actuator
    const actuator = new Custom2048Actuator();
    actuator.bind(layer, statusText);

    // 使用经典 GameManager，但传入自定义 InputManager（键盘 + 触屏）
    function SimpleInputManager() {
      this.events = {};
      var self = this;

      // 键盘
      document.addEventListener('keydown', function (e) {
        var map = { 38:0, 39:1, 40:2, 37:3, 75:0, 76:1, 74:2, 72:3, 87:0, 68:1, 83:2, 65:3 };
        var mapped = map[e.which];
        if (mapped !== undefined) { e.preventDefault(); self.emit('move', mapped); }
        if (e.which === 82) { e.preventDefault(); self.emit('restart'); }
      });

      // 触屏（绑定到 wrap）
      var startX, startY;
      wrap.addEventListener('touchstart', function (e) {
        if (e.touches.length > 1) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        e.preventDefault();
      }, { passive: false });
      wrap.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
      wrap.addEventListener('touchend', function (e) {
        if (e.touches.length > 0) return;
        var endX = e.changedTouches[0].clientX;
        var endY = e.changedTouches[0].clientY;
        var dx = endX - startX, dy = endY - startY;
        var absDx = Math.abs(dx), absDy = Math.abs(dy);
        if (Math.max(absDx, absDy) > 10) {
          self.emit('move', absDx > absDy ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
        }
        e.preventDefault();
      }, { passive: false });
    }

      if (!this.events[event]) this.events[event] = [];
      this.events[event].push(callback);
    };
    SimpleInputManager.prototype.emit = function (event, data) {
      var cbs = this.events[event];
      if (cbs) cbs.forEach(function (cb) { cb(data); });
    };

    const manager = new GameManager(4, SimpleInputManager, function(){}, LocalStorageManager);
    // 替换 actuator 为我们的自定义渲染器
    manager.actuator = actuator;
    // 重新执行 actuate 以渲染初始方块
    manager.actuate();

    currentGame.restart = function () {
      manager.restart();
      // restart 内部会调用 setup -> actuate -> 我们的 actuator
    };
    currentGame.cleanup = function () {

    };
  }

  /* ---------- 俄罗斯方块 ---------- */
  function initTetris() {
    clearContent();
    statusText.textContent = '方向键移动/旋转，空格硬降';
    const canvas = document.createElement('canvas');
    canvas.width = 300; canvas.height = 600;
    const wrapper = document.createElement('div');
    wrapper.className = 'canvas-wrapper';
    wrapper.style.aspectRatio = '300 / 600';
    wrapper.style.maxWidth = 'min(300px, 50vh)';
    wrapper.appendChild(canvas);
    gameContent.appendChild(wrapper);

    const ctx = canvas.getContext('2d');
    const cols = 10, rows = 20, blockSize = canvas.width / cols;

    let board = Array(rows).fill().map(()=>Array(cols).fill(0));
    let currentPiece = null, gameOver = false, gameInterval = null;
    const shapes = [
      { shape:[[1,1,1,1]], color:'#0891b2' },
      { shape:[[1,1],[1,1]], color:'#f59e0b' },
      { shape:[[0,1,0],[1,1,1]], color:'#8b5cf6' },
      { shape:[[0,1,1],[1,1,0]], color:'#10b981' },
      { shape:[[1,1,0],[0,1,1]], color:'#ef4444' },
      { shape:[[1,0,0],[1,1,1]], color:'#f97316' },
      { shape:[[0,0,1],[1,1,1]], color:'#3b82f6' }
    ];

    function newPiece() {
      const idx = Math.floor(Math.random()*shapes.length);
      const {shape, color} = shapes[idx];
      const piece = { shape: shape.map(r=>[...r]), color, x: Math.floor((cols-shape[0].length)/2), y:0 };
      if (collision(piece)) {
        gameOver = true; statusText.textContent = '游戏结束，点击重开';
        if (gameInterval) clearInterval(gameInterval); return false;
      }
      currentPiece = piece; return true;
    }
    function collision(piece) {
      for (let r=0; r<piece.shape.length; r++) {
        for (let c=0; c<piece.shape[0].length; c++) {
          if (piece.shape[r][c]) {
            const bx = piece.x+c, by = piece.y+r;
            if (bx<0||bx>=cols||by>=rows||by<0) return true;
            if (by>=0 && board[by][bx]) return true;
          }
        }
      }
      return false;
    }
    function mergePiece() {
      for (let r=0; r<currentPiece.shape.length; r++) {
        for (let c=0; c<currentPiece.shape[0].length; c++) {
          if (currentPiece.shape[r][c]) {
            const by = currentPiece.y+r, bx = currentPiece.x+c;
            if (by>=0 && by<rows && bx>=0 && bx<cols) board[by][bx] = currentPiece.color;
          }
        }
      }
      for (let row=rows-1; row>=0; ) {
        if (board[row].every(cell=>cell!==0)) { board.splice(row,1); board.unshift(Array(cols).fill(0)); }
        else row--;
      }
      if (!newPiece()) draw();
    }
    function movePiece(dx,dy) {
      if (!currentPiece||gameOver) return false;
      const moved = {...currentPiece, x:currentPiece.x+dx, y:currentPiece.y+dy};
      if (!collision(moved)) { currentPiece = moved; draw(); return true; }
      else if (dy===1) { mergePiece(); draw(); }
      return false;
    }
    function rotatePiece() {
      if (!currentPiece||gameOver) return;
      const shape = currentPiece.shape;
      const rotated = shape[0].map((_,idx)=>shape.map(row=>row[idx]).reverse());
      const rp = {...currentPiece, shape:rotated};
      if (!collision(rp)) currentPiece = rp;
      else {
        rp.x -= 1; if (!collision(rp)) currentPiece = rp;
        else { rp.x += 2; if (!collision(rp)) currentPiece = rp; }
      }
      draw();
    }
    function hardDrop() {
      if (!currentPiece||gameOver) return;
      while (!collision({...currentPiece, y:currentPiece.y+1})) currentPiece.y++;
      mergePiece(); draw();
    }
    function draw() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#f8fafc'; ctx.fillRect(0,0,canvas.width,canvas.height);
      for (let r=0; r<rows; r++) {
        for (let c=0; c<cols; c++) {
          if (board[r][c]) {
            ctx.fillStyle = board[r][c];
            ctx.beginPath(); ctx.roundRect(c*blockSize+1, r*blockSize+1, blockSize-2, blockSize-2, 4); ctx.fill();
          } else {
            ctx.strokeStyle = '#e9eef3'; ctx.lineWidth = 0.5;
            ctx.strokeRect(c*blockSize, r*blockSize, blockSize, blockSize);
          }
        }
      }
      if (currentPiece) {
        for (let r=0; r<currentPiece.shape.length; r++) {
          for (let c=0; c<currentPiece.shape[0].length; c++) {
            if (currentPiece.shape[r][c]) {
              const x = (currentPiece.x+c)*blockSize, y = (currentPiece.y+r)*blockSize;
              ctx.fillStyle = currentPiece.color;
              ctx.beginPath(); ctx.roundRect(x+1, y+1, blockSize-2, blockSize-2, 4); ctx.fill();
            }
          }
        }
      }
    }
    function update() { if (!gameOver) movePiece(0,1); }
    function reset() {
      if (gameInterval) clearInterval(gameInterval);
      board = Array(rows).fill().map(()=>Array(cols).fill(0));
      gameOver = false; statusText.textContent = '方向键移动/旋转，空格硬降';
      newPiece(); draw(); gameInterval = setInterval(update, 500);
    }
    const keyHandler = (e)=>{
      if (gameOver) return;
      if (e.key==='ArrowLeft') movePiece(-1,0);
      else if (e.key==='ArrowRight') movePiece(1,0);
      else if (e.key==='ArrowDown') movePiece(0,1);
      else if (e.key==='ArrowUp') rotatePiece();
      else if (e.key===' ') { e.preventDefault(); hardDrop(); }
    };
    const removeKey = addKeyListener(keyHandler);

    const ts = (e)=>{ e.preventDefault(); const t = e.touches[0]; touchStart = {x:t.clientX,y:t.clientY}; touchMoved = false; };
    const tm = (e)=>{
      e.preventDefault(); if (!touchStart||gameOver) return;
      const t = e.touches[0]; const dx = t.clientX-touchStart.x, dy = t.clientY-touchStart.y;
      if (Math.abs(dx)<20 && Math.abs(dy)<20) return;
      touchMoved = true;
      if (Math.abs(dx)>Math.abs(dy)) { movePiece(dx>0?1:-1, 0); } else { if (dy>0) movePiece(0,1); else rotatePiece(); }
      touchStart = {x:t.clientX,y:t.clientY};
    };
    const te = (e)=>{ e.preventDefault(); if (touchStart&&!touchMoved&&!gameOver) hardDrop(); touchStart = null; touchMoved = false; };
    canvas.addEventListener('touchstart', ts, {passive:false});
    canvas.addEventListener('touchmove', tm, {passive:false});
    canvas.addEventListener('touchend', te, {passive:false});

    currentGame.restart = reset;
    currentGame.cleanup = ()=>{
      if (gameInterval) clearInterval(gameInterval);
      removeKey();
      canvas.removeEventListener('touchstart', ts);
      canvas.removeEventListener('touchmove', tm);
      canvas.removeEventListener('touchend', te);
    };
    reset();
  }

  /* ---------- 扫雷 ---------- */
  function initMinesweeper() {
    clearContent();
    statusText.textContent = '点击翻开，长按标记';
    const rows = 9, cols = 9, mineCount = 10;
    let board = [], revealed = [], flagged = [], gameOver = false, win = false;

    const gridContainer = document.createElement('div');
    gridContainer.className = 'minesweeper-grid';
    gridContainer.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    gameContent.appendChild(gridContainer);

    function initBoard() {
      board = Array(rows).fill().map(()=>Array(cols).fill(0));
      revealed = Array(rows).fill().map(()=>Array(cols).fill(false));
      flagged = Array(rows).fill().map(()=>Array(cols).fill(false));
      gameOver = false; win = false;
      let placed = 0;
      while (placed < mineCount) {
        const r = Math.floor(Math.random()*rows), c = Math.floor(Math.random()*cols);
        if (board[r][c] !== -1) { board[r][c] = -1; placed++; }
      }
      for (let r=0; r<rows; r++) {
        for (let c=0; c<cols; c++) {
          if (board[r][c]===-1) continue;
          let count = 0;
          for (let dr=-1; dr<=1; dr++) {
            for (let dc=-1; dc<=1; dc++) {
              if (dr===0&&dc===0) continue;
              const nr = r+dr, nc = c+dc;
              if (nr>=0&&nr<rows&&nc>=0&&nc<cols&&board[nr][nc]===-1) count++;
            }
          }
          board[r][c] = count;
        }
      }
    }
    function reveal(r,c) {
      if (r<0||r>=rows||c<0||c>=cols) return;
      if (revealed[r][c]||flagged[r][c]) return;
      revealed[r][c] = true;
      if (board[r][c]===-1) {
        gameOver = true;
        for (let i=0; i<rows; i++) for (let j=0; j<cols; j++) if (board[i][j]===-1) revealed[i][j] = true;
        render(); statusText.textContent = '游戏结束，点击重开'; return;
      }
      if (board[r][c]===0) {
        for (let dr=-1; dr<=1; dr++) for (let dc=-1; dc<=1; dc++) { if (dr===0&&dc===0) continue; reveal(r+dr,c+dc); }
      }
      render(); checkWin();
    }
    function toggleFlag(r,c) {
      if (revealed[r][c]||gameOver) return;
      flagged[r][c] = !flagged[r][c]; render();
    }
    function checkWin() {
      let correctFlags = 0, revealedCount = 0;
      for (let r=0; r<rows; r++) for (let c=0; c<cols; c++) {
        if (revealed[r][c]) revealedCount++;
        if (flagged[r][c] && board[r][c]===-1) correctFlags++;
      }
      if (revealedCount===rows*cols-mineCount && correctFlags===mineCount) {
        win = true; gameOver = true; statusText.textContent = '你赢了！';
      }
    }
    function render() {
      gridContainer.innerHTML = '';
      for (let r=0; r<rows; r++) {
        for (let c=0; c<cols; c++) {
          const cell = document.createElement('div');
          cell.className = 'mine-cell';
          if (revealed[r][c]) {
            cell.classList.add('revealed');
            if (board[r][c]===-1) { cell.classList.add('mine'); cell.textContent = '●'; }
            else if (board[r][c]>0) cell.textContent = board[r][c];
          } else if (flagged[r][c]) { cell.textContent = '⚑'; cell.style.color = '#b91c1c'; }
          cell.addEventListener('click', (e)=>{ e.preventDefault(); if (gameOver) return; reveal(r,c); });
          let timer = null;
          cell.addEventListener('touchstart', (e)=>{ e.preventDefault(); timer = setTimeout(()=>{ toggleFlag(r,c); timer = null; }, 500); }, {passive:false});
          cell.addEventListener('touchend', (e)=>{ e.preventDefault(); if (timer) { clearTimeout(timer); timer = null; } }, {passive:false});
          cell.addEventListener('touchmove', (e)=>{ e.preventDefault(); if (timer) { clearTimeout(timer); timer = null; } }, {passive:false});
          cell.addEventListener('contextmenu', (e)=>{ e.preventDefault(); toggleFlag(r,c); });
          gridContainer.appendChild(cell);
        }
      }
    }
    function reset() { initBoard(); render(); statusText.textContent = '点击翻开，长按标记'; }
    currentGame.restart = reset;
    currentGame.cleanup = ()=>{};
    reset();
  }
})();
</script>
</body>
</html>
