<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节拍叠加器 · 极简</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f7f7f7;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-weight: 400;
            color: #1f1f1f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
            line-height: 1.4;
        }

        .container {
            max-width: 680px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            padding: 2rem 2rem 2.2rem;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.03), 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 450;
            letter-spacing: -0.02em;
            color: #0d0d0d;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.25rem;
        }

        h1 span {
            font-size: 0.75rem;
            font-weight: 400;
            background: #f0f0f0;
            color: #5a5a5a;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            letter-spacing: 0.01em;
        }

        .sub {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 2rem;
            font-weight: 350;
        }

        .upload-area {
            border: 1.5px dashed #d0d0d0;
            border-radius: 18px;
            padding: 2rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease;
            background: #fafafa;
            margin-bottom: 1.5rem;
        }

        .upload-area:hover {
            border-color: #a0a0a0;
            background: #f4f4f4;
        }

        .upload-area input {
            display: none;
        }

        .upload-area label {
            display: block;
            cursor: pointer;
            color: #3a3a3a;
            font-size: 0.95rem;
        }

        .upload-area label strong {
            font-weight: 500;
            color: #1f1f1f;
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-thickness: 1px;
            text-decoration-color: #c0c0c0;
        }

        .upload-area label div {
            font-size: 0.75rem;
            color: #999;
            margin-top: 6px;
            font-weight: 350;
        }

        .file-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 0.6rem 0;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid #ececec;
            font-size: 0.9rem;
            flex-wrap: wrap;
            gap: 8px;
            color: #2a2a2a;
        }

        .file-info .name {
            font-weight: 450;
            color: #0d0d0d;
            word-break: break-word;
            max-width: 65%;
        }

        .file-info .badge {
            font-size: 0.75rem;
            color: #6f6f6f;
            background: #f0f0f0;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-weight: 400;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.9rem;
            border-radius: 40px;
            background: #f0f0f0;
            color: #4b4b4b;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 400;
            transition: all 0.15s;
        }

        .status-badge.active {
            background: #e4f2e9;
            color: #1e6b3b;
        }

        .status-badge.processing {
            background: #f5efdc;
            color: #8a6e2b;
        }

        .status-badge.error {
            background: #f7e6e6;
            color: #a13d3d;
        }

        .beat-section {
            background: #ffffff;
            border: 1px solid #efefef;
            border-radius: 18px;
            padding: 1rem 1.2rem 0.8rem;
            margin-bottom: 1.8rem;
        }

        .beat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .beat-header h2 {
            font-size: 1rem;
            font-weight: 450;
            color: #2a2a2a;
            letter-spacing: -0.01em;
        }

        .beat-count {
            font-size: 0.8rem;
            background: #f0f0f0;
            padding: 0.15rem 0.9rem;
            border-radius: 40px;
            color: #4a4a4a;
            font-weight: 400;
        }

        .beat-list {
            max-height: 140px;
            overflow-y: auto;
            background: transparent;
            padding: 0.2rem 0 0.2rem 0;
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem 0.6rem;
            font-size: 0.8rem;
            font-family: 'SF Mono', 'Fira Code', monospace;
        }

        .beat-list::-webkit-scrollbar {
            width: 4px;
        }

        .beat-list::-webkit-scrollbar-thumb {
            background: #d0d0d0;
            border-radius: 10px;
        }

        .beat-item {
            background: #f7f7f7;
            padding: 0.15rem 0.7rem;
            border-radius: 16px;
            font-size: 0.75rem;
            color: #2c2c2c;
            white-space: nowrap;
            border: 1px solid #ebebeb;
            font-weight: 400;
        }

        .no-beats {
            color: #b0b0b0;
            font-style: normal;
            font-size: 0.85rem;
            font-weight: 350;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        button {
            background: #ffffff;
            border: 1px solid #dddddd;
            padding: 0.75rem 1.5rem;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 450;
            color: #2a2a2a;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            cursor: pointer;
            transition: 0.15s ease;
            flex: 1 0 auto;
            box-shadow: none;
            letter-spacing: -0.01em;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
            background: #fafafa;
            border-color: #e8e8e8;
        }

        button.primary {
            background: #1f1f1f;
            border-color: #1f1f1f;
            color: #ffffff;
        }

        button.primary:hover:not(:disabled) {
            background: #000000;
            border-color: #000000;
        }

        button.success {
            background: #ffffff;
            border-color: #c0c0c0;
            color: #1f1f1f;
        }

        button.success:hover:not(:disabled) {
            background: #f5f5f5;
            border-color: #a0a0a0;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        .status-text {
            font-size: 0.85rem;
            color: #767676;
            margin-top: 1.5rem;
            min-height: 1.6rem;
            font-weight: 350;
            letter-spacing: 0.01em;
        }

        .footer-note {
            font-size: 0.7rem;
            color: #bbbbbb;
            margin-top: 2rem;
            text-align: center;
            font-weight: 350;
            border-top: 1px solid #f0f0f0;
            padding-top: 1rem;
        }

        @media (max-width: 500px) {
            .container {
                padding: 1.5rem;
                border-radius: 24px;
            }

            h1 {
                font-size: 1.6rem;
            }

            .actions button {
                padding: 0.7rem 1rem;
                font-size: 0.85rem;
            }

            .file-info .name {
                max-width: 100%;
            }

            .file-info {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>节拍叠加器 <span>内置音效</span></h1>
        <div class="sub">上传音频 · 自动检测节拍 · 叠加音效 · 播放/导出</div>

        <div class="upload-area" id="dropArea">
            <input type="file" id="audioFileInput" accept="audio/*">
            <label for="audioFileInput">
                <strong>点击上传</strong> 或拖拽音频文件
                <div>支持 MP3, WAV, M4A, AAC 等</div>
            </label>
        </div>

        <div class="file-info">
            <span class="name" id="fileNameDisplay">未选择文件</span>
            <span class="badge" id="fileMeta">—</span>
            <span class="status-badge" id="analysisStatus">等待上传</span>
        </div>

        <div class="beat-section">
            <div class="beat-header">
                <h2>检测到的节拍</h2>
                <span class="beat-count" id="beatCount">0</span>
            </div>
            <div class="beat-list" id="beatList">
                <span class="no-beats">暂无节拍数据</span>
            </div>
        </div>

        <div class="actions">
            <button id="playBtn" class="primary" disabled>播放混合音频</button>
            <button id="exportWavBtn" class="success" disabled>导出 WAV</button>
            <button id="exportMp3Btn" disabled style="background:#fafafa;">导出 MP3 (模拟)</button>
        </div>

        <div class="status-text" id="statusMessage">就绪，请上传音频文件。</div>
        <div class="footer-note">* 节拍检测基于能量峰值 · 内置音效为 Base64 编码的 MP3 片段</div>
    </div>

            // ============================================================
            // Base64 -> Blob 解码
            // ============================================================
            function base64ToBlob(base64, mime = 'audio/mpeg') {
                const cleaned = base64.replace(/\s/g, '');
                try {
                    const binary = atob(cleaned);
                    const len = binary.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) {
                        bytes[i] = binary.charCodeAt(i);
                    }
                    return new Blob([bytes], { type: mime });
                } catch (e) {
                    console.error('Base64 解码失败:', e, '长度:', cleaned.length);
                    throw new Error('内置音效 Base64 解码失败: ' + e.message);
                }
            }

            let builtinAudioBlob = null;
            try {
                builtinAudioBlob = base64ToBlob(BUILTIN_BASE64, 'audio/mpeg');
                console.log('内置音效 Blob 已生成, 大小:', builtinAudioBlob.size, 'bytes');
            } catch (e) {
                console.error('内置音效 Blob 生成失败:', e);
                builtinAudioBlob = null;
            }

            function createFallbackClickBuffer(ctx) {
                const sampleRate = ctx.sampleRate;
                const duration = 0.06;
                const length = Math.floor(sampleRate * duration);
                const buffer = ctx.createBuffer(1, length, sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < length; i++) {
                    const t = i / sampleRate;
                    const env = Math.exp(-t / 0.02);
                    data[i] = Math.sin(2 * Math.PI * 1500 * t) * env * 0.8;
                }
                return buffer;
            }

            const fileInput = document.getElementById('audioFileInput');
            const dropArea = document.getElementById('dropArea');
            const fileNameDisplay = document.getElementById('fileNameDisplay');
            const fileMeta = document.getElementById('fileMeta');
            const analysisStatus = document.getElementById('analysisStatus');
            const beatCountSpan = document.getElementById('beatCount');
            const beatListDiv = document.getElementById('beatList');
            const playBtn = document.getElementById('playBtn');
            const exportWavBtn = document.getElementById('exportWavBtn');
            const exportMp3Btn = document.getElementById('exportMp3Btn');
            const statusMessage = document.getElementById('statusMessage');

            let audioContext = null;
            let originalAudioBuffer = null;
            let mixedAudioBuffer = null;
            let beatTimes = [];
            let builtinAudioBuffer = null;
            let usingFallback = false;
            let currentSource = null;
            let isPlaying = false;

            function getAudioContext() {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                return audioContext;
            }

            function setStatus(text, type = 'info') {
                statusMessage.textContent = text;
                if (type === 'processing') {
                    analysisStatus.textContent = '处理中...';
                    analysisStatus.className = 'status-badge processing';
                } else if (type === 'ready') {
                    analysisStatus.textContent = '就绪';
                    analysisStatus.className = 'status-badge active';
                } else if (type === 'error') {
                    analysisStatus.textContent = '错误';
                    analysisStatus.className = 'status-badge error';
                } else {
                    analysisStatus.textContent = '等待上传';
                    analysisStatus.className = 'status-badge';
                }
            }

            function resetForNewFile() {
                if (currentSource) {
                    try { currentSource.stop(); } catch (e) {}
                    currentSource = null;
                }
                isPlaying = false;
                originalAudioBuffer = null;
                mixedAudioBuffer = null;
                beatTimes = [];
                playBtn.disabled = true;
                exportWavBtn.disabled = true;
                exportMp3Btn.disabled = true;
                playBtn.textContent = '播放混合音频';
                beatCountSpan.textContent = '0';
                beatListDiv.innerHTML = '<span class="no-beats">暂无节拍数据</span>';
            }

            async function ensureBuiltinBuffer() {
                if (builtinAudioBuffer) return builtinAudioBuffer;
                const ctx = getAudioContext();
                if (builtinAudioBlob && !usingFallback) {
                    try {
                        const arrayBuffer = await builtinAudioBlob.arrayBuffer();
                        builtinAudioBuffer = await ctx.decodeAudioData(arrayBuffer);
                        console.log('内置 MP3 音效解码成功, 时长:', builtinAudioBuffer.duration.toFixed(3), '秒');
                        return builtinAudioBuffer;
                    } catch (e) {
                        console.warn('内置 MP3 解码失败，降级为程序化音效:', e);
                        usingFallback = true;
                    }
                }
                builtinAudioBuffer = createFallbackClickBuffer(ctx);
                console.log('已使用程序化降级音效, 时长:', builtinAudioBuffer.duration.toFixed(3), '秒');
                return builtinAudioBuffer;
            }

            function detectBeats(audioBuffer, threshold = 1.4, minInterval = 0.18) {
                const data = audioBuffer.getChannelData(0);
                const sampleRate = audioBuffer.sampleRate;
                const len = data.length;
                const windowSize = Math.floor(sampleRate * 0.01);
                const hopSize = Math.floor(windowSize / 2);
                const energy = [];

                for (let i = 0; i < len - windowSize; i += hopSize) {
                    let sum = 0;
                    for (let j = 0; j < windowSize; j++) {
                        const val = data[i + j];
                        sum += val * val;
                    }
                    energy.push(sum / windowSize);
                }
                if (energy.length === 0) return [];

                const windowAvgSize = 20;
                const peaks = [];
                for (let i = 0; i < energy.length; i++) {
                    let sum = 0, count = 0;
                    for (let k = Math.max(0, i - windowAvgSize); k <= Math.min(energy.length - 1, i + windowAvgSize); k++) {
                        sum += energy[k];
                        count++;
                    }
                    const avg = sum / count;
                    const localThreshold = avg * threshold;
                    if (energy[i] > localThreshold) {
                        const prev = i > 0 ? energy[i - 1] : 0;
                        const next = i < energy.length - 1 ? energy[i + 1] : 0;
                        if (energy[i] > prev && energy[i] > next) {
                            const time = (i * hopSize) / sampleRate;
                            if (peaks.length === 0 || time - peaks[peaks.length - 1] >= minInterval) {
                                peaks.push(time);
                            }
                        }
                    }
                }
                return peaks;
            }

            function mixBeatsIntoAudio(originalBuffer, beatTimes, builtinBuffer) {
                const ctx = getAudioContext();
                const sampleRate = originalBuffer.sampleRate;
                const numChannels = originalBuffer.numberOfChannels;
                const length = originalBuffer.length;

                const mixedBuffer = ctx.createBuffer(numChannels, length, sampleRate);
                for (let ch = 0; ch < numChannels; ch++) {
                    mixedBuffer.getChannelData(ch).set(originalBuffer.getChannelData(ch));
                }

                if (!builtinBuffer || beatTimes.length === 0) {
                    return mixedBuffer;
                }

                const builtinLength = builtinBuffer.length;
                const builtinData = builtinBuffer.getChannelData(0);
                const gain = 0.85;

                for (const beatTime of beatTimes) {
                    const startSample = Math.floor(beatTime * sampleRate);
                    const copyLength = Math.min(builtinLength, length - startSample);
                    if (copyLength <= 0) continue;

                    for (let ch = 0; ch < numChannels; ch++) {
                        const mixedData = mixedBuffer.getChannelData(ch);
                        for (let i = 0; i < copyLength; i++) {
                            mixedData[startSample + i] += builtinData[i] * gain;
                        }
                    }
                }

                for (let ch = 0; ch < numChannels; ch++) {
                    const data = mixedBuffer.getChannelData(ch);
                    for (let i = 0; i < data.length; i++) {
                        if (data[i] > 1) data[i] = 1;
                        else if (data[i] < -1) data[i] = -1;
                    }
                }

                return mixedBuffer;
            }

            async function handleAudioFile(file) {
                resetForNewFile();
                if (!file) {
                    setStatus('未选择文件', 'info');
                    return;
                }

                fileNameDisplay.textContent = file.name;
                const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
                fileMeta.textContent = `${sizeMB} MB`;

                const ctx = getAudioContext();
                if (ctx.state === 'suspended') {
                    await ctx.resume();
                }

                try {
                    setStatus('正在解码音频...', 'processing');
                    const arrayBuffer = await file.arrayBuffer();
                    const decodedBuffer = await ctx.decodeAudioData(arrayBuffer);
                    originalAudioBuffer = decodedBuffer;
                    console.log('上传音频解码成功, 时长:', decodedBuffer.duration.toFixed(2), '秒');

                    setStatus('正在检测节拍...', 'processing');
                    beatTimes = detectBeats(decodedBuffer, 1.4, 0.18);
                    console.log('节拍检测完成, 数量:', beatTimes.length);

                    beatCountSpan.textContent = beatTimes.length;
                    if (beatTimes.length === 0) {
                        beatListDiv.innerHTML = '<span class="no-beats">未检测到明显节拍</span>';
                    } else {
                        beatListDiv.innerHTML = beatTimes.map((t, idx) =>
                            `<span class="beat-item">${idx + 1}: ${t.toFixed(3)}s</span>`
                        ).join('');
                    }

                    setStatus('准备内置音效...', 'processing');
                    await ensureBuiltinBuffer();

                    setStatus('正在混合节拍音效...', 'processing');
                    mixedAudioBuffer = mixBeatsIntoAudio(decodedBuffer, beatTimes, builtinAudioBuffer);

                    playBtn.disabled = false;
                    exportWavBtn.disabled = false;
                    exportMp3Btn.disabled = false;

                    const fallbackNote = usingFallback ? '（降级音效）' : '';
                    setStatus(`完成！检测到 ${beatTimes.length} 个节拍${fallbackNote}，可播放或导出。`, 'ready');
                } catch (err) {
                    console.error('处理失败:', err);
                    setStatus(`处理失败: ${err.message}`, 'error');
                    originalAudioBuffer = null;
                    mixedAudioBuffer = null;
                    beatTimes = [];
                    playBtn.disabled = true;
                    exportWavBtn.disabled = true;
                    exportMp3Btn.disabled = true;
                    beatCountSpan.textContent = '0';
                    beatListDiv.innerHTML = '<span class="no-beats">处理失败</span>';
                }
            }

            function playMixedAudio() {
                if (!mixedAudioBuffer) {
                    setStatus('没有可播放的混合音频', 'error');
                    return;
                }
                const ctx = getAudioContext();
                if (ctx.state === 'suspended') ctx.resume();

                if (currentSource) {
                    try { currentSource.stop(); } catch (e) {}
                    currentSource = null;
                }

                const source = ctx.createBufferSource();
                source.buffer = mixedAudioBuffer;
                source.connect(ctx.destination);
                source.start(0);
                currentSource = source;
                isPlaying = true;
                playBtn.textContent = '停止播放';
                setStatus('正在播放混合音频（包含叠加节拍音效）', 'ready');

                source.onended = () => {
                    if (currentSource === source) {
                        currentSource = null;
                        isPlaying = false;
                        playBtn.textContent = '播放混合音频';
                    }
                };
            }

            function audioBufferToWav(buffer) {
                const numChannels = buffer.numberOfChannels;
                const sampleRate = buffer.sampleRate;
                const format = 1;
                const bitDepth = 16;
                const bytesPerSample = bitDepth / 8;
                const blockAlign = numChannels * bytesPerSample;
                const length = buffer.length;
                const dataSize = length * blockAlign;
                const headerSize = 44;
                const totalSize = headerSize + dataSize;

                const arrayBuffer = new ArrayBuffer(totalSize);
                const view = new DataView(arrayBuffer);

                function writeString(view, offset, string) {
                    for (let i = 0; i < string.length; i++) {
                        view.setUint8(offset + i, string.charCodeAt(i));
                    }
                }

                writeString(view, 0, 'RIFF');
                view.setUint32(4, totalSize - 8, true);
                writeString(view, 8, 'WAVE');
                writeString(view, 12, 'fmt ');
                view.setUint32(16, 16, true);
                view.setUint16(20, format, true);
                view.setUint16(22, numChannels, true);
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * blockAlign, true);
                view.setUint16(32, blockAlign, true);
                view.setUint16(34, bitDepth, true);
                writeString(view, 36, 'data');
                view.setUint32(40, dataSize, true);

                const channels = [];
                for (let i = 0; i < numChannels; i++) {
                    channels.push(buffer.getChannelData(i));
                }

                let offset = 44;
                for (let i = 0; i < length; i++) {
                    for (let ch = 0; ch < numChannels; ch++) {
                        let sample = channels[ch][i];
                        sample = Math.max(-1, Math.min(1, sample));
                        const intSample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                        view.setInt16(offset, intSample, true);
                        offset += 2;
                    }
                }

                return new Blob([arrayBuffer], { type: 'audio/wav' });
            }

            function exportWav() {
                if (!mixedAudioBuffer) {
                    setStatus('没有可导出的音频', 'error');
                    return;
                }
                try {
                    const wavBlob = audioBufferToWav(mixedAudioBuffer);
                    const url = URL.createObjectURL(wavBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `mixed_with_beats_${Date.now()}.wav`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    setStatus('WAV 文件已开始下载', 'ready');
                } catch (e) {
                    console.error(e);
                    setStatus(`导出失败: ${e.message}`, 'error');
                }
            }

            function exportMp3Mock() {
                if (!mixedAudioBuffer) {
                    setStatus('没有可导出的音频', 'error');
                    return;
                }
                const msg = `本应导出 MP3 文件（混合音频，时长 ${mixedAudioBuffer.duration.toFixed(2)} 秒，包含 ${beatTimes.length} 个节拍音效）。\n` +
                            `因浏览器无内置 MP3 编码器，此文件为占位说明。\n` +
                            `请使用 WAV 导出获得实际音频。\n` +
                            `生成时间: ${new Date().toLocaleString()}`;
                const blob = new Blob([msg], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `mixed_placeholder_${Date.now()}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                setStatus('模拟 MP3 导出：已生成说明文件（浏览器无 MP3 编码器）', 'ready');
            }

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) handleAudioFile(file);
            });

            dropArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropArea.style.borderColor = '#a0a0a0';
            });
            dropArea.addEventListener('dragleave', () => {
                dropArea.style.borderColor = '#d0d0d0';
            });
            dropArea.addEventListener('drop', (e) => {
                e.preventDefault();
                dropArea.style.borderColor = '#d0d0d0';
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('audio/')) {
                    fileInput.files = e.dataTransfer.files;
                    handleAudioFile(file);
                } else {
                    setStatus('请拖拽音频文件', 'error');
                }
            });

            playBtn.addEventListener('click', () => {
                if (isPlaying) {
                    if (currentSource) {
                        try { currentSource.stop(); } catch (e) {}
                        currentSource = null;
                    }
                    isPlaying = false;
                    playBtn.textContent = '播放混合音频';
                    setStatus('播放已停止', 'ready');
                } else {
                    playMixedAudio();
                }
            });

            exportWavBtn.addEventListener('click', exportWav);
            exportMp3Btn.addEventListener('click', exportMp3Mock);

            window.addEventListener('load', () => {
                if (builtinAudioBlob) {
                    console.log('内置音效 Blob 已就绪，等待用户上传音频后解码。');
                } else {
                    console.warn('内置音效 Blob 未就绪，将使用程序化降级音效。');
                }
            });

            window.addEventListener('beforeunload', () => {
                if (audioContext) audioContext.close();
            });

        })();
    </script>
</body>
