<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节拍叠加器 · 可编辑节拍</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f7f7f7;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-weight: 400;
            color: #1f1f1f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
            line-height: 1.4;
        }

        .container {
            max-width: 720px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            padding: 2rem 2rem 2.2rem;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.03), 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 450;
            letter-spacing: -0.02em;
            color: #0d0d0d;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.25rem;
        }

        h1 span {
            font-size: 0.75rem;
            font-weight: 400;
            background: #f0f0f0;
            color: #5a5a5a;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            letter-spacing: 0.01em;
        }

        .sub {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 2rem;
            font-weight: 350;
        }

        .upload-area {
            border: 1.5px dashed #d0d0d0;
            border-radius: 18px;
            padding: 1.8rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease;
            background: #fafafa;
            margin-bottom: 1.2rem;
        }

        .upload-area:hover {
            border-color: #a0a0a0;
            background: #f4f4f4;
        }

        .upload-area input {
            display: none;
        }

        .upload-area label {
            display: block;
            cursor: pointer;
            color: #3a3a3a;
            font-size: 0.95rem;
        }

        .upload-area label strong {
            font-weight: 500;
            color: #1f1f1f;
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-thickness: 1px;
            text-decoration-color: #c0c0c0;
        }

        .upload-area label div {
            font-size: 0.75rem;
            color: #999;
            margin-top: 6px;
            font-weight: 350;
        }

        .file-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 0.6rem 0;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid #ececec;
            font-size: 0.9rem;
            flex-wrap: wrap;
            gap: 8px;
            color: #2a2a2a;
        }

        .file-info .name {
            font-weight: 450;
            color: #0d0d0d;
            word-break: break-word;
            max-width: 60%;
        }

        .file-info .badge {
            font-size: 0.75rem;
            color: #6f6f6f;
            background: #f0f0f0;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-weight: 400;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.9rem;
            border-radius: 40px;
            background: #f0f0f0;
            color: #4b4b4b;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 400;
            transition: all 0.15s;
        }

        .status-badge.active { background: #e4f2e9; color: #1e6b3b; }
        .status-badge.processing { background: #f5efdc; color: #8a6e2b; }
        .status-badge.error { background: #f7e6e6; color: #a13d3d; }

        /* ===== 设置面板 ===== */
        .settings-panel {
            background: #fafafa;
            border-radius: 18px;
            padding: 1.2rem 1.3rem 1.1rem;
            margin-bottom: 1.5rem;
            border: 1px solid #f0f0f0;
        }

        .settings-panel h3 {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2a2a2a;
            letter-spacing: -0.01em;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .setting-row {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 0.9rem;
            flex-wrap: wrap;
        }

        .setting-row label {
            font-size: 0.8rem;
            color: #4a4a4a;
            min-width: 85px;
            font-weight: 400;
        }

        .setting-row input[type="range"] {
            flex: 1;
            min-width: 130px;
            height: 4px;
            -webkit-appearance: none;
            background: #e0e0e0;
            border-radius: 4px;
            outline: none;
        }

        .setting-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #1f1f1f;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.1s;
            border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        .setting-row input[type="range"]::-webkit-slider-thumb:hover {
            background: #000;
        }

        .setting-row .value-badge {
            font-size: 0.75rem;
            background: #ffffff;
            padding: 0.15rem 0.7rem;
            border-radius: 30px;
            border: 1px solid #e8e8e8;
            color: #2a2a2a;
            min-width: 62px;
            text-align: center;
            font-weight: 400;
        }

        .tone-options {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.2rem;
            margin-bottom: 0.5rem;
        }

        .tone-btn {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            padding: 0.35rem 1rem;
            border-radius: 40px;
            font-size: 0.78rem;
            color: #3a3a3a;
            cursor: pointer;
            transition: 0.1s ease;
            font-weight: 400;
        }

        .tone-btn.active {
            background: #1f1f1f;
            border-color: #1f1f1f;
            color: #ffffff;
        }

        .tone-btn:hover:not(.active) {
            background: #f0f0f0;
            border-color: #c0c0c0;
        }

        /* ===== 节拍编辑区 ===== */
        .beat-section {
            background: #ffffff;
            border: 1px solid #efefef;
            border-radius: 18px;
            padding: 1rem 1.2rem 1rem;
            margin-bottom: 1.5rem;
        }

        .beat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
            gap: 8px;
        }

        .beat-header h2 {
            font-size: 1rem;
            font-weight: 450;
            color: #2a2a2a;
            letter-spacing: -0.01em;
        }

        .beat-header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .beat-count {
            font-size: 0.8rem;
            background: #f0f0f0;
            padding: 0.15rem 0.9rem;
            border-radius: 40px;
            color: #4a4a4a;
            font-weight: 400;
        }

        .mini-btn {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            padding: 0.25rem 0.8rem;
            border-radius: 30px;
            font-size: 0.72rem;
            color: #3a3a3a;
            cursor: pointer;
            transition: 0.1s;
            font-weight: 400;
        }

        .mini-btn:hover {
            background: #f0f0f0;
            border-color: #c0c0c0;
        }

        .beat-list {
            max-height: 200px;
            overflow-y: auto;
            background: transparent;
            padding: 0.2rem 0 0.2rem 0;
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem 0.55rem;
            font-size: 0.8rem;
            font-family: 'SF Mono', 'Fira Code', monospace;
        }

        .beat-list::-webkit-scrollbar {
            width: 4px;
        }

        .beat-list::-webkit-scrollbar-thumb {
            background: #d0d0d0;
            border-radius: 10px;
        }

        .beat-item {
            background: #f7f7f7;
            padding: 0.2rem 0.5rem 0.2rem 0.75rem;
            border-radius: 16px;
            font-size: 0.75rem;
            color: #2c2c2c;
            white-space: nowrap;
            border: 1px solid #ebebeb;
            font-weight: 400;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: 0.1s;
        }

        .beat-item .beat-time {
            font-weight: 450;
            color: #0d0d0d;
        }

        .beat-item .beat-remove {
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 1rem;
            line-height: 1;
            padding: 0 2px;
            border-radius: 50%;
            transition: 0.1s;
        }

        .beat-item .beat-remove:hover {
            color: #d44;
            background: #f0f0f0;
        }

        .no-beats {
            color: #b0b0b0;
            font-style: normal;
            font-size: 0.85rem;
            font-weight: 350;
        }

        .add-beat-row {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }

        .add-beat-row input {
            width: 90px;
            padding: 0.4rem 0.7rem;
            border: 1px solid #e0e0e0;
            border-radius: 30px;
            font-size: 0.8rem;
            font-family: 'SF Mono', monospace;
            outline: none;
            transition: 0.1s;
            background: #fff;
            color: #1f1f1f;
        }

        .add-beat-row input:focus {
            border-color: #a0a0a0;
            box-shadow: 0 0 0 2px rgba(0,0,0,0.04);
        }

        .add-beat-row .small-btn {
            background: #ffffff;
            border: 1px solid #dddddd;
            padding: 0.4rem 1.1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 450;
            color: #2a2a2a;
            cursor: pointer;
            transition: 0.1s;
            letter-spacing: -0.01em;
        }

        .add-beat-row .small-btn:hover:not(:disabled) {
            background: #f5f5f5;
            border-color: #a0a0a0;
        }

        .add-beat-row .small-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ===== 操作按钮 ===== */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        button {
            background: #ffffff;
            border: 1px solid #dddddd;
            padding: 0.75rem 1.5rem;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 450;
            color: #2a2a2a;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            cursor: pointer;
            transition: 0.15s ease;
            flex: 1 0 auto;
            box-shadow: none;
            letter-spacing: -0.01em;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
            background: #fafafa;
            border-color: #e8e8e8;
        }

        button.primary {
            background: #1f1f1f;
            border-color: #1f1f1f;
            color: #ffffff;
        }

        button.primary:hover:not(:disabled) {
            background: #000000;
            border-color: #000000;
        }

        button.success {
            background: #ffffff;
            border-color: #c0c0c0;
            color: #1f1f1f;
        }

        button.success:hover:not(:disabled) {
            background: #f5f5f5;
            border-color: #a0a0a0;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        .status-text {
            font-size: 0.85rem;
            color: #767676;
            margin-top: 1.5rem;
            min-height: 1.6rem;
            font-weight: 350;
            letter-spacing: 0.01em;
        }

        .footer-note {
            font-size: 0.7rem;
            color: #bbbbbb;
            margin-top: 2rem;
            text-align: center;
            font-weight: 350;
            border-top: 1px solid #f0f0f0;
            padding-top: 1rem;
        }

        @media (max-width: 520px) {
            .container { padding: 1.5rem; border-radius: 24px; }
            h1 { font-size: 1.6rem; }
            .actions button { padding: 0.7rem 1rem; font-size: 0.85rem; }
            .file-info .name { max-width: 100%; }
            .file-info { flex-direction: column; align-items: flex-start; }
            .setting-row label { min-width: 70px; }
            .beat-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>节拍叠加器 <span>可编辑 · 双音量</span></h1>
        <div class="sub">上传音频 · 检测/编辑节拍 · 调整音调音量 · 播放/导出</div>

        <div class="upload-area" id="dropArea">
            <input type="file" id="audioFileInput" accept="audio/*">
            <label for="audioFileInput">
                <strong>点击上传</strong> 或拖拽音频文件
                <div>支持 MP3, WAV, M4A, AAC 等</div>
            </label>
        </div>

        <div class="file-info">
            <span class="name" id="fileNameDisplay">未选择文件</span>
            <span class="badge" id="fileMeta">—</span>
            <span class="status-badge" id="analysisStatus">等待上传</span>
        </div>

        <!-- ===== 设置面板 ===== -->
        <div class="settings-panel">
            <h3>🎛️ 音效设置</h3>

            <div class="setting-row">
                <label>原曲音量</label>
                <input type="range" id="originalVolume" min="0" max="200" value="100" step="1">
                <span class="value-badge" id="originalVolumeVal">100%</span>
            </div>

            <div class="setting-row">
                <label>节拍音量</label>
                <input type="range" id="beatVolume" min="0" max="300" value="85" step="1">
                <span class="value-badge" id="beatVolumeVal">85%</span>
            </div>

            <div class="setting-row">
                <label>节拍音调</label>
                <div class="tone-options" id="toneOptions">
                    <button class="tone-btn" data-pitch="0.5">低沉</button>
                    <button class="tone-btn active" data-pitch="1.0">标准</button>
                    <button class="tone-btn" data-pitch="1.5">明亮</button>
                    <button class="tone-btn" data-pitch="2.0">高亢</button>
                </div>
            </div>

            <div class="setting-row">
                <label>检测灵敏度</label>
                <input type="range" id="sensitivity" min="1.0" max="2.5" value="1.4" step="0.05">
                <span class="value-badge" id="sensitivityVal">1.40</span>
            </div>
        </div>

        <!-- ===== 节拍编辑区 ===== -->
        <div class="beat-section">
            <div class="beat-header">
                <h2>检测到的节拍 <span class="beat-count" id="beatCount">0</span></h2>
                <div class="beat-header-actions">
                    <button class="mini-btn" id="redetectBtn" disabled>重新检测</button>
                    <button class="mini-btn" id="clearBeatsBtn" disabled>清空</button>
                </div>
            </div>
            <div class="beat-list" id="beatList">
                <span class="no-beats">暂无节拍数据</span>
            </div>
            <div class="add-beat-row">
                <input type="number" id="newBeatTime" placeholder="时间 (秒)" step="0.001" min="0">
                <button class="small-btn" id="addBeatBtn" disabled>+ 添加节拍</button>
            </div>
        </div>

        <!-- ===== 操作按钮 ===== -->
        <div class="actions">
            <button id="playBtn" class="primary" disabled>播放混合音频</button>
            <button id="exportWavBtn" class="success" disabled>导出 WAV</button>
            <button id="exportMp3Btn" disabled style="background:#fafafa;">导出 MP3 (模拟)</button>
        </div>

        <div class="status-text" id="statusMessage">就绪，请上传音频文件。</div>
        <div class="footer-note">* 节拍检测基于能量峰值 · 可手动添加/删除节拍 · 音调与音量实时生效</div>
    </div>

            // ============================================================
            // Base64 -> Blob 解码
            // ============================================================
            function base64ToBlob(base64, mime = 'audio/mpeg') {
                const cleaned = base64.replace(/\s/g, '');
                try {
                    const binary = atob(cleaned);
                    const len = binary.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) {
                        bytes[i] = binary.charCodeAt(i);
                    }
                    return new Blob([bytes], { type: mime });
                } catch (e) {
                    console.error('Base64 解码失败:', e, '长度:', cleaned.length);
                    throw new Error('内置音效 Base64 解码失败: ' + e.message);
                }
            }

            let builtinAudioBlob = null;
            try {
                builtinAudioBlob = base64ToBlob(BUILTIN_BASE64, 'audio/mpeg');
                console.log('内置音效 Blob 已生成, 大小:', builtinAudioBlob.size, 'bytes');
            } catch (e) {
                console.error('内置音效 Blob 生成失败:', e);
                builtinAudioBlob = null;
            }

            function createFallbackClickBuffer(ctx, pitch = 1.0) {
                const sampleRate = ctx.sampleRate;
                const duration = 0.06;
                const length = Math.floor(sampleRate * duration);
                const buffer = ctx.createBuffer(1, length, sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < length; i++) {
                    const t = i / sampleRate;
                    const env = Math.exp(-t / 0.02);
                    // 基础频率 1500Hz，根据 pitch 调整
                    const freq = 1500 * pitch;
                    data[i] = Math.sin(2 * Math.PI * freq * t) * env * 0.8;
                }
                return buffer;
            }

            // 获取指定音调的节拍 buffer
            async function getBuiltinBufferForPitch(pitch) {
                const ctx = getAudioContext();
                // 如果缓存中有，直接返回
                if (pitchBufferCache.has(pitch)) {
                    return pitchBufferCache.get(pitch);
                }

                // 如果使用降级音效，直接生成对应音调的 buffer
                if (usingFallback || !builtinAudioBlob) {
                    const fallback = createFallbackClickBuffer(ctx, pitch);
                    pitchBufferCache.set(pitch, fallback);
                    return fallback;
                }

                // 否则用内置 MP3，通过 playbackRate 改变音调
                // 注意：decodeAudioData 已经缓存在 builtinAudioBuffer，我们用 playbackRate 来变调
                if (!builtinAudioBuffer) {
                    try {
                        const arrayBuffer = await builtinAudioBlob.arrayBuffer();
                        builtinAudioBuffer = await ctx.decodeAudioData(arrayBuffer);
                        console.log('内置 MP3 音效解码成功, 时长:', builtinAudioBuffer.duration.toFixed(3), '秒');
                    } catch (e) {
                        console.warn('内置 MP3 解码失败，降级为程序化音效:', e);
                        usingFallback = true;
                        const fallback = createFallbackClickBuffer(ctx, pitch);
                        pitchBufferCache.set(pitch, fallback);
                        return fallback;
                    }
                }

                // 返回原始 buffer，播放时通过 playbackRate 变调
                // 为了统一，我们返回原始 buffer，并在混音时根据 playbackRate 处理
                // 但混音逻辑需要知道 playbackRate，所以这里我们直接返回原始 buffer，由混音函数处理
                pitchBufferCache.set(pitch, builtinAudioBuffer);
                return builtinAudioBuffer;
            }

            // 重新混合音频（当节拍、音量、音调变化时调用）
            function remixAudio() {
                if (!originalAudioBuffer) return;
                const ctx = getAudioContext();

                // 读取参数
                const origVol = parseInt(originalVolumeSlider.value) / 100;
                const beatVol = parseInt(beatVolumeSlider.value) / 100;
                const pitch = currentPitch;

                // 如果没有节拍，只返回原曲
                if (beatTimes.length === 0) {
                    // 仅应用原曲音量
                    const mixed = ctx.createBuffer(
                        originalAudioBuffer.numberOfChannels,
                        originalAudioBuffer.length,
                        originalAudioBuffer.sampleRate
                    );
                    for (let ch = 0; ch < originalAudioBuffer.numberOfChannels; ch++) {
                        const src = originalAudioBuffer.getChannelData(ch);
                        const dst = mixed.getChannelData(ch);
                        for (let i = 0; i < src.length; i++) {
                            dst[i] = src[i] * origVol;
                        }
                    }
                    mixedAudioBuffer = mixed;
                    return;
                }

                // 获取节拍 buffer
                let beatBuffer = null;
                if (usingFallback || !builtinAudioBuffer) {
                    beatBuffer = createFallbackClickBuffer(ctx, pitch);
                } else {
                    beatBuffer = builtinAudioBuffer;
                }

                // 计算实际 playbackRate：如果使用内置 MP3，用 pitch 作为 playbackRate
                // 如果使用降级音效，pitch 已经在生成时调整频率，playbackRate 保持 1
                let playbackRate = usingFallback ? 1.0 : pitch;

                // 混音
                const numChannels = originalAudioBuffer.numberOfChannels;
                const length = originalAudioBuffer.length;
                const sampleRate = originalAudioBuffer.sampleRate;

                const mixedBuffer = ctx.createBuffer(numChannels, length, sampleRate);

                // 1. 复制原曲并应用原曲音量
                for (let ch = 0; ch < numChannels; ch++) {
                    const src = originalAudioBuffer.getChannelData(ch);
                    const dst = mixedBuffer.getChannelData(ch);
                    for (let i = 0; i < src.length; i++) {
                        dst[i] = src[i] * origVol;
                    }
                }

                // 2. 叠加节拍音效
                if (beatBuffer && beatTimes.length > 0) {
                    const beatLength = beatBuffer.length;
                    const beatData = beatBuffer.getChannelData(0);

                    // 根据 playbackRate 计算实际采样步长（简单线性插值）
                    const step = playbackRate; // 采样步长，>1 表示加速（音调变高）

                    for (const beatTime of beatTimes) {
                        const startSample = Math.floor(beatTime * sampleRate);
                        if (startSample >= length) continue;

                        // 计算实际可用的输出长度
                        const outLength = Math.min(
                            Math.floor(beatLength / step),
                            length - startSample
                        );
                        if (outLength <= 0) continue;

                        for (let ch = 0; ch < numChannels; ch++) {
                            const dst = mixedBuffer.getChannelData(ch);
                            for (let i = 0; i < outLength; i++) {
                                // 线性插值
                                const srcIdx = i * step;
                                const idx0 = Math.floor(srcIdx);
                                const idx1 = Math.min(idx0 + 1, beatLength - 1);
                                const frac = srcIdx - idx0;
                                const sample = beatData[idx0] * (1 - frac) + beatData[idx1] * frac;

                                dst[startSample + i] += sample * beatVol;
                            }
                        }
                    }
                }

                // 3. 限幅
                for (let ch = 0; ch < numChannels; ch++) {
                    const data = mixedBuffer.getChannelData(ch);
                    for (let i = 0; i < data.length; i++) {
                        if (data[i] > 1) data[i] = 1;
                        else if (data[i] < -1) data[i] = -1;
                    }
                }

                mixedAudioBuffer = mixedBuffer;
            }

            // ===== 节拍检测 =====
            function detectBeats(audioBuffer, threshold = 1.4, minInterval = 0.18) {
                const data = audioBuffer.getChannelData(0);
                const sampleRate = audioBuffer.sampleRate;
                const len = data.length;
                const windowSize = Math.floor(sampleRate * 0.01);
                const hopSize = Math.floor(windowSize / 2);
                const energy = [];

                for (let i = 0; i < len - windowSize; i += hopSize) {
                    let sum = 0;
                    for (let j = 0; j < windowSize; j++) {
                        const val = data[i + j];
                        sum += val * val;
                    }
                    energy.push(sum / windowSize);
                }
                if (energy.length === 0) return [];

                const windowAvgSize = 20;
                const peaks = [];
                for (let i = 0; i < energy.length; i++) {
                    let sum = 0, count = 0;
                    for (let k = Math.max(0, i - windowAvgSize); k <= Math.min(energy.length - 1, i + windowAvgSize); k++) {
                        sum += energy[k];
                        count++;
                    }
                    const avg = sum / count;
                    const localThreshold = avg * threshold;
                    if (energy[i] > localThreshold) {
                        const prev = i > 0 ? energy[i - 1] : 0;
                        const next = i < energy.length - 1 ? energy[i + 1] : 0;
                        if (energy[i] > prev && energy[i] > next) {
                            const time = (i * hopSize) / sampleRate;
                            if (peaks.length === 0 || time - peaks[peaks.length - 1] >= minInterval) {
                                peaks.push(time);
                            }
                        }
                    }
                }
                return peaks;
            }

                try {

                    const decodedBuffer = await ctx.decodeAudioData(arrayBuffer);
                    originalAudioBuffer = decodedBuffer;
                    console.log('上传音频解码成功, 时长:', decodedBuffer.duration.toFixed(2), '秒');

                    // 读取灵敏度

                    setStatus('正在检测节拍...', 'processing');
                    beatTimes = detectBeats(decodedBuffer, threshold, 0.18);

                    setStatus('准备内置音效...', 'processing');

                    setStatus(`完成！检测到 ${beatTimes.length} 个节拍${fallbackNote}，可编辑/播放/导出。`, 'ready');

            // ===== 播放 =====
            function playMixedAudio() {
                if (!mixedAudioBuffer) {
                    setStatus('没有可播放的混合音频', 'error');
                    return;
                }
                const ctx = getAudioContext();
                if (ctx.state === 'suspended') ctx.resume();

                if (currentSource) {
                    try { currentSource.stop(); } catch (e) {}
                    currentSource = null;
                }

                const source = ctx.createBufferSource();
                source.buffer = mixedAudioBuffer;
                source.connect(ctx.destination);
                source.start(0);
                currentSource = source;
                isPlaying = true;
                playBtn.textContent = '停止播放';
                setStatus('正在播放混合音频（包含叠加节拍音效）', 'ready');

                source.onended = () => {
                    if (currentSource === source) {
                        currentSource = null;
                        isPlaying = false;
                        playBtn.textContent = '播放混合音频';
                    }
                };
            }

            // ===== 导出 WAV =====
            function audioBufferToWav(buffer) {
                const numChannels = buffer.numberOfChannels;
                const sampleRate = buffer.sampleRate;
                const format = 1;
                const bitDepth = 16;
                const bytesPerSample = bitDepth / 8;
                const blockAlign = numChannels * bytesPerSample;
                const length = buffer.length;
                const dataSize = length * blockAlign;
                const headerSize = 44;
                const totalSize = headerSize + dataSize;

                const arrayBuffer = new ArrayBuffer(totalSize);
                const view = new DataView(arrayBuffer);

                function writeString(view, offset, string) {
                    for (let i = 0; i < string.length; i++) {
                        view.setUint8(offset + i, string.charCodeAt(i));
                    }
                }

                writeString(view, 0, 'RIFF');
                view.setUint32(4, totalSize - 8, true);
                writeString(view, 8, 'WAVE');
                writeString(view, 12, 'fmt ');
                view.setUint32(16, 16, true);
                view.setUint16(20, format, true);
                view.setUint16(22, numChannels, true);
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * blockAlign, true);
                view.setUint16(32, blockAlign, true);
                view.setUint16(34, bitDepth, true);
                writeString(view, 36, 'data');
                view.setUint32(40, dataSize, true);

                const channels = [];
                for (let i = 0; i < numChannels; i++) {
                    channels.push(buffer.getChannelData(i));
                }

                let offset = 44;
                for (let i = 0; i < length; i++) {
                    for (let ch = 0; ch < numChannels; ch++) {
                        let sample = channels[ch][i];
                        sample = Math.max(-1, Math.min(1, sample));
                        const intSample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                        view.setInt16(offset, intSample, true);
                        offset += 2;
                    }
                }

                return new Blob([arrayBuffer], { type: 'audio/wav' });
            }

            function exportWav() {
                if (!mixedAudioBuffer) {
                    setStatus('没有可导出的音频', 'error');
                    return;
                }
                try {
                    const wavBlob = audioBufferToWav(mixedAudioBuffer);
                    const url = URL.createObjectURL(wavBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `mixed_with_beats_${Date.now()}.wav`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    setStatus('WAV 文件已开始下载', 'ready');
                } catch (e) {
                    console.error(e);
                    setStatus(`导出失败: ${e.message}`, 'error');
                }
            }

            // 原曲音量
            originalVolumeSlider.addEventListener('input', () => {
                const val = parseInt(originalVolumeSlider.value);
                originalVolumeVal.textContent = val + '%';
                if (originalAudioBuffer) {
                    remixAudio();
                    // 如果正在播放，不自动重启，但提示用户
                    if (isPlaying) {
                        setStatus('音量已调整，点击停止后重新播放生效', 'ready');
                    } else {
                        setStatus('原曲音量已调整，重新播放生效', 'ready');
                    }
                }
            });

            // 节拍音量
            beatVolumeSlider.addEventListener('input', () => {
                const val = parseInt(beatVolumeSlider.value);
                beatVolumeVal.textContent = val + '%';
                if (originalAudioBuffer) {
                    remixAudio();
                    if (isPlaying) {
                        setStatus('音量已调整，点击停止后重新播放生效', 'ready');
                    } else {
                        setStatus('节拍音量已调整，重新播放生效', 'ready');
                    }
                }
            });

            // 灵敏度
            sensitivitySlider.addEventListener('input', () => {
                const val = parseFloat(sensitivitySlider.value);
                sensitivityVal.textContent = val.toFixed(2);
            });

            // 灵敏度改变后需要重新检测（通过按钮触发）
            // 这里不自动重新检测，用户点击"重新检测"按钮

            // 音调选择
            toneBtns.forEach(btn => {
                btn.addEventListener('click', async () => {
                    toneBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentPitch = parseFloat(btn.dataset.pitch);

                    // 清除缓存（因为音调变了）
                    // 但为了性能，我们保留缓存，只是重新混音
                    if (originalAudioBuffer) {
                        // 确保内置 buffer 已加载
                        await getBuiltinBufferForPitch(currentPitch);
                        remixAudio();
                        if (isPlaying) {
                            setStatus('音调已调整，点击停止后重新播放生效', 'ready');
                        } else {
                            setStatus(`音调已切换为 ${btn.textContent}，重新播放生效`, 'ready');
                        }
                    }
                });
            });

            // ===== 节拍编辑事件 =====

            // 删除节拍（事件委托）
            beatListDiv.addEventListener('click', (e) => {
                const removeBtn = e.target.closest('.beat-remove');
                if (removeBtn) {
                    const time = parseFloat(removeBtn.dataset.time);
                    beatTimes = beatTimes.filter(t => Math.abs(t - time) > 0.0001);
                    updateBeatListUI();
                    remixAudio();
                    setStatus(`已删除节拍 ${time.toFixed(3)}s，剩余 ${beatTimes.length} 个`, 'ready');
                    if (isPlaying) {
                        setStatus('节拍已修改，点击停止后重新播放生效', 'ready');
                    }
                }
            });

            // 添加节拍
            addBeatBtn.addEventListener('click', () => {
                const val = parseFloat(newBeatTimeInput.value);
                if (isNaN(val) || val < 0) {
                    setStatus('请输入有效的节拍时间（秒）', 'error');
                    return;
                }
                // 检查是否已存在相近时间
                const exists = beatTimes.some(t => Math.abs(t - val) < 0.001);
                if (exists) {
                    setStatus('该时间点已存在节拍', 'error');
                    return;
                }
                beatTimes.push(val);
                beatTimes.sort((a, b) => a - b);
                updateBeatListUI();
                remixAudio();
                newBeatTimeInput.value = '';
                setStatus(`已添加节拍 ${val.toFixed(3)}s，共 ${beatTimes.length} 个`, 'ready');
                if (isPlaying) {
                    setStatus('节拍已修改，点击停止后重新播放生效', 'ready');
                }
            });

            // 回车添加
            newBeatTimeInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addBeatBtn.click();
                }
            });

            // 重新检测
            redetectBtn.addEventListener('click', () => {
                if (!originalAudioBuffer) {
                    setStatus('请先上传音频', 'error');
                    return;
                }
                const threshold = parseFloat(sensitivitySlider.value);
                setStatus('正在重新检测节拍...', 'processing');
                beatTimes = detectBeats(originalAudioBuffer, threshold, 0.18);
                updateBeatListUI();
                remixAudio();
                setStatus(`重新检测完成，共 ${beatTimes.length} 个节拍`, 'ready');
                if (isPlaying) {
                    setStatus('节拍已修改，点击停止后重新播放生效', 'ready');
                }
            });

            // 清空节拍
            clearBeatsBtn.addEventListener('click', () => {
                beatTimes = [];
                updateBeatListUI();
                remixAudio();
                setStatus('已清空所有节拍', 'ready');
                if (isPlaying) {
                    setStatus('节拍已修改，点击停止后重新播放生效', 'ready');
                }
            });

            // ===== 初始化 =====
            window.addEventListener('load', () => {
                if (builtinAudioBlob) {
                    console.log('内置音效 Blob 已就绪，等待用户上传音频后解码。');
                } else {
                    console.warn('内置音效 Blob 未就绪，将使用程序化降级音效。');
                }
                // 初始化显示值
                originalVolumeVal.textContent = originalVolumeSlider.value + '%';
                beatVolumeVal.textContent = beatVolumeSlider.value + '%';
                sensitivityVal.textContent = parseFloat(sensitivitySlider.value).toFixed(2);
            });

            window.addEventListener('beforeunload', () => {
                if (audioContext) audioContext.close();
            });

        })();
    </script>
</body>
</html>
