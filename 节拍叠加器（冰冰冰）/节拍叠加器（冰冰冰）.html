<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节拍叠加器 · 内置音效</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #121212;
            color: #eaeef2;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: #1e1e1e;
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.7);
            border: 1px solid #2d2d2d;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 500;
            margin-top: 0;
            margin-bottom: 0.5rem;
            color: #b4e6ff;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h1 span {
            background: #2b3f4b;
            font-size: 0.9rem;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            color: #8bcbff;
            font-weight: 400;
        }
        .sub {
            color: #8f9aa7;
            margin-bottom: 2rem;
            border-left: 3px solid #3f6b8a;
            padding-left: 1rem;
            font-size: 0.95rem;
        }
        .upload-area {
            background: #252525;
            border: 2px dashed #3f3f3f;
            border-radius: 1.5rem;
            padding: 1.8rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1.8rem;
        }
        .upload-area:hover {
            border-color: #4e9fd6;
            background: #2a2f33;
        }
        .upload-area input {
            display: none;
        }
        .upload-area label {
            display: block;
            cursor: pointer;
            color: #a8c7e0;
            font-weight: 400;
        }
        .upload-area label strong {
            color: #6ab0f0;
            font-weight: 600;
        }
        .file-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1b1b1b;
            padding: 0.75rem 1.2rem;
            border-radius: 2.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #2f2f2f;
            font-size: 0.95rem;
            flex-wrap: wrap;
            gap: 10px;
        }
        .file-info .name {
            color: #c3d9ec;
            font-weight: 500;
            word-break: break-word;
        }
        .file-info .badge {
            background: #2a3d4b;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #aad0f0;
        }
        .status-badge {
            background: #2a2a2a;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-size: 0.85rem;
            color: #b0b0b0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .status-badge.active {
            background: #1f4b3a;
            color: #b0f0d0;
        }
        .status-badge.processing {
            background: #5e4d1e;
            color: #ffe18a;
        }
        .beat-section {
            background: #181818;
            border-radius: 1.5rem;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.8rem;
            border: 1px solid #2a2a2a;
        }
        .beat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }
        .beat-header h2 {
            font-size: 1.2rem;
            font-weight: 500;
            margin: 0;
            color: #bdd9f0;
        }
        .beat-count {
            background: #2b3b47;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.85rem;
            color: #b0dcff;
        }
        .beat-list {
            max-height: 160px;
            overflow-y: auto;
            background: #111;
            border-radius: 1rem;
            padding: 0.75rem 1rem;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.85rem;
            color: #a0c0d0;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1rem;
            scrollbar-width: thin;
            scrollbar-color: #3f5f70 #111;
        }
        .beat-list::-webkit-scrollbar {
            width: 6px;
        }
        .beat-list::-webkit-scrollbar-thumb {
            background: #3f5f70;
            border-radius: 10px;
        }
        .beat-item {
            background: #1e2a30;
            padding: 0.2rem 0.7rem;
            border-radius: 16px;
            font-size: 0.8rem;
            color: #a0d0ff;
            white-space: nowrap;
        }
        .no-beats {
            color: #6a7a85;
            font-style: italic;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 0.5rem;
        }
        button {
            background: #2c2c2c;
            border: none;
            padding: 0.85rem 1.8rem;
            border-radius: 3rem;
            font-size: 1rem;
            font-weight: 500;
            color: #d6e6f5;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            cursor: pointer;
            transition: 0.15s;
            flex: 1 0 auto;
            border: 1px solid #3b3b3b;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }
        button.primary {
            background: #2f6f9f;
            border-color: #4a8fc7;
            color: white;
        }
        button.primary:hover:not(:disabled) {
            background: #3b82b6;
            border-color: #6aace0;
        }
        button.success {
            background: #2a6b4a;
            border-color: #3f9f6f;
            color: white;
        }
        button.success:hover:not(:disabled) {
            background: #34835a;
        }
        button:active:not(:disabled) {
            transform: scale(0.97);
        }
        .status-text {
            font-size: 0.9rem;
            color: #92a9bb;
            margin-top: 1rem;
            min-height: 1.6rem;
            padding-left: 0.5rem;
            border-left: 2px solid #3f6b8a;
            padding-left: 1rem;
        }
        .footer-note {
            font-size: 0.75rem;
            color: #4f5e68;
            margin-top: 2rem;
            text-align: center;
        }
    </style>
</head>

<div class="container">
    <h1>
        ⏁ 节拍叠加器
        <span>内置音效</span>
    </h1>
    <div class="sub">
        ⚡ 上传音频 · 自动检测节拍 · 叠加内置音效 · 播放/导出
    </div>

    <!-- 上传区域 -->
    <div class="upload-area" id="dropArea">
        <input type="file" id="audioFileInput" accept="audio/*">
        <label for="audioFileInput">
            <strong>点击上传</strong> 或拖拽音频文件到此处
            <div style="font-size:0.8rem; margin-top:8px; color:#6b7e8c;">支持 MP3, WAV, M4A, AAC 等</div>
        </label>
    </div>

    <!-- 文件信息 + 节拍检测状态 -->
    <div class="file-info">
        <span class="name" id="fileNameDisplay">未选择文件</span>
        <span class="badge" id="fileMeta">—</span>
        <span class="status-badge" id="analysisStatus">⏳ 等待上传</span>
    </div>

    <!-- 节拍信息面板 -->
    <div class="beat-section">
        <div class="beat-header">
            <h2>检测到的节拍</h2>
            <span class="beat-count" id="beatCount">0</span>
        </div>
        <div class="beat-list" id="beatList">
            <span class="no-beats">暂无节拍数据</span>
        </div>
    </div>

    <!-- 操作按钮 -->
    <div class="actions">
        <button id="playBtn" class="primary" disabled>
            ▶ 播放混合音频
        </button>
        <button id="exportWavBtn" class="success" disabled>
            ⬇ 导出 WAV
        </button>
        <button id="exportMp3Btn" disabled style="background:#3b3b5b; border-color:#5d5d8a;">
            ⬇ 导出 MP3 (模拟)
        </button>
    </div>

    <div class="status-text" id="statusMessage">
        就绪，请上传音频文件。
    </div>
    <div class="footer-note">
        * 节拍检测基于能量峰值 · 内置音效为 Base64 编码的 MP3 片段
    </div>
</div>

        function base64ToBlob(base64, mime = 'audio/mpeg') {
            const binary = atob(base64);

            for (let i = 0; i < len; i++) {

            console.log('内置音效解码完成, 时长:', builtinAudioBuffer.duration, '秒');

        // ---------- 节拍检测 (能量峰值) ----------
        function detectBeats(audioBuffer, threshold = 1.5, minInterval = 0.15) {
            const data = audioBuffer.getChannelData(0); // 单声道分析
            const sampleRate = audioBuffer.sampleRate;
            const len = data.length;

            // 1. 计算短时能量 (窗口 ~ 10ms)
            const windowSize = Math.floor(sampleRate * 0.01); // 10ms
            const hopSize = Math.floor(windowSize / 2);
            const energy = [];
            for (let i = 0; i < len - windowSize; i += hopSize) {
                let sum = 0;
                for (let j = 0; j < windowSize; j++) {
                    const val = data[i + j];
                    sum += val * val;
                }
                energy.push(sum / windowSize);
            }
            if (energy.length === 0) return [];

            // 2. 计算动态阈值 (滑动平均 * 系数)
            const windowAvgSize = 20; // 20个帧
            const thresholdMultiplier = threshold; // 1.5 倍均值
            const peaks = [];

            for (let i = 0; i < energy.length; i++) {
                // 局部平均 (前后 windowAvgSize 帧)
                let sum = 0, count = 0;
                for (let k = Math.max(0, i - windowAvgSize); k <= Math.min(energy.length - 1, i + windowAvgSize); k++) {
                    sum += energy[k];
                    count++;
                }
                const avg = sum / count;
                const localThreshold = avg * thresholdMultiplier;

                // 峰值判断: 当前能量 > 局部阈值 且 大于前后邻居
                if (energy[i] > localThreshold) {
                    const prev = i > 0 ? energy[i-1] : 0;
                    const next = i < energy.length - 1 ? energy[i+1] : 0;
                    if (energy[i] > prev && energy[i] > next) {
                        const time = (i * hopSize) / sampleRate;
                        // 避免太近的节拍
                        if (peaks.length === 0 || time - peaks[peaks.length-1] >= minInterval) {
                            peaks.push(time);
                        }
                    }
                }
            }
            return peaks;
        }

        // ---------- 混合音频 (叠加内置音效到节拍点) ----------
        async function mixBeatsIntoAudio(originalBuffer, beatTimes, builtinBuffer) {
            const ctx = getAudioContext();
            const sampleRate = originalBuffer.sampleRate;
            const numChannels = originalBuffer.numberOfChannels;
            const length = originalBuffer.length;

            // 创建新的 buffer 用于存放混合结果 (保持原长度)
            const mixedBuffer = ctx.createBuffer(numChannels, length, sampleRate);

            // 复制原始音频数据
            for (let ch = 0; ch < numChannels; ch++) {
                const origData = originalBuffer.getChannelData(ch);
                const mixedData = mixedBuffer.getChannelData(ch);
                mixedData.set(origData);
            }

            // 如果内置音效 buffer 不存在或没有节拍，直接返回副本
            if (!builtinBuffer || beatTimes.length === 0) {
                return mixedBuffer;
            }

            // 获取内置音效数据 (单声道/立体声都作为单声道处理，然后叠加到所有声道)
            const builtinLength = builtinBuffer.length;
            const builtinChannels = builtinBuffer.numberOfChannels;
            const builtinData = builtinBuffer.getChannelData(0); // 取第一声道

            // 对每个节拍点叠加
            for (const beatTime of beatTimes) {
                const startSample = Math.floor(beatTime * sampleRate);
                // 从 startSample 开始叠加，不能超过原长度
                const copyLength = Math.min(builtinLength, length - startSample);
                if (copyLength <= 0) continue;

                for (let ch = 0; ch < numChannels; ch++) {
                    const mixedData = mixedBuffer.getChannelData(ch);
                    // 叠加内置音效 (简单相加，为了不削波可乘以一个衰减系数 0.7，这里保持清晰度适当降低)
                    const gain = 0.8;
                    for (let i = 0; i < copyLength; i++) {
                        // 内置音效如果是多声道，这里简化只取第一声道；也可根据ch取不同，但为简单统一
                        const sample = builtinData[i] * gain;
                        mixedData[startSample + i] += sample;
                    }
                }
            }

            // 防止削波 (简单软限幅)
            for (let ch = 0; ch < numChannels; ch++) {
                const data = mixedBuffer.getChannelData(ch);
                for (let i = 0; i < data.length; i++) {
                    if (data[i] > 1.0) data[i] = 1.0;
                    else if (data[i] < -1.0) data[i] = -1.0;
                }
            }

            return mixedBuffer;
        }

        // ---------- 处理上传的音频文件 ----------
        async function handleAudioFile(file) {
            resetForNewFile();

            if (!file) {
                setStatus('未选择文件', 'info');
                return;
            }

            // 显示文件信息
            fileNameDisplay.textContent = file.name;
            const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
            fileMeta.textContent = `${sizeMB} MB · ${file.type || '音频'}`;

            // 检查 AudioContext 是否被挂起 (自动播放策略)
            const ctx = getAudioContext();
            if (ctx.state === 'suspended') {
                await ctx.resume();
            }

            try {
                setStatus('正在解码音频...', 'processing');
                const arrayBuffer = await file.arrayBuffer();
                // 解码原始音频
                const decodedBuffer = await ctx.decodeAudioData(arrayBuffer);
                originalAudioBuffer = decodedBuffer;

                setStatus('正在检测节拍...', 'processing');
                // 节拍检测 (参数可调)
                beatTimes = detectBeats(decodedBuffer, 1.4, 0.18);
                console.log('检测到节拍数量:', beatTimes.length, beatTimes);

                // 更新节拍显示
                beatCountSpan.textContent = beatTimes.length;
                if (beatTimes.length === 0) {
                    beatListDiv.innerHTML = '<span class="no-beats">未检测到明显节拍</span>';
                } else {
                    beatListDiv.innerHTML = beatTimes.map((t, idx) =>
                        `<span class="beat-item">${idx+1}: ${t.toFixed(3)}s</span>`
                    ).join('');
                }

                // 确保内置音效已解码
                setStatus('加载内置音效...', 'processing');
                await ensureBuiltinBuffer();

                // 混合音频
                setStatus('正在混合节拍音效...', 'processing');
                mixedAudioBuffer = await mixBeatsIntoAudio(decodedBuffer, beatTimes, builtinAudioBuffer);

                // 启用按钮
                playBtn.disabled = false;
                exportWavBtn.disabled = false;
                exportMp3Btn.disabled = false; // 模拟导出

                setStatus(`✅ 处理完成！检测到 ${beatTimes.length} 个节拍，可播放或导出。`, 'ready');
            } catch (err) {
                console.error(err);
                setStatus(`❌ 处理失败: ${err.message}`, 'error');
                analysisStatus.textContent = '❌ 错误';
                analysisStatus.className = 'status-badge';
                // 重置
                originalAudioBuffer = null;
                mixedAudioBuffer = null;
                beatTimes = [];
                playBtn.disabled = true;
                exportWavBtn.disabled = true;
                exportMp3Btn.disabled = true;
                beatCountSpan.textContent = '0';
                beatListDiv.innerHTML = '<span class="no-beats">处理失败</span>';
            }
        }

        // ---------- 播放混合音频 ----------
        function playMixedAudio() {
            if (!mixedAudioBuffer) {
                setStatus('没有可播放的混合音频', 'error');
                return;
            }
            const ctx = getAudioContext();
            if (ctx.state === 'suspended') {
                ctx.resume();
            }

            // 停止上一个播放
            if (currentSource) {
                try { currentSource.stop(); } catch (e) {}
                currentSource = null;
            }

            const source = ctx.createBufferSource();
            source.buffer = mixedAudioBuffer;
            source.connect(ctx.destination);
            source.start(0);
            currentSource = source;
            isPlaying = true;

            playBtn.textContent = '⏸ 播放中...';
            setStatus('🔊 正在播放混合音频（包含叠加节拍音效）', 'ready');

            source.onended = () => {
                if (currentSource === source) {
                    currentSource = null;
                    isPlaying = false;
                    playBtn.textContent = '▶ 播放混合音频';
                }
            };
        }

        // ---------- 导出 WAV (混合音频) ----------
        function exportWav() {
            if (!mixedAudioBuffer) {
                setStatus('没有可导出的音频', 'error');
                return;
            }

            try {
                const wavBlob = audioBufferToWav(mixedAudioBuffer);
                const url = URL.createObjectURL(wavBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `mixed_with_beats_${Date.now()}.wav`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                setStatus('✅ WAV 文件已开始下载', 'ready');
            } catch (e) {
                console.error(e);
                setStatus(`导出失败: ${e.message}`, 'error');
            }
        }

        // 导出 MP3 (模拟 - 实际生成一个包含提示的文本文件，因无编码器)
        function exportMp3Mock() {
            if (!mixedAudioBuffer) {
                setStatus('没有可导出的音频', 'error');
                return;
            }
            // 由于浏览器没有内置MP3编码器，这里导出一个文本描述作为"模拟"
            const msg = `本应导出 MP3 文件（混合音频，时长 ${mixedAudioBuffer.duration.toFixed(2)} 秒，包含 ${beatTimes.length} 个节拍音效）。\n` +
                        `但因浏览器无内置 MP3 编码器，此文件为占位说明。\n` +
                        `请使用 WAV 导出获得实际音频。\n` +
                        `生成时间: ${new Date().toLocaleString()}`;
            const blob = new Blob([msg], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `mixed_placeholder_${Date.now()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            setStatus('⚠️ 模拟 MP3 导出：已生成说明文件（浏览器无MP3编码器）', 'ready');
        }

        // ---------- AudioBuffer 转 WAV (标准) ----------
        function audioBufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const format = 1; // PCM
            const bitDepth = 16;
            const bytesPerSample = bitDepth / 8;
            const blockAlign = numChannels * bytesPerSample;

            const length = buffer.length;
            const dataSize = length * blockAlign;
            const headerSize = 44;
            const totalSize = headerSize + dataSize;

            const arrayBuffer = new ArrayBuffer(totalSize);
            const view = new DataView(arrayBuffer);

            // RIFF chunk descriptor
            writeString(view, 0, 'RIFF');
            view.setUint32(4, totalSize - 8, true);
            writeString(view, 8, 'WAVE');

            // fmt sub-chunk
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true);

            // data sub-chunk
            writeString(view, 36, 'data');
            view.setUint32(40, dataSize, true);

            // 写入采样数据
            const channels = [];
            for (let i = 0; i < numChannels; i++) {
                channels.push(buffer.getChannelData(i));
            }

            let offset = 44;
            for (let i = 0; i < length; i++) {
                for (let ch = 0; ch < numChannels; ch++) {
                    let sample = channels[ch][i];
                    // 裁剪
                    sample = Math.max(-1, Math.min(1, sample));
                    // 转为 16bit
                    const intSample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                    view.setInt16(offset, intSample, true);
                    offset += 2;
                }
            }

            return new Blob([arrayBuffer], { type: 'audio/wav' });
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        // ---------- 事件绑定 ----------
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleAudioFile(file);
            }
        });

        // 拖拽上传
        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.style.borderColor = '#4e9fd6';
            dropArea.style.background = '#2a2f33';
        });
        dropArea.addEventListener('dragleave', () => {
            dropArea.style.borderColor = '#3f3f3f';
            dropArea.style.background = '#252525';
        });
        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.style.borderColor = '#3f3f3f';
            dropArea.style.background = '#252525';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('audio/')) {
                fileInput.files = e.dataTransfer.files; // 同步
                handleAudioFile(file);
            } else {
                setStatus('请拖拽音频文件', 'error');
            }
        });

        // 点击播放按钮
        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                // 如果正在播放，停止
                if (currentSource) {
                    try { currentSource.stop(); } catch (e) {}
                    currentSource = null;
                }
                isPlaying = false;
                playBtn.textContent = '▶ 播放混合音频';
                setStatus('播放已停止', 'ready');
            } else {
                playMixedAudio();
            }
        });

        // 导出 WAV
        exportWavBtn.addEventListener('click', exportWav);

        // 导出 MP3 (模拟)
        exportMp3Btn.addEventListener('click', exportMp3Mock);

        // 预加载内置音效 (提前解码，避免第一次等待)
        window.addEventListener('load', () => {
            // 但 AudioContext 需要用户交互后才能 resume，这里仅创建上下文并解码，稍后 resume
            setTimeout(async () => {
                try {
                    const ctx = getAudioContext();
                    // 不主动 resume，只确保 builtin 解码。解码不依赖 resume
                    if (!builtinAudioBuffer && builtinAudioBlob) {
                        const arrayBuffer = await builtinAudioBlob.arrayBuffer();
                        builtinAudioBuffer = await ctx.decodeAudioData(arrayBuffer);
                        console.log('内置音效预解码完成');
                    }
                } catch (e) {
                    console.warn('预解码内置音效失败:', e);
                }
            }, 200);
        });

        // 页面卸载时关闭 AudioContext
        window.addEventListener('beforeunload', () => {
            if (audioContext) {
                audioContext.close();
            }
        });

    })();
</script>
