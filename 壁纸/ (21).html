<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>流体烟雾壁纸</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
.hint{position:absolute;bottom:30px;width:100%;text-align:center;color:rgba(255,255,255,.35);font-family:sans-serif;pointer-events:none;font-size:14px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">滑动屏幕产生烟雾 · 空格键随机爆炸</div>
<script>
/* ============================================================
   流体烟雾壁纸 · 性能优化 + 原版效果还原
   ------------------------------------------------------------
   相对原版 Pavel Dobryakov script.js 的还原：
   - Sunrays：还原为 16 次迭代径向光线（Density .3 / Decay .95 / Exposure .7）
   - Sunrays mask：还原为 alpha = 1 - min(br*20, 0.8)
   - display：c *= sunrays; bloom *= sunrays;（两处都乘）
   - Bloom intensity 只在 bloomFinal 应用一次（display 不再乘）
   - 启动 multipleSplats(5~24)，与按空格触发的随机爆炸一致
   - 恢复 dithering 纹理（用程序化噪声代替 LDR_LLL1_0.png）
   - 恢复原版 dissipation：DENSITY=1, VELOCITY=0.2
   - 恢复原版随机色相：HSVtoRGB(random,1,1)
   - 点击不爆炸（原版行为），仅拖动产生烟雾

   保留的性能优化：
   - 移动端降分辨率、关闭 shading
   - 限制最大像素数
   - 页面隐藏暂停 RAF
   - 按需编译 shader
   ============================================================ */

(function () {
'use strict';

const canvas = document.getElementById('c');

const IS_MOBILE =
    /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(navigator.userAgent) ||
    (navigator.maxTouchPoints > 1 && Math.min(window.innerWidth, window.innerHeight) < 820);

const CONFIG = {
    // ★ 恢复原版 dissipation
    SIM_RESOLUTION:        IS_MOBILE ? 64  : 96,
    DYE_RESOLUTION:        IS_MOBILE ? 384 : 512,
    DENSITY_DISSIPATION:   1.0,
    VELOCITY_DISSIPATION:  0.2,
    PRESSURE:              0.8,
    PRESSURE_ITERATIONS:   IS_MOBILE ? 8 : 12,
    CURL:                  30,

    SPLAT_RADIUS: 0.25,
    SPLAT_FORCE:  6000,

    SHADING:            !IS_MOBILE,
    COLORFUL:           true,
    COLOR_UPDATE_SPEED: 10,
    BACK_COLOR: { r: 0, g: 0, b: 0 },

    // 背景软裁剪
    BACKGROUND_THRESHOLD: 0.02,
    BACKGROUND_SOFTNESS:  0.01,

    BLOOM:            true,
    BLOOM_INTENSITY:  0.8,
    BLOOM_THRESHOLD:  0.6,
    BLOOM_SOFT_KNEE:  0.7,
    BLOOM_RESOLUTION: IS_MOBILE ? 128 : 192,
    BLOOM_ITERATIONS: IS_MOBILE ? 3  : 5,

    // ★ 恢复原版 sunrays
    SUNRAYS: true,
    SUNRAYS_WEIGHT: 1.0,
    SUNRAYS_RESOLUTION: IS_MOBILE ? 128 : 196,

    MAX_PIXELS: IS_MOBILE ? 1200000 : 2500000
};
const config = CONFIG;

/* ============================================================
   WebGL 上下文
   ============================================================ */
function getWebGLContext(canvas) {
    const params = {
        alpha: true, depth: false, stencil: false,
        antialias: false, preserveDrawingBuffer: false,
        powerPreference: 'high-performance'
    };
    let gl = canvas.getContext('webgl2', params);
    const isWebGL2 = !!gl;
    if (!isWebGL2) gl = canvas.getContext('webgl', params) || canvas.getContext('experimental-webgl', params);
    if (!gl) return { gl: null, ext: null };

    let halfFloat, supportLinearFiltering;
    if (isWebGL2) {
        gl.getExtension('EXT_color_buffer_float');
        supportLinearFiltering = gl.getExtension('OES_texture_float_linear');
    } else {
        halfFloat = gl.getExtension('OES_texture_half_float');
        supportLinearFiltering = gl.getExtension('OES_texture_half_float_linear');
    }
    gl.clearColor(0, 0, 0, 1);

    const halfFloatTexType = isWebGL2 ? gl.HALF_FLOAT : (halfFloat ? halfFloat.HALF_FLOAT_OES : null);

    let formatRGBA, formatRG, formatR;
    if (isWebGL2) {
        formatRGBA = getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, halfFloatTexType);
        formatRG   = getSupportedFormat(gl, gl.RG16F,   gl.RG,   halfFloatTexType);
        formatR    = getSupportedFormat(gl, gl.R16F,    gl.RED,  halfFloatTexType);
    } else {
        formatRGBA = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
        formatRG   = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
        formatR    = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
    }
    return { gl, ext: { formatRGBA, formatRG, formatR, halfFloatTexType, supportLinearFiltering } };
}
function getSupportedFormat(gl, internalFormat, format, type) {
    if (!supportRenderTextureFormat(gl, internalFormat, format, type)) {
        switch (internalFormat) {
            case gl.R16F:  return getSupportedFormat(gl, gl.RG16F, gl.RG, type);
            case gl.RG16F: return getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, type);
            default: return null;
        }
    }
    return { internalFormat, format };
}
function supportRenderTextureFormat(gl, internalFormat, format, type) {
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, 4, 4, 0, format, type, null);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    return gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
}

const { gl, ext } = getWebGLContext(canvas);
if (!gl) { alert('浏览器不支持 WebGL'); return; }

if (!ext.supportLinearFiltering) {
    config.DYE_RESOLUTION = 256;
    config.SHADING = false;
    config.BLOOM = false;
    config.SUNRAYS = false;
}

/* ============================================================
   着色器工具
   ============================================================ */
function compileShader(type, source, keywords) {
    source = addKeywords(source, keywords);
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
        console.error('Shader 编译失败:', gl.getShaderInfoLog(shader));
    return shader;
}
function addKeywords(source, keywords) {
    if (!keywords || !keywords.length) return source;
    let s = '';
    for (let i = 0; i < keywords.length; i++) s += '#define ' + keywords[i] + '\n';
    return s + source;
}
function createProgram(vs, fs) {
    const program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.bindAttribLocation(program, 0, 'aPosition');
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS))
        console.error('程序链接失败:', gl.getProgramInfoLog(program));
    return program;
}
function getUniforms(program) {
    const uniforms = [];
    const count = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < count; i++) {
        const name = gl.getActiveUniform(program, i).name;
        uniforms[name] = gl.getUniformLocation(program, name);
    }
    return uniforms;
}
class Program {
    constructor(vs, fs) { this.program = createProgram(vs, fs); this.uniforms = getUniforms(this.program); }
    bind() { gl.useProgram(this.program); }
}

/* ---------- 通用顶点着色器 ---------- */
const baseVertexShader = compileShader(gl.VERTEX_SHADER, `
precision highp float;
attribute vec2 aPosition;
varying vec2 vUv; varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
uniform vec2 texelSize;
void main () {
    vUv = aPosition * 0.5 + 0.5;
    vL = vUv - vec2(texelSize.x, 0.0);
    vR = vUv + vec2(texelSize.x, 0.0);
    vT = vUv + vec2(0.0, texelSize.y);
    vB = vUv - vec2(0.0, texelSize.y);
    gl_Position = vec4(aPosition, 0.0, 1.0);
}
`);

/* ---------- 原版 blur 顶点/片元（用于 sunrays 后处理） ---------- */
const blurVertexShader = compileShader(gl.VERTEX_SHADER, `
precision highp float;
attribute vec2 aPosition;
varying vec2 vUv; varying vec2 vL; varying vec2 vR;
uniform vec2 texelSize;
void main () {
    vUv = aPosition * 0.5 + 0.5;
    float offset = 1.33333333;
    vL = vUv - texelSize * offset;
    vR = vUv + texelSize * offset;
    gl_Position = vec4(aPosition, 0.0, 1.0);
}
`);
const blurProgram = new Program(blurVertexShader, compileShader(gl.FRAGMENT_SHADER, `
precision mediump float; precision mediump sampler2D;
varying vec2 vUv; varying vec2 vL; varying vec2 vR;
uniform sampler2D uTexture;
void main () {
    vec4 sum = texture2D(uTexture, vUv) * 0.29411764;
    sum += texture2D(uTexture, vL) * 0.35294117;
    sum += texture2D(uTexture, vR) * 0.35294117;
    gl_FragColor = sum;
}
`));

/* ---------- Clear ---------- */
const clearProgram = new Program(baseVertexShader,
    compileShader(gl.FRAGMENT_SHADER, `
precision mediump float; precision mediump sampler2D;
varying highp vec2 vUv;
uniform sampler2D uTexture;
uniform float value;
void main () { gl_FragColor = value * texture2D(uTexture, vUv); }
`));

/* ---------- Display（原版：c *= sunrays; bloom *= sunrays; 且 bloom 不再乘 intensity） ---------- */
const displayShaderSource = `
precision highp float; precision highp sampler2D;
varying vec2 vUv; varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
uniform sampler2D uTexture;
uniform sampler2D uBloom;
uniform sampler2D uSunrays;
uniform sampler2D uDithering;
uniform vec2 ditherScale;
uniform vec2 texelSize;
uniform vec3 uBackColor;

vec3 linearToGamma (vec3 color) {
    color = max(color, vec3(0.0));
    return max(1.055 * pow(color, vec3(0.416666667)) - 0.055, vec3(0.0));
}

void main () {
    vec3 c = texture2D(uTexture, vUv).rgb;

#ifdef SHADING
    vec3 lc = texture2D(uTexture, vL).rgb;
    vec3 rc = texture2D(uTexture, vR).rgb;
    vec3 tc = texture2D(uTexture, vT).rgb;
    vec3 bc = texture2D(uTexture, vB).rgb;
    float dx = length(rc) - length(lc);
    float dy = length(tc) - length(bc);
    vec3 n = normalize(vec3(dx, dy, length(texelSize) + 0.0001));
    float diffuse = clamp(n.z + 0.7, 0.7, 1.0);
    c *= diffuse;
#endif

#ifdef BLOOM
    vec3 bloom = texture2D(uBloom, vUv).rgb;
#endif

#ifdef SUNRAYS
    float sunrays = texture2D(uSunrays, vUv).r;
    c *= sunrays;
    #ifdef BLOOM
        bloom *= sunrays;
    #endif
#endif

#ifdef BLOOM
    float noise = texture2D(uDithering, vUv * ditherScale).r;
    noise = noise * 2.0 - 1.0;
    bloom += noise / 255.0;
    bloom = linearToGamma(bloom);
    c += bloom;
#endif

    c = max(c, vec3(0.0));
    c = c / (1.0 + c);

    float lum = max(c.r, max(c.g, c.b));
    float bgMask = smoothstep(
        BACKGROUND_THRESHOLD - BACKGROUND_SOFTNESS,
        BACKGROUND_THRESHOLD + BACKGROUND_SOFTNESS,
        lum
    );
    c *= bgMask;
    c += uBackColor;
    gl_FragColor = vec4(c, 1.0);
}
`;
const displayKeywords = [];
if (config.SHADING) displayKeywords.push('SHADING');
if (config.BLOOM)   displayKeywords.push('BLOOM');
if (config.SUNRAYS) displayKeywords.push('SUNRAYS');
displayKeywords.push('BACKGROUND_THRESHOLD ' + Number(config.BACKGROUND_THRESHOLD).toFixed(4));
displayKeywords.push('BACKGROUND_SOFTNESS ' + Number(config.BACKGROUND_SOFTNESS).toFixed(4));

const displayProgram = new Program(
    baseVertexShader,
    compileShader(gl.FRAGMENT_SHADER, displayShaderSource, displayKeywords)
);

/* ---------- Splat ---------- */
const splatProgram = new Program(baseVertexShader,
    compileShader(gl.FRAGMENT_SHADER, `
precision highp float; precision highp sampler2D;
varying vec2 vUv;
uniform sampler2D uTarget;
uniform float aspectRatio;
uniform vec3 color;
uniform vec2 point;
uniform float radius;
void main () {
    vec2 p = vUv - point.xy;
    p.x *= aspectRatio;
    vec3 splat = exp(-dot(p, p) / radius) * color;
    vec3 base = texture2D(uTarget, vUv).xyz;
    gl_FragColor = vec4(base + splat, 1.0);
}
`));

/* ---------- Advection ---------- */
const advectionProgram = new Program(baseVertexShader,
    compileShader(gl.FRAGMENT_SHADER, `
precision highp float; precision highp sampler2D;
varying vec2 vUv;
uniform sampler2D uVelocity;
uniform sampler2D uSource;
uniform vec2 texelSize;
uniform vec2 dyeTexelSize;
uniform float dt;
uniform float dissipation;
vec4 bilerp (sampler2D sam, vec2 uv, vec2 tsize) {
    vec2 st = uv / tsize - 0.5;
    vec2 iuv = floor(st); vec2 fuv = fract(st);
    vec4 a = texture2D(sam, (iuv + vec2(0.5, 0.5)) * tsize);
    vec4 b = texture2D(sam, (iuv + vec2(1.5, 0.5)) * tsize);
    vec4 c = texture2D(sam, (iuv + vec2(0.5, 1.5)) * tsize);
    vec4 d = texture2D(sam, (iuv + vec2(1.5, 1.5)) * tsize);
    return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);
}
void main () {
#ifdef MANUAL_FILTERING
    vec2 coord = vUv - dt * bilerp(uVelocity, vUv, texelSize).xy * texelSize;
    vec4 result = bilerp(uSource, coord, dyeTexelSize);
#else
    vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;
    vec4 result = texture2D(uSource, coord);
#endif
    float decay = 1.0 + dissipation * dt;
    gl_FragColor = result / decay;
}
`));
if (!ext.supportLinearFiltering)
    advectionProgram.uniforms.dyeTexelSize = gl.getUniformLocation(advectionProgram.program, 'dyeTexelSize');

/* ---------- 求解器 ---------- */
const divergenceProgram = new Program(baseVertexShader,
    compileShader(gl.FRAGMENT_SHADER, `
precision mediump float; precision mediump sampler2D;
varying highp vec2 vUv; varying highp vec2 vL; varying highp vec2 vR; varying highp vec2 vT; varying highp vec2 vB;
uniform sampler2D uVelocity;
void main () {
    float L = texture2D(uVelocity, vL).x;
    float R = texture2D(uVelocity, vR).x;
    float T = texture2D(uVelocity, vT).y;
    float B = texture2D(uVelocity, vB).y;
    vec2 C = texture2D(uVelocity, vUv).xy;
    if (vL.x < 0.0) { L = -C.x; }
    if (vR.x > 1.0) { R = -C.x; }
    if (vT.y > 1.0) { T = -C.y; }
    if (vB.y < 0.0) { B = -C.y; }
    gl_FragColor = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);
}
`));

const curlProgram = new Program(baseVertexShader,
    compileShader(gl.FRAGMENT_SHADER, `
precision mediump float; precision mediump sampler2D;
varying highp vec2 vUv; varying highp vec2 vL; varying highp vec2 vR; varying highp vec2 vT; varying highp vec2 vB;
uniform sampler2D uVelocity;
void main () {
    float L = texture2D(uVelocity, vL).y;
    float R = texture2D(uVelocity, vR).y;
    float T = texture2D(uVelocity, vT).x;
    float B = texture2D(uVelocity, vB).x;
    gl_FragColor = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0);
}
`));

const vorticityProgram = new Program(baseVertexShader,
    compileShader(gl.FRAGMENT_SHADER, `
precision highp float; precision highp sampler2D;
varying vec2 vUv; varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
uniform sampler2D uVelocity;
uniform sampler2D uCurl;
uniform float curl;
uniform float dt;
void main () {
    float L = texture2D(uCurl, vL).x;
    float R = texture2D(uCurl, vR).x;
    float T = texture2D(uCurl, vT).x;
    float B = texture2D(uCurl, vB).x;
    float C = texture2D(uCurl, vUv).x;
    vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
    force /= length(force) + 0.0001;
    force *= curl * C;
    force.y *= -1.0;
    vec2 velocity = texture2D(uVelocity, vUv).xy;
    velocity += force * dt;
    velocity = min(max(velocity, -1000.0), 1000.0);
    gl_FragColor = vec4(velocity, 0.0, 1.0);
}
`));

const pressureProgram = new Program(baseVertexShader,
    compileShader(gl.FRAGMENT_SHADER, `
precision mediump float; precision mediump sampler2D;
varying highp vec2 vUv; varying highp vec2 vL; varying highp vec2 vR; varying highp vec2 vT; varying highp vec2 vB;
uniform sampler2D uPressure;
uniform sampler2D uDivergence;
void main () {
    float L = texture2D(uPressure, vL).x;
    float R = texture2D(uPressure, vR).x;
    float T = texture2D(uPressure, vT).x;
    float B = texture2D(uPressure, vB).x;
    float divergence = texture2D(uDivergence, vUv).x;
    gl_FragColor = vec4((L + R + B + T - divergence) * 0.25, 0.0, 0.0, 1.0);
}
`));

const gradientSubtractProgram = new Program(baseVertexShader,
    compileShader(gl.FRAGMENT_SHADER, `
precision mediump float; precision mediump sampler2D;
varying highp vec2 vUv; varying highp vec2 vL; varying highp vec2 vR; varying highp vec2 vT; varying highp vec2 vB;
uniform sampler2D uPressure;
uniform sampler2D uVelocity;
void main () {
    float L = texture2D(uPressure, vL).x;
    float R = texture2D(uPressure, vR).x;
    float T = texture2D(uPressure, vT).x;
    float B = texture2D(uPressure, vB).x;
    vec2 velocity = texture2D(uVelocity, vUv).xy;
    velocity.xy -= vec2(R - L, T - B);
    gl_FragColor = vec4(velocity, 0.0, 1.0);
}
`));

/* ---------- Bloom ---------- */
let bloomPrefilterProgram = null, bloomBlurProgram = null, bloomFinalProgram = null;
if (config.BLOOM) {
    bloomPrefilterProgram = new Program(baseVertexShader,
        compileShader(gl.FRAGMENT_SHADER, `
precision mediump float; precision mediump sampler2D;
varying vec2 vUv;
uniform sampler2D uTexture;
uniform vec3 curve;
uniform float threshold;
void main () {
    vec3 c = texture2D(uTexture, vUv).rgb;
    float br = max(c.r, max(c.g, c.b));
    float rq = clamp(br - curve.x, 0.0, curve.y);
    rq = curve.z * rq * rq;
    c *= max(rq, br - threshold) / max(br, 0.0001);
    gl_FragColor = vec4(c, 0.0);
}
`));
    // 原版 bloom 使用的是上下左右四邻域（不是左右两邻域）
    bloomBlurProgram = new Program(baseVertexShader,
        compileShader(gl.FRAGMENT_SHADER, `
precision mediump float; precision mediump sampler2D;
varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
uniform sampler2D uTexture;
void main () {
    vec4 sum = vec4(0.0);
    sum += texture2D(uTexture, vL);
    sum += texture2D(uTexture, vR);
    sum += texture2D(uTexture, vT);
    sum += texture2D(uTexture, vB);
    sum *= 0.25;
    gl_FragColor = sum;
}
`));
    bloomFinalProgram = new Program(baseVertexShader,
        compileShader(gl.FRAGMENT_SHADER, `
precision mediump float; precision mediump sampler2D;
varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
uniform sampler2D uTexture;
uniform float intensity;
void main () {
    vec4 sum = vec4(0.0);
    sum += texture2D(uTexture, vL);
    sum += texture2D(uTexture, vR);
    sum += texture2D(uTexture, vT);
    sum += texture2D(uTexture, vB);
    sum *= 0.25;
    gl_FragColor = sum * intensity;
}
`));
}

/* ---------- Sunrays（★ 原版径向光线） ---------- */
let sunraysMaskProgram = null, sunraysProgram = null;
if (config.SUNRAYS) {
    sunraysMaskProgram = new Program(baseVertexShader,
        compileShader(gl.FRAGMENT_SHADER, `
precision highp float; precision highp sampler2D;
varying vec2 vUv;
uniform sampler2D uTexture;
void main () {
    vec4 c = texture2D(uTexture, vUv);
    float br = max(c.r, max(c.g, c.b));
    c.a = 1.0 - min(max(br * 20.0, 0.0), 0.8);
    gl_FragColor = c;
}
`));
    sunraysProgram = new Program(baseVertexShader,
        compileShader(gl.FRAGMENT_SHADER, `
precision highp float; precision highp sampler2D;
varying vec2 vUv;
uniform sampler2D uTexture;
uniform float weight;
#define ITERATIONS 16
void main () {
    float Density = 0.3;
    float Decay = 0.95;
    float Exposure = 0.7;
    vec2 coord = vUv;
    vec2 dir = vUv - 0.5;
    dir *= 1.0 / float(ITERATIONS) * Density;
    float illuminationDecay = 1.0;
    float color = texture2D(uTexture, vUv).a;
    for (int i = 0; i < ITERATIONS; i++) {
        coord -= dir;
        float col = texture2D(uTexture, coord).a;
        color += col * illuminationDecay * weight;
        illuminationDecay *= Decay;
    }
    gl_FragColor = vec4(color * Exposure, 0.0, 0.0, 1.0);
}
`));
}

/* ============================================================
   FBO 管理
   ============================================================ */
let dye, velocity, divergence, curl, pressure;
let bloom, bloomFramebuffers, sunrays, sunraysTemp;
let ditheringTexture;

function createFBO(w, h, internalFormat, format, type, param) {
    gl.activeTexture(gl.TEXTURE0);
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, param);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, param);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, type, null);

    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);

    return {
        texture, fbo, width: w, height: h,
        texelSizeX: 1.0 / w, texelSizeY: 1.0 / h,
        attach(id) {
            gl.activeTexture(gl.TEXTURE0 + id);
            gl.bindTexture(gl.TEXTURE_2D, texture);
            return id;
        }
    };
}
function createDoubleFBO(w, h, internalFormat, format, type, param) {
    let fbo1 = createFBO(w, h, internalFormat, format, type, param);
    let fbo2 = createFBO(w, h, internalFormat, format, type, param);
    return {
        width: w, height: h,
        texelSizeX: fbo1.texelSizeX, texelSizeY: fbo1.texelSizeY,
        get read() { return fbo1; }, set read(v) { fbo1 = v; },
        get write() { return fbo2; }, set write(v) { fbo2 = v; },
        swap() { const t = fbo1; fbo1 = fbo2; fbo2 = t; }
    };
}
function resizeDoubleFBO(target, w, h, internalFormat, format, type, param) {
    if (target.width === w && target.height === h) return target;
    target.read = createFBO(w, h, internalFormat, format, type, param);
    target.write = createFBO(w, h, internalFormat, format, type, param);
    target.width = w; target.height = h;
    target.texelSizeX = 1.0 / w; target.texelSizeY = 1.0 / h;
    return target;
}
function getResolution(resolution) {
    let aspectRatio = gl.drawingBufferWidth / gl.drawingBufferHeight;
    if (aspectRatio < 1) aspectRatio = 1.0 / aspectRatio;
    if (!isFinite(aspectRatio) || aspectRatio <= 0) aspectRatio = 1;
    const min = Math.round(resolution);
    const max = Math.round(resolution * aspectRatio);
    return gl.drawingBufferWidth > gl.drawingBufferHeight
        ? { width: max, height: min }
        : { width: min, height: max };
}

/* 程序化噪声纹理替代原版 LDR_LLL1_0.png */
function createNoiseTexture() {
    const size = 64;
    const data = new Uint8Array(size * size * 3);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 256) | 0;
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, size, size, 0, gl.RGB, gl.UNSIGNED_BYTE, data);
    return {
        texture, width: size, height: size,
        attach(id) {
            gl.activeTexture(gl.TEXTURE0 + id);
            gl.bindTexture(gl.TEXTURE_2D, texture);
            return id;
        }
    };
}

function initFramebuffers() {
    const simRes = getResolution(config.SIM_RESOLUTION);
    const dyeRes = getResolution(config.DYE_RESOLUTION);
    const texType = ext.halfFloatTexType;
    const rgba = ext.formatRGBA, rg = ext.formatRG, r = ext.formatR;
    const filtering = ext.supportLinearFiltering ? gl.LINEAR : gl.NEAREST;
    gl.disable(gl.BLEND);

    if (!dye)
        dye = createDoubleFBO(dyeRes.width, dyeRes.height, rgba.internalFormat, rgba.format, texType, filtering);
    else
        dye = resizeDoubleFBO(dye, dyeRes.width, dyeRes.height, rgba.internalFormat, rgba.format, texType, filtering);

    if (!velocity)
        velocity = createDoubleFBO(simRes.width, simRes.height, rg.internalFormat, rg.format, texType, filtering);
    else
        velocity = resizeDoubleFBO(velocity, simRes.width, simRes.height, rg.internalFormat, rg.format, texType, filtering);

    divergence = createFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);
    curl       = createFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);
    pressure   = createDoubleFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);

    if (config.BLOOM)   initBloomFramebuffers();
    if (config.SUNRAYS) initSunraysFramebuffers();

    if (!ditheringTexture) ditheringTexture = createNoiseTexture();
}
function initBloomFramebuffers() {
    const res = getResolution(config.BLOOM_RESOLUTION);
    const texType = ext.halfFloatTexType;
    const rgba = ext.formatRGBA;
    const filtering = ext.supportLinearFiltering ? gl.LINEAR : gl.NEAREST;
    bloom = createFBO(res.width, res.height, rgba.internalFormat, rgba.format, texType, filtering);
    bloomFramebuffers = [];
    for (let i = 0; i < config.BLOOM_ITERATIONS; i++) {
        const w = res.width >> (i + 1), h = res.height >> (i + 1);
        if (w < 2 || h < 2) break;
        bloomFramebuffers.push(createFBO(w, h, rgba.internalFormat, rgba.format, texType, filtering));
    }
}
function initSunraysFramebuffers() {
    const res = getResolution(config.SUNRAYS_RESOLUTION);
    const texType = ext.halfFloatTexType;
    const r = ext.formatR;
    const filtering = ext.supportLinearFiltering ? gl.LINEAR : gl.NEAREST;
    sunrays     = createFBO(res.width, res.height, r.internalFormat, r.format, texType, filtering);
    sunraysTemp = createFBO(res.width, res.height, r.internalFormat, r.format, texType, filtering);
}

/* ---------- 全屏四边形 ---------- */
const blit = (() => {
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(0);
    return (target) => {
        if (target == null) {
            gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        } else {
            gl.viewport(0, 0, target.width, target.height);
            gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
        }
        gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
    };
})();

/* ============================================================
   颜色（★ 恢复原版完全随机色相）
   ============================================================ */
function HSVtoRGB(h, s, v) {
    let r, g, b, i, f, p, q, t;
    i = Math.floor(h * 6);
    f = h * 6 - i;
    p = v * (1 - s);
    q = v * (1 - f * s);
    t = v * (1 - (1 - f) * s);
    switch (i % 6) {
        case 0: r = v, g = t, b = p; break;
        case 1: r = q, g = v, b = p; break;
        case 2: r = p, g = v, b = t; break;
        case 3: r = p, g = q, b = v; break;
        case 4: r = t, g = p, b = v; break;
        default: r = v, g = p, b = q;
    }
    return { r, g, b };
}
function generateColor() {
    const c = HSVtoRGB(Math.random(), 1.0, 1.0);
    c.r *= 0.15; c.g *= 0.15; c.b *= 0.15;
    return c;
}

/* ============================================================
   指针
   ============================================================ */
function pointerPrototype() {
    this.id = -1;
    this.texcoordX = 0; this.texcoordY = 0;
    this.prevTexcoordX = 0; this.prevTexcoordY = 0;
    this.deltaX = 0; this.deltaY = 0;
    this.down = false; this.moved = false;
    this.color = { r: 0, g: 0, b: 0 };
}
const pointers = [new pointerPrototype()];
const splatStack = [];

let canvasAspect = 1;
let cssScale = 1;

/* ============================================================
   主循环
   ============================================================ */
let lastUpdateTime = performance.now();
let colorUpdateTimer = 0;
let rafId = null;

function update() {
    const dt = calcDeltaTime();
    updateColors(dt);
    applyInputs();
    step(dt);
    render(null);
    rafId = requestAnimationFrame(update);
}

function calcDeltaTime() {
    const now = performance.now();
    let dt = (now - lastUpdateTime) / 1000;
    dt = Math.min(dt, 0.016666);
    lastUpdateTime = now;
    return dt;
}

function updateColors(dt) {
    if (!config.COLORFUL) return;
    colorUpdateTimer += dt * config.COLOR_UPDATE_SPEED;
    if (colorUpdateTimer >= 1) {
        colorUpdateTimer = wrap(colorUpdateTimer, 0, 1);
        pointers.forEach(p => { p.color = generateColor(); });
    }
}

function applyInputs() {
    if (splatStack.length > 0)
        multipleSplats(splatStack.pop());

    pointers.forEach(p => {
        if (p.moved) {
            p.moved = false;
            splatPointer(p);
        }
    });
}

function step(dt) {
    gl.disable(gl.BLEND);

    curlProgram.bind();
    gl.uniform2f(curlProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(curlProgram.uniforms.uVelocity, velocity.read.attach(0));
    blit(curl);

    vorticityProgram.bind();
    gl.uniform2f(vorticityProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(vorticityProgram.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(vorticityProgram.uniforms.uCurl, curl.attach(1));
    gl.uniform1f(vorticityProgram.uniforms.curl, config.CURL);
    gl.uniform1f(vorticityProgram.uniforms.dt, dt);
    blit(velocity.write); velocity.swap();

    divergenceProgram.bind();
    gl.uniform2f(divergenceProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(divergenceProgram.uniforms.uVelocity, velocity.read.attach(0));
    blit(divergence);

    clearProgram.bind();
    gl.uniform1i(clearProgram.uniforms.uTexture, pressure.read.attach(0));
    gl.uniform1f(clearProgram.uniforms.value, config.PRESSURE);
    blit(pressure.write); pressure.swap();

    pressureProgram.bind();
    gl.uniform2f(pressureProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(pressureProgram.uniforms.uDivergence, divergence.attach(0));
    for (let i = 0; i < config.PRESSURE_ITERATIONS; i++) {
        gl.uniform1i(pressureProgram.uniforms.uPressure, pressure.read.attach(1));
        blit(pressure.write); pressure.swap();
    }

    gradientSubtractProgram.bind();
    gl.uniform2f(gradientSubtractProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(gradientSubtractProgram.uniforms.uPressure, pressure.read.attach(0));
    gl.uniform1i(gradientSubtractProgram.uniforms.uVelocity, velocity.read.attach(1));
    blit(velocity.write); velocity.swap();

    advectionProgram.bind();
    gl.uniform2f(advectionProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    if (!ext.supportLinearFiltering)
        gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, velocity.texelSizeX, velocity.texelSizeY);
    const velocityId = velocity.read.attach(0);
    gl.uniform1i(advectionProgram.uniforms.uVelocity, velocityId);
    gl.uniform1i(advectionProgram.uniforms.uSource, velocityId);
    gl.uniform1f(advectionProgram.uniforms.dt, dt);
    gl.uniform1f(advectionProgram.uniforms.dissipation, config.VELOCITY_DISSIPATION);
    blit(velocity.write); velocity.swap();

    if (!ext.supportLinearFiltering)
        gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, dye.texelSizeX, dye.texelSizeY);
    gl.uniform1i(advectionProgram.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(advectionProgram.uniforms.uSource, dye.read.attach(1));
    gl.uniform1f(advectionProgram.uniforms.dissipation, config.DENSITY_DISSIPATION);
    blit(dye.write); dye.swap();
}

function render(target) {
    if (config.BLOOM) applyBloom(dye.read, bloom);
    if (config.SUNRAYS) {
        applySunrays(dye.read, dye.write, sunrays);
        blur(sunrays, sunraysTemp, 1);
    }

    gl.disable(gl.BLEND);

    const width  = target == null ? gl.drawingBufferWidth  : target.width;
    const height = target == null ? gl.drawingBufferHeight : target.height;

    displayProgram.bind();
    if (displayProgram.uniforms.texelSize)
        gl.uniform2f(displayProgram.uniforms.texelSize, 1.0 / width, 1.0 / height);
    if (displayProgram.uniforms.uBackColor)
        gl.uniform3f(displayProgram.uniforms.uBackColor,
            config.BACK_COLOR.r / 255, config.BACK_COLOR.g / 255, config.BACK_COLOR.b / 255);

    gl.uniform1i(displayProgram.uniforms.uTexture, dye.read.attach(0));
    if (config.BLOOM && bloom && displayProgram.uniforms.uBloom) {
        gl.uniform1i(displayProgram.uniforms.uBloom, bloom.attach(1));
        if (ditheringTexture && displayProgram.uniforms.uDithering) {
            gl.uniform1i(displayProgram.uniforms.uDithering, ditheringTexture.attach(2));
            const scale = { x: width / ditheringTexture.width, y: height / ditheringTexture.height };
            if (displayProgram.uniforms.ditherScale)
                gl.uniform2f(displayProgram.uniforms.ditherScale, scale.x, scale.y);
        }
    }
    if (config.SUNRAYS && sunrays && displayProgram.uniforms.uSunrays)
        gl.uniform1i(displayProgram.uniforms.uSunrays, sunrays.attach(3));

    blit(target);
}

function applyBloom(source, destination) {
    if (!bloomFramebuffers || bloomFramebuffers.length < 2) return;
    let last = destination;

    gl.disable(gl.BLEND);
    bloomPrefilterProgram.bind();
    const knee = config.BLOOM_THRESHOLD * config.BLOOM_SOFT_KNEE + 0.0001;
    gl.uniform3f(bloomPrefilterProgram.uniforms.curve,
        config.BLOOM_THRESHOLD - knee, knee * 2.0, 0.25 / knee);
    gl.uniform1f(bloomPrefilterProgram.uniforms.threshold, config.BLOOM_THRESHOLD);
    gl.uniform1i(bloomPrefilterProgram.uniforms.uTexture, source.attach(0));
    blit(last);

    bloomBlurProgram.bind();
    for (let i = 0; i < bloomFramebuffers.length; i++) {
        const dest = bloomFramebuffers[i];
        gl.uniform2f(bloomBlurProgram.uniforms.texelSize, last.texelSizeX, last.texelSizeY);
        gl.uniform1i(bloomBlurProgram.uniforms.uTexture, last.attach(0));
        blit(dest);
        last = dest;
    }

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    for (let i = bloomFramebuffers.length - 2; i >= 0; i--) {
        const base = bloomFramebuffers[i];
        gl.uniform2f(bloomBlurProgram.uniforms.texelSize, last.texelSizeX, last.texelSizeY);
        gl.uniform1i(bloomBlurProgram.uniforms.uTexture, last.attach(0));
        blit(base);
        last = base;
    }
    gl.disable(gl.BLEND);

    bloomFinalProgram.bind();
    gl.uniform2f(bloomFinalProgram.uniforms.texelSize, last.texelSizeX, last.texelSizeY);
    gl.uniform1i(bloomFinalProgram.uniforms.uTexture, last.attach(0));
    gl.uniform1f(bloomFinalProgram.uniforms.intensity, config.BLOOM_INTENSITY);
    blit(destination);
}

/* ★ 原版 applySunrays：mask → 径向光线 →（render 里再 blur 1 次） */
function applySunrays(source, mask, destination) {
    if (!sunraysTemp) return;
    gl.disable(gl.BLEND);

    sunraysMaskProgram.bind();
    gl.uniform1i(sunraysMaskProgram.uniforms.uTexture, source.attach(0));
    blit(mask);

    sunraysProgram.bind();
    gl.uniform1f(sunraysProgram.uniforms.weight, config.SUNRAYS_WEIGHT);
    gl.uniform1i(sunraysProgram.uniforms.uTexture, mask.attach(0));
    blit(destination);
}

function blur(target, temp, iterations) {
    blurProgram.bind();
    for (let i = 0; i < iterations; i++) {
        gl.uniform2f(blurProgram.uniforms.texelSize, target.texelSizeX, 0.0);
        gl.uniform1i(blurProgram.uniforms.uTexture, target.attach(0));
        blit(temp);

        gl.uniform2f(blurProgram.uniforms.texelSize, 0.0, target.texelSizeY);
        gl.uniform1i(blurProgram.uniforms.uTexture, temp.attach(0));
        blit(target);
    }
}

/* ============================================================
   交互（★ 原版：点击不爆炸，仅拖动产生烟雾）
   ============================================================ */
function splatPointer(pointer) {
    const dx = pointer.deltaX * config.SPLAT_FORCE;
    const dy = pointer.deltaY * config.SPLAT_FORCE;
    splat(pointer.texcoordX, pointer.texcoordY, dx, dy, pointer.color);
}

function splat(x, y, dx, dy, color) {
    splatProgram.bind();

    gl.uniform1i(splatProgram.uniforms.uTarget, velocity.read.attach(0));
    gl.uniform1f(splatProgram.uniforms.aspectRatio, canvasAspect);
    gl.uniform2f(splatProgram.uniforms.point, x, y);
    gl.uniform3f(splatProgram.uniforms.color, dx, dy, 0.0);
    gl.uniform1f(splatProgram.uniforms.radius, correctRadius(config.SPLAT_RADIUS / 100.0));
    blit(velocity.write); velocity.swap();

    gl.uniform1i(splatProgram.uniforms.uTarget, dye.read.attach(0));
    gl.uniform3f(splatProgram.uniforms.color, color.r, color.g, color.b);
    blit(dye.write); dye.swap();
}

function correctRadius(radius) {
    return canvasAspect > 1 ? radius * canvasAspect : radius;
}

/* ★ 原版随机爆炸：颜色 ×10、速度 1000 随机方向 */
function multipleSplats(amount) {
    for (let i = 0; i < amount; i++) {
        const color = generateColor();
        color.r *= 10.0; color.g *= 10.0; color.b *= 10.0;
        const x = Math.random();
        const y = Math.random();
        const dx = 1000 * (Math.random() - 0.5);
        const dy = 1000 * (Math.random() - 0.5);
        splat(x, y, dx, dy, color);
    }
}

function updatePointerDownData(pointer, id, posX, posY) {
    pointer.id = id; pointer.down = true; pointer.moved = false;
    pointer.texcoordX = posX / canvas.width;
    pointer.texcoordY = 1.0 - posY / canvas.height;
    pointer.prevTexcoordX = pointer.texcoordX;
    pointer.prevTexcoordY = pointer.texcoordY;
    pointer.deltaX = 0; pointer.deltaY = 0;
    pointer.color = generateColor();
}
function updatePointerMoveData(pointer, posX, posY) {
    pointer.prevTexcoordX = pointer.texcoordX;
    pointer.prevTexcoordY = pointer.texcoordY;
    pointer.texcoordX = posX / canvas.width;
    pointer.texcoordY = 1.0 - posY / canvas.height;
    pointer.deltaX = correctDeltaX(pointer.texcoordX - pointer.prevTexcoordX);
    pointer.deltaY = correctDeltaY(pointer.texcoordY - pointer.prevTexcoordY);
    pointer.moved = Math.abs(pointer.deltaX) > 0 || Math.abs(pointer.deltaY) > 0;
}
function updatePointerUpData(pointer) { pointer.down = false; }

function correctDeltaX(delta) { return canvasAspect < 1 ? delta * canvasAspect : delta; }
function correctDeltaY(delta) { return canvasAspect > 1 ? delta / canvasAspect : delta; }
function scaleByPixelRatio(input) { return Math.floor(input * cssScale); }
function wrap(value, min, max) {
    const range = max - min;
    return range === 0 ? min : (value - min) % range + min;
}

/* ---------- 事件 ---------- */
canvas.addEventListener('mousedown', e => {
    const rect = canvas.getBoundingClientRect();
    const posX = scaleByPixelRatio(e.clientX - rect.left);
    const posY = scaleByPixelRatio(e.clientY - rect.top);
    let pointer = pointers.find(p => p.id === -1);
    if (!pointer) { pointer = new pointerPrototype(); pointers.push(pointer); }
    updatePointerDownData(pointer, -1, posX, posY);
});
canvas.addEventListener('mousemove', e => {
    const pointer = pointers.find(p => p.id === -1);
    if (!pointer || !pointer.down) return;
    const rect = canvas.getBoundingClientRect();
    updatePointerMoveData(pointer,
        scaleByPixelRatio(e.clientX - rect.left),
        scaleByPixelRatio(e.clientY - rect.top));
});
window.addEventListener('mouseup', () => {
    const pointer = pointers.find(p => p.id === -1);
    if (pointer) updatePointerUpData(pointer);
});
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    while (e.targetTouches.length >= pointers.length) pointers.push(new pointerPrototype());
    for (let i = 0; i < e.targetTouches.length; i++) {
        const touch = e.targetTouches[i];
        updatePointerDownData(pointers[i + 1], touch.identifier,
            scaleByPixelRatio(touch.clientX - rect.left),
            scaleByPixelRatio(touch.clientY - rect.top));
    }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    for (let i = 0; i < e.targetTouches.length; i++) {
        const touch = e.targetTouches[i];
        const pointer = pointers[i + 1];
        if (!pointer || !pointer.down) continue;
        updatePointerMoveData(pointer,
            scaleByPixelRatio(touch.clientX - rect.left),
            scaleByPixelRatio(touch.clientY - rect.top));
    }
}, { passive: false });
window.addEventListener('touchend', e => {
    for (let i = 0; i < e.changedTouches.length; i++) {
        const pointer = pointers.find(p => p.id === e.changedTouches[i].identifier);
        if (pointer) updatePointerUpData(pointer);
    }
});
window.addEventListener('keydown', e => {
    if (e.key === ' ') splatStack.push(parseInt(Math.random() * 20) + 5);
});

/* ============================================================
   尺寸
   ============================================================ */
function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    let w = Math.floor(window.innerWidth * dpr);
    let h = Math.floor(window.innerHeight * dpr);
    if (w <= 0 || h <= 0) return false;

    const pixels = w * h;
    if (pixels > config.MAX_PIXELS) {
        const scale = Math.sqrt(config.MAX_PIXELS / pixels);
        w = Math.max(1, Math.floor(w * scale));
        h = Math.max(1, Math.floor(h * scale));
    }
    cssScale = w / window.innerWidth;

    if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
        canvasAspect = w / h;
        return true;
    }
    return false;
}

/* ============================================================
   启动（★ 原版：5~24 个随机爆炸）
   ============================================================ */
resizeCanvas();
initFramebuffers();
multipleSplats(parseInt(Math.random() * 20) + 5);
rafId = requestAnimationFrame(update);

let resizeTimer = null;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
        if (resizeCanvas()) {
            initFramebuffers();
            multipleSplats(parseInt(Math.random() * 20) + 5);
        }
    }, 120);
});

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
    } else if (rafId === null) {
        lastUpdateTime = performance.now();
        rafId = requestAnimationFrame(update);
    }
});

})();
</script>
</body>
</html>
