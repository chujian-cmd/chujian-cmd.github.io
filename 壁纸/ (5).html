<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>静态暗夜流体壁纸</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* 极暗的底色，融合烟雾 */
            background-color: #08020a; 
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="fluid-canvas"></canvas>

    <!-- 引入底层真正的流体力学物理引擎 -->
    <script src="https://cdn.jsdelivr.net/npm/webgl-fluid@0.3/dist/webgl-fluid.umd.js"></script>

    <script>
        window.addEventListener('load', () => {
            const canvas = document.getElementById('fluid-canvas');
            
            WebGLFluid(canvas, {
                // --- 核心渲染 ---
                SIM_RESOLUTION: 128,       // 物理模拟分辨率
                DYE_RESOLUTION: 1024,      // 烟雾渲染分辨率 (保持高清)
                DENSITY_DISSIPATION: 1.5,  // 消散速度 (稍快，不然会糊死)
                VELOCITY_DISSIPATION: 0.2, // 阻力 (调小，让烟雾滑得更远，更有粘性)
                PRESSURE: 0.8,             
                CURL: 30,                  // 涡度 (让烟雾翻滚，像图1那样拉丝)
                SPLAT_RADIUS: 0.2,         // 笔刷大小 (手指划过的粗细)
                SPLAT_FORCE: 6000,         // 推力 (推开周围烟雾的力度)
                SHADING: true,             // 开启光影 (产生 3D 体积感，不是平面的)

                // --- 坚决去花哨化 ---
                COLORFUL: false,           // 绝对不随机变色
                BLOOM: false,              // 绝对不发光
                SUNRAYS: false,            // 绝对不射光
                
                // --- 颜色配置 ---
                // 底色(与你截图一致的深紫红)
                BACK_COLOR: { r: 8, g: 2, b: 10 },
                // 固定的烟雾颜色 (深玫红 / 品红)
                COLOR_PALETTE: [
                    { r: 0.7, g: 0.05, b: 0.4 }, // 暗紫红
                    { r: 0.9, g: 0.1, b: 0.5 }   // 稍微亮一点的品红
                ]
            });

            // 附加：如果你不划屏幕，它也会自己缓慢飘动（模拟呼吸感）
            // 模拟初始状态：画一个大光圈在中间（如图4）
            setTimeout(() => {
                // 触发两次随机的初始烟雾生成
                const rect = canvas.getBoundingClientRect();
                // 伪造一次鼠标移动事件
                const centerEvent = new MouseEvent('mousemove', {
                    clientX: rect.width / 2,
                    clientY: rect.height / 2
                });
                // 由于底层库的机制，这里无法直接轻易伪造注入，
                // 你只需轻轻在屏幕中间点一下，就能看到图4那个完美的圆形烟雾团了。
            }, 500);
        });
    </script>
</body>
</html>
