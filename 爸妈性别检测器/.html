<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>爸妈性别检测器 · 复古版</title>
  <style>
    /* 复古、干净、无花哨 —— 老式终端/打字机风格 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1e1c1a; /* 深灰褐，像老式CRT屏幕 */
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, 'IBM Plex Mono', 'VT323', monospace;
      padding: 1.5rem;
    }

    /* 主卡片：米白/旧纸色，轻微粗糙边角 */
    .detector {
      background: #eae4d7;      /* 旧纸张/米白 */
      max-width: 540px;
      width: 100%;
      padding: 2.8rem 2rem 2.2rem 2rem;
      border-radius: 0;          /* 直角，复古感 */
      box-shadow: 8px 8px 0 #0f0e0c, 0 0 0 2px #3a3530 inset; /* 硬阴影 + 内框，像老式硬件 */
      border: 2px solid #2d2924;
      transition: none;
    }

    /* 标题区：打字机字体 */
    .title-section {
      text-align: center;
      margin-bottom: 2.4rem;
      border-bottom: 2px dashed #7a6e62;
      padding-bottom: 0.9rem;
    }

    .title-section h1 {
      font-size: 2.2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #2f2a24;
      font-weight: 700;
      font-family: 'Courier New', Courier, monospace;
      word-spacing: 4px;
    }

    .title-section .sub {
      font-size: 0.85rem;
      color: #5e554b;
      margin-top: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 400;
    }

    /* 显示区域 —— 像老式仪表盘 */
    .display-panel {
      background: #d6cec0;       /* 旧布/旧塑料 */
      border: 3px solid #4a423a;
      padding: 1.2rem 1rem;
      margin-bottom: 2rem;
      box-shadow: inset 3px 3px 8px #b1a798, inset -3px -3px 8px #f3ede4;
      border-radius: 0;
    }

    .display-screen {
      background: #1f1d1b;
      color: #b9d8b3;           /* 老式绿字，低饱和 */
      font-size: 3.6rem;
      line-height: 1.3;
      text-align: center;
      padding: 1rem 0.5rem;
      letter-spacing: 6px;
      border: 2px solid #2e2a25;
      font-weight: 700;
      font-family: 'Courier New', Courier, monospace;
      text-transform: uppercase;
      box-shadow: inset 0 0 12px #000000;
      transition: none;
      min-height: 8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-word;
    }

    /* 待机时的短横线/占位符 */
    .display-screen.idle {
      color: #6d7a6a;
      font-size: 2.8rem;
      letter-spacing: 12px;
    }

    /* 按钮区域 —— 老式按钮 */
    .button-section {
      display: flex;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .detect-btn {
      background: #b7aa9a;
      border: 3px solid #3d352e;
      color: #1f1b17;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.6rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 1rem 2.6rem;
      letter-spacing: 5px;
      cursor: pointer;
      box-shadow: 5px 5px 0 #2d2822, 0 0 0 1px #6b5f53 inset;
      transition: all 0.02s linear; /* 几乎瞬时，复古点击感 */
      border-radius: 0;
      line-height: 1;
    }

    .detect-btn:active {
      transform: translate(4px, 4px);
      box-shadow: 1px 1px 0 #2d2822, 0 0 0 1px #6b5f53 inset;
    }

    .detect-btn:focus-visible {
      outline: 2px solid #1f1b17;
      outline-offset: 3px;
    }

    /* 结果注释/小字 —— 像老式机器的标签 */
    .result-note {
      text-align: center;
      font-size: 0.95rem;
      color: #4f463d;
      background: #ddd5c8;
      border: 1px solid #7f7264;
      padding: 0.6rem 0.8rem;
      letter-spacing: 1px;
      font-weight: 400;
      text-transform: uppercase;
      box-shadow: 2px 2px 0 #9e9183;
      margin-bottom: 1.2rem;
    }

    /* 极简计数器/统计 —— 可选复古信息 */
    .stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #5c5248;
      border-top: 2px solid #9b8e80;
      padding-top: 1rem;
      margin-top: 0.8rem;
      letter-spacing: 1px;
    }

    .stats span {
      background: #e2d9cd;
      padding: 0.25rem 0.8rem;
      border: 1px solid #8b7e70;
    }

    /* 没有任何花哨的渐变、动画、圆角 —— 符合复古不花哨要求 */
    @media (max-width: 480px) {
      .detector {
        padding: 1.8rem 1.2rem 1.6rem 1.2rem;
      }
      .title-section h1 {
        font-size: 1.6rem;
        letter-spacing: 1px;
      }
      .display-screen {
        font-size: 2.4rem;
        letter-spacing: 3px;
        min-height: 6rem;
      }
      .detect-btn {
        font-size: 1.3rem;
        padding: 0.9rem 1.2rem;
        letter-spacing: 3px;
      }
      .result-note {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="detector">
    <!-- 标题 -->
    <div class="title-section">
      <h1>爸妈性别检测器</h1>
      <div class="sub">◆ 复古型号 · 可靠判定 ◆</div>
    </div>

    <!-- 结果显示区 -->
    <div class="display-panel">
      <div class="display-screen idle" id="displayScreen">——</div>
    </div>

    <!-- 检测按钮 -->
    <div class="button-section">
      <button class="detect-btn" id="detectBtn">检 测</button>
    </div>

    <!-- 附加注释 (复古机器标签) -->
    <div class="result-note" id="resultNote">
      ↑ 按下按钮，识别爸妈性别
    </div>

    <!-- 极简统计，增添真实检测器感觉 -->
    <div class="stats">
      <span id="dadCount">爸爸: 0</span>
      <span id="momCount">妈妈: 0</span>
    </div>
  </div>

  <script>
    (function() {
      // 获取DOM元素
      const displayScreen = document.getElementById('displayScreen');
      const detectBtn = document.getElementById('detectBtn');
      const resultNote = document.getElementById('resultNote');
      const dadCountSpan = document.getElementById('dadCount');
      const momCountSpan = document.getElementById('momCount');

      // 统计计数器 (纯粹装饰)
      let dadCount = 0;
      let momCount = 0;

      // 音效？不要，保持简洁

      // 核心检测函数
      function detectParentGender() {
        // 随机：true -> 爸爸, false -> 妈妈
        const isDad = Math.random() < 0.5;  // 各50%

        // 更新显示 —— 文字简单直接
        if (isDad) {
          displayScreen.textContent = '爸爸';
          displayScreen.classList.remove('idle');
          // 复古硬反馈
          resultNote.textContent = '>> 检测结果：爸爸 (男性) <<';
          // 增加计数
          dadCount++;
          dadCountSpan.textContent = `爸爸: ${dadCount}`;
        } else {
          displayScreen.textContent = '妈妈';
          displayScreen.classList.remove('idle');
          resultNote.textContent = '>> 检测结果：妈妈 (女性) <<';
          momCount++;
          momCountSpan.textContent = `妈妈: ${momCount}`;
        }

        // 微小的复古机械感：临时更换按钮文字，然后快速恢复（几乎不可察觉，但有趣）
        // 不改变样式，只改文字模拟机械反馈
        detectBtn.textContent = '···';
        setTimeout(() => {
          detectBtn.textContent = '检 测';
        }, 70);
        // 注意：setTimeout 很短，几乎闪烁一下，但不会花哨
      }

      // 绑定点击事件
      detectBtn.addEventListener('click', detectParentGender);

      // 键盘可访问性：按空格/回车也能触发（按钮原生支持，但防止误触）
      // 无需额外处理

      // 初始状态 (已经通过html显示——)
      // 确保displayScreen没有idle时的字体大小合适
      // 第一次检测时移除idle类，但无需额外操作

      // 额外：如果点击后一直有结果，没问题。
      // 可以再提供一个隐性重置效果——不需要。   
    })();
  </script>
</body>
</html>
