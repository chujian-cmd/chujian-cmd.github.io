<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>♬ bytebeat · Blue Glass</title>
<style>
:root {
  --primary: #4facfe;
  --accent: #00f2fe;
  --glass-bg: rgba(10, 15, 30, 0.85);
  --glass-card: rgba(255, 255, 255, 0.06);
  --glass-border: rgba(255, 255, 255, 0.14);
  --text: #eaf6ff;
  --subtext: #91a4b8;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: system-ui, -apple-system, sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 10% 10%, rgba(79, 172, 254, 0.45), transparent 28%),
    radial-gradient(circle at 90% 20%, rgba(0, 242, 254, 0.35), transparent 32%),
    linear-gradient(135deg, #050a18 0%, #081229 45%, #050c22 100%);
  background-attachment: fixed;
  padding: 18px;
}

.app {
  max-width: 900px;
  margin: 0 auto;
}

.hero {
  text-align: center;
  margin-bottom: 24px;
}

.hero h1 {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: 0.5px;
  background: linear-gradient(135deg, #ffffff, #a8d8ff);
  -webkit-background-clip: text;
  color: transparent;
}

.hero p {
  color: var(--subtext);
  margin-top: 8px;
  font-size: 14px;
}

.card {
  background: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.08),
    rgba(255, 255, 255, 0.03)
  );
  border: 1px solid var(--glass-border);
  border-radius: 26px;
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.35),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);
  padding: 18px;
  margin-bottom: 18px;
}

textarea {
  width: 100%;
  min-height: 150px;
  background: rgba(0, 0, 0, 0.18);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 16px;
  color: #eaf6ff;
  padding: 14px;
  font-family: 'Courier New', monospace;
  font-size: 13px;
  line-height: 1.55;
  resize: vertical;
  tab-size: 4;
}

textarea:focus {
  outline: none;
  border-color: rgba(79, 172, 254, 0.45);
  box-shadow: 0 0 0 2px rgba(79, 172, 254, 0.14);
}

canvas {
  width: 100%;
  height: 140px;
  background: rgba(0, 4, 12, 0.45);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 16px;
  margin-top: 12px;
  display: block;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-top: 14px;
}

button {
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 14px;
  color: #eaf6ff;
  padding: 9px 18px;
  font-size: 14px;
  cursor: pointer;
  background: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.12),
    rgba(255, 255, 255, 0.05)
  );
  transition: 0.22s ease;
}

button:hover {
  transform: translateY(-1px);
  border-color: rgba(79, 172, 254, 0.35);
  background: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.18),
    rgba(255, 255, 255, 0.08)
  );
}

button:active {
  transform: translateY(0);
}

button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  transform: none;
}

select,
input[type='number'] {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  color: #eaf6ff;
  padding: 7px 10px;
  font-size: 13px;
}

select:focus,
input:focus {
  outline: none;
  border-color: rgba(79, 172, 254, 0.35);
}

input[type='range'] {
  width: 100px;
  accent-color: #4facfe;
}

.info {
  color: var(--subtext);
  font-size: 12px;
  margin-left: auto;
  white-space: nowrap;
}

.error {
  color: #ff7b7b;
  min-height: 24px;
  margin-top: 8px;
  font-size: 13px;
}

@media (max-width: 640px) {
  body {
    padding: 12px;
  }

  .card {
    padding: 14px;
  }

  .hero h1 {
    font-size: 22px;
  }

  textarea {
    min-height: 120px;
    font-size: 12px;
  }

  canvas {
    height: 120px;
  }
}
</style>
</head>

<body>
<div class="app">
  <div class="hero">
    <h1>♬ bytebeat · Blue Glass</h1>
    <p>轻量、干净、能出声</p>
  </div>

  <div class="card">
    <textarea id="code" spellcheck="false">
A='1111100000011111111111111111111111111111111111111111111000001111111001111111110001000000000000001111110000000000000000000111111111111001111110000000000000000000000000000000000',
n=1.26,
t||(a=b=d=e=0),
c=a+=b+=(n*2*2**([1,1,1,7,7,7,8,8,8,8,10,12,12,12,10,10,3,3,3,8,8,[7.8,7.5,7.3,7.1][t>>10&3],7,7,7,7,15,10,10,10,7,7,5,5,5,12,12,12,15,15,15,15,12,12,10,10,12,12,0,0,0,8,8,8,7,7,7,7,3,3,0,0,3,3,1,1,1,7,7,7,8,8,8,8,10,12,12,12,10,10,3,3,3,8,8,[7.8,7.5,7.3,7.1][t>>10&3],7,7,7,7,15,10,10,10,7,7,5,5,5,17,17,17,15,15,15,15,12,12,10,10,12,12,8,8,8,20,20,20,19,19,19,19,17,17,15,12,10,12][t>>12&127]/12)-b)/800,
g=d+=e+=(n*2**([1,s=[3,3,3,[3,4][t>>13&1]][t>>14&3],5,[0,0,0,[-2,0][t>>13&1]][t>>14&3],1,s,5,[8,8,8,[10,12][t>>13&1]][t>>14&3]][t>>16&7]/12)-e)/400,
A[(c*175>>8)%175]/1.3+(A[(g*175>>8)%175]/2+(A[(g/2*175>>8)%175]/3-1))*(-(t+'00055522227744440005552222774422'[t>>12&31]*4096)>>7&255)/200+Math.sin(t*n*Math.PI/512*2**.25)*(-t>>13&1)*0.1
    </textarea>

    <canvas id="canvas" width="800" height="140"></canvas>

    <div class="controls">
      <button id="playBtn">▶ 播放</button>
      <button id="pauseBtn" disabled>⏸ 暂停</button>
      <button id="stopBtn" disabled>⏹ 停止</button>

      <select id="mode">
        <option value="b" selected>bytebeat</option>
        <option value="s">signed</option>
        <option value="f">floatbeat</option>
      </select>

      <select id="sampleRate">
        <option value="8000">8 kHz</option>
        <option value="11025">11 kHz</option>
        <option value="16000">16 kHz</option>
        <option value="22050">22 kHz</option>
        <option value="32000">32 kHz</option>
        <option value="44100" selected>44.1 kHz</option>
        <option value="48000">48 kHz</option>
      </select>

      <span>÷<input id="divisor" type="number" min="1" value="1" style="width:46px" /></span>

      <span>🔊<input id="volume" type="range" min="0" max="100" value="35" /></span>

      <span class="info" id="info">t=0 · 0.00s</span>
    </div>

    <div id="error" class="error"></div>
  </div>
</div>

<script>
const codeEl = document.getElementById('code');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const playBtn = document.getElementById('playBtn');
const pauseBtn = document.getElementById('pauseBtn');
const stopBtn = document.getElementById('stopBtn');

const modeEl = document.getElementById('mode');
const sampleRateEl = document.getElementById('sampleRate');
const divisorEl = document.getElementById('divisor');
const volumeEl = document.getElementById('volume');
const infoEl = document.getElementById('info');
const errorEl = document.getElementById('error');

const state = {
  audioCtx: null,
  source: null,
  isPlaying: false,
  rafId: null,
  currentSamples: null,
  currentRate: 44100,
  compileCache: new Map()
};

function cleanCode(code) {
  return code
    .replace(/\/\/.*$/gm, '')
    .replace(/\/\*[\s\S]*?\*\//g, '')
    .trim();
}

function compileBytebeat(code) {
  const key = code;

  if (state.compileCache.has(key)) {
    return state.compileCache.get(key);
  }

  let src = cleanCode(code);

  src = src
    .replace(/\bsin\b/g, 'Math.sin')
    .replace(/\bcos\b/g, 'Math.cos')
    .replace(/\btan\b/g, 'Math.tan')
    .replace(/\babs\b/g, 'Math.abs')
    .replace(/\bfloor\b/g, 'Math.floor')
    .replace(/\bceil\b/g, 'Math.ceil')
    .replace(/\bround\b/g, 'Math.round')
    .replace(/\brandom\b/g, 'Math.random')
    .replace(/\bpow\b/g, 'Math.pow')
    .replace(/\bsqrt\b/g, 'Math.sqrt')
    .replace(/\blog\b/g, 'Math.log')
    .replace(/\bexp\b/g, 'Math.exp')
    .replace(/\bPI\b/g, 'Math.PI');

  let fn;

  try {
    fn = new Function('t', `return (${src}) | 0;`);
  } catch (e) {
    errorEl.textContent = `编译错误: ${e.message}`;
    return null;
  }

  const wrapped = (t) => {
    try {
      return fn(t) | 0;
    } catch (e) {
      errorEl.textContent = `运行错误: ${e.message}`;
      return 0;
    }
  };

  state.compileCache.set(key, wrapped);

  return wrapped;
}

function generateSamples(fn, duration, rate) {
  const len = Math.floor(rate * duration);
  const arr = new Int8Array(len);

  for (let i = 0; i < len; i++) {
    arr[i] = fn(i) & 0xff;
  }

  return arr;
}

function drawWave(samples, rate, time) {
  const w = canvas.width;
  const h = canvas.height;
  const half = h / 2;

  ctx.fillStyle = 'rgba(0, 4, 18, 0.5)';
  ctx.fillRect(0, 0, w, h);

  ctx.strokeStyle = 'rgba(79, 172, 254, 0.85)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();

  const step = Math.floor(samples.length / w) || 1;

  for (let x = 0; x < w; x++) {
    const i = Math.floor(x * step);
    const v = (samples[i] / 128) * half;
    const y = half - v;

    if (x === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }
  }

  ctx.stroke();

  const pos = Math.floor((time * rate) / samples.length * w);

  ctx.strokeStyle = 'rgba(255, 123, 123, 0.9)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pos, 0);
  ctx.lineTo(pos, h);
  ctx.stroke();
}

function startVisual(samples, rate) {
  if (state.rafId) {
    cancelAnimationFrame(state.rafId);
  }

  const startTime = performance.now() / 1000;
  const total = samples.length / rate;

  const draw = () => {
    if (!state.isPlaying) {
      state.rafId = requestAnimationFrame(draw);
      return;
    }

    const now = performance.now() / 1000;
    const t = (now - startTime) % total;

    drawWave(samples, rate, t);

    infoEl.textContent = `t=${Math.floor(t * rate)} · ${t.toFixed(2)}s`;

    state.rafId = requestAnimationFrame(draw);
  };

  draw();
}

async function play() {
  const code = codeEl.value.trim();

  if (!code) {
    errorEl.textContent = '⚠ 请输入 Bytebeat 代码';
    return;
  }

  errorEl.textContent = '';

  if (!state.audioCtx) {
    state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  await state.audioCtx.resume();

  const sr = +sampleRateEl.value;
  const div = +divisorEl.value || 1;
  const rate = Math.floor(sr / div);

  state.currentRate = rate;

  const fn = compileBytebeat(code);

  if (!fn) {
    return;
  }

  const samples = generateSamples(fn, 8, rate);

  state.currentSamples = samples;

  const buf = state.audioCtx.createBuffer(1, samples.length, rate);
  const data = buf.getChannelData(0);
  const vol = +volumeEl.value / 100;

  for (let i = 0; i < samples.length; i++) {
    data[i] = (samples[i] / 128) * vol;
  }

  if (state.source) {
    try {
      state.source.stop();
    } catch (e) {}
  }

  state.source = state.audioCtx.createBufferSource();
  state.source.buffer = buf;
  state.source.loop = true;
  state.source.connect(state.audioCtx.destination);
  state.source.start();

  state.isPlaying = true;

  playBtn.textContent = '▶ 播放中';
  playBtn.disabled = true;
  pauseBtn.disabled = false;
  stopBtn.disabled = false;

  startVisual(samples, rate);
}

function stop() {
  if (state.source) {
    try {
      state.source.stop();
    } catch (e) {}
  }

  state.source = null;
  state.isPlaying = false;

  if (state.rafId) {
    cancelAnimationFrame(state.rafId);
    state.rafId = null;
  }

  playBtn.textContent = '▶ 播放';
  playBtn.disabled = false;
  pauseBtn.disabled = true;
  stopBtn.disabled = true;

  errorEl.textContent = '';
}

function togglePause() {
  if (!state.audioCtx) {
    return;
  }

  if (state.audioCtx.state === 'running') {
    state.audioCtx.suspend();
    pauseBtn.textContent = '▶ 继续';
  } else {
    state.audioCtx.resume();
    pauseBtn.textContent = '⏸ 暂停';
  }
}

playBtn.addEventListener('click', play);
pauseBtn.addEventListener('click', togglePause);
stopBtn.addEventListener('click', stop);
</script>
</body>
</html>
