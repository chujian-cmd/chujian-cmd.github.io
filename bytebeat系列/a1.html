<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频 → Bytebeat 公式</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #0b0d15;
            color: #e8edf5;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
        }
        .card {
            max-width: 860px;
            width: 100%;
            background: #1a1e2b;
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            border: 1px solid #2e3440;
        }
        h1 {
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 0.2rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        h1 small {
            font-size: 0.85rem;
            opacity: 0.6;
            margin-left: auto;
            background: #262d42;
            padding: 0.1rem 1rem;
            border-radius: 30px;
        }
        .sub {
            color: #a6b0c9;
            border-bottom: 1px solid #2b3142;
            padding-bottom: 0.8rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .upload-area {
            background: #10141f;
            border: 2px dashed #334155;
            border-radius: 1.5rem;
            padding: 2rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            margin-bottom: 1.5rem;
        }
        .upload-area:hover {
            background: #161c2b;
            border-color: #5b6d8f;
        }
        .upload-area.drag-over {
            background: #1f2842;
            border-color: #7b9cf8;
        }
        .upload-area input[type="file"] {
            display: none;
        }
        .upload-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
            color: #bcc7e0;
        }
        .upload-label .icon {
            font-size: 2.6rem;
        }
        .file-name {
            margin-top: 0.3rem;
            background: #232a3b;
            padding: 0.15rem 1.2rem;
            border-radius: 40px;
            font-size: 0.9rem;
            color: #d3def5;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem 1.8rem;
            background: #131826;
            padding: 1rem 1.5rem;
            border-radius: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .controls label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.9rem;
            color: #c6d0e6;
        }
        .controls input[type="range"] {
            width: 120px;
            height: 4px;
            -webkit-appearance: none;
            background: #34405a;
            border-radius: 10px;
            outline: none;
        }
        .controls input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #8ab4f8;
            cursor: pointer;
            border: 2px solid #b6d0ff;
        }
        .controls input[type="range"]::-moz-range-thumb {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #8ab4f8;
            cursor: pointer;
            border: 2px solid #b6d0ff;
        }
        .controls .val {
            min-width: 48px;
            font-variant-numeric: tabular-nums;
            text-align: center;
        }
        .btn {
            background: #2c354a;
            border: none;
            color: #eef3fc;
            padding: 0.5rem 1.8rem;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.15s;
            margin-left: auto;
        }
        .btn-primary {
            background: #3f5e9c;
        }
        .btn-primary:hover {
            background: #4f72b5;
        }
        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .formula-box {
            background: #0d111c;
            border-radius: 1.2rem;
            padding: 1.2rem 1.5rem;
            border-left: 4px solid #4f7ac0;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.85rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            color: #d6e2ff;
            min-height: 65px;
        }
        .formula-box .label {
            font-family: system-ui;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6d7fa0;
            margin-bottom: 0.3rem;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            font-size: 0.9rem;
            color: #98a9cc;
            margin-top: 1.2rem;
            padding-top: 0.6rem;
            border-top: 1px solid #262d42;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            background: #4a5a7a;
            flex-shrink: 0;
        }
        .dot.green { background: #4fc3a1; box-shadow: 0 0 8px #4fc3a180; }
        .dot.red { background: #e46a76; }
        .dot.yellow { background: #e8b86d; }
        .footer {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #5c6d8a;
            text-align: center;
        }
        @media (max-width: 600px) {
            .card { padding: 1.2rem; }
            h1 { font-size: 1.4rem; }
            .controls { flex-direction: column; align-items: stretch; }
            .controls label { justify-content: space-between; }
            .btn { margin-left: 0; }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>
        🎛️ Bytebeat 公式生成
        <small>音频 → 数学</small>
    </h1>
    <div class="sub">
        <span>上传音频，自动提取特征生成 Bytebeat 表达式</span>
        <a href="#" onclick="event.preventDefault(); document.getElementById('fileInput').click();" style="color:#8ab4f8;">📂 选择文件</a>
    </div>

    <div class="upload-area" id="dropZone">
        <input type="file" id="fileInput" accept="audio/*">
        <div class="upload-label">
            <span class="icon">🎵</span>
            <span>点击上传或拖拽音频文件</span>
            <span style="font-size:0.8rem; opacity:0.6;">MP3, WAV, OGG, AAC 等</span>
            <span class="file-name" id="fileName">未选择文件</span>
        </div>
    </div>

    <div class="controls">
        <label>
            <span>采样率</span>
            <input type="range" id="sampleRateSlider" min="4000" max="48000" value="22050" step="100">
            <span class="val" id="sampleRateValue">22050</span>
        </label>
        <label>
            <span>点数</span>
            <input type="range" id="lengthSlider" min="256" max="4096" value="1024" step="64">
            <span class="val" id="lengthValue">1024</span>
        </label>
        <button class="btn btn-primary" id="convertBtn">⚡ 转换</button>
    </div>

    <div class="formula-box">
        <div class="label">📐 Bytebeat 公式 (变量 t)</div>
        <code id="formulaCode">等待音频转换…</code>
    </div>

    <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">就绪，请上传音频文件</span>
        <span style="margin-left: auto; opacity:0.5;" id="infoExtra"></span>
    </div>
    <div class="footer">基于音频包络与过零率生成 · 复制公式即可使用</div>
</div>

<script>
    (function() {
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const fileName = document.getElementById('fileName');
        const sampleRateSlider = document.getElementById('sampleRateSlider');
        const sampleRateValue = document.getElementById('sampleRateValue');
        const lengthSlider = document.getElementById('lengthSlider');
        const lengthValue = document.getElementById('lengthValue');
        const convertBtn = document.getElementById('convertBtn');
        const formulaCode = document.getElementById('formulaCode');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const infoExtra = document.getElementById('infoExtra');

        let audioBuffer = null;
        let isProcessing = false;

        sampleRateSlider.addEventListener('input', () => {
            sampleRateValue.textContent = sampleRateSlider.value;
        });
        lengthSlider.addEventListener('input', () => {
            lengthValue.textContent = lengthSlider.value;
        });

        function handleFile(file) {
            if (!file) return;
            fileName.textContent = file.name.length > 30 ? file.name.slice(0, 27) + '…' : file.name;
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const arrayBuffer = e.target.result;
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const buffer = await audioContext.decodeAudioData(arrayBuffer);
                    audioBuffer = buffer;
                    statusDot.className = 'dot green';
                    statusText.textContent = '✅ 已加载: ' + file.name;
                    infoExtra.textContent = (buffer.duration.toFixed(1)) + 's, ' + buffer.numberOfChannels + 'ch';
                    performConversion(buffer);
                } catch (err) {
                    statusDot.className = 'dot red';
                    statusText.textContent = '❌ 解码失败: ' + err.message;
                    audioBuffer = null;
                    formulaCode.textContent = '音频解析错误';
                }
            };
            reader.readAsArrayBuffer(file);
        }

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                handleFile(fileInput.files[0]);
            }
            fileInput.value = '';
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type.startsWith('audio/')) {
                handleFile(files[0]);
            } else {
                statusDot.className = 'dot red';
                statusText.textContent = '⚠️ 请拖拽音频文件';
            }
        });
        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        function performConversion(buffer) {
            if (!buffer) return;
            if (isProcessing) return;
            isProcessing = true;
            convertBtn.disabled = true;
            statusDot.className = 'dot yellow';
            statusText.textContent = '⏳ 分析中…';

            setTimeout(() => {
                try {
                    const targetRate = parseInt(sampleRateSlider.value, 10);
                    const length = parseInt(lengthSlider.value, 10);

                    const channelData = buffer.getChannelData(0);
                    const origRate = buffer.sampleRate;
                    const step = Math.max(1, Math.floor(origRate / targetRate));
                    const total = Math.min(channelData.length, length * 4);
                    const sampled = [];
                    for (let i = 0; i < total && sampled.length < length * 2; i += step) {
                        sampled.push(channelData[i]);
                    }
                    while (sampled.length < length) sampled.push(0);
                    const data = sampled.slice(0, length);
                    while (data.length < length) data.push(0);

                    let sum = 0, max = 0;
                    for (let i = 0; i < data.length; i++) {
                        const v = Math.abs(data[i]);
                        sum += v;
                        if (v > max) max = v;
                    }
                    const avg = sum / data.length;
                    const peak = max;

                    let zeroCrossings = 0;
                    for (let i = 1; i < data.length; i++) {
                        if ((data[i] >= 0 && data[i-1] < 0) || (data[i] < 0 && data[i-1] >= 0)) {
                            zeroCrossings++;
                        }
                    }
                    const zcr = zeroCrossings / data.length;

                    const baseFreq = Math.max(20, Math.min(8000, 80 + avg * 3000 + peak * 2500));
                    const modFreq = Math.max(1, Math.min(200, 15 + zcr * 80 + avg * 120));
                    const amp = Math.max(0.1, Math.min(1.2, 0.2 + avg * 0.9 + peak * 0.6));
                    const waveType = Math.floor((avg * 3 + peak * 2 + zcr * 2) % 4);

                    const f1 = Math.round(baseFreq);
                    const f2 = Math.round(baseFreq * 0.65 + 20);
                    const f3 = Math.round(baseFreq * 1.35 + 10);
                    const m1 = Math.round(modFreq);
                    const m2 = Math.round(modFreq * 0.5 + 5);
                    const a = amp.toFixed(4);

                    let expr = '';
                    if (waveType === 0) {
                        expr = `(((t*${f1}) & (t*${m1})) ^ ((t*${f2})>>4)) + (((t*${f3}) & 255) * ${a})`;
                    } else if (waveType === 1) {
                        expr = `(((t*${f1})>>3) ^ ((t*${f2}) & 127)) + (((t*${m1}) & (t*${m2}))>>2)`;
                    } else if (waveType === 2) {
                        expr = `(((t*${f1}) & 255) * ((t>>4)&15)) ^ ((t*${f2})>>4) + (((t*${m1})&31)*${a})`;
                    } else {
                        expr = `(((t*${f1})>>3) ^ ((t*${f2})&127)) + (((t*${f3})&255)>>1)`;
                    }
                    // 确保输出 0-255
                    const formula = `(${expr}) & 255`;

                    formulaCode.textContent = formula;
                    statusDot.className = 'dot green';
                    statusText.textContent = '✅ 转换完成';
                    infoExtra.textContent = '频率 ' + f1 + 'Hz · 点数 ' + data.length;

                } catch (err) {
                    statusDot.className = 'dot red';
                    statusText.textContent = '❌ 错误: ' + err.message;
                    formulaCode.textContent = '生成失败';
                } finally {
                    isProcessing = false;
                    convertBtn.disabled = false;
                }
            }, 20);
        }

        convertBtn.addEventListener('click', () => {
            if (audioBuffer) {
                performConversion(audioBuffer);
            } else {
                statusDot.className = 'dot red';
                statusText.textContent = '⚠️ 请先上传音频';
                fileInput.click();
            }
        });

        statusDot.className = 'dot';
        statusText.textContent = '就绪，请上传音频文件';
        formulaCode.textContent = '等待音频转换…';
    })();
</script>
</body>
</html>
