<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>♬ bytebeat · 增强版</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      background: #0b0e14;
      color: #d0dbe8;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .app { max-width: 980px; width: 100%; }
    .card {
      background: #121a24;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #263b4e;
      margin-bottom: 16px;
    }
    textarea {
      width: 100%;
      min-height: 160px;
      background: #0f1620;
      border: 1px solid #2b4057;
      border-radius: 8px;
      color: #eef4fa;
      padding: 12px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      resize: vertical;
      tab-size: 4;
      line-height: 1.6;
    }
    canvas {
      width: 100%;
      height: 150px;
      background: #0b111a;
      border-radius: 8px;
      border: 1px solid #243544;
      margin-top: 10px;
      display: block;
    }
    button {
      background: #26323f;
      border: 1px solid #3f556a;
      border-radius: 8px;
      color: #eef4fa;
      padding: 6px 16px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.15s;
    }
    button:hover { background: #31475e; border-color: #6c8eb0; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    select, input {
      background: #1a212b;
      border: 1px solid #33455a;
      border-radius: 6px;
      color: #eef4fa;
      padding: 4px 8px;
      font-size: 13px;
    }
    input[type="range"] { width: 100px; padding: 0; background: transparent; border: none; }
    .flex { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .mt-2 { margin-top: 12px; }
    .error { color: #ff7a5c; min-height: 24px; margin-top: 4px; }
    .tag {
      background: #253c54;
      border-radius: 30px;
      padding: 0 12px;
      font-size: 0.65rem;
      color: #bfdbf5;
      display: inline-block;
      letter-spacing: 0.3px;
    }
    .library-item {
      background: #0f1925;
      border-radius: 6px;
      padding: 6px 12px;
      margin: 4px 0;
      border-left: 3px solid #3f6b8c;
      cursor: pointer;
      transition: 0.1s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .library-item:hover { background: #1a2b3d; border-left-color: #7bb3e0; }
    #library { max-height: 320px; overflow-y: auto; }
    #littleInfo { font-size: 13px; background: #1f2a36; padding: 2px 14px; border-radius: 30px; white-space: nowrap; }
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5,10,20,0.85);
      backdrop-filter: blur(4px);
      z-index: 999;
      justify-content: center;
      align-items: center;
    }
    .overlay.active { display: flex; }
    .popup {
      background: #16212e;
      padding: 24px 28px;
      border-radius: 24px;
      max-width: 520px;
      width: 92%;
      border: 1px solid #3e5a73;
      max-height: 80vh;
      overflow-y: auto;
    }
    .popup-close {
      float: right;
      font-size: 28px;
      cursor: pointer;
      color: #b0c8dd;
    }
    .popup-close:hover { color: #fff; }
    .progress { width: 100%; height: 8px; background: #1f3142; border-radius: 40px; overflow: hidden; }
    .bar { height: 100%; width: 0%; background: #4d9eff; }
    .fav-item {
      background: #0f1925;
      border-radius: 6px;
      padding: 6px 12px;
      margin: 4px 0;
      border-left: 3px solid #d4a15a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .fav-item span { cursor: pointer; flex:1; }
    .fav-item button { background: transparent; border: 1px solid #5a3f3f; color: #e8b0a0; padding: 0 10px; }
    .fav-item button:hover { background: #3f2a2a; }
    @media (max-width: 600px) { body { padding: 10px; } textarea { min-height: 120px; font-size: 12px; } }
  </style>
</head>
<body>

<div class="app">
  <div class="card">
    <h1 style="font-size: 28px; font-weight: 400; letter-spacing: 1px;">♬ bytebeat</h1>
    <textarea id="code" spellcheck="false">A='1111100000011111111111111111111111111111111111111111111000001111111001111111110001000000000000001111110000000000000000000111111111111001111110000000000000000000000000000000000',n=1.26,t||(a=b=d=e=0),c=a+=b+=(n*2*2**([1,1,1,7,7,7,8,8,8,8,10,12,12,12,10,10,3,3,3,8,8,[7.8,7.5,7.3,7.1][t>>10&3],7,7,7,7,15,10,10,10,7,7,5,5,5,12,12,12,15,15,15,15,12,12,10,10,12,12,0,0,0,8,8,8,7,7,7,7,3,3,0,0,3,3,1,1,1,7,7,7,8,8,8,8,10,12,12,12,10,10,3,3,3,8,8,[7.8,7.5,7.3,7.1][t>>10&3],7,7,7,7,15,10,10,10,7,7,5,5,5,17,17,17,15,15,15,15,12,12,10,10,12,12,8,8,8,20,20,20,19,19,19,19,17,17,15,12,10,12][t>>12&127]/12)-b)/800,g=d+=e+=(n*2**([1,s=[3,3,3,[3,4][t>>13&1]][t>>14&3],5,[0,0,0,[-2,0][t>>13&1]][t>>14&3],1,s,5,[8,8,8,[10,12][t>>13&1]][t>>14&3]][t>>16&7]/12)-e)/400,A[(c*175>>8)%175]/1.3+(A[(g*175>>8)%175]/2+(A[(g/2*175>>8)%175]/3-1))*(-(t+'00055522227744440005552222774422'[t>>12&31]*4096)>>7&255)/200+Math.sin(t*n*Math.PI/512*2**.25)*(-t>>13&1)*0.1</textarea>
    <canvas id="canvas" width="800" height="300"></canvas>

    <div class="flex mt-2">
      <button id="playBtn">▶ 播放</button>
      <button id="pauseBtn" disabled>⏸ 暂停</button>
      <button id="stopBtn" disabled>⏹ 停止</button>
      <button id="copyCodeBtn">📋 复制</button>
      <button id="copyLinkBtn">🔗 链接</button>
      <button id="renderBtn">💾 导出</button>
      <button id="favBtn">⭐ 收藏</button>
    </div>

    <div class="flex mt-2">
      <select id="mode">
        <option value="b">bytebeat</option>
        <option value="s">signed</option>
        <option value="f">floatbeat</option>
        <option value="fb">funcbeat</option>
      </select>
      <select id="sampleRate">
        <option value="8000">8 kHz</option>
        <option value="11025">11 kHz</option>
        <option value="16000">16 kHz</option>
        <option value="22050">22 kHz</option>
        <option value="32000">32 kHz</option>
        <option value="44100" selected>44.1 kHz</option>
        <option value="48000">48 kHz</option>
      </select>
      <span style="display:flex;align-items:center;gap:4px;">÷<input id="sampleRateDivisor" type="number" min="1" value="1" style="width:46px;"></span>
      <span style="display:flex;align-items:center;gap:4px;">🔊<input id="volume" type="range" min="0" max="100" value="40"></span>
      <span id="littleInfo">t=0 · 0.00s</span>
    </div>
    <div id="errorDisplay" class="error"></div>
  </div>

  <div class="card">
    <div class="flex" style="justify-content:space-between;">
      <span><strong>📚 库</strong> <span class="tag" style="background:#2d4a5c;">丰富</span></span>
      <select id="filterEntries">
        <option value="all">全部</option>
        <option value="c">C兼容</option>
        <option value="stereo">立体声</option>
        <option value="melody">旋律</option>
        <option value="drum">鼓/节奏</option>
      </select>
      <button id="reloadLibBtn">↻</button>
    </div>
    <div id="library"><p style="color:#8ab;font-size:14px;">点击条目加载代码</p></div>
  </div>
</div>

<!-- 导出浮层 -->
<div id="renderOverlay" class="overlay">
  <div class="popup">
    <span class="popup-close" id="closeRender">&times;</span>
    <h2>🎛️ 导出 WAV</h2>
    <input id="renderName" placeholder="文件名" value="my_beat" style="width:100%;">
    <div class="flex"><span>时长(秒)</span><input id="renderSeconds" type="number" step="0.01" value="16" style="width:100px;"></div>
    <div class="flex"><span>淡出(s)</span><input id="renderFadeOut" type="number" step="0.01" value="0" style="width:80px;"><span>淡入(s)</span><input id="renderFadeIn" type="number" step="0.01" value="0" style="width:80px;"></div>
    <button id="renderStartBtn" style="width:100%;margin:12px 0;">▶ 开始渲染</button>
    <div class="progress"><div class="bar" id="renderBar"></div></div>
    <p id="renderStatus" style="text-align:center;min-height:24px;"></p>
  </div>
</div>

<!-- 收藏浮层 -->
<div id="favOverlay" class="overlay">
  <div class="popup">
    <span class="popup-close" id="closeFav">&times;</span>
    <h2>⭐ 收藏</h2>
    <div class="flex"><input id="favName" placeholder="名称" style="flex:1;"><button id="addFavBtn">➕ 添加</button></div>
    <div id="favList" style="max-height:300px;overflow-y:auto;margin:12px 0;"></div>
    <button id="clearFavBtn" style="border-color:#5a3f3f;">清空</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  const codeEl = document.getElementById('code');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const playBtn = document.getElementById('playBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const stopBtn = document.getElementById('stopBtn');
  const copyCodeBtn = document.getElementById('copyCodeBtn');
  const copyLinkBtn = document.getElementById('copyLinkBtn');
  const renderBtn = document.getElementById('renderBtn');
  const favBtn = document.getElementById('favBtn');
  const modeEl = document.getElementById('mode');
  const sampleRateEl = document.getElementById('sampleRate');
  const divisorEl = document.getElementById('sampleRateDivisor');
  const volumeEl = document.getElementById('volume');
  const infoEl = document.getElementById('littleInfo');
  const errorEl = document.getElementById('errorDisplay');

  let audioCtx = null;
  let source = null;
  let isPlaying = false;
  let rafId = null;
  let currentSamples = null;
  let currentRate = 44100;

  // ============================================================
  // 🎯 编译 bytebeat
  // ============================================================
  function compileBytebeat(code) {
    let processed = code
      .replace(/\bsin\b/g, 'Math.sin')
      .replace(/\bPI\b/g, 'Math.PI')
      .replace(/\bcos\b/g, 'Math.cos')
      .replace(/\btan\b/g, 'Math.tan')
      .replace(/\babs\b/g, 'Math.abs')
      .replace(/\bfloor\b/g, 'Math.floor')
      .replace(/\bceil\b/g, 'Math.ceil')
      .replace(/\bround\b/g, 'Math.round')
      .replace(/\brandom\b/g, 'Math.random')
      .replace(/\bpow\b/g, 'Math.pow')
      .replace(/\bsqrt\b/g, 'Math.sqrt')
      .replace(/\blog\b/g, 'Math.log')
      .replace(/\bexp\b/g, 'Math.exp');

    try {
      if (processed.includes('A')) {
        const aMatch = processed.match(/A\s*=\s*('[^']*'|"[^"]*")/);
        if (aMatch) {
          const aValue = eval(aMatch[1]);
          processed = processed.replace(/A\s*=\s*('[^']*'|"[^"]*"),?/, '');
          const fn = new Function('t', 'A', `"use strict"; return (${processed}) | 0;`);
          return function(t) {
            try { return fn(t, aValue); } catch(e) { return 0; }
          };
        }
      }
      const fn = new Function('t', `"use strict"; return (${processed}) | 0;`);
      return function(t) {
        try { return fn(t); } catch(e) { return 0; }
      };
    } catch(e) {
      errorEl.textContent = '⚠️ 编译错误: ' + e.message;
      return function() { return 0; };
    }
  }

  // ============================================================
  // 生成样本
  // ============================================================
  function generateSamples(fn, duration, rate) {
    const len = Math.floor(rate * duration);
    const samples = new Int8Array(len);
    for (let i = 0; i < len; i++) {
      const val = fn(i);
      samples[i] = val & 0xFF;
    }
    return samples;
  }

  // ============================================================
  // 播放
  // ============================================================
  async function play() {
    const code = codeEl.value;
    if (!code.trim()) { errorEl.textContent = '⚠️ 请输入代码'; return; }
    errorEl.textContent = '';

    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.resume();

      const rate = parseInt(sampleRateEl.value);
      const divisor = parseInt(divisorEl.value) || 1;
      currentRate = Math.floor(rate / divisor);
      const duration = 12;

      const fn = compileBytebeat(code);
      const samples = generateSamples(fn, duration, currentRate);
      currentSamples = samples;

      const buffer = audioCtx.createBuffer(1, samples.length, currentRate);
      const data = buffer.getChannelData(0);
      const vol = parseInt(volumeEl.value) / 100;
      for (let i = 0; i < samples.length; i++) {
        data[i] = (samples[i] / 128) * vol;
      }

      if (source) { try { source.stop(); } catch(e) {} source = null; }
      source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.loop = true;
      source.connect(audioCtx.destination);
      source.start();
      isPlaying = true;

      playBtn.textContent = '▶ 播放中';
      playBtn.disabled = true;
      pauseBtn.disabled = false;
      stopBtn.disabled = false;
      pauseBtn.textContent = '⏸ 暂停';

      updateInfo(0);
      startVisualization(samples, currentRate);
      source.onended = () => stopPlayback();

    } catch(e) {
      errorEl.textContent = '❌ ' + e.message;
      console.error(e);
    }
  }

  function stopPlayback() {
    if (source) { try { source.stop(); } catch(e) {} source = null; }
    isPlaying = false;
    playBtn.textContent = '▶ 播放';
    playBtn.disabled = false;
    pauseBtn.disabled = true;
    stopBtn.disabled = true;
    pauseBtn.textContent = '⏸ 暂停';
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  }

  function togglePause() {
    if (!audioCtx) return;
    if (audioCtx.state === 'running') {
      audioCtx.suspend();
      pauseBtn.textContent = '▶ 继续';
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    } else {
      audioCtx.resume();
      pauseBtn.textContent = '⏸ 暂停';
      if (currentSamples) startVisualization(currentSamples, currentRate);
    }
  }

  // ============================================================
  // 可视化
  // ============================================================
  function startVisualization(samples, rate) {
    if (rafId) cancelAnimationFrame(rafId);
    const len = samples.length;
    const totalTime = len / rate;
    let start = performance.now() / 1000;

    function draw() {
      if (!isPlaying && audioCtx?.state !== 'running') {
        rafId = requestAnimationFrame(draw);
        return;
      }
      const now = performance.now() / 1000;
      const t = (now - start) % totalTime;
      const idx = Math.floor(t * rate);
      const view = idx < len ? idx : len - 1;

      const w = canvas.width;
      const h = canvas.height;
      ctx.fillStyle = '#0b111a';
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = '#6fc3ff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let i = 0; i < w; i++) {
        const si = Math.floor((i / w) * len);
        const val = (samples[si] / 128) * (h / 2);
        const x = i;
        const y = h/2 - val;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      const posX = (view / len) * w;
      ctx.strokeStyle = '#ff7a5c';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(posX, 0);
      ctx.lineTo(posX, h);
      ctx.stroke();

      const time = view / rate;
      updateInfo(time);
      rafId = requestAnimationFrame(draw);
    }
    draw();
  }

  function updateInfo(time) {
    const t = Math.floor(time * currentRate);
    infoEl.textContent = `t=${t} · ${time.toFixed(2)}s`;
  }

  // ============================================================
  // 复制 / 链接
  // ============================================================
  function copyCode() {
    navigator.clipboard.writeText(codeEl.value).then(() => {
      errorEl.textContent = '✅ 已复制';
      setTimeout(() => errorEl.textContent = '', 1500);
    }).catch(() => errorEl.textContent = '❌ 复制失败');
  }

  function copyLink() {
    const code = codeEl.value;
    const encoded = btoa(unescape(encodeURIComponent(code)));
    const url = window.location.origin + window.location.pathname + '?code=' + encoded;
    navigator.clipboard.writeText(url).then(() => {
      errorEl.textContent = '✅ 链接已复制';
      setTimeout(() => errorEl.textContent = '', 1500);
    }).catch(() => errorEl.textContent = '❌ 复制失败');
  }

  // ============================================================
  // 导出 WAV
  // ============================================================
  function renderWAV() {
    const name = document.getElementById('renderName').value || 'my_beat';
    const seconds = parseFloat(document.getElementById('renderSeconds').value) || 16;
    const fadeOut = parseFloat(document.getElementById('renderFadeOut').value) || 0;
    const fadeIn = parseFloat(document.getElementById('renderFadeIn').value) || 0;
    const bar = document.getElementById('renderBar');
    const status = document.getElementById('renderStatus');

    const code = codeEl.value;
    const rate = parseInt(sampleRateEl.value);
    const fn = compileBytebeat(code);

    const len = Math.floor(rate * seconds);
    const samples = new Int8Array(len);
    for (let i = 0; i < len; i++) {
      samples[i] = fn(i) & 0xFF;
    }

    if (fadeIn > 0) {
      const fadeSamples = Math.floor(rate * fadeIn);
      for (let i = 0; i < fadeSamples && i < len; i++) {
        samples[i] = Math.floor(samples[i] * (i / fadeSamples));
      }
    }
    if (fadeOut > 0) {
      const fadeSamples = Math.floor(rate * fadeOut);
      for (let i = 0; i < fadeSamples && i < len; i++) {
        const idx = len - 1 - i;
        samples[idx] = Math.floor(samples[idx] * (1 - i / fadeSamples));
      }
    }

    const data = new Uint8Array(samples.buffer);
    const wav = new Uint8Array(44 + data.length);
    const view = new DataView(wav.buffer);

    const writeString = (offset, str) => {
      for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
    };
    writeString(0, 'RIFF');
    view.setUint32(4, 36 + data.length, true);
    writeString(8, 'WAVE');
    writeString(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, rate, true);
    view.setUint32(28, rate * 1, true);
    view.setUint16(32, 1, true);
    view.setUint16(34, 8, true);
    writeString(36, 'data');
    view.setUint32(40, data.length, true);
    wav.set(data, 44);

    let binary = '';
    const chunkSize = 8192;
    for (let i = 0; i < wav.length; i += chunkSize) {
      const chunk = wav.subarray(i, Math.min(i + chunkSize, wav.length));
      binary += String.fromCharCode.apply(null, chunk);
    }
    const base64 = btoa(binary);
    const dataUri = 'data:audio/wav;base64,' + base64;

    const link = document.createElement('a');
    link.href = dataUri;
    link.download = name + '.wav';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    bar.style.width = '100%';
    status.textContent = '✅ 导出完成: ' + name + '.wav';
    setTimeout(() => { bar.style.width = '0%'; status.textContent = ''; }, 2000);
  }

  // ============================================================
  // 收藏
  // ============================================================
  function getFavorites() {
    try { return JSON.parse(localStorage.getItem('bytebeat_favs') || '[]'); } catch { return []; }
  }
  function setFavorites(favs) {
    localStorage.setItem('bytebeat_favs', JSON.stringify(favs));
  }
  function renderFavorites() {
    const list = document.getElementById('favList');
    const favs = getFavorites();
    if (!favs.length) { list.innerHTML = '<p style="color:#8ab;">暂无收藏</p>'; return; }
    list.innerHTML = favs.map((f, i) =>
      `<div class="fav-item">
        <span onclick="loadCode(\`${f.code.replace(/`/g,'\\`')}\`)">${f.name || '未命名'}</span>
        <button onclick="removeFav(${i})">✕</button>
      </div>`
    ).join('');
  }
  window.removeFav = function(i) {
    const favs = getFavorites();
    favs.splice(i, 1);
    setFavorites(favs);
    renderFavorites();
  };

  // ============================================================
  // 📚 库 —— 大幅扩充
  // ============================================================
  const libraryEntries = [
    { name: '🎵 经典 beat', code: 't*(((t>>12)|(t>>8))&(63&(t>>4)))', tags: ['c', 'melody'] },
    { name: '🥁 鼓点基础', code: '(t>>10)&(t>>8)&42', tags: ['c', 'drum'] },
    { name: '🎶 旋律循环', code: 't*(t>>8|t>>9)&46&(t>>7)', tags: ['c', 'melody'] },
    { name: '🎸 低音线', code: '(t>>7)&(t>>6)|(t>>4)', tags: ['c', 'drum'] },
    { name: '📡 噪音波', code: '(t*12345)&65535', tags: ['c'] },
    { name: '🌀 立体声场', code: '((t>>8)&(t>>5))|((t>>6)&(t>>3))', tags: ['stereo', 'c'] },
    { name: '🎹 钢琴感觉', code: '((t>>10)&42)*(t>>8|t>>9)&63', tags: ['melody'] },
    { name: '💥 重鼓', code: '((t>>9)&(t>>7)&63)|((t>>5)&(t>>3)&31)', tags: ['drum'] },
    { name: '🌊 海浪', code: '((t>>6)&(t>>5))^((t>>7)&(t>>4))', tags: ['stereo'] },
    { name: '🎼 和弦', code: '((t>>8)|(t>>7))&((t>>6)|(t>>5))&63', tags: ['melody', 'c'] },
    { name: '🔊 脉冲', code: '(t>>6)&(t>>4)&(t>>2)&31', tags: ['drum'] },
    { name: '🎻 弦乐', code: '((t>>7)&(t>>5))|((t>>9)&(t>>6))', tags: ['melody', 'stereo'] },
    { name: '⚡ 芯片音', code: '(t>>8)*((t>>6)&3)&((t>>4)|(t>>2))', tags: ['c'] },
    { name: '🎤 人声效果', code: '((t>>9)&(t>>6))^((t>>7)&(t>>3))', tags: ['stereo'] },
    { name: '🥁 节奏组', code: '((t>>10)&3)|((t>>8)&7)|((t>>6)&15)', tags: ['drum'] },
  ];

  function renderLibrary(filter) {
    const container = document.getElementById('library');
    let items = libraryEntries;
    if (filter === 'c') items = items.filter(i => i.tags.includes('c'));
    else if (filter === 'stereo') items = items.filter(i => i.tags.includes('stereo'));
    else if (filter === 'melody') items = items.filter(i => i.tags.includes('melody'));
    else if (filter === 'drum') items = items.filter(i => i.tags.includes('drum'));

    if (!items.length) {
      container.innerHTML = '<p style="color:#8ab;">没有匹配的条目</p>';
      return;
    }
    container.innerHTML = items.map(item =>
      `<div class="library-item" onclick="loadCode(\`${item.code.replace(/`/g,'\\`')}\`)">
        <span>${item.name}</span>
        <span class="tag">${item.tags.join(' ')}</span>
      </div>`
    ).join('');
  }

  window.loadCode = function(code) {
    codeEl.value = code;
    errorEl.textContent = '✅ 已加载';
    setTimeout(() => errorEl.textContent = '', 1200);
    play();
  };

  // ============================================================
  // 事件绑定
  // ============================================================
  playBtn.addEventListener('click', play);
  pauseBtn.addEventListener('click', togglePause);
  stopBtn.addEventListener('click', stopPlayback);
  copyCodeBtn.addEventListener('click', copyCode);
  copyLinkBtn.addEventListener('click', copyLink);
  renderBtn.addEventListener('click', () => document.getElementById('renderOverlay').classList.add('active'));
  favBtn.addEventListener('click', () => { renderFavorites(); document.getElementById('favOverlay').classList.add('active'); });

  document.getElementById('closeRender').addEventListener('click', () => document.getElementById('renderOverlay').classList.remove('active'));
  document.getElementById('closeFav').addEventListener('click', () => document.getElementById('favOverlay').classList.remove('active'));
  document.getElementById('renderStartBtn').addEventListener('click', renderWAV);

  document.getElementById('addFavBtn').addEventListener('click', () => {
    const name = document.getElementById('favName').value || '未命名';
    const code = codeEl.value;
    if (!code.trim()) { errorEl.textContent = '⚠️ 代码为空'; return; }
    const favs = getFavorites();
    favs.push({ name, code });
    setFavorites(favs);
    renderFavorites();
    document.getElementById('favName').value = '';
    errorEl.textContent = '✅ 已收藏';
    setTimeout(() => errorEl.textContent = '', 1200);
  });
  document.getElementById('clearFavBtn').addEventListener('click', () => {
    if (confirm('清空所有收藏？')) { setFavorites([]); renderFavorites(); }
  });

  document.getElementById('reloadLibBtn').addEventListener('click', () => {
    const filter = document.getElementById('filterEntries').value;
    renderLibrary(filter);
  });
  document.getElementById('filterEntries').addEventListener('change', function() {
    renderLibrary(this.value);
  });

  // 从 URL 加载
  (function loadFromURL() {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if (code) {
      try {
        const decoded = decodeURIComponent(escape(atob(code)));
        codeEl.value = decoded;
        errorEl.textContent = '✅ 从链接加载';
        setTimeout(() => errorEl.textContent = '', 1500);
      } catch(e) {}
    }
  })();

  renderLibrary('all');
  renderFavorites();

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'TEXTAREA' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      play();
    }
    if (e.key === ' ' && e.target.tagName !== 'TEXTAREA') {
      e.preventDefault();
      if (isPlaying) togglePause();
      else play();
    }
  });

  console.log('🎵 bytebeat 增强版已加载！ 库已扩充至15+条目');
})();
</script>
</body>
</html>
