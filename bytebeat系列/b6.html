<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>♬ bytebeat · Liquid Glass 兼容原版语法</title>
<style>
:root {
  --glass-blur: 8px;
  --glass-radius: 22px;
  --glass-border: 1px solid rgba(255,255,0.11);
  --glass-highlight: inset 0 1px 0 rgba(255,255,255,0.07);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: radial-gradient(circle at 20% 10%, #0f1729 0%, #050810 100%);
  background-attachment: fixed;
  color: #e8f0fc;
  font-family: 'Segoe UI', system-ui, sans-serif;
  padding: 14px;
  min-height: 100vh;
}
.app { max-width: 980px; margin: 0 auto; width: 100%; }
.card {
  background: linear-gradient(135deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03));
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border-radius: var(--glass-radius);
  border: var(--glass-border);
  box-shadow: 0 6px 28px rgba(0,0,0,0.32), var(--glass-highlight);
  transform: translateZ(0);
  will-change: transform;
  padding: 22px;
  margin-bottom: 18px;
  transition: background 0.2s ease;
}
.card:hover {
  background: linear-gradient(135deg, rgba(255,255,255,0.09), rgba(255,255,255,0.04));
}
textarea {
  width: 100%;
  min-height: 160px;
  background: rgba(0,0,0,0.22);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  color: #eef4fa;
  padding: 14px;
  font-family: 'Courier New', monospace;
  font-size: 14px;
  resize: vertical;
  tab-size: 4;
  line-height: 1.6;
}
textarea:focus {
  outline: none;
  border-color: rgba(110,185,255,0.35);
  box-shadow: 0 0 0 2px rgba(110,185,255,0.1);
}
canvas {
  width: 100%;
  height: 150px;
  background: rgba(0,3,12,0.35);
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.07);
  margin-top: 10px;
  display: block;
}
button {
  background: linear-gradient(140deg, rgba(255,255,255,0.11), rgba(255,255,0.04));
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  color: #eef4fa;
  padding: 7px 16px;
  cursor: pointer;
  font-size: 14px;

}
button:hover {
  background: linear-gradient(140deg, rgba(255,255,255,0.16), rgba(255,255,0.07));
  border-color: rgba(120,195,255,0.3);
  transform: translateY(-1px);
}
button:active { transform: translateY(0); }
button:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
select, input {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);

}
select:focus, input:focus { outline: none; border-color: rgba(110,185,255,0.35); }
input[type="range"] { width: 100px; background: transparent; border: none; }
.flex { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
.mt-2 { margin-top: 14px; }
.error { color: #ff8870; min-height: 24px; margin-top: 6px; }
.tag {
  background: rgba(90,170,255,0.1);
  border: 1px solid rgba(90,170,255,0.15);
  border-radius: 30px;
  padding: 1px 12px;
  font-size: 0.62rem;
  color: #c2e0fa;
}
.library-item {
  background: rgba(255,255,255,0.04);
  border-radius: 10px;
  padding: 7px 12px;
  margin: 5px 0;
  border-left: 3px solid rgba(70,150,210,0.45);
  cursor: pointer;
  transition: background 0.18s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.library-item:hover { background: rgba(255,255,255,0.08); border-left-color: #7bb3e0; }
#library { max-height: 300px; overflow-y: auto; }
#littleInfo {
  background: rgba(255,255,255,0.06);
  border-radius: 30px;
  padding: 2px 14px;
  font-size: 12px;
  white-space: nowrap;
}
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 999;
  justify-content: center;
  align-items: center;
}
.overlay.active { display: flex; }
.popup {
  background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-radius: 26px;
  border: 1px solid rgba(255,255,255,0.13);
  box-shadow: 0 10px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.07);
  transform: translateZ(0);
  will-change: transform;
  padding: 26px 30px;
  max-width: 520px;
  width: 92%;
  max-height: 80vh;
  overflow-y: auto;
}
.pop-close {
  float: right;
  font-size: 28px;
  cursor: pointer;
  color: #b0c8dd;
}
.pop-close:hover { color: #fff; }
.progress {
  width: 100%;
  height: 9px;
  background: rgba(255,255,255,0.06);
  border-radius: 40px;
  overflow: hidden;
  margin: 10px 0;
}
.bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#449cff,#63c8ff);
  border-radius: 40px;
}
.fav-item {
  background: rgba(255,255,255,0.04);
  border-radius: 10px;
  padding: 7px 12px;
  margin: 5px 0;
  border-left: 3px solid rgba(210,155,80,0.5);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.fav-item span { flex: 1; cursor: pointer; }
.fav-item button {
  background: rgba(255,110,110,0.07);
  border: 1px solid rgba(255,110,110,0.18);
  color: #ffb0aa;
  padding: 0 10px;
}
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: rgba(255,255,0.03); border-radius: 10px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
@media (max-width: 600px) {
  body { padding: 10px; }
  .card { padding: 16px; --glass-radius: 18px; }
  textarea { min-height: 110px; font-size: 12px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <h1 style="font-size:26px;font-weight:400;margin-bottom:14px;">♬ bytebeat Liquid Glass</h1>
<textarea id="code" spellcheck="false">A='1111100000011111111111111111111111111111111111111111111000001111111001111111110001000000000000001111110000000000000000000111111111111001111110000000000000000000000000000000000',n=1.26,t||(a=b=d=0),c=a+=b+=(n*2*2**([1,1,1,7,7,7,8,8,8,8,10,12,12,12,10,10,3,3,3,8,8,[7.8,7.5,7.3,7.1][t>>10&3],7,7,7,7,15,10,10,10,7,7,5,5,5,12,12,12,15,15,15,15,12,12,10,10,12,12,0,0,0,8,8,8,7,7,7,7,3,3,0,0,3,3,1,1,1,7,7,7,8,8,8,8,10,12,12,12,10,10,3,3,3,8,8,[7.8,7.5,7.3,7.1][t>>10&3],7,7,7,7,15,10,10,10,7,7,5,5,5,17,17,17,15,15,15,15,12,12,10,10,12,12,8,8,8,20,20,20,19,19,19,19,17,17,15,12,10,12][t>>12&127]/12)-b)/800,g=d+=(n*2**([1,s=[3,3,3,[3,4][t>>13&1]][t>>14&3],5,[0,0,0,[-2,0][t>>13&1]][t>>14&3],1,s,5,[8,8,8,[10,12][t>>13&1]][t>>14&3]][t>>16&7]/12)-d)/400,A[(c*175>>8)%1.3+(A[(g*175>>8)%175]/2+(A[(g/2*175>>8)%175]/3-1))*(-(t+'00055522227744440005552222774422'[t>>12&31]*4096)>>7&255)/200+Math.sin(t*n*Math.PI/512*2**.25)*(-t>>13&1)*0.1</textarea>
    <canvas id="canvas" width="800" height="150"></canvas>
    <div class="flex mt-2">
      <button id="playBtn">▶ 播放</button>
      <button id="pauseBtn" disabled>⏸ 暂停</button>

<!-- 导出弹窗 -->
<div id="renderOverlay" class="overlay">

<script>
(function(){
'use strict';
const codeEl = document.getElementById('code');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const playBtn = document.getElementById('playBtn');
const pauseBtn = document.getElementById('pauseBtn');
const stopBtn = document.getElementById('stopBtn');
const copyCodeBtn = document.getElementById('copyCodeBtn');
const copyLinkBtn = document.getElementById('copyLinkBtn');
const renderBtn = document.getElementById('renderBtn');
const favBtn = document.getElementById('favBtn');
const modeEl = document.getElementById('sampleRate');
const sampleRateEl = document.getElementById('sampleRate');
const divisorEl = document.getElementById('sampleRateDivisor');
const volumeEl = document.getElementById('volume');
const infoEl = document.getElementById('littleInfo');
const errorEl = document.getElementById('errorDisplay');
const state = {
  audioCtx: null, source: null, isPlaying: false, rafId: null,
  currentSamples: null, currentRate: 44100, compileCache: new Map()
};
// 核心修复：移除"use strict"，兼容未定义变量s、全局累加器a/b/d/e
function compileBytebeat(code){
  if(state.compileCache.has(code)) return state.compileCache.get(code);
  const mathMap = {sin:'Math.sin',cos:'Math.cos',tan:'Math.tan',abs:'Math.abs',floor:'Math.floor',ceil:'Math.ceil',round:'Math.round',random:'Math.random',pow:'Math.pow',sqrt:'Math.sqrt',log:'Math.log',exp:'Math.exp',PI:'Math.PI'};
  let processed = code;
  for(let k in mathMap) processed = processed.replace(new RegExp(`\\b${k}\\b`,'g'),mathMap[k]);
  let fn;
  try{
    if(processed.includes('A')){
      const aMatch = processed.match(/A\s*=\s*('[^']*'|"[^"]*")/);
      if(aMatch){
        const aValue = eval(aMatch[1]);
        processed = processed.replace(/A\s*=\s*('[^']*'|"[^"]*"),?/,'');
        // 无严格模式
        const wrapFn = new Function('t','A',`return (${processed}) | 0;`);
        fn = t=>{try{return wrapFn(t,aValue)}catch{return 0}};
      }
    }
    if(!fn){
      // 无严格模式，解决Unexpected strict mode reserved word
      const wrapFn = new Function('t',`return (${processed}) | 0;`);
      fn = t=>{try{return wrapFn(t)}catch{return 0}};
    }
    state.compileCache.set(code,fn);
    return fn;
  }catch(e){
    errorEl.textContent = `编译错误:${e.message}`;
    return ()=>0;
  }
}
function generateSamples(fn,duration,rate){
  const len = Math.floor(rate*duration);
  const arr = new Int8Array(len);
  for(let i=0;i<len;i++) arr[i] = fn(i)&0xFF;
  return arr;
}
async function play(){
  const code = codeEl.value.trim();
  if(!code){errorEl.textContent='⚠ 请输入Bytebeat代码';return;}
  errorEl.textContent='';
  if(!state.audioCtx) state.audioCtx = new (window.AudioContext||window.webkitAudioContext)({latencyHint:0.02});
  await state.audioCtx.resume();
  const sr = +sampleRateEl.value;
  const div = +divisorEl.value||1;
  state.currentRate = Math.floor(sr/div);
  const fn = compileBytebeat(code);
  const samples = generate(fn,12,state.currentRate);
  state.currentSamples = samples;
  const buf = state.audioCtx.createBuffer(1,samples.length,state.currentRate);
  const data = buf.getChannelData(0);
  const vol = +volumeEl.value/100;
  for(let i=0;i<samples.length;i++) data[i] = (samples[i]/128)*vol;
  if(state.source) try{state.source.stop()}catch{}
  state.source = state.audioCtx.createBufferSource();
  state.source.buffer = buf;
  state.source.loop = true;
  state.source.connect(state.audioCtx.destination);
  state.source.start();
  state.isPlaying = true;
  playBtn.textContent='▶ 播放中';playBtn.disabled=true;
  pauseBtn.disabled=false;stopBtn.disabled=false;pauseBtn.textContent='⏸ 暂停';
  updateInfo(0);
  startVisual(samples,state.currentRate);
  state.source.onended = stopPlayback;
}
function stopPlayback(){
  if(state.source) try{state.source.stop()}catch{}
  state.source=null;state.isPlaying=false;
  playBtn.textContent='▶ 播放';playBtn.disabled=false;
  pauseBtn.disabled=true;stopBtn.disabled=true;pauseBtn.textContent='⏸ 暂停';
  if(state.rafId){cancelAnimationFrame(state.rafId);state.rafId=null;}
}
function togglePause(){
  if(!state.audioCtx) return;
  if(state.audioCtx.state==='running'){
    state.audioCtx.suspend();
    pauseBtn.textContent='▶ 继续';
    if(state.rafId){cancelAnimationFrame(state.rafId);state.rafId=null;}
  }else{
    state.audioCtx.resume();
    pauseBtn.textContent='⏸ 暂停';
    if(state.currentSamples) startVisual(state.currentSamples,state.currentRate);
  }
}
function startVisual(samples,rate){
  if(state.rafId) cancelAnimationFrame(state.rafId);
  const len = samples.length;
  const total = len/rate;
  let startT = performance.now()/1000;
  function draw(){
    if(!state.isPlaying && state.audioCtx.state!=='running'){
      state.rafId = requestAnimationFrame(draw);
      return;
    }
    const now = performance.now()/1000;
    const t = (now-startT)%total;
    const idx = Math.min(Math.floor(t*rate),len-1);
    const w = canvas.width,h=canvas.height,half=h/2;
    ctx.fillStyle='rgba(0,5,14,0.4)';
    ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='#6fc3ff';
    ctx.lineWidth=1.4;
    ctx.beginPath();
    const step = len/(w*4);
    for(let x=0;x<w;x++){
      const sIdx = Math.floor(x*step);
      const val = (samples[sIdx]/128)*half;
      const y = half-val;
      x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.stroke();
    const posX = (idx/len)*w;
    ctx.strokeStyle='#ff7a5c';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(posX,0);ctx.lineTo(posX,h);ctx.stroke();
    updateInfo(idx/rate);
    state.rafId = requestAnimationFrame(draw);
  }
  draw();
}
function updateInfo(time){
  const t = Math.floor(time*state.currentRate);
  infoEl.textContent = `t=${t} · ${time.toFixed(2)}s`;
}
function copyCode(){
  navigator.clipboard.writeText(codeEl.value).then(()=>{
    errorEl.textContent='✅ 代码已复制';
    setTimeout(()=>errorEl.textContent='',1400);
  }).catch(()=>errorEl.textContent='❌ 复制失败');
}
function copyLink(){
  const code = codeEl.value;
  const enc = btoa(unescape(encodeURIComponent(code)));
  const url = `${location.origin}${location.pathname}?code=${enc}`;
  navigator.clipboard.writeText(url).then(()=>{
    errorEl.textContent='✅ 分享链接已复制';
    setTimeout(()=>errorEl.textContent='',1400);
  }).catch(()=>errorEl.textContent='❌ 链接复制失败');
}
function renderWAV(){
  const name = document.getElementById('renderName').value||'my_beat';
  const sec = +document.getElementById('renderSeconds').value||16;
  const fadeIn = +document.getElementById('renderFadeIn').value||0;
  const fadeOut = +document.getElementById('renderFadeOut').value||0;
  const bar = document.getElementById('renderBar');
  const status = document.getElementById('renderStatus');
  const sr = +sampleRateEl.value;
  const fn = compileBytebeat(codeEl.value);
  const len = Math.floor(sr*sec);
  const samples = new Int8Array(len);
  for(let i=0;i<len;i++) samples[i] = fn(i)&0xFF;
  if(fadeIn>0){
    const fadeLen = Math.floor(sr*fadeIn);
    for(let i=0;i<fadeLen;i++) samples[i] = Math.floor(samples[i]*(i/fadeLen));
  }
  if(fadeOut>0){
    const fadeLen = Math.floor(sr*fadeOut);
    for(let i=0;i<fadeLen;i++) samples[len-1-i] = Math.floor(samples[i]*(1-i/fadeLen));
  }
  const data = new Uint8Array(samples.buffer);
  const wav = new Uint8Array(44+data.length);
  const dv = new DataView(wav.buffer);
  const write = (off,str)=>{for(let i=0;i<str.length;i++)dv.setUint8(off+i,str.charCodeAt(i))};
  write(0,'RIFF');
  dv.setUint32(4,36+data.length,true);
  write(8,'WAVE');write(12,'fmt ');
  dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
  dv.setUint32(24,sr,true);dv.setUint32(28,sr,true);
  dv.setUint16(32,1,true);dv.setUint16(34,8,true);
  write(36,'data');dv.setUint32(40,data.length,true);
  wav.set(data,44);
  let bin = '';
  const chunk = 8192;
  for(let i=0;i<wav.length;i+=chunk) bin += String.fromCharCode(...wav.subarray(i,i+chunk));
  const url = `data:audio/wav;base64,${btoa(bin)}`;
  const a = document.createElement('a');
  a.href = url; a.download = `${name}.wav`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  bar.style.width='100';status.textContent='✅ 导出完成';
  setTimeout(()=>{bar.style.width='0%';status.textContent=''},2000);
}
function getFavs(){try{return JSON.parse(localStorage.getItem('bytebeat_favs')||'[]')}catch{return []}}
function setFavs(arr){localStorage.setItem('bytebeat_favs',JSON.stringify(arr))}
function renderFavList(){
  const wrap = document.getElementById('favList');
  const list = getFavs();
  if(!list.length){wrap.innerHTML='<p style="color:#a0b4cc;">暂无收藏</p>';return;}
  wrap.innerHTML = list.map((item,i)=>`<div class="fav-item"><span onclick="loadCode(\`${item.code.replace(/`/g,'\\`')}\`)">${item.name||'未命名'}</span><button onclick="removeFav(${i})">✕</button>`).join('');
}
window.removeFav = function(i){
  const arr = getFavs();arr.splice(i,1);setFavs(arr);renderFavList();
};
const lib = [
{name:'经典Bytebeat',code:'t*(((t>>12)|(t>>8))&(63&(t>>4)))',tags:['c','melody']},
{name:'基础鼓点',code:'(t>>10)&(t>>8)&42',tags:['c','drum']},
{name:'循环旋律',code:'t*(t>>8|t>>9)&46&(t>>7)',tags:['c','melody']},

];
function renderLib(filter){
  const wrap = document.getElementById('library');
  let arr = lib;
  if(filter==='c')arr=arr.filter(x=>x.tags.includes('c'));
  if(filter==='stereo')arr=arr.filter(x=>x.tags.includes('stereo'));
  if(filter==='melody')arr=arr.filter(x=>x.tags.includes('melody'));
  if(filter==='drum')arr=arr.filter(x=>x.tags.includes('drum'));
  if(!arr.length){wrap.innerHTML='<p style="color:#a0b4cc;">无匹配条目</p>';return;}
  wrap.innerHTML = arr.map(item=>`<div class="library-item" onclick="loadCode(\`${item.code.replace(/`/g,'\\`')}\`)"><span>${item.name}</span><span class="tag">${item.tags.join(' ')}</span></div>`).join('');
}
window.loadCode = function(code){
  codeEl.value = code;
  errorEl.textContent='✅ 示例代码已加载';
  setTimeout(()=>errorEl.textContent='',1200);
  play();
};
playBtn.onclick = play;
pauseBtn.onclick = togglePause;
stopBtn.onclick = stopPlayback;
copyCodeBtn.onclick = copyCode;
copyLinkBtn.onclick = copyLink;
renderBtn.onclick = ()=>document.getElementById('renderOverlay').classList.add('active');
favBtn.onclick = ()=>{renderFavList();document.getElementById('favOverlay').classList.add('active');};
document.getElementById('closeRender').onclick = ()=>document.getElementById('renderOverlay').classList.remove('active');
document.getElementById('closeFav').onclick = ()=>document.getElementById('favOverlay').classList.remove('active');
document.getElementById('renderStartBtn').onclick = renderWAV;
document.getElementById('addFavBtn').onclick = ()=>{
  const name = document.getElementById('favName').value||'未命名';
  const code = codeEl.value.trim();
  if(!code){errorEl.textContent='⚠ 代码不能为空';return;}
  const favs = getFavs();
  favs.push({name,code});
  setFavs(favs);
  renderFavList();
  document.getElementById('favName').value='';
  errorEl.textContent='✅ 收藏成功';
  setTimeout(()=>errorEl.textContent='',1200);
};
document.getElementById('clearFavBtn').onclick = ()=>{
  if(confirm('确定清空全部收藏？')){setFavs([]);renderFavList();}
};
document.getElementById('reloadLibBtn').onclick = ()=>renderLib(document.getElementById('filterEntries').value);
document.getElementById('filterEntries').onchange = function(){renderLib(this.value)};
(function(){
  const p = new URLSearchParams(location.search);
  const c = p.get('code');
  if(!c) return;
  try{
    const decode = decodeURIComponent(escape(atob(c)));
    codeEl.value = decode;
    errorEl.textContent='✅ 从链接加载代码';
    setTimeout(()=>errorEl.textContent='',1500);
  }catch{}
})();
renderLib('all');
renderFavList();
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA'){
    if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();play();}
    return;
  }
  if(e.key===' '){e.preventDefault();state.isPlaying?toggle():play();}
});
