<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 Funk Bytebeat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0b0e14;
  color: #d0dbe8;
  font-family: 'Segoe UI', system-ui, sans-serif;
  padding: 16px;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}
.app { max-width: 960px; width: 100%; }
.card {
  background: #121a24;
  border-radius: 16px;
  padding: 20px;
  border: 1px solid #263b4e;
  margin-bottom: 16px;
}
textarea {
  width: 100%;
  min-height: 200px;
  background: #0f1620;
  border: 1px solid #2b4057;
  border-radius: 8px;
  color: #eef4fa;
  padding: 12px;
  font-family: 'Courier New', monospace;
  font-size: 13px;
  resize: vertical;
  tab-size: 4;
  line-height: 1.7;
  white-space: pre;
}
canvas {
  width: 100%;
  height: 140px;
  background: #0b111a;
  border-radius: 8px;
  border: 1px solid #243544;
  margin-top: 10px;
  display: block;
}
button {
  background: #26323f;
  border: 1px solid #3f556a;
  border-radius: 8px;
  color: #eef4fa;
  padding: 6px 16px;
  cursor: pointer;
  font-size: 14px;
  transition: 0.15s;
}
button:hover { background: #31475e; border-color: #6c8eb0; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
select, input {
  background: #1a212b;
  border: 1px solid #33455a;
  border-radius: 6px;
  color: #eef4fa;
  padding: 4px 8px;
  font-size: 13px;
}
input[type="range"] { width: 100px; padding: 0; background: transparent; border: none; }
.flex { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.mt-2 { margin-top: 12px; }
.error { color: #ff7a5c; }
#info { font-size: 13px; background: #1f2a36; padding: 2px 14px; border-radius: 30px; }
</style>
</head>
<body>

<div class="app">
  <div class="card">
    <h1 style="font-size: 26px; font-weight: 400; letter-spacing: 1px;">🎵 Funk Bytebeat</h1>
    <textarea id="code" spellcheck="false">A='1111100000011111111111111111111111111111111111111111111000001111111001111111110001000000000000001111110000000000000000000111111111111001111110000000000000000000000000000000000',n=1.26,t||(a=b=d=e=0),c=a+=b+=(n*2*2**([1,1,1,7,7,7,8,8,8,8,10,12,12,12,10,10,3,3,3,8,8,[7.8,7.5,7.3,7.1][t>>10&3],7,7,7,7,15,10,10,10,7,7,5,5,5,12,12,12,15,15,15,15,12,12,10,10,12,12,0,0,0,8,8,8,7,7,7,7,3,3,0,0,3,3,1,1,1,7,7,7,8,8,8,8,10,12,12,12,10,10,3,3,3,8,8,[7.8,7.5,7.3,7.1][t>>10&3],7,7,7,7,15,10,10,10,7,7,5,5,5,17,17,17,15,15,15,15,12,12,10,10,12,12,8,8,8,20,20,20,19,19,19,19,17,17,15,12,10,12][t>>12&127]/12)-b)/800,g=d+=e+=(n*2**([1,s=[3,3,3,[3,4][t>>13&1]][t>>14&3],5,[0,0,0,[-2,0][t>>13&1]][t>>14&3],1,s,5,[8,8,8,[10,12][t>>13&1]][t>>14&3]][t>>16&7]/12)-e)/400,A[(c*175>>8)%175]/1.3+(A[(g*175>>8)%175]/2+(A[(g/2*175>>8)%175]/3-1))*(-(t+'00055522227744440005552222774422'[t>>12&31]*4096)>>7&255)/200+Math.sin(t*n*Math.PI/512*2**.25)*(-t>>13&1)*0.1</textarea>
    <canvas id="canvas" width="800" height="300"></canvas>

    <div class="flex mt-2">
      <button id="playBtn">▶ 播放</button>
      <button id="pauseBtn" disabled>⏸ 暂停</button>
      <button id="stopBtn" disabled>⏹ 停止</button>
      <button id="copyBtn">📋 复制</button>
      <button id="renderBtn">💾 导出</button>
    </div>

    <div class="flex mt-2">
      <select id="sampleRate">
        <option value="8000">8 kHz</option>
        <option value="11025">11 kHz</option>
        <option value="16000">16 kHz</option>
        <option value="22050">22 kHz</option>
        <option value="32000" selected>32 kHz</option>
        <option value="44100">44.1 kHz</option>
        <option value="48000">48 kHz</option>
      </select>
      <span style="display:flex;align-items:center;gap:4px;">÷<input id="divisor" type="number" min="1" value="1" style="width:46px;"></span>
      <span style="display:flex;align-items:center;gap:4px;">🔊<input id="volume" type="range" min="0" max="100" value="50"></span>
      <span id="info">t=0 · 0.00s</span>
    </div>
    <div id="error" class="error" style="min-height:24px;margin-top:4px;"></div>
  </div>
</div>

<!-- 导出浮层 -->
<div id="renderOverlay" style="display:none;position:fixed;inset:0;background:rgba(5,10,20,0.85);z-index:999;justify-content:center;align-items:center;">
  <div style="background:#16212e;padding:24px 28px;border-radius:24px;max-width:480px;width:92%;border:1px solid #3e5a73;">
    <span onclick="document.getElementById('renderOverlay').style.display='none'" style="float:right;font-size:28px;cursor:pointer;color:#b0c8dd;">&times;</span>
    <h2>🎛️ 导出 WAV</h2>
    <input id="renderName" placeholder="文件名" value="funk_beat" style="width:100%;background:#1a212b;border:1px solid #33455a;border-radius:6px;color:#eef4fa;padding:6px 10px;margin:8px 0;">
    <div class="flex"><span>时长(秒)</span><input id="renderSeconds" type="number" step="0.01" value="16" style="width:100px;background:#1a212b;border:1px solid #33455a;border-radius:6px;color:#eef4fa;padding:4px 8px;"></div>
    <button id="renderStartBtn" style="width:100%;margin:12px 0;padding:10px;">▶ 开始渲染</button>
    <div style="width:100%;height:8px;background:#1f3142;border-radius:40px;overflow:hidden;"><div id="renderBar" style="height:100%;width:0%;background:#4d9eff;"></div></div>
    <p id="renderStatus" style="text-align:center;min-height:24px;margin-top:8px;"></p>
  </div>
</div>

<script>
(function() {
  const codeEl = document.getElementById('code');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const playBtn = document.getElementById('playBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const stopBtn = document.getElementById('stopBtn');
  const copyBtn = document.getElementById('copyBtn');
  const renderBtn = document.getElementById('renderBtn');
  const sampleRateEl = document.getElementById('sampleRate');
  const divisorEl = document.getElementById('divisor');
  const volumeEl = document.getElementById('volume');
  const infoEl = document.getElementById('info');
  const errorEl = document.getElementById('error');

  let audioCtx = null, source = null, isPlaying = false, rafId = null;
  let currentSamples = null, currentRate = 32000;

  // 编译 bytebeat（支持 A、sin、PI、**）
  function compile(code) {
    let processed = code
      .replace(/\bsin\b/g, 'Math.sin')
      .replace(/\bPI\b/g, 'Math.PI')
      .replace(/\bcos\b/g, 'Math.cos')
      .replace(/\btan\b/g, 'Math.tan')
      .replace(/\babs\b/g, 'Math.abs')
      .replace(/\bfloor\b/g, 'Math.floor')
      .replace(/\bceil\b/g, 'Math.ceil')
      .replace(/\bround\b/g, 'Math.round')
      .replace(/\bpow\b/g, 'Math.pow')
      .replace(/\bsqrt\b/g, 'Math.sqrt')
      .replace(/\blog\b/g, 'Math.log')
      .replace(/\bexp\b/g, 'Math.exp')
      .replace(/\brandom\b/g, 'Math.random');

    // 提取 A 变量
    let aValue = null;
    const aMatch = processed.match(/A\s*=\s*('[^']*'|"[^"]*")/);
    if (aMatch) {
      try { aValue = eval(aMatch[1]); } catch(e) {}
      processed = processed.replace(/A\s*=\s*('[^']*'|"[^"]*"),?\s*/, '');
    }

    // 构建函数
    try {
      if (aValue !== null) {
        const fn = new Function('t', 'A', `"use strict"; return (${processed}) | 0;`);
        return function(t) {
          try { return fn(t, aValue); } catch(e) { return 0; }
        };
      } else {
        const fn = new Function('t', `"use strict"; return (${processed}) | 0;`);
        return function(t) {
          try { return fn(t); } catch(e) { return 0; }
        };
      }
    } catch(e) {
      errorEl.textContent = '⚠️ 编译错误: ' + e.message;
      return function() { return 0; };
    }
  }

  // 生成样本
  function generate(fn, duration, rate) {
    const len = Math.floor(rate * duration);
    const samples = new Int8Array(len);
    for (let i = 0; i < len; i++) {
      samples[i] = fn(i) & 0xFF;
    }
    return samples;
  }

  // 播放
  async function play() {
    const code = codeEl.value.trim();
    if (!code) { errorEl.textContent = '⚠️ 请输入代码'; return; }
    errorEl.textContent = '';

    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.resume();

      const rate = parseInt(sampleRateEl.value);
      const divisor = parseInt(divisorEl.value) || 1;
      currentRate = Math.floor(rate / divisor);
      const duration = 12;

      const fn = compile(code);
      const samples = generate(fn, duration, currentRate);
      currentSamples = samples;

      const buffer = audioCtx.createBuffer(1, samples.length, currentRate);
      const data = buffer.getChannelData(0);
      const vol = parseInt(volumeEl.value) / 100;
      for (let i = 0; i < samples.length; i++) {
        data[i] = (samples[i] / 128) * vol;
      }

      if (source) { try { source.stop(); } catch(e) {} source = null; }
      source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.loop = true;
      source.connect(audioCtx.destination);
      source.start();
      isPlaying = true;

      playBtn.textContent = '▶ 播放中';
      playBtn.disabled = true;
      pauseBtn.disabled = false;
      stopBtn.disabled = false;

      updateInfo(0);
      visualize(samples, currentRate);
      source.onended = () => stop();

    } catch(e) {
      errorEl.textContent = '❌ ' + e.message;
      console.error(e);
    }
  }

  function stop() {
    if (source) { try { source.stop(); } catch(e) {} source = null; }
    isPlaying = false;
    playBtn.textContent = '▶ 播放';
    playBtn.disabled = false;
    pauseBtn.disabled = true;
    stopBtn.disabled = true;
    pauseBtn.textContent = '⏸ 暂停';
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  }

  function togglePause() {
    if (!audioCtx) return;
    if (audioCtx.state === 'running') {
      audioCtx.suspend();
      pauseBtn.textContent = '▶ 继续';
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    } else {
      audioCtx.resume();
      pauseBtn.textContent = '⏸ 暂停';
      if (currentSamples) visualize(currentSamples, currentRate);
    }
  }

  function visualize(samples, rate) {
    if (rafId) cancelAnimationFrame(rafId);
    const len = samples.length, total = len / rate;
    let start = performance.now() / 1000;

    function draw() {
      if (!isPlaying && audioCtx?.state !== 'running') {
        rafId = requestAnimationFrame(draw);
        return;
      }
      const now = performance.now() / 1000;
      const t = (now - start) % total;
      const idx = Math.floor(t * rate);
      const view = Math.min(idx, len - 1);

      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = '#0b111a';
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = '#6fc3ff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let i = 0; i < w; i++) {
        const si = Math.floor((i / w) * len);
        const val = (samples[si] / 128) * (h / 2);
        const x = i, y = h/2 - val;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();

      ctx.strokeStyle = '#ff7a5c';
      ctx.lineWidth = 1;
      ctx.beginPath();
      const px = (view / len) * w;
      ctx.moveTo(px, 0);
      ctx.lineTo(px, h);
      ctx.stroke();

      updateInfo(view / rate);
      rafId = requestAnimationFrame(draw);
    }
    draw();
  }

  function updateInfo(time) {
    infoEl.textContent = `t=${Math.floor(time * currentRate)} · ${time.toFixed(2)}s`;
  }

  // 复制
  function copyCode() {
    navigator.clipboard.writeText(codeEl.value).then(() => {
      errorEl.textContent = '✅ 已复制';
      setTimeout(() => errorEl.textContent = '', 1500);
    }).catch(() => {
      errorEl.textContent = '❌ 复制失败';
    });
  }

  // 导出 WAV (base64)
  function renderWAV() {
    const name = document.getElementById('renderName').value || 'funk_beat';
    const seconds = parseFloat(document.getElementById('renderSeconds').value) || 16;
    const bar = document.getElementById('renderBar');
    const status = document.getElementById('renderStatus');

    const code = codeEl.value;
    const rate = parseInt(sampleRateEl.value);
    const fn = compile(code);

    const len = Math.floor(rate * seconds);
    const samples = new Int8Array(len);
    for (let i = 0; i < len; i++) samples[i] = fn(i) & 0xFF;

    const data = new Uint8Array(samples.buffer);
    const wav = new Uint8Array(44 + data.length);
    const view = new DataView(wav.buffer);

    const write = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
    write(0, 'RIFF');
    view.setUint32(4, 36 + data.length, true);
    write(8, 'WAVE');
    write(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, rate, true);
    view.setUint32(28, rate, true);
    view.setUint16(32, 1, true);
    view.setUint16(34, 8, true);
    write(36, 'data');
    view.setUint32(40, data.length, true);
    wav.set(data, 44);

    let binary = '';
    for (let i = 0; i < wav.length; i += 8192) {
      const chunk = wav.subarray(i, Math.min(i + 8192, wav.length));
      binary += String.fromCharCode.apply(null, chunk);
    }
    const link = document.createElement('a');
    link.href = 'data:audio/wav;base64,' + btoa(binary);
    link.download = name + '.wav';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    bar.style.width = '100%';
    status.textContent = '✅ 导出完成';
    setTimeout(() => { bar.style.width = '0%'; status.textContent = ''; }, 2000);
  }

  // 事件绑定
  playBtn.addEventListener('click', play);
  pauseBtn.addEventListener('click', togglePause);
  stopBtn.addEventListener('click', stop);
  copyBtn.addEventListener('click', copyCode);
  renderBtn.addEventListener('click', () => document.getElementById('renderOverlay').style.display = 'flex');
  document.getElementById('renderStartBtn').addEventListener('click', renderWAV);
  document.querySelector('#renderOverlay > div > span').addEventListener('click', () => {
    document.getElementById('renderOverlay').style.display = 'none';
  });

  // 快捷键
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'TEXTAREA' && (e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      play();
    }
    if (e.key === ' ' && e.target.tagName !== 'TEXTAREA') {
      e.preventDefault();
      isPlaying ? togglePause() : play();
    }
  });

  console.log('🎵 Funk Bytebeat 已加载');
  // 自动播放
  setTimeout(play, 500);
})();
</script>
</body>
</html>
