<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>♬ bytebeat · Blue Glass</title>
  <style>
    /* === 融合 b7 的玻璃质感与 b8 的暗色基调 === */
    :root {
      --primary: #4facfe;
      --accent: #00f2fe;
      --glass-bg: rgba(10, 15, 30, 0.85);
      --glass-card: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.14);
      --text: #eaf6ff;
      --subtext: #91a4b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, 'Cascadia Code', 'Consolas', monospace;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(79, 172, 254, 0.45), transparent 28%),
        radial-gradient(circle at 90% 20%, rgba(0, 242, 254, 0.35), transparent 32%),
        linear-gradient(135deg, #050a18 0%, #081229 45%, #050c22 100%);
      background-attachment: fixed;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app {
      max-width: 1000px;
      width: 100%;
      flex: 1;
    }

    .hero {
      text-align: center;
      margin-bottom: 24px;
    }

    .hero h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ffffff, #a8d8ff);
      -webkit-background-clip: text;
      color: transparent;
    }

    .hero p {
      color: var(--subtext);
      margin-top: 8px;
      font-size: 14px;
    }

    /* 页面切换标签 */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
      background: rgba(255,255,255,0.04);
      border-radius: 18px;
      padding: 6px;
      border: 1px solid var(--glass-border);
    }

    .tab-btn {
      flex: 1;
      border: none;
      border-radius: 14px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      color: var(--subtext);
      transition: 0.25s ease;
      font-family: inherit;
      backdrop-filter: blur(4px);
      text-align: center;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(79, 172, 254, 0.25), rgba(0, 242, 254, 0.15));
      color: #fff;
      border: 1px solid rgba(79, 172, 254, 0.25);
      box-shadow: 0 2px 12px rgba(79, 172, 254, 0.15);
    }

    .tab-btn:hover:not(.active) {
      color: #c8dfff;
      background: rgba(255,255,255,0.04);
    }

    .page {
      display: none;
      animation: fade 0.35s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fade {
      0% { opacity: 0.3; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
      border: 1px solid var(--glass-border);
      border-radius: 26px;
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      padding: 18px;
      margin-bottom: 18px;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      color: #eaf6ff;
      padding: 14px;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: 13px;
      line-height: 1.55;
      resize: vertical;
      tab-size: 4;
    }

    textarea:focus {
      outline: none;
      border-color: rgba(79, 172, 254, 0.45);
      box-shadow: 0 0 0 2px rgba(79, 172, 254, 0.14);
    }

    canvas {
      width: 100%;
      height: 140px;
      background: rgba(0, 4, 12, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      margin-top: 12px;
      display: block;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
    }

    button {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      color: #eaf6ff;
      padding: 9px 18px;
      font-size: 14px;
      cursor: pointer;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.05));
      transition: 0.22s ease;
      font-family: inherit;
      backdrop-filter: blur(4px);
    }

    button:hover {
      transform: translateY(-1px);
      border-color: rgba(79, 172, 254, 0.35);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.08));
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    select,
    input[type='number'] {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #eaf6ff;
      padding: 7px 10px;
      font-size: 13px;
      font-family: inherit;
      backdrop-filter: blur(4px);
    }

    select:focus,
    input:focus {
      outline: none;
      border-color: rgba(79, 172, 254, 0.35);
    }

    input[type='range'] {
      width: 100px;
      accent-color: #4facfe;
      background: transparent;
    }

    .info {
      color: var(--subtext);
      font-size: 12px;
      margin-left: auto;
      white-space: nowrap;
    }

    .error {
      color: #ff7b7b;
      min-height: 24px;
      margin-top: 8px;
      font-size: 13px;
    }

    .flex-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .flex-row label {
      color: var(--subtext);
      font-size: 13px;
    }

    .footer {
      text-align: center;
      padding: 20px 0 10px 0;
      color: var(--subtext);
      font-size: 14px;
      opacity: 0.7;
      letter-spacing: 1px;
      font-weight: 300;
      width: 100%;
      max-width: 1000px;
    }

    .footer span {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      -webkit-background-clip: text;
      color: transparent;
      font-weight: 500;
    }

    /* 进化页专用 */
    .drop-zone {
      border: 2px dashed rgba(79, 172, 254, 0.3);
      border-radius: 18px;
      padding: 30px 20px;
      text-align: center;
      color: var(--subtext);
      transition: 0.3s ease;
      cursor: pointer;
      background: rgba(0,0,0,0.15);
      margin-bottom: 14px;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--primary);
      background: rgba(79, 172, 254, 0.07);
    }

    .drop-zone input[type="file"] {
      display: none;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 6px;
      overflow: hidden;
      margin: 12px 0;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      border-radius: 6px;
      transition: width 0.1s linear;
    }

    .evolve-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin: 12px 0;
      font-size: 13px;
      color: var(--subtext);
    }

    .evolve-stats span {
      color: #d0e8ff;
      font-weight: 500;
    }

    @media (max-width: 640px) {
      body {
        padding: 12px;
      }
      .card {
        padding: 14px;
      }
      .hero h1 {
        font-size: 22px;
      }
      textarea {
        min-height: 120px;
        font-size: 12px;
      }
      canvas {
        height: 120px;
      }
      .info {
        margin-left: 0;
        width: 100%;
        text-align: right;
      }
      .footer {
        font-size: 12px;
        padding: 15px 0 5px 0;
      }
      .evolve-stats {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="hero">
    <h1>♬ bytebeat · Blue Glass</h1>
    <p>轻量 · 干净 · 全功能 · 融合 b7 与 b8</p>
  </div>

  <!-- 双页面切换标签 -->
  <div class="tabs">
    <button class="tab-btn active" data-page="page-synth">🎛 合成器</button>
    <button class="tab-btn" data-page="page-evolve">🧬 音频进化</button>
  </div>

  <!-- ==================== 页面1：合成器（原UI） ==================== -->
  <div id="page-synth" class="page active">
    <div class="card">
      <textarea id="code" spellcheck="false">
//bytebeat funk v2 初见原创
A='1111100000011111111111111111111111111111111111111111111000001111111001111111110001000000000000001111110000000000000000000111111111111001111110000000000000000000000000000000000',n=1.26,t||(a=b=d=e=0),c=a+=b+=(n*2*2**([1,1,1,7,7,7,8,8,8,8,10,12,12,12,10,10,3,3,3,8,8,[7.8,7.5,7.3,7.1][t>>10&3],7,7,7,7,15,10,10,10,7,7,5,5,5,12,12,12,15,15,15,15,12,12,10,10,12,12,0,0,0,8,8,8,7,7,7,7,3,3,0,0,3,3,1,1,1,7,7,7,8,8,8,8,10,12,12,12,10,10,3,3,3,8,8,[7.8,7.5,7.3,7.1][t>>10&3],7,7,7,7,15,10,10,10,7,7,5,5,5,17,17,17,15,15,15,15,12,12,10,10,12,12,8,8,8,20,20,20,19,19,19,19,17,17,15,12,10,12][t>>12&127]/12)-b)/800,g=d+=e+=(n*2**([1,s=[3,3,3,[3,4][t>>13&1]][t>>14&3],5,[0,0,0,[-2,0][t>>13&1]][t>>14&3],1,s,5,[8,8,8,[10,12][t>>13&1]][t>>14&3]][t>>16&7]/12)-e)/400,A[(c*175>>8)%175]/1.3+(A[(g*175>>8)%175]/2+(A[(g/2*175>>8)%175]/3-1))*(-(t+'00055522227744440005552222774422'[t>>12&31]*4096)>>7&255)/200+sin(t*n*PI/512*2**.25)*(-t>>13&1)*0
      </textarea>

      <canvas id="canvas" width="800" height="140"></canvas>

      <div class="controls">
        <button id="playBtn">▶ 播放</button>
        <button id="pauseBtn" disabled>⏸ 暂停</button>
        <button id="stopBtn" disabled>⏹ 停止</button>

        <select id="mode">
          <option value="bytebeat">Bytebeat</option>
          <option value="signedbytebeat">Signed</option>
          <option value="floatbeat" selected>Floatbeat</option>
          <option value="bitbeat">Bitbeat</option>
          <option value="1024">1024</option>
          <option value="tanmode">Tanmode</option>
        </select>

        <select id="sampleRate">
          <option value="8000">8 kHz</option>
          <option value="11025">11 kHz</option>
          <option value="16000">16 kHz</option>
          <option value="22050">22 kHz</option>
          <option value="32000" selected>32 kHz</option>
          <option value="44100">44.1 kHz</option>
          <option value="48000">48 kHz</option>
        </select>

        <span>÷<input id="divisor" type="number" min="1" value="1" style="width:50px" /></span>
        <span>🔊<input id="volume" type="range" min="0" max="100" value="35" /></span>
        <span class="info" id="info">t=0 · 0.00s</span>
      </div>

      <div class="flex-row" style="margin-top: 8px;">
        <label>时长 <input id="duration" type="number" min="1" value="10" style="width:56px;" /> s</label>
        <button id="gencodeBtn">🎲 随机代码</button>
        <button id="forloopBtn">🔄 For循环</button>
        <button id="copyUrlBtn">📋 复制URL</button>
        <button id="downloadBtn">⬇ 下载WAV</button>
        <span style="color:var(--subtext);font-size:12px;" id="charCount">0c</span>
      </div>

      <div id="error" class="error"></div>
    </div>
  </div>

  <!-- ==================== 页面2：音频进化 ==================== -->
  <div id="page-evolve" class="page">
    <div class="card">
      <h3 style="margin-bottom:10px;font-weight:400;">🎯 上传音频 → 进化出Bytebeat公式</h3>
      <p style="color:var(--subtext);font-size:14px;margin-bottom:14px;">
        遗传算法将搜索公式空间，使Bytebeat声音逼近你的音频。
      </p>

      <div class="drop-zone" id="dropZone">
        <div>📂 拖拽或点击上传 WAV / MP3</div>
        <input type="file" id="fileInput" accept=".wav,.mp3,.aac,.ogg,.flac" />
        <div style="margin-top:10px;font-size:13px;color:var(--subtext);" id="fileInfo">未选择文件</div>
      </div>

      <div class="flex-row" style="margin-bottom:10px;">
        <label>种群大小 <input type="number" id="popSize" value="30" min="10" max="100" style="width:56px;" /></label>
        <label>代数 <input type="number" id="generations" value="50" min="10" max="200" style="width:56px;" /></label>
        <label>时长 <input type="number" id="evolveDuration" value="3" min="1" max="8" style="width:50px;" />s</label>
        <button id="startEvolveBtn" disabled>🚀 开始进化</button>
        <button id="stopEvolveBtn" disabled>⏹ 停止</button>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="evolve-stats">
        <div>代数: <span id="genCounter">0</span></div>
        <div>最佳适应度: <span id="bestFitness">—</span></div>
        <div>当前最佳: <span id="bestFormulaPreview">—</span></div>
      </div>

      <!-- 将进化出的公式填入这个只读区域，点击“使用此公式”可切换到合成器 -->
      <textarea id="evolvedFormula" readonly style="min-height:80px;font-size:12px;resize:none;" placeholder="进化出的公式将显示在这里..."></textarea>
      <div class="flex-row" style="margin-top:10px;">
        <button id="useFormulaBtn" disabled>📥 使用此公式（切换到合成器）</button>
        <button id="playEvolvedBtn" disabled>▶ 试听</button>
        <span style="color:var(--subtext);font-size:12px;" id="evolveStatus">就绪</span>
      </div>
      <div id="evolveError" class="error"></div>
    </div>
  </div>
</div>

<div class="footer">
  <span>by 初见 · 双页版</span>
</div>

<script>
  (function() {
    'use strict';

    // ============================================================
    // 1. 页面切换
    // ============================================================
    const tabBtns = document.querySelectorAll('.tab-btn');
    const pages = {
      synth: document.getElementById('page-synth'),
      evolve: document.getElementById('page-evolve'),
    };

    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tabBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const pageId = btn.dataset.page;
        Object.values(pages).forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
      });
    });

    // ============================================================
    // 2. 合成器（原逻辑 100% 保留，仅将 downloadWavBase64 暴露给进化页使用）
    // ============================================================
    const codeEl = document.getElementById('code');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const stopBtn = document.getElementById('stopBtn');
    const modeEl = document.getElementById('mode');
    const sampleRateEl = document.getElementById('sampleRate');
    const divisorEl = document.getElementById('divisor');
    const volumeEl = document.getElementById('volume');
    const infoEl = document.getElementById('info');
    const errorEl = document.getElementById('error');
    const durationEl = document.getElementById('duration');
    const charCount = document.getElementById('charCount');
    const downloadBtn = document.getElementById('downloadBtn');

    const state = {
      audioCtx: null,
      source: null,
      isPlaying: false,
      rafId: null,
      currentSamples: null,
      currentRate: 44100,
      compileCache: new Map(),
      buffer: null,
      pausedAt: 0,
      elapsedTime: 0,
      lastTimestamp: 0,
      isPaused: false,
    };

    function cleanCode(code) {
      return code.replace(/\/\/.*$/gm, '').replace(/\/\*[\s\S]*?\*\//g, '').trim();
    }

    function compileBytebeat(code) {
      const key = code;
      if (state.compileCache.has(key)) return state.compileCache.get(key);
      let src = cleanCode(code);
      src = src
        .replace(/\bsin\b/g, 'Math.sin')
        .replace(/\bcos\b/g, 'Math.cos')
        .replace(/\btan\b/g, 'Math.tan')
        .replace(/\babs\b/g, 'Math.abs')
        .replace(/\bfloor\b/g, 'Math.floor')
        .replace(/\bceil\b/g, 'Math.ceil')
        .replace(/\bround\b/g, 'Math.round')
        .replace(/\brandom\b/g, 'Math.random')
        .replace(/\bpow\b/g, 'Math.pow')
        .replace(/\bsqrt\b/g, 'Math.sqrt')
        .replace(/\blog\b/g, 'Math.log')
        .replace(/\bexp\b/g, 'Math.exp')
        .replace(/\bPI\b/g, 'Math.PI')
        .replace(/\bE\b/g, 'Math.E')
        .replace(/\bTAU\b/g, 'Math.PI * 2');
      let fn;
      try {
        fn = new Function('t', `return (${src});`);
      } catch (e) {
        errorEl.textContent = `编译错误: ${e.message}`;
        return null;
      }
      const wrapped = (t) => {
        try {
          const v = fn(t);
          return typeof v === 'number' ? v : 0;
        } catch (e) {
          errorEl.textContent = `运行错误: ${e.message}`;
          return 0;
        }
      };
      state.compileCache.set(key, wrapped);
      return wrapped;
    }

    function generateSamples(fn, duration, rate, mode) {
      const len = Math.floor(rate * duration);
      const arr = new Float32Array(len);
      const modeMap = {
        'bytebeat': (v) => ((v | 0) & 255) / 127.5 - 1,
        'signedbytebeat': (v) => (((v | 0) + 128) & 255) / 127.5 - 1,
        'floatbeat': (v) => v,
        'bitbeat': (v) => ((v | 0) & 1) - 0.5,
        '1024': (v) => ((v | 0) & 1023) / 511.5 - 1,
        'tanmode': (v) => Math.tan(v * Math.PI / 128),
      };
      const converter = modeMap[mode] || modeMap['bytebeat'];
      for (let i = 0; i < len; i++) {
        const raw = fn(i);
        arr[i] = converter(raw);
      }
      return arr;
    }

    function drawWave(samples, rate, time) {
      const w = canvas.width;
      const h = canvas.height;
      const half = h / 2;
      ctx.fillStyle = 'rgba(0, 4, 18, 0.5)';
      ctx.fillRect(0, 0, w, h);
      ctx.shadowColor = 'rgba(79, 172, 254, 0.3)';
      ctx.shadowBlur = 10;
      ctx.strokeStyle = 'rgba(79, 172, 254, 0.85)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      const step = Math.floor(samples.length / w) || 1;
      for (let x = 0; x < w; x++) {
        const i = Math.floor(x * step);
        const v = Math.max(-1, Math.min(1, samples[i] || 0)) * half;
        const y = half - v;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
      const pos = Math.floor((time / (samples.length / rate)) * w);
      ctx.strokeStyle = 'rgba(255, 123, 123, 0.9)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(pos, 0);
      ctx.lineTo(pos, h);
      ctx.stroke();
    }

    function startVisual(samples, rate) {
      if (state.rafId) cancelAnimationFrame(state.rafId);
      state.elapsedTime = 0;
      state.lastTimestamp = performance.now();
      state.isPaused = false;
      const totalDuration = samples.length / rate;
      const draw = (timestamp) => {
        if (!state.isPlaying && state.audioCtx?.state !== 'running') {
          state.rafId = requestAnimationFrame(draw);
          return;
        }
        const now = performance.now();
        const delta = (now - state.lastTimestamp) / 1000;
        state.lastTimestamp = now;
        if (state.audioCtx && state.audioCtx.state === 'running' && !state.isPaused) {
          state.elapsedTime += delta;
          if (state.elapsedTime >= totalDuration) {
            state.elapsedTime = state.elapsedTime % totalDuration;
          }
        }
        const t = state.elapsedTime;
        drawWave(samples, rate, t);
        infoEl.textContent = `t=${Math.floor(t * rate)} · ${t.toFixed(2)}s`;
        state.rafId = requestAnimationFrame(draw);
      };
      state.lastTimestamp = performance.now();
      draw(state.lastTimestamp);
    }

    async function play() {
      const code = codeEl.value.trim();
      if (!code) { errorEl.textContent = '⚠ 请输入 Bytebeat 代码'; return; }
      errorEl.textContent = '';
      if (!state.audioCtx) {
        state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      await state.audioCtx.resume();
      const sr = +sampleRateEl.value;
      const div = +divisorEl.value || 1;
      const rate = Math.floor(sr / div);
      state.currentRate = rate;
      const mode = modeEl.value;
      const duration = +durationEl.value || 8;
      const fn = compileBytebeat(code);
      if (!fn) return;
      let samples;
      try {
        samples = generateSamples(fn, duration, rate, mode);
      } catch (e) {
        errorEl.textContent = `生成音频错误: ${e.message}`;
        return;
      }
      state.currentSamples = samples;
      const buf = state.audioCtx.createBuffer(1, samples.length, rate);
      const data = buf.getChannelData(0);
      const vol = +volumeEl.value / 100;
      for (let i = 0; i < samples.length; i++) {
        data[i] = Math.max(-1, Math.min(1, samples[i] * vol));
      }
      if (state.source) {
        try { state.source.stop(); } catch (_) {}
      }
      state.source = state.audioCtx.createBufferSource();
      state.source.buffer = buf;
      state.source.loop = true;
      state.source.connect(state.audioCtx.destination);
      state.source.start();
      state.isPlaying = true;
      state.buffer = buf;
      state.isPaused = false;
      state.elapsedTime = 0;
      playBtn.textContent = '▶ 播放中';
      playBtn.disabled = true;
      pauseBtn.disabled = false;
      stopBtn.disabled = false;
      pauseBtn.textContent = '⏸ 暂停';
      startVisual(samples, rate);
    }

      if (state.rafId) {
        cancelAnimationFrame(state.rafId);

    function generateRandomCode() {
      const patterns = [
        () => `t*((t>>${rand(3,8)}&${rand(1,15)})+${rand(1,4)})|t>>(${(t>>rand(3,8)&rand(1,7))+rand(1,3)})`,
        () => `(sin(t*${rand(1,5)}/${rand(50,200)})*${rand(50,200)})|0`,
        () => `(t*(${rand(1,5)}&t>>${rand(3,10)}))|(t>>${rand(2,6)}&${rand(1,15)})`,
        () => `(t>>${rand(3,8)}&${rand(1,15)})?t>>${rand(2,6)}:t&${rand(15,255)}`,
        () => `(t*${rand(1,3)}+${rand(100,500)})&${rand(255,1023)}`,
        () => `((sin(t/${rand(50,200)})*${rand(50,200)})|0)&${rand(255,1023)}`,
        () => `(t>>${rand(2,6)})|((t>>${rand(4,10)})&${rand(1,15)})`,
        () => `t*(${rand(1,4)}&(t>>${rand(3,9)}))`,
        () => `(t>>${rand(4,10)}&${rand(1,7)})*${rand(20,80)}`,
        () => `(tan(t/${rand(100,300)})*${rand(30,120)})|0`,
      ];
      function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
      let code = '';
      const count = rand(2, 4);
      for (let i = 0; i < count; i++) {
        const pick = patterns[Math.floor(Math.random() * patterns.length)];
        let part = pick();
        if (Math.random() > 0.5) part = `(${part})`;
        if (i > 0) {
          const ops = ['|', '&', '+', '^', '|', '&', '+'];
          code += ' ' + ops[Math.floor(Math.random() * ops.length)] + ' ';
        }
        code += part;
      }
      if (!code.includes('t')) code = `t&${rand(255,1023)}`;
      codeEl.value = code;
      updateCharCount();
      updateURLHash();
      errorEl.textContent = '';
    }

    function forLoopManip() {
      const num = prompt('输入循环次数 (数字)');

      if (template === null) return;
      let out = '';
      for (let i = 0; i < parseInt(num); i++) {

    // 暴露给进化页使用
    function downloadWavBase64() {
      const code = codeEl.value.trim();
      if (!code) {
        errorEl.textContent = '⚠ 请先输入代码再下载';
        return;
      }
      errorEl.textContent = '';
      const sr = +sampleRateEl.value;
      const div = +divisorEl.value || 1;
      const rate = Math.floor(sr / div);
      const mode = modeEl.value;
      const duration = +durationEl.value || 8;
      const fn = compileBytebeat(code);
      if (!fn) return;
      let samples;
      try {
        samples = generateSamples(fn, duration, rate, mode);
      } catch (e) {
        errorEl.textContent = `生成音频错误: ${e.message}`;
        return;
      }
      const vol = +volumeEl.value / 100;
      for (let i = 0; i < samples.length; i++) {
        samples[i] = Math.max(-1, Math.min(1, samples[i] * vol));
      }
      const numChannels = 1;
      const sampleRate = rate;
      const bitsPerSample = 16;
      const byteRate = sampleRate * numChannels * bitsPerSample / 8;
      const blockAlign = numChannels * bitsPerSample / 8;
      const dataSize = samples.length * 2;
      const headerSize = 44;
      const totalSize = headerSize + dataSize;
      const buffer = new ArrayBuffer(totalSize);
      const dv = new DataView(buffer);
      const writeString = (offset, str) => {
        for (let i = 0; i < str.length; i++) {
          dv.setUint8(offset + i, str.charCodeAt(i));
        }
      };
      writeString(0, 'RIFF');
      dv.setUint32(4, totalSize - 8, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      dv.setUint32(16, 16, true);
      dv.setUint16(20, 1, true);
      dv.setUint16(22, numChannels, true);
      dv.setUint32(24, sampleRate, true);
      dv.setUint32(28, byteRate, true);
      dv.setUint16(32, blockAlign, true);
      dv.setUint16(34, bitsPerSample, true);
      writeString(36, 'data');
      dv.setUint32(40, dataSize, true);
      const offset = 44;
      for (let i = 0; i < samples.length; i++) {
        const val = Math.max(-1, Math.min(1, samples[i]));
        const int16 = val < 0 ? val * 0x8000 : val * 0x7FFF;
        const clamped = Math.max(-0x8000, Math.min(0x7FFF, Math.round(int16)));
        dv.setInt16(offset + i * 2, clamped, true);
      }
      let binary = '';
      const bytes = new Uint8Array(buffer);
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      const base64 = btoa(binary);
      const dataUri = 'data:audio/wav;base64,' + base64;
      const link = document.createElement('a');
      link.href = dataUri;
      link.download = 'bytebeat_' + Date.now() + '.wav';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      errorEl.textContent = '✅ 下载已触发 (Base64)';
    }

    function handleFile(file) {
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try {
          const arrayBuf = ev.target.result;
          let audioBuf;
          if (!state.audioCtx) {
            state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          // 尝试解码
          try {
            audioBuf = await state.audioCtx.decodeAudioData(arrayBuf);
          } catch (decErr) {
            // 部分格式需要 ArrayBuffer 直接解析，用 Blob 方式重试
            const blob = new Blob([arrayBuf]);
            const url = URL.createObjectURL(blob);
            const resp = await fetch(url);
            const newBuf = await resp.arrayBuffer();
            audioBuf = await state.audioCtx.decodeAudioData(newBuf);
            URL.revokeObjectURL(url);
          }
          const mono = audioBuf.numberOfChannels === 1 ? audioBuf.getChannelData(0) : (() => {
            const l = audioBuf.getChannelData(0);
            const r = audioBuf.getChannelData(1);
            const m = new Float32Array(l.length);
            for (let i = 0; i < l.length; i++) m[i] = (l[i] + r[i]) * 0.5;
            return m;
          })();
          // 重采样到 32kHz 以便快速比较
          targetRate = 32000;
          const ratio = audioBuf.sampleRate / targetRate;
          const newLen = Math.floor(mono.length / ratio);
          targetSamples = new Float32Array(newLen);
          for (let i = 0; i < newLen; i++) {
            const srcIdx = Math.floor(i * ratio);
            targetSamples[i] = mono[Math.min(srcIdx, mono.length - 1)];
          }
          fileInfo.textContent = `✅ ${file.name} (${targetSamples.length} samples)`;
          startEvolveBtn.disabled = false;
          evolveError.textContent = '';
        } catch (err) {
          evolveError.textContent = '❌ 无法解码音频: ' + err.message;
          targetSamples = null;
          startEvolveBtn.disabled = true;
        }
      };
      reader.readAsArrayBuffer(file);
    }

    // ===== 遗传算法引擎 =====
    function randomFormula(length) {
      const parts = ['t', 't>>2', 't>>4', 't>>6', 't>>8', 't&255', 't&1023', 'sin(t/128)', 'cos(t/64)'];
      const ops = ['|', '&', '+', '^', '*', '%'];
      let f = parts[Math.floor(Math.random() * parts.length)];
      const len = Math.max(3, length || Math.floor(Math.random() * 6) + 3);
      for (let i = 0; i < len; i++) {
        const op = ops[Math.floor(Math.random() * ops.length)];
        const p = parts[Math.floor(Math.random() * parts.length)];
        // 随机数字
        if (Math.random() > 0.6) {
          f = `(${f})${op}${Math.floor(Math.random() * 20) + 1}`;
        } else {
          f = `(${f})${op}(${p})`;
        }
        if (Math.random() > 0.7) {
          f = `((${f})>>${Math.floor(Math.random() * 6) + 1})`;
        }
      }
      return f;
    }

    function mutateFormula(f) {
      const ops = ['|', '&', '+', '^', '*', '%'];
      // 随机替换一个子表达式
      if (Math.random() > 0.5) {
        // 替换数字
        return f.replace(/\d+/g, (match) => {
          if (Math.random() > 0.7) {
            return String(Math.floor(Math.random() * 30) + 1);
          }
          return match;
        });
      } else {
        // 追加一个操作
        const op = ops[Math.floor(Math.random() * ops.length)];
        const p = ['t', 't>>2', 't>>4', 'sin(t/128)', 'cos(t/64)', String(Math.floor(Math.random() * 20) + 1)][Math.floor(Math.random() * 6)];
        return `(${f})${op}(${p})`;
      }
    }

    function crossover(a, b) {
      const mid = Math.floor(a.length / 2);
      return a.slice(0, mid) + b.slice(mid);
    }

    function fitness(formula, target, duration, rate, mode) {
      try {
        const fn = compileBytebeat(formula);
        if (!fn) return Infinity;
        const samples = generateSamples(fn, duration, rate, mode);
        if (samples.length !== target.length) {
          // 重采样对齐
          const ratio = samples.length / target.length;
          let sum = 0;
          for (let i = 0; i < target.length; i++) {
            const idx = Math.floor(i * ratio);
            const diff = samples[Math.min(idx, samples.length - 1)] - target[i];
            sum += diff * diff;
          }
          return sum / target.length;
        }
        let sum = 0;
        for (let i = 0; i < target.length; i++) {
          const diff = samples[i] - target[i];
          sum += diff * diff;
        }
        return sum / target.length;
      } catch (e) {
        return Infinity;
      }
    }

    async function runEvolution() {
      if (!targetSamples) {
        evolveError.textContent = '⚠ 请先上传音频';
        return;
      }
      const popSize = Math.min(100, Math.max(10, parseInt(popSizeEl.value) || 30));
      const maxGen = Math.min(200, Math.max(10, parseInt(generationsEl.value) || 50));
      const duration = Math.min(8, Math.max(1, parseInt(evolveDurationEl.value) || 3));
      const rate = 32000; // 固定32kHz快速计算
      const mode = 'floatbeat';

      evolving = true;
      stopEvolve = false;
      startEvolveBtn.disabled = true;
      stopEvolveBtn.disabled = false;
      playEvolvedBtn.disabled = true;
      useFormulaBtn.disabled = true;
      evolveStatus.textContent = '⏳ 进化中...';

      // 种群初始化
      let population = [];
      for (let i = 0; i < popSize; i++) {
        population.push(randomFormula(4 + Math.floor(Math.random() * 4)));
      }

      bestFormula = '';
      bestFitnessVal = Infinity;

      for (let gen = 0; gen < maxGen; gen++) {
        if (stopEvolve) break;

        // 评估
        const fitnesses = population.map(f => fitness(f, targetSamples, duration, rate, mode));
        let genBestIdx = 0;
        let genBestVal = Infinity;
        for (let i = 0; i < fitnesses.length; i++) {
          if (fitnesses[i] < genBestVal) {
            genBestVal = fitnesses[i];
            genBestIdx = i;
          }
        }

        if (genBestVal < bestFitnessVal) {
          bestFitnessVal = genBestVal;
          bestFormula = population[genBestIdx];
          evolvedFormula.value = bestFormula;
          bestFitness.textContent = bestFitnessVal.toExponential(4);
          bestFormulaPreview.textContent = bestFormula.slice(0, 40) + (bestFormula.length > 40 ? '…' : '');
          useFormulaBtn.disabled = false;
          playEvolvedBtn.disabled = false;
        }

        genCounter.textContent = gen + 1;
        progressFill.style.width = `${((gen + 1) / maxGen * 100)}%`;
        evolveStatus.textContent = `⏳ 第 ${gen+1}/${maxGen} 代  最佳: ${bestFitnessVal.toExponential(4)}`;

        // 选择 & 繁殖 (锦标赛)
        const newPop = [];
        // 保留精英
        newPop.push(bestFormula);
        newPop.push(population[genBestIdx]);

        while (newPop.length < popSize) {
          // 锦标赛选择
          const idx1 = Math.floor(Math.random() * popSize);
          const idx2 = Math.floor(Math.random() * popSize);
          const parent1 = fitnesses[idx1] < fitnesses[idx2] ? population[idx1] : population[idx2];
          const idx3 = Math.floor(Math.random() * popSize);
          const idx4 = Math.floor(Math.random() * popSize);
          const parent2 = fitnesses[idx3] < fitnesses[idx4] ? population[idx3] : population[idx4];

          let child = crossover(parent1, parent2);
          if (Math.random() > 0.5) child = mutateFormula(child);
          // 长度限制
          if (child.length > 300) child = randomFormula(4);
          newPop.push(child);
        }
        population = newPop;

        // 允许UI更新
        await new Promise(r => setTimeout(r, 0));
      }

      evolving = false;
      stopEvolveBtn.disabled = true;
      startEvolveBtn.disabled = false;
      if (bestFormula) {
        evolvedFormula.value = bestFormula;
        useFormulaBtn.disabled = false;
        playEvolvedBtn.disabled = false;
        evolveStatus.textContent = `✅ 完成！适应度: ${bestFitnessVal.toExponential(4)}`;
        bestFitness.textContent = bestFitnessVal.toExponential(4);
        bestFormulaPreview.textContent = bestFormula.slice(0, 40) + (bestFormula.length > 40 ? '…' : '');
      } else {
        evolveStatus.textContent = '❌ 未找到有效公式';
      }
      progressFill.style.width = '100%';
    }

    startEvolveBtn.addEventListener('click', runEvolution);

        const samples = generateSamples(fn, duration, rate, 'floatbeat');
        const buf = evolveAudioCtx.createBuffer(1, samples.length, rate);

        evolveSource.start();
        evolveError.textContent = '🔊 试听中...';
        evolveSource.onended = () => { evolveError.textContent = ''; };
      } catch (e) {
        evolveError.textContent = '❌ 试听错误: ' + e.message;
      }
    });

    // 初始禁用
    startEvolveBtn.disabled = true;
    stopEvolveBtn.disabled = true;
    useFormulaBtn.disabled = true;
    playEvolvedBtn.disabled = true;

    // 暴露 compileBytebeat / generateSamples 给进化使用
    window.__bytebeat = { compileBytebeat, generateSamples };

  })();
</script>
</body>
</html>
