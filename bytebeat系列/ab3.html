<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>♬ bytebeat · Blue Glass</title>
    <style>
        /* === 初见.nb666,lets gooooooo === */
        :root {
          --primary: #4facfe;
          --accent: #00f2fe;
          --glass-bg: rgba(10, 15, 30, 0.85);
          --glass-card: rgba(255, 255, 255, 0.06);
          --glass-border: rgba(255, 255, 255, 0.14);
          --text: #eaf6ff;
          --subtext: #91a4b8;
        }
        
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        
        body {
          min-height: 100vh;
          font-family: system-ui, -apple-system, 'Cascadia Code', 'Consolas', monospace;
          color: var(--text);
          background:
            radial-gradient(circle at 10% 10%, rgba(79, 172, 254, 0.45), transparent 28%),
            radial-gradient(circle at 90% 20%, rgba(0, 242, 254, 0.35), transparent 32%),
            linear-gradient(135deg, #050a18 0%, #081229 45%, #050c22 100%);
          background-attachment: fixed;
          padding: 18px;
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        
        .app {
          max-width: 1000px;
          width: 100%;
          flex: 1;
        }
        
        .hero {
          text-align: center;
          margin-bottom: 24px;
        }
        
        .hero h1 {
          font-size: 28px;
          font-weight: 600;
          letter-spacing: 0.5px;
          background: linear-gradient(135deg, #ffffff, #a8d8ff);
          -webkit-background-clip: text;
          color: transparent;
        }
        
        .hero p {
          color: var(--subtext);
          margin-top: 8px;
          font-size: 14px;
        }
        
        .tabs {
          display: flex;
          gap: 6px;
          margin-bottom: 18px;
          background: rgba(255,255,255,0.04);
          border-radius: 18px;
          padding: 6px;
          border: 1px solid var(--glass-border);
        }
        
        .tab-btn {
          flex: 1;
          border: none;
          border-radius: 14px;
          padding: 10px 16px;
          font-size: 14px;
          font-weight: 500;
          cursor: pointer;
          background: transparent;
          color: var(--subtext);
          transition: 0.25s ease;
          font-family: inherit;
          backdrop-filter: blur(4px);
          text-align: center;
        }
        
        .tab-btn.active {
          background: linear-gradient(135deg, rgba(79, 172, 254, 0.25), rgba(0, 242, 254, 0.15));
          color: #fff;
          border: 1px solid rgba(79, 172, 254, 0.25);
          box-shadow: 0 2px 12px rgba(79, 172, 254, 0.15);
        }
        
        .tab-btn:hover:not(.active) {
          color: #c8dfff;
          background: rgba(255,255,255,0.04);
        }
        
        .page {
          display: none;
          animation: fade 0.35s ease;
        }
        
        .page.active {
          display: block;
        }
        
        @keyframes fade {
          0% { opacity: 0.3; transform: translateY(8px); }
          100% { opacity: 1; transform: translateY(0); }
        }
        
        .card {
          background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
          border: 1px solid var(--glass-border);
          border-radius: 26px;
          backdrop-filter: blur(18px) saturate(140%);
          -webkit-backdrop-filter: blur(18px) saturate(140%);
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
          padding: 18px;
          margin-bottom: 18px;
        }
        
        textarea {
          width: 100%;
          min-height: 160px;
          background: rgba(0, 0, 0, 0.25);
          border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 16px;
          color: #eaf6ff;
          padding: 14px;
          font-family: 'Cascadia Code', 'Consolas', monospace;
          font-size: 13px;
          line-height: 1.55;
          resize: vertical;
          tab-size: 4;
        }
        
        textarea:focus {
          outline: none;
          border-color: rgba(79, 172, 254, 0.45);
          box-shadow: 0 0 0 2px rgba(79, 172, 254, 0.14);
        }
        
        canvas {
          width: 100%;
          height: 140px;
          background: rgba(0, 4, 12, 0.55);
          border: 1px solid rgba(255, 255, 255, 0.06);
          border-radius: 16px;
          margin-top: 12px;
          display: block;
        }
        
        .controls {
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
          align-items: center;
          margin-top: 14px;
        }
        
        button {
          border: 1px solid rgba(255, 255, 255, 0.12);
          border-radius: 14px;
          color: #eaf6ff;
          padding: 9px 18px;
          font-size: 14px;
          cursor: pointer;
          background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.05));
          transition: 0.22s ease;
          font-family: inherit;
          backdrop-filter: blur(4px);
        }
        
        button:hover {
          transform: translateY(-1px);
          border-color: rgba(79, 172, 254, 0.35);
          background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.08));
        }
        
        button:active {
          transform: translateY(0);
        }
        
        button:disabled {
          opacity: 0.35;
          cursor: not-allowed;
          transform: none;
        }
        
        select,
        input[type='number'] {
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 12px;
          color: #eaf6ff;
          padding: 7px 10px;
          font-size: 13px;
          font-family: inherit;
          backdrop-filter: blur(4px);
        }
        
        select:focus,
        input:focus {
          outline: none;
          border-color: rgba(79, 172, 254, 0.35);
        }
        
        input[type='range'] {
          width: 100px;
          accent-color: #4facfe;
          background: transparent;
        }
        
        .info {
          color: var(--subtext);
          font-size: 12px;
          margin-left: auto;
          white-space: nowrap;
        }
        
        .error {
          color: #ff7b7b;
          min-height: 24px;
          margin-top: 8px;
          font-size: 13px;
        }
        
        .flex-row {
          display: flex;
          flex-wrap: wrap;
          gap: 12px;
          align-items: center;
        }
        
        .flex-row label {
          color: var(--subtext);
          font-size: 13px;
        }
        
        .footer {
          text-align: center;
          padding: 20px 0 10px 0;
          color: var(--subtext);
          font-size: 14px;
          opacity: 0.7;
          letter-spacing: 1px;
          font-weight: 300;
          width: 100%;
          max-width: 1000px;
        }
        
        .footer span {
          background: linear-gradient(135deg, #4facfe, #00f2fe);
          -webkit-background-clip: text;
          color: transparent;
          font-weight: 500;
        }
        
        .library-section {
          margin-bottom: 20px;
        }
        
        .library-section h3 {
          font-weight: 400;
          font-size: 16px;
          color: var(--subtext);
          margin-bottom: 10px;
          letter-spacing: 1px;
        }
        
        .library-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
          gap: 10px;
        }
        
        .library-item {
          background: rgba(255,255,255,0.04);
          border: 1px solid var(--glass-border);
          border-radius: 14px;
          padding: 12px 14px;
          cursor: pointer;
          transition: 0.2s ease;
          display: flex;
          flex-direction: column;
          gap: 4px;
        }
        
        .library-item:hover {
          background: rgba(79, 172, 254, 0.12);
          border-color: rgba(79, 172, 254, 0.3);
          transform: translateY(-2px);
        }
        
        .library-item .name {
          font-size: 14px;
          color: var(--text);
        }
        
        .library-item .desc {
          font-size: 11px;
          color: var(--subtext);
          font-family: 'Cascadia Code', 'Consolas', monospace;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        
        .library-item .tag {
          font-size: 10px;
          background: rgba(79, 172, 254, 0.2);
          border-radius: 6px;
          padding: 2px 8px;
          display: inline-block;
          color: var(--primary);
          align-self: flex-start;
          margin-top: 4px;
        }
        
        .toast {
          position: fixed;
          bottom: 30px;
          left: 50%;
          transform: translateX(-50%);
          background: rgba(10, 20, 40, 0.92);
          backdrop-filter: blur(12px);
          border: 1px solid var(--glass-border);
          border-radius: 16px;
          padding: 12px 24px;
          color: var(--text);
          font-size: 14px;
          z-index: 999;
          opacity: 0;
          transition: opacity 0.4s ease;
          pointer-events: none;
          white-space: nowrap;
        }
        
        .toast.show {
          opacity: 1;
        }
        
        @media (max-width: 640px) {
          body {
            padding: 12px;
          }
          .card {
            padding: 14px;
          }
          .hero h1 {
            font-size: 22px;
          }
          textarea {
            min-height: 120px;
            font-size: 12px;
          }
          canvas {
            height: 120px;
          }
          .info {
            margin-left: 0;
            width: 100%;
            text-align: right;
          }
          .footer {
            font-size: 12px;
            padding: 15px 0 5px 0;
          }
          .library-grid {
            grid-template-columns: 1fr 1fr;
          }
          .toast {
            font-size: 12px;
            padding: 10px 16px;
            white-space: normal;
            max-width: 90%;
          }
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="hero">

        <!-- ==================== 页面1：合成器 ==================== -->
        <div id="page-synth" class="page active">
            <div class="card">
                <textarea id="code" spellcheck="false">
//bytebeat funk v2 初见原创
A='1111100000011111111111111111111111111111111111111111111000001111111001111111110001000000000000001111110000000000000000000111111111111001111110000000000000000000000000000000000',n=1.26,t||(a=b=d=e=0),c=a+=b+=(n*2*2**([1,1,1,7,7,7,8,8,8,8,10,12,12,12,10,10,3,3,3,8,8,[7.8,7.5,7.3,7.1][t>>10&3],7,7,7,7,15,10,10,10,7,7,5,5,5,12,12,12,15,15,15,15,12,12,10,10,12,12,0,0,0,8,8,8,7,7,7,7,3,3,0,0,3,3,1,1,1,7,7,7,8,8,8,8,10,12,12,12,10,10,3,3,3,8,8,[7.8,7.5,7.3,7.1][t>>10&3],7,7,7,7,15,10,10,10,7,7,5,5,5,17,17,17,15,15,15,15,12,12,10,10,12,12,8,8,8,20,20,20,19,19,19,19,17,17,15,12,10,12][t>>12&127]/12)-b)/800,g=d+=e+=(n*2**([1,s=[3,3,3,[3,4][t>>13&1]][t>>14&3],5,[0,0,0,[-2,0][t>>13&1]][t>>14&3],1,s,5,[8,8,8,[10,12][t>>13&1]][t>>14&3]][t>>16&7]/12)-e)/400,A[(c*175>>8)%175]/1.3+(A[(g*175>>8)%175]/2+(A[(g/2*175>>8)%175]/3-1))*(-(t+'00055522227744440005552222774422'[t>>12&31]*4096)>>7&255)/200+sin(t*n*PI/512*2**.25)*(-t>>13&1)*0

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
          'use strict';
        
          // ============================================================
          // 0. Toast
          // ============================================================
          let toastTimer = null;
        
          function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
          }
        
          // ============================================================
          // 1. 页面切换
          // ============================================================
          const tabBtns = document.querySelectorAll('.tab-btn');
          const pages = {
            synth: document.getElementById('page-synth'),
            library: document.getElementById('page-library'),
          };
        
          tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
              tabBtns.forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              const pageId = btn.dataset.page;
              Object.values(pages).forEach(p => p.classList.remove('active'));
              document.getElementById(pageId).classList.add('active');
            });
          });
        
          // ============================================================
          // 2. 合成器
          // ============================================================
          const codeEl = document.getElementById('code');
          const canvas = document.getElementById('canvas');
          const ctx = canvas.getContext('2d');
          const playBtn = document.getElementById('playBtn');
          const pauseBtn = document.getElementById('pauseBtn');
          const stopBtn = document.getElementById('stopBtn');
          const modeEl = document.getElementById('mode');
          const sampleRateEl = document.getElementById('sampleRate');
          const divisorEl = document.getElementById('divisor');
          const volumeEl = document.getElementById('volume');
          const infoEl = document.getElementById('info');
          const errorEl = document.getElementById('error');
          const durationEl = document.getElementById('duration');
          const charCount = document.getElementById('charCount');
          const downloadBtn = document.getElementById('downloadBtn');
        
          const state = {
            audioCtx: null,
            source: null,
            isPlaying: false,
            rafId: null,
            currentSamples: null,
            currentRate: 44100,
            compileCache: new Map(),
            buffer: null,
            pausedAt: 0,
            elapsedTime: 0,
            lastTimestamp: 0,
            isPaused: false,
          };
        
          function cleanCode(code) {
            return code.replace(/\/\/.*$/gm, '').replace(/\/\*[\s\S]*?\*\//g, '').trim();
          }
        
          function compileBytebeat(code) {
            const key = code;
            if (state.compileCache.has(key)) return state.compileCache.get(key);
            let src = cleanCode(code);
            src = src
              .replace(/\bsin\b/g, 'Math.sin')
              .replace(/\bcos\b/g, 'Math.cos')
              .replace(/\btan\b/g, 'Math.tan')
              .replace(/\babs\b/g, 'Math.abs')
              .replace(/\bfloor\b/g, 'Math.floor')
              .replace(/\bceil\b/g, 'Math.ceil')
              .replace(/\bround\b/g, 'Math.round')
              .replace(/\brandom\b/g, 'Math.random')
              .replace(/\bpow\b/g, 'Math.pow')
              .replace(/\bsqrt\b/g, 'Math.sqrt')
              .replace(/\blog\b/g, 'Math.log')
              .replace(/\bexp\b/g, 'Math.exp')
              .replace(/\bPI\b/g, 'Math.PI')
              .replace(/\bE\b/g, 'Math.E')
              .replace(/\bTAU\b/g, 'Math.PI * 2');
            let fn;
            try {
              fn = new Function('t', `return (${src});`);
            } catch (e) {
              errorEl.textContent = `编译错误: ${e.message}`;
              return null;
            }
            const wrapped = (t) => {
              try {
                const v = fn(t);
                return typeof v === 'number' ? v : 0;
              } catch (e) {
                errorEl.textContent = `运行错误: ${e.message}`;
                return 0;
              }
            };
            state.compileCache.set(key, wrapped);
            return wrapped;
          }
        
          function generateSamples(fn, duration, rate, mode) {
            const len = Math.floor(rate * duration);
            const arr = new Float32Array(len);
            const modeMap = {
              'bytebeat': (v) => ((v | 0) & 255) / 127.5 - 1,
              'signedbytebeat': (v) => (((v | 0) + 128) & 255) / 127.5 - 1,
              'floatbeat': (v) => v,
              'bitbeat': (v) => ((v | 0) & 1) - 0.5,
              '1024': (v) => ((v | 0) & 1023) / 511.5 - 1,
              'tanmode': (v) => Math.tan(v * Math.PI / 128),
            };
            const converter = modeMap[mode] || modeMap['bytebeat'];
            for (let i = 0; i < len; i++) {
              const raw = fn(i);
              arr[i] = converter(raw);
            }
            return arr;
          }
        
          function drawWave(samples, rate, time) {
            const w = canvas.width;
            const h = canvas.height;
            const half = h / 2;
            ctx.fillStyle = 'rgba(0, 4, 18, 0.5)';
            ctx.fillRect(0, 0, w, h);
            ctx.shadowColor = 'rgba(79, 172, 254, 0.3)';
            ctx.shadowBlur = 10;
            ctx.strokeStyle = 'rgba(79, 172, 254, 0.85)';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            const step = Math.floor(samples.length / w) || 1;
            for (let x = 0; x < w; x++) {
              const i = Math.floor(x * step);
              const v = Math.max(-1, Math.min(1, samples[i] || 0)) * half;
              const y = half - v;
              if (x === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;
            const pos = Math.floor((time / (samples.length / rate)) * w);
            ctx.strokeStyle = 'rgba(255, 123, 123, 0.9)';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(pos, 0);
            ctx.lineTo(pos, h);
            ctx.stroke();
          }
        
          function startVisual(samples, rate) {
            if (state.rafId) cancelAnimationFrame(state.rafId);
            state.elapsedTime = 0;
            state.lastTimestamp = performance.now();
            state.isPaused = false;
            const totalDuration = samples.length / rate;
            const draw = (timestamp) => {
              if (!state.isPlaying && state.audioCtx?.state !== 'running') {
                state.rafId = requestAnimationFrame(draw);
                return;
              }
              const now = performance.now();
              const delta = (now - state.lastTimestamp) / 1000;
              state.lastTimestamp = now;
              if (state.audioCtx && state.audioCtx.state === 'running' && !state.isPaused) {
                state.elapsedTime += delta;
                if (state.elapsedTime >= totalDuration) {
                  state.elapsedTime = state.elapsedTime % totalDuration;
                }
              }
              const t = state.elapsedTime;
              drawWave(samples, rate, t);
              infoEl.textContent = `t=${Math.floor(t * rate)} · ${t.toFixed(2)}s`;
              state.rafId = requestAnimationFrame(draw);
            };
            state.lastTimestamp = performance.now();
            draw(state.lastTimestamp);
          }
        
          async function play() {
            const code = codeEl.value.trim();
            if (!code) { errorEl.textContent = '⚠ 请输入 Bytebeat 代码'; return; }
            errorEl.textContent = '';
            if (!state.audioCtx) {
              state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            await state.audioCtx.resume();
            const sr = +sampleRateEl.value;
            const div = +divisorEl.value || 1;
            const rate = Math.floor(sr / div);
            state.currentRate = rate;
            const mode = modeEl.value;
            const duration = +durationEl.value || 8;
            const fn = compileBytebeat(code);
            if (!fn) return;
            let samples;
            try {
              samples = generateSamples(fn, duration, rate, mode);
            } catch (e) {
              errorEl.textContent = `生成音频错误: ${e.message}`;
              return;
            }
            state.currentSamples = samples;
            const buf = state.audioCtx.createBuffer(1, samples.length, rate);
            const data = buf.getChannelData(0);
            const vol = +volumeEl.value / 100;
            for (let i = 0; i < samples.length; i++) {
              data[i] = Math.max(-1, Math.min(1, samples[i] * vol));
            }
            if (state.source) {
              try { state.source.stop(); } catch (_) {}
            }
            state.source = state.audioCtx.createBufferSource();
            state.source.buffer = buf;
            state.source.loop = true;
            state.source.connect(state.audioCtx.destination);
            state.source.start();
            state.isPlaying = true;
            state.buffer = buf;
            state.isPaused = false;
            state.elapsedTime = 0;
            playBtn.textContent = '▶ 播放中';
            playBtn.disabled = true;
            pauseBtn.disabled = false;
            stopBtn.disabled = false;
            pauseBtn.textContent = '❚❚ 暂停';
            startVisual(samples, rate);
          }
        
          function stop() {
            if (state.source) {
              try { state.source.stop(); } catch (_) {}
            }
            state.source = null;
            state.isPlaying = false;
            state.isPaused = false;
            if (state.rafId) {
              cancelAnimationFrame(state.rafId);
              state.rafId = null;
            }
            playBtn.textContent = '▶ 播放';
            playBtn.disabled = false;
            pauseBtn.disabled = true;
            stopBtn.disabled = true;
            pauseBtn.textContent = '❚❚ 暂停';
            errorEl.textContent = '';
            if (state.audioCtx) {
              try { state.audioCtx.suspend(); } catch (_) {}
            }
          }
        
          function togglePause() {
            if (!state.audioCtx) return;
            if (state.audioCtx.state === 'running') {
              state.audioCtx.suspend();
              state.isPaused = true;
              pauseBtn.textContent = '▶ 继续';
            } else {
              state.audioCtx.resume();
              state.isPaused = false;
              state.lastTimestamp = performance.now();
              pauseBtn.textContent = '❚❚ 暂停';
            }
          }
        
          function generateRandomCode() {
            const patterns = [
              () => `t*((t>>${rand(3,8)}&${rand(1,15)})+${rand(1,4)})|t>>(${(t>>rand(3,8)&rand(1,7))+rand(1,3)})`,
              () => `(sin(t*${rand(1,5)}/${rand(50,200)})*${rand(50,200)})|0`,
              () => `(t*(${rand(1,5)}&t>>${rand(3,10)}))|(t>>${rand(2,6)}&${rand(1,15)})`,
              () => `(t>>${rand(3,8)}&${rand(1,15)})?t>>${rand(2,6)}:t&${rand(15,255)}`,
              () => `(t*${rand(1,3)}+${rand(100,500)})&${rand(255,1023)}`,
              () => `((sin(t/${rand(50,200)})*${rand(50,200)})|0)&${rand(255,1023)}`,
              () => `(t>>${rand(2,6)})|((t>>${rand(4,10)})&${rand(1,15)})`,
              () => `t*(${rand(1,4)}&(t>>${rand(3,9)}))`,
              () => `(t>>${rand(4,10)}&${rand(1,7)})*${rand(20,80)}`,
              () => `(tan(t/${rand(100,300)})*${rand(30,120)})|0`,
            ];
            function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
            let code = '';
            const count = rand(2, 4);
            for (let i = 0; i < count; i++) {
              const pick = patterns[Math.floor(Math.random() * patterns.length)];
              let part = pick();
              if (Math.random() > 0.5) part = `(${part})`;
              if (i > 0) {
                const ops = ['|', '&', '+', '^', '|', '&', '+'];
                code += ' ' + ops[Math.floor(Math.random() * ops.length)] + ' ';
              }
              code += part;
            }
            if (!code.includes('t')) code = `t&${rand(255,1023)}`;
            codeEl.value = code;
            updateCharCount();
            updateURLHash();
            errorEl.textContent = '';
          }
        
          function forLoopManip() {
            const num = prompt('输入循环次数 (数字)');
            if (num === null || isNaN(parseInt(num))) return;
            const op = prompt('输入运算符 (如 +, |, & 等)', '|');
            if (!op) return;
            const template = prompt('输入代码模板，用 (N) 表示循环变量', 't+(N)');
            if (template === null) return;
            let out = '';
            for (let i = 0; i < parseInt(num); i++) {
              out += `(${template.replace(/\(N\)/g, i + 1)})${op}`;
            }
            out = out.slice(0, -op.length);
            codeEl.value = out;
            updateCharCount();
            updateURLHash();
            errorEl.textContent = '';
          }
        
          function copyLocationHref() {
            const params = new URLSearchParams({
              formula: codeEl.value,
              sampleRate: sampleRateEl.value,
              duration: durationEl.value,
              mode: modeEl.value
            });
            const url = window.location.href.split('#')[0] + '#' + params.toString();
            navigator.clipboard.writeText(url).then(() => {
              alert('URL 已复制到剪贴板');
            }).catch(() => {
              alert('复制失败，请手动复制');
            });
          }
        
          function updateURLHash() {
            const params = new URLSearchParams();
            params.set('formula', codeEl.value);
            params.set('sampleRate', sampleRateEl.value);
            params.set('duration', durationEl.value);
            params.set('mode', modeEl.value);
            window.location.hash = params.toString();
          }
        
          function loadFromHash() {
            const hash = window.location.hash.slice(1);
            const params = new URLSearchParams(hash);
            if (params.has('formula')) codeEl.value = params.get('formula');
            if (params.has('sampleRate')) sampleRateEl.value = params.get('sampleRate');
            if (params.has('duration')) durationEl.value = params.get('duration');
            if (params.has('mode')) modeEl.value = params.get('mode');
            updateCharCount();
          }
        
          function updateCharCount() {
            charCount.textContent = codeEl.value.length + 'c';
          }
        
          function downloadWavBase64() {
            const code = codeEl.value.trim();
            if (!code) {
              errorEl.textContent = '⚠ 请先输入代码再下载';
              return;
            }
            errorEl.textContent = '';
            const sr = +sampleRateEl.value;
            const div = +divisorEl.value || 1;
            const rate = Math.floor(sr / div);
            const mode = modeEl.value;
            const duration = +durationEl.value || 8;
            const fn = compileBytebeat(code);
            if (!fn) return;
            let samples;
            try {
              samples = generateSamples(fn, duration, rate, mode);
            } catch (e) {
              errorEl.textContent = `生成音频错误: ${e.message}`;
              return;
            }
            const vol = +volumeEl.value / 100;
            for (let i = 0; i < samples.length; i++) {
              samples[i] = Math.max(-1, Math.min(1, samples[i] * vol));
            }
            const numChannels = 1;
            const sampleRate = rate;
            const bitsPerSample = 16;
            const byteRate = sampleRate * numChannels * bitsPerSample / 8;
            const blockAlign = numChannels * bitsPerSample / 8;
            const dataSize = samples.length * 2;
            const headerSize = 44;
            const totalSize = headerSize + dataSize;
            const buffer = new ArrayBuffer(totalSize);
            const dv = new DataView(buffer);
            const writeString = (offset, str) => {
              for (let i = 0; i < str.length; i++) {
                dv.setUint8(offset + i, str.charCodeAt(i));
              }
            };
            writeString(0, 'RIFF');
            dv.setUint32(4, totalSize - 8, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            dv.setUint32(16, 16, true);
            dv.setUint16(20, 1, true);
            dv.setUint16(22, numChannels, true);
            dv.setUint32(24, sampleRate, true);
            dv.setUint32(28, byteRate, true);
            dv.setUint16(32, blockAlign, true);
            dv.setUint16(34, bitsPerSample, true);
            writeString(36, 'data');
            dv.setUint32(40, dataSize, true);
            const offset = 44;
            for (let i = 0; i < samples.length; i++) {
              const val = Math.max(-1, Math.min(1, samples[i]));
              const int16 = val < 0 ? val * 0x8000 : val * 0x7FFF;
              const clamped = Math.max(-0x8000, Math.min(0x7FFF, Math.round(int16)));
              dv.setInt16(offset + i * 2, clamped, true);
            }
            let binary = '';
            const bytes = new Uint8Array(buffer);
            for (let i = 0; i < bytes.byteLength; i++) {
              binary += String.fromCharCode(bytes[i]);
            }
            const base64 = btoa(binary);
            const dataUri = 'data:audio/wav;base64,' + base64;
            const link = document.createElement('a');
            link.href = dataUri;
            link.download = 'bytebeat_' + Date.now() + '.wav';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            errorEl.textContent = '下载已触发';
          }
        
          playBtn.addEventListener('click', play);
          pauseBtn.addEventListener('click', togglePause);
          stopBtn.addEventListener('click', stop);
          document.getElementById('gencodeBtn').addEventListener('click', generateRandomCode);
          document.getElementById('forloopBtn').addEventListener('click', forLoopManip);
          document.getElementById('copyUrlBtn').addEventListener('click', copyLocationHref);
          downloadBtn.addEventListener('click', downloadWavBase64);
        
          codeEl.addEventListener('input', () => {
            updateCharCount();
            updateURLHash();
            errorEl.textContent = '';
          });
          sampleRateEl.addEventListener('change', updateURLHash);
          durationEl.addEventListener('change', updateURLHash);
          modeEl.addEventListener('change', updateURLHash);
        
          loadFromHash();
          updateCharCount();
        
          if (!codeEl.value.trim() || codeEl.value.trim() === '// 玻璃质感音律 (可播放)\nt*((t>>11&((t>>12)%9))+1)|t>>(((t>>11&((t>>12)%9))+2))') {
            codeEl.value = `//bytebeat funk v2 初见原创
        A='1111100000011111111111111111111111111111111111111111111000001111111001111111110001000000000000001111110000000000000000000111111111111001111110000000000000000000000000000000000',n=1.26,t||(a=b=d=e=0),c=a+=b+=(n*2*2**([1,1,1,7,7,7,8,8,8,8,10,12,12,12,10,10,3,3,3,8,8,[7.8,7.5,7.3,7.1][t>>10&3],7,7,7,7,15,10,10,10,7,7,5,5,5,12,12,12,15,15,15,15,12,12,10,10,12,12,0,0,0,8,8,8,7,7,7,7,3,3,0,0,3,3,1,1,1,7,7,7,8,8,8,8,10,12,12,12,10,10,3,3,3,8,8,[7.8,7.5,7.3,7.1][t>>10&3],7,7,7,7,15,10,10,10,7,7,5,5,5,17,17,17,15,15,15,15,12,12,10,10,12,12,8,8,8,20,20,20,19,19,19,19,17,17,15,12,10,12][t>>12&127]/12)-b)/800,g=d+=e+=(n*2**([1,s=[3,3,3,[3,4][t>>13&1]][t>>14&3],5,[0,0,0,[-2,0][t>>13&1]][t>>14&3],1,s,5,[8,8,8,[10,12][t>>13&1]][t>>14&3]][t>>16&7]/12)-e)/400,A[(c*175>>8)%175]/1.3+(A[(g*175>>8)%175]/2+(A[(g/2*175>>8)%175]/3-1))*(-(t+'00055522227744440005552222774422'[t>>12&31]*4096)>>7&255)/200+sin(t*n*PI/512*2**.25)*(-t>>13&1)*0`;
            updateCharCount();
            updateURLHash();
          }
        
          // ============================================================
          // 3. 曲库 & 音效
          // ============================================================
          const songs = [
            { name: 'Crowd', code: 'main(t){for(;;t++)putchar(((t<<1)^((t<<1)+(t>>7)&t>>12))|t>>(4-(1^7&(t>>19)))|t>>7);}' },
            { name: 'The Forty-Two Melody', code: 't*(42&t>>10)' },
            { name: 'Sierpinski harmonies', code: 't & (t >> 8)' },
            { name: 'Mu6k\'s Theme', code: 't*(t>>8|t>>9)&46&t>>8' },
            { name: 'Rrrola\'s March', code: '(((t>>10)&1)*(t>>12)&((t>>12)&255)*((t>>10)&1))' },
            { name: 'Neurofunk', code: 't*((t&4096?t%65536<59392?7:t&7:16)+(1&t>>14))>>(3&-t>>(t&2048?2:10))|t>>(t&16384?t&4096?10:3:2)' },
            { name: 'Moon Scanner Generalization', code: '2*(t>>5&t)-(t>>5)+t*(t>>14&14)' },
            { name: 'Sierpinski Harmony', code: '5*t&t>>7|3*t&4*t>>10' },
            { name: 'Street Surfer', code: 't&4096?t/2*(t^t%255)|t>>5:t/8|(t&8192?4*t:t)' },
            { name: 'Fanfare', code: '(t&8192?t&4096?t&1024?2*t:4*t:t&512?4*t:4.2*t:(t&4096?t&1024?2*t:10*t:t&512?2*t:8*t)>>2)*(t&16384?3:2)|t*(t&16384?1/8:1/(.01*t))' },
            { name: 'Steady On Tim', code: 'T=t/1e4,(t*2**(1+(4345698>>(T&7)*3&7)/12))&128' },
            { name: 'MONTAGEM BYTEBEAT 2', code: "A='1111100000011111111111111111111111111111111111111111111000001111111001111111110001000000000000001111110000000000000000000111111111111001111110000000000000000000000000000000000',n=1.23,t||(a=b=d=e=0),L=t/524288|0,ti=t%524288,c=a+=b+=(n*2*2**([2,2,2,8,9,9,11,11,11,11,9,11,13,13,11,11,4,4,4,8,9,[8.8,8.5,8.3,8.1][ti>>10&3],8,8,8,8,16,18,11,13,8,8,6,6,6,16,18,18,16,16,13,13,16,16,11,11,13,13,1,1,1,8,9,9,8,8,6,6,4,4,1,1,4,4,2,2,2,8,9,9,11,11,11,11,9,11,13,13,11,11,4,4,4,8,9,[8.8,8.5,8.3,8.1][ti>>10&3],8,8,8,8,16,18,11,13,8,8,6,6,18,18,21,16,18,13,11,11,9,9,8,8,6,6,9,9,18,18,21,16,18,13,21,21,20,20,25,25,21,21][ti>>12&127]/12)-b)/800,g=d+=e+=(n*2**([2,4,6,1,2,4,6,9][ti>>16&7]/12)-e)/400,mel=A[(c*175>>8)%175]/1.3,bas=(A[(g*175>>8)%175]/2+(A[(g/2*175>>8)%175]/3-1))*(-(ti+'00055522227744440005552222774422'[ti>>12&31]*4096)>>7&255)/200,kck=sin(ti*n*PI/512*2**.25)*(-ti>>13&1)*3,L<1?mel*(ti/524288)+bas*(ti/524288):L<2?mel+bas:L<4?mel+bas+kck:L<5?mel+bas:L<6?mel*(1-ti/524288):0" },
            { name: 'bytebeat funk v2 (初见原创)', code: "A='1111100000011111111111111111111111111111111111111111111000001111111001111111110001000000000000001111110000000000000000000111111111111001111110000000000000000000000000000000000',n=1.26,t||(a=b=d=e=0),c=a+=b+=(n*2*2**([1,1,1,7,7,7,8,8,8,8,10,12,12,12,10,10,3,3,3,8,8,[7.8,7.5,7.3,7.1][t>>10&3],7,7,7,7,15,10,10,10,7,7,5,5,5,12,12,12,15,15,15,15,12,12,10,10,12,12,0,0,0,8,8,8,7,7,7,7,3,3,0,0,3,3,1,1,1,7,7,7,8,8,8,8,10,12,12,12,10,10,3,3,3,8,8,[7.8,7.5,7.3,7.1][t>>10&3],7,7,7,7,15,10,10,10,7,7,5,5,5,17,17,17,15,15,15,15,12,12,10,10,12,12,8,8,8,20,20,20,19,19,19,19,17,17,15,12,10,12][t>>12&127]/12)-b)/800,g=d+=e+=(n*2**([1,s=[3,3,3,[3,4][t>>13&1]][t>>14&3],5,[0,0,0,[-2,0][t>>13&1]][t>>14&3],1,s,5,[8,8,8,[10,12][t>>13&1]][t>>14&3]][t>>16&7]/12)-e)/400,A[(c*175>>8)%175]/1.3+(A[(g*175>>8)%175]/2+(A[(g/2*175>>8)%175]/3-1))*(-(t+'00055522227744440005552222774422'[t>>12&31]*4096)>>7&255)/200+sin(t*n*PI/512*2**.25)*(-t>>13&1)*0" },
          ];
        
          const sfx = [
            { name: 'Drone', code: 't*((t>>6)&3) | (t>>4)&3' },
            { name: 'Kick', code: '(t>>10)&1 ? (t&255) : 0' },
            { name: 'Snare', code: '((t>>8)&3) * (t&255)' },
            { name: 'HiHat', code: '(t&63) * ((t>>6)&1)' },
            { name: 'Bass Drop', code: '(t>>8) * (t&255) & 128' },
            { name: 'Arpeggio', code: '((t>>4)&7) * (t>>6) & 255' },
            { name: 'Noise', code: 't & (t>>4) & 255' },
            { name: 'Sine Sweep', code: 'sin(t/128) * 128 + 128' },
          ];
        
          function renderLibrary() {
            const songGrid = document.getElementById('songGrid');
            const sfxGrid = document.getElementById('sfxGrid');
        
            songGrid.innerHTML = '';
            songs.forEach(item => {
              const div = document.createElement('div');
              div.className = 'library-item';
              div.innerHTML = `
                <div class="name">${item.name}</div>
                <div class="desc">${item.code.slice(0, 50)}${item.code.length > 50 ? '…' : ''}</div>
                <span class="tag">歌曲</span>
              `;
              div.addEventListener('click', () => loadFormula(item.code, item.name));
              songGrid.appendChild(div);
            });
        
            sfxGrid.innerHTML = '';
            sfx.forEach(item => {
              const div = document.createElement('div');
              div.className = 'library-item';
              div.innerHTML = `
                <div class="name">${item.name}</div>
                <div class="desc">${item.code.slice(0, 50)}${item.code.length > 50 ? '…' : ''}</div>
                <span class="tag">音效</span>
              `;
              div.addEventListener('click', () => loadFormula(item.code, item.name));
              sfxGrid.appendChild(div);
            });
          }
        
          function loadFormula(code, name) {
            codeEl.value = code;
            updateCharCount();
            updateURLHash();
            errorEl.textContent = '';
            showToast(`已载入「${name}」→ 点击播放`);
        
            tabBtns.forEach(b => b.classList.remove('active'));
            document.querySelector('.tab-btn[data-page="page-synth"]').classList.add('active');
            Object.values(pages).forEach(p => p.classList.remove('active'));
            document.getElementById('page-synth').classList.add('active');
          }
        
          renderLibrary();
        
        })();
    </script>
