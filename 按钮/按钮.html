<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>形状按钮 · 边长工坊</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 30% 30%, #1a1a2e, #0a0a12);
            padding: 24px;
            gap: 28px;
        }

        .card {
            background: rgba(20, 22, 36, 0.85);
            backdrop-filter: blur(28px) saturate(1.3);
            -webkit-backdrop-filter: blur(28px) saturate(1.3);
            border-radius: 48px;
            padding: 32px 28px 36px;
            width: 100%;
            max-width: 640px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .card-title {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            font-weight: 400;
            margin-bottom: 2px;
        }

        .preview-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 140px;
            padding: 8px 0;
        }

        .btn-preview {
            border: none;
            font-size: 1.5rem;
            font-weight: 550;
            color: #f1f5f9;
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.4), 0 12px 36px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.15s ease;
            padding: 0 20px;
            background: linear-gradient(145deg, #6366f1, #4f46e5);
            border-radius: 28px;
            min-width: 100px;
            min-height: 60px;
            clip-path: none;
        }

        .btn-preview::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .btn-preview span {
            display: inline-block;
            position: relative;
            z-index: 1;
            white-space: nowrap;
        }

        .btn-preview.pressed {
            transform: translateY(4px) scale(0.97);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 32px;
            padding: 20px 18px 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .control-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 10px;
        }

        .control-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
            letter-spacing: 0.03em;
            min-width: 38px;
        }

        .control-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 8px;
            flex: 1;
        }

        .control-group input[type="text"],
        .control-group input[type="color"] {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 6px 12px;
            color: #f1f5f9;
            font-size: 0.85rem;
            outline: none;
            transition: border 0.2s;
        }

        .control-group input[type="text"] {
            flex: 1;
            min-width: 70px;
        }
        .control-group input[type="text"]:focus {
            border-color: rgba(99, 102, 241, 0.5);
        }

        .control-group input[type="color"] {
            width: 36px;
            height: 36px;
            padding: 3px;
            border-radius: 40px;
            cursor: pointer;
        }
        .control-group input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 2px;
        }
        .control-group input[type="color"]::-webkit-color-swatch {
            border-radius: 40px;
            border: none;
        }

        .control-group select {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 6px 14px;
            color: #f1f5f9;
            font-size: 0.82rem;
            outline: none;
            cursor: pointer;
            min-width: 70px;
        }
        .control-group select option {
            background: #1a1a2e;
        }

        .color-pair {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.03);
            padding: 3px 10px 3px 6px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .color-pair span {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.65rem;
            letter-spacing: 0.05em;
        }

        /* 形状选择 */
        .shape-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .shape-selector button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            padding: 5px 16px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .shape-selector button:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .shape-selector button.active {
            background: rgba(99, 102, 241, 0.25);
            border-color: #6366f1;
            color: #f1f5f9;
        }

        /* 边长控制 */
        .dimension-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 16px;
            width: 100%;
            margin-top: 2px;
        }

        .dimension-item {
            display: flex;
            align-items: center;
            gap: 6px 8px;
            flex-wrap: wrap;
        }

        .dimension-item label {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.65rem;
            letter-spacing: 0.04em;
            min-width: 14px;
            font-weight: 400;
        }

        .dimension-item input[type="range"] {
            flex: 1;
            min-width: 40px;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            outline: none;
        }

        .dimension-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #6366f1;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .dimension-item input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #6366f1;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .dimension-value {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.7rem;
            min-width: 28px;
            text-align: right;
        }

        /* 圆角 */
        .radius-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 16px;
            width: 100%;
        }

        .radius-item {
            display: flex;
            align-items: center;
            gap: 6px 8px;
            flex-wrap: wrap;
        }

        .radius-item label {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.65rem;
            letter-spacing: 0.04em;
            min-width: 14px;
            font-weight: 400;
        }

        .radius-item input[type="range"] {
            flex: 1;
            min-width: 40px;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            outline: none;
        }

        .radius-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #8b5cf6;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .radius-item input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #8b5cf6;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .radius-value {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.7rem;
            min-width: 24px;
            text-align: right;
        }

        .style-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 2px;
        }

        .bg-style-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .bg-style-group label {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.72rem;
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
        }

        .bg-style-group input[type="radio"] {
            accent-color: #6366f1;
            width: 12px;
            height: 12px;
            cursor: pointer;
        }

        .mode-toggle label {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.72rem;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .mode-toggle input[type="checkbox"] {
            accent-color: #6366f1;
            width: 14px;
            height: 14px;
            cursor: pointer;
        }

        .section-divider {
            color: rgba(255, 255, 255, 0.06);
            font-size: 0.55rem;
            letter-spacing: 0.1em;
            text-align: center;
            padding: 1px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            margin: 1px 0;
        }

        .export-area {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 2px;
        }

        .btn-export {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            padding: 12px 28px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #f1f5f9;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3), 0 8px 32px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.1s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(145deg, rgba(99, 102, 241, 0.2), rgba(79, 70, 229, 0.1));
            border-color: rgba(255, 255, 255, 0.08);
        }

        .btn-export:active {
            transform: translateY(4px) scale(0.97);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-export svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            opacity: 0.8;
        }

        .toast-message {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #e2e8f0;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            transform: translateY(4px);
        }

        .toast-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 480px) {
            .card {
                padding: 16px 12px 20px;
                border-radius: 32px;
            }
            .btn-preview {
                font-size: 1.1rem;
                min-height: 48px;
                min-width: 70px;
            }
            .controls {
                padding: 14px 10px 18px;
            }
            .dimension-grid,
            .radius-grid {
                grid-template-columns: 1fr;
                gap: 4px;
            }
            .shape-selector button {
                padding: 4px 12px;
                font-size: 0.7rem;
            }
            .btn-export {
                padding: 8px 16px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-title">✦ 形状 · 边长工坊</div>

        <div class="preview-wrapper">
            <button class="btn-preview" id="previewBtn">
                <span id="btnLabel">开始</span>
            </button>
        </div>

        <div class="controls">
            <!-- 文字 + 形状 -->
            <div class="control-row">
                <span class="control-label">文字</span>
                <div class="control-group">
                    <input type="text" id="textInput" value="开始" placeholder="输入文字" />
                </div>
                <span class="control-label" style="min-width:30px;">形状</span>
                <div class="shape-selector" id="shapeSelector">
                    <button data-shape="square" class="active">□ 方形</button>
                    <button data-shape="circle">○ 圆形</button>
                    <button data-shape="triangle">△ 三角</button>
                    <button data-shape="diamond">◇ 菱形</button>
                    <button data-shape="pentagon">⬠ 五边</button>
                </div>
            </div>

            <!-- 渐变 -->
            <div class="control-row">
                <span class="control-label">渐变</span>
                <div class="control-group">
                    <div class="color-pair">
                        <span>A</span>
                        <input type="color" id="colorA" value="#6366f1" />
                    </div>
                    <div class="color-pair">
                        <span>B</span>
                        <input type="color" id="colorB" value="#4f46e5" />
                    </div>
                    <select id="directionSelect">
                        <option value="145deg">↘ 145°</option>
                        <option value="90deg">↓ 90°</option>
                        <option value="0deg">→ 0°</option>
                        <option value="45deg">↗ 45°</option>
                        <option value="180deg">← 180°</option>
                        <option value="135deg">↙ 135°</option>
                        <option value="to right">→ to right</option>
                        <option value="to bottom">↓ to bottom</option>
                        <option value="to bottom right">↘ to bottom right</option>
                        <option value="to top right">↗ to top right</option>
                    </select>
                </div>
            </div>

            <!-- 边长 -->
            <div class="section-divider">— 边长 (每个边独立) —</div>
            <div class="dimension-grid" id="dimensionGrid">
                <div class="dimension-item">
                    <label>上</label>
                    <input type="range" id="dimTop" min="20" max="200" value="100" />
                    <span class="dimension-value" id="dimTopVal">100</span>
                </div>
                <div class="dimension-item">
                    <label>右</label>
                    <input type="range" id="dimRight" min="20" max="200" value="100" />
                    <span class="dimension-value" id="dimRightVal">100</span>
                </div>
                <div class="dimension-item">
                    <label>下</label>
                    <input type="range" id="dimBottom" min="20" max="200" value="100" />
                    <span class="dimension-value" id="dimBottomVal">100</span>
                </div>
                <div class="dimension-item">
                    <label>左</label>
                    <input type="range" id="dimLeft" min="20" max="200" value="100" />
                    <span class="dimension-value" id="dimLeftVal">100</span>
                </div>
            </div>

            <!-- 圆角 (保留) -->
            <div class="section-divider">— 圆角半径 (保留) —</div>
            <div class="radius-grid">
                <div class="radius-item">
                    <label>TL</label>
                    <input type="range" id="radiusTL" min="0" max="50" value="20" />
                    <span class="radius-value" id="radiusTLVal">20</span>
                </div>
                <div class="radius-item">
                    <label>TR</label>
                    <input type="range" id="radiusTR" min="0" max="50" value="20" />
                    <span class="radius-value" id="radiusTRVal">20</span>
                </div>
                <div class="radius-item">
                    <label>BR</label>
                    <input type="range" id="radiusBR" min="0" max="50" value="20" />
                    <span class="radius-value" id="radiusBRVal">20</span>
                </div>
                <div class="radius-item">
                    <label>BL</label>
                    <input type="range" id="radiusBL" min="0" max="50" value="20" />
                    <span class="radius-value" id="radiusBLVal">20</span>
                </div>
            </div>

            <!-- 背景 + 按压 -->
            <div class="style-row">
                <div class="bg-style-group">
                    <label><input type="radio" name="bgStyle" value="glass" checked /> 毛玻璃</label>
                    <label><input type="radio" name="bgStyle" value="solid" /> 实色</label>
                    <label><input type="radio" name="bgStyle" value="translucent" /> 半透明</label>
                    <label><input type="radio" name="bgStyle" value="none" /> 无背景</label>
                </div>
                <div class="mode-toggle">
                    <label><input type="checkbox" id="pressedToggle" /> 按压预览</label>
                </div>
            </div>
        </div>
    </div>

    <div class="export-area">
        <button class="btn-export" id="exportBtn">
            <svg viewBox="0 0 24 24"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/></svg>
            导出 PNG
        </button>
        <span class="toast-message" id="toastMsg">✨ 已导出</span>
    </div>

    <script>
        (function() {
            const previewBtn = document.getElementById('previewBtn');
            const btnLabel = document.getElementById('btnLabel');
            const textInput = document.getElementById('textInput');
            const colorA = document.getElementById('colorA');
            const colorB = document.getElementById('colorB');
            const directionSelect = document.getElementById('directionSelect');
            const pressedToggle = document.getElementById('pressedToggle');

            // 边长
            const dimTop = document.getElementById('dimTop');
            const dimRight = document.getElementById('dimRight');
            const dimBottom = document.getElementById('dimBottom');
            const dimLeft = document.getElementById('dimLeft');
            const dimTopVal = document.getElementById('dimTopVal');
            const dimRightVal = document.getElementById('dimRightVal');
            const dimBottomVal = document.getElementById('dimBottomVal');
            const dimLeftVal = document.getElementById('dimLeftVal');

            // 圆角
            const radiusTL = document.getElementById('radiusTL');
            const radiusTR = document.getElementById('radiusTR');
            const radiusBR = document.getElementById('radiusBR');
            const radiusBL = document.getElementById('radiusBL');
            const radiusTLVal = document.getElementById('radiusTLVal');
            const radiusTRVal = document.getElementById('radiusTRVal');
            const radiusBRVal = document.getElementById('radiusBRVal');
            const radiusBLVal = document.getElementById('radiusBLVal');

            const bgRadios = document.querySelectorAll('input[name="bgStyle"]');
            const shapeBtns = document.querySelectorAll('.shape-selector button');
            const toastMsg = document.getElementById('toastMsg');
            let toastTimer = null;
            let currentShape = 'square';

            // 形状对应的 clip-path
            const shapeClipPaths = {
                square: 'none',
                circle: 'circle(50%)',
                triangle: 'polygon(50% 0%, 0% 100%, 100% 100%)',
                diamond: 'polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)',
                pentagon: 'polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%)'
            };

            function showToast(msg) {
                toastMsg.textContent = msg || '✨ 已导出';
                toastMsg.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toastMsg.classList.remove('show');
                }, 2800);
            }

            function updateButton() {
                // 文字
                const text = textInput.value.trim() || '按钮';
                btnLabel.textContent = text;

                // 渐变 - 修复角度
                const dir = directionSelect.value;
                const a = colorA.value;
                const b = colorB.value;
                const gradient = `linear-gradient(${dir}, ${a}, ${b})`;

                // 边长 - 独立控制
                const top = parseInt(dimTop.value, 10);
                const right = parseInt(dimRight.value, 10);
                const bottom = parseInt(dimBottom.value, 10);
                const left = parseInt(dimLeft.value, 10);

                dimTopVal.textContent = top;
                dimRightVal.textContent = right;
                dimBottomVal.textContent = bottom;
                dimLeftVal.textContent = left;

                // 根据形状设置宽高
                let width, height;
                switch (currentShape) {
                    case 'square':
                        width = left + right;
                        height = top + bottom;
                        break;
                    case 'circle':
                        // 圆形取最大边
                        const maxDim = Math.max(top + bottom, left + right);
                        width = maxDim;
                        height = maxDim;
                        break;
                    case 'triangle':
                        width = left + right;
                        height = top + bottom;
                        break;
                    case 'diamond':
                        width = left + right;
                        height = top + bottom;
                        break;
                    case 'pentagon':
                        width = left + right;
                        height = top + bottom;
                        break;
                    default:
                        width = left + right;
                        height = top + bottom;
                }

                previewBtn.style.width = width + 'px';
                previewBtn.style.height = height + 'px';
                previewBtn.style.minWidth = 'unset';
                previewBtn.style.minHeight = 'unset';

                // 圆角
                const tl = parseInt(radiusTL.value, 10);
                const tr = parseInt(radiusTR.value, 10);
                const br = parseInt(radiusBR.value, 10);
                const bl = parseInt(radiusBL.value, 10);
                previewBtn.style.borderRadius = `${tl}px ${tr}px ${br}px ${bl}px`;

                radiusTLVal.textContent = tl;
                radiusTRVal.textContent = tr;
                radiusBRVal.textContent = br;
                radiusBLVal.textContent = bl;

                // 形状 clip-path
                previewBtn.style.clipPath = shapeClipPaths[currentShape] || 'none';
                // 圆形需要额外处理
                if (currentShape === 'circle') {
                    previewBtn.style.borderRadius = '50%';
                } else if (currentShape === 'square') {
                    // 方形使用圆角
                    previewBtn.style.borderRadius = `${tl}px ${tr}px ${br}px ${bl}px`;
                }

                // 背景样式
                let selectedBg = 'glass';
                for (const radio of bgRadios) {
                    if (radio.checked) {
                        selectedBg = radio.value;
                        break;
                    }
                }

                previewBtn.style.background = '';
                previewBtn.style.backdropFilter = '';
                previewBtn.style.webkitBackdropFilter = '';
                previewBtn.style.backgroundColor = '';
                previewBtn.style.opacity = '1';

                if (selectedBg === 'glass') {
                    previewBtn.style.background = `linear-gradient(${dir}, ${a}, ${b}), rgba(255,255,255,0.06)`;
                    previewBtn.style.backdropFilter = 'blur(14px) saturate(1.4)';
                    previewBtn.style.webkitBackdropFilter = 'blur(14px) saturate(1.4)';
                    previewBtn.style.backgroundColor = 'rgba(255,255,255,0.04)';
                } else if (selectedBg === 'solid') {
                    previewBtn.style.background = gradient;
                } else if (selectedBg === 'translucent') {
                    previewBtn.style.background = gradient;
                    previewBtn.style.opacity = '0.7';
                } else if (selectedBg === 'none') {
                    previewBtn.style.background = 'transparent';
                    previewBtn.style.backgroundColor = 'transparent';
                }

                // 按压
                if (pressedToggle.checked) {
                    previewBtn.classList.add('pressed');
                } else {
                    previewBtn.classList.remove('pressed');
                }
            }

            // 形状切换
            shapeBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    shapeBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentShape = this.dataset.shape;
                    // 根据形状调整边长滑块范围
                    updateButton();
                });
            });

            // 绑定事件
            textInput.addEventListener('input', updateButton);
            colorA.addEventListener('input', updateButton);
            colorB.addEventListener('input', updateButton);
            directionSelect.addEventListener('change', updateButton);
            pressedToggle.addEventListener('change', updateButton);

            [dimTop, dimRight, dimBottom, dimLeft].forEach(el => el.addEventListener('input', updateButton));
            [radiusTL, radiusTR, radiusBR, radiusBL].forEach(el => el.addEventListener('input', updateButton));

            for (const radio of bgRadios) {
                radio.addEventListener('change', updateButton);
            }

            updateButton();

            // 导出
            exportBtn.addEventListener('click', async function() {
                const btn = previewBtn;
                const label = btnLabel.textContent.trim() || 'button';
                const safeLabel = label.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_');
                const isPressed = pressedToggle.checked;

                try {
                    if (isPressed) {
                        btn.classList.add('pressed');
                    } else {
                        btn.classList.remove('pressed');
                    }

                    const canvas = await html2canvas(btn, {
                        scale: 2.5,
                        backgroundColor: null,
                        allowTaint: false,
                        useCORS: true,
                        logging: false,
                    });

                    if (!isPressed) {
                        btn.classList.remove('pressed');
                    } else {
                        if (pressedToggle.checked) {
                            btn.classList.add('pressed');
                        } else {
                            btn.classList.remove('pressed');
                        }
                    }

                    const link = document.createElement('a');
                    const suffix = isPressed ? '_pressed' : '';
                    link.download = `btn_${safeLabel}${suffix}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    showToast(`✅ 导出${isPressed ? '按压' : '普通'}态: ${label}`);
                } catch (err) {
                    console.warn('导出失败:', err);
                    showToast('⚠️ 导出失败，请重试');
                }
            });

            // 点击预览切换按压
            previewBtn.addEventListener('click', function() {
                const current = pressedToggle.checked;
                pressedToggle.checked = !current;
                updateButton();
                showToast(`按压预览 ${pressedToggle.checked ? '开启' : '关闭'}`);
            });

        })();
    </script>
</body>
</html>
