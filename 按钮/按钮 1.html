<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>渐变色按钮 · 自定义工坊</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 30% 30%, #1a1a2e, #0a0a12);
            padding: 24px;
            gap: 28px;
        }

        /* 主卡片 */
        .card {
            background: rgba(20, 22, 36, 0.85);
            backdrop-filter: blur(28px) saturate(1.3);
            -webkit-backdrop-filter: blur(28px) saturate(1.3);
            border-radius: 48px;
            padding: 32px 28px 36px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .card-title {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            font-weight: 400;
            margin-bottom: 4px;
        }

        /* ===== 预览按钮 ===== */
        .preview-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .btn-preview {
            width: 100%;
            max-width: 300px;
            aspect-ratio: 3 / 1;
            border: none;
            border-radius: 28px;
            font-size: 1.8rem;
            font-weight: 550;
            color: #f1f5f9;
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.4), 0 12px 36px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
            padding: 0 16px;
            background: linear-gradient(145deg, #6366f1, #4f46e5);
        }

        .btn-preview::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 28px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
            pointer-events: none;
        }

        .btn-preview span {
            display: inline-block;
            position: relative;
            z-index: 1;
        }

        /* 按压模拟 */
        .btn-preview.pressed {
            transform: translateY(4px) scale(0.97);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.25);
        }
        .btn-preview.pressed::after {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.10) 0%, transparent 60%);
        }

        /* ===== 控制面板 ===== */
        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 32px;
            padding: 22px 20px 26px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
        }

        .control-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 16px;
        }

        .control-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            letter-spacing: 0.03em;
            min-width: 60px;
        }

        .control-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
            flex: 1;
        }

        .control-group input[type="text"],
        .control-group input[type="color"] {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 8px 14px;
            color: #f1f5f9;
            font-size: 0.9rem;
            outline: none;
            transition: border 0.2s;
            backdrop-filter: blur(4px);
        }

        .control-group input[type="text"] {
            flex: 1;
            min-width: 120px;
        }
        .control-group input[type="text"]:focus {
            border-color: rgba(99, 102, 241, 0.5);
        }

        .control-group input[type="color"] {
            width: 44px;
            height: 44px;
            padding: 4px;
            border-radius: 40px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.04);
        }
        .control-group input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 2px;
        }
        .control-group input[type="color"]::-webkit-color-swatch {
            border-radius: 40px;
            border: none;
        }

        .control-group select {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 8px 16px;
            color: #f1f5f9;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(4px);
            min-width: 100px;
        }
        .control-group select option {
            background: #1a1a2e;
        }

        .color-pair {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 12px 4px 8px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .color-pair span {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            letter-spacing: 0.05em;
        }

        /* ===== 导出 & 辅助 ===== */
        .export-area {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-top: 2px;
        }

        .btn-export {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 500;
            color: #f1f5f9;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3), 0 8px 32px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.1s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(145deg, rgba(99, 102, 241, 0.2), rgba(79, 70, 229, 0.1));
            border-color: rgba(255, 255, 255, 0.08);
        }

        .btn-export:active {
            transform: translateY(4px) scale(0.97);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-export svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            opacity: 0.8;
        }

        .toast-message {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #e2e8f0;
            padding: 10px 22px;
            border-radius: 40px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            transform: translateY(4px);
        }

        .toast-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        .mode-toggle {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
        }
        .mode-toggle label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .mode-toggle input[type="checkbox"] {
            accent-color: #6366f1;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .card {
                padding: 20px 14px 24px;
                border-radius: 36px;
            }
            .btn-preview {
                font-size: 1.4rem;
                border-radius: 22px;
                max-width: 100%;
            }
            .controls {
                padding: 16px 12px 20px;
            }
            .control-row {
                gap: 8px;
            }
            .control-group input[type="text"] {
                min-width: 80px;
                font-size: 0.8rem;
            }
            .btn-export {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-title">✦ 按钮自定义工坊</div>

        <!-- 预览按钮 -->
        <div class="preview-wrapper">
            <button class="btn-preview" id="previewBtn">
                <span id="btnLabel">开始</span>
            </button>
        </div>

        <!-- 控制区 -->
        <div class="controls">
            <!-- 文字 -->
            <div class="control-row">
                <span class="control-label">文字</span>
                <div class="control-group">
                    <input type="text" id="textInput" value="开始" placeholder="输入按钮文字" />
                </div>
            </div>

            <!-- 渐变颜色 A / B -->
            <div class="control-row">
                <span class="control-label">颜色</span>
                <div class="control-group">
                    <div class="color-pair">
                        <span>A</span>
                        <input type="color" id="colorA" value="#6366f1" />
                    </div>
                    <div class="color-pair">
                        <span>B</span>
                        <input type="color" id="colorB" value="#4f46e5" />
                    </div>
                </div>
            </div>

            <!-- 渐变方向 -->
            <div class="control-row">
                <span class="control-label">方向</span>
                <div class="control-group">
                    <select id="directionSelect">
                        <option value="145deg">↘ 145°</option>
                        <option value="90deg">↓ 90°</option>
                        <option value="0deg">→ 0°</option>
                        <option value="45deg">↗ 45°</option>
                        <option value="180deg">← 180°</option>
                        <option value="135deg">↙ 135°</option>
                        <option value="to right">→ to right</option>
                        <option value="to bottom">↓ to bottom</option>
                        <option value="to bottom right">↘ to bottom right</option>
                        <option value="to top right">↗ to top right</option>
                    </select>
                </div>
            </div>

            <!-- 按压预览开关 -->
            <div class="control-row" style="justify-content: flex-end;">
                <div class="mode-toggle">
                    <label>
                        <input type="checkbox" id="pressedToggle" />
                        按压预览
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- 导出区域 -->
    <div class="export-area">
        <button class="btn-export" id="exportBtn">
            <svg viewBox="0 0 24 24"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/></svg>
            导出按钮 PNG
        </button>
        <span class="toast-message" id="toastMsg">✨ 已导出</span>
    </div>

    <script>
        (function() {
            const previewBtn = document.getElementById('previewBtn');
            const btnLabel = document.getElementById('btnLabel');
            const textInput = document.getElementById('textInput');
            const colorA = document.getElementById('colorA');
            const colorB = document.getElementById('colorB');
            const directionSelect = document.getElementById('directionSelect');
            const pressedToggle = document.getElementById('pressedToggle');
            const exportBtn = document.getElementById('exportBtn');
            const toastMsg = document.getElementById('toastMsg');
            let toastTimer = null;

            // 更新预览按钮样式
            function updateButton() {
                const text = textInput.value.trim() || '按钮';
                btnLabel.textContent = text;

                const dir = directionSelect.value;
                const a = colorA.value;
                const b = colorB.value;
                // 构建渐变 —— 使用 linear-gradient
                const gradient = `linear-gradient(${dir}, ${a}, ${b})`;
                previewBtn.style.background = gradient;

                // 按压状态 (仅视觉)
                if (pressedToggle.checked) {
                    previewBtn.classList.add('pressed');
                } else {
                    previewBtn.classList.remove('pressed');
                }
            }

            // 绑定事件
            textInput.addEventListener('input', updateButton);
            colorA.addEventListener('input', updateButton);
            colorB.addEventListener('input', updateButton);
            directionSelect.addEventListener('change', updateButton);
            pressedToggle.addEventListener('change', updateButton);

            // 初始化
            updateButton();

            // Toast
            function showToast(msg) {
                toastMsg.textContent = msg || '✨ 已导出';
                toastMsg.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toastMsg.classList.remove('show');
                }, 2800);
            }

            // ===== 导出功能 (使用 html2canvas 捕获预览按钮) =====
            exportBtn.addEventListener('click', async function() {
                const btn = previewBtn;
                const label = btnLabel.textContent.trim() || 'button';
                const safeLabel = label.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_');

                try {
                    // 临时移除按压类以便截图？（若按压预览开启，我们保留按压样式，用户可自由选择）
                    // 但为了更清晰，我们按照当前显示状态截图
                    const canvas = await html2canvas(btn, {
                        scale: 2.5,
                        backgroundColor: null,
                        allowTaint: false,
                        useCORS: true,
                        logging: false,
                        borderRadius: getComputedStyle(btn).borderRadius,
                    });

                    const link = document.createElement('a');
                    link.download = `btn_${safeLabel}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    showToast(`✅ 导出成功: ${label}`);
                } catch (err) {
                    console.warn('导出失败:', err);
                    showToast('⚠️ 导出失败，请重试');
                }
            });

            // 额外：点击预览按钮可切换按压预览（方便设计）
            previewBtn.addEventListener('click', function(e) {
                // 仅作为交互提示，不干扰导出
                const current = pressedToggle.checked;
                pressedToggle.checked = !current;
                updateButton();
                // 轻微触感
                showToast(`按压预览 ${pressedToggle.checked ? '开启' : '关闭'}`);
            });

        })();
    </script>
</body>
</html>
