<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>高级按钮 · 样式工坊</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 30% 30%, #1a1a2e, #0a0a12);
            padding: 24px;
            gap: 28px;
        }

        .card {
            background: rgba(20, 22, 36, 0.85);
            backdrop-filter: blur(28px) saturate(1.3);
            -webkit-backdrop-filter: blur(28px) saturate(1.3);
            border-radius: 48px;
            padding: 32px 28px 36px;
            width: 100%;
            max-width: 580px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .card-title {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            font-weight: 400;
            margin-bottom: 4px;
        }

        /* 预览按钮 */
        .preview-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .btn-preview {
            width: 100%;
            max-width: 340px;
            aspect-ratio: 3 / 1;
            border: none;
            font-size: 1.8rem;
            font-weight: 550;
            color: #f1f5f9;
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.4), 0 12px 36px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
            padding: 0 16px;
            background: linear-gradient(145deg, #6366f1, #4f46e5);
            border-radius: 28px;
            /* 会被JS覆盖 */;
        }

        .btn-preview::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .btn-preview span {
            display: inline-block;
            position: relative;
            z-index: 1;
        }

        .btn-preview.pressed {
            transform: translateY(4px) scale(0.97);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        /* 控制面板 */
        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 32px;
            padding: 22px 20px 26px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .control-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
        }

        .control-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            letter-spacing: 0.03em;
            min-width: 44px;
        }

        .control-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 10px;
            flex: 1;
        }

        .control-group input[type="text"],
        .control-group input[type="color"] {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 8px 14px;
            color: #f1f5f9;
            font-size: 0.9rem;
            outline: none;
            transition: border 0.2s;
        }

        .control-group input[type="text"] {
            flex: 1;
            min-width: 100px;
        }
        .control-group input[type="text"]:focus {
            border-color: rgba(99, 102, 241, 0.5);
        }

        .control-group input[type="color"] {
            width: 40px;
            height: 40px;
            padding: 4px;
            border-radius: 40px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.04);
        }
        .control-group input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 2px;
        }
        .control-group input[type="color"]::-webkit-color-swatch {
            border-radius: 40px;
            border: none;
        }

        .control-group select {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 8px 16px;
            color: #f1f5f9;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            min-width: 90px;
        }
        .control-group select option {
            background: #1a1a2e;
        }

        .color-pair {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 12px 4px 8px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .color-pair span {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            letter-spacing: 0.05em;
        }

        /* 圆角滑块 */
        .radius-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 20px;
            width: 100%;
            margin-top: 2px;
        }

        .radius-item {
            display: flex;
            align-items: center;
            gap: 6px 10px;
            flex-wrap: wrap;
        }

        .radius-item label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.7rem;
            letter-spacing: 0.04em;
            min-width: 20px;
            font-weight: 400;
        }

        .radius-item input[type="range"] {
            flex: 1;
            min-width: 50px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            outline: none;
        }

        .radius-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #6366f1;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .radius-item input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #6366f1;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .radius-value {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
            min-width: 28px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* 背景样式切换 + 按压 */
        .style-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 2px;
        }

        .bg-style-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .bg-style-group label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .bg-style-group input[type="radio"] {
            accent-color: #6366f1;
            width: 14px;
            height: 14px;
            cursor: pointer;
        }

        .mode-toggle {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
        }
        .mode-toggle label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .mode-toggle input[type="checkbox"] {
            accent-color: #6366f1;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* 导出 */
        .export-area {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-top: 2px;
        }

        .btn-export {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 500;
            color: #f1f5f9;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3), 0 8px 32px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.1s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(145deg, rgba(99, 102, 241, 0.2), rgba(79, 70, 229, 0.1));
            border-color: rgba(255, 255, 255, 0.08);
        }

        .btn-export:active {
            transform: translateY(4px) scale(0.97);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-export svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            opacity: 0.8;
        }

        .toast-message {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #e2e8f0;
            padding: 10px 22px;
            border-radius: 40px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            transform: translateY(4px);
        }

        .toast-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 480px) {
            .card {
                padding: 20px 14px 24px;
                border-radius: 36px;
            }
            .btn-preview {
                font-size: 1.4rem;
                max-width: 100%;
            }
            .controls {
                padding: 16px 12px 20px;
            }
            .radius-grid {
                grid-template-columns: 1fr;
                gap: 6px;
            }
            .control-group input[type="text"] {
                min-width: 70px;
                font-size: 0.8rem;
            }
            .btn-export {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
            .style-row {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-title">✦ 按钮样式工坊</div>

        <div class="preview-wrapper">
            <button class="btn-preview" id="previewBtn">
                <span id="btnLabel">开始</span>
            </button>
        </div>

        <div class="controls">
            <!-- 文字 -->
            <div class="control-row">
                <span class="control-label">文字</span>
                <div class="control-group">
                    <input type="text" id="textInput" value="开始" placeholder="输入文字" />
                </div>
            </div>

            <!-- 渐变颜色 + 方向 -->
            <div class="control-row">
                <span class="control-label">渐变</span>
                <div class="control-group">
                    <div class="color-pair">
                        <span>A</span>
                        <input type="color" id="colorA" value="#6366f1" />
                    </div>
                    <div class="color-pair">
                        <span>B</span>
                        <input type="color" id="colorB" value="#4f46e5" />
                    </div>
                    <select id="directionSelect" style="min-width:80px;">
                        <option value="145deg">↘ 145°</option>
                        <option value="90deg">↓ 90°</option>
                        <option value="0deg">→ 0°</option>
                        <option value="45deg">↗ 45°</option>
                        <option value="180deg">← 180°</option>
                        <option value="135deg">↙ 135°</option>
                        <option value="to right">→ to right</option>
                        <option value="to bottom">↓ to bottom</option>
                    </select>
                </div>
            </div>

            <!-- 四个边角半径 -->
            <div class="radius-grid">
                <div class="radius-item">
                    <label>TL</label>
                    <input type="range" id="radiusTL" min="0" max="80" value="28" />
                    <span class="radius-value" id="radiusTLVal">28</span>
                </div>
                <div class="radius-item">
                    <label>TR</label>
                    <input type="range" id="radiusTR" min="0" max="80" value="28" />
                    <span class="radius-value" id="radiusTRVal">28</span>
                </div>
                <div class="radius-item">
                    <label>BR</label>
                    <input type="range" id="radiusBR" min="0" max="80" value="28" />
                    <span class="radius-value" id="radiusBRVal">28</span>
                </div>
                <div class="radius-item">
                    <label>BL</label>
                    <input type="range" id="radiusBL" min="0" max="80" value="28" />
                    <span class="radius-value" id="radiusBLVal">28</span>
                </div>
            </div>

            <!-- 背景样式 + 按压 -->
            <div class="style-row">
                <div class="bg-style-group">
                    <label>
                        <input type="radio" name="bgStyle" value="glass" checked />
                        毛玻璃
                    </label>
                    <label>
                        <input type="radio" name="bgStyle" value="solid" />
                        实色
                    </label>
                    <label>
                        <input type="radio" name="bgStyle" value="translucent" />
                        半透明
                    </label>
                    <label>
                        <input type="radio" name="bgStyle" value="none" />
                        无背景
                    </label>
                </div>
                <div class="mode-toggle">
                    <label>
                        <input type="checkbox" id="pressedToggle" />
                        按压预览
                    </label>
                </div>
            </div>
        </div>
    </div>

    <div class="export-area">
        <button class="btn-export" id="exportBtn">
            <svg viewBox="0 0 24 24"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/></svg>
            导出 PNG
        </button>
        <span class="toast-message" id="toastMsg">✨ 已导出</span>
    </div>

    <script>
        (function() {
            const previewBtn = document.getElementById('previewBtn');
            const btnLabel = document.getElementById('btnLabel');
            const textInput = document.getElementById('textInput');
            const colorA = document.getElementById('colorA');
            const colorB = document.getElementById('colorB');
            const directionSelect = document.getElementById('directionSelect');
            const pressedToggle = document.getElementById('pressedToggle');

            // 半径
            const radiusTL = document.getElementById('radiusTL');
            const radiusTR = document.getElementById('radiusTR');
            const radiusBR = document.getElementById('radiusBR');
            const radiusBL = document.getElementById('radiusBL');
            const radiusTLVal = document.getElementById('radiusTLVal');
            const radiusTRVal = document.getElementById('radiusTRVal');
            const radiusBRVal = document.getElementById('radiusBRVal');
            const radiusBLVal = document.getElementById('radiusBLVal');

            // 背景样式 radio
            const bgRadios = document.querySelectorAll('input[name="bgStyle"]');

            const toastMsg = document.getElementById('toastMsg');
            let toastTimer = null;

            // 工具: 显示toast
            function showToast(msg) {
                toastMsg.textContent = msg || '✨ 已导出';
                toastMsg.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toastMsg.classList.remove('show');
                }, 2800);
            }

            // 核心更新函数
            function updateButton() {
                // 文字
                const text = textInput.value.trim() || '按钮';
                btnLabel.textContent = text;

                // 渐变
                const dir = directionSelect.value;
                const a = colorA.value;
                const b = colorB.value;
                const gradient = `linear-gradient(${dir}, ${a}, ${b})`;

                // 圆角
                const tl = parseInt(radiusTL.value, 10);
                const tr = parseInt(radiusTR.value, 10);
                const br = parseInt(radiusBR.value, 10);
                const bl = parseInt(radiusBL.value, 10);
                previewBtn.style.borderRadius = `${tl}px ${tr}px ${br}px ${bl}px`;

                // 更新数值显示
                radiusTLVal.textContent = tl;
                radiusTRVal.textContent = tr;
                radiusBRVal.textContent = br;
                radiusBLVal.textContent = bl;

                // 获取选中的背景样式
                let selectedBg = 'glass';
                for (const radio of bgRadios) {
                    if (radio.checked) {
                        selectedBg = radio.value;
                        break;
                    }
                }

                // 根据样式构建 background
                // 先清除可能存在的额外 backdrop 等
                previewBtn.style.background = '';
                previewBtn.style.backdropFilter = '';
                previewBtn.style.webkitBackdropFilter = '';
                previewBtn.style.backgroundColor = '';

                // 基础边框 & 阴影保持
                // 毛玻璃: 渐变 + 模糊
                if (selectedBg === 'glass') {
                    previewBtn.style.background = gradient;
                    previewBtn.style.backdropFilter = 'blur(12px) saturate(1.3)';
                    previewBtn.style.webkitBackdropFilter = 'blur(12px) saturate(1.3)';
                    previewBtn.style.backgroundColor = 'rgba(255,255,255,0.05)';
                    // 保留渐变覆盖, 但玻璃效果用半透明叠加
                    // 我们使用 background 渐变 + 额外背景色层? 实际我们直接设置背景为渐变，并添加 backdrop-filter
                    // 但 backdrop-filter 对元素自身背景无效，需要伪元素或内层。这里我们用一个技巧：将渐变作为背景，同时增加半透明底色模拟玻璃
                    // 更干净：background 使用渐变，并叠加一个半透明层，用伪元素？为简化，我们直接使用 background 渐变 + 轻微半透明
                    // 但为了毛玻璃效果更真实，我们用 background 为半透明 + 渐变，并设置 backdrop-filter
                    // 但 backdrop-filter 只作用于元素背后，所以需要元素本身半透明
                    previewBtn.style.background = `linear-gradient(${dir}, ${a}, ${b}), rgba(255,255,255,0.08)`;
                    previewBtn.style.backgroundBlendMode = 'normal';
                    // 保留边框
                } else if (selectedBg === 'solid') {
                    // 实色: 纯渐变，无透明
                    previewBtn.style.background = gradient;
                    previewBtn.style.backdropFilter = 'none';
                    previewBtn.style.webkitBackdropFilter = 'none';
                    previewBtn.style.backgroundColor = 'transparent';
                } else if (selectedBg === 'translucent') {
                    // 半透明: 渐变 + 透明度
                    previewBtn.style.background = `linear-gradient(${dir}, ${a}, ${b})`;
                    previewBtn.style.opacity = '0.75';
                    previewBtn.style.backdropFilter = 'none';
                    previewBtn.style.webkitBackdropFilter = 'none';
                    // 重置可能冲突
                } else if (selectedBg === 'none') {
                    // 无背景: 透明，只保留文字和边框阴影
                    previewBtn.style.background = 'transparent';
                    previewBtn.style.backdropFilter = 'none';
                    previewBtn.style.webkitBackdropFilter = 'none';
                    previewBtn.style.backgroundColor = 'transparent';
                    previewBtn.style.opacity = '1';
                }

                // 若选中 solid 或 translucent 需要重置 opacity
                if (selectedBg === 'solid' || selectedBg === 'glass') {
                    previewBtn.style.opacity = '1';
                }
                // 修正 translucent 透明度
                if (selectedBg === 'translucent') {
                    previewBtn.style.opacity = '0.75';
                }
                if (selectedBg === 'none') {
                    previewBtn.style.opacity = '1';
                }

                // 按压状态
                if (pressedToggle.checked) {
                    previewBtn.classList.add('pressed');
                } else {
                    previewBtn.classList.remove('pressed');
                }

                // 额外: 为毛玻璃增加一层半透明底，让渐变可见
                // 如果 glass 我们手动加一个背景色叠加
                if (selectedBg === 'glass') {
                    // 由于背景已包含渐变+半透明，但需要确保渐变可见，我们混合
                    // 使用 background 叠加: 渐变 + 半透明底色
                    previewBtn.style.background = `linear-gradient(${dir}, ${a}, ${b}), rgba(255,255,255,0.06)`;
                    previewBtn.style.backgroundBlendMode = 'normal';
                }
            }

            // 绑定事件
            textInput.addEventListener('input', updateButton);
            colorA.addEventListener('input', updateButton);
            colorB.addEventListener('input', updateButton);
            directionSelect.addEventListener('change', updateButton);
            pressedToggle.addEventListener('change', updateButton);

            radiusTL.addEventListener('input', updateButton);
            radiusTR.addEventListener('input', updateButton);
            radiusBR.addEventListener('input', updateButton);
            radiusBL.addEventListener('input', updateButton);

            for (const radio of bgRadios) {
                radio.addEventListener('change', updateButton);
            }

            // 初始化
            updateButton();

            // ===== 导出 =====
            exportBtn.addEventListener('click', async function() {
                const btn = previewBtn;
                const label = btnLabel.textContent.trim() || 'button';
                const safeLabel = label.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_');

                try {
                    // 临时移除按压类以便截图？（若按压预览开启，保留按压样式）
                    const canvas = await html2canvas(btn, {
                        scale: 2.5,
                        backgroundColor: null,
                        allowTaint: false,
                        useCORS: true,
                        logging: false,
                        borderRadius: getComputedStyle(btn).borderRadius,
                    });

                    const link = document.createElement('a');
                    link.download = `btn_${safeLabel}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    showToast(`✅ 导出成功: ${label}`);
                } catch (err) {
                    console.warn('导出失败:', err);
                    showToast('⚠️ 导出失败，请重试');
                }
            });

            // 点击预览切换按压 (快捷)
            previewBtn.addEventListener('click', function(e) {
                const current = pressedToggle.checked;
                pressedToggle.checked = !current;
                updateButton();
                showToast(`按压预览 ${pressedToggle.checked ? '开启' : '关闭'}`);
            });

        })();
    </script>
</body>
</html>
