<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>高级按钮 · 边长 & 样式工坊</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 30% 30%, #1a1a2e, #0a0a12);
            padding: 24px;
            gap: 28px;
        }

        .card {
            background: rgba(20, 22, 36, 0.85);
            backdrop-filter: blur(28px) saturate(1.3);
            -webkit-backdrop-filter: blur(28px) saturate(1.3);
            border-radius: 48px;
            padding: 32px 28px 36px;
            width: 100%;
            max-width: 620px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .card-title {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            font-weight: 400;
            margin-bottom: 4px;
        }

        /* 预览按钮 */
        .preview-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 120px;
            padding: 12px 0;
        }

        .btn-preview {
            border: none;
            font-size: 1.6rem;
            font-weight: 550;
            color: #f1f5f9;
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.4), 0 12px 36px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.15s ease;
            padding: 0 20px;
            background: linear-gradient(145deg, #6366f1, #4f46e5);
            border-radius: 28px;
            min-width: 120px;
            min-height: 64px;
            /* 默认尺寸，会被JS覆盖 */;
        }

        .btn-preview::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .btn-preview span {
            display: inline-block;
            position: relative;
            z-index: 1;
            white-space: nowrap;
        }

        .btn-preview.pressed {
            transform: translateY(4px) scale(0.97);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        /* 控制面板 */
        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 32px;
            padding: 22px 20px 26px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .control-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
        }

        .control-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            letter-spacing: 0.03em;
            min-width: 44px;
        }

        .control-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 10px;
            flex: 1;
        }

        .control-group input[type="text"],
        .control-group input[type="color"] {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 8px 14px;
            color: #f1f5f9;
            font-size: 0.9rem;
            outline: none;
            transition: border 0.2s;
        }

        .control-group input[type="text"] {
            flex: 1;
            min-width: 80px;
        }
        .control-group input[type="text"]:focus {
            border-color: rgba(99, 102, 241, 0.5);
        }

        .control-group input[type="color"] {
            width: 40px;
            height: 40px;
            padding: 4px;
            border-radius: 40px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.04);
        }
        .control-group input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 2px;
        }
        .control-group input[type="color"]::-webkit-color-swatch {
            border-radius: 40px;
            border: none;
        }

        .control-group select {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 8px 16px;
            color: #f1f5f9;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            min-width: 80px;
        }
        .control-group select option {
            background: #1a1a2e;
        }

        .color-pair {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 12px 4px 8px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .color-pair span {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            letter-spacing: 0.05em;
        }

        /* 边长控制 - 4个滑块 */
        .dimension-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 20px;
            width: 100%;
            margin-top: 2px;
        }

        .dimension-item {
            display: flex;
            align-items: center;
            gap: 6px 10px;
            flex-wrap: wrap;
        }

        .dimension-item label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.7rem;
            letter-spacing: 0.04em;
            min-width: 20px;
            font-weight: 400;
        }

        .dimension-item input[type="range"] {
            flex: 1;
            min-width: 50px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            outline: none;
        }

        .dimension-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #6366f1;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .dimension-item input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #6366f1;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .dimension-value {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
            min-width: 32px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* 圆角 (保留) */
        .radius-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 20px;
            width: 100%;
        }

        .radius-item {
            display: flex;
            align-items: center;
            gap: 6px 10px;
            flex-wrap: wrap;
        }

        .radius-item label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.7rem;
            letter-spacing: 0.04em;
            min-width: 20px;
            font-weight: 400;
        }

        .radius-item input[type="range"] {
            flex: 1;
            min-width: 50px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            outline: none;
        }

        .radius-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #8b5cf6;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .radius-item input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #8b5cf6;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .radius-value {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
            min-width: 28px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* 背景样式 + 按压 */
        .style-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 2px;
        }

        .bg-style-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .bg-style-group label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .bg-style-group input[type="radio"] {
            accent-color: #6366f1;
            width: 14px;
            height: 14px;
            cursor: pointer;
        }

        .mode-toggle {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
        }
        .mode-toggle label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .mode-toggle input[type="checkbox"] {
            accent-color: #6366f1;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* 导出 */
        .export-area {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-top: 2px;
        }

        .btn-export {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 500;
            color: #f1f5f9;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3), 0 8px 32px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.1s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(145deg, rgba(99, 102, 241, 0.2), rgba(79, 70, 229, 0.1));
            border-color: rgba(255, 255, 255, 0.08);
        }

        .btn-export:active {
            transform: translateY(4px) scale(0.97);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-export svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            opacity: 0.8;
        }

        .toast-message {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #e2e8f0;
            padding: 10px 22px;
            border-radius: 40px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            transform: translateY(4px);
        }

        .toast-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        .section-divider {
            color: rgba(255, 255, 255, 0.08);
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            text-align: center;
            padding: 2px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            margin: 2px 0;
        }

        @media (max-width: 480px) {
            .card {
                padding: 20px 14px 24px;
                border-radius: 36px;
            }
            .btn-preview {
                font-size: 1.2rem;
                min-height: 52px;
                min-width: 80px;
            }
            .controls {
                padding: 16px 12px 20px;
            }
            .dimension-grid,
            .radius-grid {
                grid-template-columns: 1fr;
                gap: 6px;
            }
            .control-group input[type="text"] {
                min-width: 60px;
                font-size: 0.8rem;
            }
            .btn-export {
                padding: 10px 18px;
                font-size: 0.85rem;
            }
            .style-row {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-title">✦ 边长 & 样式工坊</div>

        <div class="preview-wrapper">
            <button class="btn-preview" id="previewBtn">
                <span id="btnLabel">开始</span>
            </button>
        </div>

        <div class="controls">
            <!-- 文字 -->
            <div class="control-row">
                <span class="control-label">文字</span>
                <div class="control-group">
                    <input type="text" id="textInput" value="开始" placeholder="输入文字" />
                </div>
            </div>

            <!-- 渐变 -->
            <div class="control-row">
                <span class="control-label">渐变</span>
                <div class="control-group">
                    <div class="color-pair">
                        <span>A</span>
                        <input type="color" id="colorA" value="#6366f1" />
                    </div>
                    <div class="color-pair">
                        <span>B</span>
                        <input type="color" id="colorB" value="#4f46e5" />
                    </div>
                    <select id="directionSelect" style="min-width:80px;">
                        <option value="145deg">↘ 145°</option>
                        <option value="90deg">↓ 90°</option>
                        <option value="0deg">→ 0°</option>
                        <option value="45deg">↗ 45°</option>
                        <option value="180deg">← 180°</option>
                        <option value="135deg">↙ 135°</option>
                    </select>
                </div>
            </div>

            <!-- 边长控制 (宽度/高度比例) -->
            <div class="section-divider">— 边长比例 —</div>
            <div class="dimension-grid">
                <div class="dimension-item">
                    <label>上</label>
                    <input type="range" id="dimTop" min="40" max="200" value="120" />
                    <span class="dimension-value" id="dimTopVal">120</span>
                </div>
                <div class="dimension-item">
                    <label>右</label>
                    <input type="range" id="dimRight" min="30" max="160" value="80" />
                    <span class="dimension-value" id="dimRightVal">80</span>
                </div>
                <div class="dimension-item">
                    <label>下</label>
                    <input type="range" id="dimBottom" min="40" max="200" value="120" />
                    <span class="dimension-value" id="dimBottomVal">120</span>
                </div>
                <div class="dimension-item">
                    <label>左</label>
                    <input type="range" id="dimLeft" min="30" max="160" value="80" />
                    <span class="dimension-value" id="dimLeftVal">80</span>
                </div>
            </div>

            <!-- 圆角 (保留) -->
            <div class="section-divider">— 圆角半径 —</div>
            <div class="radius-grid">
                <div class="radius-item">
                    <label>TL</label>
                    <input type="range" id="radiusTL" min="0" max="60" value="28" />
                    <span class="radius-value" id="radiusTLVal">28</span>
                </div>
                <div class="radius-item">
                    <label>TR</label>
                    <input type="range" id="radiusTR" min="0" max="60" value="28" />
                    <span class="radius-value" id="radiusTRVal">28</span>
                </div>
                <div class="radius-item">
                    <label>BR</label>
                    <input type="range" id="radiusBR" min="0" max="60" value="28" />
                    <span class="radius-value" id="radiusBRVal">28</span>
                </div>
                <div class="radius-item">
                    <label>BL</label>
                    <input type="range" id="radiusBL" min="0" max="60" value="28" />
                    <span class="radius-value" id="radiusBLVal">28</span>
                </div>
            </div>

            <!-- 背景样式 + 按压 -->
            <div class="style-row">
                <div class="bg-style-group">
                    <label>
                        <input type="radio" name="bgStyle" value="glass" checked />
                        毛玻璃
                    </label>
                    <label>
                        <input type="radio" name="bgStyle" value="solid" />
                        实色
                    </label>
                    <label>
                        <input type="radio" name="bgStyle" value="translucent" />
                        半透明
                    </label>
                    <label>
                        <input type="radio" name="bgStyle" value="none" />
                        无背景
                    </label>
                </div>
                <div class="mode-toggle">
                    <label>
                        <input type="checkbox" id="pressedToggle" />
                        按压预览
                    </label>
                </div>
            </div>
        </div>
    </div>

    <div class="export-area">
        <button class="btn-export" id="exportBtn">
            <svg viewBox="0 0 24 24"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/></svg>
            导出 PNG
        </button>
        <span class="toast-message" id="toastMsg">✨ 已导出</span>
    </div>

    <script>
        (function() {
            const previewBtn = document.getElementById('previewBtn');
            const btnLabel = document.getElementById('btnLabel');
            const textInput = document.getElementById('textInput');
            const colorA = document.getElementById('colorA');
            const colorB = document.getElementById('colorB');
            const directionSelect = document.getElementById('directionSelect');
            const pressedToggle = document.getElementById('pressedToggle');

            // 边长滑块
            const dimTop = document.getElementById('dimTop');
            const dimRight = document.getElementById('dimRight');
            const dimBottom = document.getElementById('dimBottom');
            const dimLeft = document.getElementById('dimLeft');
            const dimTopVal = document.getElementById('dimTopVal');
            const dimRightVal = document.getElementById('dimRightVal');
            const dimBottomVal = document.getElementById('dimBottomVal');
            const dimLeftVal = document.getElementById('dimLeftVal');

            // 圆角滑块
            const radiusTL = document.getElementById('radiusTL');
            const radiusTR = document.getElementById('radiusTR');
            const radiusBR = document.getElementById('radiusBR');
            const radiusBL = document.getElementById('radiusBL');
            const radiusTLVal = document.getElementById('radiusTLVal');
            const radiusTRVal = document.getElementById('radiusTRVal');
            const radiusBRVal = document.getElementById('radiusBRVal');
            const radiusBLVal = document.getElementById('radiusBLVal');

            const bgRadios = document.querySelectorAll('input[name="bgStyle"]');

            const toastMsg = document.getElementById('toastMsg');
            let toastTimer = null;

            function showToast(msg) {
                toastMsg.textContent = msg || '✨ 已导出';
                toastMsg.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toastMsg.classList.remove('show');
                }, 2800);
            }

            // 核心更新
            function updateButton() {
                // 文字
                const text = textInput.value.trim() || '按钮';
                btnLabel.textContent = text;

                // 渐变
                const dir = directionSelect.value;
                const a = colorA.value;
                const b = colorB.value;
                const gradient = `linear-gradient(${dir}, ${a}, ${b})`;

                // === 边长 (宽度/高度) ===
                const top = parseInt(dimTop.value, 10);
                const right = parseInt(dimRight.value, 10);
                const bottom = parseInt(dimBottom.value, 10);
                const left = parseInt(dimLeft.value, 10);

                dimTopVal.textContent = top;
                dimRightVal.textContent = right;
                dimBottomVal.textContent = bottom;
                dimLeftVal.textContent = left;

                // 计算最终宽高: 左右之和, 上下之和
                const width = left + right;
                const height = top + bottom;
                previewBtn.style.width = width + 'px';
                previewBtn.style.height = height + 'px';
                previewBtn.style.minWidth = 'unset';
                previewBtn.style.minHeight = 'unset';

                // === 圆角 ===
                const tl = parseInt(radiusTL.value, 10);
                const tr = parseInt(radiusTR.value, 10);
                const br = parseInt(radiusBR.value, 10);
                const bl = parseInt(radiusBL.value, 10);
                previewBtn.style.borderRadius = `${tl}px ${tr}px ${br}px ${bl}px`;

                radiusTLVal.textContent = tl;
                radiusTRVal.textContent = tr;
                radiusBRVal.textContent = br;
                radiusBLVal.textContent = bl;

                // === 背景样式 ===
                let selectedBg = 'glass';
                for (const radio of bgRadios) {
                    if (radio.checked) {
                        selectedBg = radio.value;
                        break;
                    }
                }

                // 重置
                previewBtn.style.background = '';
                previewBtn.style.backdropFilter = '';
                previewBtn.style.webkitBackdropFilter = '';
                previewBtn.style.backgroundColor = '';
                previewBtn.style.opacity = '1';

                if (selectedBg === 'glass') {
                    previewBtn.style.background = `linear-gradient(${dir}, ${a}, ${b}), rgba(255,255,255,0.06)`;
                    previewBtn.style.backdropFilter = 'blur(14px) saturate(1.4)';
                    previewBtn.style.webkitBackdropFilter = 'blur(14px) saturate(1.4)';
                    previewBtn.style.backgroundColor = 'rgba(255,255,255,0.04)';
                } else if (selectedBg === 'solid') {
                    previewBtn.style.background = gradient;
                    previewBtn.style.backdropFilter = 'none';
                    previewBtn.style.webkitBackdropFilter = 'none';
                } else if (selectedBg === 'translucent') {
                    previewBtn.style.background = gradient;
                    previewBtn.style.opacity = '0.7';
                    previewBtn.style.backdropFilter = 'none';
                    previewBtn.style.webkitBackdropFilter = 'none';
                } else if (selectedBg === 'none') {
                    previewBtn.style.background = 'transparent';
                    previewBtn.style.backdropFilter = 'none';
                    previewBtn.style.webkitBackdropFilter = 'none';
                    previewBtn.style.backgroundColor = 'transparent';
                }

                // 按压状态
                if (pressedToggle.checked) {
                    previewBtn.classList.add('pressed');
                } else {
                    previewBtn.classList.remove('pressed');
                }
            }

            // 绑定事件
            textInput.addEventListener('input', updateButton);
            colorA.addEventListener('input', updateButton);
            colorB.addEventListener('input', updateButton);
            directionSelect.addEventListener('change', updateButton);
            pressedToggle.addEventListener('change', updateButton);

            [dimTop, dimRight, dimBottom, dimLeft].forEach(el => el.addEventListener('input', updateButton));
            [radiusTL, radiusTR, radiusBR, radiusBL].forEach(el => el.addEventListener('input', updateButton));

            for (const radio of bgRadios) {
                radio.addEventListener('change', updateButton);
            }

            updateButton();

            // ===== 导出 (包含按压状态) =====
            exportBtn.addEventListener('click', async function() {
                const btn = previewBtn;
                const label = btnLabel.textContent.trim() || 'button';
                const safeLabel = label.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_');

                // 是否要导出按压状态？ 如果按压预览开启，就导出按压态；否则导出普通态
                // 但用户可能想导出按压态但预览没开，所以我们增加一个选项：强制导出按压态
                // 更直观： 如果按压预览开启，导出按压态；否则导出普通态
                const isPressed = pressedToggle.checked;

                try {
                    // 如果导出按压态但预览没开，我们临时添加按压类
                    if (isPressed) {
                        btn.classList.add('pressed');
                    } else {
                        btn.classList.remove('pressed');
                    }

                    const canvas = await html2canvas(btn, {
                        scale: 2.5,
                        backgroundColor: null,
                        allowTaint: false,
                        useCORS: true,
                        logging: false,
                        borderRadius: getComputedStyle(btn).borderRadius,
                    });

                    // 恢复状态
                    if (!isPressed) {
                        btn.classList.remove('pressed');
                    } else {
                        // 如果原本就是按压预览开启，保持
                        if (pressedToggle.checked) {
                            btn.classList.add('pressed');
                        } else {
                            btn.classList.remove('pressed');
                        }
                    }

                    const link = document.createElement('a');
                    const suffix = isPressed ? '_pressed' : '';
                    link.download = `btn_${safeLabel}${suffix}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    showToast(`✅ 导出${isPressed ? '按压' : '普通'}态: ${label}`);
                } catch (err) {
                    console.warn('导出失败:', err);
                    showToast('⚠️ 导出失败，请重试');
                }
            });

            // 点击预览切换按压
            previewBtn.addEventListener('click', function(e) {
                const current = pressedToggle.checked;
                pressedToggle.checked = !current;
                updateButton();
                showToast(`按压预览 ${pressedToggle.checked ? '开启' : '关闭'}`);
            });

        })();
    </script>
</body>
</html>
