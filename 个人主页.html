<script>
(function(){
  const cv = document.getElementById('particle-canvas');
  const ctx = cv.getContext('2d');
  const contentEl = document.querySelector('.content');
  const spaceEl = document.querySelector('.particle-space');

  let cachedFontStack = null;
  function currentFontStack(){
    if (cachedFontStack) return cachedFontStack;
    const s = getComputedStyle(document.documentElement)
      .getPropertyValue('--font-stack').trim();
    cachedFontStack = s || 'sans-serif';
    return cachedFontStack;
  }

  const CFG = {
    text:'qaq_2_30_awa',
    weight:800, step:3.5, dotSize:1.5, ease:0.22, jitter:0.03,
    breathAmp:1.4,
    alphaThreshold:0.6,
    colorLight:'#111111',
    colorDark:'#e6edf3',
    mouseForce:2.2, mouseRadius:150, maxParticles:20000
  };

  /* ★ 新增：触摸设备缩小鼠标斥力半径/力度，避免手指挡住文字 */
  if (window.matchMedia && window.matchMedia('(hover: none)').matches){
    CFG.mouseRadius = 90;
    CFG.mouseForce  = 1.6;
  }

  /* ★ 新增：暴露水波采样接口，供粒子读取高度场 */
  window.ParticleWater = {
    buf: null, cols: 0, rows: 0, scale: 1,
    sample(x, y){
      if (!this.buf) return 0;
      const gx = Math.floor(x / this.scale);
      const gy = Math.floor(y / this.scale);
      if (gx < 0 || gy < 0 || gx >= this.cols || gy >= this.rows) return 0;
      return this.buf[gy * this.cols + gx];
    }
  };

  const hex2rgb = h => {
    const s = h.replace('#','');
    const n = parseInt(s.length===3 ? s.split('').map(c=>c+c).join('') : s, 16);
    return [n>>16&255, n>>8&255, n&255];
  };

  const JITTER_BITS = 10;
  const JITTER_MASK = (1 << JITTER_BITS) - 1;
  const jitterX = new Float32Array(JITTER_MASK + 1);
  const jitterY = new Float32Array(JITTER_MASK + 1);
  for (let i = 0; i <= JITTER_MASK; i++){
    jitterX[i] = Math.random() - 0.5;
    jitterY[i] = Math.random() - 0.5;
  }
  let jitterIdx = 0;

  const raster = {
    big: document.createElement('canvas'),
    grid: document.createElement('canvas'),
    bigCtx:null, gridCtx:null,
    init(){
      this.bigCtx = this.big.getContext('2d');
      this.gridCtx = this.grid.getContext('2d', {willReadFrequently:true});
    },
    sample(text, gw, gh, weight, font){
      const BIG_H = 1024;
      const aspect = gw/gh;
      const BIG_W = Math.max(64, Math.round(BIG_H*aspect));
      this.big.width = BIG_W; this.big.height = BIG_H;
      const bc = this.bigCtx;
      bc.clearRect(0,0,BIG_W,BIG_H);
      bc.fillStyle = '#fff'; bc.textAlign = 'center'; bc.textBaseline = 'middle';
      const lines = (text||'你好').split('\n').filter(l=>l.length>0);
      if (!lines.length) return null;
      const maxW = BIG_W*0.82, maxH = BIG_H*0.82;
      let size = Math.floor(Math.min(maxH/lines.length, maxW)*0.85);
      const setFont = s => { bc.font = `${weight} ${s}px ${font}`; };
      setFont(size);
      let widest = 0;
      for (const l of lines) widest = Math.max(widest, bc.measureText(l).width);
      if (widest > maxW){ size = Math.max(4, Math.floor(size*maxW/widest)); setFont(size); }
      const totalH = size*1.15*lines.length;
      if (totalH > maxH){ size = Math.max(4, Math.floor(size*maxH/totalH)); setFont(size); }
      const lineH = size*1.15;
      const startY = BIG_H/2 - (lines.length-1)*lineH/2;
      for (let i=0; i<lines.length; i++) bc.fillText(lines[i], BIG_W/2, startY+i*lineH);
      this.grid.width = gw; this.grid.height = gh;
      const gc = this.gridCtx;
      gc.clearRect(0,0,gw,gh);
      gc.imageSmoothingEnabled = true; gc.imageSmoothingQuality = 'high';
      gc.drawImage(this.big, 0,0, BIG_W,BIG_H, 0,0, gw,gh);
      return gc.getImageData(0,0,gw,gh);
    }
  };
  raster.init();

  class TextParticles {
    constructor(w,h){
      this.w=w; this.h=h; this.n=0;
      this.x=this.y=this.tx=this.ty=this.ox=this.oy=null;
      this.sig='';
      this.settle = 0;
    }
    resize(w,h){ this.w=w; this.h=h; this.sig=''; }
    getOY(){
      const spaceH = spaceEl ? spaceEl.getBoundingClientRect().height : 220;
      return Math.max(20, (spaceH - Math.min(220, this.h * 0.3)) / 2);
    }
    rebuild(){
      const w=this.w, h=this.h;
      const areaH = Math.min(220, h*0.3);
      const fit = 0.9;
      const rw = w*fit, rh = areaH;
      const ox = (w-rw)/2;
      const oy = this.getOY();
      let gw = Math.max(2, Math.round(rw/CFG.step));
      let gh = Math.max(2, Math.round(rh/CFG.step));
      if (gw*gh > CFG.maxParticles){
        const k = Math.sqrt(gw*gh/CFG.maxParticles);
        gw = Math.max(2, Math.round(gw/k));
        gh = Math.max(2, Math.round(gh/k));
      }
      const fontStack = currentFontStack();
      const img = raster.sample(CFG.text, gw, gh, CFG.weight, fontStack);
      if (!img){ this.n=0; this.sig=''; return; }
      const data = img.data;
      const total = gw*gh;
      const T = CFG.alphaThreshold*255;
      const valid = [];
      for (let i=0; i<total; i++) if (data[i*4+3] > T) valid.push(i);
      const n = valid.length;
      const cw = rw/gw, ch = rh/gh;
      if (n !== this.n){
        this.x = new Float32Array(n); this.y = new Float32Array(n);
        this.tx = new Float32Array(n); this.ty = new Float32Array(n);
        this.ox = new Float32Array(n); this.oy = new Float32Array(n);
      }
      const cx = w/2, cy = oy + rh/2;
      for (let k=0; k<n; k++){
        const i = valid[k];
        const gx = i%gw, gy = (i/gw)|0;
        const targetX = ox + (gx+0.5)*cw;
        const targetY = oy + (gy+0.5)*ch;
        this.ox[k] = targetX; this.oy[k] = targetY;
        this.tx[k] = targetX; this.ty[k] = targetY;
        if (reduceMotion){ this.x[k]=targetX; this.y[k]=targetY; }
        else {
          const ang = Math.random() * Math.PI * 2;
          const rad = Math.random() * 12;
          this.x[k] = cx + Math.cos(ang) * rad;
          this.y[k] = cy + Math.sin(ang) * rad;
        }
      }
      this.n = n;
      this.sig = `${CFG.text}|${CFG.weight}|${fontStack}|${w}x${h}`;
      if (!reduceMotion) this.settle = 1;
    }
    update(now){
      const w=this.w, h=this.h;
      const fontStack = currentFontStack();
      const sig = `${CFG.text}|${CFG.weight}|${fontStack}|${w}x${h}`;
      if (sig !== this.sig) this.rebuild();
      ctx.clearRect(0,0,w,h);
      if (this.n === 0) return;

      if (this.settle > 0) this.settle *= 0.94;
      const extra = this.settle * 0.28;
      const ease = CFG.ease + extra;

      const dot = CFG.dotSize, half = dot/2;
      const jit = reduceMotion ? 0 : CFG.jitter;
      const dark = window.Theme ? Theme.dark : false;
      const [caR,caG,caB] = hex2rgb(dark ? CFG.colorDark : CFG.colorLight);
      ctx.fillStyle = `rgb(${caR},${caG},${caB})`;

      const mActive = !reduceMotion && InputBus.inside && InputBus.enabled && CFG.mouseForce > 0;
      const mx = InputBus.x, my = InputBus.y;
      const RAD = CFG.mouseRadius, FORCE = CFG.mouseForce;
      const RAD2 = RAD * RAD;
      const JITTER_K = jit;
      let jIdx = jitterIdx;

      const t = now * 0.0008;
      const bAmp = reduceMotion ? 0 : CFG.breathAmp;

      /* ★ 新增：水波采样开关 */
      const waterOn = !!window.ParticleWater && !!window.ParticleWater.buf;

      for (let i=0; i<this.n; i++){
        let px = this.x[i], py = this.y[i];
        let tx = this.ox[i], ty = this.oy[i];

        if (bAmp > 0){
          tx += Math.sin(t + i * 0.013) * bAmp;
          ty += Math.cos(t * 0.9 + i * 0.017) * bAmp;
        }

        if (mActive){
          const dx = px-mx, dy = py-my;
          const d2 = dx*dx + dy*dy;
          if (d2 < RAD2){
            const d = Math.sqrt(d2) + 0.001;
            const v = (1-d/RAD)*FORCE*RAD*0.6;
            tx += (dx/d)*v; ty += (dy/d)*v;
          }
        }

        /* ★ 新增：读取水波高度，做 Y 偏移 + 透明度调制 */
        let wShift = 0;
        let wAlpha = 1;
        if (waterOn){
          const s = window.ParticleWater.sample(px, py);
          if (s !== 0){
            wShift = s * 0.9;
            wAlpha = 1 - Math.min(0.5, Math.abs(s) * 0.06);
          }
        }

        const jx = jitterX[jIdx & JITTER_MASK] * JITTER_K;
        const jy = jitterY[jIdx & JITTER_MASK] * JITTER_K;
        jIdx++;

        px += (tx-px)*ease + jx;
        py += (ty-py)*ease + jy + wShift;
        this.x[i]=px; this.y[i]=py;

        if (wAlpha < 1) ctx.globalAlpha = wAlpha;
        ctx.fillRect(px-half, py-half + wShift, dot, dot);
        if (wAlpha < 1) ctx.globalAlpha = 1;
      }
      jitterIdx = jIdx;
    }
  }

  let W=0, H=0, particles=null, firstFrame = false;
  let hidden = false, suspended = false, offscreen = false, scheduled = false;

  function resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W*dpr); cv.height = Math.floor(H*dpr);
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if (particles) particles.resize(W,H);
    applyScroll();
  }

  function schedule(){
    if (scheduled || hidden || offscreen || suspended) return;
    scheduled = true;
    requestAnimationFrame(loop);
  }
  function loop(now){
    scheduled = false;
    if (hidden || offscreen || suspended) return;
    if (!particles) particles = new TextParticles(W,H);
    particles.update(now || performance.now());
    if (!firstFrame){
      firstFrame = true;
      Boot.set(100);
    }
    if (!reduceMotion || (particles && particles.settle > 0.01)) schedule();
  }
  function start(){ schedule(); }

  let lastScrollTop = -1;
  let scrollRaf = 0;
  function applyScroll(){
    if (!contentEl) return;
    const top = contentEl.scrollTop;
    if (top === lastScrollTop) return;
    lastScrollTop = top;
    if (top > 0) cv.style.transform = `translate3d(0,${-top}px,0)`;
    else cv.style.transform = '';

    const spH = spaceEl ? spaceEl.offsetHeight : 220;
    const out = top > spH + 40;
    if (out !== offscreen){
      offscreen = out;
      if (!out) start();
    }
  }
  if (contentEl){
    contentEl.addEventListener('scroll', () => {
      if (scrollRaf) return;
      scrollRaf = requestAnimationFrame(() => { scrollRaf = 0; applyScroll(); });
    }, {passive:true});
  }

  resize();
  let rzTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(rzTimer);
    rzTimer = setTimeout(() => { resize(); start(); }, 160);
  });
  window.addEventListener('orientationchange', () => {
    clearTimeout(rzTimer);
    rzTimer = setTimeout(() => { resize(); start(); }, 260);
  });

  document.addEventListener('visibilitychange', () => {
    hidden = document.hidden;
    if (!hidden) start();
  });

  document.addEventListener('navtoggle', e => {
    suspended = !!e.detail.open;
    if (!suspended) start();
  });

  window.addEventListener('fontchange', () => {
    cachedFontStack = null;
    if (particles) particles.sig = '';
    start();
  });

  if (window.Theme){
    Theme.onChange(() => { start(); });
  }

  function beginParticles(){
    Boot.set(75);
    start();
  }
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(() => setTimeout(beginParticles, 80));
  } else {
    setTimeout(beginParticles, 300);
  }
})();
</script>

<!-- ==================== 导航（数据源统一：从 DIR_MANIFEST 派生） ==================== -->
<script>
(function(){
  'use strict';

  const escapeHtml = window.Util.escapeHtml;

  /* 分类规则：按路径前缀匹配，从上到下第一个命中生效 */
  const NAV_CATS = [
    { id:'mine',     name:'自研作品',   test: p => !p.includes('/') && p.endsWith('.html') },
    { id:'aurora',   name:'极光特效',   test: p => p.startsWith('极光/') },
    { id:'games',    name:'游戏合集',   test: p => /^(2048|snake|星轨矿工|豪宅大亨|网页小游戏|剧情游戏)\//.test(p) },
    { id:'toys',     name:'小玩具',     test: p => /^(paint-toys|memory-toys|maze-toys|sliding-toys|toms\.toys|cursoreffects|weavesilk|mikutap|puginarug|thatsthefinger|longdoge|breakout|thecar|mc-classic|floppybird|onesquareminesweeper)\//.test(p) },
    { id:'creative', name:'创意实验',   test: p => /^(3D 霓虹线条|爱心|圣诞树|动态文字自由落体|粉丝数增长动画|晃动工坊|表白|本地版)\//.test(p)
                                                  || ['五星红旗.html','EasterEgg.html','最小 3D.html','蜈蚣式龙.html','布料.html'].includes(p) },
    { id:'tools',    name:'工具 / 学习', test: () => true }
  ];

  function flatten(items, out){
    out = out || [];
    (items || []).forEach(it => {
      if (it.type === 'folder'){
        if (it.children) flatten(it.children, out);
      } else {
        out.push({ name: it.name, path: it.path, desc: it.desc || '' });
      }
    });
    return out;
  }

  function buildNavData(manifest){
    const files = flatten(manifest);
    const groups = NAV_CATS.map(c => ({ id:c.id, name:c.name, items:[] }));
    const byId = Object.fromEntries(groups.map(g => [g.id, g]));
    files.forEach(f => {
      const cat = NAV_CATS.find(c => c.test(f.path)) || NAV_CATS[NAV_CATS.length - 1];
      byId[cat.id].items.push(f);
    });
    return groups.filter(g => g.items.length > 0);
  }

  function getManifest(){
    return (window.DirReader && window.DirReader.manifest) || [];
  }

  const NAV_DATA = buildNavData(getManifest());
  window.NAV_DATA = NAV_DATA;

  const fab = document.getElementById('navFab');
  const fabBadge = document.getElementById('fabBadge');
  const modal = document.getElementById('navModal');
  const closeBtn = document.getElementById('navClose');
  const searchInput = document.getElementById('navSearch');
  const filtersEl = document.getElementById('navFilters');
  const bodyEl = document.getElementById('navBody');
  const countEl = document.getElementById('navCount');

  let activeCat = 'all';
  let term = '';
  let lastFocused = null;

  const totalItems = NAV_DATA.reduce((s,c)=>s+c.items.length,0);
  fabBadge.textContent = totalItems;
  countEl.textContent = totalItems + ' 个';

  function makeFilterBtn(id, name){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'nf-btn' + (id===activeCat?' active':'');
    b.dataset.cat = id;
    b.textContent = name;
    return b;
  }
  function renderFilters(){
    const frag = document.createDocumentFragment();
    frag.appendChild(makeFilterBtn('all','全部'));
    NAV_DATA.forEach(c => frag.appendChild(makeFilterBtn(c.id, c.name)));
    filtersEl.textContent = '';
    filtersEl.appendChild(frag);
  }

  filtersEl.addEventListener('click', e => {
    const btn = e.target.closest('.nf-btn');
    if (!btn) return;
    activeCat = btn.dataset.cat;
    filtersEl.querySelectorAll('.nf-btn').forEach(x =>
      x.classList.toggle('active', x.dataset.cat === activeCat));
    renderBody();
  });

  function renderBody(){
    const t = term.trim().toLowerCase();
    let totalShown = 0;
    const frag = document.createDocumentFragment();

    NAV_DATA.forEach(cat => {
      if (activeCat !== 'all' && cat.id !== activeCat) return;
      const matched = cat.items.filter(item => {
        if (!t) return true;
        return (item.name||'').toLowerCase().includes(t)
            || (item.desc||'').toLowerCase().includes(t)
            || (cat.name||'').toLowerCase().includes(t);
      });
      if (matched.length === 0) return;
      totalShown += matched.length;

      const group = document.createElement('div');
      group.className = 'nav-group';

      const title = document.createElement('div');
      title.className = 'ng-title';
      title.innerHTML = `<span>${escapeHtml(cat.name)}</span>
        <span class="n">${matched.length}</span>`;
      group.appendChild(title);

      const grid = document.createElement('div');
      grid.className = 'nav-grid';
      matched.forEach(item => {
        const initial = (item.name || '?').trim().charAt(0);
        const a = document.createElement('a');
        a.className = 'nav-item';
        a.href = encodeURI(item.path);
        a.innerHTML = `
          <div class="ni-icon" aria-hidden="true">${escapeHtml(initial)}</div>
          <div class="ni-body">
            <div class="ni-name">${escapeHtml(item.name)}</div>
            <div class="ni-desc">${escapeHtml(item.desc || '')}</div>
          </div>
        `;
        grid.appendChild(a);
      });
      group.appendChild(grid);
      frag.appendChild(group);
    });

    bodyEl.textContent = '';
    if (totalShown === 0){
      bodyEl.innerHTML = `<div class="nav-empty"><div>没有找到匹配的项目</div></div>`;
    } else {
      bodyEl.appendChild(frag);
    }
    countEl.textContent = totalShown + ' 个';
  }

  function openModal(){
    lastFocused = document.activeElement;
    modal.classList.add('show');
    InputBus.enabled = false;
    InputBus._end();
    window.dispatchNavToggle(true);
    closeBtn.focus();
  }
  function closeModal(){
    modal.classList.remove('show');
    InputBus.enabled = true;
    window.dispatchNavToggle(false);
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }

  fab.addEventListener('click', openModal);
  closeBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && modal.classList.contains('show')) closeModal();
  });

  modal.addEventListener('keydown', e => {
    if (e.key !== 'Tab' || !modal.classList.contains('show')) return;
    const focusables = modal.querySelectorAll(
      'button:not([disabled]), input:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])'
    );
    if (!focusables.length) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    const active = document.activeElement;
    if (!modal.contains(active)){ e.preventDefault(); first.focus(); return; }
    if (e.shiftKey && active === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && active === last){ e.preventDefault(); first.focus(); }
  });

  let searchRaf = 0;
  searchInput.addEventListener('input', e => {
    term = e.target.value;
    if (searchRaf) return;
    searchRaf = requestAnimationFrame(() => { searchRaf = 0; renderBody(); });
  });

  function ready(fn){
    if (document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', fn, { once:true });
    } else fn();
  }
  ready(() => {
    const manifest = getManifest();
    if (manifest.length){
      const rebuilt = buildNavData(manifest);
      NAV_DATA.length = 0;
      rebuilt.forEach(g => NAV_DATA.push(g));
      window.NAV_DATA = NAV_DATA;
      const total = NAV_DATA.reduce((s,c)=>s+c.items.length,0);
      fabBadge.textContent = total;
      countEl.textContent = total + ' 个';
    }
    renderFilters();
    renderBody();
  });
})();
</script>

  const EXT_MAP = {

  const State = {
    filtered: DIR_MANIFEST,
    searchTerm: '',
    filter: 'all',
    expanded: {},
    animate: false,
    stats: { files:0, folders:0 }
  };
  (function countStats(){
    (function walk(items){
      items.forEach(it => {
        if (it.type === 'folder'){ State.stats.folders++; if (it.children) walk(it.children); }
        else State.stats.files++;
      });
    })(DIR_MANIFEST);
  })();

  let listEl = null, statusEl = null, firstMount = true;

  function createUI(){
    const wrap = document.createElement('div');
    wrap.className = 'dir-reader';

    const header = document.createElement('div');
    header.className = 'dir-header';
    const titleRow = document.createElement('div');
    titleRow.className = 'dir-title-row';

    const title = document.createElement('h2');
    title.className = 'dir-title';
    title.textContent = '当前目录';
    titleRow.appendChild(title);

    const stat = document.createElement('span');
    stat.style.cssText = 'font-size:.68rem;color:var(--fg-muted);margin-left:auto;font-weight:600';
    stat.textContent = `${State.stats.folders} 个文件夹 · ${State.stats.files} 个文件`;
    titleRow.appendChild(stat);

    const expandAllBtn = document.createElement('button');
    expandAllBtn.type = 'button';
    expandAllBtn.className = 'dir-btn';
    expandAllBtn.textContent = '⊞';
    expandAllBtn.title = '展开全部';
    expandAllBtn.setAttribute('aria-label','展开全部');
    titleRow.appendChild(expandAllBtn);

    const collapseAllBtn = document.createElement('button');
    collapseAllBtn.type = 'button';
    collapseAllBtn.className = 'dir-btn';
    collapseAllBtn.textContent = '⊟';
    collapseAllBtn.title = '折叠全部';
    collapseAllBtn.setAttribute('aria-label','折叠全部');
    titleRow.appendChild(collapseAllBtn);

    header.appendChild(titleRow);
    wrap.appendChild(header);

    const toolbar = document.createElement('div');
    toolbar.className = 'dir-toolbar';

    const searchWrap = document.createElement('div');
    searchWrap.className = 'dir-search';
    searchWrap.innerHTML = '<span class="dir-search-icon" aria-hidden="true">' +
      '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">' +
      '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>';
    const searchInput = document.createElement('input');
    searchInput.type = 'search';
    searchInput.className = 'dir-search-input';
    searchInput.placeholder = '搜索…';
    searchInput.setAttribute('aria-label','搜索文件');
    searchWrap.appendChild(searchInput);
    toolbar.appendChild(searchWrap);

    const filters = document.createElement('div');
    filters.className = 'dir-filters';
    [
      { id:'all',    label:'全部' },
      { id:'folder', label:'文件夹' },
      { id:'file',   label:'文件' }
    ].forEach(f => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'dir-filter-btn' + (f.id === 'all' ? ' active' : '');
      btn.dataset.filter = f.id;
      btn.textContent = f.label;
      filters.appendChild(btn);
    });
    toolbar.appendChild(filters);
    wrap.appendChild(toolbar);

    const status = document.createElement('div');
    status.className = 'dir-status';
    status.setAttribute('aria-live','polite');
    wrap.appendChild(status);

    const list = document.createElement('div');
    list.className = 'dir-list';
    wrap.appendChild(list);

    wrap._statusEl = status;
    wrap._listEl = list;
    wrap._searchInput = searchInput;
    wrap._filters = filters;
    wrap._expandAllBtn = expandAllBtn;
    wrap._collapseAllBtn = collapseAllBtn;
    return wrap;
  }

  function setAllExpanded(open){
    (function walk(items){
      items.forEach(it => {
        if (it.type === 'folder'){
          State.expanded[folderKey(it)] = open;
          if (it.children) walk(it.children);
        }
      });
    })(DIR_MANIFEST);
  }

  function applyFilter(){
    const t = State.searchTerm;
    const matchSelf = (it, q) =>
      (it.name||'').toLowerCase().includes(q) ||
      (it.desc||'').toLowerCase().includes(q) ||
      (it.path||'').toLowerCase().includes(q);

    function filterItems(items){
      const out = [];
      for (const it of items){
        if (it.type === 'folder'){
          const kids = it.children ? filterItems(it.children) : [];
          if (State.filter === 'file'){
            out.push(...kids);
            continue;
          }
          const selfMatch = !t || matchSelf(it, t);
          if (selfMatch || kids.length){
            out.push(Object.assign({}, it, { children: kids }));
          }
        } else {
          if (State.filter === 'folder') continue;
          if (t && !matchSelf(it, t)) continue;
          out.push(it);
        }
      }
      return out;
    }
    State.filtered = filterItems(DIR_MANIFEST);
    render();
  }

  function render(){
    if (!listEl) return;
    let shownFiles = 0, shownFolders = 0;
    (function count(items){
      items.forEach(it => {
        if (it.type === 'folder'){ shownFolders++; if (it.children) count(it.children); }
        else shownFiles++;
      });
    })(State.filtered);

    const frag = document.createDocumentFragment();
    if (State.filtered.length === 0){
      const empty = document.createElement('div');
      empty.className = 'dir-empty';
      empty.innerHTML = `
        <div>没有找到匹配的项目</div>
        <div class="dir-empty-hint">尝试更换过滤条件或搜索关键词</div>
      `;
      frag.appendChild(empty);
    } else {
      const animate = State.animate;
      State.filtered.forEach(it => renderItem(frag, it, 0, [], animate));
    }
    listEl.textContent = '';
    listEl.appendChild(frag);
    State.animate = false;

    statusEl.textContent = `显示 ${shownFolders} 个文件夹 · ${shownFiles} 个文件`;
  }

  function buildTreePrefix(ancestors, isLast){
    let s = '';
    for (let i = 0; i < ancestors.length; i++){
      s += ancestors[i] ? '    ' : '│   ';
    }
    s += isLast ? '└── ' : '├── ';
    return s;
  }

  function renderItem(parent, item, depth, ancestors, animate){
    const key = item.type === 'folder' ? folderKey(item) : null;
    const hasKids = !!(item.children && item.children.length);
    const isOpen = key
      ? (!!State.expanded[key] || (!!State.searchTerm && hasKids))
      : false;

    const row = document.createElement(item.type === 'folder' ? 'div' : 'a');
    row.className = 'dir-item ' + (item.type === 'folder' ? 'dir-item-folder' : 'dir-item-file');

    if (animate && depth > 0 && !reduceMotion){
      row.classList.add('dir-item-enter');
      row.style.animationDelay = Math.min(depth, 3) * 30 + 'ms';
    }

    if (item.type === 'folder'){
      row.tabIndex = 0;
      row.setAttribute('role','button');
      row.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    } else {
      row.href = encodeURI(item.path);
      row.target = '_blank';
      row.rel = 'noopener';
    }

    if (depth > 0){
      const tree = document.createElement('span');
      tree.className = 'dir-tree';
      tree.setAttribute('aria-hidden','true');
      tree.textContent = buildTreePrefix(ancestors, item.__isLast !== false);
      row.appendChild(tree);
    }

    const toggle = document.createElement('span');
    toggle.className = 'dir-toggle';
    toggle.setAttribute('aria-hidden','true');
    row.appendChild(toggle);

    const icon = document.createElement('div');
    icon.className = 'dir-item-icon';
    icon.setAttribute('aria-hidden','true');
    icon.innerHTML = item.type === 'folder' ? SVG_ICONS.folder : getFileIconSvg(item.name);
    row.appendChild(icon);

    const body = document.createElement('div');
    body.className = 'dir-item-body';
    const nameEl = document.createElement('div');
    nameEl.className = 'dir-item-name';
    nameEl.textContent = item.name;
    body.appendChild(nameEl);

    const meta = document.createElement('div');
    meta.className = 'dir-item-meta';
    const typeEl = document.createElement('span');
    typeEl.className = 'dir-item-type';
    if (item.type === 'folder'){
      typeEl.textContent = '文件夹';
    } else {
      const ext = getExt(item.name);
      typeEl.textContent = ext ? ext.replace('.','').toUpperCase() : '文件';
    }
    meta.appendChild(typeEl);
    if (item.desc){
      const d = document.createElement('span');
      d.textContent = item.desc;
      meta.appendChild(d);
    }
    if (item.type === 'folder' && item.children){
      const c = document.createElement('span');
      c.textContent = item.children.length + ' 项';
      meta.appendChild(c);
    }
    if (item.size != null){
      const s = document.createElement('span');
      s.className = 'dir-item-size';
      s.textContent = formatSize(item.size);
      meta.appendChild(s);
    }
    body.appendChild(meta);
    row.appendChild(body);

    if (item.type === 'file'){
      const actions = document.createElement('div');
      actions.className = 'dir-item-actions';
      const openBtn = document.createElement('a');
      openBtn.className = 'dir-item-action';
      openBtn.href = encodeURI(item.path);
      openBtn.target = '_blank';
      openBtn.rel = 'noopener';
      openBtn.title = '新标签页打开';
      openBtn.setAttribute('aria-label','新标签页打开');
      openBtn.textContent = '↗';
      openBtn.addEventListener('click', e => e.stopPropagation());
      actions.appendChild(openBtn);
      row.appendChild(actions);
    }

    if (item.type === 'folder'){
      const toggleFn = () => {
        State.expanded[key] = !State.expanded[key];
        State.animate = State.expanded[key];
        render();
      };
      row.addEventListener('click', toggleFn);
      row.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          toggleFn();
        }
      });
    }

    parent.appendChild(row);

    if (item.type === 'folder' && isOpen && item.children){
      const nextAncestors = ancestors.concat([item.__isLast !== false]);
      item.children.forEach((child, idx) => {
        const childClone = Object.assign({}, child);
        childClone.__isLast = (idx === item.children.length - 1);
        renderItem(parent, childClone, depth + 1, nextAncestors, animate);
      });
    }
  }

  function mount(){
    const mountEl = document.getElementById('dirReaderMount');
    if (!mountEl) return;
    const ui = createUI();
    mountEl.textContent = '';
    mountEl.appendChild(ui);

    listEl = ui._listEl;
    statusEl = ui._statusEl;

    let searchRaf = 0;
    ui._searchInput.addEventListener('input', e => {
      State.searchTerm = e.target.value.trim().toLowerCase();
      if (searchRaf) return;
      searchRaf = requestAnimationFrame(() => { searchRaf = 0; applyFilter(); });
    });
    ui._filters.addEventListener('click', e => {
      const btn = e.target.closest('.dir-filter-btn');
      if (!btn) return;
      State.filter = btn.dataset.filter;
      ui._filters.querySelectorAll('.dir-filter-btn')
        .forEach(b => b.classList.toggle('active', b.dataset.filter === State.filter));
      applyFilter();
    });
    ui._expandAllBtn.addEventListener('click', () => {
      setAllExpanded(true); State.animate = true; render();
    });
    ui._collapseAllBtn.addEventListener('click', () => {
      setAllExpanded(false); render();
    });

    if (firstMount && DIR_MANIFEST.length){
      const firstFolder = DIR_MANIFEST.find(it => it.type === 'folder');
      if (firstFolder) State.expanded[folderKey(firstFolder)] = true;
      firstMount = false;
    }
    applyFilter();
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', mount);
  } else {
    mount();
  }

  window.DirReader = {
    reload: mount,
    state: State,
    manifest: DIR_MANIFEST,
    expandAll: () => { setAllExpanded(true); State.animate = true; render(); },
    collapseAll: () => { setAllExpanded(false); render(); }
  };
})();
