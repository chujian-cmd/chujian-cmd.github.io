<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="qaq_2_30_awa 的个人主页 — 学生党 / vibe coder">
<title>qaq_2_30_awa</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fafafa">

<script>
(function(){
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let initialMatches = mq.matches;

  let override = null;
  try { override = localStorage.getItem('theme'); } catch(e){}
  if (override !== 'light' && override !== 'dark') override = null;

  window.Theme = {
    dark: false,
    override: override,
    handlers: [],
    onChange(fn){ this.handlers.push(fn); fn(this.dark); return fn; },
    off(fn){ const i = this.handlers.indexOf(fn); if (i >= 0) this.handlers.splice(i, 1); },
    toggle(){
      const doToggle = () => {
        this.override = this.dark ? 'light' : 'dark';
        try { localStorage.setItem('theme', this.override); } catch(e){}
        this.apply();
      };
      const btn = document.getElementById('themeFab');
      if (document.startViewTransition && !prefersReduced && btn) {
        const r = btn.getBoundingClientRect();
        const tx = r.left + r.width / 2;
        const ty = r.top + r.height / 2;
        const maxR = Math.hypot(Math.max(tx, innerWidth - tx), Math.max(ty, innerHeight - ty));
        document.documentElement.style.setProperty('--tx', tx + 'px');
        document.documentElement.style.setProperty('--ty', ty + 'px');
        document.documentElement.style.setProperty('--tr', maxR + 'px');
        document.startViewTransition(doToggle);
      } else {
        doToggle();
      }
    },
    apply(){
      this.dark = this.override ? (this.override === 'dark') : initialMatches;
      document.documentElement.dataset.theme = this.dark ? 'dark' : 'light';
      for (let i = 0; i < this.handlers.length; i++) {
        try { this.handlers[i](this.dark); } catch(e){ console.error(e); }
      }
      const btn = document.getElementById('themeFab');
      if (btn) {
        btn.innerHTML = this.dark
          ? '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>'
          : '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
        btn.setAttribute('aria-label', this.dark ? '切换到浅色模式' : '切换到深色模式');
        btn.setAttribute('aria-pressed', this.dark ? 'true' : 'false');
      }
      /* ★ 修改：theme-color 直接复用 head 里已有的 meta，不再重复创建 */
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = this.dark ? '#0d1117' : '#fafafa';
    }
  };

  Theme.dark = override ? (override === 'dark') : initialMatches;
  document.documentElement.dataset.theme = Theme.dark ? 'dark' : 'light';

  const onSysChange = (e) => {
    initialMatches = e.matches;
    if (!Theme.override) Theme.apply();
  };
  if (mq.addEventListener) mq.addEventListener('change', onSysChange);
  else if (mq.addListener) mq.addListener(onSysChange);

  window.addEventListener('storage', e => {
    if (e.key !== 'theme') return;
    const v = e.newValue;
    Theme.override = (v === 'light' || v === 'dark') ? v : null;
    Theme.apply();
  });

  document.addEventListener('DOMContentLoaded', () => Theme.apply());
})();
</script>

<style>
  /* ============================================================
     字体
     ============================================================ */
  @font-face{font-family:"SongPUA";src:url("宋体pua.subset.woff2") format("woff2");font-weight:100 900;font-display:swap;}
  @font-face{font-family:"ZCOOLQingKe";src:url("zcool_qingke_huangyou.subset.woff2") format("woff2");font-weight:100 900;font-display:swap;}
  @font-face{font-family:"FZCuYuan";src:url("FZCuYuan-M03S.subset.woff2") format("woff2");font-weight:100 900;font-display:swap;}
  @font-face{font-family:"Cubic11";src:url("cubic_11.subset.woff2") format("woff2");font-weight:100 900;font-display:swap;}
  @font-face{font-family:"CormorantItalic";src:url("cormorant_garamond_italic_vf.woff2") format("woff2");font-weight:300 700;font-style:italic;font-display:swap;}

  @font-face{font-family:"FZLanZhun";src:url("FZLanTYJW_Zhun.subset.woff2") format("woff2");font-weight:100 900;font-display:swap;}
  @font-face{font-family:"FZLanCu";src:url("FZLanTYJW_Cu.subset.woff2") format("woff2");font-weight:100 900;font-display:swap;}
  @font-face{font-family:"DINRoundedBold";src:url("DINNextRoundedLTPro-Bold.woff2") format("woff2");font-weight:100 900;font-display:swap;}
  @font-face{font-family:"DINRoundedMedium";src:url("DINNextRoundedLTPro-Medium.woff2") format("woff2");font-weight:100 900;font-display:swap;}

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  :root{
    --font-stack:"SongPUA",-apple-system,BlinkMacSystemFont,"Songti SC","SimSun","宋体","Segoe UI",Roboto,"Helvetica Neue",sans-serif;

    /* ---- 响应式尺度变量（由 @media 覆盖） ---- */
    --content-max:520px;
    --content-pad:24px;
    --particle-space:220px;
    --nav-panel-max:720px;
    --nav-grid-min:170px;
    --avatar-size:72px;
    --clock-size:2rem;
    --title-size:1.5rem;
    --dir-indent-step:1.4ch;
    --fab-size:56px;
    --fab-mini-size:44px;
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-right:env(safe-area-inset-right, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
    --safe-left:env(safe-area-inset-left, 0px);
  }
  :root[data-font-key="zcool"]{--font-stack:"ZCOOLQingKe","SongPUA","Songti SC","SimSun","宋体",sans-serif;}
  :root[data-font-key="fz"]{--font-stack:"FZCuYuan","SongPUA","Songti SC","SimSun","宋体",sans-serif;}
  :root[data-font-key="cubic"]{--font-stack:"Cubic11","SongPUA",monospace,sans-serif;}
  :root[data-font-key="cormorant"]{--font-stack:"CormorantItalic","SongPUA","Songti SC","SimSun","宋体",serif;}
  :root[data-font-key="mw"]{--font-stack:"MWBold","SongPUA","Songti SC","SimSun","宋体",sans-serif;}
  :root[data-font-key="system"]{--font-stack:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC",sans-serif;}
  :root[data-font-key="fzZhun"]{--font-stack:"FZLanZhun","SongPUA","Songti SC","SimSun","宋体",sans-serif;}
  :root[data-font-key="fzCu"]{--font-stack:"FZLanCu","SongPUA","Songti SC","SimSun","宋体",sans-serif;}
  :root[data-font-key="dinBold"]{--font-stack:"DINRoundedBold","SongPUA","Songti SC","SimSun","宋体",sans-serif;}
  :root[data-font-key="dinMed"]{--font-stack:"DINRoundedMedium","SongPUA","Songti SC","SimSun","宋体",sans-serif;}

  /* ============================================================
     色板
     ============================================================ */
  :root{
    --bg:#fafafa;--fg:#111111;--fg-soft:#333333;--fg-muted:#888888;
    --fg-faint:#999999;--fg-ghost:#bbbbbb;
    --line:#eaeaea;--line-soft:#eeeeee;--line-faint:#ececec;
    --border:#e0e0e0;--chip:#ffffff;
    --avatar-bg:#f0f0f0;--avatar-border:#e5e5e5;
    --mat-bg:rgba(250,250,251,.68);--mat-bg-strong:rgba(250,250,251,.78);
    --mat-edge:rgba(255,255,255,.80);--mat-hairline:rgba(0,0,0,.06);--mat-drop:rgba(0,0,0,.10);
    --on-mat-fill:rgba(255,255,255,.50);--on-mat-fill-hover:rgba(59,123,255,.12);
    --on-mat-line:rgba(0,0,0,.06);--on-mat-line-hover:rgba(59,123,255,.40);
    --panel-fg:#0b1f33;--panel-bg:#ffffff;
    --nf-active-bg:#0b1f33;--nf-active-fg:#ffffff;
    --fab-bg:#0b1f33;--fab-fg:#ffffff;
    --fab-shadow:rgba(11,31,51,.4);--fab-shadow-hover:rgba(11,31,51,.5);
    --danger:#ff4757;
    --mask:rgba(11,31,51,.5);
    --accent:#3b7bff;--accent-bg:#eef4ff;--accent-ring:rgba(59,123,255,.1);
    --input-bg:rgba(255,255,255,.55);--input-border:rgba(0,0,0,.08);
    --icon:#9fb2cb;--close-bg:rgba(0,0,0,.05);--close-fg:#5b7391;--close-hover-bg:rgba(0,0,0,.09);
    --chip-fg:#4b6589;--chip-border:#e2eaf5;
    --glow:rgba(59,123,255,.15);
    --breath-a:rgba(59,123,255,.12);
    --breath-b:rgba(59,123,255,.03);
  }
  :root[data-theme="dark"]{
    --bg:#0d1117;--fg:#e6edf3;--fg-soft:#c9d1d9;--fg-muted:#8b949e;
    --fg-faint:#7d8590;--fg-ghost:#6e7681;
    --line:#21262d;--line-soft:#1c2128;--line-faint:#21262d;
    --border:#30363d;--chip:#161b22;
    --avatar-bg:#21262d;--avatar-border:#30363d;
    --mat-bg:rgba(22,27,34,.68);--mat-bg-strong:rgba(22,27,34,.78);
    --mat-edge:rgba(255,255,255,.08);--mat-hairline:rgba(255,255,255,.06);--mat-drop:rgba(0,0,0,.55);
    --on-mat-fill:rgba(255,255,255,.06);--on-mat-fill-hover:rgba(88,166,255,.18);
    --on-mat-line:rgba(255,255,255,.08);--on-mat-line-hover:rgba(88,166,255,.45);
    --panel-fg:#e6edf3;--panel-bg:#161b22;
    --nf-active-bg:#e6edf3;--nf-active-fg:#0d1117;
    --fab-bg:#e6edf3;--fab-fg:#0d1117;
    --fab-shadow:rgba(0,0,0,.55);--fab-shadow-hover:rgba(0,0,0,.7);
    --danger:#ff4757;
    --mask:rgba(0,0,0,.65);
    --accent:#58a6ff;--accent-bg:rgba(56,139,253,.15);--accent-ring:rgba(88,166,255,.18);
    --input-bg:rgba(255,255,255,.05);--input-border:rgba(255,255,255,.10);
    --icon:#6e7681;--close-bg:rgba(255,255,255,.06);--close-fg:#8b949e;--close-hover-bg:rgba(255,255,255,.12);
    --chip-fg:#8b949e;--chip-border:#30363d;
    --glow:rgba(88,166,255,.22);
    --breath-a:rgba(88,166,255,.18);
    --breath-b:rgba(88,166,255,.03);
  }

  /* ============================================================
     基础
     ============================================================ */
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:var(--bg);color:var(--fg);
    font-family:var(--font-stack);
    line-height:1.6;
    overscroll-behavior:none;
    touch-action:manipulation;
    transition:background-color .25s, color .25s;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  }
  #water-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}

  #cursorGlow{
    position:fixed;top:0;left:0;
    width:280px;height:280px;
    margin:-140px 0 0 -140px;
    border-radius:50%;
    background:radial-gradient(circle, var(--glow) 0%, transparent 65%);
    pointer-events:none;
    z-index:1;
    opacity:0;
    transform:translate3d(0,0,0);
    transition:opacity .3s;
    will-change:transform;
  }
  #cursorGlow.on{opacity:1}
  @media (hover: none){#cursorGlow{display:none}}

  #particle-canvas{
    position:fixed;top:0;left:0;width:100%;height:100%;
    pointer-events:none;z-index:2;
    will-change:transform;
  }

  /* ============================================================
     内容列 —— 核心响应式容器
     ============================================================ */
  .content{
    position:relative;z-index:3;
    max-width:var(--content-max);
    width:100%;
    margin:0 auto;
    padding:0 var(--content-pad) calc(40px + var(--safe-bottom));
    padding-left:calc(var(--content-pad) + var(--safe-left));
    padding-right:calc(var(--content-pad) + var(--safe-right));
    height:100%;
    overflow-y:auto;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-y;
    scrollbar-width:none;
    transition:transform .45s cubic-bezier(.34,1.5,.64,1);
    will-change:transform;
  }
  .content.pulling{transition:none}
  .content::-webkit-scrollbar{display:none}
  .particle-space{height:var(--particle-space);pointer-events:none;}

  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  .link:focus-visible,.nav-item:focus-visible,.dir-item:focus-visible{
    outline-offset:-2px;outline-width:3px;
  }

  .glass{
    background:var(--mat-bg);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    backdrop-filter:blur(20px) saturate(180%);
    border:1px solid var(--mat-hairline);
    box-shadow:
      0 0 0 1px var(--mat-hairline),
      inset 0 1px 0 var(--mat-edge),
      0 10px 30px -12px var(--mat-drop);
  }
  .header,.link{transition:background-color .25s, border-color .25s, box-shadow .25s}

  .reveal{
    opacity:0;
    transform:translateY(18px);
    transition:opacity .55s cubic-bezier(.2,.7,.3,1), transform .55s cubic-bezier(.2,.7,.3,1);
    will-change:opacity, transform;
  }
  .reveal.in{opacity:1;transform:translateY(0)}

  /* ============================================================
     当下：时间 + 今日氛围
     ============================================================ */
  .nowbar{
    position:relative;
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;
    padding:14px 18px;
    border-radius:20px;
    margin-bottom:16px;
    -webkit-user-select:none;user-select:none;
    overflow:hidden;
    isolation:isolate;
  }
  .nowbar::before{
    content:"";
    position:absolute;
    top:-40%;right:-15%;
    width:70%;height:180%;
    background:radial-gradient(ellipse at center, var(--breath-a), var(--breath-b) 55%, transparent 70%);
    animation:breathe 7s ease-in-out infinite;
    pointer-events:none;
    z-index:-1;
    will-change:transform, opacity;
  }
  @keyframes breathe{
    0%,100% { opacity:.45; transform:translate3d(0,0,0) scale(1); }
    50%     { opacity:.95; transform:translate3d(-12%,4%,0) scale(1.14); }
  }

  .now-time{min-width:0}
  .now-greet{
    font-size:.72rem;color:var(--fg-muted);
    letter-spacing:.05em;margin-bottom:2px;
    transition:color .25s;
  }
  .now-clock{
    font-size:var(--clock-size);font-weight:700;letter-spacing:-0.02em;
    line-height:1.05;font-variant-numeric:tabular-nums;
    color:var(--fg);
    display:flex;align-items:baseline;
    transition:color .25s;
  }
  .now-sec{
    font-size:.5em;margin-left:4px;font-weight:600;
    color:var(--fg-muted);
    transition:color .25s;
  }
  .now-date{
    font-size:.78rem;color:var(--fg-muted);
    margin-top:2px;transition:color .25s;
  }
  .now-weather{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .now-w-icon{
    font-size:1.4rem;line-height:1;
    color:var(--fg-muted);
    opacity:.7;
    animation:iconPulse 3.2s ease-in-out infinite;
  }
  @keyframes iconPulse{
    0%,100%{opacity:.5;transform:scale(1)}
    50%    {opacity:.95;transform:scale(1.18)}
  }
  .now-w-body{text-align:right}
  .now-w-temp{
    font-size:1.05rem;font-weight:700;
    font-variant-numeric:tabular-nums;
    color:var(--fg);line-height:1.1;
    transition:color .25s;
  }
  .now-w-desc{
    font-size:.72rem;color:var(--fg-muted);
    margin-top:1px;transition:color .25s;
    white-space:nowrap;
    max-width:150px;overflow:hidden;text-overflow:ellipsis;
  }

  /* ============================================================
     链接 / 头部 / 区块
     ============================================================ */
  .links{display:flex;flex-direction:column;gap:2px}
  .link{
    position:relative;
    display:flex;align-items:center;justify-content:space-between;
    padding:12px;text-decoration:none;color:var(--fg);font-size:.92rem;
    border-radius:10px;margin-bottom:2px;
    overflow:hidden;
    transition:padding-left .25s cubic-bezier(.2,.7,.3,1),
               background-color .15s, border-color .15s,
               transform .25s cubic-bezier(.2,.7,.3,1),
               box-shadow .25s;
    box-shadow:inset 0 1px 0 var(--mat-edge), 0 4px 14px -8px var(--mat-drop);
    will-change:transform, padding-left;
  }
  @media (hover:hover){
    .link:hover{
      padding-left:18px;
      transform:translateX(3px);
      box-shadow:inset 0 1px 0 var(--mat-edge), 0 10px 22px -10px var(--mat-drop);
    }
  }
  .link:active{background:var(--on-mat-fill-hover)}
  .link .name{display:flex;align-items:center;gap:10px;min-width:0}
  .link .dot{width:6px;height:6px;border-radius:50%;background:var(--fg);flex-shrink:0;transition:transform .25s}
  @media (hover:hover){
    .link:hover .dot{transform:scale(1.6)}
  }
  .link .value{color:var(--fg-faint);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:12px}
  .footer{margin-top:40px;font-size:.75rem;color:var(--fg-ghost);text-align:center}

  .header{
    display:flex;align-items:center;gap:20px;
    margin-bottom:28px;
    padding:14px 18px;
    border-radius:20px;
  }
  .avatar{
    position:relative;
    width:var(--avatar-size);height:var(--avatar-size);border-radius:50%;overflow:hidden;
    border:1px solid var(--avatar-border);flex-shrink:0;background:var(--avatar-bg);
    transition:background-color .25s, border-color .25s, transform .35s cubic-bezier(.2,.7,.3,1);
    transform-style:preserve-3d;
    will-change:transform;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}

  @media (hover: none) and (prefers-reduced-motion: no-preference){
    .avatar{animation:avatarPulse 2.8s ease-in-out infinite}
    .avatar.pop{animation:avatarPop .6s cubic-bezier(.34,1.56,.64,1)}
  }
  @keyframes avatarPulse{
    0%,100%{ box-shadow:0 0 0 0 var(--glow); }
    50%   { box-shadow:0 0 0 8px transparent, 0 0 18px 2px var(--glow); }
  }
  @keyframes avatarPop{
    0%   { transform:scale(1)    rotate(0deg);  }
    25%  { transform:scale(1.12) rotate(-8deg); }
    55%  { transform:scale(.96)  rotate(6deg);  }
    80%  { transform:scale(1.03) rotate(-2deg); }
    100% { transform:scale(1)    rotate(0deg);  }
  }

  .info{min-width:0}
  .info h1{font-size:var(--title-size);font-weight:600;letter-spacing:-0.01em;margin-bottom:2px;overflow-wrap:anywhere}
  .info .sub{font-size:.9rem;color:var(--fg-muted)}
  hr{border:none;border-top:1px solid var(--line);margin:24px 0;transition:border-color .25s}
  .section{margin-bottom:24px}
  .section-title{
    font-size:.75rem;text-transform:uppercase;letter-spacing:0.12em;
    color:var(--fg-faint);margin-bottom:10px;font-weight:600;
  }

  /* 待办列表（原文没有样式，这里补上，避免默认圆点） */
  .todo{list-style:none}
  .todo li{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:.92rem}
  .todo .bullet{width:6px;height:6px;border-radius:50%;background:var(--fg);flex-shrink:0}
  .tag-new{
    font-size:.6rem;font-weight:700;letter-spacing:.06em;
    color:#fff;background:var(--danger);
    padding:1px 6px;border-radius:20px;margin-left:6px;
    vertical-align:middle;
  }
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tag{
    font-size:.78rem;padding:5px 12px;border-radius:20px;
    background:var(--chip);border:1px solid var(--chip-border);
    color:var(--chip-fg);transition:background-color .25s, border-color .25s, color .25s;
  }

  /* ============================================================
     涟漪
     ============================================================ */
  .ripple{
    position:absolute;
    border-radius:50%;
    background:currentColor;
    opacity:.22;
    pointer-events:none;
    transform:scale(0);
    animation:rippleOut .65s cubic-bezier(.2,.7,.3,1) forwards;
    will-change:transform, opacity;
  }
  @keyframes rippleOut{
    to{transform:scale(1);opacity:0}
  }

  /* ============================================================
     首屏加载
     ============================================================ */
  #boot{
    position:fixed;inset:0;z-index:200;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;
    background:var(--bg);
    transition:opacity .4s ease, transform .4s ease, background-color .25s;
  }
  #boot.gone{opacity:0;transform:scale(1.06);pointer-events:none}
  .boot-ring{
    width:56px;height:56px;
    transform:rotate(-90deg);
    overflow:visible;
    animation:ringGlow 2.4s ease-in-out infinite;
  }
  @keyframes ringGlow{
    0%,100%{filter:drop-shadow(0 0 6px var(--breath-a))}
    50%    {filter:drop-shadow(0 0 16px var(--breath-a))}
  }
  .ring-bg,.ring-fg{fill:none;stroke-width:2;stroke-linecap:round}
  .ring-bg{stroke:var(--line);transition:stroke .25s}
  .ring-fg{
    stroke:var(--fg);stroke-dasharray:100;stroke-dashoffset:100;
    transition:stroke-dashoffset .35s cubic-bezier(.4,0,.2,1), stroke .25s;
  }
  .boot-pct{
    font-size:.7rem;font-weight:600;letter-spacing:.08em;
    color:var(--fg-muted);font-variant-numeric:tabular-nums;
    transition:color .25s;
  }
  .boot-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ============================================================
     Toast
     ============================================================ */
  #toast{
    position:fixed;left:50%;bottom:calc(100px + var(--safe-bottom));
    transform:translate(-50%, 18px);
    padding:10px 18px;
    border-radius:14px;
    background:var(--fab-bg);color:var(--fab-fg);
    font-size:.82rem;font-weight:600;
    box-shadow:0 14px 34px -12px rgba(0,0,0,.5);
    opacity:0;pointer-events:none;
    transition:opacity .28s, transform .28s cubic-bezier(.2,.7,.3,1);
    z-index:300;
    max-width:80vw;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-family:inherit;
  }
  #toast.show{opacity:1;transform:translate(-50%, 0)}

  /* ============================================================
     FAB 组（含 safe-area）
     ============================================================ */
  #navFab{
    position:fixed;
    right:calc(20px + var(--safe-right));
    bottom:calc(24px + var(--safe-bottom));
    width:var(--fab-size);height:var(--fab-size);border-radius:50%;
    background:var(--fab-bg);color:var(--fab-fg);border:none;
    cursor:pointer;
    box-shadow:0 8px 24px -6px var(--fab-shadow);
    z-index:50;
    display:flex;align-items:center;justify-content:center;
    transition:transform .2s, box-shadow .2s, background-color .25s, color .25s;
    font-family:inherit;
  }
  #navFab .fab-rip{
    position:absolute;inset:0;border-radius:50%;
    overflow:hidden;pointer-events:none;
  }
  @media (hover:hover){
    #navFab:hover{transform:translateY(-3px);box-shadow:0 14px 30px -8px var(--fab-shadow-hover)}
  }
  #navFab:active{transform:translateY(0) scale(.94)}
  #navFab .badge{
    position:absolute;top:-4px;right:-4px;
    background:var(--danger);color:#fff;
    font-size:.65rem;font-weight:700;
    min-width:20px;height:20px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    padding:0 5px;
    box-shadow:0 0 0 2px var(--bg);
    transition:box-shadow .25s;
  }

  #themeFab,#fontFab{
    position:fixed;
    right:calc(26px + var(--safe-right));
    width:var(--fab-mini-size);height:var(--fab-mini-size);border-radius:50%;
    background:var(--mat-bg-strong);color:var(--fg);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    backdrop-filter:blur(20px) saturate(180%);
    border:1px solid var(--mat-hairline);
    cursor:pointer;overflow:hidden;
    box-shadow:
      0 0 0 1px var(--mat-hairline),
      inset 0 1px 0 var(--mat-edge),
      0 6px 18px -8px var(--fab-shadow);
    z-index:50;
    display:flex;align-items:center;justify-content:center;
    transition:transform .2s, box-shadow .2s, background-color .25s, border-color .25s;
    font-family:inherit;
  }
  #themeFab{bottom:calc(92px + var(--safe-bottom))}
  #fontFab{bottom:calc(148px + var(--safe-bottom))}
  @media (hover:hover){
    #themeFab:hover,#fontFab:hover{
      transform:translateY(-3px);
      box-shadow:
        0 0 0 1px var(--mat-hairline),
        inset 0 1px 0 var(--mat-edge),
        0 12px 24px -8px var(--fab-shadow-hover);
    }
  }
  #themeFab:active,#fontFab:active{transform:translateY(0) scale(.92)}

  /* ============================================================
     View Transitions
     ============================================================ */
  @media (prefers-reduced-motion: no-preference){
    ::view-transition-old(root),
    ::view-transition-new(root){
      animation:none;
      mix-blend-mode:normal;
    }
    ::view-transition-old(root){z-index:1}
    ::view-transition-new(root){
      z-index:2;
      animation:themeReveal .6s cubic-bezier(.4,0,.2,1);
    }
    @keyframes themeReveal{
      from{clip-path:circle(0px at var(--tx,50%) var(--ty,50%))}
      to  {clip-path:circle(var(--tr,150vmax) at var(--tx,50%) var(--ty,50%))}
    }
  }

  /* ============================================================
     字体面板
     ============================================================ */
  #fontMenu{
    position:fixed;
    right:calc(80px + var(--safe-right));
    bottom:calc(148px + var(--safe-bottom));
    z-index:60;
    min-width:180px;
    max-width:min(260px, calc(100vw - 100px));
    max-height:min(60vh, 480px);
    overflow-y:auto;
    padding:8px;
    border-radius:14px;
    background:var(--mat-bg-strong);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    backdrop-filter:blur(24px) saturate(180%);
    border:1px solid var(--mat-hairline);
    box-shadow:
      0 0 0 1px var(--mat-hairline),
      inset 0 1px 0 var(--mat-edge),
      0 20px 40px -16px var(--mat-drop);
    visibility:hidden;opacity:0;
    transform:translateY(6px) scale(.96);
    transform-origin:bottom right;
    transition:opacity .22s, visibility .22s, transform .28s cubic-bezier(.34,1.5,.64,1);
    scrollbar-width:thin;
  }
  #fontMenu.show{visibility:visible;opacity:1;transform:translateY(0) scale(1)}

  .font-item{
    display:flex;align-items:center;gap:10px;
    width:100%;
    padding:9px 12px;
    border:none;background:transparent;
    border-radius:8px;
    color:var(--panel-fg);
    font-size:.85rem;
    cursor:pointer;
    text-align:left;
    font-family:inherit;
    transition:background-color .12s, transform .12s;
  }
  .font-item:hover{background:var(--on-mat-fill-hover);transform:translateX(2px)}
  .font-item.active{background:var(--on-mat-fill-hover);font-weight:700}
  .font-item .fi-dot{
    width:6px;height:6px;border-radius:50%;
    background:currentColor;opacity:.3;flex-shrink:0;
    transition:opacity .12s, background .12s, transform .12s;
  }
  .font-item.active .fi-dot{opacity:1;background:var(--accent);transform:scale(1.4)}
  .font-item .fi-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* ★ 新增：字体名用自身字体渲染，加个平滑过渡 */
  .font-item .fi-name{ transition: font-family .15s; }
  .font-item .fi-sample{font-size:.72rem;opacity:.55;margin-left:auto;white-space:nowrap}

  /* ============================================================
     导航弹窗
     ============================================================ */
  #navModal{
    position:fixed;inset:0;z-index:100;
    background:var(--mask);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    display:flex;visibility:hidden;opacity:0;
    align-items:center;justify-content:center;
    padding:calc(16px + var(--safe-top)) calc(16px + var(--safe-right)) calc(16px + var(--safe-bottom)) calc(16px + var(--safe-left));
    transition:opacity .28s, visibility .28s;
  }
  #navModal.show{visibility:visible;opacity:1}
  .nav-panel{
    width:100%;max-width:var(--nav-panel-max);max-height:88vh;
    border-radius:24px;display:flex;flex-direction:column;overflow:hidden;
    transform:scale(.9) translateY(12px);
    transition:transform .38s cubic-bezier(.34,1.56,.64,1), background-color .25s;
    background:var(--mat-bg-strong);
    -webkit-backdrop-filter:blur(28px) saturate(180%);
    backdrop-filter:blur(28px) saturate(180%);
    border:1px solid var(--mat-hairline);
    box-shadow:
      0 0 0 1px var(--mat-hairline),
      inset 0 1px 0 var(--mat-edge),
      0 30px 60px -20px var(--mat-drop);
    will-change:transform;
  }
  #navModal.show .nav-panel{transform:scale(1) translateY(0)}

  .nav-head{
    padding:20px 22px 14px;
    border-bottom:1px solid var(--mat-hairline);
    flex-shrink:0;transition:border-color .25s;
  }
  .nav-head-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .nav-head-row h2{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;color:var(--panel-fg)}
  .nav-head-row .cnt{
    font-size:.72rem;font-weight:600;
    background:var(--accent-bg);color:var(--accent);
    padding:3px 10px;border-radius:20px;
    transition:background-color .25s, color .25s;
  }
  .nav-close{
    margin-left:auto;width:34px;height:34px;border-radius:50%;
    background:var(--close-bg);border:none;color:var(--close-fg);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:.15s;font-family:inherit;flex-shrink:0;
  }
  .nav-close:hover{background:var(--close-hover-bg);color:var(--panel-fg);transform:rotate(90deg)}

  .nav-search{position:relative}
  .nav-search input{
    width:100%;padding:11px 14px 11px 38px;
    border:1.5px solid var(--input-border);border-radius:12px;
    background:var(--input-bg);font-size:.88rem;color:var(--panel-fg);
    outline:none;transition:.15s;font-family:inherit;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  .nav-search input:focus{
    border-color:var(--accent);background:var(--on-mat-fill);
    box-shadow:0 0 0 3px var(--accent-ring);
  }
  .nav-search input::placeholder{color:var(--icon)}
  .nav-search .ico{
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    color:var(--icon);
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }

  .nav-filters{
    display:flex;gap:8px;overflow-x:auto;
    padding:12px 22px;scrollbar-width:none;flex-shrink:0;
    border-bottom:1px solid var(--mat-hairline);transition:border-color .25s;
    -webkit-overflow-scrolling:touch;
  }
  .nav-filters::-webkit-scrollbar{display:none}
  .nf-btn{
    flex-shrink:0;padding:7px 14px;border-radius:40px;
    border:1.5px solid var(--on-mat-line);background:transparent;
    font-size:.78rem;font-weight:600;color:var(--chip-fg);
    cursor:pointer;transition:.2s;
    display:inline-flex;align-items:center;gap:5px;
    font-family:inherit;white-space:nowrap;
  }
  @media (hover:hover){
    .nf-btn:hover{border-color:var(--on-mat-line-hover);transform:translateY(-1px)}
  }
  .nf-btn.active{
    background:var(--nf-active-bg);
    border-color:var(--nf-active-bg);
    color:var(--nf-active-fg);
  }

  .nav-body{
    overflow-y:auto;padding:18px 22px 24px;
    -webkit-overflow-scrolling:touch;flex:1;scrollbar-width:none;
  }
  .nav-body::-webkit-scrollbar{display:none}
  .nav-group{margin-bottom:22px}
  .nav-group:last-child{margin-bottom:0}
  .ng-title{
    display:flex;align-items:center;gap:8px;
    font-size:.82rem;font-weight:700;color:var(--panel-fg);
    margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em;
  }
  .ng-title .n{
    font-size:.68rem;font-weight:600;color:var(--icon);
    margin-left:auto;letter-spacing:0;
  }
  .nav-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(var(--nav-grid-min),1fr));
    gap:8px;
  }
  .nav-item{
    display:flex;align-items:center;gap:10px;
    background:var(--on-mat-fill);border-radius:12px;
    padding:10px 12px;text-decoration:none;color:inherit;
    border:1px solid var(--on-mat-line);
    transition:background-color .18s, border-color .18s, transform .22s cubic-bezier(.2,.7,.3,1);
    min-width:0;
    will-change:transform;
  }
  @media (hover:hover){
    .nav-item:hover{
      background:var(--on-mat-fill-hover);
      border-color:var(--on-mat-line-hover);
      transform:translateY(-2px);
    }
  }
  .nav-item:active{
    background:var(--on-mat-fill-hover);
    border-color:var(--on-mat-line-hover);
  }
  .nav-item .ni-icon{
    width:32px;height:32px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-size:.92rem;font-weight:700;flex-shrink:0;
    background:var(--on-mat-fill);border:1px solid var(--on-mat-line);
    color:var(--panel-fg);
    transition:background-color .25s, border-color .25s;
    font-family:inherit;
    letter-spacing:0;
  }
  .nav-item .ni-body{min-width:0;flex:1}
  .nav-item .ni-name{
    font-size:.82rem;font-weight:600;color:var(--panel-fg);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;
  }
  .nav-item .ni-desc{
    font-size:.68rem;color:var(--icon);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    line-height:1.3;margin-top:1px;
  }
  .nav-empty{text-align:center;padding:40px 20px;color:var(--icon);font-size:.88rem}

  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
    :root{
      --mat-bg:rgba(250,250,251,.96);--mat-bg-strong:rgba(250,250,251,.98);
      --on-mat-fill:rgba(0,0,0,.035);--on-mat-line:rgba(0,0,0,.07);--input-bg:rgba(0,0,0,.03);
    }
    :root[data-theme="dark"]{
      --mat-bg:rgba(22,27,34,.96);--mat-bg-strong:rgba(22,27,34,.98);
      --on-mat-fill:rgba(255,255,255,.06);--on-mat-line:rgba(255,255,255,.10);--input-bg:rgba(255,255,255,.06);
    }
  }

  /* ============================================================
     目录清单
     ============================================================ */
  .dir-reader{
    margin:0;border-radius:4px;background:transparent;
    border:1.5px solid var(--fg);overflow:hidden;
    color:var(--fg);transition:border-color .25s, color .25s;
  }
  .dir-header{padding:14px 16px 12px;border-bottom:1.5px solid var(--fg);transition:border-color .25s}
  .dir-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .dir-title{font-size:1rem;font-weight:700;color:var(--fg);margin:0;letter-spacing:.02em}

  .dir-btn{
    width:30px;height:30px;border-radius:4px;
    border:1.5px solid var(--fg);
    background:transparent;color:var(--fg);
    font-size:.85rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .15s, color .15s, transform .15s;
    font-family:inherit;
  }
  .dir-btn:hover{border-color:var(--accent);color:var(--accent)}
  .dir-btn:active{transform:scale(.9)}

  .dir-toolbar{
    display:flex;flex-wrap:wrap;align-items:center;gap:8px;
    padding:12px 16px;border-bottom:1.5px dashed var(--fg-muted);
    transition:border-color .25s;
  }
  .dir-search{position:relative;flex:1;min-width:130px}
  .dir-search-icon{
    position:absolute;left:10px;top:50%;transform:translateY(-50%);
    color:var(--fg-muted);pointer-events:none;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .dir-search-input{
    width:100%;padding:8px 12px 8px 32px;
    border:1.5px solid var(--fg);border-radius:4px;
    background:transparent;font-size:.8rem;color:var(--fg);
    outline:none;transition:border-color .15s, box-shadow .15s;
    font-family:inherit;
  }
  .dir-search-input::placeholder{color:var(--fg-muted)}
  .dir-search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}

  .dir-filters{display:flex;gap:5px;flex-shrink:0}
  .dir-filter-btn{
    padding:5px 10px;border-radius:4px;
    border:1.5px solid var(--fg);background:transparent;
    font-size:.72rem;font-weight:600;color:var(--fg);
    cursor:pointer;
    transition:border-color .15s, color .15s, background-color .15s, transform .15s;
    display:inline-flex;align-items:center;gap:4px;
    font-family:inherit;white-space:nowrap;
  }
  .dir-filter-btn:hover{color:var(--accent);border-color:var(--accent)}
  .dir-filter-btn.active{background:var(--fg);color:var(--bg);border-color:var(--fg)}

  .dir-status{
    padding:8px 16px;font-size:.7rem;color:var(--fg-muted);
    border-bottom:1.5px dashed var(--fg-muted);
    transition:border-color .25s, color .25s;
    font-variant-numeric:tabular-nums;
  }
  .dir-list{max-height:min(460px, 52vh);overflow-y:auto;overscroll-behavior:contain}
  .dir-list::-webkit-scrollbar{width:6px}
  .dir-list::-webkit-scrollbar-thumb{background:var(--fg-muted);border-radius:3px}

  .dir-item{
    display:flex;align-items:center;gap:8px;
    padding:7px 16px;font-size:.84rem;
    color:var(--fg);text-decoration:none;
    background:transparent;cursor:pointer;
    transition:color .15s, background-color .15s, transform .15s;
    min-width:0;position:relative;
  }
  .dir-item:hover{color:var(--accent)}
  .dir-item:focus-visible{outline:1.5px dashed var(--accent);outline-offset:-3px}

  .dir-item .dir-tree{
    flex-shrink:0;color:var(--fg-muted);font-size:.8rem;
    line-height:1;user-select:none;
    font-family:"SF Mono","Menlo","Consolas",monospace;
    white-space:pre;transition:color .15s;
  }
  .dir-toggle{
    width:10px;height:10px;flex-shrink:0;
    position:relative;color:var(--fg);
    transition:transform .15s, color .15s;
  }
  .dir-toggle::before{
    content:"";position:absolute;left:1px;top:50%;
    width:0;height:0;border-style:solid;
    border-width:4px 0 4px 6px;
    border-color:transparent transparent transparent currentColor;
    transform:translateY(-50%);
    transition:transform .22s cubic-bezier(.34,1.5,.64,1);
  }
  .dir-item-folder[aria-expanded="true"] .dir-toggle::before{
    transform:translateY(-50%) rotate(90deg);
    transform-origin:25% 50%;
  }
  .dir-item-file .dir-toggle{visibility:hidden}

  .dir-item-icon{
    width:20px;height:20px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:var(--fg);transition:color .15s, transform .32s cubic-bezier(.34,1.5,.64,1);
  }
  .dir-item-folder:active .dir-item-icon{
    transform:scale(.78) rotate(-8deg);
    transition:transform .08s ease-out;
  }
  .dir-item-icon svg{width:100%;height:100%;display:block;fill:currentColor}
  .dir-item:hover .dir-item-icon,
  .dir-item:hover .dir-tree{color:var(--accent)}
  @media (hover:hover){
    .dir-item:hover .dir-item-icon{transform:scale(1.12)}
  }

  .dir-item-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .dir-item-name{
    font-weight:600;color:inherit;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;
  }
  .dir-item-meta{
    font-size:.66rem;color:var(--fg-muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    line-height:1.3;display:flex;gap:8px;
    transition:color .15s;
  }
  .dir-item-size{color:var(--fg-faint)}
  .dir-item-type{color:var(--fg-faint)}
  .dir-item-actions{display:flex;gap:4px;flex-shrink:0;opacity:0;transition:opacity .15s}
  .dir-item-file:hover .dir-item-actions{opacity:1}
  @media (hover:none){.dir-item-actions{opacity:1}}
  .dir-item-action{
    width:24px;height:24px;border-radius:4px;
    border:1.5px solid var(--fg);background:transparent;
    color:var(--fg);font-size:.7rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .15s, color .15s, transform .15s;
    font-family:inherit;text-decoration:none;
  }
  .dir-item-action:hover{border-color:var(--accent);color:var(--accent);transform:scale(1.1)}

  .dir-item-enter{animation:dirItemIn .28s cubic-bezier(.2,.7,.3,1) both}
  @keyframes dirItemIn{
    from{opacity:0;transform:translateY(-6px)}
    to  {opacity:1;transform:translateY(0)}
  }

  .dir-empty{text-align:center;padding:36px 20px;color:var(--fg-muted);font-size:.82rem}
  .dir-empty-hint{font-size:.68rem;color:var(--fg-faint);margin-top:5px}

  /* ============================================================
     ★ 响应式断点
     ============================================================ */

  /* ---- 小手机 (< 480px) ---- */
  @media (max-width:479px){
    :root{
      --content-max:100%;
      --content-pad:18px;
      --particle-space:170px;
      --nav-panel-max:100%;
      --nav-grid-min:0px;          /* 由 grid-template-columns 直接指定两列 */
      --avatar-size:60px;
      --clock-size:1.55rem;
      --title-size:1.25rem;
      --dir-indent-step:1.1ch;
      --fab-size:52px;
      --fab-mini-size:42px;
    }
    .nowbar{padding:11px 14px;gap:10px;border-radius:18px}
    .now-w-desc{max-width:110px}
    .now-greet{font-size:.66rem}
    .now-w-temp{font-size:.92rem}
    .header{padding:12px 14px;gap:14px;border-radius:18px;margin-bottom:22px}
    .info .sub{font-size:.82rem}
    .link .value{font-size:.72rem}
    .nav-head{padding:16px 16px 12px}
    .nav-head-row h2{font-size:1.05rem}
    .nav-filters{padding:10px 16px}
    .nav-body{padding:14px 16px 20px}
    .nav-grid{grid-template-columns:1fr 1fr;gap:6px}

<script>
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
/* ★ 新增：全局触摸检测，多处复用 */
const isTouchDevice = window.matchMedia && window.matchMedia('(hover: none)').matches;
document.getElementById('year').textContent = new Date().getFullYear();

window.Util = {
  escapeHtml(str){
    return String(str).replace(/[&<>"']/g, m => (
      {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]
    ));
  }
};

window.Boot = {
  el:null, ring:null, pct:null, sr:null,
  value:15, target:15, raf:0, finished:false,
  init(){
    this.el = document.getElementById('boot');
    if (!this.el) return;
    this.ring = this.el.querySelector('.ring-fg');
    this.pct  = this.el.querySelector('.boot-pct');
    this.sr   = document.getElementById('bootSr');
    this.render();
  },
  set(v){
    if (this.finished) return;
    this.target = Math.max(this.target, v);
    this.tick();
  },
  tick(){
    if (this.raf) return;
    const step = () => {
      this.raf = 0;
      const d = this.target - this.value;
      if (Math.abs(d) < 0.4){
        this.value = this.target;
        this.render();
        if (this.value >= 100 && !this.finished) this.finish();
        return;
      }
      this.value += d * 0.14;
      this.render();
      this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  },
  render(){
    const v = Math.round(this.value);
    if (this.pct) this.pct.textContent = v + '%';
    if (this.ring) this.ring.style.strokeDashoffset = 100 - v;
    if (this.el) this.el.setAttribute('aria-valuenow', v);
  },
  finish(){
    this.finished = true;
    if (this.sr) this.sr.textContent = '页面加载完成';
    setTimeout(() => {
      if (!this.el) return;
      this.el.classList.add('gone');
      setTimeout(() => {
        if (this.el && this.el.parentNode) this.el.parentNode.removeChild(this.el);
        this.el = null;
      }, 420);
    }, 260);
  }
};
Boot.init();

window.InputBus = {
  x:0, y:0, inside:false, enabled:true, lastMoveTime:0,
  moveHandlers:[], endHandlers:[],
  onMove(fn){this.moveHandlers.push(fn);},
  onEnd(fn){this.endHandlers.push(fn);},
  _move(x,y){
    if (!this.enabled) return;
    this.x=x; this.y=y; this.inside=true;
    this.lastMoveTime=performance.now();
    for (let i=0;i<this.moveHandlers.length;i++){
      try{this.moveHandlers[i](x,y);}catch(e){console.error(e);}
    }
  },
  _end(){
    this.inside=false;
    for (let i=0;i<this.endHandlers.length;i++){
      try{this.endHandlers[i]();}catch(e){console.error(e);}
    }
  }
};

(function(){
  let lastTs = 0;
  function move(x,y){
    const now = performance.now();
    if (now - lastTs < 8) return;
    lastTs = now;
    InputBus._move(x,y);
  }
  if (window.PointerEvent){
    window.addEventListener('pointermove', e=>move(e.clientX,e.clientY),{passive:true});
    window.addEventListener('pointerdown', e=>move(e.clientX,e.clientY),{passive:true});
    window.addEventListener('pointerup', ()=>InputBus._end(),{passive:true});
    window.addEventListener('pointercancel',()=>InputBus._end(),{passive:true});
  } else {
    window.addEventListener('mousemove', e=>move(e.clientX,e.clientY),{passive:true});
    window.addEventListener('touchmove', e=>{ if(e.touches&&e.touches[0]) move(e.touches[0].clientX,e.touches[0].clientY); },{passive:true});
    window.addEventListener('touchstart', e=>{ if(e.touches&&e.touches[0]) move(e.touches[0].clientX,e.touches[0].clientY); },{passive:true});
    window.addEventListener('touchend', ()=>InputBus._end(),{passive:true});
    window.addEventListener('touchcancel',()=>InputBus._end(),{passive:true});
  }
  window.addEventListener('mouseleave',()=>InputBus._end(),{passive:true});
})();

window.dispatchNavToggle = function(open){
  document.dispatchEvent(new CustomEvent('navtoggle',{detail:{open:!!open}}));
};

window.addEventListener('DOMContentLoaded', () => Boot.set(45));
setTimeout(() => Boot.set(100), 3000);

document.getElementById('themeFab').addEventListener('click', () => Theme.toggle());
</script>

<script>
(function(){
  'use strict';
  const FONT_KEY = 'site.font.v1';
  const VALID = ['song','zcool','fz','cubic','cormorant','mw','fzZhun','fzCu','dinBold','dinMed','system'];
  const DEFAULT = 'song';

  /* ★ 新增：字体 key → font-family 栈映射，用于菜单实时预览 */
  const FONT_STACKS = {
    song:      '"SongPUA", "Songti SC", "SimSun", serif',
    zcool:     '"ZCOOLQingKe", "SongPUA", serif',
    fz:        '"FZCuYuan", "SongPUA", serif',
    cubic:     '"Cubic11", "SongPUA", monospace',
    cormorant: '"CormorantItalic", "SongPUA", serif',
    mw:        '"MWBold", "SongPUA", serif',
    fzZhun:    '"FZLanZhun", "SongPUA", serif',
    fzCu:      '"FZLanCu", "SongPUA", serif',
    dinBold:   '"DINRoundedBold", "SongPUA", serif',
    dinMed:    '"DINRoundedMedium", "SongPUA", serif',
    system:    '-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif',
  };
  function fontStackOf(k){ return FONT_STACKS[k] || FONT_STACKS.song; }

  const fab = document.getElementById('fontFab');
  const menu = document.getElementById('fontMenu');
  const items = Array.from(menu.querySelectorAll('.font-item'));

  /* ★ 修改：字体名用对应字体渲染，实时预览 */
  function applyFont(key){
    if (!VALID.includes(key)) key = DEFAULT;
    document.documentElement.dataset.fontKey = key;
    try { localStorage.setItem(FONT_KEY, key); } catch(e){}
    items.forEach(b => {
      const on = b.dataset.font === key;
      b.classList.toggle('active', on);
      const nameEl = b.querySelector('.fi-name');
      if (nameEl) nameEl.style.fontFamily = fontStackOf(b.dataset.font);
    });
    window.dispatchEvent(new CustomEvent('fontchange', { detail:{ key } }));
  }

  let saved = DEFAULT;
  try { saved = localStorage.getItem(FONT_KEY) || DEFAULT; } catch(e){}
  applyFont(saved);

  function openMenu(){
    menu.classList.add('show');
    fab.setAttribute('aria-expanded','true');
    const active = menu.querySelector('.font-item.active') || items[0];
    if (active) active.focus();
  }
  function closeMenu(returnFocus){
    if (!menu.classList.contains('show')) return;
    menu.classList.remove('show');
    fab.setAttribute('aria-expanded','false');
    if (returnFocus) fab.focus();
  }

  fab.addEventListener('click', e => {
    e.stopPropagation();
    if (menu.classList.contains('show')) closeMenu(false);
    else openMenu();
  });

  menu.addEventListener('click', e => {
    const btn = e.target.closest('.font-item');
    if (!btn) return;
    applyFont(btn.dataset.font);
    closeMenu(true);
  });

  menu.addEventListener('keydown', e => {
    const idx = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown'){ e.preventDefault(); items[(idx+1)%items.length].focus(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); items[(idx-1+items.length)%items.length].focus(); }
    else if (e.key === 'Home'){ e.preventDefault(); items[0].focus(); }
    else if (e.key === 'End'){ e.preventDefault(); items[items.length-1].focus(); }
    else if (e.key === 'Escape'){ e.preventDefault(); closeMenu(true); }
  });

  document.addEventListener('click', e => {
    if (!menu.classList.contains('show')) return;
    if (menu.contains(e.target) || fab.contains(e.target)) return;
    closeMenu(false);
  });
  window.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(false); });
})();
</script>

<!-- ==================== 时间 + 问候 ==================== -->
<script>
(function(){
  'use strict';

  const hmEl   = document.getElementById('nowHm');
  const secEl  = document.getElementById('nowSec');
  const dateEl = document.getElementById('nowDate');
  const greetEl= document.getElementById('nowGreet');
  const wIcon  = document.getElementById('nowWIcon');
  const wTemp  = document.getElementById('nowWTemp');
  const wDesc  = document.getElementById('nowWDesc');

  const WEEK = ['日','一','二','三','四','五','六'];
  const pad = n => n < 10 ? '0' + n : '' + n;

  function greetOf(h){
    if (h < 5)  return '夜深了';
    if (h < 9)  return '早安';
    if (h < 12) return '上午好';
    if (h < 14) return '午安';
    if (h < 18) return '下午好';
    if (h < 22) return '晚上好';
    return '晚安';
  }
  function seasonOf(m){
    if (m === 2 || m === 3 || m === 4) return 'spring';
    if (m === 5 || m === 6 || m === 7) return 'summer';
    if (m === 8 || m === 9 || m === 10) return 'autumn';
    return 'winter';
  }
  const SEASON = {
    spring: { label:'春', descs:['万物生长','微风和煦','春意渐浓'] },
    summer: { label:'夏', descs:['盛夏光年','蝉鸣阵阵','热浪滚滚'] },
    autumn: { label:'秋', descs:['秋高气爽','落叶纷飞','天高云淡'] },
    winter: { label:'冬', descs:['天寒地冻','朔风凛冽','围炉取暖'] }
  };
  function timeSlot(h){
    if (h < 5)  return { key:'dawn',   label:'凌晨' };
    if (h < 8)  return { key:'morning',label:'清晨' };
    if (h < 11) return { key:'am',     label:'上午' };
    if (h < 13) return { key:'noon',   label:'中午' };
    if (h < 17) return { key:'pm',     label:'下午' };
    if (h < 19) return { key:'dusk',   label:'傍晚' };
    if (h < 23) return { key:'night',  label:'夜晚' };
    return { key:'late',               label:'深夜' };
  }
  function seedRand(seed){
    let x = seed % 2147483647;
    if (x <= 0) x += 2147483646;
    return function(){ x = (x*16807)%2147483647; return (x-1)/2147483646; };
  }

  let lastGreet = '';
  let lastAmbienceKey = '';

  function tickAll(){
    const d = new Date();
    hmEl.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    secEl.textContent = pad(d.getSeconds());
    dateEl.textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 周${WEEK[d.getDay()]}`;

    const g = greetOf(d.getHours());
    if (g !== lastGreet){ greetEl.textContent = g; lastGreet = g; }

    const s = seasonOf(d.getMonth());
    const slot = timeSlot(d.getHours());
    const ambienceKey = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}-${slot.key}`;
    if (ambienceKey !== lastAmbienceKey){
      lastAmbienceKey = ambienceKey;
      const rand = seedRand(d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate());
      const info = SEASON[s];
      const desc = info.descs[Math.floor(rand()*info.descs.length)];
      wIcon.textContent = '·';
      wIcon.title = info.label + '·' + slot.label;
      wTemp.textContent = info.label + ' · ' + slot.label;
      wDesc.textContent = desc;
    }
  }

  tickAll();
  setInterval(() => {
    secEl.textContent = pad(new Date().getSeconds());
  }, 1000);
  setTimeout(function loop(){
    tickAll();
    setTimeout(loop, 60000 - (Date.now() % 60000));
  }, 60000 - (Date.now() % 60000));

  document.addEventListener('visibilitychange', () => { if (!document.hidden) tickAll(); });
})();
</script>

<script>
(function(){
  'use strict';

  /* ---------- 进入视野揭示 ---------- */
  const contentEl = document.querySelector('.content');
  const revealEls = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window && contentEl){
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (en.isIntersecting){
          en.target.classList.add('in');
          io.unobserve(en.target);
        }
      });
    }, { root: contentEl, rootMargin: '-6% 0px -6% 0px', threshold: 0 });
    revealEls.forEach(el => io.observe(el));
  } else {
    revealEls.forEach(el => el.classList.add('in'));
  }

  /* ---------- 光标光晕 ---------- */
  const glow = document.getElementById('cursorGlow');
  if (glow && !reduceMotion && window.matchMedia('(hover: hover)').matches){
    let gx = 0, gy = 0, cx = 0, cy = 0, raf = 0;
    const step = () => {
      raf = 0;
      cx += (gx - cx) * 0.22;
      cy += (gy - cy) * 0.22;
      glow.style.transform = `translate3d(${cx}px, ${cy}px, 0)`;
      if (Math.abs(gx - cx) > 0.5 || Math.abs(gy - cy) > 0.5){
        raf = requestAnimationFrame(step);
      }
    };
    InputBus.onMove((x, y) => {
      gx = x; gy = y;
      if (!glow.classList.contains('on')) glow.classList.add('on');
      if (!raf) raf = requestAnimationFrame(step);
    });
    document.addEventListener('mouseleave', () => glow.classList.remove('on'));
    window.addEventListener('mouseout', e => {
      if (!e.relatedTarget) glow.classList.remove('on');
    });
  }

  /* ---------- 涟漪 ---------- */
  function attachRipple(el, host){
    if (!el) return;
    const target = host || el;
    el.addEventListener('pointerdown', e => {
      if (reduceMotion) return;
      const r = el.getBoundingClientRect();
      const size = Math.max(r.width, r.height) * 1.6;
      const span = document.createElement('span');
      span.className = 'ripple';
      span.style.left = (e.clientX - r.left - size/2) + 'px';
      span.style.top  = (e.clientY - r.top  - size/2) + 'px';
      span.style.width = size + 'px';
      span.style.height = size + 'px';
      if (getComputedStyle(target).position === 'static') target.style.position = 'relative';
      target.appendChild(span);
      setTimeout(() => span.remove(), 700);
    }, {passive:true});
  }
  attachRipple(document.getElementById('navFab'), document.querySelector('#navFab .fab-rip'));
  attachRipple(document.getElementById('themeFab'));
  attachRipple(document.getElementById('fontFab'));
  document.querySelectorAll('.link').forEach(el => attachRipple(el));

  /* ---------- 内容下拉回弹 ---------- */
  (function(){
    const el = document.querySelector('.content');
    if (!el || reduceMotion) return;
    if (!('ontouchstart' in window)) return;

    const MAX_PULL = 88;
    const FACTOR = 0.42;
    let startY = 0;
    let pulling = false;

    function endPull(){
      if (!pulling) return;
      pulling = false;
      el.classList.remove('pulling');
      el.style.transform = '';
    }

    el.addEventListener('touchstart', e => {
      if (el.scrollTop > 0) return;
      startY = e.touches[0].clientY;
      pulling = false;
    }, {passive:true});

    el.addEventListener('touchmove', e => {
      if (!e.touches[0]) return;
      const delta = e.touches[0].clientY - startY;
      if (delta > 0 && el.scrollTop <= 0){
        if (!pulling){ pulling = true; el.classList.add('pulling'); }
        const damped = Math.min(MAX_PULL, delta * FACTOR);
        el.style.transform = `translate3d(0, ${damped}px, 0)`;
      } else if (pulling){
        endPull();
      }
    }, {passive:true});

    el.addEventListener('touchend', endPull, {passive:true});
    el.addEventListener('touchcancel', endPull, {passive:true});
  })();

  /* ---------- 头像点击抖动 ---------- */
  (function(){
    const avatarEl = document.getElementById('avatarTilt');
    if (!avatarEl || reduceMotion) return;
    avatarEl.style.cursor = 'pointer';
    avatarEl.addEventListener('click', () => {
      avatarEl.classList.remove('pop');
      void avatarEl.offsetWidth;
      avatarEl.classList.add('pop');
      setTimeout(() => avatarEl.classList.remove('pop'), 660);
    });
  })();

  /* ---------- 头像 3D 倾斜 ---------- */
  (function(){
    const avatarEl = document.getElementById('avatarTilt');
    if (!avatarEl || reduceMotion) return;

    let aRaf = 0, tx = 0, ty = 0, curX = 0, curY = 0;

    function updateTilt(clientX, clientY){
      const r = avatarEl.getBoundingClientRect();
      tx = ((clientX - r.left) / r.width  - 0.5) * 18;
      ty = ((clientY - r.top ) / r.height - 0.5) * 18;
      if (!aRaf){
        aRaf = requestAnimationFrame(function upd(){
          aRaf = 0;
          curX += (tx - curX) * 0.2;
          curY += (ty - curY) * 0.2;
          avatarEl.style.transform =
            `perspective(420px) rotateY(${curX}deg) rotateX(${-curY}deg) scale(1.05)`;
          if (Math.abs(tx-curX) > 0.1 || Math.abs(ty-curY) > 0.1) aRaf = requestAnimationFrame(upd);
        });
      }
    }
    function resetTilt(){
      tx = 0; ty = 0;
      if (!aRaf) aRaf = requestAnimationFrame(function back(){
        aRaf = 0;
        curX *= 0.85; curY *= 0.85;
        if (Math.abs(curX) > 0.1 || Math.abs(curY) > 0.1){
          avatarEl.style.transform =
            `perspective(420px) rotateY(${curX}deg) rotateX(${-curY}deg)`;
          aRaf = requestAnimationFrame(back);
        } else {
          avatarEl.style.transform = '';
        }
      });
    }

    if (window.matchMedia('(hover: hover)').matches){
      avatarEl.addEventListener('mousemove', e => updateTilt(e.clientX, e.clientY));
      avatarEl.addEventListener('mouseleave', resetTilt);
    }
    avatarEl.addEventListener('touchstart', e => {
      if (e.touches[0]) updateTilt(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive:true});
    avatarEl.addEventListener('touchmove', e => {
      if (e.touches[0]) updateTilt(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive:true});
    avatarEl.addEventListener('touchend', resetTilt, {passive:true});
    avatarEl.addEventListener('touchcancel', resetTilt, {passive:true});
  })();

  /* ---------- Toast + 通用复制 ---------- */
  const toastEl = document.getElementById('toast');
  let toastTimer = 0;
  window.showToast = function(msg, ms){
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || 1900);
  };

  /* ★ 新增：通用复制工具（含 execCommand 降级） */
  function copyText(text, okMsg){
    const ok = () => window.showToast(okMsg || '已复制');
    const fail = () => window.showToast('复制失败');
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(ok).catch(() => {
        // 降级
        fallbackCopy(text) ? ok() : fail();
      });
    } else {
      fallbackCopy(text) ? ok() : fail();
    }
  }
  function fallbackCopy(text){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch(e){ ok = false; }
    ta.remove();
    return ok;
  }
  window.copyText = copyText;

  /* ★ 修改：所有 .link 通用复制
     - 有 data-copy 的：单击直接复制（拦默认跳转）
     - 移动端：长按 600ms 复制链接（拦后续 click）
     - 桌面端：双击 260ms 内复制链接（拦第二次 click 的跳转）
  */
  document.querySelectorAll('a.link').forEach(a => {
    /* --- 有 data-copy 的优先 --- */
    if (a.dataset.copy){
      a.addEventListener('click', e => {
        e.preventDefault();
        copyText(a.dataset.copy, '已复制：' + a.dataset.copy);
      });
      return;
    }

    /* --- 长按复制（移动端自然） --- */
    let pressTimer = 0;
    let longPressed = false;
    const startPress = () => {
      longPressed = false;
      pressTimer = setTimeout(() => {
        pressTimer = 0;
        longPressed = true;
        a._justCopied = true;
        copyText(a.href, '已复制链接');
      }, 600);
    };
    const cancelPress = () => { if (pressTimer){ clearTimeout(pressTimer); pressTimer = 0; } };
    a.addEventListener('pointerdown', startPress);
    a.addEventListener('pointerup', cancelPress);
    a.addEventListener('pointerleave', cancelPress);
    a.addEventListener('pointercancel', cancelPress);

    /* --- 双击复制（桌面端自然） --- */
    let dblTimer = 0;
    a.addEventListener('click', e => {
      /* 长按后拦截跳转 */
      if (a._justCopied){ e.preventDefault(); a._justCopied = false; return; }
      /* 双击检测 */
      if (dblTimer){
        clearTimeout(dblTimer);
        dblTimer = 0;
        e.preventDefault();
        copyText(a.href, '已复制链接');
        return;
      }
      dblTimer = setTimeout(() => { dblTimer = 0; }, 260);
    });
  });
})();
</script>

<!-- ==================== 水波 ==================== -->
<script>
(function(){
  const canvas = document.getElementById('water-canvas');
  const ctx = canvas.getContext('2d');
  const CALM_TIMEOUT = 1500, CALM_THRESHOLD = 0.3;
  let SCALE = 2;
  let W=0,H=0,cols=0,rows=0,buf1,buf2,imgData,off,offCtx;
  let lastDrop=0, rafId=0;
  let hidden = false;
  let suspended = false;

  /* ★ 新增：触摸设备降低水波强度 */
  const isTouch = window.matchMedia && window.matchMedia('(hover: none)').matches;
  const DROP_STRENGTH = isTouch ? 2 : 3;

  function pickScale(){
    const px = window.innerWidth * window.innerHeight;
    if (px > 2_200_000) return 4;
    if (px > 1_500_000) return 3;
    return 2;
  }

  function init(){
    W = window.innerWidth; H = window.innerHeight;
    SCALE = pickScale();
    canvas.width = W; canvas.height = H;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    cols = Math.floor(W/SCALE); rows = Math.floor(H/SCALE);
    buf1 = new Float32Array(cols*rows);
    buf2 = new Float32Array(cols*rows);
    imgData = ctx.createImageData(cols, rows);
    if (!off) { off = document.createElement('canvas'); offCtx = off.getContext('2d'); }
    off.width = cols; off.height = rows;
    render();
  }

  function resetBuffers(){
    if (buf1) buf1.fill(0);
    if (buf2) buf2.fill(0);
  }

  function drop(x,y,strength){
    if (reduceMotion || hidden || suspended) return;
    const gx = Math.floor(x/SCALE), gy = Math.floor(y/SCALE);
    if (gx<1||gx>=cols-1||gy<1||gy>=rows-1) return;
    const radius = 3;
    for (let dy=-radius; dy<=radius; dy++){
      for (let dx=-radius; dx<=radius; dx++){
        const px=gx+dx, py=gy+dy;
        if (px<1||px>=cols-1||py<1||py>=rows-1) continue;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if (dist > radius) continue;
        const falloff = 1 - dist/radius;
        buf1[py*cols+px] -= strength*falloff;
      }
    }
    lastDrop = performance.now();
    ensureRunning();
  }

  function hasEnergy(){
    const len = buf1.length;
    const step = Math.max(1, Math.floor(len / 2000));
    for (let i=0; i<len; i+=step){
      if (Math.abs(buf1[i]) > CALM_THRESHOLD) return true;
    }
    return false;
  }

  function update(){
    for (let y=1; y<rows-1; y++){
      const row = y*cols;
      for (let x=1; x<cols-1; x++){
        const i = row+x;
        buf2[i] = (buf1[i-1]+buf1[i+1]+buf1[i-cols]+buf1[i+cols])/2 - buf2[i];
        buf2[i] *= 0.985;
      }
    }
    const t = buf1; buf1 = buf2; buf2 = t;
  }

  function render(){
    const data = imgData.data;
    const dark = window.Theme ? Theme.dark : false;
    const baseR = dark ? 13 : 250;
    const baseG = dark ? 17 : 250;
    const baseB = dark ? 23 : 250;
    const dir   = dark ? -1 : 1;
    const total = cols*rows;
    for (let i=0; i<total; i++){
      const h = buf1[i] * dir * 3;
      const idx = i*4;
      let r = baseR + h, g = baseG + h, b = baseB + h;
      data[idx]   = r < 0 ? 0 : r > 255 ? 255 : r;
      data[idx+1] = g < 0 ? 0 : g > 255 ? 255 : g;
      data[idx+2] = b < 0 ? 0 : b > 255 ? 255 : b;
      data[idx+3] = 255;
    }
    offCtx.putImageData(imgData, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.clearRect(0,0,W,H);
    ctx.drawImage(off, 0,0, cols,rows, 0,0, W,H);

    /* ★ 新增：把当前水波高度场暴露给粒子采样 */
    if (window.ParticleWater){
      window.ParticleWater.buf   = buf1;
      window.ParticleWater.cols  = cols;
      window.ParticleWater.rows  = rows;
      window.ParticleWater.scale = SCALE;
    }
  }

  function loop(){
    rafId = 0;
    if (hidden || suspended) return;
    const now = performance.now();
    if ((now - lastDrop) > CALM_TIMEOUT && !hasEnergy()) return;
    update(); render();
    rafId = requestAnimationFrame(loop);
  }

  function ensureRunning(){ if (!rafId && !hidden && !suspended) rafId = requestAnimationFrame(loop); }

  let lastDropX = -999, lastDropY = -999;
  InputBus.onMove((x,y) => {
    const dx = x - lastDropX, dy = y - lastDropY;
    if (dx*dx + dy*dy < 100) return;
    lastDropX = x; lastDropY = y;
    drop(x,y, DROP_STRENGTH);          /* ★ 使用触摸自适应强度 */
  });

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(init, 160);
  });
  window.addEventListener('orientationchange', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(init, 260);
  });

  document.addEventListener('visibilitychange', () => {
    hidden = document.hidden;
    if (hidden && rafId){ cancelAnimationFrame(rafId); rafId = 0; }
    else if (!hidden){ ensureRunning(); }
  });

  document.addEventListener('navtoggle', e => {
    suspended = !!e.detail.open;
    if (suspended){ if (rafId){ cancelAnimationFrame(rafId); rafId = 0; } }
    else { ensureRunning(); }
  });

  init();
  render();

  if (window.Theme){
    Theme.onChange(() => { resetBuffers(); render(); });
  }
})();
</script>
