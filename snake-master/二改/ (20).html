<!DOCTYPE html>
<html lang=zh-CN>
<head>
<meta charset=utf-8>
<title>URL 贪吃蛇！[作弊版]</title>
<meta name=viewport content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<style>
html, body { margin: 0; padding: 0; box-sizing: border-box; }
* { box-sizing: border-box; }
html {
  height: 100%;
  font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  background: #222;
  color: #eee;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
}
body {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 4px;
  padding-bottom: calc(4px + env(safe-area-inset-bottom));
  overflow: hidden;
}
a { color: #6fa0ff; }

#mobile-score {
  display: none;
  width: 100%;
  text-align: center;
  font-size: 0.95rem;
  font-weight: bold;
  color: #0bc3ff;
  flex: 0 0 auto;
}
:root.touch #mobile-score { display: block; }

#mobile-board {
  display: none;
  width: 100%;
  flex: 1 1 auto;
  min-height: 0;
  text-align: center;
  font-family: monospace;
  line-height: 1.0;
  background: #333;
  border-radius: 8px;
  padding: 4px 0;
  overflow: hidden;
  border: 2px solid #0bc3ff;
  transition: border-color .15s;
  display: flex;
  align-items: center;
  justify-content: center;
  white-space: pre;
}
#mobile-board.dead {
  border-color: #ff4d4d;
  background: #4d2222;
}
#mobile-board-inner {
  white-space: pre;
  font-family: monospace;
  text-align: center;
}
:root.touch #mobile-board { display: flex; }
:root.touch #url-container { display: none !important; }

#joystick {
  display: none;
  position: relative;
  width: min(34vw, 140px);
  height: min(34vw, 140px);
  margin: 2px auto;
  flex: 0 0 auto;
  touch-action: none;
}
:root.touch #joystick { display: block; }
#joystick .base {
  position: absolute; inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle, #fff2 0%, #fff1 70%, #fff0 100%);
  border: 2px solid #fff3;
}
#joystick .base::before, #joystick .base::after {
  content: ''; position: absolute; background: #fff2;
}
#joystick .base::before {
  left: 50%; top: 10%; bottom: 10%; width: 1px; transform: translateX(-50%);
}
#joystick .base::after {
  top: 50%; left: 10%; right: 10%; height: 1px; transform: translateY(-50%);
}
#joystick .knob {
  position: absolute; left: 50%; top: 50%;
  width: 44%; height: 44%; margin-left: -22%; margin-top: -22%;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #0bc3ff, #0788b3);
  box-shadow: 0 4px 14px #0bc3ff44, inset 0 -3px 8px #0004;
  transition: transform .08s ease-out;
  pointer-events: none;
}
#joystick.active .knob { transition: none; }
#joystick .hint {
  position: absolute; left: 50%; bottom: -1.2em;
  transform: translateX(-50%);
  font-size: 0.65rem; color: #888;
  white-space: nowrap; pointer-events: none;
}

.controls { display: none; }
#url, #max-score-grid {
  background: #fff2; padding: 2px; border-radius: 3px; font-family: monospace;
}
#share { display: inline-block; }
footer { margin-top: auto; font-size: 0.6rem; padding-top: 1px; flex: 0 0 auto; color: #888; }
.invisible { display: none !important; }
.hidden { visibility: hidden; }
:root.touch .no-touch-only,
:root:not(.touch) .touch-only { display: none; }

.expand-btn, .collapse-btn {
  background: none; border: none; padding: 0; font: inherit;
  font-weight: bold; cursor: pointer; width: 1rem;
}
.expand-btn, .expandable {
  transition: transform, opacity; transition-duration: .4s;
}
.expandable {
  display: inline-block; position: relative; height: 1.5rem;
  transform: translateX(-100%); padding-right: 10px;
}
.expand-btn {
  position: absolute; right: 0; top: 0;
  transform: translateX(100%); opacity: 1;
}
.help-toggle { color: #0bc3ff; }
.high-score-toggle { color: #ff8c0b; }
.collapse-btn { color: #aaa; }
.expandable.expanded { height: auto; transform: none; }
.expandable.expanded .expand-btn { opacity: 0; }
#share-note { padding-left: 0.5rem; }
#share-note.invisible {
  transition: opacity 0.4s ease-in-out, display 0s ease-out 0.4s;
  transition-behavior: allow-discrete;
  opacity: 0; display: none;
}

#toast {
  position: fixed; left: 50%; top: 30%;
  transform: translate(-50%, -50%) scale(0.9);
  background: #000c; color: #fff;
  padding: .7em 1.4em; border-radius: .6em;
  font-weight: bold; font-size: 1.1rem;
  opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 100; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

#cheat-toggle {
  position: fixed;
  top: 4px;
  right: 4px;
  z-index: 200;
  background: #ff8c0b;
  color: #000;
  border: none;
  border-radius: 50%;
  width: 32px;
  height: 32px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 2px 8px #0006;
}
#cheat-panel {
  position: fixed;
  top: 44px;
  right: 4px;
  z-index: 200;
  background: #111e;
  backdrop-filter: blur(8px);
  border: 1px solid #ff8c0b;
  border-radius: 8px;
  padding: 10px;
  display: none;
  flex-direction: column;
  gap: 10px;
  width: 230px;
  font-size: 0.85rem;
}
#cheat-panel.show { display: flex; }

.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #ccc;
}
.switch {
  position: relative;
  width: 42px;
  height: 24px;
  background: #555;
  border-radius: 12px;
  cursor: pointer;
  transition: background .2s;
  flex: 0 0 auto;
}
.switch::after {
  content: '';
  position: absolute;
  left: 2px;
  top: 2px;
  width: 20px;
  height: 20px;
  background: #fff;
  border-radius: 50%;
  transition: transform .2s;
}
.switch.on { background: #0bc3ff; }
.switch.on::after { transform: translateX(18px); }

.num-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #ccc;
  gap: 8px;
}
.num-row input {
  width: 76px;
  background: #333;
  color: #0bc3ff;
  border: 1px solid #555;
  border-radius: 4px;
  padding: 4px 6px;
  font-size: 0.9rem;
  font-family: monospace;
  text-align: right;
}
.num-row input:focus {
  outline: none;
  border-color: #ff8c0b;
}

.apply-btn {
  background: #ff8c0b;
  color: #000;
  border: none;
  border-radius: 6px;
  padding: 8px;
  font-weight: bold;
  font-size: 0.9rem;
  cursor: pointer;
}
.apply-btn:active { background: #cc7000; }
</style>
<script>
  if ('ontouchstart' in document.documentElement) {
    document.documentElement.classList.add('touch')
  }
</script>
</head>
<noscript>⚠ 抱歉，本游戏需要启用 JavaScript。</noscript>

<div id="cheat-panel">
  <div class="switch-row">

  </div>

  </div>

    <span>穿自己</span>

  </div>
  <div class="switch-row">
    <span>自动吃豆</span>

  </div>

  <div class="num-row">

    <input id="num-speed" type="number" min="0.1" max="20" step="0.1" value="1">

<div id="mobile-score">分数：0</div>
<div id="mobile-board"><div id="mobile-board-inner"></div></div>

<div id=url-container class=invisible>地址：<span id=url></span></div>
<div class=expandable>
  <button class="help-toggle expand-btn" aria-label="帮助" aria-expanded=false>?</button>
  <div class="expandable-content hidden">
    <span class=no-touch-only>使用方向键或 WASD 控制地址栏上的贪吃蛇。</span>

    <a id=reveal-url href=#>点此显示</a>页面地址<span id=url-escaping-note class=invisible>（地址显示可能异常：<span id=replacement-char-description></span>）</span>。&nbsp;<button class=collapse-btn aria-label="收起">〈</button>
  </div>
</div>

    你的最高分是 <span id=max-score-points></span>！
    <span id=max-score-grid></span><a id=share href=#><i class=icon-share>↗</i>分享</a>&nbsp;<button class=collapse-btn aria-label="收起">〈</button><span id=share-note class=invisible></span>
  </div>
</div>

<div id="joystick" class="touch-only">
  <div class="base"></div>
  <div class="knob"></div>

</div>

<div class="controls no-touch-only">
  <button id=up aria-label="上">▲&#xFE0E;</button>
  <button id=left aria-label="左">◀&#xFE0E;</button>
  <button id=down aria-label="下">▼&#xFE0E;</button>
  <button id=right aria-label="右">▶&#xFE0E;</button>
</div>
<div id=toast role=status aria-live=polite></div>
<footer>
  由 <a href=https://twitter.com/epidemian>@epidemian</a> 制作（⠠⠇） |
  <a href=https://github.com/epidemian/snake>源码</a>
</footer>
<script>
'use strict';

var GRID_WIDTH = 20;
var GRID_HEIGHT = 24;
var SNAKE_CELL = 1;
var FOOD_CELL = 2;
var UP = {x: 0, y: -1};
var DOWN = {x: 0, y: 1};
var LEFT = {x: -1, y: 0};
var RIGHT = {x: 1, y: 0};
var INITIAL_SNAKE_LENGTH = 4;
var INITIAL_SNAKE_Y = Math.floor(GRID_HEIGHT / 2);
var BRAILLE_SPACE = '\u2800';

var BRAILLE_COLS = GRID_WIDTH / 2;
var VISUAL_ROWS = GRID_HEIGHT / 4;

var cheats = {
  god: false,      // 不死（撞墙不卡、自动找路）
  wrap: false,     // 穿墙（左右上下循环）
  selfPass: false, // 穿自己（撞蛇身不死，直接穿过）
  ai: false,       // 自动吃豆
  speed: 1,
  targetScore: 0
};

var grid;
var snake;
var currentDirection;
var moveQueue;
var hasMoved;
var gamePaused = false;
var urlRevealed = false;
var whitespaceReplacementChar;
var gameOverCooldown = 0;
var hashFallbackInProgress = false;
var isTouchDevice = false;

var safeStorage = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
};

function main() {
  isTouchDevice = document.documentElement.classList.contains('touch');
  detectBrowserUrlWhitespaceEscaping();
  cleanUrl();
  setupEventHandlers();
  setupJoystick();
  setupCheatPanel();
  drawMaxScore();
  initUrlRevealed();
  startGame();

  var lastFrameTime = Date.now();
  window.requestAnimationFrame(function frameHandler() {
    var now = Date.now();
    if (!gamePaused && now - lastFrameTime >= tickTime()) {
      updateWorld();
      drawWorld();
      lastFrameTime = now;
    }
    window.requestAnimationFrame(frameHandler);
  });

  window.addEventListener('resize', fitBoardFont);
  setTimeout(fitBoardFont, 100);
}

function setupCheatPanel() {
  var toggle = document.getElementById('cheat-toggle');
  var panel = document.getElementById('cheat-panel');
  toggle.onclick = function () { panel.classList.toggle('show'); };

  ['god', 'wrap', 'selfPass', 'ai'].forEach(function (key) {
    var sw = document.getElementById('sw-' + key);
    sw.onclick = function () {
      cheats[key] = !cheats[key];
      sw.classList.toggle('on', cheats[key]);
      var names = { god: '不死', wrap: '穿墙', selfPass: '穿自己', ai: '自动吃豆' };
      showToast(names[key] + (cheats[key] ? ' ON' : ' OFF'));
    };
  });

  document.getElementById('apply-btn').onclick = function () {
    var speed = parseFloat(document.getElementById('num-speed').value) || 1;
    var targetScore = parseInt(document.getElementById('num-score').value) || 0;
    var newWidth = parseInt(document.getElementById('num-width').value) || 20;
    var newHeight = parseInt(document.getElementById('num-height').value) || 24;

    newWidth = Math.max(10, Math.min(60, newWidth));
    if (newWidth % 2 !== 0) newWidth++;
    newHeight = Math.max(8, Math.min(40, newHeight));
    newHeight = Math.round(newHeight / 4) * 4;

    cheats.speed = Math.max(0.1, Math.min(20, speed));

    if (newWidth !== GRID_WIDTH || newHeight !== GRID_HEIGHT) {
      GRID_WIDTH = newWidth;
      GRID_HEIGHT = newHeight;
      BRAILLE_COLS = GRID_WIDTH / 2;
      VISUAL_ROWS = GRID_HEIGHT / 4;
      INITIAL_SNAKE_Y = Math.floor(GRID_HEIGHT / 2);
      startGame();
      fitBoardFont();
    }

    applyTargetScore(targetScore);
    showToast('已应用：速度×' + cheats.speed + '，分数 ' + currentScore() +
              '，' + GRID_WIDTH + '×' + GRID_HEIGHT);
  };
}

function applyTargetScore(target) {
  target = Math.max(0, target);
  var current = currentScore();
  if (target === current) return;
  if (target > current) {
    for (var i = 0; i < (target - current); i++) {
      var placed = false;
      for (var y = 1; y < GRID_HEIGHT - 1 && !placed; y++) {
        for (var x = 1; x < GRID_WIDTH - 1 && !placed; x++) {
          if (cellAt(x, y) !== SNAKE_CELL && cellAt(x, y) !== FOOD_CELL) {
            setCellAt(x, y, SNAKE_CELL);
            snake.push({x: x, y: y});
            placed = true;
          }
        }
      }
      if (!placed) break;
    }
  } else {
    for (var i = 0; i < (current - target); i++) {
      if (snake.length <= INITIAL_SNAKE_LENGTH) break;
      var t = snake.pop();
      setCellAt(t.x, t.y, null);
    }
  }
  drawWorld();
}

function fitBoardFont() {
  var board = document.getElementById('mobile-board');
  if (!board) return;
  var W = board.clientWidth - 8;
  var H = board.clientHeight - 8;
  var sizeByW = W / BRAILLE_COLS / 0.6;
  var sizeByH = H / VISUAL_ROWS / 1.05;
  var size = Math.min(sizeByW, sizeByH);
  board.style.fontSize = Math.max(6, size) + 'px';
}

function detectBrowserUrlWhitespaceEscaping() {
  try { history.replaceState(null, null, '#' + BRAILLE_SPACE + BRAILLE_SPACE) } catch (e) {}
  if (location.hash.indexOf(BRAILLE_SPACE) == -1) {
    var replacementData = pickWhitespaceReplacementChar();
    whitespaceReplacementChar = replacementData[0];
    document.getElementById('url-escaping-note').classList.remove('invisible');
    document.getElementById('replacement-char-description').textContent = replacementData[1];
  }
}

function cleanUrl() {
  try { history.replaceState(null, null, location.pathname.replace(/\b\/$/, '')); } catch (e) {}
}

function setupEventHandlers() {
  var directionsByKey = {
    37: LEFT, 38: UP, 39: RIGHT, 40: DOWN,
    87: UP, 65: LEFT, 83: DOWN, 68: RIGHT,
    75: UP, 72: LEFT, 74: DOWN, 76: RIGHT
  };
  document.onkeydown = function (event) {
    var key = event.keyCode;
    if (key in directionsByKey) {
      event.preventDefault();
      changeDirection(directionsByKey[key]);
    }
  };
  document.addEventListener('visibilitychange', function () {
    gamePaused = document.hidden;
  });
  window.onblur = function () { gamePaused = true; };
  window.onfocus = function () { gamePaused = false; drawWorld(); };
  document.getElementById('reveal-url').onclick = function (e) {
    e.preventDefault();
    setUrlRevealed(!urlRevealed);
  };
  document.querySelectorAll('.expandable').forEach(function (expandable) {
    var expand = expandable.querySelector('.expand-btn');
    var collapse = expandable.querySelector('.collapse-btn');
    var content = expandable.querySelector('.expandable-content');
    expand.onclick = collapse.onclick = function () {
      expand.classList.remove('hidden');
      content.classList.remove('hidden');
      expandable.classList.toggle('expanded');
      expand.setAttribute('aria-expanded', expandable.classList.contains('expanded'));
    };
    expandable.ontransitionend = function () {
      var expanded = expandable.classList.contains('expanded');
      expand.classList.toggle('hidden', expanded);
      content.classList.toggle('hidden', !expanded);
    };
  });
}

function setupJoystick() {
  var joy = document.getElementById('joystick');
  if (!joy) return;
  var knob = joy.querySelector('.knob');
  var active = false;
  var centerX = 0, centerY = 0;
  var maxRadius = 0;
  var lockedDir = null;
  var DEADZONE = 18;
  var SWITCH_ANGLE = 1.1;

  function getCenter() {
    var rect = joy.getBoundingClientRect();
    centerX = rect.left + rect.width / 2;
    centerY = rect.top + rect.height / 2;
    maxRadius = rect.width * 0.42;
  }
  function setKnob(dx, dy) {
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > maxRadius) { dx = dx / dist * maxRadius; dy = dy / dist * maxRadius; }
    knob.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
  }
  function resetKnob() {
    knob.style.transform = 'translate(0, 0)';
    joy.classList.remove('active');
    lockedDir = null;
  }
  function normalizeAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  }
  function resolveDir(dx, dy) {
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < DEADZONE) return null;
    var angle = Math.atan2(dy, dx);
    var candidates = [
      {dir: RIGHT, angle: 0},
      {dir: DOWN, angle: Math.PI / 2},
      {dir: LEFT, angle: Math.PI},
      {dir: UP, angle: -Math.PI / 2}
    ];
    var best = null, bestDiff = Infinity;
    for (var i = 0; i < candidates.length; i++) {
      var diff = Math.abs(normalizeAngle(angle - candidates[i].angle));
      if (diff < bestDiff) { bestDiff = diff; best = candidates[i].dir; }
    }
    if (lockedDir && lockedDir !== best) {
      var lockedAngle = 0;
      for (var j = 0; j < candidates.length; j++) {
        if (candidates[j].dir === lockedDir) { lockedAngle = candidates[j].angle; break; }
      }
      if (Math.abs(normalizeAngle(angle - lockedAngle)) < SWITCH_ANGLE) {
        return lockedDir;
      }
    }
    return best;
  }
  function handleMove(clientX, clientY) {
    var dx = clientX - centerX;
    var dy = clientY - centerY;
    setKnob(dx, dy);
    var dir = resolveDir(dx, dy);
    if (!dir) return;
    if (dir === lockedDir) return;
    lockedDir = dir;
    changeDirection(dir);
  }
  joy.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    active = true;
    joy.classList.add('active');
    joy.setPointerCapture(e.pointerId);
    getCenter();
    lockedDir = null;
    handleMove(e.clientX, e.clientY);
  }, {passive: false});
  joy.addEventListener('pointermove', function (e) {
    if (!active) return;
    e.preventDefault();
    handleMove(e.clientX, e.clientY);
  }, {passive: false});
  function end() { if (!active) return; active = false; resetKnob(); }
  joy.addEventListener('pointerup', end, {passive: true});
  joy.addEventListener('pointercancel', end, {passive: true});
  joy.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  joy.addEventListener('touchstart', function (e) { e.preventDefault(); }, {passive: false});
  window.addEventListener('resize', function () { if (!active) getCenter(); });
}

function initUrlRevealed() {
  setUrlRevealed(Boolean(safeStorage.get('urlRevealed')));
}
function setUrlRevealed(value) {
  urlRevealed = value;
  document.getElementById('url-container').classList.toggle('invisible', !urlRevealed);
  if (urlRevealed) safeStorage.set('urlRevealed', 'y');
  else safeStorage.del('urlRevealed');
}

function startGame() {
  grid = new Array(GRID_WIDTH * GRID_HEIGHT);
  snake = [];
  for (var x = 0; x < INITIAL_SNAKE_LENGTH; x++) {
    snake.unshift({x: x, y: INITIAL_SNAKE_Y});
    setCellAt(x, INITIAL_SNAKE_Y, SNAKE_CELL);
  }
  currentDirection = RIGHT;
  moveQueue = [];
  hasMoved = false;
  dropFood();
  drawWorld();
}

// === 核心：不死 + 穿自己 ===
function updateWorld() {
  if (cheats.ai) autoPilot();

  if (moveQueue.length) currentDirection = moveQueue.shift();
  var head = snake[0];
  var tail = snake[snake.length - 1];
  var newX = head.x + currentDirection.x;
  var newY = head.y + currentDirection.y;

  // 穿墙
  if (cheats.wrap) {
    newX = (newX + GRID_WIDTH) % GRID_WIDTH;
    newY = (newY + GRID_HEIGHT) % GRID_HEIGHT;
  }

  var outOfBounds = newX < 0 || newX >= GRID_WIDTH || newY < 0 || newY >= GRID_HEIGHT;
  var hitsSelf = !outOfBounds && cellAt(newX, newY) === SNAKE_CELL
    && !(newX === tail.x && newY === tail.y);

  // === 穿自己：撞蛇身直接穿过去，不判死 ===
  if (hitsSelf && cheats.selfPass) {
    hitsSelf = false;  // 当作没撞
  }

  // === 不死模式：撞墙/撞自己都不死 ===
  if (!cheats.god && (outOfBounds || hitsSelf)) {
    flashBoardDead();
    endGame();
    startGame();
    return;
  }

  // 不死模式下撞墙：自动找空方向，绝不卡住
  if (cheats.god && outOfBounds) {
    var dirs = [UP, DOWN, LEFT, RIGHT];
    var moved = false;
    for (var i = 0; i < dirs.length; i++) {
      var d = dirs[i];
      var tx = head.x + d.x;
      var ty = head.y + d.y;
      if (cheats.wrap) {
        tx = (tx + GRID_WIDTH) % GRID_WIDTH;
        ty = (ty + GRID_HEIGHT) % GRID_HEIGHT;
      }
      if (tx < 0 || tx >= GRID_WIDTH || ty < 0 || ty >= GRID_HEIGHT) continue;
      // 不死模式：蛇身也能穿
      currentDirection = d;
      newX = tx; newY = ty;
      outOfBounds = false;
      hitsSelf = false;
      moved = true;
      break;
    }
    if (!moved) return;  // 真的无路可走才原地（几乎不会发生）
  }

  // 不死 + 撞自己：穿过去（即使 selfPass 没开，不死模式下也不死）
  if (cheats.god && hitsSelf) {
    hitsSelf = false;
  }

  var eatsFood = cellAt(newX, newY) === FOOD_CELL;
  if (!eatsFood) {
    snake.pop();
    setCellAt(tail.x, tail.y, null);
  }
  setCellAt(newX, newY, SNAKE_CELL);
  snake.unshift({x: newX, y: newY});
  if (eatsFood) dropFood();
}

function autoPilot() {
  var head = snake[0];
  var foodPos = null;
  for (var y = 0; y < GRID_HEIGHT; y++) {
    for (var x = 0; x < GRID_WIDTH; x++) {
      if (cellAt(x, y) === FOOD_CELL) { foodPos = {x: x, y: y}; break; }
    }
    if (foodPos) break;
  }
  if (!foodPos) return;

  var dx = foodPos.x - head.x;
  var dy = foodPos.y - head.y;
  var tryDirs = [];
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0) tryDirs.push(RIGHT); else if (dx < 0) tryDirs.push(LEFT);
    if (dy > 0) tryDirs.push(DOWN); else if (dy < 0) tryDirs.push(UP);
  } else {
    if (dy > 0) tryDirs.push(DOWN); else if (dy < 0) tryDirs.push(UP);
    if (dx > 0) tryDirs.push(RIGHT); else if (dx < 0) tryDirs.push(LEFT);
  }
  tryDirs.push(UP, DOWN, LEFT, RIGHT);

  for (var i = 0; i < tryDirs.length; i++) {
    var d = tryDirs[i];
    var nx = head.x + d.x;
    var ny = head.y + d.y;
    if (cheats.wrap) {
      nx = (nx + GRID_WIDTH) % GRID_WIDTH;
      ny = (ny + GRID_HEIGHT) % GRID_HEIGHT;
    }
    if (nx < 0 || nx >= GRID_WIDTH || ny < 0 || ny >= GRID_HEIGHT) continue;
    // 不死模式下蛇身也能走
    if (!cheats.god && cellAt(nx, ny) === SNAKE_CELL) continue;
    var lastDir = moveQueue[0] || currentDirection;
    if (d.x + lastDir.x === 0 && d.y + lastDir.y === 0) continue;
    moveQueue.push(d);
    return;
  }
}

function flashBoardDead() {
  var board = document.getElementById('mobile-board');
  if (!board) return;
  board.classList.add('dead');
  setTimeout(function () { board.classList.remove('dead'); }, 400);
}

function endGame() {
  var score = currentScore();
  var maxScore = parseInt(safeStorage.get('maxScore') || 0, 10);
  var isNew = score > 0 && score > maxScore && hasMoved;
  if (isNew) {
    safeStorage.set('maxScore', score);
    safeStorage.set('maxScoreGrid', gridString());
    drawMaxScore();
    showMaxScore();
  }
  showToast(isNew ? '🎉 新纪录！' + score + ' 分' : '💥 撞墙！得分：' + score);
  gameOverCooldown = Date.now() + 600;
}

function drawWorld() {
  var hash = '#|' + gridString() + '|[score:' + currentScore() + ']';
  if (urlRevealed) {
    document.getElementById('url').textContent = location.href.replace(/#.*$/, '') + hash;
  }
  if (isTouchDevice) renderMobileBoard();
  if (whitespaceReplacementChar) hash = hash.replace(/\u2800/g, whitespaceReplacementChar);
  try { history.replaceState(null, null, hash); } catch (e) {}
  if (!hashFallbackInProgress && decodeURIComponent(location.hash) !== hash) {
    hashFallbackInProgress = true;
    try { location.hash = hash; } catch (e) {}
    setTimeout(function () { hashFallbackInProgress = false; }, 50);
  }
}

function renderMobileBoard() {
  var inner = document.getElementById('mobile-board-inner');
  if (!inner) return;
  var str = gridString();
  var rows = [];
  for (var i = 0; i < str.length; i += BRAILLE_COLS) {
    rows.push(str.slice(i, i + BRAILLE_COLS));
  }
  inner.textContent = rows.join('\n');
  var max = safeStorage.get('maxScore');
  var flags = '';
  if (cheats.god) flags += ' 🛡';
  if (cheats.wrap) flags += ' 🌀';
  if (cheats.selfPass) flags += ' 👻';
  if (cheats.speed !== 1) flags += ' ⏩×' + cheats.speed;
  if (cheats.ai) flags += ' 🤖';
  document.getElementById('mobile-score').textContent =
    '分数：' + currentScore() + (max ? ' ｜ 最高：' + max : '') + flags;
}

function gridString() {
  var str = '';
  for (var layer = 0; layer < VISUAL_ROWS; layer++) {
    str += gridStringLayer(layer * 4);
  }
  return str;
}

function gridStringLayer(startY) {
  var str = '';
  for (var x = 0; x < GRID_WIDTH; x += 2) {
    var n = 0
      | bitAt(x, startY + 0) << 0
      | bitAt(x, startY + 1) << 1
      | bitAt(x, startY + 2) << 2
      | bitAt(x + 1, startY + 0) << 3
      | bitAt(x + 1, startY + 1) << 4
      | bitAt(x + 1, startY + 2) << 5
      | bitAt(x, startY + 3) << 6
      | bitAt(x + 1, startY + 3) << 7;
    str += String.fromCharCode(0x2800 + n);
  }
  return str;
}

function tickTime() {
  var start = 130, end = 70;
  var t = Math.min(1, (snake.length - INITIAL_SNAKE_LENGTH) / 30);
  var base = start + (end - start) * t;
  return base / cheats.speed;
}
function currentScore() { return snake.length - INITIAL_SNAKE_LENGTH; }
function cellAt(x, y) {
  if (y < 0 || y >= GRID_HEIGHT) return null;
  return grid[x % GRID_WIDTH + y * GRID_WIDTH];
}
function bitAt(x, y) { return cellAt(x, y) ? 1 : 0; }
function setCellAt(x, y, c) { grid[x % GRID_WIDTH + y * GRID_WIDTH] = c; }

function dropFood() {
  var candidates = [];
  for (var y = 1; y < GRID_HEIGHT - 1; y++) {
    for (var x = 1; x < GRID_WIDTH - 1; x++) {
      var i = x + y * GRID_WIDTH;
      if (grid[i] !== SNAKE_CELL && grid[i] !== FOOD_CELL) candidates.push(i);
    }
  }
  if (candidates.length === 0) {
    for (var i2 = 0; i2 < grid.length; i2++) {
      if (grid[i2] !== SNAKE_CELL && grid[i2] !== FOOD_CELL) candidates.push(i2);
    }
  }
  if (candidates.length === 0) return;
  grid[candidates[Math.floor(Math.random() * candidates.length)]] = FOOD_CELL;
}

function changeDirection(newDir) {
  if (Date.now() < gameOverCooldown) return;
  var lastDir = moveQueue[moveQueue.length - 1] || currentDirection;
  if (newDir === lastDir) return;
  var opposite = newDir.x + lastDir.x === 0 && newDir.y + lastDir.y === 0;
  if (!opposite) moveQueue.push(newDir);
  hasMoved = true;
}

function drawMaxScore() {
  var maxScore = safeStorage.get('maxScore');
  if (maxScore == null) return;
  var pts = maxScore == 1 ? '1 分' : maxScore + ' 分';
  var g = safeStorage.get('maxScoreGrid');
  document.getElementById('max-score-points').textContent = pts;
  document.getElementById('max-score-grid').textContent = g;
  document.getElementById('max-score-container').classList.remove('hidden');
  document.getElementById('share').onclick = function (e) {
    e.preventDefault();
    shareScore(pts, g);
  };
}
function showMaxScore() {
  if (document.querySelector('#max-score-container.expanded')) return;
  document.querySelector('#max-score-container .expand-btn').click();
}
function shareScore(pts, grid) {
  var message = '|' + grid + '| 我在浏览器地址栏上玩这个沙雕贪吃蛇游戏拿到了 ' + pts + '！';
  var url = document.querySelector('link[rel=canonical]').href;
  if (navigator.share) navigator.share({text: message, url: url});
  else if (navigator.clipboard) navigator.clipboard.writeText(message + '\n' + url)
    .then(function () { showShareNote('已复制到剪贴板') })
    .catch(function () { showShareNote('复制失败') });
  else showShareNote('剪贴板不可用');
}
function showShareNote(m) {
  var n = document.getElementById('share-note');
  n.textContent = m;
  n.classList.remove('invisible');
  setTimeout(function () { n.classList.add('invisible'); }, 1000);
}
var toastTimer = null;
function showToast(m) {
  var el = document.getElementById('toast');
  el.textContent = m;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1200);
}
function pickWhitespaceReplacementChar() {
  return ['░', '淡雾状符号'];
}

main();
</script>
