<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>彩虹圈 · 双手传</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #ffffff;          /* 纯白背景 */
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas { display: block; touch-action: none; }
  .hint {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    font: 13px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #d0d0d0;
    letter-spacing: 3px;
    pointer-events: none;
    white-space: nowrap;
    transition: opacity .6s ease;
  }
  .demo-btn {
    position: fixed;
    left: 50%;
    bottom: 54px;
    transform: translateX(-50%);
    padding: 8px 24px;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    letter-spacing: 2px;
    color: #888;
    background: #f7f7f7;
    border: 1px solid #e6e6e6;
    border-radius: 20px;
    cursor: pointer;
    transition: all .2s ease;
    white-space: nowrap;
    outline: none;
  }
  .demo-btn:hover {
    background: #f0f0f0;
    color: #555;
    border-color: #dcdcdc;
  }
  .demo-btn:active {
    transform: translateX(-50%) scale(0.96);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">按住拖动 · 触屏可两只手一起拉</div>
<button class="demo-btn" id="demoBtn">双手传一个看看</button>

<script>
(function () {
  'use strict';

  var cvs     = document.getElementById('c');
  var ctx     = cvs.getContext('2d');
  var hint    = document.getElementById('hint');
  var demoBtn = document.getElementById('demoBtn');

  /* ================= 参数 ================= */
  var N       = 40;              // 骨架节点数
  var SEG     = 13;              // 静止段长
  var TURNS   = 44;              // 螺旋圈数（密密麻麻）
  var SAMPLES = TURNS * 14;

  var GRAV    = 0.42;
  var DAMP    = 0.988;
  var STIFF   = 0.30;            // 软距离约束（允许段长变化）
  var BEND    = 0.10;
  var ITER    = 7;

  var HAND_RADIUS = 70;          // 手抓取弹簧的半径
  var HAND_PULL   = 0.36;        // 手对弹簧的软约束强度

  var R       = 52;              // 水平半径
  var RY      = 19;              // 纵深压扁

  var TWO_PI_T = 2 * Math.PI * TURNS;

  /* ================= 状态 ================= */
  var W, H, DPR, CX, GROUND;
  var nodes = [];
  var hands = [];                // { active, x, y, pid }
  var demo  = { active: false, t: 0 };

  var axisX = new Float32Array(SAMPLES + 1);
  var axisY = new Float32Array(SAMPLES + 1);
  var spX   = new Float32Array(SAMPLES + 1);
  var spY   = new Float32Array(SAMPLES + 1);

  /* ================= Catmull-Rom ================= */
  function catmull(p0, p1, p2, p3, t) {
    var t2 = t * t, t3 = t2 * t;
    return 0.5 * (
      (2 * p1) +
      (-p0 + p2) * t +
      (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 +
      (-p0 + 3 * p1 - 3 * p2 + p3) * t3
    );
  }

  /* ================= 初始化 ================= */
  function init() {
    nodes.length = 0;
    var baseY = GROUND - RY;
    for (var i = 0; i < N; i++) {
      var y = baseY - i * SEG;
      nodes.push({ x: CX, y: y, px: CX, py: y });
    }
    hands.length = 0;
    resetDemo();
    updateSp();
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    cvs.width  = Math.round(W * DPR);
    cvs.height = Math.round(H * DPR);
    cvs.style.width  = W + 'px';
    cvs.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    CX     = W / 2;
    GROUND = H * 0.84;

    R  = Math.max(32, Math.min(W * 0.15, H * 0.085, 58));
    RY = R * 0.36;

    init();
  }

  /* ================= 计算螺旋采样点 ================= */
  function updateSp() {
    var segN = N - 1, k, i, t, g;

    /* 骨架曲线采样 */
    for (k = 0; k <= SAMPLES; k++) {
      g = (k / SAMPLES) * segN;
      i = Math.floor(g);
      if (i > segN - 1) i = segN - 1;
      t = g - i;

      var p0 = nodes[i > 0 ? i - 1 : 0];
      var p1 = nodes[i];
      var p2 = nodes[i + 1];
      var p3 = nodes[i + 2 <= N - 1 ? i + 2 : N - 1];

      axisX[k] = catmull(p0.x, p1.x, p2.x, p3.x, t);
      axisY[k] = catmull(p0.y, p1.y, p2.y, p3.y, t);
    }

    /* 沿骨架生成螺旋点 */
    for (k = 0; k <= SAMPLES; k++) {
      var kp = k > 0 ? k - 1 : 0;
      var kn = k < SAMPLES ? k + 1 : SAMPLES;
      var tx = axisX[kn] - axisX[kp];
      var ty = axisY[kn] - axisY[kp];
      var tl = Math.sqrt(tx * tx + ty * ty) || 1;
      tx /= tl; ty /= tl;
      var nx = -ty, ny = tx;

      var phi = TWO_PI_T * (k / SAMPLES);
      var cs = Math.cos(phi), sn = Math.sin(phi);

      // 两端稍微收窄，更像真实的彩虹圈
      var rm = 0.80 + 0.20 * Math.sin(Math.PI * (k / SAMPLES));

      spX[k] = axisX[k] + R  * rm * cs * nx + RY * rm * sn * tx;
      spY[k] = axisY[k] + R  * rm * cs * ny + RY * rm * sn * ty;
    }
  }

  /* ================= 物理 ================= */
  function applyHandConstraint(hand) {
    // 找弹簧上离手最近的采样点（空间点，不是材料点）
    var bestK = 0, bd = Infinity;
    for (var k = 0; k <= SAMPLES; k += 2) {
      var dx = spX[k] - hand.x;
      var dy = spY[k] - hand.y;
      var d  = dx * dx + dy * dy;
      if (d < bd) { bd = d; bestK = k; }
    }
    bd = Math.sqrt(bd);
    if (bd > HAND_RADIUS) return;   // 手够不着就不拉

    // 映射到骨架节点
    var g = (bestK / SAMPLES) * (N - 1);
    var i = Math.floor(g);
    if (i > N - 2) i = N - 2;
    if (i < 0) i = 0;
    var t = g - i;

    var a = nodes[i], b = nodes[i + 1];
    var qx = a.x + (b.x - a.x) * t;
    var qy = a.y + (b.y - a.y) * t;

    var dx2 = hand.x - qx;
    var dy2 = hand.y - qy;

    // 软约束：手只拉曲线上的“空间点”，材料可以滑过手
    a.x += dx2 * (1 - t) * HAND_PULL;
    a.y += dy2 * (1 - t) * HAND_PULL;
    b.x += dx2 * t * HAND_PULL;
    b.y += dy2 * t * HAND_PULL;
  }

  function step() {
    var i, n;

    /* 1. Verlet 积分 */
    for (i = 0; i < N; i++) {
      n = nodes[i];
      var vx = (n.x - n.px) * DAMP;
      var vy = (n.y - n.py) * DAMP;
      n.px = n.x; n.py = n.y;
      n.x += vx;
      n.y += vy + GRAV;
    }

    /* 2. 手约束（空间滑动） */
    for (var h = 0; h < hands.length; h++) {
      if (hands[h].active) applyHandConstraint(hands[h]);
    }

    /* 3. 约束迭代 */
    for (var k = 0; k < ITER; k++) {
      // 软距离约束：段长可压缩、可拉伸 → 圈可以“堆积”或“拉开”
      for (i = 0; i < N - 1; i++) {
        var a = nodes[i], b = nodes[i + 1];
        var dx = b.x - a.x, dy = b.y - a.y;
        var d  = Math.sqrt(dx * dx + dy * dy) || 1e-4;
        var diff = ((d - SEG) / d) * STIFF;
        var hx = dx * diff * 0.5;
        var hy = dy * diff * 0.5;
        a.x += hx; a.y += hy;
        b.x -= hx; b.y -= hy;
      }
      // 弯曲约束：保持弹簧顺滑
      for (i = 1; i < N - 1; i++) {
        var p = nodes[i - 1], c = nodes[i], q = nodes[i + 1];
        c.x += ((p.x + q.x) * 0.5 - c.x) * BEND;
        c.y += ((p.y + q.y) * 0.5 - c.y) * BEND;
      }
    }
  }

  /* ================= 演示动画 ================= */
  function updateDemo(dt) {
    if (!demo.active) return;

    demo.t += dt;
    var dur = 8500;
    var phase = (demo.t % dur) / dur;

    // 拉开 / 收拢
    var spread = 0;
    if (phase < 0.15) {
      spread = 170 * (phase / 0.15);
    } else if (phase > 0.85) {
      spread = 170 * (1 - (phase - 0.85) / 0.15);
    } else {
      spread = 170;
    }

    // 交替倾斜（正弦波）
    var tiltA = 0, tiltB = 0;
    if (phase > 0.15 && phase < 0.85) {
      var tt = (phase - 0.15) / 0.7;
      var wave = Math.sin(tt * Math.PI * 2);
      tiltA = 105 * wave;
      tiltB = -105 * wave;
    }

    var baseY = Math.max(GROUND - 235, H * 0.18);
    var maxSpread = Math.min(spread, W * 0.34);

    hands.length = 0;
    hands.push({ active: true, x: CX - maxSpread, y: baseY - tiltA, pid: -1 });
    hands.push({ active: true, x: CX + maxSpread, y: baseY - tiltB, pid: -1 });
  }

  function resetDemo() {
    demo.active = false;
    demo.t = 0;
    demoBtn.textContent = '双手传一个看看';
    hint.style.opacity = '1';
  }

  /* ================= 绘制 ================= */
  function drawSeg(from, to, mid) {
    var hue = (mid / SAMPLES) * 300;
    var phi = TWO_PI_T * (mid / SAMPLES);
    var sn  = Math.sin(phi);
    var light = 53 + sn * 10;

    ctx.beginPath();
    ctx.moveTo(spX[from], spY[from]);
    for (var j = from + 1; j <= to; j++) {
      ctx.lineTo(spX[j], spY[j]);
    }
    ctx.strokeStyle = 'hsl(' + hue + ', 85%, ' + light + '%)';
    ctx.stroke();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // 地面阴影
    ctx.beginPath();
    ctx.ellipse(CX, GROUND + 3, R * 1.1, R * 0.16, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.045)';
    ctx.fill();

    var k;
    var lw = Math.max(2.6, R * 0.055);
    ctx.lineCap  = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = lw;

    var STEP = 5;

    // 后半弧（sin < 0）
    for (k = SAMPLES - STEP; k >= 0; k -= STEP) {
      var mid = k + STEP * 0.5;
      if (Math.sin(TWO_PI_T * (mid / SAMPLES)) < 0) {
        drawSeg(k, Math.min(k + STEP, SAMPLES), mid);
      }
    }
    // 前半弧（sin >= 0）
    for (k = SAMPLES - STEP; k >= 0; k -= STEP) {
      var mid2 = k + STEP * 0.5;
      if (Math.sin(TWO_PI_T * (mid2 / SAMPLES)) >= 0) {
        drawSeg(k, Math.min(k + STEP, SAMPLES), mid2);
      }
    }

    // 手的指示圆点
    for (var h = 0; h < hands.length; h++) {
      var hand = hands[h];
      if (!hand.active) continue;
      ctx.beginPath();
      ctx.arc(hand.x, hand.y, 9, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.12)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  /* ================= 交互 ================= */
  function getPos(e) {
    var r = cvs.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  cvs.addEventListener('pointerdown', function (e) {
    if (demo.active) return;
    var p = getPos(e);

    // 判断是否点在弹簧附近
    var bd = Infinity;
    for (var k = 0; k <= SAMPLES; k += 2) {
      var dx = spX[k] - p.x;
      var dy = spY[k] - p.y;
      var d = dx * dx + dy * dy;
      if (d < bd) bd = d;
    }
    if (Math.sqrt(bd) > HAND_RADIUS) return;

    cvs.setPointerCapture(e.pointerId);
    hands.push({ active: true, x: p.x, y: p.y, pid: e.pointerId });
    hint.style.opacity = '0';
  });

  cvs.addEventListener('pointermove', function (e) {
    if (demo.active) return;
    var p = getPos(e);
    for (var h = 0; h < hands.length; h++) {
      if (hands[h].pid === e.pointerId) {
        hands[h].x = p.x;
        hands[h].y = p.y;
        return;
      }
    }
  });

  function releaseHand(e) {
    if (demo.active) return;
    for (var h = hands.length - 1; h >= 0; h--) {
      if (hands[h].pid === e.pointerId) hands.splice(h, 1);
    }
    if (hands.length === 0) hint.style.opacity = '1';
  }

  cvs.addEventListener('pointerup', releaseHand);
  cvs.addEventListener('pointercancel', releaseHand);

  // 演示按钮
  demoBtn.addEventListener('click', function () {
    if (demo.active) {
      resetDemo();
    } else {
      demo.active = true;
      demo.t = 0;
      hands.length = 0;
      demoBtn.textContent = '停止演示';
      hint.style.opacity = '0';
    }
  });

  /* ================= 主循环 ================= */
  var last = 0, acc = 0, FIXED = 1000 / 60;

  function loop(now) {
    requestAnimationFrame(loop);

    if (!last) last = now;
    var dt = now - last;
    last = now;
    if (dt > 60) dt = 60;

    if (demo.active) updateDemo(dt);

    updateSp();   // 先更新采样点，手约束才能用最新位置

    acc += dt;
    var guard = 0;
    while (acc >= FIXED && guard < 3) {
      step();
      acc -= FIXED;
      guard++;
    }

    updateSp();   // 物理后重新计算，用于绘制
    draw();
  }

  /* ================= 启动 ================= */
  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 150);
  });

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
