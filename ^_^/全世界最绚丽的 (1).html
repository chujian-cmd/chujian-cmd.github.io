<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>^_^</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #050510;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: crosshair;
  }

  /* 全屏 Canvas 只在中心附近画，性能好 */
  #bg-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  /* 中心文字 */
  .center-stage {
    position: relative;
    z-index: 10;
    text-align: center;
    pointer-events: none;
    animation: breathe 4s ease-in-out infinite;
  }

  .smiley {
    font-family: 'Arial Black', 'Impact', sans-serif;
    font-size: clamp(5rem, 20vw, 14rem);
    font-weight: 900;
    line-height: 1;
    letter-spacing: 0.05em;
    background: linear-gradient(135deg, #00ffff, #ff00ff, #ffff00, #00ffff);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: gradientFlow 5s linear infinite;
    filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.6))
            drop-shadow(0 0 40px rgba(255, 0, 255, 0.4));
  }

  /* 两个旋转光环，只围绕文字，轻量 */
  .ring {
    position: absolute;
    top: 50%;
    left: 50%;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .ring-1 {
    width: 45vmin;
    height: 45vmin;
    border: 2px solid rgba(0, 255, 255, 0.35);
    box-shadow: 0 0 40px rgba(0, 255, 255, 0.25),
                inset 0 0 40px rgba(0, 255, 255, 0.1);
    animation: spin 12s linear infinite;
  }

  .ring-2 {
    width: 65vmin;
    height: 65vmin;
    border: 1px dashed rgba(255, 0, 255, 0.3);
    box-shadow: 0 0 60px rgba(255, 0, 255, 0.15);
    animation: spin 20s linear infinite reverse;
  }

  /* 中心柔光背景，突出文字 */
  .glow {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 60vmin;
    height: 60vmin;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle,
      rgba(0, 255, 255, 0.15) 0%,
      rgba(255, 0, 255, 0.08) 35%,
      transparent 70%);
    filter: blur(20px);
    z-index: 5;
    pointer-events: none;
    animation: pulse 3s ease-in-out infinite alternate;
  }

  /* 鼠标跟随光点（Canvas 外的一个 CSS 光点，轻量） */
  .cursor-dot {
    position: fixed;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff, #0ff);
    box-shadow: 0 0 20px #0ff, 0 0 40px #f0f;
    pointer-events: none;
    z-index: 20;
    transform: translate(-50%, -50%);
    transition: transform 0.05s;
    mix-blend-mode: screen;
  }

  @keyframes gradientFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  @keyframes spin {
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }

  @keyframes pulse {
    0% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.9); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="glow"></div>
<div class="center-stage">
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="smiley">^_^</div>
</div>
<div class="cursor-dot" id="cursorDot"></div>

<script>
(function () {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  const dot = document.getElementById('cursorDot');

  let W, H, cx, cy;
  let time = 0;

  // ---- 轻量粒子系统：只有中心区域少量粒子 ----
  const PARTICLE_COUNT = 45;
  const particles = [];
  let mouseX = -9999, mouseY = -9999;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W / 2;
    cy = H / 2;
    initParticles();
  }

  function initParticles() {
    particles.length = 0;
    // 粒子集中在中心半径 350px 内生成
    const maxR = Math.min(W, H) * 0.4;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = Math.random() * maxR;
      particles.push({
        x: cx + Math.cos(angle) * r,
        y: cy + Math.sin(angle) * r,
        baseX: cx + Math.cos(angle) * r,
        baseY: cy + Math.sin(angle) * r,
        vx: (Math.random() - 0.5) * 0.6,
        vy: (Math.random() - 0.5) * 0.6,
        size: Math.random() * 2.5 + 1.5,
        phase: Math.random() * Math.PI * 2,
        hue: Math.random() * 360
      });
    }
  }

  // 鼠标位置
  window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    dot.style.left = e.clientX + 'px';
    dot.style.top = e.clientY + 'px';
  });
  window.addEventListener('mouseout', () => {
    mouseX = -9999;
    mouseY = -9999;
  });

  // 点击爆裂火花（轻量）
  window.addEventListener('click', (e) => {
    const sparks = [];
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = Math.random() * 3 + 2;
      sparks.push({
        x: e.clientX, y: e.clientY,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        hue: Math.random() * 360
      });
    }
    animateSparks(sparks);
  });

  function animateSparks(sparks) {
    function step() {
      let alive = false;
      ctx.shadowBlur = 0;
      for (const s of sparks) {
        if (s.life <= 0) continue;
        s.x += s.vx;
        s.y += s.vy;
        s.vx *= 0.96;
        s.vy *= 0.96;
        s.life -= 0.025;
        if (s.life > 0) {
          alive = true;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.life * 4, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${s.hue}, 100%, 65%, ${s.life})`;
          ctx.shadowBlur = 15;
          ctx.shadowColor = `hsl(${s.hue}, 100%, 60%)`;
          ctx.fill();
        }
      }
      if (alive) requestAnimationFrame(step);
    }
    step();
  }

  // ---- 主渲染 ----
  function render() {
    time += 0.016;

    // 清屏（深色半透明拖尾，但不要太糊）
    ctx.fillStyle = 'rgba(5, 5, 16, 0.35)';
    ctx.fillRect(0, 0, W, H);

    // 1. 中心脉冲能量环
    const pulse = 1 + Math.sin(time * 2) * 0.08;
    for (let i = 0; i < 3; i++) {
      const r = (120 + i * 60) * pulse;
      const grad = ctx.createRadialGradient(cx, cy, r * 0.7, cx, cy, r);
      grad.addColorStop(0, `hsla(${(time * 40 + i * 60) % 360}, 100%, 60%, 0)`);
      grad.addColorStop(0.5, `hsla(${(time * 40 + i * 60) % 360}, 100%, 60%, 0.08)`);
      grad.addColorStop(1, `hsla(${(time * 40 + i * 60) % 360}, 100%, 60%, 0)`);
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    }

    // 2. 粒子更新 + 绘制
    ctx.shadowBlur = 12;
    for (const p of particles) {
      // 缓慢漂浮
      p.phase += 0.015;
      p.x = p.baseX + Math.cos(p.phase) * 15;
      p.y = p.baseY + Math.sin(p.phase * 1.3) * 15;

      // 鼠标排斥
      if (mouseX > 0) {
        const dx = p.x - mouseX;
        const dy = p.y - mouseY;
        const dist = Math.hypot(dx, dy);
        if (dist < 120) {
          const force = (120 - dist) / 120;
          p.x += (dx / dist) * force * 25;
          p.y += (dy / dist) * force * 25;
        }
      }

      // 大小脉动
      const s = p.size + Math.sin(p.phase * 2) * 1.2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, s, 0, Math.PI * 2);
      ctx.fillStyle = `hsl(${p.hue}, 100%, 65%)`;
      ctx.shadowColor = `hsl(${p.hue}, 100%, 60%)`;
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // 3. 粒子之间的连线（只在中心区域内，限制数量）
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const a = particles[i], b = particles[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < 100 * 100) { // 100px 内才连线
          const alpha = 1 - Math.sqrt(d2) / 100;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = `rgba(0, 255, 255, ${alpha * 0.35})`;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }
    }

    // 4. 从中心向外的柔和光晕线（旋转）
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(time * 0.2);
    for (let i = 0; i < 6; i++) {
      ctx.rotate(Math.PI / 3);
      const len = 200 + Math.sin(time * 1.5 + i) * 40;
      const g = ctx.createLinearGradient(0, 0, len, 0);
      g.addColorStop(0, `hsla(${(time * 50 + i * 60) % 360}, 100%, 60%, 0.25)`);
      g.addColorStop(1, 'transparent');
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(len, 0);
      ctx.strokeStyle = g;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.restore();

    requestAnimationFrame(render);
  }

  window.addEventListener('resize', resize);
  resize();
  render();
})();
</script>

</body>
</html>
