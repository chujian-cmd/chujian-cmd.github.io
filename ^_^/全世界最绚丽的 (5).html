<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Fractal Core · Three.js</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #03030a; cursor: crosshair;
  }
  canvas { display: block; }

  #hud {
    position: fixed; left: 22px; bottom: 20px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
    color: rgba(150, 200, 255, .45); pointer-events: none;
    user-select: none; line-height: 1.95;
    text-shadow: 0 0 12px rgba(80, 170, 255, .35);
  }
  #hud b { color: #7ee7ff; font-weight: 600; }
  #hud .sep { color: rgba(120, 90, 255, .5); }

  #loading {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center;
    background: #03030a;
    font-family: ui-monospace, monospace;
    font-size: 12px; letter-spacing: .45em; color: #4fd0ff;
    transition: opacity .9s ease;
  }
  #loading.hide { opacity: 0; pointer-events: none; }

  /* 屏幕四角的装饰性扫描角标 */
  .corner {
    position: fixed; width: 26px; height: 26px;
    border: 1px solid rgba(110, 190, 255, .35);
    pointer-events: none;
  }
  .corner.tl { top: 18px; left: 18px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: 18px; right: 18px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: 18px; left: 18px; border-right: 0; border-top: 0; }
  .corner.br { bottom: 18px; right: 18px; border-left: 0; border-top: 0; }
</style>
</head>
<body>

<div id="hud">
  <div>FRACTAL CORE <b>v1.0</b> <span class="sep">//</span> WEBGL2</div>
  <div><span class="sep">›</span> 拖拽旋转 <span class="sep">·</span> 滚轮缩放 <span class="sep">·</span> 点击引爆</div>
  <div><span class="sep">›</span> FPS <b id="fps">--</b> <span class="sep">·</span> PARTICLES <b id="pcount">--</b></div>
</div>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div id="loading">INITIALIZING CORE…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass }      from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';

/* ══════════════════════════════════════════════════════════════
   0. 设备探测
   ══════════════════════════════════════════════════════════════ */
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || innerWidth < 760;
const PARTICLE_COUNT = IS_MOBILE ? 12000 : 42000;
const STAR_COUNT     = IS_MOBILE ? 1800  : 4500;
const SHARD_COUNT    = IS_MOBILE ? 160   : 420;
const CORE_DETAIL    = IS_MOBILE ? 8     : 12;

/* ══════════════════════════════════════════════════════════════
   1. 渲染器 / 场景 / 相机
   ══════════════════════════════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance',
  alpha: false,
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05050f, 0.016);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 1200);
camera.position.set(0, 2.4, 9.6);

/* ══════════════════════════════════════════════════════════════
   2. 轨道控制
   ══════════════════════════════════════════════════════════════ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping   = true;
controls.dampingFactor   = 0.045;
controls.rotateSpeed     = 0.55;
controls.zoomSpeed       = 0.8;
controls.autoRotate      = true;
controls.autoRotateSpeed = 0.35;
controls.minDistance     = 3.5;
controls.maxDistance     = 26;
controls.target.set(0, 0, 0);

/* ══════════════════════════════════════════════════════════════
   3. 灯光
   ══════════════════════════════════════════════════════════════ */
scene.add(new THREE.AmbientLight(0x223366, 1.2));

const keyLight = new THREE.PointLight(0x66aaff, 60, 60, 2);
keyLight.position.set(6, 8, 6);
scene.add(keyLight);

const rimLight = new THREE.PointLight(0xff44cc, 40, 60, 2);
rimLight.position.set(-7, -4, -6);
scene.add(rimLight);

const fillLight = new THREE.PointLight(0x00ffcc, 25, 50, 2);
fillLight.position.set(0, -9, 4);
scene.add(fillLight);

/* ══════════════════════════════════════════════════════════════
   4. 背景渐变球（宇宙底色）
   ══════════════════════════════════════════════════════════════ */
const bgSphere = new THREE.Mesh(
  new THREE.SphereGeometry(420, 32, 24),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      uTop:    { value: new THREE.Color('#0d0a28') },
      uBottom: { value: new THREE.Color('#01010a') },
      uAccent: { value: new THREE.Color('#1a0b3a') },
    },
    vertexShader: /* glsl */`
      varying vec3 vDir;
      void main() {
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      uniform vec3 uTop, uBottom, uAccent;
      varying vec3 vDir;
      void main() {
        float h = vDir.y * 0.5 + 0.5;
        vec3 col = mix(uBottom, uTop, pow(h, 1.4));
        // 银河带
        float band = exp(-pow((vDir.y - 0.05) * 4.0, 2.0));
        col += uAccent * band * 0.55;
        gl_FragColor = vec4(col, 1.0);
      }
    `,
  })
);
bgSphere.frustumCulled = false;
scene.add(bgSphere);

/* ══════════════════════════════════════════════════════════════
   5. GLSL 公共噪声（顶点位移用）
   ══════════════════════════════════════════════════════════════ */
const NOISE_GLSL = /* glsl */`
  float hash31(vec3 p) {
    p = fract(p * 0.3183099 + vec3(0.1, 0.2, 0.3));
    p *= 17.0;
    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
  }

  float vnoise(vec3 x) {
    vec3 i = floor(x);
    vec3 f = fract(x);
    f = f * f * (3.0 - 2.0 * f);
    return mix(
      mix(mix(hash31(i + vec3(0.0, 0.0, 0.0)), hash31(i + vec3(1.0, 0.0, 0.0)), f.x),
          mix(hash31(i + vec3(0.0, 1.0, 0.0)), hash31(i + vec3(1.0, 1.0, 0.0)), f.x), f.y),
      mix(mix(hash31(i + vec3(0.0, 0.0, 1.0)), hash31(i + vec3(1.0, 0.0, 1.0)), f.x),
          mix(hash31(i + vec3(0.0, 1.0, 1.0)), hash31(i + vec3(1.0, 1.0, 1.0)), f.x), f.y),
      f.z
    );
  }

  float fbm(vec3 p) {
    float v = 0.0;
    float a = 0.5;
    for (int i = 0; i < 3; i++) {
      v += a * vnoise(p);
      p = p * 2.03 + vec3(1.7, 9.2, 3.1);
      a *= 0.5;
    }
    return v;
  }
`;

/* ══════════════════════════════════════════════════════════════
   6. 分形核心（顶点噪声位移 + 菲涅尔辉光）
   ══════════════════════════════════════════════════════════════ */
const coreGroup = new THREE.Group();
scene.add(coreGroup);

const coreUniforms = {
  uTime:    { value: 0 },
  uAmp:     { value: 0.30 },
  uFreq:    { value: 2.35 },
  uColorA:  { value: new THREE.Color('#180a3c') }, // 深紫
  uColorB:  { value: new THREE.Color('#7a2bff') }, // 紫蓝
  uColorC:  { value: new THREE.Color('#ff5ce0') }, // 品红高光
};

const coreMat = new THREE.ShaderMaterial({
  uniforms: coreUniforms,
  vertexShader: /* glsl */`
    uniform float uTime;
    uniform float uAmp;
    uniform float uFreq;
    varying vec3  vNormalV;
    varying vec3  vViewDir;
    varying float vDisp;

    ${NOISE_GLSL}

    void main() {
      vec3 n = normalize(position);

      // 三层噪声叠加：域扭曲 + fbm + 周期性涟漪
      vec3 warp = n * uFreq + vec3(0.0, uTime * 0.16, 0.0);
      float f = fbm(warp);
      f += 0.22 * fbm(warp * 2.4 + n.zxy * 1.5);
      f += 0.10 * sin(n.y * 14.0 + uTime * 2.2);

      float disp = (f - 0.52) * 2.0;
      vec3 p = position + normal * disp * uAmp;

      vDisp    = disp;
      vNormalV = normalize(normalMatrix * normal);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vViewDir = normalize(-mv.xyz);

      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: /* glsl */`
    uniform float uTime;
    uniform vec3  uColorA;
    uniform vec3  uColorB;
    uniform vec3  uColorC;
    varying vec3  vNormalV;
    varying vec3  vViewDir;
    varying float vDisp;

    void main() {
      // 菲涅尔边缘光
      float fres = pow(1.0 - clamp(dot(normalize(vNormalV), vViewDir), 0.0, 1.0), 2.8);

      // 位移量 → 基础色
      float t = clamp(vDisp * 0.55 + 0.5, 0.0, 1.0);
      vec3 col = mix(uColorA, uColorB, t);

      // 能量脉络（沿位移等值线的亮线）
      float veins = smoothstep(0.44, 0.50, abs(sin(vDisp * 10.0 + uTime * 1.6)));
      col += uColorC * veins * 0.85;

      // 菲涅尔边缘 + 内部自发光
      col += uColorC * fres * 1.7;
      col += vec3(0.30, 0.10, 0.55) * 0.35;

      gl_FragColor = vec4(col, 1.0);
    }
  `,
});

const coreMesh = new THREE.Mesh(
  new THREE.IcosahedronGeometry(1.72, CORE_DETAIL),
  coreMat
);
coreMesh.frustumCulled = false;
coreGroup.add(coreMesh);

/* ── 6b. 外层线框壳 ─────────────────────────────────────────── */
const shellMesh = new THREE.Mesh(
  new THREE.IcosahedronGeometry(2.55, 3),
  new THREE.MeshBasicMaterial({
    color: 0x66ccff,
    wireframe: true,
    transparent: true,
    opacity: 0.085,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  })
);
coreGroup.add(shellMesh);

/* ══════════════════════════════════════════════════════════════
   7. 螺旋星系粒子系统（GPU 差速旋转）
   ══════════════════════════════════════════════════════════════ */
const galaxyGeo = new THREE.BufferGeometry();

{
  const pos   = new Float32Array(PARTICLE_COUNT * 3);
  const col   = new Float32Array(PARTICLE_COUNT * 3);
  const size  = new Float32Array(PARTICLE_COUNT);
  const phase = new Float32Array(PARTICLE_COUNT);

  const ARMS   = 4;
  const RADIUS = 7.2;

  const cInner = new THREE.Color('#7df3ff');
  const cMid   = new THREE.Color('#7a4bff');
  const cOuter = new THREE.Color('#ff43c8');

  const tmp = new THREE.Color();

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const r = Math.pow(Math.random(), 0.62) * RADIUS;
    const armIdx = Math.floor(Math.random() * ARMS);
    const armAngle = (armIdx / ARMS) * Math.PI * 2;

    // 螺旋 + 内密外疏 + 抖动
    const spin   = r * 0.95;
    const spread = (1.0 - r / RADIUS) * 0.55 + 0.10;
    const angle  = armAngle + spin + (Math.random() - 0.5) * spread * 2.8;

    const jitter = (1.0 - r / RADIUS) * 0.45 + 0.12;

    pos[i * 3 + 0] = Math.cos(angle) * r + (Math.random() - 0.5) * jitter;
    pos[i * 3 + 1] = (Math.random() - 0.5) * (0.55 + 1.15 * (1.0 - r / RADIUS)) +
                     Math.sin(r * 1.6) * 0.18;
    pos[i * 3 + 2] = Math.sin(angle) * r + (Math.random() - 0.5) * jitter;

    const t = Math.min(r / RADIUS, 1.0);
    if (t < 0.5) tmp.copy(cInner).lerp(cMid, t * 2.0);
    else         tmp.copy(cMid).lerp(cOuter, (t - 0.5) * 2.0);

    // 少量白色高能粒子点缀
    if (Math.random() < 0.04) tmp.lerp(new THREE.Color('#ffffff'), 0.75);

    col[i * 3 + 0] = tmp.r;
    col[i * 3 + 1] = tmp.g;
    col[i * 3 + 2] = tmp.b;

    size[i]  = 0.55 + Math.pow(Math.random(), 2.2) * 1.9;
    phase[i] = Math.random() * Math.PI * 2;
  }

  galaxyGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  galaxyGeo.setAttribute('aColor',   new THREE.BufferAttribute(col, 3));
  galaxyGeo.setAttribute('aSize',    new THREE.BufferAttribute(size, 1));
  galaxyGeo.setAttribute('aPhase',   new THREE.BufferAttribute(phase, 1));
  galaxyGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), RADIUS * 1.5);
}

const galaxyMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms: {
    uTime:       { value: 0 },
    uPixelRatio: { value: renderer.getPixelRatio() },
    uSizeScale:  { value: IS_MOBILE ? 52.0 : 46.0 },
  },
  vertexShader: /* glsl */`
    uniform float uTime;
    uniform float uPixelRatio;
    uniform float uSizeScale;

    attribute float aSize;
    attribute float aPhase;
    attribute vec3  aColor;

    varying vec3  vColor;
    varying float vAlpha;

    void main() {
      vec3 pos = position;

      // —— 差速旋转：半径越小，角速度越大 ——
      float r   = length(pos.xz);
      float ang = atan(pos.z, pos.x);
      ang += uTime * (0.62 / (r + 0.75));
      pos.x = cos(ang) * r;
      pos.z = sin(ang) * r;

      // 盘面上下呼吸
      pos.y += sin(uTime * 1.7 + aPhase + r * 0.5) * 0.14;

      vec4 mv = modelViewMatrix * vec4(pos, 1.0);
      gl_Position = projectionMatrix * mv;

      // 透视衰减的点尺寸
      gl_PointSize = aSize * uPixelRatio * (uSizeScale / max(-mv.z, 0.001));

      vColor = aColor;
      vAlpha = 0.35 + 0.65 * (0.5 + 0.5 * sin(uTime * 2.6 + aPhase));
    }
  `,
  fragmentShader: /* glsl */`
    varying vec3  vColor;
    varying float vAlpha;

    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float d2 = dot(c, c);
      if (d2 > 0.25) discard;

      float a = smoothstep(0.25, 0.0, d2);
      a *= a;                                  // 更柔和的核心

      // 中心更亮
      float core = smoothstep(0.09, 0.0, d2);

      gl_FragColor = vec4(vColor * (1.0 + core * 1.8), a * vAlpha);
    }
  `,
});

const galaxy = new THREE.Points(galaxyGeo, galaxyMat);
galaxy.frustumCulled = false;
scene.add(galaxy);

/* ══════════════════════════════════════════════════════════════
   8. 远景星空
   ══════════════════════════════════════════════════════════════ */
{
  const pos = new Float32Array(STAR_COUNT * 3);
  const col = new Float32Array(STAR_COUNT * 3);
  const tmp = new THREE.Color();

  for (let i = 0; i < STAR_COUNT; i++) {
    const r = 55 + Math.random() * 190;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);

    pos[i * 3 + 0] = Math.sin(phi) * Math.cos(theta) * r;
    pos[i * 3 + 1] = Math.cos(phi) * r * 0.75;
    pos[i * 3 + 2] = Math.sin(phi) * Math.sin(theta) * r;

    tmp.setHSL(0.55 + Math.random() * 0.16, 0.55 + Math.random() * 0.4, 0.6 + Math.random() * 0.35);
    col[i * 3 + 0] = tmp.r;
    col[i * 3 + 1] = tmp.g;
    col[i * 3 + 2] = tmp.b;
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color',    new THREE.BufferAttribute(col, 3));

  const stars = new THREE.Points(g, new THREE.PointsMaterial({
    size: 0.85,
    sizeAttenuation: true,
    vertexColors: true,
    transparent: true,
    opacity: 0.9,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  }));
  stars.frustumCulled = false;
  scene.add(stars);
  scene.userData.stars = stars;
}

/* ══════════════════════════════════════════════════════════════
   9. 环绕碎片（InstancedMesh）
   ══════════════════════════════════════════════════════════════ */
const shards = new THREE.InstancedMesh(
  new THREE.OctahedronGeometry(0.055, 0),
  new THREE.MeshStandardMaterial({
    color: 0xbfe8ff,
    emissive: 0x3a6bff,
    emissiveIntensity: 2.6,
    roughness: 0.15,
    metalness: 0.95,
  }),
  SHARD_COUNT
);
shards.frustumCulled = false;
shards.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(shards);

const shardData = [];
for (let i = 0; i < SHARD_COUNT; i++) {
  shardData.push({
    radius:   2.9 + Math.random() * 3.6,
    theta:    Math.random() * Math.PI * 2,
    phi:      Math.acos(2 * Math.random() - 1),
    speed:    (0.12 + Math.random() * 0.42) * (Math.random() > 0.5 ? 1 : -1),
    spin:     new THREE.Vector3(
      (Math.random() - 0.5) * 3.0,
      (Math.random() - 0.5) * 3.0,
      (Math.random() - 0.5) * 3.0
    ),
    scale:    0.45 + Math.random() * 1.6,
    bob:      Math.random() * Math.PI * 2,
  });
}

const dummy = new THREE.Object3D();

/* ══════════════════════════════════════════════════════════════
   10. 后期处理
   ══════════════════════════════════════════════════════════════ */
const composer = new EffectComposer(renderer);

composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  0.85,   // strength
  0.62,   // radius
  0.18    // threshold
);
composer.addPass(bloomPass);

/* ── 自定义合成：RGB 色差 + 扫描线 + 噪点 + 暗角 ───────────── */
const FXShader = {
  uniforms: {
    tDiffuse: { value: null },
    uTime:    { value: 0 },
    uAmount:  { value: 1.0 },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform float uTime;
    uniform float uAmount;
    varying vec2 vUv;

    void main() {
      vec2 uv  = vUv;
      vec2 dir = uv - 0.5;
      float d  = length(dir);

      // —— 径向色差 ——
      vec2 off = dir * d * 0.042 * uAmount;
      vec3 col;
      col.r = texture2D(tDiffuse, uv + off).r;
      col.g = texture2D(tDiffuse, uv).g;
      col.b = texture2D(tDiffuse, uv - off).b;

      // —— 扫描线 ——
      col += sin(uv.y * 880.0 + uTime * 7.0) * 0.0055;

      // —— 暗角 ——
      col *= smoothstep(1.15, 0.28, d);

      // —— 胶片噪点 ——
      float n = fract(sin(dot(uv * 137.0 + uTime, vec2(12.9898, 78.233))) * 43758.5453);
      col += (n - 0.5) * 0.018;

      gl_FragColor = vec4(col, 1.0);
    }
  `,
};

const fxPass = new ShaderPass(FXShader);
composer.addPass(fxPass);

// OutputPass 负责色调映射 + sRGB 输出
composer.addPass(new OutputPass());

/* ══════════════════════════════════════════════════════════════
   11. 交互
   ══════════════════════════════════════════════════════════════ */
let pulse = 0;                 // 点击冲击波能量 0..1
const pointer = new THREE.Vector2(0, 0);
let pointerDown = null;

renderer.domElement.addEventListener('pointermove', (e) => {
  pointer.x = (e.clientX / innerWidth)  * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
});

renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerDown = { x: e.clientX, y: e.clientY };
});

renderer.domElement.addEventListener('pointerup', (e) => {
  if (!pointerDown) return;
  const dx = e.clientX - pointerDown.x;
  const dy = e.clientY - pointerDown.y;
  // 判定为「点击」而非「拖拽」
  if (dx * dx + dy * dy < 120) pulse = 1.0;
  pointerDown = null;
});

addEventListener('resize', () => {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloomPass.setSize(w, h);
  galaxyMat.uniforms.uPixelRatio.value = renderer.getPixelRatio();
});

/* ══════════════════════════════════════════════════════════════
   12. 主循环
   ══════════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();
let elapsed = 0;
let fpsAcc = 0, fpsFrames = 0;

const fpsEl    = document.getElementById('fps');
const pcountEl = document.getElementById('pcount');
pcountEl.textContent = PARTICLE_COUNT.toLocaleString();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  /* ── 冲击波衰减 ───────────────────────────────────────────── */
  pulse *= Math.pow(0.12, dt);   // 帧率无关的指数衰减

  /* ── 核心变形强度：基础呼吸 + 鼠标 + 冲击波 ───────────────── */
  const breathe = 0.30 + Math.sin(elapsed * 0.9) * 0.045;
  const mouseAmp = pointer.length() * 0.11;
  coreUniforms.uAmp.value  = breathe + mouseAmp + pulse * 0.95;
  coreUniforms.uTime.value = elapsed;
  coreUniforms.uFreq.value = 2.35 + pointer.x * 0.45 + pulse * 1.2;

  /* ── 核心自转 ─────────────────────────────────────────────── */
  coreGroup.rotation.y += dt * 0.17;
  coreGroup.rotation.x  = Math.sin(elapsed * 0.31) * 0.12;

  /* ── 线框外壳反向旋转 + 轻微脉动 ──────────────────────────── */
  shellMesh.rotation.y -= dt * 0.42;
  shellMesh.rotation.z += dt * 0.11;
  const shellPulse = 1.0 + Math.sin(elapsed * 1.5) * 0.022 + pulse * 0.12;
  shellMesh.scale.setScalar(shellPulse);
  shellMesh.material.opacity = 0.075 + pulse * 0.25;

  /* ── 星系粒子 ─────────────────────────────────────────────── */
  galaxyMat.uniforms.uTime.value = elapsed;
  galaxy.rotation.y = elapsed * 0.035;

  /* ── 星空缓慢自转 ─────────────────────────────────────────── */
  scene.userData.stars.rotation.y = elapsed * 0.006;

  /* ── 环绕碎片 ─────────────────────────────────────────────── */
  for (let i = 0; i < SHARD_COUNT; i++) {
    const d = shardData[i];
    d.theta += d.speed * dt;

    const sinPhi = Math.sin(d.phi);
    const rr = d.radius * (1.0 + pulse * 0.22);

    dummy.position.set(
      Math.cos(d.theta) * sinPhi * rr,
      Math.cos(d.phi) * rr * 0.55 + Math.sin(elapsed * 1.1 + d.bob) * 0.22,
      Math.sin(d.theta) * sinPhi * rr
    );

    dummy.rotation.x += d.spin.x * dt;
    dummy.rotation.y += d.spin.y * dt;
    dummy.rotation.z += d.spin.z * dt;

    dummy.scale.setScalar(d.scale * (1.0 + pulse * 0.5));
    dummy.updateMatrix();
    shards.setMatrixAt(i, dummy.matrix);
  }
  shards.instanceMatrix.needsUpdate = true;

  /* ── 灯光跟随 ─────────────────────────────────────────────── */
  keyLight.position.set(
    Math.cos(elapsed * 0.5) * 7,
    6 + Math.sin(elapsed * 0.7) * 2.5,
    Math.sin(elapsed * 0.5) * 7
  );
  rimLight.position.set(
    Math.cos(elapsed * 0.5 + Math.PI) * 8,
    -4 + Math.cos(elapsed * 0.9) * 2,
    Math.sin(elapsed * 0.5 + Math.PI) * 8
  );

  /* ── 后期参数 ─────────────────────────────────────────────── */
  fxPass.uniforms.uTime.value   = elapsed;
  fxPass.uniforms.uAmount.value = 1.0 + pulse * 3.4;
  bloomPass.strength            = 0.85 + pulse * 1.1;

  /* ── 相机轻微视差 ─────────────────────────────────────────── */
  camera.position.x += (pointer.x * 0.55 - camera.position.x * 0.0) * 0.0; // 交给 controls

  controls.update();
  composer.render();

  /* ── FPS ──────────────────────────────────────────────────── */
  fpsAcc += dt;
  fpsFrames++;
  if (fpsAcc >= 0.5) {
    fpsEl.textContent = Math.round(fpsFrames / fpsAcc);
    fpsAcc = 0;
    fpsFrames = 0;
  }
}

/* ══════════════════════════════════════════════════════════════
   13. 启动
   ══════════════════════════════════════════════════════════════ */
animate();

// 首帧后淡出 loading
requestAnimationFrame(() => {
  requestAnimationFrame(() => {
    const el = document.getElementById('loading');
    el.classList.add('hide');
    setTimeout(() => el.remove(), 1000);
  });
});
</script>
</body>
