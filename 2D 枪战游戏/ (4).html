<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="screen-orientation" content="landscape">
<meta name="x5-orientation" content="landscape">
<title>竞技场枪战 · Arena Gunfight</title>
<style>
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    overflow:hidden;background:#0a0c10;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  #cv{
    display:block;width:100vw;height:100vh;
    touch-action:none;cursor:none;
  }
  #rotate{
    position:fixed;inset:0;display:none;
    align-items:center;justify-content:center;
    background:#0a0c10;color:#4ecdc4;
    font-size:20px;letter-spacing:2px;z-index:99;
    flex-direction:column;gap:16px;
  }
  #rotate svg{width:64px;height:64px;animation:rot 1.6s ease-in-out infinite;}
  @keyframes rot{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
  @media (orientation:portrait){
    #rotate{display:flex;}
    #cv{visibility:hidden;}
  }

  /* ================= 作弊面板 ================= */
  #cheatToggle{
    position:fixed; top:80px; right:16px; z-index:60;
    width:44px; height:44px; border-radius:50%;
    background:rgba(8,10,14,0.78);
    border:2px solid #4ecdc4; color:#4ecdc4;
    font-size:20px; font-weight:bold; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    user-select:none; touch-action:manipulation;
    transition:transform .15s; padding:0; outline:none;
  }
  #cheatToggle:hover{ transform:scale(1.08); }
  #cheatToggle.on{ background:#4ecdc4; color:#0a0c10; }

  #cheatPanel{
    position:fixed; top:132px; right:16px; z-index:61;
    width:310px; max-height:calc(100vh - 152px);
    overflow:hidden;
    background:rgba(10,13,20,0.96);
    border:2px solid #4ecdc4; border-radius:12px;
    color:#dfe9f7; font-size:13px;
    box-shadow:0 8px 32px rgba(0,0,0,0.6);
    display:none;
    backdrop-filter:blur(6px);
    box-sizing:border-box;
    flex-direction:column;
  }
  #cheatPanel.show{ display:flex; }

  .cheat-tabs{
    display:flex; flex-wrap:wrap; gap:2px;
    padding:8px 8px 0;
    border-bottom:1px solid rgba(78,205,196,0.25);
    background:rgba(6,9,15,0.9);
    border-radius:10px 10px 0 0;
  }
  .cheat-tab{
    background:transparent; border:none;
    color:#7d8ba3; font-size:11.5px; font-weight:bold;
    padding:6px 8px; cursor:pointer;
    border-radius:6px 6px 0 0;
    transition:all .15s;
    font-family:inherit;
  }
  .cheat-tab:hover{ color:#a8c4d8; }
  .cheat-tab.active{
    color:#4ecdc4; background:rgba(78,205,196,0.12);
    box-shadow:inset 0 -2px 0 #4ecdc4;
  }

  .cheat-content{
    padding:10px 12px 16px;
    overflow-y:auto;
    flex:1;
    max-height:calc(100vh - 210px);
  }
  .cheat-content::-webkit-scrollbar{ width:6px; }
  .cheat-content::-webkit-scrollbar-thumb{
    background:rgba(78,205,196,0.4); border-radius:3px;
  }
  .cheat-tab-page{ display:none; }
  .cheat-tab-page.active{ display:block; }

  .cheatRow{
    display:flex; align-items:center; justify-content:space-between;
    margin:7px 0; gap:8px; min-height:24px;
  }
  .cheatRow label{
    flex:1; color:#a8b7cc; font-size:12px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .cheatRow input[type=number]{
    width:88px; padding:4px 7px;
    background:rgba(30,38,54,0.9);
    border:1px solid #3a4a66; border-radius:5px;
    color:#e9f1fb; font-size:12px; text-align:right;
    box-sizing:border-box;
  }
  .cheatRow input[type=number]:focus{
    outline:none; border-color:#4ecdc4;
    background:rgba(40,50,70,0.95);
  }
  .cheatRow input[type=range]{
    width:110px; accent-color:#4ecdc4;
  }
  .cheatRow .val{
    width:44px; text-align:right; color:#ffe066;
    font-weight:bold; font-size:11.5px;
  }

  .cheatSwitch{
    position:relative; width:44px; height:24px;
    background:#2a3346; border-radius:12px;
    cursor:pointer; transition:background .2s;
    flex-shrink:0;
  }
  .cheatSwitch::after{
    content:''; position:absolute; top:2px; left:2px;
    width:20px; height:20px; border-radius:50%;
    background:#8a97ad; transition:all .2s;
  }
  .cheatSwitch.on{ background:#4ecdc4; }
  .cheatSwitch.on::after{ left:22px; background:#0a0c10; }

  .cheatBtn{
    display:block; width:100%; padding:7px;
    margin-top:6px;
    background:rgba(78,205,196,0.12);
    border:1px solid #4ecdc4; border-radius:7px;
    color:#4ecdc4; font-size:12px; font-weight:bold;
    cursor:pointer; transition:all .15s;
    box-sizing:border-box; font-family:inherit;
  }
  .cheatBtn:hover{ background:#4ecdc4; color:#0a0c10; }
  .cheatBtn.danger{
    border-color:#ff6b6b; color:#ff6b6b;
    background:rgba(255,107,107,0.08);
  }
  .cheatBtn.danger:hover{ background:#ff6b6b; color:#0a0c10; }

  .weapon-tabs{
    display:flex; gap:4px; margin-bottom:10px;
    padding-bottom:8px;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .weapon-tab{
    flex:1; padding:6px 4px;
    background:rgba(30,38,54,0.5);
    border:1px solid #3a4a66; border-radius:6px;
    color:#8a97ad; font-size:11.5px; font-weight:bold;
    cursor:pointer; transition:all .15s;
    font-family:inherit;
  }
  .weapon-tab:hover{ color:#a8c4d8; }
  .weapon-tab.active{
    background:rgba(78,205,196,0.20);
    border-color:#4ecdc4; color:#4ecdc4;
  }

  .section-title{
    font-size:10.5px; color:#6d7c94;
    text-transform:uppercase; letter-spacing:1px;
    margin:12px 0 4px; padding-top:8px;
    border-top:1px solid rgba(255,255,255,0.06);
  }
  .section-title:first-child{ border-top:none; padding-top:0; margin-top:0; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="rotate">
  <svg viewBox="0 0 24 24" fill="none" stroke="#4ecdc4" stroke-width="1.6">
    <rect x="6" y="2" width="12" height="20" rx="2"/>
    <circle cx="12" cy="18" r="1"/>
  </svg>
  <div>请横屏使用以获得最佳体验</div>
</div>

<!-- ============ 作弊面板 ============ -->
<button id="cheatToggle" title="作弊面板 (F8)">⚙</button>

<div id="cheatPanel">
  <div class="cheat-tabs">
    <button class="cheat-tab active" data-tab="player">玩家</button>
    <button class="cheat-tab" data-tab="weapons">武器</button>
    <button class="cheat-tab" data-tab="enemies">敌人</button>
    <button class="cheat-tab" data-tab="waves">波次</button>
    <button class="cheat-tab" data-tab="pickups">道具</button>
    <button class="cheat-tab" data-tab="camera">相机</button>
    <button class="cheat-tab" data-tab="cheats">开关</button>
  </div>

  <div class="cheat-content">
    <!-- ===== 玩家 ===== -->
    <div class="cheat-tab-page active" data-page="player">
      <div class="cheatRow"><label>当前血量</label><input type="number" id="cHp" step="10"></div>
      <div class="cheatRow"><label>最大血量</label><input type="number" id="cMaxHp" step="10" min="1"></div>
      <div class="cheatRow"><label>移动速度</label><input type="number" id="cSpeed" step="10" min="0"></div>
      <div class="cheatRow"><label>冲刺速度</label><input type="number" id="cDashSpeed" step="50" min="0"></div>
      <div class="cheatRow"><label>冲刺时长(s)</label><input type="number" id="cDashDur" step="0.05" min="0"></div>
      <div class="cheatRow"><label>冲刺冷却(s)</label><input type="number" id="cDashCd" step="0.1" min="0"></div>
      <div class="cheatRow"><label>碰撞半径</label><input type="number" id="cRadius" step="1" min="4"></div>
      <div class="cheatRow"><label>加速平滑</label><input type="number" id="cAccel" step="1" min="1"></div>
    </div>

    <!-- ===== 武器 ===== -->
    <div class="cheat-tab-page" data-page="weapons">
      <div class="weapon-tabs">
        <button class="weapon-tab active" data-weapon="pistol">手枪</button>
        <button class="weapon-tab" data-weapon="rifle">步枪</button>
        <button class="weapon-tab" data-weapon="shotgun">霰弹枪</button>
      </div>
      <div class="cheatRow"><label>伤害</label><input type="number" id="wDamage" step="1" min="0"></div>
      <div class="cheatRow"><label>射速(秒/发)</label><input type="number" id="wFireRate" step="0.01" min="0.005"></div>
      <div class="cheatRow"><label>弹匣容量</label><input type="number" id="wMag" step="1" min="1"></div>
      <div class="cheatRow"><label>换弹时间(s)</label><input type="number" id="wReload" step="0.1" min="0.01"></div>
      <div class="cheatRow"><label>散布</label><input type="number" id="wSpread" step="0.005" min="0"></div>
      <div class="cheatRow"><label>后坐力</label><input type="number" id="wRecoil" step="0.1" min="0"></div>
      <div class="cheatRow"><label>最大后坐力</label><input type="number" id="wMaxRecoil" step="1" min="0"></div>
      <div class="cheatRow"><label>子弹速度</label><input type="number" id="wBulletSpeed" step="50" min="100"></div>
      <div class="cheatRow"><label>子弹存活(s)</label><input type="number" id="wBulletLife" step="0.05" min="0.05"></div>
      <div class="cheatRow"><label>弹丸数</label><input type="number" id="wPellets" step="1" min="1"></div>
      <div class="cheatRow"><label>震动强度</label><input type="number" id="wShake" step="0.5" min="0"></div>
      <button class="cheatBtn" id="wApplyAll">应用所有武器超神参数</button>
    </div>

    <!-- ===== 敌人 ===== -->
    <div class="cheat-tab-page" data-page="enemies">
      <div class="section-title">敌人属性倍率（影响新生成敌人）</div>
      <div class="cheatRow"><label>血量倍率</label><input type="number" id="eHpMul" step="0.5" min="0"></div>
      <div class="cheatRow"><label>伤害倍率</label><input type="number" id="eDmgMul" step="0.5" min="0"></div>
      <div class="cheatRow"><label>速度倍率</label><input type="number" id="eSpdMul" step="0.1" min="0"></div>
      <button class="cheatBtn" id="eApplyNow">立即应用到现有敌人</button>

      <div class="section-title">基础属性（每种敌人）</div>
      <div class="cheatRow"><label>冲锋兵血量</label><input type="number" id="eRusherHp" step="5" min="1"></div>
      <div class="cheatRow"><label>冲锋兵速度</label><input type="number" id="eRusherSpd" step="10" min="0"></div>
      <div class="cheatRow"><label>冲锋兵伤害</label><input type="number" id="eRusherDmg" step="1" min="0"></div>
      <div class="cheatRow"><label>射手血量</label><input type="number" id="eShooterHp" step="5" min="1"></div>
      <div class="cheatRow"><label>射手速度</label><input type="number" id="eShooterSpd" step="10" min="0"></div>
      <div class="cheatRow"><label>射手伤害</label><input type="number" id="eShooterDmg" step="1" min="0"></div>
      <div class="cheatRow"><label>精英血量</label><input type="number" id="eEliteHp" step="10" min="1"></div>
      <div class="cheatRow"><label>精英速度</label><input type="number" id="eEliteSpd" step="10" min="0"></div>
      <div class="cheatRow"><label>精英伤害</label><input type="number" id="eEliteDmg" step="1" min="0"></div>
    </div>

    <!-- ===== 波次 ===== -->
    <div class="cheat-tab-page" data-page="waves">
      <div class="cheatRow"><label>最大波数</label><input type="number" id="wMaxWave" step="1" min="1"></div>
      <div class="cheatRow"><label>首波敌人基数</label><input type="number" id="wBaseCount" step="1" min="0"></div>
      <div class="cheatRow"><label>每波递增数量</label><input type="number" id="wPerWave" step="1" min="0"></div>
      <div class="cheatRow"><label>每波敌人数上限</label><input type="number" id="wMaxCount" step="1" min="1"></div>
      <div class="cheatRow"><label>波次间隔(s)</label><input type="number" id="wIntermission" step="0.5" min="0"></div>
      <div class="section-title">难度成长曲线</div>
      <div class="cheatRow"><label>每波血+%</label><input type="number" id="wHpScale" step="0.01" min="0"></div>
      <div class="cheatRow"><label>每波伤+%</label><input type="number" id="wDmgScale" step="0.01" min="0"></div>
      <div class="cheatRow"><label>每波速+%</label><input type="number" id="wSpdScale" step="0.01" min="0"></div>
    </div>

    <!-- ===== 道具 ===== -->
    <div class="cheat-tab-page" data-page="pickups">
      <div class="cheatRow"><label>回复量</label><input type="number" id="cHeal" step="5" min="0"></div>
      <div class="cheatRow"><label>掉落概率</label><input type="range" id="cDrop" min="0" max="1" step="0.05"><span class="val" id="cDropVal">0.30</span></div>
      <div class="cheatRow"><label>精英必掉</label><input type="range" id="cEliteDrop" min="0" max="1" step="0.05"><span class="val" id="cEliteDropVal">1.00</span></div>
      <div class="cheatRow"><label>存活时间(s)</label><input type="number" id="cLife" step="1" min="1"></div>
      <div class="cheatRow"><label>地图刷新间隔(s)</label><input type="number" id="cSpawn" step="1" min="0"></div>
      <div class="cheatRow"><label>地图上限</label><input type="number" id="cMaxOnMap" step="1" min="0"></div>
      <div class="cheatRow"><label>磁吸范围</label><input type="number" id="cMagnet" step="10" min="0"></div>
      <div class="cheatRow"><label>满血转分数</label><input type="number" id="cScoreBonus" step="5" min="0"></div>
    </div>

    <!-- ===== 相机 ===== -->
    <div class="cheat-tab-page" data-page="camera">
      <div class="cheatRow"><label>跟随平滑度</label><input type="number" id="camSmooth" step="0.5" min="0.1"></div>
      <div class="cheatRow"><label>瞄准前瞻</label><input type="number" id="camLead" step="20" min="0"></div>
      <div class="cheatRow"><label>前瞻距离</label><input type="number" id="camLeadDist" step="20" min="1"></div>
      <div class="cheatRow"><label>震动衰减</label><input type="number" id="camShake" step="0.5" min="0.5"></div>
    </div>

    <!-- ===== 开关 ===== -->
    <div class="cheat-tab-page" data-page="cheats">
      <div class="cheatRow"><label>无敌模式</label><div class="cheatSwitch" id="cGod"></div></div>
      <div class="cheatRow"><label>无限弹药</label><div class="cheatSwitch" id="cInfAmmo"></div></div>
      <div class="cheatRow"><label>秒杀敌人</label><div class="cheatSwitch" id="cOneShot"></div></div>
      <div class="cheatRow"><label>无限冲刺</label><div class="cheatSwitch" id="cInfDash"></div></div>
      <div class="cheatRow"><label>无后坐力</label><div class="cheatSwitch" id="cNoRecoil"></div></div>
      <div class="cheatRow"><label>玩家子弹穿墙</label><div class="cheatSwitch" id="cBulletWall"></div></div>
      <div class="cheatRow"><label>敌人子弹穿墙</label><div class="cheatSwitch" id="cEnemyBulletWall"></div></div>
      <div class="cheatRow"><label>敌人不动</label><div class="cheatSwitch" id="cEnemyFreeze"></div></div>
      <div class="cheatRow"><label>敌人不攻击</label><div class="cheatSwitch" id="cEnemyPassive"></div></div>
      <div class="cheatRow"><label>子弹无限射程</label><div class="cheatSwitch" id="cInfRange"></div></div>

      <div class="section-title">快捷操作</div>
      <button class="cheatBtn" id="cHealFull">回满血</button>
      <button class="cheatBtn" id="cClearEnemies">清屏（杀死所有敌人）</button>
      <button class="cheatBtn" id="cNextWave">跳过本波</button>
      <button class="cheatBtn danger" id="cReset">重置所有作弊</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* =========================================================================
   竞技场枪战 —— 2D 俯视角射击（含作弊面板）
   ========================================================================= */

/* ====================== 1. 常量与配置 ====================== */

const PI2 = Math.PI * 2;

const CFG = {
  world:  { w: 2560, h: 1440 },

  camera: {
    smooth:  7.0,
    maxLead: 110,
    leadDist:420,
    shakeDecay: 9.0,
  },

  player: {
    hp:        100,
    speed:     255,

  },

  wave: {

    baseCount: 2,

    eliteDropChance: 1.00,

    maxOnMap:        6,

  }
};

/** 作弊开关 */
const CHEAT = {

  enemyBulletPierce: false,
  enemyFreeze:       false,
  enemyPassive:      false,
  god:               false,
  infAmmo:           false,
  oneShot:           false,
  infDash:           false,
  noRecoil:          false,
  infRange:          false
};

/** 敌人属性倍率 */
const ENEMY_MUL = { hp: 1, dmg: 1, spd: 1 };

const WEAPONS = {
  pistol: {
    name:'手枪', damage:26, fireRate:0.26, mag:12, reload:1.10,
    spread:0.035, recoil:1.4, maxRecoil:5,
    bulletSpeed:1150, bulletLife:0.85, pellets:1,
    auto:false, color:'#ffe066', shake:3.0
  },
  rifle: {
    name:'步枪', damage:13, fireRate:0.085, mag:30, reload:1.70,
    spread:0.055, recoil:0.55, maxRecoil:6,
    bulletSpeed:1400, bulletLife:0.75, pellets:1,
    auto:true, color:'#7ee787', shake:1.6
  },

    spread:0.130, recoil:5.0, maxRecoil:10,

    auto:false, color:'#ff9f43', shake:9.0
  }
};
const WEAPON_ORDER = ['pistol','rifle','shotgun'];

const ENEMY_TYPES = {
  rusher: {
    name:'冲锋兵', hp:45, speed:168, radius:15,
    color:'#ff6b6b', accent:'#ffb3b3',
    melee:true, ranged:false,
    attackRange:30, attackCd:0.85, damage:11,
    sightRange:900, score:100
  },
  shooter: {
    name:'射手', hp:60, speed:118, radius:16,
    color:'#feca57', accent:'#fff3c4',
    melee:false, ranged:true,

    bulletSpeed:620, bulletLife:1.10, mag:6, reloadTime:2.0,
    sightRange:760, score:150
  },
  elite: {
    name:'精英', hp:200, speed:92, radius:24,
    color:'#a55eea', accent:'#d6b6ff',
    melee:false, ranged:true,
    range:640, keepDist:360, fireCd:0.95, damage:15,
    bulletSpeed:700, bulletLife:1.20, mag:8, reloadTime:2.6,
    sightRange:920, score:400
  }
};

const OBSTACLES = [
  { x:1180, y: 640, w:200, h:160 },
  { x: 300, y: 220, w:220, h: 60 },
  { x: 300, y:1160, w:220, h: 60 },
  { x:2040, y: 220, w:220, h: 60 },
  { x:2040, y:1160, w:220, h: 60 },
  { x: 820, y: 480, w: 60, h:260 },
  { x:1680, y: 700, w: 60, h:260 },
  { x:1100, y: 180, w: 60, h:180 },
  { x:1400, y:1080, w: 60, h:180 },
  { x: 560, y: 700, w:180, h: 60 },
  { x:1820, y: 680, w:180, h: 60 },
  { x:1180, y: 200, w:200, h: 50 },
  { x:1180, y:1190, w:200, h: 50 },
];

/* ====================== 2. 工具 ====================== */

const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
const lerp  = (a,b,t) => a + (b-a)*t;
const rand  = (a,b) => a + Math.random()*(b-a);
const randInt = (a,b) => Math.floor(rand(a,b+1));
const pick  = arr => arr[Math.floor(Math.random()*arr.length)];
const smoothK = (rate, dt) => 1 - Math.exp(-rate * dt);

function roundRect(c, x, y, w, h, r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y,   x+w, y+h, r);
  c.arcTo(x+w, y+h, x,   y+h, r);
  c.arcTo(x,   y+h, x,   y,   r);
  c.arcTo(x,   y,   x+w, y,   r);
  c.closePath();
}

function rayRect(x, y, dx, dy, rx, ry, rw, rh){
  let tmin = -Infinity, tmax = Infinity;
  if (Math.abs(dx) < 1e-9){
    if (x < rx || x > rx+rw) return -1;
  } else {
    let t1 = (rx - x)/dx, t2 = (rx + rw - x)/dx;
    if (t1 > t2){ const t = t1; t1 = t2; t2 = t; }
    tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
  }
  if (Math.abs(dy) < 1e-9){
    if (y < ry || y > ry+rh) return -1;
  } else {
    let t1 = (ry - y)/dy, t2 = (ry + rh - y)/dy;
    if (t1 > t2){ const t = t1; t1 = t2; t2 = t; }
    tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
  }
  if (tmax < Math.max(tmin, 0)) return -1;
  return tmin >= 0 ? tmin : 0;
}

/* ====================== 3. 音效 ====================== */

const Sfx = {
  ctx: null, enabled: true,
  init(){
    if (this.ctx) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { this.enabled = false; return; }
      this.ctx = new AC();
    } catch(e){ this.enabled = false; }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, dur, type, vol, slideTo){
    if (!this.enabled || !this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, filterFreq){
    if (!this.enabled || !this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    const len = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src = c.createBufferSource(); src.buffer = buf;
    const flt = c.createBiquadFilter();
    flt.type = 'lowpass'; flt.frequency.value = filterFreq || 1800;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(c.destination);
    src.start(t);
  },
  shoot(key){
    if (key === 'shotgun'){ this.noise(0.18, 0.10, 1200); this.tone(160, 0.10, 'sawtooth', 0.05, 60); }
    else if (key === 'rifle'){ this.noise(0.05, 0.045, 2600); this.tone(420, 0.04, 'square', 0.028, 180); }
    else { this.noise(0.07, 0.06, 2000); this.tone(320, 0.06, 'square', 0.04, 110); }
  },
  enemyShoot(){ this.tone(680, 0.06, 'triangle', 0.022, 300); },
  hurt(){ this.tone(180, 0.16, 'sawtooth', 0.05, 70); },
  explode(){ this.noise(0.35, 0.10, 900); this.tone(110, 0.30, 'sawtooth', 0.05, 40); },
  reloadStart(){ this.tone(520, 0.05, 'square', 0.03, 380); },
  reloadDone(){ this.tone(760, 0.07, 'square', 0.035, 980); },
  dash(){ this.noise(0.14, 0.045, 3200); },
  click(){ this.tone(900, 0.035, 'square', 0.025); },
  wave(){ this.tone(440, 0.12, 'triangle', 0.05, 660); setTimeout(()=>this.tone(660,0.14,'triangle',0.05,880),110); },
  pickup(){ this.tone(660, 0.08, 'triangle', 0.05, 990); setTimeout(()=>this.tone(990,0.10,'triangle',0.045,1320),70); }
};

const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d', { alpha:false });

let cssW = 0, cssH = 0, dpr = 1, zoom = 1;
const BASE_VIEW_H = 720;

const cam = { x: 0, y: 0 };
let shakeAmt = 0;

function resize(){
  const w = window.innerWidth;
  const h = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cssW = w; cssH = h;
  canvas.width  = Math.max(1, Math.floor(w * dpr));
  canvas.height = Math.max(1, Math.floor(h * dpr));
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
  zoom = clamp(h / BASE_VIEW_H, 0.40, 1.9);
  cam.x = clampCam(cam.x, CFG.world.w, viewW()/2);
  cam.y = clampCam(cam.y, CFG.world.h, viewH()/2);
}

const viewW = () => cssW / zoom;
const viewH = () => cssH / zoom;

function clampCam(v, worldSize, half){
  if (worldSize <= half * 2) return worldSize / 2;
  return clamp(v, half, worldSize - half);
}

function screenToWorld(sx, sy){
  return {
    x: (sx - cssW/2) / zoom + cam.x,
    y: (sy - cssH/2) / zoom + cam.y
  };
}

const STICK_MAXD = 62;

const rightBase  = () => ({ x: cssW - Math.max(104, cssW*0.115), y: cssH - Math.max(100, cssH*0.20) });

function hitCircle(px, py, c){
  const dx = px - c.x, dy = py - c.y;
  return dx*dx + dy*dy <= c.r*c.r;
}

window.addEventListener('keydown', e => {

canvas.addEventListener('mousemove', e => {

});
canvas.addEventListener('mousedown', e => {

});
window.addEventListener('mouseup', e => { if (e.button === 0) input.firing = false; });
canvas.addEventListener('mouseleave', () => { input.firing = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

function touchPos(t){
  const r = canvas.getBoundingClientRect();
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}

function updateStick(s, px, py){
  let dx = px - s.ox, dy = py - s.oy;
  let d = Math.hypot(dx, dy);
  if (d > STICK_MAXD){ dx = dx/d*STICK_MAXD; dy = dy/d*STICK_MAXD; d = STICK_MAXD; }
  s.x = s.ox + dx; s.y = s.oy + dy;
  s.nx = dx / STICK_MAXD; s.ny = dy / STICK_MAXD;
  s.mag = d / STICK_MAXD;
  if (d > 4) s.angle = Math.atan2(dy, dx);
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  input.usingTouch = true;
  Sfx.init();

  for (const t of e.changedTouches){
    const p = touchPos(t);
    if (G.state !== 'playing'){ handleUITap(p.x, p.y); continue; }

    if (hitCircle(p.x, p.y, pauseBtn())){ togglePause(); continue; }
    if (hitCircle(p.x, p.y, dashBtn())){ tryDash(); continue; }
    if (hitCircle(p.x, p.y, switchBtn())){ cycleWeapon(); continue; }

    const lb = leftBase(), rb = rightBase();
    const dL = Math.hypot(p.x - lb.x, p.y - lb.y);
    const dR = Math.hypot(p.x - rb.x, p.y - rb.y);

    if (dL < 150 && !stickMove.active){
      stickMove.active = true; stickMove.id = t.identifier;
      stickMove.ox = lb.x; stickMove.oy = lb.y;
      updateStick(stickMove, p.x, p.y);
    } else if (dR < 165 && !stickAim.active){
      stickAim.active = true; stickAim.id = t.identifier;
      stickAim.ox = rb.x; stickAim.oy = rb.y;
      updateStick(stickAim, p.x, p.y);
    }
  }
}, { passive:false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches){
    const p = touchPos(t);
    if (stickMove.active && t.identifier === stickMove.id) updateStick(stickMove, p.x, p.y);
    if (stickAim.active  && t.identifier === stickAim.id)  updateStick(stickAim,  p.x, p.y);
  }
}, { passive:false });

function endTouch(e){
  e.preventDefault();
  for (const t of e.changedTouches){
    if (stickMove.active && t.identifier === stickMove.id){
      stickMove.active = false; stickMove.id = null;
      stickMove.nx = stickMove.ny = stickMove.mag = 0;
    }
    if (stickAim.active && t.identifier === stickAim.id){
      stickAim.active = false; stickAim.id = null;
      stickAim.nx = stickAim.ny = stickAim.mag = 0;
    }
  }
}
canvas.addEventListener('touchend', endTouch, { passive:false });
canvas.addEventListener('touchcancel', endTouch, { passive:false });

/* ====================== 6. 地图与碰撞 ====================== */

const W = CFG.world.w, H = CFG.world.h;

function collideObstacles(ent){
  for (let i = 0; i < OBSTACLES.length; i++){
    const o = OBSTACLES[i];
    const cx = clamp(ent.x, o.x, o.x + o.w);
    const cy = clamp(ent.y, o.y, o.y + o.h);
    let dx = ent.x - cx, dy = ent.y - cy;
    const d2 = dx*dx + dy*dy;
    if (d2 < ent.r * ent.r){
      if (d2 > 1e-6){
        const d = Math.sqrt(d2);
        const push = ent.r - d;
        ent.x += dx / d * push;
        ent.y += dy / d * push;
      } else {
        const left = ent.x - o.x, right = o.x + o.w - ent.x;
        const top  = ent.y - o.y, bottom = o.y + o.h - ent.y;
        const m = Math.min(left, right, top, bottom);
        if (m === left)        ent.x = o.x - ent.r;
        else if (m === right)  ent.x = o.x + o.w + ent.r;
        else if (m === top)    ent.y = o.y - ent.r;
        else                   ent.y = o.y + o.h + ent.r;
      }
    }
  }
}

function pointInObstacle(x, y, pad){
  pad = pad || 0;
  for (let i = 0; i < OBSTACLES.length; i++){
    const o = OBSTACLES[i];
    if (x > o.x - pad && x < o.x + o.w + pad && y > o.y - pad && y < o.y + o.h + pad) return true;
  }
  return false;
}

function hasLineOfSight(x1, y1, x2, y2){
  const dx = x2 - x1, dy = y2 - y1;
  for (let i = 0; i < OBSTACLES.length; i++){
    const o = OBSTACLES[i];
    const t = rayRect(x1, y1, dx, dy, o.x, o.y, o.w, o.h);
    if (t >= 0 && t <= 1) return false;
  }
  return true;
}

function findSpawnPoint(){
  for (let i = 0; i < 120; i++){
    const x = rand(90, W - 90);
    const y = rand(90, H - 90);
    const dx = x - player.x, dy = y - player.y;
    if (dx*dx + dy*dy < 520*520) continue;
    if (pointInObstacle(x, y, 34)) continue;
    return { x, y };
  }
  return { x: rand(120, W-120), y: rand(120, H-120) };
}

/* ====================== 8. 游戏逻辑 ====================== */

function startWave(n){
  G.wave = n;
  if (n > CFG.wave.maxWave){ G.state = 'victory'; return; }

  const count = Math.min(CFG.wave.baseCount + n * CFG.wave.perWave, CFG.wave.maxCount);
  const interval = Math.max(0.28, 0.9 - n * 0.045);
  const q = [];
  for (let i = 0; i < count; i++){
    let type = 'rusher';
    if (n >= 2 && i % 3 === 1) type = 'shooter';
    if (n >= 4 && i % 7 === 6) type = 'elite';
    q.push({ type, at: i * interval });
  }
  G.spawnQueue = q;
  G.spawnTimer = 0;
  G.waveActive = true;
  G.banner = { text: '第 ' + n + ' 波', sub: '敌人来袭', t: 2.2 };
  Sfx.wave();
}

function updateSpawns(dt){
  if (G.spawnQueue.length){
    G.spawnTimer += dt;
    while (G.spawnQueue.length && G.spawnQueue[0].at <= G.spawnTimer){
      const s = G.spawnQueue.shift();
      const p = findSpawnPoint();
      enemies.push(makeEnemy(s.type, p.x, p.y));
      spawnParticles(p.x, p.y, 10, '#7b8fb3', 140, 0.45);
    }
  }
  if (G.nextWaveTimer > 0){
    G.nextWaveTimer -= dt;
    if (G.nextWaveTimer <= 0) startWave(G.wave + 1);
  }
  if (G.waveActive && G.spawnQueue.length === 0 && enemies.length === 0){
    G.waveActive = false;
    if (G.wave >= CFG.wave.maxWave){
      G.state = 'victory';
    } else {
      G.nextWaveTimer = CFG.wave.intermission;
      G.banner = { text: '第 ' + G.wave + ' 波清除', sub: '下一波 ' + CFG.wave.intermission.toFixed(0) + ' 秒', t: 2.0 };
    }
  }
}

function startDash(){
  if (player.dashCd > 0 || player.dashTime > 0) return;
  let dx = 0, dy = 0;
  if (input.usingTouch){
    dx = stickMove.nx; dy = stickMove.ny;
  } else {
    if (input.keys['KeyW'] || input.keys['ArrowUp'])    dy -= 1;
    if (input.keys['KeyS'] || input.keys['ArrowDown'])  dy += 1;
    if (input.keys['KeyA'] || input.keys['ArrowLeft'])  dx -= 1;
    if (input.keys['KeyD'] || input.keys['ArrowRight']) dx += 1;
    if (dx === 0 && dy === 0){ dx = Math.cos(player.angle); dy = Math.sin(player.angle); }
  }
  const l = Math.hypot(dx, dy);
  if (l < 0.01) return;
  player.dashDirX = dx / l;
  player.dashDirY = dy / l;
  player.dashTime = CFG.player.dashDur;
  player.dashCd = CHEAT.infDash ? 0 : CFG.player.dashCd;
  spawnParticles(player.x, player.y, 12, '#4ecdc4', 160, 0.35, Math.atan2(-player.dashDirY, -player.dashDirX));
  shake(3);
  Sfx.dash();
}

function tryDash(){
  if (G.state === 'playing') startDash();
}

function updatePlayer(dt){
  if (player.hitFlash > 0) player.hitFlash -= dt;
  if (player.dashCd > 0) player.dashCd -= dt;

  let mx = 0, my = 0;
  if (input.usingTouch){
    if (stickMove.active && stickMove.mag > 0.12){ mx = stickMove.nx; my = stickMove.ny; }
  } else {
    if (input.keys['KeyW'] || input.keys['ArrowUp'])    my -= 1;
    if (input.keys['KeyS'] || input.keys['ArrowDown'])  my += 1;
    if (input.keys['KeyA'] || input.keys['ArrowLeft'])  mx -= 1;
    if (input.keys['KeyD'] || input.keys['ArrowRight']) mx += 1;
  }
  const ml = Math.hypot(mx, my);
  if (ml > 1){ mx /= ml; my /= ml; }

  if (!input.usingTouch && (input.keys['ShiftLeft'] || input.keys['ShiftRight'])){
    if (player.dashCd <= 0 && player.dashTime <= 0) startDash();
  }

  if (player.dashTime > 0){
    player.dashTime -= dt;
    player.vx = player.dashDirX * CFG.player.dashSpeed;
    player.vy = player.dashDirY * CFG.player.dashSpeed;
    if (Math.random() < 0.7) spawnParticles(player.x, player.y, 1, 'rgba(78,205,196,0.6)', 40, 0.22);
  } else {
    const targetVx = mx * CFG.player.speed;
    const targetVy = my * CFG.player.speed;
    const k = smoothK(CFG.player.accel, dt);
    player.vx = lerp(player.vx, targetVx, k);
    player.vy = lerp(player.vy, targetVy, k);
  }

  player.x += player.vx * dt;
  player.y += player.vy * dt;

  collideObstacles(player);
  player.x = clamp(player.x, player.r, W - player.r);
  player.y = clamp(player.y, player.r, H - player.r);

  if (input.usingTouch){
    if (stickAim.active && stickAim.mag > 0.18) player.angle = stickAim.angle;
  } else {
    const wpt = screenToWorld(input.mouseX, input.mouseY);
    player.angle = Math.atan2(wpt.y - player.y, wpt.x - player.x);
  }

  updateWeapons(dt);
}

function updateWeapons(dt){
  const ws = curWeapon();
  const w = WEAPONS[ws.key];

  if (ws.cd > 0) ws.cd -= dt;
  if (ws.recoil > 0) ws.recoil = Math.max(0, ws.recoil - dt * 14);

  if (ws.reloading){
    ws.reloadT -= dt;
    if (ws.reloadT <= 0){
      ws.reloading = false;
      ws.ammo = w.mag;
      Sfx.reloadDone();
    }
    return;
  }

  const wantFire = input.usingTouch
    ? (stickAim.active && stickAim.mag > 0.30)
    : input.firing;

  if (!wantFire || ws.cd > 0) return;

  if (ws.ammo <= 0 && !CHEAT.infAmmo){ startReload(); return; }
  fireWeapon(ws, w);
}

function fireWeapon(ws, w){
  if (!CHEAT.infAmmo) ws.ammo--;
  ws.cd = w.fireRate;
  if (!CHEAT.noRecoil) ws.recoil = Math.min(ws.recoil + w.recoil, w.maxRecoil);

  const base = player.angle;
  const mx = player.x + Math.cos(base) * (player.r + 14);
  const my = player.y + Math.sin(base) * (player.r + 14);
  const spread = (CHEAT.noRecoil ? 0 : w.spread) + ws.recoil * 0.008;

  for (let i = 0; i < w.pellets; i++){
    const a = base + rand(-spread, spread);
    const life = CHEAT.infRange ? 30 : w.bulletLife;
    spawnBullet(mx, my, a, w.bulletSpeed, w.damage, 'player', w.color, life, 3);
  }

  spawnMuzzle(mx, my, base, w.color);
  shake(w.shake);
  Sfx.shoot(ws.key);

  if (!CHEAT.noRecoil){
    player.x -= Math.cos(base) * w.recoil * 0.7;
    player.y -= Math.sin(base) * w.recoil * 0.7;
    collideObstacles(player);
  }

  if (ws.ammo <= 0 && !CHEAT.infAmmo) startReload();
}

function startReload(){
  const ws = curWeapon();
  const w = WEAPONS[ws.key];
  if (ws.reloading || ws.ammo >= w.mag) return;
  ws.reloading = true;
  ws.reloadT = w.reload;
  Sfx.reloadStart();
}

function switchWeapon(i){
  if (i === player.weaponIndex || i >= player.weapons.length) return;
  player.weaponIndex = i;
  const ws = player.weapons[i];
  ws.reloading = false; ws.reloadT = 0;
  Sfx.click();
}

function cycleWeapon(){
  switchWeapon((player.weaponIndex + 1) % player.weapons.length);
}

function hitPlayer(dmg){
  if (CHEAT.god) return;
  if (G.state !== 'playing') return;
  player.hp -= dmg;
  player.hitFlash = 0.22;
  shake(7);
  Sfx.hurt();
  spawnParticles(player.x, player.y, 9, '#ff4d4d', 220, 0.35);
  if (player.hp <= 0){
    player.hp = 0;
    G.state = 'gameover';
    spawnParticles(player.x, player.y, 46, '#4ecdc4', 340, 0.9);
    spawnParticles(player.x, player.y, 20, '#ffffff', 260, 0.7);
    shake(18);
    Sfx.explode();
  }
}

function hitEnemy(e, dmg, ang){
  if (CHEAT.oneShot) dmg = 999999;
  e.hp -= dmg;
  e.hitFlash = 0.14;
  spawnParticles(e.x, e.y, 6, e.accent, 170, 0.28, ang + Math.PI);
  if (e.ranged && Math.random() < 0.30 && e.dodgeT <= 0){
    e.dodgeT = rand(0.28, 0.55);
    e.strafeDir *= -1;
  }
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e){
  if (e.dead) return;
  e.dead = true;
  G.score += e.score;
  G.kills++;
  spawnParticles(e.x, e.y, 22, e.color, 280, 0.6);
  spawnParticles(e.x, e.y, 10, '#ffffff', 190, 0.4);
  shake(5);

  const chance = (e.type === 'elite') ? CFG.pickup.eliteDropChance : CFG.pickup.dropChance;
  if (Math.random() < chance){
    spawnPickup(e.x, e.y);
  }

  Sfx.explode();
}

/* ---- 血包 ---- */
function spawnPickup(x, y){
  pickups.push({
    x, y,
    r: CFG.pickup.radius,
    life: CFG.pickup.life,
    seed: Math.random() * 10
  });
}

function spawnRandomPickup(){
  for (let i = 0; i < 80; i++){
    const x = rand(80, W - 80);
    const y = rand(80, H - 80);
    if (pointInObstacle(x, y, 26)) continue;
    const dx = x - player.x, dy = y - player.y;
    if (dx*dx + dy*dy < 260*260) continue;
    spawnPickup(x, y);
    return;
  }
}

function addFloatText(x, y, text, color){
  floatTexts.push({ x, y, text, color, life: 0.9, maxLife: 0.9, vy: -58 });
}

function updatePickups(dt){
  const MAGNET = CFG.pickup.magnetRange;

  for (let i = pickups.length - 1; i >= 0; i--){
    const p = pickups[i];
    p.life -= dt;
    if (p.life <= 0){ pickups.splice(i, 1); continue; }
    if (player.hp <= 0) continue;

    const dx = player.x - p.x;
    const dy = player.y - p.y;
    const dist = Math.hypot(dx, dy) || 0.0001;

    if (dist < MAGNET && dist > 1){
      const pull = (1 - dist / MAGNET) * 560;
      p.x += (dx / dist) * pull * dt;
      p.y += (dy / dist) * pull * dt;
    }

    if (dist < player.r + p.r){
      if (player.hp < player.maxHp){
        player.hp = Math.min(player.maxHp, player.hp + CFG.pickup.heal);
        spawnParticles(p.x, p.y, 16, '#3ddc84', 200, 0.5);
        addFloatText(p.x, p.y - 14, '+' + CFG.pickup.heal, '#3ddc84');
      } else {
        G.score += CFG.pickup.scoreBonus;
        spawnParticles(p.x, p.y, 8, '#ffe066', 150, 0.4);
        addFloatText(p.x, p.y - 14, '+' + CFG.pickup.scoreBonus, '#ffe066');
      }
      Sfx.pickup();
      pickups.splice(i, 1);
    }
  }

  if (CFG.pickup.spawnInterval > 0 && player.hp > 0){
    G.pickupTimer += dt;
    if (G.pickupTimer >= CFG.pickup.spawnInterval){
      G.pickupTimer = 0;
      if (pickups.length < CFG.pickup.maxOnMap) spawnRandomPickup();
    }
  }
}

function updateFloatTexts(dt){
  for (let i = floatTexts.length - 1; i >= 0; i--){
    const f = floatTexts[i];
    f.life -= dt;
    if (f.life <= 0){ floatTexts.splice(i, 1); continue; }
    f.y += f.vy * dt;
    f.vy *= Math.pow(0.92, dt * 60);
  }
}

/* ---- 敌人 AI ---- */
function enemyShoot(e, ang){
  const spread = (e.type === 'elite') ? 0.06 : 0.09;
  const n = (e.type === 'elite') ? 2 : 1;
  for (let i = 0; i < n; i++){
    const a = ang + rand(-spread, spread);
    spawnBullet(
      e.x + Math.cos(a) * (e.r + 8),
      e.y + Math.sin(a) * (e.r + 8),
      a, e.bulletSpeed, e.damage, 'enemy', e.accent, e.bulletLife, 4
    );
  }
  spawnMuzzle(e.x + Math.cos(ang)*(e.r+8), e.y + Math.sin(ang)*(e.r+8), ang, e.accent);
  Sfx.enemyShoot();
}

function updateEnemy(e, dt){
  if (e.hitFlash > 0) e.hitFlash -= dt;
  if (e.fireCd   > 0) e.fireCd   -= dt;
  if (e.dodgeT   > 0) e.dodgeT   -= dt;

  if (e.reloading){
    e.reloadT -= dt;
    if (e.reloadT <= 0){ e.reloading = false; e.ammo = e.mag; }
  }
  if (e.ranged && e.ammo <= 0 && !e.reloading){
    e.reloading = true;
    e.reloadT = e.reloadTime;
  }

  const dx = player.x - e.x, dy = player.y - e.y;
  const d = Math.hypot(dx, dy) || 0.0001;
  const nx = dx / d, ny = dy / d;
  const los = hasLineOfSight(e.x, e.y, player.x, player.y);
  const playerAlive = player.hp > 0;

  const targetAngle = Math.atan2(dy, dx);
  let da = targetAngle - e.angle;
  while (da > Math.PI) da -= PI2;
  while (da < -Math.PI) da += PI2;
  e.angle += da * Math.min(1, dt * 10);

  if (!playerAlive){
    e.state = 'patrol';
  } else if (e.reloading){
    e.state = 'reload';
  } else if (e.dodgeT > 0){
    e.state = 'dodge';
  } else if (e.melee){
    if (los && d < e.sightRange){
      e.state = (d < e.attackRange + player.r + 4) ? 'attack' : 'chase';
    } else {
      e.state = 'patrol';
    }
  } else {
    if (!los || d > e.range) e.state = 'chase';
    else e.state = 'attack';
  }

  let mvx = 0, mvy = 0;
  switch (e.state){
    case 'patrol':
      mvx = Math.cos(e.wanderAngle);
      mvy = Math.sin(e.wanderAngle);
      e.wanderAngle += rand(-1, 1) * dt * 2.5;
      if (Math.random() < dt * 0.35) e.wanderAngle = rand(0, PI2);
      break;

    case 'chase':
      mvx = nx + (-ny) * e.strafeDir * 0.30;
      mvy = ny + ( nx) * e.strafeDir * 0.30;
      break;

    case 'attack':
      if (e.melee){
        mvx = nx * 0.85; mvy = ny * 0.85;
      } else {
        if (d > e.keepDist * 1.25){ mvx = nx;  mvy = ny;  }
        else if (d < e.keepDist * 0.70){ mvx = -nx * 0.9; mvy = -ny * 0.9; }
        mvx += (-ny) * e.strafeDir * 0.85;
        mvy += ( nx) * e.strafeDir * 0.85;
      }
      break;

    case 'dodge':
      mvx = (-ny) * e.strafeDir * 1.25 - nx * 0.5;
      mvy = ( nx) * e.strafeDir * 1.25 - ny * 0.5;
      break;

    case 'reload':
      mvx = -nx * 0.45 + (-ny) * e.strafeDir * 0.4;
      mvy = -ny * 0.45 + ( nx) * e.strafeDir * 0.4;
      break;
  }

  const ml = Math.hypot(mvx, mvy);
  if (ml > 0.001){ mvx /= ml; mvy /= ml; }

  let spd = e.speed * ((e.state === 'attack') ? 0.88 : 1);
  if (CHEAT.enemyFreeze) spd = 0;

  e.x += mvx * spd * dt;
  e.y += mvy * spd * dt;

  collideObstacles(e);
  e.x = clamp(e.x, e.r, W - e.r);
  e.y = clamp(e.y, e.r, H - e.r);

  if (!playerAlive || CHEAT.enemyPassive) return;

  if (e.melee){
    if (e.state === 'attack' && e.fireCd <= 0 && d < e.attackRange + player.r + 8){
      hitPlayer(e.damage);
      e.fireCd = e.attackCd;
      spawnParticles(player.x, player.y, 10, '#ff6b6b', 200, 0.3);
    }
  } else {
    if (e.state === 'attack' && e.fireCd <= 0 && e.ammo > 0 && los){
      enemyShoot(e, Math.atan2(dy, dx));
      e.ammo--;
      e.fireCd = e.fireCdBase * rand(0.85, 1.2);
    }
  }
}

function updateEnemies(dt){
  for (let i = 0; i < enemies.length; i++){
    if (!enemies[i].dead) updateEnemy(enemies[i], dt);
  }

  for (let i = 0; i < enemies.length; i++){
    const a = enemies[i];
    if (a.dead) continue;
    for (let j = i + 1; j < enemies.length; j++){
      const b = enemies[j];
      if (b.dead) continue;
      let dx = b.x - a.x, dy = b.y - a.y;
      const dd = Math.hypot(dx, dy);
      const minD = a.r + b.r;
      if (dd < minD && dd > 0.001){
        const push = (minD - dd) * 0.5;
        dx /= dd; dy /= dd;
        a.x -= dx * push; a.y -= dy * push;
        b.x += dx * push; b.y += dy * push;
      }
    }
  }

  enemies = enemies.filter(e => !e.dead);
}

function updateBullets(dt){
  for (let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.life -= dt;
    if (b.life <= 0){ bullets.splice(i, 1); continue; }

    const speed = Math.hypot(b.vx, b.vy);
    const steps = Math.max(1, Math.ceil(speed * dt / 6));
    const sdt = dt / steps;
    let dead = false;

    for (let s = 0; s < steps && !dead; s++){
      b.x += b.vx * sdt;
      b.y += b.vy * sdt;

      if (b.x < 0 || b.y < 0 || b.x > W || b.y > H){
        spawnParticles(b.x, b.y, 4, b.color, 120, 0.2);
        dead = true; break;
      }

      // 障碍物碰撞（穿墙开关决定是否跳过）
      const pierce = (b.owner === 'player') ? CHEAT.bulletPierce : CHEAT.enemyBulletPierce;
      if (!pierce && pointInObstacle(b.x, b.y, b.r)){
        spawnParticles(b.x, b.y, 5, b.color, 150, 0.22);
        dead = true; break;
      }

      if (b.owner === 'player'){
        for (let k = 0; k < enemies.length; k++){
          const e = enemies[k];
          if (e.dead) continue;
          const ddx = e.x - b.x, ddy = e.y - b.y;
          if (ddx*ddx + ddy*ddy < (e.r + b.r) * (e.r + b.r)){
            hitEnemy(e, b.damage, Math.atan2(b.vy, b.vx));
            dead = true; break;
          }
        }
      } else {
        const ddx = player.x - b.x, ddy = player.y - b.y;
        if (player.hp > 0 && ddx*ddx + ddy*ddy < (player.r + b.r) * (player.r + b.r)){
          hitPlayer(b.damage);
          dead = true;
        }
      }
    }

    if (dead) bullets.splice(i, 1);
  }
}

function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    const drag = Math.pow(p.drag, dt * 60);
    p.vx *= drag; p.vy *= drag;
  }
}

function updateCamera(dt){
  const halfW = viewW() / 2;
  const halfH = viewH() / 2;

  let tx = player.x, ty = player.y;

  if (input.usingTouch){
    if (stickAim.active && stickAim.mag > 0.15){
      const f = Math.min(stickAim.mag, 1);
      tx += Math.cos(stickAim.angle) * CFG.camera.maxLead * f;
      ty += Math.sin(stickAim.angle) * CFG.camera.maxLead * f;
    }
  } else {
    const wpt = screenToWorld(input.mouseX, input.mouseY);
    const dx = wpt.x - player.x, dy = wpt.y - player.y;
    const d = Math.hypot(dx, dy);
    if (d > 1){
      const f = Math.min(d, CFG.camera.leadDist) / CFG.camera.leadDist;
      tx += (dx / d) * CFG.camera.maxLead * f;
      ty += (dy / d) * CFG.camera.maxLead * f;
    }
  }

  tx = clampCam(tx, CFG.world.w, halfW);
  ty = clampCam(ty, CFG.world.h, halfH);

  const k = smoothK(CFG.camera.smooth, dt);
  cam.x = lerp(cam.x, tx, k);
  cam.y = lerp(cam.y, ty, k);

  cam.x = clampCam(cam.x, CFG.world.w, halfW);
  cam.y = clampCam(cam.y, CFG.world.h, halfH);
}

function updateShake(dt){
  if (shakeAmt > 0){
    shakeAmt *= Math.exp(-CFG.camera.shakeDecay * dt);
    if (shakeAmt < 0.05) shakeAmt = 0;
  }
}
function shake(v){ shakeAmt = Math.min(shakeAmt + v, 26); }

function update(dt){
  if (G.state === 'playing'){
    updatePlayer(dt);
    updateEnemies(dt);
    updateBullets(dt);
    updatePickups(dt);
    updateSpawns(dt);
  }
  updateParticles(dt);
  updateFloatTexts(dt);
  updateCamera(dt);
  updateShake(dt);

  if (G.banner){
    G.banner.t -= dt;
    if (G.banner.t <= 0) G.banner = null;
  }
}

/* ====================== 9. 渲染 ====================== */

const UI = { buttons: [] };

function drawButton(label, x, y, w, h, cb){
  UI.buttons.push({ x, y, w, h, cb });
  const hov = !input.usingTouch &&
              input.mouseX >= x && input.mouseX <= x+w &&
              input.mouseY >= y && input.mouseY <= y+h;
  ctx.fillStyle = hov ? '#4ecdc4' : 'rgba(42,49,67,0.92)';
  roundRect(ctx, x, y, w, h, 10); ctx.fill();
  ctx.strokeStyle = '#4ecdc4'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = hov ? '#0d0f14' : '#e6edf7';
  ctx.font = 'bold ' + Math.min(20, h*0.42) + 'px system-ui,-apple-system,sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w/2, y + h/2 + 1);
}

function handleUITap(px, py){
  for (let i = UI.buttons.length - 1; i >= 0; i--){
    const b = UI.buttons[i];
    if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h){
      Sfx.click();
      b.cb();
      return true;
    }
  }
  return false;
}

function drawGround(){
  const halfW = viewW()/2 + 40, halfH = viewH()/2 + 40;
  const x0 = cam.x - halfW, x1 = cam.x + halfW;
  const y0 = cam.y - halfH, y1 = cam.y + halfH;

  ctx.fillStyle = '#151a24';
  ctx.fillRect(0, 0, W, H);

  const gs = 80;
  ctx.strokeStyle = '#1c2231';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = Math.floor(x0/gs)*gs; x < x1; x += gs){
    if (x < 0 || x > W) continue;
    ctx.moveTo(x, Math.max(0, y0));
    ctx.lineTo(x, Math.min(H, y1));
  }
  for (let y = Math.floor(y0/gs)*gs; y < y1; y += gs){
    if (y < 0 || y > H) continue;
    ctx.moveTo(Math.max(0, x0), y);
    ctx.lineTo(Math.min(W, x1), y);
  }
  ctx.stroke();

  ctx.strokeStyle = '#2c3648';
  ctx.lineWidth = 8;
  ctx.strokeRect(0, 0, W, H);
}

function drawObstacles(){
  for (let i = 0; i < OBSTACLES.length; i++){
    const o = OBSTACLES[i];
    ctx.fillStyle = 'rgba(0,0,0,0.38)';
    ctx.fillRect(o.x + 6, o.y + 8, o.w, o.h);
    ctx.fillStyle = '#2a3143';
    ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.fillStyle = '#3a4459';
    ctx.fillRect(o.x, o.y, o.w, 5);
    ctx.strokeStyle = '#4c5b7a';
    ctx.lineWidth = 2;
    ctx.strokeRect(o.x + 1, o.y + 1, o.w - 2, o.h - 2);
  }
}

function drawParticles(){
  for (let i = 0; i < particles.length; i++){
    const p = particles[i];
    const a = Math.max(0, Math.min(1, p.life / p.maxLife));
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    const s = p.size * (0.4 + a * 0.6);
    ctx.fillRect(p.x - s/2, p.y - s/2, s, s);
  }
  ctx.globalAlpha = 1;
}

function drawPickups(){
  const t = performance.now() / 1000;
  for (let i = 0; i < pickups.length; i++){
    const p = pickups[i];
    if (p.life < 3 && Math.floor(p.life * 8) % 2 === 0) continue;

    const x = p.x;
    const y = p.y + Math.sin(t * 4 + p.seed) * 3;
    const r = p.r;

    ctx.beginPath();
    ctx.arc(x, y, r + 8 + Math.sin(t * 5 + p.seed) * 2, 0, PI2);
    ctx.fillStyle = 'rgba(61,220,132,0.16)';
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(p.x, p.y + r * 0.9, r * 0.9, r * 0.4, 0, 0, PI2);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fill();

    ctx.fillStyle = '#3ddc84';
    roundRect(ctx, x - r,      y - r*0.34, r*2,     r*0.68, 3); ctx.fill();
    roundRect(ctx, x - r*0.34, y - r,      r*0.68,  r*2,    3); ctx.fill();

    ctx.strokeStyle = '#0d2b1b';
    ctx.lineWidth = 2;
    roundRect(ctx, x - r,      y - r*0.34, r*2,     r*0.68, 3); ctx.stroke();
    roundRect(ctx, x - r*0.34, y - r,      r*0.68,  r*2,    3); ctx.stroke();
  }
}

function drawBullets(){
  for (let i = 0; i < bullets.length; i++){
    const b = bullets[i];
    const ang = Math.atan2(b.vy, b.vx);
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(ang);
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = b.color;
    ctx.fillRect(-14, -b.r * 0.45, 14, b.r * 0.9);
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(0, 0, b.r, 0, PI2);
    ctx.fillStyle = b.color;
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawFloatTexts(){
  for (let i = 0; i < floatTexts.length; i++){
    const f = floatTexts[i];
    const a = Math.max(0, Math.min(1, f.life / f.maxLife));
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 17px system-ui,sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillText(f.text, f.x + 1, f.y + 1);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  }
}

function drawPlayer(){
  if (player.hp <= 0) return;
  ctx.save();
  ctx.translate(player.x, player.y);

  ctx.beginPath();
  ctx.ellipse(0, 5, player.r * 1.05, player.r * 0.7, 0, 0, PI2);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fill();

  ctx.rotate(player.angle);

  ctx.fillStyle = '#c8d2e0';
  ctx.fillRect(player.r * 0.35, -3.5, player.r * 1.55, 7);
  ctx.fillStyle = '#8a94a8';
  ctx.fillRect(player.r * 0.35, -3.5, player.r * 0.55, 7);

  ctx.beginPath();
  ctx.arc(0, 0, player.r, 0, PI2);
  ctx.fillStyle = player.hitFlash > 0 ? '#ffffff' : '#4ecdc4';
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = '#123b3c';
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(0, 0, player.r * 0.42, 0, PI2);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fill();

  ctx.restore();

  if (player.dashCd > 0){
    const ratio = 1 - player.dashCd / CFG.player.dashCd;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r + 8, -Math.PI/2, -Math.PI/2 + PI2 * ratio);
    ctx.strokeStyle = 'rgba(78,205,196,0.55)';
    ctx.lineWidth = 3;
    ctx.stroke();
  }
}

function drawEnemies(){
  for (let i = 0; i < enemies.length; i++){
    const e = enemies[i];
    ctx.save();
    ctx.translate(e.x, e.y);

    ctx.beginPath();
    ctx.ellipse(0, 5, e.r * 1.0, e.r * 0.65, 0, 0, PI2);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fill();

    ctx.rotate(e.angle);
    ctx.beginPath();
    if (e.type === 'rusher'){
      ctx.moveTo(e.r * 1.25, 0);
      ctx.lineTo(-e.r * 0.85, -e.r * 0.95);
      ctx.lineTo(-e.r * 0.85,  e.r * 0.95);
      ctx.closePath();
    } else if (e.type === 'shooter'){
      ctx.rect(-e.r * 0.85, -e.r * 0.85, e.r * 1.7, e.r * 1.7);
    } else {
      const n = 6;
      for (let k = 0; k < n; k++){
        const a = (k / n) * PI2;
        const px = Math.cos(a) * e.r, py = Math.sin(a) * e.r;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }
    ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : e.color;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.stroke();

    if (e.ranged){
      ctx.fillStyle = e.accent;
      ctx.fillRect(e.r * 0.5, -2.5, e.r * 0.9, 5);
    }
    ctx.restore();

    if (e.hp < e.maxHp){
      const bw = e.r * 2.3, bh = 4;
      const bx = e.x - bw/2, by = e.y - e.r - 13;
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
      const ratio = clamp(e.hp / e.maxHp, 0, 1);
      ctx.fillStyle = ratio > 0.5 ? '#ff6b6b' : '#ff9f43';
      ctx.fillRect(bx, by, bw * ratio, bh);
    }

    if (e.reloading){
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.font = 'bold 11px system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText('换弹中…', e.x, e.y - e.r - 18);
    }
  }
}

function drawHUD(){
  const pad = 16;

  const barW = clamp(cssW * 0.21, 130, 250);
  const barH = 18;
  const bx = pad + 4, by = pad + 4;

  ctx.fillStyle = 'rgba(8,10,14,0.62)';
  roundRect(ctx, bx - 6, by - 6, barW + 12, barH + 12, 9);
  ctx.fill();

  const hpRatio = clamp(player.hp / player.maxHp, 0, 1);
  if (hpRatio > 0){
    ctx.fillStyle = hpRatio > 0.5 ? '#3ddc84' : (hpRatio > 0.25 ? '#feca57' : '#ff4d4d');
    roundRect(ctx, bx, by, barW * hpRatio, barH, 5);
    ctx.fill();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 1;
  roundRect(ctx, bx, by, barW, barH, 5);
  ctx.stroke();

  ctx.fillStyle = '#e9f1fb';
  ctx.font = 'bold 12px system-ui,sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('HP  ' + Math.ceil(player.hp) + ' / ' + Math.ceil(player.maxHp), bx + 8, by + barH/2 + 0.5);

  ctx.textAlign = 'center';
  ctx.font = 'bold 15px system-ui,sans-serif';
  ctx.fillStyle = 'rgba(8,10,14,0.62)';
  const infoW = 210, infoH = 32;
  roundRect(ctx, cssW/2 - infoW/2, pad, infoW, infoH, 8);
  ctx.fill();
  ctx.fillStyle = '#8fd8ff';
  const remain = enemies.length + G.spawnQueue.length;
  ctx.fillText('第 ' + G.wave + ' / ' + CFG.wave.maxWave + ' 波   剩余 ' + remain, cssW/2, pad + infoH/2 + 1);

  ctx.textAlign = 'right';
  ctx.font = 'bold 20px system-ui,sans-serif';
  ctx.fillStyle = '#ffe066';
  ctx.fillText(String(G.score), cssW - 74, pad + 16);
  ctx.font = '11px system-ui,sans-serif';
  ctx.fillStyle = '#8a97ad';
  ctx.fillText('SCORE', cssW - 74, pad + 34);

  const pb = pauseBtn();
  ctx.beginPath();
  ctx.arc(pb.x, pb.y, pb.r, 0, PI2);
  ctx.fillStyle = 'rgba(8,10,14,0.62)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#e9f1fb';
  ctx.fillRect(pb.x - 6, pb.y - 8, 4.5, 16);
  ctx.fillRect(pb.x + 1.5, pb.y - 8, 4.5, 16);

  const ws = curWeapon();
  const wd = WEAPONS[ws.key];
  const boxW = 240, boxH = 48;
  const ax = cssW/2 - boxW/2;
  const ay = cssH - boxH - 14;

  ctx.fillStyle = 'rgba(8,10,14,0.62)';
  roundRect(ctx, ax, ay, boxW, boxH, 10);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 15px system-ui,sans-serif';
  ctx.fillStyle = wd.color;
  ctx.fillText(wd.name, ax + 14, ay + 16);

  ctx.textAlign = 'right';
  ctx.font = 'bold 22px system-ui,sans-serif';
  ctx.fillStyle = ws.ammo > 0 ? '#e9f1fb' : '#ff6b6b';
  ctx.fillText(ws.reloading ? '--' : (CHEAT.infAmmo ? '∞' : String(ws.ammo)), ax + boxW - 52, ay + 24);
  ctx.font = '13px system-ui,sans-serif';
  ctx.fillStyle = '#8a97ad';
  ctx.fillText('/ ' + wd.mag, ax + boxW - 14, ay + 26);

  if (ws.reloading){
    const p = 1 - ws.reloadT / wd.reload;
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    roundRect(ctx, ax + 14, ay + 32, boxW - 28, 7, 3.5);
    ctx.fill();
    ctx.fillStyle = '#4ecdc4';
    roundRect(ctx, ax + 14, ay + 32, (boxW - 28) * p, 7, 3.5);
    ctx.fill();
    ctx.textAlign = 'center';
    ctx.font = '11px system-ui,sans-serif';
    ctx.fillStyle = '#4ecdc4';
    ctx.fillText('换弹中…', ax + boxW/2, ay + 16);
  } else {
    const slots = player.weapons.length;
    const sw = 26, gap = 8;
    let sx = ax + 14 + 72;
    for (let i = 0; i < slots; i++){
      ctx.beginPath();
      roundRect(ctx, sx, ay + 10, sw, 16, 4);
      ctx.fillStyle = (i === player.weaponIndex) ? '#4ecdc4' : 'rgba(255,255,255,0.12)';
      ctx.fill();
      ctx.fillStyle = (i === player.weaponIndex) ? '#0d0f14' : '#8a97ad';
      ctx.font = 'bold 11px system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(String(i + 1), sx + sw/2, ay + 18.5);
      sx += sw + gap;
    }
  }

  // 作弊激活指示
  const activeCheats = [];
  if (CHEAT.god) activeCheats.push('无敌');
  if (CHEAT.infAmmo) activeCheats.push('∞弹');
  if (CHEAT.oneShot) activeCheats.push('秒杀');
  if (CHEAT.bulletPierce) activeCheats.push('穿墙');
  if (CHEAT.enemyFreeze) activeCheats.push('冻敌');
  if (CHEAT.enemyPassive) activeCheats.push('敌哑');
  if (CHEAT.infDash) activeCheats.push('∞冲');
  if (CHEAT.infRange) activeCheats.push('∞程');
  if (activeCheats.length > 0){
    ctx.textAlign = 'left';
    ctx.font = 'bold 11px system-ui,sans-serif';
    ctx.fillStyle = 'rgba(8,10,14,0.62)';
    const cw = 14 + activeCheats.length * 42;
    roundRect(ctx, pad, pad + barH + 16, cw, 20, 5);
    ctx.fill();
    ctx.fillStyle = '#ff6b6b';
    ctx.fillText('⚡ ' + activeCheats.join(' '), pad + 6, pad + barH + 26);
  }
}

function drawStick(s, label, color){
  const alpha = s.active ? 0.55 : 0.28;
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.arc(s.ox, s.oy, STICK_R, 0, PI2);
  ctx.fillStyle = 'rgba(20,25,35,0.55)';
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(s.x, s.y, STICK_R * 0.42, 0, PI2);
  ctx.fillStyle = color;
  ctx.fill();

  ctx.globalAlpha = 0.75;
  ctx.fillStyle = '#dfe9f7';
  ctx.font = 'bold 11px system-ui,sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, s.ox, s.oy + STICK_R + 16);
  ctx.globalAlpha = 1;
}

function drawTouchUI(){
  const lb = leftBase(), rb = rightBase();

  if (!stickMove.active){
    stickMove.ox = lb.x; stickMove.oy = lb.y;
    stickMove.x  = lb.x; stickMove.y  = lb.y;
  }
  if (!stickAim.active){
    stickAim.ox = rb.x; stickAim.oy = rb.y;
    stickAim.x  = rb.x; stickAim.y  = rb.y;
  }

  drawStick(stickMove, '移动', '#4ecdc4');
  drawStick(stickAim,  '瞄准 / 射击', '#ff9f43');

  const db = dashBtn();
  const ready = player.dashCd <= 0;
  ctx.beginPath();
  ctx.arc(db.x, db.y, db.r, 0, PI2);
  ctx.fillStyle = ready ? 'rgba(78,205,196,0.28)' : 'rgba(60,70,90,0.22)';
  ctx.fill();
  ctx.strokeStyle = ready ? '#4ecdc4' : 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 2;
  ctx.stroke();

  if (!ready){
    const p = 1 - player.dashCd / CFG.player.dashCd;
    ctx.beginPath();
    ctx.arc(db.x, db.y, db.r - 3, -Math.PI/2, -Math.PI/2 + PI2 * p);
    ctx.strokeStyle = 'rgba(78,205,196,0.8)';
    ctx.lineWidth = 4;
    ctx.stroke();
  }

  ctx.fillStyle = ready ? '#dff8f5' : '#6c7893';
  ctx.font = 'bold 13px system-ui,sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('冲刺', db.x, db.y + 1);

  const sb = switchBtn();
  const wsCur = curWeapon();
  const wdCur = WEAPONS[wsCur.key];

  ctx.beginPath();
  ctx.arc(sb.x, sb.y, sb.r, 0, PI2);
  ctx.fillStyle = 'rgba(255,159,67,0.22)';
  ctx.fill();
  ctx.strokeStyle = wdCur.color;
  ctx.lineWidth = 2.5;
  ctx.stroke();

  ctx.fillStyle = wdCur.color;
  ctx.font = 'bold 13px system-ui,sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(wdCur.name, sb.x, sb.y - 6);

  ctx.font = 'bold 11px system-ui,sans-serif';
  ctx.fillStyle = wsCur.reloading ? '#ff6b6b'
                : (wsCur.ammo > 0 ? '#e9f1fb' : '#ff6b6b');
  ctx.fillText(wsCur.reloading ? '换弹…' : (CHEAT.infAmmo ? '∞' : (wsCur.ammo + '/' + wdCur.mag)), sb.x, sb.y + 11);
}

function drawCrosshair(){
  if (input.usingTouch) return;
  if (G.state !== 'playing') return;

  const x = input.mouseX, y = input.mouseY;
  const ws = curWeapon();
  const wd = WEAPONS[ws.key];
  const gap = 7 + ws.recoil * 1.8 + wd.spread * 60;
  const len = 9;

  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.88)';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - gap - len, y); ctx.lineTo(x - gap, y);
  ctx.moveTo(x + gap, y);       ctx.lineTo(x + gap + len, y);
  ctx.moveTo(x, y - gap - len); ctx.lineTo(x, y - gap);
  ctx.moveTo(x, y + gap);       ctx.lineTo(x, y + gap + len);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(x, y, 2, 0, PI2);
  ctx.fillStyle = '#4ecdc4';
  ctx.fill();
  ctx.restore();
}

function drawBanner(){
  if (!G.banner) return;
  const a = Math.min(1, G.banner.t / 0.5);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const cy = cssH * 0.28;
  ctx.font = 'bold ' + Math.min(52, cssW * 0.055) + 'px system-ui,sans-serif';
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillText(G.banner.text, cssW/2 + 2, cy + 2);
  ctx.fillStyle = '#4ecdc4';
  ctx.fillText(G.banner.text, cssW/2, cy);

  if (G.banner.sub){
    ctx.font = 'bold ' + Math.min(20, cssW * 0.022) + 'px system-ui,sans-serif';
    ctx.fillStyle = '#9fb0c8';
    ctx.fillText(G.banner.sub, cssW/2, cy + 44);
  }
  ctx.restore();
}

function render(){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0a0c10';
  ctx.fillRect(0, 0, cssW, cssH);

  if (G.state === 'menu'){
    drawMenu();
    drawCrosshair();
    return;
  }

  const sx = (Math.random() - 0.5) * shakeAmt;
  const sy = (Math.random() - 0.5) * shakeAmt;

  ctx.save();
  ctx.translate(cssW / 2 + sx, cssH / 2 + sy);
  ctx.scale(zoom, zoom);
  ctx.translate(-cam.x, -cam.y);

  drawGround();
  drawObstacles();
  drawParticles();
  drawPickups();
  drawBullets();
  drawEnemies();
  drawPlayer();
  drawFloatTexts();

  ctx.restore();

  drawVignette();

  if (G.state !== 'menu') drawHUD();
  if (input.usingTouch && G.state === 'playing') drawTouchUI();
  drawBanner();

  if (G.state === 'paused')   drawPaused();
  if (G.state === 'gameover') drawGameOver();
  if (G.state === 'victory')  drawVictory();

  drawCrosshair();
}

let vignetteCache = null;
function drawVignette(){
  const key = cssW + 'x' + cssH;
  if (!vignetteCache || vignetteCache.key !== key){
    const g = ctx.createRadialGradient(
      cssW/2, cssH/2, Math.min(cssW, cssH) * 0.35,
      cssW/2, cssH/2, Math.max(cssW, cssH) * 0.75
    );
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.55)');
    vignetteCache = { key, grad: g };
  }
  ctx.fillStyle = vignetteCache.grad;
  ctx.fillRect(0, 0, cssW, cssH);
}

/* ====================== 10. 流程控制 & 主循环 ====================== */

function resetGame(){
  G.score = 0;
  G.kills = 0;
  G.wave = 0;
  G.waveActive = false;
  G.spawnQueue = [];
  G.spawnTimer = 0;
  G.nextWaveTimer = 0;
  G.pickupTimer = 0;
  G.banner = null;

  bullets.length = 0;
  enemies.length = 0;
  particles.length = 0;
  pickups.length = 0;
  floatTexts.length = 0;

  player.x = 320; player.y = 720;
  player.vx = 0; player.vy = 0;
  player.hp = player.maxHp;
  player.angle = 0;
  player.hitFlash = 0;
  player.dashTime = 0; player.dashCd = 0;
  player.weaponIndex = 0;
  player.weapons = WEAPON_ORDER.map(newWeaponState);

  cam.x = clampCam(player.x, W, viewW()/2);
  cam.y = clampCam(player.y, H, viewH()/2);
  shakeAmt = 0;

  stickMove.active = false; stickMove.mag = 0;
  stickAim.active = false;  stickAim.mag = 0;
  input.firing = false;
}

function startGame(){
  Sfx.init();
  player.maxHp = CFG.player.hp;
  resetGame();
  G.state = 'playing';
  startWave(1);
}

function togglePause(){
  if (G.state === 'playing') G.state = 'paused';
  else if (G.state === 'paused') G.state = 'playing';
}

let lastT = 0;

function loop(t){
  requestAnimationFrame(loop);
  if (!lastT) lastT = t;
  let dt = (t - lastT) / 1000;
  lastT = t;
  if (dt > 0.05) dt = 0.05;
  if (dt <= 0) return;

  update(dt);
  render();
}

  panel.classList.toggle('show');

  if (e.code === 'F8'){ e.preventDefault(); toggleCheatPanel(); return; }
  if (e.code === 'Escape'){ document.activeElement && document.activeElement.blur && document.activeElement.blur(); return; }
  e.stopPropagation();
});

el('eApplyNow').addEventListener('click', () => {
  for (const e of enemies){
    const t = ENEMY_TYPES[e.type];
    const w = G.wave;
    const hpMul  = 1 + (w - 1) * CFG.wave.hpScale;
    const dmgMul = 1 + (w - 1) * CFG.wave.dmgScale;
    const spdMul = 1 + (w - 1) * CFG.wave.spdScale;
    const newMaxHp = Math.round(t.hp * hpMul * ENEMY_MUL.hp);
    const ratio = e.maxHp > 0 ? e.hp / e.maxHp : 1;
    e.maxHp = newMaxHp;
    e.hp = Math.max(1, Math.round(newMaxHp * ratio));
    e.speed = t.speed * spdMul * ENEMY_MUL.spd;
    e.damage = t.damage * dmgMul * ENEMY_MUL.dmg;
  }
  Sfx.click();
});
