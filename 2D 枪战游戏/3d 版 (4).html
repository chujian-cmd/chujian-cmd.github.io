/* ====================== 3. 音效 ====================== */

const Sfx = {
  ctx:null, enabled:true,
  init(){
    if (this.ctx) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC){ this.enabled = false; return; }
      this.ctx = new AC();
    } catch(e){ this.enabled = false; }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, dur, type, vol, slideTo){
    if (!this.enabled || !this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, filterFreq){
    if (!this.enabled || !this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    const len = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src = c.createBufferSource(); src.buffer = buf;
    const flt = c.createBiquadFilter();
    flt.type = 'lowpass'; flt.frequency.value = filterFreq || 1800;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(c.destination);
    src.start(t);
  },
  shoot(key){
    if (key === 'shotgun'){ this.noise(0.18, 0.10, 1200); this.tone(160, 0.10, 'sawtooth', 0.05, 60); }
    else if (key === 'rifle'){ this.noise(0.05, 0.045, 2600); this.tone(420, 0.04, 'square', 0.028, 180); }
    else { this.noise(0.07, 0.06, 2000); this.tone(320, 0.06, 'square', 0.04, 110); }
  },
  enemyShoot(){ this.tone(680, 0.06, 'triangle', 0.02, 300); },
  hurt(){ this.tone(180, 0.16, 'sawtooth', 0.05, 70); },
  explode(){ this.noise(0.35, 0.10, 900); this.tone(110, 0.30, 'sawtooth', 0.05, 40); },
  reloadStart(){ this.tone(520, 0.05, 'square', 0.03, 380); },

  dash(){ this.noise(0.14, 0.045, 3200); },
  click(){ this.tone(900, 0.035, 'square', 0.025); },

  viewSwitch(){ this.tone(540, 0.06, 'sine', 0.05, 880); setTimeout(()=>this.tone(880,0.08,'sine',0.04,1180),60); }
};

  g.position.y = 22;

  const ring = new THREE.Mesh(
    new THREE.RingGeometry(20, 30, 24),
    new THREE.MeshBasicMaterial({
      color: COLORS.heal, transparent: true, opacity: 0.3,
      side: THREE.DoubleSide, depthWrite: false

  );

  const wrapper = new THREE.Group();
  wrapper.add(g); wrapper.add(ring);
  wrapper.userData.spin = g;
  return wrapper;
}

const bulletPool = [];
function acquireBullet(){
  if (bulletPool.length) return bulletPool.pop();
  const m = new THREE.Mesh(bulletGeo, getBulletMat(0xffffff));
  m.frustumCulled = false;
  return m;
}
function releaseBullet(m){ scene.remove(m); bulletPool.push(m); }

/* ====================== 7. 碰撞 ====================== */

function collideObstacles(ent){
  for (let i = 0; i < OBSTACLES.length; i++){
    const o = OBSTACLES[i];
    const cx = clamp(ent.x, o.x, o.x + o.w);
    const cz = clamp(ent.z, o.y, o.y + o.h);
    let dx = ent.x - cx, dz = ent.z - cz;
    const d2 = dx*dx + dz*dz;
    if (d2 < ent.r * ent.r){
      if (d2 > 1e-6){
        const d = Math.sqrt(d2);
        const push = ent.r - d;
        ent.x += dx / d * push;
        ent.z += dz / d * push;
      } else {
        const left = ent.x - o.x, right = o.x + o.w - ent.x;
        const top  = ent.z - o.y, bottom = o.y + o.h - ent.z;
        const m = Math.min(left, right, top, bottom);
        if (m === left)        ent.x = o.x - ent.r;
        else if (m === right)  ent.x = o.x + o.w + ent.r;
        else if (m === top)    ent.z = o.y - ent.r;
        else                   ent.z = o.y + o.h + ent.r;
      }
    }
  }
  ent.x = clamp(ent.x, ent.r, W - ent.r);
  ent.z = clamp(ent.z, ent.r, H - ent.r);
}

function pointInObstacle(x, z, pad){
  pad = pad || 0;
  for (let i = 0; i < OBSTACLES.length; i++){
    const o = OBSTACLES[i];
    if (x > o.x - pad && x < o.x + o.w + pad && z > o.y - pad && z < o.y + o.h + pad) return true;
  }
  return false;
}

function rayRect(x, z, dx, dz, rx, ry, rw, rh){
  let tmin = -Infinity, tmax = Infinity;
  if (Math.abs(dx) < 1e-9){
    if (x < rx || x > rx + rw) return -1;
  } else {
    let t1 = (rx - x)/dx, t2 = (rx + rw - x)/dx;
    if (t1 > t2){ const t = t1; t1 = t2; t2 = t; }
    tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
  }
  if (Math.abs(dz) < 1e-9){
    if (z < ry || z > ry + rh) return -1;
  } else {
    let t1 = (ry - z)/dz, t2 = (ry + rh - z)/dz;
    if (t1 > t2){ const t = t1; t1 = t2; t2 = t; }
    tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
  }
  if (tmax < Math.max(tmin, 0)) return -1;
  return tmin >= 0 ? tmin : 0;
}

function hasLineOfSight(x1, z1, x2, z2){
  const dx = x2 - x1, dz = z2 - z1;
  for (let i = 0; i < OBSTACLES.length; i++){
    const o = OBSTACLES[i];
    const t = rayRect(x1, z1, dx, dz, o.x, o.y, o.w, o.h);
    if (t >= 0 && t <= 1) return false;
  }
  return true;
}

const input = {

};

const stickMove = { active:false, id:null, ox:0, oy:0, x:0, y:0, nx:0, ny:0, mag:0, angle:0 };
const stickAim  = { active:false, id:null, ox:0, oy:0, x:0, y:0, nx:0, ny:0, mag:0, angle:0 };
const STICK_R = 62, STICK_MAXD = 62;

/** 第一人称：右上滑动旋转 */
const lookTouch = { active:false, id:null, lastX:0, lastY:0 };

/* ---- 按钮位置 ---- */
const pauseBtn  = () => ({ x: cssW - 40, y: 40, r: 24 });
const viewBtn   = () => ({ x: 50, y: 88, r: 26 });
const leftBase  = () => ({ x: Math.max(104, cssW*0.115), y: cssH - Math.max(100, cssH*0.20) });
const rightBase = () => ({ x: cssW - Math.max(104, cssW*0.115), y: cssH - Math.max(100, cssH*0.20) });
const dashBtn   = () => ({ x: Math.max(96, cssW*0.10), y: cssH - Math.max(250, cssH*0.62), r: 36 });
const switchBtn = () => { const b = dashBtn(); return { x: b.x + 92, y: b.y, r: 36 }; };

/* 第一人称专用按钮 */

const fpsDashBtn   = () => ({ x: cssW + FPS_UI.dashBtnX,   y: cssH + FPS_UI.dashBtnY,   r: FPS_UI.dashBtnR });

/* 右上滑动区判定 */
function inLookZone(px, py){
  return px > cssW * FPS_UI.lookZoneLeftRatio && py < cssH * FPS_UI.lookZoneBottomRatio;
}
/* 右下射击区判定（右侧下方，且不在按钮上） */
function inFireZone(px, py){
  return px > cssW * FPS_UI.lookZoneLeftRatio && py >= cssH * FPS_UI.lookZoneBottomRatio;
}

function hitCircle(px, py, c){
  const dx = px - c.x, dy = py - c.y;
  return dx*dx + dy*dy <= c.r*c.r;
}

/* ---- 键盘 ---- */
window.addEventListener('keydown', e => {
  input.keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();

  if (G.state !== 'playing'){
    if (e.code === 'Enter' || e.code === 'Space'){
      if (G.state === 'menu' || G.state === 'gameover' || G.state === 'victory') startGame();
      else if (G.state === 'paused') togglePause();
    }
  }
  if (e.code === 'KeyP'){
    if (G.state === 'playing' || G.state === 'paused') togglePause();
  }
  if (e.code === 'KeyV'){
    if (G.state === 'playing' || G.state === 'paused' || G.state === 'menu') toggleViewMode();
  }
  if (G.state === 'playing'){
    if (e.code === 'KeyR') startReload();
    if (e.code === 'Digit1') switchWeapon(0);
    if (e.code === 'Digit2') switchWeapon(1);
    if (e.code === 'Digit3') switchWeapon(2);
    if (e.code === 'KeyQ') cycleWeapon();
  }
});
window.addEventListener('keyup', e => { input.keys[e.code] = false; });

/* ---- 鼠标 ---- */
uiCanvas.addEventListener('mousemove', e => {
  if (view.mode === 'fps' && !input.usingTouch && view.pointerLocked){
    const sens = CFG.camera.mouseSens;
    view.yaw   -= (e.movementX || 0) * sens;
    view.pitch -= (e.movementY || 0) * sens;
    view.pitch = clamp(view.pitch, -CFG.camera.maxPitch, CFG.camera.maxPitch);
    return;
  }
  const r = uiCanvas.getBoundingClientRect();
  input.mouseX = e.clientX - r.left;
  input.mouseY = e.clientY - r.top;
  if (input.usingTouch) input.usingTouch = false;
});

document.addEventListener('pointerlockchange', () => {
  view.pointerLocked = (document.pointerLockElement === uiCanvas);
});
function requestLock(){
  if (input.usingTouch) return;
  if (!uiCanvas.requestPointerLock) return;
  try { uiCanvas.requestPointerLock(); } catch(e){}
}
function releaseLock(){
  if (document.pointerLockElement) document.exitPointerLock();
}

uiCanvas.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  const r = uiCanvas.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  input.mouseX = px; input.mouseY = py;
  input.usingTouch = false;
  Sfx.init();

  if (G.state !== 'playing'){ handleUITap(px, py); return; }

  if (view.mode === 'fps' && !view.pointerLocked) requestLock();

  if (hitCircle(px, py, pauseBtn())){ togglePause(); return; }
  if (hitCircle(px, py, viewBtn())){ toggleViewMode(); return; }
  input.firing = true;
});
window.addEventListener('mouseup', e => { if (e.button === 0) input.firing = false; });
uiCanvas.addEventListener('mouseleave', () => { input.firing = false; });
uiCanvas.addEventListener('contextmenu', e => e.preventDefault());

/* ---- 触屏 ---- */
function touchPos(t){
  const r = uiCanvas.getBoundingClientRect();
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}
function updateStick(s, px, py){
  let dx = px - s.ox, dy = py - s.oy;
  let d = Math.hypot(dx, dy);
  if (d > STICK_MAXD){ dx = dx/d*STICK_MAXD; dy = dy/d*STICK_MAXD; d = STICK_MAXD; }
  s.x = s.ox + dx; s.y = s.oy + dy;
  s.nx = dx / STICK_MAXD; s.ny = dy / STICK_MAXD;
  s.mag = d / STICK_MAXD;
  if (d > 4) s.angle = Math.atan2(dy, dx);
}

uiCanvas.addEventListener('touchstart', e => {
  e.preventDefault();
  input.usingTouch = true;
  Sfx.init();

  for (const t of e.changedTouches){
    const p = touchPos(t);

    if (G.state !== 'playing'){ handleUITap(p.x, p.y); continue; }

    /* ---- 全局按钮 ---- */
    if (hitCircle(p.x, p.y, pauseBtn())){ togglePause(); continue; }
    if (hitCircle(p.x, p.y, viewBtn())){ toggleViewMode(); continue; }

    /* ---- 左下移动摇杆（两种模式通用） ---- */
    const lb = leftBase();
    if (Math.hypot(p.x - lb.x, p.y - lb.y) < 150 && !stickMove.active){
      stickMove.active = true; stickMove.id = t.identifier;
      stickMove.ox = lb.x; stickMove.oy = lb.y;
      updateStick(stickMove, p.x, p.y);
      continue;
    }

    /* ---- 第一人称专属 ---- */
    if (view.mode === 'fps'){
      // 1. 右下射击按钮
      if (hitCircle(p.x, p.y, fpsFireBtn())){
        fireTouch.active = true; fireTouch.id = t.identifier;
        continue;
      }
      // 2. 冲刺按钮
      if (hitCircle(p.x, p.y, fpsDashBtn())){
        tryDash(); continue;
      }
      // 3. 换枪按钮
      if (hitCircle(p.x, p.y, fpsSwitchBtn())){
        cycleWeapon(); continue;
      }
      // 4. 右上区域：滑动旋转视角
      if (inLookZone(p.x, p.y)){
        lookTouch.active = true; lookTouch.id = t.identifier;
        lookTouch.lastX = p.x; lookTouch.lastY = p.y;
        continue;
      }
      // 5. 右下区域其余部分：射击
      if (inFireZone(p.x, p.y)){
        fireTouch.active = true; fireTouch.id = t.identifier;
        continue;
      }
      continue;
    }

    /* ---- 第三人称专属 ---- */
    if (hitCircle(p.x, p.y, dashBtn())){ tryDash(); continue; }
    if (hitCircle(p.x, p.y, switchBtn())){ cycleWeapon(); continue; }

    const rb = rightBase();
    if (Math.hypot(p.x - rb.x, p.y - rb.y) < 165 && !stickAim.active){
      stickAim.active = true; stickAim.id = t.identifier;
      stickAim.ox = rb.x; stickAim.oy = rb.y;
      updateStick(stickAim, p.x, p.y);
    }
  }
}, { passive:false });

uiCanvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches){
    const p = touchPos(t);

    if (stickMove.active && t.identifier === stickMove.id){
      updateStick(stickMove, p.x, p.y);
    }
    if (stickAim.active && t.identifier === stickAim.id){
      updateStick(stickAim, p.x, p.y);
    }
    /* ---- 滑动旋转视角 ---- */
    if (lookTouch.active && t.identifier === lookTouch.id){
      const dx = p.x - lookTouch.lastX;
      const dy = p.y - lookTouch.lastY;
      lookTouch.lastX = p.x; lookTouch.lastY = p.y;

      const sens = FPS_UI.lookSens;
      view.yaw   -= dx * sens;
      view.pitch -= dy * sens;
      view.pitch = clamp(view.pitch, -CFG.camera.maxPitch, CFG.camera.maxPitch);
    }
  }
}, { passive:false });

function endTouch(e){
  e.preventDefault();
  for (const t of e.changedTouches){
    if (stickMove.active && t.identifier === stickMove.id){
      stickMove.active = false; stickMove.id = null;
      stickMove.nx = stickMove.ny = stickMove.mag = 0;
    }
    if (stickAim.active && t.identifier === stickAim.id){
      stickAim.active = false; stickAim.id = null;
      stickAim.nx = stickAim.ny = stickAim.mag = 0;
    }
    if (lookTouch.active && t.identifier === lookTouch.id){
      lookTouch.active = false; lookTouch.id = null;
    }
    if (fireTouch.active && t.identifier === fireTouch.id){
      fireTouch.active = false; fireTouch.id = null;
    }
  }
}
uiCanvas.addEventListener('touchend', endTouch, { passive:false });
uiCanvas.addEventListener('touchcancel', endTouch, { passive:false });

/* ====================== 9. 瞄准 / 移动方向 ====================== */

const _raycaster = new THREE.Raycaster();
const _ndc = new THREE.Vector2();
const _groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const _hitPoint = new THREE.Vector3();

function screenToWorldGround(sx, sy){
  _ndc.x = (sx / cssW) * 2 - 1;
  _ndc.y = -(sy / cssH) * 2 + 1;
  _raycaster.setFromCamera(_ndc, camera);
  const res = _raycaster.ray.intersectPlane(_groundPlane, _hitPoint);
  if (!res) return null;
  return { x: _hitPoint.x, z: _hitPoint.z };
}

function getAimDir(){
  if (view.mode === 'fps'){
    return { x: -Math.sin(view.yaw), z: -Math.cos(view.yaw) };
  }
  if (input.usingTouch){
    if (stickAim.active && stickAim.mag > 0.15){
      const dx = stickAim.nx, dz = stickAim.ny;
      const l = Math.hypot(dx, dz);
      if (l > 0.001) return { x: dx/l, z: dz/l };
    }
    return null;
  }
  const wp = screenToWorldGround(input.mouseX, input.mouseY);
  if (!wp) return null;
  const dx = wp.x - player.x, dz = wp.z - player.z;
  const l = Math.hypot(dx, dz);
  if (l > 0.001) return { x: dx/l, z: dz/l };
  return null;
}

function getMoveDir(){
  let f = 0, s = 0;
  if (input.usingTouch){
    if (stickMove.active && stickMove.mag > 0.12){
      s = stickMove.nx;
      f = -stickMove.ny;
    }
  } else {
    if (input.keys['KeyW'] || input.keys['ArrowUp'])    f += 1;
    if (input.keys['KeyS'] || input.keys['ArrowDown'])  f -= 1;
    if (input.keys['KeyD'] || input.keys['ArrowRight']) s += 1;
    if (input.keys['KeyA'] || input.keys['ArrowLeft'])  s -= 1;
  }
  if (view.mode === 'fps'){
    const fwdX = -Math.sin(view.yaw), fwdZ = -Math.cos(view.yaw);
    const rgtX =  Math.cos(view.yaw), rgtZ = -Math.sin(view.yaw);
    return { x: rgtX * s + fwdX * f, z: rgtZ * s + fwdZ * f };
  }
  return { x: s, z: -f };
}

/* ====================== 10. 粒子 ====================== */

function spawnParticles(x, y, z, count, color, speed, life, dirAngle){
  for (let i = 0; i < count; i++){
    const a = (dirAngle !== undefined) ? dirAngle + rand(-1.2, 1.2) : rand(0, PI2);
    const sp = rand(speed * 0.35, speed);
    particles.push({
      x, y, z,
      vx: Math.cos(a) * sp,
      vy: rand(-30, 110),
      vz: Math.sin(a) * sp,
      life: rand(life*0.5, life), maxLife: life,
      color, drag: 0.90
    });
  }
}
function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    p.vy -= 420 * dt;
    if (p.y < 0){ p.y = 0; p.vy = -p.vy * 0.25; }
    const drag = Math.pow(p.drag, dt * 60);
    p.vx *= drag; p.vz *= drag;
  }
  if (particles.length > MAX_PARTICLES) particles.splice(0, particles.length - MAX_PARTICLES);
}
function syncParticleBuffer(){
  const n = Math.min(particles.length, MAX_PARTICLES);
  for (let i = 0; i < n; i++){
    const p = particles[i];
    particlePos[i*3]   = p.x;
    particlePos[i*3+1] = p.y;
    particlePos[i*3+2] = p.z;
    const a = Math.max(0, p.life / p.maxLife);
    const c = p.color;
    particleCol[i*3]   = ((c >> 16) & 255) / 255 * a;
    particleCol[i*3+1] = ((c >> 8)  & 255) / 255 * a;
    particleCol[i*3+2] = ( c        & 255) / 255 * a;
  }
  particleGeo.setDrawRange(0, n);
  particleGeo.attributes.position.needsUpdate = true;
  particleGeo.attributes.color.needsUpdate = true;
}

/* ====================== 11. 浮动文字 ====================== */

const floatSpriteCache = new Map();
function makeFloatSprite(text, colorCss){
  const key = text + colorCss;
  let tex = floatSpriteCache.get(key);
  if (!tex){
    const c = document.createElement('canvas');
    c.width = 160; c.height = 80;
    const g = c.getContext('2d');
    g.font = 'bold 52px system-ui, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = 6; g.strokeStyle = 'rgba(0,0,0,0.7)';
    g.strokeText(text, 80, 42);
    g.fillStyle = colorCss;
    g.fillText(text, 80, 42);
    tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    floatSpriteCache.set(key, tex);
  }
  const mat = new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false, depthWrite: false
  });
  const sp = new THREE.Sprite(mat);
  sp.scale.set(80, 40, 1);
  return sp;
}
function addFloatText(x, y, z, text, colorCss){
  const sprite = makeFloatSprite(text, colorCss);
  sprite.position.set(x, y, z);
  scene.add(sprite);
  floatTexts.push({ sprite, life:0.95, maxLife:0.95, vy:70 });
}
function updateFloatTexts(dt){
  for (let i = floatTexts.length - 1; i >= 0; i--){
    const f = floatTexts[i];
    f.life -= dt;
    if (f.life <= 0){
      scene.remove(f.sprite);
      f.sprite.material.dispose();
      floatTexts.splice(i, 1);
      continue;
    }
    f.sprite.position.y += f.vy * dt;
    f.vy *= Math.pow(0.9, dt * 60);
    f.sprite.material.opacity = clamp(f.life / f.maxLife, 0, 1);
  }
}

/* ====================== 12. 波次 ====================== */

function startWave(n){
  G.wave = n;
  if (n > CFG.wave.maxWave){ G.state = 'victory'; return; }

  const count = Math.min(CFG.wave.baseCount + n * CFG.wave.perWave, CFG.wave.maxCount);
  const interval = Math.max(0.28, 0.9 - n * 0.045);
  const q = [];
  for (let i = 0; i < count; i++){
    let type = 'rusher';
    if (n >= 2 && i % 3 === 1) type = 'shooter';
    if (n >= 4 && i % 7 === 6) type = 'elite';
    q.push({ type, at: i * interval });
  }
  G.spawnQueue = q;
  G.spawnTimer = 0;
  G.waveActive = true;
  G.banner = { text: '第 ' + n + ' 波', sub: '敌人来袭', t: 2.2 };
  Sfx.wave();
}

function findSpawnPoint(){
  for (let i = 0; i < 140; i++){
    const x = rand(120, W - 120);
    const z = rand(120, H - 120);
    const dx = x - player.x, dz = z - player.z;
    if (dx*dx + dz*dz < 560*560) continue;
    if (pointInObstacle(x, z, 46)) continue;
    return { x, z };
  }
  return { x: rand(140, W-140), z: rand(140, H-140) };
}

function makeEnemy(typeKey, x, z){
  const t = ENEMY_TYPES[typeKey];
  const w = G.wave;
  const hpMul  = 1 + (w-1) * CFG.wave.hpScale;
  const dmgMul = 1 + (w-1) * CFG.wave.dmgScale;
  const spdMul = 1 + (w-1) * CFG.wave.spdScale;

  const mesh = buildEnemyMesh(typeKey);
  mesh.position.set(x, 0, z);
  scene.add(mesh);

  return {
    type: typeKey, x, z, r: t.radius,
    hp: Math.round(t.hp * hpMul),
    maxHp: Math.round(t.hp * hpMul),
    speed: t.speed * spdMul, damage: t.damage * dmgMul,
    angle: 0, state: 'patrol',
    fireCd: rand(0.4, 1.4),
    reloading: false, reloadT: 0,
    ammo: t.ranged ? t.mag : 0,
    hitFlash: 0,
    strafeDir: Math.random() < 0.5 ? -1 : 1,
    wanderAngle: rand(0, PI2),
    dodgeT: 0, dead: false, mesh,
    color: t.color, accent: t.accent, score: t.score,
    melee: !!t.melee, ranged: !!t.ranged,
    attackRange: t.attackRange || 0,
    attackCd: t.attackCd || 1,
    range: t.range || 0,
    keepDist: t.keepDist || 0,
    sightRange: t.sightRange || 700,
    bulletSpeed: t.bulletSpeed || 600,
    bulletLife: t.bulletLife || 1,
    mag: t.mag || 0,
    reloadTime: t.reloadTime || 2,
    fireCdBase: t.fireCd || 1
  };
}

function updateSpawns(dt){
  if (G.spawnQueue.length){
    G.spawnTimer += dt;
    while (G.spawnQueue.length && G.spawnQueue[0].at <= G.spawnTimer){
      const s = G.spawnQueue.shift();
      const p = findSpawnPoint();
      enemies.push(makeEnemy(s.type, p.x, p.z));
      spawnParticles(p.x, 10, p.z, 14, 0x7b8fb3, 170, 0.5);
    }
  }
  if (G.nextWaveTimer > 0){
    G.nextWaveTimer -= dt;
    if (G.nextWaveTimer <= 0) startWave(G.wave + 1);
  }
  if (G.waveActive && G.spawnQueue.length === 0 && enemies.length === 0){
    G.waveActive = false;
    if (G.wave >= CFG.wave.maxWave){
      G.state = 'victory';
    } else {
      G.nextWaveTimer = CFG.wave.intermission;
      G.banner = { text: '第 ' + G.wave + ' 波清除', sub: '下一波 ' + CFG.wave.intermission.toFixed(0) + ' 秒', t: 2.0 };
    }
  }
}

/* ====================== 13. 玩家 ====================== */

function startDash(dirX, dirZ){
  if (player.dashCd > 0 || player.dashTime > 0) return;
  let dx = dirX, dz = dirZ;
  if (!dx && !dz){ dx = player.aimX; dz = player.aimZ; }
  const l = Math.hypot(dx, dz);
  if (l < 0.01) return;
  player.dashDirX = dx / l;
  player.dashDirZ = dz / l;
  player.dashTime = CFG.player.dashDur;
  player.dashCd = CFG.player.dashCd;
  spawnParticles(player.x, 14, player.z, 16, 0x4ecdc4, 190, 0.4,
                 Math.atan2(-player.dashDirZ, -player.dashDirX));
  shake(3);
  Sfx.dash();
}
function tryDash(){
  if (G.state !== 'playing') return;
  const mv = getMoveDir();
  startDash(mv.x, mv.z);
}

function updatePlayer(dt){
  if (player.hitFlash > 0) player.hitFlash -= dt;
  if (player.dashCd > 0) player.dashCd -= dt;

  const dir = getAimDir();
  if (dir){ player.aimX = dir.x; player.aimZ = dir.z; }

  const mv = getMoveDir();
  let mx = mv.x, mz = mv.z;
  const ml = Math.hypot(mx, mz);
  if (ml > 1){ mx /= ml; mz /= ml; }

  if (!input.usingTouch && (input.keys['ShiftLeft'] || input.keys['ShiftRight'])){
    if (player.dashCd <= 0 && player.dashTime <= 0 && (mx !== 0 || mz !== 0)){
      startDash(mx, mz);
    }
  }

  if (player.dashTime > 0){
    player.dashTime -= dt;
    player.vx = player.dashDirX * CFG.player.dashSpeed;
    player.vz = player.dashDirZ * CFG.player.dashSpeed;
    if (Math.random() < 0.75){
      spawnParticles(player.x, 12, player.z, 1, 0x4ecdc4, 50, 0.25);
    }
  } else {
    const k = smoothK(CFG.player.accel, dt);
    player.vx = lerp(player.vx, mx * CFG.player.speed, k);
    player.vz = lerp(player.vz, mz * CFG.player.speed, k);
  }

  player.x += player.vx * dt;
  player.z += player.vz * dt;
  collideObstacles(player);

  updateWeapons(dt);
}

function updateWeapons(dt){
  const ws = curWeapon();
  const w = WEAPONS[ws.key];

  if (ws.cd > 0) ws.cd -= dt;
  if (ws.recoil > 0) ws.recoil = Math.max(0, ws.recoil - dt * 14);

  if (ws.reloading){
    ws.reloadT -= dt;
    if (ws.reloadT <= 0){
      ws.reloading = false;
      ws.ammo = w.mag;
      Sfx.reloadDone();
    }
    return;
  }

  /* ---- 开火判定 ---- */
  let wantFire;
  if (input.usingTouch){
    if (view.mode === 'fps'){
      // 第一人称：射击按钮或右下区域
      wantFire = fireTouch.active;
    } else {
      // 第三人称：右摇杆推出去
      wantFire = (stickAim.active && stickAim.mag > 0.30);
    }
  } else {
    wantFire = input.firing;
  }

  if (!wantFire || ws.cd > 0) return;
  if (ws.ammo <= 0){ startReload(); return; }
  fireWeapon(ws, w);
}

function fireWeapon(ws, w){
//ws.ammo--;（注释掉此行实现无限子弹）
  ws.cd = w.fireRate;
  ws.recoil = Math.min(ws.recoil + w.recoil, w.maxRecoil);

  const baseAng = Math.atan2(player.aimZ, player.aimX);
  const bulletY = (view.mode === 'fps') ? CFG.camera.eyeHeight - 6 : 24;
  const mx = player.x + player.aimX * 32;
  const mz = player.z + player.aimZ * 32;
  const spread = w.spread + ws.recoil * 0.008;

  for (let i = 0; i < w.pellets; i++){
    const a = baseAng + rand(-spread, spread);
    spawnBullet(mx, bulletY, mz, Math.cos(a), Math.sin(a),
                w.bulletSpeed, w.damage, 'player', w.color, w.bulletLife);
  }

  spawnParticles(mx, bulletY, mz, 10, 0xfff0a0, 320, 0.18, baseAng);
  shake(w.shake);
  Sfx.shoot(ws.key);

  player.muzzleLight.intensity = 4.5;
  player.muzzleLight.color.setHex(w.color);

  player.x -= player.aimX * w.recoil * 0.55;
  player.z -= player.aimZ * w.recoil * 0.55;
  collideObstacles(player);

  if (ws.ammo <= 0) startReload();
}

function startReload(){
  const ws = curWeapon();
  const w = WEAPONS[ws.key];
  if (ws.reloading || ws.ammo >= w.mag) return;
  ws.reloading = true;
  ws.reloadT = w.reload;
  Sfx.reloadStart();
}
function switchWeapon(i){
  if (i === player.weaponIndex || i >= player.weapons.length) return;
  player.weaponIndex = i;
  const ws = player.weapons[i];
  ws.reloading = false; ws.reloadT = 0;
  Sfx.click();
}
function cycleWeapon(){ switchWeapon((player.weaponIndex + 1) % player.weapons.length); }

function toggleViewMode(){
  view.mode = (view.mode === 'tps') ? 'fps' : 'tps';

  // 清掉另一模式的触摸状态
  stickAim.active = false; stickAim.mag = 0;
  stickAim.nx = stickAim.ny = 0;
  lookTouch.active = false; lookTouch.id = null;
  fireTouch.active = false; fireTouch.id = null;

  if (view.mode === 'fps'){
    view.yaw = Math.atan2(-player.aimX, -player.aimZ);
    view.pitch = 0;
    if (player.mesh) player.mesh.visible = false;
    if (G.state === 'playing' && !input.usingTouch) requestLock();
  } else {
    if (player.mesh) player.mesh.visible = true;
    releaseLock();
  }
  Sfx.viewSwitch();
}

function hitPlayer(dmg){
  if (G.state !== 'playing') return;
  player.hp -= dmg;
  player.hitFlash = 0.22;
  shake(8);
  Sfx.hurt();
  spawnParticles(player.x, 20, player.z, 12, 0xff4d4d, 240, 0.4);

  if (player.hp <= 0){
    player.hp = 0;
    G.state = 'gameover';
    spawnParticles(player.x, 20, player.z, 56, 0x4ecdc4, 380, 0.95);
    spawnParticles(player.x, 20, player.z, 28, 0xffffff, 300, 0.8);
    shake(20);
    Sfx.explode();
    releaseLock();
  }
}

function hitEnemy(e, dmg, ang){
  e.hp -= dmg;
  e.hitFlash = 0.14;
  spawnParticles(e.x, 20, e.z, 8, e.accent, 190, 0.3, ang + Math.PI);
  if (e.ranged && Math.random() < 0.30 && e.dodgeT <= 0){
    e.dodgeT = rand(0.28, 0.55);
    e.strafeDir *= -1;
  }
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e){
  if (e.dead) return;
  e.dead = true;
  G.score += e.score;
  G.kills++;

  spawnParticles(e.x, 22, e.z, 26, e.color, 320, 0.65);
  spawnParticles(e.x, 22, e.z, 12, 0xffffff, 220, 0.45);
  shake(5);

  if (e.mesh){ scene.remove(e.mesh); e.mesh = null; }

  const chance = (e.type === 'elite') ? CFG.pickup.eliteDropChance : CFG.pickup.dropChance;
  if (Math.random() < chance) spawnPickup(e.x, e.z);
  Sfx.explode();
}

/* ====================== 14. 子弹 ====================== */

function spawnBullet(x, y, z, dirX, dirZ, spd, dmg, owner, color, life){
  const mesh = acquireBullet();
  mesh.material = getBulletMat(color);
  mesh.position.set(x, y, z);
  scene.add(mesh);
  bullets.push({
    x, y, z,
    vx: dirX * spd, vz: dirZ * spd,
    life, damage: dmg, owner, color, r: 4, mesh
  });
}

function updateBullets(dt){
  for (let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.life -= dt;
    if (b.life <= 0){ removeBullet(i); continue; }

    const speed = Math.hypot(b.vx, b.vz);
    const steps = Math.max(1, Math.ceil(speed * dt / 8));
    const sdt = dt / steps;
    let dead = false;

    for (let s = 0; s < steps && !dead; s++){
      b.x += b.vx * sdt;
      b.z += b.vz * sdt;

      if (b.x < 0 || b.z < 0 || b.x > W || b.z > H){
        spawnParticles(b.x, b.y, b.z, 5, b.color, 150, 0.22);
        dead = true; break;
      }
      if (pointInObstacle(b.x, b.z, b.r)){
        spawnParticles(b.x, b.y, b.z, 6, b.color, 180, 0.24);
        dead = true; break;
      }

      if (b.owner === 'player'){
        for (let k = 0; k < enemies.length; k++){
          const e = enemies[k];
          if (e.dead) continue;
          const dx = e.x - b.x, dz = e.z - b.z;
          if (dx*dx + dz*dz < (e.r + b.r) * (e.r + b.r)){
            hitEnemy(e, b.damage, Math.atan2(b.vz, b.vx));
            dead = true; break;
          }
        }
      } else {
        const dx = player.x - b.x, dz = player.z - b.z;
        if (player.hp > 0 && dx*dx + dz*dz < (player.r + b.r) * (player.r + b.r)){
          hitPlayer(b.damage);
          dead = true;
        }
      }
    }

    if (dead) removeBullet(i);
    else if (b.mesh) b.mesh.position.set(b.x, b.y, b.z);
  }
}
function removeBullet(i){
  const b = bullets[i];
  if (b.mesh) releaseBullet(b.mesh);
  bullets.splice(i, 1);
}

/* ====================== 15. 血包 ====================== */

function spawnPickup(x, z){
  const mesh = buildPickupMesh();
  mesh.position.set(x, 0, z);
  scene.add(mesh);
  pickups.push({
    x, z, r: CFG.pickup.radius, life: CFG.pickup.life,
    seed: Math.random()*10, mesh
  });
}
function spawnRandomPickup(){
  for (let i = 0; i < 90; i++){
    const x = rand(120, W - 120);
    const z = rand(120, H - 120);
    if (pointInObstacle(x, z, 34)) continue;
    const dx = x - player.x, dz = z - player.z;
    if (dx*dx + dz*dz < 300*300) continue;
    spawnPickup(x, z);
    return;
  }
}
function updatePickups(dt){
  const MAGNET = CFG.pickup.magnetRange;
  const t = performance.now() / 1000;

  for (let i = pickups.length - 1; i >= 0; i--){
    const p = pickups[i];
    p.life -= dt;
    if (p.life <= 0){ scene.remove(p.mesh); pickups.splice(i, 1); continue; }
    if (player.hp <= 0) continue;

    const dx = player.x - p.x, dz = player.z - p.z;
    const dist = Math.hypot(dx, dz) || 0.0001;

    if (dist < MAGNET && dist > 1){
      const pull = (1 - dist / MAGNET) * 620;
      p.x += (dx / dist) * pull * dt;
      p.z += (dz / dist) * pull * dt;
      p.mesh.position.set(p.x, 0, p.z);
    }

    const spin = p.mesh.userData.spin;
    if (spin){
      spin.rotation.y += dt * 3.2;
      spin.position.y = 22 + Math.sin(t*4 + p.seed) * 4;
    }

    if (dist < player.r + p.r){
      if (player.hp < player.maxHp){
        player.hp = Math.min(player.maxHp, player.hp + CFG.pickup.heal);
        spawnParticles(p.x, 20, p.z, 22, COLORS.heal, 240, 0.55);
        addFloatText(p.x, 40, p.z, '+' + CFG.pickup.heal, '#3ddc84');
      } else {
        G.score += CFG.pickup.scoreBonus;
        spawnParticles(p.x, 20, p.z, 12, 0xffe066, 180, 0.45);
        addFloatText(p.x, 40, p.z, '+' + CFG.pickup.scoreBonus, '#ffe066');
      }
      Sfx.pickup();
      scene.remove(p.mesh);
      pickups.splice(i, 1);
    }
  }

  if (CFG.pickup.spawnInterval > 0 && player.hp > 0){
    G.pickupTimer += dt;
    if (G.pickupTimer >= CFG.pickup.spawnInterval){
      G.pickupTimer = 0;
      if (pickups.length < CFG.pickup.maxOnMap) spawnRandomPickup();
    }
  }
}

/* ====================== 16. 敌人 AI ====================== */

function enemyShoot(e, ang){
  const spread = (e.type === 'elite') ? 0.06 : 0.09;
  const n = (e.type === 'elite') ? 2 : 1;
  for (let i = 0; i < n; i++){
    const a = ang + rand(-spread, spread);
    spawnBullet(
      e.x + Math.cos(a)*(e.r + 14), 24, e.z + Math.sin(a)*(e.r + 14),
      Math.cos(a), Math.sin(a),
      e.bulletSpeed, e.damage, 'enemy', e.accent, e.bulletLife
    );
  }
  spawnParticles(e.x + Math.cos(ang)*(e.r+14), 24, e.z + Math.sin(ang)*(e.r+14),
                 8, e.accent, 260, 0.16, ang);
  Sfx.enemyShoot();
}

function updateEnemy(e, dt){
  if (e.hitFlash > 0) e.hitFlash -= dt;
  if (e.fireCd   > 0) e.fireCd   -= dt;
  if (e.dodgeT   > 0) e.dodgeT   -= dt;

  if (e.reloading){
    e.reloadT -= dt;
    if (e.reloadT <= 0){ e.reloading = false; e.ammo = e.mag; }
  }
  if (e.ranged && e.ammo <= 0 && !e.reloading){
    e.reloading = true;
    e.reloadT = e.reloadTime;
  }

  const dx = player.x - e.x, dz = player.z - e.z;
  const d = Math.hypot(dx, dz) || 0.0001;
  const nx = dx / d, nz = dz / d;
  const los = hasLineOfSight(e.x, e.z, player.x, player.z);
  const playerAlive = player.hp > 0;

  const targetAngle = Math.atan2(dz, dx);
  let da = targetAngle - e.angle;
  while (da > Math.PI) da -= PI2;
  while (da < -Math.PI) da += PI2;
  e.angle += da * Math.min(1, dt * 10);

  if (!playerAlive) e.state = 'patrol';
  else if (e.reloading) e.state = 'reload';
  else if (e.dodgeT > 0) e.state = 'dodge';
  else if (e.melee){
    if (los && d < e.sightRange){
      e.state = (d < e.attackRange + player.r + 6) ? 'attack' : 'chase';
    } else e.state = 'patrol';
  } else {
    if (!los || d > e.range) e.state = 'chase';
    else e.state = 'attack';
  }

  let mvx = 0, mvz = 0;
  switch (e.state){
    case 'patrol':
      mvx = Math.cos(e.wanderAngle);
      mvz = Math.sin(e.wanderAngle);
      e.wanderAngle += rand(-1, 1) * dt * 2.5;
      if (Math.random() < dt * 0.35) e.wanderAngle = rand(0, PI2);
      break;
    case 'chase':
      mvx = nx + (-nz) * e.strafeDir * 0.30;
      mvz = nz + ( nx) * e.strafeDir * 0.30;
      break;
    case 'attack':
      if (e.melee){ mvx = nx * 0.85; mvz = nz * 0.85; }
      else {
        if (d > e.keepDist * 1.25){ mvx = nx; mvz = nz; }
        else if (d < e.keepDist * 0.70){ mvx = -nx * 0.9; mvz = -nz * 0.9; }
        mvx += (-nz) * e.strafeDir * 0.85;
        mvz += ( nx) * e.strafeDir * 0.85;
      }
      break;
    case 'dodge':
      mvx = (-nz) * e.strafeDir * 1.25 - nx * 0.5;
      mvz = ( nx) * e.strafeDir * 1.25 - nz * 0.5;
      break;
    case 'reload':
      mvx = -nx * 0.45 + (-nz) * e.strafeDir * 0.4;
      mvz = -nz * 0.45 + ( nx) * e.strafeDir * 0.4;
      break;
  }

  const ml = Math.hypot(mvx, mvz);
  if (ml > 0.001){ mvx /= ml; mvz /= ml; }

  const spd = e.speed * ((e.state === 'attack') ? 0.88 : 1);
  e.x += mvx * spd * dt;
  e.z += mvz * spd * dt;
  collideObstacles(e);

  if (!playerAlive) return;

  if (e.melee){
    if (e.state === 'attack' && e.fireCd <= 0 && d < e.attackRange + player.r + 10){
      hitPlayer(e.damage);
      e.fireCd = e.attackCd;
      spawnParticles(player.x, 24, player.z, 12, 0xff6b6b, 220, 0.32);
    }
  } else {
    if (e.state === 'attack' && e.fireCd <= 0 && e.ammo > 0 && los){
      enemyShoot(e, Math.atan2(dz, dx));
      e.ammo--;
      e.fireCd = e.fireCdBase * rand(0.85, 1.2);
    }
  }
}

function updateEnemies(dt){
  for (let i = 0; i < enemies.length; i++){
    if (!enemies[i].dead) updateEnemy(enemies[i], dt);
  }

  for (let i = 0; i < enemies.length; i++){
    const a = enemies[i];
    if (a.dead) continue;
    for (let j = i + 1; j < enemies.length; j++){
      const b = enemies[j];
      if (b.dead) continue;
      let dx = b.x - a.x, dz = b.z - a.z;
      const dd = Math.hypot(dx, dz);
      const minD = a.r + b.r;
      if (dd < minD && dd > 0.001){
        const push = (minD - dd) * 0.5;
        dx /= dd; dz /= dd;
        a.x -= dx * push; a.z -= dz * push;
        b.x += dx * push; b.z += dz * push;
      }
    }
  }

  for (let i = 0; i < enemies.length; i++){
    const e = enemies[i];
    if (!e.mesh) continue;
    e.mesh.position.set(e.x, 0, e.z);
    e.mesh.rotation.y = Math.atan2(Math.sin(e.angle), Math.cos(e.angle));

    const flash = e.hitFlash > 0;
    e.mesh.traverse(o => {
      if (o.isMesh && o.material && o.material.emissive){
        o.material.emissiveIntensity = flash ? 3.5 : 0.9;
      }
    });
  }
  enemies = enemies.filter(e => !e.dead);
}

/* ====================== 17. 相机 ====================== */

function updateCameraFPS(){
  const eyeY = CFG.camera.eyeHeight;
  const shakeX = (Math.random() - 0.5) * shakeAmt * 1.2;
  const shakeY = (Math.random() - 0.5) * shakeAmt * 0.8;
  const shakeZ = (Math.random() - 0.5) * shakeAmt * 1.2;

  camera.position.set(player.x + shakeX, eyeY + shakeY, player.z + shakeZ);
  camera.rotation.y = view.yaw;
  camera.rotation.x = view.pitch;
  camera.rotation.z = 0;

  cam.x = player.x; cam.z = player.z;
}

function updateCameraTPS(dt){
  let tx = player.x, tz = player.z;

  if (input.usingTouch){
    if (stickAim.active && stickAim.mag > 0.15){
      const f = Math.min(stickAim.mag, 1);
      const l = Math.hypot(stickAim.nx, stickAim.ny) || 1;
      tx += (stickAim.nx / l) * CFG.camera.maxLead * f;
      tz += (stickAim.ny / l) * CFG.camera.maxLead * f;
    }
  } else {
    const wp = screenToWorldGround(input.mouseX, input.mouseY);
    if (wp){
      const dx = wp.x - player.x, dz = wp.z - player.z;
      const d = Math.hypot(dx, dz);
      if (d > 1){
        const f = Math.min(d, CFG.camera.leadDist) / CFG.camera.leadDist;
        tx += (dx / d) * CFG.camera.maxLead * f;
        tz += (dz / d) * CFG.camera.maxLead * f;
      }
    }
  }

  const margin = 340;
  tx = clamp(tx, margin, W - margin);
  tz = clamp(tz, margin, H - margin);

  const k = smoothK(CFG.camera.smooth, dt);
  cam.x = lerp(cam.x, tx, k);
  cam.z = lerp(cam.z, tz, k);

  const shakeX = (Math.random() - 0.5) * shakeAmt * 2;
  const shakeY = (Math.random() - 0.5) * shakeAmt * 1.5;
  const shakeZ = (Math.random() - 0.5) * shakeAmt * 2;

  camera.position.set(
    cam.x + shakeX,
    CFG.camera.height + shakeY,
    cam.z + CFG.camera.dist + shakeZ
  );
  camera.lookAt(cam.x, 0, cam.z - CFG.camera.lookAhead);
}

function updateCamera(dt){
  if (view.mode === 'fps'){
    updateCameraFPS();
    camera.fov = 78;
  } else {
    updateCameraTPS(dt);
    camera.fov = cssW / cssH < 1 ? 68 : 55;
  }
  camera.updateProjectionMatrix();
}

function updateShake(dt){
  if (shakeAmt > 0){
    shakeAmt *= Math.exp(-CFG.camera.shakeDecay * dt);
    if (shakeAmt < 0.05) shakeAmt = 0;
  }
}
function shake(v){ shakeAmt = Math.min(shakeAmt + v, 28); }

/* ====================== 18. 主更新 ====================== */

function update(dt){
  if (G.state === 'playing'){
    updatePlayer(dt);
    updateEnemies(dt);
    updateBullets(dt);
    updatePickups(dt);
    updateSpawns(dt);
  }

  updateParticles(dt);
  updateFloatTexts(dt);
  updateCamera(dt);
  updateShake(dt);

  if (player.mesh){
    player.mesh.position.set(player.x, 0, player.z);
    player.mesh.rotation.y = Math.atan2(player.aimX, player.aimZ);
    player.mesh.visible = (view.mode !== 'fps');

    const flash = player.hitFlash > 0;
    if (player.bodyMesh){
      player.bodyMesh.material.emissiveIntensity = flash ? 3.5 : 0.9;
    }
  }

  if (player.muzzleLight){
    player.muzzleLight.intensity *= Math.exp(-22 * dt);
    if (player.muzzleLight.intensity < 0.02) player.muzzleLight.intensity = 0;
  }

  sun.position.set(player.x + 260, 900, player.z + 420);
  sun.target.position.set(player.x, 0, player.z);
  sun.target.updateMatrixWorld();

  syncParticleBuffer();

  if (G.banner){
    G.banner.t -= dt;
    if (G.banner.t <= 0) G.banner = null;
  }
}

/* ====================== 19. HUD ====================== */

const UI = { buttons: [] };

function roundRect(c, x, y, w, h, r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y,   x+w, y+h, r);
  c.arcTo(x+w, y+h, x,   y+h, r);
  c.arcTo(x,   y+h, x,   y,   r);
  c.arcTo(x,   y,   x+w, y,   r);
  c.closePath();
}

function drawButton(label, x, y, w, h, cb){
  UI.buttons.push({ x, y, w, h, cb });
  const hov = !input.usingTouch &&
              input.mouseX >= x && input.mouseX <= x+w &&
              input.mouseY >= y && input.mouseY <= y+h;
  uiCtx.fillStyle = hov ? '#4ecdc4' : 'rgba(42,49,67,0.92)';
  roundRect(uiCtx, x, y, w, h, 10); uiCtx.fill();
  uiCtx.strokeStyle = '#4ecdc4'; uiCtx.lineWidth = 2; uiCtx.stroke();
  uiCtx.fillStyle = hov ? '#0d0f14' : '#e6edf7';
  uiCtx.font = 'bold ' + Math.min(20, h*0.42) + 'px system-ui,-apple-system,sans-serif';
  uiCtx.textAlign = 'center';
  uiCtx.textBaseline = 'middle';
  uiCtx.fillText(label, x + w/2, y + h/2 + 1);
}

function handleUITap(px, py){
  for (let i = UI.buttons.length - 1; i >= 0; i--){
    const b = UI.buttons[i];
    if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h){
      Sfx.click(); b.cb(); return true;
    }
  }
  return false;
}

function drawHUD(){
  const pad = 16;

  /* 血条 */
  const barW = clamp(cssW * 0.21, 130, 250);
  const barH = 18;
  const bx = pad + 4, by = pad + 4;

  uiCtx.fillStyle = 'rgba(8,10,14,0.62)';
  roundRect(uiCtx, bx - 6, by - 6, barW + 12, barH + 12, 9);
  uiCtx.fill();

  const hpRatio = clamp(player.hp / player.maxHp, 0, 1);
  if (hpRatio > 0){
    uiCtx.fillStyle = hpRatio > 0.5 ? '#3ddc84' : (hpRatio > 0.25 ? '#feca57' : '#ff4d4d');
    roundRect(uiCtx, bx, by, barW * hpRatio, barH, 5);

  uiCtx.lineWidth = 1;

  uiCtx.font = 'bold 12px system-ui,sans-serif';
  uiCtx.textAlign = 'left';
  uiCtx.textBaseline = 'middle';

  uiCtx.textBaseline = 'middle';

    uiCtx.fillStyle = 'rgba(255,255,255,0.15)';

    roundRect(uiCtx, ax + 14, ay + 32, (boxW - 28) * p, 7, 3.5);
    uiCtx.fill();

    uiCtx.font = '11px system-ui,sans-serif';
    uiCtx.fillStyle = '#4ecdc4';

      uiCtx.fillText(String(i + 1), sx + sw/2, ay + 18.5);

/* ---- 摇杆 ---- */
function drawStick(s, label, color){
  const alpha = s.active ? 0.55 : 0.28;
  uiCtx.globalAlpha = alpha;
  uiCtx.beginPath();
  uiCtx.arc(s.ox, s.oy, STICK_R, 0, PI2);
  uiCtx.fillStyle = 'rgba(20,25,35,0.55)';
  uiCtx.fill();
  uiCtx.strokeStyle = color;
  uiCtx.lineWidth = 2; uiCtx.stroke();

  uiCtx.beginPath();
  uiCtx.arc(s.x, s.y, STICK_R * 0.42, 0, PI2);
  uiCtx.fillStyle = color;
  uiCtx.fill();

  uiCtx.globalAlpha = 0.78;
  uiCtx.fillStyle = '#dfe9f7';
  uiCtx.font = 'bold 11px system-ui,sans-serif';
  uiCtx.textAlign = 'center';
  uiCtx.textBaseline = 'middle';
  uiCtx.fillText(label, s.ox, s.oy + STICK_R + 16);
  uiCtx.globalAlpha = 1;
}

/* ---- 触屏 UI 入口 ---- */
function drawTouchUI(){
  const lb = leftBase();
  if (!stickMove.active){
    stickMove.ox = lb.x; stickMove.oy = lb.y;
    stickMove.x = lb.x;  stickMove.y = lb.y;
  }
  drawStick(stickMove, '移动', '#4ecdc4');

  if (view.mode === 'fps'){
    drawFpsTouchUI();
  } else {
    const rb = rightBase();
    if (!stickAim.active){
      stickAim.ox = rb.x; stickAim.oy = rb.y;
      stickAim.x = rb.x;  stickAim.y = rb.y;
    }
    drawStick(stickAim, '瞄准 / 射击', '#ff9f43');

    // 冲刺
    const db = dashBtn();
    const ready = player.dashCd <= 0;
    uiCtx.beginPath();
    uiCtx.arc(db.x, db.y, db.r, 0, PI2);

    uiCtx.fill();
    uiCtx.strokeStyle = ready ? '#4ecdc4' : 'rgba(255,255,255,0.18)';

  uiCtx.arc(db.x, db.y, db.r, 0, PI2);
  uiCtx.fillStyle = ready ? 'rgba(78,205,196,0.28)' : 'rgba(60,70,90,0.22)';
  uiCtx.fill();
  uiCtx.strokeStyle = ready ? '#4ecdc4' : 'rgba(255,255,255,0.18)';
  uiCtx.lineWidth = 2; uiCtx.stroke();
  if (!ready){
    const p = 1 - player.dashCd / CFG.player.dashCd;
    uiCtx.beginPath();
    uiCtx.arc(db.x, db.y, db.r - 3, -Math.PI/2, -Math.PI/2 + PI2 * p);
    uiCtx.strokeStyle = 'rgba(78,205,196,0.8)';
    uiCtx.lineWidth = 4; uiCtx.stroke();
  }

  uiCtx.textAlign = 'center'; uiCtx.textBaseline = 'middle';

  uiCtx.strokeStyle = wcol;
  uiCtx.lineWidth = 2.5; uiCtx.stroke();
  uiCtx.fillStyle = wcol;
  uiCtx.font = 'bold 12px system-ui,sans-serif';
  uiCtx.textAlign = 'center'; uiCtx.textBaseline = 'middle';

  uiCtx.fillText(wsCur.reloading ? '换弹' : (wsCur.ammo + '/' + wdCur.mag), sb.x, sb.y + 9);
}

/* ---- 准星 ---- */
function drawCrosshair(){
  if (G.state !== 'playing') return;
  if (view.mode === 'tps' && input.usingTouch) return;

  let x, y;
  if (view.mode === 'fps'){
    x = cssW / 2; y = cssH / 2;
  } else {
    x = input.mouseX; y = input.mouseY;
  }

  const ws = curWeapon();
  const wd = WEAPONS[ws.key];
  const gap = 7 + ws.recoil * 1.8 + wd.spread * 60;
  const len = 9;

  uiCtx.save();
  uiCtx.strokeStyle = 'rgba(255,255,255,0.92)';
  uiCtx.lineWidth = 2;
  uiCtx.lineCap = 'round';
  uiCtx.beginPath();
  uiCtx.moveTo(x - gap - len, y); uiCtx.lineTo(x - gap, y);
  uiCtx.moveTo(x + gap, y);       uiCtx.lineTo(x + gap + len, y);
  uiCtx.moveTo(x, y - gap - len); uiCtx.lineTo(x, y - gap);
  uiCtx.moveTo(x, y + gap);       uiCtx.lineTo(x, y + gap + len);
  uiCtx.stroke();

  uiCtx.beginPath();
  uiCtx.arc(x, y, 2, 0, PI2);
  uiCtx.fillStyle = '#4ecdc4';
  uiCtx.fill();
  uiCtx.restore();
}

  drawDim(0.84);
  UI.buttons.length = 0;
  const cx = cssW / 2;

  uiCtx.textAlign = 'center'; uiCtx.textBaseline = 'middle';

  uiCtx.font = 'bold ' + Math.min(60, cssW*0.07) + 'px system-ui,sans-serif';
  uiCtx.fillStyle = '#ff4d4d';
  uiCtx.fillText('你已阵亡', cx, cssH*0.26);

  uiCtx.font = 'bold ' + Math.min(26, cssW*0.028) + 'px system-ui,sans-serif';
  uiCtx.fillStyle = '#ffe066';
  uiCtx.fillText('得分 ' + G.score + '  ·  击杀 ' + G.kills + '  ·  抵达第 ' + G.wave + ' 波', cx, cssH*0.42);

  const bw = Math.min(220, cssW*0.26), bh = Math.min(54, cssH*0.10);
  drawButton('重新开始', cx - bw/2, cssH*0.56, bw, bh, startGame);
}

function drawVictory(){
  drawDim(0.84);
  UI.buttons.length = 0;
  const cx = cssW / 2;

  uiCtx.textAlign = 'center'; uiCtx.textBaseline = 'middle';

  uiCtx.font = 'bold ' + Math.min(60, cssW*0.07) + 'px system-ui,sans-serif';
  uiCtx.fillStyle = '#4ecdc4';
  uiCtx.fillText('胜利！', cx, cssH*0.26);

  uiCtx.font = 'bold ' + Math.min(22, cssW*0.024) + 'px system-ui,sans-serif';
  uiCtx.fillStyle = '#ffe066';
  uiCtx.fillText('你守住了全部 ' + CFG.wave.maxWave + ' 波进攻', cx, cssH*0.40);
  uiCtx.fillText('最终得分 ' + G.score + '  ·  击杀 ' + G.kills, cx, cssH*0.47);

  const bw = Math.min(220, cssW*0.26), bh = Math.min(54, cssH*0.10);
  drawButton('再来一局', cx - bw/2, cssH*0.58, bw, bh, startGame);
}

/* ---- 暗角 ---- */
let vignetteGrad = null, vignetteKey = '';
function drawVignette(){
  const key = cssW + 'x' + cssH;
  if (key !== vignetteKey){
    vignetteGrad = uiCtx.createRadialGradient(
      cssW/2, cssH/2, Math.min(cssW, cssH)*0.36,
      cssW/2, cssH/2, Math.max(cssW, cssH)*0.76
    );
    vignetteGrad.addColorStop(0, 'rgba(0,0,0,0)');
    vignetteGrad.addColorStop(1, 'rgba(0,0,0,0.55)');
    vignetteKey = key;
  }
  uiCtx.fillStyle = vignetteGrad;
  uiCtx.fillRect(0, 0, cssW, cssH);
}

/* ====================== 20. 渲染 ====================== */

function renderUI(){
  uiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  uiCtx.clearRect(0, 0, cssW, cssH);

  if (G.state === 'menu'){ drawMenu(); return; }

  drawVignette();
  drawHUD();
  if (input.usingTouch && G.state === 'playing') drawTouchUI();
  drawBanner();

  if (G.state === 'paused')   drawPaused();
  if (G.state === 'gameover') drawGameOver();
  if (G.state === 'victory')  drawVictory();

  drawCrosshair();
}

function render(){
  renderer.render(scene, camera);
  renderUI();
}

/* ====================== 21. 流程 ====================== */

function resetGame(){
  G.score = 0; G.kills = 0; G.wave = 0;
  G.waveActive = false;
  G.spawnQueue = []; G.spawnTimer = 0; G.nextWaveTimer = 0;
  G.pickupTimer = 0; G.banner = null;

  for (const b of bullets) if (b.mesh) releaseBullet(b.mesh);
  bullets.length = 0;

  for (const e of enemies) if (e.mesh) scene.remove(e.mesh);
  enemies.length = 0;

  for (const p of pickups) scene.remove(p.mesh);
  pickups.length = 0;

  for (const f of floatTexts){ scene.remove(f.sprite); f.sprite.material.dispose(); }
  floatTexts.length = 0;

  particles.length = 0;

  player.x = 320; player.z = 720;
  player.vx = 0; player.vz = 0;
  player.hp = player.maxHp = CFG.player.hp;
  player.aimX = 1; player.aimZ = 0;
  player.hitFlash = 0;
  player.dashTime = 0; player.dashCd = 0;
  player.weaponIndex = 0;
  player.weapons = WEAPON_ORDER.map(newWeaponState);

  cam.x = clamp(player.x, 340, W - 340);
  cam.z = clamp(player.z, 340, H - 340);
  shakeAmt = 0;

  view.pitch = 0;
  view.yaw = Math.atan2(-player.aimX, -player.aimZ);

  stickMove.active = false; stickMove.mag = 0;
  stickAim.active = false;  stickAim.mag = 0;
  lookTouch.active = false; lookTouch.id = null;
  fireTouch.active = false; fireTouch.id = null;
  input.firing = false;

  if (player.mesh){
    player.mesh.position.set(player.x, 0, player.z);
    player.mesh.visible = (view.mode !== 'fps');
  }
}

function startGame(){
  Sfx.init();
  resetGame();
  G.state = 'playing';
  startWave(1);
  if (view.mode === 'fps' && !input.usingTouch) requestLock();
}

function togglePause(){
  if (G.state === 'playing'){ G.state = 'paused'; releaseLock(); }
  else if (G.state === 'paused'){
    G.state = 'playing';
    if (view.mode === 'fps' && !input.usingTouch) requestLock();
  }
}

/* ====================== 22. 尺寸 ====================== */

function resize(){
  cssW = window.innerWidth;
  cssH = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);

  renderer.setPixelRatio(dpr);
  renderer.setSize(cssW, cssH, false);

  uiCanvas.width  = Math.max(1, Math.floor(cssW * dpr));
  uiCanvas.height = Math.max(1, Math.floor(cssH * dpr));
  uiCanvas.style.width = cssW + 'px';
  uiCanvas.style.height = cssH + 'px';

  camera.aspect = cssW / cssH;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));

/* ====================== 23. 主循环 ====================== */

let lastT = 0;
function loop(t){
  requestAnimationFrame(loop);
  if (!lastT) lastT = t;
  let dt = (t - lastT) / 1000;
  lastT = t;
  if (dt > 0.05) dt = 0.05;
  if (dt <= 0) return;
  update(dt);
  render();
}

/* ====================== 24. 启动 ====================== */

resize();
buildPlayerMesh();
input.mouseX = cssW / 2;
input.mouseY = cssH * 0.35;

cam.x = clamp(player.x, 340, W - 340);
cam.z = clamp(player.z, 340, H - 340);
view.yaw = Math.atan2(-player.aimX, -player.aimZ);
/* ========== 作弊快捷键 ========== */
window.CHEAT = {
  god: false,
  infAmmo: false,
  oneShot: false,
  infDash: false,
  speedMul: 1,
};

window.addEventListener('keydown', e => {
  if (e.repeat) return;
  switch(e.code){
    case 'F1': CHEAT.god = !CHEAT.god; console.log('无敌', CHEAT.god); break;
    case 'F2': CHEAT.infAmmo = !CHEAT.infAmmo; console.log('无限弹药', CHEAT.infAmmo); break;
    case 'F3': CHEAT.oneShot = !CHEAT.oneShot; console.log('秒杀', CHEAT.oneShot); break;
    case 'F4': CHEAT.infDash = !CHEAT.infDash; console.log('无限冲刺', CHEAT.infDash); break;
    case 'KeyH': player.hp = player.maxHp; console.log('回满血'); break;
    case 'KeyJ': G.score += 10000; console.log('加分'); break;
    case 'KeyK': [...enemies].forEach(killEnemy); console.log('清屏'); break;
    case 'KeyN': 
      [...enemies].forEach(killEnemy);
      G.spawnQueue.length = 0;
      G.waveActive = false;
      G.nextWaveTimer = 0.05;
      console.log('跳波'); break;
  }
});
requestAnimationFrame(loop);
</script>
