}
// 太极阵：以角色为中心，扭转周围 TAIJI_RADIUS 范围内的黑白棋颜色（黑↔白互换）
function castTaijiZhen(p) {
  const cx = p.cx, cy = p.cy;
  const flipped = [];
  for (let dy = -TAIJI_RADIUS; dy <= TAIJI_RADIUS; dy++) for (let dx = -TAIJI_RADIUS; dx <= TAIJI_RADIUS; dx++) {
    const nx = cx + dx, ny = cy + dy;
    if (!inB(nx, ny)) continue;
    const c = state.board[ny][nx];
    if (c === BLACK) { setCell(nx, ny, WHITE); flipped.push({ x: nx, y: ny }); }
    else if (c === WHITE) { setCell(nx, ny, BLACK); flipped.push({ x: nx, y: ny }); }
  }
  if (flipped.length) {
    state.taijiFx.push({ x: cx, y: cy, until: performance.now() + 800 });
    state.explosions.push({ cells: flipped, color: BLACK, until: performance.now() + 400, kind: 'capture' });
  }
  Bus.emit('taijiZhen', { player: p, cells: flipped });
}
function updateUfos(dt) {
  const now = performance.now();
  for (let i = state.ufos.length - 1; i >= 0; i--) {
    const u = state.ufos[i];
    if (now >= u.until) { state.ufos.splice(i, 1); continue; } // 到期消失
    // 周期性随机转向（乱飞）
    u.turnT -= dt;
    if (u.turnT <= 0) {
      u.turnT = UFO_TURN_INTERVAL * (0.6 + Math.random() * 0.8);
      const ang = Math.random() * Math.PI * 2;
      u.vx = Math.cos(ang) * UFO_SPEED; u.vy = Math.sin(ang) * UFO_SPEED;
    }
    u.x += u.vx * dt; u.y += u.vy * dt;
    // 仅在有效棋盘内活动（不进入墙格），在棋盘内边缘反弹
    if (u.x < WALL_PAD) { u.x = WALL_PAD; u.vx = Math.abs(u.vx); }
    else if (u.x > N - WALL_PAD) { u.x = N - WALL_PAD; u.vx = -Math.abs(u.vx); }
    if (u.y < WALL_PAD) { u.y = WALL_PAD; u.vy = Math.abs(u.vy); }
    else if (u.y > N - WALL_PAD) { u.y = N - WALL_PAD; u.vy = -Math.abs(u.vy); }
    // 随机吸走棋子 / 随机释放棋子（两种功能并存，周期性概率判定）
    u.suckT -= dt;
    if (u.suckT <= 0) {
      u.suckT = UFO_SUCK_INTERVAL;
      const gx = Math.floor(u.x), gy = Math.floor(u.y);
      if (inB(gx, gy)) {
        const c = state.board[gy][gx];
        if ((c === BLACK || c === WHITE) && Math.random() < UFO_SUCK_CHANCE) {
          // 吸收：带走脚下棋子
          setCell(gx, gy, EMPTY);
          state.explosions.push({ cells: [{ x: gx, y: gy }], color: c, until: now + 300, kind: 'capture' });
          for (let k = 0; k < 4; k++) state.particles.push({ x: u.x, y: u.y, vx: (Math.random() - .5) * 4, vy: -1 - Math.random() * 3, t: 0, life: .4, size: 2 + Math.random() * 2, color: 'rgb(120,247,200)' });
        } else if (c === EMPTY && Math.random() < UFO_RELEASE_CHANCE) {
          // 释放：在空格随机落下黑/白棋子
          const nc = Math.random() < 0.5 ? BLACK : WHITE;
          setCell(gx, gy, nc);
          state.explosions.push({ cells: [{ x: gx, y: gy }], color: nc, until: now + 300 });
          for (let k = 0; k < 4; k++) state.particles.push({ x: u.x, y: u.y, vx: (Math.random() - .5) * 4, vy: -1 - Math.random() * 3, t: 0, life: .4, size: 2 + Math.random() * 2, color: nc === BLACK ? 'rgb(40,40,40)' : 'rgb(220,220,220)' });
        }
      }
    }
  }
}
// 固定刷新点：定时在空格刷出升级道具
function updateUpgradeSpawns(dt) {
  for (const s of state.upgradeSpawns) {
    s.t -= dt;
    if (s.t <= 0) {
      s.t = FIXED_SPAWN_INTERVAL;
      if (state.board[s.y][s.x] === EMPTY && !state.pickups.some(pk => pk.x===s.x && pk.y===s.y)) {
        spawnUpgradePickup(s.x, s.y);
      }
    }
  }
}

function updateChasers(dt) {
  for (let i=state.chasers.length-1; i>=0; i--) {
    const c = state.chasers[i];
    c.timer -= dt;
    let target=null, best=Infinity;
    for (const p of Object.values(state.players)) {
      if (p.alive && p.color !== c.color) { const d=Math.hypot(p.x-c.x,p.y-c.y); if (d<best){ best=d; target=p; } }
    }
    let boom = false;
    if (target) {
      const dx=target.x-c.x, dy=target.y-c.y, d=Math.hypot(dx,dy);
      if (d > 0.01) movePlayer(c, dx/d*CFG.CHASER_SPEED*dt, dy/d*CFG.CHASER_SPEED*dt);
      if (Math.hypot(target.x-c.x, target.y-c.y) < 1.2) boom = true;
    }
    if (c.timer <= 0) boom = true;
    if (boom) {
      state.chasers.splice(i,1);
      BombManager.explode({ x: Math.floor(c.x), y: Math.floor(c.y), color: c.color, power: c.power, shape:'cross', owner: c.owner });
    }
  }
}

/* ===================== 玩家生死 / 技能 ===================== */
function killPlayer(p) {
  if (!p.alive) return;
  if (p.shield) { p.shield = false; addShake(0.45); Bus.emit('shieldBlocked', { player:p }); return; } // 护盾免疫 1 次（抵消时屏幕颤抖）
  const res = HEROES[p.hero].resist || 0;
  if (res > 0 && Math.random() < res) { Bus.emit('resist', { player:p }); return; }
  p.alive = false; p.respawnAt = nowSec() + RESPAWN;
  addShake(0.7); // 被炸死：屏幕颤抖（配合黑白画面）
  clearOwnTiles(p); // 死亡惩罚：该方已染色格随机消失 30%
  Bus.emit('playerDied', { player:p });
}
// 死亡惩罚：随机清除该方 30% 的染色格
function clearOwnTiles(p) {
  const cells = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
    if (state.board[y][x] === p.color) cells.push({ x, y });
  if (!cells.length) return;
  for (let i = cells.length - 1; i > 0; i--) { const j = (Math.random()*(i+1))|0; const t = cells[i]; cells[i]=cells[j]; cells[j]=t; }
  const remove = Math.floor(cells.length * 0.30);
  for (let i = 0; i < remove; i++) setCell(cells[i].x, cells[i].y, EMPTY);
  Bus.emit('tilesCleared', { player: p, count: remove });
}
function respawn(p) {
  p.alive = true;
  const cells = state.respawnCells.filter(c => c.half === p.color);
  if (cells.length) { const c = cells[(Math.random()*cells.length)|0]; p.cx = c.x; p.cy = c.y; p.x = c.x + 0.5; p.y = c.y + 0.5; }
  else { p.cx = Math.floor(p.startX); p.cy = Math.floor(p.startY); p.x = p.startX; p.y = p.startY; }
  p.moving = false; p.walking = false; p.fx = p.cx; p.fy = p.cy; p.moveT = 1;
  p.pushDur = 0; p.pushT = 0;
  p.spawnAt = performance.now(); // 重生放大动效时间基准
  Bus.emit('playerRespawned', { player:p });
}
function startActive(p) {
  const hero = HEROES[p.hero];
  if (!hero.active) return;
  if (!p.alive || p.skill.cd > 0) return;
  if (hero.c4) { useC4(p); return; }               // C4：第一次放置 / 第二次引爆
  if (hero.activeCharge) {                          // 蓄力式（柯洁）
    if (p.skill.charging) return;
    p.skill.charging = true; p.skill.chargeLeft = hero.activeCharge;
    Bus.emit('skillStarted', { player:p });
    return;
  }
  fireActive(p);                                     // 即时式（褚嬴）
}
function fireActive(p) {
  const hero = HEROES[p.hero];
  if (hero.chase) {                                  // 褚嬴：召唤追击自爆人
    castChaser(p);
    p.skill.cd = hero.activeCooldown;
    Bus.emit('activeFired', { player:p });
    return;
  }
  if (hero.trail) {                                  // 战鹰：开启炸弹足迹
    p.trail = TRAIL_STEPS;
    p.skill.cd = hero.activeCooldown;
    Bus.emit('activeFired', { player:p });
    return;
  }
  if (hero.timeActive) {                             // 时光：下一枚棋子爆炸范围 +1
    p.powerNext += 1;
    p.skill.cd = hero.activeCooldown;
    Bus.emit('activeFired', { player:p });
    return;
  }
  if (hero.dye) {                                    // 俞亮：接下来 N 步染色脚下 3×3
    p.dyeSteps = hero.dyeSteps;
    p.skill.cd = hero.activeCooldown;
    Bus.emit('activeFired', { player:p });
    return;
  }
  if (hero.circle) {                                 // 柯洁：蓄力结束后在角色身边直接爆炸（像素圆，半径 activeRadius）
    const { cells, destructs } = BombManager.blastCircle(p.cx, p.cy, hero.activeRadius);
    BombManager.applyBlast(cells, destructs, p.color, p.id, { selfBlast: true });
    p.bombSeq++; p.skill.cd = hero.activeCooldown;
    p.reinforced = false;
    p.memeFlashT = 1.0;                              // 爆炸瞬间闪烁「难绷」表情包（时长 2 倍）
    p.memeFlashX = p.cx;
    p.memeFlashY = p.cy;
    Bus.emit('activeFired', { player:p });
    return;
  }
  // 默认主动（通用兜底）：放一枚超大普通炸弹
  const shape = hero.altShape ? ((p.bombSeq % 2 === 0) ? 'cross' : 'x') : 'cross';
  const power = playerPower(p) + (hero.activePowerBonus || 0);
  const bx = p.cx, by = p.cy;
  p.bombSeq++; p.skill.cd = hero.activeCooldown;
  p.reinforced = false;
  BombManager.place({ x: bx, y: by, owner: p.id, color: p.color, power, shape, timer: CFG.FUSE, maxTimer: CFG.FUSE, super: true, pushT: 0 });
  Bus.emit('activeFired', { player:p });
}
// 阿尔法狗 C4 棋子：第一次放置，第二次引爆
function useC4(p) {
  if (p.c4) { detonateC4(p); return; }
  const bx = p.cx, by = p.cy;
  if (state.bombs.some(b => b.x === bx && b.y === by)) return; // 该格已有炸弹则忽略
  p.c4 = { x: bx, y: by, t: performance.now() };
  Bus.emit('c4Placed', { player:p });
}
function detonateC4(p) {
  const c = p.c4; if (!c) return;
  const hero = HEROES[p.hero];
  const power = playerPower(p) + C4_POWER_BONUS;
  p.c4 = null; p.skill.cd = hero.activeCooldown;
  BombManager.explode({ x: c.x, y: c.y, color: p.color, power, shape: 'cross', owner: p.id });
  Bus.emit('c4Boom', { player:p });
}
function updatePlayer(p, dt) {
  if (p.bombCd > 0) p.bombCd -= dt;
  if (p.speedBoostT > 0) p.speedBoostT -= dt;
  if (p.selfBlastT > 0) { // 被自己炸弹炸到 → 3 秒内持续染色脚下；站在对方颜色格子上时时间两倍速衰减
    const oppColor = p.color === BLACK ? WHITE : BLACK;
    // 以立绘视觉所在格为准：插值移动时染色跟随立绘，而不是逻辑格（否则脚下先染色、立绘后到）
    const vx = Math.floor(p.x), vy = Math.floor(p.y);
    const rate = (inB(vx, vy) && state.board[vy][vx] === oppColor) ? 2 : 1;
    p.selfBlastT -= dt * rate;
    if (paintCell(p, vx, vy)) resolveGoCaptures(p.color);
  }
  if (p.memeFlashT > 0) p.memeFlashT -= dt;
  if (p.skillFlashT > 0) p.skillFlashT -= dt;
  const sk = p.skill;
  if (sk.charging) { sk.chargeLeft -= dt; if (sk.chargeLeft <= 0) { sk.charging = false; fireActive(p); } }
  if (sk.cd > 0) sk.cd -= dt;
  if (p.turnT > 0) p.turnT -= dt;
  if (!p.alive && nowSec() >= p.respawnAt) respawn(p);
  advanceMove(p, dt);
  advancePush(p, dt);
}

/* ===================== 输入 ===================== */
function focusGame() {
  try {
    if (document.activeElement !== canvas) canvas.focus({ preventScroll: true });
    window.focus();
  } catch (_) {}
}
const Input = {
  keys: {},
  pressSeq: {}, // 方向键按下时间戳（用于多键同按时取「最先按下」的朝向）
  stick: { x: 0, y: 0 }, // 虚拟摇杆方向（-1..1）
  init() {
    window.addEventListener('keydown', e => this.onKey(e, true));
    window.addEventListener('keyup',   e => this.onKey(e, false));
    window.addEventListener('blur',    () => { this.keys = {}; this.pressSeq = {}; });
    // 部署在 iframe（B站 Toy）里时，键盘事件只发给当前聚焦的文档：给画布加 tabindex 并主动聚焦，
    // 这样无需先点击也能直接读取键盘；任何点击/触摸后再次聚焦，避免父页面抢走焦点导致按键失灵
    focusGame();
    window.addEventListener('pointerdown', focusGame, true);
    window.addEventListener('focus', focusGame);
  },
  onKey(e, down) {
    const k = e.key.toLowerCase();
    if (e.code === 'Space' || k.indexOf('arrow') === 0) e.preventDefault();
    const wasDown = !!this.keys[k];
    this.keys[k] = down;
    if (down && !wasDown && DIR_KEYS[k]) this.pressSeq[k] = performance.now();
    if (!down) delete this.pressSeq[k];
    if (down) handleKey(k);
  },
};

// 虚拟方向键（D-pad）当前按下的方向（-1/0/1），供 humanInput 读取
const dpad = { dx: 0, dy: 0 };

// 方向物理键 → 朝向名：多键同按时取「最先按下」的那个方向
const DIR_KEYS = {
  'w': 'up', 'arrowup': 'up',
  's': 'down', 'arrowdown': 'down',
  'a': 'left', 'arrowleft': 'left',
  'd': 'right', 'arrowright': 'right',
};
function firstHeldDirKey() {
  let first = null, t = Infinity;
  for (const k in DIR_KEYS) {
    if (Input.keys[k]) {
      const pt = Input.pressSeq[k] || 0;
      if (pt < t) { t = pt; first = k; }
    }
  }
  return first;
}

function handleKey(k) {
  if (screen === 'title') {
    if (k === ' ' || k === 'enter') screen = 'mode';
    else if (k === 't' || k === 'l') openLink();
    else if (k === 'h') screen = 'instructions';
  } else if (screen === 'rank') {
    if (k === 'escape') closeRank();
  } else if (screen === 'link') {
    if (k === 'escape') screen = 'title';
  } else if (screen === 'instructions') {
    if (k === 'escape') screen = 'title';
  } else if (screen === 'settings') {
    if (k === 'escape') closeSettings();
  } else if (screen === 'mode') {
    if (k === 'w' || k === 's' || k === 'arrowup' || k === 'arrowdown') menu.modeIdx = 1 - menu.modeIdx;
    else if (k === ' ' || k === 'enter') startBounce('mode', menu.modeIdx, goSelect);
    else if (k === 'escape') screen = 'title';
  } else if (screen === 'select') {
    if (menu.phase === 1 || menu.phase === 2) {
      if (k === 'escape') { menu.phase = 0; menu.sel = menu.p1; } // 确认/抽卡中 Esc 返回重选 P1
    } else {
      if (k === 'a' || k === 'arrowleft') menu.sel = nextSelectable(menu.sel, -1);
      else if (k === 'd' || k === 'arrowright') menu.sel = nextSelectable(menu.sel, 1);
      else if ((k === ' ' || k === 'enter') && menu.sel >= 0) startBounce('select', menu.sel, () => confirmSelect());
      else if (k === 'escape') screen = 'mode';
    }
  } else if (screen === 'map') {
    if (k === 'a' || k === 'arrowleft') menu.mapIdx = (menu.mapIdx + MAPS.length - 1) % MAPS.length;
    else if (k === 'd' || k === 'arrowright') menu.mapIdx = (menu.mapIdx + 1) % MAPS.length;
    else if (k === ' ' || k === 'enter') startBounce('map', menu.mapIdx, () => confirmMap());
    else if (k === 'escape') { menu.phase = 0; menu.sel = menu.p1; screen = 'select'; }
  } else if (screen === 'playing') {
    if (k === ' ') BombManager.tryPlace(state.players.p1);
    else if (k === 'q') castFront(state.players.p1);
    else if (k === 'f') startActive(state.players.p1);
    else if (k === 'e') interact(state.players.p1);
    else if (k === 'r') restart();
    else if (k === 'escape') screen = 'title';
  } else if (screen === 'gameover') {
    if (k === 'n' && state.winner === BLACK) nextLevel();
    else if (k === ' ' || k === 'enter' || k === 'r') restart();
    else if (k === 'escape') screen = 'title';
  }
}
// 推进棋格：踩到后沿方向平滑推进（无需手动触发）
function tryPush(p) {
  if (!p.alive || p.moving || p.pushDur > 0) return false;
  if (p.isBot) return false; // NPC 不触发推进棋格
  const cx = p.cx, cy = p.cy;
  const pc = state.pushCells.find(c => c.x===cx && c.y===cy);
  if (!pc) return false;
  let nx = cx, ny = cy;
  for (let i=0;i<PUSH_DISTANCE;i++) {
    const tx = nx - pc.dx, ty = ny - pc.dy;
    if (!passable(state.board, tx, ty)) break; // 撞墙停止
    nx = tx; ny = ty;
  }
  if (nx !== cx || ny !== cy) {
    // 平滑滑动：从当前位置 easeOutCubic 滑到目标格中心，而非瞬间闪现
    p.pushFromX = p.x; p.pushFromY = p.y;
    p.pushToX = nx + 0.5; p.pushToY = ny + 0.5;
    const dist = Math.abs(nx - cx) + Math.abs(ny - cy);
    p.pushDur = PUSH_ANIM_SEC * dist;
    p.pushT = 0;
    // 面向被推的方向
    const fdx = -pc.dx, fdy = -pc.dy;
    p.faceDir = { dx: fdx, dy: fdy };
    const nf = dirKey(fdx, fdy);
    if (nf !== p.face) { p.turnFrom = p.face; p.turnTo = nf; p.turnT = TURN_SEC; }
    p.face = nf;
    // 逻辑格立即推进，避免滑动期间再次触发推进/染色
    p.cx = nx; p.cy = ny; p.fx = nx; p.fy = ny;
    p.walking = false;
  }
  Bus.emit('pushed', { player:p });
  return true;
}
// 将 (x1,y1)→(x2,y2) 直线路径上的格染成 p.color（传送路径染色）
function dyePath(p, x1, y1, x2, y2) {
  const steps = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1));
  const cells = [];
  for (let i = 0; i <= steps; i++) {
    const t = steps === 0 ? 0 : i / steps;
    const nx = Math.round(x1 + (x2 - x1) * t);
    const ny = Math.round(y1 + (y2 - y1) * t);
    if (paintCell(p, nx, ny)) cells.push({ x: nx, y: ny });
  }
  if (cells.length) {
    state.explosions.push({ cells, color: p.color, until: performance.now() + 350 });
    resolveGoCaptures(p.color);
  }
  return cells;
}
function interact(p) {
  if (!p.alive || p.moving) return;
  const cx = p.cx, cy = p.cy;
  const tc = state.teleportCells.find(c => c.x===cx && c.y===cy);
  if (tc) {
    // 浸染状态持续期间 / 俞亮技能（五步染阵）激活时：传送路径一并染色
    if (p.selfBlastT > 0 || (p.hero === 'yuliang' && p.dyeSteps > 0)) {
      dyePath(p, cx, cy, tc.tx, tc.ty);
    }
    // 记录传送轨迹（起点 → 终点，虚线淡出消失）
    state.teleportTrails.push({ fx: cx, fy: cy, tx: tc.tx, ty: tc.ty, until: performance.now() + TELEPORT_TRAIL_MS });
    p.cx = tc.tx; p.cy = tc.ty; p.x = tc.tx + 0.5; p.y = tc.ty + 0.5; p.moving = false; p.fx = p.cx; p.fy = p.cy;
    p.teleportAt = performance.now(); // 传送缩放动效时间基准
    Bus.emit('teleport', { player:p });
  }
}
function humanInput(p, dt) {
  if (!p.alive) return;
  if (p.pushDur > 0) return; // 推进滑动期间暂停自由移动输入
  let dx = 0, dy = 0, usingDpad = false;
  if (dpad.dx || dpad.dy) { dx = dpad.dx; dy = dpad.dy; usingDpad = true; }
  else {
    if (Input.keys['w'] || Input.keys['arrowup']) dy -= 1;
    else if (Input.keys['s'] || Input.keys['arrowdown']) dy += 1;
    if (Input.keys['a'] || Input.keys['arrowleft']) dx -= 1;
    else if (Input.keys['d'] || Input.keys['arrowright']) dx += 1;
  }
  if (!dx && !dy) { p.walking = false; return; }
  // 泡泡堂式自由移动：连续位移、不吸附到格子中心
  const onOwn = state.board[p.cy][p.cx] === p.color;
  const spd = CFG.SPEED * (onOwn ? CFG.OWN_TILE_BOOST : 1) * (p.speedBoostT > 0 ? CFG.SPEED_BOOST_FACTOR : 1);
  const len = Math.hypot(dx, dy);
  movePlayer(p, dx / len * spd * dt, dy / len * spd * dt);
  // 面向：摇杆取「分量最大」的轴（上下左右）；键盘同时按两个方向键时取「最先按下」的键
  let fdx = dx, fdy = dy;
  if (usingDpad) {
    if (Math.abs(dx) >= Math.abs(dy)) { fdx = Math.sign(dx); fdy = 0; }
    else { fdx = 0; fdy = Math.sign(dy); }
  } else if (dx && dy) {
    const fk = firstHeldDirKey();
    const fd = fk && DIR_KEYS[fk];
    if (fd === 'up') { fdx = 0; fdy = -1; }
    else if (fd === 'down') { fdx = 0; fdy = 1; }
    else if (fd === 'left') { fdx = -1; fdy = 0; }
    else if (fd === 'right') { fdx = 1; fdy = 0; }
  }
  p.faceDir = { dx: fdx, dy: fdy };
  const nf = dirKey(fdx, fdy);
  if (nf !== p.face) { p.turnFrom = p.face; p.turnTo = nf; p.turnT = TURN_SEC; }
  p.face = nf;
  // 行走动画：累计移动距离驱动帧循环
  p.walking = true;
  p.moveT += spd * dt;
  // 逻辑格同步（floor 取当前所在格）与「进入新格」判定
  const ocx = p.cx, ocy = p.cy;
  p.cx = Math.floor(p.x); p.cy = Math.floor(p.y);
  if (p.cx !== ocx || p.cy !== ocy) {
    if (p.trail > 0) { p.trail--; BombManager.placeTrail(p); } // 战鹰「炸弹足迹」
    stepDye(p);                                               // 俞亮逐格染色
    tryPush(p);                                               // 推进棋格
    p.cx = Math.floor(p.x); p.cy = Math.floor(p.y);           // tryPush 可能再次改变位置
  }
}

/* ===================== Bot AI ===================== */
// BFS 寻路：返回从起点格 (fx,fy) 走到目标格 (tx,ty) 的下一步偏移 {mx,my}；不可达返回 null
function findNextStep(fx, fy, tx, ty, extraBlocked) {
  if (fx === tx && fy === ty) return null;
  const blocked = (x, y) => {
    if (!inB(x, y)) return true;
    if (isSolid(state.board[y][x])) return true;
    if (extraBlocked && extraBlocked(x, y)) return true;
    return false;
  };
  if (blocked(tx, ty)) return null;
  const prev = new Int16Array(N * N).fill(-2);   // -2 未访问，-1 起点
  const qx = new Int16Array(N * N), qy = new Int16Array(N * N);
  let head = 0, tail = 0;
  qx[tail] = fx; qy[tail] = fy; tail++;
  prev[fy * N + fx] = -1;
  while (head < tail) {
    const cx = qx[head], cy = qy[head]; head++;
    if (cx === tx && cy === ty) break;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (blocked(nx, ny) || prev[ny * N + nx] !== -2) continue;
      prev[ny * N + nx] = cx * N + cy;   // 记录父格
      qx[tail] = nx; qy[tail] = ny; tail++;
    }
  }
  if (prev[ty * N + tx] === -2) return null;    // 不可达
  let cx = tx, cy = ty, nx = tx, ny = ty;
  while (prev[cy * N + cx] !== -1) {
    nx = cx; ny = cy;
    const p = prev[cy * N + cx];
    cx = (p / N) | 0; cy = p % N;
  }
  return { mx: nx - fx, my: ny - fy };
}

// 敌弹危险区（己弹同色不伤己，无需躲避；只避敌方炸弹的爆炸范围）
function enemyDangerCells(p) {
  const danger = new Set();
  for (const b of state.bombs) {
    if (b.owner === p.id) continue;
    const { cells, destructs } = BombManager.blastCells(b.x, b.y, b.power, b.shape);
    for (const c of cells) danger.add(c.y * N + c.x);
    for (const d of destructs) danger.add(d.y * N + d.x);
  }
  return danger;
}
// 身处危险区时：BFS 找最近安全格，返回下一步偏移
function findEscapeStep(fx, fy, danger) {
  const safe = (x, y) => inB(x, y) && !isSolid(state.board[y][x]) && !danger.has(y * N + x);
  if (safe(fx, fy)) return null;
  const prev = new Int16Array(N * N).fill(-2);
  const qx = new Int16Array(N * N), qy = new Int16Array(N * N);
  let head = 0, tail = 0;
  qx[tail] = fx; qy[tail] = fy; tail++; prev[fy * N + fx] = -1;
  let goal = null;
  while (head < tail) {
    const cx = qx[head], cy = qy[head]; head++;
    if (safe(cx, cy)) { goal = { cx, cy }; break; }
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (!inB(nx, ny) || isSolid(state.board[ny][nx]) || prev[ny * N + nx] !== -2) continue;
      prev[ny * N + nx] = cx * N + cy;
      qx[tail] = nx; qy[tail] = ny; tail++;
    }
  }
  if (!goal) return null;
  let cx = goal.cx, cy = goal.cy, nx = goal.cx, ny = goal.cy;
  while (prev[cy * N + cx] !== -1) {
    nx = cx; ny = cy;
    const pp = prev[cy * N + cx];
    cx = (pp / N) | 0; cy = pp % N;
  }
  return { mx: nx - fx, my: ny - fy };
}
// BFS 距离场：从 (fx,fy) 出发，仅走可通行格，返回各格最短步数（不可达为 -1）
function bfsDistances(fx, fy, extraBlocked) {
  const dist = new Int16Array(N * N).fill(-1);
  if (!inB(fx, fy) || isSolid(state.board[fy][fx])) return dist;
  const qx = new Int16Array(N * N), qy = new Int16Array(N * N);
  let head = 0, tail = 0;
  qx[tail] = fx; qy[tail] = fy; tail++;
  dist[fy * N + fx] = 0;
  while (head < tail) {
    const cx = qx[head], cy = qy[head]; head++;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (!inB(nx, ny)) continue;
      if (isSolid(state.board[ny][nx])) continue;
      if (extraBlocked && extraBlocked(nx, ny)) continue;
      if (dist[ny * N + nx] !== -1) continue;
      dist[ny * N + nx] = dist[cy * N + cx] + 1;
      qx[tail] = nx; qy[tail] = ny; tail++;
    }
  }
  return dist;
}
// 染色扩张目标：优先选「可达、贴近己方领地、周围空白多、距离近」的空格
function pickExpandTarget(p, danger) {
  const dist = bfsDistances(p.cx, p.cy, (x, y) => danger.has(y * N + x));
  const human = state.players.p1;
  let best = null, bestScore = -Infinity;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (state.board[y][x] !== EMPTY) continue;
    const d = dist[y * N + x];
    if (d < 0) continue; // 不可达，跳过（避免来回打转）
    let emptyN = 0, ownN = 0;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, ny = y + dy;
      if (!inB(nx, ny)) continue;
      const c = state.board[ny][nx];
      if (c === EMPTY) emptyN++;
      else if (c === p.color) ownN++;
    }
    // 距玩家越近越优先，避免 AI 一直躲在角落扩张、远离玩家
    const hd = Math.hypot(human.cx - x, human.cy - y);
    const score = ownN * 3 + emptyN * 2 - d * 0.6 - hd * 0.3;
    if (score > bestScore) { bestScore = score; best = { x, y }; }
  }
  return best;
}

const BotAI = {
  update(p, dt) {
    if (!p.alive) return;
    const human = state.players.p1;
    const dHuman = Math.hypot(human.cx - p.cx, human.cy - p.cy);
    p.thinkT -= dt;

    // 动态难度：每隔一段时间围绕当前基础值小幅随机调整机器人速度与 AI 失误率
    p.dynT -= dt;
    if (p.dynT <= 0) {
      p.dynT = AI_DYNAMIC_INTERVAL;
      p.dynSpeed = Math.max(0.5, botBaseSpeed() + (Math.random() - 0.5) * BOT_SPEED_JITTER);
      p.dynBlunder = clamp(botBaseBlunder() + (Math.random() - 0.5) * AI_BLUNDER_JITTER, AI_BLUNDER_FLOOR, AI_BLUNDER_CHANCE_MAX);
    }

    // 阶段切换：追击 ↔ 染色扩张（一段时间专注自动染色）
    p.modeT -= dt;
    if (p.modeT <= 0) {
      if (p.mode === 'chase') { p.mode = 'expand'; p.modeT = AI_EXPAND_MIN + Math.random() * (AI_EXPAND_MAX - AI_EXPAND_MIN); p.expandTarget = null; }
      else { p.mode = 'chase'; p.modeT = AI_CHASE_MIN + Math.random() * (AI_CHASE_MAX - AI_CHASE_MIN); }
    }

    // 敌弹危险区（己弹同色不伤己，无需躲避）
    const danger = enemyDangerCells(p);
    const inDanger = danger.has(p.cy * N + p.cx);

    // 目标：扩张阶段选空白染色点；追击阶段优先附近掉落物/人类，人类过远则就近染色
    let tx = human.cx + 0.5, ty = human.cy + 0.5, seekPickup = false;
    let expandNow = (p.mode === 'expand');
    if (!expandNow) {
      let bestD = PICKUP_SEEK_RANGE;
      for (const pk of state.pickups) {
        const d = Math.hypot(pk.x - p.cx, pk.y - p.cy);
        if (d < bestD) { bestD = d; tx = pk.x+0.5; ty = pk.y+0.5; seekPickup = true; }
      }
      // 人类非常远且附近无掉落物 → 才转为就近染色；否则保持追击，提高攻击性
      if (!seekPickup && dHuman > 18) expandNow = true;
    }
    if (expandNow) {
      const onT = p.expandTarget && p.cx === p.expandTarget.x && p.cy === p.expandTarget.y;
      if (!p.expandTarget || onT) p.expandTarget = pickExpandTarget(p, danger);
      if (p.expandTarget) { tx = p.expandTarget.x + 0.5; ty = p.expandTarget.y + 0.5; }
    }

    // 速度：己方染色格加速 + 加速道具倍率
    const onOwn = state.board[p.cy][p.cx] === p.color;
    const boost = (p.speedBoostT > 0 ? CFG.SPEED_BOOST_FACTOR : 1) * (onOwn ? CFG.OWN_TILE_BOOST : 1);
    const speed = p.dynSpeed * boost;

    // 概率性“失误”窗口：每隔一段时间，有小概率在短时间不做最优策略
    p.blunderCd -= dt;
    if (p.blunderCd <= 0) {
      p.blunderCd = AI_BLUNDER_INTERVAL + Math.random() * AI_BLUNDER_INTERVAL;
      if (Math.random() < p.dynBlunder)
        p.blunderT = AI_BLUNDER_DUR_MIN + Math.random() * (AI_BLUNDER_DUR_MAX - AI_BLUNDER_DUR_MIN);
    }
    if (p.blunderT > 0) p.blunderT -= dt;
    const blundering = p.blunderT > 0;

    // 重新规划路径（逃脱窗口期间不重规划）
    p.replanT -= dt;
    if (p.escapeT > 0) p.escapeT -= dt;
    if (p.replanT <= 0 && p.escapeT <= 0) {
      p.replanT = 0.25;
      let mx = 0, my = 0;
      const fcX = p.cx, fcY = p.cy;
      const tcX = Math.floor(tx), tcY = Math.floor(ty);
      if (inDanger) {
        // 身处敌弹危险区：紧急逃向最近安全格
        const step = findEscapeStep(fcX, fcY, danger);
        if (step) { mx = step.mx; my = step.my; }
      } else {
        const step = findNextStep(fcX, fcY, tcX, tcY, (x, y) => danger.has(y * N + x));
        if (step) { mx = step.mx; my = step.my; }
        else {
          // 目标不可达/被危险区阻断：换目标 + 主轴逼近绕行，避免死撞或进入危险区
          if (expandNow) p.expandTarget = null;
          const dx = tcX - p.cx, dy = tcY - p.cy;
          if (Math.abs(dx) >= Math.abs(dy)) {
            mx = Math.sign(dx);
            if (wallAhead(p, mx, 0) || danger.has(fcY * N + (fcX + mx))) { mx = 0; my = Math.sign(dy) || 1; }
          } else {
            my = Math.sign(dy);
            if (wallAhead(p, 0, my) || danger.has((fcY + my) * N + fcX)) { my = 0; mx = Math.sign(dx) || 1; }
          }
        }
      }
      p.mx = mx; p.my = my;
    }

    // 单元格吸附移动 + 卡住检测（逃脱窗口持续生效，避免被下一帧重规划覆盖）
    if (!p.moving) {
      const mdx = p.escapeT > 0 ? p.escapeDir.dx : p.mx;
      const mdy = p.escapeT > 0 ? p.escapeDir.dy : p.my;
      if (mdx || mdy) {
        if (!tryMoveCell(p, mdx, mdy, speed)) {
          if (p.escapeT > 0) { // 逃脱方向被堵：换个方向继续脱困
            p.escapeT = 0.3;
            p.escapeDir = randomFreeDir(p);
          } else {
            p.replanT = 0; // 撞墙：立即重规划
            p.stuckT += dt;
            if (p.stuckT > BOT_STUCK_TIME) { // 长时间卡住 → 进入逃脱窗口
              p.stuckT = 0;
              p.escapeT = 0.5;
              p.escapeDir = randomFreeDir(p);
            }
          }
        } else {
          p.stuckT = 0;
        }
      }
    }

    // 追击阶段：接近人类时放弹（失误窗口不执行最优放弹）
    if (!blundering && p.mode === 'chase' && !expandNow && !seekPickup && dHuman < BOT_BOMB_RANGE && p.thinkT <= 0) {
      p.thinkT = 0.5; if (Math.random() < BOT_BOMB_CHANCE) BombManager.tryPlace(p);
    }
    // 染色扩张：站到空白目标格就放弹染色，成功后换下一个目标
    if (!blundering && expandNow && p.expandTarget && p.thinkT <= 0) {
      const onT = p.cx === p.expandTarget.x && p.cy === p.expandTarget.y;
      if (onT) {
        p.thinkT = 0.4;
        if (BombManager.tryPlace(p)) p.expandTarget = null;
      }
    }
    // 释放队列中的主动技能卡（间隔触发，失误窗口暂停）
    p.castT -= dt;
    if (!blundering && p.castT <= 0 && p.queue.length > 0) {
      p.castT = AI_CAST_MIN + Math.random() * (AI_CAST_MAX - AI_CAST_MIN);
      castFront(p);
    }
    // 释放英雄主动技能（失误窗口暂停；C4 / 自爆按各自策略触发）
    const hero = HEROES[p.hero];
    if (!blundering && hero.active && p.skill.cd <= 0 && !p.skill.charging) {
      if (hero.c4) {
        // 阿尔法狗 C4：人类靠近时放置；人类踏入 C4 附近且放置一段时间后引爆
        if (!p.c4) { if (dHuman < 9) startActive(p); }
        else if (Math.hypot(human.cx - p.c4.x, human.cy - p.c4.y) < 4 && performance.now() - p.c4.t > 700) startActive(p);
      } else if (hero.chase) {
        // 褚嬴：人类靠近时召唤追击自爆人
        if (dHuman < 9) startActive(p);
      } else if (hero.trail) {
        if (dHuman < 9) startActive(p); // 战鹰：接近人类时开启炸弹足迹
      } else if (dHuman < 8) {
        startActive(p); // 柯洁：蓄力炸弹
      }
    }
  },
};

/* ===================== 渲染 ===================== */
const COLORS = { board:'#e8d3a3', grid:'#7a5c33', wall:'#3f4350', destruct:'#a87a45', explosion:'#ff8a3c' };

const cam = () => state.cam;
const sx = (x) => BOARD_OX + (x - cam().x) * CELL;
const sy = (y) => BOARD_OY + (y - cam().y) * CELL;
function inView(x, y) {
  return x >= Math.floor(cam().x)-1 && x <= Math.ceil(cam().x)+CAM_COLS &&
         y >= Math.floor(cam().y)-1 && y <= Math.ceil(cam().y)+CAM_ROWS;
}

/* ---------- UI 绘制助手 / 按钮热区 ---------- */
let hitRegions = [];   // 每帧由各 draw 重建：{ x, y, w, h, fn, kind }
// 命中区坐标换算（设计坐标 1920×1080 → 逻辑坐标 W×H）：全屏菜单页由 menuFrame 临时设置
let hitTx = { k: 1, ox: 0, oy: 0 };
function registerHit(x, y, w, h, fn, kind) {
  const t = hitTx;
  hitRegions.push({ x: t.ox + x * t.k, y: t.oy + y * t.k, w: w * t.k, h: h * t.k, fn, kind });
}
const FONT_TITLE = '"STKaiti","KaiTi","楷体","STSong","SimSun",serif';
const titleFontCache = new Map();
function titleFont(px, bold) {
  const key = (bold ? 'b' : '') + px;
  let f = titleFontCache.get(key);
  if (!f) { f = (bold ? 'bold ' : '') + px + 'px ' + FONT_TITLE; titleFontCache.set(key, f); }
  return f;
}
// 绘制 UI 素材（未加载完成时画占位色块，避免黑块）
function drawImg(k, x, y, w, h) {
  if (uiReady(k)) ctx.drawImage(UI[k], x, y, w, h);
  else { ctx.fillStyle = 'rgba(90,70,40,.16)'; rr(x, y, w, h, 6); ctx.fill(); }
}
// 按透明度绘制（用于半透明遮罩/呼吸效果）
function drawImgA(k, x, y, w, h, a) {
  if (uiReady(k)) { ctx.globalAlpha = a; ctx.drawImage(UI[k], x, y, w, h); ctx.globalAlpha = 1; }
  else { ctx.fillStyle = 'rgba(90,70,40,' + (a * 0.2).toFixed(3) + ')'; rr(x, y, w, h, 6); ctx.fill(); }
}
// 当前屏可命中区域是否包含 (x,y)（逻辑坐标）
function hitAt(x, y) {
  for (let i = hitRegions.length - 1; i >= 0; i--) {
    const h = hitRegions[i];
    if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h;
  }
  return null;
}

const Renderer = {
  draw() {
    applyLayout();
    ctx.clearRect(0, 0, W, H);
    hitRegions.length = 0;
    if (screen === 'title') { this.drawTitle(); return; }
    if (screen === 'mode')  { this.drawMode(); return; }
    if (screen === 'select'){ this.drawSelect(); return; }
    if (screen === 'map')   { this.drawMap(); return; }
    if (screen === 'rank')  { ctx.fillStyle='#f7f2e6'; ctx.fillRect(0,0,W,H); return; }  // 排行榜：HTML 覆盖层
    if (screen === 'settings') {
      // 先绘制打开设置前的底层画面，再在其上叠加设置面板（不遮挡/清空原页面）
      const prev = screen;
      screen = settingsPrev;
      this.draw();
      screen = prev;
      hitRegions.length = 0;   // 屏蔽底层页面热区，仅保留设置面板热区
      this.drawSettings();
      return;
    }
    if (screen === 'instructions') { this.drawInstructions(); return; }  // 操作说明
    if (screen === 'link') {
      // 先绘制打开前底层页面，再叠加一键三连面板（悬空，不单独开页面）
      const prev = screen;
      screen = linkPrev;
      this.draw();
      screen = prev;
      hitRegions.length = 0;   // 屏蔽底层页面热区，仅保留面板热区
      this.drawLinkPop();
      return;
    }
    if (screen === 'gameover') { this.drawResult(); return; }        // 结算（canvas）

    this.drawGameBg();
    ctx.save();
    if (!state.players.p1.alive) ctx.filter = 'grayscale(1)'; // 角色被炸死：画面黑白直到复活
    if (state.shakeT > 0) ctx.translate(Math.round((Math.random()-.5)*9*state.shakeT), Math.round((Math.random()-.5)*9*state.shakeT));
    // 裁剪到棋盘可视区，防止场景内容溢出到右侧信息栏
    ctx.beginPath(); ctx.rect(BOARD_OX, BOARD_OY, VIEW_W, VIEW_H); ctx.clip();
    this.drawBoard();
    this.drawSpecialCells();
    this.drawTeleportTrails();
    this.drawPickups();
    this.drawBlastRanges();   // 爆炸范围特效：地板层，位于人物素材之下
    this.drawTaijiFx();
    this.drawBombs();
    this.drawChasers();
    this.drawUfos();
    this.drawC4();
    this.drawPlayers();
    // —— 特效层：置于最上方，覆盖棋子/炸弹/角色 ——
    this.drawRainClouds();
    this.drawExplosions();
    this.drawParticles();
    this.drawHalos();         // 光环环绕：最上方，与人物同垂直中线
    this.drawMemeFlashes();
    this.drawUfoFx();
    this.drawSpeedLines();
    this.drawPickupFx();
    ctx.restore();
    // 地图（棋盘）边缘一圈灰边
    ctx.strokeStyle = '#8a8f9d';
    ctx.lineWidth = 6;
    ctx.strokeRect(BOARD_OX + 3, BOARD_OY + 3, VIEW_W - 6, VIEW_H - 6);
    this.drawHUD();
    this.drawInventory();
    this.drawMinimap(W - MINIMAP_PX - GAP, HUD_H + GAP, MINIMAP_PX);
    this.drawRatioBottom();
  },

  stone(cx, cy, r, kind) {
    const g = ctx.createRadialGradient(cx-r*.3, cy-r*.35, r*.1, cx, cy, r);
    if (kind === 'black') { g.addColorStop(0,'#5a5a5a'); g.addColorStop(1,'#0f0f0f'); }
    else { g.addColorStop(0,'#ffffff'); g.addColorStop(1,'#c8c8c8'); }
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
    if (kind === 'white') { ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=1; ctx.stroke(); }
  },

  drawBoard() {
    ctx.fillStyle = COLORS.board; ctx.fillRect(BOARD_OX, BOARD_OY, VIEW_W, VIEW_H);
    if (boardCacheDirty) redrawBoardCache();
    // 静态棋盘层整体 blit（世界坐标 → 屏幕坐标，含相机偏移）
    const cxm = cam().x, cym = cam().y;
    const bx0 = Math.floor(cxm), by0 = Math.floor(cym);
    const cellsW = CAM_COLS + 1, cellsH = CAM_ROWS + 1;
    const size = N * CELL;
    const srcX = bx0 * CELL, srcY = by0 * CELL;
    let srcW = cellsW * CELL, srcH = cellsH * CELL;
    if (srcX + srcW > size) srcW = size - srcX;
    if (srcY + srcH > size) srcH = size - srcY;
    if (srcW > 0 && srcH > 0 && boardCache) {
      const k = boardCacheScale;
      ctx.drawImage(boardCache, srcX * k, srcY * k, srcW * k, srcH * k,
        BOARD_OX + (bx0 - cxm) * CELL, BOARD_OY + (by0 - cym) * CELL, srcW, srcH);
    }
    // 动态层：染色棋子 + 加固脉冲（逐格叠加，不缓存）
    const cr = cellR();
    for (let y = by0; y < by0 + cellsH; y++) for (let x = bx0; x < bx0 + cellsW; x++) {
      if (!inB(x, y)) continue;
      const c = state.board[y][x];
      if (c !== BLACK && c !== WHITE) continue;
      const px = sx(x), py = sy(y);
      // 连接区域墨水瓦片：按上下左右同色邻居计算 4bit 掩码（N*8+W*4+E*2+S*1）选片
      const mask = (y > 0 && state.board[y - 1][x] === c ? 8 : 0)
                 + (x > 0 && state.board[y][x - 1] === c ? 4 : 0)
                 + (x < N - 1 && state.board[y][x + 1] === c ? 2 : 0)
                 + (y < N - 1 && state.board[y + 1][x] === c ? 1 : 0);
      const blackReady = DYE_TILES[BLACK][mask] && DYE_TILES[BLACK][mask].complete && DYE_TILES[BLACK][mask].naturalWidth;
      const tile = DYE_TILES[c][mask];
      if (blackReady && tile) ctx.drawImage(tile, px, py, CELL, CELL);
      else this.stone(px + CELL / 2, py + CELL / 2, CELL * 0.42, c === BLACK ? 'black' : 'white');
    }
    // 空隙填补：当前格 + 左 + 上 + 左上 四格同色时，四张拐角瓦片内凹在中心留出菱形空隙，居中铺整块同色填块（画在瓦片之上）
    if (DYE_FILL[BLACK].complete && DYE_FILL[BLACK].naturalWidth) {
      // 以格点(jx,jy)为单位遍历，含屏幕边缘外侧一格：相机移动时若边缘格点漏画，画面边缘会露出半截菱形缺口
      const jx0 = Math.max(1, bx0), jx1 = Math.min(N - 1, bx0 + cellsW);
      const jy0 = Math.max(1, by0), jy1 = Math.min(N - 1, by0 + cellsH);
      for (let jy = jy0; jy <= jy1; jy++) for (let jx = jx0; jx <= jx1; jx++) {
        const c = state.board[jy][jx];
        if (c !== BLACK && c !== WHITE) continue;
        if (state.board[jy - 1][jx] === c && state.board[jy][jx - 1] === c && state.board[jy - 1][jx - 1] === c) {
          ctx.drawImage(DYE_FILL[c], sx(jx) - CELL / 2, sy(jy) - CELL / 2, CELL, CELL);
        }
      }
    }
    // 加固金边：画在瓦片 + 空隙填补之上，避免被填块覆盖
    for (let y = by0; y < by0 + cellsH; y++) for (let x = bx0; x < bx0 + cellsW; x++) {
      if (!inB(x, y) || !isReinforced(x, y)) continue;
      const c = state.board[y][x];
      if (c !== BLACK && c !== WHITE) continue;
      const px = sx(x), py = sy(y);
      const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 180);
      ctx.strokeStyle = 'rgba(255,193,37,' + (0.6 + 0.4 * pulse).toFixed(3) + ')';
      ctx.lineWidth = 2.5;
      rr(px + 2, py + 2, CELL - 4, CELL - 4, cr); ctx.stroke();
    }
  },

  drawSpecialCells() {
    const cr = cellR();   // 方格倒角半径
    for (const c of state.pushCells) {
      if (!inView(c.x, c.y)) continue;
      const px = sx(c.x), py = sy(c.y), cx = px+CELL/2, cy = py+CELL/2;
      ctx.fillStyle = 'rgba(255,138,60,.16)'; rr(px, py, CELL, CELL, cr); ctx.fill();
      const a = Math.atan2(c.dy, c.dx);
      ctx.strokeStyle = '#ff8a3c'; ctx.lineWidth = 2.5; ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a)*CELL*.28, cy + Math.sin(a)*CELL*.28);
      ctx.lineTo(cx - Math.cos(a)*CELL*.28, cy - Math.sin(a)*CELL*.28);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx - Math.cos(a)*CELL*.28, cy - Math.sin(a)*CELL*.28);
      ctx.lineTo(cx - Math.cos(a+0.5)*CELL*.14, cy - Math.sin(a+0.5)*CELL*.14);
      ctx.lineTo(cx - Math.cos(a-0.5)*CELL*.14, cy - Math.sin(a-0.5)*CELL*.14);
      ctx.closePath(); ctx.fillStyle = '#ff8a3c'; ctx.fill();
    }
    for (const c of state.teleportCells) {
      if (!inView(c.x, c.y)) continue;
      const px = sx(c.x), py = sy(c.y), cx = px+CELL/2, cy = py+CELL/2;
      ctx.fillStyle = 'rgba(91,124,255,.20)'; rr(px, py, CELL, CELL, cr); ctx.fill();
      ctx.strokeStyle = '#5b7cff'; ctx.lineWidth = 2; ctx.beginPath();
      ctx.arc(cx, cy, CELL*.30, 0, Math.PI*2); ctx.stroke();
      ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, CELL*.16, 0, Math.PI*2); ctx.stroke();
    }
    for (const c of state.respawnCells) {
      if (!inView(c.x, c.y)) continue;
      const px = sx(c.x), py = sy(c.y);
      ctx.fillStyle = c.half===BLACK ? 'rgba(255,82,82,.14)' : 'rgba(76,154,255,.14)';
      rr(px, py, CELL, CELL, cr); ctx.fill();
      ctx.strokeStyle = c.half===BLACK ? '#ff5252' : '#4c9aff'; ctx.lineWidth = 1.5;
      ctx.setLineDash([4,3]); rr(px+3, py+3, CELL-6, CELL-6, Math.max(2, cr-2)); ctx.stroke(); ctx.setLineDash([]);
    }
  },

  // 传送轨迹：起点 → 终点虚线，随时间的推移慢慢淡出
  drawTeleportTrails() {
    const now = performance.now();
    for (let i = state.teleportTrails.length - 1; i >= 0; i--) {
      const t = state.teleportTrails[i];
      const life = (t.until - now) / TELEPORT_TRAIL_MS;
      if (life <= 0) { state.teleportTrails.splice(i, 1); continue; }
      const x1 = sx(t.fx) + CELL/2, y1 = sy(t.fy) + CELL/2;
      const x2 = sx(t.tx) + CELL/2, y2 = sy(t.ty) + CELL/2;
      ctx.save();
      ctx.globalAlpha = life * 0.85;
      ctx.strokeStyle = '#5b7cff';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.setLineDash([2, 10]);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.restore();
    }
  },

  drawRainClouds() {
    const seq = FX.rain;
    for (const rc of state.rainClouds) {
      if (!inView(rc.x, rc.y)) continue;
      const px = sx(rc.x)+CELL/2, py = sy(rc.y)+CELL/2;
      const fi = Math.floor(performance.now()/100) % seq.length;
      const img = seq[fi];
      if (img && img.complete && img.naturalWidth) {
        const s = CELL * 6.6;   // 雨棋特效：约原来 3 倍
        drawFxFrame(img, px, py, s);
      } else {
        // 贴图未就绪：回退三圆雨云
        const now = performance.now();
        const flicker = 0.55 + 0.15*Math.sin(now/120 + rc.x*7 + rc.y*13);
        ctx.fillStyle = 'rgba(120,150,210,'+flicker.toFixed(2)+')';
        ctx.beginPath();
        ctx.arc(px-CELL*.18, py, CELL*.22, 0, Math.PI*2);
        ctx.arc(px+CELL*.18, py, CELL*.26, 0, Math.PI*2);
        ctx.arc(px, py-CELL*.12, CELL*.24, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = 'rgba(160,190,240,'+(flicker*.9).toFixed(2)+')';
        ctx.fillRect(px-CELL*.12, py-CELL*.02, CELL*.08, CELL*.22);
        ctx.fillRect(px+CELL*.05, py+CELL*.02, CELL*.08, CELL*.22);
      }
    }
  },

  drawPickups() {
    const now = performance.now();
    for (const pk of state.pickups) {
      if (!inView(pk.x, pk.y)) continue;
      const px = sx(pk.x)+CELL/2, py = sy(pk.y)+CELL/2;
      const it = ITEMS[pk.item];
      // 呼吸灯：可拾取技能在场上按各自相位柔和脉动（光晕半径明显大于道具本体，便于看清）
      const phase = (pk.x * 0.83 + pk.y * 1.31) % (Math.PI * 2);
      const breathe = (Math.sin(now / 460 + phase) + 1) / 2;   // 0..1 缓慢呼吸
      const glowR = CELL * (0.48 + 0.28 * breathe);
      const g = ctx.createRadialGradient(px, py, glowR * 0.2, px, py, glowR);
      g.addColorStop(0, hexA(it.color, (0.55 + 0.30 * breathe).toFixed(3)));
      g.addColorStop(1, hexA(it.color, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(px, py, glowR, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.arc(px, py+2, CELL*.28, 0, Math.PI*2); ctx.fill();
      // 自身透明度随呼吸灯同步脉动（0.55→1.0，不会完全消失）
      const selfA = 0.55 + 0.45 * breathe;
      const img = itemImg(pk.item, pk.x, pk.y);
      if (img && img.complete && img.naturalWidth) {
        const s = CELL * 0.8;
        ctx.globalAlpha = selfA;
        ctx.drawImage(img, px - s/2, py - s/2, s, s);
        ctx.globalAlpha = 1;
      } else {
        ctx.globalAlpha = selfA;
        ctx.fillStyle = it.color;
        ctx.fillRect(px-CELL*.27, py-CELL*.34, CELL*.54, CELL*.66);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.strokeRect(px-CELL*.27, py-CELL*.34, CELL*.54, CELL*.66);
        ctx.fillStyle = '#14161d'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(it.name[0], px, py);
        ctx.globalAlpha = 1;
      }
    }
  },

  drawExplosions() {
    const now = performance.now();
    for (const e of state.explosions) {
      // 炸弹爆炸（带中心 ox/oy）：播放中心爆炸动画
      if (e.ox !== undefined) { this.drawBlastFx(e, now); continue; }
      // 提子 / 染色消失 / 3×3 染色：闪光（capture 白闪，其余橙色）
      const life = Math.max(0, (e.until-now)/350);   // 1 → 0 淡出
      ctx.fillStyle = e.kind === 'capture'
        ? 'rgba(255,255,255,'+(life).toFixed(3)+')'
        : 'rgba(255,138,60,'+(life*.9).toFixed(3)+')';
      for (const c of e.cells) {
        if (!inView(c.x,c.y)) continue;
        ctx.beginPath(); ctx.arc(sx(c.x)+CELL/2, sy(c.y)+CELL/2, CELL*.52, 0, Math.PI*2); ctx.fill();
      }
    }
  },

  // 爆炸范围特效（方向段）：单独成层，绘制在人物素材之下
  drawBlastRanges() {
    const now = performance.now();
    for (const e of state.explosions) {
      if (e.ox !== undefined) this.drawBlastRangeFx(e, now);
    }
  },

  // 炸弹爆炸：中心爆炸动画（白/黑）—— 置于特效层最上方
  drawBlastFx(e, now) {
    const born = e.born || now;
    const age = clamp((now - born) / 650, 0, 1);     // 0 → 1 已过时间
    if (age >= 1) return;
    const ox = e.ox, oy = e.oy;
    const arms = e.arms || {};
    const maxArm = e.maxArm || 1;
    const fExpl = Math.min(20, Math.floor(age * 21));      // 21 帧中心爆炸
    const expl = FX.explode[e.color === WHITE ? WHITE : BLACK];
    const eimg = expl && expl[fExpl];
    if (eimg && eimg.complete && eimg.naturalWidth) {
      const dia = CELL * (2 * maxArm + 1) * FX_SCALE;
      ctx.globalAlpha = 1 - age * 0.2;
      drawFxFrame(eimg, sx(ox) + CELL / 2, sy(oy) + CELL / 2, dia);
      ctx.globalAlpha = 1;
    }
  },

  // 炸弹爆炸：十字/X 方向性爆炸范围段（地板层，位于人物素材之下）
  drawBlastRangeFx(e, now) {
    const born = e.born || now;
    const age = clamp((now - born) / 650, 0, 1);     // 0 → 1 已过时间
    if (age >= 1) return;
    const ox = e.ox, oy = e.oy;
    const s = CELL / 173 * FX_BLAST_SCALE;            // 素材 1 格 ≈ 173px，爆炸范围特效整体缩小
    const arms = e.arms || {};
    const fi = Math.min(3, Math.floor(age * 4));           // 4 帧方向段
    const isWhite = e.color === WHITE;                     // 白方：方向段整体染白（用预白化素材，黑方原色）
    // 正中间
    const centerRaw = FX.blast.center[fi];
    if (centerRaw && centerRaw.complete && centerRaw.naturalWidth) {
      const centerImg = isWhite ? (whiteVariant(centerRaw) || centerRaw) : centerRaw;
      const a = FX_BLAST_ANCHOR.center;
      ctx.drawImage(scaledImg(centerImg, 1920 * s, 512), sx(ox) + CELL / 2 - a[0] * s, sy(oy) + CELL / 2 - a[1] * s, 1920 * s, 1080 * s);
    }
    // 四向臂（对角 X 型暂由中心爆炸覆盖，不画方向段）：上下臂与左右臂分帧绘制，分摊大图缩放开销
    const phase = FRAME & 1;
    for (const key in arms) {
      const [nx, ny] = key.split(',').map(Number);
      let dirKey = null;
      if (nx === 0 && ny === -1) dirKey = 'up';
      else if (nx === 0 && ny === 1) dirKey = 'down';
      else if (nx === -1 && ny === 0) dirKey = 'left';
      else if (nx === 1 && ny === 0) dirKey = 'right';
      if (!dirKey) continue;
      if (((dirKey === 'up' || dirKey === 'down') ? 0 : 1) !== phase) continue;  // 上下臂 / 左右臂各占一半帧
      const P = arms[key];
      for (let d = 1; d <= P; d++) {
        const isEnd = d === P;
        const seq = isEnd ? FX.blast.end[dirKey] : FX.blast.mid[dirKey];
        const img = seq && seq[fi];
        if (!img || !img.complete || !img.naturalWidth) continue;
        const src = isWhite ? (whiteVariant(img) || img) : img;
        const a = isEnd ? FX_BLAST_ANCHOR.end[dirKey] : FX_BLAST_ANCHOR.mid[dirKey];
        const gx = ox + nx * d, gy = oy + ny * d;
        ctx.drawImage(scaledImg(src, 1920 * s, 512), sx(gx) + CELL / 2 - a[0] * s, sy(gy) + CELL / 2 - a[1] * s, 1920 * s, 1080 * s);
      }
    }
  },

  // 爆炸粒子：火花/碎屑向外飞散并淡出（有贴图用粒子素材，否则回退圆点）
  drawParticles() {
    for (const pt of state.particles) {
      if (!inView(Math.floor(pt.x), Math.floor(pt.y))) continue;
      const f = Math.max(0, 1 - pt.t / pt.life);   // 1 → 0
      const seq = pt.team ? FX.particle[pt.team] : null;
      const img = seq && seq[pt.spr];
      ctx.globalAlpha = f;
      if (img && img.complete && img.naturalWidth) {
        const r = pt.size * (0.5 + 0.6 * f) * 1.6 * FX_SCALE;
        ctx.drawImage(img, sx(pt.x) - r, sy(pt.y) - r, r * 2, r * 2);
      } else {
        ctx.fillStyle = pt.color;
        const r = pt.size * (0.4 + 0.6 * f);
        ctx.beginPath(); ctx.arc(sx(pt.x), sy(pt.y), r, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  },

  drawBombs() {
    const now = performance.now();
    for (const b of state.bombs) {
      if (!inView(b.x,b.y)) continue;
      // 爆炸范围预警（玩家=红、敌方=蓝；越接近爆炸闪烁频率越高）
      const fuseFrac = clamp(b.timer / (b.maxTimer || CFG.FUSE), 0, 1);
      const warnBlink = ((b.blinkPhase || 0) % 1) < 0.5 ? 1 : 0; // 方波闪烁，频率随引信升高
      const warn = BombManager.warnCells(b);
      const warnRGB = b.color === BLACK ? '255,82,82' : '76,154,255'; // 玩家红 / 敌方蓝
      ctx.fillStyle = 'rgba(' + warnRGB + ',' + (0.06 + 0.16 * warnBlink).toFixed(3) + ')';
      const wr = cellR();
      for (const c of warn.cells) if (inView(c.x, c.y)) { rr(sx(c.x), sy(c.y), CELL, CELL, wr); ctx.fill(); }
      for (const d of warn.destructs) if (inView(d.x, d.y)) { rr(sx(d.x), sy(d.y), CELL, CELL, wr); ctx.fill(); }

      const px = sx(b.x)+CELL/2, py = sy(b.y)+CELL/2, r = b.super ? CELL*.5 : CELL*.42;
      // 放置弹出：新落下的棋子由小弹入（动效反馈）
      const age = Math.max(0, now - (b.born || now));
      const popT = Math.min(1, age / 130);
      const bodyR = r * (0.7 + 0.3 * (1 - Math.pow(1 - popT, 3)));
      // 炸弹本体：黑方黑子、白方白子（围棋棋子样式）
      ctx.fillStyle = b.color === BLACK ? '#1a1a1a' : '#f5f2ea';
      ctx.beginPath(); ctx.arc(px,py,bodyR,0,Math.PI*2); ctx.fill();
      if (b.color !== BLACK) { ctx.strokeStyle = '#b9b2a2'; ctx.lineWidth = 1.5; ctx.stroke(); }
      // 引信环（随剩余时间缩短）
      ctx.strokeStyle = b.color===BLACK ? '#ff5252' : '#4c9aff'; ctx.lineWidth = 4; ctx.beginPath();
      ctx.arc(px,py,r*.55,-Math.PI/2,-Math.PI/2+Math.PI*2*fuseFrac); ctx.stroke();
      // 预警闪烁环：越接近爆炸闪烁越快、越亮（玩家红 / 敌方蓝）
      ctx.globalAlpha = 0.2 + 0.7 * warnBlink;
      ctx.strokeStyle = b.color === BLACK ? '#ff3b3b' : '#4c9aff'; ctx.lineWidth = 3; ctx.beginPath();
      ctx.arc(px, py, r + 2 + warnBlink * 3, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
      if (b.super) { ctx.strokeStyle='#ffd166'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(px,py,r*.8,0,Math.PI*2); ctx.stroke(); }
    }
  },

  drawChasers() {
    const t = performance.now()/1000;
    for (const c of state.chasers) {
      if (!inView(Math.floor(c.x), Math.floor(c.y))) continue;
      const px = sx(c.x), py = sy(c.y);
      // 队伍色光晕
      ctx.fillStyle = c.color===BLACK ? 'rgba(255,82,82,.38)' : 'rgba(76,154,255,.38)';
      ctx.beginPath(); ctx.arc(px,py,CELL*.52,0,Math.PI*2); ctx.fill();
      const img = CHASER_IMG;
      if (img && img.complete && img.naturalWidth) {
        const h = CELL * 1.6, w = h * img.naturalWidth / img.naturalHeight;
        ctx.drawImage(img, px - w/2, py - h/2, w, h);
      } else {
        // 图片未加载：占位圆 + 「追」
        const pulse = CELL*.32 + Math.sin(t*12)*3;
        ctx.fillStyle = c.color===BLACK ? '#111' : '#eee';
        ctx.beginPath(); ctx.arc(px,py,pulse,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle = c.color===BLACK ? '#ff5252' : '#4c9aff'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = c.color===BLACK ? '#fff' : '#222';
        ctx.font='bold 12px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('追', px, py+1);
      }
    }
  },

  drawUfos() {
    const t = performance.now() / 1000;
    for (const u of state.ufos) {
      if (!inView(Math.floor(u.x), Math.floor(u.y))) continue;
      const px = sx(u.x), py = sy(u.y) + Math.sin(t * 6 + u.seed) * CELL * 0.06;
      // 光晕
      ctx.fillStyle = 'rgba(53,208,165,.18)';
      ctx.beginPath(); ctx.arc(px, py, CELL * .5, 0, Math.PI * 2); ctx.fill();
      // 底部牵引光束（吸走棋子的暗示），先画以便机身压在其上
      if (UFO_BEAM_IMG.complete && UFO_BEAM_IMG.naturalWidth) {
        const bh = CELL * 0.72;
        const bw = bh * UFO_BEAM_IMG.naturalWidth / UFO_BEAM_IMG.naturalHeight;
        ctx.drawImage(UFO_BEAM_IMG, px - bw / 2, py + CELL * 0.16, bw, bh);
      } else {
        ctx.fillStyle = 'rgba(120,247,200,.22)';
        ctx.beginPath();
        ctx.moveTo(px - CELL * .12, py + CELL * .14);
        ctx.lineTo(px + CELL * .12, py + CELL * .14);
        ctx.lineTo(px + CELL * .2, py + CELL * .5);
        ctx.lineTo(px - CELL * .2, py + CELL * .5);
        ctx.closePath(); ctx.fill();
      }
      // 机身（飞行 UFO 贴图）
      if (UFO_IMG.complete && UFO_IMG.naturalWidth) {
        const uw = CELL * 1.3;
        const uh = uw * UFO_IMG.naturalHeight / UFO_IMG.naturalWidth;
        ctx.drawImage(UFO_IMG, px - uw / 2, py - uh / 2, uw, uh);
      } else {
        // 贴图未加载完成时的兜底：扁椭圆飞碟
        ctx.fillStyle = '#8f9bb3';
        ctx.beginPath(); ctx.ellipse(px, py, CELL * .42, CELL * .2, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#5ad6f0';
        ctx.beginPath(); ctx.ellipse(px, py - CELL * .13, CELL * .2, CELL * .13, 0, Math.PI, 0); ctx.fill();
      }
    }
  },

  drawTaijiFx() {
    const now = performance.now();
    for (let i = state.taijiFx.length - 1; i >= 0; i--) {
      const f = state.taijiFx[i];
      const life = (f.until - now) / 800;
      if (life <= 0) { state.taijiFx.splice(i, 1); continue; }
      if (!inView(f.x, f.y)) continue;
      const px = sx(f.x) + CELL / 2, py = sy(f.y) + CELL / 2;
      const R = CELL * (0.7 + 1.4 * (1 - life)); // 扩散放大
      ctx.save();
      ctx.globalAlpha = Math.max(0, life);
      ctx.translate(px, py);
      ctx.rotate((1 - life) * Math.PI * 2); // 旋转
      ctx.strokeStyle = '#2b2d38'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.stroke();
      // 阴阳鱼：左黑右白
      ctx.fillStyle = '#14161d';
      ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f5f2ea';
      ctx.beginPath(); ctx.arc(0, 0, R, -Math.PI / 2, Math.PI / 2); ctx.fill();
      ctx.fillStyle = '#14161d';
      ctx.beginPath(); ctx.arc(0, -R / 2, R / 2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f5f2ea';
      ctx.beginPath(); ctx.arc(0, R / 2, R / 2, 0, Math.PI * 2); ctx.fill();
      // 鱼眼
      ctx.fillStyle = '#f5f2ea'; ctx.beginPath(); ctx.arc(0, -R / 2, R / 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#14161d'; ctx.beginPath(); ctx.arc(0, R / 2, R / 6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  },

  drawC4() {
    for (const p of Object.values(state.players)) {
      if (!p.c4) continue;
      if (!inView(p.c4.x, p.c4.y)) continue;
      const px = sx(p.c4.x)+CELL/2, py = sy(p.c4.y)+CELL/2;
      // 未爆炸之前：红色闪烁警示（正常贴图 ↔ 红色贴图交替）
      const blink = Math.floor(performance.now()/200)%2===0;
      const img = blink ? C4_IMG_RED : C4_IMG;
      const s = CELL * 0.95;
      if (C4_IMG.complete && C4_IMG.naturalWidth) {
        ctx.drawImage(img, px - s/2, py - s/2, s, s);
      } else {
        // 贴图未就绪：回退原矢量 C4 方块
        const c4r = Math.max(3, CELL*.10);
        ctx.fillStyle = '#3a2a1a'; rr(px-CELL*.32, py-CELL*.32, CELL*.64, CELL*.64, c4r); ctx.fill();
        ctx.fillStyle = blink ? '#ff5252' : '#7a5c33';
        rr(px-CELL*.24, py-CELL*.24, CELL*.48, CELL*.48, c4r); ctx.fill();
        ctx.strokeStyle = p.color===BLACK ? '#ff5252' : '#4c9aff'; ctx.lineWidth = 2;
        rr(px-CELL*.32, py-CELL*.32, CELL*.64, CELL*.64, c4r); ctx.stroke();
        ctx.fillStyle='#fff'; ctx.font='bold 16px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('C4', px, py+1);
      }
    }
  },

  drawPlayers() {
    for (const p of Object.values(state.players)) {
      if (!p.alive) continue;
      if (!inView(Math.floor(p.x), Math.floor(p.y))) continue;
      const px = sx(p.x), py = sy(p.y);
      const footY = py;   // 脚底：格中心（上移半个格子，站在棋子中间）
      // 己方染色格：加速光晕（椭圆形影子）
      const onOwn = state.board[p.cy][p.cx] === p.color;
      if (onOwn) {
        const t = performance.now()/90;
        ctx.globalAlpha = 0.30 + 0.12*Math.sin(t);
        ctx.fillStyle = p.color===BLACK ? '#ff8a5c' : '#7ab8ff';
        ctx.beginPath(); ctx.ellipse(px, footY - 2, CELL*.52 + Math.sin(t)*CELL*.05, CELL*.18, 0, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
      }
      // 队伍色底衬（区分黑/白，尤其回退到柯洁素材时）
      ctx.fillStyle = p.color===BLACK ? 'rgba(255,82,82,.30)' : 'rgba(76,154,255,.30)';
      ctx.beginPath(); ctx.ellipse(px, footY - 2, CELL*.42, CELL*.13, 0, 0, Math.PI*2); ctx.fill();

      // 加固棋子：已拾取（下一枚炸弹染出的格子将变成加固格）时，脚下棋格显示脉动金边
      if (p.reinforced) {
        const gx = sx(p.cx), gy = sy(p.cy);
        const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 160);
        ctx.fillStyle = 'rgba(255,193,37,' + (0.14 + 0.12 * pulse).toFixed(3) + ')';
        rr(gx, gy, CELL, CELL, cellR()); ctx.fill();
        ctx.strokeStyle = 'rgba(255,193,37,' + (0.7 + 0.3 * pulse).toFixed(3) + ')';
        ctx.lineWidth = 3;
        rr(gx + 1.5, gy + 1.5, CELL - 3, CELL - 3, cellR()); ctx.stroke();
      }

      const hero = HEROES[p.hero];
      // 褚嬴被动「七步成箱」：即将放置箱子（下一步为第 boxEvery 个棋子）时，自身图片稍微泛黄
      const aboutToBox = hero.boxEvery && (p.bombSeq % hero.boxEvery) === hero.boxEvery - 1;
      // 移动中循环播放行走动画（4 方向 × 4 帧）；停止时恢复 8 方向立绘
      let img = null;
      if (p.moving || p.walking) {
        const frames = ANIMS[p.hero] && ANIMS[p.hero][p.face];
        if (frames) img = frames[Math.floor(p.moveT * ANIM_STEPS_PER_CELL) % ANIM_FRAMES];
      }
      if (!img) {
        // 当前面向（正交转向时快速途经中间斜向帧）
        const face = (p.turnT > 0) ? (TURN_DIAG[p.turnFrom + '|' + p.turnTo] || p.face) : p.face;
        const set = SPRITES[p.hero];
        img = set && set[face];
      }
      // 缩放动效：传送收缩 / 重生放大（围绕脚底锚点）
      const bodyS = teleportScale(p, 320) * spawnScale(p, 280);
      if (img && img.complete && img.naturalWidth) {
        const h = SPRITE_H();                                 // 立绘高度（约 1.7 格）
        const w = h * img.naturalWidth / img.naturalHeight;   // 按原图比例缩放
        ctx.save();
        ctx.translate(px, footY);
        ctx.scale(bodyS, bodyS);
        // 浸染状态（被自己炸弹炸到）：角色轻微泛黑（黑方）/泛白（白方）；褚嬴七步成箱时泛黄
        let drawSrc = img;
        if (p.selfBlastT > 0) drawSrc = (p.color === BLACK ? darkVariant(img) : lightVariant(img)) || img;
        if (aboutToBox) drawSrc = sepiaVariant(img) || drawSrc;
        ctx.drawImage(drawSrc, -w/2, -h, w, h);
        ctx.restore();
      } else {
        // 图片尚未加载：先用圆形占位，避免闪空
        ctx.fillStyle = p.color===BLACK ? '#111' : '#eee';
        ctx.beginPath(); ctx.arc(px,py,CELL*.34*bodyS,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle = p.color===BLACK ? '#ff5252' : '#4c9aff'; ctx.lineWidth=2; ctx.stroke();
        ctx.fillStyle = p.color===BLACK ? '#fff' : '#222';
        ctx.font='bold 12px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(HEROES[p.hero].name[0], px, py+1);
      }
      if (p.skill.charging && HEROES[p.hero].active) { // 蓄力进度条：头顶显示，随时间填充
        const frac = 1 - p.skill.chargeLeft/HEROES[p.hero].activeCharge;
        const bw = CELL * 1.4, bh = 9;
        const bx = px - bw/2, by = footY - SPRITE_H() - 16;
        ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(bx-2, by-2, bw+4, bh+4);
        ctx.fillStyle = '#ffd166'; ctx.fillRect(bx, by, bw * Math.max(0, Math.min(1, frac)), bh);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.strokeRect(bx-2, by-2, bw+4, bh+4);
      }
      if (p.shield) { // 护盾（无敌）：动画护盾气泡环绕角色
        const seq = FX.shield;
        const img = seq[Math.floor(performance.now() / 120) % seq.length];
        if (img && img.complete && img.naturalWidth) {
          drawFxFrame(img, px, footY - SPRITE_H() * 0.45, CELL * 1.7 * FX_SCALE);
        } else { // 贴图未就绪：回退椭圆形影子
          ctx.globalAlpha = 0.28 + 0.18*Math.sin(performance.now()/70);
          ctx.fillStyle='#ffd166'; ctx.beginPath(); ctx.ellipse(px, footY - 2, CELL*.5, CELL*.2, 0, 0, Math.PI*2); ctx.fill();
          ctx.globalAlpha = 1;
          ctx.strokeStyle='#ffd166'; ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(px, footY - 2, CELL*.5, CELL*.2, 0, 0, Math.PI*2); ctx.stroke();
        }
      }
      if (p.skillFlashT > 0) { // 技能释放瞬间：角色周围白色闪光（扩散淡出 + 亮环）
        const f = clamp(p.skillFlashT / 0.4, 0, 1);
        const r = CELL * (0.8 + (1 - f) * 2.4);
        const g = ctx.createRadialGradient(px, footY - 2, 0, px, footY - 2, r);
        g.addColorStop(0, 'rgba(255,255,255,' + (0.95 * f).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(px, footY - 2, r, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.9 * f).toFixed(3) + ')';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(px, footY - 2, r * 0.75, 0, Math.PI*2); ctx.stroke();
      }
    }
  },

  // 光环环绕：队伍色光环（黑/白循环），置于最上层并与人物同垂直中线
  // 仅在被自己棋子炸到后的「染色状态」（selfBlastT）期间显示，非常驻
  drawHalos() {
    for (const p of Object.values(state.players)) {
      if (!p.alive) continue;
      if (p.selfBlastT <= 0) continue; // 非染色状态不显示光环
      if (!inView(Math.floor(p.x), Math.floor(p.y))) continue;
      const px = sx(p.x), footY = sy(p.y);
      const haloSeq = FX.halo[p.color === WHITE ? WHITE : BLACK];
      const haloImg = haloSeq[Math.floor(performance.now() / 90) % haloSeq.length];
      if (haloImg && haloImg.complete && haloImg.naturalWidth) {
        drawFxFrameAt(haloImg, px, footY - SPRITE_H() * 0.45 + CELL * 0.12, CELL * 6.0 * FX_SCALE, FX_HALO_ANCHOR[0], FX_HALO_ANCHOR[1]);
      }
    }
  },

  // 柯洁技能爆炸瞬间：快速闪烁「难绷」表情包，尺寸与技能爆炸范围（半径 3 像素圆）相当
  drawMemeFlashes() {
    for (const p of Object.values(state.players)) {
      if (p.memeFlashT <= 0) continue;
      const mi = MEME_IMG;
      if (!mi || !mi.complete || !mi.naturalWidth) continue;
      const size = CELL * 7; // 半径 3 圆形爆炸的直径约 7 格
      const mcx = sx(p.memeFlashX) + CELL/2;
      const mcy = sy(p.memeFlashY) + CELL/2;
      const a = Math.min(1, p.memeFlashT / 0.2); // 快速闪烁后淡出
      ctx.globalAlpha = a;
      ctx.drawImage(mi, mcx - size/2, mcy - size/2, size, size);
      ctx.globalAlpha = 1;
    }
  },

  // 释放 UFO 技能瞬间：外星人贴图淡入淡出闪现一下
  drawUfoFx() {
    const now = performance.now();
    for (let i = state.ufoFx.length - 1; i >= 0; i--) {
      const f = state.ufoFx[i];
      if (now >= f.until) { state.ufoFx.splice(i, 1); continue; }
      if (!UFO_ALIEN_IMG.complete || !UFO_ALIEN_IMG.naturalWidth) continue;
      const k = clamp((now - f.born) / (f.until - f.born), 0, 1);
      const a = Math.sin(Math.PI * k);   // 淡入 → 淡出
      const aw = CELL * 3;
      const ah = aw * UFO_ALIEN_IMG.naturalHeight / UFO_ALIEN_IMG.naturalWidth;
      const mcx = sx(f.x) + CELL / 2, mcy = sy(f.y) + CELL / 2;
      ctx.globalAlpha = a;
      ctx.drawImage(UFO_ALIEN_IMG, mcx - aw / 2, mcy - ah / 2, aw, ah);
      ctx.globalAlpha = 1;
    }
  },

  // 加速效果：移动中处于加速状态（加速棋子 / 己方染色格）时，屏幕边缘出现速度线
  drawSpeedLines() {
    const p = state.players.p1;
    if (!p || !p.alive || !p.moving) return;
    const speeding = p.speedBoostT > 0 || state.board[p.cy][p.cx] === p.color;
    if (!speeding) return;
    const cx = VIEW_W / 2, cy = HUD_H + VIEW_H / 2;
    const now = performance.now();
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.30)';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 10; i++) {
      const ang = (i / 10) * Math.PI * 2;
      const dx = Math.cos(ang), dy = Math.sin(ang);
      const sx0 = cx + dx * VIEW_W * 0.55, sy0 = cy + dy * VIEW_H * 0.55;
      const len = 24 + 20 * Math.abs(Math.sin(now / 85 + i * 1.7));
      ctx.beginPath(); ctx.moveTo(sx0, sy0); ctx.lineTo(sx0 - dx * len, sy0 - dy * len); ctx.stroke();
    }
    ctx.restore();
  },

  // 拾取道具反馈：获得道具闪光（贴图）+ 道具名向上漂浮并淡出（动效反馈）
  drawPickupFx() {
    const now = performance.now();
    for (const f of state.pickupFx) {
      const life = (f.until - now) / 1200;   // 1 → 0
      if (life <= 0) continue;
      const px = sx(f.x), py = sy(f.y);
      const age = 1 - life;                  // 0 → 1 已过时间
      // 获得道具特效（前 60% 时间播放）
      if (age < 0.6) {
        const seq = FX.pickup;
        const fi = Math.min(seq.length - 1, Math.floor(age / 0.6 * seq.length));
        const img = seq[fi];
        if (img && img.complete && img.naturalWidth) {
          const s = CELL * 3.2 * FX_SCALE;
          ctx.globalAlpha = 1 - age / 0.6;
          drawFxFrame(img, px, py, s);
          ctx.globalAlpha = 1;
        }
      }
      const rise = (1 - life) * 30;
      ctx.globalAlpha = Math.min(1, life * 2.2);
      ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(0,0,0,.55)';
      ctx.strokeText('+' + f.name, px, py - 18 - rise);
      ctx.fillStyle = f.color;
      ctx.fillText('+' + f.name, px, py - 18 - rise);
      ctx.globalAlpha = 1;
    }
  },

  drawMinimap(mmX, mmY, mmSize) {
    if (mmX === undefined) mmX = isFullScreen() ? (W - MINIMAP_PX) : (VIEW_W + GAP);
    if (mmY === undefined) mmY = HUD_H;
    if (mmSize === undefined) mmSize = MINIMAP_PX;
    const mm = mmSize/BOARD_N; // 小地图只显示有效棋盘（19 路），不含墙边
    // 静态棋盘层（墙体/方块/箱子/染色棋子）整体 blit，动态单位在下方逐帧叠画
    if (minimapDirty) redrawMinimapCache(mmSize);
    if (minimapCache) {
      ctx.drawImage(minimapCache, 0, 0, minimapCache.width, minimapCache.height, mmX, mmY, mmSize, mmSize);
    } else {
      ctx.fillStyle = COLORS.board; ctx.fillRect(mmX, mmY, mmSize, mmSize);
    }
    for (const pk of state.pickups) { ctx.fillStyle = ITEMS[pk.item].color; ctx.fillRect(mmX+(pk.x-WALL_PAD)*mm+mm*.2, mmY+(pk.y-WALL_PAD)*mm+mm*.2, mm*.6, mm*.6); }
    for (const c of state.respawnCells) { ctx.fillStyle = c.half===BLACK ? '#ff5252' : '#4c9aff'; ctx.fillRect(mmX+(c.x-WALL_PAD)*mm+mm*.1, mmY+(c.y-WALL_PAD)*mm+mm*.1, mm*.8, mm*.8); }
    for (const b of state.bombs) { ctx.fillStyle='#ff6b3c'; ctx.fillRect(mmX+(b.x-WALL_PAD)*mm+mm*.15, mmY+(b.y-WALL_PAD)*mm+mm*.15, mm*.7, mm*.7); }
    for (const c of state.chasers) { ctx.fillStyle='#ffd166'; ctx.beginPath(); ctx.arc(mmX+(c.x-WALL_PAD)*mm, mmY+(c.y-WALL_PAD)*mm, mm*.45, 0, Math.PI*2); ctx.fill(); }
    for (const u of state.ufos) { ctx.fillStyle='#35d0a5'; ctx.beginPath(); ctx.arc(mmX+(u.x-WALL_PAD)*mm, mmY+(u.y-WALL_PAD)*mm, mm*.5, 0, Math.PI*2); ctx.fill(); }
    for (const p of Object.values(state.players)) if (p.alive) {
      ctx.fillStyle = p.color===BLACK ? '#ff5252' : '#4c9aff';
      ctx.beginPath(); ctx.arc(mmX+(p.x-WALL_PAD)*mm, mmY+(p.y-WALL_PAD)*mm, mm*.5, 0, Math.PI*2); ctx.fill();
    }
    // 视野框：裁剪到有效棋盘范围
    const vx = Math.max(WALL_PAD, cam().x), vy = Math.max(WALL_PAD, cam().y);
    const vx2 = Math.min(N-WALL_PAD, cam().x+CAM_COLS), vy2 = Math.min(N-WALL_PAD, cam().y+CAM_ROWS);
    ctx.strokeStyle='#2b2d38'; ctx.lineWidth=1.5;
    ctx.strokeRect(mmX+(vx-WALL_PAD)*mm, mmY+(vy-WALL_PAD)*mm, (vx2-vx)*mm, (vy2-vy)*mm);
    // 小地图黑色描边
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeRect(mmX + 1.5, mmY + 1.5, mmSize - 3, mmSize - 3);
  },

  // 顶栏染色占比：单行紧凑显示（「染色占比」标签 + 黑/白迷你进度条 + 计数）
  // rightAlign=true 时 x 视为右边缘（用于贴 HUD 右端）
  drawRatioLine(x, y, barW, fontSize, rightAlign) {
    const s = Score.calculateRatio(state.board);
    const label = '染色占比';
    const items = [
      { label: '黑', color: '#0a0a0a', count: s.black, ratio: s.blackRatio },
      { label: '白', color: '#c8c8c8', count: s.white, ratio: s.whiteRatio },
    ];
    const bh = Math.max(6, fontSize - 3);

    ctx.font = 'bold ' + fontSize + 'px sans-serif';
    let totalW = ctx.measureText(label).width + 12;
    ctx.font = fontSize + 'px sans-serif';
    for (const it of items) totalW += ctx.measureText(it.label).width + 5 + barW + 6 + ctx.measureText(it.count + '/' + s.total).width + 16;

    let cx = rightAlign ? x - totalW : x;
    ctx.font = 'bold ' + fontSize + 'px sans-serif';
    ctx.fillStyle = '#6f7486';
    ctx.fillText(label, cx, y);
    cx += ctx.measureText(label).width + 12;
    ctx.font = fontSize + 'px sans-serif';
    for (const it of items) {
      ctx.fillStyle = '#4d5264';
      ctx.fillText(it.label, cx, y);
      cx += ctx.measureText(it.label).width + 5;
      const by = y - bh + 2;
      ctx.fillStyle = 'rgba(0,0,0,.12)'; rr(cx, by, barW, bh, 4); ctx.fill();
      ctx.fillStyle = it.color; rr(cx, by, Math.max(bh, barW * it.ratio), bh, 4); ctx.fill();
      const txt = it.count + '/' + s.total;
      ctx.fillStyle = '#6f7486';
      ctx.fillText(txt, cx + barW + 6, y);
      cx += barW + 6 + ctx.measureText(txt).width + 16;
    }
  },

  // 棋子放置与状态信息：返回描述片段数组（炸弹上限 / 爆炸范围 / 护盾 / 加固 / 加速 / 技能卡 / 足迹 / 下一子 / 染色 / AI 状态）
  statusOf(p) {
    const cur = state.bombs.filter(b => b.owner === p.id).length;
    const st = ['炸弹 ' + cur + '/' + p.maxBombs, '范围 ' + playerPower(p)];
    if (p.shield) st.push('护盾');
    if (p.reinforced) st.push('加固');
    if (p.speedBoostT > 0) st.push('加速 ' + p.speedBoostT.toFixed(1) + 's');
    if (p.queue.length) st.push('技能卡 ' + p.queue.length + '/' + MAX_QUEUE);
    if (p.trail > 0) st.push('足迹 ' + p.trail);
    if (p.powerNext > 0) st.push('下一子 +' + p.powerNext);
    if (p.dyeSteps > 0) st.push('染色 ' + p.dyeSteps + ' 步');
    if (p.isBot) st.push(p.mode === 'expand' ? 'AI · 染色扩张' : (p.blunderT > 0 ? 'AI · 失误' : 'AI · 追击'));
    return st;
  },

  // 顶栏玩家信息行：色点 + 名字(黑/白/阵亡) + 棋子放置信息(炸弹/范围/当前状态)
  // y=文字基线（桌面默认48）；compact=小号字体；maxW=超出则截断状态文本加省略号（默认不截断）
  hudPlayerLine(p, x, right, y = 48, compact = false, maxW = Infinity) {
    const hero = HEROES[p.hero];
    const name = hero.name + (p.color === BLACK ? '（黑）' : '（白）') + (p.alive ? '' : ' · 阵亡');
    let statusTxt = this.statusOf(p).join(' · ');
    const dotW = compact ? 7 : 8, gap = compact ? 5 : 6;
    const nameFont = compact ? 'bold 11px sans-serif' : 'bold 13px sans-serif';
    const stFont = compact ? '11px sans-serif' : '12px sans-serif';

    ctx.font = nameFont; const nameW = ctx.measureText(name).width;
    ctx.font = stFont; let stW = ctx.measureText(statusTxt).width;

    // 手机端限宽：超出则优先保留名字与色点，截掉状态文本末尾
    if (dotW + gap + nameW + gap + stW > maxW) {
      const allow = maxW - (dotW + gap + nameW + gap);
      while (statusTxt.length > 1 && ctx.measureText(statusTxt + '…').width > allow) statusTxt = statusTxt.slice(0, -1);
      statusTxt += '…';
      stW = ctx.measureText(statusTxt).width;
    }

    let sx = right ? x - (dotW + gap + nameW + gap + stW) : x;
    // 水墨风：黑方画黑子、白方画白子（带描边）
    ctx.beginPath(); ctx.arc(sx + dotW/2, y - dotW/2, dotW/2, 0, Math.PI*2);
    if (p.color === BLACK) { ctx.fillStyle = '#1a1a1a'; ctx.fill(); }
    else { ctx.fillStyle = '#f3efe6'; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 1; ctx.stroke(); }
    sx += dotW + gap;
    ctx.fillStyle = '#2b2d38'; ctx.font = nameFont;
    ctx.fillText(name, sx, y);
    sx += nameW + gap;
    ctx.fillStyle = '#4d5264'; ctx.font = stFont;
    ctx.fillText(statusTxt, sx, y);
  },

  // 顶栏圆角小标签（护盾 / AI / 追击 等），返回绘制后的新 x
  hudTag(text, x, cy, bg, fg) {
    const fs = HUD_H / 48;
    ctx.font = Math.round(11 * fs) + 'px sans-serif';
    const tw = ctx.measureText(text).width;
    const w = tw + 14, h = Math.round(18 * fs), y = cy - h / 2;
    ctx.fillStyle = bg; rr(x, y, w, h, Math.round(9 * fs)); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.08)'; ctx.lineWidth = 1; rr(x, y, w, h, Math.round(9 * fs)); ctx.stroke();
    ctx.fillStyle = fg;
    ctx.fillText(text, x + 7, cy);
    return x + w + 6;
  },

  // 顶栏单行玩家块：色点 + 名字(加粗) + 炸弹/范围/技能卡(数字加粗) + 护盾/AI/追击标签
  hudPlayerBlock(p, x, cy) {
    const hero = HEROES[p.hero];
    const cur = state.bombs.filter(b => b.owner === p.id).length;
    ctx.beginPath(); ctx.arc(x + 5, cy, 5, 0, Math.PI * 2);
    if (p.color === BLACK) { ctx.fillStyle = '#1a1a1a'; ctx.fill(); }
    else { ctx.fillStyle = '#f3efe6'; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 1; ctx.stroke(); }
    x += 13;
    const fs = HUD_H / 48;
    ctx.font = 'bold ' + Math.round(13 * fs) + 'px sans-serif'; ctx.fillStyle = '#2b2d38';
    ctx.fillText(hero.name, x, cy); x += ctx.measureText(hero.name).width + 8;
    const kv = (label, value) => {
      ctx.font = Math.round(12 * fs) + 'px sans-serif'; ctx.fillStyle = '#6f7486';
      ctx.fillText(label, x, cy); x += ctx.measureText(label).width;
      ctx.font = 'bold ' + Math.round(12 * fs) + 'px sans-serif'; ctx.fillStyle = '#2b2d38';
      ctx.fillText(value, x, cy); x += ctx.measureText(value).width + 8;
    };
    kv('炸弹 ', cur + '/' + p.maxBombs);
    kv('范围 ', String(playerPower(p)));
    if (p.queue.length) kv('技能卡 ', p.queue.length + '/' + MAX_QUEUE);
    if (p.shield) x = this.hudTag('护盾', x, cy, 'rgba(70,130,246,.14)', '#2f5fd0');
    if (p.isBot) {
      x = this.hudTag('AI', x, cy, 'rgba(140,90,46,.16)', '#8a5a2e');
      const mode = p.mode === 'expand' ? '扩张' : (p.blunderT > 0 ? '失误' : '追击');
      x = this.hudTag(mode, x, cy, 'rgba(140,90,46,.16)', '#8a5a2e');
    }
    return x;
  },

  // 顶栏单行染色占比：黑 / 白 各自 迷你进度条 + 计数
  drawRatioCompact(x, cy) {
    const s = Score.calculateRatio(state.board);
    const barW = 48, bh = 7;
    const one = (label, color, count, ratio) => {
      ctx.font = 'bold 12px sans-serif'; ctx.fillStyle = '#4d5264';
      ctx.fillText(label, x, cy); x += ctx.measureText(label).width + 5;
      const by = cy - bh / 2;
      ctx.fillStyle = 'rgba(0,0,0,.12)'; rr(x, by, barW, bh, 3.5); ctx.fill();
      ctx.fillStyle = color; rr(x, by, Math.max(bh, barW * ratio), bh, 3.5); ctx.fill();
      x += barW + 5;
      ctx.font = 'bold 12px sans-serif'; ctx.fillStyle = '#2b2d38';
      const txt = count + '/' + s.total;
      ctx.fillText(txt, x, cy); x += ctx.measureText(txt).width + 14;
    };
    one('黑', '#0a0a0a', s.black, s.blackRatio);
    one('白', '#c8c8c8', s.white, s.whiteRatio);
    return x;
  },

  // 屏幕下方中央的染色占比：黑白条框 + 黑条/白条按占比填充；黑白数量写在条上，总数写在框下方
  drawRatioBottom() {
    const s = Score.calculateRatio(state.board);
    const bh = Math.max(12, Math.round(H / 20));       // 框高 = 屏幕高 1/20
    const bw = Math.max(40, Math.round(W / 3));         // 框宽 = 屏幕宽 1/3
    const bx = Math.round((W - bw) / 2);                // 水平居中
    const totalH = Math.round(bh * 0.55);               // 下方「总数」文字行高
    const by = H - bh - totalH - 6;                     // 框底留出总数文字与底部边距
    const pad = Math.max(1, Math.round(bh * 0.08));     // 框内边距（露出外框描边）
    const innerW = bw - pad * 2, innerH = bh - pad * 2;
    const ratio = (s.total > 0) ? s.blackRatio : 0.5;   // 未开局默认五五开
    const bW = Math.max(0, Math.min(innerW, Math.round(innerW * ratio)));
    // 外框 → 白条铺底 → 黑条按占比覆盖左侧
    drawImg('rBarFrame', bx, by, bw, bh);
    drawImg('rBarW', bx + pad, by + pad, innerW, innerH);
    drawImg('rBarB', bx + pad, by + pad, bW, innerH);
    // 黑白数量写在条上（黑条白字 / 白条黑字）
    const fs = Math.max(10, Math.round(innerH * 0.6));
    ctx.textBaseline = 'middle';
    if (bW >= fs) {
      ctx.fillStyle = '#ffffff'; ctx.font = titleFont(fs, true); ctx.textAlign = 'center';
      ctx.fillText(String(s.black), bx + pad + bW / 2, by + bh / 2);
    }
    if (innerW - bW >= fs) {
      ctx.fillStyle = '#2e2a24'; ctx.font = titleFont(fs, true); ctx.textAlign = 'center';
      ctx.fillText(String(s.white), bx + pad + (bW + innerW) / 2, by + bh / 2);
    }
    // 总数写在框下方：白色正文在上 + 同字号略偏移的深色阴影在下
    const totalFont = Math.max(10, Math.round(bh * 0.45));
    const totalText = '总数 ' + s.total;
    const totalX = bx + bw / 2, totalY = by + bh + totalH / 2;
    const shOff = Math.max(2, Math.round(totalFont * 0.18));   // 阴影偏移
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = titleFont(totalFont, true);
    ctx.fillStyle = 'rgba(0,0,0,.55)';   // 深色阴影（下）
    ctx.fillText(totalText, totalX + shOff, totalY + shOff);
    ctx.fillStyle = '#ffffff';           // 白色正文（上）
    ctx.fillText(totalText, totalX, totalY);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  },

  drawHUD() {
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    if (isFullScreen()) {
      // 全屏对局紧凑 HUD：贴顶部、单行三块（标题倒计时 / 黑方 / 白方），竖线分隔；木纹底；染色占比在屏幕下方中央
      if (uiReady('hudWood')) {
        const wood = UI.hudWood;
        const sh = wood.naturalWidth * HUD_H / W; // 按比例裁顶条，避免木纹被横向拉伸变形
        ctx.drawImage(wood, 0, 0, wood.naturalWidth, sh, 0, 0, W, HUD_H);
      } else {
        ctx.fillStyle = '#fffdf6';
        ctx.fillRect(0, 0, W, HUD_H);
      }
      const modeName = state.mode==='duel' ? '染色对决' : '染色竞速';
      const timerText = state.mode==='duel' ? Math.max(0,Math.ceil(state.timeLeft))+'s' : '目标 '+RACE_TARGET+' 格';
      const hudLeft = HUD_H + 8; // 设置键已移至顶栏最左，HUD 文字从设置键右侧开始
      const cy = HUD_H / 2;
      const fs = HUD_H / 48; // 字体随顶栏高度缩放
      ctx.textBaseline = 'middle';
      let x = hudLeft;
      const sep = () => {
        x += 6;
        ctx.strokeStyle = '#ddd6c6'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, cy - Math.round(16 * fs)); ctx.lineTo(x, cy + Math.round(16 * fs)); ctx.stroke();
        x += 12;
      };
      // 块1：标题 + 倒计时
      ctx.fillStyle = '#2b2d38'; ctx.font = 'bold ' + Math.round(14 * fs) + 'px sans-serif';
      const title = modeName;
      ctx.fillText(title, x, cy); x += ctx.measureText(title).width + 10;
      ctx.fillStyle = '#8a5a2e'; ctx.font = 'bold ' + Math.round(14 * fs) + 'px sans-serif';
      ctx.fillText(timerText, x, cy); x += ctx.measureText(timerText).width;
      // 块2：黑方信息
      sep(); x = this.hudPlayerBlock(state.players.p1, x, cy);
      // 块3：白方信息
      sep(); x = this.hudPlayerBlock(state.players.p2, x, cy);
      // （染色占比已移至屏幕下方中央 drawRatioBottom）
      this.drawSettingsButton();
      return;
    }
    ctx.fillStyle='rgba(255,253,246,.97)'; ctx.fillRect(0,0,W,HUD_H);
    ctx.fillStyle='#2e2a24'; ctx.font=titleFont(30, true);
    const modeName = state.mode==='duel' ? '染色对决' : '染色竞速';
    const timerText = state.mode==='duel' ? '剩余 '+Math.max(0,Math.ceil(state.timeLeft))+'s' : '目标 '+RACE_TARGET+' 格';
    ctx.fillText(modeName, 58, 56);
    ctx.fillStyle='#8a5a2e'; ctx.font=titleFont(22, false);
    ctx.fillText(timerText, 58, 92);
    // 双方棋子信息（黑左白右），落在棋盘框左右两端
    this.hudPlayerLine(state.players.p1, LEFT_X, false, 50);
    this.hudPlayerLine(state.players.p2, LEFT_X + LEFT_W, true, 50);
  },

  // 顶栏左侧设置键（设置图标，放大），嵌入 HUD 顶栏内，点击打开设置；正方形，边长与顶栏高度一致
  drawSettingsButton() {
    const bw = HUD_H - 8, bh = HUD_H - 8, bx = 8, by = (HUD_H - bh) / 2;
    // 背景透明：仅绘制设置图标 + 点击热区
    const iw = Math.round(bw * 0.53), ih = Math.round(iw * 35 / 34);
    drawImg('setIcon', bx + (bw - iw) / 2, by + (bh - ih) / 2, iw, ih);

  // 左上角（顶栏之下）：当前拥有的道具（技能卡队列），竖排显示名称 + 小图标
  drawInventory() {
    if (!state || !state.players) return;
    const p1 = state.players.p1;
    if (!p1.queue.length) return;
    const fs = HUD_H / 48;
    const x = 10, rowH = Math.round(30 * fs), iconS = Math.round(24 * fs), gap = Math.round(6 * fs), y0 = HUD_H + Math.round(10 * fs);
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    p1.queue.forEach((item, i) => {
      const y = y0 + i * (rowH + gap);
      ctx.font = 'bold ' + Math.round(13 * fs) + 'px sans-serif';
      const name = ITEMS[item].name;
      const w = iconS + 10 + ctx.measureText(name).width + 60;
      ctx.fillStyle = 'rgba(184, 134, 11, .95)'; // 暗黄色
      rr(x, y, w, rowH, Math.round(8 * fs)); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.1)'; ctx.lineWidth = 1;
      rr(x, y, w, rowH, Math.round(8 * fs)); ctx.stroke();
      const v = ITEM_IMGS[item];
      const icon = Array.isArray(v) ? v[0] : v;
      const ix = x + Math.round(6 * fs), iy = y + (rowH - iconS) / 2;
      if (icon && icon.complete && icon.naturalWidth) {
        ctx.drawImage(icon, ix, iy, iconS, iconS);
      } else {
        ctx.fillStyle = ITEMS[item].color;
        rr(ix, iy, iconS, iconS, Math.round(5 * fs)); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold ' + Math.round(12 * fs) + 'px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(name[0], ix + iconS / 2, iy + iconS / 2);
        ctx.textAlign = 'left';
      }
      ctx.fillStyle = '#2b2d38'; ctx.font = 'bold ' + Math.round(13 * fs) + 'px sans-serif';
      ctx.fillText(name, ix + iconS + 8, y + rowH / 2);
    });
    ctx.textBaseline = 'alphabetic';
  },

  drawGameBg() {

  drawRightPanel(opts) {
