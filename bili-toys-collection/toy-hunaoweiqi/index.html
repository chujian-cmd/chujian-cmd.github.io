  drawAvatar(h, x, y, w) {
    if (!h) { // 尚未选定（如人机未抽取），画空头像
      ctx.fillStyle = '#efe6d2'; ctx.beginPath(); ctx.arc(x + w / 2, y + w / 2, w / 2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#b09a78'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#b8a88a'; ctx.font = titleFont(Math.round(w * 0.36), true); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('?', x + w / 2, y + w / 2 + 2);
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      return;
    }
    const img = AVATAR[h];
    if (img && img.complete && img.naturalWidth) { ctx.drawImage(img, x, y, w, w); return; }
    ctx.fillStyle = '#efe6d2'; ctx.beginPath(); ctx.arc(x + w / 2, y + w / 2, w / 2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#b09a78'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#3a2c1c'; ctx.font = titleFont(Math.round(w * 0.4), true); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText((HEROES[h] && HEROES[h].name[0]) || '棋', x + w / 2, y + w / 2 + 2);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  },

  lockAvatar(cx, cy, d, label) {
    ctx.save();
    ctx.beginPath(); ctx.arc(cx + d / 2, cy + d / 2, d / 2, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = 'rgba(48,42,34,.55)'; ctx.fillRect(cx, cy, d, d);
    ctx.restore();
    ctx.fillStyle = '#fff'; ctx.font = 'bold ' + Math.round(d * 0.23) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('锁', cx + d / 2, cy + d / 2 - (label ? d * 0.08 : 0));
    if (label) { ctx.fillStyle = '#f6e7c8'; ctx.font = titleFont(Math.round(d * 0.09), true); ctx.fillText('任务解锁', cx + d / 2, cy + d / 2 + d * 0.15); }
    ctx.textBaseline = 'alphabetic';
  },

  drawAvatars(px, y, aw, ah, p1, p2) {
    const s = 96;
    // 头像框里的两个圆环（112px）中心分别在 rel x 55.5 / 293.5，头像 96px 居中放置
    this.drawAvatar(p1, px + 8, y + (ah - s) / 2, s);
    this.drawAvatar(p2, px + aw - 8 - s, y + (ah - s) / 2, s);
    const vh = ah - 26, vw = 145 * vh / 195;
    drawImg('rVs', px + aw / 2 - vw / 2, y + 13, vw, vh);
  },

  drawTray(px, y, tw, th) {
    const has = state && state.players && state.players.p1;
    const cur = has ? state.bombs.filter(b => b.owner === 'p1').length : 0;
    const max = has ? state.players.p1.maxBombs : 6;
    // 棋奁底图已自带左右棋奁，这里只画中央的数量框（59×65 竖版，原生比例，不再拉伸/重复）
    const cw = 59, ch = 65;
    const cx = px + Math.round((tw - cw) / 2), cy = y + Math.round((th - ch) / 2);
    drawImg('rCount', cx, cy, cw, ch);
    ctx.fillStyle = '#2e2a24'; ctx.font = titleFont(19, true); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(has ? (cur + '/' + max) : (max + '/' + max), cx + cw / 2, cy + ch / 2 + 1);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  },

  drawRatioBar(bx, y, bw, bh) {
    let blackRatio, whiteRatio;
    if (state && state.board) {
      const s = Score.calculateRatio(state.board);
      if (s.total > 0) { blackRatio = s.blackRatio; whiteRatio = s.whiteRatio; }
    }
    if (blackRatio === undefined) { blackRatio = 0.5; whiteRatio = 0.5; } // 未开局默认五五开
    const tot = (blackRatio + whiteRatio) || 1;
    const bW = Math.max(0, bw * blackRatio / tot - 2);
    drawImg('rBarB', bx + 1, y + 1, bW, bh - 2);
    drawImg('rBarW', bx + 1 + bW + 2, y + 1, Math.max(0, bw - bW - 4), bh - 2);
    const txt = '黑 ' + Math.round(blackRatio * 100) + '%  ·  白 ' + Math.round(whiteRatio * 100) + '%';
    ctx.font = titleFont(15, true); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'rgba(246,231,200,.92)'; ctx.lineWidth = 3;
    ctx.strokeText(txt, bx + bw / 2, y + bh / 2 + 1);
    ctx.fillStyle = '#2e2a24'; ctx.fillText(txt, bx + bw / 2, y + bh / 2 + 1);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  },

  drawItemBox(px, y, iw, ih) {
    const p1 = state.players.p1, hero = HEROES[p1.hero];
    let txt;
    if (!hero.active) txt = '无主动技能';
    else if (!p1.alive) txt = hero.active + ' · 已阵亡';
    else if (p1.skill.charging) txt = hero.active + ' · 蓄力 ' + p1.skill.chargeLeft.toFixed(1) + 's';
    else if (p1.c4) txt = hero.active + ' · 已放置，点击引爆';
    else if (p1.skill.cd > 0) txt = hero.active + ' · 冷却 ' + p1.skill.cd.toFixed(1) + 's';
    else txt = hero.active + ' · 就绪（F）';
    ctx.fillStyle = '#2e2a24'; ctx.font = titleFont(25, true); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('道具 · ' + txt, px + iw / 2, y + ih / 2 + 1);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  },

  /* ---------- 菜单屏幕 ---------- */
  // 全屏菜单页通用框架：底图拉伸铺满整个窗口（消除横屏左右空隙），
  // 内容按 1920×1080 桌面设计等比缩放居中绘制，命中区随缩放换算回逻辑坐标
  menuFrame(bgKey, draw, lift = 0, shiftX = 0) {
    drawImg(bgKey, 0, 0, W, H);
    const k = Math.min(W / 1920, H / 1080);
    const ox = (W - 1920 * k) / 2, oy = (H - 1080 * k) / 2;
    const prev = { W, H, LEFT_X, LEFT_Y, LEFT_W, LEFT_H, hitTx };
    W = 1920; H = 1080; LEFT_X = 58; LEFT_Y = 124; LEFT_W = 1403; LEFT_H = 904;
    hitTx = { k, ox: ox + shiftX * k, oy: oy - lift * k };
    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(k, k);
    if (lift) ctx.translate(0, -lift);
    if (shiftX) ctx.translate(shiftX, 0);
    try { draw(); }
    finally {
      ctx.restore();
      W = prev.W; H = prev.H; LEFT_X = prev.LEFT_X; LEFT_Y = prev.LEFT_Y;
      LEFT_W = prev.LEFT_W; LEFT_H = prev.LEFT_H; hitTx = prev.hitTx;
    }
  },

  // 居中缩放绘制 1920×1080 设计内容（无底图），用于弹窗面板（设置等）叠加在底层画面上；命中区随缩放换算
  overlayFrame(draw) {
    const k = Math.min(W / 1920, H / 1080);
    const ox = (W - 1920 * k) / 2, oy = (H - 1080 * k) / 2;
    const prev = { W, H, hitTx };
    W = 1920; H = 1080;
    hitTx = { k, ox, oy };
    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(k, k);
    try { draw(); }
    finally {
      ctx.restore();
      W = prev.W; H = prev.H; hitTx = prev.hitTx;
    }
  },

  drawTitle() {

      drawImg('bgTitle', 0, 0, W, H);  // 标题底图（1920×1080，等比缩放居中；两侧空隙露出底层棋手选择底图）
      // 左侧纵向排列：开始游戏 / 退出游戏 / 设置（参考图 B.1）

      const sw = 248, sh = 143;
      drawImg('btnSet', bx, 860, sw, sh);
      registerHit(bx, 860, sw, sh, () => openSettings());
      // 右下：一键三连（解锁人物入口），按素材原生比例 底图819×679 / 按钮453×278
      const ibw = 819, ibh = 679;
      const ibx = W - ibw - 24, iby = H - ibh - 20;
      const iw = 453, ih = 278;
      const ix = ibx + (ibw - iw) / 2, iy = iby + (ibh - ih) / 2;

      drawImg('inkKey', ix, iy, iw, ih);
      registerHit(ibx, iby, ibw, ibh, () => openLink());
      // 操作提示

      ctx.fillText(gachaPhase ? ('P1：' + HEROES[ROSTER[menu.p1]].name) : (locked ? '正在确认，即将抽取敌方棋手……' : '点击选择 · 再次点击确认（空格确认）· Esc 返回'), 58 + 1403 / 2, 442);

      // 头像行（P1 行）：浏览阶段不再挂游标，点中确认后才在对应人物头上显示 p1 光标
      ROSTER.forEach((id, i) => {
        const cx = x0 + i * (avW + avGap);
        const cy = avY + bounceDy('select', i);
        this.drawAvatar(id, cx, cy, avW);
        const selected = !locked && !gachaPhase && i === menu.sel; // 第一次点击选中态
        if (isLocked(id)) {
          this.lockAvatar(cx, cy, avW, true);
        } else {
          ctx.fillStyle = '#3a2c1c'; ctx.font = titleFont(20, true); ctx.textAlign = 'center';
          // 选中后名字下移，给头像下方的确认按钮让位
          ctx.fillText(HEROES[id].name, cx + avW / 2, cy + avH + (selected ? 82 : 26));
        }
        drawFlash(cx, cy, avW, avH, avW / 2); // 所有头像统一淡淡的泛白闪烁
        if (selected) { // 第一次点击选中后：头像描金边 + 下方显示确认按钮，凸显按钮感
          ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 4;
          ctx.strokeRect(cx - 3, cy - 3, avW + 6, avH + 6);
          const bw = avW, bh = Math.round(avW * 78 / 245);
          const btnX = cx + (avW - bw) / 2, btnY = cy + avH + 6;
          drawImg('btnConfirm', btnX, btnY, bw, bh);
          registerHit(btnX, btnY, bw, bh, () => startBounce('select', i, () => confirmSelect())); // 点击确认按钮直接确认
        }
        if ((locked || gachaPhase) && i === menu.p1) { // 点中确认后才显示选中图标
          const cw = 123, ch = 77;
          drawImg('p1Cursor', cx + (avW - cw) / 2, cy - ch - 2, cw, ch);
        }
        registerHit(cx, cy, avW, avH, () => {
          if (menu.phase !== 0 || isLocked(id)) return;
          if (menu.sel === i) startBounce('select', i, () => confirmSelect()); // 再次点击：确认，开始人机选择
          else menu.sel = i; // 第一次点击：选中，头像下方显示确认按钮
        });
      });

      if (gachaPhase) {
        // 敌方抽卡行 + cpu 光标滑动
        const gy = avY + avH + 140;
        const t = clamp((performance.now() - gacha.start) / gacha.duration, 0, 1);
        const e = 1 - Math.pow(1 - t, 3);
        const fi = Math.floor(e * (gacha.extraLaps * n + gacha.result)) % n;
        ROSTER.forEach((id, i) => {
          const cx = x0 + i * (avW + avGap);
          this.drawAvatar(id, cx, gy, avW);
          // 敌方抽卡行不显示「锁」：人机可抽取任意角色（含未解锁），锁字会误导
          ctx.fillStyle = '#3a2c1c'; ctx.font = titleFont(20, true); ctx.textAlign = 'center';
          ctx.fillText(HEROES[id].name, cx + avW / 2, gy + avH + 26);
        });
        const bx = x0 + fi * (avW + avGap);
        const cw = 123, ch = 77;
        drawImg('cpuCursor', bx + (avW - cw) / 2, gy - ch - 2, cw, ch);
        const blink2 = Math.floor(performance.now() / 150) % 2 === 0;
        ctx.strokeStyle = blink2 ? '#7aa2c8' : '#d8cba8'; ctx.lineWidth = 4;
        ctx.strokeRect(bx - 4, gy - 4, avW + 8, avH + 8);

        const hero = HEROES[ROSTER[p1Sel]];

        if (hero.active) { ctx.fillStyle = '#8a5a2e'; ctx.font = titleFont(20, false); ctx.fillText('主动：' + hero.active + ' — ' + hero.activeDesc, 58 + 1403 / 2, avY + avH + 150); }
      }

  /* ---------- 结算（canvas，替换 HTML #result-panel） ---------- */
  drawResult() {
    const winner = state.winner;
    const won = winner === BLACK, draw = winner === 'draw';
    drawImg('gameBg', 0, 0, W, H);
    // 全屏结算：将 1920×1080 桌面设计等比缩放到全屏居中，命中区换算回逻辑坐标
    const k = Math.min(W / 1920, H / 1080);
    const ox = (W - 1920 * k) / 2, oy = (H - 1080 * k) / 2;
    const regHit = (x, y, w, h, fn, kind) => registerHit(ox + x * k, oy + y * k, w * k, h * k, fn, kind);
    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(k, k);

    // 胜/负底图居中单独显示：只保留底图 + 底部按钮 + 颜色占比/连胜文案（不显示右侧信息栏）
    const pw = 1403, ph = 904;
    const px0 = Math.round((1920 - pw) / 2), py0 = Math.round((1080 - ph) / 2);
    drawImg(won ? 'winBg' : 'loseBg', px0, py0, pw, ph);
    // 颜色占比 + 连胜（居中大字，沿用原排版偏移）
    const s = Score.calculateRatio(state.board);
    const bp = Math.round(s.blackRatio * 100), wp = Math.round(s.whiteRatio * 100);
    const cx = px0 + pw / 2;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#3a2c1c'; ctx.font = titleFont(42, true);
    ctx.fillText('黑子占比：' + bp + '%', cx, py0 + 381);
    ctx.fillText('白子占比：' + wp + '%', cx, py0 + 531);
    ctx.fillStyle = '#8a5a2e'; ctx.font = titleFont(22, false);
    ctx.fillText(draw ? '平局 · 势均力敌' : ('连胜 ' + winStreak + ' 关' + (bestStreak > 0 ? ' · 最高 ' + bestStreak + ' 关' : '')), cx, py0 + 596);
    ctx.textAlign = 'left';
    // 底部两键：返回主菜单 / 继续游戏（下一关·再来一局），等比缩放横向排布，两键等大
    const sc = 0.94, gap = 22;
    const hw = Math.round(453 * sc), hh = Math.round(120 * sc);
    const by = py0 + 666;   // 按钮原 y=790（底图原顶 124），相对底图顶部 666px，随底图居中整体下移
    const totalW = hw * 2 + gap;
    const rowX = px0 + Math.round((pw - totalW) / 2);
    const hx = rowX, cxx = rowX + hw + gap;
    drawImg('btnHome', hx, by, hw, hh);
    regHit(hx, by, hw, hh, () => { screen = 'title'; });
    if (won) { drawImg('btnConfirm', cxx, by, hw, hh); regHit(cxx, by, hw, hh, () => nextLevel()); }
    else { drawImg('setRestart', cxx, by, hw, hh); regHit(cxx, by, hw, hh, () => restart()); }

    ctx.restore();
  },

  drawVolSlider(imgKey, iconX, trackX, y, which) {
    const vol = which === 'music' ? musicVol : sfxVol;
    // 图标（音乐 93×125 / 音效 252×113）
    const iw = which === 'music' ? 93 : 252, ih = which === 'music' ? 125 : 113;
    drawImg(imgKey, iconX, y, iw, ih);
    // 滑轨（原生 679×358，等比缩放到高 140）；墨迹约在 41% 高度，下移 12px 对准滑块中心
    const ts = 140 / 358, tw = Math.round(679 * ts * 1.5), th = 140;
    const ty = y + Math.round((ih - th) / 2);
    drawImg('setSliderBar', trackX, ty + 12, tw, th);
    // 滑块（音乐黑石 97×92 / 音效白石 98×93）
    const kw = which === 'music' ? 97 : 98, kh = which === 'music' ? 92 : 93;
    const kx = trackX + Math.round((tw - kw) * vol), ky = ty + Math.round((th - kh) / 2);
    drawImg(which === 'music' ? 'setSlider' : 'setSlider2', kx, ky, kw, kh);
    ctx.fillStyle = '#8a5a2e'; ctx.font = titleFont(20, false); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(Math.round(vol * 100) + '%', trackX + tw + 24, ty + th / 2);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    const t = hitTx;   // 叠加面板缩放换算（overlayFrame 设置），滑块拖动需把逻辑坐标换算回 1920×1080 设计坐标
    registerHit(trackX - 24, ty - 40, tw + 48, th + 80, (px) => {
      const dp = (px - t.ox) / t.k;
      const nv = clamp((dp - trackX) / tw, 0, 1);
      if (which === 'music') { musicVol = nv; AudioSys.setMusicVol(nv); }
      else { sfxVol = nv; AudioSys.setSfxVol(nv); }
    }, 'slider');
  },

  drawMapPreview(map, cx, cy, box) {

      const x0 = cx - box/2, y0 = cy - box/2;
      ctx.fillStyle='rgba(232,211,163,.12)'; rr(x0, y0, box, box, 8); ctx.fill();
      ctx.strokeStyle='#8a5a2e'; ctx.lineWidth=2; ctx.stroke();
      ctx.fillStyle='#3a2c1c'; ctx.font='bold 56px sans-serif';
      ctx.fillText('?', cx, cy-10);
      ctx.fillStyle='#8a7a60'; ctx.font='16px sans-serif';
      ctx.fillText('随机生成', cx, cy+30);
      return;
    }
    const rows = map.grid.length, cols = map.grid[0].length;
    const ps = box / Math.max(rows, cols);
    const w = cols*ps, h = rows*ps;
    const x0 = cx - w/2, y0 = cy - h/2;
    for (let y=0;y<rows;y++) for (let x=0;x<cols;x++) {
      ctx.fillStyle = map.grid[y][x] === 1 ? '#4a3a28' : '#e8d3a3';
      ctx.fillRect(x0+x*ps, y0+y*ps, ps, ps);
    }
    ctx.strokeStyle='rgba(122,92,51,.55)'; ctx.lineWidth=1; ctx.beginPath();
    for (let x=0;x<=cols;x++){ ctx.moveTo(x0+x*ps,y0); ctx.lineTo(x0+x*ps,y0+h); }
    for (let y=0;y<=rows;y++){ ctx.moveTo(x0,y0+y*ps); ctx.lineTo(x0+w,y0+y*ps); }
    ctx.stroke();
    ctx.strokeStyle='#c0b697'; ctx.lineWidth=2; ctx.strokeRect(x0, y0, w, h);
  },
};

function syncSkillCard() {
  const playing = screen === 'playing' && state;

/* ===================== 游戏循环 ===================== */
let last = performance.now();
let FRAME = 0;   // 渲染帧计数：爆炸范围特效按帧错开绘制，分摊单帧大图绘制开销
function bgmScreen() { // 屏幕 → 背景音乐分组
  if (screen === 'title') return 'title';
  if (screen === 'playing' || screen === 'gameover') return 'game';
  return 'menu';
}
function loop(now) {
  const dt = Math.min((now-last)/1000, 0.05);
  last = now;
  FRAME++;
  update(dt);
  updateGacha();
  updateMenuBounce();
  AudioSys.bgm(BGM[bgmScreen()]);
  Renderer.draw();
  syncSkillCard();
  syncQueue();
  syncUI();
  requestAnimationFrame(loop);
}
function update(dt) {
  if (screen !== 'playing') return;
  if (state.mode === 'duel') state.timeLeft -= dt;
  state.elapsed += dt;
  const p1 = state.players.p1, p2 = state.players.p2;
  updatePlayer(p1, dt); updatePlayer(p2, dt);
  humanInput(p1, dt);
  BotAI.update(p2, dt);
  BombManager.update(dt);
  updateChasers(dt);
  updateRainClouds();
  updateUfos(dt);
  updateUpgradeSpawns(dt);
  collectPickups();
  updateCamera(dt);
  state.explosions = state.explosions.filter(e => e.until > performance.now());
  state.pickupFx = state.pickupFx.filter(f => f.until > performance.now());
  state.ufoFx = state.ufoFx.filter(f => f.until > performance.now());
  updateParticles(dt);
  if (state.shakeT > 0) state.shakeT -= dt;
  const w = Score.checkWinCondition(state.mode, state.board, state.timeLeft);
  if (w) endGame(w);
}
function updateCamera(dt) {
  const p = state.players.p1;
  const tx = clamp(p.x - CAM_COLS/2, 0, N-CAM_COLS);
  const ty = clamp(p.y - CAM_ROWS/2, 0, N-CAM_ROWS);
  const k = Math.min(1, dt*8);
  state.cam.x += (tx - state.cam.x)*k;
  state.cam.y += (ty - state.cam.y)*k;
}
function endGame(winner) {
  state.winner = winner; screen = 'gameover';
  if (winner === BLACK) {
    winStreak += 1;
    if (winStreak > bestStreak) bestStreak = winStreak;
    submitStreakToRank(); // 上传连胜到排行榜
  } else {
    winStreak = 0;
    level = 0;
  }
  saveProgress(); // 记录并上传连胜/关卡进度
  AudioSys.sfx(winner === BLACK ? SFX.win : SFX.lose); // 胜负音效
  Bus.emit('gameOver', { winner });
}

/* ===================== 设置 / 结算 界面 ===================== */
let settingsPrev = 'title';
let musicVol = 0.8, sfxVol = 1.0;   // 设置滑块音量（与 AudioSys 同步）
let activeSlider = null;             // 当前正在拖动的音量滑块 { fn, id }
function openSettings() {
  if (screen === 'settings') return;
  settingsPrev = screen;
  screen = 'settings';
}
function closeSettings() { screen = settingsPrev; }
// 打开一键三连弹窗，并异步刷新任务状态（点赞/投币/关注 → 解锁人物）
let linkPrev = 'title';
function openLink() { linkPrev = screen; screen = 'link'; refreshTasks(); loadVideoInfo(); }

// 所有设备统一启用触屏虚拟按键（摇杆 + 按键）与 touch 样式
document.body.classList.add('touch');

// 虚拟摇杆：按下/拖动杆身，返回连续归一化向量（-1..1）驱动自由移动；面向取「分量最大」的轴；松开回中
const stickDir = (dx, dy) => {
    const len = Math.hypot(dx, dy);
    if (len < 8) return { x: 0, y: 0 }; // 死区
    return { x: dx / len, y: dy / len };
  };
  const stickMove = e => {
    if (!joystick.active || e.pointerId !== joystick.id) return;
    let dx = e.clientX - joystick.cx, dy = e.clientY - joystick.cy;
    const len = Math.hypot(dx, dy);
    if (len > STICK_RADIUS) { dx = dx / len * STICK_RADIUS; dy = dy / len * STICK_RADIUS; }
    stickKnob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    const d = stickDir(dx, dy);
    if (d.x === dpad.dx && d.y === dpad.dy) return;
    dpad.dx = d.x; dpad.dy = d.y;
  };
  const stickDown = e => {
    if (screen !== 'playing' || !state) return;
    e.preventDefault();
    try { stickBase.setPointerCapture(e.pointerId); } catch (_) {}
    const r = stickBase.getBoundingClientRect();
    joystick.active = true; joystick.id = e.pointerId;
    joystick.cx = r.left + r.width / 2; joystick.cy = r.top + r.height / 2;
    stickMove(e);
  };
  const stickUp = e => {
    if (e.pointerId !== joystick.id) return;
    joystick.active = false; joystick.id = null;
    dpad.dx = 0; dpad.dy = 0;
    stickKnob.style.transform = 'translate(0,0)';
  };
  stickBase.addEventListener('pointerdown', stickDown);
  stickBase.addEventListener('pointermove', stickMove);
  stickBase.addEventListener('pointerup', stickUp);
  stickBase.addEventListener('pointercancel', stickUp);

  const bindTap = (el, fn) => el.addEventListener('pointerdown', e => {
    if (screen !== 'playing' || !state) return;
    e.preventDefault();
    fn(state.players.p1);
  });
  bindTap(tBomb, p => BombManager.tryPlace(p));
  bindTap(tCast, p => castFront(p));
  bindTap(tInteract, p => interact(p));
  bindTap(tSkill, p => startActive(p));

/* ===================== 画布点击（热区命中 + 音量滑块拖动） ===================== */
function canvasPointerDown(e) {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W;
  const y = (e.clientY - r.top) / r.height * H;
  const h = hitAt(x, y);
  if (!h) return;
  if (h.kind === 'slider') activeSlider = { fn: h.fn, id: e.pointerId };
  h.fn(x, y);
  AudioSys.sfx(SFX.click);
}
function canvasPointerMove(e) {
  if (!activeSlider || e.pointerId !== activeSlider.id) return;
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W;
  activeSlider.fn(x, 0);
}
function canvasPointerUp(e) {
  if (activeSlider && e.pointerId === activeSlider.id) activeSlider = null;
}
canvas.addEventListener('pointerdown', canvasPointerDown);
canvas.addEventListener('pointermove', canvasPointerMove);
canvas.addEventListener('pointerup', canvasPointerUp);
canvas.addEventListener('pointercancel', canvasPointerUp);

/* ===================== 横竖屏检测 + 点击自动转横屏 ===================== */
// 启动时检测横竖屏：竖屏（触屏设备）时显示遮罩；点击后自动切横屏。
// B站 App 内走 SDK 容器能力 setContainerMode；Web/手机浏览器走全屏 + screen.orientation.lock。
const rotateHintEl = document.getElementById('rotate-hint');
const isPortrait = () => (window.innerHeight > window.innerWidth) ||
  (window.matchMedia && window.matchMedia('(orientation: portrait)').matches);
function updateRotateHint() {
  rotateHintEl.style.display = (isTouch && isPortrait()) ? 'flex' : 'none';
}
rotateHintEl.addEventListener('click', async () => {
  try {
    // B站 App 内：原子更新方向 + 沉浸状态（手机需同时开启沉浸才能横屏）
    if (window.toy && typeof toy.setContainerMode === 'function') {
      await toy.setContainerMode({ orientation: 'landscape', immersive: true });
    }
  } catch (_) {}
  try {
    // Web / 手机浏览器：先全屏（Android Chrome 锁方向需在全屏态），再锁定横屏
    const de = document.documentElement;
    const fs = de.requestFullscreen || de.webkitRequestFullscreen || de.mozRequestFullScreen || de.msRequestFullscreen;
    if (fs) { const r = fs.call(de); if (r && r.catch) { try { await r; } catch (_) {} } }
    const so = window.screen && window.screen.orientation;  // 注意：项目内 `screen` 是游戏状态变量，需用 window.screen
    if (so && so.lock) { try { await so.lock('landscape'); } catch (_) {} }
  } catch (_) {}
  updateRotateHint();  // 部分设备（如 iOS）不支持锁方向，切横屏失败时保持遮罩提示手动旋转
});
window.addEventListener('orientationchange', updateRotateHint);
window.addEventListener('resize', updateRotateHint);
updateRotateHint();   // 启动时检测一次

Input.init();
loadProgress().then(() => syncTaskPanel());
requestAnimationFrame(loop);
})();
