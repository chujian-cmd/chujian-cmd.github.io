        function judgeLanTitle() {
            if (window.navigator.language == "zh-CN" || window.navigator.language == "zh-cn") {
                document.title = "小游戏：合成大西瓜";
            } else if (window.navigator.language == "zh-TW" || window.navigator.language == "zh-HK") {
                document.title = "小遊戲：合成大西瓜";
            } else if (window.navigator.language == "ko-KR") {
                document.title = "작은 놀이：큰 수박 을 합성 하 다";
            } else if (window.navigator.language == "ja-JP") {
                document.title = "ミニゲーム：合成スイカ";
            } else {
                document.title = "Little game：Synthetic watermelon";
            }
        }

        var loadintT = document.getElementById("loadingText");
        var loadintGif = document.getElementById("loadingImg");
        setTimeout(function () {
            if (loadintGif) loadintGif.remove();
            if (loadintT) loadintT.style.display = "";
            updateLabView(0.1);
        }, 1000);

        window.timer = null;
        window.tempSeconds = 1;
        window.loadData = { completedCount: 0, totalCount: 0 };

        window.onload = function () {
            var blockBox = document.getElementById("block-Box");
            if (blockBox) blockBox.style.display = "none";
        };

        function updateLabView(t) {
            if (timer != null) clearInterval(timer);
            timer = setInterval(function () {
                tempSeconds++;
                actualTotal();
                var loadintT = document.getElementById("loadingText");
                if (!loadintT) return;
                loadintT.innerHTML = 'loading......' + parseInt(tempSeconds) + '%';

                if (tempSeconds >= 100) {
                    clearInterval(timer);
                    tempSeconds = 100;
                    loadintT.innerHTML = 'loading......100%';
                }
            }, t * 1000);
        }

        function actualTotal() {
            var percent = parseInt(100 * loadData.completedCount / loadData.totalCount);
            if (percent > tempSeconds && loadData.totalCount > 1) {
                tempSeconds = percent;
            }
        }
    </script>

    <!-- 🎵 8首 BGM 顺序随机连播逻辑（放完自动切下一首） -->
    <script>
        (function () {
            // 扩展至 8 首背景音乐
            var bgmList = ['bgm1', 'bgm2', 'bgm3', 'bgm4', 'bgm5', 'bgm6', 'bgm7', 'bgm8'];
            var currentAudio = null;
            var lastTrackIndex = -1;

            var checkBoot = setInterval(function () {
                if (window.cc && cc.director && cc.director.getScene()) {
                    clearInterval(checkBoot);
                    playNextTrack();
                }
            }, 500);

            function playNextTrack() {
                try {
                    // 随机选择下一首，自动避免连续两首完全相同
                    var randomIndex;
                    if (bgmList.length > 1) {
                        do {
                            randomIndex = Math.floor(Math.random() * bgmList.length);
                        } while (randomIndex === lastTrackIndex);
                    } else {
                        randomIndex = 0;
                    }
                    lastTrackIndex = randomIndex;

                    var selected = bgmList[randomIndex];
                    currentAudio = new Audio('./music/' + selected + '.mp3');
                    currentAudio.volume = 0.6;

                    // 监听播放结束事件，放完后自动调用切换下一首
                    currentAudio.addEventListener('ended', function () {
                        console.log('🎵 BGM [' + selected + '] 播放完成，正在切歌...');
                        playNextTrack();
                    });

                    var playPromise = currentAudio.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(function () {
                            document.addEventListener('click', function once() {
                                if (currentAudio) currentAudio.play();
                            }, { once: true });
                        });
                    }
                    console.log('🎵 正在播放 BGM: ' + selected);
                } catch (e) {
                    console.warn('BGM 播放异常:', e);
                }
            }
        })();
    </script>
