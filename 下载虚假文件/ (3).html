<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星链极速版 · 安卓版下载</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  body {
    min-height:100vh;
    background: linear-gradient(145deg, #0b1a2e 0%, #1a2f3f 100%);
    display:flex; align-items:center; justify-content:center;
    padding:20px; position:relative; overflow-x:hidden;
  }
  body::before {
    content:''; position:absolute; width:500px; height:500px;
    background: radial-gradient(circle, rgba(0,180,255,0.15) 0%, transparent 70%);
    top:-150px; right:-150px; border-radius:50%; pointer-events:none;
  }
  body::after {
    content:''; position:absolute; width:400px; height:400px;
    background: radial-gradient(circle, rgba(100,0,255,0.1) 0%, transparent 70%);
    bottom:-100px; left:-100px; border-radius:50%; pointer-events:none;
  }
  .card {
    width:100%; max-width:480px;
    background: rgba(22,34,48,0.85);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-radius: 40px; padding: 40px 28px 36px;
    box-shadow: 0 30px 50px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,255,255,0.12) inset;
    border: 1px solid rgba(0,255,255,0.2);
    position:relative; z-index:10;
  }
  .app-icon {
    width:96px; height:96px;
    background: linear-gradient(135deg, #3ddc84, #0f9d58); /* 安卓绿 */
    border-radius:28px; margin:0 auto 20px;
    display:flex; align-items:center; justify-content:center;
    font-size:44px; font-weight:800; color:white;
    text-shadow:0 4px 12px rgba(0,0,0,0.5);
    box-shadow:0 15px 30px -6px rgba(61,220,132,0.5), 0 0 0 2px rgba(255,255,255,0.2) inset;
  }
  .app-icon span { transform: rotate(-2deg); }
  .app-name {
    font-size:30px; font-weight:700; text-align:center;
    color:#f0f9ff; letter-spacing:-0.5px;
    text-shadow:0 2px 10px rgba(0,200,255,0.4); margin-bottom:8px;
  }
  .app-sub {
    text-align:center; color:#9bb8d4; font-size:15px; margin-bottom:24px;
  }
  .file-info {
    display:flex; justify-content:space-between;
    background: rgba(0,0,0,0.3); border-radius:16px; padding:14px 18px;
    margin-bottom:12px; border:1px solid rgba(255,255,255,0.05);
    font-size:14px; color:#9bb8d4;
  }
  .file-info .val { color:#e0f2ff; font-weight:600; }
  .file-info.big-size .val { color:#7dd3fc; font-size:16px; }
  
  .download-btn {
    width:100%; background: linear-gradient(135deg, #0f9d58, #3ddc84);
    border:none; border-radius:60px; padding:18px 20px;
    font-size:18px; font-weight:700; color:#fff;
    display:flex; align-items:center; justify-content:center; gap:10px;
    cursor:pointer; box-shadow:0 20px 30px -8px rgba(15,157,88,0.7), 0 0 0 1px rgba(255,255,255,0.2) inset;
    transition: all 0.2s ease; letter-spacing: 0.5px; margin-top: 8px;
  }
  .download-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow:0 25px 35px -6px rgba(15,157,88,0.9); }
  .download-btn:active:not(:disabled) { transform: translateY(1px); }
  .download-btn:disabled {
    opacity: 0.7; cursor: wait;
    background: linear-gradient(135deg, #334155, #475569); box-shadow: none;
  }
  .status-msg {
    text-align:center; font-size:13px; color:#6b8aa8;
    min-height: 24px; margin-top: 14px; transition: all 0.2s; line-height: 1.5;
  }
  .status-msg.active { color:#7dd3fc; }
  .status-msg.done { color:#6ee7b7; font-weight: 600; }
  .note {
    text-align:center; font-size:11px; color:#4a6580; margin-top: 16px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="app-icon"><span>🤖</span></div>
  <div class="app-name">星链极速版</div>
  <div class="app-sub">安卓专属 · 官方安装包</div>

  <div class="file-info">
    <span>安装包</span>
    <span class="val">XingLian_v3.2.1.apk</span>
  </div>
  <div class="file-info big-size">
    <span>文件大小</span>
    <span class="val">128.6 MB</span>
  </div>

  <button class="download-btn" id="downloadBtn">
    <span>⬇</span> 立即下载 (128.6 MB)
  </button>

  <div class="status-msg" id="statusMsg">点击开始生成并下载 APK</div>
  <div class="note">极速安装 · 纯净无广告</div>
</div>

<script>
  (function() {
    const downloadBtn = document.getElementById('downloadBtn');
    const statusMsg = document.getElementById('statusMsg');

    // 目标：128.6 MB
    const TARGET_BYTES = Math.floor(128.6 * 1024 * 1024);
    const FILE_NAME = 'XingLian_v3.2.1.apk';

    // 十六进制转 Uint8Array 的辅助函数
    function hexToBytes(hex) {
      const bytes = [];
      for (let i = 0; i < hex.length; i += 2) {
        bytes.push(parseInt(hex.substr(i, 2), 16));
      }
      return new Uint8Array(bytes);
    }

    downloadBtn.addEventListener('click', async function() {
      if (downloadBtn.disabled) return;
      downloadBtn.disabled = true;
      downloadBtn.innerHTML = '<span>⏳</span> 正在构建 128.6MB 安装包...';
      statusMsg.textContent = '正在内存中拼装合法 APK 结构...';
      statusMsg.className = 'status-msg active';

      setTimeout(() => {
        try {
          // === 1. 构造一个最小合法的 ZIP (APK) 本地头 ===
          // 我们伪造一个名为 AndroidManifest.xml 的条目
          const fileName = new TextEncoder().encode('AndroidManifest.xml');
          const fileData = new TextEncoder().encode('<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.xinglian.speed"><application android:label="XingLian"/></manifest>');
          
          // Local File Header (30 bytes + filename)
          const header = new Uint8Array(30 + fileName.length);
          const view = new DataView(header.buffer);
          view.setUint32(0, 0x04034b50, true); // Local file header signature
          view.setUint16(4, 20, true);         // Version needed
          view.setUint16(6, 0, true);          // Flags
          view.setUint16(8, 0, true);          // Compression (0 = stored)
          view.setUint16(10, 0, true);         // Mod time
          view.setUint16(12, 0, true);         // Mod date
          view.setUint32(14, 0, true);         // CRC-32 (填 0，因为未签名，安卓可能在解析时跳过)
          view.setUint32(18, fileData.length, true); // Compressed size
          view.setUint32(22, fileData.length, true); // Uncompressed size
          view.setUint16(26, fileName.length, true); // File name length
          view.setUint16(28, 0, true);         // Extra field length
          header.set(fileName, 30);

          // === 2. 构造 ZIP 尾部中央目录 (Central Directory) ===
          const centralDir = new Uint8Array(46 + fileName.length);
          const cdView = new DataView(centralDir.buffer);
          cdView.setUint32(0, 0x02014b50, true); // Central directory header signature
          cdView.setUint16(4, 20, true);         // Version made by
          cdView.setUint16(6, 20, true);         // Version needed
          cdView.setUint16(8, 0, true);          // Flags
          cdView.setUint16(10, 0, true);         // Compression
          cdView.setUint16(12, 0, true);         // Mod time
          cdView.setUint16(14, 0, true);         // Mod date
          cdView.setUint32(16, 0, true);         // CRC-32
          cdView.setUint32(20, fileData.length, true); // Compressed size
          cdView.setUint32(24, fileData.length, true); // Uncompressed size
          cdView.setUint16(28, fileName.length, true); // File name length
          cdView.setUint16(30, 0, true);         // Extra field length
          cdView.setUint16(32, 0, true);         // File comment length
          cdView.setUint16(34, 0, true);         // Disk number start
          cdView.setUint16(36, 0, true);         // Internal attrs
          cdView.setUint32(38, 0, true);         // External attrs
          cdView.setUint32(42, 0, true);         // Relative offset of local header
          centralDir.set(fileName, 46);

          // === 3. 构造 ZIP 结束记录 (End of Central Directory) ===
          const eocd = new Uint8Array(22);
          const eocdView = new DataView(eocd.buffer);
          eocdView.setUint32(0, 0x06054b50, true); // EOCD signature
          eocdView.setUint16(4, 0, true);          // Disk number
          eocdView.setUint16(6, 0, true);          // Disk with CD
          eocdView.setUint16(8, 1, true);          // Entries on this disk
          eocdView.setUint16(10, 1, true);         // Total entries
          // 这里先占位，稍后填真实的 CD 大小和偏移
          
          // 计算各部分长度
          const localPartLength = header.length + fileData.length;
          const centralDirOffset = localPartLength; // 中间填充数据前的偏移
          
          // === 4. 创建填充数据 (让总大小达到 128.6MB) ===
          const paddingSize = TARGET_BYTES - localPartLength - centralDir.length - eocd.length;
          // 填充必须是空字节，才不会破坏 ZIP 结构（ZIP 容错性极高，允许在数据前填充）
          const padding = new Uint8Array(paddingSize);
          
          // 稍微往填充里写点东西，证明不是全0
          for (let i = 0; i < paddingSize; i += 1024 * 1024) {
             padding[i] = 0x58; // 'X'
          }

          // 修正 EOCD 里的中央目录偏移量（包含填充数据后的真实偏移）
          const realCentralDirOffset = localPartLength + paddingSize;
          eocdView.setUint32(12, centralDir.length, true); // CD size
          eocdView.setUint32(16, realCentralDirOffset, true); // CD offset

          // === 5. 将所有部分拼装为一个大 Blob ===
          const blob = new Blob([header, fileData, padding, centralDir, eocd], { type: 'application/vnd.android.package-archive' });

          // === 6. 触发下载 ===
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = FILE_NAME;
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();

          setTimeout(() => {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }, 1000);

          downloadBtn.innerHTML = '<span>✅</span> 已触发下载 (128.6 MB)';
          downloadBtn.disabled = false;
          statusMsg.textContent = '✅ 下载完成！点击文件即可尝试安装（提示未知来源是正常的）。';
          statusMsg.className = 'status-msg done';

        } catch (err) {
          console.error(err);
          downloadBtn.innerHTML = '<span>⬇</span> 重试下载 (128.6 MB)';
          downloadBtn.disabled = false;
          statusMsg.textContent = '❌ 生成失败：' + err.message;
          statusMsg.className = 'status-msg';
        }
      }, 100);
    });
  })();
</script>
</body>
</html>
