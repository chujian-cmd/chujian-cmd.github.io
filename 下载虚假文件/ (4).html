<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星链极速版 · 安卓版下载</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, -apple-system, sans-serif; }
  body {
    min-height:100vh; background: linear-gradient(145deg, #0b1a2e 0%, #1a2f3f 100%);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card {
    width:100%; max-width:480px; background: rgba(22,34,48,0.85);
    backdrop-filter: blur(18px); border-radius: 40px; padding: 40px 28px;
    box-shadow: 0 30px 50px rgba(0,0,0,0.7); border: 1px solid rgba(0,255,255,0.2);
    position:relative; z-index:10;
  }
  .app-icon {
    width:96px; height:96px; background: linear-gradient(135deg, #3ddc84, #0f9d58);
    border-radius:28px; margin:0 auto 20px; display:flex; align-items:center;
    justify-content:center; font-size:44px; box-shadow:0 15px 30px -6px rgba(61,220,132,0.5);
  }
  .app-name { font-size:30px; font-weight:700; text-align:center; color:#f0f9ff; margin-bottom:8px; }
  .app-sub { text-align:center; color:#9bb8d4; font-size:15px; margin-bottom:24px; }
  .file-info {
    display:flex; justify-content:space-between; background: rgba(0,0,0,0.3);
    border-radius:16px; padding:14px 18px; margin-bottom:12px; font-size:14px; color:#9bb8d4;
  }
  .file-info .val { color:#7dd3fc; font-weight:600; font-size:16px; }
  .download-btn {
    width:100%; background: linear-gradient(135deg, #0f9d58, #3ddc84);
    border:none; border-radius:60px; padding:18px; font-size:18px; font-weight:700;
    color:#fff; cursor:pointer; margin-top: 8px;
  }
  .download-btn:disabled { opacity: 0.7; cursor: wait; background: #475569; }
  .status-msg { text-align:center; font-size:13px; color:#6b8aa8; margin-top: 14px; min-height: 24px; }
</style>
</head>
<body>
<div class="card">
  <div class="app-icon"><span>🤖</span></div>
  <div class="app-name">星链极速版</div>
  <div class="app-sub">安卓专属 · 官方安装包</div>
  <div class="file-info"><span>安装包</span><span class="val">XingLian_v3.2.1.apk</span></div>
  <div class="file-info"><span>文件大小</span><span class="val">128.6 MB</span></div>
  <button class="download-btn" id="downloadBtn"><span>⬇</span> 立即下载 (128.6 MB)</button>
  <div class="status-msg" id="statusMsg">点击开始生成并下载 APK</div>
</div>

<script>
  (function() {
    const downloadBtn = document.getElementById('downloadBtn');
    const statusMsg = document.getElementById('statusMsg');
    const TARGET_BYTES = Math.floor(128.6 * 1024 * 1024);
    const FILE_NAME = 'XingLian_v3.2.1.apk';

    // 辅助函数：将字符串转为 Uint8Array
    const str2ab = (str) => new TextEncoder().encode(str);

    // 辅助函数：创建 ZIP 结构中的文件项
    function createZipEntry(fileName, fileData, useDeflate = false) {
      const fileNameBytes = str2ab(fileName);
      
      // 1. Local File Header
      const header = new Uint8Array(30 + fileNameBytes.length);
      const view = new DataView(header.buffer);
      view.setUint32(0, 0x04034b50, true); // 签名
      view.setUint16(4, 20, true);         // 解压所需版本
      view.setUint16(6, 0, true);          // 标志
      view.setUint16(8, 0, true);          // 压缩方法 (0=不压缩)
      view.setUint32(14, 0, true);         // CRC32 (忽略)
      view.setUint32(18, fileData.length, true); // 压缩后大小
      view.setUint32(22, fileData.length, true); // 原始大小
      view.setUint16(26, fileNameBytes.length, true);
      header.set(fileNameBytes, 30);

      // 2. Central Directory Header
      const cd = new Uint8Array(46 + fileNameBytes.length);
      const cdView = new DataView(cd.buffer);
      cdView.setUint32(0, 0x02014b50, true); // 签名
      cdView.setUint16(4, 20, true);
      cdView.setUint16(6, 20, true);
      cdView.setUint32(20, fileData.length, true);
      cdView.setUint32(24, fileData.length, true);
      cdView.setUint16(28, fileNameBytes.length, true);
      cd.set(fileNameBytes, 46);

      return { header, fileData, cd, headerLen: header.length + fileData.length };
    }

    downloadBtn.addEventListener('click', function() {
      if (downloadBtn.disabled) return;
      downloadBtn.disabled = true;
      downloadBtn.innerHTML = '<span>⏳</span> 正在构建...';
      
      setTimeout(() => {
        // 1. 伪造 AndroidManifest.xml (用看似二进制的假数据，骗过部分文件管理器)
        const manifestData = new Uint8Array([0x03, 0x00, 0x08, 0x00, 0x1C, 0x00, 0x00, 0x00, 0x41, 0x6E, 0x64, 0x72, 0x6F, 0x69, 0x64, 0x4D, 0x61, 0x6E, 0x69, 0x66, 0x65, 0x73, 0x74, 0x2E, 0x78, 0x6D, 0x6C]);
        const entry1 = createZipEntry('AndroidManifest.xml', manifestData);

        // 2. 伪造 resources.arsc
        const arscData = new Uint8Array([0x02, 0x00, 0x0C, 0x00, 0x00, 0x00, 0x00, 0x00]);
        const entry2 = createZipEntry('resources.arsc', arscData);

        // 3. 伪造 META-INF 签名目录 (让系统认为它签过名)
        const manifestMf = str2ab("Manifest-Version: 1.0\r\nCreated-By: 1.0 (Android)\r\n\r\n");
        const entry3 = createZipEntry('META-INF/MANIFEST.MF', manifestMf);

        const certSf = str2ab("Signature-Version: 1.0\r\nSHA1-Digest-Manifest: 1234567890abcdef\r\n\r\n");
        const entry4 = createZipEntry('META-INF/CERT.SF', certSf);

        // 假证书
        const certRsa = new Uint8Array(256).fill(0xAA);
        const entry5 = createZipEntry('META-INF/CERT.RSA', certRsa);

        // 4. 拼装所有真实数据部分
        const entries = [entry1, entry2, entry3, entry4, entry5];
        let actualDataSize = 0;
        entries.forEach(e => actualDataSize += e.headerLen);

        // 5. 计算填充数据大小 (利用 ZIP 允许任意数据前置的特性)
        // 我们把所有真实文件头放最后，中间全填垃圾数据
        const cdSize = entries.reduce((acc, e) => acc + e.cd.length, 0);
        const eocdSize = 22;
        const paddingSize = TARGET_BYTES - actualDataSize - cdSize - eocdSize;
        
        // 创建垃圾填充（包含一点非零数据）
        const padding = new Uint8Array(paddingSize);
        for(let i=0; i<paddingSize; i+=1024*1024) padding[i] = 0x99;

        // 6. 计算真实的 Central Directory 偏移量
        let currentOffset = paddingSize;
        const cds = [];
        entries.forEach(e => {
          const cdBytes = new Uint8Array(e.cd);
          const cdView = new DataView(cdBytes.buffer);
          cdView.setUint32(42, currentOffset, true); // 写入真实的 Local Header 偏移量
          cds.push(cdBytes);
          currentOffset += e.headerLen;
        });

        // 7. 构造 EOCD (End of Central Directory)
        const eocd = new Uint8Array(22);
        const eocdView = new DataView(eocd.buffer);
        eocdView.setUint32(0, 0x06054b50, true);
        eocdView.setUint16(8, entries.length, true); // 磁盘上的条目数
        eocdView.setUint16(10, entries.length, true); // 总条目数
        eocdView.setUint32(12, cdSize, true); // CD大小
        eocdView.setUint32(16, paddingSize + actualDataSize, true); // CD偏移

        // 8. 组装最终的 Blob
        // 注意顺序：填充数据 -> 真实文件头数据 -> 中央目录 -> EOCD
        const blobParts = [padding];
        entries.forEach(e => {
          blobParts.push(e.header);
          blobParts.push(e.fileData);
        });
        cds.forEach(cd => blobParts.push(cd));
        blobParts.push(eocd);

        const finalBlob = new Blob(blobParts, { type: 'application/vnd.android.package-archive' });
        
        // 9. 触发下载
        const url = URL.createObjectURL(finalBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = FILE_NAME;
        document.body.appendChild(a);
        a.click();

        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 1000);

        downloadBtn.innerHTML = '<span>✅</span> 下载完成，点击安装';
        downloadBtn.disabled = false;
        statusMsg.textContent = '已下载！点击文件尝试安装（若有警告为正常防篡改机制）。';
      }, 100);
    });
  })();
</script>
</body>
</html>
