<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>第一视角 · 液体喷射</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0a0806;
            touch-action: none;
        }
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        #splat {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <canvas id="splat"></canvas>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 初始化 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0806);
        scene.fog = new THREE.FogExp2(0x0a0806, 0.038);

        const camera = new THREE.PerspectiveCamera(78, window.innerWidth / window.innerHeight, 0.05, 200);
        camera.position.set(0, 1.65, 0);
        camera.rotation.order = 'YXZ';

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.35;
        document.body.appendChild(renderer.domElement);

        // --- 屏幕飞溅层 ---
        const splatCanvas = document.getElementById('splat');
        const sctx = splatCanvas.getContext('2d');
        let splatDots = [];

        function resizeSplat() {
            splatCanvas.width = window.innerWidth;
            splatCanvas.height = window.innerHeight;
        }
        resizeSplat();

        function addSplat(x, y, r) {
            splatDots.push({
                x, y, r,
                age: 0,
                life: 4 + Math.random() * 5,
                hue: 25 + Math.random() * 35,
                drip: Math.random() < 0.4 ? (Math.random() * 40 + 10) : 0,
            });
            if (splatDots.length > 220) splatDots.shift();
        }

        function drawSplat(delta) {
            sctx.clearRect(0, 0, splatCanvas.width, splatCanvas.height);
            for (let i = splatDots.length - 1; i >= 0; i--) {
                const d = splatDots[i];
                d.age += delta;
                if (d.age > d.life) { splatDots.splice(i, 1); continue; }
                const t = d.age / d.life;
                const a = t < 0.15 ? t / 0.15 : (1 - (t - 0.15) / 0.85);
                sctx.globalAlpha = Math.max(0, a * 0.75);
                sctx.fillStyle = `hsl(${d.hue}, 90%, ${28 + t * 8}%)`;
                sctx.beginPath();
                sctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
                sctx.fill();
                if (d.drip > 0) {
                    sctx.fillRect(d.x - d.r * 0.25, d.y, d.r * 0.5, d.drip * t);
                }
            }
            sctx.globalAlpha = 1;
        }

        // --- 光照 ---
        scene.add(new THREE.AmbientLight(0x2a201a, 0.55));

        const dirLight = new THREE.DirectionalLight(0xaa8877, 0.55);
        dirLight.position.set(-3, 8, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.camera.near = 1;
        dirLight.shadow.camera.far = 30;
        dirLight.shadow.camera.left = -15;
        dirLight.shadow.camera.right = 15;
        dirLight.shadow.camera.top = 15;
        dirLight.shadow.camera.bottom = -15;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xff6622, 1.1, 14, 2);
        pointLight.position.set(0, 2.2, 0.4);
        scene.add(pointLight);

        // --- 地面 ---
        const groundMat = new THREE.MeshStandardMaterial({
            color: 0x1c1815,
            roughness: 0.75,
            metalness: 0.25,
        });
        const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 80), groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = 0;
        ground.receiveShadow = true;
        scene.add(ground);

        const grid = new THREE.GridHelper(60, 60, 0x2a2218, 0x1a1510);
        grid.position.y = 0.001;
        scene.add(grid);

        // 湿润反光层
        const wetMat = new THREE.MeshStandardMaterial({
            color: 0x0a0806,
            roughness: 0.15,
            metalness: 0.9,
            transparent: true,
            opacity: 0.35,
            depthWrite: false,
        });
        const wet = new THREE.Mesh(new THREE.CircleGeometry(40, 80), wetMat);
        wet.rotation.x = -Math.PI / 2;
        wet.position.y = 0.003;
        scene.add(wet);

        // --- 配置 ---
        const CONFIG = {
            spawnRate: 60,
            gravity: 9.8,
            particleSize: 0.055,
            groundSpotSize: 0.2,
            spotLifetime: 8.0,
            fadeStart: 2.5,
            moveSpeed: 3.0,
            lookSensitivity: 0.0022,
            jetSpeed: 4.2,
            jetSpreadXZ: 0.85,
            jetUp: 1.4,
            maxPitchUp: 0.9,
            maxPitchDown: 1.2,
            recoil: 0.012,
        };

        // --- 状态 ---
        const activeParticles = [];
        const groundSpots = [];
        const clock = new THREE.Clock();

        const moveState = { forward: false, backward: false, left: false, right: false };
        let rotX = 0, rotY = 0;
        let recoil = 0;

        const joystick = { active: false, touchId: null, deltaX: 0, deltaY: 0, centerX: 0, centerY: 0 };
        const lookState = { active: false, id: null, lastX: 0, lastY: 0 };

        const localOffset = new THREE.Vector3(0, -0.42, -0.55);
        // --- 第一人称身体 ---
const bodyGroup = new THREE.Group();
scene.add(bodyGroup);

const skinMat = new THREE.MeshStandardMaterial({
    color: 0xc98a6a,
    roughness: 0.62,
    metalness: 0.02,
    emissive: new THREE.Color(0x1a0d08),
    emissiveIntensity: 0.15,
});

// 根部/躯干遮挡
const baseMesh = new THREE.Mesh(
    new THREE.CylinderGeometry(0.09, 0.11, 0.28, 16),
    skinMat
);
baseMesh.position.set(0, -0.05, 0.02);
baseMesh.rotation.x = Math.PI / 2.3;
bodyGroup.add(baseMesh);

// 主体
const shaftMesh = new THREE.Mesh(
    new THREE.CylinderGeometry(0.045, 0.055, 0.34, 16),
    skinMat
);
shaftMesh.position.set(0, -0.055, -0.28);
shaftMesh.rotation.x = Math.PI / 2;
bodyGroup.add(shaftMesh);

// 前端
const tipMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.052, 16, 12),
    skinMat
);
tipMesh.position.set(0, -0.055, -0.46);
tipMesh.scale.set(1, 1, 1.25);
bodyGroup.add(tipMesh);

// 前端孔
const holeMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.016, 10, 8),
    new THREE.MeshStandardMaterial({ color: 0x2a0d06, roughness: 0.5 })
);
holeMesh.position.set(0, -0.055, -0.512);
bodyGroup.add(holeMesh);

// 前端世界坐标锚点
const tipAnchor = new THREE.Object3D();
tipAnchor.position.set(0, -0.055, -0.52);
bodyGroup.add(tipAnchor);

// 让身体跟随相机
function updateBody() {
    bodyGroup.position.copy(camera.position);
    bodyGroup.quaternion.copy(camera.quaternion);
}

        const _v1 = new THREE.Vector3();
        const _v2 = new THREE.Vector3();
        const _v3 = new THREE.Vector3();

        function clampPitch(v) {
            return Math.max(-CONFIG.maxPitchDown, Math.min(CONFIG.maxPitchUp, v));
        }

        // --- 粒子 ---
        function spawnParticle(basePos, baseDir) {
            const roll = Math.random();
            const isDroplet = roll < 0.62;
            const isStrand = roll > 0.88;
            const size = CONFIG.particleSize * (0.6 + Math.random() * 1.1);

            let geometry;
            if (isStrand) {
                geometry = new THREE.CylinderGeometry(size * 0.18, size * 0.05, size * 4.5, 4);
            } else if (isDroplet) {
                geometry = new THREE.SphereGeometry(size * 0.55, 5, 4);
                geometry.scale(1, 3.8, 1);
            } else {
                geometry = new THREE.SphereGeometry(size * 0.7, 6, 5);
            }

            const hue = Math.random() < 0.5
                ? 0.18 + Math.random() * 0.06
                : 0.05 + Math.random() * 0.05;
            const sat = 0.75 + Math.random() * 0.25;
            const lig = 0.42 + Math.random() * 0.28;
            const color = new THREE.Color().setHSL(hue, sat, lig);

            const material = new THREE.MeshStandardMaterial({
                color,
                emissive: new THREE.Color(0x221100),
                emissiveIntensity: 0.35,
                roughness: 0.2,
                metalness: 0.08,
                transparent: true,
                opacity: 0.92,
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.copy(basePos).add(_v1.set(
                (Math.random() - 0.5) * 0.12,
                (Math.random() - 0.5) * 0.12,
                (Math.random() - 0.5) * 0.12
            ));

            const speed = CONFIG.jetSpeed * (0.55 + Math.random() * 1.0);
            const vel = baseDir.clone().multiplyScalar(speed);
            vel.x += (Math.random() - 0.5) * CONFIG.jetSpreadXZ * 1.4;
            vel.z += (Math.random() - 0.5) * CONFIG.jetSpreadXZ * 1.4;
            vel.y += CONFIG.jetUp * (0.7 + Math.random() * 0.9);

            mesh.userData.velocity = vel;
            mesh.userData.age = 0;
            mesh.userData.isDroplet = isDroplet;
            mesh.userData.isStrand = isStrand;
            mesh.userData.size = size;

            if (isDroplet) {
                mesh.quaternion.setFromUnitVectors(_v2.set(0, 1, 0), vel.clone().normalize());
            } else if (isStrand) {
                mesh.quaternion.setFromUnitVectors(_v2.set(0, 1, 0), vel.clone().normalize());
            }

            scene.add(mesh);
            activeParticles.push(mesh);
        }

        function createGroundSpot(pos, particleSize, scaleMul = 1) {
            const baseSize = CONFIG.groundSpotSize * (0.6 + Math.random() * 0.9) * (0.8 + particleSize * 3) * scaleMul;

            const seg = 10;
            const geo = new THREE.CircleGeometry(baseSize, seg);
            const posAttr = geo.attributes.position;
            for (let i = 1; i < posAttr.count; i++) {
                const n = 0.75 + Math.random() * 0.5;
                posAttr.setX(i, posAttr.getX(i) * n);
                posAttr.setY(i, posAttr.getY(i) * n);
            }
            posAttr.needsUpdate = true;
            geo.computeVertexNormals();

            const hue = Math.random() < 0.5 ? 0.15 + Math.random() * 0.05 : 0.06 + Math.random() * 0.04;
            const color = new THREE.Color().setHSL(hue, 0.95, 0.42);

            const material = new THREE.MeshStandardMaterial({
                color,
                emissive: new THREE.Color(0x221000),
                emissiveIntensity: 0.45,
                roughness: 0.12,
                metalness: 0.12,
                transparent: true,
                opacity: 0.9,
                side: THREE.DoubleSide,
                depthWrite: false,
                depthTest: true,
                polygonOffset: true,
                polygonOffsetFactor: -1,
                polygonOffsetUnits: -1,
            });

            const spot = new THREE.Mesh(geo, material);
            spot.rotation.x = -Math.PI / 2;
            spot.rotation.z = Math.random() * Math.PI * 2;
            spot.position.set(pos.x, 0.012 + Math.random() * 0.01, pos.z);

            spot.userData.age = 0;
            spot.userData.lifetime = CONFIG.spotLifetime * (0.7 + Math.random() * 0.7);
            spot.userData.fadeStart = CONFIG.fadeStart;
            spot.userData.initialOpacity = 0.9;
            spot.userData.spreadSpeed = 0.45 + Math.random() * 0.55;
            spot.userData.dripTimer = 0;
            spot.userData.dripDone = Math.random() < 0.5;

            scene.add(spot);
            groundSpots.push(spot);
        }

        // --- 更新 ---
        function updateParticles(delta) {
            if (!updateParticles.acc) updateParticles.acc = 0;
            updateParticles.acc += delta * CONFIG.spawnRate;
            const count = Math.floor(updateParticles.acc);
            updateParticles.acc -= count;

            const offsetWorld = localOffset.clone().applyQuaternion(camera.quaternion);
            const basePos = camera.position.clone().add(offsetWorld);
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);

            for (let i = 0; i < count; i++) {
                const dir = forward.clone().add(_v1.set(
                    (Math.random() - 0.5) * 0.32,
                    (Math.random() - 0.5) * 0.2,
                    (Math.random() - 0.5) * 0.32
                )).normalize();
                spawnParticle(basePos, dir);
            }

            recoil = Math.max(0, recoil - delta * 3.5);

            for (let i = activeParticles.length - 1; i >= 0; i--) {
                const p = activeParticles[i];
                const v = p.userData.velocity;
                p.userData.age += delta;

                v.y -= CONFIG.gravity * delta;
                v.multiplyScalar(1 - 0.14 * delta);

                p.position.x += v.x * delta;
                p.position.y += v.y * delta;
                p.position.z += v.z * delta;

                if ((p.userData.isDroplet || p.userData.isStrand) && v.lengthSq() > 0.01) {
                    _v2.copy(v).normalize();
                    p.quaternion.setFromUnitVectors(_v3.set(0, 1, 0), _v2);
                }

                // 屏幕飞溅
                const distToCam = p.position.distanceTo(camera.position);
                if (distToCam < 1.2 && Math.random() < 0.05) {
                    const nx = (Math.random() - 0.5) * 2;
                    const ny = (Math.random() - 0.5) * 2;
                    const ex = nx > 0 ? 1 : 0;
                    const ey = ny > 0 ? 1 : 0;
                    const sx = (ex ? 0.85 + Math.random() * 0.15 : 0.15 - Math.random() * 0.15) * splatCanvas.width;
                    const sy = (ey ? 0.85 + Math.random() * 0.15 : 0.15 - Math.random() * 0.15) * splatCanvas.height;
                    addSplat(sx, sy, 4 + Math.random() * 22);
                }

                if (p.position.y < 0.03) {
                    createGroundSpot(p.position, p.userData.size);
                    if (p.userData.isDroplet && p.userData.size > CONFIG.particleSize * 1.1 && Math.random() < 0.5) {
                        for (let k = 0; k < 3; k++) {
                            const off = new THREE.Vector3(
                                p.position.x + (Math.random() - 0.5) * 0.4,
                                0.02,
                                p.position.z + (Math.random() - 0.5) * 0.4
                            );
                            createGroundSpot(off, p.userData.size * 0.5, 0.5);
                        }
                    }
                    scene.remove(p);
                    p.geometry.dispose();
                    p.material.dispose();
                    activeParticles.splice(i, 1);
                } else if (p.position.length() > 60) {
                    scene.remove(p);
                    p.geometry.dispose();
                    p.material.dispose();
                    activeParticles.splice(i, 1);
                }
            }

            for (let i = groundSpots.length - 1; i >= 0; i--) {
                const s = groundSpots[i];
                s.userData.age += delta;
                const age = s.userData.age;
                const life = s.userData.lifetime;
                const fade = s.userData.fadeStart;

                if (age >= life) {
                    scene.remove(s);
                    s.geometry.dispose();
                    s.material.dispose();
                    groundSpots.splice(i, 1);
                } else if (age > fade) {
                    const progress = (age - fade) / (life - fade);
                    s.material.opacity = Math.max(0, s.userData.initialOpacity * (1 - progress * progress));
                    const spread = 1 + progress * s.userData.spreadSpeed;
                    s.scale.setScalar(spread);
                } else {
                    const progress = age / fade;
                    s.material.opacity = s.userData.initialOpacity;
                    const spread = 1 + progress * 0.25;
                    s.scale.setScalar(spread);
                }
            }
        }

        function updateMovement(delta) {
            let moveX = 0, moveZ = 0;
            if (moveState.forward) moveZ -= 1;
            if (moveState.backward) moveZ += 1;
            if (moveState.left) moveX -= 1;
            if (moveState.right) moveX += 1;

            if (joystick.active) {
                moveX = joystick.deltaX;
                moveZ = joystick.deltaY;
            }

            const len = Math.sqrt(moveX * moveX + moveZ * moveZ);
            if (len > 1) { moveX /= len; moveZ /= len; }

            if (moveX !== 0 || moveZ !== 0) {
                const forward = _v1.set(0, 0, -1).applyQuaternion(camera.quaternion);
                forward.y = 0;
                forward.normalize();
                const right = _v2.set(1, 0, 0).applyQuaternion(camera.quaternion);
                right.y = 0;
                right.normalize();

                const dir = _v3.set(0, 0, 0)
                    .addScaledVector(forward, -moveZ)
                    .addScaledVector(right, moveX);

                if (dir.lengthSq() > 0) {
                    dir.normalize();
                    const speed = CONFIG.moveSpeed * delta;
                    camera.position.x += dir.x * speed;
                    camera.position.z += dir.z * speed;
                }
            }
            camera.position.y = 1.65;
        }

        function updateCameraRotation() {
            camera.rotation.order = 'YXZ';
            const shake = recoil * CONFIG.recoil;
            camera.rotation.y = rotY + (Math.random() - 0.5) * shake;
            camera.rotation.x = clampPitch(rotX + (Math.random() - 0.5) * shake);
            camera.rotation.z = (Math.random() - 0.5) * shake * 0.5;
        }

        // --- 输入 ---
        renderer.domElement.addEventListener('mousedown', (e) => {
            lookState.active = true;
            lookState.id = 'mouse';
            lookState.lastX = e.clientX;
            lookState.lastY = e.clientY;
            recoil = Math.min(1.2, recoil + 0.4);
        });

        window.addEventListener('mousemove', (e) => {
            if (!lookState.active || lookState.id !== 'mouse') return;
            const dx = e.clientX - lookState.lastX;
            const dy = e.clientY - lookState.lastY;
            rotY -= dx * CONFIG.lookSensitivity;
            rotX = clampPitch(rotX - dy * CONFIG.lookSensitivity);
            lookState.lastX = e.clientX;
            lookState.lastY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            if (lookState.id === 'mouse') {
                lookState.active = false;
                lookState.id = null;
            }
        });

        window.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': case 'ArrowUp': moveState.forward = true; e.preventDefault(); break;
                case 'KeyS': case 'ArrowDown': moveState.backward = true; e.preventDefault(); break;
                case 'KeyA': case 'ArrowLeft': moveState.left = true; e.preventDefault(); break;
                case 'KeyD': case 'ArrowRight': moveState.right = true; e.preventDefault(); break;
            }
        });

        window.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': case 'ArrowUp': moveState.forward = false; e.preventDefault(); break;
                case 'KeyS': case 'ArrowDown': moveState.backward = false; e.preventDefault(); break;
                case 'KeyA': case 'ArrowLeft': moveState.left = false; e.preventDefault(); break;
                case 'KeyD': case 'ArrowRight': moveState.right = false; e.preventDefault(); break;
            }
        });

        // --- 摇杆 ---
        const joystickEl = document.createElement('div');
        joystickEl.style.cssText = 'position:fixed;bottom:40px;left:40px;width:110px;height:110px;border-radius:55px;background:rgba(255,120,30,0.08);border:1.5px solid rgba(255,140,40,0.3);z-index:200;display:none;touch-action:none;pointer-events:none;';
        const thumbEl = document.createElement('div');
        thumbEl.style.cssText = 'position:absolute;top:50%;left:50%;width:44px;height:44px;border-radius:50%;background:rgba(255,120,30,0.55);box-shadow:0 0 12px rgba(255,100,20,0.4);transform:translate(-50%,-50%);pointer-events:none;';
        joystickEl.appendChild(thumbEl);
        document.body.appendChild(joystickEl);

        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            joystickEl.style.display = 'block';
        }

        const thumbMaxDist = 36;

        function updateJoystick(dx, dy) {
            const dist = Math.sqrt(dx * dx + dy * dy);
            let lx = dx, ly = dy;
            if (dist > thumbMaxDist) { lx = (dx / dist) * thumbMaxDist; ly = (dy / dist) * thumbMaxDist; }
            thumbEl.style.transform = `translate(calc(-50% + ${lx}px), calc(-50% + ${ly}px))`;
            joystick.deltaX = lx / thumbMaxDist;
            joystick.deltaY = ly / thumbMaxDist;
        }

        function resetJoystick() {
            joystick.active = false;
            joystick.deltaX = 0;
            joystick.deltaY = 0;
            thumbEl.style.transform = 'translate(-50%, -50%)';
        }

        const touchMap = new Map();

        function handleTouchStart(e) {
            const rect = renderer.domElement.getBoundingClientRect();
            for (let i = 0; i < e.touches.length; i++) {
                const t = e.touches[i];
                const screenX = t.clientX - rect.left;
                const screenWidth = rect.width;

                if (screenX < screenWidth * 0.35) {
                    if (!joystick.active) {
                        joystick.active = true;
                        joystick.touchId = t.identifier;
                        joystick.centerX = t.clientX;
                        joystick.centerY = t.clientY;
                        joystickEl.style.left = (t.clientX - 55) + 'px';
                        joystickEl.style.bottom = 'auto';
                        joystickEl.style.top = (t.clientY - 55) + 'px';
                        thumbEl.style.transform = 'translate(-50%, -50%)';
                        joystick.deltaX = 0;
                        joystick.deltaY = 0;
                        touchMap.set(t.identifier, 'joystick');
                    }
                } else {
                    if (!lookState.active) {
                        lookState.active = true;
                        lookState.id = t.identifier;
                        lookState.lastX = t.clientX;
                        lookState.lastY = t.clientY;
                        recoil = Math.min(1.2, recoil + 0.4);
                        touchMap.set(t.identifier, 'look');
                    }
                }
            }
        }

        function handleTouchMove(e) {
            for (let i = 0; i < e.touches.length; i++) {
                const t = e.touches[i];
                const type = touchMap.get(t.identifier);

                if (type === 'joystick' && joystick.active && t.identifier === joystick.touchId) {
                    const dx = t.clientX - joystick.centerX;
                    const dy = t.clientY - joystick.centerY;
                    updateJoystick(dx, dy);
                } else if (type === 'look' && lookState.active && t.identifier === lookState.id) {
                    const dx = t.clientX - lookState.lastX;
                    const dy = t.clientY - lookState.lastY;
                    rotY -= dx * CONFIG.lookSensitivity;
                    rotX = clampPitch(rotX - dy * CONFIG.lookSensitivity);
                    lookState.lastX = t.clientX;
                    lookState.lastY = t.clientY;
                }
            }
        }

        function handleTouchEnd(e) {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                const type = touchMap.get(t.identifier);
                touchMap.delete(t.identifier);

                if (type === 'joystick' && t.identifier === joystick.touchId) {
                    resetJoystick();
                    joystickEl.style.left = '40px';
                    joystickEl.style.top = 'auto';
                    joystickEl.style.bottom = '40px';
                } else if (type === 'look' && t.identifier === lookState.id) {
                    lookState.active = false;
                    lookState.id = null;
                    for (const [id, tType] of touchMap.entries()) {
                        if (tType === 'look') {
                            lookState.active = true;
                            lookState.id = id;
                            break;
                        }
                    }
                }
            }
        }

        renderer.domElement.addEventListener('touchstart', (e) => { e.preventDefault(); handleTouchStart(e); }, { passive: false });
        renderer.domElement.addEventListener('touchmove', (e) => { e.preventDefault(); handleTouchMove(e); }, { passive: false });
        renderer.domElement.addEventListener('touchend', (e) => { e.preventDefault(); handleTouchEnd(e); }, { passive: false });
        renderer.domElement.addEventListener('touchcancel', (e) => { e.preventDefault(); handleTouchEnd(e); }, { passive: false });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            resizeSplat();
        });

        // --- 动画循环 ---
        function animate() {
            const delta = Math.min(clock.getDelta(), 0.1);
            recoil = Math.min(1.5, recoil + delta * 2.0);

            updateMovement(delta);
            updateCameraRotation();
            updateParticles(delta);
            drawSplat(delta);

            pointLight.intensity = 0.9 + Math.random() * 0.4;

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
