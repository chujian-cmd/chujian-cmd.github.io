<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>恶俗第一视角 · 黄色液体喷射</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        #info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 200, 0.8);
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            z-index: 100;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 0, 0.3);
        }
        #warning {
            position: fixed;
            top: 20px;
            right: 20px;
            color: rgba(255, 200, 0, 0.7);
            background: rgba(40, 20, 0, 0.6);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            border: 1px solid #ffaa00;
            pointer-events: none;
            z-index: 100;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="info">🖱️ 鼠标移动视角 | 液体落地后会渐渐消失</div>
    <div id="warning">⚠️ 恶俗警告 · 黄色液体喷射</div>

    <!-- 引入 Three.js 核心库和扩展 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- 初始化场景、相机、渲染器 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a); // 深色背景，突出黄色

        // 第一视角：相机放在人的头部位置（约1.6m高），朝向正前方（略向下倾斜看到大腿和喷射）
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 1000);
        camera.position.set(0, 1.6, 0.2); // 稍微靠后一点，让视野包含大腿根部
        camera.lookAt(0, 0.8, -1.0); // 看向前下方，刚好能看到自己“喷射”区域

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // 开启阴影，让液体落地的阴影更真实（虽然我们不用复杂光照）
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 为了更像第一视角，禁用鼠标旋转控件，但我们需要鼠标移动来稍微转动视角？不，为了简单，我们用鼠标移动控制一个视线偏移的“伪”第一人称。
        // 但是为了不破坏第一视角的“喷射”固定位置，我们固定相机看向前方，但允许鼠标轻微移动视角（类似头部转动）。
        // 我们不用OrbitControls，而是用鼠标移动来稍微旋转相机，但保持位置不变。
        // 不过为了体验，我们保留鼠标移动来稍微改变视线方向，让用户有沉浸感，但不会影响喷射位置（因为喷射跟随相机？不，喷射是在世界坐标固定的大腿位置，但大腿是我们自己的一部分，应该跟随相机移动？但第一视角下大腿应该在视野下方，简单起见我们不建模大腿，只从相机下方喷射液体，模拟从“自己”身上喷出）。
        // 更好的方法：喷射点相对于相机固定，这样永远从视野下方喷出。但落地后在地面世界坐标系中固定并逐渐消失。
        
        // 所以：我们不需要复杂的相机旋转。让相机固定，但允许鼠标稍微调整视角？或者干脆固定，让用户感受第一视角的喷射。
        // 为了增加可玩性，我们用一个简单的方式：鼠标移动可以轻微旋转头部（即相机旋转），但视野中喷射点仍然在相机下方，这样看起来像是从自己身上喷出。
        // 这里我们采用固定相机，但鼠标移动会稍微改变相机的rotation，最大角度很小。

        // 但由于我们想保持喷射点相对于视野在下方（大腿中间），我们可以在每帧将喷射点设置在相机位置下方一点，并随着相机旋转而旋转？那样复杂。
        // 简化：我们不做相机旋转，而是固定相机，用户只能看，不能转视角。但标题说“第一视角”，通常可以稍微转头。为了简单且不破坏体验，我们保持相机固定，因为主要焦点是喷射效果。
        // 但为了不那么死板，我们允许鼠标在画面上移动时稍微旋转摄像机（y轴±0.3弧度，x轴±0.2），这样看起来像轻微转头，喷射点还是从视野下方喷出？那样喷射点需要相对于相机固定。
        // 决定：喷射点相对于相机固定！也就是每帧计算一个位置在相机正下方偏前一点的世界坐标，这样无论相机怎么转，喷射总是从视野下方出现。
        // 但液体落地后的斑点是在世界坐标系中固定的，且会逐渐消失。
        // 这样实现更简单，效果也更符合“自己喷射”的感觉。
        
        // 因此：我们不用OrbitControls，改用自定义的鼠标移动旋转相机，但限制角度，同时喷射点相对于相机计算。

        // 先添加基础光照
        // 环境光
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        // 主光源 - 产生阴影和立体感
        const dirLight = new THREE.DirectionalLight(0xffeedd, 1);
        dirLight.position.set(2, 5, 3);
        dirLight.castShadow = true;
        dirLight.receiveShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        const d = 10;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        dirLight.shadow.camera.near = 1;
        dirLight.shadow.camera.far = 15;
        scene.add(dirLight);

        // 补充一个暖色点光源，让黄色液体更鲜艳
        const pointLight = new THREE.PointLight(0xffaa00, 0.5, 20);
        pointLight.position.set(0, 2, 1);
        scene.add(pointLight);

        // 添加一个简单的地面（灰色，有点粗糙感）
        const groundGeometry = new THREE.CircleGeometry(15, 32);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x3a3a3a, 
            roughness: 0.8, 
            metalness: 0.2,
            side: THREE.DoubleSide
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01; // 稍微低于0，避免与液体斑点z-fighting
        ground.receiveShadow = true;
        scene.add(ground);

        // 添加一些网格辅助线，让地面有参考（可选），为了美观可以加一点
        const gridHelper = new THREE.GridHelper(20, 20, 0x666666, 0x444444);
        gridHelper.position.y = 0;
        scene.add(gridHelper);

        // 添加一些微弱的雾效，让远处淡出
        scene.fog = new THREE.FogExp2(0x1a1a1a, 0.05);

        // --- 黄色液体喷射系统 ---
        // 思路：每一帧从喷射点（相对于相机下方）生成少量粒子（小立方体或球体），它们受重力影响下落，落地后成为地面上的黄色斑点，并随时间渐渐消失（透明度降低，最后移除）。
        // 使用两个粒子池：空中的飞溅粒子 + 地面上的斑点。
        
        // 由于需要“渐渐消失”，地面斑点用带有透明材质的平面或小圆片，并逐渐降低不透明度直到消失。
        
        // 为了性能，我们使用对象池管理，但简化版可以直接创建和销毁，数量不多的话没问题。
        
        // 参数配置
        const config = {
            spawnRate: 30,          // 每秒生成粒子数
            particleSpeedY: 2.5,    // 初始向上速度
            particleSpeedXZ: 0.8,   // 水平散开速度
            gravity: 9.8,           // 重力加速度
            particleSize: 0.06,     // 粒子大小（半径）
            groundSpotSize: 0.18,   // 地面斑点大小
            spotLifetime: 4.0,      // 斑点存活时间（秒）
            fadeStart: 1.0,         // 开始淡出的时间（从落地算起，秒）
            color: 0xffdd44,        // 亮黄色
            colorVariation: 0.2     // 颜色变化范围
        };

        // 喷射点相对于相机的位置：在相机坐标系下，坐标 (0, -0.5, -0.8) 大致在大腿中间偏下前方
        // 因为相机朝向是看向前下方，我们计算世界坐标时用相机矩阵转换。
        // 但我们希望喷射总是从“自己”身上朝前下方喷出，所以喷射点相对于相机固定。
        // 实际上我们直接每帧根据相机位置和旋转计算喷射点世界坐标。
        
        // 存储活跃的粒子（空中的）
        const activeParticles = [];
        // 存储地面上的斑点
        const groundSpots = [];

        // 用于记录时间
        const clock = new THREE.Clock();

        // 鼠标旋转变量 (限制范围)
        let mouseX = 0;
        let mouseY = 0;
        let targetRotX = 0;
        let targetRotY = 0;
        const maxRotX = 0.3; // 上下旋转限制
        const maxRotY = 0.5; // 左右旋转限制
        
        // 监听鼠标移动
        window.addEventListener('mousemove', (event) => {
            // 将鼠标位置映射到 -1 到 1
            const nx = (event.clientX / window.innerWidth) * 2 - 1;
            const ny = -(event.clientY / window.innerHeight) * 2 + 1;
            // 目标旋转角度
            targetRotY = nx * maxRotY;
            targetRotX = ny * maxRotX; // 注意上下和鼠标Y相反
        });

        // 相机初始旋转，稍向下看
        camera.rotation.order = 'YXZ';
        camera.rotation.x = -0.15; // 稍微向下看
        camera.rotation.y = 0;
        camera.rotation.z = 0;

        // 为了方便计算喷射点，创建一个辅助对象，并将其作为相机的子物体？不行，因为我们需要在世界坐标中生成粒子，但方向需要根据相机。
        // 我们每帧计算喷射点的世界位置：从相机位置沿相机局部坐标(0, -0.5, -0.8)方向。
        // 使用局部向量转换到世界方向，再加上相机位置。
        
        // 局部偏移向量（在相机空间）：x=0, y=-0.45, z=-0.7  (注意相机看向-Z，所以-z是前方)
        // 这样点在相机下方偏前。
        const localOffset = new THREE.Vector3(0, -0.45, -0.7);

        // 生成一个液体粒子（空中的）
        function spawnParticle(basePos, baseDir) {
            // 粒子大小随机变化
            const size = config.particleSize * (0.7 + Math.random() * 0.6);
            const geometry = new THREE.SphereGeometry(size, 6, 6);
            // 颜色在黄色范围内变化
            const hue = 0.12 + (Math.random() - 0.5) * 0.1; // 黄色大约在0.12-0.15
            const color = new THREE.Color().setHSL(hue, 1, 0.55 + Math.random() * 0.2);
            
            const material = new THREE.MeshStandardMaterial({
                color: color,
                emissive: new THREE.Color(0x553300),
                roughness: 0.3,
                metalness: 0.1,
                transparent: true,
                opacity: 0.95
            });
            
            const sphere = new THREE.Mesh(geometry, material);
            sphere.castShadow = true;
            sphere.receiveShadow = false;
            
            // 初始位置：在喷射点附近加一点随机偏移
            const pos = basePos.clone().add(
                new THREE.Vector3(
                    (Math.random() - 0.5) * 0.1,
                    (Math.random() - 0.5) * 0.1,
                    (Math.random() - 0.5) * 0.1
                )
            );
            sphere.position.copy(pos);
            
            // 速度：主要向相机前方（即baseDir）加上随机水平散开和向上速度
            const forwardDir = baseDir.clone().normalize(); // 相机的前方世界方向（注意相机看向-Z，所以baseDir应该是朝前）
            // 但我们希望液体向前下方喷出，所以速度方向应该包含相机的向下分量？实际上相机是向下看的，所以baseDir会稍微向下。
            // 但我们想模拟从下往上喷？标题说“大腿中间不停喷射出某种黄色液体”，通常可能是向前下方喷出。
            // 为了视觉效果，我们让速度主要沿着相机的前方（包括向下），再加上一个向上的随机分量？不，为了看起来像喷射，我们应该让粒子沿着前方喷出，并稍微向上散开？不，如果是喷射，应该是向前下方喷出。
            // 这里我们让速度 = forwardDir * 速度值 + 随机散开 + 向上速度。
            // 由于forwardDir是相机前方向下看，所以速度会朝下。但为了有“喷”的感觉，加一点向上速度来对抗重力，让粒子飞一会儿。
            
            const speedBase = 2.5 + Math.random() * 1.5;
            const vel = forwardDir.clone().multiplyScalar(speedBase);
            // 添加随机散开
            vel.x += (Math.random() - 0.5) * config.particleSpeedXZ;
            vel.z += (Math.random() - 0.5) * config.particleSpeedXZ;
            // 添加一些向上的分量，让粒子先上升一点再下落，看起来更像喷射
            vel.y += 1.5 + Math.random() * 1.0;
            
            // 存储速度属性
            sphere.userData.velocity = vel;
            sphere.userData.age = 0;
            sphere.userData.isGround = false;
            
            scene.add(sphere);
            activeParticles.push(sphere);
            
            return sphere;
        }

        // 创建一个地面斑点
        function createGroundSpot(pos, sizeScale = 1.0) {
            const size = config.groundSpotSize * (0.7 + Math.random() * 0.6) * sizeScale;
            // 使用圆平面，旋转使其平躺
            const geometry = new THREE.CircleGeometry(size, 8);
            const hue = 0.12 + (Math.random() - 0.5) * 0.06;
            const color = new THREE.Color().setHSL(hue, 1, 0.55);
            const material = new THREE.MeshStandardMaterial({
                color: color,
                emissive: new THREE.Color(0x442200),
                roughness: 0.6,
                metalness: 0.1,
                transparent: true,
                opacity: 0.9,
                side: THREE.DoubleSide
            });
            const spot = new THREE.Mesh(geometry, material);
            spot.rotation.x = -Math.PI / 2;
            spot.position.copy(pos);
            spot.position.y = 0.005; // 稍微高出地面一点避免闪烁
            spot.receiveShadow = true;
            spot.castShadow = false;
            
            // 存储数据用于淡出
            spot.userData.age = 0;
            spot.userData.lifetime = config.spotLifetime * (0.8 + Math.random() * 0.6);
            spot.userData.fadeStart = config.fadeStart;
            spot.userData.initialOpacity = 0.9;
            
            scene.add(spot);
            groundSpots.push(spot);
            
            return spot;
        }

        // 更新粒子系统
        function updateParticles(deltaTime, camera) {
            // 1. 生成新粒子
            // 频率控制：基于时间累积
            // 使用一个简单的累积器
            if (!updateParticles.spawnAccum) updateParticles.spawnAccum = 0;
            updateParticles.spawnAccum += deltaTime * config.spawnRate;
            const spawnCount = Math.floor(updateParticles.spawnAccum);
            updateParticles.spawnAccum -= spawnCount;
            
            // 计算喷射点的世界位置和方向
            // 喷射点 = 相机位置 + 旋转后的localOffset
            const offsetWorld = localOffset.clone().applyQuaternion(camera.quaternion);
            const basePos = camera.position.clone().add(offsetWorld);
            
            // 方向：从相机位置指向喷射点并延伸？实际上我们希望喷射方向是相机的前方（-Z轴方向旋转后的向量）
            // 但为了看起来从喷射点向前喷，使用相机的forward向量
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            
            // 生成粒子
            for (let i = 0; i < spawnCount; i++) {
                // 每次生成时，方向稍微随机变化，不要完全一致
                const dirVariation = forward.clone().add(
                    new THREE.Vector3(
                        (Math.random() - 0.5) * 0.3,
                        (Math.random() - 0.5) * 0.3,
                        (Math.random() - 0.5) * 0.3
                    )
                ).normalize();
                spawnParticle(basePos, dirVariation);
            }
            
            // 2. 更新空中的粒子
            for (let i = activeParticles.length - 1; i >= 0; i--) {
                const p = activeParticles[i];
                const v = p.userData.velocity;
                const age = p.userData.age + deltaTime;
                p.userData.age = age;
                
                // 重力
                v.y -= config.gravity * deltaTime;
                
                // 更新位置
                p.position.x += v.x * deltaTime;
                p.position.y += v.y * deltaTime;
                p.position.z += v.z * deltaTime;
                
                // 旋转粒子一点点（可选）
                p.rotation.x += deltaTime * 2;
                p.rotation.y += deltaTime * 3;
                
                // 检查是否落地（y坐标小于粒子半径或低于地面）
                if (p.position.y < 0.02) {
                    // 落地：创建地面斑点，移除空中粒子
                    // 把粒子位置稍微调整到地面高度
                    const spotPos = p.position.clone();
                    spotPos.y = 0.005;
                    
                    // 根据粒子的大小和速度决定斑点大小（速度越快溅得越大，但这里用大小代替）
                    const sizeScale = 0.8 + Math.random() * 0.8;
                    createGroundSpot(spotPos, sizeScale);
                    
                    // 从场景移除
                    scene.remove(p);
                    // 清理几何体和材质
                    p.geometry.dispose();
                    p.material.dispose();
                    activeParticles.splice(i, 1);
                } else {
                    // 存活但可能超出范围（太远或太高），如果太远或者太高就移除（可选）
                    if (p.position.length() > 30) {
                        scene.remove(p);
                        p.geometry.dispose();
                        p.material.dispose();
                        activeParticles.splice(i, 1);
                    }
                }
            }
            
            // 3. 更新地面斑点：淡出和消失
            for (let i = groundSpots.length - 1; i >= 0; i--) {
                const spot = groundSpots[i];
                const age = spot.userData.age + deltaTime;
                spot.userData.age = age;
                
                const lifetime = spot.userData.lifetime;
                const fadeStart = spot.userData.fadeStart;
                
                if (age >= lifetime) {
                    // 完全消失，移除
                    scene.remove(spot);
                    spot.geometry.dispose();
                    spot.material.dispose();
                    groundSpots.splice(i, 1);
                } else if (age > fadeStart) {
                    // 淡出
                    const fadeProgress = (age - fadeStart) / (lifetime - fadeStart);
                    const opacity = spot.userData.initialOpacity * (1 - fadeProgress);
                    spot.material.opacity = Math.max(0, opacity);
                    // 同时可以稍微缩小
                    const scale = 1 - fadeProgress * 0.3;
                    spot.scale.set(scale, scale, scale);
                } else {
                    // 保持不透明度
                    spot.material.opacity = spot.userData.initialOpacity;
                }
            }
        }

        // --- 鼠标控制相机轻微旋转 (保持第一视角但可以环顾) ---
        function updateCameraRotation() {
            // 平滑插值
            const lerpFactor = 0.08;
            camera.rotation.y += (targetRotY - camera.rotation.y) * lerpFactor;
            camera.rotation.x += (targetRotX - camera.rotation.x) * lerpFactor;
            // 限制范围
            camera.rotation.x = Math.max(-0.4, Math.min(0.3, camera.rotation.x));
            camera.rotation.y = Math.max(-0.8, Math.min(0.8, camera.rotation.y));
        }

        // --- 简单的大腿/身体暗示？不，为了保持恶俗但不过度，我们只看到喷射。可以考虑加两个模糊的腿模型？但为了简洁，不加了。
        // 但是为了第一视角的真实感，可以在视野下方加一点半透明的“腿”的示意？不加了，以免太复杂。
        // 为了更有“喷射”的视觉冲击，可以在喷射点加一个发光粒子或者小喷泉效果？已经通过粒子实现了。

        // --- 动画循环 ---
        function animate() {
            const delta = Math.min(clock.getDelta(), 0.1); // 限制最大增量，防止卡顿时爆炸
            
            // 更新相机旋转（基于鼠标）
            updateCameraRotation();
            
            // 更新粒子系统
            updateParticles(delta, camera);
            
            // 渲染
            renderer.render(scene, camera);
            
            requestAnimationFrame(animate);
        }

        // 启动动画
        animate();

        // --- 窗口大小自适应 ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 为了更恶俗一点，可以加一个很轻微的声音？不，不加音频，保持简洁。

        // 启动后输出提示
        console.log('恶俗第一视角已启动 — 黄色液体喷射中...');
    </script>
</body>
</html>
