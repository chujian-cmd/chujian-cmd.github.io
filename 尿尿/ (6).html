<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>恶俗第一视角 · 黄色液体喷射</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a1a;
            touch-action: none;
        }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 初始化 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 1000);
        camera.position.set(0, 1.6, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- 光照 ---
        scene.add(new THREE.AmbientLight(0x404060));

        const dirLight = new THREE.DirectionalLight(0xffeedd, 1);
        dirLight.position.set(2, 5, 3);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xffaa00, 0.5, 20);
        pointLight.position.set(0, 2, 1);
        scene.add(pointLight);

        // --- 地面 ---
        const ground = new THREE.Mesh(
            new THREE.CircleGeometry(30, 64),
            new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.8, metalness: 0.2, side: THREE.DoubleSide })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        scene.add(ground);

        scene.add(new THREE.GridHelper(40, 40, 0x555555, 0x333333));
        scene.fog = new THREE.FogExp2(0x1a1a1a, 0.03);

        // --- 参数 ---
        const CONFIG = {
            spawnRate: 35,
            particleSpeedXZ: 0.8,
            gravity: 9.8,
            particleSize: 0.06,
            groundSpotSize: 0.18,
            spotLifetime: 4.0,
            fadeStart: 1.0,
            moveSpeed: 3.0,
            lookSensitivity: 0.002
        };

        // --- 状态 ---
        const activeParticles = [];
        const groundSpots = [];
        const clock = new THREE.Clock();

        const moveState = { forward: false, backward: false, left: false, right: false };

        // 视角旋转状态 —— 无限制
        let rotX = 0;
        let rotY = 0;

        // 摇杆状态
        const joystick = { active: false, touchId: null, centerX: 0, centerY: 0, deltaX: 0, deltaY: 0 };

        // 视角拖拽状态
        const lookState = { active: false, id: null, lastX: 0, lastY: 0 };

        const localOffset = new THREE.Vector3(0, -0.45, -0.7);

        // --- 粒子 ---
        function spawnParticle(basePos, baseDir) {
            const size = CONFIG.particleSize * (0.7 + Math.random() * 0.6);
            const geometry = new THREE.SphereGeometry(size, 6, 6);
            const hue = 0.12 + (Math.random() - 0.5) * 0.1;
            const color = new THREE.Color().setHSL(hue, 1, 0.55 + Math.random() * 0.2);
            const material = new THREE.MeshStandardMaterial({
                color, emissive: new THREE.Color(0x553300), roughness: 0.3, metalness: 0.1, transparent: true, opacity: 0.95
            });
            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.copy(basePos).add(new THREE.Vector3(
                (Math.random() - 0.5) * 0.1, (Math.random() - 0.5) * 0.1, (Math.random() - 0.5) * 0.1
            ));
            const vel = baseDir.clone().normalize().multiplyScalar(2.5 + Math.random() * 1.5);
            vel.x += (Math.random() - 0.5) * CONFIG.particleSpeedXZ;
            vel.z += (Math.random() - 0.5) * CONFIG.particleSpeedXZ;
            vel.y += 1.5 + Math.random() * 1.0;
            sphere.userData.velocity = vel;
            sphere.userData.age = 0;
            scene.add(sphere);
            activeParticles.push(sphere);
        }

        function createGroundSpot(pos) {
            const size = CONFIG.groundSpotSize * (0.7 + Math.random() * 0.6);
            const geometry = new THREE.CircleGeometry(size, 8);
            const hue = 0.12 + (Math.random() - 0.5) * 0.06;
            const color = new THREE.Color().setHSL(hue, 1, 0.55);
            const material = new THREE.MeshStandardMaterial({
                color, emissive: new THREE.Color(0x442200), roughness: 0.6, metalness: 0.1,
                transparent: true, opacity: 0.9, side: THREE.DoubleSide,
                depthWrite: false, depthTest: true, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1
            });
            const spot = new THREE.Mesh(geometry, material);
            spot.rotation.x = -Math.PI / 2;
            spot.position.set(pos.x, 0.02 + Math.random() * 0.01, pos.z);
            spot.userData.age = 0;
            spot.userData.lifetime = CONFIG.spotLifetime * (0.8 + Math.random() * 0.6);
            spot.userData.fadeStart = CONFIG.fadeStart;
            spot.userData.initialOpacity = 0.9;
            scene.add(spot);
            groundSpots.push(spot);
        }

        // --- 更新 ---
        function updateParticles(delta) {
            if (!updateParticles.acc) updateParticles.acc = 0;
            updateParticles.acc += delta * CONFIG.spawnRate;
            const count = Math.floor(updateParticles.acc);
            updateParticles.acc -= count;

            const offsetWorld = localOffset.clone().applyQuaternion(camera.quaternion);
            const basePos = camera.position.clone().add(offsetWorld);
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);

            for (let i = 0; i < count; i++) {
                const dir = forward.clone().add(new THREE.Vector3(
                    (Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.3
                )).normalize();
                spawnParticle(basePos, dir);
            }

            for (let i = activeParticles.length - 1; i >= 0; i--) {
                const p = activeParticles[i];
                const v = p.userData.velocity;
                p.userData.age += delta;
                v.y -= CONFIG.gravity * delta;
                p.position.x += v.x * delta;
                p.position.y += v.y * delta;
                p.position.z += v.z * delta;

                if (p.position.y < 0.02) {
                    createGroundSpot(p.position);
                    scene.remove(p);
                    p.geometry.dispose();
                    p.material.dispose();
                    activeParticles.splice(i, 1);
                } else if (p.position.length() > 50) {
                    scene.remove(p);
                    p.geometry.dispose();
                    p.material.dispose();
                    activeParticles.splice(i, 1);
                }
            }

            for (let i = groundSpots.length - 1; i >= 0; i--) {
                const s = groundSpots[i];
                s.userData.age += delta;
                const life = s.userData.lifetime;
                const fade = s.userData.fadeStart;

                if (s.userData.age >= life) {
                    scene.remove(s);
                    s.geometry.dispose();
                    s.material.dispose();
                    groundSpots.splice(i, 1);
                } else if (s.userData.age > fade) {
                    const progress = (s.userData.age - fade) / (life - fade);
                    s.material.opacity = Math.max(0, s.userData.initialOpacity * (1 - progress));
                    s.scale.setScalar(1 - progress * 0.3);
                } else {
                    s.material.opacity = s.userData.initialOpacity;
                }
            }
        }

        function updateMovement(delta) {
            let moveX = 0, moveZ = 0;
            if (moveState.forward) moveZ -= 1;
            if (moveState.backward) moveZ += 1;
            if (moveState.left) moveX -= 1;
            if (moveState.right) moveX += 1;

            if (joystick.active) {
                moveX = joystick.deltaX;
                moveZ = joystick.deltaY;
            }

            const len = Math.sqrt(moveX * moveX + moveZ * moveZ);
            if (len > 1) { moveX /= len; moveZ /= len; }

            if (moveX !== 0 || moveZ !== 0) {
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                forward.y = 0; forward.normalize();
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                right.y = 0; right.normalize();

                const dir = new THREE.Vector3().addScaledVector(forward, -moveZ).addScaledVector(right, moveX);
                if (dir.length() > 0) {
                    dir.normalize();
                    const speed = CONFIG.moveSpeed * delta;
                    camera.position.x += dir.x * speed;
                    camera.position.z += dir.z * speed;
                }
            }
            camera.position.y = 1.6;
        }

        function updateCameraRotation() {
            camera.rotation.y = rotY;
            camera.rotation.x = rotX;
            camera.rotation.z = 0;
        }

        // --- 输入处理 ---

        // 桌面端鼠标拖拽视角（无限制）
        renderer.domElement.addEventListener('mousedown', (e) => {
            if (joystick.active) return;
            lookState.active = true;
            lookState.id = 'mouse';
            lookState.lastX = e.clientX;
            lookState.lastY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!lookState.active || lookState.id !== 'mouse') return;
            const dx = e.clientX - lookState.lastX;
            const dy = e.clientY - lookState.lastY;

            rotY -= dx * CONFIG.lookSensitivity * 2;
            rotX -= dy * CONFIG.lookSensitivity * 2;

            lookState.lastX = e.clientX;
            lookState.lastY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            if (lookState.id === 'mouse') {
                lookState.active = false;
                lookState.id = null;
            }
        });

        // 键盘移动
        window.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': case 'ArrowUp': moveState.forward = true; e.preventDefault(); break;
                case 'KeyS': case 'ArrowDown': moveState.backward = true; e.preventDefault(); break;
                case 'KeyA': case 'ArrowLeft': moveState.left = true; e.preventDefault(); break;
                case 'KeyD': case 'ArrowRight': moveState.right = true; e.preventDefault(); break;
            }
        });

        window.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': case 'ArrowUp': moveState.forward = false; e.preventDefault(); break;
                case 'KeyS': case 'ArrowDown': moveState.backward = false; e.preventDefault(); break;
                case 'KeyA': case 'ArrowLeft': moveState.left = false; e.preventDefault(); break;
                case 'KeyD': case 'ArrowRight': moveState.right = false; e.preventDefault(); break;
            }
        });

        // --- 移动端摇杆 ---
        const joystickEl = document.createElement('div');
        joystickEl.style.cssText = 'position:fixed;bottom:30px;left:30px;width:120px;height:120px;border-radius:60px;background:rgba(255,255,255,0.1);border:2px solid rgba(255,200,0,0.3);z-index:200;display:none;touch-action:none;';
        const thumbEl = document.createElement('div');
        thumbEl.style.cssText = 'position:absolute;top:50%;left:50%;width:50px;height:50px;border-radius:50%;background:rgba(255,200,0,0.7);transform:translate(-50%,-50%);pointer-events:none;';
        joystickEl.appendChild(thumbEl);
        document.body.appendChild(joystickEl);

        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            joystickEl.style.display = 'block';
        }

        const thumbMaxDist = 40;

        function updateJoystick(dx, dy) {
            const dist = Math.sqrt(dx * dx + dy * dy);
            let lx = dx, ly = dy;
            if (dist > thumbMaxDist) { lx = (dx / dist) * thumbMaxDist; ly = (dy / dist) * thumbMaxDist; }
            thumbEl.style.transform = `translate(calc(-50% + ${lx}px), calc(-50% + ${ly}px))`;
            joystick.deltaX = lx / thumbMaxDist;
            joystick.deltaY = ly / thumbMaxDist;
        }

        function resetJoystick() {
            joystick.active = false;
            joystick.deltaX = 0;
            joystick.deltaY = 0;
            thumbEl.style.transform = 'translate(-50%, -50%)';
        }

        joystickEl.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const t = e.touches[0];
            const rect = joystickEl.getBoundingClientRect();
            joystick.centerX = rect.left + rect.width / 2;
            joystick.centerY = rect.top + rect.height / 2;
            joystick.active = true;
            joystick.touchId = t.identifier;
            updateJoystick(t.clientX - joystick.centerX, t.clientY - joystick.centerY);
        }, { passive: false });

        joystickEl.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!joystick.active) return;
            for (let i = 0; i < e.touches.length; i++) {
                const t = e.touches[i];
                if (t.identifier === joystick.touchId) {
                    updateJoystick(t.clientX - joystick.centerX, t.clientY - joystick.centerY);
                    break;
                }
            }
        }, { passive: false });

        joystickEl.addEventListener('touchend', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joystick.touchId) {
                    resetJoystick();
                    break;
                }
            }
        }, { passive: false });

        joystickEl.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            resetJoystick();
        }, { passive: false });

        // --- 关键修复：触摸视角拖拽，允许同时存在多个触摸点 ---
        // 使用一个 Map 来跟踪每个触摸点的用途
        const touchMap = new Map(); // id -> 'look' | 'joystick'

        renderer.domElement.addEventListener('touchstart', (e) => {
            for (let i = 0; i < e.touches.length; i++) {
                const t = e.touches[i];
                const rect = joystickEl.getBoundingClientRect();
                const inJoystick = (t.clientX >= rect.left && t.clientX <= rect.right &&
                                    t.clientY >= rect.top && t.clientY <= rect.bottom);
                
                if (!inJoystick) {
                    // 这个触摸点用于视角拖拽
                    touchMap.set(t.identifier, 'look');
                    if (!lookState.active) {
                        lookState.active = true;
                        lookState.id = t.identifier;
                        lookState.lastX = t.clientX;
                        lookState.lastY = t.clientY;
                    }
                } else {
                    touchMap.set(t.identifier, 'joystick');
                }
            }
        }, { passive: true });

        renderer.domElement.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.touches.length; i++) {
                const t = e.touches[i];
                const usage = touchMap.get(t.identifier);
                
                if (usage === 'look' && lookState.active && t.identifier === lookState.id) {
                    const dx = t.clientX - lookState.lastX;
                    const dy = t.clientY - lookState.lastY;

                    rotY -= dx * CONFIG.lookSensitivity * 2;
                    rotX -= dy * CONFIG.lookSensitivity * 2;

                    lookState.lastX = t.clientX;
                    lookState.lastY = t.clientY;
                }
            }
        }, { passive: true });

        renderer.domElement.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                touchMap.delete(t.identifier);
                if (lookState.active && t.identifier === lookState.id) {
                    lookState.active = false;
                    lookState.id = null;
                    // 如果有其他触摸点还在用于look，重新指定
                    for (const [id, usage] of touchMap.entries()) {
                        if (usage === 'look') {
                            lookState.active = true;
                            lookState.id = id;
                            break;
                        }
                    }
                }
            }
        }, { passive: true });

        renderer.domElement.addEventListener('touchcancel', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                touchMap.delete(t.identifier);
                if (lookState.active && t.identifier === lookState.id) {
                    lookState.active = false;
                    lookState.id = null;
                }
            }
        }, { passive: true });

        // 窗口自适应
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 动画循环 ---
        function animate() {
            const delta = Math.min(clock.getDelta(), 0.1);
            updateMovement(delta);
            updateCameraRotation();
            updateParticles(delta);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
