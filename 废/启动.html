<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>本地项目启动器 · 离线收藏家</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0b0e14;
            color: #e0e5ee;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            padding: 20px 16px 40px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 780px;
            width: 100%;
        }
        .header {
            text-align: center;
            padding: 18px 0 10px;
            border-bottom: 1px solid #2a313c;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 600;
            background: linear-gradient(135deg, #f7c948, #f5a623);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }
        .header .sub {
            color: #7b8ba3;
            font-size: 14px;
            margin-top: 4px;
            letter-spacing: 1px;
            -webkit-text-fill-color: #7b8ba3;
        }
        .status-bar {
            background: #1a212a;
            border-radius: 14px;
            padding: 12px 18px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border: 1px solid #2f3845;
            gap: 8px;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .led {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4caf50;
            box-shadow: 0 0 6px #4caf50aa;
            transition: 0.2s;
        }
        .led.off {
            background: #5f6b7a;
            box-shadow: none;
        }
        .action-btn {
            background: #2d3746;
            border: none;
            color: #d6dee9;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid #3d4758;
        }
        .action-btn:hover {
            background: #3f4b5e;
            border-color: #5a6a80;
        }
        .action-btn.danger {
            color: #f28b82;
            border-color: #6d3a3a;
        }
        .action-btn.danger:hover {
            background: #4f2e2e;
        }
        .project-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 18px 0 14px;
        }
        .project-item {
            background: #141b24;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #25303c;
            transition: 0.1s;
            cursor: pointer;
            flex-wrap: wrap;
            gap: 6px 10px;
        }
        .project-item:hover {
            background: #1b2532;
            border-color: #3f4e62;
        }
        .project-item.active {
            border-color: #f5b342;
            background: #1f2a38;
            box-shadow: 0 0 0 1px #f5b34266;
        }
        .project-left {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }
        .project-index {
            background: #293442;
            color: #9aacc0;
            font-weight: 600;
            font-size: 13px;
            padding: 0 6px;
            border-radius: 6px;
            min-width: 28px;
            text-align: center;
        }
        .project-name {
            font-weight: 500;
            font-size: 16px;
            color: #e7edf5;
        }
        .project-port {
            background: #1f2937;
            padding: 0 10px;
            border-radius: 30px;
            font-size: 12px;
            color: #8ea0b9;
            font-family: monospace;
            border: 1px solid #31415a;
        }
        .project-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn-start, .btn-stop {
            border: none;
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            background: #2d3746;
            color: #bcc9de;
            border: 1px solid #3d4a5e;
        }
        .btn-start:hover {
            background: #3e4d64;
            color: white;
        }
        .btn-start.running {
            background: #2a5f4a;
            border-color: #3e9c74;
            color: #d4f0e0;
        }
        .btn-stop {
            background: #3f2e33;
            border-color: #6d4242;
            color: #f0b9b9;
        }
        .btn-stop:hover {
            background: #5a3a3a;
        }
        .btn-stop:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .footer-tip {
            margin-top: 20px;
            text-align: center;
            color: #5d6f86;
            font-size: 14px;
            border-top: 1px solid #1e2835;
            padding-top: 20px;
            letter-spacing: 0.3px;
        }
        .footer-tip span {
            background: #1e2835;
            padding: 2px 14px;
            border-radius: 30px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e2a38;
            color: #dce6f2;
            padding: 12px 28px;
            border-radius: 60px;
            border: 1px solid #3a4a60;
            box-shadow: 0 8px 24px #00000060;
            font-size: 15px;
            z-index: 999;
            backdrop-filter: blur(6px);
            transition: opacity 0.25s, transform 0.2s;
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.visible {
            opacity: 1;
            pointer-events: auto;
        }
        @media (max-width: 600px) {
            .project-item {
                padding: 12px 12px;
            }
            .project-name {
                font-size: 15px;
            }
            .project-actions {
                width: 100%;
                justify-content: flex-end;
            }
            .status-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .action-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <div class="header">
        <h1>📁 本地启动器</h1>
        <div class="sub">离线收藏家 · 一键唤起</div>
    </div>

    <div class="status-bar">
        <div class="status-badge">
            <span class="led" id="statusLed"></span>
            <span id="statusText">就绪</span>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button class="action-btn" id="stopAllBtn">⏹ 停止全部</button>
            <button class="action-btn" id="refreshBtn">⟳ 刷新</button>
        </div>
    </div>

    <div class="project-grid" id="projectList"></div>

    <div class="footer-tip">
        <span>💡 点击「启动」模拟运行 · 端口仅用于展示</span>
    </div>

    <div id="toastMessage" class="toast">📡 提示</div>
</div>

<script>
    (function() {
        // ---------- 项目数据 (与 bash 完全一致) ----------
        const PROJECTS = {
            "1": { name: "Holistic (人体识别)", path: "/storage/emulated/0/holistic_demo", port: "8080" },
            "2": { name: "晃动工坊 (图片晃动)", path: "/storage/emulated/0/html存放地/晃动工坊", port: "8081" },
            "3": { name: "Turbowarp (Scratch编辑器)", path: "/storage/emulated/0/html存放地/turbowarp.org", port: "8082" },
            "4": { name: "2048 (经典小游戏)", path: "/storage/emulated/0/html存放地/2048", port: "8083" },
            "5": { name: "3D Viewer (3D模型查看)", path: "/storage/emulated/0/html存放地/3dviewer", port: "8084" },
            "6": { name: "copy.sh (个人主页+生命游戏)", path: "/storage/emulated/0/html存放地/copy.sh", port: "8085" },
            "7": { name: "draw.io (绘图工具)", path: "/storage/emulated/0/html存放地/drawio", port: "8086" },
            "8": { name: "xtype (射击游戏)", path: "/storage/emulated/0/html存放地/xtype", port: "8087" },
            "9": { name: "Chihuahua Spin (魔性转狗)", path: "/storage/emulated/0/html存放地/chihuahuaspin", port: "8088" },
            "10": { name: "That's The Finger (手指追鼠标)", path: "/storage/emulated/0/html存放地/thatsthefinger", port: "8089" },
            "11": { name: "PetPetGenerator (摸摸头GIF)", path: "/storage/emulated/0/html存放地/petpetgenerator", port: "8090" },
            "12": { name: "WeaveSilk (对称画图)", path: "/storage/emulated/0/html存放地/weavesilk", port: "8091" },
            "13": { name: "Poetry Cloud (诗歌生成)", path: "/storage/emulated/0/html存放地/poetrycloud", port: "8092" },
            "14": { name: "Canvas Painter (画板)", path: "/storage/emulated/0/html存放地/canvas-painter", port: "8093" },
            "15": { name: "Markdown Previewer (Markdown预览)", path: "/storage/emulated/0/html存放地/markdown-previewer", port: "8094" },
            "16": { name: "Minesweeper (扫雷)", path: "/storage/emulated/0/html存放地/minesweeper", port: "8095" },
            "17": { name: "KoalasToTheMax (分形考拉)", path: "/storage/emulated/0/html存放地/KoalasToTheMax-master", port: "8096" },
            "18": { name: "Long Doge Challenge (无限滚动柴犬)", path: "/storage/emulated/0/html存放地/longdoge", port: "8097" },
            "19": { name: "Learn UI Name (UI视觉词典)", path: "/storage/emulated/0/html存放地/learn-ui/learnui.qiaomu.ai", port: "8098" },
            "20": { name: "htmlgames-master (html游戏源码)", path: "/storage/emulated/0/html存放地/htmlgames-master", port: "8099" },
            "21": { name: "maze-toys (迷宫)", path: "/storage/emulated/0/html存放地/maze-toys", port: "8100" },
            "22": { name: "toms-toys (玩具合集)", path: "/storage/emulated/0/html存放地/toms-toys", port: "8101" },
            "23": { name: "puginarug (整活)", path: "/storage/emulated/0/html存放地/puginarug", port: "8102" },
            "24": { name: "cruel-toys-maze (迷宫)", path: "/storage/emulated/0/html存放地/cruel-toys-maze", port: "8103" },
            "25": { name: "memory-toys (记忆配对)", path: "/storage/emulated/0/html存放地/memory-toys", port: "8104" },
            "26": { name: "onesquareminesweeper (扫雷变体)", path: "/storage/emulated/0/html存放地/onesquareminesweeper", port: "8105" },
            "27": { name: "cursoreffects (光标特效)", path: "/storage/emulated/0/html存放地/cursoreffects", port: "8106" },
            "28": { name: "paint-toys (绘画工具)", path: "/storage/emulated/0/html存放地/paint-toys", port: "8107" },
            "29": { name: "heeeeeeeey (整活)", path: "/storage/emulated/0/html存放地/heeeeeeeey", port: "8108" },
            "30": { name: "paint-toys-sand (沙画)", path: "/storage/emulated/0/html存放地/paint-toys-sand", port: "8109" },
            "31": { name: "sliding-toys (华容道)", path: "/storage/emulated/0/html存放地/sliding-toys", port: "8110" },
            "32": { name: "ant-toys (蚂蚁模拟)", path: "/storage/emulated/0/html存放地/ant-toys", port: "8111" },
            "33": { name: "patience-toys (呼吸灯)", path: "/storage/emulated/0/html存放地/patience-toys", port: "8112" },
            "34": { name: "cant-not-tweet (整活)", path: "/storage/emulated/0/html存放地/cant-not-tweet", port: "8113" },
            "35": { name: "smashthewalls (解压游戏)", path: "/storage/emulated/0/html存放地/smashthewalls", port: "8114" },
            "36": { name: "burymewithmymoney (整活)", path: "/storage/emulated/0/html存放地/burymewithmymoney", port: "8115" },
            "37": { name: "Breakout (打砖块)", path: "/storage/emulated/0/html存放地/breakout", port: "8116" },
            "38": { name: "Tetris (俄罗斯方块)", path: "/storage/emulated/0/html存放地/tetris", port: "8117" },
            "39": { name: "Snake (贪吃蛇)", path: "/storage/emulated/0/html存放地/snake", port: "8118" },
            "40": { name: "Gesto Engine (手势识别引擎)", path: "/storage/emulated/0/html存放地/gesto-engine-main", port: "8119" },
            "41": { name: "GooseHyperGlass (液态玻璃UI)", path: "/storage/emulated/0/html存放地/GooseHyperGlass-main", port: "8120" },
            "42": { name: "Glass CDN (液态玻璃演示站)", path: "/storage/emulated/0/html存放地/glass.goose.cc.cd", port: "8121" }
        };

        // ---------- 状态 ----------
        // 模拟运行中的项目 (存储为 Set 或 Map, 用 port 作为标识)
        const runningPorts = new Set();   // 存储端口字符串

        // DOM 元素
        const projectListEl = document.getElementById('projectList');
        const statusLed = document.getElementById('statusLed');
        const statusText = document.getElementById('statusText');
        const toastEl = document.getElementById('toastMessage');
        let toastTimer = null;

        // ---------- 辅助函数 ----------
        function showToast(msg, duration = 2200) {
            toastEl.textContent = msg;
            toastEl.classList.add('visible');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toastEl.classList.remove('visible');
            }, duration);
        }

        function updateStatus() {
            const count = runningPorts.size;
            if (count === 0) {
                statusLed.className = 'led off';
                statusText.textContent = '就绪 · 无运行中';
            } else {
                statusLed.className = 'led';
                statusText.textContent = `运行中 (${count} 个项目)`;
            }
            // 更新所有项目按钮状态
            document.querySelectorAll('.project-item').forEach(item => {
                const port = item.dataset.port;
                const startBtn = item.querySelector('.btn-start');
                const stopBtn = item.querySelector('.btn-stop');
                const isRunning = runningPorts.has(port);
                if (isRunning) {
                    startBtn.textContent = '● 运行中';
                    startBtn.classList.add('running');
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    item.classList.add('active');
                } else {
                    startBtn.textContent = '▶ 启动';
                    startBtn.classList.remove('running');
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    item.classList.remove('active');
                }
            });
        }

        // ---------- 核心操作 (模拟) ----------
        function startProject(port) {
            if (runningPorts.has(port)) {
                showToast(`⚠️ 端口 ${port} 已在运行`, 1500);
                return false;
            }
            // 模拟启动: 检查项目是否存在 (这里只是演示)
            const entry = Object.values(PROJECTS).find(p => p.port === port);
            if (!entry) {
                showToast('❌ 项目不存在', 1200);
                return false;
            }
            // 模拟启动延迟
            runningPorts.add(port);
            updateStatus();
            showToast(`✅ ${entry.name} 已启动 → http://127.0.0.1:${port}`, 2000);
            // 模拟 android am start (仅示意)
            console.log(`[模拟] am start http://127.0.0.1:${port}`);
            return true;
        }

        function stopProject(port) {
            if (!runningPorts.has(port)) {
                showToast(`⚠️ 端口 ${port} 未运行`, 1200);
                return false;
            }
            runningPorts.delete(port);
            updateStatus();
            const entry = Object.values(PROJECTS).find(p => p.port === port);
            showToast(`⏹ ${entry ? entry.name : '项目'} 已停止`, 1500);
            return true;
        }

        function stopAllProjects() {
            if (runningPorts.size === 0) {
                showToast('💤 没有运行中的项目', 1200);
                return;
            }
            const count = runningPorts.size;
            runningPorts.clear();
            updateStatus();
            showToast(`⏹ 已停止全部 ${count} 个项目`, 1600);
        }

        // ---------- 渲染列表 ----------
        function renderProjects() {
            const sortedKeys = Object.keys(PROJECTS).map(Number).sort((a,b) => a - b);
            let html = '';
            for (const key of sortedKeys) {
                const p = PROJECTS[key];
                const port = p.port;
                const isRunning = runningPorts.has(port);
                html += `
                    <div class="project-item ${isRunning ? 'active' : ''}" data-port="${port}" data-key="${key}">
                        <div class="project-left">
                            <span class="project-index">${key}</span>
                            <span class="project-name">${p.name}</span>
                            <span class="project-port">${port}</span>
                        </div>
                        <div class="project-actions">
                            <button class="btn-start ${isRunning ? 'running' : ''}" data-port="${port}" ${isRunning ? 'disabled' : ''}>${isRunning ? '● 运行中' : '▶ 启动'}</button>
                            <button class="btn-stop" data-port="${port}" ${!isRunning ? 'disabled' : ''}>⏹ 停止</button>
                        </div>
                    </div>
                `;
            }
            projectListEl.innerHTML = html;

            // 绑定事件 (委托)
            projectListEl.querySelectorAll('.btn-start').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const port = btn.dataset.port;
                    startProject(port);
                });
            });

            projectListEl.querySelectorAll('.btn-stop').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const port = btn.dataset.port;
                    stopProject(port);
                });
            });

            // 点击整行快速启动 (如果未运行)
            projectListEl.querySelectorAll('.project-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    // 如果点击的是按钮内部，避免重复触发
                    if (e.target.closest('.btn-start') || e.target.closest('.btn-stop')) return;
                    const port = item.dataset.port;
                    if (!runningPorts.has(port)) {
                        startProject(port);
                    } else {
                        showToast(`🔁 ${port} 已在运行`, 1200);
                    }
                });
            });

            updateStatus();
        }

        // ---------- 初始化 & 全局事件 ----------
        document.getElementById('stopAllBtn').addEventListener('click', stopAllProjects);

        document.getElementById('refreshBtn').addEventListener('click', () => {
            // 刷新列表 (保持运行状态)
            renderProjects();
            showToast('⟳ 已刷新', 1000);
        });

        // 处理退出 / 清理 (模拟)
        window.addEventListener('beforeunload', function() {
            // 只是模拟清理，不实际停止
            console.log('[模拟] 清理所有运行中项目');
        });

        // 启动渲染
        renderProjects();
        showToast('📂 加载完成 · 点击项目启动', 1800);

        // ---------- 兼容bash里的信号 (仅示意) ----------
        console.log('✨ 本地启动器 HTML 版 (模拟模式)');
        console.log('ℹ️ 所有启动/停止为前端模拟，无真实HTTP服务');
    })();
</script>
</body>
</html>
