<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>霓虹时间 · 农历</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0f;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      letter-spacing: 0.02em;
      padding: 2vw 4vw;
      overflow: hidden;
      position: relative;
    }

    /* 背景微弱的网格纹理，增加霓虹氛围 */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 0, 128, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      flex-wrap: nowrap;
      gap: clamp(1rem, 5vw, 4rem);
      width: 100%;
      position: relative;
      z-index: 1;
    }

    /* 霓虹灯管核心样式 */
    .neon {
      color: #fff;
      text-shadow:
        0 0 4px #fff,
        0 0 8px #fff,
        0 0 12px var(--neon-color, #ff00ff),
        0 0 20px var(--neon-color, #ff00ff),
        0 0 32px var(--neon-color, #ff00ff),
        0 0 48px var(--neon-color, #ff00ff);
      animation: neonPulse 2s ease-in-out infinite alternate;
    }

    /* 不同元素使用不同的霓虹色调 */
    .clock {
      font-size: clamp(3rem, 13vw, 11rem);
      font-weight: 700;
      font-feature-settings: "tnum";
      letter-spacing: 0.05em;
      line-height: 1;
      white-space: nowrap;
      flex-shrink: 0;
      --neon-color: #ff00ff;
      animation-delay: 0s;
    }

    .info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: clamp(0.4rem, 1.2vw, 1rem);
      font-size: clamp(0.9rem, 2.2vw, 2rem);
      font-weight: 600;
      letter-spacing: 0.1em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .info > span {
      display: inline-block;
      animation: neonPulse 2s ease-in-out infinite alternate, hueShift 8s linear infinite;
    }

    .info > span:nth-child(1) {
      --neon-color: #00ffff;
      animation-delay: 0s, 0s;
    }

    .info > span:nth-child(2) {
      --neon-color: #ff0080;
      animation-delay: 0.4s, 0s;
    }

    .info > span:nth-child(3) {
      --neon-color: #ffaa00;
      animation-delay: 0.8s, 0s;
    }

    /* 灯管呼吸脉冲 */
    @keyframes neonPulse {
      0% {
        opacity: 1;
        filter: brightness(1);
      }
      50% {
        opacity: 0.92;
        filter: brightness(1.15);
      }
      100% {
        opacity: 1;
        filter: brightness(0.95);
      }
    }

    /* 色调流动，让霓虹颜色实时变化 */
    @keyframes hueShift {
      0% {
        filter: hue-rotate(0deg);
      }
      100% {
        filter: hue-rotate(360deg);
      }
    }

    /* 时钟单独使用色相流动，速度稍慢 */
    .clock {
      animation: neonPulse 2s ease-in-out infinite alternate, hueShift 12s linear infinite;
    }

    /* 竖屏适配 */
    @media (orientation: portrait) {
      .container {
        flex-direction: column;
        gap: clamp(1.5rem, 5vh, 3rem);
      }

      .info {
        align-items: center;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.8rem 2rem;
      }

      .clock {
        font-size: clamp(2.5rem, 18vw, 8rem);
      }

      .info {
        font-size: clamp(0.8rem, 3.5vw, 1.5rem);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="clock neon" id="clock">--:--:--</div>
    <div class="info">
      <span class="neon" id="weekday">星期一</span>
      <span class="neon" id="date">2025年3月21日</span>
      <span class="neon" id="lunar">农历二月廿二</span>
    </div>
  </div>

  <script>
    (function() {
      const lunarInfo = [
        0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
        0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
        0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
        0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,
        0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
        0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,
        0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
        0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
        0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
        0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,
        0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
        0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
        0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
        0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
        0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,
        0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,
        0x0a2e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,
        0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,
        0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,
        0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252,
        0x0d520
      ];

      const monthNames = ['正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','冬月','腊月'];
      const dayNames = [
        '初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
        '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
        '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'
      ];
      const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

      function leapMonth(y) {
        return lunarInfo[y - 1900] & 0xf;
      }

      function leapDays(y) {
        if (leapMonth(y)) {
          return (lunarInfo[y - 1900] & 0x10000) ? 30 : 29;
        }
        return 0;
      }

      function monthDays(y, m) {
        return (lunarInfo[y - 1900] & (0x10000 >> m)) ? 30 : 29;
      }

      function lunarYearDays(y) {
        let sum = 348;
        for (let i = 0x8000; i > 0x8; i >>= 1) {
          sum += (lunarInfo[y - 1900] & i) ? 1 : 0;
        }
        return sum + leapDays(y);
      }

      function solarToLunar(date) {
        const baseDate = new Date(1900, 0, 31);
        let offset = Math.floor((date - baseDate) / 86400000);
        let lunarYear = 1900;
        let daysInYear = 0;

        while (offset >= (daysInYear = lunarYearDays(lunarYear))) {
          offset -= daysInYear;
          lunarYear++;
        }

        let leap = leapMonth(lunarYear);
        let isLeap = false;
        let lunarMonth = 1;
        let daysInMonth = 0;

        while (lunarMonth <= 12) {
          if (leap > 0 && lunarMonth === leap + 1 && !isLeap) {
            isLeap = true;
            lunarMonth--;
          } else {
            if (isLeap && lunarMonth === leap + 1) {
              isLeap = false;
            }
          }

          if (isLeap) {
            daysInMonth = leapDays(lunarYear);
          } else {
            daysInMonth = monthDays(lunarYear, lunarMonth);
          }

          if (offset < daysInMonth) break;
          offset -= daysInMonth;
          lunarMonth++;
        }

        const lunarDay = offset + 1;
        const monthStr = (isLeap ? '闰' : '') + monthNames[lunarMonth - 1];
        const dayStr = dayNames[lunarDay - 1];

        return `农历${monthStr}${dayStr}`;
      }

      function update() {
        const now = new Date();

        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('clock').textContent = `${hh}:${mm}:${ss}`;

        document.getElementById('weekday').textContent = weekdays[now.getDay()];
        document.getElementById('date').textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
        document.getElementById('lunar').textContent = solarToLunar(now);
      }

      update();
      setInterval(update, 1000);
    })();
  </script>
</body>
</html>
