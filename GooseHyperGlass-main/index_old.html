<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>液态玻璃测试</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
            flex-wrap: wrap;
            gap: 30px;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .card h3 {
            color: rgba(255,255,255,0.8);
            margin-top: 0;
            text-align: center;
            font-weight: 400;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3>🔘 开关 (single-toggle)</h3>
        <liquid-glass mode="single-toggle" style="width:380px;height:200px"></liquid-glass>
    </div>

    <div class="card">
        <h3>🎚️ 滑块 (single-slider)</h3>
        <liquid-glass mode="single-slider" style="width:380px;height:200px"></liquid-glass>
    </div>

    <div class="card">
        <h3>📱 底部标签栏 (bottom-tabs)</h3>
        <liquid-glass mode="bottom-tabs" style="width:380px;height:200px"></liquid-glass>
    </div>

    <script src="./liquid-glass.js"></script>
</body>
</html>
