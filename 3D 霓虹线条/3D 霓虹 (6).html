<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>霓虹光绘</title>
<style>
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  canvas { display: block; touch-action: none; }
  #hint {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 34px);
    transform: translateX(-50%);
    color: rgba(120,255,255,.75);
    font: 12px/1.6 -apple-system, "PingFang SC", sans-serif;
    text-shadow: 0 0 12px rgba(0,255,255,.9);
    pointer-events: none; z-index: 10;
    letter-spacing: .1em; white-space: nowrap;
    animation: hb 2.6s ease-in-out infinite;
    transition: opacity .6s;
    text-align: center;
  }
  @keyframes hb { 0%,100%{opacity:.35} 50%{opacity:1} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">滑动屏幕 · 或甩动手机</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.140.0/build/three.min.js"></script>
<script>
(function () {
  'use strict';

  const hintEl = document.getElementById('hint');

  function hideHint() {
    if (!hintEl || hintEl.style.opacity === '0') return;
    // 动画会覆盖内联 opacity，必须先停掉动画
    hintEl.style.animation = 'none';
    hintEl.style.opacity = '0';
  }

  /* ========== 依赖检查 ========== */
  if (!window.THREE) {
    if (hintEl) hintEl.textContent = 'Three.js 加载失败 · 请检查网络后刷新';
    return;
  }

  /* ========== 参数 ========== */
  const MAX_POINTS = 600;
  const POINT_LIFE = 6.0;
  const MIN_SEG    = 0.05;
  const VEL_DAMP   = 0.28;    // 每秒保留比例
  const MAX_SPEED  = 22;
  const BOUND_MIN  = 3.0;
  const BOUND_MAX  = 11.0;
  const CAM_SMOOTH = 0.10;
  const GLOW_W     = 0.09;
  const CORE_W     = 0.024;

  // 摇动 → 光笔
  const MOTION_DEAD  = 1.6;   // 线性加速度死区 (m/s²)
  const MOTION_GAIN  = 5.5;   // 加速度积分增益
  const GRAV_TAU     = 0.35;  // 重力低通时间常数 (s)
  const MOTION_MAXDT = 0.05;

  /* ========== Three.js ========== */
  const canvas = document.getElementById('c');

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      powerPreference: 'high-performance'
    });
  } catch (err) {
    if (hintEl) hintEl.textContent = '当前设备不支持 WebGL';
    return;
  }

  let pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(pixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x000000, 1);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x000000, 0.018);

  const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 300);
  camera.position.set(0, 0, 0);

  function onResize() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(pixelRatio);
    renderer.setSize(innerWidth, innerHeight);
  }
  addEventListener('resize', onResize);
  addEventListener('orientationchange', function () {
    setTimeout(onResize, 260);
  });

  /* ========== 轨迹几何体 ========== */
  const MAX_SEGS = MAX_POINTS - 1;
  const posArr = new Float32Array(MAX_SEGS * 12 * 3);
  const colArr = new Float32Array(MAX_SEGS * 12 * 3);

  const trailGeo = new THREE.BufferGeometry();
  const posAttr = new THREE.BufferAttribute(posArr, 3);
  const colAttr = new THREE.BufferAttribute(colArr, 3);
  posAttr.setUsage(THREE.DynamicDrawUsage);
  colAttr.setUsage(THREE.DynamicDrawUsage);
  trailGeo.setAttribute('position', posAttr);
  trailGeo.setAttribute('color', colAttr);
  trailGeo.setDrawRange(0, 0);

  const trailMesh = new THREE.Mesh(trailGeo, new THREE.MeshBasicMaterial({
    vertexColors: true,
    blending: THREE.AdditiveBlending,
    transparent: true,
    depthWrite: false,
    depthTest: false,
    fog: true
  }));
  trailMesh.frustumCulled = false;
  trailMesh.renderOrder = 0;
  scene.add(trailMesh);

  /* ========== 光笔光标 ========== */
  const glowCv = document.createElement('canvas');
  glowCv.width = glowCv.height = 128;
  {
    const ctx = glowCv.getContext('2d');
    const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.25, 'rgba(255,255,255,.55)');
    g.addColorStop(0.6, 'rgba(255,255,255,.12)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128);
  }
  const penSprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(glowCv),
    blending: THREE.AdditiveBlending,
    transparent: true, depthTest: false, depthWrite: false,
    color: 0x66ffff
  }));
  penSprite.scale.set(1.2, 1.2, 1);
  penSprite.renderOrder = 1;   // 始终画在轨迹之上
  scene.add(penSprite);

  /* ========== 光笔状态 ========== */
  const penPos  = new THREE.Vector3(0, 0, -6);
  const penPrev = new THREE.Vector3(0, 0, -6);
  const penVel  = new THREE.Vector3();
  let hueCursor = 0.52;
  const points = [];
  let pendingBreak = false;   // 下一次落笔时断一下轨迹

  /* ========== 相机朝向（陀螺仪） ========== */
  const targetQuat = new THREE.Quaternion();
  const _euler = new THREE.Euler();
  const _q1 = new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2);
  const _qz = new THREE.Quaternion();
  const Z_AXIS = new THREE.Vector3(0, 0, 1);
  let orientReady = false;

  function screenAngle() {
    if (screen.orientation && typeof screen.orientation.angle === 'number')
      return screen.orientation.angle;
    return window.orientation || 0;
  }

  function onOrientation(e) {
    if (e.alpha == null && e.beta == null && e.gamma == null) return;

    const a = THREE.MathUtils.degToRad(e.alpha || 0);
    const b = THREE.MathUtils.degToRad(e.beta  || 0);
    const g = THREE.MathUtils.degToRad(e.gamma || 0);
    const s = THREE.MathUtils.degToRad(screenAngle());

    _euler.set(b, a, -g, 'YXZ');
    targetQuat.setFromEuler(_euler);
    targetQuat.multiply(_q1);
    targetQuat.multiply(_qz.setFromAxisAngle(Z_AXIS, -s));

    if (!orientReady) {
      camera.quaternion.copy(targetQuat);
      orientReady = true;
    }
  }

  /* ================================================================
   * 摇动 → 光笔速度
   *
   *  1. 低通估计"重力"，从 accelerationIncludingGravity 里减掉，
   *     这样转动手机不会再把重力变化误判成摇动。
   *  2. 用线性加速度本身（而非相邻差分），并按 dt 积分成速度，
   *     手感与设备事件频率无关。
   *  3. 死区过滤静止噪声。
   * ================================================================ */
  const gravity = { x: 0, y: 0, z: 0 };
  let gravityReady = false;
  let lastMotionTime = 0;
  const _tmp = new THREE.Vector3();

  function resetMotion() {
    gravityReady = false;
    lastMotionTime = 0;
  }

  function onMotion(e) {
    const ag = e.accelerationIncludingGravity;
    if (!ag || ag.x == null || ag.y == null || ag.z == null) return;

    const now = performance.now();
    let dt = lastMotionTime ? (now - lastMotionTime) / 1000 : 1 / 60;
    lastMotionTime = now;
    if (!(dt > 0.0005)) dt = 1 / 60;
    if (dt > MOTION_MAXDT) dt = MOTION_MAXDT;

    if (!gravityReady) {
      gravity.x = ag.x; gravity.y = ag.y; gravity.z = ag.z;
      gravityReady = true;
      return;
    }

    // 低通跟踪重力方向
    const a = 1 - Math.exp(-dt / GRAV_TAU);
    gravity.x += (ag.x - gravity.x) * a;
    gravity.y += (ag.y - gravity.y) * a;
    gravity.z += (ag.z - gravity.z) * a;

    // 去掉重力后的线性加速度
    const lx = ag.x - gravity.x;
    const ly = ag.y - gravity.y;
    const lz = ag.z - gravity.z;

    const mag = Math.sqrt(lx * lx + ly * ly + lz * lz);
    if (mag < MOTION_DEAD) return;

    // 设备坐标 → 相机坐标（Z 取反），再按相机朝向旋转
    _tmp.set(lx, ly, -lz).applyQuaternion(camera.quaternion);

    // 按 dt 积分：事件频率不同也不会改变灵敏度
    const k = ((mag - MOTION_DEAD) / mag) * MOTION_GAIN * dt;
    penVel.addScaledVector(_tmp, k);

    if (penVel.length() > MAX_SPEED * 1.6) penVel.setLength(MAX_SPEED * 1.6);

    hideHint();
  }

  /* ================================================================
   * 权限 & 监听器绑定
   *
   *  - 不在加载时请求（iOS 会直接拒），只在用户手势里请求一次
   *  - 串行请求，避免并行弹窗在部分机型上失效
   *  - 用户拒绝后不再反复弹
   * ================================================================ */
  let sensorsBound = false;
  let requesting = false;
  let permissionState = 'unknown';  // unknown | granted | denied

  function needsPermission() {
    const doNeed = typeof DeviceOrientationEvent !== 'undefined' &&
                   typeof DeviceOrientationEvent.requestPermission === 'function';
    const dmNeed = typeof DeviceMotionEvent !== 'undefined' &&
                   typeof DeviceMotionEvent.requestPermission === 'function';
    return doNeed || dmNeed;
  }

  function bindSensors() {
    if (sensorsBound) return;
    sensorsBound = true;
    window.addEventListener('deviceorientation', onOrientation, { passive: true });
    window.addEventListener('devicemotion', onMotion, { passive: true });
  }

  function requestAndBind() {
    if (sensorsBound || requesting) return;

    if (!needsPermission()) {      // Android / 桌面
      bindSensors();
      return;
    }
    if (permissionState === 'denied') return;   // 拒绝过就别再骚扰

    requesting = true;

    const steps = [];
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      steps.push(function () {
        return DeviceOrientationEvent.requestPermission()
          .catch(function () { return 'denied'; });
      });
    }
    if (typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
      steps.push(function () {
        return DeviceMotionEvent.requestPermission()
          .catch(function () { return 'denied'; });
      });
    }

    // 串行链：一个弹窗结束再请求下一个
    let granted = false;
    let chain = Promise.resolve();
    steps.forEach(function (step) {
      chain = chain.then(function () {
        return step().then(function (res) {
          if (res === 'granted') granted = true;
        });
      });
    });

    chain.then(function () {
      requesting = false;
      if (granted) {
        permissionState = 'granted';
        bindSensors();
      } else {
        permissionState = 'denied';
      }
    }, function () {
      requesting = false;
      permissionState = 'denied';
    });
  }

  // 无需权限的环境（Android / 桌面）加载时直接绑
  if (!needsPermission()) bindSensors();

  // 页面切回前台：传感器时间基准全部重置，避免恢复瞬间一个大冲量
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    resetMotion();
    clock.getDelta();   // 丢弃后台积压的时间
  });

  /* ========== 指针绘制（统一触摸 / 鼠标） ========== */
  let activePointerId = null;
  let touching = false;
  const touchTarget = new THREE.Vector3(0, 0, -7);

  function updateTouchTarget(cx, cy) {
    const nx = (cx / innerWidth)  * 2 - 1;
    const ny = -(cy / innerHeight) * 2 + 1;

    const dist = 7;
    const halfH = dist * Math.tan((camera.fov * Math.PI / 180) / 2);
    const halfW = halfH * camera.aspect;

    touchTarget.set(nx * halfW, ny * halfH, -dist)
               .applyQuaternion(camera.quaternion);
  }

  canvas.addEventListener('pointerdown', function (e) {
    requestAndBind();            // 必须在手势里同步触发
    hideHint();

    if (activePointerId !== null) return;   // 已有手指在画，忽略后续手指

    activePointerId = e.pointerId;
    touching = true;

    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}

    updateTouchTarget(e.clientX, e.clientY);

    // 光笔瞬移到落点，但轨迹断开，不会拉出一条长线
    penPos.copy(touchTarget);
    penPrev.copy(touchTarget);
    penVel.set(0, 0, 0);
    pendingBreak = true;

    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('pointermove', function (e) {
    if (e.pointerId !== activePointerId) return;
    updateTouchTarget(e.clientX, e.clientY);
    e.preventDefault();
  }, { passive: false });

  function endPointer(e) {
    if (e.pointerId !== activePointerId) return;
    activePointerId = null;
    touching = false;
    penVel.set(0, 0, 0);          // 抬手后不再带着惯性乱飞
    try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  /* ========== 光笔物理 ========== */
  function updatePen(dt) {
    if (touching) {
      // 触摸模式：快速但略带阻尼地追向手指投影点
      penPrev.copy(penPos);
      const k = 1 - Math.exp(-dt * 45);
      penPos.lerp(touchTarget, k);
      penVel.subVectors(penPos, penPrev).divideScalar(Math.max(dt, 1e-4));
      const sp = penVel.length();
      if (sp > MAX_SPEED) penVel.setLength(MAX_SPEED);
      return;
    }

    // 摇动模式：penVel 已由 onMotion 积分累积
    penVel.multiplyScalar(Math.pow(VEL_DAMP, dt));

    const sp = penVel.length();
    if (sp > MAX_SPEED) penVel.setLength(MAX_SPEED);

    penPos.addScaledVector(penVel, dt);

    // 球形软边界
    const r = penPos.length();
    if (r < 1e-4) return;
    if (r > BOUND_MAX) {
      const pull = (r - BOUND_MAX) * dt * 2.0;
      penPos.multiplyScalar(1 - Math.min(pull / r, 0.5));
    } else if (r < BOUND_MIN) {
      const push = (BOUND_MIN - r) * dt * 2.0;
      penPos.multiplyScalar(1 + Math.min(push / r, 0.5));
    }
  }

  /* ========== 轨迹采样 ========== */
  function updateTrail(dt) {
    for (let i = 0; i < points.length; i++) points[i].age += dt;
    while (points.length && points[0].age > POINT_LIFE) points.shift();

    const sp = penVel.length();
    const power = Math.min(1, Math.max(0.3, sp / 6));

    let add = false;
    const last = points.length ? points[points.length - 1] : null;

    if (!last || pendingBreak) {
      add = true;
    } else {
      const dx = penPos.x - last.x;
      const dy = penPos.y - last.y;
      const dz = penPos.z - last.z;
      if (dx * dx + dy * dy + dz * dz > MIN_SEG * MIN_SEG) add = true;
    }

    if (add) {
      hueCursor = (hueCursor + 0.008) % 1;
      points.push({
        x: penPos.x, y: penPos.y, z: penPos.z,
        age: 0, power: power, hue: hueCursor,
        break: pendingBreak
      });
      pendingBreak = false;
    }

    while (points.length > MAX_POINTS) points.shift();
  }

  /* ========== 构建轨迹网格 ========== */
  let vi = 0;
  const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3();
  const _dir = new THREE.Vector3(), _side = new THREE.Vector3(), _ref = new THREE.Vector3();
  const _cA = new THREE.Color(), _cB = new THREE.Color();
  const lastSide = new THREE.Vector3(1, 0, 0);
  let haveSide = false;

  function pushVert(px, py, pz, r, g, b) {
    const o = vi * 3;
    posArr[o] = px; posArr[o + 1] = py; posArr[o + 2] = pz;
    colArr[o] = r;  colArr[o + 1] = g;  colArr[o + 2] = b;
    vi++;
  }

  function buildTrail() {
    vi = 0;
    haveSide = false;
    const n = points.length;

    for (let i = 0; i < n - 1; i++) {
      const a = points[i], b = points[i + 1];

      // 断点：不连接跨越落笔的一段
      if (b.break) { haveSide = false; continue; }

      const fa = Math.max(0, 1 - a.age / POINT_LIFE) * a.power;
      const fb = Math.max(0, 1 - b.age / POINT_LIFE) * b.power;
      if (fa < 0.003 && fb < 0.003) { haveSide = false; continue; }

      _v1.set(a.x, a.y, a.z);
      _v2.set(b.x, b.y, b.z);
      _dir.subVectors(_v2, _v1);
      const len = _dir.length();
      if (len < 1e-6) { haveSide = false; continue; }
      _dir.multiplyScalar(1 / len);

      // 平行传输：把上一段的侧向量投影到当前法平面，避免径向运动时翻转
      if (haveSide) {
        _side.copy(lastSide);
        _side.addScaledVector(_dir, -_side.dot(_dir));
      } else {
        _side.set(0, 0, 0);
      }

      if (_side.lengthSq() < 1e-6) {
        // 退化：用固定参考轴重建
        if (Math.abs(_dir.y) < 0.9) _ref.set(0, 1, 0);
        else _ref.set(1, 0, 0);
        _side.crossVectors(_ref, _dir);
        if (_side.lengthSq() < 1e-6) _side.set(1, 0, 0);
      }
      _side.normalize();
      lastSide.copy(_side);
      haveSide = true;

      const pm = (fa + fb) * 0.5;
      const wS = 0.5 + pm * 1.9;
      const gw = GLOW_W * wS, cw = CORE_W * wS;

      const gsx = _side.x * gw, gsy = _side.y * gw, gsz = _side.z * gw;
      const csx = _side.x * cw, csy = _side.y * cw, csz = _side.z * cw;

      _cA.setHSL(a.hue, 1.0, 0.5);
      _cB.setHSL(b.hue, 1.0, 0.5);

      const x1 = _v1.x, y1 = _v1.y, z1 = _v1.z;
      const x2 = _v2.x, y2 = _v2.y, z2 = _v2.z;

      // 外发光
      const GA = 0.28;
      const ar = _cA.r * GA * fa, ag = _cA.g * GA * fa, ab = _cA.b * GA * fa;
      const br = _cB.r * GA * fb, bg = _cB.g * GA * fb, bb = _cB.b * GA * fb;

      pushVert(x1 - gsx, y1 - gsy, z1 - gsz, ar, ag, ab);
      pushVert(x2 - gsx, y2 - gsy, z2 - gsz, br, bg, bb);
      pushVert(x2 + gsx, y2 + gsy, z2 + gsz, br, bg, bb);
      pushVert(x1 - gsx, y1 - gsy, z1 - gsz, ar, ag, ab);
      pushVert(x2 + gsx, y2 + gsy, z2 + gsz, br, bg, bb);
      pushVert(x1 + gsx, y1 + gsy, z1 + gsz, ar, ag, ab);

      // 高亮芯
      const cr = (_cA.r * 0.55 + 0.45) * fa, cg = (_cA.g * 0.55 + 0.45) * fa, cb = (_cA.b * 0.55 + 0.45) * fa;
      const dr = (_cB.r * 0.55 + 0.45) * fb, dg = (_cB.g * 0.55 + 0.45) * fb, db = (_cB.b * 0.55 + 0.45) * fb;

      pushVert(x1 - csx, y1 - csy, z1 - csz, cr, cg, cb);
      pushVert(x2 - csx, y2 - csy, z2 - csz, dr, dg, db);
      pushVert(x2 + csx, y2 + csy, z2 + csz, dr, dg, db);
      pushVert(x1 - csx, y1 - csy, z1 - csz, cr, cg, cb);
      pushVert(x2 + csx, y2 + csy, z2 + csz, dr, dg, db);
      pushVert(x1 + csx, y1 + csy, z1 + csz, cr, cg, cb);
    }

    trailGeo.setDrawRange(0, vi);

    if (vi > 0) {
      // 只上传用到的区间，减少带宽
      posAttr.updateRange.offset = 0;
      posAttr.updateRange.count = vi * 3;
      posAttr.needsUpdate = true;
      colAttr.updateRange.offset = 0;
      colAttr.updateRange.count = vi * 3;
      colAttr.needsUpdate = true;
    }
  }

  /* ========== 主循环 ========== */
  const clock = new THREE.Clock();

  // 简易自适应画质：持续掉帧就把 pixelRatio 降一档
  let frameAccum = 0, frameCount = 0, qualityLocked = false;

  function adaptQuality(dt) {
    if (qualityLocked || pixelRatio <= 1) return;
    frameAccum += dt;
    frameCount++;
    if (frameCount < 90) return;

    const avg = frameAccum / frameCount;
    frameAccum = 0;
    frameCount = 0;

    if (avg > 0.023) {                  // 低于约 43fps
      pixelRatio = Math.max(1, pixelRatio * 0.75);
      renderer.setPixelRatio(pixelRatio);
      renderer.setSize(innerWidth, innerHeight);
      if (pixelRatio <= 1.001) qualityLocked = true;
    }
  }

  function loop() {
    requestAnimationFrame(loop);

    const dt = Math.min(clock.getDelta(), 0.05);

    if (orientReady) {
      const k = 1 - Math.pow(0.5, dt / CAM_SMOOTH);
      camera.quaternion.slerp(targetQuat, k);
    }

    updatePen(dt);
    updateTrail(dt);
    buildTrail();

    penSprite.position.copy(penPos);
    const sp = penVel.length();
    const sz = 1.0 + Math.min(sp * 0.1, 1.0);
    penSprite.scale.set(sz, sz, 1);
    penSprite.material.color.setHSL(hueCursor, 1, 0.65);

    renderer.render(scene, camera);
    adaptQuality(dt);
  }
  loop();

})();
</script>
</body>
</html>
