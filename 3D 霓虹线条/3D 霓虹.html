<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>霓虹光绘 · Neon Light Painting</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 14px;
    font: 12px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: rgba(130, 255, 255, 0.85);
    text-shadow: 0 0 10px rgba(0, 255, 255, 0.9), 0 0 26px rgba(0, 170, 255, 0.55);
    pointer-events: none;
    z-index: 10;
    letter-spacing: 0.06em;
  }
  #hud b { color: #ffffff; font-weight: 600; }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 42px);
    transform: translateX(-50%);
    max-width: 86vw;
    padding: 14px 20px;
    border-radius: 14px;
    background: rgba(8, 0, 22, 0.78);
    border: 1px solid rgba(0, 255, 255, 0.45);
    box-shadow: 0 0 26px rgba(0, 255, 255, 0.35),
                inset 0 0 22px rgba(130, 0, 255, 0.28);
    color: #d8fbff;
    font: 13px/1.75 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    text-align: center;
    z-index: 20;
    pointer-events: none;
    transition: opacity 0.55s ease;
  }
  #toast.hide { opacity: 0; }

  /* 轻微暗角，让霓虹更突出 */
  #vignette {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 5;
    background: radial-gradient(ellipse at center,
                rgba(0,0,0,0) 40%,
                rgba(0,0,0,0.55) 100%);
  }
</style>
</head>
<body>

<div id="app"></div>
<div id="vignette"></div>

<div id="hud">
  <b>甩动</b>手机 → 绘制霓虹轨迹　｜　<b>转动</b>手机 → 环视光绘
</div>

<div id="toast">正在初始化传感器…</div>

<!-- Three.js CDN (UMD 构建，移动端兼容性好) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.140.0/build/three.min.js"></script>

<script>
(function () {
  'use strict';

  /* ============================================================
   * 0. 可调参数
   * ============================================================ */
  const CFG = {
    maxPoints:    480,    // 轨迹最多保留的点数
    pointLife:    5.0,    // 每个点的寿命（秒）—— 决定拖尾留多久
    minSegDist:   0.025,  // 相邻点最小间距，避免原地堆点
    accelGain:    1.5,    // 加速度 → 速度 的增益（甩得越猛走得越快）
    accelDead:    0.9,    // 加速度死区（m/s²），过滤手抖噪声
    velDamp:      0.06,   // 速度阻尼基数（每秒保留比例，越小停得越快）
    maxSpeed:     18,     // 速度上限，防止瞬移
    boundRadius:  9.0,    // 光笔活动范围（软边界）
    camSmooth:    0.09,   // 相机朝向平滑半衰期（秒），越大越稳但越迟钝
    glowWidth:    0.075,  // 外发光带宽度（世界单位）
    coreWidth:    0.020   // 高亮芯线宽度
  };

  /* ============================================================
   * 1. 渲染器 / 场景 / 相机
   * ============================================================ */
  const appEl  = document.getElementById('app');
  const toastEl = document.getElementById('toast');

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);
  // 指数雾：让远处的光绘自然变暗，增强纵深
  scene.fog = new THREE.FogExp2(0x000000, 0.022);

  const camera = new THREE.PerspectiveCamera(
    72,
    window.innerWidth / window.innerHeight,
    0.05,
    300
  );
  camera.position.set(0, 0, 0);   // 相机固定在原点，靠旋转来看世界

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance'
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 1);
  appEl.appendChild(renderer.domElement);

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ============================================================
   * 2. 轨迹几何体
   *    每条线段绘制 2 个「面向相机的四边形」：
   *      · 外发光（宽、暗）
   *      · 高亮芯（窄、亮、偏白）
   *    每个四边形 = 2 个三角形 = 6 个顶点，所以每条线段 12 个顶点。
   * ============================================================ */
  const MAX_POINTS      = CFG.maxPoints;
  const MAX_SEGS        = MAX_POINTS - 1;
  const VERTS_PER_SEG   = 12;

  const posArr = new Float32Array(MAX_SEGS * VERTS_PER_SEG * 3);
  const colArr = new Float32Array(MAX_SEGS * VERTS_PER_SEG * 3);

  const trailGeo = new THREE.BufferGeometry();
  const posAttr = new THREE.BufferAttribute(posArr, 3);
  const colAttr = new THREE.BufferAttribute(colArr, 3);
  posAttr.setUsage(THREE.DynamicDrawUsage);
  colAttr.setUsage(THREE.DynamicDrawUsage);
  trailGeo.setAttribute('position', posAttr);
  trailGeo.setAttribute('color', colAttr);
  trailGeo.setDrawRange(0, 0);

  // 关键：AdditiveBlending（叠加发光）+ 关闭深度写入
  const trailMat = new THREE.MeshBasicMaterial({
    vertexColors: true,
    blending: THREE.AdditiveBlending,
    transparent: true,
    depthWrite: false,
    depthTest: false,
    fog: true
  });

  const trailMesh = new THREE.Mesh(trailGeo, trailMat);
  trailMesh.frustumCulled = false;
  scene.add(trailMesh);

  /* ============================================================
   * 3. 光笔光标（一个发光的 Sprite，提示当前笔尖位置）
   * ============================================================ */
  function makeGlowTexture() {
    const S = 128;
    const cv = document.createElement('canvas');
    cv.width = cv.height = S;
    const ctx = cv.getContext('2d');
    const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    g.addColorStop(0.00, 'rgba(255,255,255,1)');
    g.addColorStop(0.22, 'rgba(255,255,255,0.6)');
    g.addColorStop(0.55, 'rgba(255,255,255,0.18)');
    g.addColorStop(1.00, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, S, S);
    const tex = new THREE.CanvasTexture(cv);
    tex.needsUpdate = true;
    return tex;
  }

  const penSprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: makeGlowTexture(),
    blending: THREE.AdditiveBlending,
    transparent: true,
    depthTest: false,
    depthWrite: false,
    color: 0x66ffff
  }));
  penSprite.scale.set(1.4, 1.4, 1);
  scene.add(penSprite);

  /* ============================================================
   * 4. 状态
   * ============================================================ */
  const points = [];                              // {x,y,z,age,power,hue}

  const penPos  = new THREE.Vector3(0, 0, -6);    // 光笔世界坐标（相机前方 6 单位）
  const penPrev = new THREE.Vector3(0, 0, -6);
  const penVel  = new THREE.Vector3();            // 光笔速度

  let hueCursor = 0.52;                           // 色相游标（从青色开始）

  /* ============================================================
   * 5. 传感器：DeviceOrientation（陀螺仪 / 方向）
   *    使用 Three.js 官方 DeviceOrientationControls 的四元数算法
   * ============================================================ */
  const targetQuat = new THREE.Quaternion();      // 目标朝向
  const _euler  = new THREE.Euler();
  const _q0     = new THREE.Quaternion();
  const _q1     = new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2); // 绕 X 轴 -90°
  const Z_AXIS  = new THREE.Vector3(0, 0, 1);

  let orientationSeen = false;
  let motionSeen      = false;

  function getScreenAngle() {
    if (screen.orientation && typeof screen.orientation.angle === 'number') {
      return screen.orientation.angle;
    }
    return window.orientation || 0;
  }

  function onDeviceOrientation(e) {
    if (e.alpha === null && e.beta === null && e.gamma === null) return;

    const alpha = THREE.MathUtils.degToRad(e.alpha || 0);
    const beta  = THREE.MathUtils.degToRad(e.beta  || 0);
    const gamma = THREE.MathUtils.degToRad(e.gamma || 0);
    const scrAng = THREE.MathUtils.degToRad(getScreenAngle());

    // 标准转换：先 YXZ 欧拉 → 再绕 X 轴 -90° 修正（手机竖屏看向前方）
    _euler.set(beta, alpha, -gamma, 'YXZ');
    targetQuat.setFromEuler(_euler);
    targetQuat.multiply(_q1);
    targetQuat.multiply(_q0.setFromAxisAngle(Z_AXIS, -scrAng));

    if (!orientationSeen) {
      // 首次直接对齐，避免从单位四元数慢慢转过来
      camera.quaternion.copy(targetQuat);
      orientationSeen = true;
    } else {
      orientationSeen = true;
    }
  }

  /* ============================================================
   * 6. 传感器：DeviceMotion（加速度）
   *    优先使用 e.acceleration（已去除重力）；
   *    若不支持则用 accelerationIncludingGravity 做低通滤波估重力再相减。
   * ============================================================ */
  const rawAccel     = new THREE.Vector3();   // 设备坐标系下的线性加速度
  const smoothAccel  = new THREE.Vector3();   // 平滑后的值
  const gravityEst   = new THREE.Vector3();
  let   gravityInit  = false;

  function onDeviceMotion(e) {
    const a = e.acceleration;

    if (a && (a.x !== null && a.x !== undefined)) {
      // 现代浏览器：直接拿到去重力加速度
      rawAccel.set(a.x || 0, a.y || 0, a.z || 0);
    } else {
      const ag = e.accelerationIncludingGravity;
      if (!ag) return;

      const x = ag.x || 0, y = ag.y || 0, z = ag.z || 0;

      if (!gravityInit) {
        gravityEst.set(x, y, z);
        gravityInit = true;
      }
      // 慢速低通 —— 估计重力方向（甩动属于高频，会被过滤掉）
      gravityEst.x += (x - gravityEst.x) * 0.08;
      gravityEst.y += (y - gravityEst.y) * 0.08;
      gravityEst.z += (z - gravityEst.z) * 0.08;

      rawAccel.set(x - gravityEst.x, y - gravityEst.y, z - gravityEst.z);
    }

    // 轻度平滑，抑制传感器噪声造成的抖动
    smoothAccel.lerp(rawAccel, 0.7);
    motionSeen = true;
  }

  /* ============================================================
   * 7. 降级方案：无传感器时用指针 / 手指拖拽绘制
   * ============================================================ */
  let usePointerFallback = false;
  let pointerActive = false;
  const pointerTarget = new THREE.Vector3();

  renderer.domElement.addEventListener('pointermove', function (e) {
    if (!usePointerFallback) return;
    pointerActive = true;

    const nx = (e.clientX / window.innerWidth) * 2 - 1;
    const ny = -(e.clientY / window.innerHeight) * 2 + 1;

    // 把屏幕坐标映射到相机前方 7 单位处的平面
    pointerTarget.set(nx * 5.5, ny * 4.0, -7)
                 .applyQuaternion(camera.quaternion);
  }, { passive: true });

  /* ============================================================
   * 8. 事件绑定 & 支持检测
   * ============================================================ */
  window.addEventListener('deviceorientation', onDeviceOrientation, false);
  window.addEventListener('devicemotion', onDeviceMotion, false);

  setTimeout(function () {
    if (orientationSeen || motionSeen) {
      hideToast();
      return;
    }
    // 完全没有任何传感器数据 → 进入触屏降级模式
    usePointerFallback = true;
    showToast(
      '未检测到设备传感器<br>' +
      '已切换为 <b>触屏模式</b>：用手指在屏幕上滑动即可绘制'
    );
  }, 2200);

  let toastHidden = false;
  function hideToast() {
    if (toastHidden) return;
    toastHidden = true;
    toastEl.classList.add('hide');
    setTimeout(function () { toastEl.style.display = 'none'; }, 700);
  }
  function showToast(html) {
    toastEl.innerHTML = html;
    toastEl.classList.remove('hide');
    toastEl.style.display = '';
    toastHidden = false;
  }

  /* ============================================================
   * 9. 相机更新：平滑跟随手机朝向
   * ============================================================ */
  function updateCamera(dt) {
    if (!orientationSeen) return;
    // 用半衰期公式做与帧率无关的平滑插值
    const k = 1 - Math.pow(0.5, dt / CFG.camSmooth);
    camera.quaternion.slerp(targetQuat, k);
  }

  /* ============================================================
   * 10. 光笔物理更新
   * ============================================================ */
  const worldAccel = new THREE.Vector3();

  function updatePen(dt) {
    /* ---------- 降级模式 ---------- */
    if (usePointerFallback) {
      if (pointerActive) {
        penPrev.copy(penPos);
        penPos.lerp(pointerTarget, 1 - Math.pow(0.0025, dt));
        penVel.subVectors(penPos, penPrev).divideScalar(Math.max(dt, 1e-4));
      } else {
        penVel.multiplyScalar(Math.pow(0.1, dt));
      }
      if (penVel.length() > CFG.maxSpeed) penVel.setLength(CFG.maxSpeed);
      return;
    }

    /* ---------- 传感器模式 ---------- */
    // 设备坐标系加速度 → 世界坐标系
    // （设备 +X=右、+Y=上、+Z=朝向用户，与 Three.js 相机局部坐标轴一致）
    worldAccel.copy(smoothAccel).applyQuaternion(camera.quaternion);

    const mag = worldAccel.length();
    const eff = Math.max(0, mag - CFG.accelDead);   // 死区

    if (eff > 0) {
      worldAccel.multiplyScalar(eff / mag);         // 归一化后按有效强度缩放
      // 甩得越猛，加速越明显（非线性放大）
      penVel.addScaledVector(
        worldAccel,
        dt * CFG.accelGain * (1 + eff * 0.18)
      );
    }

    // 阻尼：与帧率无关
    penVel.multiplyScalar(Math.pow(CFG.velDamp, dt));

    // 限速
    const sp = penVel.length();
    if (sp > CFG.maxSpeed) penVel.setLength(CFG.maxSpeed);

    // 积分得到位置
    penPos.addScaledVector(penVel, dt);

    // 软边界：超出范围后平滑拉回，形成「绕着某个中心游走」的纵深感
    const r = penPos.length();
    if (r > CFG.boundRadius) {
      const shrink = Math.pow(0.02, dt);
      const newR = CFG.boundRadius + (r - CFG.boundRadius) * shrink;
      penPos.multiplyScalar(newR / r);
    }
  }

  /* ============================================================
   * 11. 轨迹点维护（采样 + 老化淡出）
   * ============================================================ */
  function updateTrail(dt) {
    // 老化
    for (let i = 0; i < points.length; i++) points[i].age += dt;

    // 移除过期点（数组按时间顺序，所以从头部开始）
    while (points.length && points[0].age > CFG.pointLife) points.shift();

    // ---- 计算当前强度：速度 + 加速度共同决定 ----
    const speed = penVel.length();
    const accMag = usePointerFallback
      ? speed
      : Math.max(0, smoothAccel.length() - CFG.accelDead);

    let power = Math.max(speed / 4.5, accMag / 12);
    power = Math.min(1, Math.max(0.22, power));   // 限制在 0.22 ~ 1

    // ---- 是否追加新点 ----
    let shouldAdd = false;
    const last = points.length ? points[points.length - 1] : null;

    if (!last) {
      shouldAdd = true;
    } else {
      const dx = penPos.x - last.x;
      const dy = penPos.y - last.y;
      const dz = penPos.z - last.z;
      if (dx * dx + dy * dy + dz * dz > CFG.minSegDist * CFG.minSegDist) {
        shouldAdd = true;
      }
    }

    if (shouldAdd) {
      hueCursor = (hueCursor + 0.0055) % 1;   // 色相随轨迹缓慢流转
      points.push({
        x: penPos.x, y: penPos.y, z: penPos.z,
        age: 0,
        power: power,
        hue: hueCursor
      });
    }

    // 上限保护
    while (points.length > MAX_POINTS) points.shift();
  }

  /* ============================================================
   * 12. 构建轨迹网格（每帧重建顶点）
   * ============================================================ */
  let _vi = 0;

  const _v1   = new THREE.Vector3();
  const _v2   = new THREE.Vector3();
  const _dir  = new THREE.Vector3();
  const _mid  = new THREE.Vector3();
  const _side = new THREE.Vector3();
  const _colA = new THREE.Color();
  const _colB = new THREE.Color();

  function pushVert(px, py, pz, cr, cg, cb) {
    const o = _vi * 3;
    posArr[o]     = px; posArr[o + 1] = py; posArr[o + 2] = pz;
    colArr[o]     = cr; colArr[o + 1] = cg; colArr[o + 2] = cb;
    _vi++;
  }

  function buildTrailMesh() {
    _vi = 0;
    const n = points.length;

    for (let i = 0; i < n - 1; i++) {
      const a = points[i];
      const b = points[i + 1];

      // 淡出系数 × 强度
      const fa = Math.max(0, 1 - a.age / CFG.pointLife) * a.power;
      const fb = Math.max(0, 1 - b.age / CFG.pointLife) * b.power;
      if (fa <= 0.002 && fb <= 0.002) continue;

      _v1.set(a.x, a.y, a.z);
      _v2.set(b.x, b.y, b.z);

      _dir.subVectors(_v2, _v1);
      const len = _dir.length();
      if (len < 1e-6) continue;
      _dir.multiplyScalar(1 / len);

      // 线段中点（相机在原点，所以它同时也是「指向相机」的方向）
      _mid.addVectors(_v1, _v2).multiplyScalar(0.5);

      // 面向相机的带状方向 = dir × viewDir
      _side.crossVectors(_dir, _mid);
      if (_side.lengthSq() < 1e-10) {
        _side.set(0, 1, 0).cross(_dir);
        if (_side.lengthSq() < 1e-10) _side.set(1, 0, 0);
      }
      _side.normalize();

      // 宽度随强度变化 —— 甩得越猛越粗
      const pm = (fa + fb) * 0.5;
      const wScale = 0.55 + pm * 1.7;

      const gw = CFG.glowWidth * wScale;
      const cw = CFG.coreWidth * wScale;

      const gsx = _side.x * gw, gsy = _side.y * gw, gsz = _side.z * gw;
      const csx = _side.x * cw, csy = _side.y * cw, csz = _side.z * cw;

      // 霓虹色（高饱和 + 中亮 → 加法混合后极亮）
      _colA.setHSL(a.hue, 1.0, 0.5);
      _colB.setHSL(b.hue, 1.0, 0.5);

      const v1x = _v1.x, v1y = _v1.y, v1z = _v1.z;
      const v2x = _v2.x, v2y = _v2.y, v2z = _v2.z;

      /* ---------- 外发光四边形（宽、暗） ---------- */
      const GA = 0.20;
      const gar = _colA.r * GA * fa, gag = _colA.g * GA * fa, gab = _colA.b * GA * fa;
      const gbr = _colB.r * GA * fb, gbg = _colB.g * GA * fb, gbb = _colB.b * GA * fb;

      pushVert(v1x - gsx, v1y - gsy, v1z - gsz, gar, gag, gab);
      pushVert(v2x - gsx, v2y - gsy, v2z - gsz, gbr, gbg, gbb);
      pushVert(v2x + gsx, v2y + gsy, v2z + gsz, gbr, gbg, gbb);

      pushVert(v1x - gsx, v1y - gsy, v1z - gsz, gar, gag, gab);
      pushVert(v2x + gsx, v2y + gsy, v2z + gsz, gbr, gbg, gbb);
      pushVert(v1x + gsx, v1y + gsy, v1z + gsz, gar, gag, gab);

      /* ---------- 高亮芯线四边形（窄、偏白） ---------- */
      const car = (_colA.r * 0.6 + 0.4) * fa;
      const cag = (_colA.g * 0.6 + 0.4) * fa;
      const cab = (_colA.b * 0.6 + 0.4) * fa;
      const cbr = (_colB.r * 0.6 + 0.4) * fb;
      const cbg = (_colB.g * 0.6 + 0.4) * fb;
      const cbb = (_colB.b * 0.6 + 0.4) * fb;

      pushVert(v1x - csx, v1y - csy, v1z - csz, car, cag, cab);
      pushVert(v2x - csx, v2y - csy, v2z - csz, cbr, cbg, cbb);
      pushVert(v2x + csx, v2y + csy, v2z + csz, cbr, cbg, cbb);

      pushVert(v1x - csx, v1y - csy, v1z - csz, car, cag, cab);
      pushVert(v2x + csx, v2y + csy, v2z + csz, cbr, cbg, cbb);
      pushVert(v1x + csx, v1y + csy, v1z + csz, car, cag, cab);
    }

    trailGeo.setDrawRange(0, _vi);
    if (_vi > 0) {
      posAttr.needsUpdate = true;
      colAttr.needsUpdate = true;
    }
  }

  /* ============================================================
   * 13. 主循环
   * ============================================================ */
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);

    // 限制单帧步长，防止切后台回来后跳变
    const dt = Math.min(clock.getDelta(), 0.05);

    updateCamera(dt);      // 相机跟随手机朝向
    updatePen(dt);         // 光笔物理
    updateTrail(dt);       // 轨迹点采样 / 老化
    buildTrailMesh();      // 重建渲染网格

    // 光笔光标
    penSprite.position.copy(penPos);
    const spd = penVel.length();
    const sz = 1.1 + Math.min(spd * 0.12, 1.4);
    penSprite.scale.set(sz, sz, 1);
    penSprite.material.color.setHSL(hueCursor, 1.0, 0.62);

    renderer.render(scene, camera);
  }

  animate();

})();
</script>
