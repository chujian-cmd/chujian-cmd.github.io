<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>霓虹光绘 · Neon</title>
<style>
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  canvas { display: block; touch-action: none; }
  #hint {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 34px);
    transform: translateX(-50%);
    color: rgba(120, 255, 255, 0.7);
    font: 12px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    text-shadow: 0 0 12px rgba(0, 255, 255, 0.8);
    pointer-events: none; z-index: 10;
    letter-spacing: 0.1em; white-space: nowrap;
    transition: opacity 0.6s;
    animation: hb 3s ease-in-out infinite;
  }
  @keyframes hb { 0%,100%{opacity:.4} 50%{opacity:1} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">滑动屏幕 · 或甩动手机</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.140.0/build/three.min.js"></script>
<script>
(function () {
  'use strict';

  /* ============ 参数 ============ */
  const MAX_POINTS = 600;      // 轨迹最多保留点数
  const POINT_LIFE = 6.0;      // 每个点寿命（秒）
  const MIN_SEG    = 0.05;     // 相邻点最小间距
  const SHAKE_GAIN = 0.25;     // 摇动强度 → 光笔速度增益
  const SHAKE_DEAD = 0.5;      // 摇动死区（m/s²）
  const VEL_DAMP   = 0.3;      // 速度每秒保留比例
  const MAX_SPEED  = 22;
  const BOUND_MIN  = 3.5;      // 光笔距原点的最小半径
  const BOUND_MAX  = 11.0;     // 最大半径
  const CAM_SMOOTH = 0.10;     // 相机朝向平滑半衰期（秒）
  const GLOW_W = 0.09;         // 外发光宽度
  const CORE_W = 0.024;        // 芯线宽度

  /* ============ Three.js 基础 ============ */
  const canvas = document.getElementById('c');
  const hintEl = document.getElementById('hint');

  const renderer = new THREE.WebGLRenderer({
    canvas: canvas, antialias: true, alpha: false
  });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x000000, 1);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x000000, 0.018);

  const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 300);
  camera.position.set(0, 0, 0);

  addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  /* ============ 轨迹几何体 ============ */
  // 每条线段 12 个顶点：外发光四边形6 + 芯线四边形6
  const MAX_SEGS = MAX_POINTS - 1;
  const posArr = new Float32Array(MAX_SEGS * 12 * 3);
  const colArr = new Float32Array(MAX_SEGS * 12 * 3);

  const trailGeo = new THREE.BufferGeometry();
  const posAttr = new THREE.BufferAttribute(posArr, 3);
  const colAttr = new THREE.BufferAttribute(colArr, 3);
  posAttr.setUsage(THREE.DynamicDrawUsage);
  colAttr.setUsage(THREE.DynamicDrawUsage);
  trailGeo.setAttribute('position', posAttr);
  trailGeo.setAttribute('color', colAttr);
  trailGeo.setDrawRange(0, 0);

  const trailMesh = new THREE.Mesh(trailGeo, new THREE.MeshBasicMaterial({
    vertexColors: true,
    blending: THREE.AdditiveBlending,   // 霓虹发光的核心
    transparent: true,
    depthWrite: false,
    depthTest: false,
    fog: true
  }));
  trailMesh.frustumCulled = false;
  scene.add(trailMesh);

  /* ============ 光笔光标 ============ */
  function glowTexture() {
    const S = 128, cv = document.createElement('canvas');
    cv.width = cv.height = S;
    const g = cv.getContext('2d').createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.25, 'rgba(255,255,255,0.55)');
    g.addColorStop(0.6, 'rgba(255,255,255,0.12)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    const ctx = cv.getContext('2d');
    ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
    return new THREE.CanvasTexture(cv);
  }

  const penSprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexture(),
    blending: THREE.AdditiveBlending,
    transparent: true, depthTest: false, depthWrite: false,
    color: 0x66ffff
  }));
  penSprite.scale.set(1.2, 1.2, 1);
  scene.add(penSprite);

  /* ============ 光笔状态 ============ */
  const penPos  = new THREE.Vector3(0, 0, -6);  // 世界坐标
  const penPrev = new THREE.Vector3(0, 0, -6);
  const penVel  = new THREE.Vector3();          // 速度（世界空间）
  let hueCursor = 0.52;

  const points = [];   // {x,y,z,age,power,hue}

  /* ============ 相机四元数 ============ */
  const targetQuat = new THREE.Quaternion();
  const _euler = new THREE.Euler();
  const _q1 = new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2);
  const _qz = new THREE.Quaternion();
  const Z_AXIS = new THREE.Vector3(0, 0, 1);
  let orientReady = false;

  function screenAngle() {
    if (screen.orientation && typeof screen.orientation.angle === 'number')
      return screen.orientation.angle;
    return window.orientation || 0;
  }

  /* ---- 设备方向 → 相机朝向（Three.js 官方算法） ---- */
  function onOrientation(e) {
    if (e.alpha == null && e.beta == null && e.gamma == null) return;

    const a = THREE.MathUtils.degToRad(e.alpha || 0);
    const b = THREE.MathUtils.degToRad(e.beta  || 0);
    const g = THREE.MathUtils.degToRad(e.gamma || 0);
    const s = THREE.MathUtils.degToRad(screenAngle());

    _euler.set(b, a, -g, 'YXZ');
    targetQuat.setFromEuler(_euler);
    targetQuat.multiply(_q1);                                  // 相机看向屏幕前方
    targetQuat.multiply(_qz.setFromAxisAngle(Z_AXIS, -s));     // 屏幕方向修正

    if (!orientReady) {
      camera.quaternion.copy(targetQuat);   // 首次直接对齐
      orientReady = true;
    }
  }

  /* ============ 摇动 → 光笔速度 ============ */
  // 完全照抄"摇一摇"的思路：用 accelerationIncludingGravity 做相邻差分
  let lastAcc = null;
  const _tmp = new THREE.Vector3();

  function onMotion(e) {
    // 和摇一摇一样，优先用 accelerationIncludingGravity
    const ag = e.accelerationIncludingGravity || e.acceleration;
    if (!ag || ag.x == null || ag.y == null || ag.z == null) return;

    if (!lastAcc) {
      lastAcc = { x: ag.x, y: ag.y, z: ag.z };
      return;
    }

    const dx = ag.x - lastAcc.x;
    const dy = ag.y - lastAcc.y;
    const dz = ag.z - lastAcc.z;
    lastAcc.x = ag.x; lastAcc.y = ag.y; lastAcc.z = ag.z;

    const mag = Math.sqrt(dx*dx + dy*dy + dz*dz);
    if (mag < SHAKE_DEAD) return;   // 死区，过滤手抖

    // 设备空间 → 相机空间（Z 轴取反）→ 世界空间
    _tmp.set(dx, dy, -dz).applyQuaternion(camera.quaternion);

    // 强度 = 摇动幅度（上限 12），方向 = 摇动方向
    const power = Math.min(mag, 12) * SHAKE_GAIN;
    _tmp.normalize().multiplyScalar(power);
    penVel.add(_tmp);
  }

  /* ============ 传感器注册 + iOS 权限 ============ */
  let sensorBound = false;
  function bindSensors() {
    if (sensorBound) return;
    sensorBound = true;
    addEventListener('deviceorientation', onOrientation, true);
    addEventListener('devicemotion', onMotion, true);
  }

  function askPermission() {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().catch(function () {});
    }
    if (typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission().catch(function () {});
    }
  }

  // 加载时先绑一次（Android / 桌面直接可用）
  bindSensors();

  // 第一次触摸时再请求一次权限并重新绑定（iOS 13+ 需要用户手势）
  function firstTouchHandler() {
    askPermission();
    // 延迟一点再绑，确保权限回调已经执行
    setTimeout(bindSensors, 50);
    document.removeEventListener('touchstart', firstTouchHandler);
    document.removeEventListener('mousedown', firstTouchHandler);
  }
  document.addEventListener('touchstart', firstTouchHandler, { passive: true });
  document.addEventListener('mousedown', firstTouchHandler);

  /* ============ 触摸绘制 ============ */
  let touching = false;
  const touchTarget = new THREE.Vector3(0, 0, -7);

  function updateTouchTarget(clientX, clientY) {
    const nx = (clientX / innerWidth) * 2 - 1;
    const ny = -(clientY / innerHeight) * 2 + 1;

    // 映射到相机前方 7 单位处的平面（考虑 FOV 和宽高比）
    const dist = 7;
    const halfH = dist * Math.tan((camera.fov * Math.PI / 180) / 2);
    const halfW = halfH * camera.aspect;

    touchTarget.set(nx * halfW, ny * halfH, -dist)
               .applyQuaternion(camera.quaternion);
  }

  function onTouchStart(e) {
    e.preventDefault();
    if (hintEl) hintEl.style.opacity = '0';
    touching = true;
    const t = e.touches[0];
    updateTouchTarget(t.clientX, t.clientY);
    // 让光笔瞬间跳到手指位置（避免从远处飞过来）
    penPos.copy(touchTarget);
    penVel.set(0, 0, 0);
  }

  function onTouchMove(e) {
    e.preventDefault();
    if (!touching) return;
    const t = e.touches[0];
    updateTouchTarget(t.clientX, t.clientY);
  }

  function onTouchEnd(e) {
    e.preventDefault();
    touching = false;
  }

  canvas.addEventListener('touchstart',  onTouchStart, { passive: false });
  canvas.addEventListener('touchmove',   onTouchMove,  { passive: false });
  canvas.addEventListener('touchend',    onTouchEnd,   { passive: false });
  canvas.addEventListener('touchcancel', onTouchEnd,   { passive: false });

  // 桌面鼠标支持
  let mouseDown = false;
  canvas.addEventListener('mousedown', function (e) {
    if (hintEl) hintEl.style.opacity = '0';
    mouseDown = true;
    touching = true;
    updateTouchTarget(e.clientX, e.clientY);
    penPos.copy(touchTarget);
    penVel.set(0, 0, 0);
  });
  addEventListener('mousemove', function (e) {
    if (!mouseDown) return;
    updateTouchTarget(e.clientX, e.clientY);
  });
  addEventListener('mouseup', function () {
    mouseDown = false;
    touching = false;
  });

  /* ============ 光笔物理 ============ */
  function updatePen(dt) {
    if (touching) {
      // 触摸模式：光笔快速追向手指投影位置
      penPrev.copy(penPos);
      const k = 1 - Math.pow(0.0001, dt);
      penPos.lerp(touchTarget, k);
      penVel.subVectors(penPos, penPrev).divideScalar(Math.max(dt, 1e-4));
      return;
    }

    // 摇动模式：penVel 已由 onMotion 累积
    penVel.multiplyScalar(Math.pow(VEL_DAMP, dt));   // 阻尼

    const sp = penVel.length();
    if (sp > MAX_SPEED) penVel.setLength(MAX_SPEED);

    penPos.addScaledVector(penVel, dt);

    // 球形软边界：把光笔约束在相机周围的一个球壳里，
    // 这样无论相机怎么转，光笔都还在附近
    const r = penPos.length();
    if (r < 1e-4) return;
    if (r > BOUND_MAX) {
      const pull = (r - BOUND_MAX) * dt * 2.0;
      penPos.multiplyScalar(1 - pull / r);
    } else if (r < BOUND_MIN) {
      const push = (BOUND_MIN - r) * dt * 2.0;
      penPos.multiplyScalar(1 + push / r);
    }
  }

  /* ============ 轨迹采样 ============ */
  function updateTrail(dt) {
    for (let i = 0; i < points.length; i++) points[i].age += dt;
    while (points.length && points[0].age > POINT_LIFE) points.shift();

    const sp = penVel.length();
    let power = Math.min(1, Math.max(0.3, sp / 8));

    let add = false;
    const last = points.length ? points[points.length - 1] : null;
    if (!last) {
      add = true;
    } else {
      const dx = penPos.x - last.x;
      const dy = penPos.y - last.y;
      const dz = penPos.z - last.z;
      if (dx*dx + dy*dy + dz*dz > MIN_SEG * MIN_SEG) add = true;
    }

    if (add) {
      hueCursor = (hueCursor + 0.008) % 1;
      points.push({
        x: penPos.x, y: penPos.y, z: penPos.z,
        age: 0, power: power, hue: hueCursor
      });
    }

    while (points.length > MAX_POINTS) points.shift();
  }

  /* ============ 构建轨迹网格 ============ */
  let vi = 0;
  const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3();
  const _dir = new THREE.Vector3(), _mid = new THREE.Vector3(), _side = new THREE.Vector3();
  const _cA = new THREE.Color(), _cB = new THREE.Color();

  function pushVert(px, py, pz, r, g, b) {
    const o = vi * 3;
    posArr[o] = px; posArr[o+1] = py; posArr[o+2] = pz;
    colArr[o] = r;  colArr[o+1] = g;  colArr[o+2] = b;
    vi++;
  }

  function buildTrail() {
    vi = 0;
    const n = points.length;

    for (let i = 0; i < n - 1; i++) {
      const a = points[i], b = points[i + 1];
      const fa = Math.max(0, 1 - a.age / POINT_LIFE) * a.power;
      const fb = Math.max(0, 1 - b.age / POINT_LIFE) * b.power;
      if (fa < 0.003 && fb < 0.003) continue;

      _v1.set(a.x, a.y, a.z);
      _v2.set(b.x, b.y, b.z);
      _dir.subVectors(_v2, _v1);
      const len = _dir.length();
      if (len < 1e-6) continue;
      _dir.multiplyScalar(1 / len);

      // 面向相机的带状方向
      _mid.addVectors(_v1, _v2).multiplyScalar(0.5);
      _side.crossVectors(_dir, _mid);
      if (_side.lengthSq() < 1e-10) {
        _side.set(0, 1, 0).cross(_dir);
        if (_side.lengthSq() < 1e-10) _side.set(1, 0, 0);
      }
      _side.normalize();

      const pm = (fa + fb) * 0.5;
      const wS = 0.5 + pm * 1.9;      // 越亮越粗
      const gw = GLOW_W * wS, cw = CORE_W * wS;

      const gsx = _side.x * gw, gsy = _side.y * gw, gsz = _side.z * gw;
      const csx = _side.x * cw, csy = _side.y * cw, csz = _side.z * cw;

      _cA.setHSL(a.hue, 1.0, 0.5);
      _cB.setHSL(b.hue, 1.0, 0.5);

      const x1 = _v1.x, y1 = _v1.y, z1 = _v1.z;
      const x2 = _v2.x, y2 = _v2.y, z2 = _v2.z;

      // ---- 外发光四边形 ----
      const GA = 0.28;
      const ar = _cA.r*GA*fa, ag = _cA.g*GA*fa, ab = _cA.b*GA*fa;
      const br = _cB.r*GA*fb, bg = _cB.g*GA*fb, bb = _cB.b*GA*fb;

      pushVert(x1-gsx, y1-gsy, z1-gsz, ar, ag, ab);
      pushVert(x2-gsx, y2-gsy, z2-gsz, br, bg, bb);
      pushVert(x2+gsx, y2+gsy, z2+gsz, br, bg, bb);

      pushVert(x1-gsx, y1-gsy, z1-gsz, ar, ag, ab);
      pushVert(x2+gsx, y2+gsy, z2+gsz, br, bg, bb);
      pushVert(x1+gsx, y1+gsy, z1+gsz, ar, ag, ab);

      // ---- 高亮芯线 ----
      const cr = (_cA.r*0.55 + 0.45)*fa, cg = (_cA.g*0.55 + 0.45)*fa, cb = (_cA.b*0.55 + 0.45)*fa;
      const dr = (_cB.r*0.55 + 0.45)*fb, dg = (_cB.g*0.55 + 0.45)*fb, db = (_cB.b*0.55 + 0.45)*fb;

      pushVert(x1-csx, y1-csy, z1-csz, cr, cg, cb);
      pushVert(x2-csx, y2-csy, z2-csz, dr, dg, db);
      pushVert(x2+csx, y2+csy, z2+csz, dr, dg, db);

      pushVert(x1-csx, y1-csy, z1-csz, cr, cg, cb);
      pushVert(x2+csx, y2+csy, z2+csz, dr, dg, db);
      pushVert(x1+csx, y1+csy, z1+csz, cr, cg, cb);
    }

    trailGeo.setDrawRange(0, vi);
    if (vi > 0) {
      posAttr.needsUpdate = true;
      colAttr.needsUpdate = true;
    }
  }

  /* ============ 主循环 ============ */
  const clock = new THREE.Clock();

  function loop() {
    requestAnimationFrame(loop);

    const dt = Math.min(clock.getDelta(), 0.05);

    // 相机平滑跟随手机朝向
    if (orientReady) {
      const k = 1 - Math.pow(0.5, dt / CAM_SMOOTH);
      camera.quaternion.slerp(targetQuat, k);
    }

    updatePen(dt);
    updateTrail(dt);
    buildTrail();

    // 光标
    penSprite.position.copy(penPos);
    const sp = penVel.length();
    const sz = 1.0 + Math.min(sp * 0.1, 1.0);
    penSprite.scale.set(sz, sz, 1);
    penSprite.material.color.setHSL(hueCursor, 1, 0.65);

    renderer.render(scene, camera);
  }

  loop();

})();
</script>
</body>
</html>
