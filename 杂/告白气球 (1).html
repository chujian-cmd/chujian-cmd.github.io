<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>告白气球 · 手账播放器</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Quicksand:wght@400;500;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #1e1a17;
            background-image: radial-gradient(circle at 20% 30%, rgba(210, 180, 140, 0.08) 0%, transparent 30%),
                radial-gradient(circle at 85% 70%, rgba(180, 140, 100, 0.06) 0%, transparent 35%);
            display: flex; justify-content: center; align-items: center;
            font-family: 'Quicksand', 'Noto Serif SC', serif; padding: 24px;
        }
        .player {
            width: 100%; max-width: 960px; background: #2a2421;
            border-radius: 28px 8px 28px 8px;
            box-shadow: 0 24px 48px -12px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,235,200,0.06);
            display: flex; flex-wrap: wrap; overflow: hidden; border: 1px solid #3d332e;
        }
        .left-panel {
            flex: 0 0 340px; background: #211d1a; padding: 32px 24px 28px;
            display: flex; flex-direction: column; border-right: 1px dashed #3d332e;
        }
        .cover-wrap { position: relative; width: 100%; aspect-ratio: 1/1; margin-bottom: 28px; }
        .cover-art {
            width: 100%; height: 100%; border-radius: 2px 16px 2px 16px;
            background: linear-gradient(145deg, #4d3e34 0%, #2f2621 100%);
            box-shadow: 6px 6px 0 #151210, inset 0 0 0 1px rgba(220,190,150,0.15);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            overflow: hidden; position: relative;
        }
        .balloon {
            position: absolute; width: 60px; height: 70px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            background: radial-gradient(circle at 30% 30%, #e8d5b5, #b89a7a);
            opacity: 0.25; transform: rotate(-15deg); top: 20%; left: 15%;
        }
        .balloon::after {
            content: ''; position: absolute; bottom: -18px; left: 50%;
            width: 1px; height: 24px; background: rgba(220,190,150,0.25); transform: translateX(-50%);
        }
        .balloon2 {
            width: 42px; height: 50px; top: 60%; left: 65%; transform: rotate(25deg);
            opacity: 0.18; background: radial-gradient(circle at 40% 30%, #f0e0c8, #c4a882);
        }
        .cover-title { position: relative; z-index: 2; text-align: center; color: #f0e6d8; }
        .cover-title h1 {
            font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 2rem;
            letter-spacing: 6px; margin-bottom: 6px; text-shadow: 2px 2px 0 #1a1614;
        }
        .cover-title span {
            font-family: 'Quicksand', sans-serif; font-size: 0.75rem;
            letter-spacing: 4px; color: #b8a48c; text-transform: uppercase;
        }
        .controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 24px; }
        .ctrl-btn {
            background: none; border: 1.5px solid #52453c; color: #d9c9b6;
            width: 48px; height: 48px; border-radius: 50%; cursor: pointer;
            display: flex; justify-content: center; align-items: center; transition: all 0.2s ease;
        }
        .ctrl-btn:hover { background: #3d332e; color: #fff6e6; border-color: #8a7868; }
        .ctrl-btn:disabled { opacity: 0.3; cursor: default; }
        .ctrl-btn:disabled:hover { background: none; color: #d9c9b6; border-color: #52453c; }
        .ctrl-btn.play {
            width: 64px; height: 64px; background: #d9c9b6; color: #211d1a;
            border: none; box-shadow: 0 4px 0 #8a7868;
        }
        .ctrl-btn.play:hover { background: #f0e6d8; box-shadow: 0 4px 0 #a8947c; }
        .ctrl-btn.play:active { transform: translateY(2px); box-shadow: 0 2px 0 #8a7868; }
        .ctrl-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .ctrl-btn.play svg { width: 28px; height: 28px; }
        .progress-area { width: 100%; margin-top: 8px; }
        .time-display {
            display: flex; justify-content: space-between; color: #7a6b5e;
            font-size: 0.7rem; font-family: 'Quicksand', monospace;
            letter-spacing: 1px; margin-bottom: 6px;
        }
        .progress-bar-bg {
            width: 100%; height: 3px; background: #3d332e; border-radius: 2px;
            cursor: pointer; position: relative;
        }
        .progress-fill {
            width: 0%; height: 100%; background: #b89a7a; border-radius: 2px;
            position: relative; transition: width 0.1s linear;
        }
        .progress-fill::after {
            content: ''; position: absolute; right: -4px; top: -3.5px;
            width: 10px; height: 10px; background: #d9c9b6; border-radius: 50%;
            box-shadow: 0 0 0 2px #211d1a; opacity: 0; transition: opacity 0.15s;
        }
        .progress-bar-bg:hover .progress-fill::after { opacity: 1; }
        .right-panel {
            flex: 1; min-width: 300px; padding: 32px 28px 28px;
            display: flex; flex-direction: column; background: #2a2421;
        }
        .lyrics-header {
            display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px;
            border-bottom: 1px dashed #4d3e34; padding-bottom: 12px;
        }
        .lyrics-header .label {
            font-family: 'Quicksand', sans-serif; font-size: 0.65rem;
            letter-spacing: 3px; color: #8a7868; text-transform: uppercase;
        }
        .lyrics-header .song-info {
            font-family: 'Noto Serif SC', serif; font-size: 0.9rem;
            color: #c4b09a; margin-left: auto;
        }
        .lyrics-scroll {
            flex: 1; overflow-y: auto; max-height: 380px; padding-right: 8px;
            scrollbar-width: thin; scrollbar-color: #4d3e34 transparent;
        }
        .lyrics-scroll::-webkit-scrollbar { width: 3px; }
        .lyrics-scroll::-webkit-scrollbar-thumb { background: #4d3e34; border-radius: 3px; }
        .lyric-line {
            font-family: 'Noto Serif SC', serif; font-size: 0.95rem;
            line-height: 2.2; color: #7a6b5e; transition: color 0.2s, font-weight 0.2s;
            padding: 1px 0;
        }
        .lyric-line.active {
            color: #f0e6d8; font-weight: 600;
            text-shadow: 0 0 20px rgba(220,190,150,0.15);
        }
        .player.playing .cover-art { animation: subtle-pulse 3s ease-in-out infinite; }
        @keyframes subtle-pulse {
            0%, 100% { box-shadow: 6px 6px 0 #151210, inset 0 0 0 1px rgba(220,190,150,0.15); }
            50% { box-shadow: 6px 6px 0 #151210, inset 0 0 0 1px rgba(220,190,150,0.3); }
        }
        @media (max-width: 720px) {
            .player { flex-direction: column; border-radius: 20px 6px 20px 6px; }
            .left-panel { flex: auto; border-right: none; border-bottom: 1px dashed #3d332e; padding: 24px 20px; }
            .cover-wrap { max-width: 220px; margin: 0 auto 20px; }
            .right-panel { padding: 20px; }
            .lyrics-scroll { max-height: 260px; }
        }
    </style>
</head>
<body>
    <div class="player" id="player">
        <div class="left-panel">
            <div class="cover-wrap">
                <div class="cover-art">
                    <div class="balloon"></div>
                    <div class="balloon balloon2"></div>
                    <div class="cover-title">
                        <h1>告白气球</h1>
                        <span>周杰伦 · 2016</span>
                    </div>
                </div>
            </div>
            <div class="controls">
                <button class="ctrl-btn" disabled title="上一首">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="ctrl-btn play" id="playBtn" title="播放/暂停">
                    <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="ctrl-btn" disabled title="下一首">
                    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
            <div class="progress-area">
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
                <div class="progress-bar-bg" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </div>
        <div class="right-panel">
            <div class="lyrics-header">
                <span class="label">LYRICS</span>
                <span class="song-info">词：方文山 / 曲：周杰伦</span>
            </div>
            <div class="lyrics-scroll" id="lyricsScroll"></div>
        </div>
    </div>

    <!-- 音源：你提供的网易云临时直链（有时效，过期需重新抓取） -->
    <audio id="audio" preload="metadata" src="http://m701.music.126.net/20261024111759/65a10cb142ad6560f994e4060a80146a/jdymusic/obj/wo3DlMOGwrbDjj7DisKw/83120593556/81cd/117b/8f43/25c9cf65a502e966a4ba9eb49380ef41.mp3?vuutv=nfCVJQ4y3QVVC9cg5SdXx8NLq9i4ojzUJ+TjXNL/po2s36A9CFOBNrYZHzql0VolZhZBfyHraoUKChDPDmBaoRgesbGWMEPoyz4A72ZdREuTjuNa2TCcymDmYkTRU0mOzm9QgNU6OmZiRd0a58kcAA==&cdntag=bWFyaz1vc193ZWIscXVhbGl0eV9zdGFuZGFyZA"></audio>

    <script>
        (function(){
            const audio = document.getElementById('audio');
            const playBtn = document.getElementById('playBtn');
            const playIcon = document.getElementById('playIcon');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const currentTimeEl = document.getElementById('currentTime');
            const durationEl = document.getElementById('duration');
            const lyricsScroll = document.getElementById('lyricsScroll');
            const player = document.getElementById('player');

            const lyricsData = [
                { time: 0, text: "告白气球 - 周杰伦" },
                { time: 0, text: "作词 : 方文山" },
                { time: 1, text: "作曲 : 方文山" },
                { time: 23.929, text: "塞纳河畔 左岸的咖啡" },
                { time: 26.598, text: "我手一杯 品尝你的美" },
                { time: 29.630, text: "留下唇印的嘴" },
                { time: 34.677, text: "花店玫瑰 名字写错谁" },
                { time: 37.269, text: "告白气球 风吹到对街" },
                { time: 40.333, text: "微笑在天上飞" },
                { time: 44.444, text: "你说你有点难追" },
                { time: 46.768, text: "想让我知难而退" },
                { time: 49.541, text: "礼物不需挑最贵" },
                { time: 52.243, text: "只要香榭的落叶" },
                { time: 55.483, text: "喔 营造浪漫的约会" },
                { time: 57.552, text: "不害怕搞砸一切" },
                { time: 60.269, text: "拥有你就拥有全世界" },
                { time: 65.369, text: "亲爱的 爱上你" },
                { time: 68.513, text: "从那天起" },
                { time: 71.929, text: "甜蜜的很轻易" },
                { time: 75.896, text: "亲爱的 别任性" },
                { time: 79.328, text: "你的眼睛" },
                { time: 82.178, text: "在说我愿意" },
                { time: 109.750, text: "塞纳河畔 左岸的咖啡" },
                { time: 112.161, text: "我手一杯 品尝你的美" },
                { time: 114.870, text: "留下唇印的嘴" },
                { time: 119.910, text: "花店玫瑰 名字写错谁" },
                { time: 122.564, text: "告白气球 风吹到对街" },
                { time: 125.830, text: "微笑在天上飞" },
                { time: 129.592, text: "你说你有点难追" },
                { time: 132.065, text: "想让我知难而退" },
                { time: 134.782, text: "礼物不需挑最贵" },
                { time: 137.483, text: "只要香榭的落叶" },
                { time: 140.254, text: "喔 营造浪漫的约会" },
                { time: 142.885, text: "不害怕搞砸一切" },
                { time: 145.679, text: "拥有你就拥有 全世界" },
                { time: 151.474, text: "亲爱的 爱上你" },
                { time: 153.959, text: "从那天起" },
                { time: 157.394, text: "甜蜜的很轻易" },
                { time: 162.249, text: "亲爱的 别任性" },
                { time: 164.685, text: "你的眼睛" },
                { time: 167.545, text: "在说我愿意" },
                { time: 172.216, text: "亲爱的 爱上你" },
                { time: 175.742, text: "恋爱日记" },
                { time: 178.362, text: "飘香水的回忆" },
                { time: 182.610, text: "一整瓶 的梦境" },
                { time: 185.814, text: "全都有你" },
                { time: 188.744, text: "搅拌在一起" },
                { time: 193.388, text: "亲爱的别任性" },
                { time: 196.600, text: "你的眼睛" },
                { time: 201.152, text: "在说我愿意" }
            ];

            function renderLyrics() {
                lyricsScroll.innerHTML = '';
                lyricsData.forEach((item) => {
                    const div = document.createElement('div');
                    div.className = 'lyric-line';
                    div.dataset.time = item.time;
                    div.textContent = item.text;
                    lyricsScroll.appendChild(div);
                });
            }

            function formatTime(sec) {
                if (isNaN(sec) || sec < 0) return '0:00';
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            }

            let activeIndex = -1;
            function highlightLyric(currentTime) {
                let newIndex = -1;
                for (let i = 0; i < lyricsData.length; i++) {
                    if (currentTime >= lyricsData[i].time - 0.3) newIndex = i;
                    else break;
                }
                if (newIndex === activeIndex) return;
                activeIndex = newIndex;
                const lines = lyricsScroll.querySelectorAll('.lyric-line');
                lines.forEach((line, idx) => line.classList.toggle('active', idx === newIndex));
                if (newIndex >= 0 && lines[newIndex]) {
                    const container = lyricsScroll;
                    const line = lines[newIndex];
                    const cr = container.getBoundingClientRect();
                    const lr = line.getBoundingClientRect();
                    if (lr.top < cr.top + 60 || lr.bottom > cr.bottom - 60) {
                        line.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            }

            const SVG_PLAY = '<path d="M8 5v14l11-7z"/>';
            const SVG_PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

            function togglePlay() {
                if (audio.paused) {
                    audio.play().catch(e => console.warn('播放失败，链接可能已过期或跨域受限', e));
                    playIcon.innerHTML = SVG_PAUSE;
                    player.classList.add('playing');
                } else {
                    audio.pause();
                    playIcon.innerHTML = SVG_PLAY;
                    player.classList.remove('playing');
                }
            }

            function updateProgress() {
                const ct = audio.currentTime;
                const dur = audio.duration || 0;
                if (dur > 0) progressFill.style.width = (ct / dur) * 100 + '%';
                currentTimeEl.textContent = formatTime(ct);
                if (dur > 0 && !isNaN(dur)) durationEl.textContent = formatTime(dur);
                highlightLyric(ct);
            }

            function seek(e) {
                const rect = progressBar.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const percent = Math.max(0, Math.min(1, x / rect.width));
                if (audio.duration) {
                    audio.currentTime = percent * audio.duration;
                    updateProgress();
                }
            }

            function init() {
                renderLyrics();
                audio.addEventListener('timeupdate', updateProgress);
                audio.addEventListener('loadedmetadata', () => durationEl.textContent = formatTime(audio.duration));
                audio.addEventListener('ended', () => {
                    playIcon.innerHTML = SVG_PLAY;
                    player.classList.remove('playing');
                    progressFill.style.width = '0%';
                    audio.currentTime = 0;
                    activeIndex = -1;
                    highlightLyric(0);
                });
                audio.addEventListener('error', () => {
                    durationEl.textContent = '—:—';
                    console.warn('音频加载失败，链接可能已过期。');
                });
                playBtn.addEventListener('click', togglePlay);
                progressBar.addEventListener('click', seek);
                if (audio.readyState >= 1) durationEl.textContent = formatTime(audio.duration);
                highlightLyric(0);
            }

            init();
        })();
    </script>
</body>
</html>
