<script>
    // ============================================================
    // 核心：LaTeX \rlap 拼图解析器 → HTML Canvas
    // ============================================================

    function parseLatexRlap(text) {
        const blocks = [];
        // 匹配所有 \rlap{...}
        const regex = /\\rlap\{([^}]*)\}/g;
        let match;
        while ((match = regex.exec(text)) !== null) {
            const content = match[1];
            const kernMatch = content.match(/\\kern\{([^}]*)\}/);
            const raiseMatch = content.match(/\\raisebox\{([^}]*)\}/);
            const colorMatch = content.match(/\\textcolor\{([^}]*)\}/);
            const ruleMatch = content.match(/\\rule\{([^}]*)\}\{([^}]*)\}/);

            if (kernMatch && raiseMatch && colorMatch && ruleMatch) {
                blocks.push({
                    x: parseFloat(kernMatch[1]),
                    y: parseFloat(raiseMatch[1]),
                    color: colorMatch[1],
                    w: parseFloat(ruleMatch[1]),
                    h: parseFloat(ruleMatch[2])
                });
            }
        }
        return blocks;
    }

    function convert() {
        const input = document.getElementById('latexInput').value;
        const preview = document.getElementById('preview');
        const pixelCount = document.getElementById('pixelCount');
        const legend = document.getElementById('legend');

        const blocks = parseLatexRlap(input);

        if (blocks.length === 0) {
            preview.innerHTML = `<div class="error-msg">⚠️ 未找到有效的 \rlap 命令<br><span style="font-size:13px;color:#94a3b8;">请确保代码包含：\rlap{\kern{...}\raisebox{...}\textcolor{...}{\rule{...}{...}}}</span></div>`;
            pixelCount.textContent = '0 个方块';
            legend.innerHTML = '';
            return;
        }

        // 计算边界
        let minX = Infinity,
            maxX = -Infinity,
            minY = Infinity,
            maxY = -Infinity;
        blocks.forEach(b => {
            if (b.x < minX) minX = b.x;
            if (b.x + b.w > maxX) maxX = b.x + b.w;
            if (b.y < minY) minY = b.y;
            if (b.y + b.h > maxY) maxY = b.y + b.h;
        });

        const padding = 0.5;
        minX -= padding;
        maxX += padding;
        minY -= padding;
        maxY += padding;

        const rangeX = maxX - minX;
        const rangeY = maxY - minY;

        const maxSize = 600;
        const scale = Math.min(maxSize / rangeX, maxSize / rangeY, 50);
        const canvasW = Math.ceil(rangeX * scale);
        const canvasH = Math.ceil(rangeY * scale);

        const canvas = document.createElement('canvas');
        canvas.width = canvasW;
        canvas.height = canvasH;
        const ctx = canvas.getContext('2d');

        ctx.clearRect(0, 0, canvasW, canvasH);

        blocks.forEach(b => {
            const x = (b.x - minX) * scale;
            const y = (maxY - (b.y + b.h)) * scale;
            const w = Math.max(1, b.w * scale);
            const h = Math.max(1, b.h * scale);

            let color = b.color;
            if (color.startsWith('#')) {
                // 已经是十六进制
            } else if (color.match(/^[0-9a-fA-F]{6}$/)) {
                color = '#' + color;
            } else {
                const colorMap = {
                    'red': '#ff0000',
                    'green': '#00ff00',
                    'blue': '#0000ff',
                    'black': '#000000',
                    'white': '#ffffff',
                    'brown': '#8b4513',
                    'yellow': '#ffff00',
                    'orange': '#ff8800',
                    'purple': '#8800ff',
                    'pink': '#ff69b4',
                    'gray': '#808080',
                    'cyan': '#00ffff',
                    'magenta': '#ff00ff',
                    'lime': '#00ff00',
                    'maroon': '#800000',
                    'navy': '#000080',
                    'olive': '#808000',
                    'teal': '#008080',
                    'silver': '#c0c0c0',
                    'gold': '#ffd700'
                };
                const lower = color.toLowerCase();
                color = colorMap[lower] || '#ff00ff';
            }

            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
        });

        preview.innerHTML = '';
        preview.appendChild(canvas);

        pixelCount.textContent = blocks.length + ' 个方块';

        // 图例（最多显示8种颜色）
        const colorSet = [];
        const seen = new Set();
        blocks.forEach(b => {
            if (!seen.has(b.color) && colorSet.length < 8) {
                seen.add(b.color);
                colorSet.push(b.color);
            }
        });
        let legendHTML = '';
        colorSet.forEach(c => {
            let displayColor = c;
            if (c.startsWith('#')) displayColor = c;
            else if (c.match(/^[0-9a-fA-F]{6}$/)) displayColor = '#' + c;
            else displayColor = c;
            legendHTML += `<span class="legend-item">
                        <span class="legend-color" style="background:${displayColor};"></span>
                        ${c.length > 12 ? c.slice(0,10)+'…' : c}
                    </span>`;
        });
        legend.innerHTML = legendHTML || '无颜色信息';
    }

    // ============================================================
    // 文件上传
    // ============================================================

    function handleFile(event) {
        const file = event.target.files[0];
        const status = document.getElementById('fileStatus');

        if (!file) {
            status.innerHTML = `<span style="color:#64748b;">📄 未选择</span>`;
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const content = e.target.result;
            document.getElementById('latexInput').value = content;
            status.innerHTML = `📄 <span class="filename">${file.name}</span> ✅ 已加载`;
            convert();
        };
        reader.onerror = function() {
            status.innerHTML = `<span style="color:#ef4444;">❌ 读取失败</span>`;
            alert('文件读取失败，请重试');
        };
        reader.readAsText(file, 'UTF-8');
    }

    // ============================================================
    // 清空
    // ============================================================

    function clearAll() {
        document.getElementById('latexInput').value = '';
        document.getElementById('fileStatus').innerHTML = `<span style="color:#64748b;">📄 已清空</span>`;
        document.getElementById('fileInput').value = '';
        document.getElementById('preview').innerHTML = `<span class="empty-hint">📢 输入代码后点击「转换」</span>`;
        document.getElementById('pixelCount').textContent = '0 个方块';
        document.getElementById('legend').innerHTML = '';
    }
