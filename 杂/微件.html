<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玻璃质感 · 仪表板</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #4facfe;
      --accent: #00f2fe;
      --glass-border: rgba(255, 255, 255, 0.14);
      --text: #eaf6ff;
      --subtext: #91a4b8;
    }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, 'Segoe UI', 'Cascadia Code', monospace;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(79, 172, 254, 0.45), transparent 28%),
        radial-gradient(circle at 90% 20%, rgba(0, 242, 254, 0.35), transparent 32%),
        linear-gradient(135deg, #050a18 0%, #081229 45%, #050c22 100%);
      background-attachment: fixed;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app {
      max-width: 720px;
      width: 100%;
      flex: 1;
    }

    .hero {
      text-align: center;
      margin-bottom: 24px;
    }

    .hero h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ffffff, #a8d8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      color: var(--subtext);
      margin-top: 8px;
      font-size: 14px;
    }

    /* 标签栏 */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 18px;
      padding: 6px;
      border: 1px solid var(--glass-border);
    }

    .tab-btn {
      flex: 1;
      border: none;
      border-radius: 14px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      color: var(--subtext);
      font-family: inherit;
      backdrop-filter: blur(4px);
      text-align: center;
      transition: 0.25s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(79, 172, 254, 0.25), rgba(0, 242, 254, 0.15));
      color: #fff;
      border: 1px solid rgba(79, 172, 254, 0.25);
      box-shadow: 0 2px 12px rgba(79, 172, 254, 0.15);
    }

    .tab-btn:hover:not(.active) {
      color: #c8dfff;
      background: rgba(255, 255, 255, 0.04);
    }

    .page {
      display: none;
      animation: fade 0.35s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fade {
      0% { opacity: 0.3; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* 卡片 */
    .card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      padding: 16px 18px;
      margin-bottom: 12px;
      transition: all 0.2s;
    }

    .card-label {
      font-size: 12px;
      color: var(--subtext);
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-label span {
      color: var(--primary);
      font-weight: 500;
    }

    .widget-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .widget-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 14px 16px;
      cursor: grab;
      transition: 0.2s;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }

    .widget-item:hover {
      background: rgba(79, 172, 254, 0.10);
      border-color: rgba(79, 172, 254, 0.25);
    }

    .widget-item.dragging {
      opacity: 0.4;
      transform: scale(0.98);
    }

    .widget-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--subtext);
    }

    .widget-header .widget-title {
      color: var(--text);
      font-weight: 500;
    }

    .widget-actions button {
      background: transparent;
      border: none;
      color: var(--subtext);
      cursor: pointer;
      font-size: 14px;
      padding: 0 4px;
      transition: 0.2s;
    }

    .widget-actions button:hover {
      color: #ff7b7b;
    }

    .widget-content {
      font-size: 15px;
      line-height: 1.5;
      color: #d6eaff;
    }

    .widget-content .motto-text {
      font-style: italic;
      font-size: 17px;
      background: linear-gradient(135deg, #d6eaff, #a8d8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .widget-content .clock-display {
      font-size: 26px;
      font-weight: 300;
      letter-spacing: 2px;
      font-feature-settings: "tnum";
    }

    .widget-content .date-display {
      font-size: 14px;
      color: var(--subtext);
    }

    .widget-content .weather-temp {
      font-size: 22px;
      font-weight: 400;
    }

    .widget-content .todo-list {
      list-style: none;
      padding: 0;
      margin: 4px 0 0;
    }

    .widget-content .todo-list li {
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex;
      justify-content: space-between;
      font-size: 14px;
    }

    .widget-content .todo-list li:last-child {
      border-bottom: none;
    }

    .add-widget-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .btn {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: #eaf6ff;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.05));
      font-family: inherit;
      backdrop-filter: blur(4px);
      transition: 0.2s;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: rgba(79, 172, 254, 0.35);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.08));
    }

    .btn-danger {
      border-color: rgba(255, 107, 107, 0.25);
      color: #ff7b7b;
    }

    .btn-danger:hover {
      border-color: #ff7b7b;
      background: rgba(255, 107, 107, 0.12);
    }

    select {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #eaf6ff;
      padding: 6px 10px;
      font-size: 13px;
      font-family: inherit;
      backdrop-filter: blur(4px);
    }

    select:focus {
      outline: none;
      border-color: rgba(79, 172, 254, 0.35);
    }

    .footer {
      text-align: center;
      padding: 20px 0 10px 0;
      color: var(--subtext);
      font-size: 14px;
      opacity: 0.7;
      letter-spacing: 1px;
      font-weight: 300;
      width: 100%;
      max-width: 720px;
    }

    .footer span {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 500;
    }

    .empty-hint {
      color: var(--subtext);
      opacity: 0.5;
      padding: 12px 0;
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .app { max-width: 100%; }
      .hero h1 { font-size: 22px; }
      .widget-content .clock-display { font-size: 22px; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="hero">
    <h1>✦ 微件仪表板</h1>
    <p>座右铭 · 时间 · 可定制微件</p>
  </div>

  <!-- 标签 -->
  <div class="tabs">
    <button class="tab-btn active" data-page="page1">仪表板</button>
    <button class="tab-btn" data-page="page2">管理</button>
  </div>

  <!-- ===== 页面一：仪表板 ===== -->
  <div id="page1" class="page active">
    <div class="card">
      <div class="card-label"><span>⏳ 座右铭</span> 每日一句</div>
      <div class="widget-content" id="mottoDisplay">
        <span class="motto-text">“ 生活明朗，万物可爱 ”</span>
      </div>
    </div>

    <div class="card" id="widgetContainer">
      <div class="card-label"><span>🧩 微件</span> 拖拽排序 · 自由增减</div>
      <div class="widget-grid" id="widgetGrid">
        <!-- 动态渲染微件 -->
      </div>
      <div class="add-widget-bar">
        <select id="widgetSelector">
          <option value="clock">🕒 时钟</option>
          <option value="weather">🌤️ 天气</option>
          <option value="calendar">📅 日历</option>
          <option value="todo">📋 待办</option>
        </select>
        <button class="btn" id="addWidgetBtn">＋ 添加微件</button>
        <button class="btn btn-danger" id="resetWidgetsBtn">⟲ 重置</button>
      </div>
    </div>
  </div>

  <!-- ===== 页面二：管理 ===== -->
  <div id="page2" class="page">
    <div class="card">
      <div class="card-label"><span>⚙️ 微件管理</span> 当前微件列表</div>
      <div id="manageList" style="display:flex; flex-direction:column; gap:6px; min-height:60px;">
        <!-- 动态渲染管理列表 -->
      </div>
      <div style="margin-top:12px; color:var(--subtext); font-size:13px;">
        💡 在仪表板页面拖拽微件可调整顺序
      </div>
    </div>
  </div>
</div>

<div class="footer">
  <span>by 初见.</span> · 外部数据驱动
</div>

<script>
  (function() {
    // ---------- 外部数据 ----------
    const MOTTO_API = 'https://api.btstu.cn/yan/api.php?charset=utf-8&encode=json'; // 返回 { text, author }
    // 备用座右铭
    const FALLBACK_MOTTOS = [
      '生活明朗，万物可爱',
      '凡心所向，素履以往',
      '行而不辍，未来可期',
      '心中有丘壑，眉目作山河',
      '既见君子，云胡不喜'
    ];

    // ---------- 状态 ----------
    let widgets = [];            // { id, type, data? }
    let nextId = 1;
    let currentMotto = '加载中……';

    // DOM 引用
    const grid = document.getElementById('widgetGrid');
    const manageList = document.getElementById('manageList');
    const mottoDisplay = document.getElementById('mottoDisplay');
    const widgetSelector = document.getElementById('widgetSelector');
    const addBtn = document.getElementById('addWidgetBtn');
    const resetBtn = document.getElementById('resetWidgetsBtn');

    // ---------- 辅助函数 ----------
    function generateId() { return nextId++; }

    // 获取座右铭（外部）
    async function fetchMotto() {
      try {
        const resp = await fetch(MOTTO_API);
        if (!resp.ok) throw new Error('API 状态异常');
        const data = await resp.json();
        // 接口返回格式: { text: '...', author: '...' }
        if (data && data.text) {
          currentMotto = data.text;
          return data.text;
        } else {
          throw new Error('无效数据');
        }
      } catch (e) {
        // 降级：随机备用
        const fallback = FALLBACK_MOTTOS[Math.floor(Math.random() * FALLBACK_MOTTOS.length)];
        currentMotto = fallback;
        return fallback;
      }
    }

    // 更新座右铭显示
    function updateMottoDisplay(text) {
      mottoDisplay.innerHTML = `<span class="motto-text">“ ${text} ”</span>`;
    }

    // ---------- 微件渲染函数 ----------
    function renderWidget(widget) {
      const div = document.createElement('div');
      div.className = 'widget-item';
      div.dataset.id = widget.id;
      div.draggable = true;

      let contentHtml = '';
      const type = widget.type;

      // 根据类型生成内容
      if (type === 'clock') {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false });
        const dateStr = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
        contentHtml = `
          <div class="clock-display">${timeStr}</div>
          <div class="date-display">${dateStr}</div>
        `;
      } else if (type === 'weather') {
        // 模拟天气数据
        const temp = Math.round(18 + Math.random() * 10);
        const condition = ['晴', '多云', '小雨', '阴'][Math.floor(Math.random() * 4)];
        contentHtml = `
          <div><span class="weather-temp">${temp}°C</span> · ${condition}</div>
          <div style="font-size:13px; color:var(--subtext);">🌆 实时天气</div>
        `;
      } else if (type === 'calendar') {
        const now = new Date();
        const month = now.getMonth() + 1;
        const day = now.getDate();
        const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
        const wd = weekdays[now.getDay()];
        contentHtml = `
          <div style="font-size:20px; font-weight:300;">${month}月${day}日</div>
          <div style="font-size:14px; color:var(--subtext);">星期${wd} · 第${Math.ceil(day/7)}周</div>
        `;
      } else if (type === 'todo') {
        const tasks = ['📌 完成项目报告', '📌 阅读半小时', '📌 整理笔记'];
        const listHtml = tasks.map(t => `<li>${t}</li>`).join('');
        contentHtml = `
          <ul class="todo-list">${listHtml}</ul>
          <div style="font-size:12px; color:var(--subtext); margin-top:4px;">今日待办 · 外部数据</div>
        `;
      } else {
        contentHtml = `<div>未知微件</div>`;
      }

      div.innerHTML = `
        <div class="widget-header">
          <span class="widget-title">${getWidgetLabel(type)}</span>
          <div class="widget-actions">
            <button class="remove-widget" data-id="${widget.id}" title="移除">✕</button>
          </div>
        </div>
        <div class="widget-content">${contentHtml}</div>
      `;

      // 删除事件
      const removeBtn = div.querySelector('.remove-widget');
      removeBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        const id = parseInt(this.dataset.id);
        removeWidget(id);
      });

      // 拖拽事件
      div.addEventListener('dragstart', function(e) {
        e.dataTransfer.setData('text/plain', this.dataset.id);
        this.classList.add('dragging');
      });
      div.addEventListener('dragend', function(e) {
        this.classList.remove('dragging');
      });
      div.addEventListener('dragover', function(e) {
        e.preventDefault();
      });
      div.addEventListener('drop', function(e) {
        e.preventDefault();
        const fromId = parseInt(e.dataTransfer.getData('text/plain'));
        const toId = parseInt(this.dataset.id);
        if (fromId !== toId) {
          moveWidget(fromId, toId);
        }
      });

      return div;
    }

    function getWidgetLabel(type) {
      const map = { clock: '🕒 时钟', weather: '🌤️ 天气', calendar: '📅 日历', todo: '📋 待办' };
      return map[type] || type;
    }

    // ---------- 核心操作 ----------
    function renderAll() {
      // 清空grid
      grid.innerHTML = '';
      if (widgets.length === 0) {
        grid.innerHTML = `<div class="empty-hint">还没有微件，点击下方添加 ✨</div>`;
      } else {
        widgets.forEach(w => {
          const el = renderWidget(w);
          grid.appendChild(el);
        });
      }
      // 更新管理列表
      renderManageList();
    }

    function renderManageList() {
      manageList.innerHTML = '';
      if (widgets.length === 0) {
        manageList.innerHTML = `<div class="empty-hint">暂无微件</div>`;
        return;
      }
      widgets.forEach(w => {
        const div = document.createElement('div');
        div.style.cssText = `
          display: flex; justify-content: space-between; 
          background: rgba(255,255,255,0.04); border-radius: 12px; 
          padding: 8px 12px; border: 1px solid var(--glass-border);
        `;
        div.innerHTML = `
          <span>${getWidgetLabel(w.type)} <span style="color:var(--subtext);font-size:12px;">#${w.id}</span></span>
          <button class="remove-widget-manage" data-id="${w.id}" style="background:transparent;border:none;color:#ff7b7b;cursor:pointer;">移除</button>
        `;
        manageList.appendChild(div);
        const rmBtn = div.querySelector('.remove-widget-manage');
        rmBtn.addEventListener('click', function() {
          const id = parseInt(this.dataset.id);
          removeWidget(id);
        });
      });
    }

    function addWidget(type) {
      const newWidget = { id: generateId(), type: type };
      widgets.push(newWidget);
      renderAll();
      // 如果添加的是时钟，立即更新时间
      if (type === 'clock') updateClocks();
    }

    function removeWidget(id) {
      widgets = widgets.filter(w => w.id !== id);
      renderAll();
    }

    function moveWidget(fromId, toId) {
      const fromIndex = widgets.findIndex(w => w.id === fromId);
      const toIndex = widgets.findIndex(w => w.id === toId);
      if (fromIndex === -1 || toIndex === -1) return;
      const [removed] = widgets.splice(fromIndex, 1);
      widgets.splice(toIndex, 0, removed);
      renderAll();
    }

    function resetWidgets() {
      widgets = [
        { id: generateId(), type: 'clock' },
        { id: generateId(), type: 'weather' },
        { id: generateId(), type: 'calendar' },
        { id: generateId(), type: 'todo' }
      ];
      renderAll();
      updateClocks();
    }

    // 时钟更新（仅对已存在的时钟微件）
    function updateClocks() {
      // 由于渲染是静态的，时钟需要定时刷新
      // 这里采用简单方式：重新渲染全部（但保留数据）
      // 但重新渲染会导致拖拽状态丢失，但为了实时时钟，每10秒刷新一次
      // 我们只刷新包含时钟的微件，为避免闪烁，只更新内容
      const clockWidgets = widgets.filter(w => w.type === 'clock');
      if (clockWidgets.length === 0) return;

      // 重新渲染整个grid（更简单）
      renderAll();
    }

    // ---------- 初始化 & 事件绑定 ----------
    async function init() {
      // 获取座右铭
      const motto = await fetchMotto();
      updateMottoDisplay(motto);

      // 默认微件
      resetWidgets();

      // 添加微件
      addBtn.addEventListener('click', function() {
        const type = widgetSelector.value;
        addWidget(type);
        if (type === 'clock') updateClocks();
      });

      // 重置
      resetBtn.addEventListener('click', function() {
        resetWidgets();
      });

      // 定时更新时钟（每10秒）
      setInterval(() => {
        // 检查是否有时钟微件
        const hasClock = widgets.some(w => w.type === 'clock');
        if (hasClock) {
          // 只重新渲染，不改变数据
          renderAll();
        }
        // 同时更新座右铭（每60秒更新一次）
      }, 10000);

      // 座右铭定时刷新（每120秒）
      setInterval(async () => {
        const newMotto = await fetchMotto();
        updateMottoDisplay(newMotto);
      }, 120000);

      // 标签切换
      const tabBtns = document.querySelectorAll('.tab-btn');
      const pages = {
        page1: document.getElementById('page1'),
        page2: document.getElementById('page2')
      };
      tabBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          tabBtns.forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          const pageId = this.dataset.page;
          Object.values(pages).forEach(p => p.classList.remove('active'));
          if (pages[pageId]) pages[pageId].classList.add('active');
        });
      });
    }

    // 启动
    init();
  })();
</script>
</body>
</html>
