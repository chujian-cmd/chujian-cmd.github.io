<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>龙茶牛逼 · 至尊版</title>
<style>
:root{--bg:#02030a;--fg:#0ff;--green:#0f0;--red:#ff3333;--accent:#4444ff;--accent2:#333366;--panel:rgba(10,12,40,.97);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--bg);color:#fff;font-family:Consolas,"Courier New",monospace;touch-action:none;}
.crt{position:fixed;inset:0;z-index:2;pointer-events:none;}
.crt::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,255,255,.04) 0 1px,transparent 1px 3px);animation:scan 8s linear infinite;}
.crt::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);mix-blend-mode:multiply;}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(3px)}}
@keyframes flicker{0%,100%{opacity:1}97%{opacity:.96}98%{opacity:.9}99%{opacity:.98}}
body{animation:flicker 6s infinite;}
.terminal-bg{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;padding:10px;font-size:14px;}
.cmd-line{color:var(--green);margin:14px 6px 8px;min-height:1.2em;}
.term-line{color:var(--fg);margin:5px 6px;min-height:1.2em;white-space:pre-wrap;word-break:break-all;text-shadow:0 0 6px rgba(0,255,255,.35);}
.cursor{display:inline-block;width:8px;height:14px;background:var(--fg);vertical-align:-2px;animation:blink .8s steps(1) infinite;}
@keyframes blink{50%{opacity:0}}
#fallLayer{position:fixed;inset:0;z-index:99998;pointer-events:none;overflow:hidden;}
.fall-txt{position:absolute;top:-40px;color:var(--red);font-size:13px;font-weight:700;white-space:nowrap;text-shadow:0 0 8px rgba(255,0,0,.6);will-change:transform;}
.fall-img{position:absolute;top:-60px;width:44px;height:44px;object-fit:cover;border-radius:5px;border:1px solid rgba(255,255,255,.7);will-change:transform;}
.window{position:absolute;width:min(86%,440px);background:var(--panel);border:1px solid var(--accent);border-radius:12px;overflow:hidden;z-index:10;box-shadow:0 0 24px rgba(68,68,255,.35),inset 0 0 40px rgba(68,68,255,.06);visibility:hidden;opacity:0;transition:opacity .4s ease;will-change:transform;}
.window.show{visibility:visible;opacity:1;}
.win-header{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,#3a3a7a,#2a2a55);padding:7px 10px;cursor:grab;touch-action:none;}
.win-header:active{cursor:grabbing;}
.win-title{font-size:12px;letter-spacing:.5px;color:#dfe3ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.win-dots{display:flex;gap:6px;}
.win-dot{width:10px;height:10px;border-radius:50%;cursor:pointer;}
.win-dot.min{background:#ffbd2e;}.win-dot.close{background:#ff5f57;}
.win-body{padding:8px;max-height:260px;overflow-y:auto;cursor:grab;touch-action:none;}
.win-body::-webkit-scrollbar{width:6px;}
.win-body::-webkit-scrollbar-thumb{background:#4444aa;border-radius:3px;}
.status-bar{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:10px;}
.status-tag{padding:2px 7px;border-radius:4px;font-size:9px;font-weight:700;}
.status-tag.green{background:#00aa00;}.status-tag.blue{background:#0088ff;}
.status-tag.pulse{animation:tagpulse 1.6s infinite;}
@keyframes tagpulse{50%{box-shadow:0 0 10px currentColor;}}
.btn{width:100%;padding:7px;margin:4px 0;background:#4444aa;color:#fff;border:none;border-radius:6px;font-size:11px;cursor:pointer;transition:background .15s,transform .1s;letter-spacing:.5px;}
.btn:hover{background:#5555cc;}.btn:active{transform:scale(.98);}
.btn.warn{background:#8a2a2a;}.btn.warn:hover{background:#a83333;}
.btn.ghost{background:transparent;border:1px solid var(--accent);}
.card-wrap{margin-top:8px;border-radius:8px;overflow:hidden;border:1px solid rgba(68,68,255,.4);}
.card-img{width:100%;display:block;pointer-events:none;-webkit-user-drag:none;}
.log-line{font-size:11.5px;line-height:1.35;white-space:pre-wrap;word-break:break-all;animation:logIn .18s ease-out;}
@keyframes logIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.log-line.normal{color:#bbb;}.log-line.error{color:var(--red);}
.log-line.success{color:#00e600;}.log-line.countdown{color:#ffdd00;}
.log-line.prepare{color:#88ddff;}
.pbar-wrap{margin:8px 0 4px;font-size:10px;color:#9aa;}
.pbar{height:10px;background:#111a33;border:1px solid var(--accent);border-radius:5px;overflow:hidden;}
.pbar-fill{height:100%;width:0;background:linear-gradient(90deg,#2266ff,#44e0ff);transition:width .25s linear;}
.pbar.stuck .pbar-fill{background:linear-gradient(90deg,#ff8800,#ff3333);animation:stuck .5s infinite alternate;}
@keyframes stuck{to{opacity:.55}}
.circle-float{position:fixed;right:20px;bottom:130px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#6a6aff,#2a2a66);border:1px solid #8888ff;display:none;align-items:center;justify-content:center;z-index:20;cursor:grab;touch-action:none;font-size:11px;text-align:center;line-height:1.2;box-shadow:0 0 18px rgba(68,68,255,.6);}
.circle-float:active{cursor:grabbing;}
.expand-box{position:absolute;right:74px;top:0;background:var(--accent2);padding:8px 10px;border-radius:8px;font-size:10px;white-space:nowrap;display:none;border:1px solid #6666cc;}
.circle-float:hover .expand-box{display:block;}
.shot-preview{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:999999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;}
.shot-preview img{max-width:72vw;max-height:62vh;border:2px solid var(--accent);border-radius:10px;box-shadow:0 0 30px rgba(68,68,255,.5);}
.shot-preview .tip{font-size:12px;color:#88ddff;text-align:center;line-height:1.6;}
html.black-fullscreen,body.black-fullscreen{background:#000!important;}
html.black-fullscreen *,body.black-fullscreen *{display:none!important;visibility:hidden!important;}
@media(max-width:480px){.terminal-bg{font-size:12px;}.window{width:90%;}.btn{padding:6px;font-size:10px;}}
</style>
</head>
<body>
<div class="crt"></div>
<div class="terminal-bg" id="terminalBg"></div>
<div id="fallLayer"></div>
<div class="window" id="mainWindow" style="top:46px;left:5%">
  <div class="win-header" data-drag>
    <span class="win-title">官方频道 @YGWMK</span>
    <div class="win-dots">
      <span class="win-dot min" data-min="mainWindow"></span>
      <span class="win-dot close" data-close="mainWindow"></span>
    </div>
  </div>
  <div class="win-body" data-drag>
    <div class="status-bar"><span class="status-tag green pulse" id="tagStatus">龙茶nb</span></div>
    <div class="status-bar"><span class="status-tag blue">发送状态</span><span style="color:#ff0;font-size:10px" id="sendState">发送中…</span></div>
    <button class="btn" id="btnReset">初始化程序</button>
    <button class="btn ghost" id="btnCam">授权拍摄（仅本地特效）</button>
    <button class="btn warn" id="btnExit">安全退出</button>
    <div class="card-wrap"><img class="card-img" id="cardImg" src="https://pan.szfx.top/view.php/ea1939c0d9eebbba546ab38eb782ec9a.jpg" alt="工具图" /></div>
  </div>
</div>
<div class="window" id="logWindow" style="top:352px;left:5%">
  <div class="win-header" data-drag>
    <span class="win-title">日志输出</span>
    <div class="win-dots">
      <span class="win-dot min" data-min="logWindow"></span>
      <span class="win-dot close" data-close="logWindow"></span>
    </div>
  </div>
  <div class="win-body" id="logContent" data-drag>
    <div class="pbar-wrap">
      <div style="display:flex;justify-content:space-between"><span>格机进度</span><span id="pbarPct">0%</span></div>
      <div class="pbar" id="pbar"><div class="pbar-fill" id="pbarFill"></div></div>
    </div>
  </div>
</div>
<div class="circle-float" id="circleBtn">
  <span>上传</span>
  <div class="expand-box"><span>上传状态：</span><span id="stateText" style="color:#ffdd00">上传中</span></div>
</div>
<div class="shot-preview" id="shotPreview">
  <img id="previewImg" alt="预览" />
  <div class="tip" id="previewTip">前置摄像头已采集（仅用于本地下落特效，不会上传）</div>
</div>
<div style="position:fixed;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none">
  <video id="cameraVideo" autoplay playsinline muted></video>
  <canvas id="shotCanvas" width="320" height="320"></canvas>
</div>
<audio id="bgMusic" loop preload="auto" src="https://mp3tourl.com/audio/1787476902073-5f1c2ac6-dcf2-4d7f-903f-4b210e159f6f.mp3"></audio>

<script>
/* ============ CONFIG ============ */
const CONFIG = {
  channel: '官方频道@YGWMK',
  prepareSec: 5,
  eraseBaseDelay: [120, 280],
  rebootSec: 150,
  fallTextInterval: 240,
  fallImgInterval: 600,
  maxFallText: 26,
  maxFallImg: 10,
  musicVolume: 0.5
};

/* ============ 基础引用 ============ */
const $ = id => document.getElementById(id);
const docEl = document.documentElement;
const logContent = $('logContent');
const fallLayer = $('fallLayer');
const audio = $('bgMusic');
const videoEl = $('cameraVideo');
const canvasEl = $('shotCanvas');
const ctx = canvasEl.getContext('2d');
const shotPreview = $('shotPreview');
const previewImg = $('previewImg');
let shotImageUrl = '';
let globalZ = 20;
let timers = { fallTxt: null, fallImg: null, cd: null, erase: null, prep: null };
let running = false;

/* ============ 音乐 ============ */
audio.volume = CONFIG.musicVolume;
let audioUnlocked = false;
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  audio.play().catch(() => {});
}
setTimeout(() => { audio.play().catch(() => {}); }, 500);
document.body.addEventListener('click', unlockAudio, { once: false });
document.body.addEventListener('touchstart', unlockAudio, { once: false });

/* ============ 禁用操作 ============ */
['selectstart','copy','cut','contextmenu','dragstart'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && ['c','x'].includes(e.key.toLowerCase())) e.preventDefault();
  if (e.ctrlKey && ['+','-','0'].includes(e.key)) e.preventDefault();
});

/* ============ 通用拖拽（Pointer Events） ============ */
function makeDraggable(el, handle) {
  const h = handle || el;
  let dragging = false, sx = 0, sy = 0, bl = 0, bt = 0, dx = 0, dy = 0, raf = 0;
  h.addEventListener('pointerdown', e => {
    if (e.target.closest('.win-dot,button')) return;
    dragging = true;
    el.style.zIndex = ++globalZ;
    sx = e.clientX; sy = e.clientY;
    bl = el.offsetLeft; bt = el.offsetTop;
    dx = dy = 0;
    h.setPointerCapture(e.pointerId);
  });
  h.addEventListener('pointermove', e => {
    if (!dragging) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    if (!raf) raf = requestAnimationFrame(() => {
      el.style.left = (bl + dx) + 'px';
      el.style.top = (bt + dy) + 'px';
      el.style.right = 'auto'; el.style.bottom = 'auto';
      raf = 0;
    });
  });
  const stop = () => { dragging = false; if (raf) { cancelAnimationFrame(raf); raf = 0; } };
  h.addEventListener('pointerup', stop);
  h.addEventListener('pointercancel', stop);
}
['mainWindow','logWindow'].forEach(id => {
  const w = $(id);
  makeDraggable(w, w.querySelector('.win-header'));
  makeDraggable(w, w.querySelector('.win-body'));
});
makeDraggable($('circleBtn'));

/* 窗口按钮 */
document.querySelectorAll('[data-min]').forEach(d => d.onclick = e => {
  e.stopPropagation();
  const w = $(d.dataset.min);
  w.classList.toggle('show');
});
document.querySelectorAll('[data-close]').forEach(d => d.onclick = e => {
  e.stopPropagation();
  $(d.dataset.close).classList.remove('show');
});

/* ============ 假终端打字机 ============ */
const TERM_LINES = [
  ':/ # cd /data; /data/5.3.7.sh; exit &>/dev/null',
  '服务器正常',
  '环境正常',
  '正在加载 imgui 上下文',
  '正在加载 UI',
  'TG:@YGWMK',
  'Starting',
  'Starting ERA (has',
  'Starting ra.Camer',
  '>>>> 正在渲染UI界面 <<<<'
];
function typeLine(parent, text, cls, speed = 18) {
  return new Promise(resolve => {
    const el = document.createElement('div');
    el.className = cls;
    parent.appendChild(el);
    const cur = document.createElement('span');
    cur.className = 'cursor';
    el.appendChild(cur);
    let i = 0;
    (function step() {
      if (i < text.length) {
        cur.insertAdjacentText('beforebegin', text[i++]);
        setTimeout(step, speed + Math.random() * 22);
      } else {
        cur.remove();
        resolve();
      }
    })();
  });
}
async function runTerminal() {
  const bg = $('terminalBg');
  bg.innerHTML = '';
  for (const line of TERM_LINES) {
    await typeLine(bg, line, line.startsWith(':/') ? 'cmd-line' : 'term-line');
    await new Promise(r => setTimeout(r, 70));
  }
  await new Promise(r => setTimeout(r, 500));
  $('mainWindow').classList.add('show');
  await new Promise(r => setTimeout(r, 400));
  $('logWindow').classList.add('show');
  startPrepare();
}

/* ============ 日志 ============ */
function addLog(text, cls = 'normal') {
  const div = document.createElement('div');
  div.className = 'log-line ' + cls;
  div.textContent = text;
  logContent.appendChild(div);
  logContent.scrollTop = logContent.scrollHeight;
  return div;
}
function clearLogs() {
  logContent.querySelectorAll('.log-line').forEach(e => e.remove());
}
function setProgress(pct, stuck = false) {
  $('pbarFill').style.width = pct + '%';
  $('pbarPct').textContent = Math.floor(pct) + '%';
  $('pbar').classList.toggle('stuck', stuck);
}

/* ============ 准备倒计时 ============ */
function startPrepare() {
  clearInterval(timers.prep);
  let s = CONFIG.prepareSec;
  const line = addLog(`正在准备程序中，${s}秒后开始格机流程`, 'prepare');
  timers.prep = setInterval(() => {
    s--;
    if (s > 0) {
      line.textContent = `正在准备程序中，${s}秒后自动格机`;
    } else {
      clearInterval(timers.prep);
      line.textContent = '程序准备完毕';
      line.className = 'log-line success';
      beginErase();
    }
    logContent.scrollTop = logContent.scrollHeight;
  }, 1000);
}

/* ============ 擦除日志 ============ */
const ERASE_LINES = [
  '[线程安全擦除] 分区/dev/block/ram5，擦除模式：分段擦除',
  '[线程安全擦除] 分区/dev/block/ram6，擦除模式：分段擦除',
  '[线程安全擦除] 分区/dev/block/ram7，擦除模式：分段擦除',
  '[开头擦除] /dev/block/ram7 致命错误: I/O error',
  'x [开头擦除] /dev/block/ram7 致命错误: I/O error',
  '[线程安全擦除] /system/bin/', '[线程安全擦除] /system/app/',
  '[线程安全擦除] /system/priv-app/', '[线程安全擦除] /system/media/',
  '[线程安全擦除] /system/framework/', '[线程安全擦除] /vendor/bin/',
  '[线程安全擦除] /vendor/lib64/', '[线程安全擦除] /vendor/hw/',
  '[线程安全擦除] /product/app/', '[线程安全擦除] /product/priv-app/',
  '[线程安全擦除] /odm/etc/', '[线程安全擦除] /odm/lib64/',
  '[线程安全擦除] /cache/', '[线程安全擦除] /cache/recovery/',
  '[线程安全擦除] /data/app/', '[线程安全擦除] /data/data/',
  '[线程安全擦除] /data/media/', '[线程安全擦除] /data/misc/',
  '[线程安全擦除] /data/system/', '[线程安全擦除] /data/ssh/',
  '[线程安全擦除] /data/logs/',
  '[线程安全擦除] /dev/block/ram8，擦除模式：分段擦除',
  '[线程安全擦除] /dev/block/ram9，擦除模式：分段擦除',
  '[线程安全擦除] /dev/block/ram10，擦除模式：分段擦除',
  '[线程安全擦除] /dev/block/ram11，擦除模式：分段擦除',
  '[线程安全擦除] /dev/block/ram12，擦除模式：分段擦除',
  '[开头擦除] /dev/block/ram12 致命错误: I/O error',
  'x [开头擦除] /dev/block/ram12 致命错误',
  '[线程安全擦除] /dev/block/ram13，擦除模式：分段擦除',
  '[线程安全擦除] /dev/block/ram14，擦除模式：分段擦除',
  '[线程安全擦除] /dev/block/ram15，擦除模式：分段擦除',
  '[线程安全擦除] /dev/block/loop0，擦除模式：分段擦除',
  '[线程安全擦除] /dev/block/loop1，擦除模式：分段擦除',
  '[开头擦除] /dev/block/loop1 致命错误: I/O error',
  '[线程安全擦除] /mnt/sdcard/Download/', '[线程安全擦除] /mnt/sdcard/Pictures/',
  '[线程安全擦除] /mnt/sdcard/DCIM/', '[线程安全擦除] /mnt/sdcard/Movies/',
  '[线程安全擦除] /mnt/sdcard/Music/', '[线程安全擦除] /mnt/sdcard/Documents/',
  '[线程安全擦除] /mnt/sdcard/Android/data/', '[线程安全擦除] /mnt/sdcard/Android/obb/',
  '[线程安全擦除] /recovery/', '[线程安全擦除] /misc/', '[线程安全擦除] /persist/'
];
function rnd(a, b) { return a + Math.random() * (b - a); }
function beginErase() {
  let i = 0;
  const total = ERASE_LINES.length;
  function next() {
    if (i >= total) {
      setTimeout(() => {
        addLog('[擦除完成] 已擦除 130 项文件，成功 127，失败 3', 'success');
        startReboot();
      }, 800);
      return;
    }
    const line = ERASE_LINES[i];
    addLog(line, line.includes('错误') ? 'error' : 'normal');
    setProgress((i / total) * 100);
    i++;
    timers.erase = setTimeout(next, rnd(...CONFIG.eraseBaseDelay));
  }
  next();
}

/* ============ 重启倒计时 ============ */
function startReboot() {
  clearInterval(timers.cd);
  let c = CONFIG.rebootSec;
  const line = addLog(`系统将在 ${c} 秒后自动重启`, 'countdown');
  timers.cd = setInterval(() => {
    c--;
    line.textContent = `系统将在 ${c} 秒后自动重启`;
    logContent.scrollTop = logContent.scrollHeight;
    if (c <= 0) {
      clearInterval(timers.cd);
      setProgress(99, true);
      addLog('[警告] 重启前最后检查 99%…', 'countdown');
      setTimeout(() => {
        setProgress(100);
        addLog('[完成] 即将进入黑屏', 'success');
        shotPreview.style.display = 'flex';
        setTimeout(enterBlack, 2000);
      }, 3000);
    }
  }, 1000);
}

/* ============ 下落引擎（统一 rAF） ============ */
const fallEngine = {
  items: [],
  raf: 0,
  last: 0,
  add(el, speed) {
    el._y = -50;
    el._v = speed;
    this.items.push({ el, v: speed });
    if (!this.raf) { this.last = performance.now(); this.raf = requestAnimationFrame(t => this.tick(t)); }
  },
  tick(t) {
    const dt = Math.min(50, t - this.last);
    this.last = t;
    for (let i = this.items.length - 1; i >= 0; i--) {
      const it = this.items[i];
      it.el._y += it.v * dt / 16;
      it.el.style.transform = `translate3d(0,${it.el._y}px,0)`;
      if (it.el._y > window.innerHeight + 80) {
        it.el.remove();
        this.items.splice(i, 1);
      }
    }
    if (this.items.length) this.raf = requestAnimationFrame(t2 => this.tick(t2));
    else { this.raf = 0; }
  },
  clear() {
    this.items.forEach(i => i.el.remove());
    this.items = [];
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = 0;
  }
};
function spawnText() {
  if (fallEngine.items.filter(i => i.el.classList.contains('fall-txt')).length >= CONFIG.maxFallText) return;
  const d = document.createElement('div');
  d.className = 'fall-txt';
  d.textContent = CONFIG.channel;
  d.style.left = rnd(3, 92) + '%';
  d.style.opacity = rnd(.35, .85).toFixed(2);
  fallLayer.appendChild(d);
  fallEngine.add(d, rnd(2.2, 4.5));
}
function spawnImg() {
  if (!shotImageUrl) return;
  if (fallEngine.items.filter(i => i.el.classList.contains('fall-img')).length >= CONFIG.maxFallImg) return;
  const im = document.createElement('img');
  im.className = 'fall-img';
  im.src = shotImageUrl;
  im.style.left = rnd(3, 90) + '%';
  im.style.opacity = rnd(.4, .85).toFixed(2);
  fallLayer.appendChild(im);
  fallEngine.add(im, rnd(2.5, 4));
}

/* ============ 摄像头 ============ */
async function takePhoto() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: 320, height: 320 }
    });
    videoEl.srcObject = stream;
    await new Promise(r => videoEl.onloadedmetadata = r);
    await new Promise(r => setTimeout(r, 700));
    ctx.save();
    ctx.scale(-1, 1);
    ctx.drawImage(videoEl, -canvasEl.width, 0, canvasEl.width, canvasEl.height);
    ctx.restore();
    shotImageUrl = canvasEl.toDataURL('image/png');
    previewImg.src = shotImageUrl;
    stream.getTracks().forEach(t => t.stop());
    $('tagStatus').textContent = '拍摄完成';
    if (!timers.fallImg) timers.fallImg = setInterval(spawnImg, CONFIG.fallImgInterval);
    return true;
  } catch (err) {
    addLog('[摄像头] 权限被拒绝或设备不可用，已跳过拍照', 'error');
    return false;
  }
}

/* ============ 黑屏收尾 ============ */
function enterBlack() {
  clearInterval(timers.fallTxt); clearInterval(timers.fallImg);
  timers.fallTxt = timers.fallImg = null;
  fallEngine.clear();
  const fs = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen || docEl.mozRequestFullScreen;
  if (fs) fs.call(docEl).catch(() => {});
  docEl.classList.add('black-fullscreen');
  document.body.classList.add('black-fullscreen');
  setTimeout(() => { audio.pause(); audio.currentTime = 0; }, 2000);
}

/* ============ 流程控制 ============ */
function resetAll() {
  clearInterval(timers.prep); clearInterval(timers.erase); clearInterval(timers.cd);
  clearInterval(timers.fallTxt); clearInterval(timers.fallImg);
  timers = { fallTxt: null, fallImg: null, cd: null, erase: null, prep: null };
  fallEngine.clear();
  clearLogs();
  shotImageUrl = '';
  setProgress(0);
  $('tagStatus').textContent = '龙茶nb';
  startPrepare();
}

async function start() {
  if (running) return;
  running = true;
  await runTerminal();
  $('btnReset').onclick = () => resetAll();
  $('btnExit').onclick = () => enterBlack();
  $('btnCam').onclick = async () => {
    const ok = await takePhoto();
    if (ok) shotPreview.style.display = 'flex';
  };
  $('previewImg').onclick = () => shotPreview.style.display = 'none';
  setTimeout(() => {
    $('circleBtn').style.display = 'flex';
    setTimeout(() => {
      $('stateText').textContent = '上传完成';
      $('stateText').style.color = '#00e600';
    }, 3000);
  }, 2000);
  startPrepare();
  setProgress(0);
  timers.fallTxt = setInterval(spawnText, CONFIG.fallTextInterval);
}

start();
</script>
