<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>高级渐变色按钮集</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 30% 30%, #1a1a2e, #0a0a12);
            padding: 24px;
            gap: 28px;
        }

        /* 主卡片 */
        .card {
            background: rgba(20, 22, 36, 0.85);
            backdrop-filter: blur(28px) saturate(1.3);
            -webkit-backdrop-filter: blur(28px) saturate(1.3);
            border-radius: 48px;
            padding: 32px 28px 36px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .card-title {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 400;
            margin-bottom: 4px;
        }

        /* ===== 按钮网格 ===== */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            width: 100%;
        }

        .btn-wrapper {
            position: relative;
            aspect-ratio: 1 / 1;
            width: 100%;
        }

        .btn-wrapper .btn-check {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 22px;
            height: 22px;
            accent-color: #6366f1;
            cursor: pointer;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 6px;
            padding: 2px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .btn-wrapper .btn-check:checked {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.3);
        }

        .btn {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 22px;
            font-size: 1.4rem;
            font-weight: 500;
            color: #f1f5f9;
            cursor: pointer;
            transition: all 0.08s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            will-change: transform, box-shadow;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 22px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
            pointer-events: none;
        }

        .btn span {
            display: inline-block;
            transition: transform 0.08s cubic-bezier(0.34, 1.56, 0.64, 1);
            line-height: 1;
            position: relative;
            z-index: 1;
        }

        /* ===== 所有按钮统一渐变色 ===== */
        .btn-start {
            background: linear-gradient(145deg, #6366f1, #4f46e5);
            box-shadow: 0 4px 0 #3730a3, 0 8px 28px rgba(99, 102, 241, 0.25);
        }

        .btn-guess {
            background: linear-gradient(145deg, #f97316, #ea580c);
            box-shadow: 0 4px 0 #b45309, 0 8px 28px rgba(249, 115, 22, 0.2);
        }

        .btn-program {
            background: linear-gradient(145deg, #8b5cf6, #7c3aed);
            box-shadow: 0 4px 0 #5b21b6, 0 8px 28px rgba(139, 92, 246, 0.2);
        }

        .btn-big {
            background: linear-gradient(145deg, #06b6d4, #0891b2);
            box-shadow: 0 4px 0 #0e7490, 0 8px 28px rgba(6, 182, 212, 0.2);
        }

        .btn-small {
            background: linear-gradient(145deg, #f43f5e, #e11d48);
            box-shadow: 0 4px 0 #be123c, 0 8px 28px rgba(244, 63, 94, 0.2);
        }

        .btn-yes {
            background: linear-gradient(145deg, #22c55e, #16a34a);
            box-shadow: 0 4px 0 #15803d, 0 8px 28px rgba(34, 197, 94, 0.2);
        }

        /* ===== 按压状态 — 保持渐变，颜色加深 ===== */
        .btn-start-pressed {
            background: linear-gradient(145deg, #818cf8, #4f46e5);
            box-shadow: 0 1px 0 #3730a3, 0 4px 20px rgba(99, 102, 241, 0.15);
            transform: translateY(4px) scale(0.96);
        }

        .btn-guess-pressed {
            background: linear-gradient(145deg, #fb923c, #ea580c);
            box-shadow: 0 1px 0 #b45309, 0 4px 20px rgba(249, 115, 22, 0.15);
            transform: translateY(4px) scale(0.96);
        }

        .btn-program-pressed {
            background: linear-gradient(145deg, #a78bfa, #7c3aed);
            box-shadow: 0 1px 0 #5b21b6, 0 4px 20px rgba(139, 92, 246, 0.15);
            transform: translateY(4px) scale(0.96);
        }

        .btn-big-pressed {
            background: linear-gradient(145deg, #22d3ee, #0891b2);
            box-shadow: 0 1px 0 #0e7490, 0 4px 20px rgba(6, 182, 212, 0.15);
            transform: translateY(4px) scale(0.96);
        }

        .btn-small-pressed {
            background: linear-gradient(145deg, #fb7185, #e11d48);
            box-shadow: 0 1px 0 #be123c, 0 4px 20px rgba(244, 63, 94, 0.15);
            transform: translateY(4px) scale(0.96);
        }

        .btn-yes-pressed {
            background: linear-gradient(145deg, #4ade80, #16a34a);
            box-shadow: 0 1px 0 #15803d, 0 4px 20px rgba(34, 197, 94, 0.15);
            transform: translateY(4px) scale(0.96);
        }

        /* 按压状态保留光泽层 */
        .btn-start-pressed::after,
        .btn-guess-pressed::after,
        .btn-program-pressed::after,
        .btn-big-pressed::after,
        .btn-small-pressed::after,
        .btn-yes-pressed::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 22px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, transparent 60%);
            pointer-events: none;
        }

        /* ===== 导出控件 ===== */
        .export-area {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 4px;
        }

        .export-options {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 8px 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .export-options label {
            color: #e2e8f0;
            font-size: 0.85rem;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .export-options input[type="checkbox"] {
            accent-color: #6366f1;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .btn-export {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 500;
            color: #f1f5f9;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3), 0 8px 32px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.1s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(145deg, rgba(99, 102, 241, 0.2), rgba(79, 70, 229, 0.1));
            border-color: rgba(255, 255, 255, 0.08);
        }

        .btn-export:active {
            transform: translateY(4px) scale(0.97);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-export svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            opacity: 0.8;
        }

        .select-all-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            padding: 8px 18px;
            font-size: 0.8rem;
            color: #e2e8f0;
            cursor: pointer;
            transition: all 0.15s;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .select-all-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .toast-message {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #e2e8f0;
            padding: 10px 22px;
            border-radius: 40px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            transform: translateY(4px);
        }

        .toast-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 480px) {
            .card {
                padding: 24px 16px 28px;
                border-radius: 40px;
            }
            .btn {
                font-size: 1.1rem;
                border-radius: 18px;
            }
            .button-grid {
                gap: 10px;
            }
            .btn-wrapper .btn-check {
                width: 18px;
                height: 18px;
                top: -5px;
                right: -5px;
            }
            .export-options {
                padding: 6px 14px;
                border-radius: 40px;
            }
            .export-options label {
                font-size: 0.75rem;
            }
            .btn-export {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 380px) {
            .btn {
                font-size: 0.95rem;
                border-radius: 14px;
            }
            .button-grid {
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="card" id="captureArea">
        <div class="card-title">✦ 猜数字 · 按钮集</div>

        <div class="button-grid" id="buttonGrid">
            <!-- 开始 -->
            <div class="btn-wrapper">
                <input type="checkbox" class="btn-check" checked />
                <button class="btn btn-start" data-label="开始"><span>开始</span></button>
            </div>
            <!-- 我猜 -->
            <div class="btn-wrapper">
                <input type="checkbox" class="btn-check" checked />
                <button class="btn btn-guess" data-label="我猜"><span>我猜</span></button>
            </div>
            <!-- 程序猜 -->
            <div class="btn-wrapper">
                <input type="checkbox" class="btn-check" checked />
                <button class="btn btn-program" data-label="程序猜"><span>程序猜</span></button>
            </div>
            <!-- 大了 -->
            <div class="btn-wrapper">
                <input type="checkbox" class="btn-check" checked />
                <button class="btn btn-big" data-label="大了"><span>大了</span></button>
            </div>
            <!-- 小了 -->
            <div class="btn-wrapper">
                <input type="checkbox" class="btn-check" checked />
                <button class="btn btn-small" data-label="小了"><span>小了</span></button>
            </div>
            <!-- 是的 -->
            <div class="btn-wrapper">
                <input type="checkbox" class="btn-check" checked />
                <button class="btn btn-yes" data-label="是的"><span>是的</span></button>
            </div>
        </div>
    </div>

    <div class="export-area">
        <div class="export-options">
            <label>
                <input type="checkbox" id="exportNormal" checked />
                普通状态
            </label>
            <label>
                <input type="checkbox" id="exportPressed" checked />
                按压状态
            </label>
            <button class="select-all-btn" id="selectAllBtn">全选</button>
            <button class="select-all-btn" id="deselectAllBtn">取消全选</button>
        </div>
        <button class="btn-export" id="exportBtn">
            <svg viewBox="0 0 24 24"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/></svg>
            导出选中按钮
        </button>
        <span class="toast-message" id="toastMsg">✨ 按钮已导出</span>
    </div>

    <script>
        (function() {
            const wrappers = document.querySelectorAll('.btn-wrapper');
            const exportNormal = document.getElementById('exportNormal');
            const exportPressed = document.getElementById('exportPressed');
            const exportBtn = document.getElementById('exportBtn');
            const toastMsg = document.getElementById('toastMsg');
            const selectAllBtn = document.getElementById('selectAllBtn');
            const deselectAllBtn = document.getElementById('deselectAllBtn');
            let toastTimer = null;

            // 全选/取消全选
            const checkboxes = document.querySelectorAll('.btn-check');
            selectAllBtn.addEventListener('click', () => {
                checkboxes.forEach(cb => cb.checked = true);
            });
            deselectAllBtn.addEventListener('click', () => {
                checkboxes.forEach(cb => cb.checked = false);
            });

            function showToast(text) {
                toastMsg.textContent = text || '✨ 按钮已导出';
                toastMsg.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toastMsg.classList.remove('show');
                }, 3000);
            }

            // 获取按压样式类
            function getPressedClass(btn) {
                if (btn.classList.contains('btn-start')) return 'btn-start-pressed';
                if (btn.classList.contains('btn-guess')) return 'btn-guess-pressed';
                if (btn.classList.contains('btn-program')) return 'btn-program-pressed';
                if (btn.classList.contains('btn-big')) return 'btn-big-pressed';
                if (btn.classList.contains('btn-small')) return 'btn-small-pressed';
                if (btn.classList.contains('btn-yes')) return 'btn-yes-pressed';
                return 'btn-start-pressed';
            }

            // 点击按钮时触发按压动画 (视觉反馈)
            document.querySelectorAll('.btn').forEach(btn => {
                btn.addEventListener('mousedown', function(e) {
                    const pressedClass = getPressedClass(this);
                    this.classList.add(pressedClass);
                });
                btn.addEventListener('mouseup', function(e) {
                    const pressedClass = getPressedClass(this);
                    this.classList.remove(pressedClass);
                });
                btn.addEventListener('mouseleave', function(e) {
                    const pressedClass = getPressedClass(this);
                    this.classList.remove(pressedClass);
                });
                // 触摸设备支持
                btn.addEventListener('touchstart', function(e) {
                    const pressedClass = getPressedClass(this);
                    this.classList.add(pressedClass);
                });
                btn.addEventListener('touchend', function(e) {
                    const pressedClass = getPressedClass(this);
                    this.classList.remove(pressedClass);
                });
            });

            // ===== 导出功能 =====
            exportBtn.addEventListener('click', async function() {
                const shouldExportNormal = exportNormal.checked;
                const shouldExportPressed = exportPressed.checked;

                if (!shouldExportNormal && !shouldExportPressed) {
                    showToast('⚠️ 请至少选择一种状态');
                    return;
                }

                const selectedWrappers = [];
                for (const wrapper of wrappers) {
                    const cb = wrapper.querySelector('.btn-check');
                    if (cb && cb.checked) {
                        selectedWrappers.push(wrapper);
                    }
                }

                if (selectedWrappers.length === 0) {
                    showToast('⚠️ 请至少选择一个按钮');
                    return;
                }

                let totalExported = 0;

                for (const wrapper of selectedWrappers) {
                    const btn = wrapper.querySelector('.btn');
                    if (!btn) continue;

                    const label = btn.dataset.label || btn.textContent.trim() || 'button';
                    const rect = btn.getBoundingClientRect();
                    const computedStyle = getComputedStyle(btn);
                    const safeLabel = label.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_');

                    try {
                        // ---- 普通状态 ----
                        if (shouldExportNormal) {
                            const cloneNormal = btn.cloneNode(true);
                            cloneNormal.style.position = 'fixed';
                            cloneNormal.style.left = '-9999px';
                            cloneNormal.style.top = '-9999px';
                            cloneNormal.style.transform = 'none';
                            cloneNormal.style.transition = 'none';
                            cloneNormal.style.boxShadow = computedStyle.boxShadow;
                            cloneNormal.style.background = computedStyle.backgroundImage || computedStyle
                            .backgroundColor;
                            cloneNormal.style.border = computedStyle.border;
                            cloneNormal.style.borderRadius = computedStyle.borderRadius;
                            cloneNormal.style.color = computedStyle.color;
                            cloneNormal.style.fontSize = computedStyle.fontSize;
                            cloneNormal.style.fontWeight = computedStyle.fontWeight;
                            cloneNormal.style.padding = '0';
                            cloneNormal.style.width = rect.width + 'px';
                            cloneNormal.style.height = rect.height + 'px';
                            cloneNormal.style.display = 'flex';
                            cloneNormal.style.alignItems = 'center';
                            cloneNormal.style.justifyContent = 'center';
                            cloneNormal.style.aspectRatio = 'auto';
                            cloneNormal.style.minWidth = '0';
                            cloneNormal.style.minHeight = '0';
                            cloneNormal.className = btn.className;
                            document.body.appendChild(cloneNormal);

                            const canvasNormal = await html2canvas(cloneNormal, {
                                scale: 2.0,
                                backgroundColor: null,
                                allowTaint: false,
                                useCORS: true,
                                logging: false,
                                borderRadius: computedStyle.borderRadius,
                            });

                            document.body.removeChild(cloneNormal);

                            const linkNormal = document.createElement('a');
                            linkNormal.download = `btn_${safeLabel}.png`;
                            linkNormal.href = canvasNormal.toDataURL('image/png');
                            linkNormal.click();
                            totalExported++;
                            await new Promise(r => setTimeout(r, 60));
                        }

                        // ---- 按压状态 ----
                        if (shouldExportPressed) {
                            const pressedClass = getPressedClass(btn);
                            const clonePressed = btn.cloneNode(true);
                            clonePressed.className = `btn ${pressedClass}`;
                            const span = clonePressed.querySelector('span');
                            if (span) {
                                span.style.transform = 'scale(0.92)';
                            }
                            clonePressed.style.transition = 'none';
                            clonePressed.style.position = 'fixed';
                            clonePressed.style.left = '-9999px';
                            clonePressed.style.top = '-9999px';
                            clonePressed.style.transform = 'none';
                            clonePressed.style.padding = '0';
                            clonePressed.style.width = rect.width + 'px';
                            clonePressed.style.height = rect.height + 'px';
                            clonePressed.style.display = 'flex';
                            clonePressed.style.alignItems = 'center';
                            clonePressed.style.justifyContent = 'center';
                            clonePressed.style.aspectRatio = 'auto';
                            clonePressed.style.minWidth = '0';
                            clonePressed.style.minHeight = '0';
                            document.body.appendChild(clonePressed);

                            const canvasPressed = await html2canvas(clonePressed, {
                                scale: 2.0,
                                backgroundColor: null,
                                allowTaint: false,
                                useCORS: true,
                                logging: false,
                                borderRadius: computedStyle.borderRadius,
                            });

                            document.body.removeChild(clonePressed);

                            const linkPressed = document.createElement('a');
                            linkPressed.download = `btn_${safeLabel}_pressed.png`;
                            linkPressed.href = canvasPressed.toDataURL('image/png');
                            linkPressed.click();
                            totalExported++;
                            await new Promise(r => setTimeout(r, 60));
                        }

                    } catch (err) {
                        console.warn(`导出按钮 ${label} 失败:`, err);
                    }
                }

                showToast(`✅ 成功导出 ${totalExported} 张按钮图片`);
            });

            // 按钮点击反馈（非导出）
            document.querySelectorAll('.btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const label = this.dataset.label || this.textContent.trim();
                    console.log(`🔘 点击: ${label}`);
                });
            });

        })();
    </script>
</body>
</html>
