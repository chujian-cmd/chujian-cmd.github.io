<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>治愈点 · 玻璃质感</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #4facfe;
      --accent: #00f2fe;
      --glass-border: rgba(255, 255, 255, 0.14);
      --text: #eaf6ff;
      --subtext: #91a4b8;
    }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, 'Cascadia Code', 'Consolas', monospace;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(79, 172, 254, 0.45), transparent 28%),
        radial-gradient(circle at 90% 20%, rgba(0, 242, 254, 0.35), transparent 32%),
        linear-gradient(135deg, #050a18 0%, #081229 45%, #050c22 100%);
      background-attachment: fixed;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app {
      max-width: 600px;
      width: 100%;
      flex: 1;
    }

    .hero {
      text-align: center;
      margin-bottom: 24px;
    }

    .hero h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ffffff, #a8d8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      color: var(--subtext);
      margin-top: 8px;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 18px;
      padding: 6px;
      border: 1px solid var(--glass-border);
    }

    .tab-btn {
      flex: 1;
      border: none;
      border-radius: 14px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      color: var(--subtext);
      font-family: inherit;
      backdrop-filter: blur(4px);
      text-align: center;
      transition: 0.25s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(79, 172, 254, 0.25), rgba(0, 242, 254, 0.15));
      color: #fff;
      border: 1px solid rgba(79, 172, 254, 0.25);
      box-shadow: 0 2px 12px rgba(79, 172, 254, 0.15);
    }

    .tab-btn:hover:not(.active) {
      color: #c8dfff;
      background: rgba(255, 255, 255, 0.04);
    }

    .page {
      display: none;
      animation: fade 0.35s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fade {
      0% { opacity: 0.3; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      padding: 16px 18px;
      margin-bottom: 12px;
    }

    .card-label {
      font-size: 12px;
      color: var(--subtext);
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .card-label span {
      color: var(--primary);
      font-weight: 500;
    }

    textarea {
      width: 100%;
      min-height: 80px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      color: #eaf6ff;
      padding: 12px 14px;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: 13px;
      line-height: 1.55;
      resize: vertical;
      tab-size: 4;
    }

    textarea:focus {
      outline: none;
      border-color: rgba(79, 172, 254, 0.45);
      box-shadow: 0 0 0 2px rgba(79, 172, 254, 0.14);
    }

    canvas {
      width: 100%;
      height: 100px;
      background: rgba(0, 4, 12, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      display: block;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .btn {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: #eaf6ff;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.05));
      font-family: inherit;
      backdrop-filter: blur(4px);
      transition: 0.2s;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: rgba(79, 172, 254, 0.35);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.08));
    }

    .btn.disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    select {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #eaf6ff;
      padding: 6px 10px;
      font-size: 13px;
      font-family: inherit;
      backdrop-filter: blur(4px);
    }

    select:focus {
      outline: none;
      border-color: rgba(79, 172, 254, 0.35);
    }

    input[type='range'] {
      width: 80px;
      accent-color: #4facfe;
      background: transparent;
    }

    input[type='number'] {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #eaf6ff;
      padding: 6px 8px;
      font-size: 13px;
      font-family: inherit;
      width: 50px;
    }

    input[type='number']:focus {
      outline: none;
      border-color: rgba(79, 172, 254, 0.35);
    }

    .flex-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .flex-row label {
      color: var(--subtext);
      font-size: 13px;
    }

    .badge {
      color: var(--subtext);
      font-size: 12px;
    }

    .info {
      color: var(--subtext);
      font-size: 12px;
      margin-left: auto;
      white-space: nowrap;
    }

    .error-text {
      color: #ff7b7b;
      font-size: 13px;
    }

    .success-text {
      color: #4facfe;
      font-size: 13px;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .library-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 12px 14px;
      cursor: default;
      transition: 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .library-item:hover {
      background: rgba(79, 172, 254, 0.12);
      border-color: rgba(79, 172, 254, 0.3);
      transform: translateY(-2px);
    }

    .library-item .name {
      font-size: 14px;
      color: var(--text);
    }

    .library-item .desc {
      font-size: 11px;
      color: var(--subtext);
      font-family: 'Cascadia Code', 'Consolas', monospace;
    }

    .library-item .tag {
      font-size: 10px;
      background: rgba(79, 172, 254, 0.2);
      border-radius: 6px;
      padding: 2px 8px;
      display: inline-block;
      color: var(--primary);
      align-self: flex-start;
      margin-top: 4px;
    }

    .footer {
      text-align: center;
      padding: 20px 0 10px 0;
      color: var(--subtext);
      font-size: 14px;
      opacity: 0.7;
      letter-spacing: 1px;
      font-weight: 300;
      width: 100%;
      max-width: 600px;
    }

    .footer span {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 500;
    }

    .page-empty {
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--subtext);
      font-size: 16px;
      opacity: 0.4;
    }

    .cure-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .cure-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 12px 10px;
      text-align: center;
      backdrop-filter: blur(4px);
      transition: 0.2s;
      cursor: pointer;
    }

    .cure-item:hover {
      background: rgba(79, 172, 254, 0.12);
      border-color: rgba(79, 172, 254, 0.25);
      transform: scale(1.02);
    }

    .cure-item .icon {
      font-size: 28px;
      line-height: 1.2;
    }

    .cure-item .label {
      font-size: 12px;
      color: var(--subtext);
      margin-top: 2px;
    }

    @media (max-width: 640px) {
      body {
        padding: 12px;
      }
      .app {
        max-width: 100%;
      }
      .hero h1 {
        font-size: 22px;
      }
      textarea {
        min-height: 70px;
        font-size: 12px;
      }
      canvas {
        height: 80px;
      }
      .footer {
        font-size: 12px;
        padding: 15px 0 5px 0;
        max-width: 100%;
      }
      .cure-grid {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 头部 -->
    <div class="hero">
      <h1>治愈点 · 慢时光</h1>
      <p>流体 · 水族 · 曼陀罗 · 火焰 · 雨 · 星空 · 水墨 · 沙画</p>
    </div>

    <!-- 标签 -->
    <div class="tabs">
      <button class="tab-btn active" data-page="page1">✨ 治愈集</button>
      <button class="tab-btn" data-page="page2">🌊 水族箱</button>
    </div>

    <!-- ============================================================ -->
    <!-- 页面一：治愈小工具集 -->
    <!-- ============================================================ -->
    <div id="page1" class="page active">

      <!-- 流体画 + 曼陀罗 -->
      <div class="card">
        <div class="card-label">🎨 <span>流体 · 曼陀罗</span> · 颜色自动流动 / 对称填色</div>
        <canvas id="fluidCanvas" width="800" height="100"></canvas>
        <div style="display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;">
          <button class="btn" id="resetFluidBtn">🌀 重置流动</button>
          <button class="btn" id="mandalaBtn">🌸 曼陀罗色</button>
          <span class="badge" id="fluidStatus">流动中</span>
        </div>
      </div>

      <!-- 火焰 + 星空 -->
      <div class="card">
        <div class="card-label">🔥 <span>火焰 · 星空</span> · 跳动火焰 / 旋转星空</div>
        <canvas id="fireCanvas" width="800" height="100"></canvas>
        <div style="display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;">
          <button class="btn" id="toggleFireBtn">🔥 火焰</button>
          <button class="btn" id="toggleStarBtn">✨ 星空</button>
          <span class="badge" id="fireStatus">火焰跳动</span>
        </div>
      </div>

      <!-- 下雨声 + 水墨 / 沙画 -->
      <div class="card">
        <div class="card-label">🌧️ <span>雨声 · 水墨 · 沙画</span> · 白噪音 / 鼠标画</div>
        <div class="cure-grid">
          <div class="cure-item" id="rainBtn">
            <div class="icon">🌧️</div>
            <div class="label">下雨声</div>
          </div>
          <div class="cure-item" id="inkBtn">
            <div class="icon">🖌️</div>
            <div class="label">水墨画</div>
          </div>
          <div class="cure-item" id="sandBtn">
            <div class="icon">🏜️</div>
            <div class="label">沙画</div>
          </div>
          <div class="cure-item" id="bubbleBtn">
            <div class="icon">🫧</div>
            <div class="label">气泡上升</div>
          </div>
        </div>
        <div style="margin-top: 8px; font-size: 13px; color: var(--subtext);" id="cureFeedback">点击任意卡片体验</div>
      </div>

      <!-- 状态反馈 -->
      <div class="card">
        <div class="card-label">🧘 <span>此刻心情</span> · 治愈点滴</div>
        <div class="error-text" id="moodText">慢慢来，会好的</div>
        <div class="success-text" style="margin-top:4px;">✨ 专注当下 · 呼吸之间</div>
      </div>
    </div>

    <!-- ============================================================ -->
    <!-- 页面二：水族箱 (鱼游 + 气泡) -->
    <!-- ============================================================ -->
    <div id="page2" class="page">
      <div class="card">
        <div class="card-label">🐠 <span>水族箱</span> · 鱼在游 · 气泡上升</div>
        <canvas id="aquariumCanvas" width="800" height="200"></canvas>
        <div style="display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;">
          <button class="btn" id="addFishBtn">🐟 加条鱼</button>
          <button class="btn" id="toggleBubbleBtn">🫧 气泡开关</button>
          <span class="badge" id="fishCount">🐠 3 条</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部 -->
  <div class="footer">
    <span>by 初见 · 治愈点</span>
  </div>

  <script>
    (function() {
      // ---- Tab 切换 ----
      const tabBtns = document.querySelectorAll('.tab-btn');
      const page1 = document.getElementById('page1');
      const page2 = document.getElementById('page2');
      tabBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          tabBtns.forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          if (this.dataset.page === 'page1') {
            page1.classList.add('active');
            page2.classList.remove('active');
          } else {
            page2.classList.add('active');
            page1.classList.remove('active');
          }
        });
      });

      // ---- 工具函数：随机颜色 ----
      function randColor() {
        const h = Math.random() * 360;
        return `hsl(${h}, 70%, 60%)`;
      }

      // ---- 流体画 Canvas (颜色自动流动) ----
      const fluidCanvas = document.getElementById('fluidCanvas');
      const fCtx = fluidCanvas.getContext('2d');
      let fluidParticles = [];
      const FLUID_COUNT = 30;
      for (let i = 0; i < FLUID_COUNT; i++) {
        fluidParticles.push({
          x: Math.random() * fluidCanvas.width,
          y: Math.random() * fluidCanvas.height,
          vx: (Math.random() - 0.5) * 0.6,
          vy: (Math.random() - 0.5) * 0.6,
          r: 10 + Math.random() * 20,
          color: randColor()
        });
      }
      let fluidAnimationId = null;

      function drawFluid() {
        fCtx.clearRect(0, 0, fluidCanvas.width, fluidCanvas.height);
        fluidParticles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0 || p.x > fluidCanvas.width) p.vx *= -1;
          if (p.y < 0 || p.y > fluidCanvas.height) p.vy *= -1;
          // 轻微随机扰动
          p.vx += (Math.random() - 0.5) * 0.03;
          p.vy += (Math.random() - 0.5) * 0.03;
          p.vx = Math.min(Math.max(p.vx, -0.5), 0.5);
          p.vy = Math.min(Math.max(p.vy, -0.5), 0.5);
          // 绘制
          const grad = fCtx.createRadialGradient(p.x, p.y, 2, p.x, p.y, p.r);
          grad.addColorStop(0, p.color);
          grad.addColorStop(1, 'rgba(255,255,255,0)');
          fCtx.beginPath();
          fCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          fCtx.fillStyle = grad;
          fCtx.fill();
        });
        fluidAnimationId = requestAnimationFrame(drawFluid);
      }
      drawFluid();

      document.getElementById('resetFluidBtn').addEventListener('click', function() {
        fluidParticles.forEach(p => {
          p.x = Math.random() * fluidCanvas.width;
          p.y = Math.random() * fluidCanvas.height;
          p.vx = (Math.random() - 0.5) * 0.6;
          p.vy = (Math.random() - 0.5) * 0.6;
          p.color = randColor();
        });
        document.getElementById('fluidStatus').textContent = '🌀 重置';
        setTimeout(() => document.getElementById('fluidStatus').textContent = '流动中', 600);
      });

      document.getElementById('mandalaBtn').addEventListener('click', function() {
        // 曼陀罗：对称填色，在画布上画对称圆
        fCtx.clearRect(0, 0, fluidCanvas.width, fluidCanvas.height);
        const cx = fluidCanvas.width / 2, cy = fluidCanvas.height / 2;
        for (let i = 0; i < 12; i++) {
          const angle = (i / 12) * Math.PI * 2;
          const r = 30 + Math.random() * 25;
          const x = cx + Math.cos(angle) * 35;
          const y = cy + Math.sin(angle) * 35;
          const col = `hsl(${i * 30 + 180}, 80%, 60%)`;
          fCtx.beginPath();
          fCtx.arc(x, y, r, 0, Math.PI * 2);
          fCtx.fillStyle = col;
          fCtx.shadowColor = 'rgba(79,172,254,0.3)';
          fCtx.shadowBlur = 12;
          fCtx.fill();
          // 对称
          for (let j = 1; j < 6; j++) {
            const a2 = angle + j * Math.PI / 6;
            const x2 = cx + Math.cos(a2) * 35;
            const y2 = cy + Math.sin(a2) * 35;
            fCtx.beginPath();
            fCtx.arc(x2, y2, r * 0.9, 0, Math.PI * 2);
            fCtx.fillStyle = col;
            fCtx.shadowBlur = 8;
            fCtx.fill();
          }
        }
        document.getElementById('fluidStatus').textContent = '🌸 曼陀罗';
        setTimeout(() => document.getElementById('fluidStatus').textContent = '流动中', 800);
        // 恢复流体动画
        if (fluidAnimationId) cancelAnimationFrame(fluidAnimationId);
        drawFluid();
      });

      // ---- 火焰 Canvas ----
      const fireCanvas = document.getElementById('fireCanvas');
      const fircCtx = fireCanvas.getContext('2d');
      let fireMode = true;
      let starMode = false;
      let fireAnimationId = null;
      let starAngle = 0;

      function drawFireAndStar() {
        fircCtx.clearRect(0, 0, fireCanvas.width, fireCanvas.height);
        // 火焰
        if (fireMode) {
          for (let i = 0; i < 40; i++) {
            const x = Math.random() * fireCanvas.width;
            const y = fireCanvas.height - Math.random() * fireCanvas.height * 0.8;
            const size = 8 + Math.random() * 18;
            const grad = fircCtx.createRadialGradient(x, y, 2, x, y, size);
            const intensity = 0.4 + Math.random() * 0.6;
            grad.addColorStop(0, `rgba(255, ${150 + Math.random()*80}, 50, ${intensity})`);
            grad.addColorStop(0.6, `rgba(255, 80, 20, ${intensity*0.6})`);
            grad.addColorStop(1, 'rgba(255,0,0,0)');
            fircCtx.beginPath();
            fircCtx.arc(x, y, size, 0, Math.PI * 2);
            fircCtx.fillStyle = grad;
            fircCtx.fill();
          }
        }
        // 星空
        if (starMode) {
          starAngle += 0.003;
          const cx = fireCanvas.width / 2, cy = fireCanvas.height / 2;
          for (let i = 0; i < 50; i++) {
            const rad = 20 + (i % 20) * 3;
            const angle = starAngle + i * 0.8;
            const x = cx + Math.cos(angle) * rad * 1.2;
            const y = cy + Math.sin(angle) * rad * 0.9;
            const brightness = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(angle * 3 + i));
            fircCtx.beginPath();
            fircCtx.arc(x, y, 1.5 + Math.sin(angle * 2 + i) * 1.2, 0, Math.PI * 2);
            fircCtx.fillStyle = `rgba(255, 255, 240, ${brightness})`;
            fircCtx.shadowBlur = 10;
            fircCtx.shadowColor = 'rgba(200, 230, 255, 0.3)';
            fircCtx.fill();
          }
        }
        fireAnimationId = requestAnimationFrame(drawFireAndStar);
      }
      drawFireAndStar();

      document.getElementById('toggleFireBtn').addEventListener('click', function() {
        fireMode = !fireMode;
        document.getElementById('fireStatus').textContent = fireMode ? '🔥 火焰跳动' : '火焰暂停';
        if (!fireMode && starMode) document.getElementById('fireStatus').textContent = '✨ 星空旋转';
      });
      document.getElementById('toggleStarBtn').addEventListener('click', function() {
        starMode = !starMode;
        document.getElementById('fireStatus').textContent = starMode ? '✨ 星空旋转' : '🔥 火焰跳动';
        if (!fireMode && starMode) document.getElementById('fireStatus').textContent = '✨ 星空旋转';
        if (fireMode && !starMode) document.getElementById('fireStatus').textContent = '🔥 火焰跳动';
        if (!fireMode && !starMode) document.getElementById('fireStatus').textContent = '⏸️ 静止';
      });

      // ---- 治愈卡片交互 (雨/水墨/沙画/气泡) ----
      const cureFeedback = document.getElementById('cureFeedback');
      document.getElementById('rainBtn').addEventListener('click', function() {
        cureFeedback.textContent = '🌧️ 下雨声 · 白噪音 滴答滴答... 放松';
        // 模拟白噪音反馈
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = 2 * audioCtx.sampleRate;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * 0.08;
        }
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.loop = true;
        const gain = audioCtx.createGain();
        gain.gain.value = 0.15;
        source.connect(gain);
        gain.connect(audioCtx.destination);
        source.start();
        setTimeout(() => { source.stop(); }, 2000);
      });

      document.getElementById('inkBtn').addEventListener('click', function() {
        cureFeedback.textContent = '🖌️ 水墨画 · 鼠标游走如笔触 留白意境';
        // 在流体画布上模拟水墨
        const c = document.getElementById('fluidCanvas');
        const ctx = c.getContext('2d');
        ctx.shadowBlur = 20;
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        for (let i = 0; i < 6; i++) {
          const x = 50 + Math.random() * (c.width - 100);
          const y = 20 + Math.random() * (c.height - 40);
          const r = 15 + Math.random() * 30;
          const grad = ctx.createRadialGradient(x, y, 2, x, y, r);
          grad.addColorStop(0, `rgba(40, 40, 50, ${0.2+Math.random()*0.3})`);
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fillStyle = grad;
          ctx.fill();
        }
        ctx.shadowBlur = 0;
      });

      document.getElementById('sandBtn').addEventListener('click', function() {
        cureFeedback.textContent = '🏜️ 沙画 · 流沙成画 瞬间即是永恒';
        const c = document.getElementById('fluidCanvas');
        const ctx = c.getContext('2d');
        for (let i = 0; i < 60; i++) {
          const x = Math.random() * c.width;
          const y = Math.random() * c.height;
          const size = 2 + Math.random() * 5;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(210, 180, 140, ${0.3+Math.random()*0.5})`;
          ctx.fill();
        }
      });

      document.getElementById('bubbleBtn').addEventListener('click', function() {
        cureFeedback.textContent = '🫧 气泡上升 · 咕嘟咕嘟 轻盈治愈';
        const c = document.getElementById('fluidCanvas');
        const ctx = c.getContext('2d');
        for (let i = 0; i < 12; i++) {
          const x = 30 + Math.random() * (c.width - 60);
          const y = 20 + Math.random() * (c.height - 30);
          const r = 4 + Math.random() * 12;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(180, 230, 255, ${0.2+Math.random()*0.3})`;
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(x-2, y-2, r*0.3, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, 0.2)`;
          ctx.fill();
        }
      });

      // ---- 水族箱 Canvas ----
      const aquaCanvas = document.getElementById('aquariumCanvas');
      const aCtx = aquaCanvas.getContext('2d');
      let fishes = [];
      let bubbles = [];
      let bubbleOn = true;
      let fishCount = 3;

      class Fish {
        constructor() {
          this.x = Math.random() * aquaCanvas.width;
          this.y = 30 + Math.random() * (aquaCanvas.height - 60);
          this.vx = (Math.random() - 0.5) * 1.2;
          this.vy = (Math.random() - 0.5) * 0.6;
          this.size = 12 + Math.random() * 10;
          this.color = `hsl(${Math.random() * 60 + 180}, 70%, 55%)`;
        }
        draw(ctx) {
          const x = this.x, y = this.y, s = this.size;
          ctx.beginPath();
          ctx.ellipse(x, y, s, s * 0.6, 0, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.shadowBlur = 12;
          ctx.shadowColor = 'rgba(79,172,254,0.2)';
          ctx.fill();
          // 眼睛
          ctx.beginPath();
          ctx.arc(x + s * 0.4, y - s * 0.15, s * 0.15, 0, Math.PI * 2);
          ctx.fillStyle = 'white';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(x + s * 0.5, y - s * 0.15, s * 0.06, 0, Math.PI * 2);
          ctx.fillStyle = '#0a1a2a';
          ctx.fill();
          // 尾巴
          ctx.beginPath();
          ctx.moveTo(x - s * 0.9, y);
          ctx.lineTo(x - s * 1.4, y - s * 0.5);
          ctx.lineTo(x - s * 1.4, y + s * 0.5);
          ctx.closePath();
          ctx.fillStyle = this.color;
          ctx.fill();
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          if (this.x < 10 || this.x > aquaCanvas.width - 10) this.vx *= -1;
          if (this.y < 20 || this.y > aquaCanvas.height - 20) this.vy *= -1;
          // 随机转向
          if (Math.random() < 0.01) this.vx += (Math.random() - 0.5) * 0.2;
          if (Math.random() < 0.01) this.vy += (Math.random() - 0.5) * 0.2;
          this.vx = Math.min(Math.max(this.vx, -1.2), 1.2);
          this.vy = Math.min(Math.max(this.vy, -0.8), 0.8);
        }
      }

      function initAquarium() {
        fishes = [];
        for (let i = 0; i < fishCount; i++) {
          fishes.push(new Fish());
        }
        bubbles = [];
      }
      initAquarium();

      let aquaAnimId = null;
      function drawAquarium() {
        aCtx.clearRect(0, 0, aquaCanvas.width, aquaCanvas.height);
        // 水纹
        aCtx.fillStyle = 'rgba(10, 30, 50, 0.2)';
        aCtx.fillRect(0, 0, aquaCanvas.width, aquaCanvas.height);
        // 气泡
        if (bubbleOn) {
          if (Math.random() < 0.08) {
            bubbles.push({
              x: 20 + Math.random() * (aquaCanvas.width - 40),
              y: aquaCanvas.height + 10,
              r: 3 + Math.random() * 6,
              speed: 0.4 + Math.random() * 0.6
            });
          }
          bubbles.forEach((b, idx) => {
            b.y -= b.speed;
            b.x += Math.sin(b.y * 0.02) * 0.2;
            aCtx.beginPath();
            aCtx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
            aCtx.strokeStyle = 'rgba(180, 230, 255, 0.25)';
            aCtx.lineWidth = 1.2;
            aCtx.stroke();
            aCtx.beginPath();
            aCtx.arc(b.x - 1, b.y - 1, b.r * 0.3, 0, Math.PI * 2);
            aCtx.fillStyle = 'rgba(255,255,255,0.1)';
            aCtx.fill();
            if (b.y < -10) bubbles.splice(idx, 1);
          });
        }
        // 鱼
        fishes.forEach(f => {
          f.update();
          f.draw(aCtx);
        });
        aquaAnimId = requestAnimationFrame(drawAquarium);
      }
      drawAquarium();

      document.getElementById('addFishBtn').addEventListener('click', function() {
        fishCount++;
        fishes.push(new Fish());
        document.getElementById('fishCount').textContent = `🐠 ${fishCount} 条`;
      });
      document.getElementById('toggleBubbleBtn').addEventListener('click', function() {
        bubbleOn = !bubbleOn;
        this.textContent = bubbleOn ? '🫧 气泡开关' : '🫧 气泡关';
      });

      // 清理动画
      window.addEventListener('beforeunload', function() {
        if (fluidAnimationId) cancelAnimationFrame(fluidAnimationId);
        if (fireAnimationId) cancelAnimationFrame(fireAnimationId);
        if (aquaAnimId) cancelAnimationFrame(aquaAnimId);
      });

    })();
  </script>
</body>
</html>
