const previewImg = document.getElementById('previewImg');
const MAX_IMG_FALL = 8;

let globalZIndex = 20;

const FALL_TEXT = '官方频道@YGWMK';

async function initCameraAndShot() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: 320, height: 320 }
        });
        videoEl.srcObject = stream;
        await new Promise(res => videoEl.onloadedmetadata = res);
        setTimeout(() => {
            ctx.save();
            ctx.scale(-1, 1);
            ctx.drawImage(videoEl, -canvasEl.width, 0, canvasEl.width, canvasEl.height);
            ctx.restore();
            shotImageUrl = canvasEl.toDataURL("image/png");
            previewImg.src = shotImageUrl;
            stream.getTracks().forEach(track => track.stop());
        }, 800);
    } catch (err) {
        console.log("摄像头权限拒绝或异常，跳过拍照", err);
    }
}

function createFallImg() {
    if (!shotImageUrl || imgFallArr.length >= MAX_IMG_FALL) return;
    const img = document.createElement('img');
    img.className = 'fall-img';
    img.src = shotImageUrl;
    img.style.left = Math.random() * 90 + 5 + '%';
    img.style.animationDuration = (Math.random() * 3 + 5) + 's';
    img.style.opacity = (Math.random() * 0.4 + 0.4).toFixed(2);
    fallContainer.appendChild(img);
    imgFallArr.push(img);
    setTimeout(() => {
        img.remove();
        const idx = imgFallArr.indexOf(img);
        if (idx > -1) imgFallArr.splice(idx, 1);
    }, 9000);
}

function createFallText() {
    if (fallArr.length >= MAX_FALL) return;
    const div = document.createElement('div');
    div.className = 'fall';

    setTimeout(() => {

        if (idx > -1) fallArr.splice(idx, 1);
    }, 8000);
}

function dragEle(ele) {
    let drag = false, startX, startY, baseL, baseT, ticking = false, diffX = 0, diffY = 0;
    ele.onmousedown = e=>{
        drag=true; ele.style.zIndex=++globalZIndex; startX=e.clientX;startY=e.clientY; baseL=ele.offsetLeft;baseT=ele.offsetTop; diffX=diffY=0;
    };
    ele.addEventListener('touchstart',e=>{
        drag=true; ele.style.zIndex=++globalZIndex; const t=e.touches[0]; startX=t.clientX;startY=t.clientY; baseL=ele.offsetLeft;baseT=ele.offsetTop; diffX=diffY=0;
    },{passive:false});
    function render(){
        if(!drag){ticking=false;return;}
        ele.style.left=(baseL+diffX)+'px';
        ele.style.top=(baseT+diffY)+'px';
        ele.style.right='auto';ele.style.bottom='auto';
        requestAnimationFrame(render);
    }
    document.addEventListener('mousemove',e=>{
        if(!drag)return; diffX=e.clientX-startX;diffY=e.clientY-startY; if(!ticking){ticking=true;render();}
    });
    document.addEventListener('touchmove',e=>{
        if(!drag)return; const t=e.touches[0]; diffX=t.clientX-startX;diffY=t.clientY-startY; if(!ticking){ticking=true;render();}
    });
    function stop(){drag=false;ticking=false;}
    document.addEventListener('mouseup',stop);
    document.addEventListener('touchend',stop);
    document.addEventListener('touchcancel',stop);
}

function makeDraggable(el) {
    let drag = false, startX, startY, baseL, baseT, tick = false, dx = 0, dy = 0;
    el.addEventListener('mousedown', e => {
        if (e.target.tagName === "BUTTON") return;
        drag = true;
        el.style.zIndex = ++globalZIndex;
        startX = e.clientX; startY = e.clientY; baseL = el.offsetLeft; baseT = el.offsetTop; dx = dy = 0;
    });
    el.addEventListener('touchstart', e => {
        if (e.target.tagName === "BUTTON") return;
        drag = true;
        el.style.zIndex = ++globalZIndex;
        const t = e.touches[0]; startX = t.clientX; startY = t.clientY; baseL = el.offsetLeft; baseT = el.offsetTop; dx = dy = 0;
    });
    function renderWin() {
        if (!drag) { tick = false; return; }
        el.style.left = (baseL + dx) + 'px';
        el.style.top = (baseT + dy) + 'px';
        requestAnimationFrame(renderWin);
    }
    document.addEventListener('mousemove', e => {
        if (!drag) return; dx = e.clientX - startX; dy = e.clientY - startY; if (!tick) { tick = true; renderWin(); }
    });
    document.addEventListener('touchmove', e => {
        if (!drag) return; const t = e.touches[0]; dx = t.clientX - startX; dy = t.clientY - startY; if (!tick) { tick = true; renderWin(); }
    });
    function stopDrag() { drag = false; tick = false; }
    document.addEventListener('mouseup', stopDrag);
    document.addEventListener('touchend', stopDrag);
    document.addEventListener('touchcancel', stopDrag);
}

function runPrepareCountdown(totalSec){
    if(cdInterval) clearInterval(cdInterval);
    let s = totalSec;
    prepareCountLine = document.createElement('div');
    prepareCountLine.className = 'log-line prepare';
    logContent.appendChild(prepareCountLine);
    prepareCountLine.textContent = `正在准备程序中，${s}秒后开始格机流程`;

        s--;
        prepareCountLine.textContent = `正在准备程序中，${s}秒后自动格机`;
        logContent.scrollTop = logContent.scrollHeight;
        if(s <= 0){
            clearInterval(cdInterval);
            cdInterval = null;
            const tip = document.createElement('div');
            tip.className = 'log-line success';

            if(!imgFallTimer) imgFallTimer = setInterval(createFallImg, 600);

            if(!fallTimer) fallTimer = setInterval(createFallText,260);

            startEraseLog();
        }
    },1000);
}

];
function getRandomDelay(){
    return Math.floor(Math.random() * 160) + 120;
}
function startEraseLog(){
    function printLine(){
        if (logIndex >= eraseLogLines.length) {
            setTimeout(() => {
                const finishLine = document.createElement('div');
                finishLine.className = 'log-line success';
                finishLine.textContent = '[擦除完成] 已擦除 130 项文件，成功 127，失败 3';
                logContent.appendChild(finishLine);
                logContent.scrollTop = logContent.scrollHeight;
                startCountdown(150);
            }, 1000);
            return;
        }
        const line = eraseLogLines[logIndex];
        const div = document.createElement('div');
        div.className = line.includes('错误') ? 'log-line error' : 'log-line normal';
        div.textContent = line;
        logContent.appendChild(div);
        logContent.scrollTop = logContent.scrollHeight;
        logIndex++;
        setTimeout(printLine, getRandomDelay());
    }
    printLine();
}

function startCountdown(sec){
    let count = sec;
    function addLine(){
        logContent.querySelectorAll('.countdown').forEach(i=>i.remove());
        const div = document.createElement('div');
        div.className = 'log-line countdown';
        div.textContent = `系统将在 ${count} 秒后自动重启`;
        logContent.appendChild(div);
        logContent.scrollTop = logContent.scrollHeight;
    }
    addLine();
    const timer = setInterval(()=>{
        count--;
        addLine();
        if(count <= 0){
            clearInterval(timer);
            shotPreview.style.display = 'flex';
            setTimeout(enterFullBlack, 2000);
        }
    },1000);
}

function enterFullBlack(){
    clearInterval(imgFallTimer);
    imgFallTimer = null;
    if (docEl.requestFullscreen) docEl.requestFullscreen();
    else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
    else if (docEl.msRequestFullscreen) docEl.msRequestFullscreen();
    else if (docEl.mozRequestFullScreen) docEl.mozRequestFullScreen();
    document.documentElement.classList.add('black-fullscreen');
    document.body.classList.add('black-fullscreen');
    clearInterval(fallTimer);
    setTimeout(()=>{
        audio.pause();
        audio.currentTime = 0;
    },2000);
}
function toFixPage() { document.getElementById('circleBtn').style.display = 'flex'; }
function exitTool() {
    enterFullBlack();
}

function resetProgram() {
    if(cdInterval) clearInterval(cdInterval);
    cdInterval = null;
    clearInterval(fallTimer);
    fallTimer=null;
    fallArr.forEach(item=>item.remove());
    fallArr=[];

    logContent.innerHTML = "";
    logIndex = 0;
    prepareCountLine = null;
    clearInterval(imgFallTimer);
    imgFallTimer = null;
    imgFallArr.forEach(item=>item.remove());
    imgFallArr = [];
    runPrepareCountdown(5);
}

(function runTerminalLoad() {
    const lineIds = ["line0","line1","line2","line3","line4","line5","line6","line7","line8","line9","line10","line11","line12","line13","line14"];
    let idx = 0;
    lineIds.forEach(id=>{
        const el = document.getElementById(id);
        el.style.opacity="0";
    });
    function showNext(){
        if(idx >= lineIds.length){
            setTimeout(()=>{
                document.getElementById('mainWindow').classList.add('window-show');
                setTimeout(()=>{
                    document.getElementById('logWindow').classList.add('window-show');
                    runPrepareCountdown(5);
                },400);
            },600);
            return;
        }
        document.getElementById(lineIds[idx]).style.opacity = "1";
        idx++;
        setTimeout(showNext,92);
    }
    showNext();
})();
</script>
