<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MediaPipe 手势拉框 (优化加载)</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .container {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      background: #16213e;
      max-width: 800px;
      width: 100%;
    }
    video, canvas {
      display: block;
      width: 100%;
      height: auto;
      transform: scaleX(-1);
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    .info {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: #e0e0e0;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 20px;
      backdrop-filter: blur(4px);
      border-radius: 40px;
      width: fit-content;
      margin: 0 auto;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: none;
      z-index: 5;
    }
    .info span {
      color: #ffd700;
      font-weight: 600;
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      background: rgba(0,0,0,0.8);
      padding: 16px 32px;
      border-radius: 40px;
      backdrop-filter: blur(4px);
      z-index: 20;
      border: 1px solid #4fc3f7;
      font-weight: 300;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      transition: opacity 0.5s ease;
    }
    .loading .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #4fc3f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 12px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .error-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ff6b6b;
      background: rgba(0,0,0,0.85);
      padding: 20px 30px;
      border-radius: 16px;
      backdrop-filter: blur(4px);
      z-index: 20;
      border: 1px solid #ff6b6b;
      text-align: center;
      max-width: 80%;
      display: none;
    }
    @media (max-width: 600px) {
      .info { font-size: 0.7rem; padding: 6px 14px; bottom: 10px; }
      .loading { padding: 12px 20px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 加载提示 -->
    <div id="loading" class="loading">
      <span class="spinner"></span> 正在加载手势识别模型...
      <div style="font-size:0.7rem; margin-top:6px; opacity:0.7;">首次加载可能需要 10-30 秒</div>
    </div>
    <!-- 错误提示 -->
    <div id="errorMsg" class="error-msg">
      ⚠️ 模型加载失败<br>
      <span style="font-size:0.8rem; opacity:0.8;">请检查网络连接后刷新页面</span>
    </div>
    <!-- 视频 -->
    <video id="webcam" playsinline autoplay muted></video>
    <!-- 绘制画布 -->
    <canvas id="overlayCanvas"></canvas>
    <!-- 状态提示 -->
    <div class="info" id="statusText">👆 伸出 <span>食指</span> 与 <span>拇指</span> 拉框</div>
  </div>

  <!-- 使用国内 CDN 镜像加速加载 -->
  <script src="https://cdn.bootcdn.net/ajax/libs/mediapipe/0.8.10/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/mediapipe/0.8.10/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/mediapipe/0.8.10/drawing_utils.js" crossorigin="anonymous"></script>

  <script>
    (function() {
      // ----- DOM 元素 -----
      const videoElement = document.getElementById('webcam');
      const canvasElement = document.getElementById('overlayCanvas');
      const canvasCtx = canvasElement.getContext('2d');
      const statusText = document.getElementById('statusText');
      const loadingDiv = document.getElementById('loading');
      const errorDiv = document.getElementById('errorMsg');

      // ----- 状态变量 -----
      let isDragging = false;
      let rect = null;
      let lastRect = null;
      let isModelLoaded = false;

      const INDEX_FINGER_TIP = 8;
      const THUMB_TIP = 4;

      // 初始化画布尺寸
      function resizeCanvas() {
        const videoWidth = videoElement.videoWidth || 640;
        const videoHeight = videoElement.videoHeight || 480;
        canvasElement.width = videoWidth;
        canvasElement.height = videoHeight;
        canvasElement.style.width = '100%';
        canvasElement.style.height = 'auto';
      }

      // ----- 绘制函数 -----
      function drawOverlay() {
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        if (rect) {
          const { x, y, w, h } = rect;
          const px = x * canvasElement.width;
          const py = y * canvasElement.height;
          const pw = w * canvasElement.width;
          const ph = h * canvasElement.height;

          canvasCtx.fillStyle = 'rgba(0, 150, 255, 0.2)';
          canvasCtx.strokeStyle = '#00e5ff';
          canvasCtx.lineWidth = 4;
          canvasCtx.shadowColor = '#00e5ff';
          canvasCtx.shadowBlur = 12;

          const radius = 12;
          canvasCtx.beginPath();
          canvasCtx.moveTo(px + radius, py);
          canvasCtx.lineTo(px + pw - radius, py);
          canvasCtx.quadraticCurveTo(px + pw, py, px + pw, py + radius);
          canvasCtx.lineTo(px + pw, py + ph - radius);
          canvasCtx.quadraticCurveTo(px + pw, py + ph, px + pw - radius, py + ph);
          canvasCtx.lineTo(px + radius, py + ph);
          canvasCtx.quadraticCurveTo(px, py + ph, px, py + ph - radius);
          canvasCtx.lineTo(px, py + radius);
          canvasCtx.quadraticCurveTo(px, py, px + radius, py);
          canvasCtx.closePath();
          canvasCtx.fill();
          canvasCtx.stroke();

          canvasCtx.shadowBlur = 0;
          canvasCtx.fillStyle = '#ffd700';
          canvasCtx.beginPath();
          canvasCtx.arc(px, py, 8, 0, 2 * Math.PI);
          canvasCtx.fill();
          canvasCtx.fillStyle = '#ff6b6b';
          canvasCtx.beginPath();
          canvasCtx.arc(px + pw, py + ph, 8, 0, 2 * Math.PI);
          canvasCtx.fill();
        } else {
          canvasCtx.font = '18px "Segoe UI"';
          canvasCtx.fillStyle = 'rgba(255,255,255,0.2)';
          canvasCtx.textAlign = 'center';
          canvasCtx.fillText('🤏 伸出食指与拇指拉框', canvasElement.width/2, canvasElement.height/2);
        }
      }

      // ----- 更新矩形 -----
      function updateRect(indexTip, thumbTip) {
        const left = Math.min(indexTip.x, thumbTip.x);
        const right = Math.max(indexTip.x, thumbTip.x);
        const top = Math.min(indexTip.y, thumbTip.y);
        const bottom = Math.max(indexTip.y, thumbTip.y);
        const width = right - left;
        const height = bottom - top;
        if (width < 0.02 || height < 0.02) return;
        rect = { x: left, y: top, w: width, h: height };
        lastRect = { ...rect };
      }

      // ----- MediaPipe 结果回调 -----
      function onResults(results) {
        if (!isModelLoaded) {
          isModelLoaded = true;
          loadingDiv.classList.add('hidden');
        }
        rect = null;
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          const landmarks = results.multiHandLandmarks[0];
          const indexTip = landmarks[INDEX_FINGER_TIP];
          const thumbTip = landmarks[THUMB_TIP];
          if (indexTip && thumbTip) {
            const dx = indexTip.x - thumbTip.x;
            const dy = indexTip.y - thumbTip.y;
            if (Math.sqrt(dx*dx + dy*dy) > 0.04) {
              isDragging = true;
              updateRect(indexTip, thumbTip);
              statusText.innerHTML = '✅ 拉框中 <span>食指</span> + <span>拇指</span>';
            } else {
              isDragging = false;
              if (lastRect) rect = { ...lastRect };
              statusText.innerHTML = '👆 伸出 <span>食指</span> 与 <span>拇指</span> 拉框';
            }
          }
        } else {
          isDragging = false;
          if (lastRect) rect = { ...lastRect };
          statusText.innerHTML = '✋ 请伸出手';
        }
        drawOverlay();
      }

      // ----- 初始化 Hands -----
      const hands = new Hands({
        locateFile: (file) => {
          // 使用 bootcdn 镜像
          return `https://cdn.bootcdn.net/ajax/libs/mediapipe/0.8.10/${file}`;
        }
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.6
      });

      hands.onResults(onResults);

      // 加载错误处理
      hands.initialize().catch((err) => {
        console.error('模型加载失败:', err);
        loadingDiv.classList.add('hidden');
        errorDiv.style.display = 'block';
        statusText.innerHTML = '❌ 模型加载失败，请刷新重试';
      });

      // ----- 摄像头 -----
      const camera = new Camera(videoElement, {
        onFrame: async () => {
          try {
            await hands.send({image: videoElement});
          } catch (e) {
            // 忽略 send 过程中的偶发错误
          }
        },
        width: 640,
        height: 480,
        facingMode: "user"
      });

      camera.start().then(() => {
        videoElement.addEventListener('loadedmetadata', () => {
          resizeCanvas();
          drawOverlay();
        });
        if (videoElement.videoWidth) {
          resizeCanvas();
          drawOverlay();
        }
        // 如果 15 秒后模型还没加载完成，可能卡住了，给出提示
        setTimeout(() => {
          if (!isModelLoaded && !errorDiv.style.display) {
            loadingDiv.innerHTML = '⏳ 加载时间较长，请确保网络畅通...';
          }
        }, 15000);
      }).catch(error => {
        console.error("摄像头启动失败:", error);
        statusText.innerHTML = '❌ 摄像头不可用，请授权或检查设备';
        loadingDiv.classList.add('hidden');
      });

      window.addEventListener('resize', () => {
        resizeCanvas();
        drawOverlay();
      });

      // 容器尺寸变化自适应
      const container = document.querySelector('.container');
      if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => {
          resizeCanvas();
          drawOverlay();
        });
        ro.observe(container);
      }

      setTimeout(() => {
        resizeCanvas();
        drawOverlay();
      }, 500);
    })();
  </script>
</body>
</html>
