<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
  <title>玻璃 · 桌面微件</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    :root {
      --primary: #4facfe;
      --accent: #00f2fe;
      --glass-border: rgba(255, 255, 255, 0.14);
      --text: #eaf6ff;
      --subtext: #91a4b8;
      --widget-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, 'Segoe UI', 'Cascadia Code', monospace;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(79, 172, 254, 0.45), transparent 28%),
        radial-gradient(circle at 90% 20%, rgba(0, 242, 254, 0.35), transparent 32%),
        linear-gradient(135deg, #050a18 0%, #081229 45%, #050c22 100%);
      background-attachment: fixed;
    }

    /* 桌面容器 — 固定比例，类似 16:9 或 16:10，居中 */
    .desktop {
      position: relative;
      width: min(100vw, 100vh * 1.6);
      height: min(100vh, 100vw / 1.6);
      max-width: 100vw;
      max-height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      background: transparent;
      /* 保留背景，但让body背景透出，或者加一层非常淡的雾 */
      background: rgba(0, 4, 12, 0.15);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      border-radius: 0;
      box-shadow: none;
    }

    /* 微件容器 — 绝对定位，自由拖动 */
    .widget-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* 让背景点击穿透，但内部可点 */
    }

    .widget-item {
      position: absolute;
      min-width: 120px;
      min-height: 80px;
      padding: 14px 16px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.03));
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      box-shadow: var(--widget-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      cursor: grab;
      pointer-events: auto;
      transition: box-shadow 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
      will-change: transform, left, top;
      touch-action: none; /* 移动端拖拽辅助 */
    }

    .widget-item:active {
      cursor: grabbing;
    }

    .widget-item.dragging {
      opacity: 0.85;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      border-color: rgba(79, 172, 254, 0.5);
      z-index: 999;
      transform: scale(1.02);
      transition: none;
    }

    /* 微件头 */
    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--subtext);
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }

    .widget-header .widget-title {
      color: var(--text);
      font-weight: 500;
      font-size: 13px;
      background: linear-gradient(135deg, #d6eaff, #a8d8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .widget-actions {
      display: flex;
      gap: 6px;
    }

    .widget-actions button {
      background: transparent;
      border: none;
      color: var(--subtext);
      cursor: pointer;
      font-size: 14px;
      padding: 0 2px;
      transition: 0.2s;
      line-height: 1;
      pointer-events: auto;
    }

    .widget-actions button:hover {
      color: #ff7b7b;
      transform: scale(1.1);
    }

    /* 微件内容 */
    .widget-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-size: 14px;
      line-height: 1.5;
      color: #d6eaff;
      min-height: 40px;
    }

    .motto-text {
      font-style: italic;
      font-size: 16px;
      background: linear-gradient(135deg, #d6eaff, #a8d8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    .clock-display {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 2px;
      font-feature-settings: "tnum";
      line-height: 1.2;
    }

    .date-display {
      font-size: 13px;
      color: var(--subtext);
    }

    .weather-temp {
      font-size: 24px;
      font-weight: 400;
    }

    .todo-list {
      list-style: none;
      padding: 0;
      margin: 2px 0 0;
      font-size: 13px;
    }

    .todo-list li {
      padding: 2px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex;
      justify-content: space-between;
    }

    .todo-list li:last-child {
      border-bottom: none;
    }

    /* 座右铭专用微件可以更宽 */
    .widget-motto {
      min-width: 200px;
    }

    /* ----- 控制栏 (类似任务栏) ----- */
    .taskbar {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: auto;
      max-width: 90%;
      background: rgba(0, 4, 12, 0.55);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border: 1px solid var(--glass-border);
      border-radius: 40px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      pointer-events: auto;
      z-index: 1000;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }

    .taskbar select, .taskbar button {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 30px;
      color: #eaf6ff;
      padding: 4px 14px;
      font-size: 13px;
      font-family: inherit;
      backdrop-filter: blur(4px);
      cursor: pointer;
      transition: 0.2s;
      height: 32px;
    }

    .taskbar select:hover, .taskbar button:hover {
      background: rgba(79, 172, 254, 0.18);
      border-color: rgba(79, 172, 254, 0.3);
    }

    .taskbar .btn-danger {
      color: #ff7b7b;
      border-color: rgba(255, 107, 107, 0.2);
    }

    .taskbar .btn-danger:hover {
      background: rgba(255, 107, 107, 0.15);
      border-color: #ff7b7b;
    }

    .taskbar .sep {
      width: 1px;
      height: 24px;
      background: var(--glass-border);
    }

    /* 空状态提示 */
    .empty-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--subtext);
      opacity: 0.3;
      font-size: 18px;
      pointer-events: none;
      white-space: nowrap;
    }

    /* 移动端适配：保持比例，不拉伸 */
    @media (max-aspect-ratio: 16/9) {
      .desktop {
        width: 100vw;
        height: calc(100vw / 1.6);
        max-height: 100vh;
      }
    }

    @media (max-aspect-ratio: 4/3) {
      .desktop {
        width: 100vw;
        height: calc(100vw / 1.6);
        max-height: 100vh;
      }
    }

    @media (max-width: 640px) {
      .taskbar {
        padding: 6px 12px;
        gap: 8px;
        bottom: 8px;
        border-radius: 30px;
        flex-wrap: wrap;
      }
      .taskbar select, .taskbar button {
        font-size: 11px;
        padding: 2px 10px;
        height: 28px;
      }
      .widget-item {
        padding: 10px 12px;
        min-width: 100px;
        min-height: 70px;
      }
      .clock-display {
        font-size: 22px;
      }
      .motto-text {
        font-size: 14px;
      }
      .widget-content {
        font-size: 12px;
      }
      .widget-header .widget-title {
        font-size: 11px;
      }
    }

    /* 让微件在手机上更易点按 */
    @media (pointer: coarse) {
      .widget-item {
        cursor: default;
      }
      .widget-actions button {
        padding: 4px 6px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
<div class="desktop" id="desktop">
  <!-- 微件容器 (绝对定位) -->
  <div class="widget-container" id="widgetContainer">
    <!-- 动态渲染微件 -->
    <div class="empty-hint" id="emptyHint">✦ 点击下方添加微件</div>
  </div>

  <!-- 任务栏 -->
  <div class="taskbar">
    <select id="widgetSelector">
      <option value="motto">📖 座右铭</option>
      <option value="clock">🕒 时钟</option>
      <option value="weather">🌤️ 天气</option>
      <option value="calendar">📅 日历</option>
      <option value="todo">📋 待办</option>
    </select>
    <button id="addWidgetBtn">＋ 添加</button>
    <span class="sep"></span>
    <button id="resetWidgetsBtn" class="btn-danger">⟲ 重置</button>
    <span class="sep"></span>
    <button id="clearWidgetsBtn" class="btn-danger" style="font-size:12px;">✕ 全部清除</button>
  </div>
</div>

<script>
  (function() {
    // ---------- 外部数据 ----------
    const MOTTO_API = 'https://api.btstu.cn/yan/api.php?charset=utf-8&encode=json';
    const FALLBACK_MOTTOS = [
      '生活明朗，万物可爱',
      '凡心所向，素履以往',
      '行而不辍，未来可期',
      '心中有丘壑，眉目作山河',
      '既见君子，云胡不喜'
    ];

    // ---------- 状态 ----------
    let widgets = [];            // { id, type, x, y, data? }
    let nextId = 1;
    let currentMotto = '加载中……';

    const container = document.getElementById('widgetContainer');
    const emptyHint = document.getElementById('emptyHint');
    const widgetSelector = document.getElementById('widgetSelector');
    const addBtn = document.getElementById('addWidgetBtn');
    const resetBtn = document.getElementById('resetWidgetsBtn');
    const clearBtn = document.getElementById('clearWidgetsBtn');

    // 桌面尺寸
    let desktopRect = { width: 0, height: 0 };

    function updateDesktopRect() {
      const desktop = document.getElementById('desktop');
      const rect = desktop.getBoundingClientRect();
      desktopRect.width = rect.width;
      desktopRect.height = rect.height;
    }

    // ---------- 辅助 ----------
    function generateId() { return nextId++; }

    function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

    // 获取随机位置 (避免重叠太严重)
    function getRandomPosition(type) {
      const w = desktopRect.width || window.innerWidth;
      const h = desktopRect.height || window.innerHeight;
      // 不同微件大小不同，粗略估算
      let baseW = 160, baseH = 100;
      if (type === 'motto') { baseW = 220; baseH = 80; }
      else if (type === 'clock') { baseW = 160; baseH = 110; }
      else if (type === 'weather') { baseW = 150; baseH = 100; }
      else if (type === 'calendar') { baseW = 150; baseH = 100; }
      else if (type === 'todo') { baseW = 180; baseH = 130; }

      const pad = 20;
      const maxX = Math.max(w - baseW - pad, pad);
      const maxY = Math.max(h - baseH - pad, pad);
      // 随机分散
      let x = pad + Math.random() * (maxX - pad);
      let y = pad + Math.random() * (maxY - pad);
      // 避免太靠边
      x = clamp(x, pad, w - baseW - pad);
      y = clamp(y, pad, h - baseH - pad);
      return { x, y };
    }

    // ---------- 获取座右铭 ----------
    async function fetchMotto() {
      try {
        const resp = await fetch(MOTTO_API);
        if (!resp.ok) throw new Error('API error');
        const data = await resp.json();
        if (data && data.text) {
          currentMotto = data.text;
          return data.text;
        } else throw new Error('invalid');
      } catch (e) {
        const fallback = FALLBACK_MOTTOS[Math.floor(Math.random() * FALLBACK_MOTTOS.length)];
        currentMotto = fallback;
        return fallback;
      }
    }

    // ---------- 微件渲染 ----------
    function renderWidget(widget) {
      const div = document.createElement('div');
      div.className = 'widget-item';
      div.dataset.id = widget.id;
      div.style.left = widget.x + 'px';
      div.style.top = widget.y + 'px';
      if (widget.type === 'motto') div.classList.add('widget-motto');

      let contentHtml = '';
      const type = widget.type;

      if (type === 'motto') {
        contentHtml = `<div class="motto-text">“ ${currentMotto} ”</div>`;
      } else if (type === 'clock') {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false });
        const dateStr = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
        contentHtml = `
          <div class="clock-display">${timeStr}</div>
          <div class="date-display">${dateStr}</div>
        `;
      } else if (type === 'weather') {
        const temp = Math.round(18 + Math.random() * 10);
        const condition = ['晴', '多云', '小雨', '阴'][Math.floor(Math.random() * 4)];
        contentHtml = `
          <div><span class="weather-temp">${temp}°C</span> · ${condition}</div>
          <div style="font-size:12px; color:var(--subtext);">🌆 实时天气</div>
        `;
      } else if (type === 'calendar') {
        const now = new Date();
        const month = now.getMonth() + 1;
        const day = now.getDate();
        const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
        const wd = weekdays[now.getDay()];
        contentHtml = `
          <div style="font-size:22px; font-weight:300;">${month}月${day}日</div>
          <div style="font-size:13px; color:var(--subtext);">星期${wd} · 第${Math.ceil(day/7)}周</div>
        `;
      } else if (type === 'todo') {
        const tasks = ['📌 完成项目报告', '📌 阅读半小时', '📌 整理笔记'];
        const listHtml = tasks.map(t => `<li>${t}</li>`).join('');
        contentHtml = `
          <ul class="todo-list">${listHtml}</ul>
          <div style="font-size:11px; color:var(--subtext); margin-top:2px;">今日待办</div>
        `;
      } else {
        contentHtml = `<div>未知微件</div>`;
      }

      div.innerHTML = `
        <div class="widget-header">
          <span class="widget-title">${getWidgetLabel(type)}</span>
          <div class="widget-actions">
            <button class="remove-widget" data-id="${widget.id}" title="移除">✕</button>
          </div>
        </div>
        <div class="widget-content">${contentHtml}</div>
      `;

      // 删除
      const removeBtn = div.querySelector('.remove-widget');
      removeBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        const id = parseInt(this.dataset.id);
        removeWidget(id);
      });

      // ---- 拖拽 (鼠标 & 触摸) ----
      let isDragging = false;
      let startX, startY, origX, origY;

      function onPointerDown(e) {
        e.preventDefault();
        const touch = e.touches ? e.touches[0] : e;
        isDragging = true;
        div.classList.add('dragging');
        const rect = div.getBoundingClientRect();
        // 获取桌面偏移
        const desktop = document.getElementById('desktop');
        const dRect = desktop.getBoundingClientRect();
        startX = touch.clientX - dRect.left;
        startY = touch.clientY - dRect.top;
        origX = widget.x;
        origY = widget.y;
        div.setPointerCapture(e.pointerId);
        div.style.zIndex = 999;
      }

      function onPointerMove(e) {
        if (!isDragging) return;
        e.preventDefault();
        const touch = e.touches ? e.touches[0] : e;
        const desktop = document.getElementById('desktop');
        const dRect = desktop.getBoundingClientRect();
        const dx = (touch.clientX - dRect.left) - startX;
        const dy = (touch.clientY - dRect.top) - startY;
        let newX = origX + dx;
        let newY = origY + dy;
        // 边界约束 (考虑微件自身大小)
        const w = div.offsetWidth || 160;
        const h = div.offsetHeight || 100;
        const maxX = Math.max(desktopRect.width - w, 0);
        const maxY = Math.max(desktopRect.height - h, 0);
        newX = clamp(newX, 0, maxX);
        newY = clamp(newY, 0, maxY);
        div.style.left = newX + 'px';
        div.style.top = newY + 'px';
        // 实时更新数据
        widget.x = newX;
        widget.y = newY;
      }

      function onPointerUp(e) {
        if (isDragging) {
          isDragging = false;
          div.classList.remove('dragging');
          div.style.zIndex = '';
          div.releasePointerCapture(e.pointerId);
          // 保存位置 (已经更新到widget)
        }
      }

      // 鼠标
      div.addEventListener('mousedown', onPointerDown);
      document.addEventListener('mousemove', onPointerMove);
      document.addEventListener('mouseup', onPointerUp);
      // 触摸
      div.addEventListener('touchstart', onPointerDown, { passive: false });
      document.addEventListener('touchmove', onPointerMove, { passive: false });
      document.addEventListener('touchend', onPointerUp, { passive: false });

      // 清理监听 (避免内存泄漏，但简单场景)
      div._cleanup = function() {
        document.removeEventListener('mousemove', onPointerMove);
        document.removeEventListener('mouseup', onPointerUp);
        document.removeEventListener('touchmove', onPointerMove);
        document.removeEventListener('touchend', onPointerUp);
      };

      return div;
    }

    function getWidgetLabel(type) {
      const map = { motto: '📖 座右铭', clock: '🕒 时钟', weather: '🌤️ 天气', calendar: '📅 日历', todo: '📋 待办' };
      return map[type] || type;
    }

    // ---------- 核心操作 ----------
    function renderAll() {
      updateDesktopRect();
      // 清空容器（保留emptyHint）
      const children = container.children;
      for (let i = children.length - 1; i >= 0; i--) {
        if (children[i].id !== 'emptyHint') {
          if (children[i]._cleanup) children[i]._cleanup();
          children[i].remove();
        }
      }
      if (widgets.length === 0) {
        emptyHint.style.display = 'block';
      } else {
        emptyHint.style.display = 'none';
        // 按顺序渲染
        widgets.forEach(w => {
          const el = renderWidget(w);
          container.appendChild(el);
        });
      }
      // 更新所有时钟（定时）
      updateClocks();
    }

    function addWidget(type) {
      const pos = getRandomPosition(type);
      const newWidget = { id: generateId(), type: type, x: pos.x, y: pos.y };
      widgets.push(newWidget);
      renderAll();
    }

    function removeWidget(id) {
      const idx = widgets.findIndex(w => w.id === id);
      if (idx !== -1) {
        // 清理DOM
        const children = container.children;
        for (let i = 0; i < children.length; i++) {
          if (children[i].dataset && parseInt(children[i].dataset.id) === id) {
            if (children[i]._cleanup) children[i]._cleanup();
            children[i].remove();
            break;
          }
        }
        widgets.splice(idx, 1);
        renderAll();
      }
    }

    function resetWidgets() {
      // 清除所有
      widgets = [];
      // 默认添加4个
      const types = ['motto', 'clock', 'weather', 'calendar'];
      types.forEach(t => {
        const pos = getRandomPosition(t);
        widgets.push({ id: generateId(), type: t, x: pos.x, y: pos.y });
      });
      // 额外加一个todo
      const pos = getRandomPosition('todo');
      widgets.push({ id: generateId(), type: 'todo', x: pos.x, y: pos.y });
      renderAll();
      // 获取座右铭
      fetchMotto().then(m => {
        currentMotto = m;
        renderAll();
      });
    }

    function clearAll() {
      widgets = [];
      renderAll();
    }

    // 时钟更新 (重新渲染时钟微件内容)
    function updateClocks() {
      // 由于renderAll会重建所有，定时刷新时钟时我们用更轻量的方式：只更新时钟的内容
      // 但为了简单，且微件数量不多，直接重新渲染全部
      // 但我们需要保留位置，所以直接调用renderAll
      // 为了防止闪烁，在renderAll中会保留数据
      // 但为了性能，不频繁刷新，在定时器中调用
      // 这里只做标记，由定时器触发
    }

    // 定时刷新时钟 (每10秒)
    setInterval(() => {
      const hasClock = widgets.some(w => w.type === 'clock');
      if (hasClock) {
        // 只重新渲染，不改变数据
        renderAll();
      }
    }, 10000);

    // 座右铭定时刷新 (每120秒)
    setInterval(async () => {
      const motto = await fetchMotto();
      currentMotto = motto;
      // 如果有座右铭微件，刷新
      const hasMotto = widgets.some(w => w.type === 'motto');
      if (hasMotto) renderAll();
    }, 120000);

    // ---------- 初始化 ----------
    async function init() {
      updateDesktopRect();
      // 获取座右铭
      await fetchMotto();
      // 默认微件
      resetWidgets();

      // 事件绑定
      addBtn.addEventListener('click', function() {
        const type = widgetSelector.value;
        addWidget(type);
      });

      resetBtn.addEventListener('click', function() {
        resetWidgets();
      });

      clearBtn.addEventListener('click', function() {
        clearAll();
      });

      // 窗口变化更新
      window.addEventListener('resize', () => {
        updateDesktopRect();
        // 防止微件跑出边界
        widgets.forEach(w => {
          const wEl = document.querySelector(`.widget-item[data-id="${w.id}"]`);
          const ww = wEl ? wEl.offsetWidth : 160;
          const wh = wEl ? wEl.offsetHeight : 100;
          const maxX = Math.max(desktopRect.width - ww, 0);
          const maxY = Math.max(desktopRect.height - wh, 0);
          w.x = clamp(w.x, 0, maxX);
          w.y = clamp(w.y, 0, maxY);
        });
        renderAll();
      });
    }

    init();
  })();
</script>
