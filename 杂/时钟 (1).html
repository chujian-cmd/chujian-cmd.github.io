<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极简方圆形时钟</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f2f5;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
    }
    .clock {
      background: #fff;
      border-radius: 48px;
      padding: 32px;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 40px;
      background: #eef0f3;
      margin-bottom: 20px;
      cursor: default;
    }
    .digital {
      text-align: center;
      font-size: 2.6rem;
      font-weight: 350;
      letter-spacing: 3px;
      color: #1a2634;
      padding: 4px 0;
    }
    .digital .sec {
      opacity: 0.5;
      font-weight: 300;
    }
    .label {
      text-align: center;
      margin-top: 12px;
      font-size: 0.7rem;
      color: #8a9aaa;
      letter-spacing: 2px;
      border-top: 1px solid rgba(0, 0, 0, 0.04);
      padding-top: 14px;
    }
    @media (max-width: 420px) {
      .clock {
        padding: 24px;
        border-radius: 36px;
      }
      .digital {
        font-size: 2.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="clock">
    <canvas id="clockCanvas" width="400" height="400"></canvas>
    <div class="digital" id="digitalDisplay">
      <span id="hh">00</span>:<span id="mm">00</span>:<span id="ss" class="sec">00</span>
    </div>
    <div class="label">北京时间 · UTC+8</div>
  </div>

  <script>
    const canvas = document.getElementById('clockCanvas');
    const ctx = canvas.getContext('2d');
    const hh = document.getElementById('hh');
    const mm = document.getElementById('mm');
    const ss = document.getElementById('ss');

    const cx = 200,
      cy = 200,
      radius = 180;

    function drawClock() {
      const now = new Date();
      const h = now.getHours() % 12;
      const m = now.getMinutes();
      const s = now.getSeconds();

      // 更新数字
      hh.textContent = String(now.getHours()).padStart(2, '0');
      mm.textContent = String(m).padStart(2, '0');
      ss.textContent = String(s).padStart(2, '0');

      // 清空
      ctx.clearRect(0, 0, 400, 400);

      // 表盘
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fillStyle = '#eef0f3';
      ctx.fill();

      // 刻度
      for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * Math.PI * 2 - Math.PI / 2;
        const len = i % 3 === 0 ? 20 : 14;
        const outer = radius - 6;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(angle) * (outer - len), cy + Math.sin(angle) * (outer - len));
        ctx.lineTo(cx + Math.cos(angle) * outer, cy + Math.sin(angle) * outer);
        ctx.strokeStyle = i % 3 === 0 ? '#1a2634' : '#8a9aaa';
        ctx.lineWidth = i % 3 === 0 ? 2.5 : 1.2;
        ctx.stroke();
      }

      // 分钟刻度（简化，每5分钟一个）
      for (let i = 0; i < 60; i += 5) {
        if (i % 15 === 0) continue;
        const angle = (i / 60) * Math.PI * 2 - Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(angle) * (radius - 10), cy + Math.sin(angle) * (radius - 10));
        ctx.lineTo(cx + Math.cos(angle) * (radius - 6), cy + Math.sin(angle) * (radius - 6));
        ctx.strokeStyle = '#b0bcc8';
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }

      // 画指针
      function drawHand(angle, length, width, color) {
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        const x = cx + Math.cos(angle) * length;
        const y = cy + Math.sin(angle) * length;
        ctx.lineTo(x, y);
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.shadowColor = 'rgba(0,0,0,0.06)';
        ctx.shadowBlur = 4;
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      // 时针 (角度 + 偏移)
      const hAngle = (h / 12) * Math.PI * 2 + (m / 60) * (Math.PI / 6) - Math.PI / 2;
      drawHand(hAngle, radius * 0.5, 5, '#1a2634');

      // 分针
      const mAngle = (m / 60) * Math.PI * 2 + (s / 60) * (Math.PI / 30) - Math.PI / 2;
      drawHand(mAngle, radius * 0.72, 3, '#2c3d50');

      // 秒针
      const sAngle = (s / 60) * Math.PI * 2 - Math.PI / 2;
      drawHand(sAngle, radius * 0.82, 1.4, '#c04a4a');

      // 中心点
      ctx.beginPath();
      ctx.arc(cx, cy, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#1a2634';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx, cy, 2, 0, Math.PI * 2);
      ctx.fillStyle = '#c04a4a';
      ctx.fill();
    }

    drawClock();
    setInterval(drawClock, 1000);
  </script>
</body>
</html>
