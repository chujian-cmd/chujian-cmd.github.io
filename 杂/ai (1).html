<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agnes AI 智能助手</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <style>
        :root {
            --bg-color: #131314;
            --sidebar-bg: #1e1f20;
            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
            --input-bg: #1e1f20;
            --hover-bg: #282a2c;
            --user-bubble-bg: #282a2c;
            --accent-gradient: linear-gradient(74deg, #4285f4 0, #9b72cb 9%, #d96570 20%, #d96570 24%, #9b72cb 35%, #4285f4 44%, #9b72cb 50%, #d96570 56%, #131314 75%, #131314 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- 侧边栏 & 遮罩层 --- */
        .sidebar {
            width: 280px;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            padding: 20px 10px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            flex-shrink: 0;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 90;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        /* --- 通用 UI 组件 --- */
        .menu-btn {
            color: var(--text-secondary);
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-btn:hover { background-color: var(--hover-bg); }

        .new-chat-btn {
            background-color: #1a1a1c;
            color: #444746;
            margin-top: 20px;
            padding: 10px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            cursor: pointer;
            width: fit-content;
            transition: 0.2s;
        }
        .new-chat-btn:hover { background-color: #282a2c; color: var(--text-primary); }
        .new-chat-btn span { margin-left: 10px; font-size: 14px; font-weight: 500; color: var(--text-secondary);}

        .recent-chats { margin-top: 20px; flex-grow: 1; overflow-y: auto; }
        .chat-item {
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-item:hover { background-color: var(--hover-bg); color: var(--text-primary); }

        /* --- 主内容区域 --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            height: 100%;
            width: 100%;
        }

        .top-bar {
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .model-select {
            display: flex;
            align-items: center;
            font-size: 18px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        /* --- 聊天区域 & 滚动 --- */
        .scroll-area {
            flex: 1;
            width: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 150px;
            scroll-behavior: smooth;
        }

        /* 欢迎界面 */
        .welcome-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            padding: 40px 20px;
            margin-top: auto;
            margin-bottom: auto;
            transition: opacity 0.3s;
        }
        .welcome-container.hidden { display: none; }

        .greeting {
            font-size: 56px;
            font-weight: 500;
            line-height: 1.2;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
        }
        .gradient-text {
            background: var(--accent-gradient);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-fill-color: transparent;
            animation: shine 5s linear infinite;
            color: #8ab4f8;
        }
        .sub-greeting {
            font-size: 56px;
            color: #444746;
            font-weight: 500;
            margin-bottom: 40px;
        }

        /* 建议卡片 */
        .cards-grid {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none;
        }
        .cards-grid::-webkit-scrollbar { display: none; }
        
        .card {
            background-color: var(--input-bg);
            padding: 16px;
            border-radius: 12px;
            width: 180px;
            min-width: 180px;
            height: 180px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: background-color 0.2s;
        }
        .card:hover { background-color: var(--hover-bg); }
        .card p { font-size: 15px; color: var(--text-primary); line-height: 1.4; }
        .card-icon { align-self: flex-end; background: #000; padding: 8px; border-radius: 50%; }

        /* --- 聊天消息 --- */
        .chat-container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            display: none;
            flex-direction: column;
            gap: 30px;
        }
        .chat-container.active { display: flex; }

        .message { display: flex; gap: 15px; line-height: 1.6; }
        .message.user { justify-content: flex-end; }
        
        .avatar {
            width: 32px; height: 32px; border-radius: 50%;
            flex-shrink: 0;
            background-size: cover;
        }
        .avatar.ai { 
            background-image: url('https://www.gstatic.com/lamda/images/gemini_sparkle_v002_d4735304ff6292a690345.svg');
            background-color: transparent;
        }
        .avatar.user { background-color: #5f6368; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px;}

        .msg-content { max-width: 80%; }
        .user .msg-content {
            background-color: var(--user-bubble-bg);
            padding: 10px 20px;
            border-radius: 20px 4px 20px 20px;
        }
        
        /* 加载动画 */
        .loading-wave {
            display: inline-block;
            width: 100%;
            height: 20px;
            background: linear-gradient(90deg, #131314 25%, #282a2c 50%, #131314 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 4px;
        }

        /* --- 输入区域 --- */
        .input-area {
            position: absolute;
            bottom: 0;
            width: 100%;
            background-color: var(--bg-color);
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .input-container {
            width: 100%;
            max-width: 800px;
            padding: 0 20px;
        }

        .input-box {
            background-color: var(--input-bg);
            border-radius: 24px;
            padding: 4px 6px 4px 4px;
            display: flex;
            align-items: center;
            gap: 0;
            transition: background-color 0.2s;
        }
        .input-box:focus-within { background-color: var(--hover-bg); }

        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            padding: 8px;
            outline: none;
        }

        .input-box .icon-btn {
            padding: 6px;
            margin: 0;
            border-radius: 50%;
        }

        .input-box .icon-btn:hover {
            background-color: rgba(255,255,255,0.1);
        }

        /* --- 模式切换开关 --- */
        .mode-toggle {
            position: relative;
            display: flex;
            align-items: center;
            background-color: #282a2c;
            border-radius: 20px;
            padding: 3px;
            cursor: pointer;
            transition: background-color 0.3s;
            width: fit-content;
            margin: 0 auto 12px auto;
        }
        
        .mode-btn {
            padding: 5px 10px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 3px;
            color: var(--text-secondary);
            white-space: nowrap;
            z-index: 1;
            position: relative;
            z-index: 2;
        }
        
        .mode-btn.active {
            background-color: transparent;
            color: var(--text-primary);
        }
        
        .mode-btn:hover:not(.active) {
            background-color: #3c4043;
        }
        
        .mode-btn span:not(.material-icons-outlined) {
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        
        .mode-indicator {
            position: absolute;
            width: calc(50% - 3px);
            height: calc(100% - 6px);
            background: linear-gradient(135deg, #4285f4 0%, #9b72cb 100%);
            border-radius: 16px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 0;
            left: 3px;
        }
        
        .mode-indicator.text-mode {
            transform: translateX(0);
        }
        
        .mode-indicator.image-mode {
            transform: translateX(calc(100% + 0px));
        }
        
        .mode-btn span.material-icons-outlined {
            font-size: 14px;
        }

        .icon-btn { color: var(--text-primary); padding: 4px; cursor: pointer; border-radius: 50%; }
        .icon-btn:hover { background-color: #3c4043; }

        .disclaimer { font-size: 11px; color: #8e8e8e; text-align: center; margin-top: 12px; line-height: 1.4; }

        /* --- 图片生成样式 --- */
        .image-container {
            position: relative;
            display: inline-block;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 8px;
        }
        
        .generated-image {
            max-width: 100%;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .generated-image:hover {
            transform: scale(1.02);
        }
        
        .image-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #282a2c;
            border-radius: 12px;
            min-width: 200px;
            min-height: 200px;
        }
        
        .image-loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #3c4043;
            border-top: 3px solid #4285f4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- 图片预览弹窗 --- */
        .image-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .image-modal.active {
            display: flex;
            opacity: 1;
        }
        
        .image-modal img {
            max-width: 95%;
            max-height: 95%;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        .image-modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 32px;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            transition: background 0.2s;
        }
        
        .image-modal-close:hover {
            background: rgba(255,255,255,0.2);
        }

        /* --- 动画 --- */
        @keyframes shine { to { background-position: 200% center; } }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        @keyframes popIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- 响应式 --- */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                height: 100%;
                left: -290px;
                box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            }
            .sidebar.open { transform: translateX(290px); }
            .overlay.open { display: block; opacity: 1; }
            
            .greeting, .sub-greeting { font-size: 32px; }
            .sub-greeting { margin-bottom: 20px; }
            
            .main-content { align-items: stretch; }
            .welcome-container { padding: 20px; margin-top: 20px; justify-content: flex-start; }
            
            .card { width: 160px; min-width: 160px; height: 160px; }
        }
    </style>
</head>
<body>

    <!-- 手机端侧边栏遮罩层 -->
    <div class="overlay" id="overlay"></div>

    <!-- 侧边栏 -->
    <div class="sidebar" id="sidebar">
        <div class="menu-btn" id="close-sidebar-btn" style="align-self: flex-start;"><span class="material-icons-outlined">menu</span></div>
        <div class="new-chat-btn" onclick="location.reload()">
            <span class="material-icons-outlined">add</span>
            <span>新建对话</span>
        </div>
        
        <div class="recent-chats">
            <div style="padding: 10px 15px; font-size: 12px; font-weight: 500; color: var(--text-secondary);">最近对话</div>
            <div class="chat-item">Agnes AI 使用求助</div>
            <div class="chat-item">Python 脚本调试</div>
            <div class="chat-item">日本旅行行程规划</div>
        </div>
        
        <div style="margin-top: auto;">
             <div class="chat-item"><span class="material-icons-outlined" style="vertical-align: middle; margin-right: 10px; font-size: 18px;">help</span>帮助</div>
             <div class="chat-item"><span class="material-icons-outlined" style="vertical-align: middle; margin-right: 10px; font-size: 18px;">settings</span>设置</div>
        </div>
    </div>

    <!-- 主内容 -->
    <div class="main-content">
        <div class="top-bar">
            <div style="display: flex; align-items: center;">
                <div class="menu-btn" id="open-sidebar-btn" style="margin-right: 10px;"><span class="material-icons-outlined">menu</span></div>
                <div class="model-select">
                    <span>Agnes 2.0 Flash</span>
                    <span class="material-icons-outlined" style="font-size: 16px;">arrow_drop_down</span>
                </div>
            </div>
            <div class="icon-btn"><img src="https://ui-avatars.com/api/?name=U&background=random" style="width: 32px; border-radius: 50%;" alt="用户头像"></div>
        </div>

        <div class="scroll-area" id="scroll-area">
            <!-- 欢迎界面 -->
            <div class="welcome-container" id="welcome-view">
                <div class="greeting">
                    <span class="gradient-text">你好，用户</span>
                </div>
                <div class="sub-greeting">今天我能帮你什么？</div>

                <div class="cards-grid">
                    <div class="card" onclick="sendQuery(this.querySelector('p').innerText)">
                        <p>帮写一封关于项目进度的团队邮件</p>
                        <div class="card-icon"><span class="material-icons-outlined">mail</span></div>
                    </div>
                    <div class="card" onclick="sendQuery(this.querySelector('p').innerText)">
                        <p>用 Python 写一个贪吃蛇游戏</p>
                        <div class="card-icon"><span class="material-icons-outlined">code</span></div>
                    </div>
                    <div class="card" onclick="sendQuery(this.querySelector('p').innerText)">
                        <p>制定一个冰岛 7 天旅行计划</p>
                        <div class="card-icon"><span class="material-icons-outlined">flight</span></div>
                    </div>
                    <div class="card" onclick="sendQuery(this.querySelector('p').innerText)">
                        <p>解释量子计算的基本原理</p>
                        <div class="card-icon"><span class="material-icons-outlined">lightbulb</span></div>
                    </div>
                </div>
            </div>

            <!-- 聊天视图 -->
            <div class="chat-container" id="chat-view">
                <!-- 消息会动态注入到这里 -->
            </div>
        </div>

        <div class="input-area">
            <div class="input-container">
                <!-- 模式切换开关 -->
                <div class="mode-toggle" id="modeToggle" onclick="toggleMode()">
                    <div class="mode-indicator text-mode" id="modeIndicator"></div>
                    <div class="mode-btn active" id="textModeBtn">
                        <span class="material-icons-outlined">chat</span>
                        <span>对话</span>
                    </div>
                    <div class="mode-btn" id="imageModeBtn">
                        <span class="material-icons-outlined">image</span>
                        <span>绘图</span>
                    </div>
                </div>
                
                <div class="input-box" id="inputBox">
                    <span class="material-icons-outlined icon-btn">mic</span>
                    <input type="text" id="user-input" placeholder="输入指令或问题..." onkeydown="if(event.key === 'Enter') handleSend()">
                    <span class="material-icons-outlined icon-btn" onclick="handleSend()">send</span>
                </div>
                <p class="disclaimer" id="disclaimerText">
                    Agnes AI 可能会显示不准确的信息，请核实其回复。
                </p>
            </div>
        </div>
    </div>

    <!-- 图片预览弹窗 -->
    <div class="image-modal" id="imageModal" onclick="closeImageModal()">
        <span class="image-modal-close">&times;</span>
        <img id="fullImage" src="" alt="生成的图片">
    </div>

    <script>
        // ============================================================
        //  API 配置 - Agnes AI
        // ============================================================
        const API_BASE_URL = 'https://api.agnes-ai.cn/v1';
        const API_KEY = 'sk-onpU5WOiKpGNVuX5E32G6OqBcPeAzOWld9UK5XmwT41ZXkQJ';
        
        // 模型名称（根据文档）
        const TEXT_MODEL = 'agnes-2.0-flash';        // 文本模型
        const IMAGE_MODEL = 'imagen-3.0-generate-001'; // 图像模型
        
        let currentChatId = null;
        let currentChatHistory = [];
        let currentMode = 'text'; // 'text' 或 'image'
        
        // ============================================================
        //  DOM 引用
        // ============================================================
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const openBtn = document.getElementById('open-sidebar-btn');
        const closeBtn = document.getElementById('close-sidebar-btn');
        const welcomeView = document.getElementById('welcome-view');
        const chatView = document.getElementById('chat-view');
        const userInput = document.getElementById('user-input');
        const scrollArea = document.getElementById('scroll-area');
        const modeIndicator = document.getElementById('modeIndicator');
        const textModeBtn = document.getElementById('textModeBtn');
        const imageModeBtn = document.getElementById('imageModeBtn');
        const disclaimerText = document.getElementById('disclaimerText');

        // ============================================================
        //  侧边栏控制
        // ============================================================
        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        openBtn.addEventListener('click', toggleSidebar);
        closeBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        // ============================================================
        //  模式切换
        // ============================================================
        function toggleMode() {
            currentMode = currentMode === 'text' ? 'image' : 'text';
            
            if (currentMode === 'image') {
                modeIndicator.classList.remove('text-mode');
                modeIndicator.classList.add('image-mode');
                textModeBtn.classList.remove('active');
                imageModeBtn.classList.add('active');
                userInput.placeholder = '描述你想要生成的图片...';
                disclaimerText.textContent = '输入图片描述，AI 将为你生成图片。点击图片可放大查看。';
            } else {
                modeIndicator.classList.remove('image-mode');
                modeIndicator.classList.add('text-mode');
                imageModeBtn.classList.remove('active');
                textModeBtn.classList.add('active');
                userInput.placeholder = '输入指令或问题...';
                disclaimerText.textContent = 'Agnes AI 可能会显示不准确的信息，请核实其回复。';
            }
        }

        // ============================================================
        //  图片预览弹窗
        // ============================================================
        function openImageModal(src) {
            const modal = document.getElementById('imageModal');
            const fullImage = document.getElementById('fullImage');
            fullImage.src = src;
            modal.classList.add('active');
        }

        function closeImageModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.remove('active');
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeImageModal();
        });

        document.getElementById('imageModal').addEventListener('click', function(e) {
            if (e.target === this) closeImageModal();
        });

        // ============================================================
        //  发送消息入口
        // ============================================================
        function sendQuery(text) {
            userInput.value = text;
            handleSend();
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            welcomeView.classList.add('hidden');
            chatView.classList.add('active');
            
            addMessage(text, 'user');
            userInput.value = '';

            if (currentMode === 'image') {
                await generateImage(text);
            } else {
                await handleTextChat(text);
            }
        }

        // ============================================================
        //  图片生成（Agnes AI Images API）
        // ============================================================
        async function generateImage(prompt) {
            const loadingId = 'image-' + Date.now();
            
            const div = document.createElement('div');
            div.className = 'message ai';
            div.id = loadingId;
            div.innerHTML = `
                <div class="avatar ai"></div>
                <div class="msg-content" style="max-width: 400px;">
                    <div class="image-container">
                        <div class="image-loading">
                            <div class="image-loading-spinner"></div>
                            <div>正在生成图片...</div>
                        </div>
                        <img class="generated-image" style="display: none;" 
                             onload="onImageLoad(this, '${loadingId}')" 
                             onerror="onImageError('${loadingId}')"
                             onclick="openImageModal(this.src)">
                    </div>
                </div>
            `;
            chatView.appendChild(div);
            scrollToBottom();

            try {
                const response = await fetch(`${API_BASE_URL}/images/generations`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: IMAGE_MODEL,
                        prompt: prompt,
                        n: 1,
                        size: '1024x1024'
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    onImageError(loadingId, data.error.message);
                    return;
                }

                const imgElement = div.querySelector('.generated-image');
                if (data.data && data.data[0] && data.data[0].url) {
                    imgElement.src = data.data[0].url;
                } else if (data.data && data.data[0] && data.data[0].b64_json) {
                    imgElement.src = `data:image/png;base64,${data.data[0].b64_json}`;
                } else {
                    throw new Error('图片生成失败：未返回有效数据');
                }
            } catch (error) {
                console.error('图片生成失败:', error);
                onImageError(loadingId, error.message || '图片生成失败，请稍后重试');
            }
        }

        function onImageLoad(imgElement, loadingId) {
            const loadingDiv = imgElement.parentElement.querySelector('.image-loading');
            if (loadingDiv) {
                loadingDiv.remove();
            }
            imgElement.style.display = 'block';
            scrollToBottom();
        }

        function onImageError(loadingId, errorMsg) {
            const loadingDiv = document.getElementById(loadingId);
            if (loadingDiv) {
                loadingDiv.innerHTML = `
                    <div class="avatar ai"></div>
                    <div class="msg-content" style="color: #f72585;">
                        ❌ 图片生成失败：${errorMsg || '请稍后重试'}
                    </div>
                `;
            }
        }

        // ============================================================
        //  文字对话（Agnes AI Chat Completions API）
        // ============================================================
        async function handleTextChat(text) {
            const loadingId = addLoading();
            scrollToBottom();

            try {
                const messages = [];
                
                if (currentChatHistory.length > 0) {
                    messages.push(...currentChatHistory);
                }
                
                messages.push({
                    role: 'user',
                    content: text
                });

                const response = await fetch(`${API_BASE_URL}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: TEXT_MODEL,
                        messages: messages,
                        max_tokens: 4096,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                removeLoading(loadingId);

                if (data.error) {
                    typeWriterMessage(`API 错误：${data.error.message || '未知错误'}`);
                    return;
                }

                if (data.choices && data.choices[0] && data.choices[0].message) {
                    const assistantReply = data.choices[0].message.content;
                    
                    currentChatHistory.push(
                        { role: 'user', content: text },
                        { role: 'assistant', content: assistantReply }
                    );
                    
                    if (currentChatHistory.length > 30) {
                        currentChatHistory = currentChatHistory.slice(-30);
                    }
                    
                    typeWriterMessage(assistantReply);
                } else {
                    typeWriterMessage('收到未知格式的响应，请稍后重试。');
                }
            } catch (error) {
                console.error('API请求失败:', error);
                removeLoading(loadingId);
                typeWriterMessage('网络连接出现问题，请检查网络后重试。');
            }
        }

        // ============================================================
        //  UI 辅助函数
        // ============================================================
        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.style.animation = 'popIn 0.3s ease';
            
            const avatar = document.createElement('div');
            avatar.className = `avatar ${sender}`;
            if (sender === 'user') avatar.innerText = '我';

            const content = document.createElement('div');
            content.className = 'msg-content';
            content.innerText = text;

            if (sender === 'ai') {
                div.appendChild(avatar);
                div.appendChild(content);
            } else {
                div.appendChild(content);
                div.appendChild(avatar);
            }
            
            chatView.appendChild(div);
            return content;
        }

        function addLoading() {
            const id = 'loading-' + Date.now();
            const div = document.createElement('div');
            div.className = 'message ai';
            div.id = id;
            div.innerHTML = `
                <div class="avatar ai"></div>
                <div class="msg-content" style="width: 100px;">
                    <div class="loading-wave"></div>
                </div>
            `;
            chatView.appendChild(div);
            return id;
        }

        function removeLoading(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function scrollToBottom() {
            setTimeout(() => {
                scrollArea.scrollTop = scrollArea.scrollHeight;
            }, 50);
        }

        function typeWriterMessage(text) {
            const contentDiv = addMessage('', 'ai');
            let i = 0;
            const speed = 15;

            function type() {
                if (i < text.length) {
                    contentDiv.innerText += text.charAt(i);
                    i++;
                    scrollToBottom();
                    setTimeout(type, speed);
                }
            }
            type();
        }
    </script>
</body>
</html>
