<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>π · 无限计算</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
            font-family: 'Source Serif 4', 'JetBrains Mono', 'Georgia', serif;
        }

        .readme-card {
            max-width: 950px;
            width: 100%;
            background: #161b22;
            border-radius: 12px;
            padding: 3rem 3rem 3.5rem;
            border: 1px solid #30363d;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .readme-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #21262d;
            flex-wrap: wrap;
        }

        .readme-header .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .readme-header .dot:nth-child(1) { background: #f85149; }
        .readme-header .dot:nth-child(2) { background: #d29922; }
        .readme-header .dot:nth-child(3) { background: #3fb950; }

        .readme-header .title {
            color: #8b949e;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            margin-left: 0.5rem;
            opacity: 0.7;
        }
        .readme-header .title span { color: #58a6ff; }

        .control-group {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-family: 'JetBrains Mono', monospace;
        }
        .control-group label {
            color: #8b949e;
            font-size: 0.75rem;
        }
        .control-group input {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #e6edf3;
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            width: 60px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            outline: none;
        }
        .control-group input:focus { border-color: #58a6ff; }
        .control-group button {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 0.3rem 0.9rem;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .control-group button:hover {
            background: #30363d;
            border-color: #58a6ff;
            color: #f0f6fc;
        }
        .control-group button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pi-content {
            font-family: 'Source Serif 4', 'Georgia', serif;
            font-weight: 400;
            font-size: 1.5rem;
            line-height: 2.2rem;
            color: #e6edf3;
            letter-spacing: 0.04em;
            word-break: break-all;
            min-height: 180px;
            padding: 0.5rem 0;
            max-height: 65vh;
            overflow-y: auto;
        }

        .pi-content .char {
            display: inline;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
            animation-delay: calc(var(--i, 0) * 20ms);
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(2px); filter: blur(0.5px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .pi-content .pi-symbol {
            font-weight: 600;
            font-size: 1.7rem;
            color: #f0e6d0;
        }
        .pi-content .dot-char { color: #8b949e; font-weight: 300; }

        .readme-footer {
            margin-top: 2rem;
            padding-top: 1.25rem;
            border-top: 1px solid #21262d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: #484f58;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .readme-footer .badge {
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
        }
        .readme-footer .badge span {
            background: #21262d;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            color: #8b949e;
            font-size: 0.7rem;
            border: 1px solid #30363d;
        }
        .readme-footer .signature {
            color: #58a6ff;
            font-weight: 400;
            opacity: 0.8;
        }
        .readme-footer .stats { color: #484f58; font-size: 0.7rem; }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: #484f58;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            padding-top: 0.5rem;
        }
        .status-bar .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #30363d;
            border-top: 2px solid #58a6ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status-bar .done { color: #3fb950; }

        @media (max-width: 640px) {
            .readme-card { padding: 1.8rem 1.5rem 2.2rem; }
            .pi-content { font-size: 1.1rem; line-height: 1.8rem; min-height: 120px; }
            .pi-content .pi-symbol { font-size: 1.3rem; }
            .readme-footer { flex-direction: column; align-items: flex-start; }
            .control-group { margin-left: 0; width: 100%; }
            .control-group input { flex: 1; }
        }
        @media (max-width: 420px) {
            .pi-content { font-size: 0.95rem; line-height: 1.6rem; }
            .readme-card { padding: 1.2rem 1rem 1.8rem; }
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0d1117; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #484f58; }
    </style>
</head>
<body>

<div class="readme-card">
    <div class="readme-header">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="title"><span>π</span> · 无限计算</span>
        <div class="control-group">
            <label>每批</label>
            <input type="number" id="batchSize" value="100" min="10" max="500" />
            <label>位</label>
            <button id="startBtn">▶ 开始</button>
            <button id="stopBtn" disabled>⏹ 停止</button>
        </div>
    </div>

    <div class="pi-content" id="piDisplay"></div>

    <div class="readme-footer">
        <div class="badge">
            <span>#machin</span>
            <span>#bigint</span>
            <span>#infinite</span>
        </div>
        <div style="display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap;">
            <span class="stats" id="digitCount">位数: 0</span>
            <span class="signature">~ infinite · streaming</span>
        </div>
    </div>
    <div class="status-bar">
        <span class="spinner" id="spinner"></span>
        <span id="statusText">就绪</span>
    </div>
</div>

<script>
    // ========== Machin 公式：π = 16*arctan(1/5) - 4*arctan(1/239) ==========
    function computePiDigits(totalDigits) {
        const EXTRA = 12;
        const N = totalDigits + EXTRA;
        const SCALE = 10n ** BigInt(N);

        // arctan(1/5) 级数
        function arctan5() {
            let sum = 0n;
            let term = SCALE / 5n;
            let div = 1n;
            let sign = 1n;
            while (term > 0) {
                sum += sign * (term / div);
                term = term / 25n;
                div += 2n;
                sign = -sign;
            }
            return sum;
        }

        // arctan(1/239) 级数
        function arctan239() {
            let sum = 0n;
            let term = SCALE / 239n;
            let div = 1n;
            let sign = 1n;
            const denom = 239n * 239n;
            while (term > 0) {
                sum += sign * (term / div);
                term = term / denom;
                div += 2n;
                sign = -sign;
            }
            return sum;
        }

        const pi = 16n * arctan5() - 4n * arctan239();

        let s = pi.toString();
        while (s.length < N + 1) s = '0' + s;
        const intPart = s[0];
        const decPart = s.slice(1, totalDigits + 1);
        return intPart + '.' + decPart;
    }

    // ========== 核心逻辑 ==========
    const container = document.getElementById('piDisplay');
    const digitCountEl = document.getElementById('digitCount');
    const statusText = document.getElementById('statusText');
    const spinner = document.getElementById('spinner');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const batchSizeInput = document.getElementById('batchSize');

    let currentDigits = 0;          // 已显示的位数（不含小数点）
    let piString = '';              // 已显示的完整字符串（含 "3."）
    let running = false;
    let timer = null;
    let totalDisplayed = 0;         // 总字符数（含小数点）

    // 显示已有字符串（首次或重置）
    function renderExisting() {
        container.innerHTML = '';
        const frag = document.createDocumentFragment();
        for (let i = 0; i < piString.length; i++) {
            const ch = piString[i];
            const span = document.createElement('span');
            span.className = 'char';
            if (i === 0 && ch === '3') span.classList.add('pi-symbol');
            else if (ch === '.') span.classList.add('dot-char');
            span.style.setProperty('--i', i);
            span.textContent = ch;
            frag.appendChild(span);
        }
        container.appendChild(frag);
        totalDisplayed = piString.length;
        digitCountEl.textContent = `位数: ${currentDigits}`;
        // 滚动到底部
        container.scrollTop = container.scrollHeight;
    }

    // 追加新字符（带渐显）
    function appendChars(newChars) {
        const frag = document.createDocumentFragment();
        const startIdx = totalDisplayed;
        for (let i = 0; i < newChars.length; i++) {
            const ch = newChars[i];
            const span = document.createElement('span');
            span.className = 'char';
            if (ch === '.') span.classList.add('dot-char');
            span.style.setProperty('--i', startIdx + i);
            span.textContent = ch;
            frag.appendChild(span);
        }
        container.appendChild(frag);
        totalDisplayed += newChars.length;
        currentDigits = piString.length - 1; // 去掉小数点
        digitCountEl.textContent = `位数: ${currentDigits}`;
        container.scrollTop = container.scrollHeight;
    }

    // 计算并追加下一批
    function computeNextBatch() {
        if (!running) return;

        const batch = parseInt(batchSizeInput.value) || 100;
        const target = currentDigits + batch;

        // 限制最大位数（防止浏览器卡死，5000 位以内安全）
        if (target > 5000) {
            statusText.textContent = '已到 5000 位，暂停 ⏸';
            spinner.style.display = 'none';
            running = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            return;
        }

        statusText.textContent = `计算中... ${target} 位`;
        spinner.style.display = 'inline-block';

        // 用 setTimeout 让 UI 先更新
        setTimeout(() => {
            try {
                const newPi = computePiDigits(target);
                // 提取新增部分（从已有长度开始）
                const newPart = newPi.slice(piString.length);
                if (newPart.length > 0) {
                    piString = newPi;
                    appendChars(newPart);
                }
                statusText.textContent = `已计算 ${target} 位 ✅`;
                digitCountEl.textContent = `位数: ${currentDigits}`;
                spinner.style.display = 'inline-block';

                // 继续下一批
                if (running) {
                    timer = setTimeout(computeNextBatch, 400);
                }
            } catch (e) {
                statusText.textContent = '计算错误 ❌';
                running = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                spinner.style.display = 'none';
                console.error(e);
            }
        }, 30);
    }

    // 开始
    function start() {
        if (running) return;
        const batch = parseInt(batchSizeInput.value) || 100;
        if (batch < 1) { batchSizeInput.value = 100; }

        // 如果已经显示了一些，继续追加；否则从 0 开始
        if (currentDigits === 0) {
            // 首次：先计算 200 位作为基础
            statusText.textContent = '初始计算 200 位...';
            spinner.style.display = 'inline-block';
            setTimeout(() => {
                try {
                    piString = computePiDigits(200);
                    currentDigits = 200;
                    renderExisting();
                    statusText.textContent = '初始 200 位完成 ✅';
                    spinner.style.display = 'inline-block';
                    // 开始持续追加
                    running = true;
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    timer = setTimeout(computeNextBatch, 500);
                } catch (e) {
                    statusText.textContent = '初始计算失败 ❌';
                    spinner.style.display = 'none';
                    console.error(e);
                }
            }, 30);
        } else {
            running = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            spinner.style.display = 'inline-block';
            statusText.textContent = '继续计算...';
            timer = setTimeout(computeNextBatch, 300);
        }
    }

    // 停止
    function stop() {
        running = false;
        if (timer) {
            clearTimeout(timer);
            timer = null;
        }
        startBtn.disabled = false;
        stopBtn.disabled = true;
        spinner.style.display = 'none';
        statusText.textContent = `已停止 (${currentDigits} 位) ⏹`;
    }

    // 重置（清空重新开始）
    function reset() {
        stop();
        piString = '';
        currentDigits = 0;
        totalDisplayed = 0;
        container.innerHTML = '';
        digitCountEl.textContent = '位数: 0';
        statusText.textContent = '就绪';
        spinner.style.display = 'inline-block';
        startBtn.disabled = false;
        stopBtn.disabled = true;
    }

    // 事件绑定
    startBtn.addEventListener('click', start);
    stopBtn.addEventListener('click', stop);

    // 输入框回车触发开始
    batchSizeInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') start();
    });

    // 页面加载后自动开始
    window.addEventListener('load', () => {
        setTimeout(start, 300);
    });

    // 如果用户修改位数，重置
    batchSizeInput.addEventListener('change', () => {
        if (currentDigits > 0 && !running) {
            if (confirm('改变批大小将重置当前进度，是否继续？')) {
                reset();
            } else {
                batchSizeInput.value = 100;
            }
        }
    });
</script>
</body>
</html>
