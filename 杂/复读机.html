<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaTeX → HTML 转换器 · 修复跨行</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0f172a;
            font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: #e2e8f0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: #1e293b;
            border-radius: 20px;
            padding: 30px;
            border: 1px solid #334155;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        h1 small {
            font-size: 14px;
            font-weight: 400;
            background: #10b981;
            padding: 2px 14px;
            border-radius: 40px;
            color: white;
        }
        .row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .col {
            flex: 1;
            min-width: 300px;
        }
        textarea {
            width: 100%;
            height: 380px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: #e2e8f0;
            resize: vertical;
            outline: none;
            line-height: 1.6;
        }
        textarea:focus {
            border-color: #3b82f6;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 12px 0;
            align-items: center;
        }
        .btn {
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        .btn-primary:hover {
            background: #2563eb;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #475569;
            color: #94a3b8;
        }
        .btn-outline:hover {
            background: #334155;
            color: #e2e8f0;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .file-label {
            background: #334155;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #475569;
            color: #94a3b8;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .file-label:hover {
            background: #475569;
            color: #e2e8f0;
        }
        .file-label input[type="file"] {
            display: none;
        }
        .file-status {
            font-size: 13px;
            color: #64748b;
            flex: 1;
            min-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-status .filename {
            color: #94a3b8;
        }
        .preview {
            background: #0f172a;
            border-radius: 12px;
            padding: 20px;
            min-height: 280px;
            border: 1px solid #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            position: relative;
            flex-wrap: wrap;
        }
        .preview canvas {
            display: block;
            image-rendering: pixelated;
            max-width: 100%;
            height: auto;
        }
        .empty-hint {
            color: #64748b;
            font-style: italic;
        }
        .stats {
            font-size: 12px;
            color: #64748b;
            margin-top: 8px;
            text-align: center;
        }
        .legend {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
            font-size: 12px;
            color: #94a3b8;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 1px solid #475569;
            flex-shrink: 0;
        }
        .error-msg {
            color: #f87171;
            background: #7f1d1d33;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #7f1d1d;
            max-width: 100%;
            overflow: auto;
            font-size: 14px;
        }
        .block-count {
            font-size: 13px;
            color: #10b981;
            font-weight: 500;
        }
        @media (max-width: 768px) {
            .col {
                min-width: 100%;
            }
            .container {
                padding: 16px;
            }
            .btn-group {
                flex-direction: column;
                align-items: stretch;
            }
            .file-status {
                white-space: normal;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>
        📐 LaTeX → HTML 转换器
        <small>修复跨行 · 支持换行</small>
    </h1>

    <div class="row">
        <div class="col">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:6px;">
                <span style="font-size:14px;color:#94a3b8;">📝 LaTeX 代码</span>
                <span style="font-size:12px;color:#64748b;">支持换行 · 自动合并</span>
            </div>
            <textarea id="latexInput" spellcheck="false"></textarea>

            <div class="btn-group">
                <button class="btn btn-primary" onclick="convert()">▶ 转换</button>
                <label class="file-label">
                    📁 上传文件
                    <input type="file" id="fileInput" accept=".txt,.tex,.md" onchange="handleFile(event)">
                </label>
                <span class="file-status" id="fileStatus"><span style="color:#64748b;">📄 未选择</span></span>
                <button class="btn btn-outline" onclick="clearAll()">🗑️ 清空</button>
            </div>
        </div>

        <div class="col">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                <span style="font-size:14px;color:#94a3b8;">🖼️ 渲染结果</span>
                <span style="font-size:12px;color:#64748b;" id="pixelCount">0 个方块</span>
            </div>
            <div class="preview" id="preview">
                <span class="empty-hint">📢 上传 .txt 文件或粘贴代码后点击「转换」</span>
            </div>
            <div class="legend" id="legend"></div>
            <div class="stats">💡 自动处理换行 · 支持 \(...\) 和 $$...$$ 格式</div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 核心解析器 - 先去掉换行再解析
    // ============================================================

    function parseLatexRlap(text) {
        const blocks = [];

        // 🔥 关键修复：去掉所有换行和多余空格，把跨行的 \rlap{...} 合并
        let content = text.replace(/\s+/g, ' ');

        // 尝试提取 \( ... \) 中的 array
        let parenMatch = content.match(/\\\(\\begin\{array\}.*?\\end\{array\}\\\)/s);
        if (parenMatch) content = parenMatch[0];

        // 尝试提取 $$ ... $$ 中的 array
        let dollarMatch = content.match(/\$\$\\begin\{array\}.*?\\end\{array\}\$\$/s);
        if (dollarMatch) content = dollarMatch[0];

        // 尝试提取 \[ ... \] 中的 array
        let bracketMatch = content.match(/\\\[\\begin\{array\}.*?\\end\{array\}\\\]/s);
        if (bracketMatch) content = bracketMatch[0];

        // 🔥 关键：用 [\s\S] 匹配包括换行在内的所有字符
        // 但我们已经去掉了换行，所以用 [^}]* 就够了
        const regex = /\\rlap\{([^}]*)\}/g;
        let match;

        while ((match = regex.exec(content)) !== null) {
            const inner = match[1];
            const kernMatch = inner.match(/\\kern\{([^}]*)\}/);
            const raiseMatch = inner.match(/\\raisebox\{([^}]*)\}/);
            const colorMatch = inner.match(/\\textcolor\{([^}]*)\}/);
            const ruleMatch = inner.match(/\\rule\{([^}]*)\}\{([^}]*)\}/);

            if (kernMatch && raiseMatch && colorMatch && ruleMatch) {
                blocks.push({
                    x: parseFloat(kernMatch[1]) || 0,
                    y: parseFloat(raiseMatch[1]) || 0,
                    color: colorMatch[1] || '#ff00ff',
                    w: parseFloat(ruleMatch[1]) || 0.5,
                    h: parseFloat(ruleMatch[2]) || 0.5
                });
            }
        }

        // 🔥 如果上面没找到，尝试在原始文本中直接找 \rlap{...}（可能跨行）
        if (blocks.length === 0) {
            // 用 [\s\S] 匹配包括换行的内容
            const regexMulti = /\\rlap\{([^}]*)\}/g;
            let m;
            // 先去掉换行再匹配
            const flat = text.replace(/\s+/g, ' ');
            while ((m = regexMulti.exec(flat)) !== null) {
                const inner = m[1];
                const kernMatch = inner.match(/\\kern\{([^}]*)\}/);
                const raiseMatch = inner.match(/\\raisebox\{([^}]*)\}/);
                const colorMatch = inner.match(/\\textcolor\{([^}]*)\}/);
                const ruleMatch = inner.match(/\\rule\{([^}]*)\}\{([^}]*)\}/);

                if (kernMatch && raiseMatch && colorMatch && ruleMatch) {
                    blocks.push({
                        x: parseFloat(kernMatch[1]) || 0,
                        y: parseFloat(raiseMatch[1]) || 0,
                        color: colorMatch[1] || '#ff00ff',
                        w: parseFloat(ruleMatch[1]) || 0.5,
                        h: parseFloat(ruleMatch[2]) || 0.5
                    });
                }
            }
        }

        return blocks;
    }

    function convert() {
        const input = document.getElementById('latexInput').value;
        const preview = document.getElementById('preview');
        const pixelCount = document.getElementById('pixelCount');
        const legend = document.getElementById('legend');

        if (!input.trim()) {
            preview.innerHTML = `<span class="empty-hint">📢 请上传 .txt 文件或粘贴代码</span>`;
            pixelCount.textContent = '0 个方块';
            legend.innerHTML = '';
            return;
        }

        const blocks = parseLatexRlap(input);

        if (blocks.length === 0) {
            preview.innerHTML = `<div class="error-msg">
                ⚠️ 未找到有效的 \\rlap 命令<br>
                <span style="font-size:13px;color:#94a3b8;">
                    请确保代码包含：\\rlap{\\kern{...}\\raisebox{...}\\textcolor{...}{\\rule{...}{...}}}
                </span>
                <div style="font-size:12px;color:#64748b;margin-top:8px;">
                    💡 提示：你的文件可能包含换行，已自动处理
                </div>
            </div>`;
            pixelCount.textContent = '0 个方块';
            legend.innerHTML = '';
            return;
        }

        // 计算边界
        let minX = Infinity,
            maxX = -Infinity,
            minY = Infinity,
            maxY = -Infinity;
        blocks.forEach(b => {
            if (b.x < minX) minX = b.x;
            if (b.x + b.w > maxX) maxX = b.x + b.w;
            if (b.y < minY) minY = b.y;
            if (b.y + b.h > maxY) maxY = b.y + b.h;
        });

        const padding = 0.5;
        minX -= padding;
        maxX += padding;
        minY -= padding;
        maxY += padding;

        const rangeX = maxX - minX;
        const rangeY = maxY - minY;

        const maxSize = 600;
        const scale = Math.min(maxSize / rangeX, maxSize / rangeY, 50);
        const canvasW = Math.max(1, Math.ceil(rangeX * scale));
        const canvasH = Math.max(1, Math.ceil(rangeY * scale));

        const canvas = document.createElement('canvas');
        canvas.width = canvasW;
        canvas.height = canvasH;
        const ctx = canvas.getContext('2d');

        ctx.clearRect(0, 0, canvasW, canvasH);

        blocks.forEach(b => {
            const x = (b.x - minX) * scale;
            const y = (maxY - (b.y + b.h)) * scale;
            const w = Math.max(1, b.w * scale);
            const h = Math.max(1, b.h * scale);

            let color = b.color;
            if (color.startsWith('#')) {
                // 已经是十六进制
            } else if (color.match(/^[0-9a-fA-F]{6}$/)) {
                color = '#' + color;
            } else {
                const colorMap = {
                    'red': '#ff0000',
                    'green': '#00ff00',
                    'blue': '#0000ff',
                    'black': '#000000',
                    'white': '#ffffff',
                    'brown': '#8b4513',
                    'yellow': '#ffff00',
                    'orange': '#ff8800',
                    'purple': '#8800ff',
                    'pink': '#ff69b4',
                    'gray': '#808080',
                    'cyan': '#00ffff',
                    'magenta': '#ff00ff',
                    'lime': '#00ff00',
                    'maroon': '#800000',
                    'navy': '#000080',
                    'olive': '#808000',
                    'teal': '#008080',
                    'silver': '#c0c0c0',
                    'gold': '#ffd700'
                };
                const lower = color.toLowerCase();
                color = colorMap[lower] || '#ff00ff';
            }

            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
        });

        preview.innerHTML = '';
        preview.appendChild(canvas);

        pixelCount.innerHTML = `<span class="block-count">${blocks.length} 个方块</span>`;

        // 图例
        const colorSet = [];
        const seen = new Set();
        blocks.forEach(b => {
            if (!seen.has(b.color) && colorSet.length < 10) {
                seen.add(b.color);
                colorSet.push(b.color);
            }
        });
        let legendHTML = '';
        colorSet.forEach(c => {
            let displayColor = c;
            if (c.startsWith('#')) displayColor = c;
            else if (c.match(/^[0-9a-fA-F]{6}$/)) displayColor = '#' + c;
            else displayColor = c;
            legendHTML += `<span class="legend-item">
                        <span class="legend-color" style="background:${displayColor};"></span>
                        ${c.length > 12 ? c.slice(0, 10) + '…' : c}
                    </span>`;
        });
        legend.innerHTML = legendHTML || '无颜色信息';
    }

    // ============================================================
    // 文件上传
    // ============================================================

    function handleFile(event) {
        const file = event.target.files[0];
        const status = document.getElementById('fileStatus');

        if (!file) {
            status.innerHTML = `<span style="color:#64748b;">📄 未选择</span>`;
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const content = e.target.result;
            document.getElementById('latexInput').value = content;
            const name = file.name.length > 25 ? file.name.slice(0, 22) + '…' : file.name;
            status.innerHTML = `📄 <span class="filename">${name}</span> ✅ 已加载`;
            convert();
        };
        reader.onerror = function() {
            status.innerHTML = `<span style="color:#ef4444;">❌ 读取失败</span>`;
            alert('文件读取失败，请重试');
        };
        reader.readAsText(file, 'UTF-8');
    }

    // ============================================================
    // 清空
    // ============================================================

    function clearAll() {
        document.getElementById('latexInput').value = '';
        document.getElementById('fileStatus').innerHTML = `<span style="color:#64748b;">📄 已清空</span>`;
        document.getElementById('fileInput').value = '';
        document.getElementById('preview').innerHTML = `<span class="empty-hint">📢 上传 .txt 文件或粘贴代码</span>`;
        document.getElementById('pixelCount').textContent = '0 个方块';
        document.getElementById('legend').innerHTML = '';
    }

    // ============================================================
    // 初始化
    // ============================================================

    window.onload = function() {
        const textarea = document.getElementById('latexInput');
        if (textarea.value.trim()) {
            convert();
        }
    };
</script>
</body>
</html>
