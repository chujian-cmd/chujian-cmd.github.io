    <style>
      .canvas-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f0ebe3;
      }
      .bottle-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 70px;
      }
      .bottle {
        position: relative;
        background: white;
        border: 3px solid #c0c0c0;
        overflow: hidden;
        box-shadow:
          inset 0 0 50px rgba(0,0,0,0.04),
          inset -20px 0 40px rgba(255,255,255,0.5),
          0 8px 30px rgba(0,0,0,0.12);
      }
      .bottle::before {
        content: '';
        position: absolute;
        top: 5%;
        left: 12%;
        width: 18%;
        height: 60%;
        background: linear-gradient(180deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.2) 50%, transparent 100%);
        border-radius: 50%;
        pointer-events: none;
        z-index: 2;
      }
      .bottle canvas {
        display: block;
        cursor: crosshair;
      }
      .bottle-neck {
        background: white;
        border: 3px solid #c0c0c0;
        border-bottom: none;
        border-radius: 4px 4px 0 0;
        margin-bottom: -3px;
        position: relative;
        z-index: 1;
        box-shadow: inset -5px 0 10px rgba(255,255,255,0.4);
      }
      .bottle .tip {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        max-width: 80%;
      }
      .sand-controls {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 12px;
        align-items: center;
        background: white;
        padding: 10px 16px;
        border-radius: 30px;
        box-shadow: 0 2px 20px rgba(0,0,0,0.15);
        z-index: 10;
      }
      .color-pickers {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
      }
      .color-picker-wrap {
        position: relative;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid transparent;
        overflow: hidden;
        cursor: pointer;
        flex-shrink: 0;
        transition: border-color 150ms, transform 150ms;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      }
      .color-picker-wrap:hover {
        transform: scale(1.05);
      }
      .color-picker-wrap.active {
        border-color: #333;
      }
      .color-picker-wrap input {
        width: 150%;
        height: 150%;
        margin: -25%;
        cursor: pointer;
        border: none;
      }
      .color-picker-wrap .key-hint {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font: 11px/1 -apple-system, system-ui, sans-serif;
        color: #444;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255,255,255,0.92);
        pointer-events: none;
      }
      .divider {
        width: 1px;
        height: 28px;
        background: #eee;
        flex-shrink: 0;
      }
      .size-buttons {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }
      .size-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 2px solid #eee;
        background: white;
        cursor: pointer;
        font-family: "Cutive Mono", monospace;
        font-size: 13px;
        font-weight: bold;
        transition: all 150ms ease;
      }
      .size-btn:hover {
        border-color: #ccc;
      }
      .size-btn.active {
        border-color: #333;
        background: #333;
        color: white;
      }
    </style>

    <script>
        var app = new SandToy();
        app.initialize('medium');

        const colorPickers = document.querySelectorAll(".color-picker-wrap");

        function selectColor(index) {
          colorPickers.forEach(p => p.classList.remove("active"));
          colorPickers[index].classList.add("active");
          app.setColor(index);
        }

        // Color picker clicks and color changes
        colorPickers.forEach((picker, index) => {
          // Click to select
          picker.addEventListener("click", () => selectColor(index));

          // Color input change
          const input = picker.querySelector("input");
          input.addEventListener("input", (e) => {
            app.setColor(index, e.target.value);
            picker.style.backgroundColor = e.target.value;
            selectColor(index);
          });
        });

        // Keyboard shortcuts 1, 2, 3
        document.addEventListener("keydown", (e) => {
          if (e.target.tagName === "INPUT") return;
          if (e.key === "1") selectColor(0);
          if (e.key === "2") selectColor(1);
          if (e.key === "3") selectColor(2);
        });

        // Size buttons
        const sizeButtons = document.querySelectorAll(".size-btn");
        sizeButtons.forEach(function (btn) {
          btn.addEventListener("click", (e) => {
            sizeButtons.forEach(b => b.classList.remove("active"));
            e.target.classList.add("active");
            app.initialize(e.target.dataset.size);
          });
        });

        // Trash/clear
        document.querySelector('.trash').addEventListener('click', () => {
          app.clear();
        });

        // Save
        document.querySelector(".save").addEventListener("click", () => {
          const downloadLink = document.createElement("a");
          downloadLink.setAttribute("download", "paint-toys-sand.png");
          const canvas = document.getElementById("canvas");
          canvas.toBlob(function (blob) {
            const url = URL.createObjectURL(blob);
            downloadLink.setAttribute("href", url);
            downloadLink.click();
          });
        });
    </script>
