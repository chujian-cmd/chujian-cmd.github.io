<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>围住贱贱的棋子</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: sans-serif;
            color: #fff;
            overflow: hidden;
        }
        canvas {
            background-color: #e0e0e0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            cursor: pointer;
            border-radius: 10px;
        }
        #info {
            margin-top: 20px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 10px;
            transition: 0.2s;
        }
        button:hover { background-color: #45a049; }
        h2 { margin-bottom: 5px; }
    </style>
</head>
<body>

    <h2>围住那个贱贱的棋子</h2>
    <div id="info">
        <span id="status">点击白圈变黑，堵住它的去路！</span>
        <br>
        <button onclick="initGame()">重新开始</button>
    </div>
    <br>
    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');

    // 游戏配置
    const ROWS = 9;
    const COLS = 9;
    const RADIUS = 18;     // 棋子半径
    const SPACING = 42;    // 格子间距
    const PADDING = 30;    // 边缘留白

    // 画布尺寸
    canvas.width = COLS * SPACING + PADDING * 2;
    canvas.height = ROWS * SPACING + PADDING * 2;

    // 游戏状态：0=空地(白), 1=玩家(黑), 2=逃跑的贱棋子
    let grid = []; 
    let enemy = { x: 4, y: 4 }; // 初始位置在中心
    let gameOver = false;

    // 初始化游戏
    function initGame() {
        grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        enemy = { x: 4, y: 4 };
        grid[enemy.y][enemy.x] = 2;
        gameOver = false;
        statusText.innerText = "点击白圈变黑，堵住它的去路！";
        statusText.style.color = "#fff";
        draw();
    }

    // 绘制普通棋子（白或黑）
    function drawPiece(cx, cy, color) {
        ctx.beginPath();
        ctx.arc(cx, cy, RADIUS, 0, Math.PI * 2);
        
        // 增加一点渐变质感，看起来像棋子
        const gradient = ctx.createRadialGradient(cx - 5, cy - 5, 2, cx, cy, RADIUS);
        if (color === '#ffffff') {
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(1, '#d0d0d0');
        } else {
            gradient.addColorStop(0, '#444444');
            gradient.addColorStop(1, '#000000');
        }
        
        ctx.fillStyle = gradient;
        ctx.fill();
        ctx.strokeStyle = '#999';
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    // 绘制那个“贱贱”的逃跑棋子
    function drawEnemy(cx, cy) {
        // 1. 画黑色棋子底
        ctx.beginPath();
        ctx.arc(cx, cy, RADIUS + 2, 0, Math.PI * 2);
        const gradient = ctx.createRadialGradient(cx - 5, cy - 5, 2, cx, cy, RADIUS + 2);
        gradient.addColorStop(0, '#222222');
        gradient.addColorStop(1, '#000000');
        ctx.fillStyle = gradient;
        ctx.fill();
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 1;
        ctx.stroke();

        // 2. 画贱贱的表情 (白色)
        ctx.strokeStyle = '#ffffff';
        ctx.fillStyle = '#ffffff';
        ctx.lineWidth = 1.5;

        // 左边的眼睛 (小圆点)
        ctx.beginPath();
        ctx.arc(cx - 6, cy - 4, 2, 0, Math.PI * 2);
        ctx.fill();

        // 右边的眼睛 (稍微大一点，配合挑眉)
        ctx.beginPath();
        ctx.arc(cx + 5, cy - 4, 2, 0, Math.PI * 2);
        ctx.fill();

        // 挑逗的眉毛 (一高一低)
        ctx.beginPath();
        ctx.moveTo(cx - 10, cy - 10);
        ctx.lineTo(cx - 3, cy - 9);
        ctx.moveTo(cx + 2, cy - 9);
        ctx.lineTo(cx + 9, cy - 12);
        ctx.stroke();

        // 歪嘴笑 (Smirk)
        ctx.beginPath();
        ctx.moveTo(cx - 6, cy + 6);
        ctx.quadraticCurveTo(cx + 2, cy + 8, cx + 8, cy + 2);
        ctx.stroke();

        // 嘴巴旁边加个小弧线，更显嘲讽
        ctx.beginPath();
        ctx.arc(cx + 8, cy + 2, 2, 0, Math.PI);
        ctx.stroke();
    }

    // 绘图主函数
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                const cx = PADDING + x * SPACING;
                const cy = PADDING + y * SPACING;

                if (grid[y][x] === 0) {
                    drawPiece(cx, cy, '#ffffff'); // 空地白子
                } else if (grid[y][x] === 1) {
                    drawPiece(cx, cy, '#000000'); // 玩家下的黑子
                } else if (grid[y][x] === 2) {
                    drawEnemy(cx, cy);            // 贱贱的逃跑棋子
                }
            }
        }
    }

    // 检查是否到达边缘（逃脱成功）
    function checkEscape(x, y) {
        return x === 0 || x === COLS - 1 || y === 0 || y === ROWS - 1;
    }

    // 核心算法：BFS (广度优先搜索) 找最短逃生路径
    function getNextMove(startX, startY) {
        const queue = [{ x: startX, y: startY, path: [] }];
        const visited = new Set([`${startX},${startY}`]);

        // 8个方向
        const dirs = [
            { dx: 0, dy: -1 }, { dx: 1, dy: 0 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 },
            { dx: -1, dy: -1 }, { dx: 1, dy: -1 }, { dx: 1, dy: 1 }, { dx: -1, dy: 1 }
        ];

        while (queue.length > 0) {
            const current = queue.shift();
            
            // 如果到达边缘
            if (checkEscape(current.x, current.y) && current.path.length > 0) {
                return current.path[0]; // 返回通往边缘的最短路径的第一步
            }

            for (let d of dirs) {
                const nx = current.x + d.dx;
                const ny = current.y + d.dy;

                if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                    // 如果是空地且没被访问过
                    if (grid[ny][nx] === 0 && !visited.has(`${nx},${ny}`)) {
                        visited.add(`${nx},${ny}`);
                        // 把新节点加入队列，并记录路径
                        queue.push({ x: nx, y: ny, path: [...current.path, { x: nx, y: ny }] });
                    }
                }
            }
        }
        return null; // 所有方向都被堵死，无路可走
    }

    // 玩家点击事件
    canvas.addEventListener('mousedown', (e) => {
        if (gameOver) return;

        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;

        // 反推点击的是哪个格子
        const gridX = Math.round((clickX - PADDING) / SPACING);
        const gridY = Math.round((clickY - PADDING) / SPACING);

        // 检查是否在有效范围内
        if (gridX >= 0 && gridX < COLS && gridY >= 0 && gridY < ROWS) {
            // 只能点击白圈（空地）
            if (grid[gridY][gridX] === 0) {
                grid[gridY][gridX] = 1; // 变成玩家黑子
                draw();
                
                // 延迟一下，让玩家看清自己的落子，然后棋子逃跑
                setTimeout(moveEnemy, 120); 
            }
        }
    });

    // 棋子移动逻辑
    function moveEnemy() {
        if (gameOver) return;

        // 如果棋子已经在边缘，直接逃脱成功
        if (checkEscape(enemy.x, enemy.y)) {
            endGame(false);
            return;
        }

        // 计算下一步
        const nextStep = getNextMove(enemy.x, enemy.y);

        if (nextStep) {
            // 执行移动
            grid[enemy.y][enemy.x] = 0; // 原来的位置清空
            enemy.x = nextStep.x;
            enemy.y = nextStep.y;
            grid[enemy.y][enemy.x] = 2; // 新位置放棋子
            draw();

            // 移动后再次检查是否逃脱
            if (checkEscape(enemy.x, enemy.y)) {
                endGame(false);
            }
        } else {
            // 找不到任何通往边缘的路径 = 被围死了
            endGame(true);
        }
    }

    // 游戏结束处理
    function endGame(isWin) {
        gameOver = true;
        if (isWin) {
            statusText.innerText = "🎉 成功围住！贱棋子无路可走！你赢了！";
            statusText.style.color = "#4CAF50";
        } else {
            statusText.innerText = "🏃 棋子逃跑了！它带着贱贱的笑容溜了...你输了！";
            statusText.style.color = "#FF5252";
        }
    }

    // 启动游戏
    initGame();
</script>

</body>
</html>
