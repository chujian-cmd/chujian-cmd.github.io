<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Breakout</title>
<script>if (/^(ar|fa|he|iw|ur)(-|$)/i.test(navigator.language)) document.documentElement.dir = "rtl";</script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #0f1419; --muted: #536471; --panel: #f2f2f2; --cell: #e3e3e3; --accent: #1d9bf0;
    --radius: 12px; --radius-inner: 8px; --gap: 8px; --max: 560px;
    --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
    --paddle: #0f1419; --ball: #1d9bf0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --fg: #e7e9ea; --muted: #71767b; --panel: #141414; --cell: #262626; --paddle: #e7e9ea; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
  .hud { width: 100%; max-width: var(--max); display: flex; gap: var(--gap); flex-shrink: 0; }
  .stat { flex: 1; min-width: 0; background: var(--panel); border-radius: var(--radius); padding: 8px 12px; text-align: center; }
  .stat span { display: block; font-size: 11px; line-height: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .stat b { display: block; font-size: 20px; line-height: 24px; font-variant-numeric: tabular-nums; }
  .tool { font: inherit; font-size: 15px; font-weight: 700; border: 0; border-radius: var(--radius); padding: 0 14px; background: var(--panel); color: var(--fg);
    display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; transition: transform .12s var(--ease); }
  .tool:active { transform: scale(.95); }
  .tool svg { width: 20px; height: 20px; }
  .bump { animation: bump .3s var(--spring); }
  @keyframes bump { 40% { transform: scale(1.2); } }
  #wrap { position: relative; flex: 1; min-height: 0; width: 100%; max-width: var(--max); }
  canvas { width: 100%; height: 100%; display: block; border-radius: var(--radius); background: var(--panel); }
  .overlay { position: absolute; inset: 0; z-index: 2; border-radius: var(--radius); background: rgba(0, 0, 0, .55); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; text-align: center;
    transition: opacity .2s var(--ease), visibility 0s; }
  .overlay > * { transition: transform .3s var(--spring); }
  .overlay.hidden { opacity: 0; visibility: hidden; transition: opacity .2s var(--ease), visibility 0s linear .2s; }
  .overlay.hidden > * { transform: translateY(8px) scale(.96); }
  .overlay h2 { margin: 0; font-size: 28px; line-height: 32px; font-weight: 800; }
  .overlay p { margin: 0; font-size: 15px; line-height: 20px; opacity: .85; }
  .overlay p:empty { display: none; }
  .play { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 20px; margin-top: 8px; border-radius: 9999px;
    background: #fff; color: #000; font-size: 15px; font-weight: 700; }
  .hint { max-width: var(--max); color: var(--muted); font-size: 13px; line-height: 16px; text-align: center; flex-shrink: 0; margin: 0; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
  [dir="rtl"] .stage, [dir="rtl"] body > #wrap, [dir="rtl"] .controls { direction: ltr; }
  [dir="rtl"] .hint, [dir="rtl"] .tool { unicode-bidi: plaintext; }
  @media (orientation: landscape) and (max-height: 540px) {
    body { display: grid; grid-template-columns: minmax(112px, 168px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto;
      grid-template-areas: "hud stage" "hud hint"; justify-items: center; }
    body:has(.controls) { grid-template-columns: minmax(112px, 168px) minmax(0, 1fr) auto; grid-template-areas: "hud stage controls" "hud hint controls"; }
    .hud { grid-area: hud; flex-direction: column; align-self: start; }
    .hud > * { flex: 0 0 auto; min-height: 44px; }
    .hud canvas, #next { width: 100%; height: 56px; }
    .stage, body > #wrap { grid-area: stage; width: 100%; height: 100%; max-width: none; }
    .controls { grid-area: controls; align-self: end; width: 264px; }
    .hint { grid-area: hint; }
  }
</style>
</head>
<body>
  <div class="hud">
    <div class="stat"><span>Score</span><b id="score">0</b></div>
    <div class="stat"><span>Lives</span><b id="lives">3</b></div>
    <div class="stat"><span>Level</span><b id="level">1</b></div>
    <button class="tool" id="pause" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
  </div>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div class="overlay" id="overlay"><h2 id="title">Breakout</h2><p id="sub">Drag anywhere to move the paddle and clear every brick.</p><span class="play" id="cta">Play</span></div>
  </div>
<script>
(function () {
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay'), titleEl = document.getElementById('title'), subEl = document.getElementById('sub');
  const ctaEl = document.getElementById('cta');
  const scoreEl = document.getElementById('score'), livesEl = document.getElementById('lives'), levelEl = document.getElementById('level');
  const ROWS = 6, COLS = 8;
  const COLORS = ['#f4212e', '#ff7a00', '#ffd400', '#00ba7c', '#1d9bf0', '#7856ff'];
  const FRAME_MS = 1000 / 60, MAX_FRAMES_PER_STEP = 3, DRAG_GAIN = 1.2, SPEEDUP = 1.015, MAX_SPEEDUP = 1.5, OVER_DELAY_MS = 650, BANNER_MS = 1200;
  const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const colors = {};
  let W, H, paddle, ball, bricks, score, lives, level, best, state = 'ready', overlayShown = true, raf = 0, lastTime;
  let particles = [], trail = [], banner = null, shakeUntil = 0, squash = 0, baseSpeed = 0, bricksBornAt = 0;

  function readColors() {
    const style = getComputedStyle(document.documentElement);
    ['paddle', 'ball', 'fg', 'muted'].forEach(k => { colors[k] = style.getPropertyValue('--' + k).trim(); });
  }
  const VIBRATE_FALLBACK = { tick: 8, confirm: [15, 40, 15], reject: [40, 60, 80], heavy: 30 };
  function haptic(kind) {
    try {
      if (window.XGamesHaptics) window.XGamesHaptics.postMessage(kind);
      else if (navigator.vibrate) navigator.vibrate(VIBRATE_FALLBACK[kind]);
    } catch (e) {}
  }
  function bump(el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  function loadBest() { try { return Number(localStorage.getItem('bestBreakout') || 0); } catch (e) { return 0; } }
  function saveBest() { try { localStorage.setItem('bestBreakout', String(best)); } catch (e) {} }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const prevW = W, prevH = H, w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!w || !h) return;
    W = w; H = h;
    if (!paddle) { newGame(); return; }
    rescaleWorld(W / prevW, H / prevH);
    layoutPaddle();
    if (state === 'ready') attachBall();
    draw(performance.now());
  }
  function rescaleWorld(sx, sy) {
    if (!isFinite(sx) || !isFinite(sy)) return;
    bricks.forEach(b => { b.x *= sx; b.w *= sx; b.y *= sy; b.h *= sy; });
    ball.x *= sx; ball.y *= sy;
  }
  function layoutPaddle() {
    const x = paddle ? paddle.x + paddle.w / 2 : W / 2;
    paddle = { w: Math.max(64, W * 0.22), h: 12, x: 0, y: H - 40 };
    paddle.x = Math.min(Math.max(0, x - paddle.w / 2), W - paddle.w);
  }
  function buildBricks() {
    bricks = [];
    const gap = 4, top = Math.max(12, Math.min(20, H * 0.04)), bw = (W - gap * (COLS + 1)) / COLS;
    const bh = Math.max(8, Math.min(18, (H * 0.35 - top - gap * (ROWS - 1)) / ROWS));
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      bricks.push({ x: gap + c * (bw + gap), y: top + r * (bh + gap), w: bw, h: bh, color: COLORS[r % COLORS.length], alive: true, delay: (r + c) * 22 });
    }
    bricksBornAt = performance.now();
  }
  function attachBall() { ball.x = paddle.x + paddle.w / 2; ball.y = paddle.y - ball.r - 1; }
  function resetBall() {
    ball = { x: 0, y: 0, r: 7, vx: 0, vy: 0 };
    attachBall(); trail = [];
  }
  function newGame() {
    score = 0; lives = 3; level = 1; best = loadBest();
    layoutPaddle(); buildBricks(); resetBall();
    state = 'ready'; updateHud(); draw(performance.now());
  }

  function showOverlay(title, sub, cta) { titleEl.textContent = title; subEl.textContent = sub; ctaEl.textContent = cta; overlay.classList.remove('hidden'); overlayShown = true; }
  function hideOverlay() { overlay.classList.add('hidden'); overlayShown = false; }

  function launch() {
    if (state === 'over') newGame();
    hideOverlay();
    baseSpeed = 4.5 + (level - 1) * 0.6;
    const angle = (-Math.PI / 2) + (Math.random() * 0.8 - 0.4);
    ball.vx = Math.cos(angle) * baseSpeed; ball.vy = Math.sin(angle) * baseSpeed;
    state = 'play'; banner = null;
    ensureLoop();
  }
  function pause() {
    if (state !== 'play') return;
    state = 'paused'; showOverlay('Paused', '', 'Resume');
  }
  function resume() { state = 'play'; hideOverlay(); ensureLoop(); }

  function loseLife() {
    lives--; updateHud(); bump(livesEl);
    haptic('heavy');
    shake(320);
    if (lives <= 0) {
      state = 'over';
      const record = score > best;
      if (record) { best = score; saveBest(); haptic('confirm'); }
      setTimeout(() => showOverlay(record ? 'New best!' : 'Game over', record ? 'Score ' + score : 'Score ' + score + ' · Best ' + best, 'Play again'), REDUCED_MOTION ? 0 : OVER_DELAY_MS);
      return;
    }
    state = 'ready'; resetBall();
  }
  function nextLevel() {
    level++; buildBricks(); resetBall(); updateHud(); bump(levelEl);
    haptic('confirm');
    state = 'ready';
    banner = { text: 'Level ' + level, at: performance.now() };
  }

  function shake(ms) { if (!REDUCED_MOTION) shakeUntil = performance.now() + ms; }
  function burst(x, y, color, count) {
    if (REDUCED_MOTION) return;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * 3;
      particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, size: 2 + Math.random() * 3, color });
    }
  }

  function stepBall(frames) {
    const speed = Math.hypot(ball.vx, ball.vy);
    const steps = Math.max(1, Math.ceil(speed * frames / (ball.r * 0.8)));
    const f = frames / steps;
    for (let s = 0; s < steps && state === 'play'; s++) {
      ball.x += ball.vx * f; ball.y += ball.vy * f;
      if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
      if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
      if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }
      if (ball.y - ball.r > H) { loseLife(); return; }
      if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h && ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
        const hit = Math.max(-1, Math.min(1, ((ball.x - paddle.x) / paddle.w) * 2 - 1));
        const next = Math.min(Math.hypot(ball.vx, ball.vy) * SPEEDUP, baseSpeed * MAX_SPEEDUP);
        const angle = -Math.PI / 2 + hit * (Math.PI / 3);
        ball.vx = Math.cos(angle) * next; ball.vy = Math.sin(angle) * next;
        ball.y = paddle.y - ball.r;
        squash = 1;
      }
      for (const b of bricks) {
        if (!b.alive) continue;
        if (ball.x + ball.r < b.x || ball.x - ball.r > b.x + b.w || ball.y + ball.r < b.y || ball.y - ball.r > b.y + b.h) continue;
        b.alive = false; score += 10 * level;
        burst(b.x + b.w / 2, b.y + b.h / 2, b.color, 10);
        const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
        const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
        if (overlapX < overlapY) ball.vx = -ball.vx; else ball.vy = -ball.vy;
        updateHud();
        break;
      }
      if (bricks.every(b => !b.alive)) { nextLevel(); return; }
    }
  }

  function updateFx(frames) {
    particles.forEach(p => { p.x += p.vx * frames; p.y += p.vy * frames; p.vy += 0.15 * frames; p.life -= 0.03 * frames; });
    particles = particles.filter(p => p.life > 0);
    if (state === 'play') { trail.push({ x: ball.x, y: ball.y }); if (trail.length > 8) trail.shift(); } else trail = [];
    squash = Math.max(0, squash - 0.12 * frames);
    if (banner && performance.now() - banner.at > BANNER_MS) banner = null;
  }

  function loop(now) {
    raf = 0;
    const frames = lastTime === undefined ? 1 : Math.min((now - lastTime) / FRAME_MS, MAX_FRAMES_PER_STEP);
    lastTime = now;
    if (state === 'play') stepBall(frames);
    updateFx(frames);
    draw(now);
    const idle = state === 'paused' || state === 'over' || (state === 'ready' && overlayShown);
    if (!idle || particles.length || banner || now < shakeUntil) raf = requestAnimationFrame(loop);
    else lastTime = undefined;
  }
  function ensureLoop() { if (!raf) { lastTime = undefined; raf = requestAnimationFrame(loop); } }

  function draw(now) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    if (now < shakeUntil) ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
    bricks.forEach(b => {
      if (!b.alive) return;
      const age = REDUCED_MOTION ? 1 : Math.max(0, Math.min(1, (now - bricksBornAt - b.delay) / 260));
      if (age <= 0) return;
      const k = 1 - Math.pow(1 - age, 3);
      ctx.globalAlpha = k; ctx.fillStyle = b.color;
      roundRect(b.x + b.w * (1 - k) / 2, b.y + b.h * (1 - k) / 2, b.w * k, b.h * k, 4);
    });
    ctx.globalAlpha = 1;
    const pw = paddle.w * (1 + 0.08 * squash), ph = paddle.h * (1 - 0.3 * squash);
    ctx.fillStyle = colors.paddle;
    roundRect(paddle.x - (pw - paddle.w) / 2, paddle.y + (paddle.h - ph), pw, ph, ph / 2);
    ctx.fillStyle = colors.ball;
    trail.forEach((p, i) => {
      ctx.globalAlpha = (i + 1) / trail.length * 0.25;
      ctx.beginPath(); ctx.arc(p.x, p.y, ball.r * (0.5 + 0.5 * (i + 1) / trail.length), 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    if (state !== 'over') { ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill(); }
    particles.forEach(p => { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); });
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center';
    if (banner) {
      const p = Math.min(1, (now - banner.at) / 300);
      ctx.globalAlpha = Math.min(p, 1 - Math.max(0, (now - banner.at - BANNER_MS + 300) / 300));
      ctx.fillStyle = colors.fg; ctx.font = '800 28px system-ui, sans-serif';
      ctx.fillText(banner.text, W / 2, H * 0.55);
      ctx.globalAlpha = 1;
    }
    if (state === 'ready' && !overlayShown) {
      ctx.fillStyle = colors.muted; ctx.font = '600 15px system-ui, sans-serif';
      ctx.fillText('Tap to launch', W / 2, H * 0.55 + (banner ? 32 : 0));
    }
    ctx.restore();
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();
  }
  function updateHud() {
    scoreEl.textContent = score;
    livesEl.textContent = lives;
    levelEl.textContent = level;
  }

  const wrap = document.getElementById('wrap');
  let drag = null;
  wrap.addEventListener('pointerdown', e => {
    drag = { id: e.pointerId, x: e.clientX, paddleX: paddle.x, startState: state, overlayAtStart: overlayShown };
    if (state === 'ready' && !overlayShown) ensureLoop();
  });
  wrap.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id || state === 'over' || state === 'paused') return;
    paddle.x = Math.min(Math.max(0, drag.paddleX + (e.clientX - drag.x) * DRAG_GAIN), W - paddle.w);
    if (state === 'ready') { attachBall(); if (overlayShown) draw(performance.now()); }
  });
  wrap.addEventListener('pointerup', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const { startState, overlayAtStart } = drag;
    drag = null;
    if (startState === 'play') return;
    if (state === 'paused') resume();
    else if (state === 'ready' || (state === 'over' && overlayShown && overlayAtStart)) launch();
  });
  wrap.addEventListener('pointercancel', () => { drag = null; });
  new ResizeObserver(resize).observe(canvas);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColors(); draw(performance.now()); });
  document.getElementById('pause').addEventListener('click', pause);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  readColors();
  resize();
})();
</script>
</body>
</html>
