<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>2048</title>
<script>if (/^(ar|fa|he|iw|ur)(-|$)/i.test(navigator.language)) document.documentElement.dir = "rtl";</script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #0f1419; --muted: #536471; --panel: #f2f2f2; --cell: #e3e3e3; --accent: #1d9bf0;
    --radius: 12px; --radius-inner: 8px; --gap: 8px; --max: 560px;
    --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --fg: #e7e9ea; --muted: #71767b; --panel: #141414; --cell: #262626; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
  .hud { width: 100%; max-width: var(--max); display: flex; gap: var(--gap); flex-shrink: 0; }
  .stat { position: relative; flex: 1; min-width: 0; background: var(--panel); border-radius: var(--radius); padding: 8px 12px; text-align: center; }
  .stat span { display: block; font-size: 11px; line-height: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .stat b { display: block; font-size: 20px; line-height: 24px; font-variant-numeric: tabular-nums; }
  .tool { font: inherit; font-size: 15px; font-weight: 700; border: 0; border-radius: var(--radius); padding: 0 16px; background: var(--panel); color: var(--fg);
    transition: transform .12s var(--ease); }
  .tool:active { transform: scale(.95); }
  .tool { display: inline-flex; align-items: center; justify-content: center; padding: 0 14px; }
  .tool svg { width: 20px; height: 20px; }
  .plus { position: absolute; left: 0; right: 0; bottom: 8px; font-size: 15px; font-weight: 800; color: var(--accent); pointer-events: none; animation: plus .7s var(--ease) forwards; }
  @keyframes plus { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-28px); } }
  .stage { flex: 1; min-height: 0; width: 100%; max-width: var(--max); display: flex; align-items: center; justify-content: center; container-type: size; }
  .hint.gone { opacity: 0; }
  .bump { animation: bump .3s var(--spring); }
  @keyframes bump { 40% { transform: scale(1.2); } }
  .hint { transition: opacity .3s var(--ease); max-width: var(--max); color: var(--muted); font-size: 13px; line-height: 16px; text-align: center; flex-shrink: 0; margin: 0; }
  #board { position: relative; width: min(100%, 60vh); width: min(100cqw, 100cqh); aspect-ratio: 1; background: var(--panel); border-radius: var(--radius); padding: 8px;
    display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 8px; }
  .bgcell { border-radius: var(--radius-inner); background: var(--cell); }
  #tiles { position: absolute; inset: 8px; }
  .tile { position: absolute; transition: transform .12s var(--ease); will-change: transform; }
  .tile.new { transition: none; }
  .tile-inner { width: 100%; height: 100%; border-radius: var(--radius-inner); background: var(--cell); display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: clamp(16px, 7vw, 40px); color: #776e65; }
  .tile.new .tile-inner { animation: tile-in .18s var(--spring) .08s backwards; }
  .tile.merged .tile-inner { animation: tile-pop .2s var(--ease); }
  .v2 .tile-inner { background: #eee4da } .v4 .tile-inner { background: #ede0c8 } .v8 .tile-inner { background: #f2b179; color: #fff } .v16 .tile-inner { background: #f59563; color: #fff }
  .v32 .tile-inner { background: #f67c5f; color: #fff } .v64 .tile-inner { background: #f65e3b; color: #fff } .v128 .tile-inner { background: #edcf72; color: #fff; font-size: clamp(14px, 6vw, 34px) }
  .v256 .tile-inner { background: #edcc61; color: #fff; font-size: clamp(14px, 6vw, 34px) } .v512 .tile-inner { background: #edc850; color: #fff; font-size: clamp(14px, 6vw, 34px) }
  .v1024 .tile-inner { background: #edc53f; color: #fff; font-size: clamp(12px, 5vw, 28px) } .v2048 .tile-inner { background: #edc22e; color: #fff; font-size: clamp(12px, 5vw, 28px) }
  .big .tile-inner { background: #3c3a32; color: #fff; font-size: clamp(12px, 5vw, 28px) }
  .overlay { position: absolute; inset: 0; z-index: 2; border-radius: var(--radius); background: rgba(0, 0, 0, .55); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; text-align: center;
    transition: opacity .2s var(--ease), visibility 0s; }
  .overlay > * { transition: transform .3s var(--spring); }
  .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .2s var(--ease), visibility 0s linear .2s; }
  .overlay.hidden > * { transform: translateY(8px) scale(.96); }
  .overlay h2 { margin: 0; font-size: 28px; line-height: 32px; font-weight: 800; }
  .play { font: inherit; font-size: 15px; font-weight: 700; border: 0; border-radius: 9999px; min-height: 40px; padding: 0 20px; margin-top: 8px; background: #fff; color: #000;
    transition: transform .12s var(--ease); }
  .play:active { transform: scale(.95); }
  @keyframes tile-in { from { transform: scale(0); } }
  @keyframes tile-pop { 50% { transform: scale(1.16); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; } }
  [dir="rtl"] .stage, [dir="rtl"] body > #wrap, [dir="rtl"] .controls { direction: ltr; }
  [dir="rtl"] .hint, [dir="rtl"] .tool { unicode-bidi: plaintext; }
  @media (orientation: landscape) and (max-height: 540px) {
    body { display: grid; grid-template-columns: minmax(112px, 168px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto;
      grid-template-areas: "hud stage" "hud hint"; justify-items: center; }
    body:has(.controls) { grid-template-columns: minmax(112px, 168px) minmax(0, 1fr) auto; grid-template-areas: "hud stage controls" "hud hint controls"; }
    .hud { grid-area: hud; flex-direction: column; align-self: start; }
    .hud > * { flex: 0 0 auto; min-height: 44px; }
    .hud canvas, #next { width: 100%; height: 56px; }
    .stage, body > #wrap { grid-area: stage; width: 100%; height: 100%; max-width: none; }
    .controls { grid-area: controls; align-self: end; width: 264px; }
    .hint { grid-area: hint; }
  }
</style>
</head>
<body>
  <div class="hud">
    <div class="stat" id="scoreStat"><span>Score</span><b id="score">0</b></div>
    <div class="stat"><span>Best</span><b id="best">0</b></div>
    <button class="tool" id="new" aria-label="New game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4v4h-4"/></svg></button>
  </div>
  <div class="stage">
    <div id="board">
      <div id="tiles"></div>
      <div class="overlay hidden" id="overlay"><h2 id="msg"></h2><button class="play" id="again">Play again</button></div>
    </div>
  </div>
  <p class="hint">Swipe anywhere to move the tiles. Matching tiles merge.</p>
<script>
(function () {
  const SIZE = 4, GAP = 8, MOVE_MS = 120, SWIPE_MIN = 24;
  const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const board = document.getElementById('board');
  const tilesLayer = document.getElementById('tiles');
  const overlay = document.getElementById('overlay');
  const msg = document.getElementById('msg');
  const scoreEl = document.getElementById('score');
  const scoreStat = document.getElementById('scoreStat');
  const bestEl = document.getElementById('best');
  let grid, score, best, startBest, over, wonShown, pendingMerge = null, moveTimer;
  const hintEl = document.querySelector('.hint');

  function loadBest() { try { return Number(localStorage.getItem('best2048') || 0); } catch (e) { return 0; } }
  function saveBest() { try { localStorage.setItem('best2048', String(best)); } catch (e) {} }
  const VIBRATE_FALLBACK = { tick: 8, confirm: [15, 40, 15], reject: [40, 60, 80], heavy: 30 };
  function haptic(kind) {
    try {
      if (window.XGamesHaptics) window.XGamesHaptics.postMessage(kind);
      else if (navigator.vibrate) navigator.vibrate(VIBRATE_FALLBACK[kind]);
    } catch (e) {}
  }

  function cellPx() { return (tilesLayer.clientWidth - GAP * (SIZE - 1)) / SIZE; }

  for (let i = 0; i < SIZE * SIZE; i++) {
    const bg = document.createElement('div');
    bg.className = 'bgcell';
    board.insertBefore(bg, tilesLayer);
  }

  function init() {
    clearTimeout(moveTimer); pendingMerge = null;
    tilesLayer.querySelectorAll('.tile').forEach(t => t.remove());
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
    score = 0; over = false; wonShown = false;
    best = loadBest(); startBest = best;
    hintEl.classList.remove('gone');
    addTile(); addTile();
    overlay.classList.add('hidden');
    updateHud();
  }

  function tileClass(v) { return v > 2048 ? 'big' : 'v' + v; }

  function makeTile(r, c, v) {
    const el = document.createElement('div');
    el.className = 'tile new ' + tileClass(v);
    const inner = document.createElement('div');
    inner.className = 'tile-inner';
    inner.textContent = v;
    el.appendChild(inner);
    tilesLayer.appendChild(el);
    const t = { r, c, v, el, inner };
    layout(t);
    return t;
  }

  function layout(t) {
    const s = cellPx();
    t.el.style.width = s + 'px'; t.el.style.height = s + 'px';
    t.el.style.transform = 'translate(' + t.c * (s + GAP) + 'px, ' + t.r * (s + GAP) + 'px)';
  }

  function addTile() {
    const empty = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (!grid[r][c]) empty.push([r, c]);
    if (!empty.length) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    grid[r][c] = makeTile(r, c, Math.random() < 0.9 ? 2 : 4);
  }

  function lineCells(i, dir) {
    const out = [];
    for (let j = 0; j < SIZE; j++) {
      if (dir === 0) out.push([i, j]);
      else if (dir === 2) out.push([i, SIZE - 1 - j]);
      else if (dir === 1) out.push([j, i]);
      else out.push([SIZE - 1 - j, i]);
    }
    return out;
  }

  function move(dir) { // 0 left, 1 up, 2 right, 3 down
    if (over || !overlay.classList.contains('hidden')) return;
    settle();
    if (over || !overlay.classList.contains('hidden')) return;
    let moved = false;
    const mergedPairs = [];
    for (let i = 0; i < SIZE; i++) {
      const cells = lineCells(i, dir);
      const ts = cells.map(([r, c]) => grid[r][c]).filter(Boolean);
      const placed = [];
      for (let k = 0; k < ts.length; k++) {
        if (k + 1 < ts.length && ts[k].v === ts[k + 1].v) {
          mergedPairs.push([ts[k], ts[k + 1]]);
          placed.push(ts[k]);
          k++;
        } else {
          placed.push(ts[k]);
        }
      }
      cells.forEach(([r, c]) => { grid[r][c] = null; });
      placed.forEach((t, j) => {
        const [r, c] = cells[j];
        if (t.r !== r || t.c !== c) moved = true;
        t.r = r; t.c = c;
        grid[r][c] = t;
      });
    }
    if (!moved && !mergedPairs.length) return;
    hintEl.classList.add('gone');
    mergedPairs.forEach(([keep, gone]) => { gone.r = keep.r; gone.c = keep.c; gone.el.style.zIndex = '0'; keep.el.style.zIndex = '1'; });
    tilesLayer.querySelectorAll('.tile.new, .tile.merged').forEach(t => t.classList.remove('new', 'merged'));
    for (const row of grid) for (const t of row) if (t) layout(t);
    mergedPairs.forEach(([, gone]) => layout(gone));
    pendingMerge = mergedPairs;
    moveTimer = setTimeout(settle, REDUCED_MOTION ? 0 : MOVE_MS);
  }

  function settle() {
    if (!pendingMerge) return;
    clearTimeout(moveTimer);
    const mergedPairs = pendingMerge;
    pendingMerge = null;
    let gained = 0;
    mergedPairs.forEach(([keep, gone]) => {
      gone.el.remove();
      keep.v *= 2; gained += keep.v;
      keep.inner.textContent = keep.v;
      keep.el.className = 'tile merged ' + tileClass(keep.v);
    });
    score += gained;
    addTile();
    if (score > best) { best = score; saveBest(); }
    updateHud();
    if (gained) { showGain(gained); haptic('tick'); }
    if (!canMove()) {
      over = true;
      const record = score > startBest;
      haptic(record ? 'confirm' : 'reject');
      if (record) { bestEl.classList.remove('bump'); void bestEl.offsetWidth; bestEl.classList.add('bump'); }
      showOverlay(record ? 'New best!' : 'Game over', 'Play again');
    }
    else if (!wonShown && hasTile(2048)) { wonShown = true; haptic('confirm'); showOverlay('You made 2048!', 'Keep going'); }
  }

  function showGain(value) {
    if (REDUCED_MOTION) return;
    const el = document.createElement('div');
    el.className = 'plus'; el.textContent = '+' + value;
    scoreStat.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  function hasTile(v) {
    for (const row of grid) for (const t of row) if (t && t.v >= v) return true;
    return false;
  }

  function canMove() {
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      if (!grid[r][c]) return true;
      if (c < SIZE - 1 && grid[r][c + 1] && grid[r][c].v === grid[r][c + 1].v) return true;
      if (r < SIZE - 1 && grid[r + 1][c] && grid[r][c].v === grid[r + 1][c].v) return true;
    }
    return false;
  }

  function showOverlay(text, buttonTitle) {
    msg.textContent = text;
    document.getElementById('again').textContent = buttonTitle;
    overlay.classList.remove('hidden');
  }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  let swipe = null;
  document.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    swipe = { id: e.pointerId, x: e.clientX, y: e.clientY, done: false };
  });
  document.addEventListener('pointermove', e => {
    if (!swipe || swipe.done || e.pointerId !== swipe.id) return;
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_MIN) return;
    swipe.done = true;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 2 : 0) : (dy > 0 ? 3 : 1));
  });
  document.addEventListener('pointerup', () => { swipe = null; });
  document.addEventListener('pointercancel', () => { swipe = null; });
  document.addEventListener('keydown', e => {
    const map = { ArrowLeft: 0, ArrowUp: 1, ArrowRight: 2, ArrowDown: 3 };
    if (e.key in map) { e.preventDefault(); move(map[e.key]); }
  });
  document.getElementById('new').addEventListener('click', init);
  document.getElementById('again').addEventListener('click', () => { if (over) init(); else overlay.classList.add('hidden'); });
  new ResizeObserver(() => { if (grid) for (const row of grid) for (const t of row) if (t) layout(t); }).observe(tilesLayer);
  init();
})();
</script>
</body>
</html>
