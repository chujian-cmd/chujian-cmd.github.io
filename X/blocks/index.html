<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Blocks</title>
<script>if (/^(ar|fa|he|iw|ur)(-|$)/i.test(navigator.language)) document.documentElement.dir = "rtl";</script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #0f1419; --muted: #536471; --panel: #f2f2f2; --cell: #e3e3e3; --accent: #1d9bf0;
    --radius: 12px; --radius-inner: 8px; --gap: 8px; --max: 560px;
    --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
    --grid: rgba(0, 0, 0, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --fg: #e7e9ea; --muted: #71767b; --panel: #141414; --cell: #262626; --grid: rgba(255, 255, 255, .06); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
  .hud { width: 100%; max-width: var(--max); display: flex; gap: var(--gap); flex-shrink: 0; }
  .stat { flex: 1; min-width: 0; background: var(--panel); border-radius: var(--radius); padding: 8px 12px; text-align: center; }
  .stat span { display: block; font-size: 11px; line-height: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .stat b { display: block; font-size: 20px; line-height: 24px; font-variant-numeric: tabular-nums; }
  .tool { font: inherit; font-size: 15px; font-weight: 700; border: 0; border-radius: var(--radius); padding: 0 14px; background: var(--panel); color: var(--fg);
    display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; transition: transform .12s var(--ease); }
  .tool:active { transform: scale(.95); }
  .tool svg { width: 20px; height: 20px; }
  .bump { animation: bump .3s var(--spring); }
  @keyframes bump { 40% { transform: scale(1.2); } }
  #next { width: 54px; align-self: stretch; background: var(--panel); border-radius: var(--radius); }
  #wrap { position: relative; flex: 1; width: 100%; max-width: var(--max); min-height: 0; display: flex; justify-content: center; }
  #c { border-radius: var(--radius); background: var(--panel); display: block; }
  .overlay { position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 2; border-radius: var(--radius); background: rgba(0, 0, 0, .55); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; text-align: center;
    transition: opacity .2s var(--ease), visibility 0s; }
  .overlay > * { transition: transform .3s var(--spring); }
  .overlay.hidden { opacity: 0; visibility: hidden; transition: opacity .2s var(--ease), visibility 0s linear .2s; }
  .overlay.hidden > * { transform: translateY(8px) scale(.96); }
  .overlay h2 { margin: 0; font-size: 28px; line-height: 32px; font-weight: 800; }
  .overlay p { margin: 0; font-size: 15px; line-height: 20px; opacity: .85; }
  .overlay p:empty { display: none; }
  .play { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 20px; margin-top: 8px; border-radius: 9999px;
    background: #fff; color: #000; font-size: 15px; font-weight: 700; }
  .controls { width: 100%; max-width: var(--max); display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--gap); flex-shrink: 0; }
  .controls button { height: 56px; border: 0; border-radius: var(--radius); background: var(--panel); color: var(--fg); display: flex; align-items: center; justify-content: center;
    transition: transform .1s var(--ease), background-color .1s var(--ease); }
  .controls button svg { width: 24px; height: 24px; }
  .controls button.on { background: var(--cell); transform: scale(.94); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
  [dir="rtl"] .stage, [dir="rtl"] body > #wrap, [dir="rtl"] .controls { direction: ltr; }
  [dir="rtl"] .hint, [dir="rtl"] .tool { unicode-bidi: plaintext; }
  @media (orientation: landscape) and (max-height: 540px) {
    body { display: grid; grid-template-columns: minmax(112px, 168px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto;
      grid-template-areas: "hud stage" "hud hint"; justify-items: center; }
    body:has(.controls) { grid-template-columns: minmax(112px, 168px) minmax(0, 1fr) auto; grid-template-areas: "hud stage controls" "hud hint controls"; }
    .hud { grid-area: hud; flex-direction: column; align-self: start; }
    .hud > * { flex: 0 0 auto; min-height: 44px; }
    .hud canvas, #next { width: 100%; height: 56px; }
    .stage, body > #wrap { grid-area: stage; width: 100%; height: 100%; max-width: none; }
    .controls { grid-area: controls; align-self: end; width: 264px; }
    .hint { grid-area: hint; }
  }
</style>
</head>
<body>
  <div class="hud">
    <div class="stat"><span>Score</span><b id="score">0</b></div>
    <div class="stat"><span>Lines</span><b id="lines">0</b></div>
    <div class="stat"><span>Level</span><b id="level">1</b></div>
    <canvas id="next"></canvas>
    <button class="tool" id="pause" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
  </div>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div class="overlay" id="overlay"><h2 id="title">Blocks</h2><p id="sub">Tap to rotate, drag to move, swipe down to drop. Clear full lines.</p><span class="play" id="cta">Play</span></div>
  </div>
  <div class="controls">
    <button data-a="left" aria-label="Left"><svg viewBox="0 0 24 24"><path d="M7 12l9-7v14z" fill="currentColor" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg></button>
    <button data-a="rotate" aria-label="Rotate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12a7 7 0 1 1-2.05-4.95"/><path d="M19 4v4h-4"/></svg></button>
    <button data-a="right" aria-label="Right"><svg viewBox="0 0 24 24"><path d="M17 12l-9 7V5z" fill="currentColor" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg></button>
    <button data-a="soft" aria-label="Soft drop"><svg viewBox="0 0 24 24"><path d="M12 17l-7-9h14z" fill="currentColor" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg></button>
    <button data-a="drop" aria-label="Hard drop"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15l-6-7h12z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><rect x="5" y="17" width="14" height="2.6" rx="1.3"/></svg></button>
  </div>
<script>
(function () {
  const COLS = 10, ROWS = 20;
  const CLEAR_MS = 280, LOCK_FLASH_MS = 160, DROP_TRAIL_MS = 220;
  const HOLD_DELAY_MS = 150, HOLD_REPEAT_MS = 50, LOCK_DELAY_MS = 500, MAX_LOCK_RESETS = 15;
  const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const nextCanvas = document.getElementById('next'), nctx = nextCanvas.getContext('2d');
  const overlay = document.getElementById('overlay'), titleEl = document.getElementById('title'), subEl = document.getElementById('sub');
  const ctaEl = document.getElementById('cta');
  const SHAPES = {
    I: [[1, 1, 1, 1]], O: [[1, 1], [1, 1]], T: [[0, 1, 0], [1, 1, 1]], S: [[0, 1, 1], [1, 1, 0]],
    Z: [[1, 1, 0], [0, 1, 1]], J: [[1, 0, 0], [1, 1, 1]], L: [[0, 0, 1], [1, 1, 1]]
  };
  const COLORS = { I: '#1d9bf0', O: '#ffd400', T: '#7856ff', S: '#00ba7c', Z: '#f4212e', J: '#0891b2', L: '#ff7a00' };
  let grid, piece, next, score, lines, level, running, paused, timer, dropInterval, gameOverPending;
  let clearing = null, lockFlash = null, animRaf = null, lockAt = 0, lockResets = 0, bag = [], dropTrail = null, pausedLockLeft = 0;

  function emptyGrid() { return Array.from({ length: ROWS }, () => Array(COLS).fill(null)); }
  function randomPiece() {
    if (!bag.length) {
      bag = Object.keys(SHAPES);
      for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
    }
    const k = bag.pop();
    const shape = SHAPES[k].map(r => r.slice());
    return { k, shape, x: Math.floor((COLS - shape[0].length) / 2), y: 0 };
  }
  function collides(p, dx, dy, shape) {
    shape = shape || p.shape;
    for (let r = 0; r < shape.length; r++) for (let c = 0; c < shape[r].length; c++) {
      if (!shape[r][c]) continue;
      const x = p.x + c + dx, y = p.y + r + dy;
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
    return false;
  }
  function rotate(shape) { return shape[0].map((_, c) => shape.map(r => r[c]).reverse()); }

  function reset() {
    grid = emptyGrid(); score = 0; lines = 0; level = 1; dropInterval = 800; bag = []; dropTrail = null;
    piece = randomPiece(); next = randomPiece();
    clearing = null; lockFlash = null;
    updateHud(); draw(); drawNext();
  }
  const VIBRATE_FALLBACK = { tick: 8, confirm: [15, 40, 15], reject: [40, 60, 80], heavy: 30 };
  function haptic(kind) {
    try {
      if (window.XGamesHaptics) window.XGamesHaptics.postMessage(kind);
      else if (navigator.vibrate) navigator.vibrate(VIBRATE_FALLBACK[kind]);
    } catch (e) {}
  }
  function bump(el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  function loadBest() { try { return Number(localStorage.getItem('bestBlocks') || 0); } catch (e) { return 0; } }
  function saveBest(value) { try { localStorage.setItem('bestBlocks', String(value)); } catch (e) {} }
  function start() {
    if (gameOverPending) { gameOverPending = false; reset(); }
    paused = false; running = true; overlay.classList.add('hidden');
    if (clearing) { ensureAnim(); return; }
    if (pausedLockLeft) { lockAt = performance.now() + pausedLockLeft; pausedLockLeft = 0; clearTimeout(timer); timer = setTimeout(step, lockAt - performance.now()); return; }
    schedule();
  }
  function pause() {
    if (!running) return;
    running = false; paused = true; clearTimeout(timer);
    pausedLockLeft = lockAt ? Math.max(0, lockAt - performance.now()) : 0;
    titleEl.textContent = 'Paused'; subEl.textContent = ''; ctaEl.textContent = 'Resume';
    overlay.classList.remove('hidden');
  }
  function schedule() { clearTimeout(timer); timer = setTimeout(step, dropInterval); }
  function step() {
    if (!running || clearing) return;
    if (move(0, 1)) { schedule(); return; }
    const now = performance.now();
    if (!lockAt) lockAt = now + LOCK_DELAY_MS;
    if (now >= lockAt) { lock(); return; }
    clearTimeout(timer); timer = setTimeout(step, lockAt - now);
  }
  function refreshLock() {
    if (!collides(piece, 0, 1)) { if (lockAt) { lockAt = 0; schedule(); } return; }
    if (lockAt && lockResets < MAX_LOCK_RESETS) { lockResets++; lockAt = performance.now() + LOCK_DELAY_MS; clearTimeout(timer); timer = setTimeout(step, LOCK_DELAY_MS); }
  }

  function move(dx, dy) {
    if (!running || clearing || collides(piece, dx, dy)) return false;
    piece.x += dx; piece.y += dy;
    if (dx) refreshLock(); else if (!collides(piece, 0, 1)) lockAt = 0;
    draw(); return true;
  }
  function doRotate() {
    if (!running || clearing) return;
    const rotated = rotate(piece.shape);
    for (const kick of [0, -1, 1, -2, 2, -3, 3]) {
      if (!collides(piece, kick, 0, rotated)) { piece.shape = rotated; piece.x += kick; refreshLock(); draw(); return; }
    }
  }
  function hardDrop() {
    if (!running || clearing) return;
    const fromY = piece.y;
    while (move(0, 1)) score += 1;
    if (!REDUCED_MOTION && piece.y > fromY) dropTrail = { shape: piece.shape, x: piece.x, fromY, toY: piece.y, color: COLORS[piece.k], at: performance.now() };
    haptic('tick');
    lock();
  }
  function softDrop() {
    if (!running || clearing) return;
    if (move(0, 1)) { score += 1; updateHud(); schedule(); } else if (!lockAt) step();
  }
  function lock() {
    clearTimeout(timer); lockAt = 0; lockResets = 0;
    const lockedCells = [];
    piece.shape.forEach((row, r) => row.forEach((v, c) => {
      if (!v) return;
      const y = piece.y + r;
      if (y >= 0) { grid[y][piece.x + c] = piece.k; lockedCells.push([piece.x + c, y]); }
    }));
    if (!REDUCED_MOTION) lockFlash = { cells: lockedCells, at: performance.now() };
    const fullRows = [];
    grid.forEach((row, y) => { if (row.every(Boolean)) fullRows.push(y); });
    if (fullRows.length && !REDUCED_MOTION) {
      clearing = { rows: fullRows, at: performance.now() };
      ensureAnim();
      return;
    }
    if (fullRows.length) collapseRows(fullRows);
    spawnNext();
    ensureAnim();
  }
  function collapseRows(rows) {
    const cleared = rows.length;
    grid = grid.filter((_, y) => !rows.includes(y));
    while (grid.length < ROWS) grid.unshift(Array(COLS).fill(null));
    const previousLevel = level;
    lines += cleared; score += [0, 100, 300, 500, 800][cleared] * level;
    level = Math.floor(lines / 10) + 1;
    haptic(cleared >= 4 ? 'confirm' : 'tick');
    bump(document.getElementById('lines'));
    if (level !== previousLevel) bump(document.getElementById('level')); dropInterval = Math.max(120, 800 - (level - 1) * 70);
  }
  function spawnNext() {
    piece = next; next = randomPiece();
    updateHud(); drawNext();
    if (collides(piece, 0, 0)) { gameOver(); return; }
    draw();
    schedule();
  }
  function ensureAnim() {
    if (animRaf) return;
    const tick = now => {
      animRaf = null;
      let active = false;
      if (lockFlash) {
        if (now - lockFlash.at >= LOCK_FLASH_MS) lockFlash = null; else active = true;
      }
      if (dropTrail) {
        if (now - dropTrail.at >= DROP_TRAIL_MS) dropTrail = null; else active = true;
      }
      if (clearing) {
        if (now - clearing.at >= CLEAR_MS && paused) {
          clearing.at = now - CLEAR_MS;
        } else if (now - clearing.at >= CLEAR_MS) {
          const rows = clearing.rows;
          clearing = null;
          collapseRows(rows);
          spawnNext();
        } else {
          active = true;
        }
      }
      draw();
      if (active) animRaf = requestAnimationFrame(tick);
    };
    animRaf = requestAnimationFrame(tick);
  }
  function gameOver() {
    running = false; clearTimeout(timer); gameOverPending = true;
    const previous = loadBest(), record = score > previous, best = Math.max(score, previous);
    haptic(record ? 'confirm' : 'reject');
    saveBest(best);
    titleEl.textContent = record ? 'New best!' : 'Game over'; subEl.textContent = record ? 'Score ' + score : 'Score ' + score + ' · Best ' + best; ctaEl.textContent = 'Play again';
    overlay.classList.remove('hidden');
  }
  function updateHud() {
    document.getElementById('score').textContent = score;
    document.getElementById('lines').textContent = lines;
    document.getElementById('level').textContent = level;
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const wrapEl = document.getElementById('wrap'), overlayEl = document.getElementById('overlay');
    const cw = Math.min(wrapEl.clientWidth, wrapEl.clientHeight / 2);
    if (!(cw > 0)) return;
    canvas.style.width = overlayEl.style.width = cw + 'px';
    canvas.style.height = overlayEl.style.height = (cw * 2) + 'px';
    canvas.width = canvas.clientWidth * dpr; canvas.height = canvas.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    nextCanvas.width = nextCanvas.clientWidth * dpr; nextCanvas.height = nextCanvas.clientHeight * dpr;
    nctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(); drawNext();
  }
  function cellSize() { return canvas.clientWidth / COLS; }
  function block(x, y, size, color, context) {
    context.fillStyle = color;
    context.beginPath();
    const r = size * 0.18;
    context.moveTo(x + r, y); context.arcTo(x + size - 1, y, x + size - 1, y + size - 1, r); context.arcTo(x + size - 1, y + size - 1, x, y + size - 1, r);
    context.arcTo(x, y + size - 1, x, y, r); context.arcTo(x, y, x + size - 1, y, r); context.closePath(); context.fill();
  }
  function ghostDrop() {
    let dy = 0;
    while (!collides(piece, 0, dy + 1)) dy++;
    return dy;
  }
  const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--grid').trim();
  function draw() {
    const s = cellSize(), w = canvas.clientWidth, h = canvas.clientHeight;
    const now = performance.now();
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = gridColor; ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) { ctx.beginPath(); ctx.moveTo(i * s, 0); ctx.lineTo(i * s, h); ctx.stroke(); }
    for (let i = 1; i < ROWS; i++) { ctx.beginPath(); ctx.moveTo(0, i * s); ctx.lineTo(w, i * s); ctx.stroke(); }
    if (dropTrail) {
      const fade = 1 - Math.min(1, (now - dropTrail.at) / DROP_TRAIL_MS);
      const t = dropTrail;
      t.shape[0].forEach((_, c) => {
        const top = t.shape.findIndex(row => row[c]);
        if (top < 0) return;
        const y0 = (t.fromY + top) * s, y1 = (t.toY + top) * s;
        const g = ctx.createLinearGradient(0, y0, 0, y1);
        g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, t.color);
        ctx.globalAlpha = 0.35 * fade; ctx.fillStyle = g;
        ctx.fillRect((t.x + c) * s + s * 0.15, y0, s * 0.7, y1 - y0);
      });
      ctx.globalAlpha = 1;
    }
    grid.forEach((row, y) => row.forEach((k, x) => { if (k) block(x * s, y * s, s, COLORS[k], ctx); }));
    if (clearing) {
      const p = (now - clearing.at) / CLEAR_MS;
      const bright = Math.floor(p * 3) % 2 === 0;
      ctx.globalAlpha = bright ? 0.75 : 0.3;
      clearing.rows.forEach(y => { for (let x = 0; x < COLS; x++) block(x * s, y * s, s, '#ffffff', ctx); });
      ctx.globalAlpha = 1;
    }
    if (lockFlash) {
      const p = Math.min(1, (now - lockFlash.at) / LOCK_FLASH_MS);
      ctx.globalAlpha = (1 - p) * 0.4;
      lockFlash.cells.forEach(([x, y]) => block(x * s, y * s, s, '#ffffff', ctx));
      ctx.globalAlpha = 1;
    }
    if (running && !clearing) {
      const dy = ghostDrop();
      if (dy > 0) {
        ctx.globalAlpha = 0.18;
        piece.shape.forEach((row, r) => row.forEach((v, c) => { if (v && piece.y + r + dy >= 0) block((piece.x + c) * s, (piece.y + r + dy) * s, s, COLORS[piece.k], ctx); }));
        ctx.globalAlpha = 1;
      }
    }
    if (!clearing) {
      piece.shape.forEach((row, r) => row.forEach((v, c) => { if (v && piece.y + r >= 0) block((piece.x + c) * s, (piece.y + r) * s, s, COLORS[piece.k], ctx); }));
    }
  }
  function drawNext() {
    const w = nextCanvas.clientWidth, h = nextCanvas.clientHeight;
    nctx.clearRect(0, 0, w, h);
    const s = Math.min(w / 5, h / 4);
    const ox = (w - next.shape[0].length * s) / 2, oy = (h - next.shape.length * s) / 2;
    next.shape.forEach((row, r) => row.forEach((v, c) => { if (v) block(ox + c * s, oy + r * s, s, COLORS[next.k], nctx); }));
  }

  const actions = { left: () => move(-1, 0), right: () => move(1, 0), rotate: doRotate, soft: softDrop, drop: hardDrop };
  document.querySelectorAll('.controls button').forEach(b => {
    let holdTimer = null, repeatTimer = null;
    const stopHold = () => { clearTimeout(holdTimer); clearInterval(repeatTimer); holdTimer = null; repeatTimer = null; b.classList.remove('on'); };
    b.addEventListener('pointerdown', e => {
      e.preventDefault();
      stopHold();
      b.classList.add('on');
      if (!running) { start(); return; }
      actions[b.dataset.a]();
      if (b.dataset.a === 'left' || b.dataset.a === 'right' || b.dataset.a === 'soft') {
        holdTimer = setTimeout(() => { repeatTimer = setInterval(actions[b.dataset.a], HOLD_REPEAT_MS); }, HOLD_DELAY_MS);
      }
    });
    b.addEventListener('pointerup', stopHold);
    b.addEventListener('pointercancel', stopHold);
    b.addEventListener('pointerleave', stopHold);
  });

  let sx = 0, sy = 0, lastX = 0, moved = false, touchStartedStopped = false;
  const wrap = document.getElementById('wrap');
  wrap.addEventListener('touchstart', e => { const t = e.changedTouches[0]; sx = lastX = t.clientX; sy = t.clientY; moved = false; touchStartedStopped = !running; }, { passive: true });
  wrap.addEventListener('touchmove', e => {
    const t = e.changedTouches[0], s = cellSize();
    if (!(s > 0)) return;
    while (t.clientX - lastX > s) { move(1, 0); lastX += s; moved = true; }
    while (lastX - t.clientX > s) { move(-1, 0); lastX -= s; moved = true; }
  }, { passive: true });
  wrap.addEventListener('touchend', e => {
    const t = e.changedTouches[0], dy = t.clientY - sy, dx = t.clientX - sx;
    if (!running) { if (touchStartedStopped) start(); return; }
    if (moved) return;
    if (dy > 60 && Math.abs(dx) < 40) hardDrop(); else if (Math.abs(dx) < 16 && Math.abs(dy) < 16) doRotate();
  });
  document.addEventListener('keydown', e => {
    const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'rotate', ArrowDown: 'soft', ' ': 'drop' };
    if (!(e.key in map)) return;
    e.preventDefault();
    if (!running) start(); else actions[map[e.key]]();
  });
  new ResizeObserver(resize).observe(document.getElementById('wrap'));
  reset(); resize();
  document.getElementById('pause').addEventListener('click', pause);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
})();
</script>
</body>
</html>
