<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亲戚称呼计算 · 仿Tkinter</title>
    <style>
        /* 整体模仿 Tkinter 的经典灰色调，不花哨 */
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Tahoma', 'Arial', sans-serif;
        }
        body {
            background: #d9d9d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
        }
        /* 仿 Tkinter 窗口面板 */
        .tk-window {
            background: #ececec;
            border: 2px solid #9e9e9e;
            border-radius: 6px;
            box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.25);
            padding: 16px 20px 20px 20px;
            width: 540px;
            max-width: 100%;
            /* 微妙的凹凸感 (模仿 Tk 的浮雕) */
            border-style: outset;
        }
        /* 标题区域 */
        .tk-title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            color: #2c2c2c;
            background: #d6d6d6;
            padding: 6px 0;
            margin-bottom: 16px;
            border: 1px solid #a0a0a0;
            border-radius: 4px;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0 #ffffff80;
            border-style: inset;
        }
        /* 标签与区块 */
        .tk-label {
            font-size: 0.95rem;
            color: #1e1e1e;
            margin-bottom: 4px;
            font-weight: 500;
            display: block;
        }
        /* 主体框架 */
        .tk-frame {
            background: #f9f9f9;
            border: 1px solid #b0b0b0;
            padding: 12px 14px;
            border-radius: 4px;
            margin-bottom: 14px;
            border-style: inset;
        }
        /* 输入行 (像 tkinter 的 Entry + Button 区域) */
        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .input-row label {
            white-space: nowrap;
            font-size: 0.95rem;
            color: #1e1e1e;
            font-weight: 500;
        }
        /* 仿 Tkinter Entry 输入框 */
        .tk-entry {
            flex: 1;
            min-width: 160px;
            background: #ffffff;
            border: 2px solid #7e7e7e;
            border-radius: 3px;
            padding: 7px 10px;
            font-size: 0.95rem;
            color: #111;
            outline: none;
            border-style: inset;
            font-family: 'Consolas', 'Courier New', monospace;
        }
        .tk-entry:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 1px #a0c0e0;
        }
        /* 仿 Tkinter Button */
        .tk-button {
            background: #dcdcdc;
            border: 2px solid #a0a0a0;
            border-radius: 4px;
            padding: 7px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #1e1e1e;
            cursor: pointer;
            border-style: outset;
            transition: background 0.05s;
            box-shadow: 1px 1px 0 #ffffff80;
            white-space: nowrap;
        }
        .tk-button:hover {
            background: #e8e8e8;
            border-color: #8a8a8a;
        }
        .tk-button:active {
            background: #c8c8c8;
            border-style: inset;
            transform: translate(1px, 1px);
            box-shadow: none;
        }
        /* 输出区 (仿 Tkinter Label / Text) */
        .result-area {
            background: #f0f0f0;
            border: 2px solid #9e9e9e;
            border-radius: 4px;
            padding: 12px 14px;
            margin-top: 6px;
            border-style: inset;
            font-size: 1.15rem;
            font-weight: 500;
            min-height: 64px;
            display: flex;
            align-items: center;
            word-break: break-word;
            color: #0a2a44;
            font-family: 'Segoe UI', 'Tahoma', sans-serif;
        }
        /* 提示小字 */
        .hint {
            font-size: 0.78rem;
            color: #5a5a5a;
            margin-top: 8px;
            font-style: italic;
            border-top: 1px dashed #c0c0c0;
            padding-top: 8px;
            line-height: 1.5;
        }
        .hint code {
            background: #e0e0e0;
            padding: 2px 5px;
            border-radius: 3px;
            font-family: 'Consolas', monospace;
            font-style: normal;
            color: #2e2e2e;
        }
        /* 快捷按钮行 像 Tkinter 的 Button 排布 */
        .quick-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .tk-button.small {
            padding: 5px 12px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        /* 清除按钮稍微不同 */
        .clear-btn {
            background: #e0d6d6;
            border-color: #b09090;
        }
        .clear-btn:hover {
            background: #ecdcdc;
        }
        /* 让整体显得朴素，无圆润大现代感 */
    </style>
</head>
<body>
    <div class="tk-window">
        <!-- 仿 Tkinter 标题 -->
        <div class="tk-title">📟 亲戚称呼计算器</div>

        <!-- 主要操作区 -->
        <div class="tk-frame">
            <label class="tk-label">关系链 (从自己出发，用空格或逗号分隔)</label>
            <div class="input-row">
                <input type="text" id="relationInput" class="tk-entry" placeholder="例如: 爸爸 妈妈 哥哥 或者 父,母,兄" value="爸爸 妈妈">
                <button id="calcBtn" class="tk-button">计算</button>
            </div>

            <!-- 快捷示例按钮 (仿 Tkinter 小按钮) -->
            <div class="quick-row">
                <button class="tk-button small" data-example="爸爸 妈妈">爸爸 妈妈</button>
                <button class="tk-button small" data-example="爸爸 姐姐">爸爸 姐姐</button>
                <button class="tk-button small" data-example="妈妈 弟弟">妈妈 弟弟</button>
                <button class="tk-button small" data-example="爸爸 妈妈 儿子">爸爸 妈妈 儿子</button>
                <button class="tk-button small" data-example="爸爸 爸爸 妈妈">爸爸 爸爸 妈妈</button>
                <button class="tk-button small clear-btn" id="clearBtn">清空</button>
            </div>

            <!-- 结果输出区 -->
            <div class="result-area" id="resultDisplay">
                点击“计算”或输入关系链
            </div>
        </div>

        <!-- 提示文本 -->
        <div class="hint">
            ⚡ 支持的关系词：<code>爸爸</code> <code>妈妈</code> <code>哥哥</code> <code>姐姐</code> <code>弟弟</code> <code>妹妹</code> <code>儿子</code> <code>女儿</code> <code>丈夫</code> <code>妻子</code> 以及简称 <code>父</code> <code>母</code> <code>兄</code> <code>弟</code> <code>姐</code> <code>妹</code> <code>子</code> <code>女</code> <code>夫</code> <code>妻</code>。
            多个关系请用空格、逗号或中文逗号分隔。例如“爸爸 妈妈”表示爸爸的妈妈。
        </div>
    </div>

    <script>
        (function() {
            // 关系映射表：标准关系词 → 规范key
            const RELATION_MAP = {
                // 父母辈
                '爸爸': 'father', '父': 'father',
                '妈妈': 'mother', '母': 'mother',
                // 平辈
                '哥哥': 'brother', '兄': 'brother',
                '弟弟': 'brother', '弟': 'brother',    // 按年龄稍后区分，但哥哥/弟弟都归brother，我们通过顺序修正（可区分年龄）
                '姐姐': 'sister', '姐': 'sister',
                '妹妹': 'sister', '妹': 'sister',
                // 子女辈
                '儿子': 'son', '子': 'son',
                '女儿': 'daughter', '女': 'daughter',
                // 配偶
                '丈夫': 'husband', '夫': 'husband',
                '妻子': 'wife', '妻': 'wife'
            };

            // 反向：用于显示年龄细节的修饰，但不影响计算核心
            // 但要区分哥哥/弟弟、姐姐/妹妹，因为称呼会变。在计算称呼时需要知道长幼。
            // 我们额外维护一个“年龄顺序”信息，直接在词条解析时记录，并沿路径合并判断。

            // 为了简化，我们用每个词条不仅返回标准关系，还返回“相对于前一步的长幼标记”
            // 但计算时实际上路径会修正称呼。我们采用“路径修正”算法：
            // 常见亲戚称呼计算可以通过遍历关系链，维护当前称呼（初始为“自己”），每一步根据关系更新称呼。
            // 但是由于称呼依赖于路径（比如爸爸的哥哥 = 伯父，爸爸的弟弟 = 叔叔；妈妈的哥哥 = 舅舅，妈妈的弟弟 = 舅舅; 但是爸爸的哥哥 vs 妈妈的哥哥不同）
            // 为了简化且准确，我们采用基于路径生成“关系key”然后查表的方法。但完整表很大。
            // 为了更好地演示又不失控，我实现一个基于路径推导的称呼规则，覆盖常见直系和旁系三代内。

            // 我的策略：解析关系链成标准序列(如 ['father','mother','brother'])，然后逐层推导称呼。
            // 推导规则基于“当前称呼”和“新关系”，利用一个函数 computeNext(currentLabel, relation, genderHint) 返回新称呼。
            // 性别由路径隐含（如爸爸是男性，妈妈是女性），但推导称呼时经常需要知道当前人的性别，我们传递gender属性。

            // 更稳健：使用预定义的路径-称呼映射，但仅覆盖高频组合。为了代码友好，我使用规则引擎。

            // 为了让效果更好，我决定采用“基于当前称呼+新关系”的规则表，能处理绝大多数常见组合。
            // 初始：自己（性别未知，但我们可以从第一个关系推断）

            // 定义计算函数：
            // currentGender: 'male' / 'female' / 'unknown'
            // currentLabel: 称呼字符串
            // relation: 'father','mother','brother','sister','son','daughter','husband','wife'
            // 并且我们还需要额外信息：如哥哥/弟弟是brother，但长幼会影响称呼（伯父/叔叔，姑姑/姨？）。所以最好在解析时区分开。
            // 重新调整：让解析支持区分“哥哥”“弟弟”“姐姐”“妹妹”。
            // 定义标准关系码：father, mother, elderBrother, youngerBrother, elderSister, youngerSister, son, daughter, husband, wife

            const RELATION_CODE_MAP = {
                '爸爸': 'father', '父': 'father',
                '妈妈': 'mother', '母': 'mother',
                '哥哥': 'elderBrother', '兄': 'elderBrother',
                '弟弟': 'youngerBrother', '弟': 'youngerBrother',
                '姐姐': 'elderSister', '姐': 'elderSister',
                '妹妹': 'youngerSister', '妹': 'youngerSister',
                '儿子': 'son', '子': 'son',
                '女儿': 'daughter', '女': 'daughter',
                '丈夫': 'husband', '夫': 'husband',
                '妻子': 'wife', '妻': 'wife'
            };

            // 计算核心：根据当前状态 (label, gender) 和新关系码，返回新状态。
            // 这个函数基于常见亲属关系规则。
            function advance(current, relationCode) {
                let { label, gender } = current;  // gender: 'male'/'female'/'unknown'
                let newLabel = '';
                let newGender = 'unknown';

                // 辅助：根据 relationCode 判断对方性别
                const relationGender = {
                    'father': 'male', 'mother': 'female',
                    'elderBrother': 'male', 'youngerBrother': 'male',
                    'elderSister': 'female', 'youngerSister': 'female',
                    'son': 'male', 'daughter': 'female',
                    'husband': 'male', 'wife': 'female'
                }[relationCode] || 'unknown';

                // 若当前 gender 未知，我们可以从 label 推测 (但大多数情况第一步就知道)
                // 这里我们根据已知规则计算新称呼

                // 核心规则表 (使用 if-else 树，可读性好)
                // 注意：称呼因地域差异可能不同，这里采用北方普通话常见称呼

                // 处理配偶关系 (丈夫/妻子) 最简单：直接得到丈夫/妻子
                if (relationCode === 'husband') {
                    newLabel = '丈夫';
                    newGender = 'male';
                    return { label: newLabel, gender: newGender };
                }
                if (relationCode === 'wife') {
                    newLabel = '妻子';
                    newGender = 'female';
                    return { label: newLabel, gender: newGender };
                }

                // 处理子女关系 (儿子/女儿) —— 无论当前是谁，子女都称呼为儿子/女儿
                if (relationCode === 'son') {
                    newLabel = '儿子';
                    newGender = 'male';
                    return { label: newLabel, gender: newGender };
                }
                if (relationCode === 'daughter') {
                    newLabel = '女儿';
                    newGender = 'female';
                    return { label: newLabel, gender: newGender };
                }

                // 处理父母关系 (父亲/母亲) —— 无论当前是谁，父母称呼为爸爸/妈妈 (公公/婆婆,岳父/岳母待会特殊处理)
                // 但如果是配偶的父母，则变成公公/婆婆或岳父/岳母。需要知道当前label是否是丈夫/妻子
                if (relationCode === 'father' || relationCode === 'mother') {
                    // 特殊：如果当前 label 是 '丈夫'，那么他的父亲 = 公公，母亲 = 婆婆
                    if (label === '丈夫') {
                        newLabel = (relationCode === 'father') ? '公公' : '婆婆';
                        newGender = (relationCode === 'father') ? 'male' : 'female';
                        return { label: newLabel, gender: newGender };
                    }
                    // 如果当前 label 是 '妻子'，她的父亲 = 岳父，母亲 = 岳母
                    if (label === '妻子') {
                        newLabel = (relationCode === 'father') ? '岳父' : '岳母';
                        newGender = (relationCode === 'father') ? 'male' : 'female';
                        return { label: newLabel, gender: newGender };
                    }
                    // 否则，称呼为爸爸/妈妈 (但可能已经是爸爸/妈妈，就保留？) 不过我们还是更新为爸爸/妈妈
                    newLabel = (relationCode === 'father') ? '爸爸' : '妈妈';
                    newGender = (relationCode === 'father') ? 'male' : 'female';
                    // 但是有可能当前是 '公公' 再往上? 比如公公的爸爸 = 太公公? 暂不处理，保持爸爸？为了简单，退回爸爸/妈妈？但可能不对。
                    // 我们限制深度，此处若当前是公公/婆婆/岳父/岳母等，可以简单处理为爷爷/奶奶/外公/外婆？但复杂。
                    // 为了不返回错误称呼，我们把这种情况简单设为“爷爷/奶奶”等？但会导致混乱。
                    // 为了避免太奇怪的错误，如果当前label已经是祖父辈，我们返回“曾祖父”之类？算了，保持简单，不做太深。
                    // 直接返回爸爸/妈妈，但注明可能不准确。为了演示，我们仅处理直系到祖父母。
                    // 特殊处理：如果当前label是'爸爸'，再爸爸就是爷爷，再妈妈就是奶奶。我们修正:
                    if (label === '爸爸') {
                        newLabel = (relationCode === 'father') ? '爷爷' : '奶奶';
                        newGender = (relationCode === 'father') ? 'male' : 'female';
                        return { label: newLabel, gender: newGender };
                    }
                    if (label === '妈妈') {
                        newLabel = (relationCode === 'father') ? '外公' : '外婆';
                        newGender = (relationCode === 'father') ? 'male' : 'female';
                        return { label: newLabel, gender: newGender };
                    }
                    // 默认返回爸爸/妈妈
                    return { label: newLabel, gender: newGender };
                }

                // 处理兄弟姐妹关系 (哥哥/弟弟/姐姐/妹妹)
                // 根据当前label和兄弟姐妹的长幼、性别，决定称呼
                if (relationCode === 'elderBrother' || relationCode === 'youngerBrother' || 
                    relationCode === 'elderSister' || relationCode === 'youngerSister') {
                    // 判断长幼: elder/younger
                    const isElder = relationCode.startsWith('elder');
                    const isMale = relationCode.includes('Brother');
                    
                    // 如果当前是爸爸/妈妈，兄弟姐妹 = 伯父/叔叔/姑姑/舅舅/姨妈等
                    if (label === '爸爸') {
                        if (isMale) {
                            newLabel = isElder ? '伯父' : '叔叔';
                            newGender = 'male';
                        } else {
                            newLabel = '姑姑';
                            newGender = 'female';
                        }
                        return { label: newLabel, gender: newGender };
                    }
                    if (label === '妈妈') {
                        if (isMale) {
                            newLabel = '舅舅';
                            newGender = 'male';
                        } else {
                            // 妈妈的姐姐/妹妹 = 姨妈/姨母，一般统称姨妈，也可区分大姨/小姨，这里简化
                            newLabel = '姨妈';
                            newGender = 'female';
                        }
                        return { label: newLabel, gender: newGender };
                    }
                    // 如果当前是丈夫/妻子，其兄弟姐妹？即大伯子/小叔子/大姑子/小姑子等，但称呼复杂，简化成哥哥/弟弟/姐姐/妹妹
                    // 但通常会称“大伯哥”等，但我们不作区分，直接返回“哥哥”等
                    if (label === '丈夫' || label === '妻子') {
                        // 简体处理：配偶的兄弟姐妹按性别称呼
                        if (isMale) newLabel = isElder ? '哥哥' : '弟弟';
                        else newLabel = isElder ? '姐姐' : '妹妹';
                        newGender = isMale ? 'male' : 'female';
                        return { label: newLabel, gender: newGender };
                    }
                    // 其他情况：比如自己 -> 哥哥/弟弟等。或者爷爷的兄弟?
                    // 默认返回哥哥/弟弟/姐姐/妹妹
                    if (isMale) {
                        newLabel = isElder ? '哥哥' : '弟弟';
                        newGender = 'male';
                    } else {
                        newLabel = isElder ? '姐姐' : '妹妹';
                        newGender = 'female';
                    }
                    // 特殊调整：如果当前是“爷爷”，他的哥哥=伯公/叔公？但为了简洁，我们返回“伯公”?
                    // 如果当前是“爷爷”，且关系是兄弟，可以称伯公/叔公，但不做太复杂，暂时跳过。
                    return { label: newLabel, gender: newGender };
                }

                // 如果以上都没匹配，返回原label (不应发生)
                return { label: label, gender: gender };
            }

            // 解析输入字符串为关系码数组
            function parseRelations(input) {
                // 按空格、逗号、中文逗号分割
                const raw = input.trim().replace(/，/g, ' ').replace(/,/g, ' ').split(/\s+/).filter(s => s.length > 0);
                const codes = [];
                for (let word of raw) {
                    // 尝试直接匹配关系码表
                    if (RELATION_CODE_MAP[word]) {
                        codes.push(RELATION_CODE_MAP[word]);
                    } else {
                        // 尝试模糊？不支持，直接报错
                        throw new Error(`无法识别“${word}”`);
                    }
                }
                return codes;
            }

            // 主计算函数
            function computeRelationChain(input) {
                // 解析
                const codes = parseRelations(input);
                if (codes.length === 0) {
                    return '请输入关系链';
                }

                // 初始状态：自己（性别未知，但若第一步是丈夫/妻子等可以推导，不过初始gender为unknown）
                let state = { label: '自己', gender: 'unknown' };

                // 逐步推导
                for (let code of codes) {
                    state = advance(state, code);
                }

                // 如果最终称呼是自己，则显示“自己”
                if (state.label === '自己') {
                    return '自己';
                }
                return state.label;
            }

            // DOM 元素
            const inputEl = document.getElementById('relationInput');
            const calcBtn = document.getElementById('calcBtn');
            const resultDisplay = document.getElementById('resultDisplay');
            const clearBtn = document.getElementById('clearBtn');
            const quickBtns = document.querySelectorAll('.quick-row .tk-button[data-example]');

            // 更新显示
            function updateResult(text, isError = false) {
                resultDisplay.textContent = text;
                if (isError) {
                    resultDisplay.style.color = '#8b0000';
                } else {
                    resultDisplay.style.color = '#0a2a44';
                }
            }

            // 计算并显示
            function calculateAndShow() {
                const input = inputEl.value.trim();
                if (input === '') {
                    updateResult('请输入关系链', true);
                    return;
                }
                try {
                    const result = computeRelationChain(input);
                    updateResult(result);
                } catch (e) {
                    updateResult('❌ ' + e.message, true);
                }
            }

            // 事件绑定
            calcBtn.addEventListener('click', calculateAndShow);
            inputEl.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    calculateAndShow();
                }
            });

            // 快捷示例
            quickBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const example = btn.getAttribute('data-example');
                    if (example) {
                        inputEl.value = example;
                        calculateAndShow();
                    }
                });
            });

            // 清空
            clearBtn.addEventListener('click', () => {
                inputEl.value = '';
                inputEl.focus();
                updateResult('点击“计算”或输入关系链');
                resultDisplay.style.color = '#0a2a44';
            });

            // 初始默认值：已经预设了爸爸 妈妈，可以直接显示结果?
            // 为了友好，初次加载时不算也可以，但可以自动算一下。或者直接显示初始提示。但可以自动计算一下默认值。
            // 这样演示更直接
            window.addEventListener('load', () => {
                // 默认输入爸爸 妈妈，显示奶奶? 实际上爸爸的妈妈是奶奶，但我们规则里爸爸->妈妈 = 奶奶 (根据推导: 当前label=爸爸, 关系=mother → 返回奶奶，正确)
                // 自动计算一下
                calculateAndShow();
            });

            // 补充: 针对妈妈 -> 爸爸 => 外公? 测试: 妈妈 -> father => 外公? 是的，在advance中label==='妈妈'，relation father => 外公。正确。
            // 爸爸 -> 爸爸 => 爷爷，妈妈 -> 妈妈 => 外婆。符合。
            // 爸爸 -> 哥哥 => 伯父，爸爸 -> 弟弟 => 叔叔，爸爸 -> 妹妹 => 姑姑，妈妈 -> 弟弟 => 舅舅，妈妈 -> 姐姐 => 姨妈。符合。
            // 另外，爸爸 -> 妻子? 特殊: 爸爸的妻子 = 妈妈? 但我们代码里，如果当前 label 是 '爸爸'，relation='wife' 会走到配偶处理，返回妻子。这不对，应该返回妈妈。
            // 由于我们的advance函数中配偶处理在最前面，会返回“妻子”而不是“妈妈”。需要修正：爸爸的妻子应该是妈妈(如果爸爸是亲生父亲)，但可能是后妈? 我们用简化的称呼，还是应该返回“妈妈”。
            // 修复：在处理配偶关系时，如果当前label是爸爸且关系是妻子，则返回妈妈；如果是妈妈且关系是丈夫，返回爸爸。
            // 但我们已经把配偶处理提前了，因此需要在配偶处理中增加判断。
            // 修改advance函数配偶处理部分。

            // 由于代码已经写好，我直接修改 advance 函数内部配偶逻辑。我们可以重新定义advance，但为了不重写整个，我在后面覆盖? 简单方式: 在下面重新定义advance，将原有覆盖。
            // 对，我们可以重新声明 advance 函数 (因为函数提升，但在同一作用域，后面覆盖前面)
            // 但为了整洁，我将重写advance函数放在最后，覆盖前面的。

            // 重新定义 advance 覆盖之前的 (保留之前的 RELATION_CODE_MAP 等不变)
            const originalAdvance = advance; // 占位，不使用了

            // 重写 advance 更完善
            window.advance = function(current, relationCode) {
                let { label, gender } = current;
                let newLabel = '';
                let newGender = 'unknown';

                // 处理配偶关系
                if (relationCode === 'husband') {
                    // 如果当前是妻子，丈夫就是丈夫；如果是妈妈，丈夫是爸爸? 这里简化：妈妈->丈夫 = 爸爸 (可能是继父但称呼爸爸)
                    if (label === '妈妈') {
                        return { label: '爸爸', gender: 'male' };
                    }
                    // 如果当前是女儿，丈夫 = 丈夫
                    newLabel = '丈夫';
                    newGender = 'male';
                    return { label: newLabel, gender: newGender };
                }
                if (relationCode === 'wife') {
                    if (label === '爸爸') {
                        return { label: '妈妈', gender: 'female' };
                    }
                    newLabel = '妻子';
                    newGender = 'female';
                    return { label: newLabel, gender: newGender };
                }

                // 子女关系
                if (relationCode === 'son') {
                    return { label: '儿子', gender: 'male' };
                }
                if (relationCode === 'daughter') {
                    return { label: '女儿', gender: 'female' };
                }

                // 父母关系 (含特殊公婆/岳父母)
                if (relationCode === 'father' || relationCode === 'mother') {
                    const isFather = (relationCode === 'father');
                    // 配偶的父母
                    if (label === '丈夫') {
                        return { label: isFather ? '公公' : '婆婆', gender: isFather ? 'male' : 'female' };
                    }
                    if (label === '妻子') {
                        return { label: isFather ? '岳父' : '岳母', gender: isFather ? 'male' : 'female' };
                    }
                    // 爸爸的父亲/母亲 -> 爷爷/奶奶
                    if (label === '爸爸') {
                        return { label: isFather ? '爷爷' : '奶奶', gender: isFather ? 'male' : 'female' };
                    }
                    // 妈妈的父亲/母亲 -> 外公/外婆
                    if (label === '妈妈') {
                        return { label: isFather ? '外公' : '外婆', gender: isFather ? 'male' : 'female' };
                    }
                    // 爷爷的父亲/母亲 -> 曾祖父/曾祖母 (简化)
                    if (label === '爷爷') {
                        return { label: isFather ? '曾祖父' : '曾祖母', gender: isFather ? 'male' : 'female' };
                    }
                    if (label === '奶奶') {
                        return { label: isFather ? '曾祖父' : '曾祖母', gender: isFather ? 'male' : 'female' };
                    }
                    // 外公外婆的父母 -> 外曾祖父/外曾祖母
                    if (label === '外公') {
                        return { label: isFather ? '外曾祖父' : '外曾祖母', gender: isFather ? 'male' : 'female' };
                    }
                    if (label === '外婆') {
                        return { label: isFather ? '外曾祖父' : '外曾祖母', gender: isFather ? 'male' : 'female' };
                    }
                    // 默认返回爸爸/妈妈
                    return { label: isFather ? '爸爸' : '妈妈', gender: isFather ? 'male' : 'female' };
                }

                // 兄弟姐妹关系
                if (relationCode.startsWith('elder') || relationCode.startsWith('younger')) {
                    const isElder = relationCode.startsWith('elder');
                    const isMale = relationCode.includes('Brother');

                    if (label === '爸爸') {
                        if (isMale) return { label: isElder ? '伯父' : '叔叔', gender: 'male' };
                        else return { label: '姑姑', gender: 'female' };
                    }
                    if (label === '妈妈') {
                        if (isMale) return { label: '舅舅', gender: 'male' };
                        else return { label: '姨妈', gender: 'female' };
                    }
                    if (label === '丈夫' || label === '妻子') {
                        if (isMale) return { label: isElder ? '哥哥' : '弟弟', gender: 'male' };
                        else return { label: isElder ? '姐姐' : '妹妹', gender: 'female' };
                    }
                    if (label === '爷爷') {
                        // 爷爷的兄弟：伯公/叔公；姐妹：姑婆
                        if (isMale) return { label: isElder ? '伯公' : '叔公', gender: 'male' };
                        else return { label: '姑婆', gender: 'female' };
                    }
                    if (label === '奶奶') {
                        if (isMale) return { label: isElder ? '伯公' : '叔公', gender: 'male' };
                        else return { label: '姑婆', gender: 'female' };
                    }
                    // 默认
                    if (isMale) return { label: isElder ? '哥哥' : '弟弟', gender: 'male' };
                    else return { label: isElder ? '姐姐' : '妹妹', gender: 'female' };
                }

                // fallback
                return { label, gender };
            };

            // 重新绑定计算函数里用的 advance 应该使用 window.advance? 但我们的 computeRelationChain 里使用的是 advance 变量，它是函数声明提升的，会被覆盖吗？
            // 因为函数声明提升，但后面的函数表达式赋值会覆盖。但在同一个作用域，我们后面重新赋值 window.advance 并覆盖了变量 advance 吗？注意：advance 是函数声明，提升后，我们后面用 window.advance = function 只是给 window 增加属性，并没有改变 advance 变量。为了让 computeRelationChain 使用新的，需要重写 computeRelationChain 或重新声明 advance 为函数表达式。
            // 简单：重新声明 advance 为函数表达式，覆盖函数声明。但函数声明提升优先级高，不过后面赋值会覆盖。
            // 我们可以用 let 重新定义，但同一作用域不允许重复声明。干脆在 computeRelationChain 中直接调用 window.advance。修改 computeRelationChain。
            // 对，调整 computeRelationChain 使用 window.advance。

            // 修改 computeRelationChain
            const originalCompute = computeRelationChain;
            window.computeRelationChain = function(input) {
                const codes = parseRelations(input);
                if (codes.length === 0) return '请输入关系链';
                let state = { label: '自己', gender: 'unknown' };
                for (let code of codes) {
                    state = window.advance(state, code);
                }
                return state.label === '自己' ? '自己' : state.label;
            };

            // 更新 calculateAndShow 使用 window.computeRelationChain
            // 但 calculateAndShow 是闭包引用了原来的 computeRelationChain，需要重新绑定。
            // 最简单：在 calculateAndShow 中直接使用 window.computeRelationChain
            // 我们重新定义 calculateAndShow 函数覆盖
            window.calculateAndShow = function() {
                const input = inputEl.value.trim();
                if (input === '') {
                    updateResult('请输入关系链', true);
                    return;
                }
                try {
                    const result = window.computeRelationChain(input);
                    updateResult(result);
                } catch (e) {
                    updateResult('❌ ' + e.message, true);
                }
            };

            // 重新绑定事件
            calcBtn.onclick = window.calculateAndShow;
            inputEl.onkeypress = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    window.calculateAndShow();
                }
            };
            quickBtns.forEach(btn => {
                btn.onclick = () => {
                    const example = btn.getAttribute('data-example');
                    if (example) {
                        inputEl.value = example;
                        window.calculateAndShow();
                    }
                };
            });
            clearBtn.onclick = () => {
                inputEl.value = '';
                inputEl.focus();
                updateResult('点击“计算”或输入关系链');
                resultDisplay.style.color = '#0a2a44';
            };

            // 初始化计算
            window.calculateAndShow();

            // 对部分结果测试：爸爸 妻子 -> 应该 妈妈，现在 window.advance 中处理 label='爸爸', relation='wife' 返回妈妈。正确。
            // 妈妈 丈夫 -> 爸爸。正确。
            // 丈夫 妈妈 -> 婆婆。正确。
            // 妻子 爸爸 -> 岳父。正确。
            // 爸爸 哥哥 -> 伯父。正确。
            // 妈妈 弟弟 -> 舅舅。正确。
            // 爸爸 妈妈 -> 奶奶 (爸爸的妈妈)。正确。
            // 妈妈 爸爸 -> 外公 (妈妈的爸爸)。正确。
            // 爷爷 哥哥 -> 伯公。正确。

            // 注意：由于 window.advance 覆盖了函数声明，但 computeRelationChain 通过 window.advance 调用，所以最终生效。
        })();
    </script>
