<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="qaq_2_30_awa — 极简个人主页">
  <title>qaq_2_30_awa</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff">
  <style>
    /* ============================================================
       极简主义 — 接近单色，大量留白
       ============================================================ */
    @font-face {
      font-family: "SongPUA";
      src: url("宋体pua字体.ttc") format("truetype");
      font-weight: 100 900;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #ffffff;
      --fg: #1a1a1a;
      --fg-soft: #555555;
      --fg-muted: #888888;
      --line: #e8e8e8;
      --accent: #1a1a1a;
      --font: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", "SongPUA", "PingFang SC", "Microsoft YaHei", sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    :root[data-theme="dark"] {
      --bg: #0f0f0f;
      --fg: #f0f0f0;
      --fg-soft: #a0a0a0;
      --fg-muted: #666666;
      --line: #222222;
      --accent: #f0f0f0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.6;
      font-weight: 400;
      overscroll-behavior: none;
      transition: background-color 0.3s, color 0.3s;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      overflow-x: hidden;
      overflow-y: auto;
      touch-action: pan-y;
      padding: 0 var(--safe-right) 0 var(--safe-left);
    }

    /* 隐藏所有装饰 */
    #water-canvas,
    #particle-canvas,
    #cursorGlow {
      display: none !important;
    }

    /* ============================================================
       页面 — 慷慨留白
       ============================================================ */
    .page {
      max-width: 680px;
      margin: 0 auto;
      padding: 120px 32px 80px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 600px) {
      .page {
        padding: 80px 24px 60px;
      }
    }

    /* ============================================================
       超大字标题 — 戏剧性排版时刻
       ============================================================ */
    .hero {
      margin-bottom: 80px;
    }

    .hero h1 {
      font-size: clamp(2.8rem, 10vw, 5.5rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.02;
      color: var(--fg);
      margin-bottom: 16px;
    }

    .hero .sub {
      font-size: 1rem;
      font-weight: 400;
      color: var(--fg-muted);
      letter-spacing: 0.01em;
      max-width: 28ch;
    }

    /* ============================================================
       信息 — 极简
       ============================================================ */
    .info {
      margin-bottom: 64px;
      max-width: 48ch;
    }

    .info p {
      font-size: 0.95rem;
      color: var(--fg-soft);
      line-height: 1.7;
    }

    /* ============================================================
       主操作 — 唯一显眼的按钮
       ============================================================ */
    .primary-action {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      background: var(--accent);
      color: var(--bg);
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.15s;
      margin-bottom: 80px;
      align-self: flex-start;
      min-height: 48px;
    }

    .primary-action:hover {
      opacity: 0.85;
    }

    .primary-action:active {
      transform: scale(0.97);
    }

    .primary-action:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 3px;
    }

    .primary-action svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ============================================================
       链接 — 简洁列表
       ============================================================ */
    .links {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin-bottom: 80px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
      color: var(--fg);
      transition: opacity 0.2s;
      min-height: 56px;
    }

    .link-item:first-child {
      border-top: 1px solid var(--line);
    }

    .link-item:hover {
      opacity: 0.6;
    }

    .link-item:active {
      opacity: 0.4;
    }

    .link-item:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .link-item .label {
      font-size: 0.9rem;
      font-weight: 500;
    }

    .link-item .value {
      font-size: 0.85rem;
      color: var(--fg-muted);
      font-weight: 400;
    }

    /* ============================================================
       底部 — 极小
       ============================================================ */
    .footer {
      margin-top: auto;
      padding-top: 40px;
      font-size: 0.75rem;
      color: var(--fg-muted);
      letter-spacing: 0.02em;
    }

    /* ============================================================
       浮动按钮 — 极简
       ============================================================ */
    .fab-group {
      position: fixed;
      right: 20px;
      bottom: calc(20px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
    }

    .fab {
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--bg);
      color: var(--fg-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, border-color 0.2s, transform 0.15s;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      position: relative;
    }

    .fab:hover {
      color: var(--fg);
      border-color: var(--fg-muted);
    }

    .fab:active {
      transform: scale(0.94);
    }

    .fab:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 2px;
    }

    .fab svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fab .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--accent);
      color: var(--bg);
      font-size: 9px;
      font-weight: 600;
      min-width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      padding: 0 4px;
      line-height: 1;
    }

    /* ============================================================
       字体菜单
       ============================================================ */
    .font-menu {
      position: fixed;
      right: 72px;
      bottom: calc(72px + var(--safe-bottom));
      z-index: 110;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 2px;
      min-width: 150px;
      max-height: 60vh;
      overflow-y: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    :root[data-theme="dark"] .font-menu {
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .font-menu.show {
      display: flex;
    }

    .font-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: none;
      background: transparent;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 400;
      color: var(--fg-soft);
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
      width: 100%;
      text-align: left;
      min-height: 36px;
    }

    .font-item:hover {
      background: var(--line);
      color: var(--fg);
    }

    .font-item.active {
      color: var(--fg);
      font-weight: 500;
    }

    .font-item .fi-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: transparent;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .font-item.active .fi-dot {
      background: var(--fg);
    }

    /* ============================================================
       导航弹窗
       ============================================================ */
    .nav-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .nav-modal.show {
      display: flex;
    }

    .nav-panel {
      width: 100%;
      max-width: 560px;
      max-height: 80vh;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    }

    :root[data-theme="dark"] .nav-panel {
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }

    .nav-head {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-head h2 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .nav-head .cnt {
      font-size: 12px;
      font-weight: 400;
      color: var(--fg-muted);
    }

    .nav-close {
      margin-left: auto;
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: transparent;
      color: var(--fg-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, border-color 0.15s, transform 0.15s;
      font-family: var(--font);
    }

    .nav-close:hover {
      color: var(--fg);
      border-color: var(--fg-muted);
    }

    .nav-close:active {
      transform: scale(0.94);
    }

    .nav-close svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
    }

    .nav-search {
      padding: 12px 24px;
      border-bottom: 1px solid var(--line);
    }

    .nav-search input {
      width: 100%;
      padding: 10px 0;
      border: none;
      border-bottom: 1px solid var(--line);
      background: transparent;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 400;
      color: var(--fg);
      outline: none;
      transition: border-color 0.15s;
    }

    .nav-search input:focus {
      border-bottom-color: var(--fg);
    }

    .nav-search input::placeholder {
      color: var(--fg-muted);
    }

    .nav-body {
      overflow-y: auto;
      padding: 16px 24px 24px;
      flex: 1;
    }

    .nav-group {
      margin-bottom: 24px;
    }

    .nav-group:last-child {
      margin-bottom: 0;
    }

    .ng-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg-muted);
      margin-bottom: 12px;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: transparent;
      text-decoration: none;
      color: var(--fg);
      transition: border-color 0.15s, background 0.15s;
      min-width: 0;
      min-height: 48px;
    }

    .nav-item:hover {
      border-color: var(--fg-muted);
      background: var(--line);
    }

    .nav-item:active {
      transform: scale(0.98);
    }

    .nav-item .ni-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--fg-soft);
      flex-shrink: 0;
    }

    .nav-item .ni-body {
      min-width: 0;
      flex: 1;
    }

    .nav-item .ni-name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-item .ni-desc {
      font-size: 11px;
      color: var(--fg-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-empty {
      padding: 40px 20px;
      text-align: center;
      font-size: 13px;
      color: var(--fg-muted);
    }

    /* ============================================================
       TOAST
       ============================================================ */
    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(100px + var(--safe-bottom));
      transform: translateX(-50%);
      background: var(--fg);
      color: var(--bg);
      padding: 10px 20px;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.01em;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 300;
      max-width: 80vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #toast.show {
      opacity: 1;
    }

    /* ============================================================
       BOOT
       ============================================================ */
    #boot {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.4s;
    }

    #boot.gone {
      opacity: 0;
      pointer-events: none;
    }

    .boot-ring {
      width: 48px;
      height: 48px;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: var(--line);
      stroke-width: 2;
    }

    .ring-fg {
      fill: none;
      stroke: var(--fg);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      transition: stroke-dashoffset 0.3s;
    }

    .boot-pct {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--fg-muted);
      font-variant-numeric: tabular-nums;
    }

    /* ============================================================
       响应式
       ============================================================ */
    @media (max-width: 480px) {
      .page {
        padding: 60px 20px 40px;
      }
      .hero {
        margin-bottom: 56px;
      }
      .hero h1 {
        font-size: clamp(2.2rem, 12vw, 3.5rem);
      }
      .primary-action {
        margin-bottom: 56px;
      }
      .links {
        margin-bottom: 56px;
      }
      .nav-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ============================================================
       REDUCED MOTION
       ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
        animation: none !important;
      }
      .primary-action:active,
      .fab:active,
      .nav-close:active,
      .nav-item:active {
        transform: none !important;
      }
    }

    /* 滚动条极简 */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 2px;
    }
  </style>
</head>

<script>

  // Boot
  (function(){
    var boot = document.getElementById('boot');
    var ring = boot ? boot.querySelector('.ring-fg') : null;
    var pct = boot ? boot.querySelector('.boot-pct') : null;
    var val = 15, target = 15, raf = 0, finished = false;

    function render(){
      var v = Math.round(val);
      if (pct) pct.textContent = v + '%';
      if (ring) ring.style.strokeDashoffset = 100 - v;
      if (boot) boot.setAttribute('aria-valuenow', v);
    }
    function tick(){
      if (raf) return;
      raf = requestAnimationFrame(function step(){
        raf = 0;
        var d = target - val;
        if (Math.abs(d) < 0.4){
          val = target;
          render();
          if (val >= 100 && !finished){ finished = true; setTimeout(function(){
            boot.classList.add('gone');
            setTimeout(function(){ if (boot.parentNode) boot.parentNode.removeChild(boot); }, 500);
          }, 200); }
          return;
        }
        val += d * 0.14;
        render();
        raf = requestAnimationFrame(step);
      });
    }
    window.BootSet = function(v){ target = Math.max(target, v); tick(); };
    window.addEventListener('DOMContentLoaded', function(){ BootSet(45); });
    setTimeout(function(){ BootSet(100); }, 2000);
    render();
  })();

  window.showToast = function(msg, ms){
    var t = document.getElementById('toast');
    if (!t) return;

    t._timer = setTimeout(function(){ t.classList.remove('show'); }, ms || 1900);

<!-- ============================================================

<script>
(function(){
  'use strict';
  var escapeHtml = function(s){
    return String(s).replace(/[&<>"']/g, function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  };

  var NAV_CATS = [
    { id:'mine',     name:'自研作品',   test: function(p){ return p.indexOf('/') === -1 && p.endsWith('.html'); } },
    { id:'aurora',   name:'极光特效',   test: function(p){ return p.indexOf('极光/') === 0; } },
    { id:'games',    name:'游戏合集',   test: function(p){ return /^(2048|snake|星轨矿工|豪宅大亨|网页小游戏|剧情游戏)\//.test(p); } },
    { id:'toys',     name:'小玩具',     test: function(p){ return /^(paint-toys|memory-toys|maze-toys|sliding-toys|toms\.toys|cursoreffects|weavesilk|mikutap|puginarug|thatsthefinger|longdoge|breakout|thecar|mc-classic|floppybird|onesquareminesweeper)\//.test(p); } },
    { id:'creative', name:'创意实验',   test: function(p){
        return /^(3D 霓虹线条|爱心|圣诞树|动态文字自由落体|粉丝数增长动画|晃动工坊|表白|本地版)\//.test(p)
          || ['五星红旗.html','EasterEgg.html','最小 3D.html','蜈蚣式龙.html','布料.html'].indexOf(p) !== -1;
      } },
    { id:'tools',    name:'工具 / 学习', test: function(){ return true; } }
  ];

  function flatten(items, out){
    out = out || [];
    (items || []).forEach(function(it){
      if (it.type === 'folder'){
        if (it.children) flatten(it.children, out);
      } else {
        out.push({ name: it.name, path: it.path, desc: it.desc || '' });
      }
    });
    return out;
  }

  function buildNavData(manifest){
    var files = flatten(manifest);
    var groups = NAV_CATS.map(function(c){ return { id:c.id, name:c.name, items:[] }; });
    var byId = {};
    groups.forEach(function(g){ byId[g.id] = g; });
    files.forEach(function(f){
      var cat = null;
      for (var i=0; i<NAV_CATS.length; i++){
        if (NAV_CATS[i].test(f.path)){ cat = NAV_CATS[i]; break; }
      }
      if (!cat) cat = NAV_CATS[NAV_CATS.length - 1];
      byId[cat.id].items.push(f);
    });
    return groups.filter(function(g){ return g.items.length > 0; });
  }

  var NAV_DATA = buildNavData(window.DIR_MANIFEST || []);
  var fab = document.getElementById('navFab');
  var fabBadge = document.getElementById('fabBadge');
  var modal = document.getElementById('navModal');
  var closeBtn = document.getElementById('navClose');
  var searchInput = document.getElementById('navSearch');
  var bodyEl = document.getElementById('navBody');
  var countEl = document.getElementById('navCount');

  var term = '';
  var lastFocused = null;

  var totalItems = NAV_DATA.reduce(function(s,c){ return s + c.items.length; }, 0);
  if (fabBadge) fabBadge.textContent = totalItems;
  if (countEl) countEl.textContent = totalItems + ' 个';

  function renderBody(){
    var t = term.trim().toLowerCase();
    var totalShown = 0;
    var frag = document.createDocumentFragment();

    NAV_DATA.forEach(function(cat){
      var matched = cat.items.filter(function(item){
        if (!t) return true;
        return (item.name||'').toLowerCase().indexOf(t) !== -1
            || (item.desc||'').toLowerCase().indexOf(t) !== -1
            || (cat.name||'').toLowerCase().indexOf(t) !== -1;
      });
      if (matched.length === 0) return;
      totalShown += matched.length;

      var group = document.createElement('div');
      group.className = 'nav-group';

      var title = document.createElement('div');
      title.className = 'ng-title';
      title.textContent = cat.name + ' · ' + matched.length;
      group.appendChild(title);

      var grid = document.createElement('div');
      grid.className = 'nav-grid';
      matched.forEach(function(item){
        var initial = (item.name || '?').trim().charAt(0);
        var a = document.createElement('a');
        a.className = 'nav-item';
        a.href = encodeURI(item.path);
        a.innerHTML = '<div class="ni-icon" aria-hidden="true">' + escapeHtml(initial) + '</div>' +
          '<div class="ni-body">' +
            '<div class="ni-name">' + escapeHtml(item.name) + '</div>' +
            '<div class="ni-desc">' + escapeHtml(item.desc || '') + '</div>' +
          '</div>';
        grid.appendChild(a);
      });
      group.appendChild(grid);
      frag.appendChild(group);
    });

    bodyEl.textContent = '';
    if (totalShown === 0){
      bodyEl.innerHTML = '<div class="nav-empty">没有找到匹配的项目</div>';
    } else {
      bodyEl.appendChild(frag);
    }
    if (countEl) countEl.textContent = totalShown + ' 个';
  }

  function openModal(){
    lastFocused = document.activeElement;
    modal.classList.add('show');
    closeBtn.focus();
  }
  function closeModal(){
    modal.classList.remove('show');
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }

  fab.addEventListener('click', openModal);
  closeBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', function(e){ if (e.target === modal) closeModal(); });
  window.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && modal.classList.contains('show')) closeModal();
  });

  var searchRaf = 0;
  searchInput.addEventListener('input', function(e){
    term = e.target.value;
    if (searchRaf) return;
    searchRaf = requestAnimationFrame(function(){ searchRaf = 0; renderBody(); });
  });

  function ready(fn){
    if (document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', fn, { once:true });
    } else fn();
  }
  ready(function(){
    renderBody();
  });
})();
</script>
