<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>液态玻璃 · 粉丝数增长</title>
    <!-- 引入液态玻璃组件 -->
    <script src="https://glass.goose.cc.cd/liquid-glass.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0b14;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            padding: 20px;
        }

        /* ===== 玻璃卡片容器 ===== */
        .glass-wrapper {
            position: relative;
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        /* 自定义液态玻璃组件样式 */
        liquid-glass {
            display: block;
            width: 100%;
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        liquid-glass:hover {
            transform: translateY(-2px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        /* ===== 玻璃卡片内的内容 ===== */
        .glass-content {
            padding: 40px 36px 36px;
            color: #f0f0ff;
            text-align: center;
            min-height: 260px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(2px);
            /* 让内容稍微透出玻璃感 */
        }

        .glass-content .label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            opacity: 0.6;
            font-weight: 400;
            margin-bottom: 4px;
        }

        .glass-content .number-display {
            font-size: clamp(3.6rem, 12vw, 5.6rem);
            font-weight: 700;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
            color: transparent;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-repeat: no-repeat;
            background-size: 100% 100%;
            transition: background 0.1s;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            word-break: break-word;
        }

        .glass-content .sub-info {
            font-size: 0.9rem;
            opacity: 0.5;
            margin-top: 4px;
            letter-spacing: 1px;
            font-weight: 300;
        }

        .glass-content .status-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.5);
            transition: all 0.3s;
        }
        .glass-content .status-badge.active {
            color: #aabbff;
            border-color: rgba(100, 120, 255, 0.25);
            background: rgba(100, 120, 255, 0.08);
        }
        .glass-content .status-badge.done {
            color: #7affb0;
            border-color: rgba(100, 255, 180, 0.2);
            background: rgba(100, 255, 180, 0.06);
        }

        /* ===== 控制区（液态玻璃滑块容器） ===== */
        .controls-glass {
            width: 100%;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.04);
        }

        .controls-inner {
            padding: 28px 32px 32px;
            color: #d0d0ee;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .controls-inner .row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 16px;
            justify-content: center;
        }

        .controls-inner .row label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #9a9abe;
            font-weight: 500;
            min-width: 40px;
        }

        .controls-inner input[type="range"] {
            flex: 1;
            min-width: 120px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: linear-gradient(90deg, #3a3a6a, #6a6aff);
            border-radius: 4px;
            outline: none;
            transition: opacity 0.2s;
        }
        .controls-inner input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #7a7aff;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(90, 90, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.15);
            transition: 0.15s;
        }
        .controls-inner input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.12);
            background: #9a9aff;
        }
        .controls-inner input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #7a7aff;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        .controls-inner .range-value {
            font-size: 0.9rem;
            font-weight: 600;
            color: #f0f0ff;
            min-width: 48px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .controls-inner .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 6px;
        }

        .controls-inner .btn {
            padding: 10px 28px;
            border: none;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.8px;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.05);
            color: #c0c0e0;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            flex: 1;
            min-width: 100px;
        }
        .controls-inner .btn:hover {
            background: rgba(255, 255, 255, 0.10);
            transform: translateY(-1px);
        }
        .controls-inner .btn:active {
            transform: scale(0.96);
        }
        .controls-inner .btn-primary {
            background: #5a5aff;
            color: #fff;
            border-color: #5a5aff;
            box-shadow: 0 8px 24px rgba(90, 90, 255, 0.25);
        }
        .controls-inner .btn-primary:hover {
            background: #7070ff;
            border-color: #7070ff;
            box-shadow: 0 12px 32px rgba(90, 90, 255, 0.35);
        }
        .controls-inner .btn-primary:active {
            background: #4a4ae0;
        }
        .controls-inner .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.08);
        }
        .controls-inner .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .controls-inner .color-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 16px;
            justify-content: center;
        }
        .controls-inner .color-pair {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .controls-inner .color-pair span {
            font-size: 0.7rem;
            opacity: 0.4;
        }
        .controls-inner input[type="color"] {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 40px;
            padding: 2px;
            background: transparent;
            cursor: pointer;
            outline: none;
        }
        .controls-inner input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        .controls-inner input[type="color"]::-webkit-color-swatch {
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .controls-inner input[type="color"]::-moz-color-swatch {
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .controls-inner .hint {
            font-size: 0.65rem;
            color: #5a5a7a;
            letter-spacing: 0.5px;
            text-align: center;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 500px) {
            .glass-content {
                padding: 28px 20px 24px;
                min-height: 200px;
            }
            .glass-content .number-display {
                font-size: clamp(2.8rem, 14vw, 4rem);
            }
            .controls-inner {
                padding: 20px 18px 22px;
            }
            .controls-inner .row {
                gap: 8px 10px;
            }
            .controls-inner .btn {
                min-width: 70px;
                padding: 8px 16px;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 380px) {
            .glass-content .number-display {
                font-size: 2.4rem;
            }
            .controls-inner input[type="range"] {
                min-width: 80px;
            }
        }
    </style>
</head>
<body>

    <div class="glass-wrapper">
        <!-- ===== 主数字显示 - 液态玻璃卡片 ===== -->
        <liquid-glass mode="toggle-card" id="mainGlass">
            <div class="glass-content" id="glassContent">
                <div class="label">✦ 粉丝数 ✦</div>
                <div class="number-display" id="numberDisplay">0</div>
                <div class="sub-info" id="subInfo">增长中 · 从慢到快</div>
                <div class="status-badge" id="statusBadge">● 准备就绪</div>
            </div>
        </liquid-glass>

        <!-- ===== 控制面板 - 液态玻璃滑块容器 ===== -->
        <liquid-glass mode="slider-card" id="controlsGlass">
            <div class="controls-inner">
                <!-- 目标值滑块 -->
                <div class="row">
                    <label>目标</label>
                    <input type="range" id="targetSlider" min="0" max="10000" value="5200" step="100">
                    <span class="range-value" id="targetDisplay">5.2k</span>
                </div>

                <!-- 时长滑块 -->
                <div class="row">
                    <label>时长</label>
                    <input type="range" id="durationSlider" min="800" max="8000" value="3200" step="100">
                    <span class="range-value" id="durationDisplay">3.2s</span>
                </div>

                <!-- 渐变色控制 -->
                <div class="color-row">
                    <div class="color-pair">
                        <span>始</span>
                        <input type="color" id="colorStartA" value="#ff7b7b">
                        <span>→</span>
                        <input type="color" id="colorStartB" value="#7bb7ff">
                    </div>
                    <div class="color-pair">
                        <span>终</span>
                        <input type="color" id="colorEndA" value="#f9d976">
                        <span>→</span>
                        <input type="color" id="colorEndB" value="#ff6f91">
                    </div>
                </div>

                <!-- 按钮 -->
                <div class="btn-group">
                    <button class="btn btn-primary" id="startBtn">▶ 开始增长</button>
                    <button class="btn btn-secondary" id="resetBtn">⟳ 重置</button>
                </div>

                <div class="hint" id="statusHint">⚡ 拖动滑块调节参数 · 点击开始</div>
            </div>
        </liquid-glass>
    </div>

    <script>
        (function() {
            "use strict";

            // ===== DOM 引用 =====
            const numberDisplay = document.getElementById('numberDisplay');
            const subInfo = document.getElementById('subInfo');
            const statusBadge = document.getElementById('statusBadge');

            const targetSlider = document.getElementById('targetSlider');
            const targetDisplay = document.getElementById('targetDisplay');
            const durationSlider = document.getElementById('durationSlider');
            const durationDisplay = document.getElementById('durationDisplay');

            const colorStartA = document.getElementById('colorStartA');
            const colorStartB = document.getElementById('colorStartB');
            const colorEndA = document.getElementById('colorEndA');
            const colorEndB = document.getElementById('colorEndB');

            const startBtn = document.getElementById('startBtn');
            const resetBtn = document.getElementById('resetBtn');
            const statusHint = document.getElementById('statusHint');

            // ===== 状态 =====
            let currentValue = 0;
            let targetValue = 5200;
            let duration = 3200;
            let isRunning = false;
            let animationId = null;
            let startTime = null;
            let startValue = 0;

            // 颜色
            let cStartA = '#ff7b7b';
            let cStartB = '#7bb7ff';
            let cEndA = '#f9d976';
            let cEndB = '#ff6f91';

            // ===== 工具函数 =====
            function lerp(a, b, t) {
                return a + (b - a) * t;
            }

            function hexToRgb(hex) {
                let h = hex.trim();
                if (h.startsWith('#')) h = h.slice(1);
                if (h.length === 3) h = h.split('').map(c => c + c).join('');
                const result = /^([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h);
                if (!result) return { r: 0, g: 0, b: 0 };
                return {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                };
            }

            function rgbToCss(r, g, b) {
                return `rgb(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)})`;
            }

            function lerpColor(hex1, hex2, t) {
                const c1 = hexToRgb(hex1);
                const c2 = hexToRgb(hex2);
                return rgbToCss(
                    lerp(c1.r, c2.r, t),
                    lerp(c1.g, c2.g, t),
                    lerp(c1.b, c2.b, t)
                );
            }

            function formatNumber(n) {
                if (n >= 10000) {
                    return (n / 10000).toFixed(1) + 'w';
                } else if (n >= 1000) {
                    return (n / 1000).toFixed(1) + 'k';
                }
                return Math.round(n).toString();
            }

            function formatFull(n) {
                if (Number.isInteger(n)) return n.toString();
                return n.toFixed(1);
            }

            function computeGradient(t) {
                const a = lerpColor(cStartA, cStartB, t);
                const b = lerpColor(cEndA, cEndB, t);
                return `linear-gradient(135deg, ${a}, ${b})`;
            }

            function updateNumberDisplay(value) {
                const clamped = Math.min(Math.max(value, 0), targetValue);
                const p = targetValue > 0 ? clamped / targetValue : 0;
                const t = Math.min(Math.max(p, 0), 1);

                // 显示完整数字（保留1位小数）
                const displayVal = clamped;
                let text;
                if (displayVal >= 1000) {
                    text = formatNumber(displayVal);
                } else if (Number.isInteger(displayVal)) {
                    text = displayVal.toString();
                } else {
                    text = displayVal.toFixed(1);
                }
                numberDisplay.textContent = text;

                // 渐变色
                const gradient = computeGradient(t);
                numberDisplay.style.backgroundImage = gradient;
                numberDisplay.style.backgroundClip = 'text';
                numberDisplay.style.webkitBackgroundClip = 'text';
                numberDisplay.style.webkitTextFillColor = 'transparent';
                numberDisplay.style.color = 'transparent';
                numberDisplay.style.backgroundRepeat = 'no-repeat';
                numberDisplay.style.backgroundSize = '100% 100%';

                // 小信息
                if (isRunning) {
                    const progress = Math.round(t * 100);
                    subInfo.textContent = `🚀 增长中 · ${progress}%`;
                    statusBadge.textContent = '● 加速中';
                    statusBadge.className = 'status-badge active';
                } else if (t >= 1 && currentValue >= targetValue * 0.99) {
                    subInfo.textContent = `🎉 已达目标 · ${formatNumber(targetValue)}`;
                    statusBadge.textContent = '✓ 完成';
                    statusBadge.className = 'status-badge done';
                } else {
                    subInfo.textContent = `📈 当前 · ${formatNumber(clamped)}`;
                    statusBadge.textContent = '● 就绪';
                    statusBadge.className = 'status-badge';
                }
            }

            // ===== 动画循环 =====
            function animate(timestamp) {
                if (!isRunning) return;

                if (startTime === null) {
                    startTime = timestamp;
                }

                const elapsed = timestamp - startTime;
                let p = Math.min(elapsed / duration, 1);
                // 缓动：先慢后快 (二次)
                const eased = p * p;
                const val = startValue + (targetValue - startValue) * eased;
                currentValue = val;

                updateNumberDisplay(val);

                if (p < 1) {
                    animationId = requestAnimationFrame(animate);
                } else {
                    currentValue = targetValue;
                    updateNumberDisplay(targetValue);
                    isRunning = false;
                    animationId = null;
                    startTime = null;
                    startBtn.textContent = '▶ 开始增长';
                    statusHint.textContent = '✅ 完成！点击「开始增长」再来一次';
                }
            }

            // ===== 启动动画 =====
            function startAnimation() {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }

                // 读取当前参数
                targetValue = parseFloat(targetSlider.value) || 1000;
                duration = parseFloat(durationSlider.value) || 3000;

                cStartA = colorStartA.value;
                cStartB = colorStartB.value;
                cEndA = colorEndA.value;
                cEndB = colorEndB.value;

                // 从当前显示值开始
                startValue = currentValue;
                if (startValue >= targetValue) {
                    startValue = 0;
                    currentValue = 0;
                }

                isRunning = true;
                startTime = null;
                startBtn.textContent = '⏳ 增长中...';
                statusHint.textContent = '⏩ 加速中 · 从慢到快';

                animationId = requestAnimationFrame(animate);
            }

            // ===== 重置 =====
            function resetAnimation() {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                isRunning = false;
                startTime = null;
                currentValue = 0;
                startBtn.textContent = '▶ 开始增长';
                statusHint.textContent = '🔄 已重置 · 点击「开始增长」';
                updateNumberDisplay(0);
            }

            // ===== 更新滑块显示 =====
            targetSlider.addEventListener('input', function() {
                const val = parseFloat(this.value) || 0;
                targetDisplay.textContent = formatNumber(val);
                if (!isRunning) {
                    // 预览
                    const previewVal = parseFloat(this.value) || 0;
                    // 更新显示但不改变当前值？
                    // 只更新预览颜色，但数字显示保持当前值
                    const p = previewVal > 0 ? currentValue / previewVal : 0;
                    const t = Math.min(Math.max(p, 0), 1);
                    const gradient = computeGradient(t);
                    numberDisplay.style.backgroundImage = gradient;
                    numberDisplay.style.backgroundClip = 'text';
                    numberDisplay.style.webkitBackgroundClip = 'text';
                    numberDisplay.style.webkitTextFillColor = 'transparent';
                    statusHint.textContent = '⚡ 目标已更新 · 点击「开始增长」';
                }
            });

            durationSlider.addEventListener('input', function() {
                const val = parseFloat(this.value) || 3000;
                durationDisplay.textContent = (val / 1000).toFixed(1) + 's';
                if (!isRunning) {
                    statusHint.textContent = '⏱️ 时长已更新';
                }
            });

            // 颜色变化
            [colorStartA, colorStartB, colorEndA, colorEndB].forEach(el => {
                el.addEventListener('input', function() {
                    if (!isRunning) {
                        const p = targetValue > 0 ? currentValue / targetValue : 0;
                        const t = Math.min(Math.max(p, 0), 1);
                        const gradient = computeGradient(t);
                        numberDisplay.style.backgroundImage = gradient;
                        numberDisplay.style.backgroundClip = 'text';
                        numberDisplay.style.webkitBackgroundClip = 'text';
                        numberDisplay.style.webkitTextFillColor = 'transparent';
                        statusHint.textContent = '🎨 颜色已更新';
                    }
                });
            });

            // ===== 按钮事件 =====
            startBtn.addEventListener('click', startAnimation);

            resetBtn.addEventListener('click', function() {
                resetAnimation();
                // 重置滑块到默认
                targetSlider.value = '5200';
                targetDisplay.textContent = '5.2k';
                durationSlider.value = '3200';
                durationDisplay.textContent = '3.2s';
                colorStartA.value = '#ff7b7b';
                colorStartB.value = '#7bb7ff';
                colorEndA.value = '#f9d976';
                colorEndB.value = '#ff6f91';
                cStartA = '#ff7b7b';
                cStartB = '#7bb7ff';
                cEndA = '#f9d976';
                cEndB = '#ff6f91';
                targetValue = 5200;
                duration = 3200;
                currentValue = 0;
                updateNumberDisplay(0);
                statusHint.textContent = '🔄 已重置为默认';
            });

            // ===== 键盘快捷键 =====
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    if (isRunning) {
                        // 不打断
                    } else {
                        startAnimation();
                    }
                }
                if (e.key === 'r' && !e.ctrlKey && !e.metaKey) {
                    resetAnimation();
                }
            });

            // ===== 初始化 =====
            currentValue = 0;
            targetValue = 5200;
            duration = 3200;
            updateNumberDisplay(0);
            targetDisplay.textContent = '5.2k';
            durationDisplay.textContent = '3.2s';
            statusHint.textContent = '✨ 按 Enter/Space 开始 · R 重置';
        })();
    </script>

</body>
</html>
