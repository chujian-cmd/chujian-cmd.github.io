<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态渐变动画 · 从慢到快</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: #1e1e2f;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: rgba(30, 30, 46, 0.8);
            backdrop-filter: blur(4px);
            border-radius: 40px;
            padding: 2.2rem 2.5rem 2.8rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
            max-width: 700px;
            width: 100%;
            transition: 0.3s;
        }
        h1 {
            color: #e0e0ff;
            font-weight: 400;
            font-size: 1.8rem;
            letter-spacing: 1px;
            margin-top: 0;
            margin-bottom: 1.8rem;
            text-align: center;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }
        .param-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem 1.8rem;
            background: rgba(255, 255, 255, 0.04);
            padding: 1.5rem 1.8rem;
            border-radius: 28px;
            margin-bottom: 1.8rem;
        }
        .param-item {
            display: flex;
            flex-direction: column;
        }
        .param-item label {
            color: #b0b0d0;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.25rem;
        }
        .param-item input[type="number"],
        .param-item input[type="color"] {
            background: #282840;
            border: 1px solid #3e3e5a;
            border-radius: 60px;
            padding: 0.6rem 1rem;
            color: #f0f0ff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
            width: 100%;
        }
        .param-item input[type="number"]:focus,
        .param-item input[type="color"]:focus {
            border-color: #8a8aff;
            box-shadow: 0 0 0 3px rgba(138, 138, 255, 0.25);
        }
        .param-item input[type="color"] {
            height: 48px;
            padding: 4px;
            cursor: pointer;
        }
        .color-pair {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .color-pair span {
            color: #b0b0d0;
            font-size: 0.8rem;
        }
        .action-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            margin-top: 0.5rem;
        }
        .btn {
            background: #5a5aff;
            border: none;
            border-radius: 60px;
            padding: 0.9rem 3rem;
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(90, 90, 255, 0.3);
            transition: 0.2s;
            letter-spacing: 1px;
            width: fit-content;
            min-width: 160px;
        }
        .btn:hover {
            background: #6f6fff;
            transform: scale(1.02);
            box-shadow: 0 12px 24px rgba(90, 90, 255, 0.4);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.5);
        }
        .display-panel {
            background: #14141f;
            border-radius: 32px;
            padding: 1.2rem 1.8rem;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #3a3a52;
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.6);
        }
        .value-badge {
            background: #28284a;
            padding: 0.4rem 1.4rem;
            border-radius: 60px;
            font-size: 1.4rem;
            font-weight: 600;
            color: #d0d0ff;
            letter-spacing: 1px;
            min-width: 80px;
            text-align: center;
        }
        .gradient-preview {
            width: 100%;
            height: 48px;
            border-radius: 60px;
            background: linear-gradient(90deg, #ff7b7b, #7bb7ff);
            border: 1px solid #4a4a6a;
            transition: 0.15s ease;
        }
        .preview-wrapper {
            flex: 1;
            margin: 0 1rem;
            min-width: 120px;
        }
        .note {
            color: #7a7a9a;
            font-size: 0.75rem;
            margin-top: 0.8rem;
            text-align: center;
            letter-spacing: 0.3px;
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .inline-label {
            color: #b0b0d0;
            font-size: 0.8rem;
        }
        @media (max-width: 500px) {
            .card { padding: 1.5rem; }
            .param-grid { grid-template-columns: 1fr; gap: 0.8rem; }
            .display-panel { flex-wrap: wrap; gap: 0.6rem; justify-content: center; }
            .preview-wrapper { margin: 0; width: 100%; }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>✦ 渐变加速器 ✦</h1>

    <!-- 参数区 -->
    <div class="param-grid">
        <div class="param-item">
            <label>最小值</label>
            <input type="number" id="minVal" value="0" step="0.1">
        </div>
        <div class="param-item">
            <label>最大值</label>
            <input type="number" id="maxVal" value="100" step="0.1">
        </div>

        <div class="param-item">
            <label>起始渐变色</label>
            <div class="color-pair">
                <input type="color" id="startFrom" value="#ff7b7b">
                <span>→</span>
                <input type="color" id="startTo" value="#7bb7ff">
            </div>
        </div>
        <div class="param-item">
            <label>结束渐变色</label>
            <div class="color-pair">
                <input type="color" id="endFrom" value="#f9d976">
                <span>→</span>
                <input type="color" id="endTo" value="#ff6f91">
            </div>
        </div>
    </div>

    <!-- 显示 & 控制 -->
    <div class="action-area">
        <div class="display-panel">
            <div class="value-badge" id="currentValue">0.0</div>
            <div class="preview-wrapper">
                <div class="gradient-preview" id="gradientPreview"></div>
            </div>
        </div>

        <button class="btn" id="startBtn">▶ 开始</button>
        <div class="note" id="statusNote">设置参数，点击开始 · 从慢到快</div>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // DOM 元素
        const minInput = document.getElementById('minVal');
        const maxInput = document.getElementById('maxVal');
        const startFrom = document.getElementById('startFrom');
        const startTo = document.getElementById('startTo');
        const endFrom = document.getElementById('endFrom');
        const endTo = document.getElementById('endTo');
        const currentValueEl = document.getElementById('currentValue');
        const gradientPreview = document.getElementById('gradientPreview');
        const startBtn = document.getElementById('startBtn');
        const statusNote = document.getElementById('statusNote');

        // 动画状态
        let animationFrame = null;
        let startTime = null;
        let duration = 3000;          // 3秒完成从慢到快的加速过程
        let isRunning = false;

        // 当前参数 (在开始时刻固定)
        let currentMin = 0;
        let currentMax = 100;
        let colorStartFrom = '#ff7b7b';
        let colorStartTo = '#7bb7ff';
        let colorEndFrom = '#f9d976';
        let colorEndTo = '#ff6f91';

        // ---- 辅助函数 ----
        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        // 将 #hex 转为 rgb 对象 { r, g, b }
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 0, g: 0, b: 0 };
        }

        // rgb 对象 → css 颜色字符串
        function rgbToCss(r, g, b) {
            return `rgb(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)})`;
        }

        // 插值两个颜色 (rgb 分量)
        function lerpColor(hex1, hex2, t) {
            const c1 = hexToRgb(hex1);
            const c2 = hexToRgb(hex2);
            const r = lerp(c1.r, c2.r, t);
            const g = lerp(c1.g, c2.g, t);
            const b = lerp(c1.b, c2.b, t);
            return rgbToCss(r, g, b);
        }

        // 根据进度 t (0~1) 计算当前渐变 CSS
        function computeGradientCss(t) {
            // 起始渐变: startFrom → startTo
            const startColor = lerpColor(colorStartFrom, colorStartTo, t);
            // 结束渐变: endFrom → endTo
            const endColor = lerpColor(colorEndFrom, colorEndTo, t);
            return `linear-gradient(90deg, ${startColor}, ${endColor})`;
        }

        // 更新显示数值与渐变条
        function updateDisplay(value) {
            const clamped = Math.min(Math.max(value, currentMin), currentMax);
            // 显示数值 (保留1位小数)
            currentValueEl.textContent = clamped.toFixed(1);

            // 计算进度 t (0~1) 映射到 [currentMin, currentMax]
            let t = 0;
            if (currentMax !== currentMin) {
                t = (clamped - currentMin) / (currentMax - currentMin);
            } else {
                t = 0; // 避免除零
            }
            // 限制 t 在 [0,1]
            t = Math.min(Math.max(t, 0), 1);

            // 更新渐变背景
            gradientPreview.style.background = computeGradientCss(t);
        }

        // 重置显示为最小值 (或当前值)
        function resetDisplayToMin() {
            const minVal = parseFloat(minInput.value) || 0;
            currentMin = minVal;
            currentMax = parseFloat(maxInput.value) || 100;
            if (currentMax < currentMin) currentMax = currentMin + 1; // 防止最大值小于最小值

            // 同步颜色参数 (从输入读取)
            colorStartFrom = startFrom.value;
            colorStartTo = startTo.value;
            colorEndFrom = endFrom.value;
            colorEndTo = endTo.value;

            // 显示最小值
            updateDisplay(currentMin);
        }

        // ---- 动画主循环 (从慢到快) ----
        function animate(timestamp) {
            if (!isRunning) return;

            if (startTime === null) {
                startTime = timestamp;
            }

            // 计算经过的时间 (ms)
            const elapsed = timestamp - startTime;
            // 进度 p: 0 → 1, 使用 ease-in 二次曲线 (从慢到快)
            let p = Math.min(elapsed / duration, 1);
            // 二次方缓入: p = t^2  (从慢到快)
            const eased = p * p;   // 0→1, 速度从0逐渐增加

            // 当前值 = 最小值 + (最大值-最小值) * eased
            const currentVal = currentMin + (currentMax - currentMin) * eased;
            updateDisplay(currentVal);

            // 如果还没结束，继续下一帧
            if (p < 1) {
                animationFrame = requestAnimationFrame(animate);
            } else {
                // 动画结束，确保显示最大值
                updateDisplay(currentMax);
                isRunning = false;
                startBtn.textContent = '▶ 开始';
                statusNote.textContent = '✅ 动画完成 · 点击开始重新播放';
                startBtn.disabled = false;
                animationFrame = null;
                startTime = null;
            }
        }

        // ---- 启动动画 ----
        function startAnimation() {
            // 如果已有动画，先取消
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }

            // 读取最新参数
            let minVal = parseFloat(minInput.value);
            let maxVal = parseFloat(maxInput.value);
            if (isNaN(minVal)) minVal = 0;
            if (isNaN(maxVal)) maxVal = 100;
            if (maxVal < minVal) {
                // 交换，保证合理区间
                [minVal, maxVal] = [maxVal, minVal];
                minInput.value = minVal;
                maxInput.value = maxVal;
            }
            currentMin = minVal;
            currentMax = maxVal;

            // 读取颜色
            colorStartFrom = startFrom.value;
            colorStartTo = startTo.value;
            colorEndFrom = endFrom.value;
            colorEndTo = endTo.value;

            // 重置状态
            isRunning = true;
            startTime = null;
            startBtn.textContent = '⏳ 运行中';
            startBtn.disabled = true;
            statusNote.textContent = '⏩ 加速中 · 从慢到快';

            // 从最小值开始 (更新显示)
            updateDisplay(currentMin);

            // 开始动画循环
            animationFrame = requestAnimationFrame(animate);
        }

        // ---- 停止/重置 ----
        function stopAndReset() {
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }
            isRunning = false;
            startTime = null;
            startBtn.textContent = '▶ 开始';
            startBtn.disabled = false;
            // 重置到当前参数的最小值
            resetDisplayToMin();
            statusNote.textContent = '⏹ 已重置 · 点击开始';
        }

        // ---- 事件绑定 ----
        startBtn.addEventListener('click', function() {
            if (isRunning) {
                // 如果正在运行，点击重新开始 (先停止再开始)
                stopAndReset();
                // 延迟一帧再启动，避免冲突
                setTimeout(() => {
                    startAnimation();
                }, 20);
            } else {
                startAnimation();
            }
        });

        // 参数变更时，如果动画未运行，实时更新预览
        const paramInputs = [minInput, maxInput, startFrom, startTo, endFrom, endTo];
        paramInputs.forEach(input => {
            input.addEventListener('input', function() {
                if (!isRunning) {
                    resetDisplayToMin();
                    statusNote.textContent = '⚙️ 参数已更新 · 点击开始';
                } else {
                    // 运行时修改参数：为了体验，不干扰正在运行的动画，但可以提示
                    statusNote.textContent = '⏳ 动画运行中，参数将在下次生效';
                }
            });
        });

        // 额外：点击数字输入框时，若动画运行则提示
        paramInputs.forEach(input => {
            input.addEventListener('focus', function() {
                if (isRunning) {
                    statusNote.textContent = '⏳ 动画运行中，修改参数不会影响当前动画';
                }
            });
        });

        // ---- 初始化 ----
        resetDisplayToMin();
        statusNote.textContent = '✨ 设置参数，点击「开始」从慢到快';
    })();
</script>
</body>
</html>
