<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纯数字动画 · 慢到快</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: #0b0b14;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: #14141f;
            border-radius: 48px;
            padding: 2.5rem 3rem 3rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
            max-width: 680px;
            width: 100%;
            transition: 0.3s;
        }
        h1 {
            color: #c8c8e8;
            font-weight: 300;
            font-size: 1.6rem;
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 2rem;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }
        .param-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem 1.8rem;
            background: rgba(255, 255, 255, 0.02);
            padding: 1.6rem 1.8rem;
            border-radius: 32px;
            margin-bottom: 1.8rem;
            border: 1px solid #2a2a3e;
        }
        .param-item {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }
        .param-item label {
            color: #9a9abe;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 500;
        }
        .param-item input[type="number"],
        .param-item input[type="color"] {
            background: #1e1e30;
            border: 1px solid #333350;
            border-radius: 40px;
            padding: 0.6rem 1rem;
            color: #f0f0ff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
            width: 100%;
        }
        .param-item input[type="number"]:focus,
        .param-item input[type="color"]:focus {
            border-color: #7a7aff;
            box-shadow: 0 0 0 3px rgba(122, 122, 255, 0.2);
        }
        .param-item input[type="color"] {
            height: 44px;
            padding: 4px;
            cursor: pointer;
        }
        .color-pair {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .color-pair span {
            color: #7a7a9a;
            font-size: 0.8rem;
        }
        .duration-item {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .duration-item label {
            min-width: 70px;
        }
        .duration-item input {
            flex: 1;
            min-width: 100px;
        }
        .action-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.8rem;
            margin-top: 0.2rem;
        }
        .btn {
            background: #5a5aff;
            border: none;
            border-radius: 60px;
            padding: 0.9rem 3.2rem;
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(90, 90, 255, 0.25);
            transition: 0.2s;
            letter-spacing: 1px;
            width: fit-content;
            min-width: 160px;
        }
        .btn:hover {
            background: #7070ff;
            transform: scale(1.02);
            box-shadow: 0 12px 28px rgba(90, 90, 255, 0.35);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn:disabled {
            opacity: 0.45;
            pointer-events: none;
            filter: grayscale(0.6);
        }
        /* 纯数字显示区 —— 只有数字，没有任何额外元素 */
        .number-display {
            background: #0a0a12;
            border-radius: 40px;
            padding: 1.2rem 1.8rem;
            width: 100%;
            text-align: center;
            border: 1px solid #2a2a44;
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.8);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .number-display .digit {
            font-size: 4.2rem;
            font-weight: 600;
            color: #f0f0ff;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px rgba(120, 120, 255, 0.15);
            transition: color 0.1s;
            background: linear-gradient(90deg, #ff7b7b, #7bb7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .status-note {
            color: #5a5a7a;
            font-size: 0.75rem;
            margin-top: 0.2rem;
            text-align: center;
            letter-spacing: 0.5px;
            min-height: 1.4rem;
        }
        @media (max-width: 500px) {
            .card { padding: 1.5rem; }
            .param-grid { grid-template-columns: 1fr; gap: 0.8rem; }
            .number-display .digit { font-size: 3rem; }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>✦ 数字加速 ✦</h1>

    <!-- 参数区 -->
    <div class="param-grid">
        <div class="param-item">
            <label>最小值</label>
            <input type="number" id="minVal" value="0" step="0.1">
        </div>
        <div class="param-item">
            <label>最大值</label>
            <input type="number" id="maxVal" value="100" step="0.1">
        </div>

        <div class="param-item">
            <label>起始渐变色</label>
            <div class="color-pair">
                <input type="color" id="startFrom" value="#ff7b7b">
                <span>→</span>
                <input type="color" id="startTo" value="#7bb7ff">
            </div>
        </div>
        <div class="param-item">
            <label>结束渐变色</label>
            <div class="color-pair">
                <input type="color" id="endFrom" value="#f9d976">
                <span>→</span>
                <input type="color" id="endTo" value="#ff6f91">
            </div>
        </div>

        <!-- 动画时长自定义 (用户可调) -->
        <div class="param-item duration-item">
            <label for="durationInput">⏱️ 时长 (ms)</label>
            <input type="number" id="durationInput" value="3000" step="100" min="300" max="10000">
        </div>
    </div>

    <!-- 纯数字显示 + 控制 -->
    <div class="action-area">
        <!-- 只有数字，没有渐变条，没有额外装饰 -->
        <div class="number-display">
            <span class="digit" id="currentNumber">0.0</span>
        </div>

        <button class="btn" id="startBtn">▶ 开始</button>
        <div class="status-note" id="statusNote">设置参数，点击开始 · 从慢到快</div>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // DOM 元素
        const minInput = document.getElementById('minVal');
        const maxInput = document.getElementById('maxVal');
        const startFrom = document.getElementById('startFrom');
        const startTo = document.getElementById('startTo');
        const endFrom = document.getElementById('endFrom');
        const endTo = document.getElementById('endTo');
        const durationInput = document.getElementById('durationInput');
        const currentNumberEl = document.getElementById('currentNumber');
        const startBtn = document.getElementById('startBtn');
        const statusNote = document.getElementById('statusNote');

        // 动画状态
        let animationFrame = null;
        let startTime = null;
        let duration = 3000;          // 默认 3 秒
        let isRunning = false;

        // 当前参数 (在开始时刻固定)
        let currentMin = 0;
        let currentMax = 100;
        let colorStartFrom = '#ff7b7b';
        let colorStartTo = '#7bb7ff';
        let colorEndFrom = '#f9d976';
        let colorEndTo = '#ff6f91';

        // ---- 辅助 ----
        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 0, g: 0, b: 0 };
        }

        function rgbToCss(r, g, b) {
            return `rgb(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)})`;
        }

        function lerpColor(hex1, hex2, t) {
            const c1 = hexToRgb(hex1);
            const c2 = hexToRgb(hex2);
            const r = lerp(c1.r, c2.r, t);
            const g = lerp(c1.g, c2.g, t);
            const b = lerp(c1.b, c2.b, t);
            return rgbToCss(r, g, b);
        }

        // 根据进度 t (0~1) 计算当前颜色 (渐变插值)
        function computeCurrentColor(t) {
            // 起始渐变: startFrom → startTo
            const startColor = lerpColor(colorStartFrom, colorStartTo, t);
            // 结束渐变: endFrom → endTo
            const endColor = lerpColor(colorEndFrom, colorEndTo, t);
            // 再根据 t 混合 startColor 和 endColor (让颜色也动态变化)
            return lerpColor(startColor, endColor, t);
        }

        // 更新显示 —— 只有纯数字，颜色随数值渐变
        function updateNumber(value) {
            const clamped = Math.min(Math.max(value, currentMin), currentMax);
            // 显示数值 (保留1位小数)
            currentNumberEl.textContent = clamped.toFixed(1);

            // 计算进度 t (0~1)
            let t = 0;
            if (currentMax !== currentMin) {
                t = (clamped - currentMin) / (currentMax - currentMin);
            } else {
                t = 0;
            }
            t = Math.min(Math.max(t, 0), 1);

            // 动态颜色：应用到数字上 (利用 background-clip 实现渐变文字)
            const color = computeCurrentColor(t);
            // 直接设置 background 为渐变，让文字颜色跟随
            // 为了更纯粹的渐变效果，我们使用 background 并裁剪
            currentNumberEl.style.background = `linear-gradient(90deg, ${color}, ${color})`;
            // 保持透明文字填充
            currentNumberEl.style.webkitTextFillColor = 'transparent';
            currentNumberEl.style.backgroundClip = 'text';
            currentNumberEl.style.webkitBackgroundClip = 'text';
        }

        // 重置显示为最小值
        function resetDisplayToMin() {
            const minVal = parseFloat(minInput.value) || 0;
            const maxVal = parseFloat(maxInput.value) || 100;
            currentMin = Math.min(minVal, maxVal);
            currentMax = Math.max(minVal, maxVal);
            if (currentMax === currentMin) currentMax = currentMin + 1;

            // 同步颜色
            colorStartFrom = startFrom.value;
            colorStartTo = startTo.value;
            colorEndFrom = endFrom.value;
            colorEndTo = endTo.value;

            // 读取时长
            const dur = parseInt(durationInput.value);
            if (!isNaN(dur) && dur >= 100) duration = dur;
            else duration = 3000;

            updateNumber(currentMin);
        }

        // ---- 动画循环 (从慢到快) ----
        function animate(timestamp) {
            if (!isRunning) return;

            if (startTime === null) {
                startTime = timestamp;
            }

            const elapsed = timestamp - startTime;
            let p = Math.min(elapsed / duration, 1);
            // 二次缓入: 从慢到快
            const eased = p * p;

            const currentVal = currentMin + (currentMax - currentMin) * eased;
            updateNumber(currentVal);

            if (p < 1) {
                animationFrame = requestAnimationFrame(animate);
            } else {
                // 确保最终停在最大值
                updateNumber(currentMax);
                isRunning = false;
                startBtn.textContent = '▶ 开始';
                statusNote.textContent = '✅ 完成 · 点击重新播放';
                startBtn.disabled = false;
                animationFrame = null;
                startTime = null;
            }
        }

        // ---- 启动 ----
        function startAnimation() {
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }

            // 读取最新参数
            let minVal = parseFloat(minInput.value);
            let maxVal = parseFloat(maxInput.value);
            if (isNaN(minVal)) minVal = 0;
            if (isNaN(maxVal)) maxVal = 100;
            if (maxVal < minVal) {
                [minVal, maxVal] = [maxVal, minVal];
                minInput.value = minVal;
                maxInput.value = maxVal;
            }
            currentMin = minVal;
            currentMax = maxVal;

            colorStartFrom = startFrom.value;
            colorStartTo = startTo.value;
            colorEndFrom = endFrom.value;
            colorEndTo = endTo.value;

            const dur = parseInt(durationInput.value);
            if (!isNaN(dur) && dur >= 100) duration = dur;
            else duration = 3000;

            // 重置状态
            isRunning = true;
            startTime = null;
            startBtn.textContent = '⏳ 运行中';
            startBtn.disabled = true;
            statusNote.textContent = '⏩ 加速中 · 从慢到快';

            // 从最小值开始
            updateNumber(currentMin);

            animationFrame = requestAnimationFrame(animate);
        }

        // ---- 停止/重置 ----
        function stopAndReset() {
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }
            isRunning = false;
            startTime = null;
            startBtn.textContent = '▶ 开始';
            startBtn.disabled = false;
            resetDisplayToMin();
            statusNote.textContent = '⏹ 已重置 · 点击开始';
        }

        // ---- 事件绑定 ----
        startBtn.addEventListener('click', function() {
            if (isRunning) {
                stopAndReset();
                setTimeout(() => startAnimation(), 20);
            } else {
                startAnimation();
            }
        });

        // 参数变更时，如果未运行则实时更新预览
        const paramInputs = [minInput, maxInput, startFrom, startTo, endFrom, endTo, durationInput];
        paramInputs.forEach(input => {
            input.addEventListener('input', function() {
                if (!isRunning) {
                    resetDisplayToMin();
                    statusNote.textContent = '⚙️ 参数已更新 · 点击开始';
                } else {
                    statusNote.textContent = '⏳ 运行中，参数下次生效';
                }
            });
        });

        // ---- 初始化 ----
        resetDisplayToMin();
        statusNote.textContent = '✨ 设置参数，点击「开始」从慢到快';
    })();
</script>
</body>
</html>
