<!DOCTYPE html>

    <style>

        .file-label {

<body>
    <div class="card">
        <h1>
            <span>📱</span> 二维码工坊
            <span style="font-size:0.9rem; font-weight:400; background:#e8f0fe; color:#3b7bff; padding:2px 10px; border-radius:30px; margin-left:auto;">无依赖</span>
        </h1>
        <div class="subhead">生成 · 解析 · 纯前端 · 零外部库</div>

        <div class="grid">
            <!-- ========= 生成器面板 ========= -->
            <div class="panel">
                <h2>
                    <span class="icon">✨</span> 生成二维码
                    <span>GENERATOR</span>
                </h2>
                <textarea id="genInput" rows="3" placeholder="输入文本或网址… 例如：https://example.com">https://example.com</textarea>
                
                <div class="qr-preview">
                    <canvas id="qrcanvas" width="200" height="200"></canvas>
                </div>

                <div class="btn-row">
                    <button class="primary" id="generateBtn">
                        <span class="icon">🔳</span> 生成
                    </button>
                    <button id="downloadBtn">
                        <span class="icon">⬇️</span> 下载 PNG
                    </button>
                </div>
                <div class="note">使用原生 Canvas 绘制，纠错等级 M</div>
            </div>

            <!-- ========= 解析器面板 ========= -->
            <div class="panel">
                <h2>
                    <span class="icon">🔍</span> 解析二维码
                    <span>DECODER</span>
                </h2>
                
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <label class="file-label" for="qrFileInput">
                        <span class="icon">📂</span> 选择二维码图片
                    </label>
                    <input type="file" id="qrFileInput" accept="image/*">
                    
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="imageUrlInput" placeholder="或粘贴图片 URL…" style="flex:1;">
                        <button id="loadUrlBtn" style="flex:0 0 auto; padding:10px 18px;">加载</button>
                    </div>
                </div>

                <div class="decode-result" id="decodeResult">
                    <div class="label">解析结果</div>
                    <div class="decode-content placeholder" id="decodeText">等待上传或输入图片…</div>
                </div>

                <div class="btn-row" style="margin-top: 6px;">
                    <button id="clearDecodeBtn">清除结果</button>
                </div>
                <div class="note">支持常见图片格式，本地解析不上传</div>
            </div>
        </div>
    </div>

    <script>
        (function(){
            // ============================================================
            //  1. 二维码生成器 —— 纯原生实现 (QR Code 算法简化版)
            //     基于经典 QR 码原理，生成版本 1-4 的二维码 (M 纠错)
            //     仅支持 Byte 模式(UTF-8)，不依赖任何外部库。
            // ============================================================
            
            // -------------------- 二维码常量 & 工具 --------------------
            const QRMode = { BYTE: 4 };          // 字节模式
            const ECLevel = { M: 0 };            // 纠错等级 M (L:1, M:0, Q:3, H:2) 按 QR 标准索引
            
            // 版本1-4 的容量 (字节模式, 纠错M)
            // 来源: QR 标准容量表 (版本1 M: 14字节, 版本2 M: 26, 版本3 M: 42, 版本4 M: 62)
            const VERSION_CAPACITY = {
                1: { M: 14 },
                2: { M: 26 },
                3: { M: 42 },
                4: { M: 62 }
            };
            
            // 每个版本的总码字数 (数据码字+纠错码字)
            const VERSION_TOTAL_CODEWORDS = {
                1: 26,
                2: 44,
                3: 70,
                4: 100
            };
            
            // 数据码字数 (版本1-4, M级别)
            const VERSION_DATA_CODEWORDS = {
                1: 16,   // 总26 - 纠错10 = 16
                2: 28,   // 总44 - 纠错16 = 28
                3: 44,   // 总70 - 纠错26 = 44
                4: 64    // 总100 - 纠错36 = 64
            };
            
            // 纠错码字数 (M级别)
            const VERSION_EC_CODEWORDS = {
                1: 10,
                2: 16,
                3: 26,
                4: 36
            };
            
            // 每个版本的对齐图案中心坐标 (版本1无)
            const ALIGNMENT_PATTERNS = {
                1: [],
                2: [6, 18],
                3: [6, 22],
                4: [6, 26]
            };
            
            // 格式信息 (纠错等级 M, 掩码 0-7) —— 预计算表 (M级别)
            const FORMAT_INFO_M = [
                0x5412, 0x5125, 0x5E7C, 0x5B4B, 0x45F9, 0x40CE, 0x4F97, 0x4AA0
            ];
            
            // 版本信息 (版本7以上才需要, 这里不用)
            
            // GF(256) 对数/反对数表 —— 用于 Reed-Solomon 纠错
            const GF_EXP = new Uint8Array(512);
            const GF_LOG = new Uint8Array(256);
            (function initGF() {
                let x = 1;
                for (let i = 0; i < 255; i++) {
                    GF_EXP[i] = x;
                    GF_LOG[x] = i;
                    x = (x << 1) ^ (x & 0x80 ? 0x11D : 0); // 本原多项式 0x11D
                }
                for (let i = 255; i < 512; i++) {
                    GF_EXP[i] = GF_EXP[i - 255];
                }
            })();
            
            // GF 乘法
            function gfMul(a, b) {
                if (a === 0 || b === 0) return 0;
                return GF_EXP[GF_LOG[a] + GF_LOG[b]];
            }
            
            // 生成 Reed-Solomon 纠错码字
            function rsEncode(data, ecCount) {
                const genPoly = [];
                // 生成多项式 (x - α^0)(x - α^1)...(x - α^(ecCount-1))
                let poly = [1];
                for (let i = 0; i < ecCount; i++) {
                    // 乘以 (x + α^i)
                    const newPoly = new Array(poly.length + 1).fill(0);
                    for (let j = 0; j < poly.length; j++) {
                        newPoly[j] ^= poly[j];                    // x 项系数
                        newPoly[j + 1] ^= gfMul(poly[j], GF_EXP[i]); // 常数项
                    }
                    poly = newPoly;
                }
                // 多项式除法求余数
                const remainder = new Uint8Array(data.length + ecCount);
                remainder.set(data);
                for (let i = 0; i < data.length; i++) {
                    const coef = remainder[i];
                    if (coef !== 0) {
                        for (let j = 0; j < poly.length; j++) {
                            remainder[i + j] ^= gfMul(poly[j], coef);
                        }
                    }
                }
                // 返回最后 ecCount 个字节
                return remainder.slice(data.length);
            }
            
            // 生成最终码字序列 (数据 + 纠错)
            function generateCodewords(dataBytes, version, ecLevel) {
                const dataCapacity = VERSION_DATA_CODEWORDS[version];
                // 填充数据到数据容量 (模式指示符+字符计数+数据+填充)
                const bitStream = [];
                
                // 模式指示符 (4 bits) 字节模式 = 0100
                bitStream.push(0, 1, 0, 0);
                
                // 字符计数指示符 (版本1-9: 8 bits)
                const count = dataBytes.length;
                for (let i = 7; i >= 0; i--) {
                    bitStream.push((count >> i) & 1);
                }
                
                // 数据字节
                for (const b of dataBytes) {
                    for (let i = 7; i >= 0; i--) {
                        bitStream.push((b >> i) & 1);
                    }
                }
                
                // 终止符 (最多4个0)
                const totalBits = dataCapacity * 8;
                for (let i = 0; i < 4 && bitStream.length < totalBits; i++) {
                    bitStream.push(0);
                }
                
                // 补齐到字节边界
                while (bitStream.length % 8 !== 0) {
                    bitStream.push(0);
                }
                
                // 填充字节 0xEC, 0x11 交替
                const padBytes = [0xEC, 0x11];
                let padIndex = 0;
                while (bitStream.length < totalBits) {
                    const pad = padBytes[padIndex % 2];
                    for (let i = 7; i >= 0; i--) {
                        bitStream.push((pad >> i) & 1);
                    }
                    padIndex++;
                }
                
                // 转换为字节数组
                const dataCodewords = [];
                for (let i = 0; i < bitStream.length; i += 8) {
                    let byte = 0;
                    for (let j = 0; j < 8; j++) {
                        byte = (byte << 1) | bitStream[i + j];
                    }
                    dataCodewords.push(byte);
                }
                
                // 纠错码字
                const ecCount = VERSION_EC_CODEWORDS[version];
                const ecCodewords = rsEncode(dataCodewords, ecCount);
                
                // 最终码字: 数据 + 纠错
                return [...dataCodewords, ...ecCodewords];
            }
            
            // 将码字转换为位矩阵 (带掩码)
            function buildMatrix(codewords, version, maskPattern = 0) {
                const size = version * 4 + 17; // 版本1: 21x21
                // 初始化矩阵 (null 表示未设置)
                const matrix = Array(size).fill().map(() => Array(size).fill(null));
                
                // 1. 添加定位图案 (Finder Patterns)
                function placeFinder(row, col) {
                    for (let r = -1; r <= 7; r++) {
                        for (let c = -1; c <= 7; c++) {
                            const rr = row + r, cc = col + c;
                            if (rr < 0 || rr >= size || cc < 0 || cc >= size) continue;
                            // 外框: 黑色边框 (值为1)
                            if ((r >= 0 && r <= 6 && (c === 0 || c === 6)) ||
                                (c >= 0 && c <= 6 && (r === 0 || r === 6)) ||
                                (r >= 2 && r <= 4 && c >= 2 && c <= 4)) {
                                matrix[rr][cc] = 1;
                            } else {
                                matrix[rr][cc] = 0;
                            }
                        }
                    }
                }
                // 左上
                placeFinder(0, 0);
                // 右上
                placeFinder(0, size - 7);
                // 左下
                placeFinder(size - 7, 0);
                
                // 2. 添加分隔符 (白色边框, 1格宽) —— 实际上定位图案周围已包含, 但需确保分隔符为0
                // 已在 placeFinder 中处理了 -1~7 范围, 不过有的边界没有覆盖, 手动设置分隔符为0
                for (let i = 0; i < 8; i++) {
                    // 左上分隔符
                    if (7 < size) matrix[7][i] = 0;
                    if (7 < size) matrix[i][7] = 0;
                    // 右上分隔符
                    if (size - 8 >= 0) matrix[7][size - 8 + i] = 0;
                    if (size - 8 >= 0) matrix[i][size - 8] = 0;
                    // 左下分隔符
                    if (size - 8 >= 0) matrix[size - 8][i] = 0;
                    if (size - 8 >= 0) matrix[size - 8 + i][7] = 0;
                }
                
                // 3. 添加定位图案 (Alignment Patterns) —— 版本2以上
                const alignPos = ALIGNMENT_PATTERNS[version] || [];
                for (const row of alignPos) {
                    for (const col of alignPos) {
                        // 跳过与定位图案重叠的区域
                        if ((row === 6 && col === 6) || (row === 6 && col === size - 7) || (row === size - 7 && col === 6)) continue;
                        for (let r = -2; r <= 2; r++) {
                            for (let c = -2; c <= 2; c++) {
                                const rr = row + r, cc = col + c;
                                if (rr < 0 || rr >= size || cc < 0 || cc >= size) continue;
                                if (Math.abs(r) === 2 || Math.abs(c) === 2 || (r === 0 && c === 0)) {
                                    matrix[rr][cc] = 1;
                                } else {
                                    matrix[rr][cc] = 0;
                                }
                            }
                        }
                    }
                }
                
                // 4. 添加时序图案 (Timing Patterns)
                for (let i = 8; i < size - 8; i++) {
                    if (matrix[6][i] === null) matrix[6][i] = (i % 2 === 0) ? 1 : 0;
                    if (matrix[i][6] === null) matrix[i][6] = (i % 2 === 0) ? 1 : 0;
                }
                
                // 5. 固定暗模块 (Dark Module)
                matrix[size - 8][8] = 1;
                
                // 6. 预留格式信息区域 (先填充占位, 稍后写入真实格式信息)
                // 格式信息位于: 行8列0-8, 行0-8列8 (左上区域), 以及右上/左下部分
                // 暂时留空, 稍后填充
                const reserved = new Set();
                for (let i = 0; i <= 8; i++) {
                    if (i !== 6) { // 跳过时序
                        reserved.add(`8,${i}`);
                        reserved.add(`${i},8`);
                    }
                    if (i < 8) {
                        reserved.add(`8,${size - 1 - i}`);
                        reserved.add(`${size - 1 - i},8`);
                    }
                }
                // 格式信息区不覆盖已设置的定位图案等, 但此处简单处理: 后面写格式会覆盖
                
                // 7. 放置数据位 (从右下角开始, ZigZag)
                const dataBits = [];
                for (const cw of codewords) {
                    for (let i = 7; i >= 0; i--) {
                        dataBits.push((cw >> i) & 1);
                    }
                }
                
                let bitIndex = 0;
                let upward = true;
                for (let col = size - 1; col > 0; col -= 2) {
                    if (col === 6) col--; // 跳过时序列
                    for (let i = 0; i < size; i++) {
                        const row = upward ? size - 1 - i : i;
                        for (let c = 0; c < 2; c++) {
                            const cc = col - c;
                            // 只填充未设置且非功能图案的模块 (但这里简化: 只要为null就填充)
                            if (matrix[row][cc] === null) {
                                let bit = (bitIndex < dataBits.length) ? dataBits[bitIndex] : 0;
                                // 应用掩码 (maskPattern 这里固定用0, 也可以选择其他)
                                // 掩码规则 (i=row, j=col) 掩码0: (i+j)%2==0
                                if (maskPattern === 0) {
                                    if ((row + cc) % 2 === 0) bit = bit ^ 1;
                                }
                                matrix[row][cc] = bit;
                                bitIndex++;
                            }
                        }
                    }
                    upward = !upward;
                }
                
                // 8. 写入格式信息 (使用预计算的格式信息表, 纠错等级M, 掩码0)
                // 格式信息为15位, 按标准放置
                const formatBits = FORMAT_INFO_M[maskPattern];
                // 放置格式信息 (具体位置参考标准)
                const formatPositions = [
                    // 左上 (行8, 列0-8 跳过列6)
                    [8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],
                    [7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8],
                    // 右上 & 左下
                    [size-1,8],[size-2,8],[size-3,8],[size-4,8],[size-5,8],[size-6,8],[size-7,8],
                    [8,size-8],[8,size-7],[8,size-6],[8,size-5],[8,size-4],[8,size-3],[8,size-2],[8,size-1]
                ];
                
                // 将格式信息位映射到对应位置 (高位在前)
                for (let i = 0; i < 15; i++) {
                    const bit = (formatBits >> (14 - i)) & 1;
                    const pos = formatPositions[i];
                    if (pos) {
                        matrix[pos[0]][pos[1]] = bit;
                    }
                }
                
                // 其余保留为0 (比如暗模块等) 但应该已经填充
                // 最后把矩阵中的null都置为0 (以防万一)
                for (let r = 0; r < size; r++) {
                    for (let c = 0; c < size; c++) {
                        if (matrix[r][c] === null) matrix[r][c] = 0;
                    }
                }
                
                return matrix;
            }
            
            // 核心生成函数: 输入文本, 输出 canvas 的 ImageData 或直接绘制到 canvas
            function generateQRCode(text, canvas) {
                if (!text || text.trim() === '') {
                    throw new Error('输入文本不能为空');
                }
                // 将文本转换为 UTF-8 字节
                const encoder = new TextEncoder();
                const bytes = encoder.encode(text);
                
                // 选择最小版本 (容量足够)
                let version = 0;
                for (let v = 1; v <= 4; v++) {
                    if (bytes.length <= VERSION_CAPACITY[v].M) {
                        version = v;
                        break;
                    }
                }
                if (version === 0) {
                    throw new Error('文本过长，仅支持最多62字节 (约62个英文字符或20个汉字)');
                }
                
                // 生成码字
                const codewords = generateCodewords(bytes, version, ECLevel.M);
                // 构建矩阵 (掩码0)
                const matrix = buildMatrix(codewords, version, 0);
                const size = matrix.length;
                
                // 绘制到 canvas
                const ctx = canvas.getContext('2d');
                const moduleSize = Math.floor(600 / size); // 每个模块的像素大小, 固定600px宽
                const canvasSize = moduleSize * size;
                canvas.width = canvasSize;
                canvas.height = canvasSize;
                ctx.clearRect(0, 0, canvasSize, canvasSize);
                
                // 填充白色背景
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, canvasSize, canvasSize);
                
                // 绘制黑色模块
                ctx.fillStyle = '#000000';
                for (let r = 0; r < size; r++) {
                    for (let c = 0; c < size; c++) {
                        if (matrix[r][c] === 1) {
                            ctx.fillRect(c * moduleSize, r * moduleSize, moduleSize, moduleSize);
                        }
                    }
                }
            }
            
            // ============================================================
            //  2. 二维码解析器 —— 使用 BarcodeDetector API (如果可用)
            //     如果不支持, 则回退到手动解析? 但为保持无依赖, 
            //     这里使用原生 BarcodeDetector (现代浏览器支持)
            //     若浏览器不支持, 会给出提示。
            // ============================================================
            
            async function decodeQRCodeFromImage(imageSource) {
                // 检查 BarcodeDetector 支持
                if (!('BarcodeDetector' in window)) {
                    throw new Error('当前浏览器不支持 BarcodeDetector API，无法解析。请使用最新版 Chrome/Edge/Safari 等。');
                }
                // 检查是否支持 qr_code 格式
                const formats = await BarcodeDetector.getSupportedFormats();
                if (!formats.includes('qr_code')) {
                    throw new Error('当前浏览器不支持二维码识别格式');
                }
                
                const detector = new BarcodeDetector({ formats: ['qr_code'] });
                const barcodes = await detector.detect(imageSource);
                if (barcodes.length === 0) {
                    throw new Error('未检测到二维码，请确保图片清晰且包含二维码');
                }
                return barcodes[0].rawValue;
            }
            
            // ============================================================
            //  3. UI 逻辑
            // ============================================================
            document.addEventListener('DOMContentLoaded', () => {
                // 生成器元素
                const genInput = document.getElementById('genInput');
                const qrCanvas = document.getElementById('qrcanvas');
                const generateBtn = document.getElementById('generateBtn');
                const downloadBtn = document.getElementById('downloadBtn');
                
                // 解析器元素
                const fileInput = document.getElementById('qrFileInput');
                const imageUrlInput = document.getElementById('imageUrlInput');
                const loadUrlBtn = document.getElementById('loadUrlBtn');
                const decodeText = document.getElementById('decodeText');
                const clearDecodeBtn = document.getElementById('clearDecodeBtn');
                
                // ---------- 生成二维码 ----------
                function renderQR() {
                    try {
                        generateQRCode(genInput.value, qrCanvas);
                    } catch (e) {
                        // 在 canvas 上绘制错误信息
                        const ctx = qrCanvas.getContext('2d');
                        const w = qrCanvas.width = 400;
                        const h = qrCanvas.height = 200;
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(0, 0, w, h);
                        ctx.fillStyle = '#c0392b';
                        ctx.font = '16px system-ui, sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(e.message, w/2, h/2);
                    }
                }
                
                generateBtn.addEventListener('click', renderQR);
                // 输入时实时生成 (可选)
                genInput.addEventListener('input', renderQR);
                
                // 下载 PNG
                downloadBtn.addEventListener('click', () => {
                    // 确保有有效二维码
                    try {
                        generateQRCode(genInput.value, qrCanvas);
                    } catch (e) {
                        alert('无法生成二维码: ' + e.message);
                        return;
                    }
                    const link = document.createElement('a');
                    link.download = 'qrcode.png';
                    link.href = qrCanvas.toDataURL('image/png');
                    link.click();
                });
                
                // ---------- 解析二维码 ----------
                async function decodeFromFile(file) {
                    try {
                        // 显示加载状态
                        decodeText.textContent = '解析中…';
                        decodeText.classList.remove('placeholder');
                        
                        // 创建图片元素
                        const img = new Image();
                        img.crossOrigin = 'Anonymous'; // 避免污染 canvas
                        const url = URL.createObjectURL(file);
                        
                        await new Promise((resolve, reject) => {
                            img.onload = resolve;
                            img.onerror = () => reject(new Error('图片加载失败'));
                            img.src = url;
                        });
                        
                        const result = await decodeQRCodeFromImage(img);
                        URL.revokeObjectURL(url);
                        
                        decodeText.textContent = result;
                        decodeText.classList.remove('placeholder');
                    } catch (e) {
                        decodeText.textContent = '❌ ' + e.message;
                        decodeText.classList.add('placeholder');
                    }
                }
                
                fileInput.addEventListener('change', (e) => {
                    if (e.target.files.length > 0) {
                        decodeFromFile(e.target.files[0]);
                    }
                });
                
                // 通过 URL 加载图片并解析
                loadUrlBtn.addEventListener('click', async () => {
                    const url = imageUrlInput.value.trim();
                    if (!url) {
                        alert('请输入图片 URL');
                        return;
                    }
                    try {
                        decodeText.textContent = '解析中…';
                        decodeText.classList.remove('placeholder');
                        
                        const img = new Image();
                        img.crossOrigin = 'Anonymous';
                        await new Promise((resolve, reject) => {
                            img.onload = resolve;
                            img.onerror = () => reject(new Error('图片加载失败，可能是跨域或URL无效'));
                            img.src = url;
                        });
                        
                        const result = await decodeQRCodeFromImage(img);
                        decodeText.textContent = result;
                        decodeText.classList.remove('placeholder');
                    } catch (e) {
                        decodeText.textContent = '❌ ' + e.message;
                        decodeText.classList.add('placeholder');
                    }
                });
                
                // 清除解析结果
                clearDecodeBtn.addEventListener('click', () => {
                    decodeText.textContent = '等待上传或输入图片…';
                    decodeText.classList.add('placeholder');
                    fileInput.value = '';
                    imageUrlInput.value = '';
                });
                
                // 初始生成一次
                renderQR();
            });
        })();
    </script>
</body>
</html>
