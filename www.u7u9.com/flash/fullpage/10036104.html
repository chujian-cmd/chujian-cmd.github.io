        $(function() {

            //贴片广告事件
            var adtime = 9;

            var container = $('.container');
            var isiframe = $('#flash_play_obj').length <= 0;
            var embed = isiframe ? container.find('#flash_play_iframe') : container.find('object embed');
            var object = isiframe ? container.find('#flash_play_iframe') : container.find('object');

            $('.xw-top').hide();

            var topHeight = 0;

            //window resize 事件
            var resizeEvent = function() {
                var containerheight = $(window).height() - topHeight - 90;
                container.height(containerheight).css('top', topHeight);

                var cw = container.width();
                var ch = container.height();
                var fw = embed.width();
                var fh = embed.height();

                var nw, nh, top, left
                if (fw / fh > cw / ch) {
                    nw = cw;
                    nh = nw * fh / fw;
                    left = 0;
                    top = (ch - nh) / 2;
                } else {
                    nh = ch;
                    nw = nh * fw / fh;
                    top = 0;
                    left = (cw - nw) / 2;
                }
                embed.css({
                    width: nw,
                    height: nh
                });
                object.css({
                    left: left,
                    top: top,
                    width: nw,
                    height: nh,
                    position: 'absolute'
                });

                //计算对联
                var dlleft = $('.xw-dl-left');
                var dlright = $('.xw-dl-right');
                var dlwidth = dlleft.width();
                var sep = 20;
                var cssleftright = left - dlwidth - sep;
                if (cssleftright < 50) {
                    cssleftright = 50;
                }
                //dlleft.css('left', cssleftright);
                //dlright.css('right', cssleftright);
                dlleft.css('left', 10);
                dlright.css('right', 10);

                $('.xw-dl').each(function() {
                    var height = $(this).height();
                    $(this).css('margin-top', 0 - (height / 2));
                });
            };

            //绑定esc快捷键和resize
            $(window).on('resize', resizeEvent);

            resizeEvent();

            if (isiframe) {
                embed.attr('src', embed.attr('src'));
            }

            $('.xw-dl .close').on('click', function() {
                $(this).parents('.xw-dl').hide();
            });
