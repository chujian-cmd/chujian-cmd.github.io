<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极简倒计时 · 19:00</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .countdown {
      font-size: clamp(2rem, 15vw, 8rem);
      font-weight: 400;
      letter-spacing: 0.02em;
      text-align: center;
      line-height: 1.2;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .digit {
      display: inline-block;
      position: relative;
    }
    .digit::before,
    .digit::after {
      content: attr(data-d);
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
    }
    .digit.flip::before {
      animation: flipOut 0.35s ease-in forwards;
    }
    .digit.flip::after {
      animation: flipIn 0.35s ease-out forwards;
    }
    .digit.flip::before {
      content: attr(data-p);
    }
    .digit.flip::after {
      content: attr(data-d);
    }
    @keyframes flipOut {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-0.5em) scale(0.6); }
    }
    @keyframes flipIn {
      0%   { opacity: 0; transform: translateY(0.5em) scale(0.6); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <div class="countdown" id="countdown"></div>
  <script>
    (function() {
      'use strict';
      const countdownEl = document.getElementById('countdown');
      const prev = {};

      function padTwo(num) {
        return String(num).padStart(2, '0');
      }

      function makeDigit(key, value) {
        const el = document.createElement('span');
        el.className = 'digit';
        el.dataset.d = value;
        el.dataset.p = value;
        el.textContent = value;
        if (prev[key] !== undefined && prev[key] !== value) {
          el.dataset.p = prev[key];
          el.classList.add('flip');
          el.addEventListener('animationend', function handler(e) {
            if (e.animationName === 'flipIn') {
              el.classList.remove('flip');
              el.dataset.p = value;
              el.removeEventListener('animationend', handler);
            }
          });
        }
        prev[key] = value;
        return el;
      }

      function updateCountdown() {
        const now = new Date();
        const target = new Date(now);
        target.setHours(19, 0, 0, 0);
        if (now >= target) {
          target.setDate(target.getDate() + 1);
        }
        const diffMs = target - now;
        const totalSeconds = Math.floor(diffMs / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        const h = String(hours);
        const m = padTwo(minutes);
        const s = padTwo(seconds);

        const frag = document.createDocumentFragment();
        for (let i = 0; i < h.length; i++) {
          frag.appendChild(makeDigit('h' + i, h[i]));
        }
        frag.appendChild(document.createTextNode(':'));
        frag.appendChild(makeDigit('m0', m[0]));
        frag.appendChild(makeDigit('m1', m[1]));
        frag.appendChild(document.createTextNode(':'));
        frag.appendChild(makeDigit('s0', s[0]));
        frag.appendChild(makeDigit('s1', s[1]));

        countdownEl.replaceChildren(frag);
      }

      updateCountdown();
      const intervalId = setInterval(updateCountdown, 200);
      window.addEventListener('beforeunload', function() {
        clearInterval(intervalId);
      });
    })();
  </script>
</body>
</html>
