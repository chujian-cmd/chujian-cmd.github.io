<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>倒计时 · 19:00</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0b0b;
      overflow: hidden;
      font-family: 'Avenir', 'Helvetica Neue', 'Helvetica', 'Arial', sans-serif;
      height: 100vh;
      width: 100vw;
    }
    #canvas-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #matrixCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
      z-index: 1;
      pointer-events: none;
    }
    #shapeCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
      z-index: 2;
      pointer-events: auto;
    }
    #child {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: none;
      pointer-events: none;
      text-align: center;
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 4.5vw;
      color: #ffffff;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.5), 0 0 60px rgba(255, 255, 255, 0.3);
      white-space: nowrap;
      letter-spacing: 0.15em;
      font-weight: 300;
      background: rgba(0,0,0,0.2);
      padding: 0.5em 1.2em;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    @media (max-width: 600px) {
      #child { font-size: 8vw; white-space: normal; width: 80%; padding: 0.4em 0.8em; }
    }
    .canvas { display: block; }
    .overlay, .tabs, .tabs-labels, .tabs-panels { display: none; }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="matrixCanvas"></canvas>
    <canvas id="shapeCanvas" class="canvas"></canvas>
  </div>

  <div id="child">✨19:00 到了✨</div>

  <script>
    var S = {
      init: function () {
        S.Drawing.init('#shapeCanvas');
        document.body.classList.add('body--ready');
        S.Drawing.loop(function () {
          S.Shape.render();
        });
        startCountdown();
      }
    };

    S.Drawing = (function () {
      var canvas, context, renderFn,
          requestFrame = window.requestAnimationFrame ||
                         window.webkitRequestAnimationFrame ||
                         function(cb){ window.setTimeout(cb, 1000/60); };

      return {
        init: function (el) {
          canvas = document.querySelector(el);
          context = canvas.getContext('2d');
          this.adjustCanvas();
          window.addEventListener('resize', function(){ S.Drawing.adjustCanvas(); });
        },
        loop: function (fn) {
          renderFn = !renderFn ? fn : renderFn;
          this.clearFrame();
          renderFn();
          requestFrame.call(window, this.loop.bind(this));
        },
        adjustCanvas: function () {
          if (canvas) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
          }
        },
        clearFrame: function () {
          if (context) context.clearRect(0, 0, canvas.width, canvas.height);
        },
        getArea: function () { return { w: canvas.width, h: canvas.height }; },
        drawCircle: function (p, c) {
          context.fillStyle = c.render();
          context.beginPath();
          context.arc(p.x, p.y, p.z, 0, 2 * Math.PI, true);
          context.closePath();
          context.fill();
        }
      };
    })();

    S.ShapeBuilder = (function () {
      var gap = 13,
          shapeCanvas = document.createElement('canvas'),
          shapeContext = shapeCanvas.getContext('2d'),
          fontSize = 500,
          fontFamily = 'Avenir, Helvetica Neue, Helvetica, Arial, sans-serif';

      function fit() {
        shapeCanvas.width = Math.floor(window.innerWidth / gap) * gap;
        shapeCanvas.height = Math.floor(window.innerHeight / gap) * gap;
        shapeContext.fillStyle = 'red';
        shapeContext.textBaseline = 'middle';
        shapeContext.textAlign = 'center';
      }

      function processCanvas() {
        var pixels = shapeContext.getImageData(0, 0, shapeCanvas.width, shapeCanvas.height).data;
        var dots = [], x = 0, y = 0,
            fx = shapeCanvas.width, fy = shapeCanvas.height, w = 0, h = 0;
        for (var p = 0; p < pixels.length; p += (4 * gap)) {
          if (pixels[p + 3] > 0) {
            dots.push(new S.Point({ x: x, y: y }));
            w = x > w ? x : w;
            h = y > h ? y : h;
            fx = x < fx ? x : fx;
            fy = y < fy ? y : fy;
          }
          x += gap;
          if (x >= shapeCanvas.width) {
            x = 0; y += gap; p += gap * 4 * shapeCanvas.width;
          }
        }
        return { dots: dots, w: w + fx, h: h + fy };
      }

      function setFontSize(s) {
        shapeContext.font = 'bold ' + s + 'px ' + fontFamily;
      }

      function isNumber(n) { return !isNaN(parseFloat(n)) && isFinite(n); }

      function init() { fit(); window.addEventListener('resize', fit); }
      init();

      return {
        letter: function (l) {
          var s = 0;
          setFontSize(fontSize);
          s = Math.min(fontSize,
                      (shapeCanvas.width / shapeContext.measureText(l).width) * 0.8 * fontSize,
                      (shapeCanvas.height / fontSize) * (isNumber(l) ? 1 : 0.45) * fontSize);
          setFontSize(s);
          shapeContext.clearRect(0, 0, shapeCanvas.width, shapeCanvas.height);
          shapeContext.fillText(l, shapeCanvas.width / 2, shapeCanvas.height / 2);
          return processCanvas();
        }
      };
    })();

    S.Shape = (function () {
      var dots = [], width = 0, height = 0, cx = 0, cy = 0;

      function compensate() {
        var a = S.Drawing.getArea();
        cx = a.w / 2 - width / 2;
        cy = a.h / 2 - height / 2;
      }

      return {
        switchShape: function (n, fast) {
          var size, a = S.Drawing.getArea();
          width = n.w; height = n.h;
          compensate();
          if (n.dots.length > dots.length) {
            size = n.dots.length - dots.length;
            for (var d = 1; d <= size; d++) {
              dots.push(new S.Dot(a.w / 2, a.h / 2));
            }
          }
          var d = 0, i = 0;
          while (n.dots.length > 0) {
            i = Math.floor(Math.random() * n.dots.length);
            dots[d].e = fast ? 0.25 : (dots[d].s ? 0.14 : 0.11);
            if (dots[d].s) {
              dots[d].move(new S.Point({ z: Math.random()*20+10, a: Math.random(), h: 18 }));
            } else {
              dots[d].move(new S.Point({ z: Math.random()*5+5, h: fast ? 18 : 30 }));
            }
            dots[d].s = true;
            dots[d].move(new S.Point({
              x: n.dots[i].x + cx, y: n.dots[i].y + cy,
              a: 1, z: 5, h: 0
            }));
            n.dots = n.dots.slice(0, i).concat(n.dots.slice(i + 1));
            d++;
          }
          for (var i = d; i < dots.length; i++) {
            if (dots[i].s) {
              dots[i].move(new S.Point({ z: Math.random()*20+10, a: Math.random(), h: 20 }));
              dots[i].s = false;
              dots[i].e = 0.04;
              dots[i].move(new S.Point({
                x: Math.random()*a.w, y: Math.random()*a.h,
                a: 0.3, z: Math.random()*4, h: 0
              }));
            }
          }
        },
        render: function () {
          for (var d = 0; d < dots.length; d++) dots[d].render();
        }
      };
    })();

    S.Point = function (args) {
      this.x = args.x; this.y = args.y;
      this.z = args.z || 5;
      this.a = args.a || 1;
      this.h = args.h || 0;
    };
    S.Color = function (r, g, b, a) { this.r=r; this.g=g; this.b=b; this.a=a; };
    S.Color.prototype.render = function () {
      return 'rgba(' + this.r + ',' + this.g + ',' + this.b + ',' + this.a + ')';
    };

    S.Dot = function (x, y) {
      this.p = new S.Point({ x: x, y: y, z: 5, a: 1, h: 0 });
      this.e = 0.07;
      this.s = true;
      this.c = new S.Color(255, 255, 255, this.p.a);
      this.t = this.clone();
      this.q = [];
    };
    S.Dot.prototype = {
      clone: function () {
        return new S.Point({ x: this.p.x, y: this.p.y, z: this.p.z, a: this.p.a, h: this.p.h });
      },
      _draw: function () {
        this.c.a = this.p.a;
        S.Drawing.drawCircle(this.p, this.c);
      },
      _moveTowards: function (n) {
        var details = this.distanceTo(n, true),
            dx = details[0], dy = details[1], d = details[2],
            e = this.e * d;
        if (this.p.h === -1) {
          this.p.x = n.x; this.p.y = n.y;
          return true;
        }
        if (d > 1) {
          this.p.x -= ((dx / d) * e);
          this.p.y -= ((dy / d) * e);
        } else {
          if (this.p.h > 0) this.p.h--;
          else return true;
        }
        return false;
      },
      _update: function () {
        if (this._moveTowards(this.t)) {
          var p = this.q.shift();
          if (p) {
            this.t.x = p.x || this.p.x;
            this.t.y = p.y || this.p.y;
            this.t.z = p.z || this.p.z;
            this.t.a = p.a || this.p.a;
            this.p.h = p.h || 0;
          } else {
            if (this.s) {
              this.p.x -= Math.sin(Math.random() * 3.142);
              this.p.y -= Math.sin(Math.random() * 3.142);
            } else {
              this.move(new S.Point({
                x: this.p.x + (Math.random() * 50) - 25,
                y: this.p.y + (Math.random() * 50) - 25,
              }));
            }
          }
        }
        var d = this.p.a - this.t.a;
        this.p.a = Math.max(0.1, this.p.a - (d * 0.05));
        d = this.p.z - this.t.z;
        this.p.z = Math.max(1, this.p.z - (d * 0.05));
      },
      distanceTo: function (n, details) {
        var dx = this.p.x - n.x, dy = this.p.y - n.y,
            d = Math.sqrt(dx * dx + dy * dy);
        return details ? [dx, dy, d] : d;
      },
      move: function (p, avoidStatic) {
        if (!avoidStatic || (avoidStatic && this.distanceTo(p) > 1)) {
          this.q.push(p);
        }
      },
      render: function () {
        this._update();
        this._draw();
      }
    };

    // ===== 倒计时核心：只有变化的位才重新飞行 =====
    var lastText = '';
    var done = false;
    var lastDigits = null;

    function getTimeText() {
      var now = new Date();
      var target = new Date(now);
      target.setHours(19, 0, 0, 0);
      if (now >= target) target.setDate(target.getDate() + 1);
      var total = Math.floor((target - now) / 1000);
      var h = Math.floor(total / 3600);
      var m = Math.floor((total % 3600) / 60);
      var s = total % 60;
      function p(n){ return String(n).padStart(2,'0'); }
      return h + ':' + p(m) + ':' + p(s);
    }

    // 只针对变化的位生成新的目标点阵
    function switchChangedOnly(newText) {
      var width = S.Drawing.getArea().w;
      var height = S.Drawing.getArea().h;

      // 获取每一个字符的点阵（按字符位置生成 SVG / canvas 字形）
      // 用 ShapeBuilder 分别构建每个字符，然后按位置拼接
      var chars = newText.split('');
      var charShapes = chars.map(function(ch) {
        return S.ShapeBuilder.letter(ch);
      });

      // 计算总宽度和每个字符的起始 x 偏移（居中对齐）
      var totalW = 0;
      charShapes.forEach(function(sh) { totalW += sh.w; });
      var gapBetween = 20; // 字符间距
      totalW += gapBetween * (chars.length - 1);

      var startX = (width - totalW) / 2;
      var maxH = 0;
      charShapes.forEach(function(sh) { if (sh.h > maxH) maxH = sh.h; });
      var startY = (height - maxH) / 2;

      // 合并成完整的点阵
      var combinedDots = [];
      var offsetX = startX;
      charShapes.forEach(function(sh) {
        sh.dots.forEach(function(dot) {
          combinedDots.push(new S.Point({
            x: dot.x + offsetX,
            y: dot.y + startY
          }));
        });
        offsetX += sh.w + gapBetween;
      });

      // 现在需要“只移动变化的位”：把新点阵分配给已有点
      // 策略：先为每一位字符记录它的点阵，然后对比旧位与新位
      // 这里简化处理：对每个字符位置，如果字符变了，则对应的点重新飞行；否则不动

      // 由于 dots 是扁平的，我们按照字符顺序分配点
      // 先计算每个字符需要多少点
      var charPointCounts = charShapes.map(function(sh) { return sh.dots.length; });

      // 如果旧的 dots 数量不够，补充
      var totalNeeded = charPointCounts.reduce(function(a, b) { return a + b; }, 0);
      while (S.Shape.dots.length < totalNeeded) {
        S.Shape.dots.push(new S.Dot(width / 2, height / 2));
      }

      // 逐字符分配
      var dotIndex = 0;
      for (var ci = 0; ci < chars.length; ci++) {
        var oldChar = lastDigits ? lastDigits[ci] : null;
        var newChar = chars[ci];
        var count = charPointCounts[ci];

        if (oldChar === newChar) {
          // 字符没变，这些点不需要移动，直接跳过（保持原位）
          // 但要确保它们仍然处于“已就位”状态
          for (var k = 0; k < count; k++) {
            S.Shape.dots[dotIndex].s = true;
            dotIndex++;
          }
        } else {
          // 字符变了，这些点重新飞行到新位置
          for (var k = 0; k < count; k++) {
            if (dotIndex >= S.Shape.dots.length) break;
            var dot = S.Shape.dots[dotIndex];
            dot.e = 0.15;
            dot.move(new S.Point({ z: Math.random() * 15 + 8, a: Math.random(), h: 15 }));
            dot.s = true;
            dot.move(new S.Point({
              x: combinedDots[dotIndex] ? combinedDots[dotIndex].x : width/2,
              y: combinedDots[dotIndex] ? combinedDots[dotIndex].y : height/2,
              a: 1, z: 5, h: 0
            }));
            dotIndex++;
          }
        }
      }

      // 多余的点飞出屏幕
      for (var i = dotIndex; i < S.Shape.dots.length; i++) {
        if (S.Shape.dots[i].s) {
          S.Shape.dots[i].move(new S.Point({ z: Math.random()*20+10, a: Math.random(), h: 20 }));
          S.Shape.dots[i].s = false;
          S.Shape.dots[i].e = 0.04;
          S.Shape.dots[i].move(new S.Point({
            x: Math.random()*width, y: Math.random()*height,
            a: 0.3, z: Math.random()*4, h: 0
          }));
        }
      }

      lastDigits = chars;
    }

    function startCountdown() {
      (function first(){
        var text = getTimeText();
        lastText = text;
        lastDigits = text.split('');
        S.Shape.switchShape(S.ShapeBuilder.letter(text), true);
      })();

      setInterval(function () {
        if (done) return;
        var now = new Date();
        var target = new Date(now);
        target.setHours(19, 0, 0, 0);
        var diff = target - now;

        if (diff <= 0) {
          var child = document.getElementById('child');
          if (child) child.style.display = 'block';
          if (lastText !== '19:00') {
            lastText = '19:00';
            lastDigits = null;
            S.Shape.switchShape(S.ShapeBuilder.letter('19:00'), true);
          }
          done = true;
          return;
        }

        var text = getTimeText();
        if (text !== lastText) {
          lastText = text;
          switchChangedOnly(text);
        }
      }, 250);
    }

    window.addEventListener('load', function () {
      S.init();
    });

    // ===== 文字雨（灰色）=====
    (function() {
      var canvas = document.getElementById('matrixCanvas');
      if (!canvas) return;
      var ctx = canvas.getContext('2d');

      function resize() {
        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;
      }
      window.addEventListener('resize', resize);
      resize();

      var texts = '123456'.split('');
      var fontSize = 16;
      var columns = Math.floor(canvas.width / fontSize);
      var drops = [];
      for (var x = 0; x < columns; x++) drops[x] = 1;

      function drawMatrix() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#888888';
        ctx.font = fontSize + 'px arial';
        for (var i = 0; i < drops.length; i++) {
          var text = texts[Math.floor(Math.random() * texts.length)];
          ctx.fillText(text, i * fontSize, drops[i] * fontSize);
          if (drops[i] * fontSize > canvas.height || Math.random() > 0.95) drops[i] = 0;
          drops[i]++;
        }
      }

      function loopMatrix() {
        drawMatrix();
        requestAnimationFrame(loopMatrix);
      }
      loopMatrix();
    })();
  </script>
</body>
</html>
