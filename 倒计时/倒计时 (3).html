<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极简倒计时 · 19:00</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .countdown {
      display: flex;
      align-items: center;
      gap: 0.15em;
      font-size: clamp(2rem, 15vw, 8rem);
      font-weight: 300;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .group {
      display: flex;
      align-items: center;
    }
    .colon {
      display: inline-block;
      transform: translateY(-0.05em);
    }
    .digit {
      position: relative;
      display: inline-block;
      width: 0.62em;
      height: 1em;
    }
    .digit svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .digit path {
      fill: #ffffff;
      stroke: none;
      transform-origin: center;
      transition: none;
    }
    .digit.animating path {
      animation: morph 0.55s cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }
    @keyframes morph {
      0% {
        transform: scale(1) rotate(0deg) translate(0, 0);
        opacity: 1;
      }
      35% {
        transform: scale(0.35) rotate(18deg) translate(0, -0.08em);
        opacity: 0.4;
      }
      55% {
        transform: scale(0.35) rotate(-18deg) translate(0, 0.08em);
        opacity: 0.2;
      }
      75% {
        transform: scale(1.05) rotate(2deg) translate(0, 0);
        opacity: 0.9;
      }
      100% {
        transform: scale(1) rotate(0deg) translate(0, 0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="countdown" id="countdown"></div>
  <script>
    (function() {
      'use strict';

      const digitPaths = {
        '0': 'M 30 5 C 15 5 10 25 10 50 C 10 75 15 95 30 95 C 45 95 50 75 50 50 C 50 25 45 5 30 5 Z M 30 15 C 37 15 40 30 40 50 C 40 70 37 85 30 85 C 23 85 20 70 20 50 C 20 30 23 15 30 15 Z',
        '1': 'M 25 20 L 35 5 L 35 95 L 25 95 L 25 25 L 18 30 L 15 22 L 25 20 Z',
        '2': 'M 12 30 C 12 15 22 5 32 5 C 42 5 50 13 50 27 C 50 40 42 48 30 60 L 18 72 L 50 72 L 50 95 L 10 95 L 10 82 L 28 64 C 38 54 42 47 42 30 C 42 20 38 15 32 15 C 26 15 22 20 22 30 Z',
        '3': 'M 12 20 L 45 20 L 28 45 C 40 45 50 52 50 65 C 50 85 38 95 25 95 C 15 95 8 88 6 78 L 18 75 C 19 82 22 85 27 85 C 34 85 38 78 38 68 C 38 58 32 52 22 52 L 18 52 L 18 42 L 30 30 L 12 30 Z',
        '4': 'M 30 95 L 30 70 L 8 70 L 8 55 L 35 5 L 45 5 L 45 55 L 52 55 L 52 70 L 45 70 L 45 95 Z M 30 55 L 30 30 L 20 55 Z',
        '5': 'M 45 5 L 15 5 L 12 48 L 20 44 C 25 42 30 42 35 45 C 42 50 45 58 45 68 C 45 82 38 88 30 88 C 22 88 17 82 16 74 L 6 77 C 8 90 17 95 30 95 C 45 95 55 85 55 68 C 55 52 45 42 32 40 L 22 40 L 25 20 L 45 20 Z',
        '6': 'M 30 95 C 15 95 10 80 10 55 C 10 25 20 5 35 5 C 45 5 50 12 52 20 L 42 23 C 40 18 37 15 33 15 C 25 15 20 30 20 50 C 25 42 30 38 36 38 C 45 38 52 47 52 65 C 52 85 43 95 30 95 Z M 30 85 C 37 85 42 78 42 65 C 42 55 38 48 32 48 C 26 48 21 53 20 62 C 21 77 25 85 30 85 Z',
        '7': 'M 10 5 L 55 5 L 55 15 L 30 95 L 18 95 L 40 20 L 10 20 Z',
        '8': 'M 30 5 C 20 5 12 12 12 22 C 12 30 16 35 22 39 C 14 43 8 50 8 62 C 8 80 18 95 30 95 C 42 95 52 80 52 62 C 52 50 46 43 38 39 C 44 35 48 30 48 22 C 48 12 40 5 30 5 Z M 30 15 C 36 15 40 18 40 24 C 40 30 36 34 30 34 C 24 34 20 30 20 24 C 20 18 24 15 30 15 Z M 30 44 C 38 44 43 50 43 62 C 43 74 38 85 30 85 C 22 85 17 74 17 62 C 17 50 22 44 30 44 Z',
        '9': 'M 30 5 C 45 5 50 20 50 45 C 50 75 40 95 25 95 C 15 95 10 88 8 80 L 18 77 C 20 82 23 85 27 85 C 35 85 40 70 40 50 C 35 58 30 62 24 62 C 15 62 8 53 8 35 C 8 15 17 5 30 5 Z M 30 15 C 23 15 18 22 18 35 C 18 45 22 52 28 52 C 34 52 39 47 40 38 C 39 23 35 15 30 15 Z'
      };

      const prev = {};
      const countdownEl = document.getElementById('countdown');

      function makeDigit(key, value) {
        const wrap = document.createElement('span');
        wrap.className = 'digit';
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 60 100');
        svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', digitPaths[value]);
        svg.appendChild(path);
        wrap.appendChild(svg);

        if (prev[key] !== undefined && prev[key] !== value) {
          wrap.classList.add('animating');
          wrap.addEventListener('animationend', function handler() {
            wrap.classList.remove('animating');
            wrap.removeEventListener('animationend', handler);
          });
        }
        prev[key] = value;
        return wrap;
      }

      function makeColon() {
        const span = document.createElement('span');
        span.className = 'colon';
        span.textContent = ':';
        return span;
      }

      function updateCountdown() {
        const now = new Date();
        const target = new Date(now);
        target.setHours(19, 0, 0, 0);
        if (now >= target) target.setDate(target.getDate() + 1);

        const totalSeconds = Math.floor((target - now) / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        const h = String(hours);
        const m = String(minutes).padStart(2, '0');
        const s = String(seconds).padStart(2, '0');

        const frag = document.createDocumentFragment();
        for (let i = 0; i < h.length; i++) frag.appendChild(makeDigit('h' + i, h[i]));
        frag.appendChild(makeColon());
        frag.appendChild(makeDigit('m0', m[0]));
        frag.appendChild(makeDigit('m1', m[1]));
        frag.appendChild(makeColon());
        frag.appendChild(makeDigit('s0', s[0]));
        frag.appendChild(makeDigit('s1', s[1]));

        countdownEl.replaceChildren(frag);
      }

      updateCountdown();
      const intervalId = setInterval(updateCountdown, 200);
      window.addEventListener('beforeunload', () => clearInterval(intervalId));
    })();
  </script>
</body>
</html>
