<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>伸缩箭头·指向手指</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0b0e14;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            touch-action: none;
            overflow: hidden;
            position: relative;
        }

        /* 箭头容器 */
        .arrow-field {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* 手指光标图层 */
        .hand-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* 手指光标 */
        .finger {
            position: absolute;
            width: 48px;
            height: 48px;
            transform: translate(-10%, -10%) rotate(-15deg);
            filter: drop-shadow(0 0 8px rgba(255, 240, 180, 0.9));
            will-change: left, top;
        }

        .finger svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 箭头基础样式 —— 定位中心在基准点 */
        .arrow {
            position: absolute;
            width: 26px;
            height: 26px;
            top: 0;
            left: 0;
            opacity: 0.95;
            will-change: transform, left, top;
            transform-origin: center center;
            pointer-events: none;
            filter: drop-shadow(0 0 5px rgba(120, 180, 255, 0.55));
            /* 注意: 旋转和缩放都通过 transform 动态设置 */
        }

        .arrow svg {
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .arrow path {
            fill: #d0e2ff;
            stroke: rgba(255, 255, 255, 0.65);
            stroke-width: 1.2;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        /* 背景光晕 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(40, 60, 120, 0.18) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .finger svg circle {
            filter: drop-shadow(0 0 6px #ffd966);
        }
    </style>
</head>
<body>
    <div class="arrow-field" id="arrowField"></div>

    <div class="hand-cursor" id="handCursor">
        <div class="finger" id="finger">
            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 6 L22 2 L30 10 L26 14 L32 20 L28 24 L22 18 L16 24 L12 20 L18 14 L12 8 L16 4 L18 6 Z" 
                      fill="#FFE9B0" stroke="#FFB347" stroke-width="1.2" stroke-linejoin="round"/>
                <circle cx="20" cy="14" r="2.5" fill="#FFB347" opacity="0.7"/>
                <circle cx="18" cy="10" r="1.5" fill="white" opacity="0.8"/>
                <path d="M30 6 L34 2 L38 6 L34 10 L30 6 Z" fill="#FFD966" stroke="#FFA500" stroke-width="0.8"/>
            </svg>
        </div>
    </div>

    <script>
        (function() {
            // ---------- 配置 ----------
            const COLS = 13;          // 水平箭头数
            const ROWS = 9;           // 垂直箭头数
            const MIN_GAP = 55;
            const MAX_GAP = 95;

            // 伸缩动画配置
            const SCALE_BASE = 0.65;      // 最小缩放 (收缩)
            const SCALE_PEAK = 1.35;      // 最大缩放 (伸展)
            const PULSE_SPEED = 0.0028;   // 基础脉动速度 (每毫秒弧度增量 ≈ 0.0028)
            const WAVE_AMPLITUDE = 1.6;   // 波动相位差幅度 (让不同箭头不同步)

            // 全局变量
            const arrowField = document.getElementById('arrowField');
            const finger = document.getElementById('finger');
            let arrows = [];          // 存储箭头对象 { el, baseX, baseY, phaseOffset }

            let fingerX = window.innerWidth / 2;
            let fingerY = window.innerHeight / 2;

            let animationFrame = null;
            let lastTimestamp = 0;

            // ---------- 重建所有箭头 (网格) ----------
            function buildArrows() {
                arrowField.innerHTML = '';
                arrows = [];

                const winW = window.innerWidth;
                const winH = window.innerHeight;

                const gapX = Math.min(MAX_GAP, Math.max(MIN_GAP, winW / (COLS + 1)));
                const gapY = Math.min(MAX_GAP, Math.max(MIN_GAP, winH / (ROWS + 1)));

                const totalW = (COLS - 1) * gapX;
                const totalH = (ROWS - 1) * gapY;

                const startX = (winW - totalW) / 2;
                const startY = (winH - totalH) / 2;

                // 创建箭头
                for (let row = 0; row < ROWS; row++) {
                    for (let col = 0; col < COLS; col++) {
                        const baseX = startX + col * gapX;
                        const baseY = startY + row * gapY;

                        const arrowEl = document.createElement('div');
                        arrowEl.className = 'arrow';
                        arrowEl.innerHTML = `
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M16 4 L22 12 L16 20 L16 15 L5 15 L5 9 L16 9 L16 4 Z" 
                                      fill="#b8d4ff" stroke="rgba(255,255,255,0.7)" stroke-width="1.2"/>
                                <circle cx="6" cy="12" r="2.2" fill="#ffffff" opacity="0.5"/>
                            </svg>
                        `;

                        // 位置: 中心点设置到 (baseX, baseY)，通过 transform 的 translate(-50%, -50%) 配合。
                        // 这里先设置 left/top = baseX, baseY，而 transform 将在动画循环中完全控制(包含 translate + rotate + scale)
                        // 为了动画平滑，我们直接使用 left/top 为基准坐标，然后用 transform: translate(-50%, -50%) rotate scale。
                        arrowEl.style.left = baseX + 'px';
                        arrowEl.style.top = baseY + 'px';

                        // 为每个箭头生成一个随机相位偏移 (但保持规律性: 基于行列计算固定的相位，看起来更有序)
                        // 使用 (row * 2.3 + col * 1.7) % 6.28 这样的伪随机但确定性的相位
                        const phaseOffset = (row * 0.9 + col * 1.3) % (Math.PI * 2);

                        arrowField.appendChild(arrowEl);
                        arrows.push({
                            el: arrowEl,
                            baseX: baseX,
                            baseY: baseY,
                            phaseOffset: phaseOffset
                        });
                    }
                }
            }

            // ---------- 动画循环: 更新每个箭头的旋转 + 伸缩 ----------
            function animateArrows(timestamp) {
                if (!lastTimestamp) lastTimestamp = timestamp;
                // 计算时间增量（毫秒），并累积成一个连续的时间 (用于脉动)
                // 为了简单，直接使用 timestamp 来控制相位，避免累积误差。
                // 但 timestamp 是相对页面加载的时间，可以直接使用。
                const time = timestamp || performance.now();

                // 全局脉动基准 (使用正弦波)
                // 频率: 约 1.4 秒一个周期 -> 2*PI / 1400 ≈ 0.0045
                const globalPulse = Math.sin(time * PULSE_SPEED * 2.0);  // 范围[-1, 1]

                for (let i = 0; i < arrows.length; i++) {
                    const arrow = arrows[i];
                    const el = arrow.el;
                    const baseX = arrow.baseX;
                    const baseY = arrow.baseY;

                    // 计算指向手指的旋转角
                    const dx = fingerX - baseX;
                    const dy = fingerY - baseY;
                    const angleRad = Math.atan2(dy, dx);
                    const angleDeg = angleRad * 180 / Math.PI;

                    // 每个箭头的独立相位，形成波浪式的伸缩效果
                    // 使用 phaseOffset 加上时间偏移，让每个箭头在不同时刻达到最大/最小
                    const individualPhase = time * PULSE_SPEED + arrow.phaseOffset;
                    // 再乘以一个稍快的系数，伸缩更明显，同时保留波浪感
                    const pulseSin = Math.sin(individualPhase * 1.8 + globalPulse * 0.4); // 范围[-1,1]

                    // 映射到 [SCALE_BASE, SCALE_PEAK]
                    const scale = SCALE_BASE + (SCALE_PEAK - SCALE_BASE) * (pulseSin * 0.5 + 0.5);

                    // 关键：将 left/top 固定为 baseX/baseY，然后通过 transform 的 translate 将自身中心对准到坐标点。
                    // 同时应用旋转和缩放。
                    // 注意：旋转和缩放中心都是元素中心，配合 translate(-50%, -50%) 可保证中心在 (baseX, baseY)。
                    el.style.transform = `translate(-50%, -50%) rotate(${angleDeg}deg) scale(${scale})`;
                }

                animationFrame = requestAnimationFrame(animateArrows);
            }

            // ---------- 更新手指位置 ----------
            function setFingerPosition(x, y) {
                const margin = 20;
                fingerX = Math.min(Math.max(x, margin), window.innerWidth - margin);
                fingerY = Math.min(Math.max(y, margin), window.innerHeight - margin);

                // 更新手指元素的位置
                finger.style.left = fingerX + 'px';
                finger.style.top = fingerY + 'px';
                // 手指已经带有初始的 transform，不需要额外改动
            }

            // ---------- 事件处理 ----------
            function handleMove(e) {
                e.preventDefault();
                let clientX, clientY;

                if (e.touches) {
                    if (e.touches.length > 0) {
                        clientX = e.touches[0].clientX;
                        clientY = e.touches[0].clientY;
                    } else {
                        return;
                    }
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }

                setFingerPosition(clientX, clientY);
                // 注意：旋转和伸缩将在动画循环里更新，无需额外调用。
            }

            function preventDefaults(e) {
                e.preventDefault();
            }

            // ---------- 窗口大小改变 ----------
            function handleResize() {
                // 重新计算网格并重建箭头
                // 注意：需要保留手指位置，并且新箭头对象拥有新的 baseX/baseY。
                const oldFingerX = fingerX;
                const oldFingerY = fingerY;
                buildArrows();
                // 恢复手指位置（可能因为屏幕大小改变，需要重新约束）
                setFingerPosition(oldFingerX, oldFingerY);
                // 动画循环会立即使用新的箭头数组，无需额外操作。
            }

            // ---------- 启动动画 ----------
            function startAnimation() {
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                }
                lastTimestamp = 0;
                animationFrame = requestAnimationFrame(animateArrows);
            }

            // ---------- 初始化 ----------
            function init() {
                fingerX = window.innerWidth / 2;
                fingerY = window.innerHeight / 2;

                buildArrows();

                finger.style.left = fingerX + 'px';
                finger.style.top = fingerY + 'px';

                // 启动动画循环 (箭头旋转 + 伸缩)
                startAnimation();

                // 事件绑定
                window.addEventListener('mousemove', handleMove, { passive: false });
                window.addEventListener('touchmove', handleMove, { passive: false });
                window.addEventListener('touchstart', handleMove, { passive: false });
                window.addEventListener('touchstart', preventDefaults, { passive: false });
                window.addEventListener('touchmove', preventDefaults, { passive: false });
                window.addEventListener('resize', handleResize);

                // 页面隐藏时暂停动画以节省资源 (可选)
                document.addEventListener('visibilitychange', function() {
                    if (document.hidden) {
                        if (animationFrame) {
                            cancelAnimationFrame(animationFrame);
                            animationFrame = null;
                        }
                    } else {
                        if (!animationFrame) {
                            startAnimation();
                        }
                    }
                });
            }

            // 启动
            window.addEventListener('load', init);
            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                setTimeout(init, 0);
            }
        })();
    </script>
</body>
</html>
