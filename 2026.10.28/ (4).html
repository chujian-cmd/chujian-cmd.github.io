<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>箭头指手</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
  body{background:#0b0e14;overflow:hidden;touch-action:none;height:100vh}
  .arrow{position:absolute;transform-origin:0 50%;pointer-events:none;transition:transform .12s linear}
  .arrow svg{display:block;width:22px;height:22px}
  .finger{position:fixed;width:40px;height:40px;pointer-events:none;z-index:9;transform:translate(-6px,-6px);filter:drop-shadow(0 0 6px #ffd966)}
</style>
</head>
<body>
<div id="field"></div>
<div class="finger" id="finger">
  <svg viewBox="0 0 40 40"><path d="M18 6 L22 2 L30 10 L26 14 L32 20 L28 24 L22 18 L16 24 L12 20 L18 14 L12 8 L16 4Z" fill="#FFE9B0" stroke="#FFB347" stroke-width="1.2"/><circle cx="18" cy="10" r="1.5" fill="#fff" opacity=".8"/></svg>
</div>
<script>
(function(){
  var COLS=11,ROWS=8;
  var field=document.getElementById('field'),finger=document.getElementById('finger');
  var arrows=[],fx=innerWidth/2,fy=innerHeight/2;
  var svgStr='<svg viewBox="0 0 24 24"><path d="M16 4 L22 12 L16 20 L16 15 L5 15 L5 9 L16 9Z" fill="#d0e2ff" stroke="#fff" stroke-width="1.2"/></svg>';

  function build(){
    field.innerHTML='';arrows=[];
    var gapX=innerWidth/(COLS+1),gapY=innerHeight/(ROWS+1);
    for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
      var d=document.createElement('div');
      d.className='arrow';d.innerHTML=svgStr;
      var bx=gapX*(c+1),by=gapY*(r+1);
      d.dataset.bx=bx;d.dataset.by=by;
      d.style.left=(bx-11)+'px';d.style.top=(by-11)+'px';
      field.appendChild(d);arrows.push(d);
    }
  }

  function tick(){
    for(var i=0;i<arrows.length;i++){
      var a=arrows[i],bx=+a.dataset.bx,by=+a.dataset.by;
      var dx=fx-bx,dy=fy-by,dist=Math.sqrt(dx*dx+dy*dy)||1;
      var ang=Math.atan2(dy,dx)*180/Math.PI;
      // 拉长: 距离越远越长，越近越短(最短保留1)
      var len=Math.max(1,Math.min(dist/70,3));
      // 让箭头尖端始终朝手指: 箭头默认朝右，宽度22，需要保持左端(尾部)固定，向右伸展
      a.style.transform='rotate('+ang+'deg) scaleX('+len+')';
    }
    requestAnimationFrame(tick);
  }

  function move(x,y){fx=x;fy=y;finger.style.left=x+'px';finger.style.top=y+'px';}

  addEventListener('mousemove',function(e){move(e.clientX,e.clientY)},{passive:true});
  addEventListener('touchmove',function(e){e.preventDefault();move(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
  addEventListener('touchstart',function(e){move(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
  addEventListener('resize',function(){build();move(innerWidth/2,innerHeight/2)});

  build();move(fx,fy);tick();
})();
</script>
</body>
</html>
