<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>彩色渐变线条指光点</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
  body{background:#0b0e14;overflow:hidden;touch-action:none;height:100vh}

  .arrow{
    position:absolute;width:20px;height:3px;border-radius:2px;
    /* 颜色渐变：尾端蓝 → 中间青 → 头部白 */
    background:linear-gradient(90deg, #4a7dff 0%, #56d8ff 50%, #ffffff 100%);
    transform-origin:0 50%;
    pointer-events:none;
    will-change:transform;
  }

  .dot{
    position:fixed;width:12px;height:12px;border-radius:50%;
    background:#fff;pointer-events:none;z-index:9;
    transform:translate(-50%,-50%);
    box-shadow:0 0 6px #fff,0 0 14px #8cf,0 0 26px #48f;
  }
</style>
</head>
<body>
<div id="field"></div>
<div class="dot" id="dot"></div>
<script>
(function(){
  var COLS=11,ROWS=8;
  var SPREAD=0.55;
  var field=document.getElementById('field'),dot=document.getElementById('dot');
  var arrows=[],fx=innerWidth/2,fy=innerHeight/2;

  function build(){
    field.innerHTML='';arrows=[];
    var areaW=innerWidth*SPREAD, areaH=innerHeight*SPREAD;
    var gapX=areaW/(COLS+1), gapY=areaH/(ROWS+1);
    var startX=(innerWidth-areaW)/2, startY=(innerHeight-areaH)/2;
    var frag=document.createDocumentFragment();
    for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
      var d=document.createElement('div');
      d.className='arrow';
      var bx=startX+gapX*(c+1), by=startY+gapY*(r+1);
      d.style.left=bx+'px';d.style.top=(by-1.5)+'px';
      d._bx=bx;d._by=by;d._last='';
      frag.appendChild(d);arrows.push(d);
    }
    field.appendChild(frag);
  }

  function tick(){
    for(var i=0;i<arrows.length;i++){
      var a=arrows[i],bx=a._bx,by=a._by;
      var dx=fx-bx,dy=fy-by;
      var dist=Math.sqrt(dx*dx+dy*dy)||1;
      var ang=Math.atan2(dy,dx)*180/Math.PI;
      var len=dist/70; if(len<1)len=1; else if(len>3)len=3;
      ang=Math.round(ang*2)/2;
      len=Math.round(len*10)/10;
      var t='rotate('+ang+'deg) scaleX('+len+')';
      if(t!==a._last){a.style.transform=t;a._last=t;}
    }
  }

  var pending=false;
  function schedule(){
    if(pending)return;pending=true;
    requestAnimationFrame(function(){pending=false;tick();});
  }

  function move(x,y){
    fx=x;fy=y;
    dot.style.left=x+'px';dot.style.top=y+'px';
    schedule();
  }

  addEventListener('mousemove',function(e){move(e.clientX,e.clientY)},{passive:true});
  addEventListener('touchmove',function(e){e.preventDefault();move(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
  addEventListener('touchstart',function(e){move(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
  addEventListener('resize',function(){build();move(innerWidth/2,innerHeight/2)});

  build();move(fx,fy);
})();
</script>
</body>
</html>
