<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <title>研词 · 考研背单词</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-logo">研</span>
        <div class="brand-text">
          <h1>研词</h1>
          <p>考研英语 · 词义辨析 · 真题例句 · 英美发音</p>
        </div>
      </div>

      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="study">背单词</button>
        <button class="tab" data-tab="distinct">词义辨析</button>
        <button class="tab" data-tab="exams">真题例句</button>
        <button class="tab" data-tab="quiz">自测</button>
        <button class="tab" data-tab="fav">收藏</button>
        <button class="tab" data-tab="stats">进度</button>
      </nav>

      <div class="top-actions">
        <input type="search" id="globalSearch" class="search-box" placeholder="搜索单词或释义…">
        <label class="voice-picker" title="默认发音口音">
          <select id="accentSelect">
            <option value="us">美音</option>
            <option value="uk">英音</option>
          </select>
        </label>
        <button id="darkToggle" class="icon-btn" title="切换深色模式">◐</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 背单词 -->
    <section id="view-study" class="view active">
      <div class="study-toolbar">
        <div class="filter-group">
          <label>范围</label>
          <select id="studyFilter">
            <option value="all">全部单词</option>
            <option value="unknown">不认识</option>
            <option value="fuzzy">模糊</option>
            <option value="known">已掌握</option>
            <option value="fav">我的收藏</option>
          </select>
        </div>
        <button id="coverToggle" class="btn btn-ghost">🙈 隐藏释义</button>
        <button id="shuffleBtn" class="btn btn-ghost">🔀 随机</button>
      </div>

      <div class="progress-line">
        <span id="studyProgressText">0 / 0</span>
        <div class="progress-bar"><div id="studyProgressBar" style="width:0%"></div></div>
      </div>

      <div id="cardArea" class="card-wrap"></div>
    </section>

    <!-- 词义辨析 -->
    <section id="view-distinct" class="view">
      <div class="section-head">
        <h2>词义辨析</h2>
        <p>考研阅读最爱考的易混词，点击展开查看细微差别。</p>
      </div>
      <div id="distinctList" class="distinct-list"></div>
    </section>

    <!-- 真题例句 -->
    <section id="view-exams" class="view">
      <div class="section-head">
        <h2>真题例句</h2>
        <p>例句均出自历年考研英语（一/二）真题阅读与翻译，点击「美音 / 英音」可听英美发音。</p>
      </div>
      <div id="yearChips" class="year-chips"></div>
      <div id="examList" class="exam-list"></div>
    </section>

    <!-- 自测 -->
    <section id="view-quiz" class="view">
      <div class="section-head">
        <h2>自测</h2>
        <p>三种题型：英译中、中译英、真题选词。</p>
      </div>
      <div id="quizSetup" class="quiz-setup card">
        <div class="form-row">
          <label>题型
            <select id="quizMode">
              <option value="en2zh">英译中（看英文选释义）</option>
              <option value="zh2en">中译英（看释义选单词）</option>
              <option value="fill">真题选词（真题句子填空）</option>
            </select>
          </label>
          <label>题量
            <select id="quizCount">
              <option value="10">10 题</option>
              <option value="20">20 题</option>
              <option value="all">全部</option>
            </select>
          </label>
        </div>
        <button id="quizStart" class="btn btn-primary btn-lg">开始测验</button>
      </div>
      <div id="quizArea" class="quiz-area"></div>
    </section>

    <!-- 收藏 -->
    <section id="view-fav" class="view">
      <div class="section-head">
        <h2>我的收藏</h2>
        <p>在单词卡片上点击 ☆ 即可收藏。</p>
      </div>
      <div id="favList" class="fav-list"></div>
    </section>

    <!-- 进度 -->
    <section id="view-stats" class="view">
      <div class="section-head">
        <h2>学习进度</h2>
      </div>
      <div id="statsArea" class="stats-area"></div>
    </section>
  </main>

  <footer class="footer">
    例句来源于历年考研英语（一）真题阅读与翻译部分，仅供学习参考。发音由浏览器自带语音合成提供（Chrome / Edge 效果最佳）。
  </footer>

  <div id="toast" class="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
