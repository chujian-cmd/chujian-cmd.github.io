<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飘扬的五星红旗</title>
<style>
  body { margin: 0; overflow: hidden; background: #111; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 16px; left: 16px; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px; line-height: 1.6;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    padding: 10px 14px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15);
    pointer-events: none; user-select: none; min-width: 180px;
  }
  #hud .title { font-weight: 600; color: #ffde59; margin-bottom: 4px; font-size: 14px; }
  #hud .row { display: flex; justify-content: space-between; gap: 16px; }
  #hud .key { color: #9ad; }
  #hud .val { color: #fff; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div id="hud">
  <div class="title">🇨🇳 五星红旗</div>
  <div class="row"><span class="key">拖动</span><span class="val">旋转视角</span></div>
  <div class="row"><span class="key">滚轮</span><span class="val">缩放</span></div>
  <div class="row"><span class="key">FPS</span><span class="val" id="fps">--</span></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const hudFps = document.getElementById('fps');

// --- 场景 ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a12);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(2.5, 1.2, 4.5);
camera.lookAt(0.5, 1.4, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// --- 控制器 ---
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0.5, 1.4, 0);
controls.minDistance = 1.5;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI / 2 + 0.3;

// --- 光照（给旗杆和顶饰用）---
scene.add(new THREE.AmbientLight(0xffffff, 0.7));

const dirLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
dirLight.position.set(3, 5, 4);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024, 1024);
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 15;
dirLight.shadow.camera.left = -3;
dirLight.shadow.camera.right = 3;
dirLight.shadow.camera.top = 3;
dirLight.shadow.camera.bottom = -1;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0xaaccff, 0.4);
fillLight.position.set(-2, 1, 2);
scene.add(fillLight);

// --- 旗杆 ---
const pole = new THREE.Mesh(
  new THREE.CylinderGeometry(0.06, 0.08, 3.2, 16),
  new THREE.MeshStandardMaterial({ color: 0x8B7355, roughness: 0.6, metalness: 0.1 })
);
pole.position.y = 1.6;
pole.castShadow = true;
pole.receiveShadow = true;
scene.add(pole);

const finial = new THREE.Mesh(
  new THREE.SphereGeometry(0.1, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0xDAA520, roughness: 0.25, metalness: 0.9 })
);
finial.position.y = 3.25;
finial.castShadow = true;
scene.add(finial);

const base = new THREE.Mesh(
  new THREE.CylinderGeometry(0.25, 0.3, 0.15, 16),
  new THREE.MeshStandardMaterial({ color: 0x5a4a3a, roughness: 0.8 })
);
base.position.y = 0.075;
base.receiveShadow = true;
scene.add(base);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(8, 8),
  new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.05;
ground.receiveShadow = true;
scene.add(ground);

// =====================================================
// 国旗 —— 直接使用你提供的 SVG 作为贴图
// =====================================================
const SCALE = 0.65;
const W = 2.4 * SCALE;
const H = 1.6 * SCALE;

const poleTopY = 3.2;
const flagTopY = poleTopY - 0.12;
const flagCenterY = flagTopY - H / 2;

const flagGroup = new THREE.Group();
flagGroup.position.set(W / 2, flagCenterY, 0);
scene.add(flagGroup);

// --- 你提供的 SVG（保持原样，仅作为贴图源）---
const SVG_STRING = `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="600"><path fill="#EE1C25" d="M0 0h900v600H0"/><g transform="matrix(3 0 0 3 150 150)"><path id="a" fill="#FF0" d="m0-30 17.634 54.27-46.166-33.54h57.064l-46.166 33.54Z"/></g><use xlink:href="#a" transform="rotate(23.036 2.784 766.082)"/><use xlink:href="#a" transform="rotate(45.87 38.201 485.396)"/><use xlink:href="#a" transform="rotate(69.945 29.892 362.328)"/><use xlink:href="#a" transform="rotate(20.66 -590.66 957.955)"/></svg>`;

// 编码成 data URL
const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(SVG_STRING);

// 加载贴图
const flagTexture = new THREE.TextureLoader().load(svgUrl, () => {
  flagTexture.needsUpdate = true;
});
flagTexture.colorSpace = THREE.SRGBColorSpace;
flagTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

// --- 旗面：用带贴图的材质 ---
const redMat = new THREE.MeshBasicMaterial({
  map: flagTexture,
  side: THREE.DoubleSide,
});
const red = new THREE.Mesh(new THREE.PlaneGeometry(W, H, 80, 60), redMat);
flagGroup.add(red);

// --- 波浪函数 ---
function waveZ(x, y, t) {
  const f = Math.min(Math.max((x + W / 2) / W, 0), 1);
  const ff = f * f;
  return (
    Math.sin(x * 3.5 - t * 2.0) * 0.22 * ff +
    Math.sin(y * 2.8 - t * 1.3) * 0.11 * ff +
    Math.sin((x + y) * 2.5 - t * 1.8) * 0.055 * ff
  );
}

// --- 连接件 ---
const clipGeo = new THREE.TorusGeometry(0.05, 0.015, 8, 16);
const clipMat = new THREE.MeshStandardMaterial({ color: 0xDAA520, metalness: 0.8, roughness: 0.3 });
for (let i = 0; i < 3; i++) {
  const clip = new THREE.Mesh(clipGeo, clipMat);
  clip.position.set(0, flagTopY - (i + 0.5) * (H / 3), 0);
  clip.rotation.y = Math.PI / 2;
  clip.castShadow = true;
  scene.add(clip);
}

// --- 动画 ---
const redGeo = red.geometry;
const basePositions = redGeo.attributes.position.array.slice();
const clock = new THREE.Clock();
let frames = 0;
let fpsTimer = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();

  // 旗面波浪
  const pos = redGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const ix = i * 3;
    const x0 = basePositions[ix];
    const y0 = basePositions[ix + 1];

    pos.array[ix]     = x0;
    pos.array[ix + 1] = y0;
    pos.array[ix + 2] = waveZ(x0, y0, t);
  }
  pos.needsUpdate = true;
  redGeo.computeVertexNormals();

  // 整组轻微摆动
  flagGroup.rotation.z = Math.sin(t * 1.5) * 0.008;
  flagGroup.rotation.x = Math.sin(t * 1.1) * 0.005;

  controls.update();
  renderer.render(scene, camera);

  frames++;
  fpsTimer += dt;
  if (fpsTimer >= 0.5) {
    hudFps.textContent = Math.round(frames / fpsTimer);
    frames = 0;
    fpsTimer = 0;
  }
}

animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
