<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车笛合成器 · 纯黑白 · SVG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
            color: #000000;
        }

        .app {
            max-width: 800px;
            width: 100%;
            border: 2px solid #000;
            padding: 2rem 1.5rem 1.8rem;
            border-radius: 2rem;
            background: #fff;
            box-shadow: 0 8px 0 #000;
            transition: box-shadow 0.1s;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            text-align: center;
            border-bottom: 2px solid #000;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            word-break: break-word;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin-bottom: 2.2rem;
        }

        .car-btn {
            background: #fff;
            border: 2px solid #000;
            border-radius: 1.5rem;
            padding: 1.2rem 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            cursor: pointer;
            transition: all 0.05s ease-in-out;
            box-shadow: 0 4px 0 #000;
            font-weight: 500;
            color: #000;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .car-btn svg {
            width: 48px;
            height: 48px;
            display: block;
            stroke: #000;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .car-btn span {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            color: #000;
        }

        .car-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #000;
        }

        .car-btn:focus-visible {
            outline: 2px solid #000;
            outline-offset: 3px;
        }

        .volume-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 2px solid #000;
            padding-top: 1.8rem;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .volume-label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
        }

        .volume-label svg {
            width: 24px;
            height: 24px;
            stroke: #000;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .slider-container {
            flex: 1;
            min-width: 160px;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: #fff;
            border: 2px solid #000;
            border-radius: 10px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            background: #000;
            border: 2px solid #000;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.05s;
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #000;
            border: 2px solid #000;
            border-radius: 50%;
            cursor: pointer;
        }

        .volume-value {
            font-weight: 600;
            font-size: 0.95rem;
            min-width: 3rem;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .status-note {
            font-size: 0.75rem;
            text-align: center;
            margin-top: 1.2rem;
            opacity: 0.65;
            letter-spacing: 0.2px;
            border-top: 1px solid #ddd;
            padding-top: 1rem;
        }

        @media (max-width: 500px) {
            .app {
                padding: 1.2rem;
            }

            .car-btn svg {
                width: 36px;
                height: 36px;
            }

            .car-btn span {
                font-size: 0.75rem;
            }

            h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <h1>🚗 车笛合成器</h1>

        <div class="grid" id="carGrid">
            <!-- 轿车 -->
            <button class="car-btn" data-car="sedan" aria-label="轿车喇叭">
                <svg viewBox="0 0 24 24">
                    <path d="M5 12L7 8L17 8L19 12" />
                    <rect x="3" y="12" width="18" height="6" rx="2" />
                    <circle cx="7.5" cy="18" r="1.5" />
                    <circle cx="16.5" cy="18" r="1.5" />
                </svg>
                <span>轿车</span>
            </button>

            <!-- 卡车 -->
            <button class="car-btn" data-car="truck" aria-label="卡车喇叭">
                <svg viewBox="0 0 24 24">
                    <path d="M3 16L5 8L18 8L21 14L21 16L3 16Z" />
                    <circle cx="7" cy="19" r="2" />
                    <circle cx="17" cy="19" r="2" />
                    <path d="M12 8L12 12" />
                    <path d="M15 8L15 11" />
                </svg>
                <span>卡车</span>
            </button>

            <!-- 火车 -->
            <button class="car-btn" data-car="train" aria-label="火车鸣笛">
                <svg viewBox="0 0 24 24">
                    <rect x="4" y="8" width="16" height="10" rx="1.5" />
                    <circle cx="8" cy="18" r="1.8" />
                    <circle cx="16" cy="18" r="1.8" />
                    <path d="M8 8V6H16V8" />
                    <path d="M12 4V2" />
                    <path d="M6 12H18" />
                </svg>
                <span>火车</span>
            </button>

            <!-- 轮船 -->
            <button class="car-btn" data-car="ship" aria-label="轮船汽笛">
                <svg viewBox="0 0 24 24">
                    <path d="M3 16L5 12L19 12L21 16L3 16Z" />
                    <path d="M12 12V8" />
                    <path d="M9 8H15" />
                    <circle cx="7" cy="19" r="1.5" />
                    <circle cx="12" cy="19" r="1.5" />
                    <circle cx="17" cy="19" r="1.5" />
                </svg>
                <span>轮船</span>
            </button>

            <!-- 警车 -->
            <button class="car-btn" data-car="police" aria-label="警车警报">
                <svg viewBox="0 0 24 24">
                    <path d="M5 13L7 9L17 9L19 13" />
                    <rect x="3" y="13" width="18" height="5" rx="1.5" />
                    <circle cx="8" cy="18.5" r="1.8" />
                    <circle cx="16" cy="18.5" r="1.8" />
                    <path d="M12 3V7" />
                    <path d="M10 5L14 5" />
                </svg>
                <span>警车</span>
            </button>

            <!-- 救护车 -->
            <button class="car-btn" data-car="ambulance" aria-label="救护车警报">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="9" width="18" height="8" rx="1.5" />
                    <circle cx="7" cy="17.5" r="1.8" />
                    <circle cx="17" cy="17.5" r="1.8" />
                    <path d="M12 5V9" />
                    <path d="M10 7H14" />
                    <path d="M12 12V14" />
                </svg>
                <span>救护车</span>
            </button>
        </div>

        <div class="volume-panel">
            <div class="volume-label">
                <svg viewBox="0 0 24 24">
                    <path d="M3 10V14H7L12 19V5L7 10H3Z" />
                    <path d="M16 9C17.5 10.5 17.5 13.5 16 15" />
                    <path d="M19 6C21.5 8.5 21.5 15.5 19 18" />
                </svg>
                <span>音量</span>
            </div>
            <div class="slider-container">
                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.7">
                <span class="volume-value" id="volumeValue">70%</span>
            </div>
        </div>

        <div class="status-note">
            ⚡ 点击车辆按钮 · 基于 Web Audio API 实时合成
        </div>
    </div>

    <script>
        (function() {
            // ---------- 音频上下文 (懒初始化) ----------
            let audioCtx = null;
            let masterGain = null;

            // 当前音量 (0~1)
            let currentVolume = 0.7;

            // 初始化 AudioContext 和主音量节点
            function initAudio() {
                if (audioCtx) return;
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    masterGain = audioCtx.createGain();
                    masterGain.gain.value = currentVolume;
                    masterGain.connect(audioCtx.destination);
                } catch (e) {
                    console.warn('Web Audio API 不可用', e);
                }
            }

            // 确保音频上下文处于运行状态 (用户手势)
            async function resumeAudio() {
                if (!audioCtx) {
                    initAudio();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
            }

            // ---------- 音色合成函数 (全部使用振荡器与噪声, 纯黑白风格, 不加滤波器视觉) ----------
            // 每个函数返回一个 AudioNode 链，最终连接到 masterGain
            // 所有函数均返回一个 stop 函数用于快速释放/停止声音（但这里短促发声后自动停止）

            // 通用辅助：创建振荡器并连接包络，然后启动并自动停止
            function playTone(freq, type, duration, gainStart, gainEnd, startTime = 0.005, stopTime = null) {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc.type = type;
                osc.frequency.value = freq;

                // 包络：从 startTime 开始, 到 stopTime 或 duration 后结束
                const attack = 0.005;
                const release = 0.08;
                const holdEnd = now + (stopTime || duration) - release;

                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(gainStart, now + attack);
                gainNode.gain.setValueAtTime(gainStart, Math.min(holdEnd, now + (stopTime || duration) - release));
                gainNode.gain.linearRampToValueAtTime(gainEnd, now + (stopTime || duration));

                osc.connect(gainNode);
                gainNode.connect(masterGain);

                osc.start(now);
                osc.stop(now + (stopTime || duration) + 0.02);
                return { osc, gainNode };
            }

            // 1. 轿车 — 短促双音 "哔哔"
            function playSedan() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                // 两个短促高音
                playTone(840, 'sine', 0.18, 0.6, 0.0, 0.01, 0.09);
                playTone(840, 'sine', 0.18, 0.5, 0.0, 0.12, 0.20);
                // 加上少量二次谐波让声音更“车”
                playTone(1680, 'sine', 0.1, 0.2, 0.0, 0.02, 0.09);
            }

            // 2. 卡车 — 低沉双音 "叭叭"
            function playTruck() {
                if (!audioCtx) return;
                // 低频方波 + 少量锯齿
                playTone(220, 'square', 0.22, 0.45, 0.0, 0.01, 0.12);
                playTone(220, 'square', 0.22, 0.4, 0.0, 0.15, 0.26);
                // 加一点低频 sine 增加厚度
                playTone(110, 'sine', 0.25, 0.35, 0.0, 0.01, 0.20);
                playTone(330, 'sawtooth', 0.1, 0.15, 0.0, 0.02, 0.10);
            }

            // 3. 火车 — 长鸣，两个和谐低音
            function playTrain() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                // 长音，低沉饱满 (两振荡器微微失谐)
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc1.type = 'sine';
                osc2.type = 'sine';
                osc1.frequency.value = 180;
                osc2.frequency.value = 185; // 微失谐产生拍频

                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.5, now + 0.1);
                gainNode.gain.setValueAtTime(0.5, now + 0.7);
                gainNode.gain.linearRampToValueAtTime(0, now + 1.0);

                osc1.connect(gainNode);
                osc2.connect(gainNode);
                gainNode.connect(masterGain);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 1.05);
                osc2.stop(now + 1.05);

                // 附加一个高八度微弱谐波
                playTone(360, 'sine', 0.8, 0.15, 0.0, 0.05, 0.85);
            }

            // 4. 轮船 — 悠长低沉汽笛
            function playShip() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc1.type = 'sine';
                osc2.type = 'sine';
                osc1.frequency.value = 110;
                osc2.frequency.value = 113;

                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.55, now + 0.2);
                gainNode.gain.setValueAtTime(0.55, now + 1.2);
                gainNode.gain.linearRampToValueAtTime(0, now + 1.5);

                osc1.connect(gainNode);
                osc2.connect(gainNode);
                gainNode.connect(masterGain);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 1.55);
                osc2.stop(now + 1.55);

                // 额外加入轻微高频噪声感? 不，用另一个振荡器模拟雾笛
                playTone(220, 'sine', 1.0, 0.2, 0.0, 0.2, 1.2);
            }

            // 5. 警车 — 双音快速交替 (类似 "威呜")
            function playPolice() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                // 两个频率快速切换, 使用两个振荡器分别触发
                // 第一声高
                playTone(950, 'sine', 0.18, 0.5, 0.0, 0.01, 0.14);
                // 第二声低
                playTone(760, 'sine', 0.18, 0.5, 0.0, 0.16, 0.28);
                // 再高
                playTone(950, 'sine', 0.18, 0.5, 0.0, 0.30, 0.42);
                // 再低
                playTone(760, 'sine', 0.18, 0.5, 0.0, 0.44, 0.56);
                // 加上一点方波增加穿透力
                playTone(980, 'square', 0.1, 0.15, 0.0, 0.02, 0.12);
            }

            // 6. 救护车 — 高低起伏 "呜哇呜哇"
            function playAmbulance() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                // 使用连续变化的频率？没法直接连到frequency上(需要自动化), 这里用多个短音模拟
                // 或者用一个振荡器加频率变化
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = 'sine';

                // 频率线性上升下降
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.linearRampToValueAtTime(1200, now + 0.25);
                osc.frequency.linearRampToValueAtTime(800, now + 0.5);
                osc.frequency.linearRampToValueAtTime(1200, now + 0.75);
                osc.frequency.linearRampToValueAtTime(800, now + 1.0);

                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.5, now + 0.05);
                gainNode.gain.setValueAtTime(0.5, now + 0.9);
                gainNode.gain.linearRampToValueAtTime(0, now + 1.05);

                osc.connect(gainNode);
                gainNode.connect(masterGain);

                osc.start(now);
                osc.stop(now + 1.1);
            }

            // ---------- 音量控制 ----------
            const volumeSlider = document.getElementById('volumeSlider');
            const volumeValue = document.getElementById('volumeValue');

            function updateVolumeDisplay() {
                const val = parseFloat(volumeSlider.value);
                volumeValue.textContent = Math.round(val * 100) + '%';
                currentVolume = val;
                if (masterGain) {
                    // 平滑调整音量
                    masterGain.gain.setTargetAtTime(val, audioCtx.currentTime, 0.02);
                }
            }

            volumeSlider.addEventListener('input', (e) => {
                // 如果音频未初始化，先初始化（但可能无声，因为还没用户手势）
                // 但 slider 操作也是手势，可以初始化
                if (!audioCtx) {
                    initAudio();
                }
                updateVolumeDisplay();
            });

            // 点击滑块时也要恢复音频上下文
            volumeSlider.addEventListener('mousedown', () => {
                resumeAudio().catch(() => {});
            });

            // 初始显示音量
            updateVolumeDisplay();

            // ---------- 按钮事件绑定 ----------
            const carGrid = document.getElementById('carGrid');
            const carButtons = carGrid.querySelectorAll('.car-btn');

            // 映射函数
            const soundMap = {
                sedan: playSedan,
                truck: playTruck,
                train: playTrain,
                ship: playShip,
                police: playPolice,
                ambulance: playAmbulance,
            };

            carButtons.forEach(btn => {
                // 点击播放声音
                btn.addEventListener('click', async (e) => {
                    e.preventDefault();
                    // 恢复/初始化音频
                    await resumeAudio();
                    if (!audioCtx) {
                        alert('您的浏览器不支持 Web Audio API');
                        return;
                    }
                    const carType = btn.dataset.car;
                    const playFn = soundMap[carType];
                    if (playFn) {
                        // 每次播放前确保主音量正确（如果还没设置）
                        if (masterGain && audioCtx) {
                            masterGain.gain.setTargetAtTime(currentVolume, audioCtx.currentTime, 0.02);
                        }
                        playFn();
                    }
                });

                // 防止触摸时滚动或选中文本
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                }, { passive: false });
            });

            // 全局用户手势后恢复音频上下文 (点击任意地方)
            document.body.addEventListener('click', () => {
                resumeAudio().catch(() => {});
            }, { once: false });

            // 预加载: 有些浏览器需要用户手势后才能创建 AudioContext, 但我们已经在点击时做
            // 但滑块也需要手势, 已处理

            // 额外: 防止滑块拖动时触发其他点击
            volumeSlider.addEventListener('touchstart', (e) => {
                e.stopPropagation();
            }, { passive: true });

            // 初始化音频上下文(如果浏览器允许自动创建)，不自动播放
            window.addEventListener('load', () => {
                // 不自动创建，等待用户手势，但有些浏览器允许创建但处于suspended状态
                // 我们手动调用initAudio，让它处于挂起状态，等待手势resume
                initAudio(); // 创建但可能suspended，用户点击时resume
                // 更新主音量
                if (masterGain && audioCtx) {
                    masterGain.gain.value = currentVolume;
                }
            });

        })();
    </script>
</body>
</html>
