<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素拼图 · LaTeX (自由像素尺寸)</title>
    <style>
        /* === 玻璃质感 · 精致微调 === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Cascadia Code', monospace;
            color: #eaf6ff;
            background: radial-gradient(circle at 10% 10%, rgba(79, 172, 254, 0.45), transparent 28%),
                        radial-gradient(circle at 90% 20%, rgba(0, 242, 254, 0.35), transparent 32%),
                        linear-gradient(135deg, #050a18 0%, #081229 45%, #050c22 100%);
            background-attachment: fixed;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app {
            max-width: 880px;
            width: 100%;
        }

        /* 玻璃卡片 */
        .card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 32px;
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            padding: 24px 28px;
            margin-bottom: 20px;
            transition: box-shadow 0.2s ease;
        }

        .hero {
            text-align: center;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 30px;
            font-weight: 600;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #ffffff 20%, #a8d8ff 80%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
            padding: 0 6px;
        }

        .hero p {
            color: #9ab0cc;
            margin-top: 6px;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.2px;
            opacity: 0.8;
        }

        /* 上传区 */
        .upload-area {
            background: rgba(0, 0, 0, 0.25);
            border: 2px dashed rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 18px 14px;
            text-align: center;
            transition: 0.25s ease;
            margin-bottom: 16px;
        }

        .upload-area:hover {
            border-color: #4facfe;
            background: rgba(79, 172, 254, 0.07);
        }

        input[type="file"] {
            display: block;
            width: 100%;
            padding: 8px 0;
            color: #c8d8ea;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: inherit;
        }

        input[type="file"]::file-selector-button {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.2), rgba(0, 242, 254, 0.1));
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #eaf6ff;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 500;
            margin-right: 18px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            backdrop-filter: blur(4px);
        }

        input[type="file"]::file-selector-button:hover {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.35), rgba(0, 242, 254, 0.2));
            border-color: #4facfe;
        }

        .preview-wrap {
            display: flex;
            justify-content: center;
            margin: 8px 0 14px;
        }

        #preview {
            max-width: 160px;
            border-radius: 18px;
            border: 2px solid rgba(255, 255, 255, 0.10);
            image-rendering: pixelated;
            background: #0a0f1a;
            display: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        /* 控制区 */
        .controls-grid {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 18px 14px;
            margin: 8px 0 16px;
            background: rgba(0, 0, 0, 0.15);
            padding: 14px 18px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .size-control {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .size-control label {
            color: #b0c8dd;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .size-control input[type="number"] {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 30px;
            color: #eaf6ff;
            padding: 4px 8px;
            width: 52px;
            font-size: 0.9rem;
            text-align: center;
            font-family: inherit;
            backdrop-filter: blur(4px);
            transition: 0.2s;
        }

        .size-control input[type="number"]:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 2px rgba(79, 172, 254, 0.15);
        }

        .size-control .sep {
            color: #6a7f9a;
            opacity: 0.5;
            font-size: 1.2rem;
            padding: 0 2px;
        }

        .pixel-size-control {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            flex: 1;
            min-width: 180px;
        }

        .pixel-size-control label {
            color: #b0c8dd;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pixel-size-control input[type="range"] {
            flex: 1;
            min-width: 80px;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            outline: none;
            transition: background 0.2s;
        }

        .pixel-size-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4facfe, #00d4ff);
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            box-shadow: 0 0 12px rgba(79, 172, 254, 0.5);
            transition: 0.15s;
        }

        .pixel-size-control input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        .pixel-size-value {
            min-width: 44px;
            text-align: center;
            color: #eaf6ff;
            font-weight: 500;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.2);
            padding: 0 6px;
            border-radius: 20px;
        }

        .action-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 8px;
            margin: 12px 0 10px;
            align-items: center;
        }

        .btn {
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 40px;
            color: #eaf6ff;
            padding: 10px 22px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.04);
            transition: 0.22s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
            font-family: inherit;
            letter-spacing: 0.01em;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            border-color: rgba(79, 172, 254, 0.4);
            background: rgba(79, 172, 254, 0.12);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.25), rgba(0, 242, 254, 0.10));
            border-color: rgba(79, 172, 254, 0.25);
            font-weight: 600;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.4), rgba(0, 242, 254, 0.2));
            border-color: #4facfe;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-outline:hover {
            background: rgba(79, 172, 254, 0.08);
            border-color: #4facfe;
        }

        .textarea-box {
            background: rgba(0, 0, 0, 0.30);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 4px;
            margin-top: 8px;
            transition: border-color 0.2s;
        }

        .textarea-box:focus-within {
            border-color: rgba(79, 172, 254, 0.3);
        }

        textarea {
            width: 100%;
            height: 200px;
            background: transparent;
            color: #d4dce6;
            border: none;
            font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace;
            font-size: 12px;
            padding: 14px 18px;
            resize: vertical;
            border-radius: 16px;
            line-height: 1.7;
            outline: none;
            scroll-behavior: smooth;
        }

        textarea::selection {
            background: rgba(79, 172, 254, 0.3);
        }

        .render-area {
            margin-top: 14px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 16px;
            display: none;
            justify-content: center;
            align-items: center;
            overflow: auto;
            min-height: 80px;
        }

        .render-area.show {
            display: flex;
        }

        .render-area canvas {
            image-rendering: pixelated;
            border-radius: 14px;
            max-width: 100%;
            height: auto;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        }

        .footer-note {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #7a90aa;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            background: rgba(79, 172, 254, 0.12);
            padding: 2px 14px;
            border-radius: 30px;
            color: #c8dcee;
            border: 1px solid rgba(79, 172, 254, 0.10);
            font-weight: 500;
        }

        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(8, 16, 36, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 20px;
            padding: 12px 28px;
            color: #eaf6ff;
            font-size: 14px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.35s ease, transform 0.25s ease;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-4px);
        }

        @media (max-width: 640px) {
            body { padding: 10px; }
            .card { padding: 16px; }
            .hero h1 { font-size: 24px; }
            .controls-grid { padding: 12px 14px; gap: 12px; }
            textarea { height: 150px; font-size: 11px; }
            .btn { padding: 8px 16px; font-size: 0.8rem; }
            .footer-note { flex-direction: column; align-items: flex-start; }
            .toast { font-size: 12px; padding: 10px 16px; white-space: normal; max-width: 90%; }
            .pixel-size-control input[type="range"] { min-width: 60px; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="hero">
        <h1>◈ 像素拼图 · LaTeX</h1>
        <p>玻璃质感 · 自定义网格 · 自由尺寸 · 修复联动</p>
    </div>

    <div class="card">
        <div class="upload-area">
            <input type="file" id="imageInput" accept="image/*">
        </div>

        <div class="preview-wrap">
            <img id="preview" src="" alt="预览">
        </div>

        <!-- 控制区域紧凑组合 -->
        <div class="controls-grid">
            <div class="size-control">
                <label>宽 <input type="number" id="sizeX" value="24" min="1" max="128"></label>
                <span class="sep">×</span>
                <label>高 <input type="number" id="sizeY" value="24" min="1" max="128"></label>
                <span style="color:#7a90aa;font-size:0.75rem;opacity:0.6;">(1–128)</span>
            </div>

            <div class="pixel-size-control">
                <label>📐 像素尺寸
                    <input type="range" id="pixelSizeSlider" min="0.05" max="1.5" step="0.05" value="0.30">
                    <span class="pixel-size-value" id="pixelSizeDisplay">0.300</span>
                </label>
            </div>
        </div>

        <div class="action-bar">
            <button class="btn btn-primary" onclick="generateLaTeX()">⬆ 生成代码</button>
            <button class="btn btn-outline" onclick="copyFull()">📋 复制全部</button>
            <button class="btn btn-outline" onclick="renderCanvas()">🎨 Canvas 预览</button>
        </div>

        <div class="textarea-box">
            <textarea id="output" placeholder="LaTeX 代码将显示在这里 …" readonly></textarea>
        </div>

        <div class="render-area" id="renderArea">
            <canvas id="renderCanvas"></canvas>
        </div>

        <div class="footer-note">
            <span>单像素宽高 <span class="badge" id="pixelSizeBadge">0.300 × 0.300 em</span></span>
            <span>共 <span id="lineCount">0</span> 行</span>
            <span style="opacity:0.5;">点击文本框全选</span>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    (function() {
        'use strict';

        let imageDataCache = null;
        let allLines = [];
        let currentImageData = null;

        const fileInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        const outputArea = document.getElementById('output');
        const lineCountSpan = document.getElementById('lineCount');
        const toastEl = document.getElementById('toast');
        const sizeXInput = document.getElementById('sizeX');
        const sizeYInput = document.getElementById('sizeY');
        const pixelSizeSlider = document.getElementById('pixelSizeSlider');
        const pixelSizeDisplay = document.getElementById('pixelSizeDisplay');
        const pixelSizeBadge = document.getElementById('pixelSizeBadge');
        const renderArea = document.getElementById('renderArea');
        const renderCanvas = document.getElementById('renderCanvas');

        let toastTimer = null;

        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
        }

        function getSize() {
            let w = parseInt(sizeXInput.value) || 24;
            let h = parseInt(sizeYInput.value) || 24;
            w = Math.min(128, Math.max(1, w));
            h = Math.min(128, Math.max(1, h));
            sizeXInput.value = w;
            sizeYInput.value = h;
            return { w, h };
        }

        // 【关键修正 1】：强制读取滑块的实时值
        function getPixelSize() {
            let val = parseFloat(pixelSizeSlider.value);
            return isNaN(val) ? 0.30 : val;
        }

        function updatePixelBadge() {
            const s = getPixelSize();
            const pw = s.toFixed(3);
            const ph = s.toFixed(3);
            pixelSizeBadge.textContent = `${pw} × ${ph} em`;
            pixelSizeDisplay.textContent = s.toFixed(3);
        }

        // 【关键修正 2】：滑动时立刻更新显示，并提示重新生成
        pixelSizeSlider.addEventListener('input', function() {
            updatePixelBadge();
            if (allLines.length > 0) {
                showToast('📐 尺寸已更新，请点击 "生成代码"');
            }
        });

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    const { w, h } = getSize();
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = false; 
                    ctx.drawImage(img, 0, 0, w, h);
                    const imageData = ctx.getImageData(0, 0, w, h);
                    imageDataCache = imageData;
                    currentImageData = imageData;
                    preview.src = canvas.toDataURL();
                    preview.style.display = 'block';
                    preview.style.width = '160px';
                    preview.style.imageRendering = 'pixelated';
                    outputArea.value = '';
                    lineCountSpan.textContent = '0';
                    allLines = [];
                    renderArea.classList.remove('show');
                    showToast('🖼 图片加载成功 (' + w + '×' + h + ')');
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });

        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0').toUpperCase()).join('');
        }

        window.generateLaTeX = function() {
            if (!imageDataCache) {
                showToast('⚠️ 请先选择一张图片');
                return;
            }
            const { w, h } = getSize();
            if (imageDataCache.width !== w || imageDataCache.height !== h) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = false;
                    ctx.drawImage(img, 0, 0, w, h);
                    imageDataCache = ctx.getImageData(0, 0, w, h);
                    currentImageData = imageDataCache;
                    preview.src = canvas.toDataURL();
                    preview.style.width = '160px';
                    preview.style.imageRendering = 'pixelated';
                    doGenerate(w, h);
                };
                img.src = preview.src;
                return;
            }
            doGenerate(w, h);
        };

        function doGenerate(w, h) {
            const data = imageDataCache.data;
            
            // 【关键修正 3】：生成代码前，必须重新读取滑块尺寸
            let pixelSize = getPixelSize(); 
            
            const overlap = 0.001;
            const renderSize = pixelSize + overlap;
            const totalWidth = w * renderSize;
            const totalHeight = h * renderSize;
            const lines = [];

            lines.push('\\[\\begin{array}{l}');

            for (let row = 0; row < h; row++) {
                for (let col = 0; col < w; col++) {
                    const idx = (row * w + col) * 4;
                    const r = data[idx];
                    const g = data[idx + 1];
                    const b = data[idx + 2];
                    const a = data[idx + 3];
                    if (a < 128) continue; 
                    const hex = rgbToHex(r, g, b);
                    const x = (col * renderSize).toFixed(3);
                    const y = (row * renderSize).toFixed(3);
                    lines.push(
                        '\\rlap{\\kern{' + x + 'em}\\raisebox{' + y + 'em}{\\textcolor{' + hex + '}{\\rule{' + renderSize.toFixed(3) + 'em}{' + renderSize.toFixed(3) + 'em}}}}{}'
                    );
                }
            }
            lines.push('\\rule{' + totalWidth.toFixed(3) + 'em}{0pt}\\rule{0pt}{' + totalHeight.toFixed(3) + 'em}');
            lines.push('\\end{array}\\]');

            allLines = lines;
            outputArea.value = lines.join('\n');
            lineCountSpan.textContent = lines.length;
            renderArea.classList.remove('show');
            updatePixelBadge();
            showToast('✅ 代码已生成 (' + w + '×' + h + ', ' + lines.length + ' 行)');
        }

        window.renderCanvas = function() {
            if (!currentImageData) {
                showToast('⚠️ 请先加载图片');
                return;
            }

            const { w, h } = getSize();
            if (currentImageData.width !== w || currentImageData.height !== h) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = false;
                    ctx.drawImage(img, 0, 0, w, h);
                    currentImageData = ctx.getImageData(0, 0, w, h);
                    imageDataCache = currentImageData;
                    preview.src = canvas.toDataURL();
                    preview.style.width = '160px';
                    preview.style.imageRendering = 'pixelated';
                    renderPixelArt(w, h);
                };
                img.src = preview.src;
                return;
            }
            renderPixelArt(w, h);
        };

        function renderPixelArt(w, h) {
            const data = currentImageData.data;
            const pixelSize = Math.max(4, Math.min(16, Math.floor(160 / Math.max(w, h))));
            const canvasW = w * pixelSize;
            const canvasH = h * pixelSize;
            renderCanvas.width = canvasW;
            renderCanvas.height = canvasH;
            const ctx = renderCanvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;

            ctx.clearRect(0, 0, canvasW, canvasH);

            for (let row = 0; row < h; row++) {
                for (let col = 0; col < w; col++) {
                    const idx = (row * w + col) * 4;
                    const r = data[idx];
                    const g = data[idx + 1];
                    const b = data[idx + 2];
                    const a = data[idx + 3];
                    if (a < 128) continue;
                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    const yPos = row * pixelSize;
                    ctx.fillRect(col * pixelSize, yPos, pixelSize, pixelSize);
                }
            }

            renderArea.classList.add('show');
            showToast('🎨 预览已渲染 (' + w + '×' + h + ')');
        }

        window.copyFull = async function() {
            if (allLines.length === 0) {
                showToast('⚠️ 请先生成代码');
                return;
            }
            const fullText = allLines.join('\n');
            try {
                await navigator.clipboard.writeText(fullText);
                showToast('📋 已复制全部代码');
            } catch (err) {
                outputArea.readOnly = false;
                outputArea.value = fullText;
                outputArea.select();
                outputArea.setSelectionRange(0, fullText.length);
                document.execCommand('copy');
                outputArea.readOnly = true;
                outputArea.value = allLines.join('\n');
                showToast('📋 复制成功 (兼容模式)');
            }
        };

        outputArea.addEventListener('click', function() {
            if (this.value.length > 0) {
                this.select();
                this.setSelectionRange(0, this.value.length);
            }
        });

        outputArea.addEventListener('input', function() {
            const lines = this.value.split('\n').filter(l => l.trim() !== '').length;
            lineCountSpan.textContent = lines || 0;
        });

        function onSizeChange() {
            if (!imageDataCache) return;
            const { w, h } = getSize();
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(img, 0, 0, w, h);
                imageDataCache = ctx.getImageData(0, 0, w, h);
                currentImageData = imageDataCache;
                preview.src = canvas.toDataURL();
                preview.style.width = '160px';
                preview.style.imageRendering = 'pixelated';
                outputArea.value = '';
                allLines = [];
                lineCountSpan.textContent = '0';
                renderArea.classList.remove('show');
                showToast('📐 尺寸调整为 ' + w + '×' + h);
            };
            img.src = preview.src;
        }

        sizeXInput.addEventListener('change', onSizeChange);
        sizeYInput.addEventListener('change', onSizeChange);

        // 页面加载完成后初始化一次显示数据
        updatePixelBadge();
    })();
</script>
</body>
</html>
