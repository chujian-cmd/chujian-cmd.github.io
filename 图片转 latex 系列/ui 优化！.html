<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素拼图 · 玻璃质感</title>
    <style>
        /* === 玻璃质感 · 初见风格 === */
        :root {
            --primary: #4facfe;
            --accent: #00f2fe;
            --glass-bg: rgba(10, 15, 30, 0.85);
            --glass-card: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.14);
            --text: #eaf6ff;
            --subtext: #91a4b8;
            --btn-grad: linear-gradient(135deg, #4facfe, #00d4ff);
            --btn-grad-hover: linear-gradient(135deg, #6bb8ff, #2ad4ff);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, 'Cascadia Code', 'Consolas', monospace;
            color: var(--text);
            background:
                radial-gradient(circle at 10% 10%, rgba(79, 172, 254, 0.45), transparent 28%),
                radial-gradient(circle at 90% 20%, rgba(0, 242, 254, 0.35), transparent 32%),
                linear-gradient(135deg, #050a18 0%, #081229 45%, #050c22 100%);
            background-attachment: fixed;
            padding: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app {
            max-width: 820px;
            width: 100%;
            flex: 1;
        }

        .hero {
            text-align: center;
            margin-bottom: 24px;
        }

        .hero h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff, #a8d8ff);
            -webkit-background-clip: text;
            color: transparent;
        }

        .hero p {
            color: var(--subtext);
            margin-top: 8px;
            font-size: 14px;
        }

        .card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
            border: 1px solid var(--glass-border);
            border-radius: 26px;
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            padding: 22px 24px;
            margin-bottom: 18px;
        }

        .upload-area {
            background: rgba(0, 0, 0, 0.2);
            border: 2px dashed rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            padding: 16px 12px;
            text-align: center;
            margin-bottom: 18px;
            transition: 0.25s ease;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(79, 172, 254, 0.06);
        }

        input[type="file"] {
            display: block;
            width: 100%;
            padding: 10px 0;
            color: #c0d0e0;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: inherit;
        }

        input[type="file"]::file-selector-button {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.25), rgba(0, 242, 254, 0.15));
            border: 1px solid var(--glass-border);
            color: white;
            padding: 8px 22px;
            border-radius: 40px;
            font-weight: 500;
            margin-right: 16px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            backdrop-filter: blur(4px);
        }

        input[type="file"]::file-selector-button:hover {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.4), rgba(0, 242, 254, 0.25));
            border-color: var(--primary);
        }

        .preview-wrap {
            display: flex;
            justify-content: center;
            margin: 12px 0 16px;
        }

        #preview {
            max-width: 160px;
            border-radius: 16px;
            border: 2px solid var(--glass-border);
            image-rendering: pixelated;
            background: #0a0f1a;
            display: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .action-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 8px;
            margin: 16px 0 14px;
            align-items: center;
        }

        .btn {
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            color: #eaf6ff;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
            transition: 0.22s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
            font-family: inherit;
            letter-spacing: 0.01em;
        }

        .btn:hover {
            transform: translateY(-1px);
            border-color: var(--primary);
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.2), rgba(0, 242, 254, 0.08));
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.3), rgba(0, 242, 254, 0.15));
            border-color: rgba(79, 172, 254, 0.35);
            font-weight: 600;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.45), rgba(0, 242, 254, 0.25));
            border-color: var(--primary);
        }

        .btn-success {
            background: linear-gradient(135deg, rgba(47, 107, 74, 0.4), rgba(63, 138, 94, 0.2));
            border-color: rgba(63, 138, 94, 0.3);
        }

        .btn-success:hover {
            background: linear-gradient(135deg, rgba(47, 107, 74, 0.6), rgba(63, 138, 94, 0.35));
            border-color: #3f8a5e;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-outline:hover {
            background: rgba(79, 172, 254, 0.08);
            border-color: var(--primary);
        }

        #status {
            font-size: 0.85rem;
            color: var(--subtext);
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 16px;
            border-radius: 40px;
            display: inline-block;
            margin: 6px 0 12px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(4px);
        }

        .textarea-box {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 18px;
            border: 1px solid var(--glass-border);
            padding: 4px;
            margin-top: 6px;
        }

        textarea {
            width: 100%;
            height: 200px;
            background: transparent;
            color: #d4dce6;
            border: none;
            font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", "Courier New", monospace;
            font-size: 12px;
            padding: 14px 16px;
            resize: vertical;
            border-radius: 14px;
            line-height: 1.6;
            outline: none;
        }

        textarea:focus {
            box-shadow: inset 0 0 0 1px var(--primary);
        }

        .footer-note {
            margin-top: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--subtext);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            background: rgba(79, 172, 254, 0.15);
            padding: 2px 12px;
            border-radius: 30px;
            color: var(--text);
            border: 1px solid rgba(79, 172, 254, 0.15);
        }

        .flex-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
        }

        .copy-hint {
            color: var(--subtext);
            font-size: 0.8rem;
            margin-left: 4px;
            opacity: 0.7;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 20, 40, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 12px 24px;
            color: var(--text);
            font-size: 14px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
        }

        @media (max-width: 640px) {
            body {
                padding: 12px;
            }
            .card {
                padding: 16px;
            }
            .hero h1 {
                font-size: 22px;
            }
            textarea {
                height: 150px;
                font-size: 11px;
            }
            .btn {
                padding: 8px 14px;
                font-size: 0.8rem;
            }
            .footer-note {
                flex-direction: column;
                align-items: flex-start;
            }
            .toast {
                font-size: 12px;
                padding: 10px 16px;
                white-space: normal;
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="hero">
            <h1>◈ 像素拼图 · LaTeX</h1>
            <p>24 × 24 · 自动缩放 · 玻璃质感</p>
        </div>

        <div class="card">
            <div class="upload-area">
                <input type="file" id="imageInput" accept="image/*">
            </div>

            <div class="preview-wrap">
                <img id="preview" src="" alt="预览">
            </div>

            <div class="action-bar">
                <button class="btn btn-primary" onclick="generateLaTeX()">⬆ 生成代码</button>
                <button class="btn btn-success" onclick="downloadFile()">⬇ 下载 .txt</button>
                <button class="btn btn-outline" onclick="copyFull()">📋 复制全部</button>
            </div>

            <div id="status">🖼 选择图片 · 点击生成</div>

            <div class="textarea-box">
                <textarea id="output" placeholder="LaTeX 代码将显示在这里 …" readonly></textarea>
            </div>

            <div class="footer-note">
                <span>每像素 <span class="badge">0.727 × 0.715 em</span></span>
                <span>共 <span id="lineCount">0</span> 行</span>
                <span style="opacity:0.5;">点击文本框全选</span>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';

            const SIZE = 24;
            const PIXEL_W = 0.727;
            const PIXEL_H = 0.715;
            let imageDataCache = null;
            let allLines = [];
            let lastGenerated = false;

            const fileInput = document.getElementById('imageInput');
            const preview = document.getElementById('preview');
            const outputArea = document.getElementById('output');
            const statusEl = document.getElementById('status');
            const lineCountSpan = document.getElementById('lineCount');
            const toastEl = document.getElementById('toast');
            let toastTimer = null;

            function showToast(msg) {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
            }

            // ---------- 图片加载 ----------
            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = SIZE;
                        canvas.height = SIZE;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, SIZE, SIZE);
                        preview.src = canvas.toDataURL();
                        preview.style.display = 'block';
                        preview.style.width = '160px';
                        preview.style.imageRendering = 'pixelated';
                        imageDataCache = ctx.getImageData(0, 0, SIZE, SIZE);
                        statusEl.textContent = '✅ 图片已加载，点击 "生成代码"';
                        lastGenerated = false;
                        outputArea.value = '';
                        lineCountSpan.textContent = '0';
                        allLines = [];
                        showToast('🖼 图片加载成功');
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });

            // ---------- 工具函数 ----------
            function rgbToHex(r, g, b) {
                return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0').toUpperCase()).join('');
            }

            // ---------- 生成 LaTeX ----------
            window.generateLaTeX = function() {
                if (!imageDataCache) {
                    statusEl.textContent = '⚠️ 请先选择一张图片';
                    showToast('⚠️ 请先选择图片');
                    return;
                }
                const data = imageDataCache.data;
                const lines = [];
                let totalWidth = SIZE * PIXEL_W;
                let totalHeight = SIZE * PIXEL_H;

                lines.push('\\(\\begin{array}{l}');

                for (let row = 0; row < SIZE; row++) {
                    for (let col = 0; col < SIZE; col++) {
                        const idx = (row * SIZE + col) * 4;
                        const r = data[idx];
                        const g = data[idx + 1];
                        const b = data[idx + 2];
                        const a = data[idx + 3];
                        if (a === 0) continue;
                        const hex = rgbToHex(r, g, b);
                        const x = (col * PIXEL_W).toFixed(3);
                        const y = ((SIZE - 1 - row) * PIXEL_H).toFixed(3);
                        lines.push(
                            '\\rlap{\\kern{' + x + 'em}\\raisebox{' + y + 'em}{\\textcolor{' + hex + '}{\\rule{' + PIXEL_W + 'em}{' + PIXEL_H + 'em}}}}{}'
                        );
                    }
                }
                lines.push('\\rule{' + totalWidth.toFixed(3) + 'em}{0pt}\\rule{0pt}{' + totalHeight.toFixed(3) + 'em}');
                lines.push('\\end{array}\\)');

                allLines = lines;
                outputArea.value = lines.join('\n');
                lineCountSpan.textContent = lines.length;
                statusEl.textContent = '✅ 生成成功 · ' + lines.length + ' 行代码';
                lastGenerated = true;
                showToast('✅ 代码已生成，共 ' + lines.length + ' 行');
            };

            // ---------- 下载 (Base64) ----------
            window.downloadFile = function() {
                if (allLines.length === 0) {
                    statusEl.textContent = '⚠️ 请先生成代码';
                    showToast('⚠️ 请先生成代码');
                    return;
                }
                const content = allLines.join('\n');
                const base64 = btoa(unescape(encodeURIComponent(content)));
                const dataUri = 'data:text/plain;charset=utf-8;base64,' + base64;
                const a = document.createElement('a');
                a.href = dataUri;
                a.download = 'latex-pixel-art-24x24.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                statusEl.textContent = '⬇ 文件已下载 (Base64)';
                showToast('⬇ 下载已触发');
            };

            // ---------- 复制全部 ----------
            window.copyFull = async function() {
                if (allLines.length === 0) {
                    statusEl.textContent = '⚠️ 请先生成代码';
                    showToast('⚠️ 请先生成代码');
                    return;
                }
                const fullText = allLines.join('\n');
                try {
                    await navigator.clipboard.writeText(fullText);
                    statusEl.textContent = '📋 全部代码已复制 (' + allLines.length + ' 行)';
                    showToast('📋 已复制全部代码');
                } catch (err) {
                    outputArea.readOnly = false;
                    outputArea.value = fullText;
                    outputArea.select();
                    outputArea.setSelectionRange(0, fullText.length);
                    document.execCommand('copy');
                    outputArea.readOnly = true;
                    statusEl.textContent = '📋 已复制 (手动兼容)';
                    outputArea.value = allLines.join('\n');
                    showToast('📋 复制成功');
                }
            };

            // 点击文本框全选
            outputArea.addEventListener('click', function() {
                if (this.value.length > 0) {
                    this.select();
                    this.setSelectionRange(0, this.value.length);
                }
            });

            // 更新行数显示 (手动编辑时)
            outputArea.addEventListener('input', function() {
                const lines = this.value.split('\n').filter(l => l.trim() !== '').length;
                lineCountSpan.textContent = lines || 0;
            });

            // 初始化状态
            statusEl.textContent = '🖼 选择图片 · 点击生成';
            lineCountSpan.textContent = '0';

        })();
    </script>
</body>
</html>
