<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素拼图 · 玻璃质感</title>
    <!-- KaTeX 轻量渲染 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" integrity="sha384-wcIxkf4k558AjM3Yz3BBFQUX/zvVIY8fj2Cg7PT2EooR5WmBprQnX8XpRvhGHdE7" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js" integrity="sha384-hj5V6t7D2wAVRjYARQmNpqhq5GQ1gUo7tJZ9jL0/6gXoIT7cC+PO5gyQ7TMzrjSc" crossorigin="anonymous"></script>
    <style>
        /* === 玻璃质感 · 初见风格 === */
        :root {
            --primary: #4facfe;
            --accent: #00f2fe;
            --glass-bg: rgba(10, 15, 30, 0.85);
            --glass-card: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.14);
            --text: #eaf6ff;
            --subtext: #91a4b8;
            --btn-grad: linear-gradient(135deg, #4facfe, #00d4ff);
            --btn-grad-hover: linear-gradient(135deg, #6bb8ff, #2ad4ff);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, 'Cascadia Code', 'Consolas', monospace;
            color: var(--text);
            background:
                radial-gradient(circle at 10% 10%, rgba(79, 172, 254, 0.45), transparent 28%),
                radial-gradient(circle at 90% 20%, rgba(0, 242, 254, 0.35), transparent 32%),
                linear-gradient(135deg, #050a18 0%, #081229 45%, #050c22 100%);
            background-attachment: fixed;
            padding: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app {
            max-width: 860px;
            width: 100%;
            flex: 1;
        }

        .hero {
            text-align: center;
            margin-bottom: 24px;
        }

        .hero h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff, #a8d8ff);
            -webkit-background-clip: text;
            color: transparent;
        }

        .hero p {
            color: var(--subtext);
            margin-top: 8px;
            font-size: 14px;
        }

        .card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
            border: 1px solid var(--glass-border);
            border-radius: 26px;
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            padding: 22px 24px;
            margin-bottom: 18px;
        }

        .upload-area {
            background: rgba(0, 0, 0, 0.2);
            border: 2px dashed rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            padding: 16px 12px;
            text-align: center;
            margin-bottom: 18px;
            transition: 0.25s ease;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(79, 172, 254, 0.06);
        }

        input[type="file"] {
            display: block;
            width: 100%;
            padding: 10px 0;
            color: #c0d0e0;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: inherit;
        }

        input[type="file"]::file-selector-button {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.25), rgba(0, 242, 254, 0.15));
            border: 1px solid var(--glass-border);
            color: white;
            padding: 8px 22px;
            border-radius: 40px;
            font-weight: 500;
            margin-right: 16px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            backdrop-filter: blur(4px);
        }

        input[type="file"]::file-selector-button:hover {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.4), rgba(0, 242, 254, 0.25));
            border-color: var(--primary);
        }

        .preview-wrap {
            display: flex;
            justify-content: center;
            margin: 12px 0 16px;
        }

        #preview {
            max-width: 160px;
            border-radius: 16px;
            border: 2px solid var(--glass-border);
            image-rendering: pixelated;
            background: #0a0f1a;
            display: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .size-control {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin: 8px 0 14px;
            flex-wrap: wrap;
        }

        .size-control label {
            color: var(--subtext);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .size-control input[type="number"] {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            color: #eaf6ff;
            padding: 4px 12px;
            width: 56px;
            font-size: 0.9rem;
            text-align: center;
            font-family: inherit;
            backdrop-filter: blur(4px);
            transition: 0.2s;
        }

        .size-control input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(79, 172, 254, 0.15);
        }

        .size-control input[type="number"]::-webkit-inner-spin-button {
            opacity: 0.5;
        }

        .size-control .sep {
            color: var(--subtext);
            opacity: 0.4;
            font-size: 1.2rem;
        }

        /* 缩放滑块 */
        .scale-control {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            margin: 6px 0 12px;
            flex-wrap: wrap;
        }

        .scale-control label {
            color: var(--subtext);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .scale-control input[type="range"] {
            width: 140px;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
            outline: none;
        }

        .scale-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary);
            border: 2px solid rgba(255,255,255,0.3);
            cursor: pointer;
            box-shadow: 0 0 8px rgba(79, 172, 254, 0.4);
        }

        .scale-value {
            min-width: 36px;
            text-align: center;
            color: var(--text);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .action-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 8px;
            margin: 10px 0 14px;
            align-items: center;
        }

        .btn {
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            color: #eaf6ff;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
            transition: 0.22s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
            font-family: inherit;
            letter-spacing: 0.01em;
        }

        .btn:hover {
            transform: translateY(-1px);
            border-color: var(--primary);
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.2), rgba(0, 242, 254, 0.08));
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.3), rgba(0, 242, 254, 0.15));
            border-color: rgba(79, 172, 254, 0.35);
            font-weight: 600;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.45), rgba(0, 242, 254, 0.25));
            border-color: var(--primary);
        }

        .btn-success {
            background: linear-gradient(135deg, rgba(47, 107, 74, 0.4), rgba(63, 138, 94, 0.2));
            border-color: rgba(63, 138, 94, 0.3);
        }

        .btn-success:hover {
            background: linear-gradient(135deg, rgba(47, 107, 74, 0.6), rgba(63, 138, 94, 0.35));
            border-color: #3f8a5e;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-outline:hover {
            background: rgba(79, 172, 254, 0.08);
            border-color: var(--primary);
        }

        .btn-render {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.25), rgba(79, 172, 254, 0.15));
            border-color: rgba(168, 85, 247, 0.3);
        }

        .btn-render:hover {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.4), rgba(79, 172, 254, 0.25));
            border-color: #a855f7;
        }

        #status {
            font-size: 0.85rem;
            color: var(--subtext);
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 16px;
            border-radius: 40px;
            display: inline-block;
            margin: 6px 0 12px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(4px);
        }

        .textarea-box {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 18px;
            border: 1px solid var(--glass-border);
            padding: 4px;
            margin-top: 6px;
        }

        textarea {
            width: 100%;
            height: 200px;
            background: transparent;
            color: #d4dce6;
            border: none;
            font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", "Courier New", monospace;
            font-size: 12px;
            padding: 14px 16px;
            resize: vertical;
            border-radius: 14px;
            line-height: 1.6;
            outline: none;
        }

        textarea:focus {
            box-shadow: inset 0 0 0 1px var(--primary);
        }

        .render-area {
            margin-top: 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 18px;
            border: 1px solid var(--glass-border);
            padding: 16px;
            display: none;
            justify-content: center;
            overflow-x: auto;
        }

        .render-area.show {
            display: flex;
        }

        .render-area .katex-display {
            margin: 0;
            padding: 8px 0;
        }

        .footer-note {
            margin-top: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--subtext);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            background: rgba(79, 172, 254, 0.15);
            padding: 2px 12px;
            border-radius: 30px;
            color: var(--text);
            border: 1px solid rgba(79, 172, 254, 0.15);
        }

        .flex-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
        }

        .copy-hint {
            color: var(--subtext);
            font-size: 0.8rem;
            margin-left: 4px;
            opacity: 0.7;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 20, 40, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 12px 24px;
            color: var(--text);
            font-size: 14px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
        }

        @media (max-width: 640px) {
            body {
                padding: 12px;
            }
            .card {
                padding: 16px;
            }
            .hero h1 {
                font-size: 22px;
            }
            textarea {
                height: 150px;
                font-size: 11px;
            }
            .btn {
                padding: 8px 14px;
                font-size: 0.8rem;
            }
            .footer-note {
                flex-direction: column;
                align-items: flex-start;
            }
            .toast {
                font-size: 12px;
                padding: 10px 16px;
                white-space: normal;
                max-width: 90%;
            }
            .size-control input[type="number"] {
                width: 48px;
            }
            .scale-control input[type="range"] {
                width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="hero">
            <h1>◈ 像素拼图 · LaTeX</h1>
            <p>自定义网格 · 实时渲染 · 玻璃质感</p>
        </div>

        <div class="card">
            <div class="upload-area">
                <input type="file" id="imageInput" accept="image/*">
            </div>

            <div class="preview-wrap">
                <img id="preview" src="" alt="预览">
            </div>

            <!-- 尺寸调节 -->
            <div class="size-control">
                <label>宽 <input type="number" id="sizeX" value="24" min="4" max="64"></label>
                <span class="sep">×</span>
                <label>高 <input type="number" id="sizeY" value="24" min="4" max="64"></label>
                <span style="color:var(--subtext);font-size:0.8rem;opacity:0.6;">(4–64)</span>
            </div>

            <!-- 像素缩放滑块 (新增) -->
            <div class="scale-control">
                <label>🔍 像素缩放
                    <input type="range" id="scaleSlider" min="0.4" max="2.0" step="0.05" value="1.0">
                    <span class="scale-value" id="scaleDisplay">1.00</span>
                </label>
            </div>

            <div class="action-bar">
                <button class="btn btn-primary" onclick="generateLaTeX()">⬆ 生成代码</button>
                <button class="btn btn-success" onclick="downloadFile()">⬇ 下载 .txt</button>
                <button class="btn btn-outline" onclick="copyFull()">📋 复制全部</button>
                <button class="btn btn-render" onclick="renderPreview()">✨ 渲染预览</button>
            </div>

            <div id="status">🖼 选择图片 · 点击生成</div>

            <div class="textarea-box">
                <textarea id="output" placeholder="LaTeX 代码将显示在这里 …" readonly></textarea>
            </div>

            <!-- 渲染预览区域 -->
            <div class="render-area" id="renderArea">
                <div id="renderContent"></div>
            </div>

            <div class="footer-note">
                <span>每像素 <span class="badge" id="pixelSizeBadge">0.727 × 0.715 em</span></span>
                <span>共 <span id="lineCount">0</span> 行</span>
                <span style="opacity:0.5;">点击文本框全选</span>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';

            // 基础像素尺寸 (em)
            const BASE_W = 0.727;
            const BASE_H = 0.715;

            let imageDataCache = null;
            let allLines = [];
            let lastGenerated = false;

            const fileInput = document.getElementById('imageInput');
            const preview = document.getElementById('preview');
            const outputArea = document.getElementById('output');
            const statusEl = document.getElementById('status');
            const lineCountSpan = document.getElementById('lineCount');
            const toastEl = document.getElementById('toast');
            const sizeXInput = document.getElementById('sizeX');
            const sizeYInput = document.getElementById('sizeY');
            const scaleSlider = document.getElementById('scaleSlider');
            const scaleDisplay = document.getElementById('scaleDisplay');
            const pixelSizeBadge = document.getElementById('pixelSizeBadge');
            const renderArea = document.getElementById('renderArea');
            const renderContent = document.getElementById('renderContent');

            let toastTimer = null;

            function showToast(msg) {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
            }

            // 获取当前尺寸
            function getSize() {
                let w = parseInt(sizeXInput.value) || 24;
                let h = parseInt(sizeYInput.value) || 24;
                w = Math.min(64, Math.max(4, w));
                h = Math.min(64, Math.max(4, h));
                sizeXInput.value = w;
                sizeYInput.value = h;
                return { w, h };
            }

            // 获取缩放系数
            function getScale() {
                return parseFloat(scaleSlider.value) || 1.0;
            }

            // 更新像素大小显示
            function updatePixelBadge() {
                const s = getScale();
                const pw = (BASE_W * s).toFixed(3);
                const ph = (BASE_H * s).toFixed(3);
                pixelSizeBadge.textContent = `${pw} × ${ph} em`;
            }

            scaleSlider.addEventListener('input', function() {
                const val = parseFloat(this.value).toFixed(2);
                scaleDisplay.textContent = val;
                updatePixelBadge();
                // 如果已有生成代码，自动重新生成？为了体验，不自动刷新，用户可点击生成
                if (allLines.length > 0) {
                    statusEl.textContent = '📐 缩放已调整，点击 "生成代码" 更新';
                }
            });

            // ---------- 图片加载 ----------
            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = new Image();
                    img.onload = function() {
                        const { w, h } = getSize();
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        preview.src = canvas.toDataURL();
                        preview.style.display = 'block';
                        preview.style.width = '160px';
                        preview.style.imageRendering = 'pixelated';
                        imageDataCache = ctx.getImageData(0, 0, w, h);
                        statusEl.textContent = '✅ 图片已加载 (' + w + '×' + h + ') 点击 "生成代码"';
                        lastGenerated = false;
                        outputArea.value = '';
                        lineCountSpan.textContent = '0';
                        allLines = [];
                        renderArea.classList.remove('show');
                        renderContent.innerHTML = '';
                        showToast('🖼 图片加载成功 (' + w + '×' + h + ')');
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });

            // ---------- 工具 ----------
            function rgbToHex(r, g, b) {
                return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0').toUpperCase()).join('');
            }

            // ---------- 生成 LaTeX ----------
            window.generateLaTeX = function() {
                if (!imageDataCache) {
                    statusEl.textContent = '⚠️ 请先选择一张图片';
                    showToast('⚠️ 请先选择图片');
                    return;
                }
                const { w, h } = getSize();
                if (imageDataCache.width !== w || imageDataCache.height !== h) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        imageDataCache = ctx.getImageData(0, 0, w, h);
                        preview.src = canvas.toDataURL();
                        preview.style.width = '160px';
                        preview.style.imageRendering = 'pixelated';
                        doGenerate(w, h);
                    };
                    img.src = preview.src;
                    return;
                }
                doGenerate(w, h);
            };

            function doGenerate(w, h) {
                const data = imageDataCache.data;
                const scale = getScale();
                const pw = BASE_W * scale;
                const ph = BASE_H * scale;
                const lines = [];
                let totalWidth = w * pw;
                let totalHeight = h * ph;

                lines.push('\\(\\begin{array}{l}');

                for (let row = 0; row < h; row++) {
                    for (let col = 0; col < w; col++) {
                        const idx = (row * w + col) * 4;
                        const r = data[idx];
                        const g = data[idx + 1];
                        const b = data[idx + 2];
                        const a = data[idx + 3];
                        if (a === 0) continue;
                        const hex = rgbToHex(r, g, b);
                        const x = (col * pw).toFixed(3);
                        const y = ((h - 1 - row) * ph).toFixed(3);
                        lines.push(
                            '\\rlap{\\kern{' + x + 'em}\\raisebox{' + y + 'em}{\\textcolor{' + hex + '}{\\rule{' + pw.toFixed(3) + 'em}{' + ph.toFixed(3) + 'em}}}}{}'
                        );
                    }
                }
                lines.push('\\rule{' + totalWidth.toFixed(3) + 'em}{0pt}\\rule{0pt}{' + totalHeight.toFixed(3) + 'em}');
                lines.push('\\end{array}\\)');

                allLines = lines;
                outputArea.value = lines.join('\n');
                lineCountSpan.textContent = lines.length;
                statusEl.textContent = '✅ 生成成功 · ' + w + '×' + h + ' · ' + lines.length + ' 行';
                lastGenerated = true;
                renderArea.classList.remove('show');
                renderContent.innerHTML = '';
                updatePixelBadge();
                showToast('✅ 代码已生成 (' + w + '×' + h + ')');
            }

            // ---------- 渲染预览 (KaTeX) ----------
            window.renderPreview = function() {
                if (allLines.length === 0) {
                    statusEl.textContent = '⚠️ 请先生成代码';
                    showToast('⚠️ 请先生成代码');
                    return;
                }
                const fullCode = allLines.join('\n');
                try {
                    renderContent.innerHTML = '';
                    // 使用 KaTeX 渲染 display math
                    katex.render(fullCode, renderContent, {
                        displayMode: true,
                        throwOnError: false,
                        trust: true,
                        macros: {
                            "\\rlap": "\\rlap",
                            "\\kern": "\\kern",
                            "\\raisebox": "\\raisebox",
                            "\\textcolor": "\\textcolor",
                            "\\rule": "\\rule"
                        }
                    });
                    renderArea.classList.add('show');
                    statusEl.textContent = '✨ 渲染预览成功';
                    showToast('✨ 预览已更新');
                } catch (e) {
                    console.warn('KaTeX 渲染错误:', e);
                    renderContent.innerHTML = '<span style="color:#f87171;">⚠️ 渲染失败，请检查代码或尝试重新生成</span>';
                    renderArea.classList.add('show');
                    statusEl.textContent = '❌ 渲染失败';
                    showToast('❌ 渲染失败，查看控制台');
                }
            };

            // ---------- 下载 (Base64) ----------
            window.downloadFile = function() {
                if (allLines.length === 0) {
                    statusEl.textContent = '⚠️ 请先生成代码';
                    showToast('⚠️ 请先生成代码');
                    return;
                }
                const content = allLines.join('\n');
                const base64 = btoa(unescape(encodeURIComponent(content)));
                const dataUri = 'data:text/plain;charset=utf-8;base64,' + base64;
                const a = document.createElement('a');
                a.href = dataUri;
                a.download = 'latex-pixel-art.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                statusEl.textContent = '⬇ 文件已下载 (Base64)';
                showToast('⬇ 下载已触发');
            };

            // ---------- 复制全部 ----------
            window.copyFull = async function() {
                if (allLines.length === 0) {
                    statusEl.textContent = '⚠️ 请先生成代码';
                    showToast('⚠️ 请先生成代码');
                    return;
                }
                const fullText = allLines.join('\n');
                try {
                    await navigator.clipboard.writeText(fullText);
                    statusEl.textContent = '📋 全部代码已复制 (' + allLines.length + ' 行)';
                    showToast('📋 已复制全部代码');
                } catch (err) {
                    outputArea.readOnly = false;
                    outputArea.value = fullText;
                    outputArea.select();
                    outputArea.setSelectionRange(0, fullText.length);
                    document.execCommand('copy');
                    outputArea.readOnly = true;
                    statusEl.textContent = '📋 已复制 (手动兼容)';
                    outputArea.value = allLines.join('\n');
                    showToast('📋 复制成功');
                }
            };

            // 点击文本框全选
            outputArea.addEventListener('click', function() {
                if (this.value.length > 0) {
                    this.select();
                    this.setSelectionRange(0, this.value.length);
                }
            });

            // 更新行数显示
            outputArea.addEventListener('input', function() {
                const lines = this.value.split('\n').filter(l => l.trim() !== '').length;
                lineCountSpan.textContent = lines || 0;
            });

            // 尺寸变化重新采样
            function onSizeChange() {
                if (!imageDataCache) return;
                const { w, h } = getSize();
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    imageDataCache = ctx.getImageData(0, 0, w, h);
                    preview.src = canvas.toDataURL();
                    preview.style.width = '160px';
                    preview.style.imageRendering = 'pixelated';
                    statusEl.textContent = '✅ 尺寸已更新 (' + w + '×' + h + ') 点击生成';
                    lastGenerated = false;
                    outputArea.value = '';
                    allLines = [];
                    lineCountSpan.textContent = '0';
                    renderArea.classList.remove('show');
                    renderContent.innerHTML = '';
                    showToast('📐 尺寸调整为 ' + w + '×' + h);
                };
                img.src = preview.src;
            }

            sizeXInput.addEventListener('change', onSizeChange);
            sizeYInput.addEventListener('change', onSizeChange);

            // 初始化
            statusEl.textContent = '🖼 选择图片 · 点击生成';
            lineCountSpan.textContent = '0';
            updatePixelBadge();

        })();
    </script>
</body>
</html>
