<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Pixel TikZ Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, Roboto, sans-serif;
    }

    body {
      background: #07070a;
      min-height: 100vh;
      padding: 20px 12px;
      color: #e5e7eb;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    .card {
      background: #111117;
      border-radius: 28px;
      padding: 26px;
      border: 1px solid #22222c;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
    }

    .title-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: grid;
      place-items: center;
      font-weight: bold;
      font-size: 18px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #ffffff;
    }

    .desc {
      color: #9ca3af;
      font-size: 0.86rem;
      margin-bottom: 24px;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: #22222c;
      margin: 20px 0;
    }

    .file-row {
      display: flex;
      gap: 10px;
      align-items: center;
      background: #191923;
      border-radius: 18px;
      padding: 14px 16px;
      border: 1px solid #272733;
      margin-bottom: 16px;
    }

    .file-label {
      flex: 1;
      color: #b4b9c3;
      font-size: 0.88rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    button {
      cursor: pointer;
      border: none;
      transition: all .15s ease;
    }

    .btn-outline {
      background: #272733;
      color: #e5e7eb;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 0.86rem;
    }

    .btn-outline:hover {
      background: #323242;
    }

    .control-grid {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .control-item {
      background: #191923;
      border-radius: 18px;
      padding: 12px 16px;
      border: 1px solid #272733;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .control-item input,
    .control-item select {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 0.9rem;
      outline: none;
    }

    .preview-wrap {
      background: #0b0b10;
      border-radius: 22px;
      padding: 16px;
      border: 1px solid #22222c;
      margin-bottom: 18px;
    }

    #render-canvas {
      width: 100%;
      image-rendering: pixelated;
      border-radius: 14px;
      background: #060609;
      display: block;
    }

    .preview-info {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 0.78rem;
      color: #6b7280;
    }

    .code-panel {
      background: #0b0b10;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid #22222c;
      margin-bottom: 18px;
      display: none;
    }

    .code-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #171720;
    }

    .code-head span {
      font-size: 0.8rem;
      color: #a1a1aa;
    }

    .btn-small {
      background: #6366f1;
      color: white;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
    }

    #latex-code-area {
      padding: 14px;
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 0.72rem;
      color: #d1d5db;
      white-space: pre;
      overflow-x: auto;
      max-height: 180px;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-primary {
      background: #6366f1;
      color: white;
      padding: 14px;
      border-radius: 20px;
      font-weight: 500;
      font-size: 0.92rem;
    }

    .btn-secondary {
      background: #191923;
      color: #e5e7eb;
      padding: 14px;
      border-radius: 20px;
      font-weight: 500;
      font-size: 0.92rem;
      border: 1px solid #272733;
    }

    .status {
      text-align: center;
      margin-top: 16px;
      font-size: 0.82rem;
      color: #71717a;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="title-bar">
      <div class="logo-mark">T</div>
      <h1>Pixel TikZ Generator</h1>
    </div>
    <div class="desc">图片像素化，自动生成 LaTeX TikZ 代码</div>

    <div class="file-row">
      <span class="file-label" id="file-name-display">未选择图片</span>
      <button class="btn-outline" id="trigger-file-btn">选择文件</button>
      <input type="file" id="file-input" accept="image/*" hidden>
    </div>

    <div class="control-grid">
      <div class="control-item">
        <input type="number" id="pixel-size" value="24" min="4" max="64">
        <span style="color:#888; font-size:0.85rem;">网格</span>
      </div>
      <div class="control-item">
        <select id="output-mode">
          <option value="tikz_rgb">TikZ RGB</option>
          <option value="latex_color">命名颜色</option>
        </select>
      </div>
    </div>

    <div class="preview-wrap">
      <canvas id="render-canvas"></canvas>
      <div class="preview-info">
        <span id="pixel-count-text">24 × 24</span>
        <span id="color-count-text">0 种颜色</span>
      </div>
    </div>

    <div class="code-panel" id="code-preview-box">
      <div class="code-head">
        <span>生成代码</span>
        <button class="btn-small" id="copy-code-btn">复制</button>
      </div>
      <pre id="latex-code-area"></pre>
    </div>

    <div class="action-row">
      <button class="btn-primary" id="generate-btn">生成 TikZ</button>
      <button class="btn-secondary" id="download-btn">下载 .tex</button>
    </div>

    <div class="status" id="status-text">上传图片即可预览</div>
  </div>
</div>

<script>
  const fileInput = document.getElementById('file-input');
  const fileNameDisplay = document.getElementById('file-name-display');
  const renderCanvas = document.getElementById('render-canvas');
  const rctx = renderCanvas.getContext('2d');
  const statusText = document.getElementById('status-text');
  const pixelSizeInput = document.getElementById('pixel-size');
  const modeSelect = document.getElementById('output-mode');
  const codePreviewBox = document.getElementById('code-preview-box');
  const latexCodeArea = document.getElementById('latex-code-area');
  const pixelCountText = document.getElementById('pixel-count-text');
  const colorCountText = document.getElementById('color-count-text');

  let currentImage = null;
  let currentPixelData = null;
  let latexCodeCache = null;

  function getSafeGridSize() {
    let val = parseInt(pixelSizeInput.value, 10);
    if (isNaN(val) || val < 4) val = 4;
    if (val > 64) val = 64;
    pixelSizeInput.value = val;
    return val;
  }

  function setStatus(msg, isGood = true) {
    statusText.textContent = msg;
    statusText.style.color = isGood ? '#a1a1aa' : '#f87171';
  }

  function extractPixelData() {
    if (!currentImage) return null;
    const gridSize = getSafeGridSize();
    const offCanvas = document.createElement('canvas');
    offCanvas.width = gridSize;
    offCanvas.height = gridSize;
    const offCtx = offCanvas.getContext('2d');
    offCtx.drawImage(currentImage, 0, 0, gridSize, gridSize);
    const imageData = offCtx.getImageData(0, 0, gridSize, gridSize);
    const data = imageData.data;

    const pixels = [];
    for (let y = 0; y < gridSize; y++) {
      pixels[y] = [];
      for (let x = 0; x < gridSize; x++) {
        const idx = (y * gridSize + x) * 4;
        pixels[y][x] = { r: data[idx], g: data[idx + 1], b: data[idx + 2] };
      }
    }
    return { pixels, gridSize };
  }

  function renderPixelsToCanvas(pixelData) {
    if (!pixelData) {
      renderCanvas.width = 400;
      renderCanvas.height = 400;
      rctx.fillStyle = '#060609';
      rctx.fillRect(0, 0, 400, 400);
      rctx.fillStyle = '#444';
      rctx.font = '16px system-ui';
      rctx.textAlign = 'center';
      rctx.fillText('预览区域', 200, 200);
      pixelCountText.textContent = '--';
      colorCountText.textContent = '0 种颜色';
      return;
    }
    const { pixels, gridSize } = pixelData;
    const colorSet = new Set();
    const maxW = document.querySelector('.preview-wrap').clientWidth - 32;
    const scale = Math.floor(maxW / gridSize);
    const canvasSize = gridSize * scale;

    renderCanvas.width = canvasSize;
    renderCanvas.height = canvasSize;
    rctx.imageSmoothingEnabled = false;

    for (let y = 0; y < gridSize; y++) {
      for (let x = 0; x < gridSize; x++) {
        const { r, g, b } = pixels[y][x];
        rctx.fillStyle = `rgb(${r},${g},${b})`;
        rctx.fillRect(x * scale, y * scale, scale, scale);
        colorSet.add(`${r},${g},${b}`);
      }
    }

    pixelCountText.textContent = `${gridSize} × ${gridSize}`;
    colorCountText.textContent = `${colorSet.size} 种颜色`;
  }

  function updatePreview() {
    if (!currentImage) {
      renderPixelsToCanvas(null);
      return;
    }
    currentPixelData = extractPixelData();
    renderPixelsToCanvas(currentPixelData);
    latexCodeCache = null;
    codePreviewBox.style.display = 'none';
  }

  document.getElementById('trigger-file-btn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    fileNameDisplay.textContent = file.name;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        currentImage = img;
        updatePreview();
        setStatus('图片加载完成，点击生成 TikZ');
      };
      img.onerror = () => setStatus('图片加载失败', false);
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    fileInput.value = '';
  });

  pixelSizeInput.addEventListener('input', updatePreview);

  function buildLatexCode() {
    if (!currentPixelData) return null;
    const { pixels, gridSize } = currentPixelData;
    const mode = modeSelect.value;
    let lines = [];

    if (mode === 'tikz_rgb') {
      lines.push('\\documentclass[tikz,border=10pt]{standalone}');
      lines.push('\\begin{document}');
      lines.push('\\begin{tikzpicture}[scale=0.5]');
      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          const { r, g, b } = pixels[y][x];
          const rf = (r / 255).toFixed(3);
          const gf = (g / 255).toFixed(3);
          const bf = (b / 255).toFixed(3);
          lines.push(`  \\fill[rgb={${rf},${gf},${bf}}] (${x}, ${gridSize - 1 - y}) rectangle ++(1,1);`);
        }
      }
      lines.push('\\end{tikzpicture}');
      lines.push('\\end{document}');
    } else {
      const colorMap = new Map();
      const colorDefs = [];
      const fillCommands = [];
      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          const { r, g, b } = pixels[y][x];
          const key = `${r}_${g}_${b}`;
          if (!colorMap.has(key)) {
            colorMap.set(key, `col_${key}`);
            colorDefs.push(`\\definecolor{col_${key}}{RGB}{${r},${g},${b}}`);
          }
          fillCommands.push(`  \\fill[col_${key}] (${x}, ${gridSize - 1 - y}) rectangle ++(1,1);`);
        }
      }
      lines.push('\\documentclass[tikz,border=10pt]{standalone}');
      lines.push('\\usepackage{xcolor}');
      lines.push('\\begin{document}');
      lines.push('\\begin{tikzpicture}[scale=0.5]');
      lines.push(...colorDefs);
      lines.push(...fillCommands);
      lines.push('\\end{tikzpicture}');
      lines.push('\\end{document}');
    }
    return lines.join('\n');
  }

  function generateAndShow() {
    if (!currentImage) {
      setStatus('请先上传图片', false);
      return;
    }
    latexCodeCache = buildLatexCode();
    latexCodeArea.textContent = latexCodeCache;
    codePreviewBox.style.display = 'block';
    setStatus(`已生成 ${getSafeGridSize()}×${getSafeGridSize()} 像素代码`);
  }

  // 复制仅提取 tikzpicture 并套 \[ \]
  function copyCode() {
    if (!latexCodeCache) {
      generateAndShow();
      if (!latexCodeCache) return;
    }
    const startIdx = latexCodeCache.indexOf("\\begin{tikzpicture}");
    const endIdx = latexCodeCache.indexOf("\\end{tikzpicture}") + "\\end{tikzpicture}".length;
    const tikzBlock = latexCodeCache.slice(startIdx, endIdx);
    const finalCopy = `\[
${tikzBlock}
\]`;

    navigator.clipboard.writeText(finalCopy).then(() => setStatus('已复制到剪贴板'))
      .catch(() => {
        const ta = document.createElement('textarea');
        ta.value = finalCopy;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        setStatus('已复制到剪贴板');
      });
  }

  function downloadLatex() {
    if (!latexCodeCache) {
      if (!currentImage) {
        setStatus('请先上传图片', false);
        return;
      }
      generateAndShow();
    }
    const gs = getSafeGridSize();
    const blob = new Blob([latexCodeCache], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `pixel_${gs}x${gs}.tex`;
    a.click();
    URL.revokeObjectURL(url);
    setStatus('文件已下载');
  }

  document.getElementById('generate-btn').addEventListener('click', generateAndShow);
  document.getElementById('copy-code-btn').addEventListener('click', copyCode);
  document.getElementById('download-btn').addEventListener('click', downloadLatex);

  renderPixelsToCanvas(null);
</script>
</body>
</html>
