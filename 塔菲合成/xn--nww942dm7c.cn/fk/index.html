<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>问题反馈</title>
<style>
  :root{
    --bg:#f5f5f7;
    --card:#ffffff;
    --line:#e3e3e8;
    --line-focus:#1a1a1a;
    --t1:#1a1a1a;
    --t2:#6b6b73;
    --t3:#9a9aa2;
    --err:#d94b4b;
    --ok:#2e9e5b;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--t1);
    font-size:15px;
    line-height:1.6;
    min-height:100vh;
    padding:28px 18px calc(36px + env(safe-area-inset-bottom));
    display:flex;
    justify-content:center;
  }
  .wrap{width:100%;max-width:440px}

  h1{font-size:20px;font-weight:600;letter-spacing:0;margin-bottom:6px}
  .desc{font-size:13.5px;color:var(--t2);margin-bottom:24px}

  /* 每个字段块 */
  .field{margin-bottom:20px}
  .field > label{
    display:block;
    font-size:13.5px;
    font-weight:500;
    color:var(--t2);
    margin-bottom:8px;
  }
  .field > label .req{color:var(--err);margin-left:2px}

  input[type=text],textarea{
    display:block;
    width:100%;
    font-family:inherit;
    font-size:15px;
    color:var(--t1);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 13px;
    line-height:1.5;
    transition:border-color .15s;
  }
  textarea{
    resize:vertical;
    min-height:132px;
    line-height:1.6;
  }
  input[type=text]:focus,textarea:focus{
    outline:none;
    border-color:var(--line-focus);
  }
  input::placeholder,textarea::placeholder{color:var(--t3)}

  /* 字数 */
  .count{
    text-align:right;
    font-size:12px;
    color:var(--t3);
    margin-top:5px;
    font-variant-numeric:tabular-nums;
  }

  /* 模式选择：普通列表 */
  .modes{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .mode{
    padding:9px 15px;
    font-size:14px;
    color:var(--t2);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    cursor:pointer;
    user-select:none;
    transition:border-color .15s,color .15s,background .15s;
  }
  .mode:active{background:#f0f0f3}
  .mode.on{
    color:var(--t1);
    border-color:var(--t1);
    font-weight:500;
  }

  /* 错误提示 */
  .error{
    display:none;
    font-size:13px;
    color:var(--err);
    margin-bottom:16px;
    padding-left:2px;
  }
  .error.show{display:block}

  /* 提交按钮 */
  .submit{
    display:block;
    width:100%;
    padding:13px;
    font-family:inherit;
    font-size:15.5px;
    font-weight:500;
    color:#fff;
    background:#1a1a1a;
    border:none;
    border-radius:10px;
    cursor:pointer;
    transition:opacity .15s;
  }
  .submit:active{opacity:.82}
  .submit:disabled{
    background:#c8c8ce;
    color:#fff;
    cursor:default;
  }

  .foot{
    margin-top:24px;
    font-size:12px;
    color:var(--t3);
    text-align:center;
  }

  /* 成功提示 */
  .done{
    display:none;
    margin-bottom:20px;
    padding:13px 15px;
    font-size:14px;
    color:var(--ok);
    background:#eaf7ef;
    border:1px solid #c9e8d5;
    border-radius:10px;
  }
  .done.show{display:block}
</style>
</head>
<body>
<div class="wrap">

  <h1>问题反馈</h1>
  <p class="desc">遇到 bug 或有建议，都可以在这里告诉我们。</p>

  <div class="done" id="done">提交成功，感谢你的反馈。</div>
  <div class="error" id="error"></div>

  <form id="form" novalidate>

    <div class="field">
      <label for="device">设备名字<span class="req">*</span></label>
      <input type="text" id="device" maxlength="60" placeholder="例如：小米 14" autocomplete="off">
    </div>

    <div class="field">
      <label>问题所属模式<span class="req">*</span></label>
      <div class="modes" id="modes">
        <div class="mode" data-mode="输入法版">输入法版</div>
        <div class="mode" data-mode="无障碍版">无障碍版</div>
        <div class="mode" data-mode="自动输入">自动输入</div>
        <div class="mode" data-mode="半自动">半自动</div>
        <div class="mode" data-mode="全AI版">全AI版</div>
        <div class="mode" data-mode="其他">其他</div>
      </div>
    </div>

    <div class="field">
      <label for="content">反馈内容<span class="req">*</span></label>
      <textarea id="content" maxlength="2000" placeholder="描述一下遇到的问题，越具体越好"></textarea>
      <div class="count" id="count">0 / 2000</div>
    </div>

    <button type="submit" class="submit" id="btn">提交反馈</button>
  </form>

  <div class="foot">ZT · 反馈系统</div>
</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  var modeEls  = document.querySelectorAll('.mode');
  var picked   = '';
  var deviceEl = $('device');
  var contentEl= $('content');
  var form     = $('form');
  var btn      = $('btn');
  var errBox   = $('error');
  var doneBox  = $('done');
  var countEl  = $('count');

  /* 记住上次填写的设备名 */
  try {
    var saved = localStorage.getItem('zt_fk_device');
    if (saved) deviceEl.value = saved;
  } catch (e) {}

  /* 字数统计 */
  contentEl.addEventListener('input', function () {
    countEl.textContent = contentEl.value.length + ' / 2000';
  });

  /* 模式选择 */
  Array.prototype.forEach.call(modeEls, function (el) {
    el.addEventListener('click', function () {
      Array.prototype.forEach.call(modeEls, function (x) { x.classList.remove('on'); });
      el.classList.add('on');
      picked = el.getAttribute('data-mode');
      hideError();
    });
  });

  function showError(msg) {
    errBox.textContent = msg;
    errBox.classList.add('show');
    doneBox.classList.remove('show');
  }
  function hideError() {
    errBox.classList.remove('show');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    hideError();

    var device  = deviceEl.value.trim();
    var content = contentEl.value.trim();

    if (!device)  { showError('请填写设备名字'); deviceEl.focus(); return; }
    if (!picked)  { showError('请选择问题所属模式'); return; }
    if (!content) { showError('请填写反馈内容'); contentEl.focus(); return; }
    if (content.length < 5) { showError('内容太短了，请再多描述一点'); contentEl.focus(); return; }

    btn.disabled = true;
    btn.textContent = '提交中…';

    fetch('submit.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ device: device, mode: picked, content: content })
    })
    .then(function (r) { return r.json(); })
    .then(function (r) {
      if (r && r.success) {
        try { localStorage.setItem('zt_fk_device', device); } catch (err) {}

        doneBox.classList.add('show');
        form.reset();
        Array.prototype.forEach.call(modeEls, function (x) { x.classList.remove('on'); });
        picked = '';
        countEl.textContent = '0 / 2000';

        window.scrollTo({ top: 0, behavior: 'smooth' });
        setTimeout(function () { doneBox.classList.remove('show'); }, 4000);
      } else {
        showError((r && r.error) ? r.error : '提交失败，请重试');
      }
    })
    .catch(function () {
      showError('网络错误，请重试');
    })
    .then(function () {
      btn.disabled = false;
      btn.textContent = '提交反馈';
    });
  });
})();
</script>
</body>
</html>
