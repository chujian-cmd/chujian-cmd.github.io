<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1319">
<title>布娃娃</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#0f1319;
    touch-action:none;user-select:none;-webkit-user-select:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    position:fixed;inset:0;
  }
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  #tip{
    position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
    color:#7f8ea3;font-size:13px;pointer-events:none;
    background:rgba(0,0,0,.35);padding:6px 14px;border-radius:16px;
    white-space:nowrap;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="tip">点一下出布娃娃 · 拖它 · 它会自己站起来</div>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<script>
"use strict";
const { Engine, Composite, Bodies, Body, Constraint, Events } = Matter;

/* =========================================================
   引擎
   ========================================================= */
const engine = Engine.create();
engine.gravity.y = 1.6;
engine.positionIterations = 10;
engine.velocityIterations = 8;
engine.constraintIterations = 6;
const world = engine.world;

/* =========================================================
   场景：一片地面
   ========================================================= */
const GY = 500;
Composite.add(world, Bodies.rectangle(0, GY + 200, 8000, 400, {
  isStatic: true,
  friction: 0.9,
}));

/* =========================================================
   布娃娃
   =========================================================
   核心思路：
   1. 关节用 Matter Constraint 连接（位置约束）
   2. 每帧额外做「角度伺服」——把两侧角度往目标角度掰
      这是 Matter 原生没有的，是让布娃娃站得住的关键
   3. 倒下时关闭伺服，变成普通软关节 → 完全瘫软
   ========================================================= */
let _groupId = -1;
const ragdolls = [];

function makeRagdoll(cx, cy) {
  const gid = _groupId--;

  // 尺寸
  const headR = 14;
  const torsoW = 30, torsoH = 48;
  const armW = 10, armH = 40;
  const legW = 12, legH = 46;

  // 站立时各部件中心坐标（cy = 脚底）
  const legCY   = cy - legH / 2;
  const torsoCY = legCY - legH / 2 - torsoH / 2;
  const headCY  = torsoCY - torsoH / 2 - headR;
  const armCY   = torsoCY - torsoH / 2 + armH / 2 + 4;

  // 所有部件共用的物理参数
  const common = {
    friction: 0.9,
    frictionAir: 0.01,
    restitution: 0.02,
    density: 0.0018,
    collisionFilter: { group: gid },
  };

  const mkRect = (x, y, w, h) => {
    const b = Bodies.rectangle(x, y, w, h, common);
    b.plugin = {};
    Composite.add(world, b);
    return b;
  };
  const mkCircle = (x, y, r) => {
    const b = Bodies.circle(x, y, r, common);
    b.plugin = {};
    Composite.add(world, b);
    return b;
  };

  const head  = mkCircle(cx, headCY, headR);
  const torso = mkRect(cx, torsoCY, torsoW, torsoH);
  const armL  = mkRect(cx - torsoW / 2 - armW / 2, armCY, armW, armH);
  const armR  = mkRect(cx + torsoW / 2 + armW / 2, armCY, armW, armH);
  const legL  = mkRect(cx - legW / 2 - 1, legCY, legW, legH);
  const legR  = mkRect(cx + legW / 2 + 1, legCY, legW, legH);

  // 关节定义：位置 + 目标角度（相对角度 = B.angle - A.angle，站立时为 0）
  // servo 是角度伺服的强度（0~1）
  const joints = [
    { a: head,  b: torso, pa: { x: 0, y: headR },           pb: { x: 0, y: -torsoH / 2 },                  stiff: 0.9, servo: 0.55, servoA: 0.35 },
    { a: armL,  b: torso, pa: { x: 0, y: -armH / 2 + 2 },   pb: { x: -torsoW / 2 + 2, y: -torsoH / 2 + 6 }, stiff: 0.9, servo: 0.35, servoA: 0.25 },
    { a: armR,  b: torso, pa: { x: 0, y: -armH / 2 + 2 },   pb: { x:  torsoW / 2 - 2, y: -torsoH / 2 + 6 }, stiff: 0.9, servo: 0.35, servoA: 0.25 },
    { a: legL,  b: torso, pa: { x: 0, y: -legH / 2 },       pb: { x: -legW / 2, y: torsoH / 2 },           stiff: 0.9, servo: 0.6,  servoA: 0.5  },
    { a: legR,  b: torso, pa: { x: 0, y: -legH / 2 },       pb: { x:  legW / 2, y: torsoH / 2 },           stiff: 0.9, servo: 0.6,  servoA: 0.5  },
  ];

  const constraints = [];
  const servos = [];
  for (const j of joints) {
    const c = Constraint.create({
      bodyA: j.a, bodyB: j.b,
      pointA: j.pa, pointB: j.pb,
      length: 0,
      stiffness: j.stiff,
      damping: 0.15,
    });
    c.plugin = { baseStiffness: j.stiff };
    Composite.add(world, c);
    constraints.push(c);

    // 记录伺服参数
    servos.push({
      a: j.a, b: j.b,
      posStiff: j.servo,       // 位置回正
      angStiff: j.servoA,      // 角度回正
      // 站立时的相对角度
      targetRelAngle: 0,
    });
  }

  const group = {
    parts: { head, torso, armL, armR, legL, legR },
    constraints,
    servos,
    alive: true,
    downAt: 0,
  };
  ragdolls.push(group);
  return group;
}

/* =========================================================
   角度伺服：每帧把每个部件的角度往"直立"方向掰
   ---------------------------------------------------------
   原理：
   - 对每个部件，计算它与"目标角度"的偏差
   - 通过改变角速度和施加纠正力矩，让它回到目标角度
   - 目标角度 = 站立姿势下的角度（全 0）
   ========================================================= */
function servoUpright(g, dt) {
  // 站立时所有部件的目标角度都是 0
  const parts = g.parts;

  // 逐个部件：把角度往 0 掰
  // 但四肢的目标角度要跟躯干走，否则会僵直
  const torsoAngle = parts.torso.angle;

  // 躯干：目标 0
  applyAngleServo(parts.torso, 0, 0.15, 0.04);

  // 头：目标 0（相对躯干）
  applyAngleServo(parts.head, torsoAngle, 0.20, 0.05);

  // 手臂：目标 = 躯干角度 + 小偏移（手臂稍微向外，不影响站立）
  applyAngleServo(parts.armL, torsoAngle, 0.10, 0.02);
  applyAngleServo(parts.armR, torsoAngle, 0.10, 0.02);

  // 腿：目标 0（与躯干同角度，膝盖方向不弯）
  applyAngleServo(parts.legL, torsoAngle, 0.25, 0.06);
  applyAngleServo(parts.legR, torsoAngle, 0.25, 0.06);

  // 位置回正：把每个部件拉回"站立时相对于躯干的偏移"
  // 用一个"目标位置弹簧"实现
  const torsoPos = parts.torso.position;
  const offsets = {
    head:  { x: 0, y: -(torsoH / 2 + 14) },
    armL:  { x: -(torsoW / 2 + 5), y: -(torsoH / 2 - 20) },
    armR:  { x:  (torsoW / 2 + 5), y: -(torsoH / 2 - 20) },
    legL:  { x: -7, y: (torsoH / 2 + 23) },
    legR:  { x:  7, y: (torsoH / 2 + 23) },
  };
  const posStiff = { head: 0.02, armL: 0.008, armR: 0.008, legL: 0.03, legR: 0.03 };

  for (const name in offsets) {
    const b = parts[name];
    if (!b) continue;
    const off = offsets[name];
    // 躯干旋转后的偏移
    const c = Math.cos(torsoAngle), s = Math.sin(torsoAngle);
    const tx = torsoPos.x + off.x * c - off.y * s;
    const ty = torsoPos.y + off.x * s + off.y * c;

    const dx = tx - b.position.x;
    const dy = ty - b.position.y;
    const k = posStiff[name];
    b.velocity.x += dx * k * (dt * 60);
    b.velocity.y += dy * k * (dt * 60);
  }
}

function applyAngleServo(body, targetAngle, kp, kd) {
  let diff = targetAngle - body.angle;
  // 规范化到 [-π, π]
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;

  // PD 控制：角速度 += kp * 角度差 - kd * 当前角速度
  const correction = kp * diff - kd * body.angularVelocity;
  Body.setAngularVelocity(body, body.angularVelocity + correction);
}

/* 尺寸常量（供 servoUpright 使用） */
const torsoW = 30, torsoH = 48;

/* =========================================================
   布娃娃状态
   ========================================================= */
function downRagdoll(group) {
  if (!group || !group.alive) return;
  group.alive = false;
  group.downAt = performance.now();
  // 关节变软
  for (const c of group.constraints) c.stiffness = 0.08;
}

function standRagdoll(group) {
  if (!group || group.alive) return;
  group.alive = true;
  group.downAt = 0;
  for (const c of group.constraints) c.stiffness = c.plugin.baseStiffness;
}

function findGroupOf(body) {
  for (const g of ragdolls) {
    if (g.parts.head === body || g.parts.torso === body ||
        g.parts.armL === body || g.parts.armR === body ||
        g.parts.legL === body || g.parts.legR === body) return g;
  }
  return null;
}

/* =========================================================
   静置后起身
   ========================================================= */
const STAND_DELAY = 2500;
function updateRagdolls(now) {
  for (const g of ragdolls) {
    if (g.alive) { g.downAt = 0; continue; }
    if (g.downAt === 0) { g.downAt = now; continue; }

    const torso = g.parts.torso;
    if (!torso) continue;
    const sp = Math.hypot(torso.velocity.x, torso.velocity.y);
    if (sp > 5) { g.downAt = now; continue; }
    if (now - g.downAt > STAND_DELAY) standRagdoll(g);
  }
}

/* =========================================================
   碰撞：撞得狠才倒
   ========================================================= */
const DOWN_THRESHOLD = 12;
Events.on(engine, 'collisionStart', (ev) => {
  for (const pair of ev.pairs) {
    const A = pair.bodyA, B = pair.bodyB;
    const rel = Math.hypot(A.velocity.x - B.velocity.x, A.velocity.y - B.velocity.y);
    if (rel < DOWN_THRESHOLD) continue;
    const gA = findGroupOf(A);
    const gB = findGroupOf(B);
    if (gA && gA !== gB) downRagdoll(gA);
    if (gB && gB !== gA) downRagdoll(gB);
  }
});

/* =========================================================
   输入
   ========================================================= */
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
let dpr = 1, vw = 0, vh = 0;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = window.innerWidth;
  vh = window.innerHeight;
  canvas.width = vw * dpr;
  canvas.height = vh * dpr;
  canvas.style.width = vw + 'px';
  canvas.style.height = vh + 'px';
}

const CAM_Y = 260;
function screenToWorld(sx, sy) {
  return {
    x: sx - vw / 2,
    y: sy - vh / 2 + (GY - CAM_Y),
  };
}

function pickBody(sx, sy) {
  const w = screenToWorld(sx, sy);
  const bodies = Composite.allBodies(world);
  for (let i = bodies.length - 1; i >= 0; i--) {
    const b = bodies[i];
    if (b.isStatic) continue;
    if (b.circleRadius) {
      const dx = w.x - b.position.x, dy = w.y - b.position.y;
      if (dx * dx + dy * dy <= b.circleRadius * b.circleRadius) return b;
    } else if (b.vertices) {
      const vs = b.vertices;
      let sign = 0, hit = true;
      const n = vs.length;
      for (let k = 0; k < n; k++) {
        const a = vs[k], c2 = vs[(k + 1) % n];
        const cr = (c2.x - a.x) * (w.y - a.y) - (c2.y - a.y) * (w.x - a.x);
        if (cr > 1e-9) { if (sign < 0) { hit = false; break; } sign = 1; }
        else if (cr < -1e-9) { if (sign > 0) { hit = false; break; } sign = -1; }
      }
      if (hit) return b;
    }
  }
  return null;
}

const pointers = new Map();
let dragBody = null, dragTarget = { x: 0, y: 0 };
let downTime = 0, downPos = { x: 0, y: 0 }, moved = false;

canvas.addEventListener('pointerdown', (e) => {
  try { canvas.setPointerCapture(e.pointerId); } catch(_){}
  const p = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY };
  pointers.set(e.pointerId, p);
  if (pointers.size === 1) {
    moved = false;
    downTime = performance.now();
    downPos.x = e.clientX; downPos.y = e.clientY;
    const hit = pickBody(e.clientX, e.clientY);
    if (hit) {
      dragBody = hit;
      const w = screenToWorld(e.clientX, e.clientY);
      dragTarget.x = w.x; dragTarget.y = w.y;
    }
  } else {
    dragBody = null;
  }
});

canvas.addEventListener('pointermove', (e) => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  p.x = e.clientX; p.y = e.clientY;
  if (Math.hypot(e.clientX - p.sx, e.clientY - p.sy) > 6) moved = true;
  if (dragBody) {
    const w = screenToWorld(e.clientX, e.clientY);
    dragTarget.x = w.x; dragTarget.y = w.y;
  }
});

canvas.addEventListener('pointerup', (e) => {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) {
    if (!moved && performance.now() - downTime < 300 && !dragBody) {
      const w = screenToWorld(downPos.x, downPos.y);
      makeRagdoll(w.x, w.y + 60);
    }
    dragBody = null;
  }
});

canvas.addEventListener('pointercancel', (e) => {
  pointers.delete(e.pointerId);
  dragBody = null;
});

canvas.addEventListener('contextmenu', e => e.preventDefault());

/* =========================================================
   拖拽物理
   ========================================================= */
function updateDrag() {
  if (!dragBody) return;
  const dx = dragTarget.x - dragBody.position.x;
  const dy = dragTarget.y - dragBody.position.y;
  const k = 0.0008;
  Body.applyForce(dragBody, dragBody.position, {
    x: dx * k * dragBody.mass,
    y: dy * k * dragBody.mass,
  });
  Body.setVelocity(dragBody, {
    x: dragBody.velocity.x * 0.85,
    y: dragBody.velocity.y * 0.85,
  });
}

/* =========================================================
   渲染
   ========================================================= */
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const bg = ctx.createLinearGradient(0, 0, 0, vh);
  bg.addColorStop(0, '#131a26');
  bg.addColorStop(1, '#0b0e13');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, vw, vh);

  ctx.save();
  ctx.translate(vw / 2, vh / 2 - (GY - CAM_Y));

  // 地面
  ctx.fillStyle = '#2b3444';
  ctx.strokeStyle = '#1b2230';
  ctx.lineWidth = 2;
  ctx.fillRect(-4000, GY, 8000, 400);
  ctx.beginPath();
  ctx.moveTo(-4000, GY);
  ctx.lineTo(4000, GY);
  ctx.stroke();

  // 网格
  ctx.strokeStyle = 'rgba(255,255,255,.04)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = -4000; x <= 4000; x += 100) {
    ctx.moveTo(x, GY - 1500); ctx.lineTo(x, GY);
  }
  for (let y = GY; y >= GY - 1500; y -= 100) {
    ctx.moveTo(-4000, y); ctx.lineTo(4000, y);
  }
  ctx.stroke();

  // 刚体
  const bodies = Composite.allBodies(world);
  for (const b of bodies) {
    if (b.isStatic) continue;
    const g = findGroupOf(b);
    const isRagdoll = g !== null;

    let color = '#e8b98f', color2 = '#c08a5c';

    ctx.lineWidth = 2;

    if (isRagdoll && g.alive) {
      ctx.shadowColor = 'rgba(100,255,150,.55)';
      ctx.shadowBlur = 8;
    }

    ctx.fillStyle = color;
    ctx.strokeStyle = color2;

    if (b.circleRadius) {
      ctx.beginPath();
      ctx.arc(b.position.x, b.position.y, b.circleRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      // 头部方向指示（小眼睛）
      if (isRagdoll && b === g.parts.head) {
        const ex = b.position.x + Math.cos(b.angle) * 4;
        const ey = b.position.y + Math.sin(b.angle) * 4;
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(ex, ey, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (b.vertices && b.vertices.length) {
      const vs = b.vertices;
      ctx.beginPath();
      ctx.moveTo(vs[0].x, vs[0].y);
      for (let i = 1; i < vs.length; i++) ctx.lineTo(vs[i].x, vs[i].y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
    ctx.shadowBlur = 0;

    if (dragBody === b) {
      ctx.strokeStyle = '#66d9ff';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#66d9ff';
      ctx.shadowBlur = 12;
      if (b.circleRadius) {
        ctx.beginPath();
        ctx.arc(b.position.x, b.position.y, b.circleRadius + 2, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        const vs = b.vertices;
        ctx.beginPath();
        ctx.moveTo(vs[0].x, vs[0].y);
        for (let i = 1; i < vs.length; i++) ctx.lineTo(vs[i].x, vs[i].y);
        ctx.closePath();
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
    }
  }

  if (dragBody) {
    ctx.strokeStyle = 'rgba(120,200,255,.85)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 5]);
    ctx.beginPath();
    ctx.moveTo(dragBody.position.x, dragBody.position.y);
    ctx.lineTo(dragTarget.x, dragTarget.y);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.restore();
}

/* =========================================================
   主循环
   ========================================================= */
let lastTime = performance.now();
let acc = 0;
const FIXED = 1 / 60;

function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  acc += dt;
  let steps = 0;
  while (acc >= FIXED && steps < 4) {
    updateDrag();
    Engine.update(engine, FIXED * 1000);
    // 活着的布娃娃：每帧执行角度伺服
    for (const g of ragdolls) {
      if (g.alive) servoUpright(g, FIXED);
    }
    acc -= FIXED;
    steps++;
  }
  if (steps >= 4) acc = 0;

  updateRagdolls(now);
  render();
}

/* =========================================================
   启动
   ========================================================= */
resize();
window.addEventListener('resize', resize);

makeRagdoll(0, GY - 10);

requestAnimationFrame(loop);
</script>
</body>
</html>
