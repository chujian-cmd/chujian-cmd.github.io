<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1319">
<title>物理沙盒 · Physics Sandbox</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#0f1319;
    touch-action:none;user-select:none;-webkit-user-select:none;
    overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    position:fixed;inset:0;
  }
  canvas{display:block;width:100%;height:100%;touch-action:none;}

  #hud{
    position:fixed;
    top:calc(env(safe-area-inset-top,0px) + 8px);
    left:calc(env(safe-area-inset-left,0px) + 10px);
    color:#7f8ea3;font-size:12px;line-height:1.5;
    pointer-events:none;font-variant-numeric:tabular-nums;
    text-shadow:0 1px 3px #000;
    z-index:5;
  }
  #hud b{color:#c9d6e8;font-weight:600;}

  #topbar{
    position:fixed;
    top:calc(env(safe-area-inset-top,0px) + 8px);
    right:calc(env(safe-area-inset-right,0px) + 8px);
    display:flex;gap:6px;z-index:20;
    max-width:calc(100vw - 100px);
    flex-wrap:wrap;justify-content:flex-end;
  }

  #bottombar{
    position:fixed;
    bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
    left:calc(env(safe-area-inset-left,0px) + 8px);
    right:calc(env(safe-area-inset-right,0px) + 8px);
    display:flex;gap:6px;z-index:20;
    overflow-x:auto;overflow-y:hidden;
    padding:6px;border-radius:16px;
    background:rgba(18,22,30,.72);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.07);
    box-shadow:0 6px 24px rgba(0,0,0,.45);
    scrollbar-width:none;
    justify-content:flex-start;
    flex-wrap:nowrap;
    -webkit-overflow-scrolling:touch;
  }
  #bottombar::-webkit-scrollbar{display:none;}
  #bottombar .btn:first-child{margin-left:auto;}
  #bottombar .btn:last-child{margin-right:auto;}

  .btn{
    flex:0 0 auto;
    min-width:46px;height:46px;
    border:none;border-radius:12px;
    background:rgba(255,255,255,.07);
    color:#d4deec;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:background .12s,transform .08s,box-shadow .12s;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
    position:relative;
    padding:0 8px;
  }
  .btn:active{transform:scale(.92);}
  .btn.active{
    background:linear-gradient(180deg,#3d8bfd,#2563eb);
    color:#fff;
    box-shadow:0 0 0 2px rgba(96,165,250,.35),0 4px 14px rgba(37,99,235,.45);
  }
  .btn.warn.active{background:linear-gradient(180deg,#f87171,#dc2626);box-shadow:0 0 0 2px rgba(248,113,113,.35);}
  .btn svg{display:block;pointer-events:none;}

  .matdot{
    position:absolute;bottom:5px;right:5px;
    width:10px;height:10px;border-radius:50%;
    border:1.5px solid rgba(0,0,0,.55);
    box-shadow:0 0 0 1px rgba(255,255,255,.14);
    pointer-events:none;
  }

  #quickmenu{
    position:fixed;z-index:40;
    display:none;
    padding:8px;border-radius:16px;
    background:rgba(20,26,36,.94);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 10px 40px rgba(0,0,0,.6);
    grid-template-columns:repeat(3,1fr);gap:6px;
    transform:translate(-50%,-50%);
    visibility:hidden;
  }
  #quickmenu.show{display:grid;visibility:visible;}
  #quickmenu .btn{
    min-width:58px;height:58px;
    flex-direction:column;gap:3px;
    padding:4px;
  }
  #quickmenu .lbl{font-size:9px;opacity:.72;line-height:1;letter-spacing:.3px;}

  #toast{
    position:fixed;left:50%;
    bottom:calc(env(safe-area-inset-bottom,0px) + 74px);
    transform:translateX(-50%);
    background:rgba(0,0,0,.78);color:#e6edf7;
    padding:8px 16px;border-radius:20px;font-size:13px;
    pointer-events:none;opacity:0;transition:opacity .25s;
    z-index:50;white-space:nowrap;
  }
  #toast.show{opacity:1;}

  @media (max-width:420px){
    .btn{min-width:44px;height:44px;}
    #topbar{gap:4px;}
    #quickmenu .btn{min-width:54px;height:54px;}
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="hud">
  <div id="stats">FPS -- · 物体 0 · 缩放 100%</div>
  <div id="hint" style="opacity:.7;font-size:11px"></div>
</div>

<div id="topbar">
  <button class="btn" data-act="mat" id="btnMat" title="材质"></button>
  <button class="btn" data-act="pause" data-icon="pause" title="暂停"></button>
  <button class="btn" data-act="slow" data-icon="slow" title="慢动作"></button>
  <button class="btn" data-act="debug" data-icon="debug" title="调试"></button>
  <button class="btn" data-act="full" data-icon="full" title="全屏"></button>
  <button class="btn" data-act="reset" data-icon="reset" title="重置"></button>
  <button class="btn warn" data-act="clear" data-icon="clear" title="清空"></button>
</div>

<div id="bottombar">
  <button class="btn tool active" data-tool="hand" data-icon="hand" title="拖拽/投掷"></button>
  <button class="btn tool" data-tool="box" data-icon="box" title="方块"></button>
  <button class="btn tool" data-tool="ball" data-icon="ball" title="圆球"></button>
  <button class="btn tool" data-tool="tri" data-icon="tri" title="三角"></button>
  <button class="btn tool" data-tool="hex" data-icon="hex" title="六边形"></button>
  <button class="btn tool" data-tool="ragdoll" data-icon="ragdoll" title="布娃娃"></button>
  <button class="btn tool" data-tool="tnt" data-icon="tnt" title="TNT"></button>
  <button class="btn tool" data-tool="gun" data-icon="gun" title="手枪"></button>
  <button class="btn tool" data-tool="blade" data-icon="blade" title="飞刀"></button>
  <button class="btn tool" data-tool="bomb" data-icon="bomb" title="炸弹"></button>
  <button class="btn tool warn" data-tool="delete" data-icon="delete" title="删除"></button>
</div>

<div id="quickmenu"></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
"use strict";

const { Engine, World, Bodies, Body, Composite, Constraint, Events, Vector, Vertices, Bounds } = Matter;

/* =========================================================================
   工具
   ========================================================================= */
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent)
              || (window.matchMedia && window.matchMedia('(pointer:coarse)').matches);

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const rand  = (a, b) => a + Math.random() * (b - a);

/* =========================================================================
   SVG 图标
   ========================================================================= */
const ICONS = {
  hand: '<path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>',
  box: '<rect x="4" y="4" width="16" height="16" rx="2.5"/>',
  ball: '<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="9" ry="3.6"/><ellipse cx="12" cy="12" rx="3.6" ry="9"/>',
  tri: '<path d="M12 4.5 20.5 19.5h-17z"/>',
  hex: '<path d="M12 3 20.5 7.8v8.4L12 21 3.5 16.2V7.8z"/>',
  ragdoll: '<circle cx="12" cy="4.2" r="2.5"/><path d="M12 6.7v6"/><path d="M12 8.2 7.8 11M12 8.2l4.2 2.8"/><path d="M12 12.7 8.8 19.5M12 12.7l3.2 6.8"/>',
  tnt: '<rect x="4" y="7.5" width="16" height="12.5" rx="2"/><path d="M12 7.5V3.5"/><path d="M9.5 3.5h5"/><path d="M7.5 12h9"/><path d="M7.5 15.5h5"/>',
  gun: '<path d="M3 8h14v3h4v2h-7l-2 6h-3l2-6H3z"/>',
  blade: '<path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/>',
  bomb: '<circle cx="10.5" cy="14.5" r="6.5"/><path d="M14.8 10.2 18 7"/><path d="M18 7c0-1.6 1-2.6 2.6-2.6"/><circle cx="20.6" cy="4.4" r="1.1" fill="currentColor" stroke="none"/>',
  delete: '<path d="M6 6l12 12M18 6 6 18"/>',
  pause: '<rect x="6" y="4" width="4" height="16" rx="1.2"/><rect x="14" y="4" width="4" height="16" rx="1.2"/>',
  play: '<path d="M7 4.5 20 12 7 19.5z" fill="currentColor" stroke="none"/>',
  slow: '<path d="M7 3h10"/><path d="M7 21h10"/><path d="M8.5 3c0 4 3.5 5 3.5 9s-3.5 5-3.5 9"/><path d="M15.5 3c0 4-3.5 5-3.5 9s3.5 5 3.5 9"/>',
  debug: '<circle cx="12" cy="13" r="5.5"/><path d="M12 7.5V4.5"/><path d="M7.8 9.8 4.8 8.3"/><path d="M16.2 9.8l3-1.5"/><path d="M7.8 16.2l-3 1.5"/><path d="M16.2 16.2l3 1.5"/><path d="M9.6 8.2 8.2 5.3"/><path d="M14.4 8.2l1.4-2.9"/>',
  full: '<path d="M4 9.5V4h5.5"/><path d="M20 9.5V4h-5.5"/><path d="M4 14.5V20h5.5"/><path d="M20 14.5V20h-5.5"/>',
  reset: '<path d="M20.5 12a8.5 8.5 0 1 1-2.7-6.2"/><path d="M21 4v5h-5"/>',
  clear: '<path d="M4 7h16"/><path d="M9.5 7V4.2h5V7"/><path d="M6.6 7l1 13h8.8l1-13"/><path d="M10.5 11v5.5"/><path d="M13.5 11v5.5"/>',
  mat: '<path d="M12 21.5a9.5 9.5 0 1 1 0-19c5.2 0 9.5 3.8 9.5 8.5 0 2.6-2.1 4.2-4.2 4.2h-2.1a2.1 2.1 0 0 0-1.6 3.5c.3.4.5.9.5 1.3 0 .8-.8 1.5-2.1 1.5z"/><circle cx="7.5" cy="12" r="1.15" fill="currentColor" stroke="none"/><circle cx="9.8" cy="8.3" r="1.15" fill="currentColor" stroke="none"/><circle cx="14" cy="7.3" r="1.15" fill="currentColor" stroke="none"/><circle cx="17.3" cy="10" r="1.15" fill="currentColor" stroke="none"/>',
};

function makeSvg(name, size = 22, sw = 1.8) {
  const inner = ICONS[name] || '';
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}

/* =========================================================================
   材质
   ========================================================================= */
const MATERIALS = {
  wood:   { name: '木头', density: 0.0010, friction: 0.62, frictionStatic: 0.85, restitution: 0.22, color: '#b5793a', stroke: '#6f4319' },
  metal:  { name: '金属', density: 0.0035, friction: 0.42, frictionStatic: 0.65, restitution: 0.12, color: '#9aa7b8', stroke: '#54606f' },
  ice:    { name: '冰块', density: 0.0009, friction: 0.04, frictionStatic: 0.08, restitution: 0.08, color: '#a9e7ff', stroke: '#4fa8d4' },
  rubber: { name: '橡胶', density: 0.0012, friction: 0.92, frictionStatic: 0.98, restitution: 0.82, color: '#50536a', stroke: '#24263a' },
  stone:  { name: '石头', density: 0.0026, friction: 0.72, frictionStatic: 0.9,  restitution: 0.06, color: '#8d8d95', stroke: '#4f4f5a' },
  flesh:  { name: '肉体', density: 0.0010, friction: 0.70, frictionStatic: 0.9,  restitution: 0.18, color: '#f0c9a0', stroke: '#a0754d' },
  tnt:    { name: 'TNT',  density: 0.0014, friction: 0.55, frictionStatic: 0.7,  restitution: 0.18, color: '#e34b3b', stroke: '#7d1c12' },
};
const MAT_KEYS = ['wood', 'metal', 'ice', 'rubber', 'stone'];

/* =========================================================================
   引擎
   ========================================================================= */
const engine = Engine.create({
  positionIterations: IS_MOBILE ? 6 : 8,
  velocityIterations: IS_MOBILE ? 6 : 8,
  constraintIterations: 3,
  enableSleeping: true,
});
engine.gravity.y = 1;
engine.gravity.scale = 0.045;

const world = engine.world;

/* =========================================================================
   状态
   ========================================================================= */
const state = {
  tool: 'hand',
  material: 'wood',
  paused: false,
  timeScale: 1,
  debug: false,
  selected: null,
  drag: null,
  particles: [],
  shockwaves: [],
  ragdolls: [],
  groundY: 520,
  fps: 60,
};

const camera = { x: 0, y: 180, zoom: 1 };

const MAX_BODIES = IS_MOBILE ? 110 : 260;
const PARTICLE_CAP = IS_MOBILE ? 180 : 600;
const INSTANT_TOOLS = { gun: 1, blade: 1 };

/* =========================================================================
   粒子
   ========================================================================= */
function spawnParticles(x, y, count, o = {}) {
  const colors = o.colors || ['#ffb347', '#ff7a45', '#ffd93d', '#ffffff'];
  for (let i = 0; i < count; i++) {
    if (state.particles.length >= PARTICLE_CAP) break;
    const a = o.dir !== undefined ? o.dir + rand(-0.9, 0.9) : rand(0, TAU);
    const sp = rand(o.spdMin ?? 80, o.spdMax ?? 420);
    state.particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 0,
      maxLife: rand(o.lifeMin ?? 0.3, o.lifeMax ?? 1.1),
      size: rand(o.sizeMin ?? 1.5, o.sizeMax ?? 5),
      color: colors[(Math.random() * colors.length) | 0],
      gravity: o.gravity ?? 900,
      drag: o.drag ?? 0.985,
    });
  }
}

function updateParticles(dt) {
  const ps = state.particles;
  for (let i = ps.length - 1; i >= 0; i--) {
    const p = ps[i];
    p.life += dt;
    if (p.life >= p.maxLife) { ps[i] = ps[ps.length - 1]; ps.pop(); continue; }
    p.vy += p.gravity * dt;
    p.vx *= p.drag; p.vy *= p.drag;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  for (let i = state.shockwaves.length - 1; i >= 0; i--) {
    const s = state.shockwaves[i];
    s.life += dt;
    if (s.life >= s.maxLife) { state.shockwaves[i] = state.shockwaves[state.shockwaves.length - 1]; state.shockwaves.pop(); }
  }
}

/* =========================================================================
   物体工厂
   ========================================================================= */
function applyMaterial(body, matKey) {
  const m = MATERIALS[matKey];
  body.render.fillStyle = m.color;
  body.render.strokeStyle = m.stroke;
  body.render.lineWidth = 2;
  body.materialKey = matKey;
  body.friction = m.friction;
  body.frictionStatic = m.frictionStatic;
  body.restitution = m.restitution;
  return body;
}

function addBox(x, y, w, h, matKey = 'wood', opts = {}) {
  const m = MATERIALS[matKey] || MATERIALS.stone;
  const b = Bodies.rectangle(x, y, w, h, {
    density: m.density,
    friction: m.friction,
    frictionStatic: m.frictionStatic,
    restitution: m.restitution,
    angle: opts.angle || 0,
    isStatic: !!opts.isStatic,
    chamfer: opts.chamfer ? { radius: opts.chamfer } : undefined,
  });
  applyMaterial(b, matKey);
  if (opts.static_color) { b.render.fillStyle = opts.static_color; }
  if (opts.static_stroke) { b.render.strokeStyle = opts.static_stroke; }
  if (opts.label) b.label = opts.label;
  if (opts.isSensor) b.isSensor = true;
  Composite.add(world, b);
  return b;
}

function addCircle(x, y, r, matKey = 'wood', opts = {}) {
  const m = MATERIALS[matKey] || MATERIALS.stone;
  const b = Bodies.circle(x, y, r, {
    density: m.density,
    friction: m.friction,
    frictionStatic: m.frictionStatic,
    restitution: m.restitution,
    isStatic: !!opts.isStatic,
  });
  applyMaterial(b, matKey);
  if (opts.label) b.label = opts.label;
  Composite.add(world, b);
  return b;
}

function addPoly(x, y, sides, r, matKey = 'wood', opts = {}) {
  const m = MATERIALS[matKey] || MATERIALS.stone;
  const b = Bodies.polygon(x, y, sides, r, {
    density: m.density,
    friction: m.friction,
    frictionStatic: m.frictionStatic,
    restitution: m.restitution,
    isStatic: !!opts.isStatic,
  });
  applyMaterial(b, matKey);
  if (opts.label) b.label = opts.label;
  Composite.add(world, b);
  return b;
}

/* =========================================================================
   布娃娃 —— Matter.js 版
   ========================================================================= */
let _ragdollId = 0;

/* 姿态参数 */
const POSE_K      = 0.00035;   // 位置刚度
const POSE_KD     = 0.86;      // 速度阻尼
const POSE_ANG_K  = 0.10;      // 角度刚度
const POSE_ANG_D  = 0.82;      // 角速度阻尼

function makeRagdoll(x, y) {
  const group = Body.nextGroup(true);
  const id = ++_ragdollId;

  const common = {
    collisionFilter: { group, category: 0x0002, mask: 0xFFFFFFFF },
    friction: 0.7,
    frictionStatic: 0.9,
    frictionAir: 0.012,
    restitution: 0.05,
    density: 0.0012,
  };

  /* —— 身体部件 —— */
  const parts = {};

  // 头
  parts.head = Bodies.circle(x, y - 106, 14, {
    ...common, label: 'rd-head',
  });
  parts.head.render.fillStyle = '#f5d4b0';
  parts.head.render.strokeStyle = '#a5784a';
  parts.head.render.lineWidth = 2;

  // 躯干（衣服）
  parts.torso = Bodies.rectangle(x, y - 70, 32, 46, {
    ...common, chamfer: { radius: 9 }, label: 'rd-torso',
  });
  parts.torso.render.fillStyle = '#4a7fc1';
  parts.torso.render.strokeStyle = '#26497a';
  parts.torso.render.lineWidth = 2;

  // 左臂
  parts.armL = Bodies.rectangle(x - 21, y - 72, 11, 42, {
    ...common, chamfer: { radius: 5.5 }, label: 'rd-armL',
  });
  parts.armL.render.fillStyle = '#f5d4b0';
  parts.armL.render.strokeStyle = '#a5784a';
  parts.armL.render.lineWidth = 2;

  // 右臂
  parts.armR = Bodies.rectangle(x + 21, y - 72, 11, 42, {
    ...common, chamfer: { radius: 5.5 }, label: 'rd-armR',
  });
  parts.armR.render.fillStyle = '#f5d4b0';
  parts.armR.render.strokeStyle = '#a5784a';
  parts.armR.render.lineWidth = 2;

  // 左腿（裤子）
  parts.legL = Bodies.rectangle(x - 9, y - 22, 12, 46, {
    ...common, chamfer: { radius: 6 }, label: 'rd-legL',
  });
  parts.legL.render.fillStyle = '#3a5a8a';
  parts.legL.render.strokeStyle = '#1e3555';
  parts.legL.render.lineWidth = 2;

  // 右腿
  parts.legR = Bodies.rectangle(x + 9, y - 22, 12, 46, {
    ...common, chamfer: { radius: 6 }, label: 'rd-legR',
  });
  parts.legR.render.fillStyle = '#3a5a8a';
  parts.legR.render.strokeStyle = '#1e3555';
  parts.legR.render.lineWidth = 2;

  /* —— 隐形锚点（脚底） —— */
  const anchor = Bodies.circle(x, y, 6, {
    collisionFilter: { group, category: 0x0004, mask: 0xFFFFFFFF },
    density: 0.06,
    friction: 0.98,
    frictionStatic: 1.0,
    frictionAir: 0.05,
    restitution: 0.02,
    label: 'rd-anchor',
  });
  anchor.render.visible = false;

  /* —— 关节 —— */
  const J = (bodyA, pointA, bodyB, pointB, length, stiffness) =>
    Constraint.create({
      bodyA, pointA, bodyB, pointB,
      length, stiffness, damping: 0.12,
      render: { visible: false },
    });

  const joints = [
    J(parts.head,  { x: 0,   y: 14  }, parts.torso, { x: 0,   y: -23 }, 0,   0.95),
    J(parts.torso, { x: -16, y: -23 }, parts.armL,  { x: 5.5, y: -21 }, 0,   0.95),
    J(parts.torso, { x: 16,  y: -23 }, parts.armR,  { x: -5.5,y: -21 }, 0,   0.95),
    J(parts.torso, { x: -8,  y: 23  }, parts.legL,  { x: -2,  y: -23 }, 4.5, 0.95),
    J(parts.torso, { x: 8,   y: 23  }, parts.legR,  { x: 2,   y: -23 }, 4.5, 0.95),
  ];

  /* —— 站立姿态偏移（相对锚点）—— */
  const offsets = {
    head:  { x: 0,   y: -106 },
    torso: { x: 0,   y: -70  },
    armL:  { x: -21, y: -72  },
    armR:  { x: 21,  y: -72  },
    legL:  { x: -9,  y: -22  },
    legR:  { x: 9,   y: -22  },
  };

  const ragdoll = {
    id, parts, joints, anchor, offsets,
    alive: true,
    group,
    dragTarget: null,   // 拖拽时用
  };

  for (const k in parts) {
    parts[k].ragdoll = ragdoll;
    parts[k].ragdollKey = k;
  }
  anchor.ragdoll = ragdoll;

  Composite.add(world, [anchor, parts.head, parts.torso, parts.armL, parts.armR, parts.legL, parts.legR, ...joints]);
  state.ragdolls.push(ragdoll);

  return ragdoll;
}

function knockdownRagdoll(rd) {
  if (!rd || !rd.alive) return;
  rd.alive = false;
  if (rd.anchor) {
    Composite.remove(world, rd.anchor);
    rd.anchor.ragdoll = null;
    rd.anchor = null;
  }
  // 关节保留，只是不再施加姿态力 → 自然瘫软
}

function removeRagdoll(rd) {
  if (!rd) return;
  if (rd.anchor) { Composite.remove(world, rd.anchor); rd.anchor.ragdoll = null; }
  for (const k in rd.parts) {
    const p = rd.parts[k];
    if (p) { p.ragdoll = null; Composite.remove(world, p); }
  }
  for (const j of rd.joints) Composite.remove(world, j);
  rd.alive = false;
  const i = state.ragdolls.indexOf(rd);
  if (i >= 0) state.ragdolls.splice(i, 1);
}

/* 姿态更新：每帧在物理之前施加 */
function updateRagdollPoses() {
  for (let i = 0; i < state.ragdolls.length; i++) {
    const rd = state.ragdolls[i];
    if (!rd.alive || !rd.anchor) continue;
    const a = rd.anchor;
    const ax = a.position.x;
    const ay = a.position.y;

    // 拖拽目标优先
    if (rd.dragTarget) {
      const dx = rd.dragTarget.x - ax;
      const dy = rd.dragTarget.y - ay;
      Body.setVelocity(a, { x: dx * 0.25, y: dy * 0.25 });
    }

    for (const k in rd.parts) {
      const part = rd.parts[k];
      if (!part) continue;
      const off = rd.offsets[k];
      const tx = ax + off.x;
      const ty = ay + off.y;

      const dx = tx - part.position.x;
      const dy = ty - part.position.y;

      // 速度阻尼 + 弹簧力
      const vx = part.velocity.x * POSE_KD + dx * POSE_K * part.mass * 1000;
      const vy = part.velocity.y * POSE_KD + dy * POSE_K * part.mass * 1000;
      Body.setVelocity(part, { x: vx, y: vy });

      // 角度回正
      let da = -part.angle;
      while (da > Math.PI) da -= TAU;
      while (da < -Math.PI) da += TAU;
      const newAV = part.angularVelocity * POSE_ANG_D + da * POSE_ANG_K;
      Body.setAngularVelocity(part, clamp(newAV, -0.8, 0.8));
    }
  }
}

/* =========================================================================
   破碎 / 爆炸
   ========================================================================= */
function shatterBody(body) {
  if (!body || body.isStatic || body.isSensor) return;
  if (!body.render || !body.render.fillStyle) return;
  if (body.label === 'bullet' || body.label === 'blade' || body.label === 'rd-anchor') return;

  /* 布娃娃：被打中 → 击倒（不碎） */
  if (body.ragdoll) {
    const rd = body.ragdoll;
    if (rd.alive) knockdownRagdoll(rd);
    spawnParticles(body.position.x, body.position.y, 6, {
      colors: ['#f5d4b0', '#c99b6d', '#ffffff'],
      spdMin: 40, spdMax: 200, lifeMin: 0.15, lifeMax: 0.5,
      sizeMin: 1.5, sizeMax: 4,
    });
    return;
  }

  /* TNT：引爆 */
  if (body.materialKey === 'tnt' || body.label === 'tnt') {
    triggerTNT(body);
    return;
  }

  /* 其它：碎成小片 */
  const pos = body.position;
  const vx = body.velocity.x;
  const vy = body.velocity.y;
  const angle = body.angle;
  const fill = body.render.fillStyle;
  const stroke = body.render.strokeStyle;
  const matKey = body.materialKey || 'stone';
  const mat = MATERIALS[matKey] || MATERIALS.stone;

  /* 估算尺寸 */
  const bnd = body.bounds;
  const w = bnd.max.x - bnd.min.x;
  const h = bnd.max.y - bnd.min.y;
  const pieces = IS_MOBILE ? 4 : 6;
  const scale = 0.35;

  for (let i = 0; i < pieces; i++) {
    const px = pos.x + rand(-w * 0.35, w * 0.35);
    const py = pos.y + rand(-h * 0.35, h * 0.35);
    const pw = rand(w * 0.2, w * 0.45);
    const ph = rand(h * 0.2, h * 0.45);
    const piece = Bodies.rectangle(px, py, pw, ph, {
      density: mat.density,
      friction: mat.friction,
      frictionStatic: mat.frictionStatic,
      restitution: mat.restitution,
      angle: angle + rand(-0.8, 0.8),
      chamfer: { radius: Math.min(pw, ph) * 0.2 },
      label: 'debris',
    });
    piece.render.fillStyle = fill;
    piece.render.strokeStyle = stroke;
    piece.render.lineWidth = 1.5;
    piece.materialKey = matKey;

    Body.setVelocity(piece, {
      x: vx + rand(-6, 6),
      y: vy + rand(-6, 6) - rand(0, 3),
    });
    Body.setAngularVelocity(piece, rand(-0.3, 0.3));
    Composite.add(world, piece);
  }

  spawnParticles(pos.x, pos.y, IS_MOBILE ? 8 : 14, {
    colors: [fill, stroke, '#ffffff'],
    spdMin: 60, spdMax: 320, lifeMin: 0.25, lifeMax: 0.8,
    sizeMin: 1.5, sizeMax: 4.5,
  });

  if (state.selected === body) state.selected = null;
  Composite.remove(world, body);
}

function explode(x, y, radius = 240, power = 22) {
  state.shockwaves.push({ x, y, r: radius, life: 0, maxLife: 0.45 });

  const bodies = Composite.allBodies(world);
  const toShatter = [];

  for (const b of bodies) {
    if (b.isStatic || b.isSensor) continue;
    if (b.label === 'rd-anchor') continue;

    const dx = b.position.x - x, dy = b.position.y - y;
    const d = Math.hypot(dx, dy);
    if (d > radius) continue;

    if (b.ragdoll && b.ragdoll.alive) knockdownRagdoll(b.ragdoll);

    const falloff = 1 - d / radius;
    const nx = dx / (d || 1), ny = dy / (d || 1);
    const dv = falloff * power * (0.6 + 0.5 * Math.random());

    Body.setVelocity(b, {
      x: b.velocity.x + nx * dv,
      y: b.velocity.y + ny * dv,
    });
    Body.setAngularVelocity(b, b.angularVelocity + rand(-0.4, 0.4) * falloff);

    if (b.label === 'tnt' && (!b.plugin || !b.plugin.fuse)) {
      b.plugin = b.plugin || {};
      b.plugin.fuse = rand(0.08, 0.25);
    } else if (falloff > 0.5 && Math.random() < 0.55 && b.label !== 'bullet' && b.label !== 'blade') {
      toShatter.push(b);
    }
  }

  for (const b of toShatter) shatterBody(b);

  spawnParticles(x, y, IS_MOBILE ? 22 : 46, {
    colors: ['#ffd93d', '#ff8c42', '#ff4d2e', '#ffffff', '#ffb347'],
    spdMin: 180, spdMax: 900, lifeMin: 0.25, lifeMax: 0.9,
    sizeMin: 2, sizeMax: 7, gravity: 400,
  });
  spawnParticles(x, y, IS_MOBILE ? 10 : 20, {
    colors: ['#6b6b6b', '#3a3a3a', '#9a9a9a'],
    spdMin: 40, spdMax: 260, lifeMin: 0.5, lifeMax: 1.6,
    sizeMin: 3, sizeMax: 10, gravity: -60, drag: 0.97,
  });
}

function triggerTNT(b) {
  if (!b || !b.position) return;
  const x = b.position.x, y = b.position.y;
  Composite.remove(world, b);
  explode(x, y, 260, 24);
}

/* =========================================================================
   子弹 / 飞刀
   ========================================================================= */
function fireBullet(wx, wy) {
  let dx = wx - camera.x, dy = wy - camera.y;
  const l = Math.hypot(dx, dy) || 1;
  dx /= l; dy /= l;

  const b = Bodies.circle(wx, wy, 5, {
    density: 0.006,
    friction: 0.3,
    frictionAir: 0,
    restitution: 0.2,
    label: 'bullet',
  });
  b.render.fillStyle = '#ffe08a';
  b.render.strokeStyle = '#a8761a';
  b.render.lineWidth = 2;
  Body.setVelocity(b, { x: dx * 34, y: dy * 34 });
  Composite.add(world, b);
}

function fireBlade(wx, wy) {
  let dx = wx - camera.x, dy = wy - camera.y;
  const l = Math.hypot(dx, dy) || 1;
  dx /= l; dy /= l;

  const verts = [
    { x: -22, y: -3 }, { x: 20, y: -3 }, { x: 28, y: 0 },
    { x: 20, y: 3 }, { x: -22, y: 3 }, { x: -28, y: 0 },
  ];
  const b = Bodies.fromVertices(wx, wy, [verts], {
    density: 0.003,
    friction: 0.4,
    frictionAir: 0,
    restitution: 0.15,
    label: 'blade',
  });
  if (!b) return;
  b.render.fillStyle = '#d8e2f0';
  b.render.strokeStyle = '#7d8da3';
  b.render.lineWidth = 2;
  Body.setAngle(b, Math.atan2(dy, dx));
  Body.setVelocity(b, { x: dx * 26, y: dy * 26 });
  Body.setAngularVelocity(b, 0.35);
  Composite.add(world, b);
}

/* =========================================================================
   碰撞处理
   ========================================================================= */
Events.on(engine, 'collisionStart', (e) => {
  const pairs = e.pairs;
  const toShatter = [];

  for (let i = 0; i < pairs.length; i++) {
    const a = pairs[i].bodyA;
    const b = pairs[i].bodyB;

    // 子弹 / 飞刀
    const isBulletA = a.label === 'bullet' || a.label === 'blade';
    const isBulletB = b.label === 'bullet' || b.label === 'blade';
    if (isBulletA || isBulletB) {
      const proj = isBulletA ? a : b;
      const other = isBulletA ? b : a;
      if (other.label === 'rd-anchor') continue;

      if (other.ragdoll) {
        if (other.ragdoll.alive) knockdownRagdoll(other.ragdoll);
      } else if (!other.isStatic && other.label !== 'bullet' && other.label !== 'blade') {
        toShatter.push(other);
      }
      // 子弹/飞刀自身消失
      if (proj.label === 'bullet') Composite.remove(world, proj);
      continue;
    }

    // 高速碰撞 → 布娃娃倒下
    const relV = Vector.magnitude(Vector.sub(a.velocity, b.velocity));
    if (relV > 18) {
      if (a.ragdoll && a.ragdoll.alive && !b.ragdoll) knockdownRagdoll(a.ragdoll);
      if (b.ragdoll && b.ragdoll.alive && !a.ragdoll) knockdownRagdoll(b.ragdoll);
    }
  }

  for (const b of toShatter) shatterBody(b);
});

/* 每帧更新布娃娃姿态（物理步进之前） */
Events.on(engine, 'beforeUpdate', () => {
  updateRagdollPoses();
  updateFuses();
});

function updateFuses() {
  const bodies = Composite.allBodies(world);
  for (const b of bodies) {
    if (b.plugin && b.plugin.fuse > 0) {
      b.plugin.fuse -= 1 / 60;
      if (b.plugin.fuse <= 0) {
        b.plugin.fuse = 0;
        triggerTNT(b);
      }
    }
  }
}

/* =========================================================================
   渲染器
   ========================================================================= */
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d', { alpha: false });

let DPR = 1, VW = 0, VH = 0;
let bgGrad = null, bgGradH = -1;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  const pw = Math.max(1, Math.floor(w * dpr));
  const ph = Math.max(1, Math.floor(h * dpr));
  if (canvas.width === pw && canvas.height === ph && DPR === dpr) return;
  DPR = dpr; VW = w; VH = h;
  canvas.width = pw; canvas.height = ph;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  bgGrad = null;
}

function screenToWorld(sx, sy) {
  return {
    x: (sx - VW / 2) / camera.zoom + camera.x,
    y: (sy - VH / 2) / camera.zoom + camera.y,
  };
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  if (!bgGrad || bgGradH !== VH) {
    bgGrad = ctx.createLinearGradient(0, 0, 0, VH);
    bgGrad.addColorStop(0, '#131a26');
    bgGrad.addColorStop(1, '#0b0e13');
    bgGradH = VH;
  }
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, VW, VH);

  ctx.save();
  ctx.translate(VW / 2, VH / 2);
  ctx.scale(camera.zoom, camera.zoom);
  ctx.translate(-camera.x, -camera.y);

  const halfW = VW / 2 / camera.zoom, halfH = VH / 2 / camera.zoom;
  const viewL = camera.x - halfW, viewR = camera.x + halfW;
  const viewT = camera.y - halfH, viewB = camera.y + halfH;

  drawGrid(viewL, viewR, viewT, viewB);

  /* 物体 */
  const bodies = Composite.allBodies(world);
  for (let i = 0; i < bodies.length; i++) {
    const b = bodies[i];
    if (b.isSensor) continue;
    if (!b.render || b.render.visible === false) continue;

    const r = Math.max(b.bounds.max.x - b.bounds.min.x, b.bounds.max.y - b.bounds.min.y) + 30 / camera.zoom;
    if (b.position.x + r < viewL || b.position.x - r > viewR) continue;
    if (b.position.y + r < viewT || b.position.y - r > viewB) continue;

    drawBody(b);
  }

  /* 选中高亮 */
  if (state.selected) drawHighlight(state.selected);

  /* 拖拽线 */
  if (state.drag && state.drag.constraint) {
    const c = state.drag.constraint;
    if (c.bodyB) {
      const p = c.bodyB.position;
      ctx.strokeStyle = 'rgba(120,200,255,.85)';
      ctx.lineWidth = 2 / camera.zoom;
      ctx.setLineDash([6 / camera.zoom, 5 / camera.zoom]);
      ctx.beginPath();
      ctx.moveTo(c.pointA.x, c.pointA.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 5 / camera.zoom, 0, TAU);
      ctx.fillStyle = 'rgba(120,200,255,.9)';
      ctx.fill();
    }
  }

  /* 粒子 */
  drawParticles(state.particles);

  /* 调试 */
  if (state.debug) drawDebug();

  /* 冲击波 */
  for (let i = 0; i < state.shockwaves.length; i++) {
    const s = state.shockwaves[i];
    const t = s.life / s.maxLife;
    ctx.strokeStyle = `rgba(255,190,110,${t * 0.8})`;
    ctx.lineWidth = (2 + 8 * t) / camera.zoom;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * (1 - t) + 8, 0, TAU);
    ctx.stroke();
  }

  ctx.restore();
}

function drawGrid(L, R, T, B) {
  let step = 100;
  while (step * camera.zoom < 40) step *= 2;
  while (step * camera.zoom > 220) step /= 2;

  ctx.lineWidth = 1 / camera.zoom;
  ctx.strokeStyle = 'rgba(255,255,255,.035)';
  ctx.beginPath();
  const x0 = Math.floor(L / step) * step;
  const y0 = Math.floor(T / step) * step;
  for (let x = x0; x <= R; x += step) { ctx.moveTo(x, T); ctx.lineTo(x, B); }
  for (let y = y0; y <= B; y += step) { ctx.moveTo(L, y); ctx.lineTo(R, y); }
  ctx.stroke();

  ctx.strokeStyle = 'rgba(90,140,200,.13)';
  ctx.lineWidth = 2 / camera.zoom;
  ctx.beginPath();
  ctx.moveTo(L, 0); ctx.lineTo(R, 0);
  ctx.moveTo(0, T); ctx.lineTo(0, B);
  ctx.stroke();
}

function drawBody(b) {
  if (b.circleRadius) {
    ctx.beginPath();
    ctx.arc(b.position.x, b.position.y, b.circleRadius, 0, TAU);
    ctx.fillStyle = b.render.fillStyle || '#888';
    ctx.fill();
    ctx.lineWidth = b.render.lineWidth || 2;
    ctx.strokeStyle = b.render.strokeStyle || 'rgba(0,0,0,.6)';
    ctx.stroke();

    // 高光
    if (b.circleRadius * camera.zoom > 9 && b.label !== 'bullet') {
      ctx.beginPath();
      ctx.arc(b.position.x - b.circleRadius * 0.25, b.position.y - b.circleRadius * 0.25,
              b.circleRadius * 0.3, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,.25)';
      ctx.fill();
    }
  } else {
    const verts = b.vertices;
    if (!verts || verts.length < 3) return;
    ctx.beginPath();
    ctx.moveTo(verts[0].x, verts[0].y);
    for (let i = 1; i < verts.length; i++) ctx.lineTo(verts[i].x, verts[i].y);
    ctx.closePath();
    ctx.fillStyle = b.render.fillStyle || '#888';
    ctx.fill();
    ctx.lineWidth = b.render.lineWidth || 2;
    ctx.strokeStyle = b.render.strokeStyle || 'rgba(0,0,0,.6)';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }

  // TNT 引信闪烁
  if (b.plugin && b.plugin.fuse > 0) {
    const blink = Math.sin(performance.now() * 0.03) > 0;
    ctx.globalAlpha = blink ? 0.7 : 0.15;
    ctx.fillStyle = '#fff2a0';
    if (b.circleRadius) {
      ctx.beginPath();
      ctx.arc(b.position.x, b.position.y, b.circleRadius, 0, TAU);
      ctx.fill();
    } else {
      const verts = b.vertices;
      ctx.beginPath();
      ctx.moveTo(verts[0].x, verts[0].y);
      for (let i = 1; i < verts.length; i++) ctx.lineTo(verts[i].x, verts[i].y);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

function drawHighlight(b) {
  ctx.strokeStyle = '#66d9ff';
  ctx.lineWidth = 3 / camera.zoom;
  ctx.shadowColor = '#66d9ff';
  ctx.shadowBlur = 12;
  if (b.circleRadius) {
    ctx.beginPath();
    ctx.arc(b.position.x, b.position.y, b.circleRadius + 3 / camera.zoom, 0, TAU);
    ctx.stroke();
  } else {
    const verts = b.vertices;
    ctx.beginPath();
    ctx.moveTo(verts[0].x, verts[0].y);
    for (let i = 1; i < verts.length; i++) ctx.lineTo(verts[i].x, verts[i].y);
    ctx.closePath();
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
}

function drawParticles(particles) {
  let lastColor = null;
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const a = 1 - p.life / p.maxLife;
    if (a <= 0) continue;
    ctx.globalAlpha = a;
    if (p.color !== lastColor) {
      ctx.fillStyle = p.color;
      lastColor = p.color;
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (0.4 + a * 0.6), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawDebug() {
  ctx.lineWidth = 1 / camera.zoom;

  ctx.strokeStyle = 'rgba(0,255,160,.4)';
  ctx.beginPath();
  const bodies = Composite.allBodies(world);
  for (const b of bodies) {
    if (b.label === 'rd-anchor') continue;
    const verts = b.vertices;
    if (!verts || verts.length < 2) continue;
    ctx.moveTo(verts[0].x, verts[0].y);
    for (let i = 1; i < verts.length; i++) ctx.lineTo(verts[i].x, verts[i].y);
    ctx.closePath();
  }
  ctx.stroke();

  // 速度矢量
  ctx.strokeStyle = 'rgba(255,120,80,.9)';
  ctx.lineWidth = 2 / camera.zoom;
  ctx.beginPath();
  for (const b of bodies) {
    if (b.isStatic) continue;
    ctx.moveTo(b.position.x, b.position.y);
    ctx.lineTo(b.position.x + b.velocity.x * 8, b.position.y + b.velocity.y * 8);
  }
  ctx.stroke();

  // 锚点
  ctx.fillStyle = 'rgba(0,220,255,.9)';
  for (const rd of state.ragdolls) {
    if (!rd.alive || !rd.anchor) continue;
    ctx.beginPath();
    ctx.arc(rd.anchor.position.x, rd.anchor.position.y, 6, 0, TAU);
    ctx.fill();
  }
}

/* =========================================================================
   输入
   ========================================================================= */
const pointers = new Map();
let pinchPrev = null;
let longPressTimer = null;
let didLongPress = false;
let dragConstraint = null;
let dragRagdoll = null;
let dragBody = null;

function pickBody(wx, wy) {
  const bodies = Composite.allBodies(world);
  for (let i = bodies.length - 1; i >= 0; i--) {
    const b = bodies[i];
    if (b.isStatic || b.isSensor) continue;
    if (b.label === 'rd-anchor') continue;
    if (b.circleRadius) {
      const dx = wx - b.position.x, dy = wy - b.position.y;
      if (dx * dx + dy * dy <= b.circleRadius * b.circleRadius) return b;
    } else if (Vertices.contains(b.vertices, { x: wx, y: wy })) {
      return b;
    }
  }
  return null;
}

function spawnAt(wx, wy) {
  const tool = state.tool;
  const mat = state.material;

  switch (tool) {
    case 'box':   addBox(wx, wy, 52, 52, mat, { chamfer: 4 }); break;
    case 'ball':  addCircle(wx, wy, 26, mat); break;
    case 'tri':   addPoly(wx, wy, 3, 38, mat); break;
    case 'hex':   addPoly(wx, wy, 6, 32, mat); break;
    case 'ragdoll': makeRagdoll(wx, wy); break;
    case 'tnt': {
      const b = addBox(wx, wy, 46, 46, 'tnt', { chamfer: 4 });
      b.label = 'tnt';
      break;
    }
    case 'gun':   fireBullet(wx, wy); break;
    case 'blade': fireBlade(wx, wy); break;
    case 'bomb': {
      const b = addCircle(wx, wy, 20, 'metal');
      b.render.fillStyle = '#3a3f4d';
      b.render.strokeStyle = '#1e222c';
      b.label = 'tnt';
      b.plugin = { fuse: 1.2 };
      break;
    }
  }
  enforceBodyLimit();
}

function enforceBodyLimit() {
  const bodies = Composite.allBodies(world);
  let dyn = 0;
  for (const b of bodies) if (!b.isStatic && !b.isSensor) dyn++;
  if (dyn <= MAX_BODIES) return;

  let remove = dyn - MAX_BODIES;
  const killedGroups = new Set();

  for (const b of bodies) {
    if (remove <= 0) break;
    if (b.isStatic || b.isSensor) continue;
    if (b === state.selected) continue;
    if (state.drag && dragBody === b) continue;

    if (b.ragdoll) {
      if (killedGroups.has(b.ragdoll.id)) continue;
      killedGroups.add(b.ragdoll.id);
      removeRagdoll(b.ragdoll);
      remove -= 6;
    } else {
      Composite.remove(world, b);
      remove--;
    }
  }
}

function handleSingleDown(p) {
  const w = screenToWorld(p.x, p.y);

  if (INSTANT_TOOLS[state.tool]) {
    p.fired = true;
    if (state.tool === 'gun') fireBullet(w.x, w.y);
    else fireBlade(w.x, w.y);
    enforceBodyLimit();
    return;
  }

  if (state.tool === 'delete') return;

  const hit = pickBody(w.x, w.y);
  if (!hit) return;

  state.selected = hit;
  Body.setStatic(hit, false);
  Matter.Sleeping.set(hit, false);

  const local = Vector.rotate(
    Vector.sub({ x: w.x, y: w.y }, hit.position),
    -hit.angle
  );

  dragConstraint = Constraint.create({
    pointA: { x: w.x, y: w.y },
    bodyB: hit,
    pointB: local,
    length: 0,
    stiffness: 0.35,
    damping: 0.25,
    render: { visible: false },
  });
  Composite.add(world, dragConstraint);
  dragBody = hit;

  // 布娃娃：拖拽时用 dragTarget 拉动锚点
  if (hit.ragdoll && hit.ragdoll.alive) {
    dragRagdoll = hit.ragdoll;
    dragRagdoll.dragTarget = { x: w.x, y: w.y };
  } else {
    dragRagdoll = null;
  }
}

function onPointerDown(e) {
  if (quickmenu.classList.contains('show')) {
    hideQuickMenu();
    if (e.cancelable) e.preventDefault();
    return;
  }
  if (canvas.setPointerCapture) {
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  }

  const p = {
    x: e.clientX, y: e.clientY,
    sx: e.clientX, sy: e.clientY,
    moved: false, fired: false,
    t0: performance.now(),
  };
  pointers.set(e.pointerId, p);
  didLongPress = false;

  if (pointers.size === 1) {
    handleSingleDown(p);
    clearTimeout(longPressTimer);
    longPressTimer = setTimeout(() => {
      if (!p.moved && pointers.size === 1 && !dragConstraint) {
        didLongPress = true;
        showQuickMenu(p.x, p.y);
      }
    }, 520);
  } else if (pointers.size >= 2) {
    clearTimeout(longPressTimer);
    clearDrag();
    pinchPrev = null;
  }
}

function onPointerMove(e) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;

  if (Math.hypot(e.clientX - p.sx, e.clientY - p.sy) > 8) {
    if (!p.moved) { p.moved = true; clearTimeout(longPressTimer); }
  }

  if (pointers.size >= 2) { updatePinch(); return; }

  if (dragConstraint) {
    const w = screenToWorld(e.clientX, e.clientY);
    dragConstraint.pointA.x = w.x;
    dragConstraint.pointA.y = w.y;
    if (dragRagdoll) {
      dragRagdoll.dragTarget = { x: w.x, y: w.y };
    }
  } else if (p.moved) {
    camera.x -= dx / camera.zoom;
    camera.y -= dy / camera.zoom;
  }
}

function onPointerUp(e) {
  const p = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  clearTimeout(longPressTimer);
  if (!p) return;

  if (pointers.size === 0) {
    const dt = performance.now() - p.t0;
    const isTap = !p.moved && dt < 320;
    if (isTap && !didLongPress && !p.fired) handleTap(p.sx, p.sy);
    clearDrag();
    pinchPrev = null;
    if (!didLongPress) hideQuickMenu();
  } else if (pointers.size === 1) {
    pinchPrev = null;
  }
}

function clearDrag() {
  if (dragConstraint) {
    Composite.remove(world, dragConstraint);
    dragConstraint = null;
  }
  if (dragRagdoll) {
    dragRagdoll.dragTarget = null;
    dragRagdoll = null;
  }
  dragBody = null;
}

function handleTap(sx, sy) {
  const w = screenToWorld(sx, sy);

  if (state.tool === 'delete') {
    const hit = pickBody(w.x, w.y);
    if (hit) {
      if (hit.ragdoll) removeRagdoll(hit.ragdoll);
      else {
        spawnParticles(hit.position.x, hit.position.y, 6, {
          colors: [hit.render.fillStyle, hit.render.strokeStyle, '#ffffff'],
          spdMin: 40, spdMax: 220, lifeMin: 0.15, lifeMax: 0.5,
          sizeMin: 1.5, sizeMax: 4,
        });
        Composite.remove(world, hit);
      }
      if (state.selected === hit) state.selected = null;
    }
    return;
  }

  const hit = pickBody(w.x, w.y);
  if (hit) {
    state.selected = hit;
    Matter.Sleeping.set(hit, false);
    // 点 TNT 点燃
    if (hit.label === 'tnt' && (!hit.plugin || !hit.plugin.fuse)) {
      hit.plugin = hit.plugin || {};
      hit.plugin.fuse = 0.35;
    }
    return;
  }

  state.selected = null;
  if (state.tool === 'hand') return;
  spawnAt(w.x, w.y);
}

function updatePinch() {
  const pts = [];
  for (const p of pointers.values()) pts.push(p);
  if (pts.length < 2) return;
  const a = pts[0], b = pts[1];
  const dist = Math.hypot(a.x - b.x, a.y - b.y);
  const cx = (a.x + b.x) / 2;
  const cy = (a.y + b.y) / 2;

  if (!pinchPrev) { pinchPrev = { dist, cx, cy }; return; }

  const wxp = (cx - VW / 2) / camera.zoom + camera.x;
  const wyp = (cy - VH / 2) / camera.zoom + camera.y;

  const scale = dist / (pinchPrev.dist || dist);
  camera.zoom = clamp(camera.zoom * scale, 0.15, 5);

  camera.x = wxp - (cx - VW / 2) / camera.zoom;
  camera.y = wyp - (cy - VH / 2) / camera.zoom;

  camera.x -= (cx - pinchPrev.cx) / camera.zoom;
  camera.y -= (cy - pinchPrev.cy) / camera.zoom;

  pinchPrev = { dist, cx, cy };
}

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const wxp = (e.clientX - VW / 2) / camera.zoom + camera.x;
  const wyp = (e.clientY - VH / 2) / camera.zoom + camera.y;
  const factor = Math.exp(-e.deltaY * 0.0014);
  camera.zoom = clamp(camera.zoom * factor, 0.15, 5);
  camera.x = wxp - (e.clientX - VW / 2) / camera.zoom;
  camera.y = wyp - (e.clientY - VH / 2) / camera.zoom;
}, { passive: false });

canvas.addEventListener('pointerdown', onPointerDown);
canvas.addEventListener('pointermove', onPointerMove);
canvas.addEventListener('pointerup', onPointerUp);
canvas.addEventListener('pointercancel', onPointerUp);
canvas.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());
document.addEventListener('touchmove', e => {
  if (e.target === canvas) e.preventDefault();
}, { passive: false });
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

/* =========================================================================
   长按快捷菜单
   ========================================================================= */
const quickmenu = document.getElementById('quickmenu');

const QUICK_ITEMS = [
  { tool: 'box',     icon: 'box',     label: '方块' },
  { tool: 'ball',    icon: 'ball',    label: '圆球' },
  { tool: 'tri',     icon: 'tri',     label: '三角' },
  { tool: 'hex',     icon: 'hex',     label: '六边' },
  { tool: 'ragdoll', icon: 'ragdoll', label: '布娃娃' },
  { tool: 'tnt',     icon: 'tnt',     label: 'TNT' },
  { tool: 'gun',     icon: 'gun',     label: '手枪' },
  { tool: 'blade',   icon: 'blade',   label: '飞刀' },
  { tool: 'bomb',    icon: 'bomb',    label: '炸弹' },
  { tool: 'delete',  icon: 'delete',  label: '删除' },
];

let quickMenuWorldPos = null;

function showQuickMenu(sx, sy) {
  quickmenu.innerHTML = '';
  quickMenuWorldPos = screenToWorld(sx, sy);

  for (const item of QUICK_ITEMS) {
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.innerHTML = makeSvg(item.icon, 22, 1.8) + `<span class="lbl">${item.label}</span>`;
    btn.addEventListener('pointerdown', (ev) => {
      ev.stopPropagation();
      ev.preventDefault();
      state.tool = item.tool;
      updateToolUI();
      hideQuickMenu();
      if (quickMenuWorldPos && !INSTANT_TOOLS[item.tool] && item.tool !== 'delete') {
        spawnAt(quickMenuWorldPos.x, quickMenuWorldPos.y);
      }
      quickMenuWorldPos = null;
    }, { passive: false });
    quickmenu.appendChild(btn);
  }

  quickmenu.style.left = '-9999px';
  quickmenu.style.top = '-9999px';
  quickmenu.classList.add('show');

  const mw = quickmenu.offsetWidth || 220;
  const mh = quickmenu.offsetHeight || 220;
  const left = clamp(sx, mw / 2 + 10, Math.max(mw / 2 + 10, VW - mw / 2 - 10));
  const top  = clamp(sy, mh / 2 + 10, Math.max(mh / 2 + 10, VH - mh / 2 - 10));
  quickmenu.style.left = left + 'px';
  quickmenu.style.top = top + 'px';

  if (navigator.vibrate) navigator.vibrate(12);
}

function hideQuickMenu() {
  quickmenu.classList.remove('show');
  quickMenuWorldPos = null;
}

/* =========================================================================
   UI
   ========================================================================= */
const toastEl = document.getElementById('toast');
const statsEl = document.getElementById('stats');
let toastTimer = null;
let lastStatsText = '';

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1200);
}

const toolButtons = Array.from(document.querySelectorAll('#bottombar .tool'));

function updateToolUI() {
  for (const btn of toolButtons) {
    btn.classList.toggle('active', btn.dataset.tool === state.tool);
  }
}

toolButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    state.tool = btn.dataset.tool;
    updateToolUI();
    hideQuickMenu();
  });
});

document.querySelectorAll('#topbar .btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const act = btn.dataset.act;
    switch (act) {
      case 'mat': {
        const i = MAT_KEYS.indexOf(state.material);
        state.material = MAT_KEYS[(i + 1) % MAT_KEYS.length];
        updateMatUI();
        toast('材质：' + MATERIALS[state.material].name);
        break;
      }
      case 'pause':
        state.paused = !state.paused;
        btn.classList.toggle('active', state.paused);
        btn.innerHTML = makeSvg(state.paused ? 'play' : 'pause');
        toast(state.paused ? '已暂停' : '继续');
        break;
      case 'slow': {
        const scales = [1, 0.4, 0.15];
        const idx = scales.indexOf(state.timeScale);
        state.timeScale = scales[(idx + 1) % scales.length];
        btn.classList.toggle('active', state.timeScale !== 1);
        toast('时间流速 ' + Math.round(state.timeScale * 100) + '%');
        break;
      }
      case 'debug':
        state.debug = !state.debug;
        btn.classList.toggle('active', state.debug);
        toast(state.debug ? '调试模式开' : '调试模式关');
        break;
      case 'full': toggleFullscreen(); break;
      case 'reset':
        buildScene();
        toast('场景已重置');
        break;
      case 'clear':
        Composite.clear(world, false, true);
        state.ragdolls.length = 0;
        state.particles.length = 0;
        state.shockwaves.length = 0;
        state.selected = null;
        clearDrag();
        toast('已清空');
        break;
    }
  });
});

function updateMatUI() {
  const m = MATERIALS[state.material];
  const dot = document.getElementById('matDot');
  if (dot) dot.style.background = m.color;
}

function toggleFullscreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement) {
    (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el).catch(() => {});
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || (() => {})).call(document);
  }
}

/* =========================================================================
   主循环
   ========================================================================= */
let lastTime = performance.now();
let accumulator = 0;
let fpsAcc = 0, fpsFrames = 0;
const FIXED_DT = 1000 / 60;

function loop(now) {
  requestAnimationFrame(loop);

  const rawDt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  fpsAcc += rawDt; fpsFrames++;
  if (fpsAcc >= 0.4) {
    state.fps = Math.round(fpsFrames / fpsAcc);
    fpsAcc = 0; fpsFrames = 0;
  }

  if (!state.paused) {
    const scaled = rawDt * state.timeScale;
    accumulator += scaled * 1000;

    let steps = 0;
    const maxSteps = state.timeScale < 0.5 ? 5 : 3;
    while (accumulator >= FIXED_DT && steps < maxSteps) {
      Engine.update(engine, FIXED_DT);
      accumulator -= FIXED_DT;
      steps++;
    }
    if (steps >= maxSteps) accumulator = 0;

    updateParticles(scaled);
  }

  const bodyCount = Composite.allBodies(world).length;
  const statsText =
    `FPS <b>${state.fps}</b> · 物体 <b>${bodyCount}</b> · 缩放 <b>${Math.round(camera.zoom * 100)}%</b>`;
  if (statsText !== lastStatsText) {
    statsEl.innerHTML = statsText;
    lastStatsText = statsText;
  }

  render();
}

/* =========================================================================
   启动
   ========================================================================= */
function init() {
  resize();

  document.querySelectorAll('[data-icon]').forEach(el => {
    el.innerHTML = makeSvg(el.dataset.icon, 22, 1.8);
  });

  const btnMat = document.getElementById('btnMat');
  btnMat.innerHTML = makeSvg('mat', 22, 1.8) + '<span class="matdot" id="matDot"></span>';

  buildScene();
  updateMatUI();
  updateToolUI();

  let resizePending = false;
  const onResize = () => {
    if (resizePending) return;
    resizePending = true;
    requestAnimationFrame(() => {
      resizePending = false;
      resize();
    });
  };
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => {
    setTimeout(onResize, 120);
    setTimeout(onResize, 400);
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize);
  }

  document.getElementById('hint').textContent = IS_MOBILE
    ? '单指拖拽物体 · 双指缩放/平移 · 长按呼出菜单'
    : '左键拖拽物体 · 空白拖拽平移 · 滚轮缩放 · 点按空白生成';

  requestAnimationFrame(loop);
}

init();
</script>
