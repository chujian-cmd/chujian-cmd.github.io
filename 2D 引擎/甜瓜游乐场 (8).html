<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1319">
<title>物理沙盒 · Rapier Ragdoll</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#0f1319;
    touch-action:none;user-select:none;-webkit-user-select:none;
    overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    position:fixed;inset:0;
  }
  canvas{display:block;width:100%;height:100%;touch-action:none;}

  #hud{
    position:fixed;
    top:calc(env(safe-area-inset-top,0px) + 8px);
    left:calc(env(safe-area-inset-left,0px) + 10px);
    color:#7f8ea3;font-size:12px;line-height:1.5;
    pointer-events:none;font-variant-numeric:tabular-nums;
    text-shadow:0 1px 3px #000;z-index:5;
  }
  #hud b{color:#c9d6e8;font-weight:600;}

  #topbar{
    position:fixed;
    top:calc(env(safe-area-inset-top,0px) + 8px);
    right:calc(env(safe-area-inset-right,0px) + 8px);
    display:flex;gap:6px;z-index:20;
    max-width:calc(100vw - 100px);
    flex-wrap:wrap;justify-content:flex-end;
  }

  #bottombar{
    position:fixed;
    bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
    left:calc(env(safe-area-inset-left,0px) + 8px);
    right:calc(env(safe-area-inset-right,0px) + 8px);
    display:flex;gap:6px;z-index:20;
    overflow-x:auto;overflow-y:hidden;
    padding:6px;border-radius:16px;
    background:rgba(18,22,30,.72);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.07);
    box-shadow:0 6px 24px rgba(0,0,0,.45);
    scrollbar-width:none;flex-wrap:nowrap;
    -webkit-overflow-scrolling:touch;
  }
  #bottombar::-webkit-scrollbar{display:none;}
  #bottombar .btn:first-child{margin-left:auto;}
  #bottombar .btn:last-child{margin-right:auto;}

  .btn{
    flex:0 0 auto;min-width:46px;height:46px;
    border:none;border-radius:12px;
    background:rgba(255,255,255,.07);color:#d4deec;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:background .12s,transform .08s,box-shadow .12s;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;position:relative;padding:0 8px;
  }
  .btn:active{transform:scale(.92);}
  .btn.active{
    background:linear-gradient(180deg,#3d8bfd,#2563eb);color:#fff;
    box-shadow:0 0 0 2px rgba(96,165,250,.35),0 4px 14px rgba(37,99,235,.45);
  }
  .btn.warn.active{background:linear-gradient(180deg,#f87171,#dc2626);box-shadow:0 0 0 2px rgba(248,113,113,.35);}
  .btn svg{display:block;pointer-events:none;}

  .matdot{
    position:absolute;bottom:5px;right:5px;
    width:10px;height:10px;border-radius:50%;
    border:1.5px solid rgba(0,0,0,.55);
    box-shadow:0 0 0 1px rgba(255,255,255,.14);
    pointer-events:none;transition:background .2s;
  }

  #quickmenu{
    position:fixed;z-index:40;display:none;
    padding:8px;border-radius:16px;
    background:rgba(20,26,36,.94);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 10px 40px rgba(0,0,0,.6);
    grid-template-columns:repeat(3,1fr);gap:6px;
    transform:translate(-50%,-50%);visibility:hidden;
  }
  #quickmenu.show{display:grid;visibility:visible;}
  #quickmenu .btn{min-width:58px;height:58px;flex-direction:column;gap:3px;padding:4px;}
  #quickmenu .lbl{font-size:9px;opacity:.72;line-height:1;letter-spacing:.3px;}

  #toast{
    position:fixed;left:50%;
    bottom:calc(env(safe-area-inset-bottom,0px) + 74px);
    transform:translateX(-50%);
    background:rgba(0,0,0,.78);color:#e6edf7;
    padding:8px 16px;border-radius:20px;font-size:13px;
    pointer-events:none;opacity:0;transition:opacity .25s;
    z-index:50;white-space:nowrap;
  }
  #toast.show{opacity:1;}

  #loading{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0f1319;color:#7f8ea3;font-size:14px;z-index:100;
    flex-direction:column;gap:10px;
  }
  #loading.hide{display:none;}

  @media (max-width:420px){
    .btn{min-width:44px;height:44px;}
    #topbar{gap:4px;}
    #quickmenu .btn{min-width:54px;height:54px;}
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="loading">
  <div>正在加载 Rapier 物理引擎…</div>
</div>

<div id="hud">
  <div id="stats">FPS -- · 物体 0 · 缩放 100%</div>
  <div id="hint" style="opacity:.7;font-size:11px"></div>
</div>

<div id="topbar">
  <button class="btn" data-act="mat" id="btnMat" title="材质"></button>
  <button class="btn" data-act="pause" data-icon="pause" title="暂停"></button>
  <button class="btn" data-act="slow" data-icon="slow" title="慢动作"></button>
  <button class="btn" data-act="debug" data-icon="debug" title="调试"></button>
  <button class="btn" data-act="full" data-icon="full" title="全屏"></button>
  <button class="btn" data-act="reset" data-icon="reset" title="重置"></button>
  <button class="btn warn" data-act="clear" data-icon="clear" title="清空"></button>
</div>

<div id="bottombar">
  <button class="btn tool active" data-tool="hand" data-icon="hand" title="拖拽"></button>
  <button class="btn tool" data-tool="box" data-icon="box" title="方块"></button>
  <button class="btn tool" data-tool="ball" data-icon="ball" title="圆球"></button>
  <button class="btn tool" data-tool="tri" data-icon="tri" title="三角"></button>
  <button class="btn tool" data-tool="hex" data-icon="hex" title="六边形"></button>
  <button class="btn tool" data-tool="ragdoll" data-icon="ragdoll" title="布娃娃"></button>
  <button class="btn tool" data-tool="tnt" data-icon="tnt" title="TNT"></button>
  <button class="btn tool" data-tool="gun" data-icon="gun" title="手枪"></button>
  <button class="btn tool" data-tool="blade" data-icon="blade" title="飞刀"></button>
  <button class="btn tool" data-tool="bomb" data-icon="bomb" title="炸弹"></button>
  <button class="btn tool warn" data-tool="delete" data-icon="delete" title="删除"></button>
</div>

<div id="quickmenu"></div>
<div id="toast"></div>

<script type="module">
import RAPIER from 'https://esm.sh/@dimforge/rapier2d-compat@0.12.0';

/* =========================================================================
   0. 基础工具
   ========================================================================= */
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent)
              || (window.matchMedia && window.matchMedia('(pointer:coarse)').matches);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const rand = (a, b) => a + Math.random() * (b - a);

/* =========================================================================
   0.5  SVG 图标
   ========================================================================= */
const ICONS = {
  hand: '<path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>',
  box: '<rect x="4" y="4" width="16" height="16" rx="2.5"/>',
  ball: '<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="9" ry="3.6"/><ellipse cx="12" cy="12" rx="3.6" ry="9"/>',
  tri: '<path d="M12 4.5 20.5 19.5h-17z"/>',
  hex: '<path d="M12 3 20.5 7.8v8.4L12 21 3.5 16.2V7.8z"/>',
  ragdoll: '<circle cx="12" cy="4.2" r="2.5"/><path d="M12 6.7v6"/><path d="M12 8.2 7.8 11M12 8.2l4.2 2.8"/><path d="M12 12.7 8.8 19.5M12 12.7l3.2 6.8"/>',
  tnt: '<rect x="4" y="7.5" width="16" height="12.5" rx="2"/><path d="M12 7.5V3.5"/><path d="M9.5 3.5h5"/><path d="M7.5 12h9"/><path d="M7.5 15.5h5"/>',
  gun: '<path d="M3 8h14v3h4v2h-7l-2 6h-3l2-6H3z"/>',
  blade: '<path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/>',
  bomb: '<circle cx="10.5" cy="14.5" r="6.5"/><path d="M14.8 10.2 18 7"/><path d="M18 7c0-1.6 1-2.6 2.6-2.6"/><circle cx="20.6" cy="4.4" r="1.1" fill="currentColor" stroke="none"/>',
  delete: '<path d="M6 6l12 12M18 6 6 18"/>',
  pause: '<rect x="6" y="4" width="4" height="16" rx="1.2"/><rect x="14" y="4" width="4" height="16" rx="1.2"/>',
  play: '<path d="M7 4.5 20 12 7 19.5z" fill="currentColor" stroke="none"/>',
  slow: '<path d="M7 3h10"/><path d="M7 21h10"/><path d="M8.5 3c0 4 3.5 5 3.5 9s-3.5 5-3.5 9"/><path d="M15.5 3c0 4-3.5 5-3.5 9s3.5 5 3.5 9"/>',
  debug: '<circle cx="12" cy="13" r="5.5"/><path d="M12 7.5V4.5"/><path d="M7.8 9.8 4.8 8.3"/><path d="M16.2 9.8l3-1.5"/><path d="M7.8 16.2l-3 1.5"/><path d="M16.2 16.2l3 1.5"/><path d="M9.6 8.2 8.2 5.3"/><path d="M14.4 8.2l1.4-2.9"/>',
  full: '<path d="M4 9.5V4h5.5"/><path d="M20 9.5V4h-5.5"/><path d="M4 14.5V20h5.5"/><path d="M20 14.5V20h-5.5"/>',
  reset: '<path d="M20.5 12a8.5 8.5 0 1 1-2.7-6.2"/><path d="M21 4v5h-5"/>',
  clear: '<path d="M4 7h16"/><path d="M9.5 7V4.2h5V7"/><path d="M6.6 7l1 13h8.8l1-13"/><path d="M10.5 11v5.5"/><path d="M13.5 11v5.5"/>',
  mat: '<path d="M12 21.5a9.5 9.5 0 1 1 0-19c5.2 0 9.5 3.8 9.5 8.5 0 2.6-2.1 4.2-4.2 4.2h-2.1a2.1 2.1 0 0 0-1.6 3.5c.3.4.5.9.5 1.3 0 .8-.8 1.5-2.1 1.5z"/><circle cx="7.5" cy="12" r="1.15" fill="currentColor" stroke="none"/><circle cx="9.8" cy="8.3" r="1.15" fill="currentColor" stroke="none"/><circle cx="14" cy="7.3" r="1.15" fill="currentColor" stroke="none"/><circle cx="17.3" cy="10" r="1.15" fill="currentColor" stroke="none"/>',
};
function makeSvg(name, size = 22, sw = 1.8) {
  const inner = ICONS[name] || '';
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}

/* =========================================================================
   1. 几何工具
   ========================================================================= */
function boxVerts(w, h) {
  return [
    { x: -w/2, y: -h/2 }, { x: w/2, y: -h/2 },
    { x: w/2, y: h/2 }, { x: -w/2, y: h/2 },
  ];
}
function ngonVerts(r, sides, phase = 0) {
  const out = [];
  for (let i = 0; i < sides; i++) {
    const a = phase + (i / sides) * TAU;
    out.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
  }
  return out;
}
function vertsToFlat(verts) {
  const out = new Float32Array(verts.length * 2);
  for (let i = 0; i < verts.length; i++) {
    out[i*2] = verts[i].x;
    out[i*2+1] = verts[i].y;
  }
  return out;
}
function pointInPoly(p, verts) {
  let sign = 0;
  const n = verts.length;
  for (let i = 0; i < n; i++) {
    const a = verts[i], b = verts[(i+1) % n];
    const c = (b.x - a.x) * (p.y - a.y) - (b.y - a.y) * (p.x - a.x);
    if (c > 1e-9) { if (sign < 0) return false; sign = 1; }
    else if (c < -1e-9) { if (sign > 0) return false; sign = -1; }
  }
  return true;
}

/* =========================================================================
   2. 材质表
   ========================================================================= */
const MATERIALS = {
  wood:   { name: '木头', density: 0.0012, restitution: 0.25, friction: 0.62, color: '#b5793a', color2: '#7e4d1e' },
  metal:  { name: '金属', density: 0.0040, restitution: 0.14, friction: 0.45, color: '#9aa7b8', color2: '#5f6c7e' },
  ice:    { name: '冰块', density: 0.0015, restitution: 0.10, friction: 0.05, color: '#a9e7ff', color2: '#5fb6e0' },
  rubber: { name: '橡胶', density: 0.0017, restitution: 0.88, friction: 0.92, color: '#50536a', color2: '#2f3140' },
  stone:  { name: '石头', density: 0.0033, restitution: 0.09, friction: 0.72, color: '#8d8d95', color2: '#5c5c66' },
  tnt:    { name: 'TNT',  density: 0.0020, restitution: 0.20, friction: 0.55, color: '#e34b3b', color2: '#8f2418' },
  flesh:  { name: '肉体', density: 0.0016, restitution: 0.18, friction: 0.70, color: '#e8b98f', color2: '#c08a5c' },
  bullet: { name: '子弹', density: 0.0100, restitution: 0.20, friction: 0.30, color: '#ffe08a', color2: '#c9a13a' },
};
const MAT_KEYS = ['wood', 'metal', 'ice', 'rubber', 'stone'];

/* =========================================================================
   3. Rapier 初始化
   ========================================================================= */
await RAPIER.init();

const rapierWorld = new RAPIER.World({ x: 0, y: 1500 });
rapierWorld.timestep = 1 / 60;
const eventQueue = new RAPIER.EventQueue(true);

/* =========================================================================
   4. Body 包装器
   ========================================================================= */
let _bodyId = 0;
const bodies = [];              // 所有活着的 Body 实例
const bodyByCollider = new Map(); // collider.handle -> Body

class Body {
  constructor(o = {}) {
    this.id = _bodyId++;
    this.shape = o.shape || 'poly';
    this.tag = o.tag || 'body';
    this.material = o.material || 'stone';
    this.color = o.color || '#8b93a5';
    this.color2 = o.color2 || null;
    this.dead = false;
    this.fuse = -1;
    this.noShatter = !!o.noShatter;

    // —— 布娃娃状态 ——
    this.poseActive = false;
    this.poseTarget = null;
    this.ragdollGroup = null;

    // —— 创建 Rapier 刚体 ——
    const bd = o.isStatic ? RAPIER.RigidBodyDesc.fixed() : RAPIER.RigidBodyDesc.dynamic();
    bd.setTranslation(o.x || 0, o.y || 0);
    if (o.angle) bd.setRotation(o.angle);
    bd.setCcdEnabled(o.tag === 'bullet' || o.tag === 'blade');
    this.rb = rapierWorld.createRigidBody(bd);

    // —— 创建碰撞体 ——
    let cd;
    if (this.shape === 'circle') {
      this.radius = o.radius || 20;
      cd = RAPIER.ColliderDesc.circle(this.radius);
      this.localVerts = null;
      this.worldVerts = null;
      this.boundRadius = this.radius;
    } else {
      this.localVerts = o.verts.map(v => ({ x: v.x, y: v.y }));
      this.worldVerts = this.localVerts.map(() => ({ x: 0, y: 0 }));
      const flat = vertsToFlat(this.localVerts);
      cd = RAPIER.ColliderDesc.convexHull(flat);
      let br = 0;
      for (const v of this.localVerts) br = Math.max(br, Math.hypot(v.x, v.y));
      this.boundRadius = br;
    }
    cd.setDensity(o.density ?? 0.0016);
    cd.setRestitution(o.restitution ?? 0.2);
    cd.setFriction(o.friction ?? 0.5);
    cd.setActiveEvents(RAPIER.ActiveEvents.COLLISION_EVENTS);
    this.collider = rapierWorld.createCollider(cd, this.rb);

    // 碰撞体分组：所有布娃娃零件共用同一个组，可以互相碰撞（Rapier 的关节本身就会处理大部分穿透问题）
    // 若想彻底禁止肢体互撞，可以在此设置 setCollisionGroups

    bodyByCollider.set(this.collider.handle, this);

    // —— 渲染缓存 ——
    this.pos = { x: o.x || 0, y: o.y || 0 };
    this.vel = { x: 0, y: 0 };
    this.angle = o.angle || 0;
    this.angVel = 0;

    bodies.push(this);
  }

  sync() {
    const t = this.rb.translation();
    const v = this.rb.linvel();
    this.pos.x = t.x;
    this.pos.y = t.y;
    this.angle = this.rb.rotation();
    this.vel.x = v.x;
    this.vel.y = v.y;
    this.angVel = this.rb.angvel();

    if (this.shape === 'poly' && this.worldVerts) {
      const c = Math.cos(this.angle), s = Math.sin(this.angle);
      const lv = this.localVerts, wv = this.worldVerts;
      const px = this.pos.x, py = this.pos.y;
      for (let i = 0; i < lv.length; i++) {
        wv[i].x = px + lv[i].x * c - lv[i].y * s;
        wv[i].y = py + lv[i].x * s + lv[i].y * c;
      }
    }
  }

  containsPoint(px, py) {
    if (this.shape === 'circle') {
      const dx = px - this.pos.x, dy = py - this.pos.y;
      return dx*dx + dy*dy <= this.radius * this.radius;
    }
    return pointInPoly({ x: px, y: py }, this.worldVerts);
  }

  kill() {
    if (this.dead) return;
    this.dead = true;
    bodyByCollider.delete(this.collider.handle);
    try { rapierWorld.removeRigidBody(this.rb); } catch (_) {}
  }
}

/* =========================================================================
   5. 布娃娃：用关节连接的多个刚体
   ========================================================================= */
const ragdollGroups = [];

function makeRagdoll(cx, cy) {
  const flesh = MATERIALS.flesh;
  const mkPart = (opts) => new Body(Object.assign({
    density: flesh.density,
    restitution: flesh.restitution,
    friction: flesh.friction,
    color: flesh.color,
    color2: flesh.color2,
    material: 'flesh',
    tag: 'ragdoll',
  }, opts));

  // 尺寸参数（左右对称）
  const headR = 13;
  const torsoW = 30, torsoH = 46;
  const armW = 9,  armH = 36;
  const legW = 11, legH = 40;

  // 相对生成点的局部坐标（以躯干中心为原点）
  const torsoY = -22;

  const head  = mkPart({ shape: 'circle', x: cx,               y: cy + torsoY - torsoH/2 - headR + 2, radius: headR });
  const torso = mkPart({ shape: 'poly',   x: cx,               y: cy + torsoY, verts: boxVerts(torsoW, torsoH) });
  const armL  = mkPart({ shape: 'poly',   x: cx - torsoW/2 - 7, y: cy + torsoY - 4, verts: boxVerts(armW, armH) });
  const armR  = mkPart({ shape: 'poly',   x: cx + torsoW/2 + 7, y: cy + torsoY - 4, verts: boxVerts(armW, armH) });
  const legL  = mkPart({ shape: 'poly',   x: cx - torsoW/2 + 5, y: cy + torsoY + torsoH/2 + legH/2 + 2, verts: boxVerts(legW, legH) });
  const legR  = mkPart({ shape: 'poly',   x: cx + torsoW/2 - 5, y: cy + torsoY + torsoH/2 + legH/2 + 2, verts: boxVerts(legW, legH) });

  // 创建旋转关节（Revolute Joint）——2D 版的球形关节
  const mkJoint = (a, aLocal, b, bLocal) => {
    const jd = RAPIER.JointData.revolute(
      { x: aLocal.x, y: aLocal.y },
      { x: bLocal.x, y: bLocal.y }
    );
    return rapierWorld.createImpulseJoint(jd, a.rb, b.rb, true);
  };

  // 颈：头底 ↔ 躯干顶
  mkJoint(head,  { x: 0, y:  headR },          torso, { x: 0, y: -torsoH/2 });
  // 左肩：手臂顶 ↔ 躯干左侧
  mkJoint(armL,  { x: 0, y: -armH/2 + 2 },     torso, { x: -torsoW/2 + 2, y: -torsoH/2 + 8 });
  // 右肩
  mkJoint(armR,  { x: 0, y: -armH/2 + 2 },     torso, { x:  torsoW/2 - 2, y: -torsoH/2 + 8 });
  // 左髋
  mkJoint(legL,  { x: 0, y: -legH/2 + 2 },     torso, { x: -torsoW/2 + 5, y:  torsoH/2 - 2 });
  // 右髋
  mkJoint(legR,  { x: 0, y: -legH/2 + 2 },     torso, { x:  torsoW/2 - 5, y:  torsoH/2 - 2 });

  // 记录姿态目标（站立状态）
  const parts = [head, torso, armL, armR, legL, legR];
  const group = { parts, alive: true };
  for (const p of parts) {
    p.ragdollGroup = group;
    p.poseActive = true;   // 立即进入“活体”状态：PD 控制器会拉回出生姿态
    p.poseTarget = {
      x: p.pos.x,
      y: p.pos.y,
      angle: 0,
    };
  }
  ragdollGroups.push(group);
  return group;
}

function ragdollDown(group) {
  if (!group || !group.alive) return;
  group.alive = false;
  for (const p of group.parts) {
    p.poseActive = false;
    p.poseTarget = null;
  }
}

/* —— 布娃娃“活体”PD 控制 ——
   原理：每步对每个零件施加一个力和力矩，把它拉回出生姿态的目标。
   力 = mass * (Kp * 位置误差 - Kd * 速度)
   力矩 = mass * (Kpa * 角度误差 - Kda * 角速度)
   这样就实现了“软橡皮筋”式的站立效果——能被推、能滑动，但会慢慢回位。
*/
const POSE_KP  = 450;   // 位置刚度
const POSE_KD  = 32;    // 位置阻尼
const POSE_KPA = 900;   // 角度刚度
const POSE_KDA = 48;    // 角度阻尼

function driveRagdolls(dt) {
  for (const g of ragdollGroups) {
    if (!g.alive) continue;
    for (const p of g.parts) {
      if (p.dead || !p.poseActive || !p.poseTarget) continue;
      const t = p.poseTarget;
      const m = p.rb.mass();
      if (m <= 0) continue;

      const dx = t.x - p.pos.x;
      const dy = t.y - p.pos.y;
      const vx = p.vel.x;
      const vy = p.vel.y;

      const fx = (dx * POSE_KP - vx * POSE_KD) * m;
      const fy = (dy * POSE_KP - vy * POSE_KD) * m;
      p.rb.addForce({ x: fx, y: fy }, true);

      let da = t.angle - p.angle;
      while (da > Math.PI) da -= TAU;
      while (da < -Math.PI) da += TAU;
      const w = p.angVel;
      const torque = (da * POSE_KPA - w * POSE_KDA) * m;
      p.rb.addTorque(torque, true);
    }
  }
}

/* =========================================================================
   6. 世界辅助
   ========================================================================= */
const App = {
  camera: { x: 0, y: 180, zoom: 1 },
  particles: [],
  shockwaves: [],
  tool: 'hand',
  material: 'wood',
  paused: false,
  timeScale: 1,
  debug: false,
  selected: null,
  drag: null,
  groundY: 520,
  fps: 60,
};

const MAX_BODIES = IS_MOBILE ? 130 : 320;
const INSTANT_TOOLS = { gun: 1, blade: 1 };
const PARTICLE_CAP = IS_MOBILE ? 180 : 600;

/* ---------- 粒子 ---------- */
function spawnParticles(x, y, count, o = {}) {
  const colors = o.colors || ['#ffb347', '#ff7a45', '#ffd93d', '#ffffff'];
  for (let i = 0; i < count; i++) {
    if (App.particles.length >= PARTICLE_CAP) break;
    const a = o.dir !== undefined ? o.dir + rand(-0.9, 0.9) : rand(0, TAU);
    const sp = rand(o.spdMin ?? 80, o.spdMax ?? 420);
    App.particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 0,
      maxLife: rand(o.lifeMin ?? 0.3, o.lifeMax ?? 1.1),
      size: rand(o.sizeMin ?? 1.5, o.sizeMax ?? 5),
      color: colors[(Math.random() * colors.length) | 0],
      gravity: o.gravity ?? 900,
      drag: o.drag ?? 0.985,
    });
  }
}

function updateParticles(dt) {
  const ps = App.particles;
  for (let i = ps.length - 1; i >= 0; i--) {
    const p = ps[i];
    p.life += dt;
    if (p.life >= p.maxLife) { ps[i] = ps[ps.length - 1]; ps.pop(); continue; }
    p.vy += p.gravity * dt;
    p.vx *= p.drag; p.vy *= p.drag;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  for (let i = App.shockwaves.length - 1; i >= 0; i--) {
    const s = App.shockwaves[i];
    s.life += dt;
    if (s.life >= s.maxLife) { App.shockwaves.splice(i, 1); }
  }
}

/* ---------- 工厂 ---------- */
function addBox(x, y, w, h, matKey = 'wood', isStatic = false, angle = 0, tag = 'body') {
  const m = MATERIALS[matKey] || MATERIALS.stone;
  return new Body({
    shape: 'poly', x, y, angle,
    verts: boxVerts(w, h),
    isStatic, tag,
    density: m.density, restitution: m.restitution, friction: m.friction,
    color: m.color, color2: m.color2, material: matKey,
  });
}

function addCircle(x, y, r, matKey = 'wood', isStatic = false, tag = 'body') {
  const m = MATERIALS[matKey] || MATERIALS.stone;
  return new Body({
    shape: 'circle', x, y, radius: r,
    isStatic, tag,
    density: m.density, restitution: m.restitution, friction: m.friction,
    color: m.color, color2: m.color2, material: matKey,
  });
}

function addNgon(x, y, r, sides, matKey = 'wood', tag = 'body') {
  const m = MATERIALS[matKey] || MATERIALS.stone;
  return new Body({
    shape: 'poly', x, y,
    verts: ngonVerts(r, sides, -Math.PI / 2),
    tag,
    density: m.density, restitution: m.restitution, friction: m.friction,
    color: m.color, color2: m.color2, material: matKey,
  });
}

/* ---------- 爆炸 ---------- */
function explode(x, y, radius = 220, power = 1500) {
  App.shockwaves.push({ x, y, r: radius, life: 0, maxLife: 0.45 });

  for (const b of bodies) {
    if (b.dead || b.isStatic) continue;
    const dx = b.pos.x - x, dy = b.pos.y - y;
    const d = Math.hypot(dx, dy);
    if (d > radius) continue;

    if (b.tag === 'ragdoll' && b.ragdollGroup) ragdollDown(b.ragdollGroup);

    const falloff = 1 - d / radius;
    const nx = dx / (d || 1), ny = dy / (d || 1);
    const dv = falloff * power * (0.5 + 0.5 * Math.random());
    const m = b.rb.mass();
    b.rb.applyImpulse({ x: nx * dv * m * 0.001, y: ny * dv * m * 0.001 }, true);
    b.rb.applyTorqueImpulse(rand(-9, 9) * falloff * m * 0.001, true);

    if (b.tag === 'tnt' && b.fuse < 0) b.fuse = rand(0.08, 0.25);
  }

  spawnParticles(x, y, IS_MOBILE ? 22 : 46, {
    colors: ['#ffd93d', '#ff8c42', '#ff4d2e', '#ffffff', '#ffb347'],
    spdMin: 180, spdMax: 900, lifeMin: 0.25, lifeMax: 0.9,
    sizeMin: 2, sizeMax: 7, gravity: 400,
  });
  spawnParticles(x, y, IS_MOBILE ? 10 : 20, {
    colors: ['#6b6b6b', '#3a3a3a', '#9a9a9a'],
    spdMin: 40, spdMax: 260, lifeMin: 0.5, lifeMax: 1.6,
    sizeMin: 3, sizeMax: 10, gravity: -60, drag: 0.97,
  });
}

function triggerTNT(b) {
  if (b.dead) return;
  const x = b.pos.x, y = b.pos.y;
  b.kill();
  if (App.selected === b) App.selected = null;
  if (App.drag && App.drag.body === b) App.drag = null;
  explode(x, y, 240, 1600);
}

/* ---------- 场景 ---------- */
function buildScene() {
  // 清空所有刚体
  for (const b of bodies) {
    bodyByCollider.delete(b.collider.handle);
    try { rapierWorld.removeRigidBody(b.rb); } catch (_) {}
  }
  bodies.length = 0;
  ragdollGroups.length = 0;
  App.particles.length = 0;
  App.shockwaves.length = 0;
  App.selected = null;
  App.drag = null;

  const GY = App.groundY;

  const ground = addBox(0, GY + 200, 7000, 400, 'stone', true);
  ground.color = '#2b3444'; ground.color2 = '#1b2230';

  const wl = addBox(-1700, GY - 600, 160, 3000, 'stone', true);
  const wr = addBox( 1700, GY - 600, 160, 3000, 'stone', true);
  wl.color = wr.color = '#2b3444';
  wl.color2 = wr.color2 = '#1b2230';

  const p1 = addBox(-520, GY - 240, 320, 30, 'stone', true);

  for (const p of [p1, p2, p3]) { p.color = '#33405a'; p.color2 = '#20293a'; }

  addBox(700, GY - 60, 50, 50, 'tnt', false, 0, 'tnt');
  addBox(760, GY - 60, 50, 50, 'tnt', false, 0, 'tnt');

  App.camera.x = 0;
  App.camera.y = GY - 300;
  App.camera.zoom = 1;
}

/* =========================================================================
   7. 生成 / 开火
   ========================================================================= */
function enforceBodyLimit() {
  let dyn = 0;
  for (const b of bodies) if (!b.dead && !b.isStatic) dyn++;
  if (dyn <= MAX_BODIES) return;
  let remove = dyn - MAX_BODIES;
  for (const b of bodies) {
    if (remove <= 0) break;
    if (b.dead || b.isStatic) continue;
    if (b === App.selected) continue;
    if (App.drag && App.drag.body === b) continue;
    b.kill();
    remove--;
  }
}

function spawnAt(wx, wy) {
  switch (App.tool) {
    case 'box':     addBox(wx, wy, 52, 52, App.material); break;
    case 'ball':    addCircle(wx, wy, 26, App.material); break;
    case 'tri':     addNgon(wx, wy, 36, 3, App.material); break;
    case 'hex':     addNgon(wx, wy, 32, 6, App.material); break;
    case 'ragdoll': makeRagdoll(wx, wy); break;
    case 'tnt':     addBox(wx, wy, 46, 46, 'tnt', false, 0, 'tnt'); break;
    case 'gun':     fireBullet(wx, wy); break;
    case 'blade':   fireBlade(wx, wy); break;
    case 'bomb': {
      const b = addCircle(wx, wy, 20, 'metal');
      b.color = '#3a3f4d'; b.color2 = '#1e222c';
      b.tag = 'tnt'; b.fuse = 1.2; b.noShatter = true;
      break;
    }
  }
  enforceBodyLimit();
}

function fireBullet(wx, wy) {
  const cam = App.camera;
  let dx = wx - cam.x, dy = wy - cam.y;
  const l = Math.hypot(dx, dy) || 1;
  dx /= l; dy /= l;
  const b = new Body({
    shape: 'circle', x: wx, y: wy, radius: 5,
    density: MATERIALS.bullet.density,
    restitution: 0.2, friction: 0.3,
    color: '#ffe08a', color2: '#b8860b',
    tag: 'bullet', noShatter: true,
  });
  b.rb.setLinvel({ x: dx * 2000, y: dy * 2000 }, true);
}

function fireBlade(wx, wy) {
  const cam = App.camera;
  let dx = wx - cam.x, dy = wy - cam.y;
  const l = Math.hypot(dx, dy) || 1;
  dx /= l; dy /= l;
  const b = new Body({
    shape: 'poly', x: wx, y: wy,
    verts: [
      { x: -20, y: -3 }, { x: 20, y: -3 }, { x: 26, y: 0 },
      { x: 20, y: 3 }, { x: -20, y: 3 }, { x: -26, y: 0 },
    ],
    angle: Math.atan2(dy, dx),
    density: 0.005, restitution: 0.2, friction: 0.4,
    color: '#d8e2f0', color2: '#7d8da3',
    tag: 'blade', noShatter: true,
  });
  b.rb.setLinvel({ x: dx * 1500, y: dy * 1500 }, true);
  b.rb.setAngvel(22, true);
}

/* =========================================================================
   8. 碰撞事件
   ========================================================================= */
const RAGDOLL_TRIGGER_SPEED = 260;

function handleCollision(handle1, handle2, started) {
  if (!started) return;
  const A = bodyByCollider.get(handle1);
  const B = bodyByCollider.get(handle2);
  if (!A || !B) return;

  const dvx = A.vel.x - B.vel.x;
  const dvy = A.vel.y - B.vel.y;
  const speed = Math.hypot(dvx, dvy);

  // 布娃娃被撞飞 → 倒下
  if (speed > RAGDOLL_TRIGGER_SPEED) {
    if (A.tag === 'ragdoll' && A.ragdollGroup && B.tag !== 'ragdoll') ragdollDown(A.ragdollGroup);
    if (B.tag === 'ragdoll' && B.ragdollGroup && A.tag !== 'ragdoll') ragdollDown(B.ragdollGroup);
  }

  // 子弹命中
  if (A.tag === 'bullet') {
    if (!B.isStatic && B.tag === 'ragdoll' && B.ragdollGroup) ragdollDown(B.ragdollGroup);
    spawnParticles(A.pos.x, A.pos.y, 8, {
      colors: ['#ffe08a', '#ff9a3c', '#fff'],
      spdMin: 80, spdMax: 400, lifeMin: 0.15, lifeMax: 0.45, sizeMin: 1, sizeMax: 3,
    });
    A.kill();
    return;
  }
  if (B.tag === 'bullet') {
    if (!A.isStatic && A.tag === 'ragdoll' && A.ragdollGroup) ragdollDown(A.ragdollGroup);
    spawnParticles(B.pos.x, B.pos.y, 8, {
      colors: ['#ffe08a', '#ff9a3c', '#fff'],
      spdMin: 80, spdMax: 400, lifeMin: 0.15, lifeMax: 0.45, sizeMin: 1, sizeMax: 3,
    });
    B.kill();
    return;
  }

  // 飞刀命中
  if (A.tag === 'blade') {
    if (!B.isStatic && B.tag === 'ragdoll' && B.ragdollGroup) ragdollDown(B.ragdollGroup);
    spawnParticles(A.pos.x, A.pos.y, 6, {
      colors: ['#d8e2f0', '#ffffff', '#8fa8c4'],
      spdMin: 60, spdMax: 320, lifeMin: 0.15, lifeMax: 0.5, sizeMin: 1, sizeMax: 3,
    });
    return;
  }
  if (B.tag === 'blade') {
    if (!A.isStatic && A.tag === 'ragdoll' && A.ragdollGroup) ragdollDown(A.ragdollGroup);
    spawnParticles(B.pos.x, B.pos.y, 6, {
      colors: ['#d8e2f0', '#ffffff', '#8fa8c4'],
      spdMin: 60, spdMax: 320, lifeMin: 0.15, lifeMax: 0.5, sizeMin: 1, sizeMax: 3,
    });
    return;
  }
}

/* =========================================================================
   9. 渲染器
   ========================================================================= */
class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false });
    this.dpr = 1;
    this.w = 0; this.h = 0;
    this._bg = null;
    this._bgH = -1;
    this.resize();
  }

  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth;
    const h = window.innerHeight;
    const pw = Math.max(1, Math.floor(w * dpr));
    const ph = Math.max(1, Math.floor(h * dpr));
    if (this.canvas.width === pw && this.canvas.height === ph && this.dpr === dpr) return;
    this.dpr = dpr;
    this.w = w; this.h = h;
    this.canvas.width = pw;
    this.canvas.height = ph;
    this.canvas.style.width = w + 'px';
    this.canvas.style.height = h + 'px';
    this._bg = null;
  }

  render() {
    const ctx = this.ctx;
    const dpr = this.dpr;
    const W = this.w, H = this.h;
    const cam = App.camera;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (!this._bg || this._bgH !== H) {
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#131a26');
      bg.addColorStop(1, '#0b0e13');
      this._bg = bg;
      this._bgH = H;
    }
    ctx.fillStyle = this._bg;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(W/2, H/2);
    ctx.scale(cam.zoom, cam.zoom);
    ctx.translate(-cam.x, -cam.y);

    const halfW = W / 2 / cam.zoom, halfH = H / 2 / cam.zoom;
    const viewL = cam.x - halfW, viewR = cam.x + halfW;
    const viewT = cam.y - halfH, viewB = cam.y + halfH;

    this.drawGrid(ctx, viewL, viewR, viewT, viewB, cam.zoom);

    // 布娃娃的关节连线（可视化）
    ctx.lineWidth = Math.max(1, 2 / cam.zoom);
    ctx.strokeStyle = 'rgba(255,255,255,.22)';
    ctx.lineCap = 'round';
    for (const g of ragdollGroups) {
      const parts = g.parts;
      const links = [[0,1],[2,1],[3,1],[4,1],[5,1]];
      for (const [i, j] of links) {
        const a = parts[i], b = parts[j];
        if (a.dead || b.dead) continue;
        ctx.beginPath();
        ctx.moveTo(a.pos.x, a.pos.y);
        ctx.lineTo(b.pos.x, b.pos.y);
        ctx.stroke();
      }
    }

    // 物体（视口剔除）
    const pad = 24 / cam.zoom;
    for (const b of bodies) {
      if (b.dead) continue;
      const r = b.boundRadius + pad;
      if (b.pos.x + r < viewL || b.pos.x - r > viewR) continue;
      if (b.pos.y + r < viewT || b.pos.y - r > viewB) continue;
      this.drawBody(ctx, b, cam.zoom);
    }

    if (App.selected && !App.selected.dead) {
      this.drawHighlight(ctx, App.selected, cam.zoom);
    }

    if (App.drag) {
      const b = App.drag.body;
      if (!b.dead) {
        ctx.strokeStyle = 'rgba(120,200,255,.85)';
        ctx.lineWidth = 2 / cam.zoom;
        ctx.setLineDash([6 / cam.zoom, 5 / cam.zoom]);
        ctx.beginPath();
        ctx.moveTo(b.pos.x, b.pos.y);
        ctx.lineTo(App.drag.target.x, App.drag.target.y);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    this.drawParticles(ctx, App.particles);

    if (App.debug) this.drawDebug(ctx, cam.zoom);

    for (const s of App.shockwaves) {
      const t = s.life / s.maxLife;
      ctx.strokeStyle = `rgba(255,190,110,${t * 0.8})`;
      ctx.lineWidth = (2 + 8 * t) / cam.zoom;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * (1 - t) + 8, 0, TAU);
      ctx.stroke();
    }

    ctx.restore();
  }

  drawGrid(ctx, L, R, T, B, zoom) {
    let step = 100;
    while (step * zoom < 40) step *= 2;
    while (step * zoom > 220) step /= 2;
    ctx.lineWidth = 1 / zoom;
    ctx.strokeStyle = 'rgba(255,255,255,.035)';
    ctx.beginPath();
    const x0 = Math.floor(L / step) * step;
    const y0 = Math.floor(T / step) * step;
    for (let x = x0; x <= R; x += step) { ctx.moveTo(x, T); ctx.lineTo(x, B); }
    for (let y = y0; y <= B; y += step) { ctx.moveTo(L, y); ctx.lineTo(R, y); }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(90,140,200,.13)';
    ctx.lineWidth = 2 / zoom;
    ctx.beginPath();
    ctx.moveTo(L, 0); ctx.lineTo(R, 0);
    ctx.moveTo(0, T); ctx.lineTo(0, B);
    ctx.stroke();
  }

  drawBody(ctx, b, zoom) {
    const lw = Math.max(1, 2 / zoom);
    ctx.lineWidth = lw;
    ctx.strokeStyle = b.color2 || 'rgba(0,0,0,.55)';
    ctx.fillStyle = b.color;

    // 活体布娃娃的绿色微光
    if (b.poseActive) {
      ctx.shadowColor = 'rgba(120, 255, 160, 0.55)';
      ctx.shadowBlur = 10;
    }

    if (b.shape === 'circle') {
      const r = b.radius;
      ctx.beginPath();
      ctx.arc(b.pos.x, b.pos.y, r, 0, TAU);
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;
      // 眼睛（布娃娃头部）
      if (b.tag === 'ragdoll' && r > 10) {
        ctx.fillStyle = 'rgba(0,0,0,.45)';
        ctx.beginPath();
        ctx.arc(b.pos.x - r*0.35, b.pos.y - r*0.1, Math.max(1, r*0.13), 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(b.pos.x + r*0.35, b.pos.y - r*0.1, Math.max(1, r*0.13), 0, TAU);
        ctx.fill();
      }
    } else {
      const vs = b.worldVerts;
      const m = vs.length;
      if (!vs || m < 3) return;
      ctx.beginPath();
      ctx.moveTo(vs[0].x, vs[0].y);
      for (let i = 1; i < m; i++) ctx.lineTo(vs[i].x, vs[i].y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    if (b.fuse > 0) {
      const blink = Math.sin(performance.now() * 0.03) > 0;
      ctx.globalAlpha = blink ? 0.72 : 0.18;
      ctx.fillStyle = '#fff2a0';
      if (b.shape === 'circle') {
        ctx.beginPath(); ctx.arc(b.pos.x, b.pos.y, b.radius, 0, TAU); ctx.fill();
      } else {
        const vs = b.worldVerts;
        ctx.beginPath();
        ctx.moveTo(vs[0].x, vs[0].y);
        for (let i = 1; i < vs.length; i++) ctx.lineTo(vs[i].x, vs[i].y);
        ctx.closePath(); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  drawHighlight(ctx, b, zoom) {
    ctx.strokeStyle = '#66d9ff';
    ctx.lineWidth = 3 / zoom;
    ctx.shadowColor = '#66d9ff';
    ctx.shadowBlur = 12;
    if (b.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(b.pos.x, b.pos.y, b.radius + 3 / zoom, 0, TAU);
      ctx.stroke();
    } else {
      const vs = b.worldVerts;
      ctx.beginPath();
      ctx.moveTo(vs[0].x, vs[0].y);
      for (let i = 1; i < vs.length; i++) ctx.lineTo(vs[i].x, vs[i].y);
      ctx.closePath();
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }

  drawParticles(ctx, particles) {
    let lastColor = null;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const a = 1 - p.life / p.maxLife;
      if (a <= 0) continue;
      ctx.globalAlpha = a;
      if (p.color !== lastColor) { ctx.fillStyle = p.color; lastColor = p.color; }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (0.4 + a * 0.6), 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  drawDebug(ctx, zoom) {
    ctx.lineWidth = 1 / zoom;
    // 布娃娃目标位置
    ctx.fillStyle = 'rgba(0,220,255,.9)';
    const dotR = 3 / zoom;
    for (const g of ragdollGroups) {
      if (!g.alive) continue;
      for (const p of g.parts) {
        if (!p.poseActive || !p.poseTarget) continue;
        ctx.beginPath();
        ctx.arc(p.poseTarget.x, p.poseTarget.y, dotR * 1.2, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,220,255,.3)';
        ctx.lineWidth = 1 / zoom;
        ctx.beginPath();
        ctx.moveTo(p.pos.x, p.pos.y);
        ctx.lineTo(p.poseTarget.x, p.poseTarget.y);
        ctx.stroke();
      }
    }
  }
}

/* =========================================================================
   10. 输入系统
   ========================================================================= */
const canvas = document.getElementById('cv');
const quickmenu = document.getElementById('quickmenu');

const pointers = new Map();
let pinchPrev = null;
let longPressTimer = null;
let didLongPress = false;

function screenToWorld(sx, sy) {
  const cam = App.camera;
  const W = window.innerWidth, H = window.innerHeight;
  return {
    x: (sx - W/2) / cam.zoom + cam.x,
    y: (sy - H/2) / cam.zoom + cam.y,
  };
}

function pickBody(wx, wy) {
  for (let i = bodies.length - 1; i >= 0; i--) {
    const b = bodies[i];
    if (b.dead || b.isStatic) continue;
    if (b.containsPoint(wx, wy)) return b;
  }
  return null;
}

function onPointerDown(e) {
  if (quickmenu.classList.contains('show')) {
    hideQuickMenu();
    if (e.cancelable) e.preventDefault();
    return;
  }
  if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (_) {} }

  const p = {
    x: e.clientX, y: e.clientY,
    sx: e.clientX, sy: e.clientY,
    down: true, moved: false, fired: false,
    t0: performance.now(),
  };
  pointers.set(e.pointerId, p);
  didLongPress = false;

  if (pointers.size === 1) {
    const w = screenToWorld(p.x, p.y);
    if (INSTANT_TOOLS[App.tool]) {
      p.fired = true;
      if (App.tool === 'gun') fireBullet(w.x, w.y);
      else fireBlade(w.x, w.y);
      enforceBodyLimit();
    } else {
      const hit = pickBody(w.x, w.y);
      if (hit && App.tool !== 'delete') {
        App.selected = hit;
        App.drag = { body: hit, target: { x: w.x, y: w.y } };
      } else {
        App.drag = null;
      }
    }
    clearTimeout(longPressTimer);
    longPressTimer = setTimeout(() => {
      if (!p.moved && pointers.size === 1 && !App.drag) {
        didLongPress = true;
        showQuickMenu(p.x, p.y);
      }
    }, 520);
  } else if (pointers.size >= 2) {
    clearTimeout(longPressTimer);
    App.drag = null;
    pinchPrev = null;
  }
}

function onPointerMove(e) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (Math.hypot(e.clientX - p.sx, e.clientY - p.sy) > 8) {
    if (!p.moved) { p.moved = true; clearTimeout(longPressTimer); }
  }

  if (pointers.size >= 2) { updatePinch(); return; }

  if (App.drag) {
    App.drag.target = screenToWorld(e.clientX, e.clientY);
  } else if (p.moved) {
    const cam = App.camera;
    cam.x -= dx / cam.zoom;
    cam.y -= dy / cam.zoom;
  }
}

function onPointerUp(e) {
  const p = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  clearTimeout(longPressTimer);
  if (!p) return;

  if (pointers.size === 0) {
    const dt = performance.now() - p.t0;
    const isTap = !p.moved && dt < 320;
    if (isTap && !didLongPress && !p.fired) handleTap(p.sx, p.sy);
    App.drag = null;
    pinchPrev = null;
    if (!didLongPress) hideQuickMenu();
  } else if (pointers.size === 1) {
    pinchPrev = null;
  }
}

function handleTap(sx, sy) {
  const w = screenToWorld(sx, sy);

  if (App.tool === 'delete') {
    const hit = pickBody(w.x, w.y);
    if (hit) {
      hit.kill();
      if (App.selected === hit) App.selected = null;
      if (App.drag && App.drag.body === hit) App.drag = null;
      spawnParticles(hit.pos.x, hit.pos.y, 6, {
        colors: [hit.color, hit.color2 || '#333333', '#ffffff'],
        spdMin: 40, spdMax: 220, lifeMin: 0.15, lifeMax: 0.5,
        sizeMin: 1.5, sizeMax: 4,
      });
    }
    return;
  }

  const hit = pickBody(w.x, w.y);
  if (hit) {
    App.selected = hit;
    if (hit.tag === 'tnt' && hit.fuse < 0 && hit.material === 'tnt') {
      hit.fuse = 0.35;
    }
    return;
  }
  App.selected = null;
  if (App.tool === 'hand') return;
  spawnAt(w.x, w.y);
}

function updatePinch() {
  const pts = [...pointers.values()];
  if (pts.length < 2) return;
  const [a, b] = pts;
  const dist = Math.hypot(a.x - b.x, a.y - b.y);
  const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
  if (!pinchPrev) { pinchPrev = { dist, cx, cy }; return; }

  const cam = App.camera;
  const W = window.innerWidth, H = window.innerHeight;
  const wxp = (cx - W/2) / cam.zoom + cam.x;
  const wyp = (cy - H/2) / cam.zoom + cam.y;
  const scale = dist / (pinchPrev.dist || dist);
  cam.zoom = clamp(cam.zoom * scale, 0.15, 5);
  cam.x = wxp - (cx - W/2) / cam.zoom;
  cam.y = wyp - (cy - H/2) / cam.zoom;
  cam.x -= (cx - pinchPrev.cx) / cam.zoom;
  cam.y -= (cy - pinchPrev.cy) / cam.zoom;
  pinchPrev = { dist, cx, cy };
}

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const cam = App.camera;
  const W = window.innerWidth, H = window.innerHeight;
  const wxp = (e.clientX - W/2) / cam.zoom + cam.x;
  const wyp = (e.clientY - H/2) / cam.zoom + cam.y;
  const factor = Math.exp(-e.deltaY * 0.0014);
  cam.zoom = clamp(cam.zoom * factor, 0.15, 5);
  cam.x = wxp - (e.clientX - W/2) / cam.zoom;
  cam.y = wyp - (e.clientY - H/2) / cam.zoom;
}, { passive: false });

canvas.addEventListener('pointerdown', onPointerDown);
canvas.addEventListener('pointermove', onPointerMove);
canvas.addEventListener('pointerup', onPointerUp);
canvas.addEventListener('pointercancel', onPointerUp);
canvas.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.target === canvas) e.preventDefault(); }, { passive: false });
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

/* =========================================================================
   11. 长按快捷菜单
   ========================================================================= */
const QUICK_ITEMS = [
  { tool: 'box',     icon: 'box',     label: '方块' },
  { tool: 'ball',    icon: 'ball',    label: '圆球' },
  { tool: 'tri',     icon: 'tri',     label: '三角' },
  { tool: 'hex',     icon: 'hex',     label: '六边' },
  { tool: 'ragdoll', icon: 'ragdoll', label: '布娃娃' },
  { tool: 'tnt',     icon: 'tnt',     label: 'TNT' },
  { tool: 'gun',     icon: 'gun',     label: '手枪' },
  { tool: 'blade',   icon: 'blade',   label: '飞刀' },
  { tool: 'bomb',    icon: 'bomb',    label: '炸弹' },
  { tool: 'delete',  icon: 'delete',  label: '删除' },
];
let quickMenuWorldPos = null;

function showQuickMenu(sx, sy) {
  quickmenu.innerHTML = '';
  quickMenuWorldPos = screenToWorld(sx, sy);
  for (const item of QUICK_ITEMS) {
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.innerHTML = makeSvg(item.icon, 22, 1.8) + `<span class="lbl">${item.label}</span>`;
    btn.addEventListener('pointerdown', (ev) => {
      ev.stopPropagation(); ev.preventDefault();
      App.tool = item.tool;
      updateToolUI();
      hideQuickMenu();
      if (quickMenuWorldPos && !INSTANT_TOOLS[item.tool] && item.tool !== 'delete') {
        spawnAt(quickMenuWorldPos.x, quickMenuWorldPos.y);
      }
      quickMenuWorldPos = null;
    }, { passive: false });
    quickmenu.appendChild(btn);
  }
  quickmenu.style.left = '-9999px';
  quickmenu.style.top = '-9999px';
  quickmenu.classList.add('show');
  const mw = quickmenu.offsetWidth || 220;
  const mh = quickmenu.offsetHeight || 220;
  const vw = window.innerWidth, vh = window.innerHeight;
  const left = clamp(sx, mw/2 + 10, Math.max(mw/2 + 10, vw - mw/2 - 10));
  const top  = clamp(sy, mh/2 + 10, Math.max(mh/2 + 10, vh - mh/2 - 10));
  quickmenu.style.left = left + 'px';
  quickmenu.style.top = top + 'px';
  if (navigator.vibrate) navigator.vibrate(12);
}
function hideQuickMenu() {
  quickmenu.classList.remove('show');
  quickMenuWorldPos = null;
}

/* =========================================================================
   12. UI 绑定
   ========================================================================= */
const toastEl = document.getElementById('toast');
const statsEl = document.getElementById('stats');
let toastTimer = null;
let lastStatsText = '';

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1200);
}

const toolButtons = Array.from(document.querySelectorAll('#bottombar .tool'));
function updateToolUI() {
  for (const btn of toolButtons) btn.classList.toggle('active', btn.dataset.tool === App.tool);
}
toolButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    App.tool = btn.dataset.tool;
    updateToolUI();
    hideQuickMenu();
  });
});

document.querySelectorAll('#topbar .btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const act = btn.dataset.act;
    switch (act) {
      case 'mat': {
        const i = MAT_KEYS.indexOf(App.material);
        App.material = MAT_KEYS[(i + 1) % MAT_KEYS.length];
        updateMatUI();
        toast('材质：' + MATERIALS[App.material].name);
        break;
      }
      case 'pause':
        App.paused = !App.paused;
        btn.classList.toggle('active', App.paused);
        btn.innerHTML = makeSvg(App.paused ? 'play' : 'pause');
        toast(App.paused ? '已暂停' : '继续');
        break;
      case 'slow': {
        const scales = [1, 0.4, 0.15];
        const idx = scales.indexOf(App.timeScale);
        App.timeScale = scales[(idx + 1) % scales.length];
        btn.classList.toggle('active', App.timeScale !== 1);
        toast('时间流速 ' + Math.round(App.timeScale * 100) + '%');
        break;
      }
      case 'debug':
        App.debug = !App.debug;
        btn.classList.toggle('active', App.debug);
        toast(App.debug ? '调试模式开' : '调试模式关');
        break;
      case 'full': toggleFullscreen(); break;
      case 'reset': buildScene(); toast('场景已重置'); break;
      case 'clear':
        for (const b of bodies) {
          bodyByCollider.delete(b.collider.handle);
          try { rapierWorld.removeRigidBody(b.rb); } catch (_) {}
        }
        bodies.length = 0;
        ragdollGroups.length = 0;
        App.particles.length = 0;
        App.shockwaves.length = 0;
        App.selected = null;
        App.drag = null;
        toast('已清空');
        break;
    }
  });
});

function updateMatUI() {
  const m = MATERIALS[App.material];
  const dot = document.getElementById('matDot');
  if (dot) dot.style.background = m.color;
}

function toggleFullscreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement) {
    (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el).catch(() => {});
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || (() => {})).call(document);
  }
}

/* =========================================================================
   13. 主循环
   ========================================================================= */
const FIXED_DT = 1 / 60;
let accumulator = 0;
let lastTime = performance.now();
let fpsAcc = 0, fpsFrames = 0;

function updateDrag() {
  if (!App.drag) return;
  const b = App.drag.body;
  if (b.dead) { App.drag = null; return; }
  const dx = App.drag.target.x - b.pos.x;
  const dy = App.drag.target.y - b.pos.y;
  const K = 18;
  b.rb.setLinvel({ x: dx * K, y: dy * K }, true);
  b.rb.setAngvel(b.angVel * 0.9, true);
}

function updateFuses(dt) {
  for (const b of bodies) {
    if (b.dead) continue;
    if (b.fuse > 0) {
      b.fuse -= dt;
      if (b.fuse <= 0) { b.fuse = -1; triggerTNT(b); }
    }
  }
}

function loop(now) {
  requestAnimationFrame(loop);

  const rawDt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  fpsAcc += rawDt; fpsFrames++;
  if (fpsAcc >= 0.4) {
    App.fps = Math.round(fpsFrames / fpsAcc);
    fpsAcc = 0; fpsFrames = 0;
  }

  if (!App.paused) {
    updateDrag();

    const scaled = rawDt * App.timeScale;

    // 驱动活体布娃娃（每帧施加 PD 力，Rapier 内部会积分）
    driveRagdolls(scaled);

    accumulator += scaled;
    let steps = 0;
    const maxSteps = App.timeScale < 0.5 ? 6 : 4;
    while (accumulator >= FIXED_DT && steps < maxSteps) {
      rapierWorld.step(eventQueue);
      eventQueue.drainCollisionEvents((h1, h2, started) => handleCollision(h1, h2, started));
      updateFuses(FIXED_DT);
      accumulator -= FIXED_DT;
      steps++;
    }
    if (steps >= maxSteps) accumulator = 0;

    // 同步 Body 缓存
    for (const b of bodies) if (!b.dead) b.sync();

    updateParticles(scaled);
    enforceBodyLimit();
  }

  // 统计
  let count = 0;
  for (const b of bodies) if (!b.dead) count++;
  const statsText = `FPS <b>${App.fps}</b> · 物体 <b>${count}</b> · 缩放 <b>${Math.round(App.camera.zoom * 100)}%</b>`;
  if (statsText !== lastStatsText) {
    statsEl.innerHTML = statsText;
    lastStatsText = statsText;
  }

  App.renderer.render();
}

/* =========================================================================
   14. 启动
   ========================================================================= */
function init() {
  App.renderer = new Renderer(canvas);

  document.querySelectorAll('[data-icon]').forEach(el => {
    el.innerHTML = makeSvg(el.dataset.icon, 22, 1.8);
  });
  const btnMat = document.getElementById('btnMat');
  btnMat.innerHTML = makeSvg('mat', 22, 1.8) + '<span class="matdot" id="matDot"></span>';

  buildScene();
  updateMatUI();
  updateToolUI();

  let resizePending = false;
  const onResize = () => {
    if (resizePending) return;
    resizePending = true;
    requestAnimationFrame(() => {
      resizePending = false;
      App.renderer.resize();
    });
  };
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => {
    setTimeout(onResize, 120);
    setTimeout(onResize, 400);
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize);
  }

  document.getElementById('hint').textContent = IS_MOBILE
    ? '单指拖拽物体 · 双指缩放/平移 · 长按呼出菜单'
    : '左键拖拽物体 · 空白拖拽平移 · 滚轮缩放 · 点按空白生成';

  document.getElementById('loading').classList.add('hide');
  requestAnimationFrame(loop);
}

init();
</script>
