<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>井字棋 · 白底黑盘 · 黑线动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        .game-container {
            background: white;
            border-radius: 2rem;
            padding: 2rem 2.5rem 2.5rem 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #eaeaea;
            position: relative;
        }

        h1 {
            font-weight: 500;
            font-size: 2rem;
            letter-spacing: 2px;
            color: #111;
            margin-bottom: 1.2rem;
            text-transform: uppercase;
            background: white;
            padding: 0 0.5rem;
            border-bottom: 2px solid #ccc;
            padding-bottom: 0.3rem;
        }

        .board-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 1.8rem;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 6px;
            background-color: black;
            border: 6px solid black;
            border-radius: 12px;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.1);
        }

        #winCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .cell {
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 5rem;
            font-weight: 600;
            line-height: 1;
            color: black;
            transition: background-color 0.1s ease;
            cursor: pointer;
            user-select: none;
            border-radius: 4px;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            outline: none; /* 移除聚焦轮廓 */
            -webkit-tap-highlight-color: transparent; /* 移除移动端点击高亮 */
        }

        /* 移除所有可能的聚焦蓝框 */
        .cell:focus,
        .cell:focus-visible,
        .cell:active {
            outline: none;
            box-shadow: none;
        }

        .cell.filled {
            cursor: default;
        }

        .cell:not(.filled):hover {
            background-color: #f2f2f2;
        }

        /* 落子符号的入场动画 */
        .cell .mark {
            display: inline-block;
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .status {
            font-size: 1.5rem;
            font-weight: 400;
            color: #222;
            background: white;
            padding: 0.6rem 1.8rem;
            border-radius: 40px;
            border: 2px solid #ddd;
            margin-bottom: 1.5rem;
            min-height: 4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 0 #eee;
            transition: all 0.3s ease;
        }

        .status.win {
            border-color: #000;
            font-weight: 600;
            color: #000;
            background: #f8f8f8;
            animation: statusPulse 0.5s ease;
        }

        @keyframes statusPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        .reset-btn {
            background: black;
            color: white;
            border: none;
            font-size: 1.3rem;
            font-weight: 500;
            padding: 0.8rem 2.8rem;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: background 0.2s, transform 0.1s;
            border: 2px solid black;
            box-shadow: 0 4px 0 #333;
            font-family: inherit;
            outline: none;
        }

        /* 移除按钮的聚焦蓝框 */
        .reset-btn:focus,
        .reset-btn:focus-visible {
            outline: none;
        }

        .reset-btn:hover {
            background: #1a1a1a;
        }

        .reset-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #333;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>井字棋</h1>
        <div class="board-wrapper" id="boardWrapper">
            <div class="board" id="board"></div>
            <canvas id="winCanvas"></canvas>
        </div>
        <div class="status" id="status">〇 的回合</div>
        <button class="reset-btn" id="resetBtn">重开一局</button>
    </div>

    <script>
        (function() {
            let boardState = ['', '', '', '', '', '', '', '', ''];
            let currentPlayer = '〇';
            const PLAYER_O = '〇';
            const PLAYER_X = 'X';
            let gameActive = true;

            const boardElement = document.getElementById('board');
            const statusElement = document.getElementById('status');
            const canvas = document.getElementById('winCanvas');
            const ctx = canvas.getContext('2d');
            const boardWrapper = document.getElementById('boardWrapper');

            const winPatterns = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];

            let currentWinPattern = null;
            let animFrameId = null;
            let lineProgress = 0;

            // ---------- 获取格子中心坐标 ----------
            function getCellCenter(index) {
                const col = index % 3;
                const row = Math.floor(index / 3);
                const borderSize = 6;
                const cellSize = 100;
                const gap = 6;
                const x = borderSize + col * (cellSize + gap) + cellSize / 2;
                const y = borderSize + row * (cellSize + gap) + cellSize / 2;
                return { x, y };
            }

            // ---------- 调整画布尺寸 ----------
            function resizeCanvas() {
                const rect = boardWrapper.getBoundingClientRect();
                const width = rect.width;
                const height = rect.height;
                if (width > 0 && height > 0) {
                    canvas.width = width;
                    canvas.height = height;
                }
                if (currentWinPattern && !animFrameId) {
                    drawStaticLine();
                }
            }

            // ---------- 绘制完整的线（静态，黑色） ----------
            function drawStaticLine() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (!currentWinPattern) return;

                const [a, , c] = currentWinPattern;
                const start = getCellCenter(a);
                const end = getCellCenter(c);

                ctx.beginPath();
                ctx.strokeStyle = '#000000'; // 黑色线条
                ctx.lineWidth = 10;
                ctx.lineCap = 'round';
                ctx.moveTo(start.x, start.y);
                ctx.lineTo(end.x, end.y);
                ctx.stroke();
            }

            // ---------- 动画绘制获胜线（黑色） ----------
            function animateWinLine() {
                if (animFrameId) {
                    cancelAnimationFrame(animFrameId);
                    animFrameId = null;
                }
                if (!currentWinPattern) return;

                const [a, , c] = currentWinPattern;
                const start = getCellCenter(a);
                const end = getCellCenter(c);

                const duration = 450;
                const startTime = performance.now();
                lineProgress = 0;

                function step(now) {
                    const elapsed = now - startTime;
                    let t = Math.min(elapsed / duration, 1);
                    const eased = t * (2 - t);
                    lineProgress = eased;

                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    if (currentWinPattern) {
                        const [p1, , p3] = currentWinPattern;
                        const s = getCellCenter(p1);
                        const e = getCellCenter(p3);

                        const curX = s.x + (e.x - s.x) * lineProgress;
                        const curY = s.y + (e.y - s.y) * lineProgress;

                        ctx.beginPath();
                        ctx.strokeStyle = '#000000'; // 黑色线条
                        ctx.lineWidth = 10;
                        ctx.lineCap = 'round';
                        ctx.moveTo(s.x, s.y);
                        ctx.lineTo(curX, curY);
                        ctx.stroke();
                    }

                    if (t < 1) {
                        animFrameId = requestAnimationFrame(step);
                    } else {
                        animFrameId = null;
                        drawStaticLine();
                    }
                }

                animFrameId = requestAnimationFrame(step);
            }

            // ---------- 清除画布 ----------
            function clearCanvas() {
                if (animFrameId) {
                    cancelAnimationFrame(animFrameId);
                    animFrameId = null;
                }
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            // ---------- 渲染棋盘 ----------
            function renderBoard() {
                boardElement.innerHTML = '';
                for (let i = 0; i < 9; i++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.index = i;
                    const mark = boardState[i];
                    if (mark !== '') {
                        const span = document.createElement('span');
                        span.className = 'mark';
                        span.textContent = mark;
                        cell.appendChild(span);
                        cell.classList.add('filled');
                    }
                    cell.addEventListener('click', cellClickHandler);
                    boardElement.appendChild(cell);
                }
                resizeCanvas();
            }

            // ---------- 点击处理 ----------
            function cellClickHandler(e) {
                const cell = e.currentTarget;
                const index = parseInt(cell.dataset.index, 10);

                if (!gameActive || boardState[index] !== '') {
                    return;
                }

                boardState[index] = currentPlayer;
                cell.textContent = '';
                const span = document.createElement('span');
                span.className = 'mark';
                span.textContent = currentPlayer;
                cell.appendChild(span);
                cell.classList.add('filled');

                const winInfo = checkGameResult();
                if (winInfo) {
                    gameActive = false;
                    if (winInfo.result === 'win') {
                        currentWinPattern = winInfo.pattern;
                        statusElement.textContent = `${currentPlayer} 获胜！`;
                        statusElement.classList.add('win');
                        animateWinLine();
                    } else if (winInfo.result === 'draw') {
                        statusElement.textContent = '平局！';
                        statusElement.classList.add('win');
                        currentWinPattern = null;
                        clearCanvas();
                    }
                    return;
                }

                currentPlayer = (currentPlayer === PLAYER_O) ? PLAYER_X : PLAYER_O;
                updateStatusTurn();
            }

            function updateStatusTurn() {
                if (!gameActive) return;
                statusElement.textContent = `${currentPlayer} 的回合`;
                statusElement.classList.remove('win');
            }

            // ---------- 检查结果 ----------
            function checkGameResult() {
                for (let pattern of winPatterns) {
                    const [a, b, c] = pattern;
                    if (boardState[a] !== '' && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                        return { result: 'win', pattern: pattern };
                    }
                }
                if (boardState.every(cell => cell !== '')) {
                    return { result: 'draw' };
                }
                return null;
            }

            // ---------- 重置 ----------
            function resetGame() {
                boardState = ['', '', '', '', '', '', '', '', ''];
                currentPlayer = PLAYER_O;
                gameActive = true;
                currentWinPattern = null;

                statusElement.classList.remove('win');
                statusElement.textContent = `${currentPlayer} 的回合`;

                clearCanvas();
                renderBoard();
            }

            // ---------- 初始化 ----------
            function initGame() {
                renderBoard();
                statusElement.textContent = `${currentPlayer} 的回合`;
                document.getElementById('resetBtn').addEventListener('click', resetGame);
                window.addEventListener('resize', () => {
                    resizeCanvas();
                });
            }

            initGame();
        })();
    </script>
</body>
</html>
