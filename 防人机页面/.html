<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>防人机 · 滑块验证</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #f6f9fc 0%, #e9f1f8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      width: 100%;
      max-width: 460px;
      border-radius: 42px;
      padding: 2rem 1.8rem 2.2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 
                  inset 0 1px 2px rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: all 0.2s;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2rem;
    }

    .shield-icon {
      background: #1a3b5c;
      width: 48px;
      height: 48px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 18px -6px rgba(26, 59, 92, 0.4);
    }

    .shield-icon svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: #c7e0ff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .title-block h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #0a1e2f;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .title-block p {
      font-size: 0.85rem;
      color: #4b5e6e;
      margin-top: 4px;
      font-weight: 450;
    }

    .instruction {
      background: #eef4fa;
      border-radius: 100px;
      padding: 0.6rem 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1.8rem;
      border: 1px solid #cdddee;
      font-size: 0.9rem;
      color: #1f3b53;
      font-weight: 500;
    }

    .instruction svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #1f5e9c;
      stroke-width: 2.2;
    }

    .slider-section {
      margin-bottom: 1.5rem;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #3f5669;
      letter-spacing: 0.02em;
      padding: 0 2px;
    }

    .slider-label span:last-child {
      color: #2680c2;
      background: #deecfa;
      padding: 2px 10px;
      border-radius: 50px;
    }

    .slider-track-container {
      position: relative;
      height: 58px;
      background: #e2ebf3;
      border-radius: 60px;
      box-shadow: inset 0 4px 8px rgba(0, 20, 30, 0.08), 
                  inset 0 -2px 4px rgba(255, 255, 255, 0.7);
      border: 1px solid #c2d6e8;
      margin-bottom: 0.5rem;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .slider-track-container.success {
      border-color: #2e9a5e;
      box-shadow: 0 0 0 2px rgba(46, 154, 94, 0.2), inset 0 4px 8px rgba(0, 50, 20, 0.08);
    }

    .slider-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #b6d9ff, #8fc2f0);
      border-radius: 60px;
      transition: width 0.1s ease-out;
      box-shadow: 0 0 12px rgba(70, 140, 220, 0.4);
    }

    .slider-fill.success {
      background: linear-gradient(90deg, #88d4a4, #5bb87b);
    }

    .slider-thumb {
      position: absolute;
      top: 5px;
      left: 5px;
      width: 48px;
      height: 48px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.02);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      user-select: none;
      transition: transform 0.05s, box-shadow 0.2s;
      z-index: 5;
      touch-action: none;
    }

    .slider-thumb:active {
      cursor: grabbing;
      transform: scale(0.97);
      box-shadow: 0 10px 18px rgba(0, 0, 0, 0.2);
    }

    .slider-thumb svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: #1e4870;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .slider-thumb.success svg {
      stroke: #1b7b43;
    }

    .slider-thumb.dragging {
      cursor: grabbing;
    }

    .status-message {
      text-align: center;
      font-size: 0.9rem;
      font-weight: 500;
      margin: 1rem 0 1.4rem;
      min-height: 2.4rem;
      padding: 0.6rem 1rem;
      border-radius: 50px;
      background: #f4f9fe;
      color: #1f496e;
      border: 1px solid #cde0f0;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-message.success {
      background: #e2f3e8;
      border-color: #9fd6b4;
      color: #1b6b3b;
    }

    .status-message.error {
      background: #ffeae9;
      border-color: #ffb3b0;
      color: #b12a2a;
    }

    .reset-button {
      background: white;
      border: 1px solid #ccddee;
      padding: 0.8rem 1.4rem;
      border-radius: 50px;
      font-weight: 550;
      font-size: 0.9rem;
      color: #1e3c59;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
      margin-top: 0.6rem;
      border-color: #c1d4e8;
    }

    .reset-button:hover {
      background: #f2f9ff;
      border-color: #a5c0da;
      box-shadow: 0 6px 12px rgba(34, 80, 130, 0.08);
    }

    .reset-button:active {
      transform: scale(0.98);
      background: #e6f0fa;
    }

    .reset-button svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #2a577c;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .footer-note {
      text-align: center;
      margin-top: 1.4rem;
      font-size: 0.72rem;
      color: #8199aa;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      letter-spacing: 0.2px;
    }

    .footer-note svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: #8199aa;
      stroke-width: 2;
    }

    .no-select {
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body>
  <div class="card no-select">
    <div class="header">
      <div class="shield-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 3L4 7v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V7l-8-4z" />
          <path d="M8 12l2.5 2.5L16 9" />
        </svg>
      </div>
      <div class="title-block">
        <h1>防人机验证</h1>
        <p>拖动滑块到最右侧完成验证</p>
      </div>
    </div>

    <div class="instruction">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 8v5M12 16h.01" stroke-linecap="round" />
      </svg>
      <span>请用鼠标/手指拖动滑块</span>
    </div>

    <div class="slider-section">
      <div class="slider-label">
        <span>滑块验证</span>
        <span id="progressPercent">0%</span>
      </div>

      <!-- 滑块轨道 -->
      <div id="trackContainer" class="slider-track-container">
        <div id="sliderFill" class="slider-fill"></div>
        <!-- 可拖动滑块 -->
        <div id="thumb" class="slider-thumb">
          <svg viewBox="0 0 24 24">
            <path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
      </div>
    </div>

    <!-- 状态反馈 -->
    <div id="statusMessage" class="status-message">
      ⏳ 等待拖动滑块...
    </div>

    <!-- 重置按钮 -->
    <button id="resetBtn" class="reset-button">
      <svg viewBox="0 0 24 24">
        <path d="M1 4v6h6M23 20v-6h-6" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      重新验证
    </button>

    <div class="footer-note">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="11" width="18" height="11" rx="2" stroke-linecap="round" />
        <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke-linecap="round" />
      </svg>
      安全 · 人机识别
    </div>
  </div>

  <script>
    (function() {
      // ---------- DOM 元素 ----------
      const track = document.getElementById('trackContainer');
      const thumb = document.getElementById('thumb');
      const fill = document.getElementById('sliderFill');
      const statusDiv = document.getElementById('statusMessage');
      const progressSpan = document.getElementById('progressPercent');
      const resetBtn = document.getElementById('resetBtn');

      // ---------- 常量与状态 ----------
      const THUMB_WIDTH = 48;          // 滑块宽度
      const PADDING = 5;              // 滑块距离轨道左右边距 (thumb 默认 left:5px)
      // 最大可移动距离 = 轨道宽度 - 滑块宽度 - 左右内边距 (5px+5px)
      let maxMove = 0;

      let isDragging = false;
      let startX = 0;                // 鼠标/触摸开始时的 clientX
      let currentLeft = PADDING;     // 当前滑块 left 值 (px)
      let verified = false;          // 是否已验证通过

      // 用于计算最大移动距离 (在每次尺寸变化时更新)
      function updateMaxMove() {
        const trackWidth = track.clientWidth;
        // 最大 left 位置 = 轨道宽度 - 滑块宽度 - 右侧内边距 (5px) - 左侧内边距(但左边从5开始)
        // left 最小值 = 5, 最大值 = trackWidth - THUMB_WIDTH - 5
        // 可移动范围 = (trackWidth - THUMB_WIDTH - 5) - 5 = trackWidth - THUMB_WIDTH - 10
        maxMove = trackWidth - THUMB_WIDTH - 10;
        if (maxMove < 0) maxMove = 0;   // 极小屏幕保护
        // 如果滑块当前 left 超出范围，重新调整
        if (currentLeft > maxMove + PADDING) {
          currentLeft = maxMove + PADDING;
        }
        if (currentLeft < PADDING) {
          currentLeft = PADDING;
        }
        applyThumbLeft(currentLeft);
      }

      // 应用滑块 left 位置 (px), 同时更新填充宽度与百分比
      function applyThumbLeft(leftPx) {
        // 边界限制 (left 最小值 PADDING, 最大值 PADDING + maxMove)
        const minLeft = PADDING;
        const maxLeft = PADDING + maxMove;

        if (leftPx < minLeft) leftPx = minLeft;
        if (leftPx > maxLeft) leftPx = maxLeft;

        currentLeft = leftPx;
        thumb.style.left = leftPx + 'px';

        // 计算移动的偏移量 (从初始位置PADDING开始算)
        const moved = leftPx - PADDING;  // 0 ~ maxMove
        const percent = maxMove > 0 ? (moved / maxMove) * 100 : 0;

        // 更新填充宽度 (基于滑块移动百分比)
        fill.style.width = percent + '%';
        progressSpan.textContent = Math.round(percent) + '%';

        // 如果验证通过，滑块位置保持最右侧，填充充满100% (但保留maxMove逻辑)
        // 但若verified为true且滑块正好在右侧，可加特殊处理
        // 但拖动过程中我们会更新，不需要额外

        // 当滑块即将到达终点时，可以更新视觉提示
        if (percent >= 99.5 && !verified) {
          // 但实际验证是在mouseup时触发，这里不用修改
        }
      }

      // 重置到初始状态 (未验证)
      function resetToInitial() {
        verified = false;
        isDragging = false;
        // 移除所有成功样式
        track.classList.remove('success');
        thumb.classList.remove('success');
        fill.classList.remove('success');
        statusDiv.classList.remove('success', 'error');
        statusDiv.textContent = '⏳ 等待拖动滑块...';
        // 重置滑块位置
        applyThumbLeft(PADDING);
        // 确保填充宽度重新计算
        fill.style.width = '0%';
        progressSpan.textContent = '0%';
        // 恢复拖动光标
        thumb.style.cursor = 'grab';
      }

      // 验证成功
      function verifySuccess() {
        verified = true;
        isDragging = false;

        // 将滑块吸附到最右侧 (确保视觉上到底)
        if (maxMove > 0) {
          applyThumbLeft(PADDING + maxMove);  // 最右
        }

        // 样式反馈
        track.classList.add('success');
        thumb.classList.add('success');
        fill.classList.add('success');
        statusDiv.classList.add('success');
        statusDiv.textContent = '✅ 验证通过 · 您是真人';
        progressSpan.textContent = '100%';
        thumb.style.cursor = 'default';
      }

      // 验证失败 (未到终点)
      function verifyFail() {
        if (verified) return; // 已经成功就不处理失败

        // 回弹到起点
        applyThumbLeft(PADDING);
        fill.style.width = '0%';
        progressSpan.textContent = '0%';
        statusDiv.classList.add('error');
        statusDiv.textContent = '❌ 未拖动到最右侧，请重试';
        // 移除错误样式延迟 (但保留几秒)
        // 但为了体验，鼠标松开后错误提示保留，下一次拖动开始时会清除。
        // 这里不自动移除，等到下一次dragstart时清除。
      }

      // 清除错误状态 (用于开始拖动前)
      function clearErrorState() {
        statusDiv.classList.remove('error', 'success');
        if (!verified) {
          statusDiv.textContent = '⏳ 拖动滑块到最右侧...';
        } else {
          // 如果已经验证过，保留成功信息
          statusDiv.classList.add('success');
          statusDiv.textContent = '✅ 验证通过 · 您是真人';
        }
      }

      // ---------- 事件处理 ----------
      function onDragStart(clientX) {
        // 如果已验证成功，不允许再拖动
        if (verified) return;

        isDragging = true;
        startX = clientX;
        // 记录当前滑块left作为基准 (currentLeft已在applyThumbLeft中维护)
        // 清除可能存在的错误状态，更改提示
        clearErrorState();
        statusDiv.textContent = '🔍 拖动中...';
        thumb.classList.add('dragging');
        // 阻止默认行为（防止选中文字或图片）
        event.preventDefault && event.preventDefault();
      }

      function onDragMove(clientX) {
        if (!isDragging) return;
        if (verified) return;

        // 计算移动差值
        const deltaX = clientX - startX;
        // 新的left = 起始左位置 + 差值
        let newLeft = currentLeft + deltaX;

        // 边界限制 (在applyThumbLeft中也会限制，但这里提前防止反复边界跳跃)
        const minLeft = PADDING;
        const maxLeft = PADDING + maxMove;

        if (newLeft < minLeft) newLeft = minLeft;
        if (newLeft > maxLeft) newLeft = maxLeft;

        // 更新滑块位置与填充
        applyThumbLeft(newLeft);

        // 更新起始点为当前clientX，以及基准left
        startX = clientX;
        // currentLeft已经在applyThumbLeft中更新，无需额外赋值

        // 如果已经拖到最右侧，但不自动验证（需要松开）
        // 但可以稍微改变提示
        if (currentLeft >= maxLeft - 0.5) {
          statusDiv.textContent = '👆 松开完成验证';
        } else {
          statusDiv.textContent = '🔍 拖动中...';
        }
      }

      function onDragEnd() {
        if (!isDragging) return;
        if (verified) return;

        isDragging = false;
        thumb.classList.remove('dragging');

        const maxLeft = PADDING + maxMove;
        // 检查是否到达最右侧（容差1px）
        if (currentLeft >= maxLeft - 1) {
          // 吸附到最右侧
          applyThumbLeft(maxLeft);
          verifySuccess();
        } else {
          // 未到终点，回弹并提示错误
          verifyFail();
        }
      }

      // ---------- 鼠标事件 ----------
      thumb.addEventListener('mousedown', (e) => {
        if (verified) return;
        e.preventDefault(); // 防止拖动选中
        onDragStart(e.clientX);

        // 全局监听移动和松开
        const onMouseMove = (moveEvent) => {
          onDragMove(moveEvent.clientX);
        };

        const onMouseUp = () => {
          onDragEnd();
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
        };

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
      });

      // 阻止拖拽图片/选中 (针对滑块内svg)
      thumb.addEventListener('dragstart', (e) => e.preventDefault());

      // ---------- 触摸事件 (移动端) ----------
      thumb.addEventListener('touchstart', (e) => {
        if (verified) return;
        e.preventDefault(); // 阻止滚动
        const touch = e.touches[0];
        onDragStart(touch.clientX);

        const onTouchMove = (moveEvent) => {
          moveEvent.preventDefault(); // 阻止滚动
          const touchMove = moveEvent.touches[0];
          onDragMove(touchMove.clientX);
        };

        const onTouchEnd = () => {
          onDragEnd();
          window.removeEventListener('touchmove', onTouchMove);
          window.removeEventListener('touchend', onTouchEnd);
        };

        window.addEventListener('touchmove', onTouchMove, { passive: false });
        window.addEventListener('touchend', onTouchEnd);
        window.addEventListener('touchcancel', onTouchEnd); // 取消也结束
      }, { passive: false });

      // 防止触摸时页面滚动
      thumb.addEventListener('touchmove', (e) => {
        if (isDragging) e.preventDefault();
      }, { passive: false });

      // ---------- 重置按钮 ----------
      resetBtn.addEventListener('click', () => {
        resetToInitial();
      });

      // ---------- 尺寸变化时更新 ----------
      window.addEventListener('resize', () => {
        // 重新计算最大移动距离，并确保滑块在合理位置
        const oldMax = maxMove;
        const oldPercent = oldMax > 0 ? (currentLeft - PADDING) / oldMax : 0;

        updateMaxMove();

        if (!verified && !isDragging) {
          // 如果未验证且不在拖动，重置到起点 (避免窗口缩放导致滑块悬空)
          // 但用户可能已经拖到一半，为了安全，重置到起点
          resetToInitial();
        } else if (verified) {
          // 已验证，保证滑块在右侧
          applyThumbLeft(PADDING + maxMove);
        } else if (isDragging) {
          // 如果正在拖动，按比例调整位置，避免滑块消失
          // 简单处理：将滑块限制在边界内，并通过百分比重新调整
          const newLeft = PADDING + oldPercent * maxMove;
          applyThumbLeft(newLeft);
        }
      });

      // 初始化: 计算最大移动距离并应用初始位置
      function init() {
        updateMaxMove();
        resetToInitial(); // 确保初始状态
        // 额外保证thumb在初始位置
      }

      // 使用 requestAnimationFrame 确保布局完成后再计算宽度
      requestAnimationFrame(() => {
        init();
        // 有些浏览器字体加载后宽度可能微调，再加一个延时
        setTimeout(() => {
          // 如果还没有验证，重新计算并重置确保不错位
          if (!verified && !isDragging) {
            updateMaxMove();
            applyThumbLeft(PADDING);  // 确保在起点
          }
        }, 50);
      });

      // 额外安全: 当卡片或字体导致宽度变化, 监听字体加载 (可选)
      if (document.fonts) {
        document.fonts.ready.then(() => {
          if (!verified && !isDragging) {
            updateMaxMove();
            applyThumbLeft(PADDING);
          }
        });
      }

    })();
  </script>
</body>
</html>
