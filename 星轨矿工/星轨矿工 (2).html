<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>✨ 星轨矿工 · Mod 悬浮菜单</title>
  <style>
    /* 完全透明背景，仅悬浮球与面板 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      min-height: 100vh;
      background: transparent;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    /* 游戏容器 — 由原文件提供，这里仅作占位，实际样式由原游戏控制 */
    .game-placeholder {
      max-width: 480px;
      margin: 20px auto;
      padding: 20px;
      background: rgba(10, 14, 30, 0.5);
      border-radius: 40px;
      backdrop-filter: blur(4px);
      color: #eee;
      text-align: center;
      border: 1px solid #ffffff20;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .game-placeholder h2 {
      font-weight: 300;
      letter-spacing: 2px;
      color: #f0d8b0;
    }
    .game-placeholder p {
      opacity: 0.6;
      font-size: 14px;
    }
    .crystal-icon {
      font-size: 60px;
      filter: drop-shadow(0 0 20px #fbbf6b);
      cursor: pointer;
    }
    .fake-stats {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 12px;
    }

    /* ---------- MOD 悬浮菜单 ---------- */
    #mod-menu-container {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      pointer-events: none;
    }
    #mod-menu-container * {
      pointer-events: auto;
    }

    /* 悬浮球 — 可拖动 */
    .mod-fab {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #2b1f4a, #0f0a1e);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid #b88aff80;
      box-shadow: 0 8px 28px rgba(0,0,0,0.7), 0 0 30px #7b5dff40;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #f0e2ff;
      cursor: grab;
      transition: box-shadow 0.2s;
      margin-bottom: 12px;
      pointer-events: auto;
      text-shadow: 0 0 20px #a07aff;
      position: relative;
      touch-action: none; /* 移动端拖动 */
    }
    .mod-fab:active {
      cursor: grabbing;
      box-shadow: 0 0 40px #7b5dff80;
    }
    .mod-fab .badge-dot {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 14px;
      height: 14px;
      background: #6eff8e;
      border-radius: 50%;
      box-shadow: 0 0 16px #6eff8e;
      border: 1px solid #00000050;
    }

    /* 面板 */
    .mod-panel {
      background: rgba(8, 12, 30, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid #9a8aff60;
      border-radius: 32px;
      padding: 20px 24px 24px;
      width: 300px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
      color: #eae0f0;
      pointer-events: auto;
      display: none;
      flex-direction: column;
      gap: 18px;
      transition: 0.2s;
      scrollbar-width: thin;
      scrollbar-color: #7b5dff #1a1a2e;
    }
    .mod-panel.open {
      display: flex;
    }
    .mod-panel::-webkit-scrollbar {
      width: 4px;
    }
    .mod-panel::-webkit-scrollbar-thumb {
      background: #7b5dff;
      border-radius: 20px;
    }

    .mod-panel h3 {
      font-weight: 400;
      letter-spacing: 2px;
      color: #d9c9ff;
      border-bottom: 1px solid #7b5dff40;
      padding-bottom: 6px;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
    }
    .mod-panel h3 small {
      font-size: 12px;
      opacity: 0.5;
      font-weight: 300;
    }

    .mod-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mod-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a1a2e60;
      padding: 8px 14px;
      border-radius: 60px;
      border: 1px solid #ffffff10;
    }
    .mod-row label {
      font-size: 14px;
      font-weight: 400;
      color: #c0b8e0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .mod-row input[type="number"] {
      width: 70px;
      background: #0b0b1a;
      border: 1px solid #7b5dff80;
      border-radius: 40px;
      padding: 6px 10px;
      color: #f0eaff;
      font-weight: 600;
      text-align: center;
      font-size: 14px;
    }
    .mod-row input[type="number"]:focus {
      outline: none;
      border-color: #b88aff;
      box-shadow: 0 0 16px #7b5dff60;
    }
    .mod-btn {
      background: #2f2350;
      border: none;
      border-radius: 40px;
      padding: 6px 18px;
      color: #e8d9ff;
      font-weight: 600;
      font-size: 13px;
      border: 1px solid #9f83e0;
      cursor: pointer;
      transition: 0.1s;
      box-shadow: 0 0 12px #7b5dff20;
    }
    .mod-btn:active {
      transform: scale(0.94);
      background: #1f1738;
    }
    .mod-toggle {
      position: relative;
      width: 42px;
      height: 24px;
      background: #2a2a42;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid #555577;
    }
    .mod-toggle.active {
      background: #6b4dff;
      border-color: #b088ff;
    }
    .mod-toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      background: #f0ecff;
      border-radius: 50%;
      transition: 0.2s;
      box-shadow: 0 2px 8px #00000060;
    }
    .mod-toggle.active::after {
      left: 20px;
    }
    .mod-log-area {
      background: #0a0a1a;
      border-radius: 20px;
      padding: 8px 12px;
      max-height: 100px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #a0d0b0;
      border: 1px solid #3a3a5a;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.5;
    }
    .mod-log-area .log-entry {
      border-bottom: 1px solid #2a2a4a;
      padding: 2px 0;
    }
    .mod-close {
      background: transparent;
      border: none;
      color: #ff9e9e;
      font-size: 20px;
      cursor: pointer;
    }

    /* 响应式 */
    @media (max-width: 480px) {
      .mod-panel {
        width: 270px;
        padding: 16px 18px;
      }
      .mod-fab {
        width: 52px;
        height: 52px;
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

<!-- 原游戏模拟 (星轨矿工UI占位) -->
<div class="game-placeholder" id="gameMock">
  <div class="crystal-icon" id="mineClickMock">🔮</div>
  <h2>✨ 星轨矿工 · 晶体采集</h2>
  <div class="fake-stats">
    <span>💎 <span id="mockCurrency">0</span></span>
    <span>⚡ Lv.<span id="mockLevel">1</span></span>
  </div>
  <p style="margin-top:12px;font-size:13px;opacity:0.5;" id="mockPowerDesc">点击晶体 +1  ·  自动钻头每秒 +0</p>
  <div style="margin-top:16px;display:flex;gap:12px;justify-content:center;">
    <span style="background:#1f1f3a;padding:4px 18px;border-radius:60px;border:1px solid #7b5dff40;">⚒️ 强化镐 (10💎)</span>
    <span style="background:#1f1f3a;padding:4px 18px;border-radius:60px;border:1px solid #7b5dff40;">🤖 自动钻头 (20💎)</span>
  </div>
  <button style="margin-top:18px;background:#2a1f3a;border:1px solid #ff5e5e30;color:#ff9e9e;padding:4px 24px;border-radius:60px;">⟳ 重启星轨</button>
</div>

<!-- ========== MOD 悬浮菜单 ========== -->
<div id="mod-menu-container">
  <!-- 悬浮球 (可拖动) -->
  <div class="mod-fab" id="modFab" title="Mod 菜单 (星轨矿工)">
    🛠️
    <span class="badge-dot"></span>
  </div>

  <!-- 面板 -->
  <div class="mod-panel" id="modPanel">
    <h3>
      <span>⚡ 星轨·Mod</span>
      <button class="mod-close" id="modClose">✕</button>
    </h3>

    <!-- 数值修改 -->
    <div class="mod-group">
      <div class="mod-row">
        <label>💎 货币</label>
        <input type="number" id="modCurrency" value="0" step="1">
        <button class="mod-btn" id="applyCurrency">设置</button>
      </div>
      <div class="mod-row">
        <label>⚡ 点击力量</label>
        <input type="number" id="modClickPower" value="1" step="1" min="1">
        <button class="mod-btn" id="applyClickPower">设置</button>
      </div>
      <div class="mod-row">
        <label>🤖 自动收入/秒</label>
        <input type="number" id="modAutoIncome" value="0" step="1" min="0">
        <button class="mod-btn" id="applyAutoIncome">设置</button>
      </div>
    </div>

    <!-- 加速齿轮 + 一键解锁 -->
    <div class="mod-group">
      <div class="mod-row">
        <label>⏩ 加速 (x<span id="speedLabel">1</span>)</label>
        <div style="display:flex;gap:6px;">
          <button class="mod-btn" id="speedDown">−</button>
          <button class="mod-btn" id="speedUp">+</button>
        </div>
      </div>
      <div class="mod-row">
        <label>🔓 一键满级 (解锁)</label>
        <button class="mod-btn" id="unlockAll">🚀 解锁</button>
      </div>
    </div>

    <!-- 日志监控 (toggle) -->
    <div class="mod-group">
      <div class="mod-row">
        <label>📋 日志监控</label>
        <div class="mod-toggle" id="logToggle"></div>
      </div>
      <div class="mod-log-area" id="logArea">
        <div class="log-entry">[系统] Mod 已加载</div>
      </div>
    </div>

    <div style="font-size:11px;opacity:0.3;text-align:right;margin-top:4px;">注入 · 星轨矿工 v1</div>
  </div>
</div>

<script>
  (function() {
    "use strict";

    // ------------------------------------------------------------
    // 1. 获取原游戏的状态引用 (模拟)
    // ------------------------------------------------------------
    let gameState = {
      currency: 0,
      totalMined: 0,
      clickPower: 1,
      autoIncome: 0,
      level: 1,
      clickUpgradeCost: 10,
      autoUpgradeCost: 20,
      clickUpgradeLevel: 0,
      autoUpgradeLevel: 0,
    };

    function updateGameUI() {
      document.getElementById('mockCurrency').textContent = gameState.currency;
      document.getElementById('mockLevel').textContent = gameState.level;
      const desc = document.getElementById('mockPowerDesc');
      if (desc) {
        desc.innerHTML = `点击晶体 +${gameState.clickPower}  ·  自动钻头每秒 +${gameState.autoIncome}`;
      }
    }

    // 模拟点击
    function mockMineClick() {
      const gain = gameState.clickPower;
      gameState.currency += gain;
      gameState.totalMined += gain;
      gameState.level = Math.floor(gameState.totalMined / 30) + 1;
      updateGameUI();
    }

    // 绑定点击
    document.addEventListener('DOMContentLoaded', function() {
      const mineEl = document.getElementById('mineClickMock');
      if (mineEl) {
        mineEl.addEventListener('click', function(e) {
          mockMineClick();
        });
      }
      updateGameUI();
    });

    // 自动收入
    let autoInterval = setInterval(() => {
      if (gameState.autoIncome > 0) {
        gameState.currency += gameState.autoIncome;
        gameState.totalMined += gameState.autoIncome;
        gameState.level = Math.floor(gameState.totalMined / 30) + 1;
        updateGameUI();
      }
    }, 1000);

    // 暴露全局
    window.__gameState = gameState;
    window.__updateUI = updateGameUI;
    window.__mockMine = mockMineClick;

    // ------------------------------------------------------------
    // 2. 悬浮球拖动 (支持鼠标 & 触摸)
    // ------------------------------------------------------------
    const fab = document.getElementById('modFab');
    let isDragging = false;
    let startX, startY, origX, origY;

    function onDragStart(e) {
      // 只允许左键或触摸
      if (e.type === 'mousedown' && e.button !== 0) return;
      // 防止触发面板切换
      e.stopPropagation();
      isDragging = true;
      const touch = e.touches ? e.touches[0] : e;
      startX = touch.clientX;
      startY = touch.clientY;
      const rect = fab.getBoundingClientRect();
      origX = rect.left;
      origY = rect.top;
      fab.style.cursor = 'grabbing';
      fab.style.transition = 'none';
      document.addEventListener('mousemove', onDragMove);
      document.addEventListener('mouseup', onDragEnd);
      document.addEventListener('touchmove', onDragMove, { passive: false });
      document.addEventListener('touchend', onDragEnd, { passive: false });
      e.preventDefault();
    }

    function onDragMove(e) {
      if (!isDragging) return;
      const touch = e.touches ? e.touches[0] : e;
      const dx = touch.clientX - startX;
      const dy = touch.clientY - startY;
      let newX = origX + dx;
      let newY = origY + dy;
      // 边界限制 (不超出屏幕)
      const fabW = fab.offsetWidth || 60;
      const fabH = fab.offsetHeight || 60;
      const maxX = window.innerWidth - fabW - 10;
      const maxY = window.innerHeight - fabH - 10;
      newX = Math.max(10, Math.min(newX, maxX));
      newY = Math.max(10, Math.min(newY, maxY));
      fab.style.left = newX + 'px';
      fab.style.top = newY + 'px';
      fab.style.right = 'auto';
      fab.style.bottom = 'auto';
      e.preventDefault();
    }

    function onDragEnd(e) {
      if (isDragging) {
        isDragging = false;
        fab.style.cursor = 'grab';
        fab.style.transition = '';
        document.removeEventListener('mousemove', onDragMove);
        document.removeEventListener('mouseup', onDragEnd);
        document.removeEventListener('touchmove', onDragMove);
        document.removeEventListener('touchend', onDragEnd);
        // 如果拖动距离很小，视为点击打开面板
        const touch = e.changedTouches ? e.changedTouches[0] : e;
        const dx = touch.clientX - startX;
        const dy = touch.clientY - startY;
        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) {
          // 点击事件由 click 处理
        }
        e.preventDefault();
      }
    }

    // 初始化位置 (右下)
    fab.style.right = '30px';
    fab.style.bottom = '30px';
    fab.style.left = 'auto';
    fab.style.top = 'auto';

    fab.addEventListener('mousedown', onDragStart);
    fab.addEventListener('touchstart', onDragStart, { passive: false });

    // 点击打开面板 (仅当没有拖动)
    let fabClickTimer = null;
    fab.addEventListener('click', function(e) {
      // 如果正在拖动，忽略点击
      if (isDragging) return;
      // 用一个小延迟区分点击和拖动结束
      clearTimeout(fabClickTimer);
      fabClickTimer = setTimeout(() => {
        togglePanel();
      }, 10);
    });

    // ------------------------------------------------------------
    // 3. 面板控制
    // ------------------------------------------------------------
    const panel = document.getElementById('modPanel');
    const closeBtn = document.getElementById('modClose');
    let panelOpen = false;

    function togglePanel() {
      panelOpen = !panelOpen;
      panel.classList.toggle('open', panelOpen);
    }

    closeBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      togglePanel();
    });

    // ------------------------------------------------------------
    // 4. Mod 功能
    // ------------------------------------------------------------
    function addLog(msg) {
      const logArea = document.getElementById('logArea');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logArea.appendChild(entry);
      logArea.scrollTop = logArea.scrollHeight;
      if (logArea.children.length > 50) {
        logArea.removeChild(logArea.firstChild);
      }
    }

    // 数值修改
    document.getElementById('applyCurrency').addEventListener('click', function() {
      const val = parseInt(document.getElementById('modCurrency').value);
      if (!isNaN(val) && val >= 0) {
        gameState.currency = val;
        updateGameUI();
        addLog(`💎 货币设置为 ${val}`);
      }
    });
    document.getElementById('applyClickPower').addEventListener('click', function() {
      const val = parseInt(document.getElementById('modClickPower').value);
      if (!isNaN(val) && val >= 1) {
        gameState.clickPower = val;
        updateGameUI();
        addLog(`⚡ 点击力量设置为 ${val}`);
      }
    });
    document.getElementById('applyAutoIncome').addEventListener('click', function() {
      const val = parseInt(document.getElementById('modAutoIncome').value);
      if (!isNaN(val) && val >= 0) {
        gameState.autoIncome = val;
        updateGameUI();
        addLog(`🤖 自动收入设置为 ${val}/秒`);
      }
    });

    // 加速 (修改自动采矿间隔)
    let speedFactor = 1;
    const speedLabel = document.getElementById('speedLabel');
    let autoIntervalRef = autoInterval;

    function updateSpeed() {
      speedLabel.textContent = speedFactor;
      // 重启自动采矿
      clearInterval(autoIntervalRef);
      const intervalMs = Math.max(100, 1000 / speedFactor);
      autoIntervalRef = setInterval(() => {
        if (gameState.autoIncome > 0) {
          gameState.currency += gameState.autoIncome;
          gameState.totalMined += gameState.autoIncome;
          gameState.level = Math.floor(gameState.totalMined / 30) + 1;
          updateGameUI();
        }
      }, intervalMs);
      addLog(`⏩ 加速倍率 x${speedFactor} (间隔 ${intervalMs}ms)`);
    }

    document.getElementById('speedUp').addEventListener('click', function() {
      if (speedFactor < 20) {
        speedFactor = Math.min(20, speedFactor + 0.5);
        updateSpeed();
      }
    });
    document.getElementById('speedDown').addEventListener('click', function() {
      if (speedFactor > 0.5) {
        speedFactor = Math.max(0.5, speedFactor - 0.5);
        updateSpeed();
      }
    });

    // 一键解锁 (模拟)
    document.getElementById('unlockAll').addEventListener('click', function() {
      gameState.clickPower = 50;
      gameState.autoIncome = 20;
      gameState.currency = 9999;
      gameState.totalMined = 5000;
      gameState.level = Math.floor(gameState.totalMined / 30) + 1;
      updateGameUI();
      addLog('🚀 解锁完成：点击+50，自动+20/秒，货币9999');
      // 更新输入框
      document.getElementById('modCurrency').value = 9999;
      document.getElementById('modClickPower').value = 50;
      document.getElementById('modAutoIncome').value = 20;
    });

    // 日志监控 toggle (模拟)
    const logToggle = document.getElementById('logToggle');
    let logEnabled = true;
    logToggle.addEventListener('click', function() {
      logEnabled = !logEnabled;
      logToggle.classList.toggle('active', logEnabled);
      addLog(logEnabled ? '📋 日志监控 开启' : '📋 日志监控 关闭');
    });
    logToggle.classList.add('active');

    // 日志劫持示例 (拦截 console.log)
    const origConsoleLog = console.log;
    console.log = function(...args) {
      origConsoleLog(...args);
      if (logEnabled) {
        addLog('📌 ' + args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '));
      }
    };

    // 初始日志
    addLog('🛠️ Mod 菜单已启动 (拖动悬浮球移动)');
    addLog('💡 提示：点击悬浮球打开面板');
  })();
</script>
</body>
</html>
