<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>✨ 星轨矿工 · 晶体采集</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 20% 30%, #0b0f2a, #030514);
      padding: 16px;
      /* 背景直接作为全屏，无卡片包裹 */
    }

    /* 游戏主容器 — 完全透明，无卡片背景 */
    .game-container {
      max-width: 480px;
      width: 100%;
      padding: 20px 16px 28px;
      border-radius: 0;      /* 无圆角卡片感 */
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
      border: none;
    }

    /* 头部 — 货币 & 等级 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding: 0 2px;
    }

    .currency-box {
      background: rgba(8, 12, 30, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 10px 20px 10px 18px;
      border-radius: 60px;
      border: 1px solid rgba(255, 215, 150, 0.25);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .currency-icon {
      font-size: 26px;
      filter: drop-shadow(0 0 8px #fbbf6b);
    }

    .currency-amount {
      font-size: 26px;
      font-weight: 700;
      color: #fce9d0;
      letter-spacing: 0.5px;
      text-shadow: 0 0 16px rgba(255, 200, 100, 0.3);
    }

    .level-badge {
      background: rgba(20, 14, 40, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px 20px 8px 18px;
      border-radius: 60px;
      border: 1px solid #b88aff;
      box-shadow: 0 0 24px rgba(150, 100, 255, 0.15);
      display: flex;
      align-items: center;
      gap: 8px;
      color: #d9c9ff;
      font-weight: 600;
      font-size: 18px;
    }

    .level-badge span {
      background: #7b5dff;
      padding: 0 12px;
      border-radius: 40px;
      color: white;
      font-size: 17px;
      line-height: 26px;
      box-shadow: 0 0 12px #7b5dff80;
    }

    /* 主矿区 — 点击区域 (无卡片感) */
    .mine-area {
      background: radial-gradient(circle at 50% 40%, #1e2b4a, #0a1022);
      border-radius: 80px;
      padding: 36px 20px 30px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 215, 150, 0.12);
      box-shadow: inset 0 8px 28px rgba(0, 0, 0, 0.7), 0 16px 32px rgba(0, 0, 0, 0.6);
      transition: 0.12s;
      cursor: pointer;
      position: relative;
    }

    .mine-area:active {
      transform: scale(0.97);
      background: radial-gradient(circle at 50% 40%, #253458, #0d142b);
    }

    .crystal-icon {
      font-size: 88px;
      text-align: center;
      line-height: 1.2;
      filter: drop-shadow(0 0 36px #fbbf6b);
      transition: 0.1s;
    }

    .mine-area:active .crystal-icon {
      transform: scale(0.88);
    }

    .mine-sub {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      color: #96a9d1;
      font-size: 15px;
      font-weight: 500;
      padding: 0 8px;
    }

    .mine-sub .click-power {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      padding: 4px 18px;
      border-radius: 60px;
      border: 1px solid rgba(255, 200, 100, 0.15);
      font-size: 15px;
      color: #d4bfa0;
    }

    /* 统计条 */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 100px;
      padding: 10px 20px;
      margin-bottom: 28px;
      border: 1px solid #3a3f5e60;
      color: #bcc8f0;
      font-size: 15px;
      font-weight: 500;
    }

    .stats-bar span {
      color: #f5e7d3;
      font-weight: 600;
    }

    /* 商店 — 升级卡片 (但无卡片包裹，仅列表项) */
    .shop-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 4px;
    }

    .shop-card {
      background: rgba(8, 12, 30, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 60px;
      padding: 14px 22px 14px 26px;
      border: 1px solid rgba(255, 215, 150, 0.10);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3);
    }

    .shop-card:hover {
      border-color: #f0c27b60;
      background: rgba(20, 30, 60, 0.6);
    }

    .shop-info {
      display: flex;
      flex-direction: column;
    }

    .shop-title {
      font-weight: 600;
      color: #f0e2d0;
      font-size: 19px;
      letter-spacing: 0.3px;
    }

    .shop-desc {
      font-size: 14px;
      color: #a6b7e0;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .shop-desc .price-tag {
      background: rgba(255, 200, 100, 0.10);
      padding: 2px 14px;
      border-radius: 40px;
      border: 1px solid #ffd48a30;
      color: #fad6a0;
      font-weight: 500;
    }

    .shop-btn {
      background: linear-gradient(145deg, #3a2e5a, #261f3d);
      border: none;
      padding: 10px 24px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 16px;
      color: #e8d9ff;
      border: 1px solid #9f83e0;
      box-shadow: 0 0 20px rgba(120, 80, 255, 0.12);
      transition: all 0.15s;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .shop-btn:active {
      transform: scale(0.94);
      background: #2f234a;
    }

    .shop-btn:disabled {
      opacity: 0.35;
      filter: grayscale(0.6);
      transform: scale(0.96);
      pointer-events: none;
      border-color: #555;
    }

    .shop-btn .cost-icon {
      font-size: 18px;
    }

    /* 重置按钮 (小巧) */
    .reset-area {
      margin-top: 28px;
      display: flex;
      justify-content: flex-end;
    }

    .reset-btn {
      background: rgba(255, 70, 70, 0.06);
      border: 1px solid #ff5e5e30;
      color: #ff9e9e;
      padding: 6px 26px;
      border-radius: 60px;
      font-size: 14px;
      font-weight: 500;
      backdrop-filter: blur(4px);
      cursor: pointer;
      transition: 0.2s;
      background: rgba(0, 0, 0, 0.2);
    }

    .reset-btn:active {
      background: #ff3a3a20;
      transform: scale(0.94);
    }

    /* 浮动文字特效 */
    .float-text {
      position: fixed;
      pointer-events: none;
      font-weight: 700;
      font-size: 26px;
      color: #ffdd99;
      text-shadow: 0 0 24px #ffb347, 0 0 50px #ff8800;
      z-index: 999;
      animation: floatUp 1s ease-out forwards;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-120px) scale(0.7); }
    }

    /* 移动端适配 */
    @media (max-width: 420px) {
      .game-container { padding: 12px 10px 20px; }
      .crystal-icon { font-size: 72px; }
      .shop-btn { padding: 8px 16px; font-size: 14px; }
      .currency-amount { font-size: 22px; }
      .level-badge { font-size: 16px; padding: 6px 16px; }
    }
  </style>
</head>
<body>

<div class="game-container" id="app">
  <!-- 头部 -->
  <div class="header">
    <div class="currency-box">
      <span class="currency-icon">💎</span>
      <span class="currency-amount" id="currencyDisplay">0</span>
    </div>
    <div class="level-badge">
      ⚡ <span id="levelDisplay">1</span>
    </div>
  </div>

  <!-- 矿区 (点击) -->
  <div class="mine-area" id="mineClick">
    <div class="crystal-icon">🔮</div>
    <div class="mine-sub">
      <span>⛏️ 点击晶体</span>
      <span class="click-power" id="clickPowerDisplay">⚡ +1</span>
    </div>
  </div>

  <!-- 统计 -->
  <div class="stats-bar">
    <span>📦 总采集: <span id="totalMinedDisplay">0</span></span>
    <span>⏫ 每秒: <span id="incomePerSecDisplay">0</span></span>
  </div>

  <!-- 商店 (无卡片背景，仅列表) -->
  <div class="shop-grid">
    <!-- 升级 1: 点击力量 -->
    <div class="shop-card">
      <div class="shop-info">
        <div class="shop-title">⚒️ 强化镐</div>
        <div class="shop-desc">
          <span>点击 +1</span>
          <span class="price-tag" id="clickPriceDisplay">💎 10</span>
        </div>
      </div>
      <button class="shop-btn" id="buyClickUpgrade">
        <span class="cost-icon">⬆</span> 升级
      </button>
    </div>

    <!-- 升级 2: 自动采矿机 -->
    <div class="shop-card">
      <div class="shop-info">
        <div class="shop-title">🤖 自动钻头</div>
        <div class="shop-desc">
          <span>每秒 +1</span>
          <span class="price-tag" id="autoPriceDisplay">💎 20</span>
        </div>
      </div>
      <button class="shop-btn" id="buyAutoUpgrade">
        <span class="cost-icon">⬆</span> 升级
      </button>
    </div>
  </div>

  <!-- 重置 -->
  <div class="reset-area">
    <button class="reset-btn" id="resetGame">⟳ 重启星轨</button>
  </div>
</div>

<script>
  (function() {
    "use strict";

    // ---------- 游戏状态 ----------
    let state = {
      currency: 0,
      totalMined: 0,
      clickPower: 1,
      autoIncome: 0,
      level: 1,
      clickUpgradeCost: 10,
      autoUpgradeCost: 20,
      clickUpgradeLevel: 0,
      autoUpgradeLevel: 0,
    };

    // DOM
    const currencyEl = document.getElementById('currencyDisplay');
    const levelEl = document.getElementById('levelDisplay');
    const clickPowerEl = document.getElementById('clickPowerDisplay');
    const totalMinedEl = document.getElementById('totalMinedDisplay');
    const incomePerSecEl = document.getElementById('incomePerSecDisplay');
    const clickPriceEl = document.getElementById('clickPriceDisplay');
    const autoPriceEl = document.getElementById('autoPriceDisplay');
    const mineArea = document.getElementById('mineClick');
    const buyClickBtn = document.getElementById('buyClickUpgrade');
    const buyAutoBtn = document.getElementById('buyAutoUpgrade');
    const resetBtn = document.getElementById('resetGame');

    // ---------- 辅助 ----------
    function formatCurrency(val) {
      return Math.floor(val).toLocaleString();
    }

    function updateUI() {
      currencyEl.textContent = formatCurrency(state.currency);
      levelEl.textContent = state.level;
      clickPowerEl.textContent = `⚡ +${state.clickPower}`;
      totalMinedEl.textContent = formatCurrency(state.totalMined);
      incomePerSecEl.textContent = state.autoIncome > 0 ? `+${state.autoIncome}` : '0';
      clickPriceEl.textContent = `💎 ${state.clickUpgradeCost}`;
      autoPriceEl.textContent = `💎 ${state.autoUpgradeCost}`;

      buyClickBtn.disabled = (state.currency < state.clickUpgradeCost);
      buyAutoBtn.disabled = (state.currency < state.autoUpgradeCost);
    }

    function updateLevel() {
      let newLevel = Math.floor(state.totalMined / 30) + 1;
      if (newLevel < 1) newLevel = 1;
      state.level = newLevel;
    }

    // ---------- 浮动文字 (坐标版) ----------
    function showFloatingText(x, y, text, color = '#ffffff', center = false) {
      const el = document.createElement('div');
      el.className = 'float-text';
      el.textContent = text;
      el.style.color = color;
      if (center) {
        el.style.left = '50%';
        el.style.top = '50%';
        el.style.transform = 'translate(-50%, -50%)';
      } else {
        el.style.left = (x - 30) + 'px';
        el.style.top = (y - 30) + 'px';
      }
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }

    // ---------- 核心逻辑 ----------
    function handleMineClick(e) {
      let baseGain = state.clickPower;
      // 暴击 8%
      if (Math.random() < 0.08) {
        baseGain = Math.floor(baseGain * 2.5);
        showFloatingText(e.clientX || e.pageX, e.clientY || e.pageY, '💥 暴击!', '#ffd966');
      } else {
        showFloatingText(e.clientX || e.pageX, e.clientY || e.pageY, `+${baseGain}`, '#b8e0ff');
      }

      state.currency += baseGain;
      state.totalMined += baseGain;
      updateLevel();
      updateUI();
    }

    function buyClickUpgrade() {
      if (state.currency < state.clickUpgradeCost) return;
      state.currency -= state.clickUpgradeCost;
      state.clickPower += 1;
      state.clickUpgradeLevel += 1;
      state.clickUpgradeCost = Math.floor(10 + state.clickUpgradeLevel * 7);
      showFloatingText(0, 0, '⬆ 镐强化!', '#b3ffaa', true);
      updateUI();
    }

    function buyAutoUpgrade() {
      if (state.currency < state.autoUpgradeCost) return;
      state.currency -= state.autoUpgradeCost;
      state.autoIncome += 1;
      state.autoUpgradeLevel += 1;
      state.autoUpgradeCost = Math.floor(20 + state.autoUpgradeLevel * 12);
      showFloatingText(0, 0, '🤖 钻头升级!', '#99ddff', true);
      updateUI();
    }

    function resetGame() {
      if (confirm('重启星轨，所有进度将清空，确定吗？')) {
        state.currency = 0;
        state.totalMined = 0;
        state.clickPower = 1;
        state.autoIncome = 0;
        state.level = 1;
        state.clickUpgradeCost = 10;
        state.autoUpgradeCost = 20;
        state.clickUpgradeLevel = 0;
        state.autoUpgradeLevel = 0;
        updateUI();
        showFloatingText(0, 0, '🔄 星轨重启', '#b8b8ff', true);
      }
    }

    // ---------- 事件绑定 ----------
    function attachMineClick() {
      mineArea.addEventListener('click', function(e) {
        handleMineClick(e);
      });
      mineArea.addEventListener('touchstart', function(e) {
        const touch = e.touches[0];
        if (touch) {
          handleMineClick({ clientX: touch.clientX, clientY: touch.clientY });
        }
        e.preventDefault();
      }, { passive: false });
    }

    // 自动采矿
    let autoInterval = null;
    function startAutoIncome() {
      if (autoInterval) clearInterval(autoInterval);
      autoInterval = setInterval(() => {
        if (state.autoIncome > 0) {
          const gain = state.autoIncome;
          state.currency += gain;
          state.totalMined += gain;
          updateLevel();
          updateUI();
          if (Math.random() < 0.06) {
            showFloatingText(0, 0, `⚡ +${gain} (自动)`, '#87ceeb', true);
          }
        }
      }, 1000);
    }

    // ---------- 初始化 ----------
    function init() {
      attachMineClick();
      buyClickBtn.addEventListener('click', buyClickUpgrade);
      buyAutoBtn.addEventListener('click', buyAutoUpgrade);
      resetBtn.addEventListener('click', resetGame);
      startAutoIncome();
      updateLevel();
      updateUI();
    }

    window.addEventListener('beforeunload', function() {
      if (autoInterval) clearInterval(autoInterval);
    });

    init();
  })();
</script>
</body>
</html>
