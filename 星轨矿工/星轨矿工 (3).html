<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>✨ 星轨矿工 · 晶体采集</title>
  <style>
    /* ===== 原游戏样式 (完全保留) ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 20% 30%, #0b0f2a, #030514);
      padding: 16px;
    }

    .game-container {
      max-width: 480px;
      width: 100%;
      padding: 20px 16px 28px;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
      border: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding: 0 2px;
    }

    .currency-box {
      background: rgba(8, 12, 30, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 10px 20px 10px 18px;
      border-radius: 60px;
      border: 1px solid rgba(255, 215, 150, 0.25);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .currency-icon {
      font-size: 26px;
      filter: drop-shadow(0 0 8px #fbbf6b);
    }

    .currency-amount {
      font-size: 26px;
      font-weight: 700;
      color: #fce9d0;
      letter-spacing: 0.5px;
      text-shadow: 0 0 16px rgba(255, 200, 100, 0.3);
    }

    .level-badge {
      background: rgba(20, 14, 40, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px 20px 8px 18px;
      border-radius: 60px;
      border: 1px solid #b88aff;
      box-shadow: 0 0 24px rgba(150, 100, 255, 0.15);
      display: flex;
      align-items: center;
      gap: 8px;
      color: #d9c9ff;
      font-weight: 600;
      font-size: 18px;
    }

    .level-badge span {
      background: #7b5dff;
      padding: 0 12px;
      border-radius: 40px;
      color: white;
      font-size: 17px;
      line-height: 26px;
      box-shadow: 0 0 12px #7b5dff80;
    }

    .mine-area {
      background: radial-gradient(circle at 50% 40%, #1e2b4a, #0a1022);
      border-radius: 80px;
      padding: 36px 20px 30px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 215, 150, 0.12);
      box-shadow: inset 0 8px 28px rgba(0, 0, 0, 0.7), 0 16px 32px rgba(0, 0, 0, 0.6);
      transition: 0.12s;
      cursor: pointer;
      position: relative;
    }

    .mine-area:active {
      transform: scale(0.97);
      background: radial-gradient(circle at 50% 40%, #253458, #0d142b);
    }

    .crystal-icon {
      font-size: 88px;
      text-align: center;
      line-height: 1.2;
      filter: drop-shadow(0 0 36px #fbbf6b);
      transition: 0.1s;
    }

    .mine-area:active .crystal-icon {
      transform: scale(0.88);
    }

    .mine-sub {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      color: #96a9d1;
      font-size: 15px;
      font-weight: 500;
      padding: 0 8px;
    }

    .mine-sub .click-power {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      padding: 4px 18px;
      border-radius: 60px;
      border: 1px solid rgba(255, 200, 100, 0.15);
      font-size: 15px;
      color: #d4bfa0;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 100px;
      padding: 10px 20px;
      margin-bottom: 28px;
      border: 1px solid #3a3f5e60;
      color: #bcc8f0;
      font-size: 15px;
      font-weight: 500;
    }

    .stats-bar span {
      color: #f5e7d3;
      font-weight: 600;
    }

    .shop-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 4px;
    }

    .shop-card {
      background: rgba(8, 12, 30, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 60px;
      padding: 14px 22px 14px 26px;
      border: 1px solid rgba(255, 215, 150, 0.10);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3);
    }

    .shop-card:hover {
      border-color: #f0c27b60;
      background: rgba(20, 30, 60, 0.6);
    }

    .shop-info {
      display: flex;
      flex-direction: column;
    }

    .shop-title {
      font-weight: 600;
      color: #f0e2d0;
      font-size: 19px;
      letter-spacing: 0.3px;
    }

    .shop-desc {
      font-size: 14px;
      color: #a6b7e0;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .shop-desc .price-tag {
      background: rgba(255, 200, 100, 0.10);
      padding: 2px 14px;
      border-radius: 40px;
      border: 1px solid #ffd48a30;
      color: #fad6a0;
      font-weight: 500;
    }

    .shop-btn {
      background: linear-gradient(145deg, #3a2e5a, #261f3d);
      border: none;
      padding: 10px 24px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 16px;
      color: #e8d9ff;
      border: 1px solid #9f83e0;
      box-shadow: 0 0 20px rgba(120, 80, 255, 0.12);
      transition: all 0.15s;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .shop-btn:active {
      transform: scale(0.94);
      background: #2f234a;
    }

    .shop-btn:disabled {
      opacity: 0.35;
      filter: grayscale(0.6);
      transform: scale(0.96);
      pointer-events: none;
      border-color: #555;
    }

    .reset-area {
      margin-top: 28px;
      display: flex;
      justify-content: flex-end;
    }

    .reset-btn {
      background: rgba(255, 70, 70, 0.06);
      border: 1px solid #ff5e5e30;
      color: #ff9e9e;
      padding: 6px 26px;
      border-radius: 60px;
      font-size: 14px;
      font-weight: 500;
      backdrop-filter: blur(4px);
      cursor: pointer;
      transition: 0.2s;
      background: rgba(0, 0, 0, 0.2);
    }

    .reset-btn:active {
      background: #ff3a3a20;
      transform: scale(0.94);
    }

    /* ===== MOD 悬浮菜单 (独立,不干扰原UI) ===== */
    #mod-fab {
      position: fixed;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #3a2a6a, #1a0f2e);
      backdrop-filter: blur(12px);
      border: 2px solid #b88aff;
      box-shadow: 0 4px 20px rgba(120, 80, 255, 0.4), 0 0 40px rgba(120, 80, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #f0e2ff;
      cursor: grab;
      z-index: 999999;
      transition: box-shadow 0.2s;
      touch-action: none;
      user-select: none;
      /* 初始位置在右下角 */
      bottom: 30px;
      right: 30px;
    }
    #mod-fab:active {
      cursor: grabbing;
      box-shadow: 0 0 40px #7b5dff;
    }
    #mod-fab .dot {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 12px;
      height: 12px;
      background: #6eff8e;
      border-radius: 50%;
      box-shadow: 0 0 16px #6eff8e;
      border: 1px solid #000;
    }

    #mod-panel {
      position: fixed;
      bottom: 100px;
      right: 30px;
      width: 320px;
      max-height: 70vh;
      background: rgba(8, 12, 30, 0.92);
      backdrop-filter: blur(20px);
      border: 1px solid #9a8aff60;
      border-radius: 24px;
      padding: 20px 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      color: #eae0f0;
      z-index: 999998;
      display: none;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      pointer-events: auto;
    }
    #mod-panel.open {
      display: flex;
    }
    #mod-panel::-webkit-scrollbar {
      width: 4px;
    }
    #mod-panel::-webkit-scrollbar-thumb {
      background: #7b5dff;
      border-radius: 20px;
    }

    .mod-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #7b5dff40;
      padding-bottom: 8px;
    }
    .mod-header h3 {
      font-weight: 400;
      letter-spacing: 1px;
      color: #d9c9ff;
      font-size: 18px;
    }
    .mod-close {
      background: transparent;
      border: none;
      color: #ff9e9e;
      font-size: 22px;
      cursor: pointer;
      padding: 0 8px;
    }
    .mod-close:hover {
      color: #ff6666;
    }

    .mod-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a1a2e60;
      padding: 6px 14px;
      border-radius: 40px;
      border: 1px solid #ffffff10;
      gap: 8px;
    }
    .mod-row label {
      font-size: 14px;
      color: #c0b8e0;
      min-width: 70px;
    }
    .mod-row input[type="number"] {
      width: 70px;
      background: #0b0b1a;
      border: 1px solid #7b5dff80;
      border-radius: 40px;
      padding: 4px 8px;
      color: #f0eaff;
      font-weight: 600;
      text-align: center;
      font-size: 14px;
    }
    .mod-row input[type="number"]:focus {
      outline: none;
      border-color: #b88aff;
    }
    .mod-btn {
      background: #2f2350;
      border: none;
      border-radius: 40px;
      padding: 4px 16px;
      color: #e8d9ff;
      font-weight: 600;
      font-size: 13px;
      border: 1px solid #9f83e0;
      cursor: pointer;
      transition: 0.1s;
      white-space: nowrap;
    }
    .mod-btn:active {
      transform: scale(0.94);
      background: #1f1738;
    }
    .mod-btn-sm {
      padding: 2px 12px;
      font-size: 16px;
    }
    .mod-toggle {
      width: 40px;
      height: 22px;
      background: #2a2a42;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid #555577;
      position: relative;
      flex-shrink: 0;
    }
    .mod-toggle.active {
      background: #6b4dff;
      border-color: #b088ff;
    }
    .mod-toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: #f0ecff;
      border-radius: 50%;
      transition: 0.2s;
      box-shadow: 0 2px 8px #00000060;
    }
    .mod-toggle.active::after {
      left: 20px;
    }
    .mod-log {
      background: #0a0a1a;
      border-radius: 16px;
      padding: 6px 12px;
      max-height: 80px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #a0d0b0;
      border: 1px solid #3a3a5a;
      line-height: 1.6;
    }
    .mod-log div {
      border-bottom: 1px solid #1a1a3a;
      padding: 2px 0;
    }

    /* 响应式 */
    @media (max-width: 480px) {
      #mod-panel {
        width: 280px;
        right: 10px;
        bottom: 80px;
        padding: 16px 18px;
      }
      #mod-fab {
        width: 48px;
        height: 48px;
        font-size: 20px;
        bottom: 20px;
        right: 20px;
      }
    }
  </style>
</head>
<body>

<div class="game-container">
  <!-- 头部 -->
  <div class="header">
    <div class="currency-box">
      <span class="currency-icon">💎</span>
      <span class="currency-amount" id="currencyDisplay">0</span>
    </div>
    <div class="level-badge">
      ⚡ <span id="levelDisplay">1</span>
    </div>
  </div>

  <!-- 矿区 -->
  <div class="mine-area" id="mineClick">
    <div class="crystal-icon">🔮</div>
    <div class="mine-sub">
      <span>⛏️ 点击晶体</span>
      <span class="click-power" id="clickPowerDisplay">⚡ +1</span>
    </div>
  </div>

  <!-- 统计 -->
  <div class="stats-bar">
    <span>📦 总采集: <span id="totalMinedDisplay">0</span></span>
    <span>⏫ 每秒: <span id="incomePerSecDisplay">0</span></span>
  </div>

  <!-- 商店 -->
  <div class="shop-grid">
    <div class="shop-card">
      <div class="shop-info">
        <div class="shop-title">⚒️ 强化镐</div>
        <div class="shop-desc">
          <span>点击 +1</span>
          <span class="price-tag" id="clickPriceDisplay">💎 10</span>
        </div>
      </div>
      <button class="shop-btn" id="buyClickUpgrade">
        <span class="cost-icon">⬆</span> 升级
      </button>
    </div>

    <div class="shop-card">
      <div class="shop-info">
        <div class="shop-title">🤖 自动钻头</div>
        <div class="shop-desc">
          <span>每秒 +1</span>
          <span class="price-tag" id="autoPriceDisplay">💎 20</span>
        </div>
      </div>
      <button class="shop-btn" id="buyAutoUpgrade">
        <span class="cost-icon">⬆</span> 升级
      </button>
    </div>
  </div>

  <!-- 重置 -->
  <div class="reset-area">
    <button class="reset-btn" id="resetGame">⟳ 重启星轨</button>
  </div>
</div>

<!-- ===== MOD 悬浮球 ===== -->
<div id="mod-fab" title="Mod菜单 (拖拽移动)">
  🛠️
  <span class="dot"></span>
</div>

<!-- ===== MOD 面板 ===== -->
<div id="mod-panel">
  <div class="mod-header">
    <h3>⚡ 星轨·Mod</h3>
    <button class="mod-close" id="modClose">✕</button>
  </div>

  <div class="mod-row">
    <label>💎 货币</label>
    <input type="number" id="modCurrency" value="0" step="1">
    <button class="mod-btn" id="applyCurrency">设置</button>
  </div>
  <div class="mod-row">
    <label>⚡ 点击力</label>
    <input type="number" id="modClickPower" value="1" step="1" min="1">
    <button class="mod-btn" id="applyClickPower">设置</button>
  </div>
  <div class="mod-row">
    <label>🤖 自动/秒</label>
    <input type="number" id="modAutoIncome" value="0" step="1" min="0">
    <button class="mod-btn" id="applyAutoIncome">设置</button>
  </div>

  <div class="mod-row">
    <label>⏩ 加速 x<span id="speedLabel">1</span></label>
    <button class="mod-btn mod-btn-sm" id="speedDown">−</button>
    <button class="mod-btn mod-btn-sm" id="speedUp">+</button>
    <button class="mod-btn" id="unlockAll">🚀 解锁</button>
  </div>

  <div class="mod-row">
    <label>📋 日志</label>
    <div class="mod-toggle active" id="logToggle"></div>
  </div>
  <div class="mod-log" id="logArea">
    <div>[系统] Mod 已加载</div>
  </div>
</div>

<script>
(function() {
  "use strict";

  // ============================================================
  // 1. 原游戏逻辑 (完全保留)
  // ============================================================
  let state = {
    currency: 0,
    totalMined: 0,
    clickPower: 1,
    autoIncome: 0,
    level: 1,
    clickUpgradeCost: 10,
    autoUpgradeCost: 20,
    clickUpgradeLevel: 0,
    autoUpgradeLevel: 0,
  };

  const currencyEl = document.getElementById('currencyDisplay');
  const levelEl = document.getElementById('levelDisplay');
  const clickPowerEl = document.getElementById('clickPowerDisplay');
  const totalMinedEl = document.getElementById('totalMinedDisplay');
  const incomePerSecEl = document.getElementById('incomePerSecDisplay');
  const clickPriceEl = document.getElementById('clickPriceDisplay');
  const autoPriceEl = document.getElementById('autoPriceDisplay');
  const mineArea = document.getElementById('mineClick');
  const buyClickBtn = document.getElementById('buyClickUpgrade');
  const buyAutoBtn = document.getElementById('buyAutoUpgrade');
  const resetBtn = document.getElementById('resetGame');

  function formatCurrency(val) {
    return Math.floor(val).toLocaleString();
  }

  function updateUI() {
    currencyEl.textContent = formatCurrency(state.currency);
    levelEl.textContent = state.level;
    clickPowerEl.textContent = `⚡ +${state.clickPower}`;
    totalMinedEl.textContent = formatCurrency(state.totalMined);
    incomePerSecEl.textContent = state.autoIncome > 0 ? `+${state.autoIncome}` : '0';
    clickPriceEl.textContent = `💎 ${state.clickUpgradeCost}`;
    autoPriceEl.textContent = `💎 ${state.autoUpgradeCost}`;
    buyClickBtn.disabled = (state.currency < state.clickUpgradeCost);
    buyAutoBtn.disabled = (state.currency < state.autoUpgradeCost);
  }

  function updateLevel() {
    let newLevel = Math.floor(state.totalMined / 30) + 1;
    if (newLevel < 1) newLevel = 1;
    state.level = newLevel;
  }

  function handleMineClick(e) {
    let baseGain = state.clickPower;
    if (Math.random() < 0.08) {
      baseGain = Math.floor(baseGain * 2.5);
    }
    state.currency += baseGain;
    state.totalMined += baseGain;
    updateLevel();
    updateUI();
  }

  function buyClickUpgrade() {
    if (state.currency < state.clickUpgradeCost) return;
    state.currency -= state.clickUpgradeCost;
    state.clickPower += 1;
    state.clickUpgradeLevel += 1;
    state.clickUpgradeCost = Math.floor(10 + state.clickUpgradeLevel * 7);
    updateUI();
  }

  function buyAutoUpgrade() {
    if (state.currency < state.autoUpgradeCost) return;
    state.currency -= state.autoUpgradeCost;
    state.autoIncome += 1;
    state.autoUpgradeLevel += 1;
    state.autoUpgradeCost = Math.floor(20 + state.autoUpgradeLevel * 12);
    updateUI();
  }

  function resetGame() {
    if (confirm('重启星轨，所有进度将清空，确定吗？')) {
      state.currency = 0;
      state.totalMined = 0;
      state.clickPower = 1;
      state.autoIncome = 0;
      state.level = 1;
      state.clickUpgradeCost = 10;
      state.autoUpgradeCost = 20;
      state.clickUpgradeLevel = 0;
      state.autoUpgradeLevel = 0;
      updateUI();
    }
  }

  // 事件绑定
  mineArea.addEventListener('click', handleMineClick);
  mineArea.addEventListener('touchstart', function(e) {
    const touch = e.touches[0];
    if (touch) {
      handleMineClick({ clientX: touch.clientX, clientY: touch.clientY });
    }
    e.preventDefault();
  }, { passive: false });

  buyClickBtn.addEventListener('click', buyClickUpgrade);
  buyAutoBtn.addEventListener('click', buyAutoUpgrade);
  resetBtn.addEventListener('click', resetGame);

  // 自动采矿
  let autoInterval = setInterval(() => {
    if (state.autoIncome > 0) {
      const gain = state.autoIncome;
      state.currency += gain;
      state.totalMined += gain;
      updateLevel();
      updateUI();
    }
  }, 1000);

  updateUI();

  // 暴露全局供 Mod 使用
  window.__state = state;
  window.__updateUI = updateUI;

  // ============================================================
  // 2. Mod 菜单 (独立)
  // ============================================================
  const fab = document.getElementById('mod-fab');
  const panel = document.getElementById('mod-panel');
  const closeBtn = document.getElementById('modClose');

  // ---- 拖拽 ----
  let isDragging = false;
  let startX, startY, startLeft, startTop;

  function getPos() {
    const rect = fab.getBoundingClientRect();
    return { left: rect.left, top: rect.top };
  }

  function onDragStart(e) {
    if (e.type === 'mousedown' && e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    isDragging = true;
    const touch = e.touches ? e.touches[0] : e;
    startX = touch.clientX;
    startY = touch.clientY;
    const rect = fab.getBoundingClientRect();
    startLeft = rect.left;
    startTop = rect.top;
    fab.style.cursor = 'grabbing';
    fab.style.transition = 'none';
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup', onDragEnd);
    document.addEventListener('touchmove', onDragMove, { passive: false });
    document.addEventListener('touchend', onDragEnd, { passive: false });
  }

  function onDragMove(e) {
    if (!isDragging) return;
    e.preventDefault();
    const touch = e.touches ? e.touches[0] : e;
    const dx = touch.clientX - startX;
    const dy = touch.clientY - startY;
    let newLeft = startLeft + dx;
    let newTop = startTop + dy;
    // 边界限制
    const size = 56;
    newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - size));
    newTop = Math.max(0, Math.min(newTop, window.innerHeight - size));
    fab.style.left = newLeft + 'px';
    fab.style.top = newTop + 'px';
    fab.style.right = 'auto';
    fab.style.bottom = 'auto';
  }

  function onDragEnd(e) {
    if (isDragging) {
      isDragging = false;
      fab.style.cursor = 'grab';
      fab.style.transition = '';
      document.removeEventListener('mousemove', onDragMove);
      document.removeEventListener('mouseup', onDragEnd);
      document.removeEventListener('touchmove', onDragMove);
      document.removeEventListener('touchend', onDragEnd);
    }
  }

  fab.addEventListener('mousedown', onDragStart);
  fab.addEventListener('touchstart', onDragStart, { passive: false });

  // ---- 点击打开/关闭面板 ----
  let clickTimer = null;
  fab.addEventListener('click', function(e) {
    if (isDragging) return;
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => {
      panel.classList.toggle('open');
    }, 10);
  });

  closeBtn.addEventListener('click', function() {
    panel.classList.remove('open');
  });

  // ---- Mod 功能 ----
  function addLog(msg) {
    const logArea = document.getElementById('logArea');
    const div = document.createElement('div');
    div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logArea.appendChild(div);
    logArea.scrollTop = logArea.scrollHeight;
    if (logArea.children.length > 50) {
      logArea.removeChild(logArea.firstChild);
    }
  }

  // 数值修改
  document.getElementById('applyCurrency').addEventListener('click', function() {
    const val = parseInt(document.getElementById('modCurrency').value);
    if (!isNaN(val) && val >= 0) {
      state.currency = val;
      updateUI();
      addLog(`💎 货币设置为 ${val}`);
    }
  });
  document.getElementById('applyClickPower').addEventListener('click', function() {
    const val = parseInt(document.getElementById('modClickPower').value);
    if (!isNaN(val) && val >= 1) {
      state.clickPower = val;
      updateUI();
      addLog(`⚡ 点击力量设置为 ${val}`);
    }
  });
  document.getElementById('applyAutoIncome').addEventListener('click', function() {
    const val = parseInt(document.getElementById('modAutoIncome').value);
    if (!isNaN(val) && val >= 0) {
      state.autoIncome = val;
      updateUI();
      addLog(`🤖 自动收入设置为 ${val}/秒`);
    }
  });

  // 加速
  let speedFactor = 1;
  const speedLabel = document.getElementById('speedLabel');
  let autoIntervalRef = autoInterval;

  function updateSpeed() {
    speedLabel.textContent = speedFactor;
    clearInterval(autoIntervalRef);
    const intervalMs = Math.max(100, 1000 / speedFactor);
    autoIntervalRef = setInterval(() => {
      if (state.autoIncome > 0) {
        state.currency += state.autoIncome;
        state.totalMined += state.autoIncome;
        updateLevel();
        updateUI();
      }
    }, intervalMs);
    addLog(`⏩ 加速 x${speedFactor}`);
  }

  document.getElementById('speedUp').addEventListener('click', function() {
    if (speedFactor < 20) {
      speedFactor = Math.min(20, speedFactor + 0.5);
      updateSpeed();
    }
  });
  document.getElementById('speedDown').addEventListener('click', function() {
    if (speedFactor > 0.5) {
      speedFactor = Math.max(0.5, speedFactor - 0.5);
      updateSpeed();
    }
  });

  // 一键解锁
  document.getElementById('unlockAll').addEventListener('click', function() {
    state.clickPower = 50;
    state.autoIncome = 20;
    state.currency = 9999;
    state.totalMined = 5000;
    updateLevel();
    updateUI();
    document.getElementById('modCurrency').value = 9999;
    document.getElementById('modClickPower').value = 50;
    document.getElementById('modAutoIncome').value = 20;
    addLog('🚀 解锁完成！点击+50，自动+20/秒，货币9999');
  });

  // 日志开关
  const logToggle = document.getElementById('logToggle');
  let logEnabled = true;
  logToggle.addEventListener('click', function() {
    logEnabled = !logEnabled;
    logToggle.classList.toggle('active', logEnabled);
    addLog(logEnabled ? '📋 日志开启' : '📋 日志关闭');
  });

  // 劫持 console.log
  const origLog = console.log;
  console.log = function(...args) {
    origLog(...args);
    if (logEnabled) {
      addLog('📌 ' + args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '));
    }
  };

  addLog('🛠️ Mod 已启动 (拖动球体移动)');
})();
</script>

</body>
</html>
