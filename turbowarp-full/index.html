<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>初见的 TurboWarp ^_^ · 选版本</title>
<style>
  body { margin:0; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; background:#000; color:#fff;
         display:flex; justify-content:center; padding:28px 14px; }
  .wrap { width:340px; max-width:94vw; }
  .face { font-size:34px; }
  h1 { font-size:20px; margin:6px 0 2px; }
  p.sub { opacity:.75; font-size:13px; margin:0 0 16px; line-height:1.5; }
  button.ver { display:block; width:100%; text-align:left; margin-top:8px; padding:11px 13px;
    border-radius:10px; border:2px solid #fff; background:#111; color:#fff; cursor:pointer; font-size:14px; }
  button.ver small { display:block; opacity:.7; font-size:12px; margin-top:2px; }
  button.ver.cur { background:#fff; color:#000; }
  button.go { display:block; width:100%; margin-top:16px; padding:12px; border-radius:10px; border:none;
    background:#fff; color:#000; font-size:15px; font-weight:bold; cursor:pointer; }
  .foot { opacity:.55; font-size:12px; margin-top:14px; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">
  <div class="face">^_^</div>
  <h1>初见的 TurboWarp</h1>
  <p class="sub">Ciallo～ 一个包，五个版本，素材只存一份。<br>选一个版本进入，之后在编辑器里点“版本”按钮随时换。</p>
  <div id="list"></div>
  <button class="go" id="go">直接进入（用上次的版本）</button>
  <div class="foot">第一次打开 editor 后记得刷新一次，让离线素材库和扩展库生效。<br>在 MT 预览里如果整页刷新后打不开，重新点一次文件即可；用 Termux 起服务器最稳。</div>
</div>
<script>
  var NAMES = { v1: 'v1 原版镜像', v2: 'v2 初见经典', v3: 'v3 进阶', v4: 'v4 猫猫', v5: 'v5 完全体' };
  var DESCS = {
    v1: '纯官方，啥都不加',
    v2: '黑白主题 + 欢迎牌 + 彩虹调试台',
    v3: 'v2 + 工具条 + 灵动岛 + 路径修复',
    v4: 'v3 + 猫积木默认开启',
    v5: 'v4 + 作品自动备份'
  };
  var cur = 'v5';
  try { cur = localStorage.getItem('chujian-version') || 'v5'; } catch (e) {}
  var list = document.getElementById('list');
  Object.keys(NAMES).forEach(function (v) {
    var b = document.createElement('button');
    b.className = 'ver' + (v === cur ? ' cur' : '');
    b.innerHTML = NAMES[v] + (v === cur ? ' ✓' : '') + '<small>' + DESCS[v] + '</small>';
    b.onclick = function () {
      try { localStorage.setItem('chujian-version', v); } catch (e) {}
      location.href = 'editor.html';
    };
    list.appendChild(b);
  });
  document.getElementById('go').onclick = function () { location.href = 'editor.html'; };
</script>
</body>
</html>
