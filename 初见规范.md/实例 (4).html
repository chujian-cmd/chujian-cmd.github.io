<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    const ICONS = {
      moon: '<path d="M21 12.5A7.5 7.5 0 0 1 10.5 3a6.5 6.5 0 1 0 10.5 9.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>',
      bell: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.7 21a2 2 0 0 1-3.4 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>',
      lock: '<rect x="3" y="11" width="18" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 11V7a5 5 0 0 1 10 0v4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>',
      info: '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 16v-5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="8" r="0.75" fill="currentColor" stroke="none"/>'
    };

    const CONFIG = {
      title: '极简设置',
      subtitle: '调整你的偏好',
      switches: [
        { id: 'moon', label: '深色模式', icon: 'moon', default: false },
        { id: 'bell', label: '通知提醒', icon: 'bell', default: true },
        { id: 'lock', label: '安全锁定', icon: 'lock', default: true }
      ],
      actions: [
        { id: 'reset', label: '重置' },
        { id: 'apply', label: '应用更改' }
      ],
      status: '所有更改将在应用后生效'
    };
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #FFFFFF;
      color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .panel {
      width: 100%;
      max-width: 420px;
      background: #FFFFFF;
      border: 1px solid #E5E5E5;
      border-radius: 24px;
      padding: 28px 24px 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
    }

    .header {
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #000000;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 14px;
      color: #999;
      font-weight: 400;
    }

    .switch-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 28px;
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 8px;
      border-radius: 12px;
      background: #FFFFFF;
      transition: background 0.2s ease;
    }

    .switch-row:hover {
      background: #F5F5F5;
    }

    .switch-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .switch-icon {
      width: 22px;
      height: 22px;
      color: #000000;
      flex-shrink: 0;
      transition: color 0.25s ease;
    }

    .switch-icon svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .switch-label {
      font-size: 15px;
      font-weight: 400;
      color: #000000;
      transition: color 0.25s ease;
    }

    .switch-control {
      width: 50px;
      height: 30px;
      border-radius: 50px;
      background: #E5E5E5;
      border: 1px solid #CCC;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.3s ease, border-color 0.3s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .switch-control.active {
      background: #000000;
      border-color: #000000;
    }

    .switch-knob {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #FFFFFF;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: transform 0.3s cubic-bezier(0.34, 1.2, 0.64, 1), background 0.3s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    .switch-control.active .switch-knob {
      transform: translateX(20px);
    }

    .action-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn {
      flex: 1;
      padding: 12px 16px;
      border-radius: 50px;
      border: 1px solid #E5E5E5;
      background: #FFFFFF;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      color: #000000;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover {
      background: #F5F5F5;
      border-color: #CCC;
    }

    .btn:active {
      transform: scale(0.98);
      background: #E5E5E5;
    }

    .btn.primary {
      background: #000000;
      border-color: #000000;
      color: #FFFFFF;
    }

    .btn.primary:hover {
      background: #333;
      border-color: #333;
    }

    .btn.primary:active {
      background: #666;
      border-color: #666;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: #F5F5F5;
      border: 1px solid #E5E5E5;
      border-radius: 50px;
      color: #666;
      font-size: 13px;
      transition: background 0.2s ease;
    }

    .status-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      color: #999;
      transition: color 0.2s ease;
    }

    .status-icon svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .status-text {
      font-weight: 400;
      color: #666;
    }

    .status-bar.flash {
      background: #E5E5E5;
    }

    .status-bar.flash .status-icon {
      color: #000000;
    }

    .status-bar.flash .status-text {
      color: #000000;
    }

    :focus-visible {
      outline: 2px solid #000000;
      outline-offset: 2px;
      border-radius: 50px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <h1 id="main-title"></h1>
      <p id="main-subtitle"></p>
    </div>

    <div class="switch-list" id="switch-list"></div>

    <div class="action-bar" id="action-bar"></div>

    <div class="status-bar" id="status-bar">
      <span class="status-icon" id="status-icon"></span>
      <span class="status-text" id="status-text"></span>
    </div>
  </div>

  <script>
    (function() {
      const titleEl = document.getElementById('main-title');
      const subtitleEl = document.getElementById('main-subtitle');
      const switchListEl = document.getElementById('switch-list');
      const actionBarEl = document.getElementById('action-bar');
      const statusBarEl = document.getElementById('status-bar');
      const statusIconEl = document.getElementById('status-icon');
      const statusTextEl = document.getElementById('status-text');

      titleEl.textContent = CONFIG.title;
      subtitleEl.textContent = CONFIG.subtitle;
      statusTextEl.textContent = CONFIG.status;

      // 状态栏图标
      statusIconEl.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS.info}</svg>`;

      // 开关项
      const switchStates = CONFIG.switches.map(s => s.default);
      const switchElements = [];

      CONFIG.switches.forEach((sw, index) => {
        const row = document.createElement('div');
        row.className = 'switch-row';

        const left = document.createElement('div');
        left.className = 'switch-left';

        const iconSpan = document.createElement('span');
        iconSpan.className = 'switch-icon';
        iconSpan.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[sw.icon] || ICONS.info}</svg>`;

        const labelSpan = document.createElement('span');
        labelSpan.className = 'switch-label';
        labelSpan.textContent = sw.label;

        left.appendChild(iconSpan);
        left.appendChild(labelSpan);

        const control = document.createElement('div');
        control.className = 'switch-control' + (switchStates[index] ? ' active' : '');
        control.setAttribute('role', 'switch');
        control.setAttribute('aria-checked', switchStates[index] ? 'true' : 'false');
        control.setAttribute('tabindex', '0');
        control.setAttribute('aria-label', sw.label);

        const knob = document.createElement('div');
        knob.className = 'switch-knob';
        control.appendChild(knob);

        row.appendChild(left);
        row.appendChild(control);
        switchListEl.appendChild(row);
        switchElements.push({ control, iconSpan, labelSpan, sw, index });

        const toggle = () => {
          const newState = !switchStates[index];
          switchStates[index] = newState;
          control.classList.toggle('active', newState);
          control.setAttribute('aria-checked', newState ? 'true' : 'false');
          flashStatus();
        };

        control.addEventListener('click', toggle);
        control.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggle();
          }
        });
      });

      // 操作栏
      CONFIG.actions.forEach((action, i) => {
        const btn = document.createElement('button');
        btn.className = 'btn' + (i === CONFIG.actions.length - 1 ? ' primary' : '');
        btn.textContent = action.label;
        btn.setAttribute('aria-label', action.label);

        if (action.id === 'reset') {
          btn.addEventListener('click', () => {
            switchStates.forEach((_, idx) => {
              switchStates[idx] = CONFIG.switches[idx].default;
              const el = switchElements[idx];
              el.control.classList.toggle('active', CONFIG.switches[idx].default);
              el.control.setAttribute('aria-checked', CONFIG.switches[idx].default ? 'true' : 'false');
            });
            flashStatus();
          });
        } else if (action.id === 'apply') {
          btn.addEventListener('click', () => {
            flashStatus();
          });
        }

        actionBarEl.appendChild(btn);
      });

      // 状态提示闪烁
      let flashTimer = null;
      function flashStatus() {
        if (flashTimer) {
          clearTimeout(flashTimer);
        }
        statusBarEl.classList.add('flash');
        flashTimer = setTimeout(() => {
          statusBarEl.classList.remove('flash');
          flashTimer = null;
        }, 800);
      }

      // 状态栏图标颜色同步
      const observer = new MutationObserver(() => {
        // noop
      });
    })();
  </script>
</body>
</html>
