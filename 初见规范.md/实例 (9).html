<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>
    // 配置与图标库集中管理
    const CONFIG = {
      settings: [
        { id: 'wifi', label: '无线网络', checked: true, icon: 'wifi' },
        { id: 'bluetooth', label: '蓝牙', checked: false, icon: 'bluetooth' },
        { id: 'notifications', label: '通知', checked: true, icon: 'bell' }
      ],
      status: '所有更改已保存'
    };

    const ICONS = {
      wifi: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1"/></svg>`,
      bluetooth: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11L12 22V2l5.5 4.5-11 11"/></svg>`,
      bell: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>`,
      info: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
      reset: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>`,
      check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`
    };
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极简设置面板</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #F5F5F5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #000000;
    }

    .panel {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: #FFFFFF;
      border-radius: 28px;
      padding: 28px 24px 24px;
      border: 1px solid #E5E5E5;
      box-shadow: none;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #000000;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 15px;
      color: #666666;
      margin-bottom: 32px;
      font-weight: 400;
      line-height: 1.4;
    }

    .setting-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 32px;
    }

    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }

    .setting-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon-wrapper {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333333;
      flex-shrink: 0;
    }

    .icon-wrapper svg {
      width: 100%;
      height: 100%;
      display: block;
      transition: all 0.2s ease;
    }

    .setting-label {
      font-size: 16px;
      font-weight: 500;
      color: #000000;
    }

    /* 开关控件 */
    .switch {
      position: relative;
      display: inline-block;
      width: 52px;
      height: 30px;
      flex-shrink: 0;
      cursor: pointer;
      border-radius: 50px;
      transition: all 0.2s ease;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .switch-track {
      position: absolute;
      inset: 0;
      background: #E5E5E5;
      border-radius: 50px;
      transition: all 0.2s ease;
      border: 1px solid #CCCCCC;
    }

    .switch-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 24px;
      height: 24px;
      background: #FFFFFF;
      border-radius: 50%;
      border: 1px solid #CCCCCC;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .switch-thumb svg {
      width: 14px;
      height: 14px;
      color: #999999;
      transition: all 0.2s ease;
      opacity: 0.8;
    }

    .switch input:checked + .switch-track {
      background: #000000;
      border-color: #000000;
    }

    .switch input:checked + .switch-track + .switch-thumb {
      left: 25px;
      background: #FFFFFF;
      border-color: #000000;
    }

    .switch input:checked + .switch-track + .switch-thumb svg {
      color: #000000;
      opacity: 1;
    }

    .switch:focus-within {
      outline: 1px solid #000000;
      outline-offset: 2px;
      border-radius: 50px;
    }

    /* 操作栏 */
    .actions {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 500;
      line-height: 1;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid #E5E5E5;
      background: #FFFFFF;
      color: #000000;
      font-family: inherit;
      outline: none;
      min-height: 50px;
    }

    .btn svg {
      width: 18px;
      height: 18px;
      display: block;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .btn:hover {
      background: #F5F5F5;
      border-color: #CCCCCC;
    }

    .btn:active {
      background: #E5E5E5;
      border-color: #999999;
      transform: scale(0.98);
    }

    .btn-primary {
      background: #000000;
      color: #FFFFFF;
      border-color: #000000;
    }

    .btn-primary:hover {
      background: #333333;
      border-color: #333333;
    }

    .btn-primary:active {
      background: #666666;
      border-color: #666666;
      transform: scale(0.98);
    }

    .btn-primary svg {
      color: #FFFFFF;
    }

    .btn:focus-visible {
      outline: 1px solid #000000;
      outline-offset: 2px;
    }

    .btn-primary:focus-visible {
      outline: 1px solid #000000;
      outline-offset: 2px;
    }

    /* 状态提示条 */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: #F5F5F5;
      border-radius: 16px;
      border: 1px solid #E5E5E5;
      color: #333333;
      font-size: 14px;
      line-height: 1.4;
    }

    .status-bar svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      color: #666666;
      display: block;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>极简设置面板</h1>
    <p class="subtitle">管理设备连接与通知</p>

    <div class="setting-list" id="settingList"></div>

    <div class="actions">
      <button class="btn" id="resetBtn">
        <span id="resetIcon"></span>
        重置
      </button>
      <button class="btn btn-primary" id="applyBtn">
        <span id="applyIcon"></span>
        应用更改
      </button>
    </div>

    <div class="status-bar" id="statusBar">
      <span id="statusIcon"></span>
      <span id="statusText">所有更改已保存</span>
    </div>
  </div>

  <script>
    (function() {
      // 渲染图标
      function setIcon(el, name) {
        if (el && ICONS[name]) {
          el.innerHTML = ICONS[name];
        }
      }

      // 渲染设置项
      const listEl = document.getElementById('settingList');
      const settings = CONFIG.settings;

      settings.forEach(item => {
        const row = document.createElement('div');
        row.className = 'setting-item';

        const left = document.createElement('div');
        left.className = 'setting-left';

        const iconWrap = document.createElement('span');
        iconWrap.className = 'icon-wrapper';
        iconWrap.innerHTML = ICONS[item.icon] || ICONS.info;

        const label = document.createElement('span');
        label.className = 'setting-label';
        label.textContent = item.label;

        left.appendChild(iconWrap);
        left.appendChild(label);

        const switchLabel = document.createElement('label');
        switchLabel.className = 'switch';

        const input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = item.checked;
        input.id = 'switch-' + item.id;

        const track = document.createElement('span');
        track.className = 'switch-track';

        const thumb = document.createElement('span');
        thumb.className = 'switch-thumb';
        thumb.innerHTML = ICONS.check; // 使用 check 图标

        switchLabel.appendChild(input);
        switchLabel.appendChild(track);
        switchLabel.appendChild(thumb);

        row.appendChild(left);
        row.appendChild(switchLabel);
        listEl.appendChild(row);
      });

      // 渲染按钮图标
      setIcon(document.getElementById('resetIcon'), 'reset');
      setIcon(document.getElementById('applyIcon'), 'check');
      setIcon(document.getElementById('statusIcon'), 'info');

      // 状态提示更新
      const statusText = document.getElementById('statusText');
      const statusMap = {
        saved: '所有更改已保存',
        reset: '设置已重置为默认值',
        applied: '更改已成功应用'
      };

      function updateStatus(key) {
        if (statusMap[key]) {
          statusText.textContent = statusMap[key];
        }
      }

      // 重置按钮
      document.getElementById('resetBtn').addEventListener('click', function(e) {
        e.preventDefault();
        const defaults = [true, false, true]; // 对应 wifi, bluetooth, notifications
        settings.forEach((item, index) => {
          const input = document.getElementById('switch-' + item.id);
          if (input) {
            input.checked = defaults[index];
          }
        });
        updateStatus('reset');
      });

      // 应用按钮
      document.getElementById('applyBtn').addEventListener('click', function(e) {
        e.preventDefault();
        updateStatus('applied');
      });

      // 确保所有图标状态正确
      document.querySelectorAll('.switch-thumb svg').forEach(svg => {
        svg.setAttribute('stroke-width', '2.2');
      });
    })();
  </script>
</body>
</html>
