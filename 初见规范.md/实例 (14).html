<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script>
  const CONFIG = [
    { id: 'wifi', label: '无线网络', desc: '自动连接可用网络', checked: true },
    { id: 'bt', label: '蓝牙', desc: '附近设备可被发现', checked: false },
    { id: 'notify', label: '通知提醒', desc: '仅接收重要消息', checked: true }
  ];
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极简设置面板</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #F5F5F5;
    color: #000000;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  :focus {
    outline: none;
  }

  :focus-visible {
    outline: 2px solid #000000;
    outline-offset: 3px;
  }

  .panel {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    background-color: #FFFFFF;
    border: 1px solid #E5E5E5;
    border-radius: 24px;
    padding: 24px 20px;
  }

  .head {
    padding: 0 2px;
    margin-bottom: 20px;
  }

  h1 {
    margin: 0;
    font-size: 24px;
    line-height: 1.25;
    letter-spacing: -0.01em;
    font-weight: 700;
  }

  .sub {
    margin: 4px 0 0;
    font-size: 14px;
    color: #666666;
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 12px 14px;
    background-color: #F5F5F5;
    border: 1px solid #E5E5E5;
    border-radius: 16px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    touch-action: manipulation;
    outline: none;
    user-select: none;
    -webkit-user-select: none;
    animation: riseIn 0.45s cubic-bezier(0.4, 0, 0.2, 1) backwards;
    transition: transform 0.24s cubic-bezier(0.4, 0, 0.2, 1),
                background-color 0.24s cubic-bezier(0.4, 0, 0.2, 1),
                border-color 0.24s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .row:nth-child(1) { animation-delay: 0.05s; }
  .row:nth-child(2) { animation-delay: 0.14s; }
  .row:nth-child(3) { animation-delay: 0.23s; }

  .row:active {
    transform: scale(0.96);
    background-color: #E5E5E5;
    border-color: #CCCCCC;
  }

  @keyframes riseIn {
    from {
      opacity: 0;
      transform: translateY(16px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .ico {
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background-color: #FFFFFF;
    border: 1px solid #E5E5E5;
    color: #000000;
  }

  .meta {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .label {
    font-size: 15px;
    font-weight: 600;
    color: #000000;
  }

  .desc {
    font-size: 14px;
    color: #999999;
  }

  .switch {
    flex: 0 0 auto;
    display: block;
    align-self: center;
  }

  .switch .track {
    fill: #E5E5E5;
    stroke: #CCCCCC;
    stroke-width: 1.5;
    transition: fill 0.24s cubic-bezier(0.4, 0, 0.2, 1),
                stroke 0.24s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .switch .thumb {
    fill: #FFFFFF;
    transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
                fill 0.24s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .row[aria-checked="true"] .switch .track {
    fill: #000000;
    stroke: #000000;
  }

  .row[aria-checked="true"] .switch .thumb {
    transform: translateX(20px);
  }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  .btn {
    flex: 1 1 0;
    padding: 13px 16px;
    border-radius: 50px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    touch-action: manipulation;
    outline: none;
    transition: transform 0.24s cubic-bezier(0.4, 0, 0.2, 1),
                background-color 0.24s cubic-bezier(0.4, 0, 0.2, 1),
                color 0.24s cubic-bezier(0.4, 0, 0.2, 1),
                border-color 0.24s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .btn.primary {
    background-color: #000000;
    color: #FFFFFF;
    border: 1px solid #000000;
  }

  .btn.primary:active {
    background-color: #FFFFFF;
    color: #000000;
    transform: scale(0.96);
  }

  .btn.ghost {
    background-color: #FFFFFF;
    color: #000000;
    border: 1px solid #CCCCCC;
  }

  .btn.ghost:active {
    background-color: #000000;
    color: #FFFFFF;
    border-color: #000000;
    transform: scale(0.96);
  }

  .toast {
    margin-top: 18px;
    background-color: #F5F5F5;
    border: 1px solid #E5E5E5;
    border-radius: 16px;
    overflow: hidden;
  }

  .toast-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    cursor: pointer;
    background-color: #F5F5F5;
    -webkit-appearance: none;
    appearance: none;
    touch-action: manipulation;
    outline: none;
    transition: background-color 0.24s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .toast-head .info {
    flex: 0 0 auto;
    color: #000000;
  }

  .toast-text {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 14px;
    color: #333333;
  }

  .chev {
    flex: 0 0 auto;
    color: #666666;
  }

  .chev-path {
    transition: d 0.26s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .toast.open .chev-path {
    d: path("M8 14 L12 10 L16 14");
  }

  .toast-body {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .toast.open .toast-body {
    grid-template-rows: 1fr;
  }

  .toast-inner {
    overflow: hidden;
    min-height: 0;
  }

  .toast-inner p {
    margin: 0;
    padding: 0 14px 14px;
    font-size: 14px;
    line-height: 1.6;
    color: #666666;
  }
</style>
</head>
<body>
  <main class="panel">
    <header class="head">
      <h1>极简设置</h1>
      <p class="sub">保持专注，保持简洁</p>
    </header>

    <div class="list" id="list"></div>

    <div class="actions">
      <button type="button" class="btn primary" id="save">保存设置</button>
      <button type="button" class="btn ghost" id="reset">恢复默认</button>
    </div>

    <section class="toast" id="toast">
      <div class="toast-head" id="toastHead" role="button" tabindex="0" aria-expanded="false">
        <svg class="info" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 11v5"></path>
          <path d="M12 7.75v0.01"></path>
        </svg>
        <span class="toast-text" id="toastText">当前已启用 0 项设置</span>
        <svg class="chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path class="chev-path" d="M8 10 L12 14 L16 10"></path>
        </svg>
      </div>
      <div class="toast-body">
        <div class="toast-inner">
          <p>所有更改仅在本次会话内生效，关闭页面后将自动还原。你也可以随时点击恢复默认，回到初始状态。</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    const ICONS = {
      wifi: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11a10 10 0 0 1 14 0"/><path d="M8.5 14.5a5.5 5.5 0 0 1 7 0"/><circle cx="12" cy="18" r="1.4" fill="currentColor" stroke="none"/></svg>',
      bt: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 7.5-5 4V5.5l5 4L7 17"/></svg>',
      notify: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15.5h12l-1.5-2v-3.5a4.5 4.5 0 0 0-9 0v3.5L6 15.5z"/><path d="M10.5 18.5a1.5 1.5 0 0 0 3 0"/></svg>'
    };

    const list = document.getElementById('list');
    const toast = document.getElementById('toast');
    const toastHead = document.getElementById('toastHead');
    const toastText = document.getElementById('toastText');
    const saveBtn = document.getElementById('save');
    const resetBtn = document.getElementById('reset');

    let state = CONFIG.map(item => ({ ...item }));

    list.innerHTML = state.map((item, i) => `
      <div class="row" data-index="${i}" role="switch" tabindex="0" aria-checked="${item.checked}">
        <span class="ico">${ICONS[item.id]}</span>
        <span class="meta">
          <span class="label">${item.label}</span>
          <span class="desc">${item.desc}</span>
        </span>
        <svg class="switch" viewBox="0 0 48 28" width="48" height="28" aria-hidden="true">
          <rect class="track" x="1" y="1" width="46" height="26" rx="13"></rect>
          <circle class="thumb" cx="14" cy="14" r="9"></circle>
        </svg>
      </div>
    `).join('');

    function syncText() {
      const count = state.filter(item => item.checked).length;
      toastText.textContent = '当前已启用 ' + count + ' 项设置';
    }

    function toggle(row) {
      const index = Number(row.dataset.index);
      state[index].checked = !state[index].checked;
      row.setAttribute('aria-checked', String(state[index].checked));
      syncText();
    }

    list.addEventListener('click', event => {
      const row = event.target.closest('.row');
      if (row) toggle(row);
    });

    list.addEventListener('keydown', event => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      const row = event.target.closest('.row');
      if (!row) return;
      event.preventDefault();
      toggle(row);
    });

    function togglePanel() {
      const open = toast.classList.toggle('open');
      toastHead.setAttribute('aria-expanded', String(open));
    }

    toastHead.addEventListener('click', togglePanel);

    toastHead.addEventListener('keydown', event => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      event.preventDefault();
      togglePanel();
    });

    saveBtn.addEventListener('click', () => {
      toastText.textContent = '设置已保存';
    });

    resetBtn.addEventListener('click', () => {
      state = CONFIG.map(item => ({ ...item }));
      document.querySelectorAll('.row').forEach((row, i) => {
        row.setAttribute('aria-checked', String(state[i].checked));
      });
      syncText();
    });

    syncText();
  </script>
</body>
</html>
