<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>星 → 圆</title>
<style>
  html,body{height:100%;margin:0;display:grid;place-items:center;background:#fff}
  svg{width:min(80vmin,400px);height:min(80vmin,400px)}
</style>
</head>
<body>
<svg viewBox="-100 -100 200 200" xmlns="http://www.w3.org/2000/svg">
  <circle r="75" fill="#4a90d9">
    <animate attributeName="r" values="75;0;0;75" keyTimes="0;0.3;0.7;1" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
  </circle>
  <polygon fill="#f5a623" points="0,-90 21,-28 90,-28 34,12 56,76 0,42 -56,76 -34,12 -90,-28 -21,-28">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.3;0.7;1" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="0.2;1;1;0.2" keyTimes="0;0.3;0.7;1" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
  </polygon>
</svg>
</body>
</html>
