<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极简黑白示例</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #FFFFFF;
    color: #000000;
    font-size: 15px;
    line-height: 1.6;
    padding: 48px 24px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  h2 { font-size: 16px; font-weight: 600; margin: 32px 0 12px; }
  p  { color: #333333; }
  hr { border: none; border-top: 1px solid #E5E5E5; margin: 32px 0; }

  .row { display: flex; gap: 12px; flex-wrap: wrap; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; font-size: 14px; font-family: inherit;
    background: #FFFFFF; color: #000000;
    border: 1px solid #000000; border-radius: 4px; cursor: pointer;
  }
  .btn:hover { background: #000000; color: #FFFFFF; }
  .btn--ghost { border-color: #CCC; color: #333; }
  .btn--ghost:hover { background: #F5F5F5; color: #000; }

  .card {
    border: 1px solid #E5E5E5; border-radius: 4px;
    padding: 16px; display: flex; gap: 12px; align-items: flex-start;
  }
  .card svg { flex-shrink: 0; color: #000; }
  .card p { font-size: 14px; color: #666; }

  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #000; }
  .dot--off { background: #CCC; }
</style>
</head>
<body>
<div class="wrap">

  <h1>极简黑白</h1>
  <p>无 emoji，无位图，所有视觉元素为内联 SVG。</p>

  <hr>

  <h2>按钮</h2>
  <div class="row">
    <button class="btn">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round"/>
      </svg>
      新建
    </button>
    <button class="btn btn--ghost">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path d="M4 12h16M14 6l6 6-6 6" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      下一步
    </button>
  </div>

  <h2>卡片</h2>
  <div class="card">
    <svg viewBox="0 0 24 24" width="20" height="20" role="img">
      <title>信息</title>
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M12 10v6M12 7v.5" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <div>
      <p>图标由 SVG 路径绘制，颜色继承 currentColor，随文字黑白翻转。</p>
    </div>
  </div>

  <h2>状态</h2>
  <div class="row">
    <span class="status"><span class="dot"></span>运行中</span>
    <span class="status"><span class="dot dot--off"></span>已停止</span>
  </div>

</div>
</body>
</html>
