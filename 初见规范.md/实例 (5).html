<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    // 配置与图标集中管理
    const CONFIG = {
      title: "极简设置面板",
      subtitle: "偏好与通知",
      switches: [
        { id: "notifications", label: "消息通知", desc: "接收新消息提醒", icon: "bell", defaultOn: true },
        { id: "darkmode", label: "深色模式", desc: "跟随系统外观", icon: "moon", defaultOn: false },
        { id: "sync", label: "自动同步", desc: "跨设备同步数据", icon: "refresh", defaultOn: true }
      ],
      status: {
        text: "所有更改将在点击「应用更改」后生效。",
        icon: "info"
      }
    };

    const ICONS = {
      bell: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" fill="none"/><path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" fill="none"/>',
      moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" fill="none"/>',
      refresh: '<path d="M23 4v6h-6M1 20v-6h6" stroke="currentColor" fill="none"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" stroke="currentColor" fill="none"/>',
      info: '<circle cx="12" cy="12" r="10" stroke="currentColor" fill="none"/><line x1="12" y1="16" x2="12" y2="12" stroke="currentColor" fill="none"/><line x1="12" y1="8" x2="12.01" y2="8" stroke="currentColor" fill="none"/>',
      reset: '<path d="M1 4v6h6M23 20v-6h-6" stroke="currentColor" fill="none"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15" stroke="currentColor" fill="none"/>',
      check: '<path d="M20 6L9 17l-5-5" stroke="currentColor" fill="none"/>'
    };
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极简设置面板</title>

  <style>
    /* 全局重置与字体 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #FFFFFF;
      color: #000000;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    /* 主卡片——手机不缩水，PC居中 */
    .panel {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: #FFFFFF;
      border: 1px solid #E5E5E5;
      border-radius: 28px;
      padding: 1.75rem 1.5rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.02);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    /* 标题区 */
    .header {
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.75rem; /* 28px >20px 符合 */
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
      color: #000000;
    }

    .subtitle {
      font-size: 1rem;
      color: #666;
    }

    /* 开关列表 */
    .switch-list {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin-bottom: 2rem;
    }

    .switch-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 0.75rem;
      border-radius: 16px;
      transition: background 0.2s ease;
      cursor: pointer;
      user-select: none;
    }

    .switch-item:hover {
      background: #F5F5F5;
    }

    .switch-info {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      flex: 1;
      min-width: 0;
    }

    .icon {
      width: 24px;
      height: 24px;
      color: #333;
      flex-shrink: 0;
      transition: color 0.2s ease;
    }

    .switch-text {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      min-width: 0;
    }

    .switch-label {
      font-weight: 500;
      font-size: 1rem;
      color: #000;
      transition: color 0.2s ease;
    }

    .switch-desc {
      font-size: 0.8rem;
      color: #999;
      transition: color 0.2s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* SVG开关控件 */
    .toggle {
      width: 52px;
      height: 32px;
      flex-shrink: 0;
      margin-left: 1rem;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* 开关轨道 */
    .toggle-track {
      fill: #E5E5E5;
      transition: fill 0.2s ease;
    }

    /* 开关圆钮 */
    .toggle-thumb {
      fill: #FFFFFF;
      stroke: #CCC;
      stroke-width: 1.5;
      transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.1), stroke 0.2s ease, fill 0.2s ease;
    }

    /* 激活态样式由JS添加active类 */
    .switch-item.active .toggle-track {
      fill: #000000;
    }

    .switch-item.active .toggle-thumb {
      transform: translateX(20px);
      stroke: #000000;
    }

    /* 图标激活颜色变化 */
    .switch-item.active .icon {
      color: #000000;
    }

    /* 操作栏 */
    .action-bar {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1 1 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 0.85rem 1.2rem;
      border-radius: 50px;
      border: 1px solid #E5E5E5;
      background: #FFFFFF;
      color: #000000;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: #F5F5F5;
      border-color: #CCC;
    }

    .btn:active {
      background: #E5E5E5;
    }

    .btn-primary {
      background: #000000;
      border-color: #000000;
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background: #333;
      border-color: #333;
    }

    .btn-primary:active {
      background: #666;
      border-color: #666;
    }

    .btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      transition: stroke 0.2s ease;
    }

    .btn-primary svg {
      stroke: #FFFFFF;
    }

    .btn:not(.btn-primary) svg {
      stroke: #333;
    }

    /* 状态提示条 */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.9rem 1.2rem;
      border: 1px solid #E5E5E5;
      border-radius: 50px;
      background: #F5F5F5;
      font-size: 0.9rem;
      color: #333;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .status-bar .icon {
      width: 20px;
      height: 20px;
      color: #666;
      flex-shrink: 0;
      transition: color 0.2s ease;
    }

    /* 移动端小调整 */
    @media (max-width: 380px) {
      .panel {
        padding: 1.25rem 1rem;
        border-radius: 24px;
      }

      h1 {
        font-size: 1.5rem;
      }

      .switch-item {
        padding: 0.85rem 0.5rem;
      }

      .btn {
        padding: 0.75rem 1rem;
        font-size: 0.9rem;
      }

      .switch-desc {
        white-space: normal;
        font-size: 0.75rem;
      }

      .toggle {
        width: 48px;
        height: 30px;
      }

      .toggle-thumb {
        /* 保持位移平滑 */
        transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.1);
      }

      .switch-item.active .toggle-thumb {
        transform: translateX(18px);
      }
    }

    /* 辅助: 焦点可见 */
    .btn:focus-visible, .toggle:focus-visible, .switch-item:focus-visible {
      outline: 2px solid #000000;
      outline-offset: 2px;
    }
    .btn-primary:focus-visible {
      outline-color: #000000;
    }
  </style>
</head>
<body>
  <div class="panel" role="region" aria-label="设置面板">
    <!-- 标题区 -->
    <div class="header">
      <h1>极简设置面板</h1>
      <p class="subtitle">偏好与通知</p>
    </div>

    <!-- 开关列表容器 -->
    <div class="switch-list" id="switchList">
      <!-- JS 动态渲染开关项，确保配置集中管理且可维护 -->
    </div>

    <!-- 操作栏 -->
    <div class="action-bar">
      <button class="btn" id="resetBtn" type="button" aria-label="重置设置">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M1 4v6h6M23 20v-6h-6" />
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15" />
        </svg>
        重置
      </button>
      <button class="btn btn-primary" id="applyBtn" type="button" aria-label="应用更改">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 6L9 17l-5-5" />
        </svg>
        应用更改
      </button>
    </div>

    <!-- 状态提示条 -->
    <div class="status-bar" id="statusBar">
      <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="16" x2="12" y2="12" />
        <line x1="12" y1="8" x2="12.01" y2="8" />
      </svg>
      <span id="statusText">所有更改将在点击「应用更改」后生效。</span>
    </div>
  </div>

  <script>
    (function() {
      // 从CONFIG构建开关UI
      const switchList = document.getElementById('switchList');
      const statusText = document.getElementById('statusText');
      const resetBtn = document.getElementById('resetBtn');
      const applyBtn = document.getElementById('applyBtn');

      // 保存当前状态（用于重置）
      let switchStates = CONFIG.switches.map(s => s.defaultOn);

      // 生成开关项
      function renderSwitches() {
        switchList.innerHTML = '';
        CONFIG.switches.forEach((item, index) => {
          const isOn = switchStates[index];
          const itemEl = document.createElement('div');
          itemEl.className = `switch-item ${isOn ? 'active' : ''}`;
          itemEl.setAttribute('data-index', index);
          itemEl.setAttribute('tabindex', '0');
          itemEl.setAttribute('role', 'switch');
          itemEl.setAttribute('aria-checked', isOn ? 'true' : 'false');
          itemEl.setAttribute('aria-label', `${item.label}, ${item.desc}, ${isOn ? '开启' : '关闭'}`);

          // 根据配置的ICONS渲染图标
          const iconSvg = `<svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[item.icon] || ''}</svg>`;

          // 开关图形 — 圆角矩形轨道+圆形滑块
          const toggleSvg = `
            <svg viewBox="0 0 52 32" width="52" height="32" aria-hidden="true">
              <rect class="toggle-track" x="1" y="1" width="50" height="30" rx="15" ry="15" />
              <circle class="toggle-thumb" cx="16" cy="16" r="12" />
            </svg>
          `;

          itemEl.innerHTML = `
            <div class="switch-info">
              ${iconSvg}
              <div class="switch-text">
                <span class="switch-label">${item.label}</span>
                <span class="switch-desc">${item.desc}</span>
              </div>
            </div>
            <button class="toggle" type="button" tabindex="-1" aria-hidden="true">${toggleSvg}</button>
          `;

          // 点击切换
          itemEl.addEventListener('click', (e) => {
            // 防止按钮触发两次（按钮本身不处理点击，但会冒泡）
            if (e.target.closest('.toggle')) return;
            toggleSwitch(index);
          });

          // 键盘支持 (Enter / Space)
          itemEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              toggleSwitch(index);
            }
          });

          // 开关按钮点击(实际点击由父级处理)
          // 无额外处理

          switchList.appendChild(itemEl);
        });
      }

      // 切换某个开关状态
      function toggleSwitch(index) {
        switchStates[index] = !switchStates[index];
        updateUI();
      }

      // 根据switchStates更新DOM
      function updateUI() {
        const items = switchList.querySelectorAll('.switch-item');
        items.forEach((item, idx) => {
          const isOn = switchStates[idx];
          if (isOn) {
            item.classList.add('active');
          } else {
            item.classList.remove('active');
          }
          item.setAttribute('aria-checked', isOn ? 'true' : 'false');
          // 更新aria-label
          const conf = CONFIG.switches[idx];
          item.setAttribute('aria-label', `${conf.label}, ${conf.desc}, ${isOn ? '开启' : '关闭'}`);
        });
      }

      // 重置到默认状态
      function resetToDefaults() {
        switchStates = CONFIG.switches.map(s => s.defaultOn);
        updateUI();
        statusText.textContent = '已重置为默认设置。';
        // 短暂高亮提示条
        const bar = document.getElementById('statusBar');
        bar.style.backgroundColor = '#E5E5E5';
        setTimeout(() => {
          bar.style.backgroundColor = '#F5F5F5';
        }, 300);
      }

      // 应用更改
      function applyChanges() {
        // 简单反馈，实际应用中可提交
        statusText.textContent = '设置已应用。';
        const bar = document.getElementById('statusBar');
        bar.style.backgroundColor = '#E5E5E5';
        setTimeout(() => {
          bar.style.backgroundColor = '#F5F5F5';
        }, 400);
      }

      // 初始化
      renderSwitches();

      // 事件绑定
      resetBtn.addEventListener('click', resetToDefaults);
      applyBtn.addEventListener('click', applyChanges);

      // 初始化状态文本
      statusText.textContent = CONFIG.status.text;
    })();
  </script>
</body>
</html>
