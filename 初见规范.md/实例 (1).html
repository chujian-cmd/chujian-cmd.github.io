<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极简设置面板</title>
  <style>
    /* 全局重置与字体 —— 仅黑白灰 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #FFFFFF;
      font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .panel {
      max-width: 480px;
      width: 100%;
      background-color: #FFFFFF;
      border: 1px solid #E5E5E5;
      border-radius: 4px;   /* 统一圆角4px */
      padding: 24px 20px 20px 20px;
      box-shadow: none;
    }

    /* 标题区 */
    .header {
      margin-bottom: 24px;
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #000000;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      font-weight: 400;
    }

    /* 开关列表 */
    .settings-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 28px;
    }

    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #E5E5E5;
    }

    .setting-item:last-child {
      border-bottom: none;
    }

    .setting-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
    }

    .icon-wrapper svg {
      display: block;
      width: 22px;
      height: 22px;
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .setting-label {
      font-size: 15px;
      font-weight: 500;
      color: #000000;
      letter-spacing: 0.01em;
    }

    /* 开关控件 (SVG 内联，无彩色) */
    .switch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      width: 48px;
      height: 28px;
      flex-shrink: 0;
    }

    .switch svg {
      display: block;
      width: 48px;
      height: 28px;
    }

    /* 操作栏 */
    .actions {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      padding: 6px 0;
    }

    .btn {
      flex: 1;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      border-radius: 4px;
      border: 1px solid #E5E5E5;
      background: #FFFFFF;
      color: #000000;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      line-height: 1.4;
      letter-spacing: 0.01em;
      box-shadow: none;
    }

    .btn-primary {
      background: #000000;
      color: #FFFFFF;
      border-color: #000000;
    }

    .btn-primary:hover {
      background: #333333;
      border-color: #333333;
    }

    .btn-secondary {
      background: #FFFFFF;
      color: #000000;
      border-color: #E5E5E5;
    }

    .btn-secondary:hover {
      background: #F5F5F5;
      border-color: #CCCCCC;
    }

    /* 状态提示条 */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: #F5F5F5;
      border: 1px solid #E5E5E5;
      border-radius: 4px;
      padding: 12px 14px;
      font-size: 14px;
      color: #333333;
      line-height: 1.4;
    }

    .status-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .status-icon svg {
      display: block;
      width: 20px;
      height: 20px;
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .status-text {
      flex: 1;
    }

    /* 可访问性隐藏 */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }
  </style>
</head>
<body>

<div class="panel" id="app-panel">
  <!-- 渲染内容全部由 JS 根据 CONFIG 生成，但结构在此占位，渲染逻辑后续从CONFIG读取 -->
  <div id="app-root"></div>
</div>

<script>
  // ==================== 统一配置对象 ====================
  // 所有可修改配置集中在最前面，渲染逻辑只读取此对象，无硬编码
  const CONFIG = {
    // 标题区
    title: "设置",
    subtitle: "管理面板偏好与通知",

    // 三个开关项定义
    switches: [
      {
        id: "sync",
        label: "自动同步",
        // 左侧图标类型（由内部渲染函数处理，但也可用配置指定，这里以type标识）
        iconType: "sync",
        // 初始状态（true=开，false=关）
        initialOn: true
      },
      {
        id: "notifications",
        label: "通知提醒",
        iconType: "bell",
        initialOn: false
      },
      {
        id: "darkmode",
        label: "深色模式预览",
        iconType: "moon",
        initialOn: false
      }
    ],

    // 操作栏按钮
    primaryButtonText: "应用更改",
    secondaryButtonText: "重置",

    // 状态提示条
    statusIconType: "info",      // 图标类型: info, check, warning 等，仅用简单svg
    statusText: "所有设置已保存至本地",   // 动态提示可被交互更新，初始显示

    // 设计令牌 —— 统一风格数值（可调但不变风格）
    style: {
      borderRadius: 4,          // 圆角(px)
      strokeWidth: 1.5,         // SVG线宽
      borderColor: "#E5E5E5",
      mutedGray: "#666666",
      lightBg: "#F5F5F5",
      bodyFontSize: "14px",
      titleFontSize: "20px"
    }
  };

  // ==================== 渲染逻辑 ====================
  (function renderApp() {
    const root = document.getElementById('app-root');
    if (!root) return;

    // 帮助函数：创建SVG图标元素（根据类型返回svg字符串）
    // 所有图标均为内联SVG，无外部资源，仅使用黑白灰，viewBox统一，stroke宽度从配置读取
    function getIconSvg(type) {
      const sw = CONFIG.style.strokeWidth; // 1.5
      // 共通属性：fill="none" stroke="currentColor" (由父级color控制，但内联svg用黑色保证)
      // 但规范要求 fill/stroke 仅用黑、白、灰度；默认 fill="none" stroke="currentColor"
      // 我们显式设置为 stroke="#000000" 或 currentColor，在此用 #000000 确保
      const common = `fill="none" stroke="#000000" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"`;
      
      switch (type) {
        case 'sync':
          // 同步图标：两个圆弧箭头
          return `<svg viewBox="0 0 24 24" aria-hidden="true" ${common}>
            <path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9h-3m-6 9a9 9 0 0 1-9-9m9 9v-3m-9-6a9 9 0 0 1 9-9m-9 9h3"/>
          </svg>`;
        case 'bell':
          return `<svg viewBox="0 0 24 24" aria-hidden="true" ${common}>
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>`;
        case 'moon':
          return `<svg viewBox="0 0 24 24" aria-hidden="true" ${common}>
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>`;
        case 'info':
        default:
          return `<svg viewBox="0 0 24 24" aria-hidden="true" ${common}>
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 16v-4M12 8h.01"/>
          </svg>`;
      }
    }

    // 生成开关控件SVG (根据是否开启)
    // 保持纯黑白灰，圆角矩形+圆形滑块
    function getSwitchSvg(isOn) {
      const sw = CONFIG.style.strokeWidth;
      // 轨道: 圆角矩形, 黑色边框/填充(开时黑底,关时白底黑边)
      // 滑块: 白色或黑色, 取决于轨道背景
      // 但要保证黑白灰区间
      const trackFill = isOn ? '#000000' : '#FFFFFF';
      const trackStroke = '#000000';
      const knobFill = isOn ? '#FFFFFF' : '#000000'; // 开:白滑块 关:黑滑块
      
      // 轨道宽48 高28, 圆角14
      // 滑块半径10, 开时在右侧偏移(约26), 关时在左侧偏移(约8)
      const knobCx = isOn ? 32 : 8; // 左侧起始 8px 中心; 右侧中心32px (48-8-8=32) 调整
      // 更精确: 轨道宽48, 高28, 圆角14; 滑块圆心在垂直居中(14), 水平: 开在右侧中心 48-14=34? 留2px边距?
      // 常见: 滑块半径10, 轨道高度28, 则圆心y=14; 开时cx=48-14=34; 关时cx=14.
      // 但滑块直径20, 轨道高度28, 上下各留4; 为了美观, 采用cx=34 / cx=14
      // 但轨道的x范围[0,48], 滑块半径10, 开时cx=48-14=34 左右留4, 关时cx=14左右留4。已足够。
      // 不过我们使用圆角矩形x=0,y=0,w=48,h=28,rx=14, 滑块半径10。开启时cx=34，关闭cx=14。
      const knobRadius = 10;
      const knobCx = isOn ? 34 : 14;
      const knobCy = 14;

      return `<svg viewBox="0 0 48 28" aria-hidden="true" class="switch-svg" preserveAspectRatio="xMidYMid meet">
        <rect x="0" y="0" width="48" height="28" rx="14" fill="${trackFill}" stroke="${trackStroke}" stroke-width="${sw}" />
        <circle cx="${knobCx}" cy="${knobCy}" r="${knobRadius}" fill="${knobFill}" stroke="${knobFill}" stroke-width="0" />
      </svg>`;
    }

    // 生成状态图标(根据类型，复用info等)
    // 状态提示条已通过CONFIG.statusIconType 引用

    // 构建HTML结构
    const { title, subtitle, switches, primaryButtonText, secondaryButtonText, statusText, statusIconType } = CONFIG;

    // 开关项HTML生成 (左侧图标+文字, 右侧开关)
    const switchesHtml = switches.map((swItem, index) => {
      const isOn = swItem.initialOn;
      // 存储状态到data属性，供切换操作；同时保留id
      return `
        <div class="setting-item" data-switch-id="${swItem.id}" data-state="${isOn}">
          <div class="setting-left">
            <div class="icon-wrapper">
              ${getIconSvg(swItem.iconType)}
            </div>
            <span class="setting-label">${swItem.label}</span>
          </div>
          <div class="switch" role="switch" aria-checked="${isOn}" aria-label="${swItem.label}" tabindex="0" data-switch-index="${index}">
            ${getSwitchSvg(isOn)}
          </div>
        </div>
      `;
    }).join('');

    // 整个面板HTML
    const html = `
      <div class="header">
        <h1 class="title">${title}</h1>
        <div class="subtitle">${subtitle}</div>
      </div>

      <div class="settings-list">
        ${switchesHtml}
      </div>

      <div class="actions">
        <button class="btn btn-secondary" id="secondaryBtn">${secondaryButtonText}</button>
        <button class="btn btn-primary" id="primaryBtn">${primaryButtonText}</button>
      </div>

      <div class="status-bar" id="statusBar">
        <div class="status-icon">
          ${getIconSvg(statusIconType)}
        </div>
        <span class="status-text" id="statusText">${statusText}</span>
      </div>
    `;

    root.innerHTML = html;

    // ==================== 交互逻辑 (不涉及可配置内容硬编码) ====================
    // 状态更新函数 (基于CONFIG中已有定义，但更新状态动态)
    function setStatus(message) {
      const statusTextEl = document.getElementById('statusText');
      if (statusTextEl) statusTextEl.textContent = message;
    }

    // 更新开关UI与状态
    function updateSwitchElement(switchElement, newState) {
      const switchDiv = switchElement.closest('.switch');
      const settingItem = switchDiv.closest('.setting-item');
      if (!switchDiv || !settingItem) return;

      // 更新SVG内容
      switchDiv.innerHTML = getSwitchSvg(newState);
      switchDiv.setAttribute('aria-checked', newState);
      settingItem.dataset.state = newState;
      // 同步更新内部记录 (由于我们动态读取，但保留状态即可)
    }

    // 通过索引获取开关元素
    function getSwitchByIndex(index) {
      return document.querySelector(`.switch[data-switch-index="${index}"]`);
    }

    // 读取当前所有开关状态
    function getAllSwitchStates() {
      const switches = document.querySelectorAll('.setting-item');
      return Array.from(switches).map(item => item.dataset.state === 'true');
    }

    // 处理点击切换开关
    document.querySelectorAll('.switch').forEach((switchEl, idx) => {
      // 点击
      switchEl.addEventListener('click', (e) => {
        e.stopPropagation();
        const settingItem = switchEl.closest('.setting-item');
        if (!settingItem) return;
        const currentState = settingItem.dataset.state === 'true';
        const newState = !currentState;
        updateSwitchElement(switchEl, newState);
        setStatus(`设置 "${CONFIG.switches[idx]?.label || '选项'}" 已${newState ? '开启' : '关闭'}`);
      });

      // 键盘操作 (空格或回车)
      switchEl.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          switchEl.click();
        }
      });
    });

    // 重置按钮: 将开关重置为CONFIG中initialOn，状态条显示重置提示
    const secondaryBtn = document.getElementById('secondaryBtn');
    if (secondaryBtn) {
      secondaryBtn.addEventListener('click', () => {
        // 重置所有开关到 initialOn
        CONFIG.switches.forEach((swItem, idx) => {
          const switchEl = getSwitchByIndex(idx);
          if (switchEl) {
            const settingItem = switchEl.closest('.setting-item');
            if (settingItem) {
              settingItem.dataset.state = swItem.initialOn;
              switchEl.innerHTML = getSwitchSvg(swItem.initialOn);
              switchEl.setAttribute('aria-checked', swItem.initialOn);
            }
          }
        });
        setStatus("设置已重置为默认值");
      });
    }

    // 主按钮(应用更改) : 获取当前状态并显示状态栏提示
    const primaryBtn = document.getElementById('primaryBtn');
    if (primaryBtn) {
      primaryBtn.addEventListener('click', () => {
        const states = getAllSwitchStates();
        // 简单的反馈：状态已保存
        setStatus("更改已应用。所有设置已保存。");
        // 也可以将当前状态输出到控制台，但无需
      });
    }

    // 初始状态条显示CONFIG.statusText (上面已通过html渲染)
    // 额外: 若CONFIG有动态状态文字，则已展示。

    // 确保所有SVG包含可访问性 (已通过aria-hidden)
    // 线宽等已通过配置

    // 同步CONFIG中的状态，避免硬编码
    // 可添加: 根据CONFIG更新初始开关的aria等，但已通过模板完成。
  })();
</script>

</body>
</html>
