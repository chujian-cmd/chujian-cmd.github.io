<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script>
  // 全局配置
  const ICONS = {
    wifi: '<path d="M5.64 11.64a9 9 0 0 1 12.72 0"/><path d="M7.76 13.76a6 6 0 0 1 8.48 0"/><path d="M9.88 15.88a3 3 0 0 1 4.24 0"/><path d="M12 18.4h.01"/>',
    bluetooth: '<path d="M12 2v20"/><path d="M12 2l5 5-10 10"/><path d="M12 22l5-5-10-10"/>',
    moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>'
  };

  const CONFIG = [
    { title: '无线网络', desc: '自动连接已知网络', icon: 'wifi', checked: true, def: true },
    { title: '蓝牙', desc: '连接附近的设备', icon: 'bluetooth', checked: false, def: false },
    { title: '夜间模式', desc: '降低屏幕亮度', icon: 'moon', checked: true, def: true }
  ];

  document.addEventListener('DOMContentLoaded', function () {
    const list = document.getElementById('list');
    const tipText = document.getElementById('tipText');
    const morphBtn = document.getElementById('morphBtn');
    const panelBody = document.getElementById('panelBody');

    function updateTip() {
      const on = CONFIG.filter(function (c) { return c.checked; }).length;
      tipText.textContent = on === 0 ? '全部设置已关闭' : '已开启 ' + on + ' 项设置，更改立即生效';
    }

    function render() {
      list.innerHTML = CONFIG.map(function (item, i) {
        return '<div class="row">' +
            '<span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[item.icon] + '</svg></span>' +
            '<div class="meta"><p class="name">' + item.title + '</p><p class="desc">' + item.desc + '</p></div>' +
            '<button type="button" class="switch" role="switch" aria-checked="' + item.checked + '" aria-label="' + item.title + '" data-i="' + i + '">' +
              '<svg viewBox="0 0 52 30" aria-hidden="true"><rect class="track" x="1" y="1" width="50" height="28" rx="14"></rect><circle class="knob" cx="15" cy="15" r="10"></circle></svg>' +
            '</button>' +
          '</div>';
      }).join('');
      updateTip();
    }

    list.addEventListener('click', function (e) {
      const btn = e.target.closest('.switch');
      if (!btn) return;
      const i = Number(btn.dataset.i);
      CONFIG[i].checked = !CONFIG[i].checked;
      btn.setAttribute('aria-checked', String(CONFIG[i].checked));
      updateTip();
    });

    document.getElementById('saveBtn').addEventListener('click', function () {
      tipText.textContent = '设置已保存';
    });

    document.getElementById('resetBtn').addEventListener('click', function () {
      CONFIG.forEach(function (c) { c.checked = c.def; });
      render();
      tipText.textContent = '已恢复默认设置';
    });

    morphBtn.addEventListener('click', function () {
      const collapsed = panelBody.classList.toggle('hidden');
      morphBtn.classList.toggle('on', collapsed);
      morphBtn.querySelector('.l1').setAttribute('d', collapsed ? 'M6.5 6.5 L17.5 17.5' : 'M5 8 L19 8');
      morphBtn.querySelector('.l2').setAttribute('d', collapsed ? 'M17.5 6.5 L6.5 17.5' : 'M5 16 L19 16');
      morphBtn.setAttribute('aria-label', collapsed ? '展开设置' : '折叠设置');
    });

    render();
  });
</script>
<title>极简设置面板</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    -webkit-tap-highlight-color: transparent;
  }
  body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #FFFFFF;
    color: #000000;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button {
    outline: none;
    font-family: inherit;
  }
  button:focus-visible {
    outline: 2px solid #000000;
    outline-offset: 3px;
  }
  .panel {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    background-color: #FFFFFF;
    border: 1.5px solid #E5E5E5;
    border-radius: 24px;
    padding: 24px 20px 20px;
  }
  .hd {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: #000000;
  }
  .sub {
    margin: 0;
    font-size: 14px;
    color: #999999;
  }
  .morph-btn {
    -webkit-appearance: none;
    appearance: none;
    touch-action: manipulation;
    flex: none;
    width: 40px;
    height: 40px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #F5F5F5;
    border: 1.5px solid #E5E5E5;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .morph-btn svg {
    display: block;
    width: 20px;
    height: 20px;
  }
  .morph-btn svg path {
    fill: none;
    stroke: #000000;
    stroke-width: 2;
    stroke-linecap: round;
    transition: all 0.2s ease;
  }
  .morph-btn:hover {
    background-color: #E5E5E5;
    border-color: #CCCCCC;
  }
  .morph-btn:active {
    background-color: #000000;
    border-color: #000000;
  }
  .morph-btn:active svg path {
    stroke: #FFFFFF;
  }
  .collapsible {
    max-height: 600px;
    opacity: 1;
    overflow: hidden;
    transition: all 0.2s ease;
  }
  .collapsible.hidden {
    max-height: 0;
    opacity: 0;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 8px;
    border-radius: 16px;
    transition: all 0.2s ease;
  }
  .row:hover {
    background-color: #F5F5F5;
  }
  .ico {
    flex: none;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #F5F5F5;
    border: 1.5px solid #E5E5E5;
    border-radius: 14px;
  }
  .ico svg {
    display: block;
    width: 22px;
    height: 22px;
  }
  .ico svg path,
  .ico svg circle {
    fill: none;
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .meta {
    flex: 1;
    min-width: 0;
  }
  .name {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    color: #000000;
  }
  .desc {
    margin: 0;
    font-size: 14px;
    color: #999999;
  }
  .switch {
    -webkit-appearance: none;
    appearance: none;
    touch-action: manipulation;
    flex: none;
    width: 52px;
    height: 30px;
    padding: 0;
    margin: 0;
    background-color: transparent;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .switch svg {
    display: block;
    width: 52px;
    height: 30px;
    transition: all 0.2s ease;
  }
  .switch .track {
    fill: #E5E5E5;
    transition: all 0.2s ease;
  }
  .switch .knob {
    fill: #FFFFFF;
    stroke: #CCCCCC;
    stroke-width: 1.5;
    transition: all 0.2s ease;
  }
  .switch[aria-checked="false"]:hover .track {
    fill: #CCCCCC;
  }
  .switch[aria-checked="true"] .track {
    fill: #000000;
  }
  .switch[aria-checked="true"] .knob {
    stroke: #000000;
    transform: translateX(22px);
  }
  .switch:active svg {
    transform: scale(0.92);
  }
  .actions {
    display: flex;
    gap: 12px;
    margin-top: 16px;
  }
  .btn {
    -webkit-appearance: none;
    appearance: none;
    touch-action: manipulation;
    flex: 1;
    padding: 13px 18px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 50px;
    border: 1.5px solid #000000;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-primary {
    background-color: #000000;
    color: #FFFFFF;
  }
  .btn-primary:hover {
    background-color: #333333;
    border-color: #333333;
  }
  .btn-primary:active {
    background-color: #FFFFFF;
    color: #000000;
    border-color: #000000;
  }
  .btn-secondary {
    background-color: #FFFFFF;
    color: #000000;
  }
  .btn-secondary:hover {
    background-color: #F5F5F5;
  }
  .btn-secondary:active {
    background-color: #000000;
    color: #FFFFFF;
  }
  .tip {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-top: 18px;
    padding: 14px 16px;
    background-color: #F5F5F5;
    border: 1.5px solid #E5E5E5;
    border-radius: 16px;
  }
  .tip svg {
    flex: none;
    width: 18px;
    height: 18px;
    margin-top: 2px;
  }
  .tip svg path,
  .tip svg circle {
    fill: none;
    stroke: #000000;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .tip p {
    margin: 0;
    font-size: 14px;
    color: #333333;
  }
</style>
</head>
<body>
  <main class="panel">
    <header class="hd">
      <div>
        <h1>极简设置面板</h1>
        <p class="sub">精简选项，专注当下</p>
      </div>
      <button type="button" class="morph-btn" id="morphBtn" aria-label="折叠设置">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="l1" d="M5 8 L19 8"></path>
          <path class="l2" d="M5 16 L19 16"></path>
        </svg>
      </button>
    </header>

    <div class="collapsible" id="panelBody">
      <div id="list"></div>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="saveBtn">保存更改</button>
        <button type="button" class="btn btn-secondary" id="resetBtn">恢复默认</button>
      </div>
    </div>

    <div class="tip">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 11.2v5"></path>
        <path d="M12 8h.01"></path>
      </svg>
      <p id="tipText">加载中</p>
    </div>
  </main>
</body>
</html>
