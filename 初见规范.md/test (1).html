<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星星变圆 · 极简动画</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    .stage {
      background: white;
      border-radius: 32px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
      padding: 2rem 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }
    svg { display: block; width: 240px; height: 240px; }
    .hint { font-size: 0.9rem; color: #9aa5b5; letter-spacing: 0.02em; }
  </style>
</head>
<body>
  <div class="stage">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <polygon fill="#f5a623">
        <animate
          attributeName="points"
          dur="4s"
          repeatCount="indefinite"
          values="
            100,20 121,79 184,79 133,116 152,178 100,140 48,178 67,116 16,79 79,79;
            100,20 121,79 184,79 133,116 152,178 100,140 48,178 67,116 16,79 79,79;
            100,40 129,43 153,60 170,84 173,113 160,140 140,160 115,173 86,173 60,160 40,140 27,113 30,84 47,60 71,43 100,40;
            100,40 129,43 153,60 170,84 173,113 160,140 140,160 115,173 86,173 60,160 40,140 27,113 30,84 47,60 71,43 100,40;
            100,20 121,79 184,79 133,116 152,178 100,140 48,178 67,116 16,79 79,79
          "
          calcMode="spline"
          keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
          keyTimes="0; 0.25; 0.5; 0.75; 1"
        />
        <animate
          attributeName="fill"
          dur="4s"
          repeatCount="indefinite"
          values="#f5a623;#f5a623;#4a90d9;#4a90d9;#f5a623"
          keyTimes="0; 0.25; 0.5; 0.75; 1"
        />
      </polygon>
    </svg>
    <span class="hint">星星 · 圆 · 星星</span>
  </div>
</body>
</html>
