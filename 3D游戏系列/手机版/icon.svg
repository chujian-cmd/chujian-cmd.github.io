<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f1a" />
    </linearGradient>

    <!-- 霓虹发光滤镜 -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 立方体三个面的渐变 -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6efff5" />
      <stop offset="100%" stop-color="#4ecdc4" />
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f8a82" />
      <stop offset="100%" stop-color="#0d5a55" />
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ecdc4" />
      <stop offset="100%" stop-color="#2c8f87" />
    </linearGradient>
    
    <!-- 顶面玻璃反光 -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect width="1024" height="1024" rx="240" fill="url(#bgGrad)" />
  
  <!-- 背景网格（增加科技感） -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="2">
    <line x1="0" y1="256" x2="1024" y2="256" /><line x1="0" y1="512" x2="1024" y2="512" /><line x1="0" y1="768" x2="1024" y2="768" />
    <line x1="256" y1="0" x2="256" y2="1024" /><line x1="512" y1="0" x2="512" y2="1024" /><line x1="768" y1="0" x2="768" y2="1024" />
  </g>

  <!-- 背后的环境光 -->
  <circle cx="512" cy="512" r="300" fill="#4ecdc4" opacity="0.15" filter="blur(40px)" />

  <!-- ================= 3D 立方体 ================= -->
  <g filter="url(#neonGlow)" opacity="0.6">
    <!-- 用发光层描边勾勒出轮廓 -->
    <path d="M512 180 L832 340 L832 684 L512 844 L192 684 L192 340 Z" fill="none" stroke="#4ecdc4" stroke-width="8" />
  </g>

  <!-- 立方体实体 -->
  <g>
    <!-- 左面 -->
    <path d="M512 512 L192 340 L192 684 L512 844 Z" fill="url(#leftFace)" />
    <!-- 右面 -->
    <path d="M512 512 L832 340 L832 684 L512 844 Z" fill="url(#rightFace)" />
    <!-- 顶面 -->
    <path d="M512 180 L832 340 L512 512 L192 340 Z" fill="url(#topFace)" />
    
    <!-- 顶面反光 -->
    <path d="M512 180 L832 340 L512 512 L192 340 Z" fill="url(#glassShine)" />

    <!-- 边缘高光描边 -->
    <path d="M512 180 L832 340 L832 684 L512 844 L192 684 L192 340 Z" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="4" stroke-linejoin="round"/>
    <path d="M512 512 L832 340 M512 512 L192 340 M512 512 L512 844" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4" />
  </g>

  <!-- ================= 前景点缀：粉色能量球 ================= -->
  <g transform="translate(750, 680)">
    <circle cx="0" cy="0" r="80" fill="#ff6b6b" opacity="0.4" filter="blur(20px)" />
    <circle cx="0" cy="0" r="50" fill="#fd79a8" />
    <circle cx="-15" cy="-15" r="15" fill="#ffffff" opacity="0.6" filter="blur(4px)" />
  </g>

  <!-- 前景小方块 -->
  <g transform="translate(250, 720)">
    <path d="M0 0 L60 -30 L120 0 L60 30 Z" fill="#ffe66d" />
    <path d="M0 0 L0 60 L60 90 L60 30 Z" fill="#fdcb6e" />
    <path d="M120 0 L120 60 L60 90 L60 30 Z" fill="#e17055" />
  </g>
  
</svg>