<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>体素沙盒 · 双人联机版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', 'PingFang SC', sans-serif; overflow: hidden; background: #0b0f1a; user-select: none; touch-action: none; position: fixed; width: 100%; height: 100%; }
    #scene-container { width: 100vw; height: 100vh; background: #151e2e; overflow: hidden; position: relative; }
    #scene-container canvas { display: block; width: 100% !important; height: 100% !important; }
    
    #hud { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; align-items: center; gap: 14px; padding: 6px 20px; background: rgba(8, 14, 30, 0.75); border-radius: 40px; border: 1px solid rgba(255,255,255,0.06); color: #b0c8e8; font-size: 0.6rem; pointer-events: none; white-space: nowrap; box-shadow: 0 4px 24px rgba(0,0,0,0.3); }
    #hud .dot { width: 16px; height: 16px; border-radius: 4px; display: inline-block; border: 1.5px solid rgba(255,255,255,0.1); margin-right: 4px; }
    #hud .name { color: #e0ecff; font-weight: 600; }
    #hud .right { display: flex; gap: 12px; font-family: monospace; font-size: 0.5rem; color: #4ecdc4; }
    
    #bottom-controls { position: absolute; bottom: 16px; left: 0; right: 0; z-index: 30; display: flex; flex-direction: column; gap: 8px; padding: 0 12px; pointer-events: none; }
    #bottom-controls > * { pointer-events: auto; }
    #toolbar { display: flex; align-items: center; justify-content: space-between; background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(255,255,255,0.06); padding: 6px 12px; border-radius: 28px; box-shadow: 0 4px 24px rgba(0,0,0,0.4); position: relative; }
    .tool-group { display: flex; gap: 4px; align-items: center; }
    .btn-icon { width: 40px; height: 40px; border: none; border-radius: 12px; background: rgba(255, 255, 255, 0.06); color: #ffffff; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: none; transition: 0.08s; border: 1px solid rgba(255,255,255,0.04); box-shadow: 0 2px 12px rgba(0,0,0,0.2); font-family: inherit; text-shadow: 0 1px 4px rgba(0,0,0,0.3); }
    .btn-icon:active { transform: scale(0.85); background: rgba(78,205,196,0.2); }
    .btn-icon.action:active { background: rgba(255,107,107,0.2); }
    .btn-icon svg { width: 22px; height: 22px; fill: currentColor; display: block; }
    
    #shape-indicator { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.2); padding: 2px 12px 2px 6px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.03); }
    #shape-dot { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.1); flex-shrink: 0; }
    #shape-name { color: #e0ecff; font-size: 0.6rem; font-weight: 500; }

    #control-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; background: rgba(0, 0, 0, 0.35); border-radius: 40px; border: 1px solid rgba(255,255,255,0.04); box-shadow: 0 4px 24px rgba(0,0,0,0.3); }
    #joystick-area { position: relative; width: 100px; height: 100px; touch-action: none; flex-shrink: 0; }
    #joystick-base { position: absolute; inset: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.06); border: 2px solid rgba(255,255,255,0.08); box-shadow: inset 0 0 30px rgba(0,0,0,0.2); }
    #joystick-thumb { position: absolute; width: 44%; height: 44%; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #8cf0e8, #1f8a82); border: 2.5px solid rgba(255,255,255,0.2); box-shadow: 0 0 30px rgba(78,205,196,0.15); top: 28%; left: 28%; pointer-events: none; transition: none; }
    #btn-jump { width: 80px; height: 80px; border: none; border-radius: 50%; font-size: 1.8rem; font-weight: 700; color: #fff; background: linear-gradient(145deg, #ff6b6b, #d63031); box-shadow: 0 8px 30px rgba(255,107,107,0.2), inset 0 -4px 0 rgba(0,0,0,0.1); cursor: pointer; touch-action: none; transition: 0.06s; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.05); }
    #btn-jump:active { transform: scale(0.85); box-shadow: 0 4px 15px rgba(255,107,107,0.1); }
    #btn-jump svg { width: 32px; height: 32px; fill: #fff; }

    /* 颜色弹出面板 */
    #color-popup {
      position: fixed;
      bottom: 130px;
      right: 20px;
      z-index: 100;
      background: rgba(18, 26, 48, 0.95);
      border: 1.5px solid rgba(78,205,196,0.2);
      border-radius: 20px;
      padding: 12px;
      display: none;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      width: 148px;
    }
    #color-popup.show {
      display: grid;
    }
    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.1);
      cursor: pointer;
      transition: 0.1s;
    }
    .color-swatch:active {
      transform: scale(0.85);
    }
    .color-swatch.active {
      border-color: #4ecdc4;
      box-shadow: 0 0 12px rgba(78,205,196,0.5);
    }

    #start-overlay { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, rgba(8,12,26,0.98), rgba(0,0,0,0.99)); transition: opacity 0.4s ease, visibility 0.4s ease; visibility: visible; }
    #start-overlay.hidden { opacity: 0; pointer-events: none; visibility: hidden; }
    #start-box { background: rgba(18,26,48,0.95); border: 1.5px solid rgba(78,205,196,0.15); border-radius: 32px; padding: 28px 24px; text-align: center; color: #eaf2ff; max-width: 320px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.5); animation: breathe 2.4s ease-in-out infinite; cursor: pointer; }
    @keyframes breathe { 0%, 100% { transform: scale(1); box-shadow: 0 20px 60px rgba(0,0,0,0.5); } 50% { transform: scale(1.02); box-shadow: 0 20px 80px rgba(78,205,196,0.15); } }
    #start-box h1 { font-size: 1.8rem; margin-bottom: 2px; background: linear-gradient(135deg, #4ecdc4, #ff6b6b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    #start-box .sub { color: #4ecdc4; font-size: 0.9rem; margin-bottom: 6px; animation: pulse 1.6s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    #start-box p { font-size: 0.65rem; color: #8aa4c8; margin: 2px 0; }
    #start-box .key { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.05); border-radius: 4px; padding: 1px 6px; font-size: 0.5rem; display: inline-block; color: #b0c8e8; }
    
    #net-status { position: absolute; bottom: 20px; left: 20px; color: #4ecdc4; font-size: 0.7rem; z-index: 99; pointer-events: none; text-shadow: 0 2px 4px #000; }

    @media (max-width: 600px) { 
      #hud { font-size: 0.5rem; gap: 8px; padding: 4px 14px; top: 10px; } 
      #hud .right { font-size: 0.45rem; gap: 6px; } 
      .btn-icon { width: 34px; height: 34px; border-radius: 10px; } 
      .btn-icon svg { width: 18px; height: 18px; }
      #shape-indicator { padding: 2px 8px 2px 4px; } 
      #shape-dot { width: 16px; height: 16px; } 
      #shape-name { font-size: 0.5rem; } 
      #joystick-area { width: 80px; height: 80px; } 
      #btn-jump { width: 64px; height: 64px; }
      #btn-jump svg { width: 26px; height: 26px; }
      #toolbar { padding: 4px 8px; } 
      #color-popup { width: 128px; padding: 10px; gap: 6px; bottom: 110px; right: 14px; }
      .color-swatch { width: 24px; height: 24px; border-radius: 6px; }
    }
    @media (max-width: 420px) { 
      .btn-icon { width: 28px; height: 28px; border-radius: 8px; } 
      .btn-icon svg { width: 15px; height: 15px; }
      #shape-dot { width: 12px; height: 12px; } 
      #shape-name { font-size: 0.45rem; } 
      #joystick-area { width: 68px; height: 68px; } 
      #btn-jump { width: 54px; height: 54px; }
      #btn-jump svg { width: 22px; height: 22px; }
      #hud { font-size: 0.4rem; gap: 4px; padding: 2px 10px; } 
      #hud .right { font-size: 0.35rem; gap: 4px; } 
      #color-popup { width: 112px; padding: 8px; gap: 5px; bottom: 100px; right: 10px; }
      .color-swatch { width: 21px; height: 21px; border-radius: 5px; }
    }
  </style>
</head>
<body>

  <div id="start-overlay">
    <div id="start-box">
      <h1>沙盒 · 双人联机</h1>
      <p class="sub" id="role-text">正在连接服务器...</p>
      <p><span class="key">摇杆</span> 移动 · <span class="key">跳跃</span> 大按钮</p>
      <p><span class="key">点击屏幕</span> 放置 · <span class="key">右滑</span> 视角</p>
    </div>
  </div>

  <div id="scene-container">
    <div id="net-status">未连接</div>
    
    <div id="hud">
      <span id="shape-indicator">
        <span id="shape-dot" class="dot"></span>
        <span id="shape-name" class="name">立方体</span>
      </span>
      <span class="right">
        <span style="display:flex;align-items:center;gap:2px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          <span id="obj-count">0</span>
        </span>
        <span style="display:flex;align-items:center;gap:2px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          <span id="fps-val">60</span>fps
        </span>
      </span>
    </div>

    <div id="bottom-controls">
      <div id="toolbar">
        <div class="tool-group">
          <button class="btn-icon action" id="btn-place">
            <!-- 放置：加号 -->
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </button>
          <button class="btn-icon action" id="btn-remove">
            <!-- 删除：减号 -->
            <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
          </button>
          <button class="btn-icon" id="btn-next">
            <!-- 下一个形状：右箭头 -->
            <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8-8-8z"/></svg>
          </button>
          <button class="btn-icon" id="btn-grab">
            <!-- 抓取：手形 -->
            <svg viewBox="0 0 24 24"><path d="M9 11.24V7.5a2.5 2.5 0 0 1 5 0v3.74c1.21-.81 2-2.18 2-3.74A4.5 4.5 0 0 0 11.5 3 4.5 4.5 0 0 0 7 7.5c0 1.56.79 2.93 2 3.74zm9.84 4.63l-4.54-2.26c-.17-.07-.35-.11-.54-.11H13v-6a1.5 1.5 0 0 0-3 0v10.74l-3.43-.72c-.08-.01-.15-.03-.24-.03-.31 0-.59.13-.79.33l-.79.8 4.94 4.94c.27.27.65.44 1.06.44h6.79c.75 0 1.33-.55 1.44-1.28l.75-5.27c.01-.07.02-.14.02-.2 0-.62-.38-1.16-.91-1.38z"/></svg>
          </button>
          <button class="btn-icon" id="btn-push">
            <!-- 推开：向外箭头 -->
            <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
          </button>
        </div>
        <div class="tool-group">
          <button class="btn-icon" id="btn-explode">
            <!-- 爆炸：星形 -->
            <svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z"/></svg>
          </button>
          <button class="btn-icon" id="btn-vacuum">
            <!-- 真空吸引：漩涡 -->
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
          </button>
          <button class="btn-icon" id="btn-color">
            <!-- 调色板图标 -->
            <svg viewBox="0 0 24 24"><path d="M12 2C6.49 2 2 6.49 2 12s4.49 10 10 10c1.38 0 2.5-1.12 2.5-2.5 0-.61-.23-1.2-.64-1.67-.08-.1-.13-.21-.13-.33 0-.28.22-.5.5-.5H16c3.31 0 6-2.69 6-6 0-4.96-4.49-9-10-9zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 8 6.5 8 8 8.67 8 9.5 7.33 11 6.5 11zm3-4C8.67 7 8 6.33 8 5.5S8.67 4 9.5 4s1.5.67 1.5 1.5S10.33 7 9.5 7zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 4 14.5 4s1.5.67 1.5 1.5S15.33 7 14.5 7zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 8 17.5 8s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
          </button>
        </div>
      </div>

      <div id="control-row">
        <div id="joystick-area">
          <div id="joystick-base"></div>
          <div id="joystick-thumb"></div>
        </div>
        <button id="btn-jump">
          <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 颜色弹出面板 -->
  <div id="color-popup"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import * as CANNON from 'cannon-es';

    const CFG = { moveSpeed: 6, jumpForce: 7, gravity: -12, playerRadius: 0.4, blockSize: 0.95, physicsSize: 0.475, worldSize: 17 };
    
    // ⚠️ 你的服务器 IP
    const SERVER_URL = 'ws://192.168.0.100:8765';
    let ws = null;
    let remotePlayerMesh = null;
    let lastSyncTime = 0;

    const container = document.getElementById('scene-container');
    const dom = {
      startOverlay: document.getElementById('start-overlay'),
      roleText: document.getElementById('role-text'),
      netStatus: document.getElementById('net-status'),
      joystickArea: document.getElementById('joystick-area'),
      joystickThumb: document.getElementById('joystick-thumb'),
      btnJump: document.getElementById('btn-jump'),
      btnPlace: document.getElementById('btn-place'),
      btnRemove: document.getElementById('btn-remove'),
      btnNext: document.getElementById('btn-next'),
      btnGrab: document.getElementById('btn-grab'),
      btnPush: document.getElementById('btn-push'),
      btnExplode: document.getElementById('btn-explode'),
      btnVacuum: document.getElementById('btn-vacuum'),
      btnColor: document.getElementById('btn-color'),
      colorPopup: document.getElementById('color-popup'),
      objCount: document.getElementById('obj-count'),
      fpsVal: document.getElementById('fps-val'),
      shapeDot: document.getElementById('shape-dot'),
      shapeName: document.getElementById('shape-name'),
    };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 40, 110);

    const camera = new THREE.PerspectiveCamera(68, container.clientWidth / container.clientHeight, 0.1, 200);
    camera.position.set(0, 2.6, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0xbcd4f0, 0.6);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xfff8e7, 1.2);
    dirLight.position.set(20, 30, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 512;
    dirLight.shadow.mapSize.height = 512;
    scene.add(dirLight);

    const groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(36, 36), new THREE.MeshStandardMaterial({ color: 0xd5c4a1, roughness: 0.8 }));
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.position.y = -0.2;
    groundMesh.receiveShadow = true;
    scene.add(groundMesh);
    const allObjects = [groundMesh];

    const grid = new THREE.GridHelper(36, 24, 0xc4b99a, 0xe0d5c0);
    scene.add(grid);

    const world = new CANNON.World();
    world.gravity.set(0, CFG.gravity, 0);
    world.broadphase = new CANNON.SAPBroadphase(world);
    world.allowSleep = true;
    world.defaultContactMaterial.restitution = 0.3;

    const groundShape = new CANNON.Box(new CANNON.Vec3(18, 0.2, 18));
    const groundBody = new CANNON.Body({ mass: 0 });
    groundBody.addShape(groundShape);
    groundBody.position.set(0, -0.3, 0);
    world.addBody(groundBody);

    const playerShape = new CANNON.Sphere(CFG.playerRadius);
    const playerBody = new CANNON.Body({ mass: 1 });
    playerBody.addShape(playerShape);
    playerBody.position.set(0, 2, 8);
    playerBody.linearDamping = 0.9;
    playerBody.angularDamping = 0.9;
    world.addBody(playerBody);

    const placed = [];
    let isOnGround = false;

    const shapes = {
      types: ['cube', 'sphere', 'cylinder', 'cone', 'torus', 'pyramid'],
      names: ['立方体', '球体', '圆柱', '圆锥', '圆环', '金字塔'],
      index: 0,
      colors: ['#ff6b6b', '#4ecdc4', '#ffe66d', '#a29bfe', '#fd79a8', '#00d2d3', '#ff9f43', '#55efc4'],
      colorIndex: 0,
    };

    // 构建颜色弹出面板
    function buildColorPopup() {
      dom.colorPopup.innerHTML = '';
      shapes.colors.forEach((color, i) => {
        const swatch = document.createElement('div');
        swatch.className = 'color-swatch' + (i === shapes.colorIndex ? ' active' : '');
        swatch.style.background = color;
        swatch.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          shapes.colorIndex = i;
          updateUI();
          dom.colorPopup.classList.remove('show');
        });
        dom.colorPopup.appendChild(swatch);
      });
    }

    function toggleColorPopup() {
      dom.colorPopup.classList.toggle('show');
    }

    // 点击其他地方关闭颜色面板
    document.addEventListener('pointerdown', (e) => {
      if (!e.target.closest('#btn-color') && !e.target.closest('#color-popup')) {
        dom.colorPopup.classList.remove('show');
      }
    });

    const geoCache = {};
    function getGeometry(type) {
      if (!geoCache[type]) {
        const s = CFG.blockSize, r = CFG.physicsSize;
        switch (type) {
          case 'cube': geoCache[type] = new THREE.BoxGeometry(s, s, s); break;
          case 'sphere': geoCache[type] = new THREE.SphereGeometry(r, 16, 12); break;
          case 'cylinder': geoCache[type] = new THREE.CylinderGeometry(r, r, s, 12); break;
          case 'cone': geoCache[type] = new THREE.ConeGeometry(r, s, 12); break;
          case 'torus': geoCache[type] = new THREE.TorusGeometry(r * 0.85, 0.18, 10, 16); break;
          case 'pyramid': geoCache[type] = new THREE.ConeGeometry(r, s * 0.95, 4); break;
          default: geoCache[type] = new THREE.BoxGeometry(s, s, s);
        }
      }
      return geoCache[type];
    }

    const shapeCache = {};
    function getCannonShape(type) {
      if (!shapeCache[type]) {
        const s = CFG.physicsSize;
        switch (type) {
          case 'cube': shapeCache[type] = new CANNON.Box(new CANNON.Vec3(s, s, s)); break;
          case 'sphere': shapeCache[type] = new CANNON.Sphere(s); break;
          case 'cylinder': shapeCache[type] = new CANNON.Cylinder(s, s, CFG.blockSize, 6); break;
          case 'cone': shapeCache[type] = new CANNON.Cylinder(0, s, CFG.blockSize, 6); break;
          case 'torus': shapeCache[type] = new CANNON.Sphere(s * 0.85); break;
          case 'pyramid': shapeCache[type] = new CANNON.Cylinder(0, s, CFG.blockSize * 0.95, 4); break;
          default: shapeCache[type] = new CANNON.Box(new CANNON.Vec3(s, s, s));
        }
      }
      return shapeCache[type];
    }

    function createPlaced(type, color, position, isStatic = false) {
      const mesh = new THREE.Mesh(getGeometry(type), new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.05 }));
      mesh.position.copy(position);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      allObjects.push(mesh);

      const body = new CANNON.Body({ mass: isStatic ? 0 : 1 });
      body.addShape(getCannonShape(type));
      body.position.set(position.x, position.y, position.z);
      body.linearDamping = 0.3;
      body.angularDamping = 0.1;
      world.addBody(body);

      const entry = { mesh, body, type, color, isStatic };
      placed.push(entry);
      return entry;
    }

    function removePlaced(entry) {
      world.removeBody(entry.body);
      scene.remove(entry.mesh);
      const idx = placed.indexOf(entry);
      if (idx !== -1) placed.splice(idx, 1);
      const pIdx = allObjects.indexOf(entry.mesh);
      if (pIdx !== -1) allObjects.splice(pIdx, 1);
    }

    function getPlacement() {
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      raycaster.far = 30;
      const hits = raycaster.intersectObjects(allObjects, false);
      if (hits.length > 0) {
        const point = hits[0].point.clone();
        const normal = hits[0].face.normal.clone().transformDirection(hits[0].object.matrixWorld);
        const pos = point.add(normal.multiplyScalar(CFG.physicsSize));
        pos.x = THREE.MathUtils.clamp(pos.x, -CFG.worldSize, CFG.worldSize);
        pos.z = THREE.MathUtils.clamp(pos.z, -CFG.worldSize, CFG.worldSize);
        pos.y = Math.max(pos.y, 0.2);
        if (pos.distanceTo(camera.position) < 0.9) return null;
        return pos;
      }
      return null;
    }

    function applyForce(attract) {
      const p = playerBody.position;
      const str = 1500;
      placed.forEach(entry => {
        if (entry.isStatic) return;
        const dx = p.x - entry.body.position.x;
        const dy = p.y - entry.body.position.y;
        const dz = p.z - entry.body.position.z;
        const dist = Math.hypot(dx, dy, dz);
        if (dist < 8 && dist > 0.3) {
          const power = (1 - dist / 8) * str;
          const factor = attract ? 1 : -1;
          entry.body.applyForce(new CANNON.Vec3(dx / dist * power * factor, dy / dist * power * factor, dz / dist * power * factor), entry.body.position);
        }
      });
    }

    function explode() {
      const p = playerBody.position;
      const str = 1500 * 0.7;
      placed.forEach(entry => {
        if (entry.isStatic) return;
        const dx = entry.body.position.x - p.x;
        const dy = entry.body.position.y - p.y;
        const dz = entry.body.position.z - p.z;
        const dist = Math.hypot(dx, dy, dz);
        if (dist < 10 && dist > 0.3) {
          const factor = (1 - dist / 10) * str / dist;
          entry.body.applyImpulse(new CANNON.Vec3(dx * factor, (dy + 0.5) * factor, dz * factor), entry.body.position);
        }
      });
    }

    function vacuum() {
      const p = playerBody.position;
      placed.forEach(entry => {
        if (entry.isStatic) return;
        const dx = p.x - entry.body.position.x;
        const dy = p.y + 0.5 - entry.body.position.y;
        const dz = p.z - entry.body.position.z;
        const dist = Math.hypot(dx, dy, dz);
        if (dist > 1 && dist < 15) {
          entry.body.applyImpulse(new CANNON.Vec3(dx * 12, dy * 12, dz * 12), entry.body.position);
        }
      });
    }

    function updateUI() {
      const color = shapes.colors[shapes.colorIndex];
      const name = shapes.names[shapes.index];
      dom.shapeDot.style.background = color;
      dom.shapeName.textContent = name;
      dom.objCount.textContent = placed.length;
      // 更新颜色面板高亮
      dom.colorPopup.querySelectorAll('.color-swatch').forEach((el, i) => {
        el.classList.toggle('active', i === shapes.colorIndex);
      });
    }

    // ================================================================
    //  🔥 网络联机（P2P 纯广播）—— 绝对不碰
    // ================================================================
    function connectNetwork() {
      ws = new WebSocket(SERVER_URL);

      ws.onopen = () => {
        dom.netStatus.textContent = "已连接网络";
        dom.roleText.textContent = "网络已连接，开始建造！";
        if (!remotePlayerMesh) {
          const geo = new THREE.SphereGeometry(CFG.playerRadius, 16, 16);
          const mat = new THREE.MeshStandardMaterial({ color: 0x4ecdc4, transparent: true, opacity: 0.6 });
          remotePlayerMesh = new THREE.Mesh(geo, mat);
          remotePlayerMesh.position.set(0, 2, 0); 
          scene.add(remotePlayerMesh);
        }
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        
        if (msg.type === 'player_move') {
          if (remotePlayerMesh) {
            remotePlayerMesh.position.lerp(new THREE.Vector3(msg.pos[0], msg.pos[1], msg.pos[2]), 0.2);
          }
        }
        
        if (msg.type === 'add_block') {
          createPlaced(msg.shapeType, msg.color, new THREE.Vector3(msg.pos[0], msg.pos[1], msg.pos[2]));
          updateUI();
        }

        if (msg.type === 'effect') {
          if (msg.action === 'explode') explode();
          else if (msg.action === 'vacuum') vacuum();
          else if (msg.action === 'force') applyForce(msg.attract);
        }
      };

      ws.onclose = () => {
        dom.netStatus.textContent = "连接断开，重试中...";
        setTimeout(connectNetwork, 2000);
      };
    }

    // ================================================================
    //  交互与发送（完整移动逻辑）
    // ================================================================
    let joyPointerId = null;
    const joyMaxDist = 30;
    const joyValue = { x: 0, y: 0 };

    function updateJoystick(clientX, clientY) {
      const rect = dom.joystickArea.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      let dx = clientX - cx;
      let dy = clientY - cy;
      const dist = Math.hypot(dx, dy);
      const clamped = Math.min(dist, joyMaxDist);
      if (dist > 0.001) { dx = dx / dist * clamped; dy = dy / dist * clamped; }
      joyValue.x = dx / joyMaxDist;
      joyValue.y = -dy / joyMaxDist;
      dom.joystickThumb.style.transform = `translate(${dx}px, ${dy}px)`;
    }

    function resetJoystick() {
      joyValue.x = 0; joyValue.y = 0;
      dom.joystickThumb.style.transform = 'translate(0px, 0px)';
      joyPointerId = null;
    }

    dom.joystickArea.addEventListener('pointerdown', (e) => { e.preventDefault(); joyPointerId = e.pointerId; dom.joystickArea.setPointerCapture(e.pointerId); updateJoystick(e.clientX, e.clientY); });
    dom.joystickArea.addEventListener('pointermove', (e) => { if (joyPointerId === null) return; updateJoystick(e.clientX, e.clientY); });
    dom.joystickArea.addEventListener('pointerup', (e) => { if (joyPointerId === e.pointerId) resetJoystick(); });
    dom.joystickArea.addEventListener('pointercancel', resetJoystick);

    // 右半屏视角拖动
    let viewDrag = { active: false, id: null, lastX: 0, lastY: 0 };
    const euler = new THREE.Euler(0, 0, 0, 'YXZ');

    document.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button') || e.target.closest('#toolbar') || e.target.closest('#control-row') || e.target.closest('#start-overlay') || e.target.closest('#color-popup')) return;
      const rect = container.getBoundingClientRect();
      const x = e.clientX - rect.left;
      if (x > rect.width * 0.5) {
        viewDrag.active = true; viewDrag.id = e.pointerId; viewDrag.lastX = e.clientX; viewDrag.lastY = e.clientY; e.preventDefault();
      }
    });

    document.addEventListener('pointermove', (e) => {
      if (!viewDrag.active || viewDrag.id !== e.pointerId) return;
      const dx = e.clientX - viewDrag.lastX; const dy = e.clientY - viewDrag.lastY;
      viewDrag.lastX = e.clientX; viewDrag.lastY = e.clientY;
      euler.y -= dx * 0.008; euler.x -= dy * 0.008;
      euler.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, euler.x));
      camera.quaternion.setFromEuler(euler);
    });

    document.addEventListener('pointerup', (e) => { if (viewDrag.id === e.pointerId) { viewDrag.active = false; viewDrag.id = null; } });
    document.addEventListener('pointercancel', () => { viewDrag.active = false; viewDrag.id = null; });

    const keys = {};
    document.addEventListener('keydown', (e) => { keys[e.code] = true; if (e.code === 'Space') e.preventDefault(); });
    document.addEventListener('keyup', (e) => { keys[e.code] = false; });

    dom.btnJump.addEventListener('pointerdown', () => { if (isOnGround) { playerBody.velocity.y = CFG.jumpForce; isOnGround = false; } });
    dom.btnPlace.addEventListener('pointerdown', () => {
      const p = getPlacement();
      if (p) {
        createPlaced(shapes.types[shapes.index], shapes.colors[shapes.colorIndex], p);
        updateUI();
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'add_block', shapeType: shapes.types[shapes.index], color: shapes.colors[shapes.colorIndex], pos: [p.x, p.y, p.z] }));
        }
      }
    });

    dom.btnRemove.addEventListener('pointerdown', () => {
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const hits = raycaster.intersectObjects(allObjects, false);
      for (const hit of hits) {
        const entry = placed.find(e => e.mesh === hit.object);
        if (entry) { removePlaced(entry); updateUI(); break; }
      }
    });

    dom.btnNext.addEventListener('pointerdown', () => { shapes.index = (shapes.index + 1) % shapes.types.length; updateUI(); });
    dom.btnGrab.addEventListener('pointerdown', () => { applyForce(true); if(ws) ws.send(JSON.stringify({ type: 'effect', action: 'force', attract: true })); });
    dom.btnPush.addEventListener('pointerdown', () => { applyForce(false); if(ws) ws.send(JSON.stringify({ type: 'effect', action: 'force', attract: false })); });
    dom.btnExplode.addEventListener('pointerdown', () => { explode(); if(ws) ws.send(JSON.stringify({ type: 'effect', action: 'explode' })); });
    dom.btnVacuum.addEventListener('pointerdown', () => { vacuum(); if(ws) ws.send(JSON.stringify({ type: 'effect', action: 'vacuum' })); });
    dom.btnColor.addEventListener('pointerdown', (e) => { e.stopPropagation(); toggleColorPopup(); });

    dom.startOverlay.addEventListener('click', () => { dom.startOverlay.classList.add('hidden'); }, { once: true });

    const demos = [[0, 1, -2, 'cube', '#ff6b6b'], [3, 1, 1, 'sphere', '#4ecdc4'], [-3, 1, 2, 'cylinder', '#ffe66d'], [2, 1, 3, 'pyramid', '#a29bfe'], [-2, 1, -3, 'cone', '#00d2d3'], [0, 1, 4, 'torus', '#fd79a8']];
    demos.forEach(([x, y, z, type, color]) => { createPlaced(type, color, new THREE.Vector3(x, y, z)); });
    
    buildColorPopup();
    updateUI();

    window.addEventListener('resize', () => {
      const w = container.clientWidth; const h = container.clientHeight;
      camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h);
    });

    const clock = new THREE.Clock();
    let stats = { frames: 0, time: 0 };
    
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.033);
      const now = performance.now();

      // 物理步进
      world.step(1 / 60, dt, 5);
      isOnGround = playerBody.position.y <= 0.5 && Math.abs(playerBody.velocity.y) < 0.5;
      
      // 玩家移动控制
      const dead = 0.15;
      let mx = 0, mz = 0;
      if (Math.abs(joyValue.x) > dead) mx = joyValue.x;
      if (Math.abs(joyValue.y) > dead) mz = joyValue.y;
      if (keys['KeyW']) mz = 1; else if (keys['KeyS']) mz = -1;
      if (keys['KeyA']) mx = -1; else if (keys['KeyD']) mx = 1;
      const len = Math.hypot(mx, mz);
      if (len > 1) { mx /= len; mz /= len; }
      
      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward);
      forward.y = 0; if (forward.length() > 0.001) forward.normalize();
      const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
      const dir = new THREE.Vector3().addScaledVector(forward, mz).addScaledVector(right, mx);
      
      if (dir.length() > 0.001) {
        dir.normalize();
        playerBody.velocity.x = dir.x * CFG.moveSpeed;
        playerBody.velocity.z = dir.z * CFG.moveSpeed;
      } else {
        playerBody.velocity.x *= 0.92;
        playerBody.velocity.z *= 0.92;
      }
      if (keys['Space'] && isOnGround) { playerBody.velocity.y = CFG.jumpForce; isOnGround = false; }
      if (playerBody.position.y < -10) { playerBody.position.set(0, 2, 8); playerBody.velocity.set(0, 0, 0); }

      // 同步模型位置
      for (const entry of placed) {
        entry.mesh.position.copy(entry.body.position);
        entry.mesh.quaternion.copy(entry.body.quaternion);
      }

      // 相机跟随
      const camPos = new THREE.Vector3().copy(playerBody.position);
      camPos.y += 0.6;
      camera.position.copy(camPos);

      // 网络发送位置：每 100ms 发送一次
      if (ws && ws.readyState === WebSocket.OPEN && now - lastSyncTime > 100) {
        lastSyncTime = now;
        ws.send(JSON.stringify({ 
          type: 'player_move', 
          pos: [playerBody.position.x, playerBody.position.y, playerBody.position.z] 
        }));
      }

      stats.frames++;
      if (!stats.time) stats.time = now;
      if (now - stats.time >= 500) {
        dom.fpsVal.textContent = Math.round(stats.frames / ((now - stats.time) / 1000));
        stats.frames = 0; stats.time = now;
      }

      renderer.render(scene, camera);
    }

    connectNetwork();
    animate();
  </script>
</body>
</html>
