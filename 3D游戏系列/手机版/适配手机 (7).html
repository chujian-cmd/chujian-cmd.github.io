<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>3D 物理沙盒 · 触控板方案</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      overflow: hidden;
      background: #0a0e1a;
      user-select: none;
      touch-action: none;
      position: fixed;
      width: 100%;
      height: 100%;
    }

    /* ===== 整体布局：flex列，场景居中 ===== */
    #app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      background: #0a0e1a;
    }

    /* ===== 顶部状态栏 ===== */
    #top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      height: 40px;
      flex-shrink: 0;
      background: rgba(10, 14, 26, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 10;
      color: #a0b8d8;
      font-size: 0.6rem;
    }
    #top-bar .left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #top-bar .right {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: monospace;
      font-size: 0.55rem;
      color: #4ecdc4;
    }
    .shape-dot {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      display: inline-block;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      vertical-align: middle;
      margin-right: 4px;
    }
    .color-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      vertical-align: middle;
      margin-right: 4px;
    }
    #top-bar .shape-name {
      color: #d0e4ff;
      font-weight: 600;
    }

    /* ===== 3D场景容器（居中区域） ===== */
    #scene-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #0a0e1a;
      min-height: 0;
    }
    #scene-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* ===== 底部控制区 ===== */
    #bottom-area {
      flex-shrink: 0;
      height: 200px;
      background: rgba(10, 14, 26, 0.92);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      padding: 8px 12px 12px 12px;
      gap: 10px;
      backdrop-filter: blur(10px);
    }

    /* ===== 左：虚拟按键网格 ===== */
    #btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      flex: 0 0 220px;
    }
    #btn-grid button {
      height: 38px;
      border: none;
      border-radius: 8px;
      font-size: 0.6rem;
      font-weight: 600;
      color: #c0d4f0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
      touch-action: none;
      transition: 0.06s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-family: inherit;
    }
    #btn-grid button:active {
      transform: scale(0.88);
      background: rgba(78, 205, 196, 0.2);
      border-color: rgba(78, 205, 196, 0.25);
    }
    #btn-grid .big {
      font-size: 1rem;
    }
    #btn-grid .action {
      background: rgba(255, 107, 107, 0.12);
      border-color: rgba(255, 107, 107, 0.15);
    }
    #btn-grid .action:active {
      background: rgba(255, 107, 107, 0.3);
    }

    /* ===== 中间：形状/颜色指示 ===== */
    #mid-info {
      flex: 0 0 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #8aa4c8;
      font-size: 0.55rem;
      gap: 2px;
      border-left: 1px solid rgba(255, 255, 255, 0.05);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      padding: 0 10px;
    }
    #mid-info .name {
      color: #d0e4ff;
      font-size: 0.75rem;
      font-weight: 600;
    }
    #mid-info .row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ===== 右：触控板 ===== */
    #touchpad-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    #touchpad-label {
      color: #6a8aaa;
      font-size: 0.5rem;
      text-align: center;
      padding-bottom: 3px;
      letter-spacing: 1px;
      flex-shrink: 0;
    }
    #touchpad {
      flex: 1;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      position: relative;
      touch-action: none;
      cursor: pointer;
      overflow: hidden;
      min-height: 60px;
    }
    #touchpad .divider {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      background: rgba(255, 255, 255, 0.06);
    }
    #touchpad .label-left,
    #touchpad .label-right {
      position: absolute;
      bottom: 6px;
      font-size: 0.45rem;
      color: rgba(255, 255, 255, 0.15);
      letter-spacing: 1px;
    }
    #touchpad .label-left {
      left: 12px;
    }
    #touchpad .label-right {
      right: 12px;
    }
    #touchpad .cursor-dot {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(78, 205, 196, 0.6), rgba(78, 205, 196, 0.1));
      border: 1.5px solid rgba(78, 205, 196, 0.5);
      pointer-events: none;
      transform: translate(-50%, -50%);
      display: none;
      box-shadow: 0 0 20px rgba(78, 205, 196, 0.15);
    }
    #touchpad .cursor-dot.active {
      display: block;
    }

    /* ===== 启动遮罩 ===== */
    #start-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(10, 14, 26, 0.98) 0%, rgba(0, 0, 0, 0.99) 100%);
      backdrop-filter: blur(16px);
      transition: opacity 0.5s ease, visibility 0.5s ease;
      visibility: visible;
    }
    #start-overlay.hidden {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }
    #start-box {
      background: rgba(20, 28, 50, 0.95);
      border: 1.5px solid rgba(78, 205, 196, 0.3);
      border-radius: 28px;
      padding: 30px 28px;
      text-align: center;
      color: #eaf2ff;
      max-width: 400px;
      width: 92%;
      box-shadow: 0 0 60px rgba(78, 205, 196, 0.05);
    }
    #start-box h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #4ecdc4, #ff6b6b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    #start-box .sub {
      color: #4ecdc4;
      font-size: 0.9rem;
      margin-bottom: 10px;
      font-weight: 500;
    }
    #start-box p {
      font-size: 0.7rem;
      color: #8aa4c8;
      margin: 3px 0;
    }
    #start-box .key {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      padding: 1px 7px;
      font-size: 0.55rem;
      display: inline-block;
      margin: 0 2px;
      color: #b0c8e8;
    }

    /* ===== 死亡遮罩 ===== */
    #death-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      backdrop-filter: blur(6px);
    }
    #death-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    #death-box {
      background: rgba(20, 12, 24, 0.96);
      border: 1px solid rgba(255, 107, 107, 0.3);
      border-radius: 24px;
      padding: 28px 36px;
      text-align: center;
      color: #fff;
    }
    #death-box button {
      background: linear-gradient(135deg, #ff6b6b, #e84a4a);
      border: none;
      color: #fff;
      font-weight: 600;
      padding: 10px 32px;
      border-radius: 40px;
      cursor: pointer;
      margin-top: 12px;
      font-size: 0.9rem;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 600px) {
      #bottom-area {
        height: 180px;
        padding: 6px 8px 10px 8px;
        gap: 6px;
      }
      #btn-grid {
        flex: 0 0 140px;
        gap: 4px;
      }
      #btn-grid button {
        height: 32px;
        font-size: 0.5rem;
        border-radius: 6px;
      }
      #btn-grid .big {
        font-size: 0.8rem;
      }
      #mid-info {
        flex: 0 0 60px;
        padding: 0 6px;
        font-size: 0.45rem;
      }
      #mid-info .name {
        font-size: 0.6rem;
      }
      #top-bar {
        height: 34px;
        padding: 4px 10px;
        font-size: 0.5rem;
      }
      #top-bar .right {
        font-size: 0.45rem;
        gap: 6px;
      }
      .shape-dot,
      .color-dot {
        width: 12px;
        height: 12px;
      }
    }

    @media (max-width: 420px) {
      #bottom-area {
        height: 160px;
        padding: 4px 4px 8px 4px;
        gap: 4px;
      }
      #btn-grid {
        flex: 0 0 100px;
        gap: 3px;
      }
      #btn-grid button {
        height: 28px;
        font-size: 0.4rem;
        border-radius: 4px;
      }
      #btn-grid .big {
        font-size: 0.7rem;
      }
      #mid-info {
        flex: 0 0 44px;
        padding: 0 4px;
        font-size: 0.4rem;
      }
      #mid-info .name {
        font-size: 0.5rem;
      }
      #touchpad {
        border-radius: 8px;
        min-height: 40px;
      }
      #touchpad .label-left,
      #touchpad .label-right {
        font-size: 0.35rem;
        bottom: 3px;
      }
      #top-bar {
        height: 28px;
        padding: 2px 8px;
        font-size: 0.45rem;
      }
      #top-bar .right {
        font-size: 0.4rem;
        gap: 4px;
      }
      .shape-dot,
      .color-dot {
        width: 10px;
        height: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- ===== 启动遮罩 ===== -->
  <div id="start-overlay">
    <div id="start-box">
      <h1>🎮 物理沙盒</h1>
      <p class="sub">👆 点击开始</p>
      <p><span class="key">摇杆</span>移动 · <span class="key">触控板</span>视角</p>
      <p>左键放置 · 右键删除 · 滚轮切换</p>
      <p style="font-size:0.55rem; opacity:0.5; margin-top:6px;">📱 触控板：拖动=视角 · 左半=左键 · 右半=右键</p>
    </div>
  </div>

  <!-- ===== 死亡遮罩 ===== -->
  <div id="death-overlay">
    <div id="death-box">
      <h2>💀 坠落</h2>
      <p style="margin:8px 0;">点击重生</p>
      <button id="respawn-btn">重生</button>
    </div>
  </div>

  <!-- ===== 主应用 ===== -->
  <div id="app">

    <!-- 顶部状态栏 -->
    <div id="top-bar">
      <div class="left">
        <span>形状: <span class="shape-dot" id="shape-dot"></span><span class="shape-name" id="shape-name">立方体</span></span>
        <span>颜色: <span class="color-dot" id="color-dot"></span></span>
      </div>
      <div class="right">
        <span>📦 <span id="obj-count">0</span></span>
        <span>⚡ <span id="fps-val">60</span>fps</span>
      </div>
    </div>

    <!-- 3D场景容器 -->
    <div id="scene-container"></div>

    <!-- 底部控制区 -->
    <div id="bottom-area">

      <!-- 左：虚拟按键 -->
      <div id="btn-grid">
        <button class="big" id="btn-jump">⬆跳</button>
        <button class="action" id="btn-place">➕放</button>
        <button class="action" id="btn-remove">➖删</button>
        <button id="btn-next">▶切换</button>
        <button id="btn-grab">🌀吸</button>
        <button id="btn-push">💨推</button>
        <button id="btn-explode">💥爆</button>
        <button id="btn-vacuum">🌀全吸</button>
        <button id="btn-respawn">↻重生</button>
        <button id="btn-color">🎨色</button>
        <button id="btn-panel">⚙面板</button>
        <button id="btn-clear">🗑清</button>
      </div>

      <!-- 中间：形状/颜色指示 -->
      <div id="mid-info">
        <div class="row">
          <span class="shape-dot" id="mid-shape-dot"></span>
          <span class="name" id="mid-shape-name">立方体</span>
        </div>
        <div class="row">
          <span class="color-dot" id="mid-color-dot"></span>
          <span style="color:#6a8aaa;">颜色</span>
        </div>
        <div style="font-size:0.45rem; color:#4a6a8a;" id="mid-pos">0, 0, 0</div>
      </div>

      <!-- 右：触控板 -->
      <div id="touchpad-area">
        <div id="touchpad-label">◀ 触控板 ▶</div>
        <div id="touchpad">
          <div class="divider"></div>
          <span class="label-left">◀ 左键</span>
          <span class="label-right">右键 ▶</span>
          <div class="cursor-dot" id="cursor-dot"></div>
        </div>
      </div>

    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import * as CANNON from 'cannon-es';

    // ============================================================
    //  游戏核心
    // ============================================================
    const game = {
      scene: new THREE.Scene(),
      camera: new THREE.PerspectiveCamera(60, 1, 0.1, 200),
      renderer: new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" }),
      clock: new THREE.Clock(),
      raycaster: new THREE.Raycaster(),
      world: null,
      groundBody: null,
      playerBody: null,
      isLocked: true,
      isDead: false,
      holdK: false,
      cheat: { fly: false, god: true, range: false, auto: false },
      config: { moveSpeed: 6, jumpForce: 7, forceStrength: 1500 },
      placedItems: [],
      allPlaceables: [],
      undoStack: [],
      shapes: {
        types: ['cube', 'sphere', 'cylinder', 'cone', 'torus', 'pyramid', 'capsule', 'octahedron'],
        names: ['立方体', '球体', '圆柱', '圆锥', '圆环', '金字塔', '胶囊', '八面体'],
        index: 0,
        colors: ['#ff6b6b', '#ff9f43', '#feca57', '#54a0ff', '#5f27cd', '#00d2d3', '#55efc4', '#fd79a8', '#ffffff',
          '#e056a0'
        ],
        colorIndex: 0
      },
      input: { keys: {}, euler: new THREE.Euler(0, 0, 0, 'YXZ') },
      geometries: {},
      previewMesh: null,
      directionalLight: null,
      ambientLight: null,
      statsFrames: 0,
      statsTime: 0,
      // 触控板状态
      touchpad: { x: 0.5, y: 0.5, active: false }
    };

    // ---- 场景初始化 ----
    const container = document.getElementById('scene-container');

    function initGraphics() {
      game.renderer.setSize(container.clientWidth, container.clientHeight);
      game.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      game.renderer.shadowMap.enabled = true;
      game.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      game.renderer.setClearColor('#87CEEB');
      container.appendChild(game.renderer.domElement);

      game.scene.background = new THREE.Color('#87CEEB');
      game.scene.fog = new THREE.Fog('#87CEEB', 40, 110);

      game.ambientLight = new THREE.AmbientLight('#bcd4f0', 0.6);
      game.scene.add(game.ambientLight);

      game.directionalLight = new THREE.DirectionalLight('#fff8e7', 1.2);
      game.directionalLight.position.set(20, 30, 10);
      game.directionalLight.castShadow = true;
      game.directionalLight.shadow.mapSize.width = 1024;
      game.directionalLight.shadow.mapSize.height = 1024;
      game.scene.add(game.directionalLight);

      const groundMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(36, 36),
        new THREE.MeshStandardMaterial({ color: '#d5c4a1', roughness: 0.8 })
      );
      groundMesh.rotation.x = -Math.PI / 2;
      groundMesh.position.y = -0.2;
      groundMesh.receiveShadow = true;
      game.scene.add(groundMesh);
      game.allPlaceables.push(groundMesh);

      game.scene.add(new THREE.GridHelper(36, 36, '#c4b99a', '#e0d5c0'));

      game.previewMesh = new THREE.Mesh(
        getGeometry('cube'),
        new THREE.MeshStandardMaterial({ color: '#ff6b6b', transparent: true, opacity: 0.3 })
      );
      game.previewMesh.visible = false;
      game.scene.add(game.previewMesh);

      // 玩家小球（视觉）
      const playerSphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.4, 16, 12),
        new THREE.MeshStandardMaterial({ color: '#4ecdc4', emissive: '#4ecdc4', emissiveIntensity: 0.15 })
      );
      playerSphere.position.set(0, 2, 8);
      game.scene.add(playerSphere);
      game.playerMesh = playerSphere;

      // 相机初始位置
      game.camera.position.set(0, 2.6, 8);
      game.camera.lookAt(0, 0, 0);

      // 窗口大小变化
      window.addEventListener('resize', () => {
        const w = container.clientWidth;
        const h = container.clientHeight;
        game.camera.aspect = w / h;
        game.camera.updateProjectionMatrix();
        game.renderer.setSize(w, h);
      });
    }

    function getGeometry(type) {
      if (!game.geometries[type]) {
        const g = game.geometries;
        switch (type) {
          case 'cube':
            g.cube = new THREE.BoxGeometry(0.95, 0.95, 0.95);
            break;
          case 'sphere':
            g.sphere = new THREE.SphereGeometry(0.48, 24, 18);
            break;
          case 'cylinder':
            g.cylinder = new THREE.CylinderGeometry(0.48, 0.48, 0.95, 16);
            break;
          case 'cone':
            g.cone = new THREE.ConeGeometry(0.48, 0.95, 16);
            break;
          case 'torus':
            g.torus = new THREE.TorusGeometry(0.4, 0.18, 12, 24);
            break;
          case 'pyramid':
            g.pyramid = new THREE.ConeGeometry(0.48, 0.9, 4);
            break;
          case 'capsule':
            g.capsule = new THREE.CylinderGeometry(0.32, 0.32, 0.8, 12);
            break;
          case 'octahedron':
            g.octahedron = new THREE.OctahedronGeometry(0.48);
            break;
          default:
            g.cube = new THREE.BoxGeometry(0.95, 0.95, 0.95);
        }
      }
      return game.geometries[type];
    }

    function getPhysicsShape(type) {
      switch (type) {
        case 'cube':
          return new CANNON.Box(new CANNON.Vec3(0.48, 0.48, 0.48));
        case 'sphere':
          return new CANNON.Sphere(0.48);
        case 'cylinder':
          return new CANNON.Cylinder(0.48, 0.48, 0.95, 8);
        case 'cone':
          return new CANNON.Cylinder(0, 0.48, 0.95, 8);
        case 'torus':
          return new CANNON.Sphere(0.45);
        case 'pyramid':
          return new CANNON.Cylinder(0, 0.48, 0.9, 4);
        case 'capsule':
          return new CANNON.Cylinder(0.32, 0.32, 0.8, 8);
        case 'octahedron':
          return new CANNON.Sphere(0.48);
        default:
          return new CANNON.Box(new CANNON.Vec3(0.48, 0.48, 0.48));
      }
    }

    function createPlacedShape(type, colorHex, position, isStatic = false) {
      const mesh = new THREE.Mesh(
        getGeometry(type),
        new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.35, metalness: 0.05 })
      );
      mesh.position.copy(position);
      mesh.castShadow = mesh.receiveShadow = true;
      mesh.name = 'placed-shape';
      game.scene.add(mesh);
      game.allPlaceables.push(mesh);

      const shape = getPhysicsShape(type);
      const body = new CANNON.Body({ mass: isStatic ? 0 : 1 });
      body.addShape(shape);
      body.position.set(position.x, position.y, position.z);
      body.linearDamping = 0.3;
      body.angularDamping = 0.1;
      game.world.addBody(body);

      const entry = { mesh, body, shapeType: type, isStatic };
      game.placedItems.push(entry);
      return entry;
    }

    function removeEntry(entry) {
      game.world.removeBody(entry.body);
      game.scene.remove(entry.mesh);
      const idx = game.placedItems.indexOf(entry);
      if (idx !== -1) game.placedItems.splice(idx, 1);
      const pIdx = game.allPlaceables.indexOf(entry.mesh);
      if (pIdx !== -1) game.allPlaceables.splice(pIdx, 1);
    }

    function initPhysics() {
      game.world = new CANNON.World();
      game.world.gravity.set(0, -12, 0);
      game.world.broadphase = new CANNON.NaiveBroadphase();
      game.world.defaultContactMaterial.restitution = 0.4;

      const groundShape = new CANNON.Box(new CANNON.Vec3(18, 0.2, 18));
      game.groundBody = new CANNON.Body({ mass: 0 });
      game.groundBody.addShape(groundShape);
      game.groundBody.position.set(0, -0.3, 0);
      game.world.addBody(game.groundBody);

      const bounds = 17.5;
      const wallPos = [
        [0, 0, -bounds],
        [0, 0, bounds],
        [-bounds, 0, 0],
        [bounds, 0, 0]
      ];
      const wallSizes = [
        [bounds * 2, 10, 0.5],
        [bounds * 2, 10, 0.5],
        [0.5, 10, bounds * 2],
        [0.5, 10, bounds * 2]
      ];
      wallPos.forEach((pos, i) => {
        const box = new CANNON.Box(new CANNON.Vec3(wallSizes[i][0], wallSizes[i][1], wallSizes[i][2]));
        const body = new CANNON.Body({ mass: 0 });
        body.addShape(box);
        body.position.set(pos[0], pos[1], pos[2]);
        game.world.addBody(body);
      });

      const playerShape = new CANNON.Sphere(0.4);
      game.playerBody = new CANNON.Body({ mass: 1 });
      game.playerBody.addShape(playerShape);
      game.playerBody.position.set(0, 2, 8);
      game.playerBody.linearDamping = 0.9;
      game.world.addBody(game.playerBody);
    }

    function resetPlayer() {
      game.playerBody.position.set(0, 2, 8);
      game.playerBody.velocity.set(0, 0, 0);
      game.world.gravity.set(0, -12, 0);
      game.camera.position.set(0, 2.6, 8);
      game.input.euler.set(0, 0, 0);
      game.camera.quaternion.setFromEuler(game.input.euler);
      game.isDead = false;
      document.getElementById('death-overlay').classList.remove('active');
    }

    function die() {
      if (game.isDead || game.cheat.god) return;
      game.isDead = true;
      document.getElementById('death-overlay').classList.add('active');
    }

    function getPlacement() {
      const rect = container.getBoundingClientRect();
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      game.raycaster.setFromCamera(new THREE.Vector2(0, 0), game.camera);
      game.raycaster.far = 30;
      const hits = game.raycaster.intersectObjects(game.allPlaceables, false);
      if (hits.length) {
        const point = hits[0].point.clone();
        const normal = hits[0].face.normal.clone().transformDirection(hits[0].object.matrixWorld);
        const pos = point.add(normal.multiplyScalar(0.48));
        pos.x = THREE.MathUtils.clamp(pos.x, -17, 17);
        pos.z = THREE.MathUtils.clamp(pos.z, -17, 17);
        pos.y = Math.max(pos.y, 0.2);
        return { pos, valid: pos.distanceTo(game.camera.position) >= 0.9 };
      }
      return { pos: null, valid: false };
    }

    function applyForceToAll(attract) {
      const p = game.playerBody.position;
      const str = game.config.forceStrength;
      game.placedItems.forEach(item => {
        if (item.isStatic) return;
        const dx = p.x - item.body.position.x,
          dy = p.y - item.body.position.y,
          dz = p.z - item.body.position.z;
        const dist = Math.hypot(dx, dy, dz);
        if (dist < 8 && dist > 0.3) {
          const power = (1 - dist / 8) * str;
          const fx = dx / dist * power,
            fy = dy / dist * power,
            fz = dz / dist * power;
          if (!attract) item.body.applyForce(new CANNON.Vec3(-fx, -fy, -fz), item.body.position);
          else item.body.applyForce(new CANNON.Vec3(fx, fy, fz), item.body.position);
        }
      });
    }

    function explode() {
      const p = game.playerBody.position;
      const str = game.config.forceStrength * 0.7;
      game.placedItems.forEach(item => {
        if (item.isStatic) return;
        const dx = item.body.position.x - p.x,
          dy = item.body.position.y - p.y,
          dz = item.body.position.z - p.z;
        const dist = Math.hypot(dx, dy, dz);
        if (dist < 10 && dist > 0.3) {
          const factor = (1 - dist / 10) * str;
          const inv = 1 / dist;
          item.body.applyImpulse(new CANNON.Vec3(dx * inv * factor, (dy + 0.5) * inv * factor, dz * inv * factor), item
            .body.position);
        }
      });
    }

    function vacuum() {
      const p = game.playerBody.position;
      game.placedItems.forEach(item => {
        if (item.isStatic) return;
        const dx = p.x - item.body.position.x,
          dy = p.y + 0.5 - item.body.position.y,
          dz = p.z - item.body.position.z;
        const dist = Math.hypot(dx, dy, dz);
        if (dist > 1 && dist < 15) item.body.applyImpulse(new CANNON.Vec3(dx * 12, dy * 12, dz * 12), item.body.position);
      });
    }

    function clearWorld() {
      while (game.placedItems.length) removeEntry(game.placedItems[0]);
      game.undoStack = [];
    }

    function updateHUD() {
      const col = game.shapes.colors[game.shapes.colorIndex];
      const name = game.shapes.names[game.shapes.index];
      document.getElementById('shape-dot').style.background = col;
      document.getElementById('shape-name').textContent = name;
      document.getElementById('color-dot').style.background = col;
      document.getElementById('mid-shape-dot').style.background = col;
      document.getElementById('mid-shape-name').textContent = name;
      document.getElementById('mid-color-dot').style.background = col;
    }

    function refreshPreview() {
      const type = game.shapes.types[game.shapes.index];
      game.previewMesh.geometry = getGeometry(type);
      game.previewMesh.material.color.set(game.shapes.colors[game.shapes.colorIndex]);
    }

    // ---- 触控板逻辑 ----
    const touchpad = document.getElementById('touchpad');
    const cursorDot = document.getElementById('cursor-dot');
    let isDragging = false;
    let touchId = null;

    function getTouchPos(e) {
      const rect = touchpad.getBoundingClientRect();
      const clientX = e.clientX || e.touches?.[0]?.clientX || 0;
      const clientY = e.clientY || e.touches?.[0]?.clientY || 0;
      const x = (clientX - rect.left) / rect.width;
      const y = (clientY - rect.top) / rect.height;
      return { x: Math.max(0, Math.min(1, x)), y: Math.max(0, Math.min(1, y)) };
    }

    function handleTouchStart(e) {
      e.preventDefault();
      const pos = getTouchPos(e);
      touchId = e.pointerId || 0;
      isDragging = true;
      game.touchpad.active = true;
      game.touchpad.x = pos.x;
      game.touchpad.y = pos.y;
      cursorDot.style.left = (pos.x * 100) + '%';
      cursorDot.style.top = (pos.y * 100) + '%';
      cursorDot.classList.add('active');

      // 判断左/右
      if (pos.x < 0.45) {
        // 左键 - 放置
        const place = getPlacement();
        if (place.valid && place.pos) {
          const entry = createPlacedShape(
            game.shapes.types[game.shapes.index],
            game.shapes.colors[game.shapes.colorIndex],
            place.pos,
            game.holdK
          );
          game.undoStack.push({ entries: [entry] });
        }
      } else if (pos.x > 0.55) {
        // 右键 - 删除
        const rect = container.getBoundingClientRect();
        const cx = rect.width / 2;
        const cy = rect.height / 2;
        game.raycaster.setFromCamera(new THREE.Vector2(0, 0), game.camera);
        const hits = game.raycaster.intersectObjects(game.allPlaceables, false);
        for (let hit of hits) {
          if (hit.object.name === 'placed-shape') {
            const ent = game.placedItems.find(i => i.mesh === hit.object);
            if (ent) removeEntry(ent);
            break;
          }
        }
      }
    }

    function handleTouchMove(e) {
      e.preventDefault();
      if (!isDragging) return;
      const pos = getTouchPos(e);
      game.touchpad.x = pos.x;
      game.touchpad.y = pos.y;
      cursorDot.style.left = (pos.x * 100) + '%';
      cursorDot.style.top = (pos.y * 100) + '%';

      // 拖动控制视角
      const dx = (pos.x - 0.5) * 2;
      const dy = (pos.y - 0.5) * 2;
      game.input.euler.y -= dx * 0.008;
      game.input.euler.x -= dy * 0.008;
      game.input.euler.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, game.input.euler.x));
      game.camera.quaternion.setFromEuler(game.input.euler);
    }

    function handleTouchEnd(e) {
      e.preventDefault();
      isDragging = false;
      game.touchpad.active = false;
      cursorDot.classList.remove('active');
      touchId = null;
    }

    touchpad.addEventListener('pointerdown', handleTouchStart);
    touchpad.addEventListener('pointermove', handleTouchMove);
    touchpad.addEventListener('pointerup', handleTouchEnd);
    touchpad.addEventListener('pointercancel', handleTouchEnd);

    // ---- 按键绑定 ----
    function setupButtons() {
      const btns = {
        'btn-jump': () => {
          if (!game.cheat.fly && game.playerBody.position.y <= 0.8) {
            game.playerBody.velocity.y = game.config.jumpForce;
          }
        },
        'btn-place': () => {
          const place = getPlacement();
          if (place.valid && place.pos) {
            const entry = createPlacedShape(
              game.shapes.types[game.shapes.index],
              game.shapes.colors[game.shapes.colorIndex],
              place.pos,
              game.holdK
            );
            game.undoStack.push({ entries: [entry] });
          }
        },
        'btn-remove': () => {
          game.raycaster.setFromCamera(new THREE.Vector2(0, 0), game.camera);
          const hits = game.raycaster.intersectObjects(game.allPlaceables, false);
          for (let hit of hits) {
            if (hit.object.name === 'placed-shape') {
              const ent = game.placedItems.find(i => i.mesh === hit.object);
              if (ent) removeEntry(ent);
              break;
            }
          }
        },
        'btn-next': () => {
          game.shapes.index = (game.shapes.index + 1) % game.shapes.types.length;
          updateHUD();
          refreshPreview();
        },
        'btn-grab': () => applyForceToAll(true),
        'btn-push': () => applyForceToAll(false),
        'btn-explode': () => explode(),
        'btn-vacuum': () => vacuum(),
        'btn-respawn': () => resetPlayer(),
        'btn-color': () => {
          game.shapes.colorIndex = (game.shapes.colorIndex + 1) % game.shapes.colors.length;
          updateHUD();
          refreshPreview();
        },
        'btn-panel': () => {
          document.getElementById('cheat-panel').classList.toggle('visible');
        },
        'btn-clear': () => clearWorld()
      };

      Object.keys(btns).forEach(id => {
        const btn = document.getElementById(id);
        if (btn) {
          btn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            btns[id]();
          });
        }
      });
    }

    // ---- 启动 ----
    function initDemo() {
      const demos = [
        [0, 1, -2, 'cube', '#ff6b6b'],
        [3, 1, 1, 'sphere', '#4ecdc4'],
        [-3, 1, 2, 'cylinder', '#ffe66d'],
        [2, 1, 3, 'pyramid', '#a29bfe'],
        [-2, 1, -3, 'capsule', '#00d2d3'],
        [0, 1, 4, 'octahedron', '#fd79a8']
      ];
      demos.forEach(([x, y, z, type, color]) => {
        createPlacedShape(type, color, new THREE.Vector3(x, y, z), false);
      });
    }

    // ---- 动画循环 ----
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(game.clock.getDelta(), 0.033);
      const { keys } = game.input;

      // WASD 键盘支持（桌面调试用）
      if (!game.isDead) {
        let f = 0,
          r = 0;
        if (keys.KeyW) f++;
        if (keys.KeyS) f--;
        if (keys.KeyA) r--;
        if (keys.KeyD) r++;
        const camDir = new THREE.Vector3();
        game.camera.getWorldDirection(camDir);
        camDir.y = 0;
        if (camDir.length()) camDir.normalize();
        const rightVec = new THREE.Vector3().crossVectors(camDir, new THREE.Vector3(0, 1, 0)).normalize();
        const dir = new THREE.Vector3().addScaledVector(camDir, f).addScaledVector(rightVec, r);
        if (dir.length()) dir.normalize();
        game.playerBody.velocity.x = dir.x * game.config.moveSpeed;
        game.playerBody.velocity.z = dir.z * game.config.moveSpeed;
      }

      // 物理
      game.world.step(1 / 60, dt, 3);

      // 同步
      for (let item of game.placedItems) {
        item.mesh.position.copy(item.body.position);
        item.mesh.quaternion.copy(item.body.quaternion);
      }

      // 玩家
      const p = game.playerBody.position;
      game.playerMesh.position.copy(p);
      game.camera.position.copy(p);
      game.camera.position.y += 0.6;

      // 预览
      const place = getPlacement();
      if (place.valid && place.pos) {
        game.previewMesh.position.copy(place.pos);
        game.previewMesh.visible = true;
        game.previewMesh.material.color.set(game.shapes.colors[game.shapes.colorIndex]);
      } else {
        game.previewMesh.visible = false;
      }

      // 死亡检测
      if (!game.isDead && !game.cheat.god && p.y < -8) die();

      // HUD
      document.getElementById('mid-pos').textContent = `${p.x.toFixed(1)}, ${p.y.toFixed(1)}, ${p.z.toFixed(1)}`;
      document.getElementById('obj-count').textContent = game.placedItems.length;

      // FPS
      const now = performance.now();
      if (!game.statsTime) game.statsTime = now;
      game.statsFrames++;
      if (now - game.statsTime >= 500) {
        const fps = Math.round(game.statsFrames / ((now - game.statsTime) / 1000));
        document.getElementById('fps-val').textContent = fps;
        game.statsFrames = 0;
        game.statsTime = now;
      }

      game.renderer.render(game.scene, game.camera);
    }

    // ---- 控制台面板 ----
    function initCheatPanel() {
      const panel = document.createElement('div');
      panel.id = 'cheat-panel';
      panel.style.cssText = `
        position:fixed; top:50px; right:10px; width:220px; 
        background:rgba(8,16,32,0.92); border:1px solid rgba(78,205,196,0.2); 
        color:#b0f0e0; padding:12px; border-radius:16px; 
        opacity:0; pointer-events:none; transition:0.25s; 
        z-index:9999; font-family:monospace; font-size:0.6rem;
        backdrop-filter:blur(12px);
      `;
      panel.innerHTML = `
        <h3 style="color:#4ecdc4;font-size:0.8rem;margin-bottom:6px;">⚡ 控制台</h3>
        <div><label>🕊️ 飞行</label><input type="checkbox" id="cheat-fly"></div>
        <div><label>👑 上帝</label><input type="checkbox" id="cheat-god" checked></div>
        <div><label>🎯 无限放置</label><input type="checkbox" id="cheat-range"></div>
        <div><label>⚡ 自动放置</label><input type="checkbox" id="cheat-auto"></div>
        <div>重力 <input type="range" id="cheat-gravity" min="-20" max="20" value="-12" step="0.5" style="width:100px;"></div>
        <div>速度 <input type="range" id="cheat-speed" min="2" max="30" value="6" step="0.5" style="width:100px;"></div>
        <div>跳跃 <input type="range" id="cheat-jump" min="2" max="20" value="7" step="0.5" style="width:100px;"></div>
        <button class="cheat-btn" id="btn-spawn-batch" style="width:100%;padding:4px;margin:3px 0;background:rgba(0,255,200,0.08);border:1px solid rgba(0,255,200,0.2);color:#b0f0e0;border-radius:8px;cursor:pointer;">批量生成(50)</button>
        <button class="cheat-btn" id="btn-random-color" style="width:100%;padding:4px;margin:3px 0;background:rgba(0,255,200,0.08);border:1px solid rgba(0,255,200,0.2);color:#b0f0e0;border-radius:8px;cursor:pointer;">🎨 随机颜色</button>
        <label style="display:block;margin-top:4px;">脚本</label>
        <textarea id="cheat-script-input" style="width:100%;background:rgba(0,10,0,0.5);border:1px solid rgba(0,255,200,0.15);color:#b0f0e0;padding:4px;border-radius:8px;min-height:40px;font-size:0.6rem;"></textarea>
        <button class="cheat-btn" id="btn-exec-script" style="width:100%;padding:4px;margin:3px 0;background:rgba(0,255,200,0.08);border:1px solid rgba(0,255,200,0.2);color:#b0f0e0;border-radius:8px;cursor:pointer;">执行脚本</button>
      `;
      document.body.appendChild(panel);

      document.getElementById('cheat-fly').addEventListener('change', e => {
        game.cheat.fly = e.target.checked;
      });
      document.getElementById('cheat-god').addEventListener('change', e => {
        game.cheat.god = e.target.checked;
      });
      document.getElementById('cheat-range').addEventListener('change', e => {
        game.cheat.range = e.target.checked;
      });
      document.getElementById('cheat-auto').addEventListener('change', e => {
        game.cheat.auto = e.target.checked;
      });
      document.getElementById('cheat-gravity').addEventListener('input', e => {
        game.world.gravity.set(0, parseFloat(e.target.value), 0);
      });
      document.getElementById('cheat-speed').addEventListener('input', e => {
        game.config.moveSpeed = parseFloat(e.target.value);
      });
      document.getElementById('cheat-jump').addEventListener('input', e => {
        game.config.jumpForce = parseFloat(e.target.value);
      });
      document.getElementById('btn-spawn-batch').addEventListener('click', () => {
        spawnBatch(50);
      });
      document.getElementById('btn-random-color').addEventListener('click', () => {
        game.shapes.colorIndex = Math.floor(Math.random() * game.shapes.colors.length);
        updateHUD();
        refreshPreview();
      });
      document.getElementById('btn-exec-script').addEventListener('click', execScript);
    }

    function spawnBatch(count) {
      const num = Math.max(1, Math.floor(count));
      const type = game.shapes.types[game.shapes.index];
      const color = game.shapes.colors[game.shapes.colorIndex];
      const dir = new THREE.Vector3();
      game.camera.getWorldDirection(dir);
      const base = game.camera.position.clone().add(dir.multiplyScalar(3));
      for (let i = 0; i < num; i++) {
        const ang = (i / num) * Math.PI * 2 + Math.random() * 0.5;
        const r = 1.5 + Math.random() * 3;
        const x = base.x + Math.cos(ang) * r,
          z = base.z + Math.sin(ang) * r,
          y = base.y + Math.random() * 2;
        createPlacedShape(type, color, new THREE.Vector3(x, y, z), game.holdK);
      }
    }

    function execScript() {
      const code = document.getElementById('cheat-script-input').value;
      try {
        const ctx = {
          setGravity: (v) => { game.world.gravity.set(0, v, 0);
            document.getElementById('cheat-gravity').value = v; },
          spawnSphere: (x, y, z, col) => createPlacedShape('sphere', col || '#ff6b6b', new THREE.Vector3(x, y, z)),
          spawnCube: (x, y, z, col) => createPlacedShape('cube', col || '#ff6b6b', new THREE.Vector3(x, y, z)),
          clearAll: clearWorld,
          log: console.log
        };
        new Function(...Object.keys(ctx), code)(...Object.values(ctx));
      } catch (e) { alert("脚本错误: " + e.message); }
    }

    // ---- 键盘 ----
    document.addEventListener('keydown', (e) => {
      game.input.keys[e.code] = true;
      if (e.code === 'KeyK') game.holdK = true;
      if (e.code >= 'Digit1' && e.code <= 'Digit8') {
        game.shapes.index = parseInt(e.code.slice(-1)) - 1;
        updateHUD();
        refreshPreview();
      }
      if (e.code === 'KeyR') {
        game.shapes.colorIndex = (game.shapes.colorIndex + 1) % game.shapes.colors.length;
        updateHUD();
        refreshPreview();
      }
      if (e.code === 'Space' && game.playerBody.position.y <= 0.8) {
        e.preventDefault();
        game.playerBody.velocity.y = game.config.jumpForce;
      }
      if (e.code === 'KeyF') { e.preventDefault();
        resetPlayer(); }
      if (e.code === 'KeyG') applyForceToAll(true);
      if (e.code === 'KeyH') applyForceToAll(false);
      if (e.code === 'KeyB') explode();
      if (e.code === 'KeyV') vacuum();
    });
    document.addEventListener('keyup', (e) => {
      game.input.keys[e.code] = false;
      if (e.code === 'KeyK') game.holdK = false;
    });

    // ---- 启动 ----
    function init() {
      initGraphics();
      initPhysics();
      initDemo();
      updateHUD();
      refreshPreview();
      setupButtons();
      initCheatPanel();

      // 自动开始（移动端直接进入）
      document.getElementById('start-overlay').classList.add('hidden');

      // 上帝模式默认开启
      game.cheat.god = true;
      document.getElementById('cheat-god').checked = true;

      // 窗口resize
      window.addEventListener('resize', () => {
        const w = container.clientWidth;
        const h = container.clientHeight;
        game.camera.aspect = w / h;
        game.camera.updateProjectionMatrix();
        game.renderer.setSize(w, h);
      });

      animate();

      setTimeout(() => {
        const ld = document.getElementById('loading-overlay');
        if (ld) { ld.style.opacity = 0;
          setTimeout(() => ld.style.display = 'none', 500); }
      }, 500);
    }

    // loading遮罩
    const loading = document.createElement('div');
    loading.id = 'loading-overlay';
    loading.style.cssText = `
      position:fixed; inset:0; background:#0a0e1a; display:flex; 
      flex-direction:column; align-items:center; justify-content:center; 
      z-index:9999; color:#4ecdc4;
    `;
    loading.innerHTML = `
      <div style="width:40px;height:40px;border:3px solid rgba(78,205,196,0.2);border-top:3px solid #4ecdc4;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px;"></div>
      <p>加载物理引擎 ...</p>
      <style>@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}</style>
    `;
    document.body.appendChild(loading);

    init();
  </script>
</body>
</html>
