<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>体素沙盒 · 最终版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'PingFang SC', sans-serif;
      overflow: hidden;
      background: #0b0f1a;
      user-select: none;
      touch-action: none;
      position: fixed;
      width: 100%;
      height: 100%;
    }

    #scene-container {
      width: 100vw;
      height: 100vh;
      background: #151e2e;
      overflow: hidden;
      position: relative;
    }
    #scene-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* ===== HUD ===== */
    #hud {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 6px 20px;
      background: rgba(8, 14, 30, 0.75);
      backdrop-filter: blur(14px);
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.06);
      color: #b0c8e8;
      font-size: 0.6rem;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    #hud .dot {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      display: inline-block;
      border: 1.5px solid rgba(255,255,255,0.1);
      margin-right: 4px;
    }
    #hud .name { color: #e0ecff; font-weight: 600; }
    #hud .right {
      display: flex;
      gap: 12px;
      font-family: monospace;
      font-size: 0.5rem;
      color: #4ecdc4;
    }

    /* ===== 底部控制栏 ===== */
    #bottom-controls {
      position: absolute;
      bottom: 16px;
      left: 0;
      right: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 12px;
      pointer-events: none;
    }
    #bottom-controls > * { pointer-events: auto; }

    #toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 6px 12px;
      border-radius: 28px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    .tool-group {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .btn-icon {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(4px);
      color: #ffffff;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      transition: 0.08s;
      border: 1px solid rgba(255,255,255,0.04);
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
      font-family: inherit;
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
    .btn-icon:active {
      transform: scale(0.85);
      background: rgba(78,205,196,0.2);
    }
    .btn-icon.action:active { background: rgba(255,107,107,0.2); }

    #shape-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.2);
      backdrop-filter: blur(4px);
      padding: 2px 12px 2px 6px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.03);
    }
    #shape-dot {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 1.5px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    #shape-name {
      color: #e0ecff;
      font-size: 0.6rem;
      font-weight: 500;
    }

    /* ===== 摇杆 + 跳跃 ===== */
    #control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(14px);
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.04);
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }

    #joystick-area {
      position: relative;
      width: 100px;
      height: 100px;
      touch-action: none;
      flex-shrink: 0;
    }
    #joystick-base {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px);
      border: 2px solid rgba(255,255,255,0.08);
      box-shadow: inset 0 0 30px rgba(0,0,0,0.2);
    }
    #joystick-thumb {
      position: absolute;
      width: 44%;
      height: 44%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #8cf0e8, #1f8a82);
      border: 2.5px solid rgba(255,255,255,0.2);
      box-shadow: 0 0 30px rgba(78,205,196,0.15);
      top: 28%;
      left: 28%;
      pointer-events: none;
      transition: none;
    }

    #btn-jump {
      width: 80px;
      height: 80px;
      border: none;
      border-radius: 50%;
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(145deg, #ff6b6b, #d63031);
      box-shadow: 0 8px 30px rgba(255,107,107,0.2), inset 0 -4px 0 rgba(0,0,0,0.1);
      cursor: pointer;
      touch-action: none;
      transition: 0.06s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.05);
    }
    #btn-jump:active {
      transform: scale(0.85);
      box-shadow: 0 4px 15px rgba(255,107,107,0.1);
    }

    /* ===== 右上触控板 ===== */
    #touchpad-wrap {
      position: absolute;
      top: 68px;
      right: 10px;
      width: 64px;
      height: 64px;
      z-index: 25;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(14px);
      border-radius: 36px;
      border: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      pointer-events: auto;
      touch-action: none;
    }
    #touchpad-wrap #touchpad-label {
      color: rgba(255,255,255,0.3);
      font-size: 0.3rem;
      letter-spacing: 1px;
      margin-bottom: 2px;
      font-weight: 500;
    }
    #touchpad {
      width: 48px;
      height: 32px;
      border-radius: 30px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.04);
      position: relative;
      touch-action: none;
      cursor: pointer;
      overflow: hidden;
    }
    #touchpad .divider {
      position: absolute;
      top: 0; bottom: 0; left: 50%;
      width: 1px;
      background: rgba(255,255,255,0.06);
    }
    #touchpad .label-left,
    #touchpad .label-right {
      position: absolute;
      bottom: 2px;
      font-size: 0.3rem;
      color: rgba(255,255,255,0.08);
      letter-spacing: 1px;
    }
    #touchpad .label-left { left: 6px; }
    #touchpad .label-right { right: 6px; }
    #touchpad .cursor-dot {
      position: absolute;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(78,205,196,0.4), rgba(78,205,196,0.05));
      border: 1.5px solid rgba(78,205,196,0.2);
      pointer-events: none;
      transform: translate(-50%, -50%);
      display: none;
    }
    #touchpad .cursor-dot.active { display: block; }

    /* ===== 启动界面 ===== */
    #start-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(8,12,26,0.98), rgba(0,0,0,0.99));
      backdrop-filter: blur(16px);
      transition: opacity 0.4s ease, visibility 0.4s ease;
      visibility: visible;
    }
    #start-overlay.hidden {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }
    #start-box {
      background: rgba(18,26,48,0.95);
      border: 1.5px solid rgba(78,205,196,0.15);
      border-radius: 32px;
      padding: 28px 24px;
      text-align: center;
      color: #eaf2ff;
      max-width: 320px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      animation: breathe 2.4s ease-in-out infinite;
      cursor: pointer;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
      50% { transform: scale(1.02); box-shadow: 0 20px 80px rgba(78,205,196,0.15); }
    }
    #start-box h1 {
      font-size: 1.8rem;
      margin-bottom: 2px;
      background: linear-gradient(135deg, #4ecdc4, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #start-box .sub {
      color: #4ecdc4;
      font-size: 0.9rem;
      margin-bottom: 6px;
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    #start-box p {
      font-size: 0.65rem;
      color: #8aa4c8;
      margin: 2px 0;
    }
    #start-box .key {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.5rem;
      display: inline-block;
      color: #b0c8e8;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 600px) {
      #hud { font-size: 0.5rem; gap: 8px; padding: 4px 14px; top: 10px; }
      #hud .right { font-size: 0.45rem; gap: 6px; }
      #touchpad-wrap { width: 56px; height: 56px; top: 60px; right: 8px; }
      #touchpad { width: 40px; height: 28px; }
      .btn-icon { width: 34px; height: 34px; font-size: 1rem; border-radius: 10px; }
      #shape-indicator { padding: 2px 8px 2px 4px; }
      #shape-dot { width: 16px; height: 16px; }
      #shape-name { font-size: 0.5rem; }
      #joystick-area { width: 80px; height: 80px; }
      #btn-jump { width: 64px; height: 64px; font-size: 1.4rem; }
      #toolbar { padding: 4px 8px; }
    }
    @media (max-width: 420px) {
      .btn-icon { width: 28px; height: 28px; font-size: 0.8rem; border-radius: 8px; }
      #shape-dot { width: 12px; height: 12px; }
      #shape-name { font-size: 0.45rem; }
      #joystick-area { width: 68px; height: 68px; }
      #btn-jump { width: 54px; height: 54px; font-size: 1.2rem; }
      #touchpad-wrap { width: 46px; height: 46px; top: 52px; }
      #touchpad { width: 34px; height: 24px; }
      #hud { font-size: 0.4rem; gap: 4px; padding: 2px 10px; }
      #hud .right { font-size: 0.35rem; gap: 4px; }
    }
  </style>
</head>
<body>

  <!-- ===== 启动界面 ===== -->
  <div id="start-overlay">
    <div id="start-box">
      <h1>沙盒 · 最终版</h1>
      <p class="sub">👆 点击任意处进入</p>
      <p><span class="key">摇杆</span> 移动 · <span class="key">跳跃</span> 大按钮</p>
      <p><span class="key">右触板</span> 左/右 · <span class="key">右滑</span> 视角</p>
    </div>
  </div>

  <!-- ===== 主场景 ===== -->
  <div id="scene-container">
    
    <!-- HUD -->
    <div id="hud">
      <span id="shape-indicator">
        <span id="shape-dot" class="dot"></span>
        <span id="shape-name" class="name">立方体</span>
      </span>
      <span class="right">📦 <span id="obj-count">0</span> ⚡ <span id="fps-val">60</span>fps</span>
    </div>

    <!-- 右上触控板 -->
    <div id="touchpad-wrap">
      <div id="touchpad-label">◀ ▶</div>
      <div id="touchpad">
        <div class="divider"></div>
        <span class="label-left">◀</span>
        <span class="label-right">▶</span>
        <div class="cursor-dot" id="cursor-dot"></div>
      </div>
    </div>

    <!-- 底部控制 -->
    <div id="bottom-controls">
      
      <!-- 工具栏 -->
      <div id="toolbar">
        <div class="tool-group">
          <button class="btn-icon action" id="btn-place">+</button>
          <button class="btn-icon action" id="btn-remove">−</button>
          <button class="btn-icon" id="btn-next">▶</button>
          <button class="btn-icon" id="btn-grab">🌀</button>
          <button class="btn-icon" id="btn-push">💨</button>
        </div>
        <div class="tool-group">
          <button class="btn-icon" id="btn-explode">💥</button>
          <button class="btn-icon" id="btn-vacuum">🌪</button>
          <button class="btn-icon" id="btn-color">🎨</button>
        </div>
      </div>

      <!-- 摇杆 + 跳跃 -->
      <div id="control-row">
        <div id="joystick-area">
          <div id="joystick-base"></div>
          <div id="joystick-thumb"></div>
        </div>
        <button id="btn-jump">⬆</button>
      </div>

    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import * as CANNON from 'cannon-es';

    // ================================================================
    //  配置
    // ================================================================
    const CFG = {
      moveSpeed: 6,
      jumpForce: 7,
      gravity: -12,
      playerRadius: 0.4,
      blockSize: 0.95,
      physicsSize: 0.475,
      worldSize: 17,
    };

    // ================================================================
    //  DOM 引用
    // ================================================================
    const container = document.getElementById('scene-container');
    const dom = {
      startOverlay: document.getElementById('start-overlay'),
      joystickArea: document.getElementById('joystick-area'),
      joystickThumb: document.getElementById('joystick-thumb'),
      touchpad: document.getElementById('touchpad'),
      cursorDot: document.getElementById('cursor-dot'),
      btnJump: document.getElementById('btn-jump'),
      btnPlace: document.getElementById('btn-place'),
      btnRemove: document.getElementById('btn-remove'),
      btnNext: document.getElementById('btn-next'),
      btnGrab: document.getElementById('btn-grab'),
      btnPush: document.getElementById('btn-push'),
      btnExplode: document.getElementById('btn-explode'),
      btnVacuum: document.getElementById('btn-vacuum'),
      btnColor: document.getElementById('btn-color'),
      objCount: document.getElementById('obj-count'),
      fpsVal: document.getElementById('fps-val'),
      shapeDot: document.getElementById('shape-dot'),
      shapeName: document.getElementById('shape-name'),
    };

    // ================================================================
    //  Three.js 初始化
    // ================================================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 40, 110);

    const camera = new THREE.PerspectiveCamera(68, container.clientWidth / container.clientHeight, 0.1, 200);
    camera.position.set(0, 2.6, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // 灯光
    const ambient = new THREE.AmbientLight(0xbcd4f0, 0.6);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xfff8e7, 1.2);
    dirLight.position.set(20, 30, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 512;
    dirLight.shadow.mapSize.height = 512;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 60;
    dirLight.shadow.camera.left = -25;
    dirLight.shadow.camera.right = 25;
    dirLight.shadow.camera.top = 25;
    dirLight.shadow.camera.bottom = -25;
    scene.add(dirLight);

    // 地面
    const groundMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(36, 36),
      new THREE.MeshStandardMaterial({ color: 0xd5c4a1, roughness: 0.8 })
    );
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.position.y = -0.2;
    groundMesh.receiveShadow = true;
    scene.add(groundMesh);
    const allObjects = [groundMesh];

    // 网格
    const grid = new THREE.GridHelper(36, 24, 0xc4b99a, 0xe0d5c0);
    scene.add(grid);

    // ================================================================
    //  Cannon.js 初始化
    // ================================================================
    const world = new CANNON.World();
    world.gravity.set(0, CFG.gravity, 0);
    world.broadphase = new CANNON.SAPBroadphase(world);
    world.allowSleep = true;
    world.defaultContactMaterial.restitution = 0.3;

    // 地面物理
    const groundShape = new CANNON.Box(new CANNON.Vec3(18, 0.2, 18));
    const groundBody = new CANNON.Body({ mass: 0 });
    groundBody.addShape(groundShape);
    groundBody.position.set(0, -0.3, 0);
    world.addBody(groundBody);

    // 边界墙
    const b = CFG.worldSize;
    [
      { pos: [0, 5, -b], size: [b * 2, 10, 0.5] },
      { pos: [0, 5, b], size: [b * 2, 10, 0.5] },
      { pos: [-b, 5, 0], size: [0.5, 10, b * 2] },
      { pos: [b, 5, 0], size: [0.5, 10, b * 2] },
    ].forEach(w => {
      const shape = new CANNON.Box(new CANNON.Vec3(w.size[0], w.size[1], w.size[2]));
      const body = new CANNON.Body({ mass: 0 });
      body.addShape(shape);
      body.position.set(w.pos[0], w.pos[1], w.pos[2]);
      world.addBody(body);
    });

    // 玩家（只有物理体，没有模型）
    const playerShape = new CANNON.Sphere(CFG.playerRadius);
    const playerBody = new CANNON.Body({ mass: 1 });
    playerBody.addShape(playerShape);
    playerBody.position.set(0, 2, 8);
    playerBody.linearDamping = 0.9;
    playerBody.angularDamping = 0.9;
    world.addBody(playerBody);

    // ================================================================
    //  物体管理
    // ================================================================
    const placed = [];
    let isOnGround = false;

    // 形状配置
    const shapes = {
      types: ['cube', 'sphere', 'cylinder', 'cone', 'torus', 'pyramid'],
      names: ['立方体', '球体', '圆柱', '圆锥', '圆环', '金字塔'],
      index: 0,
      colors: ['#ff6b6b', '#4ecdc4', '#ffe66d', '#a29bfe', '#fd79a8', '#00d2d3', '#ff9f43', '#55efc4'],
      colorIndex: 0,
    };

    // 几何体缓存
    const geoCache = {};
    function getGeometry(type) {
      if (!geoCache[type]) {
        const s = CFG.blockSize;
        const r = CFG.physicsSize;
        switch (type) {
          case 'cube': geoCache[type] = new THREE.BoxGeometry(s, s, s); break;
          case 'sphere': geoCache[type] = new THREE.SphereGeometry(r, 16, 12); break;
          case 'cylinder': geoCache[type] = new THREE.CylinderGeometry(r, r, s, 12); break;
          case 'cone': geoCache[type] = new THREE.ConeGeometry(r, s, 12); break;
          case 'torus': geoCache[type] = new THREE.TorusGeometry(r * 0.85, 0.18, 10, 16); break;
          case 'pyramid': geoCache[type] = new THREE.ConeGeometry(r, s * 0.95, 4); break;
          default: geoCache[type] = new THREE.BoxGeometry(s, s, s);
        }
      }
      return geoCache[type];
    }

    // Cannon 形状缓存
    const shapeCache = {};
    function getCannonShape(type) {
      if (!shapeCache[type]) {
        const s = CFG.physicsSize;
        switch (type) {
          case 'cube': shapeCache[type] = new CANNON.Box(new CANNON.Vec3(s, s, s)); break;
          case 'sphere': shapeCache[type] = new CANNON.Sphere(s); break;
          case 'cylinder': shapeCache[type] = new CANNON.Cylinder(s, s, CFG.blockSize, 6); break;
          case 'cone': shapeCache[type] = new CANNON.Cylinder(0, s, CFG.blockSize, 6); break;
          case 'torus': shapeCache[type] = new CANNON.Sphere(s * 0.85); break;
          case 'pyramid': shapeCache[type] = new CANNON.Cylinder(0, s, CFG.blockSize * 0.95, 4); break;
          default: shapeCache[type] = new CANNON.Box(new CANNON.Vec3(s, s, s));
        }
      }
      return shapeCache[type];
    }

    function createPlaced(type, color, position, isStatic = false) {
      const mesh = new THREE.Mesh(
        getGeometry(type),
        new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.05 })
      );
      mesh.position.copy(position);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      allObjects.push(mesh);

      const body = new CANNON.Body({ mass: isStatic ? 0 : 1 });
      body.addShape(getCannonShape(type));
      body.position.set(position.x, position.y, position.z);
      body.linearDamping = 0.3;
      body.angularDamping = 0.1;
      world.addBody(body);

      const entry = { mesh, body, type, color, isStatic };
      placed.push(entry);
      return entry;
    }

    function removePlaced(entry) {
      world.removeBody(entry.body);
      scene.remove(entry.mesh);
      const idx = placed.indexOf(entry);
      if (idx !== -1) placed.splice(idx, 1);
      const pIdx = allObjects.indexOf(entry.mesh);
      if (pIdx !== -1) allObjects.splice(pIdx, 1);
    }

    // ================================================================
    //  射线检测（放置/删除）
    // ================================================================
    function getPlacement() {
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      raycaster.far = 30;
      const hits = raycaster.intersectObjects(allObjects, false);
      if (hits.length > 0) {
        const point = hits[0].point.clone();
        const normal = hits[0].face.normal.clone().transformDirection(hits[0].object.matrixWorld);
        const pos = point.add(normal.multiplyScalar(CFG.physicsSize));
        pos.x = THREE.MathUtils.clamp(pos.x, -CFG.worldSize, CFG.worldSize);
        pos.z = THREE.MathUtils.clamp(pos.z, -CFG.worldSize, CFG.worldSize);
        pos.y = Math.max(pos.y, 0.2);
        if (pos.distanceTo(camera.position) < 0.9) return null;
        return pos;
      }
      return null;
    }

    // ================================================================
    //  交互功能
    // ================================================================
    function applyForce(attract) {
      const p = playerBody.position;
      const str = 1500;
      placed.forEach(entry => {
        if (entry.isStatic) return;
        const dx = p.x - entry.body.position.x;
        const dy = p.y - entry.body.position.y;
        const dz = p.z - entry.body.position.z;
        const dist = Math.hypot(dx, dy, dz);
        if (dist < 8 && dist > 0.3) {
          const power = (1 - dist / 8) * str;
          const factor = attract ? 1 : -1;
          entry.body.applyForce(
            new CANNON.Vec3(dx / dist * power * factor, dy / dist * power * factor, dz / dist * power * factor),
            entry.body.position
          );
        }
      });
    }

    function explode() {
      const p = playerBody.position;
      const str = 1500 * 0.7;
      placed.forEach(entry => {
        if (entry.isStatic) return;
        const dx = entry.body.position.x - p.x;
        const dy = entry.body.position.y - p.y;
        const dz = entry.body.position.z - p.z;
        const dist = Math.hypot(dx, dy, dz);
        if (dist < 10 && dist > 0.3) {
          const factor = (1 - dist / 10) * str / dist;
          entry.body.applyImpulse(
            new CANNON.Vec3(dx * factor, (dy + 0.5) * factor, dz * factor),
            entry.body.position
          );
        }
      });
    }

    function vacuum() {
      const p = playerBody.position;
      placed.forEach(entry => {
        if (entry.isStatic) return;
        const dx = p.x - entry.body.position.x;
        const dy = p.y + 0.5 - entry.body.position.y;
        const dz = p.z - entry.body.position.z;
        const dist = Math.hypot(dx, dy, dz);
        if (dist > 1 && dist < 15) {
          entry.body.applyImpulse(
            new CANNON.Vec3(dx * 12, dy * 12, dz * 12),
            entry.body.position
          );
        }
      });
    }

    // ================================================================
    //  更新 UI
    // ================================================================
    function updateUI() {
      const color = shapes.colors[shapes.colorIndex];
      const name = shapes.names[shapes.index];
      dom.shapeDot.style.background = color;
      dom.shapeName.textContent = name;
      dom.objCount.textContent = placed.length;
    }

    // ================================================================
    //  摇杆控制
    // ================================================================
    let joyPointerId = null;
    const joyMaxDist = 30;
    const joyValue = { x: 0, y: 0 };

    function updateJoystick(clientX, clientY) {
      const rect = dom.joystickArea.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      let dx = clientX - cx;
      let dy = clientY - cy;
      const dist = Math.hypot(dx, dy);
      const clamped = Math.min(dist, joyMaxDist);
      if (dist > 0.001) { dx = dx / dist * clamped; dy = dy / dist * clamped; }
      joyValue.x = dx / joyMaxDist;
      joyValue.y = -dy / joyMaxDist;
      dom.joystickThumb.style.transform = `translate(${dx}px, ${dy}px)`;
    }

    function resetJoystick() {
      joyValue.x = 0;
      joyValue.y = 0;
      dom.joystickThumb.style.transform = 'translate(0px, 0px)';
      joyPointerId = null;
    }

    dom.joystickArea.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      joyPointerId = e.pointerId;
      dom.joystickArea.setPointerCapture(e.pointerId);
      updateJoystick(e.clientX, e.clientY);
    });

    dom.joystickArea.addEventListener('pointermove', (e) => {
      if (joyPointerId === null) return;
      updateJoystick(e.clientX, e.clientY);
    });

    dom.joystickArea.addEventListener('pointerup', (e) => {
      if (joyPointerId === e.pointerId) resetJoystick();
    });
    dom.joystickArea.addEventListener('pointercancel', resetJoystick);

    // ================================================================
    //  触控板（右上）
    // ================================================================
    function getTouchPos(e) {
      const rect = dom.touchpad.getBoundingClientRect();
      const cx = e.clientX || e.touches?.[0]?.clientX || 0;
      const cy = e.clientY || e.touches?.[0]?.clientY || 0;
      return {
        x: Math.max(0, Math.min(1, (cx - rect.left) / rect.width)),
        y: Math.max(0, Math.min(1, (cy - rect.top) / rect.height)),
      };
    }

    dom.touchpad.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      const pos = getTouchPos(e);
      dom.cursorDot.style.left = (pos.x * 100) + '%';
      dom.cursorDot.style.top = (pos.y * 100) + '%';
      dom.cursorDot.classList.add('active');

      if (pos.x < 0.5) {
        const p = getPlacement();
        if (p) {
          createPlaced(
            shapes.types[shapes.index],
            shapes.colors[shapes.colorIndex],
            p
          );
          updateUI();
        }
      } else {
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        const hits = raycaster.intersectObjects(allObjects, false);
        for (const hit of hits) {
          const entry = placed.find(e => e.mesh === hit.object);
          if (entry) {
            removePlaced(entry);
            updateUI();
            break;
          }
        }
      }
    });

    dom.touchpad.addEventListener('pointerup', () => {
      dom.cursorDot.classList.remove('active');
    });
    dom.touchpad.addEventListener('pointercancel', () => {
      dom.cursorDot.classList.remove('active');
    });

    // ================================================================
    //  视角拖拽（右半屏）
    // ================================================================
    let viewDrag = { active: false, id: null, lastX: 0, lastY: 0 };
    const euler = new THREE.Euler(0, 0, 0, 'YXZ');

    document.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button') ||
        e.target.closest('#touchpad-wrap') ||
        e.target.closest('#toolbar') ||
        e.target.closest('#control-row') ||
        e.target.closest('#start-overlay')) return;

      const rect = container.getBoundingClientRect();
      const x = e.clientX - rect.left;
      if (x > rect.width * 0.5) {
        viewDrag.active = true;
        viewDrag.id = e.pointerId;
        viewDrag.lastX = e.clientX;
        viewDrag.lastY = e.clientY;
        e.preventDefault();
      }
    });

    document.addEventListener('pointermove', (e) => {
      if (!viewDrag.active || viewDrag.id !== e.pointerId) return;
      const dx = e.clientX - viewDrag.lastX;
      const dy = e.clientY - viewDrag.lastY;
      viewDrag.lastX = e.clientX;
      viewDrag.lastY = e.clientY;

      euler.y -= dx * 0.008;
      euler.x -= dy * 0.008;
      euler.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, euler.x));
      camera.quaternion.setFromEuler(euler);
    });

    document.addEventListener('pointerup', (e) => {
      if (viewDrag.id === e.pointerId) {
        viewDrag.active = false;
        viewDrag.id = null;
      }
    });
    document.addEventListener('pointercancel', () => {
      viewDrag.active = false;
      viewDrag.id = null;
    });

    // ================================================================
    //  键盘
    // ================================================================
    const keys = {};
    document.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space') e.preventDefault();
    });
    document.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    // ================================================================
    //  按钮事件
    // ================================================================
    dom.btnJump.addEventListener('pointerdown', () => {
      if (isOnGround) {
        playerBody.velocity.y = CFG.jumpForce;
        isOnGround = false;
      }
    });

    dom.btnPlace.addEventListener('pointerdown', () => {
      const p = getPlacement();
      if (p) {
        createPlaced(shapes.types[shapes.index], shapes.colors[shapes.colorIndex], p);
        updateUI();
      }
    });

    dom.btnRemove.addEventListener('pointerdown', () => {
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const hits = raycaster.intersectObjects(allObjects, false);
      for (const hit of hits) {
        const entry = placed.find(e => e.mesh === hit.object);
        if (entry) {
          removePlaced(entry);
          updateUI();
          break;
        }
      }
    });

    dom.btnNext.addEventListener('pointerdown', () => {
      shapes.index = (shapes.index + 1) % shapes.types.length;
      updateUI();
    });

    dom.btnGrab.addEventListener('pointerdown', () => applyForce(true));
    dom.btnPush.addEventListener('pointerdown', () => applyForce(false));
    dom.btnExplode.addEventListener('pointerdown', explode);
    dom.btnVacuum.addEventListener('pointerdown', vacuum);

    dom.btnColor.addEventListener('pointerdown', () => {
      shapes.colorIndex = (shapes.colorIndex + 1) % shapes.colors.length;
      updateUI();
    });

    // ================================================================
    //  启动
    // ================================================================
    dom.startOverlay.addEventListener('click', () => {
      dom.startOverlay.classList.add('hidden');
    }, { once: true });

    // 演示场景
    const demos = [
      [0, 1, -2, 'cube', '#ff6b6b'],
      [3, 1, 1, 'sphere', '#4ecdc4'],
      [-3, 1, 2, 'cylinder', '#ffe66d'],
      [2, 1, 3, 'pyramid', '#a29bfe'],
      [-2, 1, -3, 'cone', '#00d2d3'],
      [0, 1, 4, 'torus', '#fd79a8'],
    ];
    demos.forEach(([x, y, z, type, color]) => {
      createPlaced(type, color, new THREE.Vector3(x, y, z));
    });
    updateUI();

    // ================================================================
    //  窗口缩放
    // ================================================================
    window.addEventListener('resize', () => {
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    // ================================================================
    //  主循环
    // ================================================================
    const clock = new THREE.Clock();
    let stats = { frames: 0, time: 0 };

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.033);

      // ---- 物理步进 ----
      world.step(1 / 60, dt, 5);

      // ---- 检测是否在地面 ----
      isOnGround = playerBody.position.y <= 0.5 && Math.abs(playerBody.velocity.y) < 0.5;

      // ---- 玩家移动 ----
      const dead = 0.15;
      let mx = 0,
        mz = 0;
      if (Math.abs(joyValue.x) > dead) mx = joyValue.x;
      if (Math.abs(joyValue.y) > dead) mz = joyValue.y;
      if (keys['KeyW']) mz = 1;
      else if (keys['KeyS']) mz = -1;
      if (keys['KeyA']) mx = -1;
      else if (keys['KeyD']) mx = 1;

      const len = Math.hypot(mx, mz);
      if (len > 1) { mx /= len;
        mz /= len; }

      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward);
      forward.y = 0;
      if (forward.length() > 0.001) forward.normalize();
      const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

      const dir = new THREE.Vector3().addScaledVector(forward, mz).addScaledVector(right, mx);
      if (dir.length() > 0.001) {
        dir.normalize();
        playerBody.velocity.x = dir.x * CFG.moveSpeed;
        playerBody.velocity.z = dir.z * CFG.moveSpeed;
      } else {
        playerBody.velocity.x *= 0.92;
        playerBody.velocity.z *= 0.92;
      }

      // 键盘跳跃
      if (keys['Space'] && isOnGround) {
        playerBody.velocity.y = CFG.jumpForce;
        isOnGround = false;
      }

      // ---- 同步物体 ----
      for (const entry of placed) {
        entry.mesh.position.copy(entry.body.position);
        entry.mesh.quaternion.copy(entry.body.quaternion);
      }

      // ---- 相机跟随 ----
      const camPos = new THREE.Vector3().copy(playerBody.position);
      camPos.y += 0.6;
      camera.position.copy(camPos);

      // ---- 死亡检测 ----
      if (playerBody.position.y < -10) {
        playerBody.position.set(0, 2, 8);
        playerBody.velocity.set(0, 0, 0);
      }

      // ---- 统计 ----
      const now = performance.now();
      stats.frames++;
      if (!stats.time) stats.time = now;
      if (now - stats.time >= 500) {
        dom.fpsVal.textContent = Math.round(stats.frames / ((now - stats.time) / 1000));
        stats.frames = 0;
        stats.time = now;
      }

      // ---- 渲染 ----
      renderer.render(scene, camera);
    }

    animate();

    console.log('✅ 沙盒已启动！摇杆移动，跳跃按钮，右半屏拖视角');
  </script>
</body>
</html>
