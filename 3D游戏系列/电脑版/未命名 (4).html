<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 物理沙盒</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      overflow: hidden;
      background: #0b0f14;
      color: #fff;
    }
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }

    /* 开始界面 */
    #start-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10,14,20,0.92);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.4s ease;
    }
    #start-button {
      padding: 14px 36px;
      font-size: 16px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(74,144,226,0.3);
    }
    #start-button:hover {
      background: #5a9ff0;
      transform: translateY(-2px);
    }
    #start-info {
      margin-top: 24px;
      color: #ccc;
      font-size: 14px;
      line-height: 1.7;
      max-width: 420px;
      text-align: center;
    }

    /* 死亡界面 */
    #death-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20,10,10,0.9);
      backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 998;
    }
    #death-text {
      font-size: 36px;
      color: #ff4444;
      font-weight: 700;
      text-shadow: 0 0 15px rgba(255,68,68,0.4);
    }
    #respawn-button {
      margin-top: 20px;
      padding: 12px 30px;
      background: #ff4444;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    #respawn-button:hover {
      background: #ff5a5a;
      transform: scale(1.04);
    }

    /* 顶部 HUD */
    #hud-top {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 10px 16px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }
    .shape-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      transition: 0.2s;
    }
    .shape-dot.active {
      background: #4a90e2;
      box-shadow: 0 0 10px #4a90e2;
    }

    /* 底部提示 */
    #hud-bottom {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 10px 20px;
      font-size: 13px;
      color: #ddd;
      z-index: 10;
      white-space: nowrap;
    }
    .key {
      display: inline-block;
      background: rgba(255,255,255,0.12);
      padding: 2px 8px;
      border-radius: 6px;
      margin: 0 3px;
      font-weight: 600;
    }

    /* 统计 */
    #stats {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12px;
      color: #ccc;
      z-index: 10;
    }

    /* 作弊面板 */
    #cheat-panel {
      position: fixed;
      top: 70px;
      right: 20px;
      width: 280px;
      background: rgba(18,24,32,0.92);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 18px;
      display: none;
      z-index: 100;
      border: 1px solid rgba(255,255,255,0.08);
    }
    #cheat-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .cheat-row {
      margin: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cheat-label { font-size:13px; color:#ddd; }
    .cheat-button {
      padding:6px 12px; background:rgba(255,255,255,0.1);
      border:none; border-radius:8px; color:#fff; cursor:pointer;
    }
    .cheat-button:hover { background:rgba(255,255,255,0.18); }
    .cheat-input {
      width:100px; padding:6px 10px; background:rgba(0,0,0,0.3);
      border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:#fff; outline:none;
    }
    .cheat-toggle {
      width:36px; height:20px; background:rgba(255,255,255,0.1);
      border-radius:20px; position:relative; cursor:pointer; transition:0.2s;
    }
    .cheat-toggle::after {
      content:''; position:absolute; width:16px; height:16px;
      background:#fff; border-radius:50%; top:2px; left:2px; transition:0.2s;
    }
    .cheat-toggle.active { background:#4a90e2; }
    .cheat-toggle.active::after { left:18px; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- 开始界面 -->
  <div id="start-overlay">
    <button id="start-button">开始游戏</button>
    <div id="start-info">
      WASD 移动 | 鼠标视角 | 左键放置 | 右键删除<br>
      1-5 切换形状 | R 换色 | ~ 打开作弊面板
    </div>
  </div>

  <!-- 死亡界面 -->
  <div id="death-overlay">
    <div id="death-text">你已死亡</div>
    <button id="respawn-button">重生</button>
  </div>

  <!-- HUD -->
  <div id="hud-top">
    <div class="shape-dot active" data-shape="0"></div>
    <div class="shape-dot" data-shape="1"></div>
    <div class="shape-dot" data-shape="2"></div>
    <div class="shape-dot" data-shape="3"></div>
    <div class="shape-dot" data-shape="4"></div>
  </div>
  <div id="hud-bottom">
    <span class="key">左键</span>放置 <span class="key">右键</span>删除 <span class="key">滚轮</span>形状 <span class="key">R</span>颜色
  </div>

  <!-- 统计 -->
  <div id="stats">物体：0 | FPS：--</div>

  <!-- 作弊面板 -->
  <div id="cheat-panel">
    <div id="cheat-title">作弊面板 (~ 开关)</div>
    <div class="cheat-row"><span class="cheat-label">飞行模式</span><div class="cheat-toggle" id="toggle-fly"></div></div>
    <div class="cheat-row"><span class="cheat-label">上帝模式</span><div class="cheat-toggle" id="toggle-god"></div></div>
    <div class="cheat-row"><span class="cheat-label">清空物体</span><button class="cheat-button" id="btn-clear">清空</button></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    // 这里放你原来的游戏 JS 逻辑即可
    console.log("UI 加载完成");
  </script>
</body>
</html>
