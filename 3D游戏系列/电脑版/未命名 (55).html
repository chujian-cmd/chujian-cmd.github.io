<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>3D沙盒 - 左右键修复版</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { overflow:hidden; background:#000; }
canvas { display:block; }
#tip {
  position:fixed; left:50%; top:20px; transform:translateX(-50%);
  color:#fff; background:rgba(0,0,0,0.6);
  padding:8px 16px; border-radius:8px;
  z-index:10;
}
</style>
</head>
<body>
<div id="tip">点击画面锁定鼠标 | 左键放置 | 右键删除 | WASD移动 | 空格跳</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 物理世界
const world = new CANNON.World();
world.gravity.set(0, -9.82, 0);

// 地面
const groundMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: '#555' })
);
groundMesh.rotation.x = -Math.PI / 2;
groundMesh.receiveShadow = true;
scene.add(groundMesh);

const groundBody = new CANNON.Body({ mass: 0 });
groundBody.addShape(new CANNON.Box(new CANNON.Vec3(100, 0.5, 100)));
groundBody.position.y = -0.5;
world.addBody(groundBody);

// 灯光
const light = new THREE.DirectionalLight('#fff', 1);
light.position.set(50, 100, 50);
scene.add(light);
scene.add(new THREE.AmbientLight('#fff', 0.3));

camera.position.set(0, 5, 10);

let locked = false;
const meshes = [];
const bodies = [];
const raycaster = new THREE.Raycaster();

// ==== 鼠标锁定 ====
renderer.domElement.addEventListener('click', () => {
  if (!locked) renderer.domElement.requestPointerLock();
});
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === renderer.domElement;
});

// ==== 核心：左键放、右键删（最简最稳）====
document.addEventListener('mousedown', e => {
  if (!locked) return;

  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  const intersects = raycaster.intersectObjects(scene.children, true);

  // 左键：放方块
  if (e.button === 0) {
    const pos = intersects.length
      ? intersects[0].point.clone().add(intersects[0].face.normal.clone().multiplyScalar(0.5))
      : camera.position.clone().add(camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(5));

    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: '#ff6b6b' })
    );
    mesh.position.copy(pos);
    mesh.castShadow = true;
    scene.add(mesh);
    meshes.push(mesh);

    const body = new CANNON.Body({ mass: 1 });
    body.addShape(new CANNON.Box(new CANNON.Vec3(0.5, 0.5, 0.5)));
    body.position.copy(pos);
    world.addBody(body);
    bodies.push(body);
  }

  // 右键：删方块
  if (e.button === 2 && intersects.length) {
    const obj = intersects[0].object;
    const idx = meshes.indexOf(obj);
    if (idx !== -1) {
      scene.remove(obj);
      world.removeBody(bodies[idx]);
      meshes.splice(idx, 1);
      bodies.splice(idx, 1);
    }
  }
});

// 禁止右键菜单
document.addEventListener('contextmenu', e => e.preventDefault());

// 简单移动
const keys = {};
document.addEventListener('keydown', e => keys[e.code] = true);
document.addEventListener('keyup', e => keys[e.code] = false);

// 动画
function animate() {
  requestAnimationFrame(animate);
  world.step(1/60);

  // 同步物理
  meshes.forEach((m, i) => m.position.copy(bodies[i].position));

  // 移动
  if (locked) {
    const speed = 0.2;
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    dir.y = 0;
    dir.normalize();
    const right = new THREE.Vector3().crossVectors(camera.up, dir).normalize();

    if (keys['KeyW']) camera.position.add(dir.clone().multiplyScalar(speed));
    if (keys['KeyS']) camera.position.add(dir.clone().multiplyScalar(-speed));
    if (keys['KeyA']) camera.position.add(right.clone().multiplyScalar(speed));
    if (keys['KeyD']) camera.position.add(right.clone().multiplyScalar(-speed));
    if (keys['Space']) camera.position.y += speed;
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
