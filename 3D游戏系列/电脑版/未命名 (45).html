<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>3D物理沙盒 1-41循环启动器【终极正确版】</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#111;color:#fff;font-family:system-ui}
.top{background:#222;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{padding:8px 12px;min-width:260px;background:#333;color:white;border:none;border-radius:6px}
button{padding:8px 14px;color:white;border:none;border-radius:6px;cursor:pointer}
.btn-refresh{background:#444}
.btn-full{background:#099}
.btn-next{background:#28a745}
iframe{width:100%;height:calc(100% - 52px);border:none}
</style>
</head>
<body>

<div class="top">
  <select id="fileList">
    <option value="">选择文件</option>
  </select>
  <button class="btn-refresh" onclick="refreshIframe()">🔁 刷新</button>
  <button class="btn-full" onclick="toggleFull()">🔲 全屏(/键)</button>
  <button class="btn-next" onclick="nextFile()">▶ 下一个（循环）</button>
</div>

<iframe id="iframe" sandbox="allow-same-origin allow-scripts allow-pointer-lock allow-fullscreen allow-forms"></iframe>

<script>
const iframe = document.getElementById('iframe');
const list = document.getElementById('fileList');
const base = 'file:///C:/Users/Administrator/Desktop/新建文件夹%20(2)/';

list.innerHTML = '<option value="">选择文件</option>';

// 正确文件列表
let files = [
"作品.html",
"新建文本文档0.html",
"未命名.html",
"未命名1.html"
];

for(let f of files) list.innerHTML += `<option value="${f}">${f}</option>`;

// 生成 1~41
for(let i=1;i<=41;i++){
  let f = `未命名 (${i}).html`;
  let txt = i==26 ? `${f}【最终版本】` : f;
  list.innerHTML += `<option value="${f}">${txt}</option>`;
}

// web1系列
list.innerHTML += `<option value="web1.html">web1.html</option>`;
for(let i=1;i<=10;i++) list.innerHTML += `<option value="web1 (${i}).html">web1 (${i}).html</option>`;

// 切换加载
list.addEventListener('change',()=>{
  let n = list.value;
  if(!n){iframe.src='';return}
  iframe.src = base + encodeURIComponent(n);
});

// 下一个
function nextFile(){
  let i = list.selectedIndex+1;
  if(i>=list.options.length) i=1;
  list.selectedIndex = i;
  list.dispatchEvent(new Event('change'));
}

// 上一个
function prevFile(){
  let i = list.selectedIndex-1;
  if(i<1) i = list.options.length-1;
  list.selectedIndex = i;
  list.dispatchEvent(new Event('change'));
}

// 刷新
function refreshIframe(){
  if(!iframe.src)return;
  let t=iframe.src;iframe.src='';
  setTimeout(()=>iframe.src=t,20);
}

// 全屏
function toggleFull(){
  document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(e=>{});
}

// 🔥 快捷键：左右箭头切版本 / 键全屏
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight') nextFile();
  if(e.key === 'ArrowLeft') prevFile();
  if(e.key === '/') { e.preventDefault(); toggleFull(); }
});
</script>

</body>
</html>
