<!DOCTYPE html>
<html lang="zh-CN">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>3D启动器【存档版】</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#111;color:#fff}
.top{background:#222;padding:10px;display:flex;gap:8px;align-items:center}
select{padding:8px 12px;min-width:260px;background:#333;color:white;border:none;border-radius:6px}
button{padding:8px 14px;color:white;border:none;border-radius:6px;cursor:pointer}
.btn-refresh{background:#444}
.btn-full{background:#099}
.btn-next{background:#28a745}
iframe{width:100%;height:calc(100% - 52px);border:none}
</style>

<div class="top">
  <select id="fileList"></select>
  <button class="btn-refresh" onclick="refreshIframe()">🔁刷新</button>
  <button class="btn-full" onclick="toggleFull()">🔲全屏(/)</button>
  <button class="btn-next" onclick="nextFile()">▶下一个</button>
</div>

<iframe id="iframe" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-fullscreen"></iframe>

<script>
const i = document.getElementById('iframe');
const list = document.getElementById('fileList');
const base = 'file:///C:/Users/Administrator/Desktop/新建文件夹%20(2)/';

// 自动生成文件列表
list.innerHTML = '<option value="">选择文件</option>';
["作品.html","新建文本文档0.html","未命名.html","未命名1.html"].forEach(f=>{
  list.innerHTML += `<option value="${f}">${f}</option>`;
});
for(let n=1;n<=41;n++){let f=`未命名 (${n}).html`;list.innerHTML+=`<option value="${f}"${n==26?' selected':''}>${f}${n==26?'【最终版本】':''}</option>`;}
list.innerHTML+=`<option value="web1.html">web1.html</option>`;
for(let n=1;n<=10;n++)list.innerHTML+=`<option value="web1 (${n}).html">web1 (${n}).html</option>`;

// 切换加载
list.addEventListener('change',()=>{
  const v=list.value;if(!v){i.src='';return;}
  i.src=base+encodeURIComponent(v);
  localStorage.setItem('lastFile',v); // ✅ 自动存档
});

// 上下切换
function nextFile(){let x=list.selectedIndex+1;if(x>=list.options.length)x=1;list.selectedIndex=x;list.dispatchEvent(new Event('change'));}
function prevFile(){let x=list.selectedIndex-1;if(x<1)x=list.options.length-1;list.selectedIndex=x;list.dispatchEvent(new Event('change'));}

// 功能
function refreshIframe(){if(!i.src)return;const t=i.src;i.src='';setTimeout(()=>i.src=t,20);}
function toggleFull(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});}

// 快捷键
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')nextFile();
  if(e.key==='ArrowLeft')prevFile();
  if(e.key==='/'){e.preventDefault();toggleFull();}
});

// ✅ 启动自动读档（核心！）
window.onload=()=>{
  const last=localStorage.getItem('lastFile');
  if(last){for(let o=0;o<list.options.length;o++){if(list.options[o].value===last){list.selectedIndex=o;list.dispatchEvent(new Event('change'));break;}}}
};
</script>
</body>
</html>
