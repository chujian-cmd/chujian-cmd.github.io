<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D 物理沙盒 · 终极增强版</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --text: #e0e0e0;
      --accent: #ff6b6b;
      --panel-bg: rgba(18, 18, 32, 0.9);
      --border: rgba(255, 255, 255, 0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      overflow: hidden;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      display: block;
    }

    /* 开始界面 - 完全覆盖 */
    #start-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      transition: opacity 0.5s;
    }

    #start-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #start-box {
      background: var(--panel-bg);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 36px 48px;
      text-align: center;
      color: #fff;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
      animation: floatBox 3s ease-in-out infinite;
      transition: transform 0.2s;
      pointer-events: auto;
    }

    #start-box:hover {
      transform: scale(1.03);
      border-color: #ff6b6b;
    }

    #start-box:active {
      transform: scale(0.97);
    }

    @keyframes floatBox {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    #start-box .icon {
      font-size: 64px;
      display: block;
      margin-bottom: 16px;
    }

    #start-box h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: 0.03em;
    }

    #start-box .subtitle {
      font-size: 1rem;
      color: #ff6b6b;
      font-weight: 600;
      margin-bottom: 16px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    #start-box p {
      font-size: 0.85rem;
      color: #bbb;
      margin: 4px 0;
      line-height: 1.6;
    }

    #start-box .key-row {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .key-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #fff;
    }

    /* HUD */
    .hud {
      position: fixed;
      z-index: 20;
      pointer-events: none;
      color: #f0f0f0;
      font-weight: 500;
      letter-spacing: 0.03em;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 10px 22px;
      transition: opacity 0.3s;
      opacity: 0;
    }

    .hud.visible {
      opacity: 1;
    }

    #hud-top {
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
    }

    #hud-bottom {
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.74rem;
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .shape-dot {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      display: inline-block;
      border: 2px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 10px currentColor;
    }

    .shape-dot.sphere,
    .shape-dot.cone,
    .shape-dot.torus {
      border-radius: 50%;
    }

    .key {
      display: inline-block;
      background: rgba(255, 255, 255, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 0.68rem;
      font-weight: 700;
      color: #fff;
      margin: 0 1px;
    }

    #color-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.6);
      display: inline-block;
      vertical-align: middle;
    }

    /* 死亡覆盖 */
    #death-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
      backdrop-filter: blur(8px);
    }

    #death-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    #death-box {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 30px 44px;
      text-align: center;
      color: #fff;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
    }

    #death-box h2 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #ff6b6b;
    }

    #death-box button {
      background: #ff6b6b;
      border: none;
      color: white;
      font-weight: bold;
      padding: 12px 30px;
      border-radius: 30px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 12px;
    }

    #death-box button:hover {
      background: #ff8787;
      transform: scale(1.05);
    }

    /* 统计 */
    #stats {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 30;
      color: #fff;
      font-size: 0.7rem;
      font-family: 'Courier New', monospace;
      background: rgba(0, 0, 0, 0.55);
      padding: 6px 14px;
      border-radius: 16px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }

    #stats.visible {
      opacity: 1;
    }

    /* 作弊面板 */
    #cheat-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 500;
      width: 270px;
      background: #0a0f0a;
      border: 1px solid #0f0;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
      font-family: 'Courier New', monospace;
      color: #0f0;
      padding: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      max-height: 80vh;
      overflow-y: auto;
    }

    #cheat-panel.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #cheat-panel h3 {
      text-align: center;
      border-bottom: 1px dashed #0f0;
      padding-bottom: 6px;
      margin-bottom: 10px;
      font-size: 1rem;
      text-shadow: 0 0 10px #0f0;
    }

    .cheat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
      font-size: 0.72rem;
    }

    .cheat-row label {
      text-shadow: 0 0 4px #0f0;
    }

    .cheat-row input[type="checkbox"] {
      accent-color: #0f0;
      width: 15px;
      height: 15px;
    }

    .cheat-row input[type="range"] {
      width: 90px;
      accent-color: #0f0;
    }

    .cheat-row input[type="number"] {
      width: 55px;
      background: #111;
      border: 1px solid #0f0;
      color: #0f0;
      text-align: center;
      font-family: inherit;
    }

    .cheat-btn {
      display: block;
      width: 100%;
      margin-top: 8px;
      background: #0a0f0a;
      border: 1px solid #0f0;
      color: #0f0;
      font-family: inherit;
      font-weight: bold;
      padding: 5px 0;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .cheat-btn:hover {
      background: #0f0;
      color: #000;
      box-shadow: 0 0 20px #0f0;
    }

    .cheat-divider {
      border-top: 1px dashed #0f0;
      margin: 10px 0 7px;
    }

    #cheat-script-input {
      width: 100%;
      background: #111;
      border: 1px solid #0f0;
      color: #0f0;
      font-family: 'Courier New', monospace;
      font-size: 0.7rem;
      padding: 4px;
      resize: vertical;
      margin-top: 4px;
      min-height: 50px;
    }

    @media (max-width: 650px) {
      #start-box {
        padding: 24px 20px;
      }
      #start-box h1 {
        font-size: 1.3rem;
      }
      #cheat-panel {
        width: 230px;
        top: 8px;
        right: 8px;
      }
    }
  </style>
</head>
<body>
  <!-- 开始覆盖层 -->
  <div id="start-overlay">
    <div id="start-box">
      <span class="icon">🎮</span>
      <h1>3D 物理沙盒</h1>
      <p class="subtitle">👆 点击此处开始游戏</p>
      <p>WASD 移动 · 空格跳跃 · 鼠标旋转视角</p>
      <p>左键放置物体 · 右键删除物体 · 滚轮切换形状</p>
      <div class="key-row">
        <span class="key-badge">1-5 形状</span>
        <span class="key-badge">R 换色</span>
        <span class="key-badge">G/H/B 力场</span>
        <span class="key-badge">~ 面板</span>
        <span class="key-badge">Ctrl+Z 撤销</span>
      </div>
    </div>
  </div>

  <!-- 统计 -->
  <div id="stats">
    📦 <span id="obj-count">0</span> &nbsp; ⚡ <span id="fps-val">60</span> FPS
  </div>

  <!-- HUD -->
  <div id="hud-top" class="hud">
    <span>形状:</span>
    <span id="shape-dot" class="shape-dot cube" style="background:#ff6b6b;"></span>
    <span id="shape-name">立方体</span>
    <span>| 颜色: <span id="color-dot" style="background:#ff6b6b;"></span></span>
  </div>

  <div id="hud-bottom" class="hud">
    <span><span class="key">1-5</span>形状</span>
    <span><span class="key">R</span>换色</span>
    <span><span class="key">G</span>吸引</span>
    <span><span class="key">H</span>推远</span>
    <span><span class="key">B</span>爆炸</span>
    <span><span class="key">~</span>外挂</span>
  </div>

  <!-- 死亡 -->
  <div id="death-overlay">
    <div id="death-box">
      <h2>💀 你掉出了世界</h2>
      <p>按 R 键或点击按钮重生</p>
      <button id="respawn-btn">🔄 重新开始</button>
    </div>
  </div>

  <!-- 作弊面板 -->
  <div id="cheat-panel">
    <h3>⚡ 外挂面板</h3>
    <div class="cheat-row">
      <label>🕊️ 飞行模式</label>
      <input type="checkbox" id="cheat-fly">
    </div>
    <div class="cheat-row">
      <label>👑 上帝模式</label>
      <input type="checkbox" id="cheat-god">
    </div>
    <div class="cheat-row">
      <label>🎯 无限距离</label>
      <input type="checkbox" id="cheat-range">
    </div>
    <div class="cheat-row">
      <label>⚡ 自动放置</label>
      <input type="checkbox" id="cheat-auto">
    </div>
    <div class="cheat-divider"></div>
    <div class="cheat-row">
      <label>重力</label>
      <input type="range" id="cheat-gravity" min="-20" max="0" value="-12" step="0.5">
    </div>
    <div class="cheat-row">
      <label>速度</label>
      <input type="range" id="cheat-speed" min="2" max="30" value="8" step="0.5">
    </div>
    <div class="cheat-row">
      <label>跳跃</label>
      <input type="range" id="cheat-jump" min="2" max="20" value="8" step="0.5">
    </div>
    <div class="cheat-row">
      <label>冲击力</label>
      <input type="range" id="cheat-force" min="500" max="5000" value="1500" step="100">
    </div>
    <div class="cheat-divider"></div>
    <div class="cheat-row">
      <label>批量</label>
      <input type="number" id="cheat-batch" value="100" min="1" max="5000">
    </div>
    <button class="cheat-btn" id="btn-spawn-batch">💣 批量生成</button>
    <button class="cheat-btn" id="btn-clear">🗑️ 清空世界</button>
    <button class="cheat-btn" id="btn-random-color">🎨 随机颜色</button>
    <div class="cheat-divider"></div>
    <label style="font-size:0.7rem;">📜 脚本 (Enter执行)</label>
    <textarea id="cheat-script-input" placeholder="// setGravity(-2); spawnSphere(0,5,0);">// 输入JS代码</textarea>
    <button class="cheat-btn" id="btn-exec-script">▶️ 执行脚本</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.mjs"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import * as CANNON from 'cannon-es';

    // ==================== DOM 元素 ====================
    const startOverlay = document.getElementById('start-overlay');
    const startBox = document.getElementById('start-box');
    const hudTop = document.getElementById('hud-top');
    const hudBottom = document.getElementById('hud-bottom');
    const shapeDot = document.getElementById('shape-dot');
    const shapeNameEl = document.getElementById('shape-name');
    const colorDot = document.getElementById('color-dot');
    const deathOverlay = document.getElementById('death-overlay');
    const respawnBtn = document.getElementById('respawn-btn');
    const cheatPanel = document.getElementById('cheat-panel');
    const stats = document.getElementById('stats');
    const objCountSpan = document.getElementById('obj-count');
    const fpsSpan = document.getElementById('fps-val');

    // ==================== 场景 ====================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#87CEEB');
    scene.fog = new THREE.Fog('#87CEEB', 45, 130);

    const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 1.6, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    // ==================== 光照 ====================
    scene.add(new THREE.AmbientLight('#bcd4f0', 0.8));
    scene.add(new THREE.HemisphereLight('#87CEEB', '#8B7355', 0.5));
    const sun = new THREE.DirectionalLight('#fff8e7', 4.5);
    sun.position.set(20, 30, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 1024;
    sun.shadow.mapSize.height = 1024;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 100;
    sun.shadow.camera.left = -30;
    sun.shadow.camera.right = 30;
    sun.shadow.camera.top = 30;
    sun.shadow.camera.bottom = -30;
    scene.add(sun);

    // ==================== 几何体 ====================
    const sharedGeos = {
      cube: new THREE.BoxGeometry(0.95, 0.95, 0.95),
      sphere: new THREE.SphereGeometry(0.48, 20, 20),
      cylinder: new THREE.CylinderGeometry(0.48, 0.48, 0.95, 20),
      cone: new THREE.ConeGeometry(0.48, 0.95, 20),
      torus: new THREE.TorusGeometry(0.4, 0.18, 10, 20),
    };

    // 地面
    const groundMesh = new THREE.Mesh(
      new THREE.BoxGeometry(36, 0.4, 36),
      new THREE.MeshStandardMaterial({ color: '#d5c4a1', roughness: 0.75 })
    );
    groundMesh.position.y = -0.2;
    groundMesh.receiveShadow = true;
    groundMesh.name = 'ground';
    scene.add(groundMesh);

    scene.add(new THREE.GridHelper(36, 36, '#c4b99a', '#e0d5c0'));

    // ==================== 物理世界 ====================
    const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -12, 0) });
    world.broadphase = new CANNON.SAPBroadphase(world);
    world.allowSleep = true;
    world.solver.iterations = 8;

    const objMat = new CANNON.Material('obj');
    const playerMat = new CANNON.Material('player');
    world.addContactMaterial(new CANNON.ContactMaterial(playerMat, objMat, { friction: 0.05, restitution: 0 }));

    // 物理地面
    world.addBody(new CANNON.Body({
      mass: 0,
      shape: new CANNON.Box(new CANNON.Vec3(18, 0.2, 18)),
      material: objMat,
      position: new CANNON.Vec3(0, -0.2, 0),
    }));

    // 围墙
    [
      [18, 1.5, 0.25, 0, 1.5, -18.25],
      [18, 1.5, 0.25, 0, 1.5, 18.25],
      [0.25, 1.5, 18, -18.25, 1.5, 0],
      [0.25, 1.5, 18, 18.25, 1.5, 0],
    ].forEach(([hx, hy, hz, px, py, pz]) => {
      world.addBody(new CANNON.Body({
        mass: 0,
        shape: new CANNON.Box(new CANNON.Vec3(hx, hy, hz)),
        material: objMat,
        position: new CANNON.Vec3(px, py, pz),
      }));
    });

    // ==================== 形状和颜色 ====================
    const shapeTypes = ['cube', 'sphere', 'cylinder', 'cone', 'torus'];
    const shapeNames = ['立方体', '球体', '圆柱体', '圆锥', '圆环'];
    let shapeIndex = 0;

    const colors = [
      '#ff6b6b', '#ff9f43', '#feca57', '#54a0ff', '#5f27cd',
      '#00d2d3', '#55efc4', '#fd79a8', '#ffffff', '#e056a0',
    ];
    let colorIndex = 0;

    const getType = () => shapeTypes[shapeIndex];
    const getColor = () => colors[colorIndex];

    function updateHUD() {
      shapeDot.style.background = getColor();
      shapeDot.className = 'shape-dot ' + getType();
      shapeNameEl.textContent = shapeNames[shapeIndex];
      colorDot.style.background = getColor();
      colorDot.style.boxShadow = `0 0 14px ${getColor()}`;
    }
    updateHUD();

    // ==================== 物体管理 ====================
    const placedShapes = [];
    const allPlaceables = [groundMesh];
    const undoStack = [];

    function createBodyShape(type) {
      switch (type) {
        case 'cube':
          return new CANNON.Box(new CANNON.Vec3(0.475, 0.475, 0.475));
        case 'sphere':
          return new CANNON.Sphere(0.48);
        case 'cylinder':
          return new CANNON.Cylinder(0.48, 0.48, 0.95, 12);
        case 'cone':
          return new CANNON.Cylinder(0.01, 0.48, 0.95, 12);
        case 'torus':
          return new CANNON.Sphere(0.42);
        default:
          return new CANNON.Box(new CANNON.Vec3(0.475, 0.475, 0.475));
      }
    }

    function createPlacedShape(type, color, pos, skipAnim = false) {
      const geo = sharedGeos[type] || sharedGeos.cube;
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.05 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(pos);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.name = 'placed-shape';

      const body = new CANNON.Body({
        mass: 2,
        shape: createBodyShape(type),
        material: objMat,
        sleepSpeedLimit: 0.2,
        sleepTimeLimit: 1,
        linearDamping: 0.1,
        angularDamping: 0.3,
      });
      body.position.copy(pos);
      body.sleep();

      mesh.userData.body = body;
      body.userData = { mesh };

      scene.add(mesh);
      world.addBody(body);

      const entry = { mesh, body };
      placedShapes.push(entry);
      allPlaceables.push(mesh);

      if (!skipAnim) {
        mesh.scale.set(0.01, 0.01, 0.01);
        const t0 = performance.now();
        function anim(now) {
          const t = Math.min((now - t0) / 180, 1);
          mesh.scale.setScalar(1 - Math.pow(1 - t, 3) + Math.sin(t * Math.PI) * 0.1 * (1 - t));
          if (t < 1) requestAnimationFrame(anim);
          else mesh.scale.setScalar(1);
        }
        requestAnimationFrame(anim);
      }

      return entry;
    }

    function removeEntry(entry) {
      if (!entry) return;
      world.removeBody(entry.body);
      scene.remove(entry.mesh);
      const i = placedShapes.indexOf(entry);
      if (i !== -1) placedShapes.splice(i, 1);
      const j = allPlaceables.indexOf(entry.mesh);
      if (j !== -1) allPlaceables.splice(j, 1);
      if (entry.mesh.material) entry.mesh.material.dispose();
    }

    // 初始场景
    [
      ['cube', 3, 0.5, -2, '#ff6b6b'],
      ['cube', 3, 1.5, -2, '#ff9f43'],
      ['sphere', -3, 0.5, 1, '#4ecdc4'],
      ['cylinder', 0, 0.5, -4, '#ffe66d'],
      ['cube', -1, 0.5, -3, '#a29bfe'],
      ['sphere', 5, 0.5, 3, '#55efc4'],
    ].forEach(([t, x, y, z, c]) => {
      createPlacedShape(t, c, new THREE.Vector3(x, y, z), true);
    });

    // ==================== 预览 ====================
    const previewMat = new THREE.MeshStandardMaterial({
      color: getColor(),
      roughness: 0.3,
      transparent: true,
      opacity: 0.35,
      depthWrite: false,
    });
    const previewMesh = new THREE.Mesh(sharedGeos.cube, previewMat);
    previewMesh.visible = false;
    previewMesh.renderOrder = 999;
    previewMesh.name = 'preview';
    scene.add(previewMesh);

    function refreshPreview() {
      previewMesh.geometry = sharedGeos[getType()] || sharedGeos.cube;
      previewMat.color.set(getColor());
    }
    refreshPreview();

    // ==================== 射线 ====================
    const raycaster = new THREE.Raycaster();
    raycaster.far = 30;

    function getPlacement() {
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const hits = raycaster.intersectObjects(allPlaceables, false);
      if (hits.length > 0) {
        const p = hits[0].point.clone();
        const n = hits[0].face.normal.clone().transformDirection(hits[0].object.matrixWorld);
        const pos = p.add(n.multiplyScalar(0.475));
        pos.x = THREE.MathUtils.clamp(pos.x, -17.5, 17.5);
        pos.z = THREE.MathUtils.clamp(pos.z, -17.5, 17.5);
        pos.y = Math.max(pos.y, 0.05);
        return { pos, valid: true };
      }
      return { pos: null, valid: false };
    }

    // ==================== 玩家 ====================
    const playerHeight = 1.6;
    const playerHalf = playerHeight / 2;
    const spawn = new THREE.Vector3(0, playerHalf, 8);

    const playerBody = new CANNON.Body({
      mass: 80,
      shape: new CANNON.Box(new CANNON.Vec3(0.35, playerHalf, 0.35)),
      material: playerMat,
      fixedRotation: true,
      linearDamping: 0.5,
    });
    playerBody.position.copy(spawn);
    world.addBody(playerBody);

    let groundContacts = 0;
    world.addEventListener('beginContact', (e) => {
      if ((e.bodyA === playerBody || e.bodyB === playerBody) && e.contact?.ni?.y > 0.4) groundContacts++;
    });
    world.addEventListener('endContact', (e) => {
      if ((e.bodyA === playerBody || e.bodyB === playerBody) && e.contact?.ni?.y > 0.4) groundContacts = Math.max(0,
        groundContacts - 1);
    });

    function isOnGround() {
      return cheatFly || groundContacts > 0;
    }

    // ==================== 游戏状态 ====================
    let isLocked = false;
    let isDead = false;
    let panelVisible = false;

    let cheatFly = false;
    let cheatGod = false;
    let cheatRange = false;
    let cheatAuto = false;
    let moveSpeed = 8;
    let jumpForce = 8;
    let forceStrength = 1500;

    const keys = {};

    function enableFly() {
      playerBody.type = CANNON.Body.KINEMATIC;
      playerBody.velocity.set(0, 0, 0);
    }

    function disableFly() {
      playerBody.type = CANNON.Body.DYNAMIC;
      playerBody.velocity.set(0, 0, 0);
    }

    function resetPlayer() {
      playerBody.position.copy(spawn);
      playerBody.velocity.set(0, 0, 0);
      playerBody.type = cheatFly ? CANNON.Body.KINEMATIC : CANNON.Body.DYNAMIC;
      groundContacts = 0;
      camera.position.set(spawn.x, spawn.y + playerHalf, spawn.z);
    }

    function die() {
      if (isDead || cheatGod) return;
      isDead = true;
      document.exitPointerLock();
      deathOverlay.classList.add('active');
      startOverlay.classList.add('hidden');
    }

    function respawn() {
      isDead = false;
      deathOverlay.classList.remove('active');
      resetPlayer();
      // 重新锁定
      renderer.domElement.requestPointerLock();
    }

    // ==================== 指针锁定（核心修复） ====================
    function onPointerLockChange() {
      if (document.pointerLockElement === renderer.domElement) {
        // 锁定成功
        isLocked = true;
        startOverlay.classList.add('hidden');
        hudTop.classList.add('visible');
        hudBottom.classList.add('visible');
        stats.classList.add('visible');
        previewMesh.visible = true;
        if (cheatFly) enableFly();
        console.log('✅ 指针已锁定');
      } else {
        // 解锁
        isLocked = false;
        if (!isDead) {
          startOverlay.classList.remove('hidden');
        }
        hudTop.classList.remove('visible');
        hudBottom.classList.remove('visible');
        stats.classList.remove('visible');
        previewMesh.visible = false;
        if (cheatFly) disableFly();
        console.log('🔓 指针已解锁');
      }
    }

    document.addEventListener('pointerlockchange', onPointerLockChange);

    // 点击开始按钮
    startBox.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!isLocked && !isDead) {
        console.log('🖱️ 请求锁定指针...');
        renderer.domElement.requestPointerLock();
      }
    });

    // 点击画布也可以锁定
    renderer.domElement.addEventListener('click', () => {
      if (!isLocked && !isDead && !startOverlay.classList.contains('hidden')) {
        renderer.domElement.requestPointerLock();
      }
    });

    // ==================== 输入 ====================
    document.addEventListener('keydown', (e) => {
      keys[e.code] = true;

      if (e.code === 'Digit1') { shapeIndex = 0;
        updateHUD();
        refreshPreview(); }
      if (e.code === 'Digit2') { shapeIndex = 1;
        updateHUD();
        refreshPreview(); }
      if (e.code === 'Digit3') { shapeIndex = 2;
        updateHUD();
        refreshPreview(); }
      if (e.code === 'Digit4') { shapeIndex = 3;
        updateHUD();
        refreshPreview(); }
      if (e.code === 'Digit5') { shapeIndex = 4;
        updateHUD();
        refreshPreview(); }
      if (e.code === 'KeyR' && !e.ctrlKey && !e.metaKey) {
        if (isDead) { respawn(); return; }
        colorIndex = (colorIndex + 1) % colors.length;
        updateHUD();
        refreshPreview();
      }
      if (e.code === 'Space' && isLocked && !isDead && isOnGround()) {
        e.preventDefault();
        if (!cheatFly) {
          playerBody.velocity.y = jumpForce;
          groundContacts = 0;
        }
      }
      if (e.code === 'Backquote') {
        e.preventDefault();
        panelVisible = !panelVisible;
        cheatPanel.classList.toggle('visible', panelVisible);
      }
      if (e.code === 'Enter' && panelVisible) {
        e.preventDefault();
        execScript();
      }
      if (e.code === 'KeyZ' && (e.ctrlKey || e.metaKey) && isLocked && !isDead) {
        e.preventDefault();
        if (undoStack.length > 0) {
          undoStack.pop()?.entries?.forEach(removeEntry);
        }
      }
    });

    document.addEventListener('keyup', (e) => { keys[e.code] = false; });

    document.addEventListener('wheel', (e) => {
      if (!isLocked || isDead) return;
      e.preventDefault();
      shapeIndex = (shapeIndex + (e.deltaY > 0 ? 1 : -1) + shapeTypes.length) % shapeTypes.length;
      updateHUD();
      refreshPreview();
    }, { passive: false });

    // 放置
    document.addEventListener('mousedown', (e) => {
      if (!isLocked || isDead) return;
      if (e.button === 0) {
        const info = getPlacement();
        if (info.valid && info.pos && (cheatRange || info.pos.distanceTo(camera.position) >= 0.9)) {
          const entry = createPlacedShape(getType(), getColor(), info.pos);
          undoStack.push({ entries: [entry] });
        }
      }
      if (e.button === 2) {
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        const hits = raycaster.intersectObjects(allPlaceables, false);
        if (hits.length > 0 && hits[0].object.name === 'placed-shape') {
          const entry = placedShapes.find(s => s.mesh === hits[0].object);
          if (entry) removeEntry(entry);
        }
      }
    });

    document.addEventListener('contextmenu', e => e.preventDefault());

    // ==================== 力场 ====================
    function applyForce(attract) {
      const pp = playerBody.position;
      placedShapes.forEach(({ body }) => {
        const d = new CANNON.Vec3(body.position.x - pp.x, body.position.y - pp.y, body.position.z - pp.z);
        const dist = d.length();
        if (dist < 8 && dist > 0.3) {
          const s = (1 - dist / 8) * forceStrength;
          body.applyForce(d.unit().scale(s * (attract ? 1 : -1)), body.position);
          body.wakeUp();
        }
      });
    }

    function explode() {
      const pp = playerBody.position;
      placedShapes.forEach(({ body }) => {
        const d = new CANNON.Vec3(body.position.x - pp.x, body.position.y - pp.y, body.position.z - pp.z);
        const dist = d.length();
        if (dist < 10 && dist > 0.3) {
          const s = (1 - dist / 10) * forceStrength * 0.7;
          body.applyImpulse(new CANNON.Vec3(d.x, d.y + 0.5, d.z).unit().scale(s), body.position);
          body.wakeUp();
        }
      });
    }

    // ==================== 脚本 ====================
    function execScript() {
      const code = document.getElementById('cheat-script-input').value;
      if (!code.trim()) return;
      try {
        const ctx = {
          world,
          scene,
          camera,
          playerBody,
          placedShapes,
          createPlacedShape,
          removeEntry,
          getColor,
          getType,
          setGravity: v => { world.gravity.set(0, v, 0);
            document.getElementById('cheat-gravity').value = v; },
          setSpeed: v => { moveSpeed = v;
            document.getElementById('cheat-speed').value = v; },
          spawnSphere: (x, y, z, c) => createPlacedShape('sphere', c || getColor(), new THREE.Vector3(x, y, z)),
          clearAll: () => { while (placedShapes.length) removeEntry(placedShapes[0]);
            undoStack.length = 0; },
          log: msg => console.log('[脚本]', msg),
        };
        new Function(...Object.keys(ctx), code)(...Object.values(ctx));
        console.log('✅ 脚本执行成功');
      } catch (err) {
        console.error('❌ 脚本错误:', err);
      }
    }

    // ==================== 外挂绑定 ====================
    document.getElementById('cheat-fly').addEventListener('change', e => {
      cheatFly = e.target.checked;
      if (isLocked) cheatFly ? enableFly() : disableFly();
    });
    document.getElementById('cheat-god').addEventListener('change', e => { cheatGod = e.target.checked; });
    document.getElementById('cheat-range').addEventListener('change', e => { cheatRange = e.target.checked; });
    document.getElementById('cheat-auto').addEventListener('change', e => { cheatAuto = e.target.checked; });
    document.getElementById('cheat-gravity').addEventListener('input', e => {
      world.gravity.set(0, parseFloat(e.target.value), 0);
    });
    document.getElementById('cheat-speed').addEventListener('input', e => { moveSpeed = parseFloat(e.target.value); });
    document.getElementById('cheat-jump').addEventListener('input', e => { jumpForce = parseFloat(e.target.value); });
    document.getElementById('cheat-force').addEventListener('input', e => { forceStrength = parseFloat(e.target
        .value); });

    document.getElementById('btn-spawn-batch').addEventListener('click', () => {
      const n = Math.min(parseInt(document.getElementById('cheat-batch').value) || 100, 5000);
      const t = getType();
      const c = getColor();
      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);
      const base = camera.position.clone().add(dir.multiplyScalar(3));
      const batch = [];
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + Math.random() * 0.3;
        const r = 1.5 + Math.random() * 3.5;
        batch.push(createPlacedShape(t, c, new THREE.Vector3(base.x + Math.cos(a) * r, base.y + Math.random() * 2.5,
          base.z + Math.sin(a) * r), true));
      }
      undoStack.push({ entries: batch });
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      while (placedShapes.length) removeEntry(placedShapes[0]);
      undoStack.length = 0;
    });

    document.getElementById('btn-random-color').addEventListener('click', () => {
      colorIndex = Math.floor(Math.random() * colors.length);
      updateHUD();
      refreshPreview();
    });

    document.getElementById('btn-exec-script').addEventListener('click', execScript);
    respawnBtn.addEventListener('click', respawn);

    // ==================== 游戏循环 ====================
    const clock = new THREE.Clock();
    let fpsFrames = 0;
    let fpsTime = performance.now();
    let previewTimer = 0;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.2);

      if (isLocked && !isDead) {
        // 力场
        if (keys['KeyG']) applyForce(true);
        if (keys['KeyH']) applyForce(false);
        if (keys['KeyB']) explode();

        // 自动放置
        if (cheatAuto) {
          if (!keys._autoT) keys._autoT = 0;
          keys._autoT += dt;
          if (keys._autoT > 0.1) {
            keys._autoT = 0;
            const info = getPlacement();
            if (info.valid && info.pos) {
              const entry = createPlacedShape(getType(), getColor(), info.pos);
              undoStack.push({ entries: [entry] });
            }
          }
        }

        // 移动
        if (cheatFly) {
          let f = 0,
            r = 0,
            u = 0;
          if (keys['KeyW']) f++;
          if (keys['KeyS']) f--;
          if (keys['KeyA']) r--;
          if (keys['KeyD']) r++;
          if (keys['Space']) u++;
          if (keys['ShiftLeft'] || keys['ShiftRight']) u--;

          const fwd = new THREE.Vector3();
          camera.getWorldDirection(fwd);
          fwd.y = 0;
          fwd.normalize();
          const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();

          const move = new THREE.Vector3().addScaledVector(fwd, f).addScaledVector(right, r);
          move.y += u;
          if (move.length() > 0.001) {
            move.normalize().multiplyScalar(moveSpeed * dt);
            playerBody.position.x += move.x;
            playerBody.position.y += move.y;
            playerBody.position.z += move.z;
          }
          camera.position.set(playerBody.position.x, playerBody.position.y + playerHalf, playerBody.position.z);
        } else {
          let f = 0,
            r = 0;
          if (keys['KeyW']) f++;
          if (keys['KeyS']) f--;
          if (keys['KeyA']) r--;
          if (keys['KeyD']) r++;

          const fwd = new THREE.Vector3();
          camera.getWorldDirection(fwd);
          fwd.y = 0;
          if (fwd.length() > 0.001) fwd.normalize();
          const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();

          const dir = new THREE.Vector3().addScaledVector(fwd, f).addScaledVector(right, r);
          if (dir.length() > 0.001) {
            dir.normalize();
            playerBody.velocity.x = dir.x * moveSpeed;
            playerBody.velocity.z = dir.z * moveSpeed;
          } else {
            playerBody.velocity.x *= Math.exp(-8 * dt);
            playerBody.velocity.z *= Math.exp(-8 * dt);
          }
          playerBody.position.x = THREE.MathUtils.clamp(playerBody.position.x, -17.5, 17.5);
          playerBody.position.z = THREE.MathUtils.clamp(playerBody.position.z, -17.5, 17.5);
        }

        // 预览
        previewTimer += dt;
        if (previewTimer > 0.05) {
          previewTimer = 0;
          const info = getPlacement();
          if (info.valid && info.pos && (cheatRange || info.pos.distanceTo(camera.position) >= 0.9)) {
            previewMesh.position.copy(info.pos);
            previewMesh.visible = true;
            previewMat.color.set(getColor());
          } else {
            previewMesh.visible = false;
          }
        }
      }

      // 物理
      world.step(1 / 60, dt, 2);

      // 同步
      placedShapes.forEach(({ mesh, body }) => {
        mesh.position.copy(body.position);
        mesh.quaternion.copy(body.quaternion);
      });
      if (!cheatFly && isLocked) {
        camera.position.set(playerBody.position.x, playerBody.position.y + playerHalf, playerBody.position.z);
      }

      // 死亡
      if (!isDead && !cheatGod && playerBody.position.y < -15) die();

      // FPS
      fpsFrames++;
      const now = performance.now();
      if (now - fpsTime >= 500) {
        const fps = Math.round(fpsFrames / ((now - fpsTime) / 1000));
        fpsFrames = 0;
        fpsTime = now;
        objCountSpan.textContent = placedShapes.length;
        fpsSpan.textContent = fps;
        renderer.shadowMap.enabled = placedShapes.length <= 400;
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 初始化
    resetPlayer();
    refreshPreview();
    updateHUD();
    requestAnimationFrame(animate);

    console.log('✅ 3D物理沙盒 v7.0 已启动');
    console.log('👆 点击屏幕中央开始游戏');
    console.log('💡 如果点击无效，请查看控制台是否有错误');
  </script>
</body>
</html>
