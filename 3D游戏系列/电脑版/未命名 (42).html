<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>3D物理沙盒 完整循环整合器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#1e1e2e;color:#fff;font-family:system-ui}
.top{background:#2d2d3f;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{padding:8px 12px;min-width:260px;background:#3d3d5f;color:white;border:none;border-radius:6px}
button{padding:8px 14px;color:white;border:none;border-radius:6px;cursor:pointer}
.btn-refresh{background:#444}
.btn-full{background:#099}
.btn-next{background:#28a745}
iframe{width:100%;height:calc(100% - 52px);border:none}
</style>
</head>
<body>

<div class="top">
  <select id="fileList">
    <option value="">选择文件</option>
    <!-- JS自动生成所有文件 -->
  </select>

  <button class="btn-refresh" onclick="refreshIframe()">🔁 刷新</button>
  <button class="btn-full" onclick="toggleFull()">🔲 全屏(/键)</button>
  <button class="btn-next" onclick="nextFile()">▶ 下一个（循环）</button>
</div>

<iframe id="iframe" sandbox="allow-same-origin allow-scripts allow-pointer-lock allow-fullscreen allow-forms"></iframe>

<script>
const iframe = document.getElementById('iframe');
const list = document.getElementById('fileList');
const basePath = 'file:///C:/Users/Administrator/Desktop/新建文件夹%20(2)/';

// 1. 生成所有文件选项（按你文件夹里的真实文件名）
list.innerHTML = '<option value="">选择文件</option>';

// 基础文件
list.innerHTML += `
<option value="作品.html">作品.html</option>
<option value="新建文本文件0.html">新建文本文件0.html</option>
<option value="未命名.html">未命名.html</option>
<option value="未命名1.html">未命名1.html</option>
`;

// 生成未命名 (1) 到 未命名 (41)
for (let i = 1; i <= 41; i++) {
  list.innerHTML += `<option value="未命名 (${i}).html">未命名 (${i}).html</option>`;
}

// 生成web1系列文件
list.innerHTML += `
<option value="web1.html">web1.html</option>
<option value="web1 (1).html">web1 (1).html</option>
<option value="web1 (2).html">web1 (2).html</option>
<option value="web1 (3).html">web1 (3).html</option>
<option value="web1 (4).html">web1 (4).html</option>
<option value="web1 (5).html">web1 (5).html</option>
<option value="web1 (6).html">web1 (6).html</option>
<option value="web1 (7).html">web1 (7).html</option>
<option value="web1 (8).html">web1 (8).html</option>
<option value="web1 (9).html">web1 (9).html</option>
<option value="web1 (10).html">web1 (10).html</option>
`;

// 2. 切换加载
list.addEventListener('change', () => {
  const name = list.value;
  if (!name) { iframe.src = ''; return; }
  iframe.src = basePath + encodeURIComponent(name);
});

// 3. 循环切换到下一个文件（末尾自动回到开头）
function nextFile() {
  if (list.options.length <= 1) return;
  let nextIdx = (list.selectedIndex + 1) % list.options.length;
  if (nextIdx === 0) nextIdx = 1; // 跳过“选择文件”
  list.selectedIndex = nextIdx;
  list.dispatchEvent(new Event('change'));
}

// 刷新功能
function refreshIframe() {
  if (!iframe.src) return;
  const cur = iframe.src;
  iframe.src = '';
  setTimeout(() => iframe.src = cur, 20);
}

// 全屏功能
function toggleFull() {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    document.documentElement.requestFullscreen().catch(e => {});
  }
}

// /键触发全屏
document.addEventListener('keydown', e => {
  if (e.key === '/') {
    e.preventDefault();
    toggleFull();
  }
});
</script>

</body>
</html>
