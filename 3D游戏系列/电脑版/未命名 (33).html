<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>3D物理沙盒 - 内嵌整合器</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<style>
html, body { height: 100%; margin: 0; }
</style>
</head>
<body class="bg-gray-100 flex flex-col">

<!-- 顶部导航 -->
<div class="bg-white shadow p-3 flex items-center gap-3 flex-wrap">
  <div class="text-lg font-bold text-indigo-600 flex items-center">
    <i class="fa fa-cube mr-2"></i>3D物理沙盒整合器
  </div>
  <select id="versionSelector" class="px-3 py-2 border rounded min-w-[180px]">
    <option value="">请选择版本</option>
    <option value="classic.html">经典版</option>
    <option value="rebirth.html">重生版</option>
    <option value="cheat.html">外挂版</option>
    <option value="cannon.html">Cannon物理版</option>
    <option value="freeze.html">冻结悬浮版</option>
    <option value="track.html">坐标追踪版</option>
  </select>
  <button onclick="loadIframe()" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">
    <i class="fa fa-play-circle mr-1"></i>加载
  </button>
  <button onclick="reloadIframe()" class="bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700">
    <i class="fa fa-refresh mr-1"></i>刷新
  </button>
</div>

<!-- 内嵌区域 -->
<div class="flex-1 h-full w-full">
  <iframe 
    id="sandboxIframe" 
    class="w-full h-full border-none" 
    src=""
    sandbox="allow-same-origin allow-scripts allow-pointer-lock allow-fullscreen"
  ></iframe>
</div>

<script>
const iframe = document.getElementById('sandboxIframe');
const selector = document.getElementById('versionSelector');

function loadIframe() {
  const path = selector.value;
  if (!path) return alert('请选择一个版本');
  iframe.src = path;
}

function reloadIframe() {
  if (iframe.src) iframe.src = iframe.src;
}
</script>

</body>
</html>
