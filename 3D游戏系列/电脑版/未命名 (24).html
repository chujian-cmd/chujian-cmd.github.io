<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D 物理沙盒 - Cannon.es 引擎版 | 坐标系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      overflow: hidden; background: #000; user-select: none;
    }
    canvas { display: block; }

    /* 开始界面 */
    #start-overlay {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at center, rgba(15, 20, 40, 0.95) 0%, rgba(0, 0, 0, 0.98) 100%);
      backdrop-filter: blur(12px);
      transition: opacity 0.6s ease, visibility 0.6s ease;
      visibility: visible;
    }
    #start-overlay.hidden { opacity: 0; pointer-events: none; visibility: hidden; }

    #start-box {
      background: rgba(25, 30, 60, 0.98);
      border: 2px solid rgba(255, 107, 107, 0.4);
      border-radius: 24px;
      padding: 45px 55px;
      text-align: center;
      color: #fff;
      box-shadow: 0 0 80px rgba(255, 107, 107, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.05);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      max-width: 580px;
      width: 92%;
      line-height: 1.7;
      position: relative;
      overflow: hidden;
    }
    #start-box h1 { font-size: 2.4rem; margin-bottom: 18px; background: linear-gradient(90deg, #ff6b6b, #4ecdc4); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .subtitle { color: #ff6b6b; font-size: 1.2rem; margin-bottom: 20px; animation: pulse 1.8s infinite; font-weight: 600; }
    @keyframes pulse { 0%,100% { opacity:1; transform: scale(1); } 50% { opacity:0.7; transform: scale(1.05); } }
    .key { background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%); border:1px solid rgba(255,255,255,0.3); border-radius:6px; padding:4px 8px; font-size:0.75rem; font-weight:bold; margin:0 3px; display:inline-block; }

    /* HUD */
    .hud {
      position: fixed; z-index: 20; pointer-events: none;
      color: #e6f1ff;
      background: rgba(15, 25, 50, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 12px 24px;
      opacity: 0; transition: opacity 0.4s ease;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .hud.visible { opacity: 1; }
    #hud-top { top:20px; left:50%; transform:translateX(-50%); min-width: 400px; text-align: center; font-size:0.85rem; }
    #hud-bottom { bottom:25px; left:50%; transform:translateX(-50%); display:flex; gap:20px; flex-wrap:wrap; justify-content:center; }
    #coord-display { position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.7); padding: 8px 14px; border-radius: 12px; font-family: monospace; font-size: 0.85rem; color: #4ecdc4; border: 1px solid rgba(78,205,196,0.5); backdrop-filter: blur(5px); pointer-events: none; z-index: 25; }
    #stats { position: fixed; top:20px; left:20px; background:rgba(0,20,40,0.9); padding:8px 15px; border-radius:12px; color:#a8f0f0; font-size:0.75rem; opacity:0; transition:opacity 0.4s ease; border:1px solid rgba(0,210,211,0.3); pointer-events: none; z-index:30; }
    #stats.visible { opacity:1; }
    .shape-dot { width:16px; height:16px; border-radius:4px; display:inline-block; border:2px solid rgba(255,255,255,0.7); margin:0 4px; }
    
    /* 死亡界面 & 作弊面板 保持原样 */
    #death-overlay { position:fixed; inset:0; background:radial-gradient(circle at center, rgba(0,0,0,0.9) 0%, rgba(40,10,10,0.95) 100%); z-index:200; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.5s ease; backdrop-filter: blur(8px); }
    #death-overlay.active { opacity:1; pointer-events:auto; }
    #death-box { background:rgba(35,20,40,0.98); border:1px solid rgba(255,107,107,0.4); border-radius:24px; padding:40px 50px; text-align:center; color:#fff; box-shadow:0 0 60px rgba(255,107,107,0.3); }
    #cheat-panel { position:fixed; top:20px; right:20px; width:280px; background:#0f172a; border:1px solid #00ff00; color:#00ff00; padding:15px; opacity:0; pointer-events:none; transition:opacity 0.3s; border-radius:12px; max-height:85vh; overflow-y:auto; z-index:9999; font-family:monospace; }
    #cheat-panel.visible { opacity:1; pointer-events:auto; }
    .cheat-btn { width:100%; padding:8px; margin:6px 0; background:rgba(0,255,0,0.1); border:1px solid #00ff00; color:#00ff00; border-radius:6px; cursor:pointer; }
    #cheat-script-input { width:100%; background:rgba(0,10,0,0.8); border:1px solid #00ff00; color:#00ff00; padding:8px; border-radius:6px; min-height:80px; font-family:monospace; }
    #loading-overlay { position:fixed; inset:0; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; transition:opacity 0.5s; color:#4ecdc4; }
    .loader { width:50px; height:50px; border:4px solid rgba(78,205,196,0.2); border-top:4px solid #4ecdc4; border-radius:50%; animation: spin 1s linear infinite; margin-bottom:20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="loading-overlay"><div class="loader"></div><p>加载物理引擎 Cannon.es ...</p></div>
<div id="start-overlay"><div id="start-box"><h1>🎮 3D 物理沙盒</h1><p class="subtitle">👆 点击开始游戏</p><p>WASD移动 · 空格跳跃 · 鼠标控制视角</p><p>左键放置 · 右键删除 · 滚轮切换形状</p><p><span class="key">1-8</span>形状 <span class="key">R</span>换色 <span class="key">G</span>吸引 <span class="key">H</span>推远 <span class="key">B</span>爆炸<br><span class="key">V</span>全吸 <span class="key">N</span>反重力 <span class="key">F</span>重生 <span class="key">K</span>冻结放置 <span class="key">~</span>面板 <span class="key">Ctrl+Z</span>撤销</p></div></div>
<div id="stats">📦 <span id="obj-count">0</span> ⚡ <span id="fps-val">60</span> FPS 🕒 <span id="physics-time">0</span>ms</div>
<div id="hud-top" class="hud">形状: <span id="shape-dot" class="shape-dot" style="background:#ff6b6b;"></span> <span id="shape-name">立方体</span> | 颜色: <span id="color-dot" style="width:16px;height:16px;border-radius:50%;background:#ff6b6b;display:inline-block;border:2px solid rgba(255,255,255,0.7);"></span></div>
<div id="hud-bottom" class="hud"><span><span class="key">1-8</span>形状</span><span><span class="key">R</span>换色</span><span><span class="key">G/H</span>吸/推</span><span><span class="key">B</span>爆炸</span><span><span class="key">F</span>重生</span><span><span class="key">K</span>冻结</span><span><span class="key">~</span>面板</span></div>
<div id="coord-display">📍 玩家坐标: -- , -- , --</div>
<div id="death-overlay"><div id="death-box"><h2>💀 掉出世界</h2><p>按 F 重生</p><button id="respawn-btn">🔄 重生</button></div></div>
<div id="cheat-panel"><h3>⚡ 控制台</h3><div><label>🕊️ 飞行</label><input type="checkbox" id="cheat-fly"></div><div><label>👑 上帝模式</label><input type="checkbox" id="cheat-god"></div><div><label>🎯 无限放置</label><input type="checkbox" id="cheat-range"></div><div><label>⚡ 自动放置</label><input type="checkbox" id="cheat-auto"></div><div>重力 <input type="range" id="cheat-gravity" min="-20" max="20" value="-12" step="0.5"></div><div>速度 <input type="range" id="cheat-speed" min="2" max="30" value="8" step="0.5"></div><div>跳跃 <input type="range" id="cheat-jump" min="2" max="20" value="8" step="0.5"></div><div>力度 <input type="range" id="cheat-force" min="500" max="5000" value="1500" step="100"></div><div>批量数量 <input type="number" id="cheat-batch" value="100" min="1" max="5000"></div><button class="cheat-btn" id="btn-spawn-batch">💣 批量生成</button><button class="cheat-btn" id="btn-clear">🗑️ 清空世界</button><div><label>📜 脚本</label><textarea id="cheat-script-input">// 示例: setGravity(-9.8); spawnCube(0,5,0);</textarea></div><button class="cheat-btn" id="btn-exec-script">▶️ 执行脚本</button></div>

<script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js" } }
</script>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// ---------- 全局游戏对象 ----------
const game = {
  scene: new THREE.Scene(),
  camera: new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.1, 200),
  renderer: new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" }),
  clock: new THREE.Clock(),
  raycaster: new THREE.Raycaster(),
  
  // Cannon 物理世界
  world: null,
  groundBody: null,
  playerBody: null,       // 玩家刚体 (球体)
  
  // 游戏状态
  isLocked: false,
  isDead: false,
  panelVisible: false,
  holdK: false,           // 冻结放置 (静态物体)
  timeFreeze: false,
  
  // 作弊配置
  cheat: { fly: false, god: false, range: false, auto: false },
  config: { moveSpeed: 8, jumpForce: 8, forceStrength: 1500, mouseSensitivity: 0.002, previewUpdateRate: 0.05 },
  
  // 物体管理
  placedItems: [],       // { mesh, body, isStatic }
  allPlaceables: [],     // 用于射线检测的物体(包括地面)
  undoStack: [],
  
  // 形状/颜色
  shapes: { types: ['cube','sphere','cylinder','cone','torus','pyramid','capsule','octahedron'], names: ['立方体','球体','圆柱','圆锥','圆环','金字塔','胶囊','八面体'], index: 0,
            colors: ['#ff6b6b','#ff9f43','#feca57','#54a0ff','#5f27cd','#00d2d3','#55efc4','#fd79a8','#ffffff','#e056a0'], colorIndex: 0 },
  
  // 输入
  input: { keys: {}, euler: new THREE.Euler(0, 0, 0, 'YXZ') },
  
  // UI 元素
  ui: {},
  
  // 几何缓存与预览
  geometries: {},
  previewMesh: null,
  previewMaterial: null,
  
  // 性能计时
  statsFrames: 0, statsTime: 0, physicsTime: 0
};

// 辅助函数
function updateHUD() {
  const color = game.shapes.colors[game.shapes.colorIndex];
  document.getElementById('shape-dot').style.background = color;
  document.getElementById('shape-name').textContent = game.shapes.names[game.shapes.index];
  document.getElementById('color-dot').style.background = color;
}

function refreshPreview() {
  if (!game.previewMesh) return;
  const type = game.shapes.types[game.shapes.index];
  game.previewMesh.geometry = game.geometries[type] || game.geometries.cube;
  game.previewMesh.material.color.set(game.shapes.colors[game.shapes.colorIndex]);
}

// 创建物理材质 (地面/玩家/物体通用摩擦)
const defaultMaterial = new CANNON.Material('default');
const playerMaterial = new CANNON.Material('player');
const contactMaterial = new CANNON.ContactMaterial(defaultMaterial, defaultMaterial, { friction: 0.4, restitution: 0.5, contactEquationStiffness: 1e8 });
const playerGroundContact = new CANNON.ContactMaterial(playerMaterial, defaultMaterial, { friction: 0.2, restitution: 0.3, contactEquationStiffness: 1e8 });

// 初始化物理世界
function initPhysics() {
  game.world = new CANNON.World();
  game.world.gravity = new CANNON.Vec3(0, -12, 0);
  game.world.broadphase = new CANNON.NaiveBroadphase(); // 性能尚可
  game.world.defaultContactMaterial.restitution = 0.5;
  game.world.addContactMaterial(contactMaterial);
  game.world.addContactMaterial(playerGroundContact);
  game.world.defaultContactMaterial.material1 = defaultMaterial;
  game.world.defaultContactMaterial.material2 = defaultMaterial;
  
  // 地面
  const groundShape = new CANNON.Box(new CANNON.Vec3(18, 0.2, 18));
  game.groundBody = new CANNON.Body({ mass: 0, material: defaultMaterial });
  game.groundBody.addShape(groundShape);
  game.groundBody.position.set(0, -0.3, 0);
  game.world.addBody(game.groundBody);
  
  // 玩家 (球体, 质量1)
  const playerShape = new CANNON.Sphere(0.4);
  game.playerBody = new CANNON.Body({ mass: 1, material: playerMaterial });
  game.playerBody.addShape(playerShape);
  game.playerBody.position.set(0, 2, 8);
  game.playerBody.linearDamping = 0.95;
  game.world.addBody(game.playerBody);
  
  // 边界墙体 (防止物体飞出界限)
  const wallMat = new CANNON.Material('wall');
  const boundarySize = 17.5;
  const halfThick = 0.5;
  const wallPositions = [
    { pos: [0, 0, -boundarySize], size: [boundarySize*2, 10, halfThick] },
    { pos: [0, 0, boundarySize], size: [boundarySize*2, 10, halfThick] },
    { pos: [-boundarySize, 0, 0], size: [halfThick, 10, boundarySize*2] },
    { pos: [boundarySize, 0, 0], size: [halfThick, 10, boundarySize*2] }
  ];
  wallPositions.forEach(w => {
    const box = new CANNON.Box(new CANNON.Vec3(w.size[0], w.size[1], w.size[2]));
    const body = new CANNON.Body({ mass: 0, material: wallMat });
    body.addShape(box);
    body.position.set(w.pos[0], w.pos[1], w.pos[2]);
    game.world.addBody(body);
  });
}

// 根据类型获取Three几何体 (复用)
function getGeometry(type) {
  const g = game.geometries;
  if (!g[type]) {
    switch(type) {
      case 'cube': g.cube = new THREE.BoxGeometry(0.95, 0.95, 0.95); break;
      case 'sphere': g.sphere = new THREE.SphereGeometry(0.48, 16, 16); break;
      case 'cylinder': g.cylinder = new THREE.CylinderGeometry(0.48, 0.48, 0.95, 16); break;
      case 'cone': g.cone = new THREE.ConeGeometry(0.48, 0.95, 16); break;
      case 'torus': g.torus = new THREE.TorusGeometry(0.4, 0.18, 8, 16); break;
      case 'pyramid': g.pyramid = new THREE.ConeGeometry(0.48, 0.9, 4); break;
      case 'capsule': g.capsule = new THREE.CylinderGeometry(0.32, 0.32, 0.8, 12); break;
      case 'octahedron': g.octahedron = new THREE.OctahedronGeometry(0.48); break;
      default: g.cube = new THREE.BoxGeometry(0.95, 0.95, 0.95);
    }
  }
  return g[type];
}

// 放置物体 (核心)
function createPlacedShape(type, colorHex, position, isStatic = false) {
  const geometry = getGeometry(type);
  const material = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.35, metalness: 0.05 });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(position);
  mesh.castShadow = mesh.receiveShadow = true;
  mesh.name = 'placed-shape';
  
  // Cannon 刚体 (球体近似保证碰撞稳定)
  const shapeRadius = 0.48;
  const body = new CANNON.Body({ mass: isStatic ? 0 : 1, material: defaultMaterial });
  body.addShape(new CANNON.Sphere(shapeRadius));
  body.position.set(position.x, position.y, position.z);
  body.userData = { mesh, type: 'placed' };
  if (!isStatic) {
    body.linearDamping = 0.3;
    body.angularDamping = 0.1;
  }
  game.world.addBody(body);
  
  game.scene.add(mesh);
  const entry = { mesh, body, isStatic };
  game.placedItems.push(entry);
  game.allPlaceables.push(mesh);
  return entry;
}

// 删除物体
function removeEntry(entry) {
  if (!entry) return;
  game.world.removeBody(entry.body);
  game.scene.remove(entry.mesh);
  entry.mesh.material?.dispose();
  const idx = game.placedItems.indexOf(entry);
  if (idx !== -1) game.placedItems.splice(idx, 1);
  const placeIdx = game.allPlaceables.indexOf(entry.mesh);
  if (placeIdx !== -1) game.allPlaceables.splice(placeIdx, 1);
}

// 清空全部物体
function clearWorld() {
  while (game.placedItems.length) {
    removeEntry(game.placedItems[0]);
  }
  game.undoStack = [];
}

// 批量生成
function spawnBatch(count) {
  const type = game.shapes.types[game.shapes.index];
  const color = game.shapes.colors[game.shapes.colorIndex];
  const dir = new THREE.Vector3();
  game.camera.getWorldDirection(dir);
  const basePos = game.camera.position.clone().add(dir.multiplyScalar(3));
  const batch = [];
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2 + Math.random() * 0.5;
    const radius = 1.5 + Math.random() * 3;
    const x = basePos.x + Math.cos(angle) * radius;
    const z = basePos.z + Math.sin(angle) * radius;
    const y = basePos.y + Math.random() * 2;
    const entry = createPlacedShape(type, color, new THREE.Vector3(x, y, z), game.holdK);
    batch.push(entry);
  }
  game.undoStack.push({ entries: batch });
}

// 应用力 (吸引/推远)
function applyForceToAll(attract) {
  const playerPos = game.playerBody.position;
  const strength = game.config.forceStrength;
  game.placedItems.forEach(item => {
    if (item.isStatic) return;
    const dx = playerPos.x - item.body.position.x;
    const dy = playerPos.y - item.body.position.y;
    const dz = playerPos.z - item.body.position.z;
    const dist = Math.hypot(dx, dy, dz);
    if (dist < 8 && dist > 0.3) {
      const power = (1 - dist / 8) * strength;
      const fx = (dx / dist) * power;
      const fy = (dy / dist) * power;
      const fz = (dz / dist) * power;
      if (!attract) {
        item.body.applyForce(new CANNON.Vec3(-fx, -fy, -fz), item.body.position);
      } else {
        item.body.applyForce(new CANNON.Vec3(fx, fy, fz), item.body.position);
      }
    }
  });
}

// 爆炸
function explode() {
  const playerPos = game.playerBody.position;
  const strength = game.config.forceStrength * 0.7;
  game.placedItems.forEach(item => {
    if (item.isStatic) return;
    const dx = item.body.position.x - playerPos.x;
    const dy = item.body.position.y - playerPos.y;
    const dz = item.body.position.z - playerPos.z;
    const dist = Math.hypot(dx, dy, dz);
    if (dist < 10 && dist > 0.3) {
      const factor = (1 - dist / 10) * strength;
      const inv = 1 / dist;
      item.body.applyImpulse(new CANNON.Vec3(dx * inv * factor, (dy + 0.5) * inv * factor, dz * inv * factor), item.body.position);
    }
  });
}

// 全吸
function vacuum() {
  const playerPos = game.playerBody.position;
  game.placedItems.forEach(item => {
    if (item.isStatic) return;
    const dx = playerPos.x - item.body.position.x;
    const dy = playerPos.y + 0.5 - item.body.position.y;
    const dz = playerPos.z - item.body.position.z;
    const dist = Math.hypot(dx, dy, dz);
    if (dist > 1 && dist < 15) {
      item.body.applyImpulse(new CANNON.Vec3(dx * 12, dy * 12, dz * 12), item.body.position);
    }
  });
}

// 获取放置点 (射线)
function getPlacement() {
  game.raycaster.setFromCamera(new THREE.Vector2(0, 0), game.camera);
  game.raycaster.far = game.cheat.range ? 100 : 30;
  const hits = game.raycaster.intersectObjects(game.allPlaceables, false);
  if (hits.length) {
    const point = hits[0].point.clone();
    const normal = hits[0].face.normal.clone().transformDirection(hits[0].object.matrixWorld);
    const pos = point.add(normal.multiplyScalar(0.48));
    pos.x = THREE.MathUtils.clamp(pos.x, -17, 17);
    pos.z = THREE.MathUtils.clamp(pos.z, -17, 17);
    pos.y = Math.max(pos.y, 0.2);
    const validDist = game.cheat.range || pos.distanceTo(game.camera.position) >= 0.9;
    return { pos, valid: validDist };
  }
  return { pos: null, valid: false };
}

// 玩家重置
function resetPlayer() {
  game.playerBody.position.set(0, 2, 8);
  game.playerBody.velocity.set(0, 0, 0);
  game.world.gravity.set(0, -12, 0);
  document.getElementById('cheat-gravity').value = -12;
  game.camera.position.set(0, 2.6, 8);
  game.input.euler.set(0, 0, 0);
  game.camera.quaternion.setFromEuler(game.input.euler);
  game.isDead = false;
  game.previewMesh.visible = false;
}

// 死亡
function die() {
  if (game.isDead || game.cheat.god) return;
  game.isDead = true;
  document.exitPointerLock();
  document.getElementById('death-overlay').classList.add('active');
}

function respawn() { resetPlayer(); document.getElementById('death-overlay').classList.remove('active'); }

// 坐标更新HUD
function updateCoordDisplay() {
  const pos = game.playerBody.position;
  const x = pos.x.toFixed(2);
  const y = pos.y.toFixed(2);
  const z = pos.z.toFixed(2);
  document.getElementById('coord-display').innerHTML = `📍 玩家坐标: ${x}, ${y}, ${z}`;
}

// 脚本执行 (保持兼容)
function execScript() {
  const code = document.getElementById('cheat-script-input').value;
  try {
    const ctx = {
      physics: game.world, setGravity: (v) => { game.world.gravity.set(0, v, 0); document.getElementById('cheat-gravity').value = v; },
      setSpeed: (v) => game.config.moveSpeed = v,
      spawnCube: (x,y,z,col) => createPlacedShape('cube', col || game.shapes.colors[game.shapes.colorIndex], new THREE.Vector3(x,y,z)),
      spawnSphere: (x,y,z,col) => createPlacedShape('sphere', col || game.shapes.colors[game.shapes.colorIndex], new THREE.Vector3(x,y,z)),
      clearAll: () => clearWorld(),
      log: console.log
    };
    new Function(...Object.keys(ctx), code)(...Object.values(ctx));
  } catch(e) { console.error(e); alert("脚本错误"); }
}

// 事件绑定
function initEvents() {
  document.addEventListener('mousemove', (e) => {
    if (document.pointerLockElement !== game.renderer.domElement || game.isDead) return;
    const mx = e.movementX || 0, my = e.movementY || 0;
    game.input.euler.y -= mx * game.config.mouseSensitivity;
    game.input.euler.x -= my * game.config.mouseSensitivity;
    game.input.euler.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, game.input.euler.x));
    game.camera.quaternion.setFromEuler(game.input.euler);
  });
  
  document.addEventListener('pointerlockchange', () => {
    game.isLocked = document.pointerLockElement === game.renderer.domElement;
    if (game.isLocked) {
      document.getElementById('start-overlay').classList.add('hidden');
      document.getElementById('hud-top').classList.add('visible');
      document.getElementById('hud-bottom').classList.add('visible');
      document.getElementById('stats').classList.add('visible');
      if (game.previewMesh) game.previewMesh.visible = true;
    } else {
      if (!game.isDead) document.getElementById('start-overlay').classList.remove('hidden');
      document.getElementById('hud-top').classList.remove('visible');
      document.getElementById('hud-bottom').classList.remove('visible');
      document.getElementById('stats').classList.remove('visible');
      if (game.previewMesh) game.previewMesh.visible = false;
    }
  });
  
  document.getElementById('start-box').addEventListener('click', () => game.renderer.domElement.requestPointerLock());
  document.getElementById('respawn-btn').addEventListener('click', respawn);
  
  document.addEventListener('keydown', (e) => {
    game.input.keys[e.code] = true;
    if (e.code === 'KeyK') game.holdK = true;
    if (e.code >= 'Digit1' && e.code <= 'Digit8') {
      game.shapes.index = parseInt(e.code.slice(-1)) - 1;
      updateHUD(); refreshPreview();
    }
    if (e.code === 'KeyR' && !e.ctrlKey) {
      game.shapes.colorIndex = (game.shapes.colorIndex + 1) % game.shapes.colors.length;
      updateHUD(); refreshPreview();
    }
    if (e.code === 'Space' && game.isLocked && !game.isDead && !game.cheat.fly && game.playerBody.position.y <= 0.8) {
      e.preventDefault();
      game.playerBody.velocity.y = game.config.jumpForce;
    }
    if (e.code === 'Backquote') { game.panelVisible = !game.panelVisible; document.getElementById('cheat-panel').classList.toggle('visible', game.panelVisible); e.preventDefault(); }
    if (e.code === 'Enter' && game.panelVisible) execScript();
    if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ' && game.isLocked && !game.isDead) {
      e.preventDefault();
      if (game.undoStack.length) game.undoStack.pop().entries?.forEach(removeEntry);
    }
    if (e.code === 'KeyF') { e.preventDefault(); respawn(); }
    if (e.code === 'KeyU') {
      if (document.pointerLockElement === game.renderer.domElement) document.exitPointerLock();
      else game.renderer.domElement.requestPointerLock();
    }
    if (e.code === 'KeyN') {
      const newGrav = game.world.gravity.y > 0 ? -12 : 6;
      game.world.gravity.set(0, newGrav, 0);
      document.getElementById('cheat-gravity').value = newGrav;
    }
    if (e.code === 'KeyG') applyForceToAll(true);
    if (e.code === 'KeyH') applyForceToAll(false);
    if (e.code === 'KeyB') explode();
    if (e.code === 'KeyV') vacuum();
  });
  document.addEventListener('keyup', (e) => { game.input.keys[e.code] = false; if (e.code === 'KeyK') game.holdK = false; });
  
  document.addEventListener('wheel', (e) => {
    if (!game.isLocked || game.isDead) return;
    e.preventDefault();
    game.shapes.index = (game.shapes.index + (e.deltaY > 0 ? 1 : -1) + game.shapes.types.length) % game.shapes.types.length;
    updateHUD(); refreshPreview();
  }, { passive: false });
  
  document.addEventListener('mousedown', (e) => {
    if (!game.isLocked || game.isDead) return;
    if (e.button === 0) {
      const place = getPlacement();
      if (place.valid && place.pos) {
        const entry = createPlacedShape(game.shapes.types[game.shapes.index], game.shapes.colors[game.shapes.colorIndex], place.pos, game.holdK);
        game.undoStack.push({ entries: [entry] });
      }
    }
    if (e.button === 2) {
      game.raycaster.setFromCamera(new THREE.Vector2(0,0), game.camera);
      const hits = game.raycaster.intersectObjects(game.allPlaceables, false);
      for (let hit of hits) {
        if (hit.object.name === 'placed-shape') {
          const entry = game.placedItems.find(it => it.mesh === hit.object);
          if (entry) removeEntry(entry);
          break;
        }
      }
    }
  });
  document.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('resize', () => { game.camera.aspect = window.innerWidth/window.innerHeight; game.camera.updateProjectionMatrix(); game.renderer.setSize(window.innerWidth, window.innerHeight); });
  
  // 作弊UI
  document.getElementById('cheat-fly').addEventListener('change', e => game.cheat.fly = e.target.checked);
  document.getElementById('cheat-god').addEventListener('change', e => game.cheat.god = e.target.checked);
  document.getElementById('cheat-range').addEventListener('change', e => game.cheat.range = e.target.checked);
  document.getElementById('cheat-auto').addEventListener('change', e => game.cheat.auto = e.target.checked);
  document.getElementById('cheat-gravity').addEventListener('input', e => game.world.gravity.set(0, parseFloat(e.target.value), 0));
  document.getElementById('cheat-speed').addEventListener('input', e => game.config.moveSpeed = parseFloat(e.target.value));
  document.getElementById('cheat-jump').addEventListener('input', e => game.config.jumpForce = parseFloat(e.target.value));
  document.getElementById('cheat-force').addEventListener('input', e => game.config.forceStrength = parseFloat(e.target.value));
  document.getElementById('btn-spawn-batch').addEventListener('click', () => spawnBatch(Math.min(parseInt(document.getElementById('cheat-batch').value)||100, 3000)));
  document.getElementById('btn-clear').addEventListener('click', () => clearWorld());
  document.getElementById('btn-exec-script').addEventListener('click', execScript);
}

// 初始化场景渲染
function initGraphics() {
  game.renderer.setSize(window.innerWidth, window.innerHeight);
  game.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  game.renderer.shadowMap.enabled = true;
  game.renderer.setClearColor('#87CEEB');
  document.body.appendChild(game.renderer.domElement);
  
  game.scene.background = new THREE.Color('#87CEEB');
  game.scene.fog = new THREE.Fog('#87CEEB', 45, 130);
  game.scene.add(new THREE.AmbientLight('#bcd4f0', 0.8));
  const sun = new THREE.DirectionalLight('#fff8e7', 4.5);
  sun.position.set(20,30,10); sun.castShadow = true;
  sun.shadow.mapSize.width = sun.shadow.mapSize.height = 1024;
  game.scene.add(sun);
  
  const groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(36,36), new THREE.MeshStandardMaterial({ color: '#d5c4a1', roughness: 0.75 }));
  groundMesh.rotation.x = -Math.PI/2; groundMesh.position.y = -0.2; groundMesh.receiveShadow = true;
  game.scene.add(groundMesh);
  game.scene.add(new THREE.GridHelper(36,36,'#c4b99a','#e0d5c0'));
  game.allPlaceables.push(groundMesh);
  
  // 几何体预创建
  game.shapes.types.forEach(t => getGeometry(t));
  game.previewMaterial = new THREE.MeshStandardMaterial({ color: '#ff6b6b', transparent: true, opacity: 0.35 });
  game.previewMesh = new THREE.Mesh(game.geometries.cube, game.previewMaterial);
  game.previewMesh.visible = false;
  game.scene.add(game.previewMesh);
  
  updateHUD(); refreshPreview();
}

// 演示初始物体
function initDemo() {
  const demo = [[0,1,-2,'#ff6b6b','cube'],[3,1,1,'#4ecdc4','sphere'],[-3,1,2,'#ffe66d','cylinder'],[2,1,3,'#a29bfe','pyramid'],[-2,1,-3,'#00d2d3','capsule'],[0,1,4,'#fd79a8','octahedron']];
  demo.forEach(([x,y,z,col,type]) => createPlacedShape(type, col, new THREE.Vector3(x,y,z), false));
}

// 动画循环
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(game.clock.getDelta(), 0.033);
  const { keys } = game.input;
  
  // 物理步进
  const physStart = performance.now();
  if (!game.timeFreeze) game.world.step(1/60, dt, 3);
  game.physicsTime = performance.now() - physStart;
  
  // 同步物体网格
  for (let item of game.placedItems) {
    item.mesh.position.copy(item.body.position);
    item.mesh.quaternion.copy(item.body.quaternion);
  }
  
  // 玩家移动 (飞行模式或地面模式)
  if (game.isLocked && !game.isDead) {
    if (game.cheat.fly) {
      let fwd = 0, right = 0, up = 0;
      if (keys.KeyW) fwd++; if (keys.KeyS) fwd--;
      if (keys.KeyA) right--; if (keys.KeyD) right++;
      if (keys.Space) up++; if (keys.ShiftLeft) up--;
      const camDir = new THREE.Vector3(); game.camera.getWorldDirection(camDir); camDir.y = 0; if(camDir.length()>0) camDir.normalize();
      const rightVec = new THREE.Vector3().crossVectors(camDir, new THREE.Vector3(0,1,0)).normalize();
      const move = new THREE.Vector3().addScaledVector(camDir, fwd).addScaledVector(rightVec, right);
      move.y = up;
      if (move.length()>0) move.normalize().multiplyScalar(game.config.moveSpeed * dt);
      game.playerBody.position.x += move.x; game.playerBody.position.y += move.y; game.playerBody.position.z += move.z;
      game.playerBody.velocity.set(0,0,0);
      game.camera.position.copy(game.playerBody.position);
      game.camera.position.y += 0.6;
    } else {
      let fwd = 0, right = 0;
      if (keys.KeyW) fwd++; if (keys.KeyS) fwd--;
      if (keys.KeyA) right--; if (keys.KeyD) right++;
      const camDir = new THREE.Vector3(); game.camera.getWorldDirection(camDir); camDir.y=0; if(camDir.length()>0) camDir.normalize();
      const rightVec = new THREE.Vector3().crossVectors(camDir, new THREE.Vector3(0,1,0)).normalize();
      const dir = new THREE.Vector3().addScaledVector(camDir, fwd).addScaledVector(rightVec, right);
      if (dir.length()>0) dir.normalize();
      game.playerBody.velocity.x = dir.x * game.config.moveSpeed;
      game.playerBody.velocity.z = dir.z * game.config.moveSpeed;
    }
    
    // 相机跟随
    if (!game.cheat.fly) game.camera.position.copy(game.playerBody.position);
    game.camera.position.y = game.playerBody.position.y + 0.6;
    
    // 自动放置
    if (game.cheat.auto && game.isLocked && !game.isDead) {
      if (!game._autoTimer) game._autoTimer = 0;
      game._autoTimer += dt;
      if (game._autoTimer > 0.12) {
        game._autoTimer = 0;
        const place = getPlacement();
        if (place.valid && place.pos) createPlacedShape(game.shapes.types[game.shapes.index], game.shapes.colors[game.shapes.colorIndex], place.pos, game.holdK);
      }
    }
    
    // 预览更新
    game._previewTick = (game._previewTick || 0) + dt;
    if (game._previewTick > 0.05) {
      game._previewTick = 0;
      const place = getPlacement();
      if (place.valid && place.pos) { game.previewMesh.position.copy(place.pos); game.previewMesh.visible = true; game.previewMesh.material.color.set(game.shapes.colors[game.shapes.colorIndex]); }
      else game.previewMesh.visible = false;
    }
  }
  
  // 死亡判定
  if (!game.isDead && !game.cheat.god && game.playerBody.position.y < -8) die();
  
  // 性能统计
  const now = performance.now();
  if (!game.statsTime) game.statsTime = now;
  game.statsFrames++;
  if (now - game.statsTime >= 500) {
    const fps = Math.round(game.statsFrames / ((now - game.statsTime)/1000));
    document.getElementById('obj-count').textContent = game.placedItems.length;
    document.getElementById('fps-val').textContent = fps;
    document.getElementById('physics-time').textContent = game.physicsTime.toFixed(1);
    game.statsFrames = 0; game.statsTime = now;
  }
  
  updateCoordDisplay();
  game.renderer.render(game.scene, game.camera);
}

// 启动
async function init() {
  initGraphics();
  initPhysics();
  initEvents();
  initDemo();
  animate();
  setTimeout(() => { const loader = document.getElementById('loading-overlay'); loader.style.opacity = 0; setTimeout(() => loader.style.display='none', 500); }, 800);
}
init();
</script>
