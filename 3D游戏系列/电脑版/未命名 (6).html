<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 物理沙盒</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      font-family: system-ui, sans-serif;
    }
    body {
      overflow: hidden;
      background: #0b0f14;
      color: #fff;
    }
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }

    #start-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10,14,20,0.92);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: 0.4s;
    }
    #start-button {
      padding: 14px 36px;
      font-size: 16px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
    }
    #start-button:hover {
      background: #5a9ff0;
      transform: translateY(-2px);
    }
    #start-info {
      margin-top: 20px;
      color: #ccc;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }

    #hud-top {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 10px 16px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }
    .shape-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
    }
    .shape-dot.active {
      background: #4a90e2;
      box-shadow: 0 0 10px #4a90e2;
    }

    #hud-bottom {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 10px 20px;
      font-size: 13px;
      z-index: 10;
    }
    .key {
      display: inline-block;
      background: rgba(255,255,255,0.12);
      padding: 2px 8px;
      border-radius: 6px;
      margin: 0 3px;
    }

    #stats {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="start-overlay">
    <button id="start-button">开始游戏</button>
    <div id="start-info">
      WASD 移动 | 鼠标视角 | 左键放置 | 右键删除<br>1-5 切换形状 | R 换色
    </div>
  </div>

  <div id="hud-top">
    <div class="shape-dot active"></div>
    <div class="shape-dot"></div>
    <div class="shape-dot"></div>
    <div class="shape-dot"></div>
    <div class="shape-dot"></div>
  </div>
  <div id="hud-bottom">
    <span class="key">左键</span>放置 <span class="key">右键</span>删除
  </div>
  <div id="stats">物体：0 | FPS：60</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    // ========== 基础 3D 场景（不黑屏核心） ==========
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1c2c);
    scene.fog = new THREE.Fog(0x1a1c2c, 20, 60);

    const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // 灯光
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(10, 20, 10);
    light.castShadow = true;
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040, 0.5));

    // 地面
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(100, 100),
      new THREE.MeshStandardMaterial({ color: 0x333333 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // 鼠标控制
    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement === document.body) {
        camera.rotation.y -= e.movementX * 0.002;
        camera.rotation.x -= e.movementY * 0.002;
        camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
      }
    });

    // 放置方块
    document.addEventListener('click', () => {
      if (document.pointerLockElement === document.body) {
        const box = new THREE.Mesh(
          new THREE.BoxGeometry(1,1,1),
          new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff })
        );
        box.position.copy(camera.position);
        box.castShadow = true;
        scene.add(box);
      }
    });

    // 开始按钮
    document.getElementById('start-button').onclick = () => {
      document.getElementById('start-overlay').style.display = 'none';
      document.body.requestPointerLock();
    };

    // 渲染循环
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
