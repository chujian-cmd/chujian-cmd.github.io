<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D物理沙盒 - 本地内嵌整合器</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<style>
html, body { height: 100%; margin: 0; }
</style>
</head>
<body class="bg-gray-100 flex flex-col">

<!-- 顶部版本选择栏 -->
<div class="bg-white shadow p-3 flex items-center gap-3 flex-wrap">
  <div class="text-lg font-bold text-indigo-600 flex items-center">
    <i class="fa fa-cube mr-2"></i>3D物理沙盒整合器
  </div>

  <select id="ver" class="px-3 py-2 border rounded min-w-[180px]">
    <option value="">选择版本</option>
    <option value="classic.html">经典版</option>
    <option value="rebirth.html">重生版</option>
    <option value="cheat.html">外挂版</option>
    <option value="cannon.html">Cannon物理版</option>
    <option value="freeze.html">冻结悬浮版</option>
    <option value="track.html">坐标追踪版</option>
  </select>

  <button onclick="load()" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">
    <i class="fa fa-play-circle mr-1"></i>加载
  </button>
  <button onclick="refresh()" class="bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700">
    <i class="fa fa-refresh mr-1"></i>刷新
  </button>
  <button onclick="full()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
    <i class="fa fa-arrows-alt mr-1"></i>全屏
  </button>
</div>

<!-- 内嵌显示区域（占满剩下屏幕） -->
<div class="flex-1 w-full h-full">
  <iframe 
    id="iframe" 
    class="w-full h-full border-none" 
    src=""
    sandbox="allow-same-origin allow-scripts allow-pointer-lock allow-fullscreen allow-forms"
    allow="fullscreen *; autoplay; clipboard-write; encrypted-media">
  </iframe>
</div>

<script>
const iframe = document.getElementById('iframe');
const ver = document.getElementById('ver');

// 加载选中版本
function load() {
  let f = ver.value;
  if (!f) { alert('请选择一个版本'); return; }
  // 强制使用你本地的绝对路径
  iframe.src = `file:///C:/Users/Administrator/Desktop/新建文件夹%20(2)/${f}`;
}

// 刷新当前内嵌页
function refresh() {
  if (iframe.src) iframe.src = iframe.src;
}

// 全屏内嵌页
function full() {
  if (iframe.requestFullscreen) iframe.requestFullscreen();
  else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
  else if (iframe.msRequestFullscreen) iframe.msRequestFullscreen();
}
</script>

</body>
</html>
