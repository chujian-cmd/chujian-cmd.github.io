<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>循环启动器 1~41 最终版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#111;color:#fff;font-family:system-ui}
.top{background:#222;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{padding:8px 12px;min-width:260px;background:#333;color:white;border:none;border-radius:6px}
button{padding:8px 14px;color:white;border:none;border-radius:6px;cursor:pointer}
.btn-refresh{background:#444}
.btn-full{background:#099}
.btn-next{background:#28a745}
iframe{width:100%;height:calc(100% - 52px);border:none}
</style>
</head>
<body>

<div class="top">
  <select id="fileList">
    <option value="">选择文件</option>
  </select>
  <button class="btn-refresh" onclick="refreshIframe()">🔁 刷新</button>
  <button class="btn-full" onclick="toggleFull()">🔲 全屏</button>
  <button class="btn-next" onclick="nextFile()">▶ 下一个（循环）</button>
</div>

<iframe id="iframe" sandbox="allow-same-origin allow-scripts allow-pointer-lock allow-fullscreen allow-forms"></iframe>

<script>
const iframe = document.getElementById('iframe');
const list = document.getElementById('fileList');

// ✅ 你电脑的真实路径 100% 正确
const base = 'file:///C:/Users/Administrator/Desktop/新建文件夹%20(2)/';

// 清空列表
list.innerHTML = '<option value="">选择文件</option>';

// ==============================
// ✅ 所有名字 100% 复制你文件夹
// ==============================
let allFiles = [
  "作品.html",
  "新建文本文档0.html",  // 这里终于改对了！！！
  "未命名.html",
  "未命名1.html",
  "未命名 (1).html",
  "未命名 (2).html",
  "未命名 (3).html",
  "未命名 (4).html",
  "未命名 (5).html",
  "未命名 (6).html",
  "未命名 (7).html",
  "未命名 (8).html",
  "未命名 (9).html",
  "未命名 (10).html",
  "未命名 (11).html",
  "未命名 (12).html",
  "未命名 (13).html",
  "未命名 (14).html",
  "未命名 (15).html",
  "未命名 (16).html",
  "未命名 (17).html",
  "未命名 (18).html",
  "未命名 (19).html",
  "未命名 (20).html",
  "未命名 (21).html",
  "未命名 (22).html",
  "未命名 (23).html",
  "未命名 (24).html",
  "未命名 (25).html",
  "未命名 (26).html【最终版本】",
  "未命名 (27).html",
  "未命名 (28).html",
  "未命名 (29).html",
  "未命名 (30).html",
  "未命名 (31).html",
  "未命名 (32).html",
  "未命名 (33).html",
  "未命名 (34).html",
  "未命名 (35).html",
  "未命名 (36).html",
  "未命名 (37).html",
  "未命名 (38).html",
  "未命名 (39).html",
  "未命名 (40).html",
  "未命名 (41).html",
  "web1.html",
  "web1 (1).html",
  "web1 (2).html",
  "web1 (3).html",
  "web1 (4).html",
  "web1 (5).html",
  "web1 (6).html",
  "web1 (7).html",
  "web1 (8).html",
  "web1 (9).html",
  "web1 (10).html"
];

// 生成下拉框
for(let f of allFiles){
  let val = f.replace("【最终版本】","").trim();
  list.innerHTML += `<option value="${val}">${f}</option>`;
}

// 切换加载
list.addEventListener('change', ()=>{
  let name = list.value;
  if(!name){ iframe.src = ""; return; }
  iframe.src = base + encodeURIComponent(name);
});

// 循环下一个（无限循环 1→41→1）
function nextFile(){
  let total = list.options.length;
  if(total <= 1) return;
  let idx = list.selectedIndex + 1;
  if(idx >= total) idx = 1;
  list.selectedIndex = idx;
  list.dispatchEvent(new Event("change"));
}

// 刷新
function refreshIframe(){
  if(!iframe.src) return;
  let tmp = iframe.src;
  iframe.src = "";
  setTimeout(()=>{iframe.src = tmp},20);
}

// 全屏
function toggleFull(){
  if(document.fullscreenElement){
    document.exitFullscreen();
  }else{
    document.documentElement.requestFullscreen().catch(()=>{});
  }
}
</script>

</body>
</html>
