<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D 物理沙盒 - 最终修复版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      overflow: hidden; 
      background: #000; 
      user-select: none; 
      -webkit-user-select: none; 
    }
    canvas { display: block; }
    
    #start-overlay {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.7); 
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      cursor: pointer;
      visibility: visible;
      transition: visibility 0s, opacity 0.5s;
    }
    #start-overlay.hidden {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }
    
    #start-box {
      background: rgba(30,30,50,0.95); border: 2px solid rgba(255,255,255,0.2);
      border-radius: 20px; padding: 40px 50px; text-align: center; color: #fff;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8); transition: transform 0.2s;
    }
    #start-box:hover { transform: scale(1.02); border-color: #ff6b6b; }
    #start-box:active { transform: scale(0.98); }
    #start-box h1 { font-size: 2rem; margin-bottom: 15px; }
    #start-box .subtitle { color: #ff6b6b; font-size: 1.1rem; margin-bottom: 15px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
    #start-box p { color: #aaa; margin: 5px 0; font-size: 0.9rem; }
    
    .hud {
      position: fixed; z-index: 20; pointer-events: none;
      color: #fff; background: rgba(20,20,40,0.85);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 20px;
      padding: 10px 20px;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      visibility: hidden;
      opacity: 0;
      transition: visibility 0s 0.3s, opacity 0.3s;
    }
    .hud.visible {
      visibility: visible;
      opacity: 1;
      transition: visibility 0s, opacity 0.3s;
    }
    #hud-top { top: 15px; left: 50%; transform: translateX(-50%); font-size: 0.85rem; }
    #hud-bottom { bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 0.75rem; display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
    
    .shape-dot { width: 14px; height: 14px; border-radius: 3px; display: inline-block; border: 2px solid rgba(255,255,255,0.5); }
    .shape-dot.sphere, .shape-dot.cone, .shape-dot.torus { border-radius: 50%; }
    
    .key { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; padding: 2px 6px; font-size: 0.7rem; font-weight: bold; margin: 0 2px; }
    
    #stats {
      position: fixed; top: 15px; left: 15px; z-index: 30;
      color: #fff; font-size: 0.7rem; font-family: monospace;
      background: rgba(0,0,0,0.6); padding: 5px 12px; border-radius: 10px;
      visibility: hidden;
      opacity: 0;
      transition: visibility 0s 0.3s, opacity 0.3s;
    }
    #stats.visible {
      visibility: visible;
      opacity: 1;
      transition: visibility 0s, opacity 0.3s;
    }
    
    #death-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200;
      display: flex; align-items: center; justify-content: center;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transition: visibility 0s 0.4s, opacity 0.4s;
    }
    #death-overlay.active {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      transition: visibility 0s, opacity 0.4s;
    }
    
    #death-box {
      background: rgba(30,30,50,0.95); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px; padding: 30px 40px; text-align: center; color: #fff;
    }
    #death-box h2 { color: #ff6b6b; margin-bottom: 10px; }
    #death-box button {
      background: #ff6b6b; border: none; color: #fff; font-weight: bold;
      padding: 10px 25px; border-radius: 20px; cursor: pointer; margin-top: 10px;
      transition: background 0.2s;
    }
    #death-box button:hover { background: #ff8787; }
    
    /* ========== 核心修复：面板永不模糊、显示正常 ========== */
    #cheat-panel {
      position: fixed; top: 20px; right: 20px; z-index: 500;
      width: 260px; background: #0a0a0a; border: 1px solid #0f0;
      font-family: monospace; color: #0f0; padding: 12px;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transition: visibility 0s 0.2s, opacity 0.2s;
      max-height: 80vh; overflow-y: auto;
      box-shadow: 0 0 15px rgba(0,255,0,0.3);
    }
    #cheat-panel.visible {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      transition: visibility 0s, opacity 0.2s;
    }
    #cheat-panel h3 { text-align: center; border-bottom: 1px dashed #0f0; padding-bottom: 5px; margin-bottom: 10px; font-size: 0.9rem; }
    
    .cheat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; font-size: 0.7rem; }
    .cheat-row input[type="checkbox"] { accent-color: #0f0; }
    .cheat-row input[type="range"] { width: 80px; accent-color: #0f0; }
    .cheat-row input[type="number"] { width: 50px; background: #111; border: 1px solid #0f0; color: #0f0; text-align: center; }
    
    .cheat-btn {
      width: 100%; margin-top: 6px; padding: 5px;
      background: #0a0a0a; border: 1px solid #0f0; color: #0f0;
      cursor: pointer; font-family: monospace; font-weight: bold;
      transition: all 0.2s; text-transform: uppercase; font-size: 0.75rem;
    }
    .cheat-btn:hover { background: #0f0; color: #000; }
    
    .cheat-divider { border-top: 1px dashed #0f0; margin: 8px 0; }
    
    #cheat-script-input {
      width: 100%; background: #111; border: 1px solid #0f0; color: #0f0;
      font-family: monospace; font-size: 0.7rem; padding: 4px; resize: vertical;
      min-height: 40px; margin-top: 4px;
    }
  </style>
</head>

  <script>
    class SimplePhysics {
      constructor() {
        this.gravity = -12;
        this.bodies = [];
        this.groundY = -0.2;
      }
      createBody(x, y, z, mass = 1, size = 0.5) {
        const body = {
          position: { x, y, z },
          velocity: { x: 0, y: 0, z: 0 },
          mass,
          size,
          isStatic: mass === 0,
          isSleeping: false,
          sleepTimer: 0,
        };
        this.bodies.push(body);
        return body;
      }
      removeBody(body) {
        const idx = this.bodies.indexOf(body);
        if (idx !== -1) this.bodies.splice(idx, 1);
      }
      step(dt) {
        const subSteps = 3;
        const subDt = dt / subSteps;
        for (let s = 0; s < subSteps; s++) {
          for (const body of this.bodies) {
            if (body.isStatic || body.isSleeping) continue;
            body.velocity.y += this.gravity * subDt;
            const bottom = body.position.y - body.size;
            if (bottom < this.groundY) {
              body.position.y = this.groundY + body.size;
              if (body.velocity.y < 0) {
                body.velocity.y *= -0.3;
                body.velocity.x *= 0.8;
                body.velocity.z *= 0.8;
              }
            }
            const limit = 17.5;
            if (Math.abs(body.position.x) > limit) {
              body.position.x = Math.sign(body.position.x) * limit;
              body.velocity.x *= -0.3;
            }
            if (Math.abs(body.position.z) > limit) {
              body.position.z = Math.sign(body.position.z) * limit;
              body.velocity.z *= -0.3;
            }
            body.position.x += body.velocity.x * subDt;
            body.position.y += body.velocity.y * subDt;
            body.position.z += body.velocity.z * subDt;
            body.velocity.x *= 0.995;
            body.velocity.y *= 0.995;
            body.velocity.z *= 0.995;
            const speed = Math.sqrt(body.velocity.x ** 2 + body.velocity.y ** 2 + body.velocity.z ** 2);
            if (speed < 0.01) {
              body.sleepTimer += subDt;
              if (body.sleepTimer > 1) {
                body.isSleeping = true;
                body.velocity.x = body.velocity.y = body.velocity.z = 0;
              }
            } else {
              body.sleepTimer = 0;
            }
          }
          for (let i = 0; i < this.bodies.length; i++) {
            for (let j = i + 1; j < this.bodies.length; j++) {
              const a = this.bodies[i];
              const b = this.bodies[j];
              if (a.isSleeping && b.isSleeping) continue;
              if (a.isStatic && b.isStatic) continue;
              const dx = b.position.x - a.position.x;
              const dy = b.position.y - a.position.y;
              const dz = b.position.z - a.position.z;
              const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
              const minDist = a.size + b.size;
              if (dist < minDist && dist > 0.001) {
                const nx = dx / dist;
                const ny = dy / dist;
                const nz = dz / dist;
                const overlap = minDist - dist;
                if (!a.isStatic && !b.isStatic) {
                  const totalMass = a.mass + b.mass;
                  a.position.x -= nx * overlap * (b.mass / totalMass);
                  a.position.y -= ny * overlap * (b.mass / totalMass);
                  a.position.z -= nz * overlap * (b.mass / totalMass);
                  b.position.x += nx * overlap * (a.mass / totalMass);
                  b.position.y += ny * overlap * (a.mass / totalMass);
                  b.position.z += nz * overlap * (a.mass / totalMass);
                } else if (a.isStatic) {
                  b.position.x += nx * overlap;
                  b.position.y += ny * overlap;
                  b.position.z += nz * overlap;
                } else if (b.isStatic) {
                  a.position.x -= nx * overlap;
                  a.position.y -= ny * overlap;
                  a.position.z -= nz * overlap;
                }
                a.isSleeping = false; a.sleepTimer = 0;
                b.isSleeping = false; b.sleepTimer = 0;
              }
            }
          }
        }
      }
      applyForce(body, fx, fy, fz) {
        if (body.isStatic) return;
        body.isSleeping = false; body.sleepTimer = 0;
        body.velocity.x += fx / body.mass;
        body.velocity.y += fy / body.mass;
        body.velocity.z += fz / body.mass;
      }
      applyImpulse(body, ix, iy, iz) {
        if (body.isStatic) return;
        body.isSleeping = false; body.sleepTimer = 0;
        body.velocity.x += ix / body.mass;
        body.velocity.y += iy / body.mass;
        body.velocity.z += iz / body.mass;
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    const physics = new SimplePhysics();
    console.log('✅ 物理引擎就绪');

    const startOverlay = document.getElementById('start-overlay');
    const startBox = document.getElementById('start-box');
    const hudTop = document.getElementById('hud-top');
    const hudBottom = document.getElementById('hud-bottom');
    const shapeDot = document.getElementById('shape-dot');
    const shapeNameEl = document.getElementById('shape-name');
    const colorDot = document.getElementById('color-dot');
    const deathOverlay = document.getElementById('death-overlay');
    const respawnBtn = document.getElementById('respawn-btn');
    const cheatPanel = document.getElementById('cheat-panel');
    const stats = document.getElementById('stats');
    const objCountSpan = document.getElementById('obj-count');
    const fpsSpan = document.getElementById('fps-val');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#87CEEB');
    scene.fog = new THREE.Fog('#87CEEB', 45, 130);
    const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 1.6, 10);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight('#bcd4f0', 0.8));
    const sun = new THREE.DirectionalLight('#fff8e7', 4.5);
    sun.position.set(20, 30, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 1024;
    sun.shadow.mapSize.height = 1024;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 100;
    sun.shadow.camera.left = -30;
    sun.shadow.camera.right = 30;
    sun.shadow.camera.top = 30;
    sun.shadow.camera.bottom = -30;
    scene.add(sun);

    const sharedGeos = {
      cube: new THREE.BoxGeometry(0.95, 0.95, 0.95),
      sphere: new THREE.SphereGeometry(0.48, 20, 20),
      cylinder: new THREE.CylinderGeometry(0.48, 0.48, 0.95, 20),
      cone: new THREE.ConeGeometry(0.48, 0.95, 20),
      torus: new THREE.TorusGeometry(0.4, 0.18, 10, 20),
    };
    const groundMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(36, 36),
      new THREE.MeshStandardMaterial({ color: '#d5c4a1', roughness: 0.75 })
    );
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.position.y = -0.2;
    groundMesh.receiveShadow = true;
    groundMesh.name = 'ground';
    scene.add(groundMesh);
    scene.add(new THREE.GridHelper(36, 36, '#c4b99a', '#e0d5c0'));

    const shapeTypes = ['cube', 'sphere', 'cylinder', 'cone', 'torus'];
    const shapeNames = ['立方体', '球体', '圆柱体', '圆锥', '圆环'];
    let shapeIndex = 0;
    const colors = [
      '#ff6b6b', '#ff9f43', '#feca57', '#54a0ff', '#5f27cd',
      '#00d2d3', '#55efc4', '#fd79a8', '#ffffff', '#e056a0',
    ];
    let colorIndex = 0;
    const getType = () => shapeTypes[shapeIndex];
    const getColor = () => colors[colorIndex];
    function updateHUD() {
      shapeDot.style.background = getColor();
      shapeDot.className = 'shape-dot ' + getType();
      shapeNameEl.textContent = shapeNames[shapeIndex];
      colorDot.style.background = getColor();
    }
    updateHUD();

    const placedShapes = [];
    const allPlaceables = [groundMesh];
    const undoStack = [];
    function createPlacedShape(type, color, pos, skipAnim = false) {
      const geo = sharedGeos[type] || sharedGeos.cube;
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.05 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(pos);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.name = 'placed-shape';
      const body = physics.createBody(pos.x, pos.y, pos.z, 1, 0.48);
      mesh.userData.body = body;
      body.userData = { mesh };
      scene.add(mesh);
      const entry = { mesh, body };
      placedShapes.push(entry);
      allPlaceables.push(mesh);
      if (!skipAnim) {
        mesh.scale.set(0.01, 0.01, 0.01);
        const t0 = performance.now();
        function anim(now) {
          const t = Math.min((now - t0) / 180, 1);
          mesh.scale.setScalar(1 - Math.pow(1 - t, 3));
          if (t < 1) requestAnimationFrame(anim);
          else mesh.scale.setScalar(1);
        }
        requestAnimationFrame(anim);
      }
      return entry;
    }
    function removeEntry(entry) {
      if (!entry) return;
      physics.removeBody(entry.body);
      scene.remove(entry.mesh);
      const i = placedShapes.indexOf(entry);
      if (i !== -1) placedShapes.splice(i, 1);
      const j = allPlaceables.indexOf(entry.mesh);
      if (j !== -1) allPlaceables.splice(j, 1);
      if (entry.mesh.material) entry.mesh.material.dispose();
    }

    [
      ['cube', 3, 1, -2, '#ff6b6b'],
      ['cube', 3, 2, -2, '#ff9f43'],
      ['sphere', -3, 1, 1, '#4ecdc4'],
      ['cylinder', 0, 1, -4, '#ffe66d'],
      ['cube', -1, 1, -3, '#a29bfe'],
      ['sphere', 5, 1, 3, '#55efc4'],
    ].forEach(([t, x, y, z, c]) => {
      createPlacedShape(t, c, new THREE.Vector3(x, y, z), true);
    });

    const previewMat = new THREE.MeshStandardMaterial({
      color: getColor(),
      roughness: 0.3,
      transparent: true,
      opacity: 0.35,
      depthWrite: false,
    });
    const previewMesh = new THREE.Mesh(sharedGeos.cube, previewMat);
    previewMesh.visible = false;
    previewMesh.renderOrder = 999;
    scene.add(previewMesh);
    function refreshPreview() {
      previewMesh.geometry = sharedGeos[getType()] || sharedGeos.cube;
      previewMat.color.set(getColor());
    }
    refreshPreview();

    const raycaster = new THREE.Raycaster();
    raycaster.far = 30;
    function getPlacement() {
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const hits = raycaster.intersectObjects(allPlaceables, false);
      if (hits.length > 0) {
        const p = hits[0].point.clone();
        const n = hits[0].face.normal.clone().transformDirection(hits[0].object.matrixWorld);
        const pos = p.add(n.multiplyScalar(0.475));
        pos.x = THREE.MathUtils.clamp(pos.x, -17.5, 17.5);
        pos.z = THREE.MathUtils.clamp(pos.z, -17.5, 17.5);
        pos.y = Math.max(pos.y, 0.3);
        return { pos, valid: true };
      }
      return { pos: null, valid: false };
    }

    const euler = new THREE.Euler(0, 0, 0, 'YXZ');
    euler.setFromQuaternion(camera.quaternion);
    let mouseSensitivity = 0.002;

    document.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement !== renderer.domElement) return;
      if (isDead) return;
      const mx = e.movementX || e.mozMovementX || e.webkitMovementX || 0;
      const my = e.movementY || e.mozMovementY || e.webkitMovementY || 0;
      euler.setFromQuaternion(camera.quaternion);
      euler.y -= mx * mouseSensitivity;
      euler.x -= my * mouseSensitivity;
      euler.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, euler.x));
      camera.quaternion.setFromEuler(euler);
    });

    const playerBody = physics.createBody(0, 1, 8, 1, 0.35);
    let isLocked = false;
    let isDead = false;
    let panelVisible = false;
    let cheatFly = false;
    let cheatGod = false;
    let cheatRange = false;
    let cheatAuto = false;
    let moveSpeed = 8;
    let jumpForce = 8;
    let forceStrength = 1500;
    let timeFreeze = false;
    let thirdPerson = false;
    const keys = {};

    function isOnGround() {
      return cheatFly || playerBody.position.y <= 0.36;
    }
    function resetPlayer() {
      playerBody.position.x = 0;
      playerBody.position.y = 1;
      playerBody.position.z = 8;
      playerBody.velocity.x = 0;
      playerBody.velocity.y = 0;
      playerBody.velocity.z = 0;
      camera.position.set(0, 1.6, 8);
      euler.set(0, 0, 0, 'YXZ');
      camera.quaternion.setFromEuler(euler);
    }
    function die() {
      if (isDead || cheatGod) return;
      isDead = true;
      document.exitPointerLock();
      deathOverlay.classList.add('active');
      startOverlay.classList.add('hidden');
    }
    function respawn() {
      isDead = false;
      deathOverlay.classList.remove('active');
      resetPlayer();
      renderer.domElement.requestPointerLock();
    }

    document.addEventListener('pointerlockchange', () => {
      if (document.pointerLockElement === renderer.domElement) {
        isLocked = true;
        startOverlay.classList.add('hidden');
        hudTop.classList.add('visible');
        hudBottom.classList.add('visible');
        stats.classList.add('visible');
        previewMesh.visible = true;
        console.log('✅ 游戏已开始');
      } else {
        isLocked = false;
        if (!isDead) startOverlay.classList.remove('hidden');
        hudTop.classList.remove('visible');
        hudBottom.classList.remove('visible');
        stats.classList.remove('visible');
        previewMesh.visible = false;
      }
    });

    startBox.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!isLocked && !isDead) {
        renderer.domElement.requestPointerLock();
      }
    });

    // ========== 核心修复：按 ~ 自动弹出鼠标 ==========
    document.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Digit1') { shapeIndex = 0; updateHUD(); refreshPreview(); }
      if (e.code === 'Digit2') { shapeIndex = 1; updateHUD(); refreshPreview(); }
      if (e.code === 'Digit3') { shapeIndex = 2; updateHUD(); refreshPreview(); }
      if (e.code === 'Digit4') { shapeIndex = 3; updateHUD(); refreshPreview(); }
      if (e.code === 'Digit5') { shapeIndex = 4; updateHUD(); refreshPreview(); }
      if (e.code === 'KeyR' && !e.ctrlKey && !e.metaKey) {
        if (isDead) { respawn(); return; }
        colorIndex = (colorIndex + 1) % colors.length;
        updateHUD(); refreshPreview();
      }
      if (e.code === 'Space' && isLocked && !isDead && isOnGround()) {
        e.preventDefault();
        if (!cheatFly) playerBody.velocity.y = jumpForce;
      }
      // 修复：按 ~ 打开面板 → 强制退出指针锁定，鼠标出现
      if (e.code === 'Backquote') {
        e.preventDefault();
        panelVisible = !panelVisible;
        cheatPanel.classList.toggle('visible', panelVisible);
        if (panelVisible) {
          document.exitPointerLock();
        }
      }
      if (e.code === 'Enter' && panelVisible) { e.preventDefault(); execScript(); }
      if (e.code === 'KeyZ' && (e.ctrlKey || e.metaKey) && isLocked && !isDead) {
        e.preventDefault(); if (undoStack.length > 0) undoStack.pop()?.entries?.forEach(removeEntry);
      }
      if (e.code === 'ControlLeft' || e.code === 'ControlRight') {
        e.preventDefault(); timeFreeze = !timeFreeze;
      }
      if (e.code === 'KeyC') { thirdPerson = !thirdPerson; }
      if (e.code === 'KeyV') { vacuumToPlayer(); }
      if (e.code === 'KeyN') {
        physics.gravity = physics.gravity < 0 ? 4 : -12;
        document.getElementById('cheat-gravity').value = physics.gravity;
      }
    });
    document.addEventListener('keyup', (e) => { keys[e.code] = false; });

    document.addEventListener('wheel', (e) => {
      if (!isLocked || isDead) return;
      e.preventDefault();
      shapeIndex = (shapeIndex + (e.deltaY > 0 ? 1 : -1) + shapeTypes.length) % shapeTypes.length;
      updateHUD(); refreshPreview();
    }, { passive: false });

    document.addEventListener('mousedown', (e) => {
      if (!isLocked || isDead) return;
      if (e.button === 0) {
        const info = getPlacement();
        if (info.valid && info.pos && (cheatRange || info.pos.distanceTo(camera.position) >= 0.9)) {
          const entry = createPlacedShape(getType(), getColor(), info.pos);
          undoStack.push({ entries: [entry] });
        }
      }
      if (e.button === 2) {
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        const hits = raycaster.intersectObjects(allPlaceables, false);
        if (hits.length > 0 && hits[0].object.name === 'placed-shape') {
          const entry = placedShapes.find(s => s.mesh === hits[0].object);
          if (entry) removeEntry(entry);
        }
      }
    });
    document.addEventListener('contextmenu', e => e.preventDefault());

    // ========== 修复：G吸引 H推远 ==========
    function applyForce(attract) {
      const pp = playerBody.position;
      placedShapes.forEach(({ body }) => {
        const dx = body.position.x - pp.x;
        const dy = body.position.y - pp.y;
        const dz = body.position.z - pp.z;
        const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
        if (dist < 8 && dist > 0.3) {
          const s = (1 - dist/8) * forceStrength;
          const invDist = 1/dist;
          const fx = attract ? -dx*invDist*s : dx*invDist*s;
          const fy = attract ? -dy*invDist*s : dy*invDist*s;
          const fz = attract ? -dz*invDist*s : dz*invDist*s;
          physics.applyForce(body, fx, fy, fz);
        }
      });
    }
    function explode() {
      const pp = playerBody.position;
      placedShapes.forEach(({ body }) => {
        const dx = body.position.x - pp.x;
        const dy = body.position.y - pp.y;
        const dz = body.position.z - pp.z;
        const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
        if (dist < 10 && dist > 0.3) {
          const s = (1 - dist/10) * forceStrength * 0.7;
          const invDist = 1/dist;
          physics.applyImpulse(body, dx*invDist*s, (dy+0.5)*invDist*s, dz*invDist*s);
        }
      });
    }
    function vacuumToPlayer() {
      const pp = playerBody.position;
      placedShapes.forEach(({ body }) => {
        const dx = pp.x - body.position.x;
        const dy = pp.y + 0.5 - body.position.y;
        const dz = pp.z - body.position.z;
        const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
        if (dist > 1 && dist < 15) {
          physics.applyImpulse(body, dx*12, dy*12, dz*12);
        }
      });
    }

    function execScript() {
      const code = document.getElementById('cheat-script-input').value;
      if (!code.trim()) return;
      try {
        const ctx = {
          physics, scene, camera, playerBody, placedShapes,
          createPlacedShape, removeEntry, getColor, getType,
          setGravity: v => { physics.gravity = v; document.getElementById('cheat-gravity').value = v; },
          setSpeed: v => { moveSpeed = v; document.getElementById('cheat-speed').value = v; },
          spawnSphere: (x,y,z,c) => createPlacedShape('sphere',c||getColor(),new THREE.Vector3(x,y,z)),
          clearAll: () => { while(placedShapes.length) removeEntry(placedShapes[0]); undoStack.length=0; },
          log: msg => console.log('[脚本]',msg),
        };
        new Function(...Object.keys(ctx), code)(...Object.values(ctx));
        console.log('✅ 脚本执行成功');
      } catch(err) { console.error('❌ 脚本错误:',err); }
    }

    document.getElementById('cheat-fly').addEventListener('change',e=>{cheatFly=e.target.checked;});
    document.getElementById('cheat-god').addEventListener('change',e=>{cheatGod=e.target.checked;});
    document.getElementById('cheat-range').addEventListener('change',e=>{cheatRange=e.target.checked;});
    document.getElementById('cheat-auto').addEventListener('change',e=>{cheatAuto=e.target.checked;});
    document.getElementById('cheat-gravity').addEventListener('input',e=>{physics.gravity=parseFloat(e.target.value);});
    document.getElementById('cheat-speed').addEventListener('input',e=>{moveSpeed=parseFloat(e.target.value);});
    document.getElementById('cheat-jump').addEventListener('input',e=>{jumpForce=parseFloat(e.target.value);});
    document.getElementById('cheat-force').addEventListener('input',e=>{forceStrength=parseFloat(e.target.value);});
    document.getElementById('btn-spawn-batch').addEventListener('click',()=>{
      const n=Math.min(parseInt(document.getElementById('cheat-batch').value)||100,500);
      const t=getType();const c=getColor();
      const dir=new THREE.Vector3();camera.getWorldDirection(dir);
      const base=camera.position.clone().add(dir.multiplyScalar(3));
      const batch=[];
      for(let i=0;i<n;i++){
        const a=(i/n)*Math.PI*2+Math.random()*0.3;
        const r=1.5+Math.random()*3.5;
        batch.push(createPlacedShape(t,c,new THREE.Vector3(
          base.x+Math.cos(a)*r,base.y+Math.random()*2.5,base.z+Math.sin(a)*r
        ),true));
      }
      undoStack.push({entries:batch});
    });
    document.getElementById('btn-clear').addEventListener('click',()=>{
      while(placedShapes.length)removeEntry(placedShapes[0]);undoStack.length=0;
    });
    document.getElementById('btn-random-color').addEventListener('click',()=>{
      colorIndex=Math.floor(Math.random()*colors.length);updateHUD();refreshPreview();
    });
    document.getElementById('btn-exec-script').addEventListener('click',execScript);
    respawnBtn.addEventListener('click',respawn);

    const clock=new THREE.Clock();
    let fpsFrames=0;let fpsTime=performance.now();
    let previewTimer=0;
    function animate(){
      requestAnimationFrame(animate);
      const dt=Math.min(clock.getDelta(),0.2);
      if(isLocked&&!isDead&&!timeFreeze){
        if(keys.KeyG)applyForce(true);
        if(keys.KeyH)applyForce(false);
        if(keys.KeyB)explode();
        if(cheatAuto){
          if(!keys._autoT)keys._autoT=0;keys._autoT+=dt;
          if(keys._autoT>0.1){keys._autoT=0;
            const info=getPlacement();
            if(info.valid&&info.pos)undoStack.push({entries:[createPlacedShape(getType(),getColor(),info.pos)]});
          }
        }
        if(cheatFly){
          let f=0,r=0,u=0;
          if(keys.KeyW)f++;if(keys.KeyS)f--;
          if(keys.KeyA)r--;if(keys.KeyD)r++;
          if(keys.Space)u++;if(keys.ShiftLeft||keys.ShiftRight)u--;
          const fwd=new THREE.Vector3();camera.getWorldDirection(fwd);fwd.y=0;
          if(fwd.length()>0.001)fwd.normalize();
          const right=new THREE.Vector3().crossVectors(fwd,new THREE.Vector3(0,1,0)).normalize();
          const move=new THREE.Vector3().addScaledVector(fwd,f).addScaledVector(right,r);move.y+=u;
          if(move.length()>0.001){move.normalize().multiplyScalar(moveSpeed*dt);
            playerBody.position.x+=move.x;playerBody.position.y+=move.y;playerBody.position.z+=move.z;
          }
          camera.position.set(playerBody.position.x,playerBody.position.y+0.6,playerBody.position.z);
        }else{
          let f=0,r=0;
          if(keys.KeyW)f++;if(keys.KeyS)f--;
          if(keys.KeyA)r--;if(keys.KeyD)r++;
          const fwd=new THREE.Vector3();camera.getWorldDirection(fwd);fwd.y=0;
          if(fwd.length()>0.001)fwd.normalize();
          const right=new THREE.Vector3().crossVectors(fwd,new THREE.Vector3(0,1,0)).normalize();
          const dir=new THREE.Vector3().addScaledVector(fwd,f).addScaledVector(right,r);
          if(dir.length()>0.001){dir.normalize();playerBody.velocity.x=dir.x*moveSpeed;playerBody.velocity.z=dir.z*moveSpeed;}
          playerBody.position.x=THREE.MathUtils.clamp(playerBody.position.x,-17.5,17.5);
          playerBody.position.z=THREE.MathUtils.clamp(playerBody.position.z,-17.5,17.5);
        }
        previewTimer+=dt;
        if(previewTimer>0.05){previewTimer=0;
          const info=getPlacement();
          if(info.valid&&info.pos&&(cheatRange||info.pos.distanceTo(camera.position)>=0.9)){
            previewMesh.position.copy(info.pos);previewMesh.visible=true;previewMat.color.set(getColor());
          }else{previewMesh.visible=false;}
        }
      }
      if(!timeFreeze)physics.step(dt);
      placedShapes.forEach(({mesh,body})=>{mesh.position.set(body.position.x,body.position.y,body.position.z);});
      if(!cheatFly&&isLocked)camera.position.set(playerBody.position.x,playerBody.position.y+0.6,playerBody.position.z);
      if(!isDead&&!cheatGod&&playerBody.position.y<-15)die();
      fpsFrames++;
      const now=performance.now();
      if(now-fpsTime>=500){
        const fps=Math.round(fpsFrames/((now-fpsTime)/1000));
        fpsFrames=0;fpsTime=now;
        objCountSpan.textContent=placedShapes.length;
        fpsSpan.textContent=fps;
      }
      renderer.render(scene,camera);
    }
    window.addEventListener('resize',()=>{
      camera.aspect=window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth,window.innerHeight);
    });
    resetPlayer();refreshPreview();updateHUD();requestAnimationFrame(animate);
    console.log('✅ 3D物理沙盒 最终修复版启动成功！');
    console.log('✅ 按 ~ 打开面板，鼠标自动出现');
    console.log('✅ ESC退出，面板永不模糊');
    console.log('✅ G吸引 H推远 正常');
  </script>
</body>
</html>
