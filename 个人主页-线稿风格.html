<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="qaq_2_30_awa — 线稿风格个人主页">
  <title>qaq_2_30_awa / 线稿</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fafafa">
  <style>
    /* ============================================================
       线稿风格 — 统一轮廓线，无实心填充
       ============================================================ */
    @font-face {
      font-family: "SongPUA";
      src: url("宋体pua字体.ttc") format("truetype");
      font-weight: 100 900;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --line: #1a1a1a;
      --line-soft: #1a1a1a;
      --bg: #fafafa;
      --bg-card: #ffffff;
      --text: #1a1a1a;
      --text-muted: #6b6b6b;
      --text-faint: #9a9a9a;
      --line-width: 1.5px;
      --line-width-thick: 2px;
      --radius: 4px;
      --radius-sm: 2px;
      --font: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", "SongPUA", "PingFang SC", "Microsoft YaHei", sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --touch-min: 44px;
    }

    :root[data-theme="dark"] {
      --line: #e8e8e8;
      --line-soft: #e8e8e8;
      --bg: #121212;
      --bg-card: #1a1a1a;
      --text: #e8e8e8;
      --text-muted: #9a9a9a;
      --text-faint: #6b6b6b;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      font-weight: 400;
      overscroll-behavior: none;
      transition: background-color 0.2s, color 0.2s;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      overflow-x: hidden;
      overflow-y: auto;
      touch-action: pan-y;
      padding: 0 var(--safe-right) 0 var(--safe-left);
    }

    /* 取消所有填充和阴影 */
    * {
      border-radius: 0 !important;
      box-shadow: none !important;
      background-image: none !important;
    }

    /* 隐藏canvas */
    #water-canvas,
    #particle-canvas,
    #cursorGlow {
      display: none !important;
    }

    /* ============================================================
       轮廓线基础
       ============================================================ */
    .outline {
      border: var(--line-width) solid var(--line);
      background: transparent;
    }

    .outline-thick {
      border: var(--line-width-thick) solid var(--line);
      background: transparent;
    }

    .outline-dashed {
      border: var(--line-width) dashed var(--line);
      background: transparent;
    }

    /* 焦点状态 — 虚线框 */
    *:focus-visible {
      outline: var(--line-width) dashed var(--line);
      outline-offset: 2px;
      border-radius: var(--radius-sm) !important;
    }

    /* ============================================================
       页面容器
       ============================================================ */
    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 20px 60px;
      position: relative;
    }

    /* ============================================================
       加载
       ============================================================ */
    #boot {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.3s;
    }

    #boot.gone {
      opacity: 0;
      pointer-events: none;
    }

    .boot-ring {
      width: 56px;
      height: 56px;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.5;
      opacity: 0.15;
    }

    .ring-fg {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      transition: stroke-dashoffset 0.3s;
    }

    .boot-pct {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* ============================================================
       刊头
       ============================================================ */
    .masthead {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      padding: 20px 0;
      border-bottom: var(--line-width) solid var(--line);
      margin-bottom: 28px;
    }

    .masthead-title {
      flex: 1 1 auto;
      min-width: 200px;
    }

    .masthead-title h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--text);
    }

    .masthead-title .sub {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      margin-top: 2px;
      display: block;
    }

    .masthead-meta {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .masthead-meta .dot {
      width: 6px;
      height: 6px;
      border: var(--line-width) solid var(--line);
      border-radius: 50% !important;
    }

    /* ============================================================
       时间栏 — 线条构成
       ============================================================ */
    .timebar {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: var(--line-width) solid var(--line);
    }

    .time-card {
      flex: 1 1 200px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 12px 0;
      border-left: var(--line-width) solid var(--line);
      padding-left: 16px;
    }

    .time-card .greet {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .time-card .clock {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .time-card .clock .sec {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-muted);
      margin-left: 4px;
    }

    .time-card .date {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    /* ============================================================
       头版 — 头像线稿
       ============================================================ */
    .frontpage {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      margin-bottom: 32px;
      align-items: center;
    }

    .avatar-frame {
      flex: 0 0 120px;
      width: 120px;
      height: 120px;
      border: var(--line-width) solid var(--line);
      border-radius: 50% !important;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .avatar-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(100%) contrast(1.1);
      pointer-events: none;
    }

    /* 头像轮廓装饰线 */
    .avatar-frame::after {
      content: "";
      position: absolute;
      inset: -6px;
      border: var(--line-width) dashed var(--line);
      border-radius: 50% !important;
      opacity: 0.3;
      pointer-events: none;
    }

    .intro-block {
      flex: 1 1 260px;
    }

    .intro-block h2 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
      color: var(--text);
    }

    .intro-block .bio {
      font-size: 14px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--text-muted);
      max-width: 50ch;
    }

    .intro-block .bio strong {
      color: var(--text);
      font-weight: 600;
    }

    /* ============================================================
       区段标题 — 线条
       ============================================================ */
    .section-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 32px 0 16px;
    }

    .section-head .marker {
      width: 8px;
      height: 8px;
      border: var(--line-width) solid var(--line);
      border-radius: 50% !important;
      flex-shrink: 0;
    }

    .section-head h3 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
    }

    .section-head .line {
      flex: 1;
      height: 0;
      border-top: var(--line-width) solid var(--line);
      opacity: 0.15;
    }

    /* ============================================================
       项目列表 — 线稿卡片
       ============================================================ */
    .work-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .work-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border: var(--line-width) solid var(--line);
      border-radius: var(--radius) !important;
      background: transparent;
      transition: transform 0.15s, border-style 0.15s;
      min-height: var(--touch-min);
      cursor: default;
    }

    .work-item:active {
      transform: scale(0.96);
    }

    .work-dot {
      width: 10px;
      height: 10px;
      border: var(--line-width) solid var(--line);
      border-radius: 50% !important;
      flex-shrink: 0;
    }

    .work-item .work-name {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: var(--text);
      min-width: 80px;
    }

    .work-item .work-desc {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-muted);
      margin-left: auto;
      text-align: right;
    }

    .tag-new {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: var(--line-width) solid var(--line);
      padding: 1px 6px;
      border-radius: var(--radius-sm) !important;
      margin-left: 8px;
      color: var(--text);
    }

    /* ============================================================
       技能 — 线稿标签
       ============================================================ */
    .skill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .skill-tag {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.03em;
      padding: 6px 14px;
      border: var(--line-width) solid var(--line);
      border-radius: var(--radius) !important;
      background: transparent;
      color: var(--text);
      transition: transform 0.12s;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      cursor: default;
    }

    .skill-tag:active {
      transform: scale(0.96);
    }

    /* ============================================================
       链接 — 线稿按钮
       ============================================================ */
    .link-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }

    .link-block {
      flex: 1 1 180px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border: var(--line-width) solid var(--line);
      border-radius: var(--radius) !important;
      background: transparent;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.12s, border-style 0.12s;
      min-height: var(--touch-min);
      position: relative;
    }

    .link-block:active {
      transform: scale(0.96);
      border-style: dashed;
    }

    .link-block:focus-visible {
      outline: var(--line-width) dashed var(--line);
      outline-offset: 2px;
    }

    .link-block .label {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .link-block .val {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-muted);
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ============================================================
       目录 — 线稿清单
       ============================================================ */
    .dir-section {
      margin-top: 16px;
    }

    .dir-reader {
      border: var(--line-width) solid var(--line);
      border-radius: var(--radius) !important;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .dir-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: var(--line-width) solid var(--line);
    }

    .dir-header h2 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .dir-header .stat {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      margin-left: auto;
    }

    .dir-btn {
      width: 32px;
      height: 32px;
      border: var(--line-width) solid var(--line);
      border-radius: var(--radius-sm) !important;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s, border-style 0.12s;
      font-family: var(--font);
      position: relative;
    }

    .dir-btn::after {
      content: "";
      position: absolute;
      inset: -6px;
    }

    .dir-btn:active {
      transform: scale(0.96);
      border-style: dashed;
    }

    .dir-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: var(--line-width) solid var(--line);
      align-items: center;
    }

    .dir-search {
      flex: 1 1 160px;
      position: relative;
    }

    .dir-search input {
      width: 100%;
      padding: 10px 12px 10px 34px;
      border: var(--line-width) solid var(--line);
      border-radius: var(--radius-sm) !important;
      background: transparent;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 400;
      color: var(--text);
      outline: none;
      transition: border-style 0.12s;
      min-height: 40px;
    }

    .dir-search input:focus {
      border-style: dashed;
    }

    .dir-search input::placeholder {
      color: var(--text-faint);
    }

    .dir-search .icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--text-muted);
      pointer-events: none;
      line-height: 1;
    }

    .dir-filters {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .dir-filter-btn {
      padding: 6px 14px;
      border: var(--line-width) solid var(--line);
      border-radius: var(--radius-sm) !important;
      background: transparent;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--text);
      cursor: pointer;
      transition: transform 0.12s, border-style 0.12s;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
    }

    .dir-filter-btn:active {
      transform: scale(0.96);
      border-style: dashed;
    }

    .dir-filter-btn.active {
      border-style: dashed;
    }

    .dir-status {
      padding: 8px 16px;
      font-size: 11px;
      font-weight: 400;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      border-bottom: var(--line-width) solid var(--line);
    }

    .dir-list {
      max-height: 400px;
      overflow-y: auto;
      padding: 4px 0;
    }

    .dir-list::-webkit-scrollbar {
      width: 6px;
    }

    .dir-list::-webkit-scrollbar-thumb {
      background: var(--line);
      border: 1px solid var(--bg);
    }

    .dir-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 400;
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid rgba(26, 26, 26, 0.1);
      transition: transform 0.12s, border-style 0.12s;
      cursor: pointer;
      position: relative;
      min-height: 40px;
    }

    :root[data-theme="dark"] .dir-item {
      border-bottom-color: rgba(232, 232, 232, 0.1);
    }

    .dir-item:last-child {
      border-bottom: none;
    }

    .dir-item:active {
      transform: scale(0.96);
    }

    .dir-item:focus-visible {
      outline: var(--line-width) dashed var(--line);
      outline-offset: -2px;
    }

    .dir-toggle {
      width: 10px;
      height: 10px;
      flex-shrink: 0;
      position: relative;
    }

    .dir-toggle::before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 4px 0 4px 6px;
      border-color: transparent transparent transparent var(--line);
      transition: transform 0.15s;
    }

    .dir-item-folder[aria-expanded="true"] .dir-toggle::before {
      transform: translateY(-50%) rotate(90deg);
    }

    .dir-item-file .dir-toggle {
      visibility: hidden;
    }

    .dir-item-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }

    .dir-item-icon svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .dir-item-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .dir-item-name {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dir-item-meta {
      font-size: 10px;
      color: var(--text-faint);
      display: flex;
      gap: 8px;
      letter-spacing: 0.02em;
    }

    .dir-item-actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.12s;
    }

    .dir-item-file:hover .dir-item-actions,
    .dir-item-file:focus-within .dir-item-actions {
      opacity: 1;
    }

    .dir-item-action {
      width: 24px;
      height: 24px;
      border: var(--line-width) solid var(--line);
      border-radius: var(--radius-sm) !important;
      background: transparent;
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.12s, border-style 0.12s;
    }

    .dir-item-action:active {
      transform: scale(0.96);
      border-style: dashed;
    }

    .dir-empty {
      padding: 32px 16px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* ============================================================
       底部
       ============================================================ */
    .footer {
      margin-top: 40px;
      padding: 20px 0 8px;
      border-top: var(--line-width) solid var(--line);
      font-size: 11px;
      font-weight: 400;
      color: var(--text-faint);
      letter-spacing: 0.02em;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .footer .line-deco {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .footer .line-deco span {
      display: block;
      width: 12px;
      height: 1.5px;
      background: var(--line);
    }

    /* ============================================================
       浮标 — 线稿按钮
       ============================================================ */
    .fab-group {
      position: fixed;
      right: 16px;
      bottom: calc(20px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 100;
    }

    .fab {
      width: 48px;
      height: 48px;
      border: var(--line-width) solid var(--line);
      border-radius: 50% !important;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s, border-style 0.12s;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      position: relative;
      overflow: visible;
    }

    .fab::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50% !important;
    }

    .fab:active {
      transform: scale(0.96);
      border-style: dashed;
    }

    .fab:focus-visible {
      outline: var(--line-width) dashed var(--line);
      outline-offset: 2px;
    }

    .fab .badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--bg);
      color: var(--text);
      font-size: 10px;
      font-weight: 600;
      min-width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: var(--line-width) solid var(--line);
      border-radius: 50% !important;
      padding: 0 4px;
      line-height: 1;
    }

    /* 字体菜单 */
    .font-menu {
      position: fixed;
      right: 76px;
      bottom: calc(76px + var(--safe-bottom));
      z-index: 110;
      background: var(--bg);
      border: var(--line-width) solid var(--line);
      border-radius: var(--radius) !important;

      border-radius: var(--radius-sm) !important;

      font-size: 12px;
      font-weight: 400;
      color: var(--text);

      width: 100%;
      text-align: left;
      min-height: 36px;
    }

    .font-item:active {
      transform: scale(0.96);
    }

    .font-item:focus-visible {
      outline: var(--line-width) dashed var(--line);
      outline-offset: -2px;
    }

    .font-item.active {
      border-style: dashed;
      border-color: var(--line);
    }

    .font-item .fi-dot {
      width: 6px;
      height: 6px;
      border: var(--line-width) solid var(--line);
      border-radius: 50% !important;
      flex-shrink: 0;
    }

    /* ============================================================
       导航弹窗 — 线稿面板
       ============================================================ */
    .nav-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(250, 250, 250, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(4px);
    }

    :root[data-theme="dark"] .nav-modal {
      background: rgba(18, 18, 18, 0.92);
    }

    .nav-modal.show {
      display: flex;
    }

    .nav-panel {
      width: 100%;
      max-width: 640px;
      max-height: 85vh;
      background: var(--bg);
      border: var(--line-width) solid var(--line);
      border-radius: var(--radius) !important;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .nav-head {
      padding: 16px 20px 12px;
      border-bottom: var(--line-width) solid var(--line);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .nav-head h2 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .nav-head .cnt {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-muted);
      border: var(--line-width) solid var(--line);
      padding: 1px 8px;
      border-radius: var(--radius-sm) !important;
    }

    .nav-close {
      margin-left: auto;
      width: 36px;
      height: 36px;
      border: var(--line-width) solid var(--line);
      border-radius: var(--radius-sm) !important;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s, border-style 0.12s;
      font-family: var(--font);
      position: relative;
    }

    .nav-close::after {
      content: "";
      position: absolute;
      inset: -4px;
    }

    .nav-close:active {
      transform: scale(0.96);
      border-style: dashed;
    }

    .nav-search {
      padding: 12px 20px;
      border-bottom: var(--line-width) solid var(--line);

      width: 100%;
      padding: 10px 14px;

      background: transparent;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 400;
      color: var(--text);

       ============================================================ */
    #toast {

    @media (max-width: 600px) {

</head>

      var v = Math.round(val);
      if (pct) pct.textContent = v + '%';
      if (ring) ring.style.strokeDashoffset = 100 - v;
      if (boot) boot.setAttribute('aria-valuenow', v);
    }
    function tick(){
      if (raf) return;
      raf = requestAnimationFrame(function step(){
        raf = 0;
        var d = target - val;
        if (Math.abs(d) < 0.4){
          val = target;
          render();
          if (val >= 100 && !finished){ finished = true; setTimeout(function(){
            boot.classList.add('gone');
            setTimeout(function(){ if (boot.parentNode) boot.parentNode.removeChild(boot); }, 400);
          }, 200); }
          return;
        }
        val += d * 0.14;
        render();
        raf = requestAnimationFrame(step);
      });
    }
    window.BootSet = function(v){ target = Math.max(target, v); tick(); };
    window.addEventListener('DOMContentLoaded', function(){ BootSet(45); });
    setTimeout(function(){ BootSet(100); }, 2500);
    render();
  })();

      if (m === 5 || m === 6 || m === 7) return '夏';

      return '冬';

    function slotOf(h){

<script>
(function(){
  var escapeHtml = function(s){
    return String(s).replace(/[&<>"']/g, function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  };

  // 纯 SVG 描边图标
  var SVG_FOLDER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
  var SVG_FILE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h8l6 6v14H6z"/><path d="M14 2v6h6"/></svg>';

  var State = {
    filtered: window.DIR_MANIFEST,
    searchTerm: '',
    filter: 'all',
    expanded: {},
    stats: { files: 0, folders: 0 }
  };
  (function countStats(){
    (function walk(items){
      items.forEach(function(it){
        if (it.type === 'folder'){ State.stats.folders++; if (it.children) walk(it.children); }
        else State.stats.files++;
      });
    })(window.DIR_MANIFEST);
  })();

  var listEl, statusEl, firstMount = true;

  function createUI(){
    var wrap = document.createElement('div');
    wrap.className = 'dir-reader';

    var header = document.createElement('div');
    header.className = 'dir-header';
    var title = document.createElement('h2');
    title.textContent = '索引';
    header.appendChild(title);

    var stat = document.createElement('span');
    stat.className = 'stat';
    stat.textContent = State.stats.folders + ' 个文件夹 / ' + State.stats.files + ' 个文件';
    header.appendChild(stat);

    var expandAll = document.createElement('button');
    expandAll.type = 'button';
    expandAll.className = 'dir-btn';
    expandAll.textContent = '⊞';
    expandAll.title = '展开全部';
    expandAll.setAttribute('aria-label','展开全部');
    header.appendChild(expandAll);

    var collapseAll = document.createElement('button');
    collapseAll.type = 'button';
    collapseAll.className = 'dir-btn';
    collapseAll.textContent = '⊟';
    collapseAll.title = '折叠全部';
    collapseAll.setAttribute('aria-label','折叠全部');
    header.appendChild(collapseAll);

    wrap.appendChild(header);

    var toolbar = document.createElement('div');
    toolbar.className = 'dir-toolbar';

    var searchWrap = document.createElement('div');
    searchWrap.className = 'dir-search';
    searchWrap.innerHTML = '<span class="icon">⌕</span>';
    var searchInput = document.createElement('input');
    searchInput.type = 'search';
    searchInput.placeholder = '搜索…';
    searchInput.setAttribute('aria-label','搜索文件');
    searchWrap.appendChild(searchInput);
    toolbar.appendChild(searchWrap);

    var filters = document.createElement('div');
    filters.className = 'dir-filters';
    ['all','folder','file'].forEach(function(f){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'dir-filter-btn' + (f === 'all' ? ' active' : '');
      btn.dataset.filter = f;
      btn.textContent = f === 'all' ? '全部' : (f === 'folder' ? '文件夹' : '文件');
      filters.appendChild(btn);
    });
    toolbar.appendChild(filters);
    wrap.appendChild(toolbar);

    var status = document.createElement('div');
    status.className = 'dir-status';
    wrap.appendChild(status);

    var list = document.createElement('div');
    list.className = 'dir-list';
    wrap.appendChild(list);

    wrap._statusEl = status;
    wrap._listEl = list;
    wrap._searchInput = searchInput;
    wrap._filters = filters;
    wrap._expandAllBtn = expandAll;
    wrap._collapseAllBtn = collapseAll;
    return wrap;
  }

  function setAllExpanded(open){
    (function walk(items){
      items.forEach(function(it){
        if (it.type === 'folder'){
          State.expanded[it.path || ('folder:'+it.name)] = open;
          if (it.children) walk(it.children);
        }
      });
    })(window.DIR_MANIFEST);
  }

  function applyFilter(){
    var t = State.searchTerm;
    function matchSelf(it, q){
      return (it.name||'').toLowerCase().indexOf(q) !== -1 ||
             (it.desc||'').toLowerCase().indexOf(q) !== -1 ||
             (it.path||'').toLowerCase().indexOf(q) !== -1;
    }
    function filterItems(items){
      var out = [];
      for (var i=0; i<items.length; i++){
        var it = items[i];
        if (it.type === 'folder'){
          var kids = it.children ? filterItems(it.children) : [];
          if (State.filter === 'file'){ out = out.concat(kids); continue; }
          var selfMatch = !t || matchSelf(it, t);
          if (selfMatch || kids.length){
            out.push(Object.assign({}, it, { children: kids }));
          }
        } else {
          if (State.filter === 'folder') continue;
          if (t && !matchSelf(it, t)) continue;
          out.push(it);
        }
      }
      return out;
    }
    State.filtered = filterItems(window.DIR_MANIFEST);
    render();
  }

  function render(){
    if (!listEl) return;
    var shownFiles = 0, shownFolders = 0;
    (function count(items){
      items.forEach(function(it){
        if (it.type === 'folder'){ shownFolders++; if (it.children) count(it.children); }
        else shownFiles++;
      });
    })(State.filtered);

    var frag = document.createDocumentFragment();
    if (State.filtered.length === 0){
      var empty = document.createElement('div');
      empty.className = 'dir-empty';
      empty.textContent = '没有找到匹配的项目';
      frag.appendChild(empty);
    } else {
      State.filtered.forEach(function(it){
        renderItem(frag, it, 0, []);
      });
    }
    listEl.textContent = '';
    listEl.appendChild(frag);

    if (statusEl) statusEl.textContent = '显示 ' + shownFolders + ' 个文件夹 / ' + shownFiles + ' 个文件';
  }

  function renderItem(parent, item, depth, ancestors){
    var key = item.type === 'folder' ? (item.path || ('folder:'+item.name)) : null;
    var hasKids = !!(item.children && item.children.length);
    var isOpen = key ? (!!State.expanded[key] || (!!State.searchTerm && hasKids)) : false;

    var row = document.createElement(item.type === 'folder' ? 'div' : 'a');
    row.className = 'dir-item ' + (item.type === 'folder' ? 'dir-item-folder' : 'dir-item-file');

    if (item.type === 'folder'){
      row.tabIndex = 0;
      row.setAttribute('role','button');
      row.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    } else {
      row.href = encodeURI(item.path);
      row.target = '_blank';
      row.rel = 'noopener';
    }

    var toggle = document.createElement('span');
    toggle.className = 'dir-toggle';
    row.appendChild(toggle);

    var icon = document.createElement('div');
    icon.className = 'dir-item-icon';
    icon.innerHTML = item.type === 'folder' ? SVG_FOLDER : SVG_FILE;
    row.appendChild(icon);

    var body = document.createElement('div');
    body.className = 'dir-item-body';
    var nameEl = document.createElement('div');
    nameEl.className = 'dir-item-name';
    nameEl.textContent = item.name;
    body.appendChild(nameEl);

    var meta = document.createElement('div');
    meta.className = 'dir-item-meta';
    var typeEl = document.createElement('span');
    if (item.type === 'folder'){
      typeEl.textContent = '目录';
    } else {
      var ext = item.name.lastIndexOf('.') > 0 ? item.name.slice(item.name.lastIndexOf('.')).toUpperCase().replace('.','') : '文件';
      typeEl.textContent = ext;
    }
    meta.appendChild(typeEl);
    if (item.desc){
      var d = document.createElement('span');
      d.textContent = item.desc;
      meta.appendChild(d);
    }
    if (item.type === 'folder' && item.children){
      var c = document.createElement('span');
      c.textContent = item.children.length + ' 项';
      meta.appendChild(c);
    }
    body.appendChild(meta);
    row.appendChild(body);

    if (item.type === 'file'){
      var actions = document.createElement('div');
      actions.className = 'dir-item-actions';
      var openBtn = document.createElement('a');
      openBtn.className = 'dir-item-action';
      openBtn.href = encodeURI(item.path);
      openBtn.target = '_blank';
      openBtn.rel = 'noopener';
      openBtn.title = '新标签页打开';
      openBtn.setAttribute('aria-label','新标签页打开');
      openBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>';
      openBtn.addEventListener('click', function(e){ e.stopPropagation(); });
      actions.appendChild(openBtn);
      row.appendChild(actions);
    }

    if (item.type === 'folder'){
      row.addEventListener('click', function(){
        State.expanded[key] = !State.expanded[key];
        render();
      });
      row.addEventListener('keydown', function(e){
        if (e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          State.expanded[key] = !State.expanded[key];
          render();
        }
      });
    }

    parent.appendChild(row);

    if (item.type === 'folder' && isOpen && item.children){
      item.children.forEach(function(child){
        renderItem(parent, child, depth + 1, ancestors);
      });
    }
  }

  function mount(){
    var mountEl = document.getElementById('dirReaderMount');
    if (!mountEl) return;
    var ui = createUI();
    mountEl.textContent = '';
    mountEl.appendChild(ui);

    listEl = ui._listEl;
    statusEl = ui._statusEl;

    var searchRaf = 0;
    ui._searchInput.addEventListener('input', function(e){
      State.searchTerm = e.target.value.trim().toLowerCase();
      if (searchRaf) return;
      searchRaf = requestAnimationFrame(function(){ searchRaf = 0; applyFilter(); });
    });
    ui._filters.addEventListener('click', function(e){
      var btn = e.target.closest('.dir-filter-btn');
      if (!btn) return;
      State.filter = btn.dataset.filter;
      ui._filters.querySelectorAll('.dir-filter-btn').forEach(function(b){
        b.classList.toggle('active', b.dataset.filter === State.filter);
      });
      applyFilter();
    });
    ui._expandAllBtn.addEventListener('click', function(){
      setAllExpanded(true); render();
    });
    ui._collapseAllBtn.addEventListener('click', function(){
      setAllExpanded(false); render();
    });

    if (firstMount && window.DIR_MANIFEST.length){
      var firstFolder = window.DIR_MANIFEST.find(function(it){ return it.type === 'folder'; });
      if (firstFolder) State.expanded[firstFolder.path || ('folder:'+firstFolder.name)] = true;
      firstMount = false;
    }
    applyFilter();
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', mount);
  } else {
    mount();
  }

  window.DirReader = {
    manifest: window.DIR_MANIFEST,
    reload: mount
  };
})();
</script>

<!-- ============================================================
     导航弹窗
     ============================================================ -->
<script>
(function(){
  'use strict';
  var escapeHtml = function(s){
    return String(s).replace(/[&<>"']/g, function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  };

  var NAV_CATS = [
    { id:'mine',     name:'自研作品',   test: function(p){ return p.indexOf('/') === -1 && p.endsWith('.html'); } },
    { id:'aurora',   name:'极光特效',   test: function(p){ return p.indexOf('极光/') === 0; } },
    { id:'games',    name:'游戏合集',   test: function(p){ return /^(2048|snake|星轨矿工|豪宅大亨|网页小游戏|剧情游戏)\//.test(p); } },
    { id:'toys',     name:'小玩具',     test: function(p){ return /^(paint-toys|memory-toys|maze-toys|sliding-toys|toms\.toys|cursoreffects|weavesilk|mikutap|puginarug|thatsthefinger|longdoge|breakout|thecar|mc-classic|floppybird|onesquareminesweeper)\//.test(p); } },
    { id:'creative', name:'创意实验',   test: function(p){
        return /^(3D 霓虹线条|爱心|圣诞树|动态文字自由落体|粉丝数增长动画|晃动工坊|表白|本地版)\//.test(p)
          || ['五星红旗.html','EasterEgg.html','最小 3D.html','蜈蚣式龙.html','布料.html'].indexOf(p) !== -1;
      } },
    { id:'tools',    name:'工具 / 学习', test: function(){ return true; } }
  ];

  function flatten(items, out){
    out = out || [];
    (items || []).forEach(function(it){
      if (it.type === 'folder'){
        if (it.children) flatten(it.children, out);
      } else {
        out.push({ name: it.name, path: it.path, desc: it.desc || '' });
      }
    });
    return out;
  }

  function buildNavData(manifest){
    var files = flatten(manifest);
    var groups = NAV_CATS.map(function(c){ return { id:c.id, name:c.name, items:[] }; });
    var byId = {};
    groups.forEach(function(g){ byId[g.id] = g; });
    files.forEach(function(f){
      var cat = null;
      for (var i=0; i<NAV_CATS.length; i++){
        if (NAV_CATS[i].test(f.path)){ cat = NAV_CATS[i]; break; }
      }
      if (!cat) cat = NAV_CATS[NAV_CATS.length - 1];
      byId[cat.id].items.push(f);
    });
    return groups.filter(function(g){ return g.items.length > 0; });
  }

  var NAV_DATA = buildNavData(window.DIR_MANIFEST || []);
  var fab = document.getElementById('navFab');
  var fabBadge = document.getElementById('fabBadge');
  var modal = document.getElementById('navModal');
  var closeBtn = document.getElementById('navClose');
  var searchInput = document.getElementById('navSearch');
  var filtersEl = document.getElementById('navFilters');
  var bodyEl = document.getElementById('navBody');
  var countEl = document.getElementById('navCount');

  var activeCat = 'all';
  var term = '';
  var lastFocused = null;

  var totalItems = NAV_DATA.reduce(function(s,c){ return s + c.items.length; }, 0);
  if (fabBadge) fabBadge.textContent = totalItems;
  if (countEl) countEl.textContent = totalItems + ' 个';

  function makeFilterBtn(id, name){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'nf-btn' + (id === activeCat ? ' active' : '');
    b.dataset.cat = id;
    b.textContent = name;
    return b;
  }
  function renderFilters(){
    var frag = document.createDocumentFragment();
    frag.appendChild(makeFilterBtn('all','全部'));
    NAV_DATA.forEach(function(c){ frag.appendChild(makeFilterBtn(c.id, c.name)); });
    filtersEl.textContent = '';
    filtersEl.appendChild(frag);
  }

  filtersEl.addEventListener('click', function(e){
    var btn = e.target.closest('.nf-btn');
    if (!btn) return;
    activeCat = btn.dataset.cat;
    filtersEl.querySelectorAll('.nf-btn').forEach(function(x){
      x.classList.toggle('active', x.dataset.cat === activeCat);
    });
    renderBody();
  });

  function renderBody(){
    var t = term.trim().toLowerCase();
    var totalShown = 0;
    var frag = document.createDocumentFragment();

    NAV_DATA.forEach(function(cat){
      if (activeCat !== 'all' && cat.id !== activeCat) return;
      var matched = cat.items.filter(function(item){
        if (!t) return true;
        return (item.name||'').toLowerCase().indexOf(t) !== -1
            || (item.desc||'').toLowerCase().indexOf(t) !== -1
            || (cat.name||'').toLowerCase().indexOf(t) !== -1;
      });
      if (matched.length === 0) return;
      totalShown += matched.length;

      var group = document.createElement('div');
      group.className = 'nav-group';

      var title = document.createElement('div');
      title.className = 'ng-title';
      title.innerHTML = '<span>' + escapeHtml(cat.name) + '</span>' +
        '<span class="n">' + matched.length + '</span>';
      group.appendChild(title);

      var grid = document.createElement('div');
      grid.className = 'nav-grid';
      matched.forEach(function(item){
        var initial = (item.name || '?').trim().charAt(0);
        var a = document.createElement('a');
        a.className = 'nav-item';
        a.href = encodeURI(item.path);
        a.innerHTML = '<div class="ni-icon" aria-hidden="true">' + escapeHtml(initial) + '</div>' +
          '<div class="ni-body">' +
            '<div class="ni-name">' + escapeHtml(item.name) + '</div>' +
            '<div class="ni-desc">' + escapeHtml(item.desc || '') + '</div>' +
          '</div>';
        grid.appendChild(a);
      });
      group.appendChild(grid);
      frag.appendChild(group);
    });

    bodyEl.textContent = '';
    if (totalShown === 0){
      bodyEl.innerHTML = '<div class="nav-empty">没有找到匹配的项目</div>';
    } else {
      bodyEl.appendChild(frag);
    }
    if (countEl) countEl.textContent = totalShown + ' 个';
  }

  function openModal(){
    lastFocused = document.activeElement;
    modal.classList.add('show');
    closeBtn.focus();
  }
  function closeModal(){
    modal.classList.remove('show');
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }

  fab.addEventListener('click', openModal);
  closeBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', function(e){ if (e.target === modal) closeModal(); });
  window.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && modal.classList.contains('show')) closeModal();
  });

  var searchRaf = 0;
  searchInput.addEventListener('input', function(e){
    term = e.target.value;
    if (searchRaf) return;
    searchRaf = requestAnimationFrame(function(){ searchRaf = 0; renderBody(); });
  });

  function ready(fn){
    if (document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', fn, { once:true });
    } else fn();
  }
  ready(function(){
    renderFilters();
    renderBody();
  });
})();
</script>

</body>
