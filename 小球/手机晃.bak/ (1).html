<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>泛光圆 · 晃动小球</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: black;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      touch-action: none;
      overscroll-behavior: none;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 泛光的大圆 */
    .glow-ring {
      position: relative;
      width: min(80vw, 80vh);
      height: min(80vw, 80vh);
      max-width: 560px;
      max-height: 560px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #111, #000);
      box-shadow:
        0 0 25px rgba(0, 200, 255, 0.7),
        0 0 60px rgba(0, 180, 255, 0.4),
        inset 0 0 30px rgba(0, 220, 255, 0.2),
        inset 0 0 10px rgba(0, 255, 255, 0.3);
      border: 1px solid rgba(0, 200, 255, 0.4);
    }

    .glow-ring::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      box-shadow: 0 0 15px #00c8ff, 0 0 30px #0088ff;
      opacity: 0.5;
      filter: blur(3px);
      z-index: -1;
    }

    /* 小球层 */
    .balls-layer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
    }

    /* 小球：纯色 + 泛光 */
    .ball {
      position: absolute;
      left: 0;
      top: 0;
      border-radius: 50%;
      will-change: transform;
    }

    .hint {
      position: fixed;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(120, 220, 255, 0.6);
      font-size: 14px;
      letter-spacing: 2px;
      pointer-events: none;
      text-shadow: 0 0 10px #00aaff;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="glow-ring" id="glowRing">
      <div class="balls-layer" id="ballsLayer"></div>
    </div>
  </div>
  <div class="hint">晃动手机 · 小球晃动</div>

  <script>
    (function() {
      // ---------- 配置 ----------
      const BALL_COUNT = 7;
      const FRICTION   = 0.94;
      const BOUNCE     = 0.75;
      const SENSITIVITY = 1.6;   // 灵敏度（方向已修正）

      const COLORS = [
        '#4df0ff', '#3a9eff', '#b84dff', '#00e0c0',
        '#5f7aff', '#ff4dd0', '#7af0ff',
      ];

      const ring      = document.getElementById('glowRing');
      const ballsLayer = document.getElementById('ballsLayer');

      let ringW = 0, ringH = 0;
      let ballRadius = 8;

      let balls = [];

      // 目标加速度（来自陀螺仪）
      let targetAX = 0, targetAY = 0;
      // 平滑后的加速度
      let ax = 0, ay = 0;

      // ---------- 初始化 ----------
      function init() {
        const rect = ring.getBoundingClientRect();
        ringW = rect.width;
        ringH = rect.height;
        ballRadius = Math.max(7, Math.min(14, ringW * 0.04));

        balls = [];
        ballsLayer.innerHTML = '';

        const cx = ringW / 2;
        const cy = ringH / 2;
        const maxR = ringW / 2 - ballRadius - 4;

        for (let i = 0; i < BALL_COUNT; i++) {
          // 用均匀分布 + 最小间距，避免挤一起
          let x, y, ok, tries = 0;
          do {
            ok = true;
            // 在圆内均匀随机
            const a = Math.random() * Math.PI * 2;
            const r = Math.sqrt(Math.random()) * maxR;  // sqrt使面积均匀
            x = cx + Math.cos(a) * r;
            y = cy + Math.sin(a) * r;

            // 和其他球保持距离
            for (let b of balls) {
              const dx = x - b.x, dy = y - b.y;
              if (dx * dx + dy * dy < (ballRadius * 2.4) ** 2) {
                ok = false;
                break;
              }
            }
            tries++;
          } while (!ok && tries < 80);

          const color = COLORS[i % COLORS.length];
          const el = document.createElement('div');
          el.className = 'ball';
          el.style.width  = ballRadius * 2 + 'px';
          el.style.height = ballRadius * 2 + 'px';
          el.style.background = color;
          el.style.boxShadow = `0 0 10px ${color}, 0 0 20px ${color}80`;
          ballsLayer.appendChild(el);

          balls.push({
            x, y,
            vx: 0, vy: 0,
            el,
          });
        }

        // 立即绘制一次
        for (let b of balls) {
          b.el.style.transform = `translate3d(${b.x - ballRadius}px, ${b.y - ballRadius}px, 0)`;
        }
      }

      // ---------- 物理更新 ----------
      function update() {
        // 平滑加速度
        ax += (targetAX - ax) * 0.18;
        ay += (targetAY - ay) * 0.18;

        const cx = ringW / 2;
        const cy = ringH / 2;
        const maxR = ringW / 2 - ballRadius - 2;

        for (let b of balls) {
          // 加速度作用
          b.vx += ax;
          b.vy += ay;

          // 摩擦
          b.vx *= FRICTION;
          b.vy *= FRICTION;

          // 速度极小归零，避免漂移
          if (Math.abs(b.vx) < 0.02) b.vx = 0;
          if (Math.abs(b.vy) < 0.02) b.vy = 0;

          // 预测位置
          let nx = b.x + b.vx;
          let ny = b.y + b.vy;

          // 圆形边界碰撞
          let dx = nx - cx;
          let dy = ny - cy;
          let dist = Math.hypot(dx, dy);

          if (dist > maxR) {
            const ratio = maxR / dist;
            const boundX = cx + dx * ratio;
            const boundY = cy + dy * ratio;

            const nLen = dist || 1;
            const nxDir = dx / nLen;
            const nyDir = dy / nLen;
            const vn = b.vx * nxDir + b.vy * nyDir;

            if (vn > 0) {
              b.vx -= (1 + BOUNCE) * vn * nxDir;
              b.vy -= (1 + BOUNCE) * vn * nyDir;
            }

            nx = boundX;
            ny = boundY;
          }

          b.x = nx;
          b.y = ny;

          // 渲染
          b.el.style.transform = `translate3d(${b.x - ballRadius}px, ${b.y - ballRadius}px, 0)`;
        }
      }

      // ---------- 动画循环 ----------
      function animate() {
        update();
        requestAnimationFrame(animate);
      }

      // ---------- 陀螺仪 ----------
      function onOrientation(e) {
        const beta  = e.beta  || 0;  // 前后倾斜 -180~180
        const gamma = e.gamma || 0;  // 左右倾斜  -90~90

        // 方向修正：
        // 手机顶部向下倾斜 (beta 正) → 小球向屏幕下方移动 (Y正)
        // 手机向右倾斜 (gamma 正) → 小球向屏幕右方移动 (X正)
        // 所以直接用正号即可。再乘以灵敏度系数。
        const k = 0.06 * SENSITIVITY;
        targetAX = Math.max(-1, Math.min(1, gamma / 90)) * k;
        targetAY = Math.max(-1, Math.min(1, beta  / 90)) * k;
      }

      // iOS 权限
      function requestPermission() {
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission()
            .then(state => {
              if (state === 'granted') {
                window.addEventListener('deviceorientation', onOrientation);
              }
            })
            .catch(() => {});
        }
      }

      // ---------- 启动 ----------
      window.addEventListener('load', () => {
        init();
        animate();

        if (window.DeviceOrientationEvent) {
          if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            // iOS：需要用户手势触发
            const trigger = () => {
              requestPermission();
              document.body.removeEventListener('touchstart', trigger);
              document.body.removeEventListener('click', trigger);
            };
            document.body.addEventListener('touchstart', trigger, { once: true });
            document.body.addEventListener('click', trigger, { once: true });
          } else {
            // Android / 其他
            window.addEventListener('deviceorientation', onOrientation);
          }
        }
      });

      // 窗口尺寸变化时重新初始化
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          init();
        }, 150);
      });

      window.addEventListener('orientationchange', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          init();
        }, 250);
      });

    })();
  </script>
</body>
</html>
