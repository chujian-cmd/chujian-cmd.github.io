<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek · 深度求索</title>
  <style>
    /* 全局重置与字体 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0e14;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 深邃星空背景微光 */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 40%, rgba(38, 139, 210, 0.08) 0%, transparent 45%),
                  radial-gradient(circle at 80% 70%, rgba(147, 112, 219, 0.08) 0%, transparent 50%),
                  radial-gradient(circle at 10% 80%, rgba(0, 180, 216, 0.05) 0%, transparent 40%);
      z-index: 0;
      pointer-events: none;
    }

    /* 主卡片 — 流畅玻璃质感，无边框干扰 */
    .card {
      position: relative;
      z-index: 10;
      width: min(820px, 90vw);
      padding: 3rem 2.5rem 2.8rem;
      border-radius: 48px;
      background: rgba(18, 22, 32, 0.72);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.6),
                  0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                  0 0 40px rgba(0, 180, 255, 0.12);
      animation: cardFloat 6s ease-in-out infinite;
      transition: box-shadow 0.3s;
    }

    @keyframes cardFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* 顶部装饰线 — 流动渐变 */
    .glow-line {
      position: absolute;
      top: 0;
      left: 10%;
      width: 80%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #4aa8ff, #a57cff, #4aa8ff, transparent);
      background-size: 200% 100%;
      border-radius: 2px;
      animation: lineFlow 4s linear infinite;
      opacity: 0.8;
    }

    @keyframes lineFlow {
      0% { background-position: 0% 0; }
      100% { background-position: 200% 0; }
    }

    /* 整体内容区域 */
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: #eef4ff;
    }

    /* 主 SVG 图标区 — 动态几何 */
    .svg-avatar {
      width: 130px;
      height: 130px;
      margin-bottom: 1rem;
      filter: drop-shadow(0 0 18px rgba(80, 170, 255, 0.5));
    }

    /* 标题区域 */
    h1 {
      font-size: 3.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 0%, #b8d9ff 80%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.25rem;
      animation: titleReveal 1.2s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(12px);
    }

    @keyframes titleReveal {
      to { opacity: 1; transform: translateY(0); }
    }

    .subhead {
      font-size: 1.2rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #8ea6c9;
      margin-bottom: 2rem;
      animation: fadeUp 1s 0.2s forwards;
      opacity: 0;
      transform: translateY(8px);
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* 描述段落 */
    .description {
      font-size: 1.15rem;
      line-height: 1.7;
      color: #cbd6e6;
      max-width: 600px;
      margin-bottom: 2.8rem;
      font-weight: 400;
      animation: fadeUp 1s 0.4s forwards;
      opacity: 0;
      transform: translateY(10px);
    }

    /* 特性卡片网格 */
    .features {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.2rem;
      width: 100%;
      margin-bottom: 2.4rem;
    }

    .feature-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 28px;
      padding: 1.4rem 1rem 1.2rem;
      flex: 1 1 140px;
      min-width: 120px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: all 0.25s ease;
      animation: featurePop 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards;
      opacity: 0;
      transform: scale(0.96);
    }

    .feature-item:nth-child(1) { animation-delay: 0.5s; }
    .feature-item:nth-child(2) { animation-delay: 0.65s; }
    .feature-item:nth-child(3) { animation-delay: 0.8s; }

    @keyframes featurePop {
      to { opacity: 1; transform: scale(1); }
    }

    .feature-item:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(100, 180, 255, 0.2);
      box-shadow: 0 8px 20px -8px rgba(0, 160, 255, 0.3);
      transform: translateY(-3px);
    }

    .feature-icon {
      width: 44px;
      height: 44px;
      margin-bottom: 0.9rem;
      color: #7db9ff;
      filter: drop-shadow(0 0 8px rgba(80, 170, 255, 0.4));
    }

    .feature-label {
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: #d3e2fc;
      background: linear-gradient(180deg, #eef6ff, #b0c8e8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* 签名 / 脚注 */
    .signature {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      font-size: 0.9rem;
      color: #7d8fa8;
      letter-spacing: 0.03em;
      animation: fadeUp 1s 1s forwards;
      opacity: 0;
      transform: translateY(8px);
    }

    .signature svg {
      width: 20px;
      height: 20px;
      opacity: 0.7;
    }

    /* 背景星点粒子 — 纯CSS装饰，不干扰阅读 */
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.3;
      animation: starPulse 4s infinite alternate;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes starPulse {
      0% { opacity: 0.1; transform: scale(0.8); }
      100% { opacity: 0.5; transform: scale(1.2); }
    }

    /* 响应式 */
    @media (max-width: 600px) {
      .card {
        padding: 2rem 1.5rem 2rem;
        border-radius: 32px;
      }
      h1 {
        font-size: 2.4rem;
      }
      .subhead {
        font-size: 0.9rem;
        letter-spacing: 0.2em;
      }
      .description {
        font-size: 1rem;
        line-height: 1.6;
      }
      .feature-item {
        flex: 1 1 100px;
        padding: 1rem 0.6rem;
      }
      .feature-icon {
        width: 34px;
        height: 34px;
      }
      .svg-avatar {
        width: 100px;
        height: 100px;
      }
    }
  </style>
</head>
<body>

  <!-- 动态星点装饰 (由JS生成，效果更自然) -->
  <div id="star-field" style="position: fixed; inset: 0; z-index: 1; pointer-events: none;"></div>

  <!-- 主卡片 -->
  <div class="card">
    <div class="glow-line"></div>

    <div class="content">
      <!-- 主视觉 SVG：抽象智能之眼 + 流动能量环 -->
      <svg class="svg-avatar" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="ringGrad" x1="20%" y1="20%" x2="80%" y2="80%">
            <stop offset="0%" stop-color="#4aa8ff" stop-opacity="0.9"/>
            <stop offset="50%" stop-color="#a57cff" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#4aa8ff" stop-opacity="0.6"/>
          </linearGradient>
          <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8cc6ff" />
            <stop offset="100%" stop-color="#c9a2ff" />
          </linearGradient>
          <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <!-- 外环 — 旋转动画 (用CSS控制) -->
        <circle cx="60" cy="60" r="46" stroke="url(#ringGrad)" stroke-width="2.2" fill="none"
                stroke-dasharray="6 12" opacity="0.8">
          <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="12s" repeatCount="indefinite" />
        </circle>

        <!-- 第二层环 — 反向旋转 -->
        <circle cx="60" cy="60" r="34" stroke="url(#ringGrad)" stroke-width="1.8" fill="none"
                stroke-dasharray="4 10" opacity="0.6">
          <animateTransform attributeName="transform" type="rotate" from="360 60 60" to="0 60 60" dur="18s" repeatCount="indefinite" />
        </circle>

        <!-- 中心智能之眼/核心 -->
        <circle cx="60" cy="60" r="20" fill="url(#innerGrad)" opacity="0.2" filter="url(#glow)" />
        <circle cx="60" cy="60" r="12" fill="url(#innerGrad)" opacity="0.9">
          <animate attributeName="r" values="12;13.5;12;12" dur="3s" repeatCount="indefinite" />
        </circle>
        <!-- 内部瞳孔小点 (细节) -->
        <circle cx="60" cy="60" r="4.5" fill="#ffffff" opacity="0.9" />
        <!-- 十字星芒 -->
        <path d="M60 34 L60 42 M60 78 L60 86 M34 60 L42 60 M78 60 L86 60"
              stroke="#b8d9ff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
      </svg>

      <h1>DeepSeek</h1>
      <div class="subhead">深度求索 · 智能之境</div>

      <p class="description">
        由深度求索公司创造的 AI 助手。以纯粹的逻辑与广博的知识为基石，
        在对话中理解，在思考中创造，为每一个问题寻找深刻的答案。
      </p>

      <!-- 三个核心特性 (SVG 图标无emoji) -->
      <div class="features">
        <!-- 特性1: 深度思考 (大脑/节点) -->
        <div class="feature-item">
          <svg class="feature-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="16" r="6" stroke="currentColor" stroke-width="1.8" />
            <circle cx="12" cy="28" r="5" stroke="currentColor" stroke-width="1.8" />
            <circle cx="28" cy="28" r="5" stroke="currentColor" stroke-width="1.8" />
            <path d="M15 20 L12 23 M25 20 L28 23 M20 22 L20 26 M17 26 L12 28 M23 26 L28 28" 
                  stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
          </svg>
          <span class="feature-label">深度思考</span>
        </div>

        <!-- 特性2: 长上下文 (无限符号 / 循环) -->
        <div class="feature-item">
          <svg class="feature-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 20 C8 14, 14 12, 18 16 L22 20 C26 24, 32 22, 32 16 C32 12, 28 10, 24 12 L20 16 C16 20, 10 18, 8 20Z" 
                  stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none" />
            <path d="M32 20 C32 26, 26 28, 22 24 L18 20 C14 16, 8 18, 8 24 C8 28, 12 30, 16 28 L20 24 C24 20, 30 22, 32 20Z" 
                  stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none" />
          </svg>
          <span class="feature-label">长上下文</span>
        </div>

        <!-- 特性3: 多模态理解 (层叠的方块/维度) -->
        <div class="feature-item">
          <svg class="feature-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="8" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.8" />
            <rect x="20" y="20" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.8" />
            <path d="M14 20 L14 28 L20 28" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            <path d="M26 14 L26 20 L20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          <span class="feature-label">多模态理解</span>
        </div>
      </div>

      <!-- 脚注装饰 -->
      <div class="signature">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L15 9H22L16 14L18 21L12 17L6 21L8 14L2 9H9L12 2Z" 
                stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" fill="currentColor" fill-opacity="0.1" />
        </svg>
        <span>DeepSeek · 深度求索</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // 生成背景星点，增强深邃感，但不干扰前景
      const starField = document.getElementById('star-field');
      const starCount = 80;
      
      for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        
        // 随机位置
        const x = Math.random() * 100;
        const y = Math.random() * 100;
        const size = Math.random() * 2.5 + 1.2; // 1.2 ~ 3.7px
        const delay = Math.random() * 8;
        const duration = Math.random() * 6 + 4;
        
        star.style.left = x + '%';
        star.style.top = y + '%';
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.animationDelay = delay + 's';
        star.style.animationDuration = duration + 's';
        star.style.background = `radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(180,220,255,0.4) 100%)`;
        
        starField.appendChild(star);
      }

      // 可选：鼠标移动时微调卡片视差 (极轻微，增强立体感)
      const card = document.querySelector('.card');
      document.addEventListener('mousemove', (e) => {
        const xAxis = (window.innerWidth / 2 - e.clientX) / 80;
        const yAxis = (window.innerHeight / 2 - e.clientY) / 80;
        // 非常微小的位移，不干扰阅读
        card.style.transform = `translateY(-6px) rotateX(${yAxis * 0.08}deg) rotateY(${xAxis * 0.08}deg)`;
      });

      // 鼠标离开恢复
      document.addEventListener('mouseleave', () => {
        card.style.transform = 'translateY(-6px) rotateX(0deg) rotateY(0deg)';
      });
    })();
  </script>
</body>
</html>
