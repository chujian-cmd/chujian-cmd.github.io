<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 确保移动端正确缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar UI Recreation - Responsive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px; /* 防止卡片贴边 */
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", STHeiti, "Microsoft Yahei", Tahoma, Simsun, sans-serif;
        }

        /* 核心修改：由固定宽度改为自适应最大宽度 */
        .calendar-card {
            position: relative;
            width: 100%;
            max-width: 680px; /* 电脑端最大宽度限制 */
            /* 移除固定 height: 400px; 让内容撑开高度 */
            background: linear-gradient(135deg, #041f18 0%, #0d111c 45%, #24113c 100%);
            border-radius: 24px;
            /* 使用 clamp 函数，内边距在 20px 到 60px 之间随屏幕缩放 */
            padding: clamp(24px, 6vw, 50px) clamp(20px, 8vw, 60px);
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: clamp(30px, 6vw, 50px);
        }

        /* 字体自适应缩放：最小 40px，最大 72px */
        .title {
            color: #ffffff;
            font-size: clamp(40px, 10vw, 72px);
            font-weight: 400;
            line-height: 1;
            letter-spacing: 2px;
        }

        /* 字体自适应缩放：最小 12px，最大 16px */
        .subtitle {
            color: rgba(255, 255, 255, 0.45);
            font-size: clamp(12px, 3vw, 16px);
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            row-gap: clamp(15px, 4vw, 30px);
            text-align: center;
        }

        .weekday {
            color: rgba(255, 255, 255, 0.35);
            font-size: clamp(14px, 3.5vw, 18px);
            font-weight: 300;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 日期容器自适应：保证在窄屏下也不变形 */
        .day {
            color: #ffffff;
            font-size: clamp(16px, 4vw, 24px);
            font-weight: 300;
            width: 100%;
            max-width: 52px; /* 限制最大尺寸 */
            aspect-ratio: 1; /* 强制保持正方形 */
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            position: relative;
        }

        .day.active {
            border: 1px solid rgba(160, 130, 255, 0.5);
            border-radius: 50%;
            background: rgba(120, 90, 255, 0.08);
            box-shadow: 0 0 15px rgba(120, 90, 255, 0.15);
            font-weight: 400;
        }

        .calendar-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #00ff88 0%, #00ccff 30%, #6b21a8 100%);
            box-shadow: 0 -2px 10px rgba(0, 255, 136, 0.4), 0 -2px 10px rgba(107, 33, 168, 0.4);
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
        }
    </style>
</head>
<body>

    <div class="calendar-card">
        <div class="header">
            <div class="title">周六</div>
            <div class="subtitle">CALENDAR</div>
        </div>

        <div class="calendar-grid">
            <div class="weekday">日</div>
            <div class="weekday">一</div>
            <div class="weekday">二</div>
            <div class="weekday">三</div>
            <div class="weekday">四</div>
            <div class="weekday">五</div>
            <div class="weekday">六</div>

            <div class="day">11</div>
            <div class="day">12</div>
            <div class="day">13</div>
            <div class="day">14</div>
            <div class="day">15</div>
            <div class="day">16</div>
            <div class="day active">17</div>
        </div>
    </div>

</body>
</html>
