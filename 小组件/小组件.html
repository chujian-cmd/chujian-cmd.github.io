<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar UI Recreation</title>
    <style>
        /* 基础重置与页面背景 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000; /* 纯黑背景以衬托卡片 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", STHeiti, "Microsoft Yahei", Tahoma, Simsun, sans-serif;
        }

        /* 日历卡片主体 */
        .calendar-card {
            position: relative;
            width: 680px;
            height: 400px;
            /* 核心：从左下角暗绿到右上角深紫的径向/线性渐变 */
            background: linear-gradient(135deg, #041f18 0%, #0d111c 45%, #24113c 100%);
            border-radius: 24px;
            padding: 50px 60px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        /* 顶部标题区域 (周六 + CALENDAR) */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end; /* 底部对齐 */
            margin-bottom: 50px;
        }

        .title {
            color: #ffffff;
            font-size: 72px;
            font-weight: 400;
            line-height: 1;
            letter-spacing: 2px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.45); /* 半透明白色 */
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 8px; /* 微调对齐基线 */
        }

        /* 日历网格区域 */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr); /* 7列等宽 */
            row-gap: 30px;
            text-align: center;
        }

        /* 星期表头 (日 一 二 ...) */
        .weekday {
            color: rgba(255, 255, 255, 0.35); /* 暗灰色 */
            font-size: 18px;
            font-weight: 300;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 日期数字 */
        .day {
            color: #ffffff;
            font-size: 24px;
            font-weight: 300;
            height: 52px;
            width: 52px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            position: relative;
        }

        /* 选中的日期 (17号) */
        .day.active {
            /* 半透明的紫色边框 */
            border: 1px solid rgba(160, 130, 255, 0.5); 
            border-radius: 50%;
            /* 内部微弱的光晕背景 */
            background: rgba(120, 90, 255, 0.08); 
            /* 外部微弱的发光效果 */
            box-shadow: 0 0 15px rgba(120, 90, 255, 0.15);
            font-weight: 400;
        }

        /* 底部渐变发光边框 */
        .calendar-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px; /* 边框厚度 */
            /* 左侧亮绿过渡到右侧紫色 */
            background: linear-gradient(90deg, #00ff88 0%, #00ccff 30%, #6b21a8 100%);
            /* 增加发光效果 */
            box-shadow: 0 -2px 10px rgba(0, 255, 136, 0.4), 0 -2px 10px rgba(107, 33, 168, 0.4);
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
        }
    </style>
</head>
<body>

    <div class="calendar-card">
        <!-- 头部信息 -->
        <div class="header">
            <div class="title">周六</div>
            <div class="subtitle">CALENDAR</div>
        </div>

        <!-- 日历主体 -->
        <div class="calendar-grid">
            <!-- 星期 -->
            <div class="weekday">日</div>
            <div class="weekday">一</div>
            <div class="weekday">二</div>
            <div class="weekday">三</div>
            <div class="weekday">四</div>
            <div class="weekday">五</div>
            <div class="weekday">六</div>

            <!-- 日期 -->
            <div class="day">11</div>
            <div class="day">12</div>
            <div class="day">13</div>
            <div class="day">14</div>
            <div class="day">15</div>
            <div class="day">16</div>
            <div class="day active">17</div>
        </div>
    </div>

</body>
</html>
