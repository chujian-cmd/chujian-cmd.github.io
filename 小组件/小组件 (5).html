<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>动态日历 - 长按缩小交互</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", STHeiti, "Microsoft Yahei", Tahoma, Simsun, sans-serif;
            overflow: hidden; /* 防止长按时页面滚动 */
            /* 防止长按选中文字或图片 */
            -webkit-user-select: none;
            user-select: none; 
        }

        /* --- 核心卡片样式 --- */
        .calendar-card {
            position: relative;
            width: 100%;
            max-width: 680px;
            border-radius: 24px;
            padding: clamp(24px, 6vw, 50px) clamp(20px, 8vw, 60px);
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            
            /* 背景光效还原 */
            background: 
                linear-gradient(to bottom, #000000 0%, rgba(0, 0, 0, 0.8) 30%, transparent 60%),
                radial-gradient(circle at 0% 100%, rgba(0, 80, 50, 0.9) 0%, rgba(0, 40, 25, 0.4) 40%, transparent 70%),
                radial-gradient(circle at 100% 80%, rgba(60, 20, 100, 0.6) 0%, transparent 60%),
                #040408;

            /* 添加平滑的过渡动画，类似苹果的弹簧阻尼效果 */
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: center center;
            z-index: 10;
        }

        /* 🌟 缩小的状态 */
        .calendar-card.is-minimized {
            transform: scale(0.6) translateY(0);
            opacity: 0.85;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            cursor: default;
            pointer-events: none; /* 缩小状态下，点击卡片内部不再响应长按等操作 */
        }

        /* --- 右上角关闭按钮 --- */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 24px;
            line-height: 26px;
            text-align: center;
            cursor: pointer;
            /* 默认隐藏，且不可点击 */
            opacity: 0;
            visibility: hidden;
            transform: scale(0.5);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 20;
            backdrop-filter: blur(4px);
        }

        /* 缩小状态下，显示关闭按钮并允许点击 */
        .calendar-card.is-minimized .close-btn {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
            pointer-events: auto;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .close-btn:active {
            transform: scale(0.9);
        }

        /* --- 内部的日历布局样式 --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: clamp(30px, 6vw, 50px);
        }

        .title {
            color: #ffffff;
            font-size: clamp(40px, 10vw, 72px);
            font-weight: 400;
            line-height: 1;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.45);
            font-size: clamp(12px, 3vw, 16px);
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            row-gap: clamp(15px, 4vw, 30px);
            text-align: center;
        }

        .weekday {
            color: rgba(255, 255, 255, 0.35);
            font-size: clamp(14px, 3.5vw, 18px);
            font-weight: 300;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .day {
            color: #ffffff;
            font-size: clamp(16px, 4vw, 24px);
            font-weight: 300;
            width: 100%;
            max-width: 52px;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            position: relative;
        }

        .day.active {
            border: 1px solid rgba(160, 130, 255, 0.5);
            border-radius: 50%;
            background: rgba(120, 90, 255, 0.08);
            box-shadow: 0 0 15px rgba(120, 90, 255, 0.15);
            font-weight: 400;
        }

        .calendar-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #00ff88 0%, #00ccff 30%, #6b21a8 100%);
            box-shadow: 0 -2px 10px rgba(0, 255, 136, 0.5), 0 -2px 10px rgba(107, 33, 168, 0.5);
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
        }

    </style>
</head>
<body>

    <div class="calendar-card" id="calendarCard">
        <!-- 右上角缩小后的关闭按钮 -->
        <div class="close-btn" id="closeBtn">−</div>
        
        <div class="header">
            <div class="title" id="current-weekday-title">周六</div>
            <div class="subtitle">CALENDAR</div>
        </div>

        <div class="calendar-grid">
            <div class="weekday">日</div>
            <div class="weekday">一</div>
            <div class="weekday">二</div>
            <div class="weekday">三</div>
            <div class="weekday">四</div>
            <div class="weekday">五</div>
            <div class="weekday">六</div>

            <div id="dynamic-days-container" style="display: contents;"></div>
        </div>
    </div>

    <script>
        // --- 1. 日历渲染逻辑 (原封不动) ---
        function renderCalendar() {
            const today = new Date();
            const weekdaysChinese = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            document.getElementById('current-weekday-title').textContent = weekdaysChinese[today.getDay()];

            const startOfWeek = new Date(today);
            startOfWeek.setDate(today.getDate() - today.getDay());

            const container = document.getElementById('dynamic-days-container');
            container.innerHTML = '';

            for (let i = 0; i < 7; i++) {
                const currentDate = new Date(startOfWeek);
                currentDate.setDate(startOfWeek.getDate() + i);

                const dayDiv = document.createElement('div');
                dayDiv.className = 'day';
                dayDiv.textContent = currentDate.getDate();

                if (currentDate.getDate() === today.getDate() && 
                    currentDate.getMonth() === today.getMonth() && 
                    currentDate.getFullYear() === today.getFullYear()) {
                    dayDiv.classList.add('active');
                }
                container.appendChild(dayDiv);
            }
        }
        renderCalendar();
        setInterval(renderCalendar, 60000);


        // --- 2. 长按缩小与恢复交互逻辑 ---
        const card = document.getElementById('calendarCard');
        const closeBtn = document.getElementById('closeBtn');
        
        let pressTimer = null;
        let isMinimized = false;
        let isLongPressTriggered = false; // 防止长按后松开触发其他点击

        // 开始长按
        const startPress = (e) => {
            // 如果已经缩小了，或者点的是关闭按钮，就不触发长按
            if (isMinimized || e.target === closeBtn) return;
            
            isLongPressTriggered = false;
            
            // 设定 600 毫秒算作长按
            pressTimer = setTimeout(() => {
                isLongPressTriggered = true;
                minimizeCard();
            }, 600);
        };

        // 取消长按 (松开鼠标/手指，或者移出卡片)
        const cancelPress = () => {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        };

        // 执行缩小动画
        const minimizeCard = () => {
            isMinimized = true;
            card.classList.add('is-minimized');
            // 防止移动端长按触发震动或选中
            if (navigator.vibrate) navigator.vibrate(50); 
        };

        // 恢复正常尺寸
        const restoreCard = () => {
            if (!isMinimized) return;
            isMinimized = false;
            card.classList.remove('is-minimized');
        };

        // --- 绑定事件 ---
        
        // 鼠标/触摸按下与松开
        card.addEventListener('mousedown', startPress);
        card.addEventListener('touchstart', startPress, { passive: true });
        
        card.addEventListener('mouseup', cancelPress);
        card.addEventListener('mouseleave', cancelPress);
        card.addEventListener('touchend', cancelPress);
        card.addEventListener('touchcancel', cancelPress);

        // 阻止原生长按菜单（比如移动端长按会弹出“保存图片”或选中文字）
        card.addEventListener('contextmenu', (e) => e.preventDefault());

        // 点击右上角 “-” 按钮，恢复
        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // 阻止事件冒泡到 document
            restoreCard();
        });

        // 点击空白处恢复
        document.addEventListener('click', (e) => {
            // 如果触发了长按，忽略本次点击
            if (isLongPressTriggered) {
                isLongPressTriggered = false;
                return;
            }
            // 如果处于缩小状态，并且点击的目标不是卡片内部
            if (isMinimized && !card.contains(e.target)) {
                restoreCard();
            }
        });

        // 兼容移动端触摸空白处恢复
        document.addEventListener('touchstart', (e) => {
            if (isLongPressTriggered) {
                isLongPressTriggered = false;
                return;
            }
            if (isMinimized && !card.contains(e.target)) {
                restoreCard();
            }
        }, { passive: true });

    </script>
</body>
</html>
