<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态实时日历</title>
    <style>
        /* --- 基础与响应式样式保持不变 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", STHeiti, "Microsoft Yahei", Tahoma, Simsun, sans-serif;
        }

        .calendar-card {
            position: relative;
            width: 100%;
            max-width: 680px;
            background: linear-gradient(135deg, #041f18 0%, #0d111c 45%, #24113c 100%);
            border-radius: 24px;
            padding: clamp(24px, 6vw, 50px) clamp(20px, 8vw, 60px);
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: clamp(30px, 6vw, 50px);
        }

        .title {
            color: #ffffff;
            font-size: clamp(40px, 10vw, 72px);
            font-weight: 400;
            line-height: 1;
            letter-spacing: 2px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.45);
            font-size: clamp(12px, 3vw, 16px);
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            row-gap: clamp(15px, 4vw, 30px);
            text-align: center;
        }

        .weekday {
            color: rgba(255, 255, 255, 0.35);
            font-size: clamp(14px, 3.5vw, 18px);
            font-weight: 300;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 日期单元格 */
        .day {
            color: #ffffff;
            font-size: clamp(16px, 4vw, 24px);
            font-weight: 300;
            width: 100%;
            max-width: 52px;
            aspect-ratio: 1; /* 保持正方形 */
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            position: relative;
        }

        /* 动态添加的今日高亮状态 */
        .day.active {
            border: 1px solid rgba(160, 130, 255, 0.5);
            border-radius: 50%;
            background: rgba(120, 90, 255, 0.08);
            box-shadow: 0 0 15px rgba(120, 90, 255, 0.15);
            font-weight: 400;
        }

        /* 底部发光边框 */
        .calendar-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #00ff88 0%, #00ccff 30%, #6b21a8 100%);
            box-shadow: 0 -2px 10px rgba(0, 255, 136, 0.4), 0 -2px 10px rgba(107, 33, 168, 0.4);
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
        }
    </style>
</head>
<body>

    <div class="calendar-card">
        <!-- 头部信息 -->
        <div class="header">
            <div class="title" id="current-weekday-title">周六</div>
            <div class="subtitle">CALENDAR</div>
        </div>

        <!-- 日历主体 -->
        <div class="calendar-grid">
            <!-- 星期表头（静态） -->
            <div class="weekday">日</div>
            <div class="weekday">一</div>
            <div class="weekday">二</div>
            <div class="weekday">三</div>
            <div class="weekday">四</div>
            <div class="weekday">五</div>
            <div class="weekday">六</div>

            <!-- 下方留空，由 JS 动态生成日期数字 -->
            <div id="dynamic-days-container" style="display: contents;"></div>
        </div>
    </div>

    <script>
        function renderCalendar() {
            const today = new Date();
            
            // 1. 设置顶部的大标题（如：周六）
            const weekdaysChinese = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            document.getElementById('current-weekday-title').textContent = weekdaysChinese[today.getDay()];

            // 2. 计算本周的起始日期（周日）
            const startOfWeek = new Date(today);
            // 获取今天是本周的第几天（0是周日，6是周六）
            // 用今天的日期减去对应的天数，就能得到本周日的日期
            startOfWeek.setDate(today.getDate() - today.getDay());

            // 3. 动态生成日期 DOM
            const container = document.getElementById('dynamic-days-container');
            container.innerHTML = ''; // 每次渲染前先清空

            // 循环7次，生成周日到周六的日期
            for (let i = 0; i < 7; i++) {
                const currentDate = new Date(startOfWeek);
                currentDate.setDate(startOfWeek.getDate() + i); // 从周日开始往后推

                // 创建日期元素
                const dayDiv = document.createElement('div');
                dayDiv.className = 'day';
                dayDiv.textContent = currentDate.getDate(); // 只显示数字

                // 4. 判断是否是今天，如果是今天则加上 active 高亮样式
                if (currentDate.getDate() === today.getDate() && 
                    currentDate.getMonth() === today.getMonth() && 
                    currentDate.getFullYear() === today.getFullYear()) {
                    dayDiv.classList.add('active');
                }

                container.appendChild(dayDiv);
            }
        }

        // 页面加载完成后立即执行渲染
        renderCalendar();
    </script>
</body>
</html>
