<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>全屏拖拽翻页测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #000; 
            color: #fff; 
            font-family: sans-serif; 
            /* 彻底禁止浏览器原生的各种手势和选中 */
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* 视口容器 */
        #pages-viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 滑动轨道 */
        #pages-track {
            display: flex;
            height: 100%;
            width: 300vw; /* 3 页 */
            transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform: translateX(0px);
            will-change: transform;
        }

        /* 拖拽时取消过渡，保证跟手 */
        #pages-track.is-dragging {
            transition: none;
        }

        .page {
            width: 100vw;
            height: 100%;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
        }
        .page:nth-child(1) { background: linear-gradient(135deg, #ff4757, #ff6b81); }
        .page:nth-child(2) { background: linear-gradient(135deg, #2ed573, #7bed9f); }
        .page:nth-child(3) { background: linear-gradient(135deg, #1e90ff, #70a1ff); }

        /* 测试用的长按反馈 */
        .longpress-alert {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 40px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 20px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 100;
        }
        .longpress-alert.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* 底部控制条 */
        #control-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none; /* 让出事件，防止挡住屏幕拖拽 */
        }

        #dots-track {
            display: flex;
            gap: 15px;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            pointer-events: auto; /* 恢复圆点区域的点击事件 */
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: transform 0.2s, background 0.2s;
            cursor: pointer;
        }
        .dot.active {
            background: #fff;
            transform: scale(1.3);
        }
    </style>
</head>
<body>

    <div id="pages-viewport">
        <div id="pages-track">
            <div class="page">Page 1</div>
            <div class="page">Page 2</div>
            <div class="page">Page 3</div>
        </div>
    </div>

    <div class="longpress-alert" id="alertBox">触发长按！</div>

    <div id="control-bar">
        <div id="dots-track">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <script>
        const pagesTrack = document.getElementById('pages-track');
        const dots = document.querySelectorAll('.dot');
        const alertBox = document.getElementById('alertBox');
        const pageCount = dots.length;
        let pageWidth = window.innerWidth;

        let currentIndex = 0;
        let currentTranslateX = 0;

        // 手势状态变量
        let startX = 0;
        let startY = 0;
        let isDragging = false;
        let isLongPress = false;
        let longPressTimer = null;

        pagesTrack.style.width = `${pageCount * 100}vw`;

        function updateDots() {
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === currentIndex);
            });
        }

        function snapToPage() {
            pagesTrack.classList.remove('is-dragging');
            pagesTrack.style.transition = 'transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1)';
            currentTranslateX = -currentIndex * pageWidth;
            pagesTrack.style.transform = `translateX(${currentTranslateX}px)`;
            updateDots();
        }

        // --- 核心手势逻辑 (绑定在全局 window 上) ---
        
        const handleStart = (clientX, clientY, target) => {
            // 如果点在圆点上，或者已经处于拖拽状态，不做处理
            if (target.closest('#dots-track')) return;

            startX = clientX;
            startY = clientY;
            currentTranslateX = -currentIndex * pageWidth;
            
            isDragging = false;
            isLongPress = false;
            pagesTrack.classList.remove('is-dragging'); // 确保没有残留 class

            // 启动长按计时器
            longPressTimer = setTimeout(() => {
                isLongPress = true;
                // 这里放长按逻辑，测试用弹窗代替
                alertBox.classList.add('show');
                if (navigator.vibrate) navigator.vibrate(50);
            }, 500);
        };

        const handleMove = (clientX, clientY) => {
            const dx = clientX - startX;
            const dy = clientY - startY;

            // 如果移动了，立刻取消长按
            if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                clearTimeout(longPressTimer);
            }

            // 判定为横向滑动 (左右移动大于上下移动，且移动距离大于 10px)
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
                isDragging = true;
                pagesTrack.classList.add('is-dragging'); // 关闭动画过渡
                
                // 跟随手指位移
                pagesTrack.style.transform = `translateX(${currentTranslateX + dx * 1.2}px)`;
            }
        };

        const handleEnd = (clientX) => {
            clearTimeout(longPressTimer);
            
            if (isLongPress) {
                // 长按结束，隐藏弹窗（或者由别的事件关闭）
                setTimeout(() => alertBox.classList.remove('show'), 1000);
                return;
            }

            if (isDragging) {
                const dx = clientX - startX;
                const threshold = pageWidth * 0.15;

                // 判断翻页方向
                if (dx < -threshold) {
                    currentIndex = Math.min(currentIndex + 1, pageCount - 1);
                } else if (dx > threshold) {
                    currentIndex = Math.max(currentIndex - 1, 0);
                }

                // 吸附
                snapToPage();
                isDragging = false;
            }
        };

        // --- 事件绑定 ---

        // 1. 触摸事件 (移动端)
        window.addEventListener('touchstart', (e) => {
            handleStart(e.touches[0].clientX, e.touches[0].clientY, e.target);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            // 如果正在拖拽翻页，必须阻止默认滚动
            if (isDragging) {
                e.preventDefault(); 
            }
            handleMove(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            handleEnd(e.changedTouches[0].clientX);
        });

        // 2. 鼠标事件 (PC端)
        window.addEventListener('mousedown', (e) => {
            handleStart(e.clientX, e.clientY, e.target);
        });

        window.addEventListener('mousemove', (e) => {
            handleMove(e.clientX, e.clientY);
        });

        window.addEventListener('mouseup', (e) => {
            handleEnd(e.clientX);
        });

        // 3. 圆点点击事件 (直接点击某个圆点)
        dots.forEach((dot, index) => {
            dot.addEventListener('click', () => {
                if (isDragging) return; // 如果刚拖拽完，不触发点击
                currentIndex = index;
                snapToPage();
            });
        });

        // 窗口大小改变时重新对齐
        window.addEventListener('resize', () => {
            pageWidth = window.innerWidth;
            snapToPage();
        });
    </script>
</body>
</html>
