<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>全屏拖拽翻页测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: sans-serif;
            touch-action: none;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        #pages-viewport {
            width: 100vw; height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #pages-track {
            display: flex;
            height: 100%;
            width: 300vw;
            transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform: translate3d(0, 0, 0);
            will-change: transform;
        }

        .page {
            width: 100vw; height: 100%;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
        }
        .page:nth-child(1) { background: linear-gradient(135deg, #ff4757, #ff6b81); }
        .page:nth-child(2) { background: linear-gradient(135deg, #2ed573, #7bed9f); }
        .page:nth-child(3) { background: linear-gradient(135deg, #1e90ff, #70a1ff); }

        .longpress-alert {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 40px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 20px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 100;
        }
        .longpress-alert.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        #control-bar {
            position: fixed;
            bottom: 0; left: 0;
            width: 100%; height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        #dots-track {
            display: flex;
            gap: 15px;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        .dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: transform 0.2s, background 0.2s;
            cursor: pointer;
            position: relative;
        }
        .dot::after {
            content: '';
            position: absolute;
            top: -12px; left: -12px;
            right: -12px; bottom: -12px;
        }
        .dot.active {
            background: #fff;
            transform: scale(1.3);
        }
    </style>
</head>
<body>

    <div id="pages-viewport">
        <div id="pages-track">
            <div class="page">Page 1</div>
            <div class="page">Page 2</div>
            <div class="page">Page 3</div>
        </div>
    </div>

    <div class="longpress-alert" id="alertBox">触发长按！</div>

    <div id="control-bar">
        <div id="dots-track">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <script>
        const pagesTrack = document.getElementById('pages-track');
        const dots = document.querySelectorAll('.dot');
        const alertBox = document.getElementById('alertBox');
        const pageCount = dots.length;
        let pageWidth = window.innerWidth;

        let currentIndex = 0;

        /* ---------- 手势状态 ---------- */
        let startX = 0, startY = 0;
        let isActive = false;       // 是否有一次手势正在进行
        let isDragging = false;
        let isLongPress = false;
        let longPressTimer = null;
        let dragStartTranslate = 0; // 手势开始时的 translateX
        let lastTouchTime = 0;      // 用于忽略触摸后模拟的鼠标事件

        pagesTrack.style.width = `${pageCount * 100}vw`;

        function updateDotsByIndex(idx) {
            dots.forEach((dot, i) => dot.classList.toggle('active', i === idx));
        }

        function snapToPage() {
            pagesTrack.style.transition = 'transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1)';
            const x = -currentIndex * pageWidth;
            pagesTrack.style.transform = `translate3d(${x}px, 0, 0)`;
            updateDotsByIndex(currentIndex);
        }

        function clearLongPressTimer() {
            if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
        }

        /* ---------- 开始 ---------- */
        function begin(x, y, target) {
            if (target && target.closest && target.closest('#dots-track')) return false;

            startX = x;
            startY = y;
            dragStartTranslate = -currentIndex * pageWidth;

            isActive = true;
            isDragging = false;
            isLongPress = false;

            clearLongPressTimer();
            longPressTimer = setTimeout(() => {
                if (isActive && !isDragging) {
                    isLongPress = true;
                    alertBox.classList.add('show');
                    if (navigator.vibrate) navigator.vibrate(50);
                }
            }, 500);

            return true;
        }

        /* ---------- 移动 ---------- */
        function move(x, y) {
            if (!isActive) return;

            const dx = x - startX;
            const dy = y - startY;

            if (!isDragging) {
                if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                    clearLongPressTimer();
                }
                if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
                    isDragging = true;
                    if (isLongPress) {
                        isLongPress = false;
                        alertBox.classList.remove('show');
                    }
                    // ★ 关键：直接覆盖内联 transition，才能立即跟手
                    pagesTrack.style.transition = 'none';
                }
            }

            if (isDragging) {
                const pos = dragStartTranslate + dx;
                pagesTrack.style.transform = `translate3d(${pos}px, 0, 0)`;

                // ★ 实时更新圆点
                const preview = Math.max(0, Math.min(Math.round(-pos / pageWidth), pageCount - 1));
                updateDotsByIndex(preview);
            }
        }

        /* ---------- 结束 ---------- */
        function end(x) {
            clearLongPressTimer();
            if (!isActive) return;

            if (isLongPress) {
                isLongPress = false;
                isActive = false;
                setTimeout(() => alertBox.classList.remove('show'), 1000);
                snapToPage();
                return;
            }

            if (isDragging) {
                const dx = x - startX;
                const finalPos = dragStartTranslate + dx;
                // ★ 根据松手时的最终位置吸附到最近页
                currentIndex = Math.max(0, Math.min(Math.round(-finalPos / pageWidth), pageCount - 1));
            }

            isActive = false;
            isDragging = false;
            snapToPage();
        }

        function cancel() {
            clearLongPressTimer();
            if (!isActive) return;
            isActive = false;
            isDragging = false;
            isLongPress = false;
            alertBox.classList.remove('show');
            snapToPage();
        }

        /* ========== 触摸事件（移动端） ========== */
        window.addEventListener('touchstart', (e) => {
            if (isActive || e.touches.length !== 1) return;
            lastTouchTime = Date.now();
            const t = e.touches[0];
            begin(t.clientX, t.clientY, e.target);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isActive) return;
            const t = e.touches[0];
            if (!t) return;
            if (isDragging) e.preventDefault();  // 只在拖拽时阻止默认
            move(t.clientX, t.clientY);
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (!isActive) return;
            const t = e.changedTouches[0];
            if (t) end(t.clientX);
        });

        window.addEventListener('touchcancel', cancel);

        /* ========== 鼠标事件（桌面端） ========== */
        window.addEventListener('mousedown', (e) => {
            if (e.button !== 0 || isActive) return;
            if (Date.now() - lastTouchTime < 800) return; // 忽略触摸模拟的鼠标事件
            begin(e.clientX, e.clientY, e.target);
        });

        window.addEventListener('mousemove', (e) => {
            if (!isActive) return;
            move(e.clientX, e.clientY);
        });

        window.addEventListener('mouseup', (e) => {
            if (!isActive) return;
            end(e.clientX);
        });

        /* ========== 圆点点击：立即切到对应页 ========== */
        dots.forEach((dot, index) => {
            const handler = (e) => {
                e.preventDefault();
                e.stopPropagation();
                clearLongPressTimer();
                alertBox.classList.remove('show');
                isActive = false;
                isDragging = false;
                isLongPress = false;
                currentIndex = index;
                snapToPage();
            };
            dot.addEventListener('touchstart', handler, { passive: false });
            dot.addEventListener('mousedown', handler);
        });

        /* 窗口尺寸变化 */
        window.addEventListener('resize', () => {
            pageWidth = window.innerWidth;
            snapToPage();
        });
    </script>
</body>
</html>
