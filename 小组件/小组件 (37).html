<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>多组件日历 - 绝对网格吸附版</title>
<style>
    * { 
        margin: 0; padding: 0; box-sizing: border-box; 
        -webkit-tap-highlight-color: transparent;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    
    html, body {
        width: 100%; height: 100%;
        /* 🌟 使用 dvh 避开手机底栏遮挡 */
        height: 100dvh; 
        overflow: hidden; background: #000; color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", STHeiti, "Microsoft Yahei", Tahoma, Simsun, sans-serif;
        touch-action: none; overscroll-behavior: none;
    }

    #pages-viewport {
        width: 100vw; height: 100%;
        height: 100dvh;
        overflow: hidden; position: relative;
        touch-action: none;
    }

    #pages-track {
        display: flex; height: 100%;
        transform: translate3d(0, 0, 0);
        will-change: transform;
        touch-action: none;
    }

    /* 🌟 核心：严格的 3 点网格槽位 */
    .page {
        width: 100vw; height: 100%;
        flex-shrink: 0;
        display: grid;
        /* 竖屏默认 1列3行，横屏自动变成 3列1行 */
        grid-template-columns: 1fr;
        grid-template-rows: repeat(3, 1fr);
        justify-items: center;
        align-items: center;
        gap: 10px;
        /* 上下留出安全边距，避开刘海和底栏 */
        padding: 8vh 20px 12vh 20px; 
        box-sizing: border-box;
        touch-action: none;
    }
    
    @media (min-aspect-ratio: 1/1) {
        .page {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 1fr;
        }
    }

    /* --- 日历卡片样式 --- */
    .calendar-card {
        position: relative; 
        width: 100%;
        max-width: 460px; 
        max-height: 28vh; /* 确保 3 个能放得下 */
        aspect-ratio: 1.3; /* 强制宽高比，让网格更美观 */
        border-radius: 24px;
        padding: clamp(16px, 3vw, 24px);
        overflow: hidden;
        background: 
            linear-gradient(to bottom, #000000 0%, rgba(0, 0, 0, 0.8) 30%, transparent 60%),
            radial-gradient(circle at 0% 100%, rgba(0, 80, 50, 0.9) 0%, rgba(0, 40, 25, 0.4) 40%, transparent 70%),
            radial-gradient(circle at 100% 80%, rgba(60, 20, 100, 0.6) 0%, transparent 60%),
            #040408;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
        transform-origin: center center;
        will-change: transform, opacity;
        touch-action: none;
    }

    .calendar-card.is-minimized {
        transform: scale(0.9) translate3d(0, 0, 0);
        opacity: 0.85;
    }

    /* 🌟 拖拽悬浮状态 */
    .calendar-card.is-dragging-card {
        position: fixed !important;
        transition: none !important;
        z-index: 9999;
        opacity: 0.95 !important;
        transform: scale(1.05) !important;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255,255,255,0.2);
        pointer-events: none;
    }

    /* 🌟 幽灵占位符，死守网格中心点 */
    .drag-placeholder {
        visibility: hidden;
        pointer-events: none;
    }

    .calendar-card.is-hidden {
        transform: scale(0.5) translate3d(0, 50px, 0);
        opacity: 0;
        pointer-events: none; 
    }

    .close-btn {
        position: absolute; top: 12px; right: 12px;
        width: 28px; height: 28px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        display: flex; justify-content: center; align-items: center;
        opacity: 0; visibility: hidden; transform: scale(0.5);
        transition: all 0.3s ease;
        pointer-events: none; z-index: 20;
    }
    
    .calendar-card.is-minimized .close-btn {
        opacity: 1; visibility: visible; transform: scale(1);
        pointer-events: auto;
    }
    
    .close-btn::before { content: ''; width: 10px; height: 2px; background-color: #fff; border-radius: 1px; }

    .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 12px; pointer-events: none; }
    .title { color: #fff; font-size: clamp(24px, 5vw, 40px); font-weight: 400; line-height: 1; }
    .subtitle { color: rgba(255, 255, 255, 0.45); font-size: 10px; font-weight: 300; letter-spacing: 1px; margin-bottom: 4px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 4px; text-align: center; pointer-events: none; }
    .weekday { color: rgba(255, 255, 255, 0.35); font-size: 10px; font-weight: 300; }
    .day { color: #fff; font-size: clamp(12px, 2.5vw, 16px); font-weight: 300; width: 100%; max-width: 32px; aspect-ratio: 1; display: flex; justify-content: center; align-items: center; margin: 0 auto; }
    .day.active { border: 1px solid rgba(160, 130, 255, 0.5); border-radius: 50%; background: rgba(120, 90, 255, 0.08); }
    
    .calendar-card::after {
        content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px;
        background: linear-gradient(90deg, #00ff88 0%, #00ccff 30%, #6b21a8 100%);
        box-shadow: 0 -2px 10px rgba(0, 255, 136, 0.5); border-bottom-left-radius: 24px; border-bottom-right-radius: 24px;
    }

    /* --- 底部控制条 --- */
    #control-bar {
        position: fixed; 
        bottom: 5vh; /* 避开底栏 */
        left: 0; width: 100%; height: 60px;
        display: flex; justify-content: center; align-items: center; z-index: 10; pointer-events: none;
    }
    #dots-track {
        position: relative; display: flex; align-items: center; gap: 24px; padding: 12px 24px;
        background: rgba(255,255,255,0.12); border-radius: 40px; backdrop-filter: blur(10px);
        pointer-events: auto; touch-action: none;
    }
    
    .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.35); transition: all 0.3s; }
    .dot.is-shrink { transform: scale(0); opacity: 0; }

    #slider {
        position: absolute; top: 50%; width: 20px; height: 20px; margin-top: -10px; margin-left: -10px;
        border-radius: 50%; background: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.6);
        pointer-events: none; left: 0; will-change: left, transform; transition: transform 0.2s;
    }
    #slider.dragging { transform: scale(1.3); }

    .global-add-btn {
        position: fixed; bottom: 5vh; right: 20px; width: 50px; height: 50px; border-radius: 50%;
        background: linear-gradient(135deg, #00ff88 0%, #00ccff 100%); box-shadow: 0 5px 20px rgba(0, 255, 136, 0.4);
        display: flex; justify-content: center; align-items: center;
        opacity: 0; visibility: hidden; transform: scale(0.5);
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        z-index: 100; cursor: pointer;
    }
    .global-add-btn.show { opacity: 1; visibility: visible; transform: scale(1); }
    .global-add-btn::before, .global-add-btn::after { content: ''; position: absolute; background-color: #000; border-radius: 2px; }
    .global-add-btn::before { width: 16px; height: 2px; }
    .global-add-btn::after { width: 2px; height: 16px; }
</style>
</head>
<body>

    <div id="pages-viewport">
        <div id="pages-track"></div>
    </div>

    <div class="global-add-btn" id="addBtn"></div>

    <div id="control-bar">
        <div id="dots-track">
            <div id="slider"></div>
        </div>
    </div>

<script>
(function() {
    'use strict';

    const pagesTrack = document.getElementById('pages-track');
    const dotsTrack = document.getElementById('dots-track');
    const slider = document.getElementById('slider');
    const addBtn = document.getElementById('addBtn');
    
    let pagesData = []; 
    let PAGE_COUNT = 0;
    let pageWidth = window.innerWidth;
    let isEditingMode = false;
    let wasLongPressed = false; 

    let progress = 0, targetProgress = 0, currentPage = 0;
    let rafId = null, dragging = false, dragSource = null;
    let startX = 0, startY = 0, startProgress = 0, startTime = 0;
    let isPressing = false, longPressTimer = null, pressedDotIndex = -1;
    let activeTouchId = null, lastTouchTime = 0;
    let dotCenters = [], dotSpacing = 1;
    let lastNearestIdx = -1; 

    // 拖拽状态
    let dragCard = null;          
    let dragPlaceholder = null;   
    let dragOffsetX = 0;          
    let dragOffsetY = 0;
    let currentHoverCard = null; 

    function getCalendarData() {
        const today = new Date();
        const weekdaysChinese = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        const startOfWeek = new Date(today);
        startOfWeek.setDate(today.getDate() - today.getDay());
        const days = [];
        for (let i = 0; i < 7; i++) {
            const d = new Date(startOfWeek);
            d.setDate(startOfWeek.getDate() + i);
            days.push({
                num: d.getDate(),
                isToday: d.getDate() === today.getDate() && d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear()
            });
        }
        return { weekdayTitle: weekdaysChinese[today.getDay()], days };
    }

    function createCardElement(animate = true) {
        const { weekdayTitle, days } = getCalendarData();
        const card = document.createElement('div');
        card.className = 'calendar-card';
        card.innerHTML = `
            <div class="close-btn"></div>
            <div class="header">
                <div class="title">${weekdayTitle}</div>
                <div class="subtitle">CALENDAR</div>
            </div>
            <div class="calendar-grid">
                <div class="weekday">日</div><div class="weekday">一</div><div class="weekday">二</div>
                <div class="weekday">三</div><div class="weekday">四</div><div class="weekday">五</div><div class="weekday">六</div>
            </div>
        `;
        const grid = card.querySelector('.calendar-grid');
        days.forEach(day => {
            const dayDiv = document.createElement('div');
            dayDiv.className = `day ${day.isToday ? 'active' : ''}`;
            dayDiv.textContent = day.num;
            grid.appendChild(dayDiv);
        });
        card.querySelector('.close-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            deleteCard(card);
        });

        if (animate) {
            requestAnimationFrame(() => {
                card.animate([
                    { opacity: 0, transform: 'scale(0.85)' },
                    { opacity: 1, transform: 'scale(1)' }
                ], { duration: 400, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)', fill: 'both' });
            });
        }
        return card;
    }

    function measure() {
        pageWidth = window.innerWidth;
        const trackRect = dotsTrack.getBoundingClientRect();
        const dots = dotsTrack.querySelectorAll('.dot');
        dotCenters = [];
        dots.forEach(d => {
            const r = d.getBoundingClientRect();
            dotCenters.push(r.left - trackRect.left + r.width / 2);
        });
        dotSpacing = dotCenters.length > 1 ? (dotCenters[dotCenters.length - 1] - dotCenters[0]) / (dotCenters.length - 1) : 1;
    }

    function getCardRects() {
        const map = new Map();
        document.querySelectorAll('.calendar-card:not(.drag-placeholder)').forEach(c => map.set(c, c.getBoundingClientRect()));
        return map;
    }

    // 平滑的补位动画
    function applyFlip(oldRects, excludeCard) {
        document.querySelectorAll('.calendar-card:not(.drag-placeholder)').forEach(c => {
            if (c === excludeCard) return; 
            const oldRect = oldRects.get(c);
            if (!oldRect) return;

            const newRect = c.getBoundingClientRect();
            const dx = oldRect.left - newRect.left;
            const dy = oldRect.top - newRect.top;
            
            if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
                const isMin = c.classList.contains('is-minimized');
                const targetScale = isMin ? 0.9 : 1;
                
                c.animate([
                    { transform: `translate3d(${dx}px, ${dy}px, 0) scale(${targetScale})` },
                    { transform: `translate3d(0, 0, 0) scale(${targetScale})` }
                ], { duration: 350, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' });
            }
        });
    }

    function renderPages(rearrangeDOM = false) {
        if (rearrangeDOM) {
            pagesTrack.innerHTML = '';
            const oldDots = dotsTrack.querySelectorAll('.dot');
            oldDots.forEach(d => d.remove());

            PAGE_COUNT = pagesData.length;
            pagesTrack.style.width = (PAGE_COUNT * 100) + 'vw';

            pagesData.forEach((pageCards, pageIdx) => {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page';
                pageCards.forEach(card => pageDiv.appendChild(card));
                pagesTrack.appendChild(pageDiv);

                const dot = document.createElement('div');
                dot.className = 'dot';
                dotsTrack.insertBefore(dot, slider);
            });
            measure();
            renderSlider();
        }
    }

    function addNewCard() {
        if (pagesData.length === 0) pagesData.push([]);
        let lastPageIdx = pagesData.length - 1;
        
        const wasNewPage = pagesData[lastPageIdx].length >= 3;
        
        if (wasNewPage) {
            lastPageIdx++;
            pagesData.push([]);
            const newPageDOM = document.createElement('div');
            newPageDOM.className = 'page';
            pagesTrack.appendChild(newPageDOM);
            const newDot = document.createElement('div');
            newDot.className = 'dot';
            dotsTrack.insertBefore(newDot, slider);
            PAGE_COUNT++;
            pagesTrack.style.width = (PAGE_COUNT * 100) + 'vw';
        }

        const oldRects = getCardRects();
        const newCard = createCardElement(true);
        pagesData[lastPageIdx].push(newCard);
        if (isEditingMode) newCard.classList.add('is-minimized');
        
        pagesTrack.children[lastPageIdx].appendChild(newCard);
        measure();
        
        if (!wasNewPage) {
            pagesTrack.style.transition = 'none';
            pagesTrack.style.transform = `translate3d(${-currentPage * pageWidth}px, 0, 0)`;
            progress = currentPage; targetProgress = currentPage;
            applyFlip(oldRects, newCard);
            renderSlider();
        } else {
            setTimeout(() => settleTo(lastPageIdx), 300);
        }
    }

    function deleteCard(card) {
        if (card === dragCard) return;
        card.classList.add('is-hidden');
        
        setTimeout(() => {
            card.remove();
            let pageIdx = -1, cardIdx = -1;
            for (let i = 0; i < pagesData.length; i++) {
                const idx = pagesData[i].indexOf(card);
                if (idx > -1) { pageIdx = i; cardIdx = idx; break; }
            }

            if (pageIdx > -1) {
                const oldRects = getCardRects();
                pagesData[pageIdx].splice(cardIdx, 1);
                
                let pageRemoved = false;
                if (pagesData[pageIdx].length === 0 && pagesData.length > 1) {
                    pagesData.splice(pageIdx, 1);
                    pageRemoved = true;
                }
                if (pagesData.length === 0) {
                    pagesData.push([]);
                    pageRemoved = true;
                }
                
                if (pageRemoved) {
                    renderPages(true);
                    if (currentPage >= PAGE_COUNT) currentPage = PAGE_COUNT - 1;
                    settleTo(currentPage);
                } else {
                    pagesTrack.style.transition = 'none';
                    pagesTrack.style.transform = `translate3d(${-currentPage * pageWidth}px, 0, 0)`;
                    progress = currentPage; targetProgress = currentPage;
                    applyFlip(oldRects);
                    renderSlider();
                }
            }
        }, 300); 
    }

    function renderPage() {
        pagesTrack.style.transform = 'translate3d(' + (-progress * pageWidth) + 'px, 0, 0)';
    }

    function renderSlider() {
        if (PAGE_COUNT <= 1) return;
        let p = Math.max(0, Math.min(progress, PAGE_COUNT - 1));
        const i1 = Math.floor(p);
        const i2 = Math.min(i1 + 1, PAGE_COUNT - 1);
        const t = p - i1;
        slider.style.left = (dotCenters[i1] + (dotCenters[i2] - dotCenters[i1]) * t) + 'px';
        
        const nearestIdx = Math.round(p);
        if (nearestIdx !== lastNearestIdx) {
            lastNearestIdx = nearestIdx;
            dotsTrack.querySelectorAll('.dot').forEach((dot, idx) => {
                dot.classList.toggle('is-shrink', idx === nearestIdx);
            });
        }
    }

    function lerpLoop() {
        const diff = targetProgress - progress;
        if (Math.abs(diff) < 0.0008) {
            progress = targetProgress;
            renderPage(); renderSlider(); rafId = null; return;
        }
        progress += diff * 0.18;
        renderPage(); renderSlider();
        rafId = requestAnimationFrame(lerpLoop);
    }

    function settleTo(idx) {
        idx = Math.max(0, Math.min(idx, PAGE_COUNT - 1));
        currentPage = idx;
        targetProgress = idx;
        if (!rafId) rafId = requestAnimationFrame(lerpLoop);
    }

    function enterEditMode() {
        if (isEditingMode) return;
        isEditingMode = true; wasLongPressed = true;
        requestAnimationFrame(() => {
            addBtn.classList.add('show');
            document.querySelectorAll('.calendar-card').forEach(c => c.classList.add('is-minimized'));
        });
        if (navigator.vibrate) navigator.vibrate(10);
    }

    function exitEditMode() {
        if (!isEditingMode) return;
        isEditingMode = false;
        addBtn.classList.remove('show');
        document.querySelectorAll('.calendar-card').forEach(c => c.classList.remove('is-minimized'));
    }

    function begin(x, y, target, dotIdx) {
        stopLerp();
        startX = x; startY = y; startTime = Date.now();
        startProgress = progress; targetProgress = progress;
        dragging = false; isPressing = true;
        pressedDotIndex = dotIdx != null ? dotIdx : -1;
        wasLongPressed = false; dragSource = 'page';
        currentHoverCard = null;

        const cardEl = target.closest('.calendar-card');
        if (isEditingMode && cardEl && !target.closest('.close-btn')) {
            dragSource = 'card';
            dragCard = cardEl;
            const rect = cardEl.getBoundingClientRect();
            dragOffsetX = x - rect.left;
            dragOffsetY = y - rect.top;
        }

        clearLP();
        longPressTimer = setTimeout(() => {
            if (isPressing && !dragging) { enterEditMode(); pressedDotIndex = -1; }
        }, 500);
    }

    function move(x, y, e) {
        if (!isPressing) return;
        const dx = x - startX;
        const dy = y - startY;

        if (!dragging) {
            if (Math.abs(dx) > 8 || Math.abs(dy) > 8) clearLP();
            if ((Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
                if (dragSource === 'card') {
                    dragging = true;
                    slider.classList.remove('dragging');
                    
                    // 生成幽灵占位
                    dragPlaceholder = document.createElement('div');
                    dragPlaceholder.className = 'calendar-card drag-placeholder';
                    dragCard.parentNode.insertBefore(dragPlaceholder, dragCard);
                    
                    dragCard.classList.add('is-dragging-card');
                    const rect = dragCard.getBoundingClientRect();
                    dragCard.style.width = rect.width + 'px';
                    dragCard.style.height = rect.height + 'px';
                    dragCard.style.left = rect.left + 'px';
                    dragCard.style.top = rect.top + 'px';
                    
                } else if (dragSource === 'page' && Math.abs(dx) > Math.abs(dy)) {
                    dragging = true; pressedDotIndex = -1; slider.classList.add('dragging');
                }
            }
        }

        if (!dragging) return;
        if (e && e.cancelable) e.preventDefault();

        if (dragSource === 'card') {
            dragCard.style.left = (x - dragOffsetX) + 'px';
            dragCard.style.top = (y - dragOffsetY) + 'px';

            // 边缘翻页
            if (x > window.innerWidth - 60 && currentPage < PAGE_COUNT - 1) settleTo(currentPage + 1);
            else if (x < 60 && currentPage > 0) settleTo(currentPage - 1);

            // 实时计算覆盖位置
            const elBelow = document.elementFromPoint(x, y);
            const targetCard = elBelow ? elBelow.closest('.calendar-card') : null;
            
            if (targetCard && targetCard !== dragCard && targetCard !== dragPlaceholder && !targetCard.classList.contains('is-hidden')) {
                if (targetCard !== currentHoverCard) {
                    currentHoverCard = targetCard;
                    const oldRects = getCardRects();
                    
                    // 数据层交换
                    let dragPIdx = -1, dragCIdx = -1, targetPIdx = -1, targetCIdx = -1;
                    for (let p = 0; p < pagesData.length; p++) {
                        const dIdx = pagesData[p].indexOf(dragCard);
                        if (dIdx > -1) { dragPIdx = p; dragCIdx = dIdx; }
                        const tIdx = pagesData[p].indexOf(targetCard);
                        if (tIdx > -1) { targetPIdx = p; targetCIdx = tIdx; }
                    }

                    if (dragPIdx > -1 && targetPIdx > -1) {
                        // 互换位置
                        pagesData[dragPIdx][dragCIdx] = targetCard;
                        pagesData[targetPIdx][targetCIdx] = dragCard;
                        
                        // 重新排布 DOM
                        pagesData.forEach((page, pIdx) => {
                            const pageDOM = pagesTrack.children[pIdx];
                            page.forEach(c => pageDOM.appendChild(c));
                        });
                        applyFlip(oldRects, dragCard);
                    }
                }
            } else {
                currentHoverCard = null;
            }

        } else {
            let p = startProgress - dx / pageWidth;
            targetProgress = Math.max(0, Math.min(p, PAGE_COUNT - 1));
            startLerp();
        }
    }

    function end(x, y) {
        clearLP();
        if (!isPressing) return;
        if (wasLongPressed && !dragging) { isPressing = false; return; }

        if (dragging) {
            if (dragSource === 'card') {
                // 🌟 核心：飞回幽灵占位符的位置
                const placeholderRect = dragPlaceholder.getBoundingClientRect();
                const cardRect = dragCard.getBoundingClientRect();
                const targetX = placeholderRect.left - cardRect.left;
                const targetY = placeholderRect.top - cardRect.top;

                dragCard.animate([
                    { transform: `scale(1.05) translate(0, 0)` },
                    { transform: `scale(1) translate(${targetX}px, ${targetY}px)` }
                ], {
                    duration: 350,
                    easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)',
                    fill: 'forwards'
                }).onfinish = () => {
                    dragCard.style.position = '';
                    dragCard.style.width = '';
                    dragCard.style.height = '';
                    dragCard.style.left = '';
                    dragCard.style.top = '';
                    dragCard.style.transform = '';
                    dragCard.classList.remove('is-dragging-card');
                    
                    dragPlaceholder.parentNode.insertBefore(dragCard, dragPlaceholder);
                    dragPlaceholder.remove();
                    
                    if (isEditingMode) dragCard.classList.add('is-minimized');
                    
                    dragCard = null;
                    dragPlaceholder = null;
                    currentHoverCard = null;

                    // 清理空页
                    let emptyPages = [];
                    pagesData.forEach((page, idx) => { if (page.length === 0) emptyPages.push(idx); });
                    if (emptyPages.length > 0) {
                        emptyPages.forEach(idx => pagesData.splice(idx, 1));
                        if (pagesData.length === 0) pagesData.push([]);
                        renderPages(true);
                        settleTo(Math.min(currentPage, PAGE_COUNT - 1));
                    }
                };

            } else {
                const dx = x - startX;
                const velocity = dx / (Date.now() - startTime); 
                let target = Math.round(targetProgress);
                if (Math.abs(velocity) > 0.5) {
                    if (velocity > 0 && currentPage > 0) target = currentPage - 1;
                    if (velocity < 0 && currentPage < PAGE_COUNT - 1) target = currentPage + 1;
                }
                settleTo(target);
            }
        } else if (pressedDotIndex >= 0) {
            settleTo(pressedDotIndex);
        } else {
            const el = document.elementFromPoint(x, y);
            const isClickingCard = el && (el.closest('.calendar-card') || el.closest('.global-add-btn'));
            if (isEditingMode && !isClickingCard) exitEditMode();
        }

        dragging = false;
        isPressing = false;
        pressedDotIndex = -1;
        slider.classList.remove('dragging');
    }

    function cancel() {
        clearLP();
        if (!isPressing) return;
        dragging = false; isPressing = false; pressedDotIndex = -1;
        slider.classList.remove('dragging');
        settleTo(currentPage);
    }

    function stopLerp() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
    function startLerp() { if (!rafId) rafId = requestAnimationFrame(lerpLoop); }

    // 事件绑定...
    document.addEventListener('touchstart', function(e) {
        if (activeTouchId !== null || e.touches.length !== 1) return;
        const t = e.touches[0];
        activeTouchId = t.identifier; lastTouchTime = Date.now();
        if (e.target.closest('#dots-track') && PAGE_COUNT > 1) {
            const rect = dotsTrack.getBoundingClientRect();
            begin(t.clientX, t.clientY, e.target, nearestDotIndex(t.clientX - rect.left));
        } else {
            begin(t.clientX, t.clientY, e.target, -1);
        }
    }, { passive: true });

    document.addEventListener('touchmove', function(e) {
        if (activeTouchId === null) return;
        for (let i = 0; i < e.touches.length; i++) {
            if (e.touches[i].identifier === activeTouchId) {
                move(e.touches[i].clientX, e.touches[i].clientY, e); break;
            }
        }
    }, { passive: false });

    document.addEventListener('touchend', function(e) {
        if (activeTouchId === null) return;
        for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === activeTouchId) {
                end(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                activeTouchId = null; lastTouchTime = Date.now(); break;
            }
        }
    });

    document.addEventListener('touchcancel', function() {
        activeTouchId = null; cancel();
    });

    document.addEventListener('mousedown', function(e) {
        if (e.button !== 0 || Date.now() - lastTouchTime < 500) return;
        if (e.target.closest('#dots-track') && PAGE_COUNT > 1) {
            const rect = dotsTrack.getBoundingClientRect();
            begin(e.clientX, e.clientY, e.target, nearestDotIndex(e.clientX - rect.left));
        } else {
            begin(e.clientX, e.clientY, e.target, -1);
        }
    });

    document.addEventListener('mousemove', function(e) {
        if (!isPressing) return;
        move(e.clientX, e.clientY, e);
    });

    document.addEventListener('mouseup', function(e) {
        if (!isPressing) return;
        end(e.clientX, e.clientY);
    });

    addBtn.addEventListener('click', function(e) { e.stopPropagation(); addNewCard(); });

    window.addEventListener('resize', function() {
        measure(); progress = currentPage; targetProgress = currentPage; lastNearestIdx = -1;
        renderPage(); renderSlider();
    });

    function init() {
        pagesTrack.innerHTML = ''; dotsTrack.querySelectorAll('.dot').forEach(d => d.remove());
        pagesData = []; PAGE_COUNT = 0; currentPage = 0; lastNearestIdx = -1;

        const firstPage = document.createElement('div'); firstPage.className = 'page';
        pagesTrack.appendChild(firstPage); pagesData.push([]);
        const firstDot = document.createElement('div'); firstDot.className = 'dot';
        dotsTrack.insertBefore(firstDot, slider); PAGE_COUNT = 1;
        pagesTrack.style.width = '100vw';

        addNewCard(); addNewCard(); addNewCard(); addNewCard();
        settleTo(0);
    }
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else { init(); }

})();
</script>
</body>
</html>
