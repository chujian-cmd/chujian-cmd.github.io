(function(){
  "use strict";
  // 统一节流
  window.__throttle = function(fn, wait){
    var last=0, timer=null;
    return function(){
      var now=Date.now(), ctx=this, args=arguments;
      var remain = wait - (now - last);
      if(remain <= 0){ last=now; fn.apply(ctx,args); }

    };
  };
  // 安全 querySelector
  window.$ = function(sel, root){ try{ return (root||document).querySelector(sel); }catch(e){ return null; } };
  window.$$ = function(sel, root){ try{ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }catch(e){ return []; } };
  // 安全绑定
  window.on = function(el, ev, fn, opt){ if(el && el.addEventListener){ try{ el.addEventListener(ev, fn, opt||false); }catch(e){} } return el; };
  // rAF 节流
  window.__rafThrottle = function(fn){
    var ticking=false;
    return function(){
      if(ticking) return; ticking=true;
      var ctx=this, args=arguments;
      requestAnimationFrame(function(){ ticking=false; fn.apply(ctx,args); });
    };
  };
  // 页面隐藏时暂停定时器
  window.__visibility = { hidden:false, handlers:[] };
  document.addEventListener('visibilitychange', function(){
    window.__visibility.hidden = document.hidden;
    window.__visibility.handlers.forEach(function(h){ try{ h(document.hidden); }catch(e){} });
  });
  window.onVisible = function(fn){ if(typeof fn==='function') window.__visibility.handlers.push(fn); };
})();
