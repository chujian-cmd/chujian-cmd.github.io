<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>qaq_2_30_awa</title>
<meta name="color-scheme" content="light dark">

<script>
(function(){
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  let initialMatches = mq.matches;

  let override = null;
  try { override = localStorage.getItem('theme'); } catch(e){}
  if (override !== 'light' && override !== 'dark') override = null;

  window.Theme = {
    dark: false,
    override: override,
    handlers: [],
    onChange(fn){
      this.handlers.push(fn);
      fn(this.dark);
      return fn;
    },
    off(fn){
      const i = this.handlers.indexOf(fn);
      if (i >= 0) this.handlers.splice(i, 1);
    },
    toggle(){
      this.override = this.dark ? 'light' : 'dark';
      try { localStorage.setItem('theme', this.override); } catch(e){}
      this.apply();
    },
    apply(){
      this.dark = this.override ? (this.override === 'dark') : initialMatches;
      document.documentElement.dataset.theme = this.dark ? 'dark' : 'light';
      for (let i = 0; i < this.handlers.length; i++) {
        try { this.handlers[i](this.dark); } catch(e){ console.error(e); }
      }

      const btn = document.getElementById('themeFab');
      if (btn) {
        btn.textContent = this.dark ? '☀️' : '🌙';
        btn.setAttribute('aria-label', this.dark ? '切换到浅色模式' : '切换到深色模式');
      }

      let meta = document.querySelector('meta[name="theme-color"]');
      if (!meta){
        meta = document.createElement('meta');
        meta.name = 'theme-color';
        document.head.appendChild(meta);
      }
      meta.content = this.dark ? '#0d1117' : '#fafafa';
    }
  };

  Theme.dark = override ? (override === 'dark') : initialMatches;
  document.documentElement.dataset.theme = Theme.dark ? 'dark' : 'light';

  const onSysChange = (e) => {
    initialMatches = e.matches;
    if (!Theme.override) Theme.apply();
  };
  if (mq.addEventListener) mq.addEventListener('change', onSysChange);
  else if (mq.addListener) mq.addListener(onSysChange);

  document.addEventListener('DOMContentLoaded', () => Theme.apply());
})();
</script>

window.Boot = {
  el: null, ring: null, pct: null, sr: null,
  value: 15, target: 15, raf: 0, finished: false,
  init(){
    this.el = document.getElementById('boot');
    if (!this.el) return;
    this.ring = this.el.querySelector('.ring-fg');
    this.pct  = this.el.querySelector('.boot-pct');
    this.sr   = document.getElementById('bootSr');
    this.render();   // BUG#1 修复：一进来就渲染 15%
  },
  set(v){
    if (this.finished) return;
    this.target = Math.max(this.target, v);
    this.tick();
  },
  tick(){
    if (this.raf) return;
    const step = () => {
      this.raf = 0;
      const d = this.target - this.value;
      if (Math.abs(d) < 0.4){
        this.value = this.target;
        this.render();
        if (this.value >= 100 && !this.finished) this.finish();
        return;
      }
      this.value += d * 0.14;
      this.render();
      this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  },
  render(){
    const v = Math.round(this.value);
    if (this.pct) this.pct.textContent = v + '%';
    if (this.ring) this.ring.style.strokeDashoffset = 100 - v;
    if (this.el) this.el.setAttribute('aria-valuenow', v);
  },
  finish(){
    this.finished = true;
    // BUG#2 修复：播报加载完成
    if (this.sr) this.sr.textContent = '页面加载完成';
    setTimeout(() => {
      if (!this.el) return;
      this.el.classList.add('gone');
      setTimeout(() => {
        if (this.el && this.el.parentNode) this.el.parentNode.removeChild(this.el);
        this.el = null;
      }, 420);
    }, 260);
  }
};
Boot.init();

window.InputBus = {
  x: 0, y: 0, inside: false, lastMoveTime: 0,
  moveHandlers: [], endHandlers: [],
  onMove(fn){this.moveHandlers.push(fn)},
  onEnd(fn){this.endHandlers.push(fn)},
  _move(x,y){
    this.x=x; this.y=y; this.inside=true; this.lastMoveTime=performance.now();
    for (let i=0;i<this.moveHandlers.length;i++){
      try { this.moveHandlers[i](x,y); } catch(e){ console.error(e); }
    }
  },
  _end(){
    this.inside=false;
    for (let i=0;i<this.endHandlers.length;i++){
      try { this.endHandlers[i](); } catch(e){ console.error(e); }
    }
  }
};

(function(){
  let lastTs = 0;
  function move(x,y){
    const now = performance.now();
    if (now - lastTs < 8) return;
    lastTs = now;
    InputBus._move(x,y);
  }
  window.addEventListener('pointermove', e => move(e.clientX, e.clientY), {passive:true});
  window.addEventListener('pointerdown', e => move(e.clientX, e.clientY), {passive:true});
  window.addEventListener('mousemove',  e => move(e.clientX, e.clientY), {passive:true});
  window.addEventListener('touchmove', e => {
    if (e.touches && e.touches[0]) move(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  window.addEventListener('touchstart', e => {
    if (e.touches && e.touches[0]) move(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  window.addEventListener('pointerup',    () => InputBus._end(), {passive:true});
  window.addEventListener('pointercancel',() => InputBus._end(), {passive:true});
  window.addEventListener('touchend',    () => InputBus._end(), {passive:true});
  window.addEventListener('touchcancel', () => InputBus._end(), {passive:true});
  window.addEventListener('mouseleave',  () => InputBus._end(), {passive:true});
})();

window.addEventListener('DOMContentLoaded', () => Boot.set(45));

<!-- ==================== 水波 ==================== -->
<script>
(function(){
  const canvas = document.getElementById('water-canvas');
  const ctx = canvas.getContext('2d');
  const SCALE = 2, CALM_TIMEOUT = 1500, CALM_THRESHOLD = 0.3;
  let W=0,H=0,cols=0,rows=0,buf1,buf2,imgData,off,offCtx;
  let lastDrop=0, rafId=0;
  let hidden = false;

  function init(){
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    cols = Math.floor(W/SCALE); rows = Math.floor(H/SCALE);
    buf1 = new Float32Array(cols*rows);
    buf2 = new Float32Array(cols*rows);
    imgData = ctx.createImageData(cols, rows);
    if (!off) { off = document.createElement('canvas'); offCtx = off.getContext('2d'); }
    off.width = cols; off.height = rows;
  }

  // BUG#15 修复：主题切换时重置缓冲，避免深色残留
  function resetBuffers(){
    if (buf1) buf1.fill(0);
    if (buf2) buf2.fill(0);
  }

  function drop(x,y,strength){
    if (reduceMotion || hidden) return;
    const gx = Math.floor(x/SCALE), gy = Math.floor(y/SCALE);
    if (gx<1||gx>=cols-1||gy<1||gy>=rows-1) return;
    const radius = 3;
    for (let dy=-radius; dy<=radius; dy++){
      for (let dx=-radius; dx<=radius; dx++){
        const px=gx+dx, py=gy+dy;
        if (px<1||px>=cols-1||py<1||py>=rows-1) continue;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if (dist > radius) continue;
        const falloff = 1 - dist/radius;
        buf1[py*cols+px] -= strength*falloff;
      }
    }
    lastDrop = performance.now();
    ensureRunning();
  }

  // BUG#9 修复：步长从 31 改为 17，灵敏度更高
  function hasEnergy(){
    for (let i=0; i<buf1.length; i+=17){
      if (Math.abs(buf1[i]) > CALM_THRESHOLD) return true;
    }
    return false;
  }

  function update(){
    for (let y=1; y<rows-1; y++){
      const row = y*cols;
      for (let x=1; x<cols-1; x++){
        const i = row+x;
        buf2[i] = (buf1[i-1]+buf1[i+1]+buf1[i-cols]+buf1[i+cols])/2 - buf2[i];
        buf2[i] *= 0.985;
      }
    }
    const t = buf1; buf1 = buf2; buf2 = t;
  }

  function render(){
    const data = imgData.data;
    const dark = window.Theme ? Theme.dark : false;
    const baseR = dark ? 13 : 250;
    const baseG = dark ? 17 : 250;
    const baseB = dark ? 23 : 250;
    const dir   = dark ? -1 : 1;
    const total = cols*rows;
    for (let i=0; i<total; i++){
      const h = buf1[i] * dir * 3;
      const idx = i*4;
      let r = baseR + h, g = baseG + h, b = baseB + h;
      data[idx]   = r < 0 ? 0 : r > 255 ? 255 : r;
      data[idx+1] = g < 0 ? 0 : g > 255 ? 255 : g;
      data[idx+2] = b < 0 ? 0 : b > 255 ? 255 : b;
      data[idx+3] = 255;
    }
    offCtx.putImageData(imgData, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.clearRect(0,0,W,H);
    ctx.drawImage(off, 0,0, cols,rows, 0,0, W,H);
  }

  function loop(){
    rafId = 0;
    if (hidden) return;
    const now = performance.now();
    if ((now - lastDrop) > CALM_TIMEOUT && !hasEnergy()) return;
    update(); render();
    rafId = requestAnimationFrame(loop);
  }

  function ensureRunning(){ if (!rafId && !hidden) rafId = requestAnimationFrame(loop); }

  let lastDropX = -999, lastDropY = -999;
  InputBus.onMove((x,y) => {
    const dx = x - lastDropX, dy = y - lastDropY;
    if (dx*dx + dy*dy < 100) return;
    lastDropX = x; lastDropY = y;
    drop(x,y,3);
  });

  window.addEventListener('resize', init);

  // BUG#12 修复：页面隐藏时暂停渲染
  document.addEventListener('visibilitychange', () => {
    hidden = document.hidden;
    if (hidden && rafId){
      cancelAnimationFrame(rafId); rafId = 0;
    } else if (!hidden){
      ensureRunning();
    }
  });

  init();
  render();

  // BUG#4 修复：主题变化时重置缓冲 + 重绘
  if (window.Theme){
    Theme.onChange(() => {
      resetBuffers();
      render();
    });
  }
})();
</script>

<script>
(function(){
  const cv = document.getElementById('particle-canvas');
  const ctx = cv.getContext('2d');
  const CFG = {
    text:'qaq_2_30_awa',
    font:'"PingFang SC","Microsoft YaHei","Heiti SC","Noto Sans CJK SC",sans-serif',
    weight:800, step:3.5, dotSize:2.0, ease:0.22, jitter:0.03,
    alphaThreshold:0.6,
    colorLight:'#111111',
    colorDark:'#e6edf3',
    mouseForce:1.6, mouseRadius:130, maxParticles:20000
  };
  const hex2rgb = h => {
    const s = h.replace('#','');
    const n = parseInt(s.length===3 ? s.split('').map(c=>c+c).join('') : s, 16);
    return [n>>16&255, n>>8&255, n&255];
  };

  const raster = {
    big: document.createElement('canvas'),
    grid: document.createElement('canvas'),
    bigCtx:null, gridCtx:null,
    init(){
      this.bigCtx = this.big.getContext('2d');
      this.gridCtx = this.grid.getContext('2d', {willReadFrequently:true});
    },
    sample(text, gw, gh, weight, font){
      const BIG_H = 1024;
      const aspect = gw/gh;
      const BIG_W = Math.max(64, Math.round(BIG_H*aspect));
      this.big.width = BIG_W; this.big.height = BIG_H;
      const bc = this.bigCtx;
      bc.clearRect(0,0,BIG_W,BIG_H);
      bc.fillStyle = '#fff'; bc.textAlign = 'center'; bc.textBaseline = 'middle';
      const lines = (text||'你好').split('\n').filter(l=>l.length>0);
      if (!lines.length) return null;
      const maxW = BIG_W*0.82, maxH = BIG_H*0.82;
      let size = Math.floor(Math.min(maxH/lines.length, maxW)*0.85);
      const setFont = s => { bc.font = `${weight} ${s}px ${font}`; };
      setFont(size);
      let widest = 0;
      for (const l of lines) widest = Math.max(widest, bc.measureText(l).width);
      if (widest > maxW){ size = Math.max(4, Math.floor(size*maxW/widest)); setFont(size); }
      const totalH = size*1.15*lines.length;
      if (totalH > maxH){ size = Math.max(4, Math.floor(size*maxH/totalH)); setFont(size); }
      const lineH = size*1.15;
      const startY = BIG_H/2 - (lines.length-1)*lineH/2;
      for (let i=0; i<lines.length; i++) bc.fillText(lines[i], BIG_W/2, startY+i*lineH);
      this.grid.width = gw; this.grid.height = gh;
      const gc = this.gridCtx;
      gc.clearRect(0,0,gw,gh);
      gc.imageSmoothingEnabled = true; gc.imageSmoothingQuality = 'high';
      gc.drawImage(this.big, 0,0, BIG_W,BIG_H, 0,0, gw,gh);
      return gc.getImageData(0,0,gw,gh);
    }
  };
  raster.init();

  class TextParticles {
    constructor(w,h){
      this.w=w; this.h=h; this.n=0;
      this.x=this.y=this.tx=this.ty=this.ox=this.oy=null;
      this.sig='';
    }
    resize(w,h){ this.w=w; this.h=h; this.sig=''; }
    // BUG#5 修复：oy 根据 particle-space 高度动态计算
    getOY(){
      const sp = document.querySelector('.particle-space');
      const spaceH = sp ? sp.getBoundingClientRect().height : 220;
      // 让粒子文字垂直居中于 particle-space 区域
      return Math.max(20, (spaceH - Math.min(220, this.h * 0.3)) / 2);
    }
    rebuild(){
      const w=this.w, h=this.h;
      const areaH = Math.min(220, h*0.3);
      const fit = 0.9;
      const rw = w*fit, rh = areaH;
      const ox = (w-rw)/2;
      // BUG#5 修复：动态计算 oy
      const oy = this.getOY();
      let gw = Math.max(2, Math.round(rw/CFG.step));
      let gh = Math.max(2, Math.round(rh/CFG.step));
      if (gw*gh > CFG.maxParticles){
        const k = Math.sqrt(gw*gh/CFG.maxParticles);
        gw = Math.max(2, Math.round(gw/k));
        gh = Math.max(2, Math.round(gh/k));
      }
      const img = raster.sample(CFG.text, gw, gh, CFG.weight, CFG.font);
      if (!img){ this.n=0; this.sig=''; return; }
      const data = img.data;
      const total = gw*gh;
      const T = CFG.alphaThreshold*255;
      const valid = [];
      for (let i=0; i<total; i++) if (data[i*4+3] > T) valid.push(i);
      const n = valid.length;
      const cw = rw/gw, ch = rh/gh;
      if (n !== this.n){
        this.x = new Float32Array(n); this.y = new Float32Array(n);
        this.tx = new Float32Array(n); this.ty = new Float32Array(n);
        this.ox = new Float32Array(n); this.oy = new Float32Array(n);
      }
      for (let k=0; k<n; k++){
        const i = valid[k];
        const gx = i%gw, gy = (i/gw)|0;
        const targetX = ox + (gx+0.5)*cw;
        const targetY = oy + (gy+0.5)*ch;
        this.ox[k] = targetX; this.oy[k] = targetY;
        this.tx[k] = targetX; this.ty[k] = targetY;
        if (reduceMotion){ this.x[k]=targetX; this.y[k]=targetY; }
        else { this.x[k]=Math.random()*w; this.y[k]=Math.random()*h; }
      }
      this.n = n;
      this.sig = `${CFG.text}|${CFG.weight}|${CFG.font}|${w}x${h}`;
    }
    update(){
      const w=this.w, h=this.h;
      const sig = `${CFG.text}|${CFG.weight}|${CFG.font}|${w}x${h}`;
      if (sig !== this.sig) this.rebuild();
      ctx.clearRect(0,0,w,h);
      if (this.n === 0) return;
      const ease = CFG.ease, dot = CFG.dotSize, half = dot/2;
      const jit = reduceMotion ? 0 : CFG.jitter;
      const dark = window.Theme ? Theme.dark : false;
      const [caR,caG,caB] = hex2rgb(dark ? CFG.colorDark : CFG.colorLight);
      ctx.fillStyle = `rgb(${caR},${caG},${caB})`;
      const mActive = !reduceMotion && InputBus.inside && CFG.mouseForce > 0;
      const mx = InputBus.x, my = InputBus.y;
      const RAD = CFG.mouseRadius, FORCE = CFG.mouseForce;
      for (let i=0; i<this.n; i++){
        let px = this.x[i], py = this.y[i];
        let tx = this.ox[i], ty = this.oy[i];
        if (mActive){
          const dx = px-mx, dy = py-my;
          const d = Math.hypot(dx,dy)+0.001;
          if (d < RAD){
            const v = (1-d/RAD)*FORCE*RAD*0.6;
            tx += (dx/d)*v; ty += (dy/d)*v;
          }
        }
        px += (tx-px)*ease + (Math.random()-0.5)*jit;
        py += (ty-py)*ease + (Math.random()-0.5)*jit;
        this.x[i]=px; this.y[i]=py;
        ctx.fillRect(px-half, py-half, dot, dot);
      }
    }
  }

  let W=0, H=0, particles=null, firstFrame = false;
  let hidden = false;

  function resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W*dpr); cv.height = Math.floor(H*dpr);
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if (particles) particles.resize(W,H);
  }

  function loop(){
    if (hidden) return;
    if (!particles) particles = new TextParticles(W,H);
    particles.update();
    if (!firstFrame){
      firstFrame = true;
      Boot.set(100);
    }
    requestAnimationFrame(loop);
  }

  resize();
  window.addEventListener('resize', resize);

  // BUG#12 修复：页面隐藏时暂停渲染
  document.addEventListener('visibilitychange', () => {
    hidden = document.hidden;
    if (!hidden) requestAnimationFrame(loop);
  });

  function beginParticles(){
    Boot.set(75);
    requestAnimationFrame(loop);
  }
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(() => setTimeout(beginParticles, 80));
  } else {
    setTimeout(beginParticles, 300);
  }
})();
</script>

    );
    if (!focusables.length) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    const active = document.activeElement;

    if (!modal.contains(active)){
      e.preventDefault();
      first.focus();
      return;
    }
    if (e.shiftKey && active === first){
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && active === last){
