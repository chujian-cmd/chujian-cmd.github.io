    const box = document.createElement('div');
    box.className = 'p-cmd-box show';
    box.innerHTML = `<h3>🎁 大额打赏命令！</h3>
      <p style="color:#ba9a8a;font-size:12px;">土豪观众命令你：</p>
      <div class="p-cmd">${cmd}</div>
      <p style="color:#ffdd88;font-size:12px;">打赏 ¥${amount}</p>
      <div style="display:flex;gap:8px;justify-content:center;margin:12px 0;">
        <button onclick="this.closest('.p-cmd-box').remove();Game.systems.live.acceptCommand(${amount})"
          style="background:linear-gradient(135deg,#2a6a2a,#3a8a3a);border-color:#4aaa4a;color:#fff;padding:6px 16px;border-radius:6px;">✅ 接受</button>
        <button onclick="this.closest('.p-cmd-box').remove();Game.systems.live.rejectCommand(${index})"
          style="background:linear-gradient(135deg,#6a2a2a,#8a3a3a);border-color:#aa4a4a;color:#fff;padding:6px 16px;border-radius:6px;">❌ 拒绝</button>
      </div>
      <div class="p-pun">${puns[index]}</div>`;

    document.body.appendChild(box);
    setTimeout(() => { if (box.parentNode) box.remove(); }, 8000);
  },

  /* ── 梦境弹窗 ── */
  showDream(dream) {
    if (!dream) return;
    document.querySelectorAll('.dream-popup').forEach(el => el.remove());

    const pop = document.createElement('div');
    pop.className = 'dream-popup';
    pop.style.borderColor = dream.color;
    pop.innerHTML = `<div style="font-size:48px;margin-bottom:8px;">${dream.title.slice(0, 2)}</div>
      <div style="font-size:18px;color:${dream.color};font-weight:bold;margin-bottom:6px;">${dream.title}</div>
      <div style="font-size:13px;color:#ba9a8a;">${dream.desc}</div>`;
    document.body.appendChild(pop);
    setTimeout(() => pop.remove(), 3000);
  },

  /* ── 攻略成功弹窗 ── */
  showConquered(monster) {
    const old = document.getElementById('p-ach-toast');
    if (old) old.remove();

    const pop = document.createElement('div');
    pop.id = 'p-ach-toast';
    pop.className = 'p-toast show';
    pop.innerHTML = `<div class="p-icon">💕</div>
      <div class="p-name">攻略完成！</div>
      <div class="p-desc">${monster.name} 已被你征服</div>`;
    document.body.appendChild(pop);
    setTimeout(() => pop.remove(), 3000);

    this.addDanmaku(`📢 ${Game.state.player.name} 攻略了 ${monster.name}！`, 'system');
  },

  /* ── 底部按钮 ── */
  setActions(actions) {
    const ar = document.getElementById('action-btns');
    if (!ar) return;
    ar.innerHTML = '';
    actions.forEach(act => {
      const btn = document.createElement('button');
      btn.textContent = act.text;
      btn.onclick = act.fn;
      ar.appendChild(btn);
    });
  },

openAchievements() {
  const state = Game.state;
  const list = AchievementData.map(a => ({ ...a, ok: state.achievements.includes(a.id) }));
  const html = list.map(a => `<div style="padding:10px;margin:5px 0;border:1px solid ${a.ok ? '#8a6a1a' : '#2a1410'};border-radius:8px;background:#140806;opacity:${a.ok ? 1 : .5};">
    <span style="font-size:22px;">${a.icon}</span> <b style="color:${a.ok ? '#ffdd88' : '#7a5a4a'};">${a.name}</b>
    <div style="font-size:10px;color:#8a6a5a;margin-top:3px;">${a.desc} · ${a.ok ? '✅ 已完成' : '🔒 未完成'}</div>
  </div>`).join('');
  this.openModal(`🏆 成就 ${state.achievements.length}/${AchievementData.length}`, html);
},  

  /* ── 导航按钮 ── */
  _bindNavButtons() {

          case 'shop': Game.systems.shop.open(); break;
          case 'achieve': this.openAchievements(); break;
          case 'save':
  var h='<div style="margin-bottom:8px;font-size:11px;color:#8a6a5a;">💾 存档保存在浏览器本地</div>';for(var i=1;i<=3;i++){var r=localStorage.getItem('as_save_'+i);h+='<div style="background:#140806;border:2px solid '+(r?'#3a5a3a':'#2a1410')+';border-radius:8px;padding:10px;margin:6px;"><div style="display:flex;justify-content:space-between;"><span style="font-weight:bold;color:#dda08a;">手动存档'+i+'</span><span style="font-size:10px;color:#6a4a3a;">'+(r?'有存档':'空')+'</span></div><div style="display:flex;gap:6px;margin-top:6px;justify-content:flex-end;">'+(r?'<button onclick="UI.closeModal();Game.systems.save.load('+i+')" style="padding:4px 10px;font-size:11px;background:linear-gradient(135deg,#2a5a2a,#3a8a3a);border-color:#4aaa4a;color:#fff;border-radius:4px;">📂读档</button>':'')+'<button onclick="UI.closeModal();Game.systems.save.save('+i+')" style="padding:4px 10px;font-size:11px;background:linear-gradient(135deg,#3a3a1a,#5a5a2a);border-color:#8a8a3a;color:#ffdd88;border-radius:4px;">💾保存</button></div></div>'}var ar=localStorage.getItem('as_save_auto');h+='<div style="background:#140806;border:2px solid '+(ar?'#3a5a3a':'#2a1410')+';border-radius:8px;padding:10px;margin:6px;"><div style="display:flex;justify-content:space-between;"><span style="font-weight:bold;color:#dda08a;">🔄自动存档</span><span style="font-size:10px;color:#6a4a3a;">'+(ar?'有存档':'空')+'</span></div><div style="display:flex;gap:6px;margin-top:6px;justify-content:flex-end;">'+(ar?'<button onclick="UI.closeModal();Game.systems.save.load(\'auto\')" style="padding:4px 10px;font-size:11px;background:linear-gradient(135deg,#2a5a2a,#3a8a3a);border-color:#4aaa4a;color:#fff;border-radius:4px;">📂读档</button>':'')+'<button onclick="UI.closeModal();Game.systems.save.save(\'auto\')" style="padding:4px 10px;font-size:11px;background:linear-gradient(135deg,#3a3a1a,#5a5a2a);border-color:#8a8a3a;color:#ffdd88;border-radius:4px;">💾保存</button></div></div>';Game.bus.emit('ui:modal',{title:'💾存档管理',body:h});

UI.playIntro = function() {
  const story = Texts.intro;
  let i = 0;

  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:999999;display:flex;justify-content:center;align-items:center;';

  const bx = document.createElement('div');
  bx.style.cssText = 'background:#0a0a0a;border:1px solid #333;border-radius:12px;padding:30px;max-width:460px;width:90%;text-align:center;';

  const av = document.createElement('div');
  av.style.cssText = 'font-size:48px;margin-bottom:8px;';
  av.textContent = '🎭';

  const sp = document.createElement('div');
  sp.style.cssText = 'font-size:15px;color:#aa88cc;font-weight:bold;';

  const de = document.createElement('div');
  de.style.cssText = 'font-size:12px;color:#666;margin:10px 0;font-style:italic;';

  const tx = document.createElement('div');
  tx.style.cssText = 'font-size:14px;color:#ccaa88;line-height:1.8;padding:12px;border-left:2px solid #444;text-align:left;min-height:50px;';

  const btn = document.createElement('button');
  btn.style.cssText = 'padding:10px 30px;border-radius:8px;cursor:pointer;font-size:14px;background:#1a1a1a;border:1px solid #444;color:#aa88cc;margin-top:16px;';

  bx.appendChild(av); bx.appendChild(sp); bx.appendChild(de); bx.appendChild(tx); bx.appendChild(btn);
  ov.appendChild(bx);
  document.body.appendChild(ov);

  function show() {
    const s = story[i];
    sp.textContent = s.speaker;
    de.textContent = s.desc;
    tx.textContent = '「' + s.text + '」';
    btn.textContent = s.last ? '踏入深渊' : '继续';
  }

  btn.onclick = () => {
    if (i < story.length - 1) { i++; show(); }
    else {
      ov.remove();
      Game.systems.live.start();
      UI.refresh();
      UI.toast('🌑 欢迎来到深渊...', 'gold');
    }
  };

  show();
};

UI.playEnding = function() {
  if (document.querySelector('.ending-overlay')) return;
  Game.systems.live.stop();
  const data = Texts.endings;
  let index = 0;

  const ov = document.createElement('div');
  ov.className = 'ending-overlay';
  ov.style.cssText = 'position:fixed;inset:0;background:radial-gradient(circle,#160a20,#000);z-index:999999;display:flex;justify-content:center;align-items:center;padding:16px;';
  const card = document.createElement('div');
  card.style.cssText = 'background:#0a060e;border:2px solid #5a3a7a;border-radius:16px;padding:26px;max-width:560px;width:94%;max-height:90vh;overflow-y:auto;text-align:center;box-shadow:0 0 60px rgba(120,60,180,.3);';
  ov.appendChild(card);
  document.body.appendChild(ov);

  const showIntro = () => {
    const story = data.intro[index];
    card.innerHTML = `<div style="font-size:42px;">🎭</div>
      <h2 style="color:#cc99ff;margin:8px 0;">${story.speaker}</h2>
      <p style="font-size:11px;color:#776688;font-style:italic;">${story.desc}</p>
      <p style="color:#ddc0aa;line-height:1.8;padding:12px;border-left:2px solid #5a3a7a;text-align:left;">「${story.text}」</p>
      <button id="ending-next" style="padding:9px 28px;margin-top:12px;">${index < data.intro.length - 1 ? '继续' : '做出选择'}</button>`;
    card.querySelector('#ending-next').onclick = () => {
      if (index < data.intro.length - 1) {
        index++;
        showIntro();
      } else {
        showChoices();
      }
    };
  };

  const showChoices = () => {
    card.innerHTML = `<div style="font-size:42px;">🌗</div>
      <h2 style="color:#ffddaa;">最终选择</h2>
      <p style="color:#aa8899;">你的旅程将通向何方？</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;">
        <button id="ending-home" style="padding:12px 20px;">☀️ 回到现实</button>
        <button id="ending-pro" style="padding:12px 20px;">🌑 继续深入</button>
      </div>`;
    card.querySelector('#ending-home').onclick = () => showFinal('home');
    card.querySelector('#ending-pro').onclick = () => showFinal('pro');
  };

  const showFinal = (key) => {
    const ending = data[key];
    card.innerHTML = `<h1 style="color:#ffddaa;">${ending.title}</h1>
      <div style="text-align:left;line-height:1.9;color:#c8b0a0;">${ending.text.map(t => `<p>${t}</p>`).join('')}</div>
      <p style="color:#aa88cc;margin-top:18px;">${ending.epilogue}</p>
      <button id="ending-restart" style="padding:9px 24px;margin-top:10px;">重新开始</button>`;
    card.querySelector('#ending-restart').onclick = () => location.reload();
  };

  showIntro();
};


</script>

<!-- ═══════════ 角色创建逻辑 ═══════════ -->
<script>
// ── 属性常量 ──
const ATTRS = [
  { k: 'stamina', icon: '⚡', name: '体力', color: '#ddaa33', def: 40 },
  { k: 'health',  icon: '❤️', name: '健康', color: '#ee3355', def: 40 },
  { k: 'lust',    icon: '🔞', name: '淫荡', color: '#ee3388', def: 10 },
  { k: 'charm',   icon: '✨', name: '魅力', color: '#ee77aa', def: 20 },
  { k: 'agility', icon: '💨', name: '敏捷', color: '#33ccee', def: 40 },
  { k: 'endurance', icon: '🛡️', name: '耐力', color: '#55aa77', def: 50 },
];

let attrVals = {};
let npcList = [];
const GENDERS = ['男', '女', '双性', '无性别'];
const SPECIES = ['人类', '人外'];
const PERSONALITIES = ['粗暴', '温柔', '变态', '冷漠', '狂热', '诡媚'];

// ── 属性界面 ──
function buildAttrs() {
  const area = document.getElementById('attr-area');
  area.innerHTML = '';
  ATTRS.forEach(a => {
    attrVals[a.k] = a.def;
    const v = a.def;
    const pct = Math.min(v, 100);

    const row = document.createElement('div');
    row.className = 'attr-row';
    row.innerHTML = `
      <span class="attr-icon">${a.icon}</span>
      <span class="attr-name">${a.name}</span>
      <div class="attr-bar"><div class="attr-fill" id="fill_${a.k}" style="width:${pct}%;background:${a.color};"></div></div>
      <span class="attr-val" id="val_${a.k}" style="color:${a.color};">${v}</span>
    `;

    const btnM = document.createElement('button');
    btnM.className = 'attr-btn'; btnM.textContent = '−';
    btnM.onclick = () => adjustAttr(a.k, -5);

    const btnP = document.createElement('button');
    btnP.className = 'attr-btn'; btnP.textContent = '+';
    btnP.onclick = () => adjustAttr(a.k, 5);

    row.appendChild(btnM);
    row.appendChild(btnP);
    area.appendChild(row);
  });
  updateSum();
}

function adjustAttr(key, delta) {
  let val = (attrVals[key] || 0) + delta;
  if (val < 0 || val > 100) return;
  attrVals[key] = val;
  document.getElementById('val_' + key).textContent = val;
  document.getElementById('fill_' + key).style.width = Math.min(val, 100) + '%';
  updateSum();
}

function updateSum() {
  const sum = Object.values(attrVals).reduce((s, v) => s + v, 0);
  const el = document.getElementById('attr-summary');
  const btn = document.getElementById('confirm-create');
  if (sum === 200) {
    el.style.cssText = 'background:rgba(32,72,32,.3);border:1px solid #2a5a2a;color:#88dd88;padding:4px 8px;border-radius:4px;';
    el.textContent = '✅ 完美分配！（200/200）';
    btn.disabled = false;
  } else if (sum < 200) {
    el.style.cssText = 'background:rgba(72,72,32,.3);border:1px solid #5a5a2a;color:#dddd88;padding:4px 8px;border-radius:4px;';
    el.textContent = `⏳ 还需 ${200 - sum} 点（${sum}/200）`;
    btn.disabled = true;
  } else {
    el.style.cssText = 'background:rgba(72,32,32,.3);border:1px solid #5a2a2a;color:#dd8888;padding:4px 8px;border-radius:4px;';
    el.textContent = `⚠️ 超出 ${sum - 200} 点（${sum}/200）`;
    btn.disabled = true;
  }
}

// ── NPC列表 ──
function buildNpcs() {
  npcList = NPCData.generateAll();
  renderNpcs();
}

function renderNpcs() {
  const grid = document.getElementById('npc-grid');
  document.getElementById('npc-count-display').textContent = '数量：' + npcList.length;
  grid.innerHTML = '';

  npcList.forEach((n, idx) => {
    const card = document.createElement('div');
    card.className = 'npc-card';
    card.setAttribute('data-idx', idx);

    const optsGen = GENDERS.map(g => `<option${g === n.gender ? ' selected' : ''}>${g}</option>`).join('');
    const optsSp = SPECIES.map(s => `<option${s === n.species ? ' selected' : ''}>${s}</option>`).join('');
    const optsPers = PERSONALITIES.map(p => `<option${p === n.personality ? ' selected' : ''}>${p}</option>`).join('');
    const optsReg = [0,1,2,3,4,5].map(r => `<option value="${r}"${r === n.region ? ' selected' : ''}>${r}</option>`).join('');

    const esc = (s) => (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const anatomyInfo = n.gender === '女' ? `🌸普通女性 · 📏${n.height}cm · ⚔️${n.atk}` : `🍆${n.cock}cm · 📏${n.height}cm · ⚔️${n.atk}`;
    const anatomyField = n.gender === '女' ? '' : `<div class="form-group" style="flex:1;"><label>🍆长度</label><input type="number" value="${n.cock}" min="5" max="50" data-field="cock"></div>`;

    card.innerHTML = `
      <button class="npc-del" onclick="deleteNpc(${idx}, event)">✕</button>
      <div class="npc-name">${esc(n.name)}</div>
      <div class="npc-info">${n.personality} · ${n.species} · ${n.gender} · Lv.${n.level} · ♥${n.lust}</div>
      <div class="npc-info">${anatomyInfo}</div>
      <div class="npc-edit-panel">

function deleteNpc(idx, event) {
  event.stopPropagation();
  if (confirm('确认删除「' + npcList[idx].name + '」？')) {
    npcList.splice(idx, 1);
    renderNpcs();
  }
}

function addNpc() {
  const nextId = npcList.reduce((maxId, npc) => Math.max(maxId, Number(npc.id) || 0), -1) + 1;
  npcList.push({
    id: nextId,
    name: '新怪物（点击编辑）',
    gender: '女', species: '人外',
    personality: '粗暴',
    cock: 0, height: 180, lust: 50, level: 5,
    atk: 75, hp: 150, maxHp: 150,
    appearance: '点击展开编辑面板...',
    region: 0, isBoss: false,
  });
  renderNpcs();
}

function bindNpcEdits() {
  const grid = document.getElementById('npc-grid');
  // 移除旧监听
  if (grid._handler) {
    grid.removeEventListener('change', grid._handler);
    grid.removeEventListener('input', grid._handler);
  }

  grid._handler = (e) => {
    const target = e.target;
    if (!['INPUT', 'SELECT', 'TEXTAREA'].includes(target.tagName)) return;
    if (!target.closest('.npc-edit-panel')) return;

    const card = target.closest('.npc-card');
    if (!card) return;

    const idx = parseInt(card.getAttribute('data-idx'));
    const field = target.getAttribute('data-field');
    if (isNaN(idx) || !field || !npcList[idx]) return;

    let val = target.value;
    if (['cock', 'height', 'lust', 'level', 'region'].includes(field)) val = parseFloat(val) || 0;

    if (field === 'gender') {
      if (val === '双性') val = '扶她';
      if (val === '女') npcList[idx].cock = 0;
      if (val === '扶她' && !npcList[idx].cock) npcList[idx].cock = 22;
      npcList[idx][field] = val;
      renderNpcs();
      return;
    }
    npcList[idx][field] = val;
    npcList[idx].atk = Math.floor(npcList[idx].level * 10 + npcList[idx].lust * 0.5);

    // 刷新卡片显示
    const info = card.querySelectorAll('.npc-info');
    if (info.length >= 2) {
      info[0].textContent = npcList[idx].personality + ' · ' + npcList[idx].species + ' · ' + npcList[idx].gender + ' · Lv.' + npcList[idx].level + ' · ♥' + npcList[idx].lust;
      info[1].textContent = npcList[idx].gender === '女' ? '🌸普通女性 · 📏' + npcList[idx].height + 'cm · ⚔️' + npcList[idx].atk : '🍆' + npcList[idx].cock + 'cm · 📏' + npcList[idx].height + 'cm · ⚔️' + npcList[idx].atk;
    }
    const nameEl = card.querySelector('.npc-name');
    if (nameEl) nameEl.textContent = npcList[idx].name;
  };

  grid.addEventListener('change', grid._handler);
  grid.addEventListener('input', grid._handler);
}

// ── 进入游戏 ──
function startGame() {
  const sum = Object.values(attrVals).reduce((s, v) => s + v, 0);
  if (sum !== 200) { alert('属性总和必须为200！'); return; }

  // 加载AI配置
  AIService.loadConfig();

  // 初始化游戏
  const playerData = {
    name: document.getElementById('p-name')?.value || '苏眠',
    gender: document.getElementById('p-gender')?.value || '女',
    age: parseInt(document.getElementById('p-age')?.value || '22') || 22,
    stamina: attrVals.stamina,
    health: attrVals.health,
    lust: attrVals.lust,
    charm: attrVals.charm,
    agility: attrVals.agility,
    endurance: attrVals.endurance,
  };

  Game.init(playerData, JSON.parse(JSON.stringify(npcList)));

  // 切换界面
  document.getElementById('char-create').style.display = 'none';
  document.getElementById('game-app').style.display = 'block';

  // 初始化UI
  UI.init();
  UI.refresh();
  UI.setActions([
    { text: '🔍 开始探索', fn: () => { Game.systems.explore.doExplore(); UI.renderExplore(); }},
    { text: '💤 休息', fn: () => Game.systems.explore.doRest() },
  ]);

  // 延迟播放开场剧情
  setTimeout(() => UI.playIntro(), 500);
}

// ── 页面初始化 ──
document.addEventListener('DOMContentLoaded', () => {
  buildAttrs();
  buildNpcs();

  document.getElementById('confirm-create').addEventListener('click', startGame);
  document.getElementById('add-npc-btn').addEventListener('click', addNpc);
});

Game.systems.save = {
  save(slot) {
    if (!Game.ready || !Game.state) return;
    try {
      var s = Game.state;
      var data = {
        player: JSON.parse(JSON.stringify(s.player)),
        level: s.level, exp: s.exp, money: s.money,
        region: s.region, anchor: s.anchor,
        exploreCount: s.exploreCount, sexCount: s.sexCount,
        orgasmCount: s.orgasmCount, roughSex: s.roughSex,

        likes: Object.assign({}, s.likes),
        conquered: Object.assign({}, s.conquered),
        map: JSON.parse(JSON.stringify(s.map)),
        inventory: Object.assign({}, s.inventory),
        achievements: s.achievements.slice(),
        bossKills: s.bossKills,
        bossDefeated: Object.assign({}, s.bossDefeated),
        stats: Object.assign({}, s.stats),
        giftTotal: s.giftTotal, viewers: s.viewers,
      };
      localStorage.setItem('as_save_' + slot, JSON.stringify(data));
      Game.bus.emit('ui:notify', { type: 'success', text: '💾 存档成功！' });
    } catch(e) { Game.bus.emit('ui:notify', { type: 'error', text: '❌ 存档失败' }); }
  },

  load(slot) {
    try {
      var raw = localStorage.getItem('as_save_' + slot);
      if (!raw) { Game.bus.emit('ui:notify', { type: 'error', text: '❌ 该存档为空' }); return; }
      var d = JSON.parse(raw);
      var s = Game.state;
      Object.assign(s.player, d.player);
      var fields = ['level','exp','money','region','anchor','exploreCount','sexCount','orgasmCount','roughSex','npcs','likes','conquered','map','inventory','achievements','bossKills','bossDefeated','stats','giftTotal','viewers'];
      for (var i = 0; i < fields.length; i++) {
        if (d[fields[i]] !== undefined) s[fields[i]] = JSON.parse(JSON.stringify(d[fields[i]]));
      }
      s.inBattle = false; s.inSex = false; s._eventActive = false; s._pendingBattle = false;
      Game._recalcAtk();
      Game.bus.emit('ui:notify', { type: 'success', text: '📂 读档成功！' });
      Game.bus.emit('ui:refresh');
      if (document.getElementById('game-app').style.display !== 'none') {
        UI.setActions(UI._journeyActions());
        UI.renderDefault();
      }
    } catch(e) { Game.bus.emit('ui:notify', { type: 'error', text: '❌ 读档失败: ' + e.message }); }
  },
};

        climax: ['${monster.name}与${monster2.name}同时发出跨越墙壁的长鸣，房间的阴影像潮水一样合拢，又在下一秒退回角落。']
      }
    };
    const key = phase === 'climax' ? 'climax' : (phase === 'active' ? 'active' : 'entry');
    const selected = pools[group][key] || pools[group].entry;
    return selected.map(text => text.replace(/\$\{monster3\.name\}/g, names[2] || '第三道身影').replace(/\$\{monster4\.name\}/g, names[3] || '第四道身影'));
  };

  const commandReactions = [
    '置顶观众：别切镜头，所有人都在看。',
    '房管提示：本次互动会直接影响热度结算。',
    '弹幕滚动：敢不敢接？敢不敢把话说清楚？',
    '高等级观众留言：我不想看剪辑，我要看你现在的反应。',
    '镜头旁的提示灯忽明忽暗，像是也在等待你的选择。'
  ];
  const acceptanceLines = [
    '你先停了半秒，随后抬眼看向镜头：既然你们点了，我就不躲。',
    '你把声音压得很低，像在对屏幕另一端的人说：看清楚，这次我自己选。',
    '你没有移开镜头，只是深吸一口气，把最紧张的那一瞬间留给了所有观众。',
    '你朝弹幕笑了一下，明明手指在发抖，语气却比刚才更直接。'
  ];
  const afterLines = [
    '礼物特效几乎覆盖了画面，观众人数还在往上跳。',
    '直播间先是静了两秒，随后弹幕像决堤一样涌出来。',
    '有人在刷屏让你继续，也有人提醒你注意镜头外的动静。',
    '你听见远处有脚步声，但没有人愿意先让你关播。'
  ];
  Texts.tipCommands.push('让当前愿意靠近的 NPC 对着镜头说一句只给直播间听的话。', '把镜头放低一点，完整记录你靠近门后声音的十秒。', '对镜头承认你现在最想让谁留在身边。', '让弹幕决定你是先靠近，还是先问对方的条件。', '在不剪辑的情况下，和当前 NPC 进行一段大胆直白的对话。');

  UI.showTipCommand = function(cmd, amount, punishmentIndex) {
    document.querySelectorAll('.p-cmd-box').forEach(node => node.remove());
    const puns = Texts.tipPunishments;
    const index = Number.isInteger(punishmentIndex) && punishmentIndex >= 0 && punishmentIndex < puns.length ? punishmentIndex : Math.floor(Math.random() * puns.length);
    const reaction = commandReactions[Math.floor(Math.random() * commandReactions.length)];
    const player = Game.state && Game.state.player ? Game.state.player.name : '主播';
    Game.systems.live._pendingTipCommand = { cmd, amount, index, reaction };
    const box = document.createElement('div');
    box.className = 'p-cmd-box show';
    box.innerHTML = '<div style="font-size:10px;color:#cc8866;letter-spacing:2px;">LIVE · 付费互动请求</div><h3 style="margin:5px 0;color:#ffcc99;">🎁 ¥' + amount + ' 大额打赏</h3><div style="font-size:12px;color:#d7b1a0;line-height:1.6;margin:8px 0;">高额观众向' + player + '发出请求：</div><div class="p-cmd" style="line-height:1.6;">' + cmd + '</div><div style="margin:9px 0;padding:8px;border-left:3px solid #9c3e28;background:rgba(90,25,15,.25);font-size:11px;color:#efba9e;line-height:1.6;">' + reaction + '</div><div style="font-size:11px;color:#a88778;">接受：获得全部打赏并触发热度演出<br>拒绝：' + puns[index] + '</div><div style="display:flex;gap:8px;justify-content:center;margin:13px 0 8px;"><button class="tip-accept" style="background:linear-gradient(135deg,#2a6a2a,#3a8a3a);border-color:#4aaa4a;color:#fff;padding:7px 17px;border-radius:7px;">✅ 接受互动</button><button class="tip-reject" style="background:linear-gradient(135deg,#6a2a2a,#8a3a3a);border-color:#aa4a4a;color:#fff;padding:7px 17px;border-radius:7px;">❌ 拒绝</button></div><div style="font-size:10px;color:#735449;">倒计时结束将自动关闭，不扣除状态。</div>';
    box.querySelector('.tip-accept').onclick = () => { box.remove(); Game.systems.live.acceptCommand(amount); };
    box.querySelector('.tip-reject').onclick = () => { box.remove(); Game.systems.live.rejectCommand(index); };
    document.body.appendChild(box);
    setTimeout(() => { if (box.parentNode) box.remove(); }, 15000);
  };

  Game.systems.live.acceptCommand = function(amount) {
    const pending = this._pendingTipCommand || {};
    const first = acceptanceLines[Math.floor(Math.random() * acceptanceLines.length)];
    const second = afterLines[Math.floor(Math.random() * afterLines.length)];
    Game.bus.emit('ui:notify', { type: 'gold', text: '🎬 ' + first + ' ' + second });
    Game.bus.emit('ui:danmaku', { text: '她真的接了，别挡画面！', type: 'excited' });
    setTimeout(() => Game.bus.emit('ui:danmaku', { text: pending.reaction || '礼物还在飞，直播间人数暴涨！', type: 'gift' }), 220);
    setTimeout(() => Game.bus.emit('ui:danmaku', { text: '镜头外刚才是不是有什么动了？', type: 'excited' }), 500);
    this._addTip(amount);
    this._pendingTipCommand = null;
  };
  const previousReject = Game.systems.live.rejectCommand.bind(Game.systems.live);
  Game.systems.live.rejectCommand = function(index) {
    previousReject(index);
    Game.bus.emit('ui:danmaku', { text: '主播拒绝了，但镜头外的声音没有离开。', type: 'normal' });
    this._pendingTipCommand = null;
  };
})();
</script>
<!-- ═══════════ 长线目标、商品与关系成长扩展 ═══════════ -->
<script>
(() => {

  const products = [
    { id: 'archive_file', name: '秘闻档案', icon: '📚', price: 210, category: 'rare', desc: '使用：当前区域线索+2。', effect: { archive: true } },
    { id: 'signal_card', name: '加密讯号卡', icon: '📱', price: 160, category: 'consumable', desc: '使用：向任意好感≥20的NPC发送私密讯息。', effect: { signalCard: true } },
    { id: 'companion_charm', name: '同行信物', icon: '🧭', price: 360, category: 'rare', desc: '使用：当前区域一名熟识NPC加入3次探索。', effect: { companionCharm: true } },
    { id: 'script_notes', name: '直播剧本碎页', icon: '🎬', price: 280, category: 'special', desc: '使用：下次直播互动额外获得50%收益。', effect: { broadcastBoost: true } },
    { id: 'mystery_box', name: '黑市补给箱', icon: '📦', price: 240, category: 'rare', desc: '使用：随机获得2件补给或礼物。', effect: { mysteryBox: true } },
    { id: 'warm_tea', name: '安神热茶', icon: '🍵', price: 90, category: 'consumable', desc: '恢复12生命、18体力；约会时额外好感+2。', effect: { hp: 12, stamina: 18, dateBonus: 2 } }
  ];
  products.forEach(item => { if (!ItemMap[item.id]) { ItemData.push(item); ItemMap[item.id] = item; } });

  const previousUseItem = Game.systems.shop.useItem.bind(Game.systems.shop);
  Game.systems.shop.useItem = function(itemId) {
    const state = stateOf(); const item = ItemMap[itemId];
    if (!state || !item || state.inBattle || state.inSex || !Game.hasItem(itemId)) return previousUseItem.call(this, itemId);

    if (item.effect?.archive) { Game.removeItem(itemId); state.regionClues[state.region] = (state.regionClues[state.region] || 0) + 2; finish('📚 秘闻档案展开：当前区域线索+2'); return; }
    if (item.effect?.broadcastBoost) { Game.removeItem(itemId); state._broadcastBoost = true; finish('🎬 下次直播互动收益提升50%'); return; }
    if (item.effect?.mysteryBox) { Game.removeItem(itemId); const pool = ['field_ration', 'battle_tonic', 'gift_s', 'energy', 'ward_charm']; Game.addItem(pool[Math.floor(Math.random() * pool.length)]); Game.addItem(pool[Math.floor(Math.random() * pool.length)]); finish('📦 补给箱已开启，获得两件随机物资'); return; }
    if (item.effect?.signalCard) { Game.removeItem(itemId); Game.systems.social.openSignalSelect(); return; }
    if (item.effect?.companionCharm) { Game.removeItem(itemId); Game.systems.social.openCompanionSelect(); return; }
    return previousUseItem.call(this, itemId);
  };

  const previousBroadcast = Game.systems.ventures.broadcast.bind(Game.systems.ventures);
  Game.systems.ventures.broadcast = function() {
    const state = stateOf(); const before = state && state.money;
    previousBroadcast();
    if (state && state._broadcastBoost) { const bonus = Math.max(80, Math.floor((state.money - before) * 0.5)); state.money += bonus; state._broadcastBoost = false; UI.toast('🎬 剧本碎页生效：额外直播收益¥' + bonus, 'gold'); }
  };

  const previousVote = Game.systems.live.triggerVote.bind(Game.systems.live);
  Game.systems.live.triggerVote = function() { const state = stateOf(); if (state) { state.stats.votesStarted++; Game.bus.emit('achievement:check'); } return previousVote(); };

  const previousResolveDate = Game.systems.social.resolveDate.bind(Game.systems.social);
  Game.systems.social.resolveDate = async function(npcId, type) {
    const state = stateOf(); const before = state && (state.likes[npcId] || 0); const result = await previousResolveDate.call(this, npcId, type);
    if (state && (state.likes[npcId] || 0) > before) { state.stats.datesCompleted++; const teaBonus = Game.hasItem('warm_tea') ? 2 : 0; if (teaBonus) { state.likes[npcId] = Math.min(100, state.likes[npcId] + teaBonus); UI.toast('🍵 安神热茶让这次约会更放松：好感额外+' + teaBonus, 'success'); } Game.bus.emit('achievement:check'); }
    return result;
  };

  Game.systems.social.sendSignal = async function(npcId) {
    const state = stateOf(); const npc = state && state.npcs.find(item => item.id === npcId);
    if (!npc || (state.likes[npcId] || 0) < 35) return UI.toast('好感达到35后才能发送私密讯息', 'error');
    state.likes[npcId] = Math.min(100, (state.likes[npcId] || 0) + 3); state.stats.messagesSent++;
    const text = await AIService.generateTalk(npc) || (npc.name + '的回复在屏幕上停了很久：我一直在等你先开口。');
    UI.toast('📱 ' + npc.name + '：' + text + ' 好感+3', 'gold'); Game.bus.emit('achievement:check'); UI.refresh();
  };
  Game.systems.social.openSignalSelect = function() {
    const state = stateOf(); const npcs = state.npcs.filter(npc => (state.likes[npc.id] || 0) >= 20);
    if (!npcs.length) return UI.toast('还没有好感达到20的NPC', 'error');
    UI.openModal('📱 加密讯号卡', '<p style="color:#b99a88;">选择一名NPC发送私密讯息：</p>' + npcs.map(npc => '<button onclick="Game.systems.social.sendSignal(' + npc.id + ');UI.closeModal()" style="display:block;width:100%;margin:6px 0;text-align:left;">' + npc.name + ' · ♥' + (state.likes[npc.id] || 0) + '</button>').join(''));
  };
  Game.systems.social.startCompanion = function(npcId) {
    const state = stateOf(); const npc = state.npcs.find(item => item.id === npcId);
    if (!npc || npc.region !== state.region || (state.likes[npcId] || 0) < 50) return UI.toast('需要当前区域且好感达到50的NPC', 'error');
    state.companion = { id: npc.id, turns: 3 }; UI.toast('🧭 ' + npc.name + '加入接下来3次探索', 'success'); UI.refresh();
  };
  Game.systems.social.openCompanionSelect = function() {
    const state = stateOf(); const npcs = state.npcs.filter(npc => npc.region === state.region && (state.likes[npc.id] || 0) >= 50);
    if (!npcs.length) return UI.toast('当前区域没有好感达到50的NPC', 'error');
    UI.openModal('🧭 同行信物', '<p style="color:#b99a88;">选择同行者（接下来3次探索）：</p>' + npcs.map(npc => '<button onclick="Game.systems.social.startCompanion(' + npc.id + ');UI.closeModal()" style="display:block;width:100%;margin:6px 0;text-align:left;">' + npc.name + ' · ♥' + (state.likes[npc.id] || 0) + '</button>').join(''));
  };

  const previousExplore = Game.systems.explore.doExplore.bind(Game.systems.explore);
  Game.systems.explore.doExplore = function() {
    const state = stateOf(); const result = previousExplore();
    if (!result || !state?.companion) return result;
    const npc = state.npcs.find(item => item.id === state.companion.id); state.companion.turns--;
    state.stats.companionExplores++;
    const roll = Math.random();
    if (roll < 0.34) { state.player.stamina = Math.min(state.player.maxStamina, state.player.stamina + 5); UI.toast('🧭 ' + (npc?.name || '同行者') + '带你绕开陷阱：体力+5', 'success'); }
    else if (roll < 0.67) { state.regionClues[state.region] = (state.regionClues[state.region] || 0) + 1; UI.toast('🧭 ' + (npc?.name || '同行者') + '指出了隐蔽痕迹：线索+1', 'gold'); }
    else { Game.addItem(Math.random() < 0.5 ? 'energy' : 'gift_s'); UI.toast('🧭 ' + (npc?.name || '同行者') + '找到了一件补给', 'success'); }
    if (state.companion.turns <= 0) { UI.toast('🧭 同行结束，对方在下个岔路口停下了脚步。', 'normal'); delete state.companion; }
    Game.bus.emit('achievement:check'); return result;
  };

  const contracts = [
    [{ title: '药库清点', goal: 3, reward: () => { Game.addItem('medkit'); Game.state.money += 180; return '急救包+1，¥180'; } }, { title: '病房回声记录', goal: 2, reward: () => { Game.addItem('archive_file'); return '秘闻档案+1'; } }],
    [{ title: '午夜课表修复', goal: 3, reward: () => { Game.addItem('signal_card'); Game.addExp(20, '校园委托'); return '加密讯号卡+1，经验+20'; } }, { title: '音乐教室收音', goal: 2, reward: () => { Game.state.money += 260; return '¥260'; } }],
    [{ title: '墓道拓印', goal: 3, reward: () => { Game.addItem('blood_tear'); return '血泪石+1'; } }, { title: '地下河取样', goal: 2, reward: () => { Game.addItem('companion_charm'); return '同行信物+1'; } }],
    [{ title: '传送带寻回物', goal: 3, reward: () => { Game.addItem('mystery_box'); return '黑市补给箱+1'; } }, { title: '控制室断讯排查', goal: 2, reward: () => { Game.state.money += 320; Game.addExp(16, '工厂委托'); return '¥320，经验+16'; } }],
    [{ title: '客房失物登记', goal: 3, reward: () => { Game.addItem('script_notes'); return '直播剧本碎页+1'; } }, { title: '镜廊留言收集', goal: 2, reward: () => { Game.addItem('gift_l'); return '豪华礼物盒+1'; } }],
    [{ title: '审判档案校对', goal: 3, reward: () => { Game.addItem('thunder_core'); return '雷霆核心+1'; } }, { title: '牢房低语转录', goal: 2, reward: () => { Game.state.money += 450; Game.addExp(25, '审判委托'); return '¥450，经验+25'; } }]
  ];
  Game.systems.contracts = {
    open() {
      const state = stateOf(); const active = state.activeContract;
      if (active) return UI.openModal('📌 当前委托', '<p style="color:#e0b79e;">' + active.title + '</p><p style="color:#b99a88;">进度：' + active.progress + '/' + active.goal + '</p><p style="font-size:11px;color:#866657;">在当前区域继续探索即可推进。</p>');
      const options = contracts[state.region] || [];
      UI.openModal('📌 区域委托', '<p style="color:#b99a88;">选择一份委托。完成后可获得专属报酬：</p>' + options.map((contract, index) => '<button onclick="Game.systems.contracts.accept(' + index + ');UI.closeModal()" style="display:block;width:100%;margin:7px 0;text-align:left;">📌 ' + contract.title + ' · 目标' + contract.goal + '次探索</button>').join(''));
    },
    accept(index) { const state = stateOf(); const contract = (contracts[state.region] || [])[index]; if (!contract) return; state.activeContract = { region: state.region, index, title: contract.title, goal: contract.goal, progress: 0 }; state.stats.contractsAccepted++; UI.toast('📌 已接取委托：' + contract.title, 'gold'); }
  };
  const exploreWithCompanion = Game.systems.explore.doExplore.bind(Game.systems.explore);
  Game.systems.explore.doExplore = function() {
    const state = stateOf(); const active = state?.activeContract; const before = state?.exploreCount || 0; const result = exploreWithCompanion();
    if (!result || !active || state.exploreCount <= before || active.region !== state.region) return result;
    active.progress++;
    if (active.progress < active.goal) UI.toast('📌 委托进度：' + active.title + ' ' + active.progress + '/' + active.goal, 'gold');
    else { const contract = (contracts[active.region] || [])[active.index]; const reward = contract?.reward ? contract.reward() : '未知报酬'; state.stats.contractsCompleted++; delete state.activeContract; UI.toast('✅ 委托完成：' + reward, 'success'); Game.bus.emit('achievement:check'); }
    return result;
  };

  Game.systems.social.openLove = function() {
    const state = stateOf(); const cards = state.npcs.map(npc => { const like = state.likes[npc.id] || 0; const sameRegion = npc.region === state.region; const bar = Math.min(100, like); return '<div style="background:#160a08;border:1px solid ' + (state.conquered[npc.id] ? '#8a6a1a' : '#3a1a14') + ';border-radius:8px;padding:9px;"><b style="color:#dda08a;">' + npc.name + '</b><div style="font-size:9px;color:#8a6a5a;">' + npc.personality + ' · ' + npc.gender + ' · 区域' + npc.region + '</div><div style="height:6px;background:#1a0606;border-radius:4px;margin:5px 0;"><div style="height:100%;width:' + bar + '%;background:#cc2266;border-radius:4px;"></div></div><div style="font-size:11px;color:#dd8a8a;">♥ ' + like + '/100</div>' + (like >= 20 ? '<button onclick="Game.systems.social.startDate(' + npc.id + ')" style="width:100%;padding:4px;margin-top:6px;">💕 主动约会</button>' : '<div style="font-size:9px;color:#6a4a3a;margin-top:6px;">好感20解锁约会</div>') + (like >= 35 ? '<button onclick="Game.systems.social.sendSignal(' + npc.id + ')" style="width:100%;padding:4px;margin-top:4px;">📱 私密讯息</button>' : '') + (like >= 50 && sameRegion ? '<button onclick="Game.systems.social.startCompanion(' + npc.id + ')" style="width:100%;padding:4px;margin-top:4px;">🧭 邀请同行</button>' : '') + '</div>'; }).join(''); UI.openModal('💕 攻略、邀约与同行', '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;">' + cards + '</div>');
  };

  const actionsWithContracts = UI._journeyActions.bind(UI);
  UI._journeyActions = function() { const actions = actionsWithContracts(); if (Game.state && !Game.state._pendingBattle) actions.push({ text: '📌 区域委托', fn: () => Game.systems.contracts.open() }); return actions; };
})();
</script>

<script>
(() => {
  'use strict';

  const addLines = (library, key, phase, lines) => {

      let output = null;
      for (let attempt = 0; attempt < 3 && !output; attempt++) {
        const spacing = Math.max(0, 1150 - (Date.now() - (this._lastCall || 0)));
        if (spacing) await new Promise(resolve => setTimeout(resolve, spacing));
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 12000);
        try {
          this._lastCall = Date.now();
          const state = Game.state;
          const region = state && Texts.regions[state.region] ? Texts.regions[state.region].name : '深渊';
          const system = options.kind === 'danmaku'
            ? '你是恐怖直播间的一名真实中文观众。只输出一条12到26字的弹幕。必须具体提及画面里的危险、镜头、战术或异常；不自称AI、不解释、不重复常见口头禅、不输出露骨内容、不使用引号。'
            : '你是中文黑暗奇幻直播游戏的叙事助手。只输出一条18到58字的自然中文短句，必须包含具体环境或动作细节。保持角色设定，不解释规则，不说自己是AI，不用Markdown和引号。';
          const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
            method: 'POST', signal: controller.signal,
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this._config.key },
            body: JSON.stringify({ model: 'deepseek-chat', temperature: options.kind === 'danmaku' ? 0.62 : 0.74, max_tokens: options.kind === 'danmaku' ? 60 : 130, messages: [
              { role: 'system', content: system },
              { role: 'user', content: '当前区域：' + region + '。' + prompt }
            ] })
          });
          if (!response.ok) {
            if (response.status === 429 || response.status >= 500) { await new Promise(resolve => setTimeout(resolve, 650 * (attempt + 1))); continue; }
            break;
          }
          const data = await response.json();
          const candidate = this._clean(data?.choices?.[0]?.message?.content);
          const invalid = !candidate || candidate.length < 8 || /^(作为|我是|好的|当然|抱歉|直播间的观众)/.test(candidate) || this._recentTexts.includes(candidate);
          if (!invalid) output = candidate;
        } catch (error) {
          if (attempt === 2) this._lastError = error?.name || 'request_failed';
        } finally { clearTimeout(timeout); }
      }
      if (!output) {
        this._failureCount++;
        if (this._failureCount >= 3) { this._blockedUntil = Date.now() + 30000; this._failureCount = 0; }
        return null;
      }
      this._failureCount = 0; this._remember(output);
      this._cacheV4.set(key, { text: output, expires: Date.now() + ttl });
      if (this._cacheV4.size > 90) { const first = this._cacheV4.keys().next().value; this._cacheV4.delete(first); }
      return output;
    };
    const queued = this._queue.then(run, run).finally(() => this._pending.delete(key));
    this._pending.set(key, queued); this._queue = queued.catch(() => null);
    return queued;
  };
  AIService.generateDanmaku = scene => {
    if (Math.random() > 0.10) return Promise.resolve(null);
    const state = Game.state; const monster = Game.systems.battle?.session?.monster || Game.systems.sex?.session?.monster;
    const detail = monster ? ('焦点对象：' + monster.name + '，外貌：' + (monster.appearance || monster.personality) + '。') : '焦点对象尚未现身。';
    return AIService.generate('场景状态：' + scene + '。' + detail + '写一条不重复、具体的旁观者弹幕。', { kind: 'danmaku', cacheKey: 'dm-final:' + scene + ':' + Math.floor(Date.now() / 75000), ttl: 75000 });
  };
  AIService.generateInvite = monster => {
    const entity = monster.species === '人外' ? '使用非人称谓与轮廓、雾气、回声、触须或光点等意象，禁止人类身体描写。' : '使用符合性别、性格和外貌的自然口吻。';
    return AIService.generate('以' + monster.name + '的第一人称发出邀约。' + entity + '性格：' + monster.personality + '。外貌：' + monster.appearance + '。必须提出一个具体地点和活动，带暧昧张力但不露骨。', { kind: 'invite', cacheKey: 'invite-final:' + monster.id, ttl: 180000 });
  };
  AIService.generateTalk = monster => {
    const entity = monster.species === '人外' ? '以非人存在的方式表达情绪，不用他她或人类肢体。' : '保持角色的自然口吻。';
    return AIService.generate('以' + monster.name + '的第一人称说一句针对玩家的私密回应。' + entity + '性格：' + monster.personality + '。必须包含一个环境细节并有明确情绪，不露骨。', { kind: 'talk', cacheKey: 'talk-final:' + monster.id + ':' + Math.floor(Date.now() / 180000), ttl: 180000 });
  };
})();
</script>
