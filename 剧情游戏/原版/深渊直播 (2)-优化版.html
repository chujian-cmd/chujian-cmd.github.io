<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>恐怖直播：欲望深渊</title>
<style>
/* ============================================================
   恐怖直播：欲望深渊 —— 暗黑恐怖风格
   ============================================================ */

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Georgia', 'SimSun', 'Microsoft YaHei', serif;
  background: #060202;
  color: #d4c0b0;
  overflow-x: hidden;
}

input, select, textarea, button {
  font-family: inherit;
  color: #d4c0b0;
  background: #120606;
  border: 1px solid #3a1410;
  border-radius: 4px;
  padding: 5px 10px;
  outline: none;
  font-size: 13px;
}
input:focus, select:focus, textarea:focus {
  border-color: #aa2a1a;
  box-shadow: 0 0 12px rgba(170, 42, 26, .25);
}

button {
  cursor: pointer;
  background: #1a0808;
  border: 1px solid #4a1a14;
  padding: 7px 18px;
  font-size: 13px;
  transition: background .15s, border-color .15s;
}
button:hover { background: #2a0e0a; border-color: #7a2a1a; }
button:disabled { opacity: .3; cursor: not-allowed; }

.btn-primary {
  background: linear-gradient(135deg, #5a1408, #8a2010);
  border-color: #aa2a18;
  color: #fff;
  font-weight: bold;
}
.btn-primary:hover {
  background: linear-gradient(135deg, #8a2010, #b8301a);
  box-shadow: 0 0 24px rgba(184, 48, 26, .35);
}

/* ── 角色创建页 ── */
#char-create {
  max-width: 960px;
  margin: 12px auto;
  padding: 20px;
  background: linear-gradient(160deg, #120606, #1a0808);
  border: 2px solid #3a1410;
  border-radius: 14px;
}
#char-create h1 { text-align: center; font-size: 28px; color: #c84a32; letter-spacing: 5px; }
#char-create .subtitle { text-align: center; color: #7a3a2a; font-size: 12px; margin-bottom: 14px; letter-spacing: 6px; }

.sec-title {
  font-size: 15px; color: #c86a4a;
  border-bottom: 2px solid #2a0e0a;
  padding-bottom: 4px; margin: 12px 0 8px;
}

.form-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
.form-group { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.form-group label { font-size: 11px; color: #7a4a3a; }
.form-group input, .form-group select, .form-group textarea { background: #0e0404; border-color: #2a0e0a; }
.form-group textarea { resize: vertical; min-height: 38px; }

/* 属性分配 */
#attr-area { display: flex; flex-direction: column; gap: 3px; }
.attr-row {
  display: flex; align-items: center; gap: 6px; padding: 5px 8px;
  background: rgba(20, 6, 4, .5); border: 1px solid #2a0e0a; border-radius: 4px;
}
.attr-icon { font-size: 20px; width: 30px; text-align: center; }
.attr-name { font-size: 13px; color: #b08a7a; font-weight: bold; width: 44px; }
.attr-bar { flex: 1; height: 18px; background: #0a0404; border-radius: 9px; overflow: hidden; border: 1px solid #2a0e0a; }
.attr-fill { height: 100%; border-radius: 9px; transition: width .2s; }
.attr-val { width: 34px; text-align: center; font-weight: bold; font-size: 15px; }
.attr-btn {
  width: 28px; height: 28px; padding: 0; font-size: 17px;
  display: flex; align-items: center; justify-content: center;
  background: #1a0808; border: 2px solid #4a1a14; font-weight: bold;
}
.attr-btn:hover { background: #2a0e0a; border-color: #7a2a1a; }

/* NPC卡片 */
#npc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 6px; margin-top: 4px;
  max-height: 480px; overflow-y: auto; padding: 2px;
}
.npc-card {
  background: linear-gradient(160deg, #120606, #180a08);
  border: 1px solid #2a100e; border-radius: 8px;
  padding: 8px; cursor: pointer; position: relative;
}
.npc-card:hover { border-color: #5a2218; background: linear-gradient(160deg, #180a08, #220e0a); }
.npc-card .npc-name { font-weight: bold; color: #d49078; font-size: 14px; padding-right: 44px; }
.npc-card .npc-info { font-size: 11px; color: #7a5a4a; margin-top: 2px; }
.npc-card .npc-del {
  position: absolute; top: 5px; right: 5px;
  width: 22px; height: 22px; border-radius: 50%;
  background: #3a0a0a; border: 2px solid #6a1818;
  color: #cc3333; font-size: 12px; font-weight: bold;
  padding: 0; display: flex; align-items: center; justify-content: center;
  z-index: 5; line-height: 1;
}
.npc-card .npc-del:hover { background: #6a1818; color: #ff5555; }
.npc-card.expanded {
  border-color: #7a2a1a;
  background: linear-gradient(160deg, #1a0a08, #240e0a);
  box-shadow: 0 0 20px rgba(122, 42, 26, .2);
}
.npc-edit-panel { display: none; margin-top: 6px; padding-top: 6px; border-top: 2px solid #2a0e0a; }
.npc-card.expanded .npc-edit-panel { display: block; }
.npc-edit-panel .form-group { margin-bottom: 3px; }
.npc-edit-panel .form-group label { font-size: 10px; color: #7a4a3a; }
.npc-edit-panel input, .npc-edit-panel select, .npc-edit-panel textarea { font-size: 11px; padding: 3px 6px; }

/* ── 游戏主界面 ── */
#game-app {
  display: none; width: 100%; max-width: 480px;
  margin: 0 auto; min-height: 100vh; background: #080202;
}
.gf-container { display: flex; flex-direction: column; height: 100vh; }
.gf-top {
  background: linear-gradient(180deg, #140606, #0a0202);
  border-bottom: 1px solid #2a0e0a;
  padding: 8px 14px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.gf-top .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff1a1a; }
.gf-top .live-title { font-size: 14px; font-weight: bold; color: #c86a4a; margin-left: 8px; }
.gf-top .live-stats { display: flex; gap: 12px; font-size: 11px; color: #7a4a3a; }
.gf-top .live-stats strong { color: #d49078; }

.gf-status {
  display: flex; gap: 6px; padding: 4px 12px;
  background: #0a0303; border-bottom: 1px solid #1a0808;
  font-size: 11px; overflow-x: auto; flex-shrink: 0; white-space: nowrap;
}
.gf-status .s-v { font-weight: bold; color: #d48a6a; }

.gf-exp {
  padding: 2px 12px; background: #060202;
  border-bottom: 1px solid #1a0808; flex-shrink: 0;
}
.gf-exp .exp-bar { height: 12px; background: #140606; border-radius: 6px; overflow: hidden; border: 1px solid #240a08; position: relative; }
.gf-exp .exp-fill { height: 100%; background: linear-gradient(90deg, #5a0800, #9a1408, #cc2a12); border-radius: 6px; transition: width .4s; }
.gf-exp .exp-text {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: #fff;
}

.gf-content { flex: 1; position: relative; overflow: hidden; }
#main-content {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  overflow-y: auto; padding: 12px;
}

/* 弹幕 */
.gf-danmaku {
  position: absolute; bottom: 0; left: 0; right: 0;
  max-height: 45%; overflow: hidden;
  padding: 8px 12px;
  display: flex; flex-direction: column-reverse; gap: 3px;
  z-index: 5; pointer-events: none;
}
.dm-item {
  padding: 4px 8px; border-radius: 4px;
  font-size: 11px; line-height: 1.3;
  border-left: 3px solid #4a1814;
  background: linear-gradient(90deg, rgba(10, 4, 2, .88), rgba(10, 4, 2, .35));
  pointer-events: auto; max-width: 92%;
}
.dm-item .d-user { color: #7a4a3a; font-size: 9px; margin-right: 4px; }
.dm-item.gift { border-left-color: #ccaa33; background: linear-gradient(90deg, rgba(20, 14, 2, .88), rgba(20, 14, 2, .35)); }
.dm-item.excited { border-left-color: #cc2255; background: linear-gradient(90deg, rgba(20, 4, 10, .88), rgba(20, 4, 10, .35)); }
.dm-item.system { border-left-color: #888; background: linear-gradient(90deg, rgba(10, 10, 10, .88), rgba(10, 10, 10, .35)); }

/* 底部操作栏 */
.gf-bottom { background: linear-gradient(0deg, #140606, #0a0202); border-top: 1px solid #2a0e0a; flex-shrink: 0; }
.gf-bottom .gf-actions { display: flex; gap: 4px; padding: 6px 10px; overflow-x: auto; }
.gf-bottom .gf-actions button {
  flex-shrink: 0; padding: 5px 14px; font-size: 11px; white-space: nowrap;
  background: #1a0808; border: 1px solid #3a1410; border-radius: 16px;
}

.gf-nav {
  display: flex; justify-content: space-around;
  padding: 4px 10px 8px; border-top: 1px solid #1a0808; background: #0a0303;
}
.gf-nav .nav-btn {
  background: none; border: none; font-size: 20px; padding: 4px 8px;
  border-radius: 8px; display: flex; flex-direction: column; align-items: center;
  opacity: .6; cursor: pointer;
}
.gf-nav .nav-btn:hover { opacity: 1; background: rgba(40, 12, 8, .5); }
.gf-nav .nav-btn .n-label { font-size: 8px; color: #7a5a4a; margin-top: 1px; }

/* ── 弹窗 ── */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, .9); z-index: 200;
  justify-content: center; align-items: center;
}
.modal-overlay.active { display: flex; }
.modal-box {
  background: linear-gradient(160deg, #140606, #0e0404);
  border: 2px solid #3a1410; border-radius: 12px;
  padding: 16px; max-width: 440px; width: 92%; max-height: 80vh; overflow-y: auto;
}
.modal-title {
  font-size: 15px; color: #c86a4a;
  border-bottom: 2px solid #2a0e0a; padding-bottom: 6px; margin-bottom: 10px;
  display: flex; justify-content: space-between; align-items: center;
}
.modal-close { background: none; border: none; font-size: 20px; color: #7a3a2a; padding: 0; cursor: pointer; }
.modal-close:hover { color: #c84a32; }

/* Toast */
#toast {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 500;
  background: linear-gradient(135deg, #140606, #1a0808);
  border: 2px solid #3a1410; border-radius: 8px;
  padding: 10px 24px; font-size: 13px; color: #d4c0b0;
  display: none; max-width: 90%; text-align: center;
}
#toast.show { display: block; }
#toast.success { border-color: #2a4a2a; color: #88dd88; }
#toast.error { border-color: #4a1414; color: #dd6666; }
#toast.gold { border-color: #7a5a18; color: #ffdd88; }

/* 成就弹窗 */
.p-toast {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 600;
  background: linear-gradient(135deg, #1a0a08, #2a0e0a);
  border: 2px solid gold; border-radius: 12px;
  padding: 20px 30px; text-align: center;
  box-shadow: 0 0 60px rgba(255, 215, 0, .3);
  display: none; min-width: 200px;
}
.p-toast.show { display: block; animation: pPop .4s; }
@keyframes pPop {
  from { opacity: 0; transform: translate(-50%, -50%) scale(.5); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}
.p-toast .p-icon { font-size: 40px; }
.p-toast .p-name { font-size: 16px; color: #ffdd88; margin: 6px 0; }
.p-toast .p-desc { font-size: 11px; color: #ba9a8a; }

/* 投票/命令弹窗 */
.p-vote {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, .85); z-index: 300;
  display: none; justify-content: center; align-items: center;
}
.p-vote.show { display: flex; }
.p-vb {
  background: linear-gradient(160deg, #1a0a08, #120606);
  border: 2px solid #5a2a1a; border-radius: 16px;
  padding: 24px; max-width: 420px; width: 90%; text-align: center;
}
.p-vb h3 { color: #ffcc44; margin-bottom: 10px; }

.p-cmd-box {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 400;
  background: linear-gradient(160deg, #1a0a08, #120606);
  border: 2px solid #8a6a1a; border-radius: 16px;
  padding: 24px; max-width: 400px; width: 90%; text-align: center;
  display: none; box-shadow: 0 0 60px rgba(138, 106, 26, .3);
}
.p-cmd-box.show { display: block; }
.p-cmd-box h3 { color: #ffcc44; margin-bottom: 10px; }
.p-cmd-box .p-cmd {
  font-size: 16px; color: #ff88aa; margin: 10px 0;
  padding: 8px; background: rgba(0, 0, 0, .3); border-radius: 6px;
}
.p-cmd-box .p-pun { font-size: 12px; color: #ff6644; margin-top: 8px; }

/* 梦境弹窗 */
.dream-popup {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 999;
  background: linear-gradient(135deg, #1a0a2a, #2a0a3a);
  border: 2px solid #888; border-radius: 16px;
  padding: 24px 36px; text-align: center;
  box-shadow: 0 0 40px rgba(100, 50, 200, .3);
  min-width: 220px;
}

/* 邀约弹窗 */
.invite-box {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, .85); z-index: 999;
  display: flex; justify-content: center; align-items: center;
}
.invite-card {
  background: linear-gradient(160deg, #1a0a08, #120606);
  border: 2px solid #5a2a1a; border-radius: 16px;
  padding: 24px; max-width: 380px; width: 90%; text-align: center;
}

/* 结局 */
.ending-screen {
  min-height: 100vh; display: flex;
  justify-content: center; align-items: center;
  flex-direction: column; padding: 40px;
}

</style>
</head>

      '扭曲的躯干上伸出多余的肢体，每次移动都会发出骨头摩擦的声音。',

  // 生成NPC属性
  generateStats(level) {
    const lust = 40 + Math.floor(Math.random() * 61);
    return {
      cock: 18 + Math.floor(Math.random() * 20),
      height: 170 + Math.floor(Math.random() * 60),
      lust,
      level: level || Math.floor(1 + Math.random() * 10),
      atk: Math.floor((level || 5) * 10 + lust * 0.5),
      hp: lust * 2 + (level || 5) * 10,
    };
  },

  // 按区域生成NPC列表
  generateAll() {
    const npcs = [];
    const regionKeys = ['hospital', 'school', 'tomb', 'factory', 'hotel', 'abyss'];
    let id = 0;

    for (let r = 0; r < 6; r++) {
      const pool = [...NPCData.namePools[regionKeys[r]], ...NPCData.namePools.common];
      // 每个区域随机选9个NPC
      const shuffled = pool.sort(() => Math.random() - 0.5);
      for (let i = 0; i < 9; i++) {
        const name = shuffled[i % shuffled.length];
        // 后续区域逐步提高基础等级，避免六个区域共用同一强度池。
        const level = 1 + r * 2 + Math.floor(Math.random() * 8);
        const stats = NPCData.generateStats(level);
        const personality = NPCData.personalities[Math.floor(Math.random() * NPCData.personalities.length)];
        // 40%女 35%男 15%双性 10%无性别
        const gRoll = Math.random();
        const gender = gRoll < 0.40 ? '女' : (gRoll < 0.75 ? '男' : (gRoll < 0.90 ? '双性' : '无性别'));
        const species = Math.random() < 0.7 ? '人外' : '人类';
        const appearance = NPCData.looks[name] ||
          NPCData.randomLooks[species === '人类' ? 'human' : 'monster'][Math.floor(Math.random() * 5)];

        npcs.push({
          id: id++,
          name,
          gender,
          species,
          personality,
          appearance,
          region: r,
          ...stats,
          maxHp: stats.hp,
          isBoss: false,
        });
      }
    }
    return npcs;
  },
};

class GameEngine {

    /** @type {GameState} */
    this.state = null;
    /** @type {EventBus} */
    this.bus = new EventBus();

    this.ready = false;
    this._bossTimer = null;
  }

    this.state = {
      player: {
        name: playerData.name,
        gender: playerData.gender,
        age: playerData.age,
        stamina: playerData.stamina,
        staminaStat: playerData.stamina,
        maxStamina: 100,
        health: playerData.health,
        lust: playerData.lust,
        charm: playerData.charm,
        agility: playerData.agility,
        endurance: playerData.endurance,
        maxHp: playerData.health + playerData.endurance,
        hp: playerData.health + playerData.endurance,
        atk: 50,
        weapon: null,
        outfit: null,
        title: '',
      },
      level: 1,
      exp: 0,
      money: 500,
      region: 0,
      anchor: 0,
      exploreCount: 0,
      sexCount: 0,
      orgasmCount: 0,
      roughSex: 0,
      viewers: 1000,
      giftTotal: 0,
      totalEarn: 0,
      inBattle: false,
      inSex: false,
      _eventActive: false,
      _pendingBattle: false,
      _skipNextBattle: false,
      npcs: npcs,
      likes: {},        // {npcId: 好感度}
      conquered: {},    // {npcId: true} 已攻略
      map: {},          // {region: {anchor: true}} 已解锁锚点
      inventory: {},    // {itemId: count}
      achievements: [], // 成就ID列表
      bossKills: 0,
      bossDefeated: {}, // {region: true}
      bossPending: {},  // {region: true} 已满足条件，等待安全时机生成
      bossReady: {},    // {region: true} 已出现，等待玩家主动挑战
      endingShown: false,
      stats: {          // 累计统计
        battlesWon: 0,
        battlesLost: 0,
        totalGifts: 0,
        totalTips: 0,
        enduranceGain: 0,
        atkGain: 0,
        expGain: 0,
        beHitCount: 0,
      },
    };

    // 初始化地图（区域0锚点0默认解锁）
    for (let r = 0; r < 6; r++) {
      this.state.map[r] = {};
      for (let a = 0; a < 6; a++) {
        this.state.map[r][a] = (r === 0 && a === 0);
      }
    }

    this._recalcAtk();

    // 初始化各系统
    this._initSystems();

    // 注册事件监听
    this._registerEvents();

    this.ready = true;
    this.bus.emit('game:start');
  }

    this.bus.on('boss:spawn', (data) => {
      const region = Number.isInteger(data?.region) ? data.region : this.state.region;

      this.bus.emit('ui:refresh');
    });
  }

  _checkLevelUp() {
    while (true) {
      const needed = 100 + (this.state.level - 1) * 50;
      if (this.state.exp < needed) break;
      this.state.exp -= needed;
      this.state.level++;
      // 升级奖励
      ['stamina', 'health', 'lust', 'charm', 'agility', 'endurance'].forEach(k => {
        const cap = k === 'stamina' ? this.state.player.maxStamina : 100;
        this.state.player[k] = Math.min(cap, this.state.player[k] + 3);
      });
      this.state.player.staminaStat = Math.min(100, this.state.player.staminaStat + 3);
      this.state.player.maxHp += 20;
      this.state.player.hp = this.state.player.maxHp;
      this._recalcAtk();
      this.bus.emit('ui:notify', { type: 'gold', text: `⬆️ 升级！Lv.${this.state.level}` });
    }
    this.bus.emit('ui:refresh');
  }

  _recalcAtk() {
    const p = this.state.player;
    const base = Math.floor(
      p.staminaStat * 0.25 + p.health * 0.15 + p.lust * 0.05 +
      p.charm * 0.05 + p.agility * 0.2 + p.endurance * 0.3 +
      this.state.level * 5
    );
    const wp = ItemMap[p.weapon]?.effect?.atkBonus || 0;
    p.atk = Math.max(50, base + wp + this.state.stats.atkGain);
  }

  changeHp(amount) {
    const p = this.state?.player;
    if (!p || !Number.isFinite(amount)) return 0;
    const before = p.hp;
    p.hp = Math.max(0, Math.min(p.maxHp, p.hp + amount));
    return p.hp - before;
  }

  getOutfitBonus(key) {
    return ItemMap[this.state?.player?.outfit]?.effect?.[key] || 0;
  }

  getTipMultiplier() {
    return 1 + this.getOutfitBonus('tipBonus') / 100;
  }

  unlockAnchor(region, anchor, movePlayer = false) {
    const r = Number(region);
    const a = Number(anchor);
    if (!this.state.map[r] || !Number.isInteger(a) || a < 0 || a >= 6) return false;
    const wasUnlocked = this.state.map[r][a];
    this.state.map[r][a] = true;
    if (movePlayer && this.state.region === r) this.state.anchor = a;
    if (!wasUnlocked) this.bus.emit('anchor:unlocked', { region: r, anchor: a });
    else this._checkAllAnchors(r);
    return !wasUnlocked;
  }

  unlockNextAnchor(region = this.state.region) {
    const map = this.state.map[region];
    if (!map) return false;
    for (let a = 0; a < 6; a++) {
      if (!map[a]) return this.unlockAnchor(region, a, region === this.state.region);
    }
    this._checkAllAnchors(region);
    return false;
  }

  _checkAllAnchors(region = this.state.region) {
    const r = region;
    if (this.state.bossDefeated[r] || this.state.bossReady[r]) return;
    let all = true;
    for (let a = 0; a < 6; a++) {
      if (!this.state.map[r][a]) { all = false; break; }
    }
    if (all) {
      this.bus.emit('boss:spawn', { region: r });
    }
  }

  _trySpawnPendingBoss() {
    const state = this.state;
    if (!state || !this.ready) return;
    const r = state.region;
    if (!state.bossPending[r] || state.bossDefeated[r]) return;
    if (state.inBattle || state.inSex || state._eventActive || this._bossTimer) return;

    this._bossTimer = setTimeout(() => {
      this._bossTimer = null;
      if (state.region !== r || state.inBattle || state.inSex || state._eventActive || state.bossDefeated[r]) {
        state.bossPending[r] = false;
        if (!state.bossDefeated[r]) state.bossReady[r] = true;
        this.bus.emit('ui:refresh');
        return;
      }
      const boss = Game.systems.battle?.spawnBoss(r);
      state.bossPending[r] = false;
      state.bossReady[r] = !boss;
      if (!boss) this.bus.emit('ui:refresh');
    }, 800);
  }

  startBossBattle(region = this.state.region) {
    const state = this.state;
    if (!state.bossReady[region] || state.bossDefeated[region]) return false;
    if (state.bossPending[region] || state.inBattle || state.inSex || state._eventActive) return false;
    if (state.player.hp <= 0 || state.player.stamina < 5) {
      this.bus.emit('ui:notify', { type: 'error', text: '❤️ 当前状态无法挑战Boss，请先休息恢复。' });
      return false;
    }
    state.bossPending[region] = true;
    this._trySpawnPendingBoss();
    this.bus.emit('ui:notify', { type: 'gold', text: '👑 Boss正在逼近……' });
    this.bus.emit('ui:refresh');
    return true;
  }

  addExp(amount, reason) {
    if (!amount || amount <= 0) return;
    this.state.exp += amount;
    this.state.stats.expGain += amount;
    this.bus.emit('ui:danmaku', { text: `⭐ ${reason || ''} +${amount}EXP`, type: 'system' });
    this._checkLevelUp();
  }

  getItem(id) { return ItemMap[id]; }
  hasItem(id) { return (this.state.inventory[id] || 0) > 0; }
  addItem(id, count = 1) {
    if (!this.state.inventory[id]) this.state.inventory[id] = 0;
    this.state.inventory[id] += count;
    this.bus.emit('ui:notify', { type: 'success', text: `获得 ${ItemMap[id]?.name || id} ×${count}` });
  }
  removeItem(id, count = 1) {
    if (!this.hasItem(id)) return false;
    this.state.inventory[id] -= count;
    if (this.state.inventory[id] <= 0) delete this.state.inventory[id];
    return true;
  }
}

   ============================================================ */
class EventBus {
  constructor() {
    this._listeners = {};
  }

  on(event, callback) {
    if (!this._listeners[event]) this._listeners[event] = [];
    this._listeners[event].push(callback);
    return () => this.off(event, callback);
  }

  off(event, callback) {
    if (!this._listeners[event]) return;
    this._listeners[event] = this._listeners[event].filter(cb => cb !== callback);
  }

  emit(event, data = {}) {
    if (!this._listeners[event]) return;
    for (const cb of this._listeners[event]) {
      try { cb(data); } catch (e) { console.error(`[EventBus] ${event}:`, e); }
    }
  }
}

  /** 人格→文本库key */
  static _personalityKey(personality) {
    const map = {
      '粗暴': 'rough', '温柔': 'gentle', '变态': 'twisted',
      '冷漠': 'cold', '狂热': 'fanatic', '诡媚': 'seductive',
    };
    return map[personality] || 'gentle';

  /** 文本模板替换 */
  static _renderText(template, monster) {
    return template
      .replace(/\$\{monster\.name\}/g, monster.name)
      .replace(/\$\{monster\.cock\}/g, monster.cock)
      .replace(/\$\{monster\.personality\}/g, monster.personality);

      const m = monsters[i];
      if (!m) continue;
      const n = i + 1; // monster2, monster3, monster4
      t = t.replace(new RegExp('\\$\\{monster' + n + '\\.name\\}', 'g'), m.name || '?')
           .replace(new RegExp('\\$\\{monster' + n + '\\.cock\\}', 'g'), m.cock || '?');
    }
    return t;
  }

  _triggerAccident(sess) {
    const keys = Object.keys(Texts.sexAccidents).filter(k => k !== 'intruder'); // intruder独立触发
    const key = keys[Math.floor(Math.random() * keys.length)];

    const text = acc.texts[Math.floor(Math.random() * acc.texts.length)];
    const rendered = SexSystem._renderText(text, sess.monster);

    const state = Game.state;

    switch (key) {
      case 'audienceFrenzy':

        sess.passion = Math.min(100, sess.passion + 10);
        const tip = Math.floor(200 + Math.random() * 600);
        state.money += Math.floor(tip * 0.5);
        state.giftTotal += tip;
        state.stats.totalTips += tip;
        Game.bus.emit('ui:danmaku', { text: '神回！！名场面！！', type: 'excited' });
        break;
      case 'moodSwing':
        // 人格切换：激情+5
        sess.passion = Math.min(100, sess.passion + 5);
        break;
      case 'scream':
        // 尖叫：淫荡值+5（恐惧+兴奋）
        state.player.lust = Math.min(100, state.player.lust + 5);
        break;
    }

    Game.bus.emit('ui:danmaku', { text: acc.title, type: 'excited' });
    Game.bus.emit('ui:notify', { type: 'gold', text: rendered });
  }

  /** 多P入侵独立触发 */
  _triggerIntruder(sess) {
    const state = Game.state;
    const existingIds = sess.monsters.map(m => m.id);
    const pool = state.npcs.filter(n => n.region === state.region && !existingIds.includes(n.id));
    if (pool.length === 0) return;

    const intruder = pool[Math.floor(Math.random() * pool.length)];
    sess.monsters.push(intruder);
    sess.passion = Math.min(100, sess.passion + 12 + sess.monsters.length * 3);
    const count = sess.monsters.length;
    const tags = ['', '', '3P', '4P', '群P'];

    setTimeout(() => Game.bus.emit('ui:danmaku', {
      text: count >= 4 ? '这谁顶得住啊！！' : '名场面预定！！', type: 'excited'
    }), 300);
  }
}

class SexSession {
  constructor(monster, rough) {
    this.monsters = [monster];    // 参与怪物数组（1~4）
    this.rough = rough;
    this.round = 0;
    this.passion = 0;
    this.focusIdx = 0;
    this._postClimaxChances = 0;  // 中途高潮冷却窗口
    this._midClimaxCooldown = 0;  // 高潮冷却回合
  }

  get monster() { return this.monsters[this.focusIdx] || this.monsters[0]; }
  get isMulti() { return this.monsters.length > 1; }
  get multiType() {
    if (this.monsters.length <= 1) return null;
    const genders = this.monsters.map(m => m.gender === '女' ? 'f' : 'm');
    const mc = genders.filter(g => g === 'm').length;
    const fc = genders.filter(g => g === 'f').length;
    return mc + 'm' + fc + 'f';
  }
}

    if (pool.length === 0) pool = state.npcs;

      sess.playerStunned = false;
      log = '💫 你被怨念缠住，本回合无法行动！';
    } else if (action === 'attack') {
      if (p.stamina < 3) return { error: '体力不足' };
      p.stamina -= 3;
      if (Math.random() < 0.95) {
        const critical = Math.random() < critChance;
        const dmg = Math.floor(p.atk * (0.8 + Math.random() * 0.4) * (critical ? 1.5 : 1));
        m.hp -= dmg;
        log = `${critical ? '💢 暴击！' : '⚡'} 造成 ${dmg} 伤害`;
      } else {
        log = '❌ 攻击落空！';
      }
    } else if (action === 'heavy') {
      if (p.stamina < 5) return { error: '体力不足' };
      p.stamina -= 5;
      if (Math.random() < 0.75) {
        const critical = Math.random() < critChance;
        const dmg = Math.floor(p.atk * (1.3 + Math.random() * 0.5) * (critical ? 1.5 : 1));
        m.hp -= dmg;
        log = `💥 ${critical ? '暴击！' : ''}重击造成 ${dmg} 伤害`;
      } else {
        log = '❌ 重击落空！';
      }
    } else if (action === 'defend') {
      sess.defending = true;
      const recovered = Math.min(5, p.maxStamina - p.stamina);
      p.stamina += recovered;
      log = `🛡️ 防御姿态，体力+${recovered}`;
    } else if (action.startsWith('item:')) {
      const itemId = action.slice(5);
      const item = ItemMap[itemId];
      if (!item || !item.battleUsable) return { error: '该物品无法在战斗中使用' };
      if (sess.usedItemRound === sess.round) return { error: '本回合已经使用过物品' };
      if (!Game.removeItem(itemId)) return { error: '背包中没有该物品' };
      const effect = item.effect || {};
      const healed = Game.changeHp(Math.max(effect.hp || 0, effect.health || 0));
      const stamina = Math.min(effect.stamina || 0, p.maxStamina - p.stamina);
      p.stamina += stamina;
      if (effect.guard) sess.defending = true;
      sess.usedItemRound = sess.round;
      state.stats.itemsUsedBattle = (state.stats.itemsUsedBattle || 0) + 1;
      log = '🧴 使用' + item.name + '：HP+' + healed + (stamina ? '，体力+' + stamina : '') + (effect.guard ? '，获得防御姿态' : '');
    }

    // 检查怪物死亡
    if (m.hp <= 0) {
      m.hp = 0;
      return this._victory(log);
    }

    // 怪物行动
    const monsterLog = this._monsterTurn();

    // BOSS技能（每2回合）
    if (m.isBoss && sess.round % 2 === 1) {
      const bossLog = this._bossSkill();
      if (bossLog) log += '<br>' + bossLog;
    }

    sess.round++;
    sess.defending = false;

    // 检查玩家死亡
    if (p.hp <= 0) {
      p.hp = 0;
      return this._defeat();
    }

    Game.bus.emit('ui:refresh');
    return { ...this._getState(), log: log + (monsterLog ? '<br>' + monsterLog : '') };
  }

  /** 放弃战斗→做爱 */
  surrender() {
    if (!this.session) return;
    const m = this.session.monster;
    clearTimeout(this._chainTimer);
    this._chainTimer = null;
    this._chainQueue = [];
    if (m.isBoss) {
      Game.state.bossPending[m.region] = false;
      Game.state.bossReady[m.region] = true;
    }
    Game.state.inBattle = false;
    this.session = null;
    Game.state.sexCount++;
    Game.systems.sex.start(m, false);
  }

  _monsterTurn() {
    const sess = this.session;
    const state = Game.state;
    const m = sess.monster;
    const r = Math.random();
    let dmg = 0;

    if (sess.monsterCharging) {
      sess.monsterCharging = false;
      dmg = Math.floor(m.atk * (0.75 + Math.random() * 0.25));
      if (sess.defending) dmg = Math.floor(dmg / 2);
      state.player.hp -= dmg;
      if (dmg > 0) Game.bus.emit('player:hurt', dmg);
      return `💥 ${m.name}释放蓄力攻击，造成 ${dmg} 伤害`;
    }

    if (r < 0.5) {
      dmg = Math.floor(m.atk * (0.2 + Math.random() * 0.3));
      if (sess.defending) dmg = Math.floor(dmg / 2);
      state.player.hp -= dmg;
      if (dmg > 0) Game.bus.emit('player:hurt', dmg);
      return `${m.name} 攻击造成 ${dmg} 伤害`;
    } else if (r < 0.7) {
      if (Math.random() < 0.8) {
        dmg = Math.floor(m.atk * (0.4 + Math.random() * 0.3));
        if (sess.defending) dmg = Math.floor(dmg / 2);
        state.player.hp -= dmg;
        if (dmg > 0) Game.bus.emit('player:hurt', dmg);
        return `${m.name} 重击造成 ${dmg} 伤害`;
      }
      return `${m.name} 的攻击落空了！`;
    } else {
      sess.monsterCharging = true;
      return `${m.name} 在蓄力……`;
    }
  }

  _bossSkill() {
    const r = this.session.monster.region;
    const m = this.session.monster;
    const p = Game.state.player;

    switch (r) {
      case 0:
        m.atk = Math.min(Math.floor(m.baseAtk * 1.6), Math.floor(m.atk * 1.15));
        return `👑 ${m.name}：手术刀投掷！伤害提升！`;
      case 1:
        if (Math.random() < 0.45) {
          this.session.playerStunned = true;
          return `👑 ${m.name}：怨念缠绕！下回合无法行动！`;
        }
        return `👑 ${m.name}：怨念缠绕……你挣脱了！`;
      case 2: {
        const heal = Math.floor(m.maxHp * 0.07);
        m.hp = Math.min(m.maxHp, m.hp + heal);
        return `👑 ${m.name}：亡灵呼唤！恢复 ${heal} HP`;
      }
      case 3: {
        const dmg = Math.floor(m.atk * 0.2);
        p.hp -= dmg;
        Game.bus.emit('player:hurt', dmg);
        return `👑 ${m.name}：铁锤风暴！额外 ${dmg} 伤害`;
      }
      case 4:
        if (Math.random() < 0.25) {
          const dmg = Math.floor(p.atk * 0.35);
          p.hp -= dmg;
          Game.bus.emit('player:hurt', dmg);
          return `👑 ${m.name}：幻术迷惑！你攻击了自己！-${dmg} HP`;
        }
        return `👑 ${m.name}：幻术迷惑……你抵抗住了！`;
      case 5: {
        const dmg = Math.min(Math.floor(m.atk * 0.35), Math.floor(p.maxHp * 0.1));
        p.hp -= dmg;
        Game.bus.emit('player:hurt', dmg);
        return `👑 ${m.name}：最终审判！${dmg} 伤害！！`;
      }
      default: return null;
    }
  }

  _victory(log) {
    const state = Game.state;
    const m = this.session.monster;
    const next = this._chainQueue.shift() || null;
    const hasNext = Boolean(next);
    // 连战切换期间仍保持战斗锁，防止玩家在600ms空档启动探索或弹窗。
    state.inBattle = hasNext;
    const gold = Math.floor(20 + m.level * 5 + Math.random() * m.level * 10);
    const exp = 30 + m.level * 2;

    // 先完成地图/Boss进度，再发最终胜利事件；这样进度刷新不会盖掉胜利结果页。
    if (m.isBoss) Game.bus.emit('boss:killed', { monster: m });
    else this._unlockAnchor();

    if (next) {
      // 连战不是无恢复车轮战：给短暂喘息，避免后期第二只怪几乎必败。
      const recoveryAmount = Math.max(1, Math.floor(state.player.maxHp * 0.5));
      const recoveredHp = Game.changeHp(recoveryAmount);
      state.player.stamina = Math.min(state.player.maxStamina, state.player.stamina + 15);
      Game.bus.emit('ui:notify', { type: 'success', text: `⚔️ 连战喘息：HP+${recoveredHp}，体力+15` });
    }

    Game.bus.emit('battle:won', {
      monster: m,
      gold,
      exp,
      isBoss: m.isBoss || false,
      hasNext,
    });

    this.session = null;

    if (next) {
      this._chainTimer = setTimeout(() => {
        this._chainTimer = null;
        this.session = new BattleSession(next);
        Game.bus.emit('battle:encounter', { monster: next, isChain: true });
        Game.bus.emit('ui:refresh');
      }, 600);
    } else {
      this._chainQueue = [];
      Game._trySpawnPendingBoss();
    }

    return {
      victory: true,
      log,
      gold,
      exp,
      monster: m,
      isBoss: m.isBoss || false,
      hasNext,
    };
  }

  _defeat() {
    const state = Game.state;
    const m = this.session.monster;
    state.inBattle = false;
    if (m.isBoss) {
      state.bossPending[m.region] = false;
      state.bossReady[m.region] = true;
    }
    const companions = this._chainQueue.splice(0);
    clearTimeout(this._chainTimer);
    this._chainTimer = null;

    Game.bus.emit('battle:lost', { monster: m });

    this.session = null;

    // 立即进入粗暴互动，避免战败后短暂解锁探索造成状态竞态。
    state.sexCount++;
    Game.systems.sex.start(m, true);
    const sexSession = Game.systems.sex.session;
    if (sexSession) companions.slice(0, 3).forEach(monster => sexSession.monsters.push(monster));

    return { victory: false, monster: m };
  }

  _unlockAnchor() {
    Game.unlockNextAnchor(Game.state.region);
  }

  _getState() {
    const p = Game.state.player;
    const m = this.session.monster;
    return {
      monster: m,
      playerHp: Math.floor(p.hp),
      playerMaxHp: p.maxHp,
      playerStamina: p.stamina,
    };
  }
}

class BattleSession {
  constructor(monster) {
    this.monster = monster;
    this.round = 0;
    this.defending = false;
    this.monsterCharging = false;
    this.playerStunned = false;
  }
}

Game.systems.battle = new BattleSystem();

/* ============================================================
   探索系统
   ============================================================ */

Game.systems.explore = {
  doExplore() {
    const state = Game.state;
    const p = state.player;
    if (state.inBattle || state.inSex) return null;
    if (state._eventActive) return null; // 事件弹窗中禁止探索
    if (p.hp <= 0) {
      Game.bus.emit('ui:notify', { type: 'error', text: '❤️ 伤势过重，必须先休息恢复' });
      return null;
    }
    if (p.stamina < 5) {
      Game.bus.emit('ui:notify', { type: 'error', text: '⚡ 体力不足，需要休息' });
      return null;
    }

    p.stamina -= 5;
    state.exploreCount++;

    // 探索文本
    const regionTexts = Texts.explore[state.region] || Texts.explore.default;
    const pool = [...Texts.explore.default, ...regionTexts];
    const text = pool[Math.floor(Math.random() * pool.length)];

    // 经验
    Game.addExp(3 + Math.floor(Math.random() * 6), '🔍探索');

    // 每3次探索战力+1
    if (state.exploreCount % 3 === 0) {
      state.stats.atkGain++;
      Game._recalcAtk();
    }

    // 5%概率耐力+1
    if (Math.random() < 0.05) {
      p.endurance = Math.min(100, p.endurance + 1);
      state.stats.enduranceGain++;
      Game._recalcAtk();
    }

    // 遭遇判定（每5次）— 蜡烛可跳过，防堆积
    if (state.exploreCount % 5 === 0) {
      if (state._skipNextBattle) {
        state._skipNextBattle = false;
        Game.bus.emit('ui:danmaku', { text: '🕯️ 驱魔蜡烛的微光驱散了黑暗中的威胁...', type: 'system' });
      } else if (!state._pendingBattle && !state.inBattle) {
        state._pendingBattle = true;
        setTimeout(() => {
          state._pendingBattle = false;
          if (!state.inBattle && !state.inSex && !state._eventActive) {
            Game.systems.battle.encounter(Math.random() < 0.10 ? 2 : 1);
          } else {
            Game.bus.emit('ui:refresh');
          }
        }, 500);
      }
    }

    // 随机事件（20%概率，不跟战斗同Tick触发）
    if (state.exploreCount % 5 !== 0 && Math.random() < 0.20) {
      Game.systems.explore._triggerEvent();
    }

    Game.bus.emit('ui:refresh');
    return { text, count: state.exploreCount };
  },

  _triggerEvent() {
    const keys = Object.keys(Texts.exploreEvents);
    const key = keys[Math.floor(Math.random() * keys.length)];
    const event = Texts.exploreEvents[key];
    Game.bus.emit('ui:exploreEvent', { key, event });
  },

  doRest() {
    if (Game.state.inBattle || Game.state.inSex || Game.state._eventActive) return;
    // 由UI层处理弹窗
    Game.bus.emit('ui:modal', {
      title: '💤 休息',
      body: `<p style="text-align:center;color:#a08070;">选择休息方式</p>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px;">
          <button onclick="Game.systems.explore._rest(30)">😴 小憩（体力+30）</button>
          <button onclick="Game.systems.explore._rest(60)">💤 大睡（体力+60）</button>
        </div>`,
    });
  },

  _rest(amount) {
    const state = Game.state;
    if (state.inBattle || state.inSex || state._eventActive) return;
    const p = state.player;
    p.stamina = Math.min(p.maxStamina, p.stamina + amount);
    const hpGain = Math.max(5, Math.floor(amount * 0.4));
    const recoveredHp = Game.changeHp(hpGain);

    // 休息中有概率被侵扰
    if (Math.random() < 0.25) {
      const lostHp = -Game.changeHp(-5);
      const netHp = recoveredHp - lostHp;
      Game.bus.emit('ui:notify', { type: 'error', text: `⚠️ 休息中被侵扰，HP净变化${netHp >= 0 ? '+' : ''}${netHp}` });
    } else {
      Game.bus.emit('ui:notify', { type: 'success', text: `😴 体力+${amount}，HP+${recoveredHp}` });
    }

    // 梦境触发（12%）
    if (Math.random() < 0.30) {
      Game.systems.dream?.trigger();
    }

    Game.bus.emit('ui:closeModal');
    Game.bus.emit('ui:refresh');
  },
};

Game.systems.shop = {
  open() {
    const state = Game.state;
    let html = `<div style="margin-bottom:8px;font-size:12px;color:#8a6a5a;">💰 余额: ¥${state.money}</div>`;
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;">';

    ItemData.forEach(it => {
      const canAfford = state.money >= it.price;
      html += `<div style="background:#160a08;border:1px solid ${canAfford ? '#3a1a14' : '#2a0a0a'};border-radius:8px;padding:8px;text-align:center;${canAfford ? '' : 'opacity:.4;'}">
        <div style="font-size:26px;">${it.icon}</div>
        <div style="font-size:11px;color:#dda08a;">${it.name}</div>
        <div style="font-size:10px;color:#8a6a5a;">${it.desc || ''}</div>
        <div style="font-size:11px;color:#ffdd88;">¥${it.price}</div>
        <button onclick="Game.systems.shop.buy('${it.id}')" ${canAfford ? '' : 'disabled'}
          style="margin-top:4px;padding:2px 8px;font-size:10px;width:100%;">购买</button>
      </div>`;
    });
    html += '</div>';

    Game.bus.emit('ui:modal', { title: '🏪 商城', body: html });
  },

  buy(itemId) {
    const state = Game.state;
    if (state.inBattle || state.inSex) { Game.bus.emit('ui:notify', { type: 'error', text: '❌ 战斗中无法使用商城' }); return; }
    const item = ItemMap[itemId];
    if (!item) return;
    if (state.money < item.price) {
      Game.bus.emit('ui:notify', { type: 'error', text: '❌ 余额不足' });
      return;
    }

    state.money -= item.price;
    Game.addItem(itemId);

    // 特殊效果（武器/服装装备后立即生效）
    if (item.category === 'weapon') state.player.weapon = itemId;
    if (item.category === 'outfit') state.player.outfit = itemId;
    if (item.category === 'weapon') Game._recalcAtk();

    Game.bus.emit('ui:closeModal');
    Game.bus.emit('ui:notify', { type: 'success', text: `✅ 购买了 ${item.name}` });

    // 重新打开刷新
    setTimeout(() => this.open(), 200);
  },

  /* ── 背包 ── */
  openBag() {
    const inv = Game.state.inventory;
    const keys = Object.keys(inv);
    if (keys.length === 0) {
      Game.bus.emit('ui:notify', { type: 'gold', text: '🎒 背包空空如也' });
      return;
    }

    let html = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;">';
    keys.forEach(id => {
      const item = ItemMap[id];
      html += `<div style="background:#160a08;border:1px solid #3a1a14;border-radius:8px;padding:8px;text-align:center;cursor:pointer;"
        onclick="Game.systems.shop.useItem('${id}')">
        <div style="font-size:24px;">${item?.icon || '📦'}</div>
        <div style="font-size:11px;color:#dda08a;">${item?.name || id}</div>
        <div style="font-size:10px;color:#8a6a5a;">×${inv[id]}</div>
      </div>`;
    });
    html += '</div>';

    Game.bus.emit('ui:modal', { title: '🎒 背包', body: html });
  },

  useItem(itemId) {
    const state = Game.state;
    if (state.inBattle || state.inSex) { Game.bus.emit('ui:notify', { type: 'error', text: '❌ 战斗中无法使用物品' }); return; }
    const item = ItemMap[itemId];
    if (!item) { Game.bus.emit('ui:notify', { type: 'error', text: '❌ 未知物品' }); return; }
    const p = state.player;

    // ── 礼物 → 弹出NPC选择 ──
    if (item.category === 'gift') {
      Game.bus.emit('ui:giftSelect', { itemId, item });
      return;
    }

    // 装备只切换穿戴状态，不从背包中消耗。
    if (item.category === 'weapon' || item.category === 'outfit') {
      if (!Game.hasItem(itemId)) return;
      if (item.category === 'weapon') p.weapon = itemId;
      if (item.category === 'outfit') p.outfit = itemId;
      Game._recalcAtk();
      Game.bus.emit('ui:notify', { type: 'success', text: `✅ 已装备 ${item.name}` });
      Game.bus.emit('ui:closeModal');
      Game.bus.emit('ui:refresh');
      return;
    }

    if (itemId === 'key' && Object.values(state.map[state.region] || {}).every(Boolean)) {
      Game.bus.emit('ui:notify', { type: 'gold', text: '🔑 当前区域的锚点已经全部解锁，钥匙没有被消耗。' });
      return;
    }

    // ── 先扣物品 ──
    if (!Game.removeItem(itemId)) {
      Game.bus.emit('ui:notify', { type: 'error', text: '❌ 没有该物品' });
      return;
    }

    const eff = item.effect || {};

    // ── 消耗品效果 ──
    // 旧数据同时写了health和hp；统一生命模型后只取较大的恢复值，避免双倍治疗。
    const healAmount = Math.max(eff.health || 0, eff.hp || 0);
    if (healAmount) Game.changeHp(healAmount);
    if (eff.stamina) p.stamina = Math.min(p.maxStamina, p.stamina + eff.stamina);
    if (eff.lust < 0) p.lust = Math.max(0, p.lust + eff.lust);
    if (eff.lust > 0) p.lust = Math.min(100, p.lust + eff.lust);

    // ── 永久属性药水 ──
    if (eff.staminaMax) {
      p.maxStamina += eff.staminaMax;
      p.stamina = Math.min(p.maxStamina, p.stamina + eff.staminaMax);
    }
    if (eff.healthMax) {
      p.health = Math.min(100, p.health + eff.healthMax);
      p.maxHp += eff.healthMax;
      p.hp = Math.min(p.maxHp, p.hp + eff.healthMax);
    }
    if (eff.endurance) p.endurance = Math.min(100, p.endurance + eff.endurance);

    // ── 稀有道具 ──
    if (eff.randomLike && state.likes) {
      const ids = Object.keys(state.likes);
      if (ids.length > 0) {
        const rid = parseInt(ids[Math.floor(Math.random() * ids.length)]);
        state.likes[rid] = Math.min(100, (state.likes[rid] || 0) + eff.randomLike);
        const npc = state.npcs.find(n => n.id === rid);
        Game.bus.emit('ui:notify', { type: 'gold', text: `💎 ${npc?.name || 'NPC'} 好感+${eff.randomLike}` });
        // 攻略检测
        if (state.likes[rid] >= 90 && !state.conquered[rid]) {
          state.conquered[rid] = true;
          Game.bus.emit('npc:conquered', { monster: npc });
        }
      }
    }
    if (eff.hpMax) { p.maxHp += eff.hpMax; p.hp += eff.hpMax; }
    if (eff.atkPerm) { state.stats.atkGain += eff.atkPerm; Game._recalcAtk(); }

    // ── 驱魔蜡烛：标记下次探索不遇怪 ──
    if (itemId === 'candle') {
      state._skipNextBattle = true;
      Game.bus.emit('ui:notify', { type: 'success', text: '🕯️ 点燃驱魔蜡烛，下次探索不会被袭击' });
    }

    // ── 万能钥匙：直接解锁当前区域的下一个锚点 ──
    if (itemId === 'key') {
      const unlocked = Game.unlockNextAnchor(state.region);
      Game.bus.emit('ui:notify', {
        type: 'gold',
        text: unlocked ? '🔑 万能钥匙打开了通往下一个锚点的隐藏通道！' : '🔑 当前区域的锚点已经全部解锁。',
      });
    }

    Game._recalcAtk();
    Game.bus.emit('ui:notify', { type: 'success', text: `✅ 使用了 ${item.name}` });
    Game.bus.emit('ui:closeModal');
    Game.bus.emit('ui:refresh');
  },

  // 送礼物给NPC
  giftToNpc(npcId, itemId) {
    const state = Game.state;
    if (state.inBattle || state.inSex) return false;
    const item = ItemMap[itemId];
    if (!item || item.category !== 'gift') return false;
    if (!Game.removeItem(itemId)) return false;

    const likeGain = item.effect?.like || 10;
    Game.state.likes[npcId] = Math.min(100, (Game.state.likes[npcId] || 0) + likeGain);

    // 攻略检测
    if (Game.state.likes[npcId] >= 90 && !Game.state.conquered[npcId]) {
      Game.state.conquered[npcId] = true;
      const npc = Game.state.npcs.find(n => n.id === npcId);
      Game.bus.emit('npc:conquered', { monster: npc });
    }

    Game.bus.emit('ui:notify', { type: 'gold', text: `🎁 送出了${item.name}！好感+${likeGain}` });
    Game.bus.emit('ui:refresh');
    return true;
  },
};

/* ============================================================
   地图系统
   ============================================================ */

Game.systems.map = {
  open() {
    const state = Game.state;
    const cr = state.region;

    let html = '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;">';
    Texts.regions.forEach((reg, r) => {
      const active = r === cr;
      html += `<div style="background:#160a08;border:1px solid ${active ? '#8a3a2a' : '#2a100e'};border-radius:4px;padding:4px;text-align:center;${r === cr ? '' : 'opacity:.5;'}">
        ${reg.icon}<br><span style="font-size:9px;">${reg.name}</span></div>`;
    });
    html += '</div><hr style="border-color:#2a0e0a;margin:8px 0;">';

    // 当前区域锚点
    html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;">';
    const anchors = Texts.regionAnchors[cr];
    for (let a = 0; a < 6; a++) {
      const unlocked = state.map[cr] && state.map[cr][a];
      html += `<div style="padding:6px;text-align:center;font-size:10px;border-radius:4px;
        background:#120806;border:1px solid ${unlocked ? '#2a4a2a' : '#2a1410'};
        color:${unlocked ? '#8aca6a' : '#4a2a2a'};cursor:${unlocked ? 'pointer' : 'not-allowed'};"
        ${unlocked ? `onclick="Game.systems.map.travel(${cr},${a})"` : ''}>
        ${anchors[a]}</div>`;
    }
    html += '</div>';

    // 区域切换按钮
    html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px;">';
    Texts.regions.forEach((reg, r) => {
      if (r === cr) return;
      html += `<button onclick="Game.systems.map.travel(${r},0)"
        style="padding:4px;font-size:10px;background:#1a0808;border:1px solid #3a1410;border-radius:4px;"
        ${state.map[r] && state.map[r][0] ? '' : 'disabled'}>
        ${reg.icon} ${reg.name}</button>`;
    });
    html += '</div>';

    Game.bus.emit('ui:modal', { title: '🗺️ 地图', body: html });
  },

  travel(region, anchor) {
    const state = Game.state;
    if (state.inBattle || state.inSex || state._eventActive) return;
    if (!state.map[region]?.[anchor]) return;
    state.region = region;
    state.anchor = anchor;

    Game.bus.emit('ui:closeModal');
    Game.bus.emit('ui:notify', {
      type: 'success',
      text: `📍 移动到 ${Texts.regions[region].name}`,
    });
    Game.bus.emit('ui:refresh');
    Game._checkAllAnchors(region);
    Game._trySpawnPendingBoss();

    // 移动后可能遭遇；等待期间锁住其它主操作，避免探索事件与遭遇互相覆盖。
    if (state.player.hp > 0 && Math.random() < 0.4) {
      state._pendingBattle = true;
      Game.bus.emit('ui:refresh');
      setTimeout(() => {
        state._pendingBattle = false;
        if (!state.inBattle && !state.inSex && !state._eventActive) {
          Game.systems.battle.encounter();
        } else {
          Game.bus.emit('ui:refresh');
        }
      }, 500);
    }
  },
};


/* ══ js/systems/social.js ══ */
/* ============================================================
   社交系统 —— 好感、邀约、谈心、攻略
   ============================================================ */

Game.systems.social = {
  _cooldowns: {},   // {npcId: timestamp}
  _rejectStreak: 0,
  _inviteInFlight: false,

  /** 定时邀约检测（由live系统每20秒调用一次） */
  async checkInvite() {
    const state = Game.state;
    if (!Game.systems.live?._active || state.inBattle || state.inSex || state._eventActive || state._pendingBattle || this._inviteInFlight) return;

    this._inviteInFlight = true;
    try {
    const requestRegion = state.region;

    const candidates = state.npcs.filter(n =>
      n.region === state.region &&
      (state.likes[n.id] || 0) > 20 &&
      !this._cooldowns[n.id]
    );
    if (candidates.length === 0) return;

    const monster = candidates[Math.floor(Math.random() * candidates.length)];
    const like = state.likes[monster.id] || 0;
    if (Math.random() > like / 100) return;

    // 获取邀约文本 — AI优先
    const pool = Texts.invite[monster.personality] || Texts.invite['温柔'];
    const aiText = AIService.isAvailable() ? await AIService.generateInvite(monster) : null;
    // AI返回时游戏状态可能已经改变，不能用过期结果覆盖战斗/事件弹窗。
    if (!Game.systems.live?._active || state.inBattle || state.inSex || state._eventActive || state._pendingBattle || state.region !== requestRegion) return;
    const text = aiText || pool[Math.floor(Math.random() * pool.length)];

    // 展示邀约弹窗
    Game.bus.emit('ui:invite', { monster, text });
    } finally {
      this._inviteInFlight = false;
    }
  },

  /** 接受邀约 */
  accept(monster) {
    const state = Game.state;
    if (state.inBattle || state.inSex) return;
    const like = state.likes[monster.id] || 0;
    const gain = 3 + Math.floor(Math.random() * 6);
    state.likes[monster.id] = Math.min(100, like + gain);

    this._rejectStreak = 0;
    this._setCooldown(monster.id, 60000);

    // 攻略检测
    if (state.likes[monster.id] >= 90 && !state.conquered[monster.id]) {
      state.conquered[monster.id] = true;
      Game.bus.emit('npc:conquered', { monster });
    }

    // 随机互动类型
    const r = Math.random();
    if (r < 0.3 && like > 50) {
      this._talk(monster, gain);
    } else if (r < 0.6) {
      Game.bus.emit('ui:notify', { type: 'gold', text: `🔞 和${monster.name}亲密接触，好感+${gain}` });
      state.sexCount++;
      Game.systems.sex.start(monster, false);
    } else {
      state.player.stamina = Math.min(state.player.maxStamina, state.player.stamina + 20);
      Game.bus.emit('ui:notify', { type: 'success', text: `🍽️ 和${monster.name}共餐，体力+20，好感+${gain}` });
    }

    Game.bus.emit('ui:refresh');
  },

  /** 拒绝邀约 */
  reject(monster) {
    const state = Game.state;
    if (state.inBattle || state.inSex) return;
    this._rejectStreak++;
    const penalty = this._rejectStreak >= 5 ? 15 : (this._rejectStreak >= 3 ? 10 : 5);
    state.likes[monster.id] = Math.max(0, (state.likes[monster.id] || 0) - penalty);

    const msg = this._rejectStreak >= 3
      ? `💔 多次拒绝，好感-${penalty}`
      : `❌ 拒绝邀约，好感-${penalty}`;
    Game.bus.emit('ui:notify', { type: 'error', text: msg });

    this._setCooldown(monster.id, 120000);
    Game.bus.emit('ui:refresh');
  },

  /** 谈心 */
  async _talk(monster, likeGain) {
    const pool = Texts.talk[monster.personality] || Texts.talk['温柔'];
    const aiText = AIService.isAvailable() ? await AIService.generateTalk(monster) : null;
    const text = aiText || pool[Math.floor(Math.random() * pool.length)];
    Game.bus.emit('ui:notify', { type: 'gold', text: `💬 ${monster.name}：${text} 好感+${likeGain}` });
  },

  _setCooldown(npcId, duration) {
    this._cooldowns[npcId] = Date.now() + duration;
    // 定时清理
    setTimeout(() => { delete this._cooldowns[npcId]; }, duration);
  },

  /** 打开攻略面板 */
  openLove() {
    const state = Game.state;
    const npcs = state.npcs;
    if (!npcs || npcs.length === 0) {
      Game.bus.emit('ui:notify', { type: 'error', text: '❌ 没有NPC数据' });
      return;
    }

    let html = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;">';
    let conqueredCount = 0;

    npcs.forEach(n => {
      const lk = state.likes[n.id] || 0;
      const dn = state.conquered[n.id] || false;
      const pc = Math.min(lk, 100);
      if (lk >= 90) conqueredCount++;

      html += `<div style="background:#160a08;border:1px solid ${dn ? '#8a6a1a' : '#3a1a14'};border-radius:8px;padding:8px;">
        <div style="font-weight:bold;color:#dda08a;font-size:13px;">${n.name}${dn ? ' 💕' : ''}</div>
        <div style="font-size:9px;color:#6a4a3a;">${n.personality} · Lv.${n.level} · 区域${n.region}</div>
        <div style="height:6px;background:#1a0606;border-radius:3px;margin:4px 0;overflow:hidden;border:1px solid #2a1010;">
          <div style="height:100%;background:linear-gradient(90deg,#6a1040,#cc2266,#ff4488);border-radius:3px;width:${pc}%;"></div></div>
        <div style="font-size:11px;color:#dd8a8a;">♥ ${lk}/100</div>
        ${dn ? '<div style="font-size:9px;color:#ffdd88;">✅ 已攻略</div>' : ''}
      </div>`;
    });

    html += `</div><div style="margin-top:8px;font-size:12px;color:#8a6a5a;text-align:center;">
      攻略进度: ${conqueredCount} / ${npcs.length}</div>`;

    Game.bus.emit('ui:modal', { title: '💕 攻略', body: html });
  },
};


/* ══ js/systems/live.js ══ */
/* ============================================================
   直播系统 —— 弹幕 + 打赏 + 观众情绪 + 大额命令
   ============================================================ */

Game.systems.live = {
  _danmakuTimer: null,
  _tipTimer: null,
  _inviteTimer: null,
  _sceneInterval: 3000,
  _danmakuInFlight: false,
  _active: false,

  /** 启动直播 */
  start() {
    this._active = true;
    Game.bus.emit('ui:danmaku', { text: '📡 直播已连接', type: 'system' });
    this._startDanmaku();
    this._startTips();
    this._startInvites();
    Game.systems.social._inviteInFlight = false; // 强制重置状态
  },

  /** 停止直播 */
  stop() {
    this._active = false;
    clearInterval(this._danmakuTimer);
    clearInterval(this._tipTimer);
    clearInterval(this._inviteTimer);
  },

  /** 弹幕循环 */
  _startDanmaku() {
    clearInterval(this._danmakuTimer);
    this._danmakuTimer = setInterval(async () => {
      if (!this._active || !Game.ready || this._danmakuInFlight) return;
      this._danmakuInFlight = true;
      try {
        const scene = this._getScene();
        const pool = Texts.danmaku[scene] || Texts.danmaku.explore;
        // AI优先，预设兜底；同一时间只允许一个请求。
        const aiText = AIService.isAvailable() ? await AIService.generateDanmaku(scene) : null;
        if (!this._active) return;
        const text = aiText || pool[Math.floor(Math.random() * pool.length)];

        let type = 'normal';
        if (scene === 'climax' || scene === 'boss') type = 'excited';
        if (scene === 'gift') type = 'gift';

        Game.bus.emit('ui:danmaku', { text, type });

        // 调整频率
        const intervals = { explore: 3000, battle: 1500, sex: 1500, climax: 800, boss: 1000 };
        const newInterval = intervals[scene] || 3000;
        if (newInterval !== this._sceneInterval) {
          this._sceneInterval = newInterval;
          this._startDanmaku();
        }
      } finally {
        this._danmakuInFlight = false;
      }
    }, this._sceneInterval);
  },

  /** 打赏循环 */
  _startTips() {
    clearInterval(this._tipTimer);
    this._tipTimer = setInterval(() => {
      const state = Game.state;
      if (!state || !state.player) return;

      // 探索时打赏
      if (!state.inBattle && !state.inSex && Math.random() < 0.20) {
        this._addTip(Math.floor(20 + Math.random() * 180));
      }
      // 战斗中
      if (state.inBattle && Math.random() < 0.30) {
        this._addTip(Math.floor(50 + Math.random() * 250));
      }
      // 做爱中
      if (state.inSex && Math.random() < 0.40) {
        this._addTip(Math.floor(100 + Math.random() * 400));

        // 大额命令（35%概率）
        if (Math.random() < 0.35) {
          this._bigTipCommand();
        }
      }
    }, 2000);
  },

  /** 邀约检测 */
  _startInvites() {
    clearInterval(this._inviteTimer);
    this._inviteTimer = setInterval(() => {
      Game.systems.social?.checkInvite();
    }, 20000);
  },

  /** 打赏 */
  _addTip(amount) {
    const state = Game.state;
    const actual = Math.floor(amount * (1 + state.viewers / 20000) * 0.5 * Game.getTipMultiplier());
    state.money += actual;
    state.giftTotal += amount;
    state.stats.totalTips += amount;
    Game.bus.emit('ui:danmaku', {
      text: `🎁 打赏 ¥${amount}！主播获得 ¥${actual}`,
      type: 'gift',
    });
    Game.bus.emit('ui:refresh');
  },

  /** 大额打赏命令 */
  _bigTipCommand() {
    const cmds = Texts.tipCommands;
    const puns = Texts.tipPunishments;
    const cmd = cmds[Math.floor(Math.random() * cmds.length)];
    const amt = Math.floor(1000 + Math.random() * 4000);
    const punishmentIndex = Math.floor(Math.random() * puns.length);

    Game.bus.emit('ui:tipCommand', { cmd, amount: amt, punishmentIndex });
  },

  /** 接受命令 */
  acceptCommand(amount) {
    // 演出文本
    const perf = Texts.tipPerform[Math.floor(Math.random() * Texts.tipPerform.length)];
    Game.bus.emit('ui:danmaku', { text: '卧槽她真的做了！！', type: 'excited' });
    Game.bus.emit('ui:notify', { type: 'gold', text: perf });
    this._addTip(amount);
    // 弹幕连锁反应
    setTimeout(() => Game.bus.emit('ui:danmaku', { text: '社保！！已录屏！！', type: 'excited' }), 300);
    setTimeout(() => Game.bus.emit('ui:danmaku', { text: '老板大气！！主播太拼了！！', type: 'gift' }), 600);
  },

  /** 拒绝命令 */
  rejectCommand(punishmentIndex) {
    const puns = Texts.tipPunishments;
    const index = Number.isInteger(punishmentIndex) && punishmentIndex >= 0 && punishmentIndex < puns.length
      ? punishmentIndex
      : Math.floor(Math.random() * puns.length);
    const pun = puns[index];
    const state = Game.state;
    const p = state.player;

    switch (index) {
      case 0: Game.changeHp(-10); break;
      case 1: state.money = Math.max(0, state.money - 200); break;
      case 2: p.stamina = Math.max(0, p.stamina - 15); break;
      case 3: p.lust = Math.min(100, p.lust + 20); break;
      case 4: state.viewers = Math.max(500, state.viewers - 50); break;
      case 5: p.stamina = Math.max(0, p.stamina - 20); break;
      case 6: {
        const ids = Object.keys(state.likes || {});
        if (ids.length > 0) {
          const rid = ids[Math.floor(Math.random() * ids.length)];
          state.likes[rid] = Math.max(0, (state.likes[rid] || 0) - 5);
        }
        break;
      }
    }

    Game._recalcAtk();
    Game.bus.emit('ui:notify', { type: 'error', text: `❌ 拒绝命令！${pun}` });
    Game.bus.emit('ui:refresh');
  },

  /** 获取当前场景 */
  _getScene() {
    const state = Game.state;
    if (!state) return 'explore';
    if (state.inBattle) {
      const sess = Game.systems.battle?.session;
      if (sess?.monster?.isBoss) return 'boss';
      return 'battle';
    }
    if (state.inSex && Game.systems.sex?.session?.passion >= 90) return 'climax';
    if (state.inSex) return 'sex';
    return 'explore';
  },

  /** 更新观众数 */
  updateViewers() {
    const state = Game.state;
    state.viewers = Math.floor(1000 + state.sexCount * 50 + state.level * 20 + state.orgasmCount * 30);
  },
};

/* ══ js/ai.js ══ */
/* ============================================================
   AI 接口 —— DeepSeek API（可选，用户在角色创建页配置）
   ============================================================ */

const AIService = {
  _config: { key: '', mode: 'off' },

  /** 从UI读取配置 */
  loadConfig() {
    const keyEl = document.getElementById('ai-key');
    const modeEl = document.getElementById('ai-mode');
    this._config.key = keyEl?.value || '';
    this._config.mode = modeEl?.value || 'off';
    return this.isAvailable();
  },

  /** 是否可用 */
  isAvailable() {
    return this._config.key && this._config.key.length > 10 && this._config.mode === 'mix';
  },

  /** 调用AI生成文本 */
  async generate(prompt) {
    if (!this.isAvailable()) return null;

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);
    try {
      const resp = await fetch('https://api.deepseek.com/v1/chat/completions', {
        method: 'POST',
        signal: controller.signal,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${this._config.key}`,
        },
        body: JSON.stringify({
          model: 'deepseek-chat',
          messages: [
            { role: 'system', content: '你是一个色情恐怖游戏中的角色。用中文回答，15-30字。骚浪口语化，不啰嗦。' },
            { role: 'user', content: prompt },
          ],
          temperature: 0.9,
          max_tokens: 50,
        }),
      });

      if (!resp.ok) return null;
      const data = await resp.json();
      return data.choices?.[0]?.message?.content || null;
    } catch (e) {
      console.log('[AI] 调用失败，使用预设文本');
      return null;
    } finally {
      clearTimeout(timeout);
    }
  },

  /** AI弹幕 */
  async generateDanmaku(scene) {
    const prompts = {
      explore: '主播正在探索恐怖场景，发一条弹幕。',
      battle: '主播正在和怪物战斗，发一条兴奋的弹幕。',
      sex: '主播正在和怪物做爱，发一条色情弹幕。',
      climax: '主播高潮了！发一条非常兴奋的弹幕！',
      boss: 'BOSS战！发一条激动的弹幕！',
    };
    return this.generate(prompts[scene] || prompts.explore);
  },

  /** AI邀约 */
  async generateInvite(monster) {
    return this.generate(`你是一个性格${monster.personality}的怪物${monster.name}，用第一人称邀请玩家。`);
  },

  /** AI谈心 */
  async generateTalk(monster) {
    return this.generate(`你是${monster.name}，性格${monster.personality}，对玩家好感度很高。说一句谈心的话。`);
  },
};

    '午夜绅士', '疯狂打赏人', '纯爱战士', '暗夜行者',

  /** 初始化UI事件 */

    Game.bus.on('ui:refresh', () => this.refresh());

    Game.bus.on('ui:danmaku', (data) => this.addDanmaku(data.text, data.type));
    Game.bus.on('ui:modal', (data) => this.openModal(data.title, data.body));
    Game.bus.on('ui:closeModal', () => this.closeModal());
    Game.bus.on('ui:invite', (data) => this.showInvite(data.monster, data.text));
    Game.bus.on('ui:tipCommand', (data) => this.showTipCommand(data.cmd, data.amount, data.punishmentIndex));
    Game.bus.on('ui:dream', (data) => this.showDream(data));
    Game.bus.on('battle:encounter', (data) => this.renderBattle(data.monster, data.isBoss));
    Game.bus.on('battle:won', (data) => this.renderVictory(data));
    Game.bus.on('sex:start', (data) => this.renderSex(data.monster, data.rough));
    Game.bus.on('npc:conquered', (data) => this.showConquered(data.monster));
    Game.bus.on('ui:giftSelect', (data) => this.showGiftSelect(data.itemId, data.item));
    Game.bus.on('ui:exploreEvent', (data) => this.showExploreEvent(data.key, data.event));
    Game.bus.on('ui:achievement', (data) => {
  const pop = document.createElement('div');
  pop.className = 'p-toast show';
  pop.innerHTML = `<div class="p-icon">${data.icon}</div>
    <div class="p-name" style="color:#ffdd88;">🏆 成就解锁！</div>
    <div class="p-desc">${data.name} - ${data.desc}</div>`;
  document.body.appendChild(pop);
  setTimeout(() => pop.remove(), 4000);
  this.toast(`🏆 解锁成就：${data.name}`, 'gold');
});
    Game.bus.on('game:ending', () => this.playEnding());
    Game.bus.on('sex:midClimax', (data) => {
      this.toast('💦 中途高潮！观众疯狂打赏！', 'gold');
      this.addDanmaku('中途就高潮了！！太色了！！', 'excited');
    });
    Game.bus.on('battle:lost', (data) => {
      this.toast(`💀 被${data.monster?.name || '怪物'}击败了...`, 'error');
    });
    Game.bus.on('player:hurt', (dmg) => {
      if (dmg > 5) this.toast(`🩸 受到 ${dmg} 伤害！`, 'error');
    });
  },

  /* ── 只刷新状态栏（不碰画面内容）── */
  _refreshStatus() {
    const state = Game.state;
    if (!state || !state.player) return;
    const p = state.player;
    const sb = document.getElementById('status-bar');
    if (sb) {
      sb.innerHTML = `⚡<span class="s-v">${p.stamina}/${p.maxStamina}</span> ❤️<span class="s-v">${Math.floor(p.hp)}/${p.maxHp}</span> 🔞<span class="s-v">${p.lust}</span> ✨<span class="s-v">${p.charm}</span> 💨<span class="s-v">${p.agility}</span> 🛡️<span class="s-v">${p.endurance}</span> ⚔️<span class="s-v">${p.atk}</span> Lv.<span class="s-v">${state.level}</span> 💰<span class="s-v">${state.money}</span>`;
    }
    const nd = 100 + (state.level - 1) * 50;
    const ef = document.getElementById('exp-fill');
    const et = document.getElementById('exp-text');
    if (ef) ef.style.width = Math.min(state.exp / nd * 100, 100) + '%';
    if (et) et.textContent = `EXP: ${state.exp}/${nd}`;
    Game.systems.live.updateViewers();
    const vc = document.getElementById('viewer-count');
    const gt = document.getElementById('gift-total');
    if (vc) vc.textContent = state.viewers;
    if (gt) gt.textContent = state.giftTotal || 0;
  },

  /* ── 主刷新 ── */
  refresh() {
    this._refreshStatus();
    const state = Game.state;
    if (!state || !state.player) return;

    // 如果在战斗或做爱中，内容由专门函数渲染
    if (!state.inBattle && !state.inSex) {
      this.renderDefault();
    }
  },

  _journeyActions() {
    const state = Game.state;
    if (state._pendingBattle || state.bossPending[state.region]) return [];
    const actions = [
      { text: '🔍 探索', fn: () => {
        if (Game.systems.explore.doExplore()) this.renderExplore();
      }},
      { text: '💤 休息', fn: () => Game.systems.explore.doRest() },
    ];
    if (state.bossReady[state.region] && !state.bossDefeated[state.region]) {
      actions.unshift({
        text: '👑 挑战Boss',
        fn: () => Game.startBossBattle(state.region),
      });
    }
    return actions;
  },

  /* ── 默认界面 ── */
  renderDefault() {
    const state = Game.state;
    if (state.inBattle || state.inSex || state._eventActive) return; // 战斗中不覆盖UI
    const mc = document.getElementById('main-content');
    if (!mc) return;
    const reg = Texts.regions[state.region];
    mc.innerHTML = `<div style="text-align:center;padding:20px;">
      <div style="font-size:36px;">${reg.icon}</div>
      <h2 style="color:#d49078;font-size:18px;margin:8px 0;">${reg.name}</h2>
      <p style="font-size:11px;color:#8a6a5a;">${reg.desc}</p>
      <p style="color:#5a3a2a;font-size:10px;margin-top:6px;">锚点 ${state.anchor + 1}/6 · 探索次数 ${state.exploreCount}</p>
    </div>`;

    this.setActions(this._journeyActions());
  },

  /* ── 探索结果 ── */
  renderExplore() {
    const state = Game.state;
    if (state.inBattle || state.inSex || state._eventActive) return; // 战斗中不覆盖UI
    const reg = Texts.regions[state.region];
    const pool = [...Texts.explore.default, ...(Texts.explore[state.region] || [])];
    const text = pool[Math.floor(Math.random() * pool.length)];
    const mc = document.getElementById('main-content');
    if (!mc) return;

    mc.innerHTML = `<div style="text-align:center;padding:20px;">
      <div style="font-size:36px;">🔦</div>
      <p style="color:#c8a088;font-size:13px;margin:8px 0;">${text}</p>
      <p style="color:#6a4a3a;font-size:10px;">第 ${state.exploreCount} 次探索</p>
    </div>`;
  },

  /* ── 战斗 ── */

    const state = Game.state;
    const p = state.player;
    const mc = document.getElementById('main-content');
    if (!mc) return;

    const desc = monster.appearance || monster.personality;
    mc.innerHTML = `<div style="text-align:center;padding:20px;">
      <div style="font-size:36px;">${isBoss ? '👑' : '👹'}</div>
      <h2 style="color:${isBoss ? '#ffdd88' : '#dd8a6a'};">${monster.name}</h2>
      <p style="font-size:11px;color:#8a6a5a;">${desc}</p>
      <p style="font-size:11px;color:#aa6a4a;">Lv.${monster.level} ⚔️${monster.atk}</p>
      <p>怪物HP: ${Math.floor(monster.hp)}/${monster.maxHp}</p>
      <p>你的HP: ${Math.floor(p.hp)}/${p.maxHp} ⚡${p.stamina}</p>
      ${isBoss ? `<p style="color:#ffdd88;font-size:10px;">👑 BOSS技能：${Texts.regions[state.region].bossSkill}</p>` : ''}

  _doBattle(action) {
    const result = Game.systems.battle.act(action);
    if (!result) return;
    if (result.error) { this.toast(result.error, 'error'); return; }
    // 胜利界面由battle:won事件统一渲染，避免重复渲染丢失Boss标志。
    if (result.victory) return;
    if (result.victory === false) { return; } // 战败由系统自动处理

    // 更新界面
    const mc = document.getElementById('main-content');
    if (mc && result.monster) {

        <p>怪物HP: ${Math.floor(m.hp)}/${m.maxHp}</p>

  /* ── 弹幕 ── */
  addDanmaku(text, type = 'normal') {
    const box = document.getElementById('danmaku-box');
    if (!box) return;

    const user = this._danmakuPool[Math.floor(Math.random() * this._danmakuPool.length)];
    const item = document.createElement('div');
    item.className = 'dm-item ' + type;

    if (type === 'system' || type === 'gift') {
      item.textContent = text;
    } else {
      item.innerHTML = `<span class="d-user">${user}:</span>${text}`;
    }

    box.appendChild(item);
    while (box.children.length > 25) box.removeChild(box.firstChild);
  },

  /* ── 弹窗 ── */
  openModal(title, body) {
    const overlay = document.getElementById('modal-overlay');
    const titleEl = document.getElementById('modal-title-text');
    const bodyEl = document.getElementById('modal-body');
    if (!overlay) return;
    if (titleEl) titleEl.textContent = title;
    if (bodyEl) bodyEl.innerHTML = body;
    overlay.classList.add('active');
  },

  closeModal() {
    const overlay = document.getElementById('modal-overlay');
    if (overlay) overlay.classList.remove('active');
  },

  _bindModalClose() {
    document.getElementById('modal-close-btn')?.addEventListener('click', () => this.closeModal());
    document.getElementById('modal-overlay')?.addEventListener('click', (e) => {
      if (e.target === e.currentTarget) this.closeModal();
    });
  },

  /* ── Toast ── */
  toast(msg, type = '') {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.className = 'show ' + type;
    if (el._t) clearTimeout(el._t);
    el._t = setTimeout(() => { el.className = ''; }, 3000);
  },

  /* ── 邀约弹窗 ── */
  showInvite(monster, text) {
    // 探索事件拥有独立状态锁，邀约不得覆盖它。
    if (Game.state._eventActive) return;
    document.querySelectorAll('.invite-box[data-kind="invite"]').forEach(el => el.remove());

    const ov = document.createElement('div');
    ov.className = 'invite-box';
    ov.dataset.kind = 'invite';
    ov.innerHTML = `<div class="invite-card">
      <div style="font-size:18px;color:#dda08a;font-weight:bold;">${monster.name}</div>
      <div style="font-size:11px;color:#8a6a5a;margin:4px 0;">${monster.personality} · Lv.${monster.level}</div>
      <div style="font-size:14px;color:#ba9a8a;margin:12px 0;padding:10px;background:rgba(0,0,0,0.3);border-radius:8px;">${text}</div>
      <div style="display:flex;gap:8px;justify-content:center;">
        <button onclick="this.closest('.invite-box').remove();Game.systems.social.accept(Game.systems.social._lastInviteMonster)"
          style="padding:8px 24px;background:linear-gradient(135deg,#2a6a2a,#3a8a3a);border-color:#4aaa4a;color:#fff;border-radius:8px;">💕 去</button>
        <button onclick="this.closest('.invite-box').remove();Game.systems.social.reject(Game.systems.social._lastInviteMonster)"
          style="padding:8px 24px;background:linear-gradient(135deg,#6a2a2a,#8a3a3a);border-color:#aa4a4a;color:#fff;border-radius:8px;">❌ 不去</button>
      </div></div>`;

    // 暂存monster引用
    Game.systems.social._lastInviteMonster = monster;

    document.body.appendChild(ov);
    ov.addEventListener('click', (e) => {
      if (e.target === ov) ov.remove();
    });

    }).slice(0, 20);

    let listHtml = npcs.map(n => {
      const like = state.likes[n.id] || 0;
      const isHere = n.region === state.region;
      return `<div onclick="this.closest('.invite-box').remove();Game.systems.shop.giftToNpc(${n.id},'${itemId}')"
        style="padding:8px;margin:3px 0;border:1px solid ${isHere ? '#5a2a1a' : '#2a1010'};border-radius:6px;cursor:pointer;background:#160a08;display:flex;justify-content:space-between;align-items:center;">
        <span>${isHere ? '📍' : ''} <b style="color:#dda08a;">${n.name}</b> <span style="font-size:10px;color:#8a6a5a;">${n.personality} Lv.${n.level}</span></span>
        <span style="font-size:11px;color:#dd8a8a;">♥${like}/100</span>
      </div>`;
    }).join('');

    const ov = document.createElement('div');
    ov.className = 'invite-box';
    ov.dataset.kind = 'gift';
    ov.innerHTML = `<div class="invite-card">
      <div style="font-size:16px;color:#ffdd88;margin-bottom:8px;">${item.icon} 把 ${item.name} 送给谁？</div>
      <div style="max-height:360px;overflow-y:auto;">${listHtml}</div>
      <button onclick="this.closest('.invite-box').remove()"
        style="margin-top:8px;padding:6px 16px;background:#3a1a1a;border:1px solid #5a2a2a;color:#aaa;border-radius:6px;">取消</button>
    </div>`;
    document.body.appendChild(ov);
    ov.addEventListener('click', (e) => { if (e.target === ov) ov.remove(); });
  },

  /* ── 探索事件弹窗 ── */
  showExploreEvent(key, event) {
    // 只替换同类型弹窗，避免误删邀约后留下悬空状态。
    document.querySelectorAll('.invite-box[data-kind="explore"]').forEach(el => el.remove());
    Game.state._eventActive = true; // 标记事件活跃，禁止探索

    let choicesHtml = event.choices.map((c, i) =>
      `<div onclick="UI._doExploreChoice('${key}',${i})"
        style="padding:10px;margin:4px 0;border:1px solid #4a2a1a;border-radius:6px;cursor:pointer;background:#160a08;">
        <b style="color:#dda08a;">${c.text}</b>
      </div>`
    ).join('');

    const ov = document.createElement('div');
    ov.className = 'invite-box';
    ov.dataset.kind = 'explore';
    ov.innerHTML = `<div class="invite-card">
      <div style="font-size:18px;color:#ffdd88;margin-bottom:6px;">${event.title}</div>
      <div style="font-size:12px;color:#ba9a8a;margin-bottom:10px;">${event.desc}</div>
      ${choicesHtml}
    </div>`;
    document.body.appendChild(ov);
    ov.addEventListener('click', (e) => {
      if (e.target === ov) {
        ov.remove();
        Game.state._eventActive = false;
        Game._trySpawnPendingBoss?.();
        this.renderDefault();
      }
    });
  },

  _doExploreChoice(eventKey, choiceIdx) {
    document.querySelectorAll('.invite-box[data-kind="explore"]').forEach(el => el.remove());
    Game.state._eventActive = false;

    const event = Texts.exploreEvents[eventKey];
    if (!event) return;
    const choice = event.choices[choiceIdx];
    if (!choice) return;
    const eff = choice.effect || {};
    const state = Game.state;
    const p = state.player;

    // 应用效果
    if (eff.money) state.money += eff.money;
    if (eff.health) Game.changeHp(eff.health);
    if (eff.stamina) p.stamina = Math.max(0, Math.min(p.maxStamina, p.stamina + eff.stamina));
    if (eff.lust) p.lust = Math.min(100, Math.max(0, p.lust + eff.lust));
    if (eff.item) Game.addItem(eff.item);
    if (eff.unlockAnchor) {
      const cr = state.region;
      const unlocked = Game.unlockNextAnchor(cr);
      if (unlocked) {
        this.toast('📍 神秘信息解锁了新锚点！', 'gold');
      }
    }
    Game._recalcAtk();

    // 弹幕+页面内结果展示（玩家不会错过）
    if (choice.result === 'good') {
      this.addDanmaku('捡到宝了！！', 'gift');
    } else if (choice.result === 'bad') {
      this.addDanmaku('快跑！！', 'excited');
    }

    // 展示结果文本在主内容区
    const mc = document.getElementById('main-content');
    if (mc) {
      mc.innerHTML = `<div style="text-align:center;padding:20px;">
        <div style="font-size:36px;">${event.title.slice(0,2)}</div>
        <p style="color:#c8a088;font-size:14px;margin:10px 0;padding:12px;background:rgba(0,0,0,.3);border-radius:8px;line-height:1.7;">${choice.desc}</p>
        ${eff.money ? `<p style="color:#ffdd88;">💰 +¥${eff.money}</p>` : ''}
        ${eff.item ? `<p style="color:#88ff88;">📦 获得 ${ItemMap[eff.item]?.name || eff.item}</p>` : ''}
      </div>`;
    }

    // 保留结果页，不让全局refresh立即把它覆盖掉。
    this._refreshStatus();
    this.setActions(this._journeyActions());
    Game._trySpawnPendingBoss?.();
  },

  /* ── 打赏命令弹窗 ── */
  showTipCommand(cmd, amount, punishmentIndex) {
    document.querySelectorAll('.p-cmd-box').forEach(el => el.remove());
    const puns = Texts.tipPunishments;
    const index = Number.isInteger(punishmentIndex) && punishmentIndex >= 0 && punishmentIndex < puns.length
      ? punishmentIndex
