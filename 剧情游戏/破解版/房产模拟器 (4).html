<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极乐租房宇宙 v3.1 · 优化版</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Playfair+Display:ital,wght@0,700;1,400&family=Cormorant+Garamond:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
    :root {
        --bg-deep: #08060a;
        --bg-dark: #0e0a14;
        --bg-mid: #1a1224;
        --bg-card: #1e1530;
        --gold: #d4a853;
        --gold-light: #f5e6b8;
        --gold-bright: #ffd700;
        --gold-dark: #8a6d3b;
        --rose: #cc2255;
        --rose-deep: #8a0f30;
        --ruby: #aa2244;
        --emerald: #22884a;
        --sapphire: #2244aa;
        --amethyst: #8844aa;
        --text: #ede4d8;
        --text-dim: #9a8a78;
        --text-gold: #e8d5a0;
        --border: #2a1a40;
        --border-gold: rgba(212,168,83,0.25);
        --radius: 20px;
        --radius-sm: 12px;
        --transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        --font-title: 'Playfair Display', serif;
        --font-body: 'Noto Serif SC', serif;
        --font-deco: 'Cormorant Garamond', serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: var(--font-body); background: var(--bg-deep); color: var(--text); overflow: hidden; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--gold-dark), var(--gold)); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--gold); }
    #particles-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; opacity: 0.6; }
    .ornate-corner { position: fixed; width: 120px; height: 120px; pointer-events: none; z-index: 0; opacity: 0.15; }
    .ornate-corner.tl { top: 0; left: 0; border-top: 2px solid var(--gold); border-left: 2px solid var(--gold); border-radius: 0 0 20px 0; }
    .ornate-corner.tr { top: 0; right: 0; border-top: 2px solid var(--gold); border-right: 2px solid var(--gold); border-radius: 0 0 0 20px; }
    .ornate-corner.bl { bottom: 0; left: 0; border-bottom: 2px solid var(--gold); border-left: 2px solid var(--gold); border-radius: 0 20px 0 0; }
    .ornate-corner.br { bottom: 0; right: 0; border-bottom: 2px solid var(--gold); border-right: 2px solid var(--gold); border-radius: 20px 0 0 0; }
    #app { position: relative; z-index: 1; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
    #splash-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 30%, #1a0f24 0%, #0d0818 45%, #050308 100%); z-index: 10; transition: opacity 0.9s ease, transform 0.9s ease; }
    #splash-screen.hidden { opacity: 0; transform: scale(1.15); pointer-events: none; }
    .splash-bg-orb { position: absolute; border-radius: 50%; filter: blur(80px); pointer-events: none; animation: orbFloat 8s ease-in-out infinite alternate; }
    .splash-bg-orb.o1 { width: 400px; height: 400px; background: rgba(212,168,83,0.08); top: -10%; left: -5%; animation-duration: 10s; }
    .splash-bg-orb.o2 { width: 350px; height: 350px; background: rgba(204,34,85,0.06); bottom: -8%; right: -5%; animation-duration: 12s; animation-delay: -3s; }
    .splash-bg-orb.o3 { width: 250px; height: 250px; background: rgba(136,68,170,0.05); top: 50%; left: 50%; transform: translate(-50%,-50%); animation-duration: 14s; animation-delay: -6s; }
    @keyframes orbFloat { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, -30px) scale(1.1); } }
    .splash-ornament { font-size: 0.9rem; color: var(--gold-dark); letter-spacing: 0.6em; margin-bottom: 0.8rem; opacity: 0.6; font-family: var(--font-deco); font-style: italic; position: relative; z-index: 1; }
    .splash-title-line { text-align: center; position: relative; z-index: 1; line-height: 1; }
    .splash-title-line .big { font-family: var(--font-title); font-size: clamp(4rem, 12vw, 9rem); font-weight: 700; font-style: italic; color: var(--gold); letter-spacing: 0.04em; text-shadow: 0 0 100px rgba(212,168,83,0.15), 0 0 200px rgba(212,168,83,0.05), 0 4px 20px rgba(0,0,0,0.5); animation: titleGlow 6s ease-in-out infinite; }
    .splash-title-line .sub { font-family: var(--font-title); font-size: clamp(2rem, 5vw, 4.5rem); font-weight: 400; font-style: italic; color: var(--gold-light); margin-top: -0.15em; letter-spacing: 0.08em; text-shadow: 0 0 60px rgba(212,168,83,0.1); opacity: 0.85; }
    @keyframes titleGlow { 0%, 100% { text-shadow: 0 0 80px rgba(212,168,83,0.15), 0 0 160px rgba(212,168,83,0.04); } 50% { text-shadow: 0 0 140px rgba(212,168,83,0.3), 0 0 280px rgba(212,168,83,0.08); } }
    .splash-divider { width: 280px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent); margin: 1.4rem 0; position: relative; z-index: 1; }
    .splash-divider::after { content: '✦'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--gold); font-size: 0.6rem; background: transparent; padding: 0 1rem; }
    .splash-subtitle { font-size: 1.1rem; color: var(--text-dim); letter-spacing: 0.35em; font-weight: 400; font-family: var(--font-deco); font-style: italic; position: relative; z-index: 1; background: linear-gradient(90deg, var(--text-dim), var(--gold-dark), var(--text-dim)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .splash-btn { background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold) 50%, var(--gold-light) 100%); color: #0a0610; border: none; padding: 1.1em 4.5em; font-size: 1.05rem; font-weight: 700; border-radius: 50px; cursor: pointer; letter-spacing: 0.15em; transition: var(--transition); position: relative; z-index: 1; box-shadow: 0 0 60px rgba(212,168,83,0.12), inset 0 1px 0 rgba(255,255,255,0.25); font-family: var(--font-body); margin-top: 1.8rem; overflow: hidden; }
    .splash-btn::before { content: ''; position: absolute; inset: 0; border-radius: 50px; background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%); opacity: 0; transition: opacity 0.5s ease; }
    .splash-btn:hover::before { opacity: 1; }
    .splash-btn span { position: relative; z-index: 1; }
    .splash-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 0 100px rgba(212,168,83,0.25); }
    .splash-footer { margin-top: 3.5rem; color: var(--text-dim); font-size: 0.7rem; letter-spacing: 0.2em; opacity: 0.35; font-family: var(--font-deco); position: relative; z-index: 1; }
    .splash-load-btn { background: transparent; color: var(--text-dim); border: 1px solid rgba(212,168,83,0.12); padding: 0.5rem 1.8rem; font-size: 0.8rem; border-radius: 50px; cursor: pointer; transition: var(--transition); font-family: var(--font-body); letter-spacing: 0.08em; position: relative; z-index: 1; margin-top: 0.8rem; }
    .splash-load-btn:hover { border-color: var(--gold-dark); color: var(--text-gold); background: rgba(212,168,83,0.04); }
    .splash-badge { position: relative; z-index: 1; margin-top: 0.6rem; display: inline-block; padding: 0.2rem 1.2rem; border: 1px solid rgba(212,168,83,0.06); border-radius: 50px; font-size: 0.6rem; color: var(--gold-dark); letter-spacing: 0.25em; font-family: var(--font-deco); background: rgba(212,168,83,0.02); }
    #creation-screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 20; background: radial-gradient(ellipse at center, #12091e 0%, #08050e 80%); transition: opacity 0.6s ease, transform 0.6s ease; overflow-y: auto; padding: 2rem; }
    #creation-screen.hidden { opacity: 0; transform: translateY(30px) scale(0.98); pointer-events: none; }
    .creation-container { max-width: 960px; width: 100%; background: linear-gradient(135deg, rgba(30,21,48,0.95), rgba(20,12,36,0.98)); border: 1px solid var(--border-gold); border-radius: var(--radius); padding: 2.8rem 3rem; box-shadow: 0 30px 120px rgba(0,0,0,0.6), inset 0 1px 0 rgba(212,168,83,0.05); backdrop-filter: blur(20px); position: relative; }
    .creation-container::before { content: ''; position: absolute; top: -1px; left: 20%; right: 20%; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent); }
    .creation-title { font-family: var(--font-title); font-style: italic; font-size: 2rem; color: var(--gold-light); text-align: center; margin-bottom: 0.2em; letter-spacing: 0.05em; }
    .creation-sub { text-align: center; color: var(--text-dim); font-size: 0.9rem; margin-bottom: 1.5em; font-family: var(--font-deco); font-style: italic; letter-spacing: 0.1em; }
    .ornate-divider { border: none; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dark), var(--gold), var(--gold-light), var(--gold), var(--gold-dark), transparent); margin: 1.2rem 0; position: relative; }
    .ornate-divider::after { content: '✦'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--gold); font-size: 0.7rem; background: var(--bg-card); padding: 0 1rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem 2.5rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label { font-size: 0.8rem; color: var(--text-gold); letter-spacing: 0.08em; font-weight: 400; font-family: var(--font-deco); }
    .form-group input, .form-group select, .form-group textarea { background: rgba(255,255,255,0.04); border: 1px solid rgba(212,168,83,0.15); border-radius: var(--radius-sm); padding: 0.75rem 1.2rem; color: var(--text); font-size: 0.95rem; font-family: var(--font-body); transition: var(--transition); outline: none; width: 100%; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--gold); box-shadow: 0 0 30px rgba(212,168,83,0.08), inset 0 0 20px rgba(212,168,83,0.02); }
    .form-group input[type="range"] { padding: 0.3rem 0; background: transparent; border: none; accent-color: var(--gold); cursor: pointer; }
    .form-group select option { background: #1a1224; color: var(--text); }
    .range-display { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-dim); }
    .range-display span:last-child { color: var(--gold); }
    .role-selector { display: flex; gap: 1rem; justify-content: center; margin: 0.5rem 0; }
    .role-option { display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 1.8rem; border-radius: 50px; cursor: pointer; transition: var(--transition); border: 1px solid var(--border); font-family: var(--font-body); font-size: 0.9rem; }
    .role-option input { display: none; }
    .role-option.landlord { background: rgba(212,168,83,0.06); border-color: rgba(212,168,83,0.2); color: var(--text-dim); }
    .role-option.landlord.active { background: linear-gradient(135deg, rgba(212,168,83,0.15), rgba(212,168,83,0.05)); border-color: var(--gold); color: var(--gold); box-shadow: 0 0 30px rgba(212,168,83,0.1); }
    .role-option.tenant { background: rgba(204,34,85,0.06); border-color: rgba(204,34,85,0.2); color: var(--text-dim); }
    .role-option.tenant.active { background: linear-gradient(135deg, rgba(204,34,85,0.15), rgba(204,34,85,0.05)); border-color: var(--rose); color: var(--rose); box-shadow: 0 0 30px rgba(204,34,85,0.1); }
    .form-actions { display: flex; gap: 1rem; justify-content: center; margin-top: 2rem; flex-wrap: wrap; }
    .btn-primary { background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold) 60%, var(--gold-light) 100%); color: #0a0610; border: none; padding: 0.85rem 3rem; font-size: 1rem; font-weight: 700; border-radius: 50px; cursor: pointer; transition: var(--transition); font-family: var(--font-body); letter-spacing: 0.08em; box-shadow: 0 0 30px rgba(212,168,83,0.1); }
    .btn-primary:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 0 50px rgba(212,168,83,0.2); }
    .btn-secondary { background: transparent; color: var(--text-gold); border: 1px solid rgba(212,168,83,0.25); padding: 0.85rem 2.5rem; font-size: 0.95rem; font-weight: 400; border-radius: 50px; cursor: pointer; transition: var(--transition); font-family: var(--font-body); }
    .btn-secondary:hover { border-color: var(--gold); color: var(--gold-light); background: rgba(212,168,83,0.05); }
    .btn-danger { background: linear-gradient(135deg, #4a0a1a 0%, var(--rose) 100%); color: #fff; border: none; padding: 0.85rem 2.5rem; font-size: 0.95rem; font-weight: 700; border-radius: 50px; cursor: pointer; transition: var(--transition); font-family: var(--font-body); box-shadow: 0 0 20px rgba(204,34,85,0.15); }
    .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(204,34,85,0.25); }
    .btn-sm { padding: 0.3rem 1rem !important; font-size: 0.78rem !important; }
    .btn-xs { padding: 0.2rem 0.7rem !important; font-size: 0.7rem !important; }
    #game-screen { position: absolute; inset: 0; display: grid; grid-template-rows: auto auto 1fr; z-index: 5; background: radial-gradient(ellipse at 50% 0%, #12091e 0%, #08050e 100%); opacity: 0; transition: opacity 0.7s ease; pointer-events: none; }
    #game-screen.active { opacity: 1; pointer-events: auto; }
    .game-header { display: flex; align-items: center; justify-content: space-between; padding: 0.7rem 2.5rem; background: linear-gradient(180deg, rgba(20,10,35,0.98), rgba(12,6,22,0.95)); border-bottom: 1px solid rgba(212,168,83,0.1); backdrop-filter: blur(20px); z-index: 10; flex-wrap: wrap; gap: 0.5rem; position: relative; }
    .game-header::after { content: ''; position: absolute; bottom: 0; left: 10%; right: 10%; height: 1px; background: linear-gradient(90deg, transparent, rgba(212,168,83,0.3), transparent); }
    .game-logo { font-family: var(--font-title); font-style: italic; color: var(--gold-light); font-size: 1.3rem; letter-spacing: 0.05em; text-shadow: 0 0 30px rgba(212,168,83,0.1); }
    .game-player-info { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
    .player-badge { display: flex; align-items: center; gap: 0.6rem; padding: 0.3rem 1.2rem; background: rgba(255,255,255,0.03); border: 1px solid rgba(212,168,83,0.1); border-radius: 50px; font-size: 0.8rem; }
    .player-badge .tag { padding: 0.15rem 0.7rem; border-radius: 20px; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; }
    .tag-landlord { background: linear-gradient(135deg, var(--gold-dark), var(--gold)); color: #0a0610; }
    .tag-tenant { background: linear-gradient(135deg, var(--rose-deep), var(--rose)); color: #fff; }
    .stat-item { display: flex; align-items: center; gap: 0.3rem; font-size: 0.8rem; color: var(--text-dim); font-family: var(--font-deco); }
    .stat-item .val { color: var(--gold); font-weight: 700; }
    .stat-item .val.rose { color: var(--rose); }
    .game-nav { display: flex; gap: 0.3rem; padding: 0.4rem 2.5rem; background: rgba(12,6,22,0.6); border-bottom: 1px solid rgba(212,168,83,0.05); overflow-x: auto; position: relative; }
    .nav-btn { background: transparent; border: none; color: var(--text-dim); padding: 0.5rem 1.4rem; font-size: 0.82rem; cursor: pointer; border-radius: 50px; transition: var(--transition); font-family: var(--font-body); white-space: nowrap; }
    .nav-btn:hover { color: var(--text); background: rgba(255,255,255,0.03); }
    .nav-btn.active { color: var(--gold); background: rgba(212,168,83,0.08); box-shadow: inset 0 -2px 0 var(--gold); }
    .game-content { overflow-y: auto; padding: 1.8rem 2.5rem; position: relative; }
    .card { background: linear-gradient(135deg, rgba(30,21,48,0.9), rgba(20,12,36,0.95)); border: 1px solid rgba(212,168,83,0.08); border-radius: var(--radius); padding: 1.8rem; margin-bottom: 1.2rem; transition: var(--transition); position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(212,168,83,0.2), transparent); }
    .card:hover { border-color: rgba(212,168,83,0.2); box-shadow: 0 8px 40px rgba(0,0,0,0.3); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
    .card-title { font-family: var(--font-title); font-style: italic; font-size: 1.15rem; color: var(--gold-light); font-weight: 700; }
    .card-subtitle { font-size: 0.8rem; color: var(--text-dim); font-family: var(--font-deco); font-style: italic; }
    .card-body { line-height: 1.7; font-size: 0.92rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.2rem; }
    .grid-auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 1.2rem; }
    .grid-auto-sm { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1rem; }
    .character-card { background: linear-gradient(135deg, rgba(30,21,48,0.8), rgba(22,14,38,0.9)); border: 1px solid rgba(212,168,83,0.08); border-radius: var(--radius-sm); padding: 1.3rem; transition: var(--transition); cursor: pointer; position: relative; }
    .character-card::after { content: ''; position: absolute; bottom: 0; left: 10%; right: 10%; height: 1px; background: linear-gradient(90deg, transparent, rgba(212,168,83,0.15), transparent); opacity: 0; transition: opacity 0.4s ease; }
    .character-card:hover { border-color: rgba(212,168,83,0.3); transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 30px rgba(212,168,83,0.05); }
    .character-card:hover::after { opacity: 1; }
    .char-name { font-family: var(--font-title); font-size: 1.05rem; font-weight: 700; color: var(--gold-light); }
    .char-tags { display: flex; gap: 0.3rem; flex-wrap: wrap; margin: 0.4rem 0; }
    .char-tag { padding: 0.1rem 0.6rem; border-radius: 20px; font-size: 0.68rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.05); color: var(--text-dim); }
    .char-stat { font-size: 0.78rem; color: var(--text-dim); display: flex; justify-content: space-between; padding: 0.25rem 0; border-bottom: 1px solid rgba(255,255,255,0.02); }
    .char-stat .label { color: var(--text-dim); }
    .char-stat .value { color: var(--text); }
    .stat-bar { height: 3px; background: rgba(255,255,255,0.05); border-radius: 2px; margin-top: 0.4rem; overflow: hidden; }
    .stat-bar .fill { height: 100%; border-radius: 2px; transition: width 0.8s ease; }
    .fill-gold { background: linear-gradient(90deg, var(--gold-dark), var(--gold-light)); }
    .fill-rose { background: linear-gradient(90deg, var(--rose-deep), var(--rose)); }
    .fill-emerald { background: linear-gradient(90deg, #1a5533, #33cc66); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(12px); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; padding: 2rem; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal { background: linear-gradient(135deg, rgba(30,21,48,0.98), rgba(18,10,30,0.99)); border: 1px solid rgba(212,168,83,0.15); border-radius: var(--radius); padding: 2.5rem; max-width: 650px; width: 100%; max-height: 85vh; overflow-y: auto; transform: scale(0.92) translateY(20px); transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1); box-shadow: 0 40px 160px rgba(0,0,0,0.6); position: relative; }
    .modal::before { content: ''; position: absolute; top: -1px; left: 15%; right: 15%; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent); }
    .modal-overlay.active .modal { transform: scale(1) translateY(0); }
    .modal-title { font-family: var(--font-title); font-style: italic; font-size: 1.4rem; color: var(--gold-light); margin-bottom: 1rem; text-align: center; }
    .modal-actions { display: flex; gap: 0.8rem; justify-content: center; margin-top: 1.8rem; flex-wrap: wrap; }
    .log-area { background: rgba(0,0,0,0.35); border: 1px solid rgba(212,168,83,0.06); border-radius: var(--radius-sm); padding: 1.2rem; max-height: 400px; overflow-y: auto; }

    .log-entry .time { color: var(--gold-dark); margin-right: 0.5rem; font-size: 0.72rem; }
    .log-entry.highlight { color: var(--gold); }
    .save-slot { background: rgba(255,255,255,0.03); border: 1px solid rgba(212,168,83,0.1); border-radius: var(--radius-sm); padding: 1rem; cursor: pointer; transition: var(--transition); }

    .save-slot .slot-title { font-family: var(--font-title); color: var(--gold); font-size: 0.9rem; }
    .save-slot .slot-info { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.3rem; }
    .text-center { text-align: center; }
    .text-gold { color: var(--gold-light); }
    .text-rose { color: var(--rose); }
    .text-dim { color: var(--text-dim); }
    .mt-1 { margin-top: 0.5rem; }
    .mt-2 { margin-top: 1rem; }
    .mb-1 { margin-bottom: 0.5rem; }

    fab.addEventListener('click', function() {
        menuOpen = !menuOpen;
        this.classList.toggle('active', menuOpen);
        menu.classList.toggle('open', menuOpen);
    });

    document.querySelectorAll('.mod-tab').forEach(tab => {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.mod-tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            const target = this.dataset.tab;
            document.querySelectorAll('.mod-tab-content').forEach(c => c.classList.remove('active'));
            const contentMap = {
                'values': 'mod-values',
                'speed': 'mod-speed',
                'unlock': 'mod-unlock',
                'log': 'mod-log'
            };
            document.getElementById(contentMap[target]).classList.add('active');
        });
    });

    document.addEventListener('click', function(e) {
        if (menuOpen && !menu.contains(e.target) && e.target !== fab) {
            menuOpen = false;
            fab.classList.remove('active');
            menu.classList.remove('open');
        }
    });

    addModLog('⚡ 极乐租房 Mod面板已加载！');
})();
</script>
</body>
</html>
