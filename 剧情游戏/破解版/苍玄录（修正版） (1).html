        refineInvite("dual-senior-second",{title:"剑心相照",text:"沈惊澜约你到废弃剑坪，先将阵法的出入口、止息手诀和传讯符逐一交到你手中。确认四周没有窥探的阵眼后，他才问：若你仍愿意，能否再与他合修一次？这一次不为破境，只想让彼此的剑意学会在靠近时不伤人。",choices:[["在清醒中答应","你先说出自己的界限，他逐一应下，又把最后一道阵诀留给你亲手落定。随后你们隔着一臂的距离运转心法，待灵息自然相合才缓缓靠近。剑意在夜色里交织，像两盏并行却不互相吞没的灯；你看见他守着旧灯等人归来的记忆，也让他看见你仍想走向山外的决心。",{cult:4,mood:3,insight:3,aff:{senior:5},bond:{senior:3}},"收功后，沈惊澜先松开手，认真向你道谢：被允许靠近，从来不是理所当然。"],["改为并肩坐修","他立刻收起阵诀，与你一同面对山风调息。没有人要求你解释，也没有人替你给出答案。",{cult:2,mood:2,aff:{senior:3},bond:{senior:2}},"他说并肩也很好，只要这是你选择的距离。"]]});
        refineInvite("dual-sister-second",{title:"同息安神",text:"药庐的雨棚被风吹得轻响。青黛提前把安神阵的阵眼、停止的手诀和出口位置全告诉你，还将一盏没有加药的清茶放在阵外。她说若你愿意，今晚的合修可以只停在最初的灵息相触；任何时候想离开，她都会先替你开门。",choices:[["按自己的节奏合修","你们面对面坐下，先以一句句确认代替猜测。灵息相触时，药香、炉火与呼吸都被阵法放得很轻；每一次灵力流转前，青黛都会等你点头。你从她的记忆里看见漫长的守夜，也让她看见自己不愿被任何温柔替代的那部分。",{cult:4,mood:4,insight:2,aff:{sister:5},bond:{sister:3}},"青黛等你收功后才靠近，笑着问你想喝茶、想说话，还是想一个人静一会儿。"],["只借阵法静坐","她撤去多余的阵纹，将距离留得恰到好处。你们各自调息，偶尔听见彼此翻过书页的声音。",{mood:3,cult:1,aff:{sister:3},bond:{sister:2}},"她说修行可以很亲近，也可以只是一起把夜熬过去。"]]});
        refineInvite("dual-ajiu-second",{title:"雾息相依",text:"阿九带你到雾线之外的小台地，先把退路、传讯符和一盏会指向山门的灯放到你手边。他说共修会让人看见彼此最不愿承认的恐惧，所以只有在你确信想要时才开始；你若摇头，他会立刻送你回去。",choices:[["亲口确认愿意","你说出愿意，也说出不愿被触碰的部分。他认真记下，才与你并肩入定。灵息在雾里相互照见，却不相互侵占；你看见他一次次折返石门前的犹豫，也让他看见你仍想离开的决心。雾散开时，传讯符始终在你掌心，提醒你退路从未被收走。",{cult:4,mood:3,insight:4,aff:{ajiu:5},bond:{ajiu:3}},"阿九收功后没有替你收起传讯符，只低声说：无论雾里还是雾外，你都可以随时叫我。"],["把今晚留给交谈","他没有失落，只点亮了那盏小灯。你们隔着恰当的距离坐到天色发白，把不安一件件说出来。",{mood:3,insight:2,aff:{ajiu:3},bond:{ajiu:2}},"阿九说，能把害怕说出口，也是一种并肩。"]]});

        CH3.actionText.investigate.push("你将灯芯压低，沿静修院外墙的缝隙一点点搜寻。墙根埋着许多被雨水泡软的纸条，上面都是相似的字：我已经想明白了。可每一张纸背后，都留着不同的指纹。", "夜巡的铃声从远处经过。你躲在廊柱后，听见两名弟子低声谈论某位‘终于安静下来’的同门；等他们走远，你才发现自己袖口不知何时被人别上一枚静修院的白色药签。");
        CH3.actionText.archive.push("旧档库的分类比你想象得更细：入门、修习、外放、离山、归静。最后一格没有锁，却没有人愿意提起。你翻到最深处，看见许多笔迹不同的名字在同一天被划成了同一种结论。", "你把两卷看似无关的玉简并排放下：一卷记着离山日期，一卷记着药材领用。日期竟在同一夜重叠。守档弟子端茶回来时，你已经把玉简合上，只记住了那股熟悉的安神香。 ");
        CH3.actionText.tune.push("阵盘的边缘有一圈细到几乎看不见的刻度。你将几次失踪记录对应上去，发现它们都落在同一段回环里。阵师说这只是巧合，可他的手比你先一步盖住了那圈刻度。", "你故意错开一条阵线，想看看它会将灵力送往哪里。阵盘先是沉默，随后缓慢把那点偏差导回弟子居下方；像这座山从不允许任何东西真正偏离。 ");
        CH3.actionText.mask.push("阿九教你的遮掩符在今夜格外安静。你穿过回廊时，所有门牌都被白纸贴住，只有一间门缝里透出光。门内有人反复念着自己的名字，念到最后，声音却变成了陌生的经文。", "你将脚步藏进雨声里，经过静修院侧门。门锁上没有灰，门内却没有人守着；仿佛最可靠的看守并不在门外，而在每个被劝着不要离开的人心里。 ");

          winterExam:["冬试正殿很暖，暖得让人想放弃所有问题。你答完最后一题时，主考长老微笑着说你终于学会了正确的表达。","名册上的朱印在你靠近时微微发亮。你没有问它代表什么，只把那一点光记进心里。","考核结束后，所有人都鼓掌。你却在掌声停下后，仍听见有人在角落里继续拍手。"],
          listenCourt:["议事席上提到静修院时，所有人都改用了‘安置’这个词。没有人说那里究竟安置了谁。","一名长老说冬天最适合让心浮气躁的人静下来。清玄真人没有反驳，只将茶盏轻轻放回桌上。","他们讨论是否该增加门后巡查。你的名字没有被提起，可每个人都朝你坐着的方向看过一眼。"],
          searchArchive:["地下层的玉简凉得刺手。你找到一卷山下回信，信里说孩子从未回家，宗门却早已盖上‘已归’的印。","旧档库深处有一格专门存放被改写的姓名。每个名字旁都留着一句相同批注：‘已得妥善照料。’","你翻到一张冬试名次表，第一名的名字被整齐裁走，只剩下一滴干涸的墨。"],
          copyOath:["誓词写到最后一句：‘我愿以宗门之安为安。’你停笔时，纸上却多出另一行极淡的字：‘谁允许你替我愿意？’","你誊抄得越工整，心里越不安。像这份誓词不是在被写下，而是在慢慢写进你。","负责收卷的弟子夸你字迹稳。他没有注意到，你在最后一笔故意留了一点断痕。"],
          watchWard:["静室的灯每隔七次呼吸同时暗一下。第八次时，最里面那盏灯会亮得比别处更久。","阵栏后有人隔着雾看你。那张脸很模糊，只有唇形清楚地说：‘别睡。’","一名执事来添灯油，见你在旁便笑说别担心，里面的人都被照顾得很好。"],
          makeAnchor:["你把自己的名字写在纸上，又写下第一次想离开山门的理由。纸边被霜气卷起，却没有褪字。","你握住一件旧物，强迫自己回忆它来自谁、在哪一天、为什么交到你手中。记忆越具体，静室方向的钟声越远。","锚点落定的一刻，雾里有个声音喊错了你的名字。你没有回头。"],
          followTrack:["雪地脚印分成两行：一行向外，一行向内。你踩进向外的那一行，却发现自己的鞋底先一步留下了印子。","旧山道尽头立着一块新碑：‘出山者，皆已归。’碑后有风，风里带着山下炊烟。","你在雪里找到一只冻硬的纸鹤，展开后只写着一句：‘门只开一次。’"],
          breakLoop:["阵线被扰乱时，雾短暂裂开。你看见山门外的灯火，也看见一只无形的手正把它们推远。","回环阵发出低鸣，像有人在很远处咳嗽。你趁着间隙把一张旧路线图塞进雪下。","石门后的路终于没有立刻折回。可你知道这意味着宗门也会立刻知道，有人动过这里。"]
         },
         explore:{
          hall:[["朱印的另一面","冬试名册上的朱印背面压着一个静修编号。",[["拓下编号","编号与药庐旧册能对应上。",{item:"note",insight:3}],["擦去痕迹","朱印恢复原样，像什么也没发生。",{attention:-1}]]]],
          archive:[["未寄出的冬信","一封山下家书反复写着：‘若他已归，为何不肯见我？’",[["藏进锚点册","信纸上的泪痕仍未干。",{item:"note",insight:3}],["放回柜中","柜门合上时，里面传出极轻的敲击。",{fracture:1}]]]],
          ward:[["长明灯下的玉册","一盏灯下压着与你相同的玉册封皮，第一页写着另一个人的名字。",[["记录名字","你记住了那名弟子的入门年份。",{item:"note",insight:3}],["不再细看","阵栏里的呼吸声忽然与你同步。",{fracture:1}]]]],
          gate:[["雪中的路线图","雪下埋着一张旧路线图，出口被红线圈住，又被人用金墨改回山门。",[["取走路线图","你发现红线与金墨不是同一个人留下的。",{item:"note",insight:3,attention:1}],["照原样埋回","风很快抹平你留下的痕迹。",{attention:-1,insight:1}]]]]
         },
         npcs:{
          master:["清玄真人说冬日路滑，询问你是否愿意把夜间出行记录交由他保管。","师尊将一盏暖灯放到你窗前，说你若睡不着，可以去静室坐坐。","他问你是否仍相信山外比山中自由，语气像在问一件很普通的事。"],
          senior:["沈惊澜说剑冢的雪今年埋得太深，许多旧剑都露不出头。他问你要不要一起去清理。","他将一枚断剑扣交给你，说若门后真的有路，这东西会比承诺可靠。","沈惊澜提醒你冬试正殿的人最擅长听见没说出口的话。"],
          sister:["青黛说冬棚里有药能帮助人保持清醒，但药性很苦，也会让梦变得更真。","她问你有没有固定好记忆锚点，随后又像怕你误会般说只是随口一问。","青黛递来一张静修院值守表，说其中几天的名字被人涂掉了。"],
          ajiu:["阿九说雪会盖住脚印，也会留下不该留下的方向。他让你别只看地上。","他把一片冻硬的枯叶夹进你掌心，说石门出现时它会先化开。","阿九问你若真的能出去，会不会把这里发生的事告诉山下的人。"]
         },
         days:{3:["冬雪封山","第一场大雪落下，山门以防滑为由封闭外出路线。","查看告示"],8:["冬试名单","新的冬试名单贴出，数名弟子的名字被临时替换。","前往正殿"],14:["静室添灯","静修院一夜添了许多长明灯，执事说只是冬日天短。","观察灯火"],21:["山下回信","旧档库收到一批退回家书，所有地址都被标记为无人可达。","进入地下层"],28:["石门开缝","后山石门在雪夜出现裂缝，阿九说这次不该错过。","前往后山"],35:["重置前夜","护山阵将在今夜重置。有人说重置后，许多旧记录都会自然消失。","整理锚点"]}
        };
        
        /* chapter4-expanded.js */
        
        CH4.actionText.winterExam.push("主考长老让你重新解释‘归属’。你说归属不该是被决定的，席间安静了一瞬，随后他温和地请你换一种更成熟的说法。", "考卷背面有一道极浅的划痕，像有人在你落笔前写过答案。你用指腹擦过，划痕仍在，只有内容消失了。");
        CH4.actionText.listenCourt.push("议事散场后，桌上留下四只没喝完的茶盏。你发现其中一只杯底压着静修院的钥匙印，印记很快被热气蒸散。", "他们谈论山下人寄来的信，语气平静得像在讨论雪后粮价。直到有人提起‘孩子’，清玄真人才抬眼望向窗外。");
        CH4.actionText.searchArchive.push("你在最底层找到一册冬季失踪登记。每个名字后都写着‘已归’，可归处一栏全是空白。", "一封家书里夹着孩子幼年画的山。画上苍玄宗没有山门，只有一扇巨大的、永远关不严的门。");
        CH4.actionText.copyOath.push("誓词旁注说：‘若有疑虑，应先静心，再求师命。’你将旁注也抄下，却在最后一个字上故意写错了一笔。", "墨迹在纸上晕开，像誓词正从里面向外渗。你把纸折起时，听见远处有人用相同语速念完了最后一句。");
        CH4.actionText.watchWard.push("最里面那盏长明灯忽然熄灭，数息后又亮起。阵栏后的影子比之前少了一个，执事说只是你看错。", "你观察到每次执事添灯油，都会有人从静室里被带走。没人哭喊，只有鞋底在石地上留下很短的一道拖痕。");
        CH4.actionText.makeAnchor.push("你把自己第一次看到空席时的感受写下：不是难过，而是不愿承认那张席位从来不是空的。", "你把某位同门说过的话反复默念，直到那句话不再像别人塞进你记忆里的东西。锚点微微发热，像在回应。");
        CH4.actionText.followTrack.push("雪地尽头有一串赤足脚印，脚印只走到石门前便消失。雾里传来有人轻轻说：已经很近了。", "你绕开最明显的脚印，反而在枯树下找到一枚被冻住的传讯符。它最后一次发送的对象，是你自己。");
        CH4.actionText.breakLoop.push("阵法被扰乱的瞬间，所有长明灯同时闪了一下。你看见静修院的屋顶上站着一排影子，正朝山门外看。", "你将灵力压进阵线缺口，雪地上终于出现一条不折返的路。它只存在了七次呼吸，随后又被新雪填平。");
        
        CH4.places.sworddeep=["剑冢深层","冢","积雪覆盖着无名剑碑，深处的剑意却仍像许多人没有说完的遗言。"];
        CH4.places.outside=["山门外·雪市","市","短暂开放的雪市有炊烟、灯火与山下人不愿多谈的旧事。这里的风不像宗门里那样会替你回答。"];
        Object.assign(CH4.actions,{readEpitaph:["辨认剑碑遗言","sworddeep",1,-2,"你以剑意触碰无名剑碑，试着让被磨去的遗言重新显形。"],quietDuel:["与旧剑意过招","sworddeep",1,-3,"你在无人剑冢中与残留剑意拆招，分不清对手是在阻拦还是指路。"],askFamily:["询问失名家属","outside",0,-2,"你借雪市杂乱的人声询问那些从未等到家人归来的家庭。"],buyInk:["购置山下墨料","outside",0,-1,"你用不会褪色的山下墨料补写自己的记录，避免它被轻易改动。"]});
        CH4.actionText.readEpitaph=["剑碑上的霜在你触碰后融化，露出一句断裂遗言：‘若我忘了，请替我记得我曾想回家。’", "你辨出一块碑文里的旧名字。它不在任何失踪档中，却出现在静修院值守表最早的一页。", "无名剑碑忽然发出轻响，像有人终于听见你把他的名字念对。"];
        CH4.actionText.quietDuel=["残剑意没有攻击你，只一次次逼你退回原地。你忽然明白它在演示自己当年如何被阵线逼回山门。", "剑光掠过雪面时，你看见自己的影子多出一把剑。等收势后，那把剑仍插在不远处。", "你与旧剑意最后一次交锋，剑鸣并不愤怒，反而像有人在急着催你快走。"];
        CH4.actionText.askFamily=["一位老妇人从箱底翻出旧弟子牌，说孩子每年都会托人寄信，信里却从不写自己在哪里。", "雪市酒肆的掌柜听见苍玄宗三个字，先是笑着夸宗门仁善，随后才压低声音问你：里面的人真的还能回来吗？", "有人把一封没寄出的信塞给你。信封上写着一个与你证据册里相同的名字，背面却盖着‘查无此人’。"];
        CH4.actionText.buyInk=["山下墨料带着松烟味，写下的字比宗门墨更难洗掉。你在掌心写下名字，直到雪水也冲不散。", "摊主告诉你这种墨过去常被人用来写遗书。你没有解释，只买下最黑的一锭。", "你将新墨滴在旧档边缘，原本被裁去的字迹竟短暂浮现，像不愿彻底离开。"];
        CH4.explore.sworddeep=[["剑碑背面的刻痕","一块剑碑背后密密刻着许多小字，全是同一个问题：‘我还能回去吗？’",[["拓下刻痕","最末一行写着石门开启的日期。",{item:"note",insight:3}],["用雪盖住","雪落下时，刻痕像从未存在。",{fracture:1}]]]];
        CH4.explore.outside=[["雪市祭牌","雪市角落挂着一排没有名字的祭牌。祭牌背面刻着苍玄宗的云纹。",[["询问祭牌来源","摊主说每年都有人来换新的，却没人敢写名字。",{item:"note",insight:3}],["替其中一块写名","墨迹刚落，远处山门钟便响了一声。",{attention:1,insight:2}]]]];
        CH4.npcs.master.push("清玄真人说雪市杂乱，不适合你久留。可他没有命人拦你，只让你回来后先去见他。", "师尊问你是否已经固定好足够多的锚点。你还没回答，他便说有些记忆留得太多，也会成为负担。");
        CH4.npcs.senior.push("沈惊澜说剑冢深层的门只认会喊旧名字的人。他提醒你，进去前先决定自己想带谁回来。", "他将一张磨损路线图塞进你袖中，说这次别再把地图交给任何人保管。");
        CH4.npcs.sister.push("青黛说山下墨料确实能抵抗部分阵法改写，但也会让人更清楚地记得痛。", "她问你若救出静修院的人，是否准备好面对他们未必愿意被救这一件事。");
        CH4.npcs.ajiu.push("阿九说雪市祭牌的背面都是山门编号。他不明白为什么山下人会替从未回来的人继续祭祀。", "他提醒你，石门不一定通向外面；有时最像出口的地方，只是更深的一层门。");
        Object.assign(CH4.days,{5:["剑碑除雪","剑冢深层传来剑鸣，宗门派人清理积雪，却不许弟子靠近。","前往剑冢"],11:["雪市开放","封山令短暂松动，弟子可下山补给。许多人说这是难得的自由。","前往雪市"],18:["静室失灯","静修院有三盏长明灯同时熄灭，执事说只是灯油受冻。","查看静室"],25:["冬誓重抄","内门候选被要求重新誊抄冬誓，任何删改都需报备。","返回旧档库"],32:["门外炊烟","石门裂缝里飘来山下炊烟味。那味道让你想起自己入山以前。","前往后山"],39:["雪夜留名","山下祭牌被风吹进山门，每一块背面都写着一个被抹去的名字。","整理锚点"]});
        CH4.nightEvents=[
         {title:"雪夜敲门",text:"子时后，有人轻轻敲你的门。敲击节奏与你固定锚点时的心跳完全一致。",choices:[["不开门，记录节奏","你将节奏记在纸上，发现它与静室灯火同步。",{item:"note",insight:3},"门外的敲击停了，却没有脚步离开。"],["隔门问是谁","外面的人用你的声音回答：‘是你。’",{fracture:1,insight:2},"你一夜没有再睡。"]]},
         {title:"被改过的日志",text:"你翻看今日记事，发现最后一行被换成了：‘我愿留在苍玄宗。’墨迹还没有干。",choices:[["用山下墨重写","你把原话划掉，重新写下自己的选择。",{insight:2},"新墨没有褪色。"],["保留这行字","你盯着它看了很久，竟开始怀疑是不是自己写的。",{mood:-1,fracture:2},"纸页在烛火下轻轻卷起。"]]},
         {title:"静室来客",text:"静修院外环有一盏灯提得很低。那人隔着阵栏递来一张纸，只写着一个名字。",choices:[["收下纸条","纸背写着一条通往地下层的短路。",{item:"note",insight:3},"那盏灯很快消失在长廊尽头。"],["追上去","阵栏内外同时传来脚步，你找不到哪一边才是真的。",{fracture:2},"最后只剩一盏灯仍亮着。"]]}
        ];

        const KEY="cangxuan-first-chapter";const fresh=()=>({screen:"title",ci:0,traits:[],player:{name:"",gender:"不设定",race:"人族",appearance:"清秀",temperament:"安静",root:"单灵根"},stats:{cult:2,energy:10,mood:8,insight:0},aff:{master:12,senior:8,sister:8,ajiu:4},obs:{master:0,senior:0,sister:0,ajiu:0},day:1,left:2,place:"dorm",log:[],bag:{token:1},seen:[],modal:null});let s=fresh();const app=document.querySelector("#app"),cap=(v,a,b)=>Math.max(a,Math.min(b,v)),clone=x=>JSON.parse(JSON.stringify(x));
        function addLog(t){s.log.unshift([s.day,t]);s.log=s.log.slice(0,18)}function save(){localStorage.setItem(KEY,JSON.stringify({...s,modal:null}));notice("已存入本地存档。")}function load(){let raw=localStorage.getItem(KEY);if(!raw)return;s={...fresh(),...JSON.parse(raw)};s.modal=["存档读取","欢迎回来",`第 ${s.day} 日的苍玄宗仍在等着 ${s.player.name||"你"}。`,`继续`];render()}function notice(t){s.modal=["苍玄宗", "提示",t,"知道了"];render()}function apply(e={}){if(e.item)s.bag[e.item]=(s.bag[e.item]||0)+1;if(e.mood)s.stats.mood=cap(s.stats.mood+e.mood,0,10);if(e.energy)s.stats.energy=cap(s.stats.energy+e.energy,0,10);if(e.cult)s.stats.cult+=e.cult;if(e.insight)s.stats.insight+=e.insight;for(let k in e.aff||{})s.aff[k]=cap(s.aff[k]+e.aff[k],0,100);for(let k in e.obs||{})s.obs[k]=(s.obs[k]||0)+e.obs[k]}
        function title(){let has=!!localStorage.getItem(KEY);return `<section class="panel title"><div><div class="seal">苍玄</div><h1>苍玄道</h1><p class="sub">第一章 · 春暖</p><div class="quote">“这是一个温暖的修仙世界。<br>每个人都对你很好。太好了。”</div><p class="muted">从一段平凡又温柔的童年开始。</p><p><button class="primary" data-a="start">开始新的故事</button> ${has?`<button class="secondary" data-a="load">读取存档</button>`:""}</p></div></section>`}

        const modalBeforeLayeredDeduction=modal;modal=function(){if(isChapter3()&&s.modal?.type==="deductionPrompt"){let caseFile=CH3.deductionCases.find(item=>item.id===s.modal.caseId);if(!caseFile)return modalBeforeLayeredDeduction();return `<div class="backdrop"><section class="panel modal modal-deduction-prompt"><div class="modal-top"><p class="eyebrow">证据推理 · ${caseFile.need.length} 份物证已印证</p><span class="modal-cost">一次错误会留下心神裂隙</span></div><h2>${caseFile.title}</h2><p class="prose">${caseFile.prompt||caseFile.desc}</p><div class="choices">${caseFile.answers.map((answer,index)=>`<button class="choice" data-a="deduce-answer" data-k="${caseFile.id}" data-i="${index}"><strong>${String.fromCharCode(65+index)}.</strong> ${answer}<small>选择你认为最能解释全部物证的结论。</small></button>`).join("")}</div><div class="right"><button class="secondary" data-a="close">暂不判断</button></div></section></div>`}if(isChapter3()&&s.modal?.type==="evidence3"){ensureState();let records=CH3.evidenceFiles.map(file=>{let found=s.ch3.evidenceLog.includes(file.id);return `<article class="evidence-file ${found?"found":"locked"}"><div><p>${found?file.source:"未确认来源"}</p><h3>${found?file.title:"未解锁物证"}</h3></div><small>${found?file.desc:"继续调查讲法台、剑冢、百草园、符阁、阵枢台与后山封径。"}</small></article>`}).join("");let deductions=CH3.deductionCases.map(item=>{let solved=s.ch3.deductions.includes(item.id),found=item.need.filter(key=>s.ch3.evidenceLog.includes(key)).length,blocked=s.ch3.deductionErrors[item.id]===s.ch3.day;return `<article class="deduction ${solved?"solved":""}"><div><p>${solved?"推理成立":blocked?"推理余波 · 明日可再审":`线索印证 ${found}/${item.need.length}`}</p><h3>${item.title}</h3><small>${solved?item.reward:found===item.need.length?"物证已齐。请判断哪一种解释能同时容纳所有矛盾。":"来自不同地点的记录才可能互相证明。"}</small></div><button class="secondary" data-a="deduce" data-k="${item.id}" ${solved||blocked?"disabled":""}>${solved?"已推理":blocked?"暂缓判断":"审阅物证"}</button></article>`}).join("");return `<div class="backdrop"><section class="panel modal modal-evidence <script>
// ============================================================
// 苍玄录 · Mod悬浮面板 (H5调试工具)
// ============================================================
(function() {
    'use strict';

    // --- 防检测 ---
    const origLog = console.log;
    console.log = function() {
        if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].includes('ModPanel')) return;
        origLog.apply(console, arguments);
    };

    // --- 样式 ---
    const style = document.createElement('style');
    style.textContent = `
        .mod-panel * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        .mod-fab { position: fixed; bottom: 24px; right: 24px; z-index: 999999; width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #1a1a2e, #16213e); color: #fff; border: 2px solid #e94560; box-shadow: 0 4px 20px rgba(233,69,96,0.4); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; user-select: none; }
        .mod-fab:hover { transform: scale(1.08); }
        .mod-fab.active { background: linear-gradient(135deg, #e94560, #c23152); }
        .mod-menu { position: fixed; bottom: 90px; right: 24px; z-index: 999998; width: 360px; max-height: 480px; background: rgba(22,33,62,0.92); backdrop-filter: blur(12px); border: 1px solid rgba(233,69,96,0.3); border-radius: 16px; padding: 16px 18px; box-shadow: 0 12px 48px rgba(0,0,0,0.6); color: #e0e0e0; font-size: 13px; overflow-y: auto; display: none; transition: opacity 0.25s ease; }
        .mod-menu.open { display: block; }
        .mod-menu::-webkit-scrollbar { width: 4px; }
        .mod-menu::-webkit-scrollbar-thumb { background: #e94560; border-radius: 8px; }
        .mod-menu h3 { margin: 0 0 12px 0; color: #e94560; font-size: 15px; border-bottom: 1px solid rgba(233,69,96,0.2); padding-bottom: 8px; }
        .mod-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .mod-row label { flex: 1; cursor: pointer; }
        .mod-row input[type="number"] { width: 70px; padding: 4px 6px; border-radius: 6px; border: 1px solid #2a3a5e; background: #0f1a2e; color: #fff; font-size: 12px; }
        .mod-row select { background: #0f1a2e; color: #fff; border: 1px solid #2a3a5e; border-radius: 4px; padding: 4px; }
        .mod-btn { padding: 4px 12px; border-radius: 6px; border: none; background: #e94560; color: #fff; font-size: 12px; cursor: pointer; transition: 0.2s; }
        .mod-btn:hover { background: #c23152; }
        .mod-btn.secondary { background: #2a3a5e; }
        .mod-btn.secondary:hover { background: #3a4a7e; }
        .mod-switch { position: relative; width: 40px; height: 22px; background: #2a3a5e; border-radius: 12px; cursor: pointer; transition: 0.3s; flex-shrink: 0; }
        .mod-switch.active { background: #e94560; }
        .mod-switch .knob { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: 0.3s; }
        .mod-switch.active .knob { left: 20px; }
        .mod-log { max-height: 120px; overflow-y: auto; font-size: 11px; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 6px 8px; margin-top: 8px; font-family: monospace; color: #8af; }
        .mod-log div { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .mod-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
        .mod-tab { padding: 4px 12px; border-radius: 20px; border: 1px solid #2a3a5e; background: transparent; color: #aaa; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .mod-tab.active { background: #e94560; color: #fff; border-color: #e94560; }
        .mod-tab-content { display: none; }
        .mod-tab-content.active { display: block; }
    `;
    document.head.appendChild(style);

    // --- 创建UI ---
    const fab = document.createElement('div');
    fab.className = 'mod-fab';
    fab.textContent = '⚡';
    document.body.appendChild(fab);

    const menu = document.createElement('div');
    menu.className = 'mod-menu';
    menu.innerHTML = `
        <h3>⚙️ 苍玄录 · Mod面板</h3>
        <div class="mod-tabs">
            <button class="mod-tab active" data-tab="values">数值</button>
            <button class="mod-tab" data-tab="speed">加速</button>
            <button class="mod-tab" data-tab="unlock">解锁</button>
            <button class="mod-tab" data-tab="log">日志</button>
        </div>
        <div id="mod-values" class="mod-tab-content active">
            <div class="mod-row"><label>修为 (cult)</label><input type="number" id="mod-cult" step="1"></div>
            <div class="mod-row"><label>灵力 (energy)</label><input type="number" id="mod-energy" step="1"></div>
            <div class="mod-row"><label>心境 (mood)</label><input type="number" id="mod-mood" step="1"></div>
            <div class="mod-row"><label>感悟 (insight)</label><input type="number" id="mod-insight" step="1"></div>
            <div class="mod-row">
                <label>目标角色</label>
                <select id="mod-aff-target">
                    <option value="master">清玄真人</option>
                    <option value="senior">沈惊澜</option>
                    <option value="sister">青黛</option>
                    <option value="ajiu">阿九</option>
                </select>
            </div>
            <div class="mod-row"><label>好感度</label><input type="number" id="mod-aff" step="1"></div>
            <div class="mod-row"><button class="mod-btn" id="mod-apply-values">应用数值</button></div>
            <div class="mod-row"><button class="mod-btn secondary" id="mod-get-values">读取当前数值</button></div>
        </div>
        <div id="mod-speed" class="mod-tab-content">
            <div class="mod-row"><label>速度倍率</label><input type="number" id="mod-speed-value" value="1.0" step="0.1" min="0.1" max="5.0"></div>
            <div class="mod-row"><label>启用加速</label><div class="mod-switch" id="mod-speed-toggle"><div class="knob"></div></div></div>
            <div class="mod-row"><button class="mod-btn" id="mod-apply-speed">应用速度</button></div>
        </div>
        <div id="mod-unlock" class="mod-tab-content">
            <div class="mod-row"><button class="mod-btn" id="mod-unlock-quests">一键完成所有课业</button></div>
            <div class="mod-row"><button class="mod-btn" id="mod-unlock-max">满级修为 + 满属性</button></div>
            <div class="mod-row"><button class="mod-btn secondary" id="mod-unlock-chapter2">直接进入第二章</button></div>
            <div class="mod-row"><button class="mod-btn secondary" id="mod-unlock-chapter3">直接进入第三章</button></div>
        </div>
        <div id="mod-log" class="mod-tab-content">
            <div class="mod-row"><label>拦截日志</label><div class="mod-switch active" id="mod-log-toggle"><div class="knob"></div></div></div>
            <div class="mod-log" id="mod-log-container"><div>📡 等待游戏活动...</div></div>
            <div class="mod-row"><button class="mod-btn secondary" id="mod-log-clear">清空日志</button></div>
        </div>
    `;
    document.body.appendChild(menu);

    // --- 变量 ---
    let speedActive = false;
    let originalRAF = window.requestAnimationFrame;
    let originalSIT = window.setInterval;
    let logActive = true;
    const logContainer = document.getElementById('mod-log-container');

    // --- 获取游戏状态 ---
    function getGameState() {
        if (typeof s !== 'undefined') return s;
        if (window.s) return window.s;
        return null;
    }

    // --- 日志 ---
    function addModLog(msg) {
        if (!logActive) return;
        const div = document.createElement('div');
        div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logContainer.prepend(div);
        if (logContainer.children.length > 50) {
            logContainer.removeChild(logContainer.lastChild);
        }
    }

    // --- 数值操作 ---
    document.getElementById('mod-get-values').addEventListener('click', function() {
        const state = getGameState();
        if (!state) { addModLog('⚠️ 未找到游戏状态'); return; }
        document.getElementById('mod-cult').value = state.stats?.cult || 0;
        document.getElementById('mod-energy').value = state.stats?.energy || 0;
        document.getElementById('mod-mood').value = state.stats?.mood || 0;
        document.getElementById('mod-insight').value = state.stats?.insight || 0;
        addModLog('📊 已读取当前数值');
    });

    document.getElementById('mod-apply-values').addEventListener('click', function() {
        const state = getGameState();
        if (!state) { addModLog('⚠️ 未找到游戏状态'); return; }
        if (!state.stats) state.stats = {};
        const cult = parseInt(document.getElementById('mod-cult').value);
        const energy = parseInt(document.getElementById('mod-energy').value);
        const mood = parseInt(document.getElementById('mod-mood').value);
        const insight = parseInt(document.getElementById('mod-insight').value);
        const affTarget = document.getElementById('mod-aff-target').value;
        const aff = parseInt(document.getElementById('mod-aff').value);

        if (!isNaN(cult)) state.stats.cult = cult;
        if (!isNaN(energy)) state.stats.energy = Math.min(energy, state.stats.maxEnergy || 10);
        if (!isNaN(mood)) state.stats.mood = Math.min(mood, 10);
        if (!isNaN(insight)) state.stats.insight = insight;
        if (!isNaN(aff) && state.aff) state.aff[affTarget] = aff;

        addModLog(`✅ 数值已更新: cult=${state.stats.cult}, energy=${state.stats.energy}, mood=${state.stats.mood}, insight=${state.stats.insight}`);
        if (typeof render === 'function') render();
    });

    // --- 加速齿轮 ---
    function applySpeed(rate) {
        if (speedActive && rate !== 1.0) {
            window.requestAnimationFrame = function(callback) {
                const start = performance.now();
                return originalRAF.call(window, function(timestamp) {
                    const elapsed = (timestamp - start) * rate;
                    callback(start + elapsed);
                });
            };
            window.setInterval = function(callback, delay, ...args) {
                const newDelay = delay / rate;
                return originalSIT.call(window, callback, newDelay, ...args);
            };
            addModLog(`🚀 加速已启用: ${rate}x`);
        } else {
            window.requestAnimationFrame = originalRAF;
            window.setInterval = originalSIT;
            addModLog('⏸️ 加速已禁用');
        }
    }

    document.getElementById('mod-speed-toggle').addEventListener('click', function() {
        this.classList.toggle('active');
        speedActive = this.classList.contains('active');
        const rate = parseFloat(document.getElementById('mod-speed-value').value) || 1.0;
        applySpeed(rate);
    });

    document.getElementById('mod-apply-speed').addEventListener('click', function() {
        const rate = parseFloat(document.getElementById('mod-speed-value').value) || 1.0;
        if (speedActive) applySpeed(rate);
        else addModLog(`⚙️ 速度已设置为 ${rate}x (未激活)`);
    });

    // --- 解锁功能 ---
    document.getElementById('mod-unlock-quests').addEventListener('click', function() {
        const state = getGameState();
        if (!state) { addModLog('⚠️ 未找到游戏状态'); return; }
        if (state.quests) {
            for (const key in state.quests) {
                if (typeof state.quests[key] === 'number' && key !== 'done') {
                    const target = window.DATA?.quests?.[key]?.target || 3;
                    state.quests[key] = target;
                }
            }
            if (state.quests.done) {
                for (const key in window.DATA?.quests || {}) {
                    state.quests.done[key] = true;
                }
            }
        }
        if (state.ch2?.quests) {
            for (const key in state.ch2.quests) {
                if (typeof state.ch2.quests[key] === 'number' && key !== 'done') {
                    const target = window.CH2?.quests?.[key]?.target || 3;
                    state.ch2.quests[key] = target;
                }
            }
            if (state.ch2.quests.done) {
                for (const key in window.CH2?.quests || {}) {
                    state.ch2.quests.done[key] = true;
                }
            }
        }
        addModLog('🎓 所有课业已完成！');
        if (typeof render === 'function') render();
    });

    document.getElementById('mod-unlock-max').addEventListener('click', function() {
        const state = getGameState();
        if (!state) { addModLog('⚠️ 未找到游戏状态'); return; }
        if (!state.stats) state.stats = {};
        state.stats.cult = 100;
        state.stats.energy = 20;
        state.stats.mood = 10;
        state.stats.insight = 30;
        state.realm = 9;
        if (state.skills) {
            for (const key in state.skills) state.skills[key] = 20;
        }
        addModLog('💪 已设置为满级满属性！');
        if (typeof render === 'function') render();
    });

    document.getElementById('mod-unlock-chapter2').addEventListener('click', function() {
        if (typeof enterChapter2 === 'function') {
            enterChapter2();
            addModLog('📖 进入第二章');
        } else {
            addModLog('⚠️ enterChapter2 函数不存在');
        }
    });

    document.getElementById('mod-unlock-chapter3').addEventListener('click', function() {
        if (typeof enterChapter3 === 'function') {
            enterChapter3();
            addModLog('📖 进入第三章');
        } else {
            addModLog('⚠️ enterChapter3 函数不存在');
        }
    });

    // --- 日志监控 ---
    document.getElementById('mod-log-toggle').addEventListener('click', function() {
        this.classList.toggle('active');
        logActive = this.classList.contains('active');
        addModLog(logActive ? '📡 日志监控已启用' : '🔇 日志监控已禁用');
    });

    document.getElementById('mod-log-clear').addEventListener('click', function() {
        logContainer.innerHTML = '<div>📡 日志已清空</div>';
    });

    // 拦截网络请求
    const origXHROpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(method, url, ...args) {
        if (logActive) addModLog(`🌐 XHR: ${method} ${url}`);
        return origXHROpen.call(this, method, url, ...args);
    };

    const origFetch = window.fetch;
    window.fetch = function(url, options) {
        if (logActive) addModLog(`🌐 Fetch: ${url}`);
        return origFetch.call(this, url, options);
    };

    // --- UI 交互 ---
    let menuOpen = false;
    fab.addEventListener('click', function() {
        menuOpen = !menuOpen;
        this.classList.toggle('active', menuOpen);
        menu.classList.toggle('open', menuOpen);
    });

    document.querySelectorAll('.mod-tab').forEach(tab => {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.mod-tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            const target = this.dataset.tab;
            document.querySelectorAll('.mod-tab-content').forEach(c => c.classList.remove('active'));
            const contentMap = {
                'values': 'mod-values',
                'speed': 'mod-speed',
                'unlock': 'mod-unlock',
                'log': 'mod-log'
            };
            document.getElementById(contentMap[target]).classList.add('active');
        });
    });

    document.addEventListener('click', function(e) {
        if (menuOpen && !menu.contains(e.target) && e.target !== fab) {
            menuOpen = false;
            fab.classList.remove('active');
            menu.classList.remove('open');
        }
    });

    addModLog('⚡ Mod面板已加载！');
})();
</script>
