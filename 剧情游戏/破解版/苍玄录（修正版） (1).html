<body class="mobile-portrait">

    <script>
        /* data.js */
        ﻿const DATA={
        child:[
         {age:"一岁",title:"陌生人的铃铛",text:"春日里，一位路过的旅人俯下身，用一枚小铃铛逗你笑。家人的手正稳稳托着你。",choices:[["伸手去碰那枚铃铛","依赖","你很早便知道，善意的声音很好听。"],["把脸埋进家人怀里","谨慎","你很早便懂得，熟悉的怀抱最让人安心。"]]},
         {age:"三岁",title:"受伤的小兽",text:"雨后的石阶旁，一只白色小兽蜷在叶下，湿漉漉的眼睛正望着你。",choices:[["立刻抱起它，找人医治","温和","你没有犹豫，先伸出了手。"],["先用树枝轻轻试探","谨慎","你没有靠得太近，却也没有离开。"]]},
         {age:"五岁",title:"山间传闻",text:"夜里，村中老人说起云雾深处的仙门：那里的人会飞，会把迷路的孩子送回家。",choices:[["追问仙门究竟是什么样","好奇","你把每一个细节都记在心里。"],["安静听完，把故事收好","安静","你想，总有一天会亲眼看见。"]]},
         {age:"六岁",title:"来访的仙人",text:"苍玄宗的使者停在院前。风吹过他的衣袖，他望向你时，眼里像落进了一点温柔的光。",choices:[["主动抬手，展示掌心的灵光","勇敢","使者笑了，说你很有仙缘。"],["安静站在家人身后","克制","使者没有催促，只是耐心地等着你。"]]}
        ],
        places:{dorm:["新弟子居","居","你的新房间安静明亮，窗外有一株刚开花的桃树。"],school:["初学堂","学","新弟子们在这里学习吐纳、识字与宗门规矩。"],herbs:["百草坡","药","阳光落满山坡，空气里有新鲜草药的清香。"],terrace:["望云台","云","站在这里能看见云海与远山，最适合静坐。"]},
        npcs:{master:["清玄真人","师尊"],senior:["沈惊澜","大师兄"],sister:["青黛","师姐"],ajiu:["阿九","杂役弟子"]},
        items:{
         tea:{name:"温灵茶",type:"消耗品",desc:"一盏余温未散的灵茶。使用后恢复 3 点体力与 1 点心情。",effect:{energy:3,mood:1}},
         herb:{name:"宁神草",type:"材料",desc:"百草坡最常见的柔嫩药草，晒干后有安神的香气。"},
         peach:{name:"桃花枝",type:"纪念品",desc:"一枝刚剪下的桃花，花瓣上还留着清晨的露水。"},
         note:{name:"折起的纸条",type:"线索",desc:"纸上只写着：‘山路湿滑，记得走亮处。’落款被雨水晕开了。"},
         token:{name:"木制弟子牌",type:"重要物",desc:"清玄真人亲手为你系上的弟子牌。背面刻着你的名字。"},
         sweet:{name:"山下糖渍梅",type:"消耗品",desc:"酸甜的零嘴。使用后恢复 2 点心情。",effect:{mood:2}}
        },
        actions:{cultivate:["晨间修炼","school",3,-2,"初学堂的吐纳课很顺利。你似乎更熟悉灵气流过经脉的感觉了。",null],sword:["基础练剑","school",2,-3,"沈惊澜耐心纠正你的站姿，临走时还夸你学得很快。","senior"],gather:["采集药草","herbs",1,-2,"青黛教你辨认药草，将一小束最香的宁神草放进你的篮子。","sister"],meditate:["望云打坐","terrace",2,-1,"清玄真人路过望云台，停下来看了你片刻，只说：‘心很静。很好。’","master"],tidy:["整理居所","dorm",0,-1,"房间被整理得干干净净。窗台上不知何时多了一枝新鲜桃花。",null],chat:["与同门闲谈","school",0,-1,"同门们分享了许多山门里的趣事。有人提起药堂的婆婆，说她做的汤最好喝。","sister"],rest:["提前休息","dorm",0,0,"你比平时更早睡着。梦里有人轻轻替你盖好被子。",null]},
        explore:{
         dorm:[
          ["窗台的桃花","午后的风掀起窗帘。窗台上搁着一枝新鲜桃花，枝端还沾着细小的露珠。你不记得自己摘过它。",[["收下桃花","获得「桃花枝」。也许是同门送来的。",{item:"peach",mood:1}],["先放在原处","你把窗户推开一些，让风替你保管这点春意。",{mood:1}]]],
          ["被叠好的外衫","你刚洗好的外衫被整齐放在床尾，连衣角都压得平平整整。",[["穿上它","衣料晒过太阳，暖融融的。",{mood:2,obs:{ajiu:1}}],["收进衣箱","你决定晚些时候再问问是谁帮的忙。",{insight:1}]]]
         ],
         school:[
          ["讲堂后的空位","课间，你发现靠窗的位置一直空着。桌面却很干净，像每天都有人擦拭。",[["坐过去看看","窗外正好能望见新弟子居。你得到一点安静的时间。",{mood:1,insight:1}],["不去打扰","你在原位等到钟响。",{mood:1}]]],
          ["大师兄的零嘴","沈惊澜从袖中摸出一小包糖渍梅，笑着问你要不要尝尝。",[["收下并道谢","酸甜的味道冲淡了练剑后的疲惫。",{item:"sweet",aff:{senior:3},obs:{senior:1}}],["分给其他同门","大家都笑了，沈惊澜也笑着说你很会照顾人。",{mood:2,aff:{senior:1}}]]]
         ],
         herbs:[
          ["石缝里的灵草","一株银边小草从石缝中探出头来。青黛说它很难得，但还没到采摘的时候。",[["记下它的位置","你用小石子在旁边做了记号。",{item:"herb",insight:1}],["请青黛讲讲它","她耐心地告诉你药草的习性，连风向都没有略过。",{aff:{sister:3},obs:{sister:1}}]]],
          ["药香深处","风从药堂方向吹来，带着甜暖的药香。有人远远喊你一声，随即又像只是错觉。",[["循着香气走两步","你在坡边拾到一包宁神草，香气很淡。",{item:"herb",mood:1}],["回到阳光下","你告诉自己，初来乍到还是别走太远。",{mood:1,insight:1}]]]
         ],
         terrace:[
          ["云海边的纸鹤","石栏下卡着一只纸鹤，翅膀上沾了点泥。你展开后，里面是空白的。",[["把它收进包裹","你把纸重新折好，获得「折起的纸条」。",{item:"note",insight:1}],["放回风里","纸鹤摇摇晃晃地飞了一小段，落在更远的台阶上。",{mood:2}]]],
          ["师尊的问候","清玄真人在亭中煮茶，见你来，只问：‘今日可还习惯？’",[["如实说有些想家","他为你添了一盏茶，说想家是很自然的事。",{item:"tea",aff:{master:3},obs:{master:1},mood:1}],["说自己已经习惯了","他看了你片刻，温和地点头。",{aff:{master:2},obs:{master:1},cult:1}]]]
         ]
        },
        dialogue:{
         master:["清玄真人将书卷放下，目光落在你的弟子牌上。","‘修行不必急于一时。你还小，若觉得累，只管来找为师。’","他递来一盏茶，白雾在你们之间缓缓散开。"],
         senior:["沈惊澜刚练完一套剑，额前还带着薄汗。","‘这几日山路有些湿，若要出门，叫上我也无妨。’","他说得自然，像只是随口一句关照。"],
         sister:["青黛正在挑选丝线，见你过来便挪出身边的位置。","‘新衣若有不合身的地方，别忍着。人总要穿得舒服些。’","她的指尖在布料上掠过，动作轻得像怕惊到你。"],
         ajiu:["阿九站在廊下，手里拿着你今日忘在学堂的笔。","‘我路过时看见的。’他把笔递给你，很快又垂下眼。","‘夜里风大，记得关窗。’" ]
        }
        };
        
        DATA.actions.cultivate[4]="清晨的初学堂还带着露气。执事师兄让所有新弟子盘膝坐好，教你们如何把散乱的呼吸一点一点引向丹田。你中途走神去听窗外的鸟叫，回过神时，指尖竟已经凝起一小缕温顺的灵光。";
        DATA.actions.sword[4]="练剑结束得比想象中晚。沈惊澜没有催你，只把木剑竖在石阶旁，示范最后一遍起势与收势。他说真正的剑并不急着赢谁，先要学会在风里站稳。临别时，他从袖中抖出一颗糖渍梅，像是早就准备好了。";
        DATA.actions.gather[4]="百草坡的叶片被阳光照得透亮。青黛一路教你辨认叶脉、花萼与气味，还特意提醒你不要碰一株长得格外漂亮的红花。她说那花会让人做很长的梦，说完又笑着补了一句：‘不过这里离药堂很远，不会有事。’";
        DATA.actions.meditate[4]="云海翻过山脊时，望云台上安静得只剩衣袖拂过石面的轻响。你数着吐息，慢慢忘了自己坐了多久。清玄真人不知何时停在亭外，并未打扰，只在你收功后说：‘今日的心很静。以后若睡不安稳，也可以来这里。’";
        DATA.actions.tidy[4]="你把新弟子居里每一件东西都摆回合适的位置：茶盏靠窗，衣箱靠墙，木制弟子牌挂在最顺手的地方。最后，你在床脚发现一粒不属于自己的小石子，圆润得像被人攥过很多次。你将它放到窗边，转眼便把这件小事忘了。";
        DATA.actions.chat[4]="课后，新弟子们围在廊下说起各自的家乡。有人想念河边的灯会，有人惦记母亲做的面。你听着听着，发现每个人提到苍玄宗时都带着一点庆幸：这里的人很好，饭菜很好，连夜里巡山的师兄都会替迷路的人点灯。";
        DATA.actions.rest[4]="夜色落在桃树枝头。你很快便睡着了，梦里似乎有人站在门外，隔着很远很远的地方轻声数你的呼吸。醒来后，月光仍好好地铺在地上，房间里只有你一个人。";
        
        DATA.explore.dorm.push(
        ["衣箱最底层","整理衣物时，你在衣箱最底层摸到一块叠得方方正正的旧布。那是离家前家人塞进来的包袱皮，边缘还缝着一朵笨拙的小花。屋里忽然安静下来，连窗外的风声都像隔得很远。",[["把它铺在枕边","熟悉的布料让你想起出门那日，家人反复叮嘱你要好好吃饭、好好睡觉。你把它铺平，心里也安稳了一些。",{mood:3}],["收回衣箱深处","你告诉自己已经是仙门弟子，不能总是想家。可合上衣箱时，你还是多看了一眼那朵小花。",{insight:1}],["写一封家书","你提笔写下今天看见的云、学到的字和新认识的人。字迹歪歪扭扭，却比想象中写得长。",{mood:2,item:"note"}]]],
        ["门外的脚印","傍晚下过一场很短的雨。你开门时，发现廊下积水里有一串浅浅的脚印，停在你门前，又折向院外。脚印没有踩进泥里，像来人走得极轻。",[["沿着脚印望一望","脚印在桃树下就消失了。树枝上有一只灰雀，正歪着头看你。你只好把这件事当作哪位同门经过。",{insight:2}],["当作没看见","你把门合好，屋里很暖。也许雨水会把所有痕迹都冲掉。",{mood:1}]]]
        );
        DATA.explore.school.push(
        ["抄写宗规","执事师兄发下一张薄纸，让新弟子抄写最基础的宗规。你一笔一画写到‘同门相扶，不可独行险处’时，旁边有人轻轻念出声。那声音很温柔，像是在替所有人记住这句话。",[["认真抄完每一个字","纸张被墨迹浸得微微发皱。执事师兄路过时夸你字写得端正，还额外给你讲了两条不写在纸上的小规矩。",{cult:1,insight:1}],["问起‘险处’在哪里","他顿了顿，笑着说：‘新弟子能去的地方都很安全。等你再大一些，自然会知道。’",{insight:2}]]],
        ["迟到的同门","钟声响过后，一个抱着书卷的孩子匆匆跑进讲堂。大家都笑着给他让座，沈惊澜还替他把散落的纸页一张张捡好。他一直道谢，眼圈却红得厉害。",[["帮他整理纸页","你和他一起把纸页按顺序排好。他小声说自己只是起晚了，幸好没有惹师长不高兴。",{mood:2,aff:{senior:1}}],["安静坐在原位","你看着大家围过去，忽然觉得苍玄宗的人真的很会照顾别人。",{mood:1}]]]
        );
        DATA.explore.herbs.push(
        ["雨后的石径","一场小雨刚停，百草坡的石径滑得发亮。你在路边看见一只背篓，里面装满晒好的药材，旁边却不见主人。青黛远远喊你不要乱动，自己踩着湿石快步赶来。",[["替她扶住背篓","背篓并不重，里面的药材却散发出浓得过分的甜香。青黛接过时松了口气，连声谢你。",{aff:{sister:2},mood:1}],["退到干燥处等待","你没有靠近。青黛赶来后夸你很谨慎，又递给你一片可以闻的宁神草叶。",{item:"herb",insight:1}]]],
        ["蝴蝶停过的花","一只淡金色的蝴蝶绕着你飞了很久，最后停在一株没有记载的白花上。花瓣薄得几乎透明，花心却藏着一点淡红。你正想靠近，药堂方向传来一声清脆的瓷碗碰撞。",[["采下一片花瓣","花瓣在掌心很快化成清凉的水意。你没有受伤，只觉得鼻尖萦绕着一缕陌生香气。",{mood:1,insight:2}],["记住位置，改日再来","你用石块围出一个小圈。青黛听完你的描述后沉默片刻，说会帮你查一查。",{aff:{sister:2},obs:{sister:1}}]]]
        );
        DATA.explore.terrace.push(
        ["远山的灯","傍晚的云海像一层缓慢流动的白绸。很远的山坳里亮起一盏灯，明明隔着许多山，却清晰得像就在脚下。守台的弟子告诉你，那是山下人家归家的灯火。",[["多看一会儿","你想起自己的家。风从身侧穿过去，带来一点松木与炊烟混在一起的错觉。",{mood:2}],["问守台弟子能否下山","他笑着说等你修为再稳一些，宗门自然会带你们去见识外面的天地。",{cult:1,insight:1}]]],
        ["被风吹散的经页","石阶上散着几页被风吹落的经文。你帮忙捡起时，发现其中一页被人用很细的笔划去了一个字，又在旁边补上新的字。改动并不影响意思，却让句子读起来更温柔。",[["把经页交还亭中","清玄真人接过经页，指尖在改过的地方停了一瞬，随后夸你细心。",{aff:{master:2},obs:{master:1},cult:1}],["把改动记在心里","你将那个被划去的字反复念了几遍。明明是很普通的字，却让你隐约有些在意。",{insight:3,item:"note"}]]]
        );
        
        DATA.dialogue.master=["清玄真人将书卷合上，没有立刻说话。山风从他身后的窗里吹进来，把案上的纸页掀起一个角。他伸手压住，动作从容得像这世间没有什么值得着急。","‘刚入门时，许多孩子都会睡不踏实。想家、怕生、担心自己做得不够好，都是再寻常不过的事。’他抬眼看你，语气很轻，‘这些话不必一个人藏着。’","他问起你今天去了哪里、学了什么，甚至记得你早课时坐在靠窗的位置。见你惊讶，他只笑了笑：‘为师总要知道自己的弟子过得好不好。’"];
        DATA.dialogue.senior=["沈惊澜练完剑，先把木剑放到离你远一些的地方，才在石阶上坐下。他的笑容很明亮，像山下晒过的麦子。","‘新弟子居晚上会不会太安静？’他问得随意，没等你答又补了一句，‘若觉得闷，就来初学堂找我。那里总有人在。’","他讲起自己刚入门时也常常迷路，后来是师尊亲自把他带回去。说到这里，他像是想起什么似的，安静了一小会儿，随后又把一颗糖渍梅推到你面前。"];
        DATA.dialogue.sister=["青黛将一束丝线按颜色排开，浅青、月白、杏黄，像把整段春天都收在了膝头。她让你坐近些，说光线好，正好替你看看衣袖有没有磨损。","‘刚来的时候，总会觉得这里太大。路很多，规矩也很多。可你慢慢就会发现，大家都是愿意帮你的。’她替你理平衣领，指尖很快便离开了。","她忽然问你喜欢什么颜色。听完你的回答后，她认真地点头，说下回若有空，就用那种颜色替你缝一个小荷包。"];
        DATA.dialogue.ajiu=["阿九站在廊下，手里拿着你今日忘在学堂的笔。雨后天色很清，他的影子却被拉得很长，一直落到你门槛前。","‘我路过时看见的。’他把笔递给你，很快又垂下眼。你道谢时，他像是没想到会被认真回应，手指微微蜷了一下。","过了一会儿，他才说：‘夜里风大，记得关窗。要是……要是东西不见了，也可以告诉我。’说完便像怕打扰你似的退开两步。"];
        
        DATA.days={
        2:["第一夜","窗边的桃花","夜里起了风。你在半梦半醒间听见窗框轻轻响了一下，像有人替你把被风吹开的窗合好。清晨醒来时，屋里依旧安静，窗户被关得严严实实，桌上却多出一只装着桃花的白瓷瓶。花枝剪得很整齐，露水还没有干。你想，也许是某位热心的同门送来的。","开始第二天"],
        3:["清晨的信","门缝里多了一张折起的纸条。纸很薄，边角被雨水晕开了一点。上面写着：‘山路湿滑，记得走亮处。’没有落款。你把纸条翻来覆去看了几遍，背面只有一道浅浅的折痕，像有人犹豫过很久才将它塞进门缝。","继续"],
        4:["午后的来客","午后，青黛带着一篮晒好的草药来新弟子居看你。她说只是路过，顺便问问你的屋子住得可习惯。她替你把窗边的桃花换了水，又教你用宁神草熏一熏枕头。临走前，她回头看了一眼你收好的衣箱，笑着说：‘有家的东西，最该放在身边。’","谢谢师姐"],
        5:["拜师宴的预告","傍晚时，山门下传来热闹的人声。青黛告诉你，月底会为新弟子办一场小小的拜师宴：有灵食、点心、师长的祝福，还有每个人都要轮流说的入门心愿。她说大家都很期待你的到来。你忽然意识到，自己已经在这里住了好几日。","知道了"],
        6:["梦里听见钟声","这一夜你做了一个很短的梦。梦里没有人，只有苍玄宗的钟声一遍遍从雾里传来。每响一声，便有一扇看不见的门在远处合上。醒来时天还没亮，你的弟子牌正安静地挂在床头，像从未被谁碰过。","继续"],
        7:["第一周结束","第七日的傍晚，清玄真人在望云台为新弟子们讲了一段很短的经。最后他说：‘能来到这里，是缘分。苍玄宗会记得你们每一个人。’众人都笑着应是。山风吹过，远处的云海被夕阳染成温暖的金色。你忽然觉得，这里确实像一个很大的家。","迎接新的日子"]
        };
        
        
        /* chapter1-content.js */
        ﻿DATA.actionText={
         cultivate:[
         "晨雾还挂在檐角，初学堂里已经燃起淡淡的安神香。执事师兄让你们闭上眼，听自己的呼吸从急促变得绵长。你起初总忍不住偷看旁人，后来却发现每个人的灵息都像一盏小灯，在安静的屋子里缓慢亮起来。下课时，窗外正有一群白鸟掠过。",
         "今日讲的是引气入体最基础的一步。你反复尝试了许多次，直到掌心终于浮起一粒米粒大小的灵光。它不算明亮，却稳稳停在那里。身旁的新弟子替你高兴，连执事师兄都夸你耐心。你忽然觉得，修仙也许并没有想象中那么遥远。",
         "练到午后，阳光把蒲团晒得暖洋洋的。你有些困，却仍坚持把最后一轮吐纳做完。收功时，一缕清凉的灵气沿经脉滑下去，像有人替你把乱糟糟的心事轻轻理顺。"
         ],
         sword:[
         "木剑碰在一起，发出清脆的声响。沈惊澜没有因为你年纪小就放慢太多，只在你站不稳时伸手扶住剑脊，让你重新调整重心。他说剑招可以慢，脚下却要知道自己该落在哪里。等你终于做对，他笑得比你还高兴。",
         "练剑的孩子们在日光下排成一列。你总是记不住最后的转腕，沈惊澜便把动作拆成更小的部分，一遍遍演给你看。他耐心到让人不好意思偷懒。临散场时，他替你擦掉额角的汗，又像想起什么似的很快收回手。",
         "风把练剑场边的旗子吹得猎猎作响。你握着木剑，有一瞬间觉得自己好像真的能劈开眼前的风。沈惊澜站在不远处看着，等你收势后才鼓掌，说这一剑比昨日更像样了。"
         ],
         gather:[
         "百草坡上的草叶比你想象中更难分辨。青黛让你不要只看颜色，还要闻一闻、摸一摸，记住叶背的纹路。你蹲在她身边忙了很久，手指上沾满青草的气味。她把你认对的每一株都夸了一遍，仿佛那是件很不得了的事。",
         "今日的任务是采够一小篮宁神草。风一吹，整片山坡都像在轻声说话。青黛告诉你，这种草最喜欢阳光却怕积水，所以雨后总要仔细挑。你跟着她走过一段湿滑的石径，忽然觉得自己也像被认真照料的一株幼苗。",
         "你在一块背阴的石头后找到几株叶色特别深的药草。青黛蹲下来陪你观察，最后说那不是任务里要的东西，却可以记在心里。她替你在小册子上画了简单的图样，字写得又细又漂亮。"
         ],
         meditate:[
         "望云台的石面被日光烘得微暖。你坐下后，先听见远处鸟鸣，再听见自己衣袖摩擦的声音，最后连这些也渐渐远了。收功时，云海已经换了一个形状。清玄真人从亭中走出来，问你看见了什么。你说不清，只觉得心里很亮。",
         "今日山风有些大，坐久了便觉得袖口发凉。清玄真人让人送来一方薄垫，自己却没有走近，只隔着几步提醒你不要贪快。他说修行像看云，越想抓住，越容易什么也看不见。你把这句话默默记了下来。",
         "你数到第七十二次呼吸时，忽然听见钟声。钟声很远，像从云里传来。睁开眼后，四周仍只有明亮的天光与缓慢的风。清玄真人说那是午钟，并没有什么稀奇，可你总觉得它比平时多响了一下。"
         ],
         tidy:[
         "你把屋子里的小桌擦了一遍，又把茶盏挪到最顺手的位置。新弟子居的房间并不大，却刚好容得下一个人的衣物、书册和心事。收拾到最后，你发现自己已经记住每一道木纹、每一处光落下的地方。",
         "午后的新弟子居很安静，别的孩子大概都去了学堂或百草坡。你把床褥晒到窗边，顺手抖落几片桃花瓣。隔壁院里传来谁在哼歌，断断续续，却很好听。你忽然不那么想家了。"
         ],
         chat:[
         "廊下的闲谈从谁家最好吃的点心，慢慢说到各自最想学的法术。有人想飞得高一点，有人想用灵火烤出不糊的饼，还有人想早点学会传讯符，好把消息送回家。你听着这些稚气又认真的愿望，忍不住也说了自己的想法。",
         "一位年纪比你大的同门讲起第一次进山门时的事，说自己紧张得一路抓着师兄的袖子不放。大家笑成一团，连讲故事的人也笑。有人说苍玄宗最好的地方，就是不怕问路；只要开口，总会有人带你回去。"
         ],
         rest:[
         "夜里下了一阵很轻的雨。雨声落在瓦片上，像有人用指尖慢慢敲着节拍。你抱着枕头翻了个身，想起白天学过的呼吸法，便照着做了几次。很快，困意像温水一样漫上来，把你稳稳包住。",
         "你在梦里回到还没有进山的日子。院里的灯很亮，家人叫你的名字，声音却隔着一层薄雾。你循声往前走，雾忽然散了，面前却是苍玄宗的桃树。醒来时，枕边有一片不知道从哪里来的花瓣。"
         ]
        };
        DATA.talk={
         master:[DATA.dialogue.master,["清玄真人正在临一幅字，墨色在宣纸上缓慢铺开。他看见你来，先问你今日吃得可好、睡得可安稳，像这些小事比修为更值得在意。","你说起初学堂里难懂的口诀，他没有立刻讲答案，而是让你把最不明白的地方念出来。听完后，他用最简单的比喻重新解释了一遍，直到你点头。","临走时，他让你把书卷带回去慢慢看，又说若夜里想起问题，也不必等到第二天。"],["亭外落着细细的春雨。清玄真人没有让你站在檐下淋湿，而是把自己的伞递给你。你推辞时，他只说弟子还小，淋病了会耽误修行。","他陪你走到石阶尽头，路上没有问太多，只讲起苍玄宗早春的花什么时候开、后山的鸟什么时候回来。那些话听起来很寻常，却让漫长的山路短了许多。"]],
         senior:[DATA.dialogue.senior,["沈惊澜坐在台阶上修理一把旧木剑，见你来便让出旁边的位置。他说这把剑是自己刚入门时用的，剑身已经磨出许多浅痕，却一直舍不得扔。","他问你是否喜欢练剑，又说不喜欢也没有关系。苍玄宗里有很多路，总能找到适合你的那一条。说完他顿了顿，补上一句：‘不过若有人欺负你，还是得告诉我。’","他的语气很轻松，像是在说一件再自然不过的事。"],["你在回廊转角遇见沈惊澜。他手里拎着两包刚领来的点心，看见你时明显愣了一下，随后很自然地把其中一包递来。","他说自己拿多了，不吃也是浪费。可那包点心的封口系得格外仔细，像从一开始就是为某个人留着的。"]],
         sister:[DATA.dialogue.sister,["青黛把自己的药草册摊开给你看，里面夹着许多压平的花叶，旁边都写着日期和地点。她说记住一株草，不只是记住它能治什么病，也要记住它喜欢什么样的天、什么样的土。","她让你也写下今天遇见的东西。你写得很慢，她却一点没有催，只在你停笔时夸你观察得仔细。","最后，她撕下一张干净的纸塞给你，说下次可以继续写。"],["青黛正替一位新弟子补衣袖。针线在她手里走得很快，几乎看不见痕迹。等那孩子离开，她才转过头问你有没有什么想要的东西。","你说暂时没有，她便笑，说那也没关系，等你想到时再告诉她。她好像很乐意替人准备一些细小又妥帖的东西。"]],
         ajiu:[DATA.dialogue.ajiu,["阿九在院角修一盏坏掉的灯。你靠近时，他先把工具收起来，像怕弄脏你的衣袖。灯罩上有一道裂纹，他却修得很仔细，最后点亮时，光比原先还要稳。","他说新弟子居夜里路暗，这盏灯修好后会放在廊下。你夸他手巧，他沉默了很久，才小声说这是自己应该做的。","可他离开前，又回头确认了一遍你房门前有没有光。"],["你在百草坡附近遇见阿九。他手里提着一篮刚洗好的药草，见到你后便停下，让你先走。","你问他要去哪里，他说只是送东西。等你走出几步，回头时却发现他仍站在原地，像是在确认你没有走错路。"]]
        };
        DATA.explore.dorm.push(
        ["借来的书","门边放着一本没有署名的启蒙书，书页里夹着一枚干净的叶书签。第一页写着几句浅显的口诀，边上还有人用朱笔标出容易读错的字。",[["坐下来读一会儿","书里的故事讲的是一只想飞过山的幼鸟。你读到最后，发现朱笔在结尾画了一个小小的笑脸。",{cult:1,mood:1}],["去问是谁留下的","问了一圈也没人承认。大家都说新弟子之间互相借书很正常，你便把书先收了起来。",{item:"note",insight:1}]]],
        ["桃树下的小坑","桃树根旁有一个新填上的小坑，土色比周围深些。你蹲下时，发现里面埋着一颗坏掉的铃铛，声音已经哑了。",[["把铃铛洗干净","铃铛再也响不起来，但握在掌心很温暖。你把它放回原处，没有带走。",{mood:1,insight:1}],["用土重新盖好","你告诉自己这只是某个孩子遗落的玩具。桃花落下来，轻轻覆住了那块土。",{mood:1}]]],
        ["隔壁的笑声","夜里，隔壁屋子传来几名新弟子压低声音讲故事。他们邀请你过去一起听，故事讲的是山里会替迷路人引路的白狐。",[["加入他们","你们围着一盏小灯，把故事越讲越离奇。最后谁也不敢一个人回房，却又都笑着说不怕。",{mood:3}],["隔着门听一会儿","你没有进去，仍把故事听完了。白狐最后把孩子送回家，故事到这里便戛然而止。",{mood:1,insight:1}]]]
        );
        DATA.explore.school.push(
        ["灵石测验","初学堂发下几块灰扑扑的小灵石。执事师兄说只要静下心，便能让石头亮一点。你捧着灵石等了很久，直到它在掌心泛起极淡的光。旁边有人比你亮得多，也有人怎么都没有反应。",[["为亮起的同门鼓掌","你的掌声带动了其他人，讲堂里一下子热闹起来。执事师兄也笑，说修行不是比谁先走，而是看谁愿意一直走。",{mood:2,aff:{senior:1}}],["继续握着灵石","你不急着放下，直到最后一刻。那一点光没有变大，却始终没有熄灭。",{cult:2}]]],
        ["雨天的长廊","雨把所有人都困在长廊里。有人拿出纸和墨，说要教大家折传讯符；有人把桌子拼在一起玩起了小棋。整个下午都像被雨声围住，慢吞吞地流过去。",[["学习折纸符","你折出的第一只纸鹤歪得厉害，却在注入一点灵气后真的扑了两下翅膀。",{item:"note",cult:1}],["和大家下棋","你输得很快，却被逗得一直笑。等雨停时，廊下已经留下许多零散的棋子和快乐的脚印。",{mood:3}]]],
        ["没人认领的墨锭","讲堂角落有一块墨锭，外壳刻着很小的云纹。你拿起来时，闻到一股极淡的松烟香。它看起来不像新弟子会用的东西。",[["交给执事师兄","他看了一眼便收好，说会替你问问失主。临走前还夸你没有贪图漂亮物件。",{mood:1,insight:1}],["留意云纹","你记住了纹样。它和望云台石栏上的一处刻痕很像，但你不确定是不是自己看错了。",{insight:2}]]]
        );
        DATA.explore.herbs.push(
        ["晒药的竹席","坡下铺着几张晒药竹席，细小的药叶在风里轻轻翻动。你帮着把被吹乱的叶片拨回去，指尖很快沾上苦涩又清凉的气味。",[["帮忙晒完一席","负责晒药的弟子送你一小包边角料，说泡水喝能安神。你认真收下。",{item:"herb",mood:1}],["询问药草用途","对方讲得很细，连什么时辰喝最合适都告诉了你。你听得入神，忘了时间。",{insight:2}]]],
        ["山雀的巢","低矮的灌木里有个小小的鸟巢，几只还没长齐羽毛的山雀正挤在一起。它们的母鸟在附近焦急地飞来飞去，似乎是巢边的枝条被风吹断了。",[["找树枝垫好巢边","你和青黛一起把枝条固定住。母鸟落在不远处看了很久，最后衔来一片亮晶晶的羽毛。",{mood:2,aff:{sister:1}}],["不去靠近","你站在远处守了一会儿，直到母鸟终于飞回巢边。你觉得有些事只要不打扰，也是在帮忙。",{mood:1,insight:1}]]],
        ["药堂送来的汤","一名药堂弟子从坡下走来，手里端着一只盖好的小盅，说玉面婆婆听闻新弟子采药辛苦，特意煮了些暖胃的汤。汤香浓郁得让人忍不住多闻两下。",[["喝一小口","汤很鲜，喝下去后胃里暖暖的。药堂弟子笑着说婆婆最喜欢看孩子们好好吃饭。",{energy:2,mood:1}],["先谢过，带回去再喝","对方没有勉强，只细心替你把盅盖扣紧，说凉了味道就不好了。",{item:"tea",insight:1}]]]
        );
        DATA.explore.terrace.push(
        ["晨钟之前","你比平时更早来到望云台。天还没有完全亮，山门笼在淡蓝色的雾里，远处传来扫地的沙沙声。守台弟子递给你一件薄披风，说清晨最容易着凉。",[["披上披风等日出","第一线日光越过山脊时，所有云都被染成金色。你觉得这一刻值得记很久。",{mood:3}],["询问守台弟子的名字","他愣了一下，随后笑着告诉你名字，还说很少有新弟子会记得问。",{mood:1,insight:1}]]],
        ["石栏上的刻字","望云台最靠里的石栏上刻着许多很浅的小字，大多已经被风磨得看不清。你辨认出其中几个似乎是人名，后面还跟着年份。",[["逐个描摹下来","你花了很久才记住几行残字。它们像是从前来过这里的人留下的愿望，又像只是无聊时的涂鸦。",{item:"note",insight:3}],["不破坏石栏","你没有触碰，只在心里记住了大概的位置。等以后识得更多字，也许能再来看。",{insight:1,mood:1}]]],
        ["云中的风筝","一只纸风筝从下方的弟子居飘了上来，线已经断了，却还固执地在风里翻飞。你追到台阶边，看见阿九正从另一侧赶来。",[["和阿九一起捡回风筝","你们追了很久才把风筝按在石阶上。阿九把它交给你，说等找到失主再还也不迟。",{mood:2,aff:{ajiu:2},obs:{ajiu:1}}],["让阿九去追","他很快便跑远了。过了一会儿，他真的带着风筝回来，衣角沾着一点草屑，却像完全不在意。",{aff:{ajiu:2},obs:{ajiu:1}}]]]
        );
        DATA.days[8]=["雨后的早课","连夜的春雨把山道洗得发亮。早课时，执事师兄让大家绕开靠近后山的那条小路，说雨后石壁松动，不适合新弟子经过。沈惊澜在旁边补了一句，若有人不小心走错，记得站在原地等人来接。大家都应得很乖。","记住了"];
        DATA.days[9]=["一封家书","午后，杂役弟子送来一封从山下转上的家书。信里没有什么大事，只问你吃得好不好、衣服够不够暖。你读了很久，最后把信折得很小，放进衣箱最里面。窗外有人经过，脚步声停了停，又慢慢走远。","收好家书"];
        DATA.days[10]=["新弟子的小集市","初学堂前摆起几张小桌，大家把自己做的纸符、编的小绳、山里捡来的漂亮石子摆出来交换。沈惊澜说这只是练习，不算真正的交易。可每个人都认真得很，仿佛手里那点小东西真能换来整个春天。","去看看"];
        DATA.days[11]=["无人认领的伞","傍晚雨又落下。新弟子居廊下多出一把青竹伞，伞骨上没有名字。你原以为是谁落下的，问了一圈却没有人认领。青黛说先放在门边吧，总会有人来取。那把伞在灯下投出一团安静的影子。","先收着"];
        DATA.days[12]=["师尊讲经","清玄真人为新弟子讲了一段很短的经。他没有讲大道理，只说人若能记住自己为什么出发，便不会轻易迷路。讲完后，他让每个人回去写一句最想守住的话。轮到你时，他似乎比听其他人更耐心。","记下这句话"];
        DATA.days[13]=["迷路的孩子","一名刚入门的小弟子在傍晚迷了路，最后被阿九送回新弟子居。孩子一直抓着他的衣角不肯放，阿九却只是低声安慰，说这里的路他都记得。你看见他抬头时，目光正好落在你身上，随后又很快移开。","向他道谢"];
        DATA.days[14]=["第二周的月色","第二周结束时，月亮很圆。新弟子们在院里分点心，讲起各自来苍玄宗后的第一件开心事。有人说学会了御风步，有人说交到了朋友。轮到你时，所有人都安静下来等你开口。那一刻，你真切地感到自己已经被这个地方接纳。","继续成长"];
        
        DATA.items.pill={name:"养气散",type:"丹药",desc:"以宁神草配成的初阶养气散。服用后恢复 2 点灵力，并增加 1 点修为积累。",effect:{energy:2,cult:1}};
        DATA.items.stone={name:"下品灵石",type:"修行材料",desc:"蕴着微薄灵气的矿石。可在日后用于阵法、交易或辅助修炼。"};
        DATA.actions.retreat=["闭关吐纳","dorm",3,-3,"你关好门窗，按《清心吐纳诀》的要领运转周天。最初经脉里只有细细的凉意，后来那点凉意渐渐汇成温和的溪流。等你睁眼，窗外的天色已经换了一层。",null];
        DATA.actions.alchemy=["炼制养气散","dorm",0,-2,"你把宁神草按书中记载的比例碾碎、过筛，又用极小的灵火慢慢烘干。成品的颜色不算漂亮，却有一股令人安心的清香。",null];
        DATA.actions.study=["研读功法","school",2,-1,"你在初学堂的书架间找到一册《清心吐纳诀》注解。书页边缘写满前人留下的心得，你一边读一边试着照做，原本晦涩的口诀忽然有了具体的形状。",null];
        DATA.actions.duel=["演练剑招","school",1,-3,"你与同门隔着三步举起木剑。没有输赢的压力后，你反而更能听清脚步与呼吸。一次次起势、收剑之间，身体开始记住剑招本身的节奏。","senior"];
        DATA.actions.body=["行气炼体","terrace",1,-2,"你沿望云台的长阶缓慢行走，将灵气压进四肢。山风越吹越冷，脚步却越走越稳。最后一阶落下时，你的掌心微微发热。",null];
        DATA.actionText.retreat=["你在房里点起一截短香，照着书上的图示盘膝而坐。起初杂念很多：白天的钟声、同门的笑声、窗外桃枝摇动的影子。你没有强迫自己忘掉它们，只是一遍遍把注意力带回呼吸。等香燃到尽头，丹田里像多了一点安静的余温。","门窗合拢后，新弟子居的声音都被隔在外面。你试着引导灵气走过最熟悉的经脉，途中有几次差点散掉，却都慢慢收了回来。收功时，你感到疲惫，也感到一种只有自己知道的踏实。"];
        DATA.actionText.study=["书架最上层的注解落满薄灰。你踮着脚取下来，发现里面夹着许多前辈写下的小纸条：有人提醒初学者别贪快，有人画了经脉运转的简图。你读到一条‘心乱时先停下’的批注，觉得它比复杂的口诀更容易记住。","你把难懂的段落抄在自己的纸上，又用最简单的话重新解释一遍。等到窗外光线偏斜，你才发现已经读了很久。书中的修行法门仍很遥远，但至少今天，你比昨天多明白了一点。"];
        DATA.actionText.duel=["演练开始前，沈惊澜替你们划出界线，反复强调木剑不能伤人。你和对面的同门都紧张得不敢先动，最后还是一起笑场。重来之后，剑招依旧生疏，却不再那么害怕出错。","木剑相击的震动一路传到手腕。你记得沈惊澜说过，练剑先练胆，再练眼，最后才是练招。你没有赢下这一回合，却在对方起势前看出了他的肩膀会先动。"];
        DATA.actionText.body=["望云台的长阶一层层向下延伸。你按要求每走十步便停下调息，额角很快出了汗。可当最后一次吐纳结束，双腿并没有想象中那么酸，反而像被山风洗过一样轻快。","你把灵气分到四肢，而不是只守在丹田。这个过程比想象中难得多，稍一分心便会散掉。你失败了几次，仍从头开始。最终，掌心终于生出一点稳定的暖意。"];
        
        DATA.explore.dorm.push(
        ["新弟子守则","床边多了一本薄薄的小册子，封面写着《新弟子居住守则》。里面除了熄灯、清扫与不得擅闯他人房间外，还夹着一页手写的生活建议：天冷添衣、灵力不足不要勉强打坐、若心情不好可以去望云台看看云。",[["逐条读完","你把重要的地方折了角，觉得苍玄宗连这些小事都想得很周到。",{insight:1,mood:1}],["抄进自己的小本子","你认真抄下一整页，最后还在空白处写了今天的天气。",{item:"note",mood:1}]]],
        ["夜里的点灯人","你起夜时，看见廊下有一道提灯的身影正逐盏检查灯火。那人走得很快，灯影却停得很稳。等你推门细看，对方已经转过回廊，只留下地上被灯光照亮的一小片雨痕。",[["轻声道谢","那道身影似乎停了一下，随后远远传来一句‘早些休息’。你没听清是谁，却觉得声音很年轻。",{mood:2,aff:{ajiu:1}}],["回房继续睡","你把门轻轻合上。廊下的灯一直亮到天明。",{mood:1}]]]
        );
        DATA.explore.school.push(
        ["符纸练习","执事师兄发下最普通的黄符纸，让大家试着画一道引火符。你把灵气送到笔尖时，符纹歪歪扭扭地亮了一下，又很快熄灭。旁边的同门却像发现了不得了的事，纷纷凑过来看。",[["再试一次","第二张比第一张更像样。虽然仍没有成功，你至少记住了灵气在最后一笔最容易散开。",{cult:1,insight:1}],["请教执事师兄","他替你扶正手腕，说画符不是靠用力，而是要让心先静下来。",{cult:1,mood:1}]]],
        ["课后的扫洒","讲堂散课后，留下来扫地的弟子不多。你拿起一把竹帚，和大家把落叶、纸屑与泥点扫到一处。有人说修行人不该把时间花在杂事上，另一人却说连一间屋子都照顾不好，又怎么照顾自己的心。",[["留下来一起扫","扫完最后一片落叶时，讲堂显得格外明亮。执事师兄路过，夸你们做得很好。",{mood:2,aff:{sister:1}}],["回去温习功课","你抱着书卷离开，身后仍能听见竹帚扫过石面的细响。",{cult:1}]]]
        );
        DATA.explore.herbs.push(
        ["药圃边的木牌","百草坡尽头插着几块新木牌，上面写着药草名称与采摘时令。你逐块读过去，发现有一块木牌背面被人画了一个很简单的笑脸，像是给不识字的孩子做的记号。",[["照着木牌认草药","你很快分清了三种容易混淆的草叶。青黛后来听说，特意让你再讲一遍给她听。",{herbal:1,insight:1}],["把笑脸画进册子","你不知道是谁画的，却觉得这个小记号很有用。",{item:"note",mood:1}]]],
        ["清晨的露水","青黛说有些药草要在日出前收集露水，药性才最温和。你跟着她举着小瓷瓶，一滴一滴接住叶尖滑下来的水珠。天色从蓝灰慢慢变成明亮的白。",[["耐心收集满一瓶","瓷瓶装满时，青黛郑重地说这可以留作日后炼药的引子。",{item:"herb",aff:{sister:2},mood:1}],["问她为什么懂这么多","她笑着说自己也只是比你早来几年，很多事都是慢慢学会的。",{aff:{sister:2},insight:1}]]]
        );
        DATA.explore.terrace.push(
        ["云影棋局","守台弟子在石桌上摆了一局残局，说是谁都可以试着走一子。棋盘上黑白分明，远处云影却一直缓慢流动。你盯着许久，觉得每一颗棋子都像在等你做决定。",[["落下一子","守台弟子看了很久，随后笑着说这步不一定最好，却很有自己的想法。",{insight:2,mood:1}],["先看别人下","你在旁边看了两局，慢慢明白了棋子之间原来也有许多看不见的牵连。",{insight:1}]]],
        ["山门外的风","你站在望云台最边缘，能看见通向山下的石阶在云雾里断断续续。风从山外吹来，带着陌生的尘土气。你忽然想起使者带你进山时说过，外面的世界很大，而苍玄宗只是其中一处停靠。",[["想象未来的游历","你在心里给自己列了很长一串想去的地方：海边、雪山、会开花的沙漠。",{mood:2,cult:1}],["专心感受风向","你试着用灵气贴住风的来处，竟真的分辨出山外与山内的气息不同。",{insight:2}]]]
        );
        DATA.days[15]=["外门的传闻","午膳时，有同门说外门弟子正在准备一场小比试，胜者能得到一块下品灵石。大家立刻热闹起来，有人说以后也要去参加，有人担心自己永远练不好剑。沈惊澜经过时听见，笑着说新弟子不必急，先把每天该做的事做好。","继续修行"];
        DATA.days[16]=["第一次炼药课","药堂开了一节给新弟子的炼药课。玉面婆婆没有亲自出现，只有她的弟子教大家分拣药材、控制火候。你第一次看见灵火在小炉下安静燃烧，觉得它像一只被驯服的橘色小兽。","记住火候"];
        DATA.days[17]=["小雨与剑声","午后下起细雨，练剑场却没有停课。沈惊澜让大家把剑收好，站在檐下听雨落在石面上的节奏。他说剑法也有快慢，先学会听，日后才不会只顾着往前冲。雨停时，所有人的衣角都带着潮气。","记住这句话"];
        DATA.days[18]=["新的弟子服","青黛把改好的弟子服送来。她在衣袖内侧用与你气质相称的丝线绣了一个极小的记号，说这样洗晒时不容易拿错。记号并不起眼，却被她缝得格外认真。","收下新衣"];
        DATA.days[19]=["夜巡的钟","夜里，远处传来三声短钟。隔壁的孩子问这是什么意思，年长些的同门说只是夜巡换班，让大家安心睡觉。你听完便放下心来。窗外的灯光沿着回廊一点点移动，像有人在认真守着每一间屋子。","安心休息"];
        DATA.days[20]=["山下送来的果子","山下有人送来一筐刚熟的果子，说是给新弟子尝鲜。大家围在院里分食，果皮剥开时香气四散。阿九站在稍远处帮忙收拾果核，等你看过去，他才抬头问你够不够吃。","分一颗给他"];
        DATA.days[21]=["第三周的晚风","第三周结束的傍晚，你坐在新弟子居的台阶上，看着天色一点点暗下来。短短二十一天里，你已经认得去初学堂最快的路，知道百草坡哪块石头最滑，也能在钟声响起前收好书卷。苍玄宗的生活开始有了自己的节奏。","迎接明天"];
        
        DATA.quests={
         herb:{title:"百草坡的课业",target:3,unit:"份宁神草",desc:"青黛请你在本周内收集三份宁神草，并写下每次采集时的天色与气味。",reward:"课业所获：青黛亲笔药理笔记。",event:["百草坡的课业","青黛把你这几日收集的宁神草一份份摊在竹席上。她没有急着评价，只问你还记不记得每一份是在什么天气、什么位置找到的。你一开始回答得断断续续，后来却发现自己竟真的记住了：雨后的叶缘更亮，背阴处的香气更淡，清晨的露水会顺着叶脉停很久。","青黛听完后很高兴。她说药理从来不是死记名字，而是要学会看一株草怎样活着。临走前，她将自己用过的半册药理笔记送给你，里面夹着许多干花与手写注记。你抱着它走下山坡，觉得以后再来这里时，看到的东西或许会和从前不一样。","青黛的药理笔记"]},
         sword:{title:"同修剑课",target:3,unit:"次剑术研习",desc:"沈惊澜让你先不追求招式完整，只在三次练习中记住自己的呼吸和脚步。",reward:"课业所获：沈惊澜的剑课心得。",event:["同修剑课","练剑场散课后，沈惊澜没有立刻离开。他把你这几次练习时的木剑摆在石阶旁，告诉你它们的剑尖都留下了不同的磨痕。你原本以为这只是木头旧了，他却说每个人握剑的习惯都会留下痕迹，修行也是一样。","他带你在月色下重新走了一遍最简单的起势、转身与收剑。没有旁人围观，你反而不再紧张。最后一招收住时，夜风刚好穿过练剑场，沈惊澜笑着说：‘这次很好。不是因为你做得像谁，而是因为你终于站得像你自己。’","沈惊澜的剑课心得"]},
         social:{title:"同门小集",target:3,unit:"次同门交流",desc:"初学堂希望新弟子在忙着修炼之外，也能记住彼此的名字与心愿。",reward:"课业所获：同门茶会的愿望纸笺。",event:["同门小集","傍晚的初学堂被临时收拾成了一间小小的茶室。新弟子们各自带来一点能分享的东西：山下的果干、折得歪歪扭扭的纸鹤、练坏的符纸、从百草坡捡来的漂亮石头。没有人笑谁准备得少，大家只是围在一起，轮流说起自己第一次走进苍玄宗时最害怕什么。","有人害怕高山，有人害怕背不完口诀，也有人说自己害怕交不到朋友。轮到你时，许多目光都安静地落过来，却一点也不让人难受。茶会结束后，你发现原来同门的名字已经不再只是名册上的字；他们有笑声、有口头禅，也有和你相似的迟疑。","同门茶会的纸笺"]}
        };
        DATA.items.herbbook={name:"药理笔记",type:"修行典籍",desc:"青黛赠你的半册药理笔记。带在身边时，提醒你百草坡的每一片叶子都有自己的习性。"};
        DATA.items.swordnote={name:"剑课心得",type:"修行典籍",desc:"沈惊澜留下的剑课心得。字迹不算工整，却写满了呼吸、步伐与收剑的细节。"};
        DATA.items.teapaper={name:"茶会纸笺",type:"纪念品",desc:"同门们在茶会上写下的愿望纸笺。背面留着不同的笔迹与小小的涂鸦。"};
        
        
        DATA.quests.method={title:"清心吐纳诀",target:4,unit:"次功法修习",desc:"清玄真人布置的入门功课：以吐纳、研读或观想的方式，完成四次完整的功法修习。",reward:"课业所获：清玄真人批注的吐纳诀。",event:["清心吐纳诀","第四次收功时，你才发现案上的短香已经燃尽。清玄真人不知何时站在窗外，没有走近，也没有打断你。他只问你这几日最难的地方在哪里。你想了想，说不是口诀，而是每次心乱时，总不知道该从哪里重新开始。","他听完后在书页边缘写下一行很短的字：‘乱时观息，息定则心定。’字迹端正平和，像一条可以反复走回来的路。你将那一页夹进自己的书中，忽然觉得所谓功法，或许并不只是让人变强的办法。","清玄真人的吐纳批注"]};
        DATA.quests.explore={title:"宗门见闻",target:5,unit:"处山门见闻",desc:"在修行之外，亲自走访苍玄宗的角落，记录五次让你印象深刻的见闻。",reward:"课业所获：苍玄宗见闻册。",event:["宗门见闻","你将这些日子在新弟子居、初学堂、百草坡与望云台记录下的零碎见闻摊在桌上。桃花、药香、木剑、风筝、清晨的钟声……它们原本只是普通的小事，排在一起时，却像慢慢拼出了一幅苍玄宗的地图。","执事师兄翻看后说，修行人不该只盯着脚下的那一步，也要知道自己站在怎样的山、怎样的人群与怎样的四季里。于是他替你钤上一枚小小的藏书印，把这本册子正式算作你的入门见闻。","苍玄宗见闻册"]};
        DATA.items.methodnote={name:"吐纳批注",type:"修行典籍",desc:"清玄真人亲笔写下的《清心吐纳诀》批注。短短一句‘乱时观息’，足够让人反复体会。"};
        DATA.items.gazette={name:"苍玄宗见闻册",type:"重要记录",desc:"你亲自记下的宗门见闻：云海、药草、钟声与同门的名字，都被妥帖收在其中。"};
        DATA.npcEvents={
         master:[
          {id:"master-scroll",day:5,title:"师尊的旧书卷",text:["清玄真人让人传话，请你傍晚去望云台一趟。亭中没有旁人，案上只放着一卷边角已经磨旧的书。见你来了，他先替你倒好茶，才说这卷书曾经也给过许多刚入门的弟子。","书里没有高深法门，只有一些最简单的修行笔记：谁总在打坐时睡着，谁记不住经脉图，谁第一次引气成功后高兴得绕着院子跑。清玄真人翻到其中一页时停了停，随后将书合上。","‘人会长大，路也会变。’他说，‘但刚开始走路时，能有人在旁边记得你摔过几次，未必是坏事。’"],choices:[["说自己也想把每天记下来","你认真告诉他，等以后走得更远，也想记得今天是什么样。",{aff:{master:3},mood:1,obs:{master:1}},"清玄真人微微一笑，说那就从一页小小的日记开始。临走时，他将一张空白书签夹进你的书里。"],["问书卷里的弟子后来去了哪里","你指着那些名字，小心地问起他们后来是否还会回山。",{insight:2,aff:{master:1},obs:{master:1}},"他沉默了一瞬，随后温和地说：‘他们都走上了自己的路。你也会。’风翻过书页，恰好遮住了后半句。"]]},
          {id:"master-rain",day:16,title:"雨夜问心",text:["细雨落了整日，望云台的石面泛着湿润的光。清玄真人撑着一把青伞在廊下等你，说今日不讲功法，只想问问你入门后最开心的一件事。","你说起同门、药草、练剑，或许也说起山下的家。他没有急着点评，只认真听完。等你停下，他才说人心里若还有能让自己高兴的小事，修行再苦也不会完全迷路。","雨声很细，伞下却很安静。你忽然觉得这段路比平日走得慢很多。"],choices:[["坦白自己偶尔会想家","你承认自己有时会在夜里想起从前的院子。",{mood:2,aff:{master:3},obs:{master:1}},"清玄真人说想家不是软弱。他让你下次写信时，替他也向山下的春天问一声好。"],["说自己想变得更强","你说想早一点学会更多本事，不让任何人担心。",{cult:2,aff:{master:2},obs:{master:1}},"他望着你，说变强很好，但不必把每一份担心都背到自己身上。‘你还只是刚开始。’"]]}
         ],
         senior:[
          {id:"senior-dawn",day:6,title:"晨练前的木剑",text:["天刚亮，沈惊澜便在练剑场等你。他没有带其他人，只把两把木剑靠在石阶边，说今日想教你一个不写在课上的小练习。","他让你闭上眼，先不要挥剑，只听风从哪边来、脚下的沙粒如何移动、自己握剑时手指有没有不自觉用力。你照做时总忍不住睁眼偷看，他便笑着说没关系，慢慢来。","练到最后，你的剑招仍不漂亮，却第一次没有因为害怕做错而缩手缩脚。"],choices:[["请他以后也这样教自己","你说自己很喜欢这种不着急的练习。",{aff:{senior:3},sword:1,obs:{senior:1}},"沈惊澜一下子笑开，说当然可以。‘你愿意学，我就愿意教。’他把其中一把木剑塞进你手里，让你先替它取个名字。"],["认真记下练习方法","你把他说的要点一条条记在纸上。",{insight:2,aff:{senior:2},obs:{senior:1}},"他凑过来看你的字，夸你记得比自己刚入门时认真得多。随后又提醒你，记住了也别一个人练得太晚。"]]},
          {id:"senior-lantern",day:18,title:"回廊里的灯",text:["晚课结束后，回廊的灯还没有全点起来。沈惊澜提着一盏刚添过油的灯走在前面，说要顺路送你回新弟子居。山风穿过长廊，灯火被吹得一晃一晃。","他讲起自己第一次夜里巡山时，明明怕得不行，却要装作什么都不怕。后来师尊告诉他，怕并不可笑，重要的是知道害怕时该往哪里走。","走到你门前，他把灯挂到最亮的位置，像是在确认这段路从此也会一直有光。"],choices:[["向他道谢","你认真谢他陪你走这一段路。",{mood:2,aff:{senior:3},obs:{senior:1}},"沈惊澜说这本来就是师兄该做的事，却在转身前又回头问你：‘明天早课，我还来叫你？’"],["请他讲更多巡山的事","你想听听苍玄宗夜里的样子。",{insight:2,aff:{senior:2},obs:{senior:1}},"他讲了许多不吓人的故事：走丢的灵猫、偷吃果子的山雀，还有总是被风吹灭的灯。可讲到最后，他忽然说夜里别一个人往后山走。"]]}
         ],
         sister:[
          {id:"sister-needle",day:7,title:"针线与名字",text:["青黛在窗边替新弟子缝补衣袖。她把不同颜色的线放进小盒子里，每一格都贴着名字。你问她为什么记得这样清楚，她说因为每个人喜欢的颜色和习惯都不一样，记住了以后才不会把心意送错。","她拿起一截浅色丝线，问你愿不愿意在自己的荷包上绣一个简单的记号。你笨拙地穿针，几次都没有成功，她却一直在旁边等着。","最后那个记号歪歪扭扭，却真的留在了布上。青黛说这样很好，一看就是你亲手做的。"],choices:[["请她教自己更多针法","你说想以后也能替别人补衣服。",{aff:{sister:3},mood:1,obs:{sister:1}},"青黛高兴地答应，说下次准备好线就来找你。她替你把荷包系好，像在替一件很重要的事收尾。"],["把荷包送给她看看","你把刚绣好的荷包举给她。",{aff:{sister:3},obs:{sister:1}},"她接过去看了很久，最后却没有收下，只说这是你的第一件作品，应该留在自己身边。"]]},
          {id:"sister-tea",day:17,title:"午后的花茶",text:["青黛在百草坡边摆了一只小茶炉，说今日采药课提早结束，可以教你们认几种能泡茶的花。她把花瓣放进白瓷盏里，热水一冲，颜色便一点点散开。","她说有些东西不一定非要拿来提升修为。累的时候喝一口、想家的时候闻一闻，也能让人记得自己不是只会修炼的木头。其他弟子听了都笑。","轮到你时，她特意问你喜欢清淡些，还是甜一点的味道。"],choices:[["选清淡的花茶","你说喜欢能闻见草木味的茶。",{mood:2,aff:{sister:3},obs:{sister:1}},"青黛替你记下这个答案，说下次晒好新的花瓣，会留一小包给你。"],["选甜一点的花茶","你说修行已经够苦了，茶还是甜些好。",{mood:2,aff:{sister:2},obs:{sister:1}},"她笑着说这个理由很好，随后在你的茶里多放了一点蜜渍花瓣。"]]}
         ],
         ajiu:[
          {id:"ajiu-kite",day:8,title:"修好的纸鸢",text:["阿九在新弟子居外等了很久，手里拿着那只曾被风吹坏的纸鸢。它已经被重新糊好，断掉的竹骨也被细线一圈圈缠住。阿九说只是顺手修了修，不知道你还要不要。","纸鸢的尾巴上多系了一根浅青色丝带，颜色很像你常穿的衣袖。你问他从哪里找来的，他低声说库房里剩下的料子很多。","风刚好起来，纸鸢在他手里轻轻抖了一下，像真的想飞。"],choices:[["和他一起放纸鸢","你提议去望云台试一试。",{mood:3,aff:{ajiu:3},obs:{ajiu:1}},"阿九愣了一下才点头。纸鸢飞得不高，却一直没有落下来。他站在你身后替你扶着线轴，一句话也没多说。"],["收下后认真道谢","你说这比原来的还要好看。",{aff:{ajiu:3},obs:{ajiu:1}},"阿九低头笑了笑，像是突然不知道该把手放在哪里。过了一会儿，他才说：‘你喜欢就好。’"]]},
          {id:"ajiu-snow",day:19,title:"失物与名字",text:["你在回廊尽头发现阿九正替人整理失物。木牌、笔、发带、药瓶，每一样都被擦干净并写上了发现地点。他记得几乎所有新弟子的名字，连谁常用什么颜色的笔都说得出来。","你问他为什么愿意做这些琐事，他说有人丢了东西会着急，能早点还回去就好。说完他又补了一句，自己记性好，放着不用也是浪费。","你忽然想起许多次不知是谁放回门口的东西，心里有了一个模糊的猜想。"],choices:[["帮他一起整理","你拿起笔，和他并排写下失物的名字。",{mood:2,aff:{ajiu:3},obs:{ajiu:1}},"阿九明显放松下来。他把最整齐的一叠纸让给你，还小声说你的字很好认。"],["问他是否也会记得自己","你半开玩笑地问，自己丢的东西是不是都被他捡过。",{insight:2,aff:{ajiu:2},obs:{ajiu:1}},"阿九的动作停了一下，随后低声说：‘我会记得。’他很快又低下头，好像这句话只是随口回答。"]]}
         ]
        };
        DATA.days[22]=["月末的清点","初学堂开始清点新弟子这个月完成的课业。执事师兄说不是为了比较谁更厉害，而是让大家看看自己这段日子学会了什么、还缺什么。你拿出自己的见闻册和练习纸，忽然发现原来已经积攒了不少东西。","整理行囊"];
        DATA.days[23]=["山门晨市","山下的商贩在山门外摆起了晨市，宗门允许新弟子在师兄师姐陪同下远远看看。你第一次见到那么多和修行无关的小玩意：糖画、木梳、染色的纸灯。苍玄宗外的世界原来一直这样热闹。","记住这一天"];
        DATA.days[24]=["课业催阅","青黛在百草坡遇见你，先问起宁神草的进度；沈惊澜路过，又问你木剑练得如何。两人没有催促，只说月末之前若有不懂的地方，随时可以来问。你听完后忽然明白，自己还有一些想做完的事。","继续努力"];
        DATA.days[25]=["夜风里的纸页","夜里风大，你放在桌上的练习纸被吹得满屋都是。阿九正好经过，帮你一张张捡回。清玄真人批注的口诀、青黛画的药草、沈惊澜写下的剑招，全都被重新理好。你看着这些纸页，像看见自己这一个月走过的路。","重新收好"];
        DATA.days[26]=["小小的约定","同门们约好月末前各自完成一件最想做好的事：有人要学会一张完整的符，有人要把剑招走顺，有人想第一次炼成不糊的药粉。大家也问起你的目标。你没有立刻回答，却在心里悄悄列下了答案。","定下目标"];
        DATA.days[27]=["拜师宴前夕","新弟子居开始挂起小灯。厨房飘来灵食的香气，远处有人练习明日要说的入门心愿。每个人都显得有些紧张，又有些期待。你站在廊下看了很久，觉得自己也该为这一月画上一个认真的句点。","准备赴宴"];
        DATA.days[28]=["拜师宴","拜师宴在暖色的灯火里开始。师长与同门都在，桌上摆着你认得或不认得的灵食。轮到新弟子依次说起这个月的收获时，许多人都看向你，等着听你会怎么讲述这段初入山门的日子。","说出心愿"];
        
        
        /* chapter2-data.js */
        ﻿const CH2={
         title:"第二章 · 夏茂",
         places:{library:["藏书阁·浅层","藏","书架高得几乎碰到屋顶，阳光从雕花窗格间落下，空气里有纸页与木香。"],alchemy:["炼丹房","丹","炉火在铜鼎下安静燃烧，药香与焦苦味交错在一起。"],hall:["外门任务堂","令","木牌整齐挂在任务墙上，来往弟子都带着不同的行囊。"],road:["山门驿道","驿","通向山下的石阶蜿蜒入林，风里带着陌生的烟火气。"]},
         actions:{
          study:["研读旧卷","library",2,-1,"你在藏书阁浅层翻阅《清心吐纳诀》的注解。某些批注比正文还密，像有人曾经一遍遍试图把同一段话读懂。",null],
          catalogue:["整理借阅册","library",0,-1,"值守弟子请你协助归还书卷。你将名字、日期与书名一一对齐，墨迹深浅像许多人留下的足印。",null],
          brew:["炼制回灵散","alchemy",1,-2,"你按药方将材料分拣、碾碎，再用细火慢慢烘干。炉盖掀开的瞬间，药香像一阵短暂的雾。",null],
          learnPill:["请教控火","alchemy",1,-1,"药堂弟子演示如何把灵火维持在最温和的一线。你看了很久，才明白火候并不是越旺越好。",null],
          mission:["接取外门委托","hall",1,-2,"你从任务墙上取下一枚木牌。委托内容并不难，却意味着你第一次要以苍玄宗弟子的身份解决山门外的事。",null],
          askRumor:["整理山下传闻","hall",0,-1,"任务堂的旧案柜里塞着许多不成文的传闻：走失的人、荒废的院落、从不回信的弟子。",null],
          travel:["短途下山","road",1,-3,"石阶一路向下，苍玄宗的山门在身后慢慢缩小。你闻到炊烟、泥土和夏日晒热的石头味。","senior"],
          patrol:["查看驿道","road",0,-2,"你沿驿道检查路标与传讯石。山风掠过告示栏，几张旧纸在木板上轻轻作响。",null]
         },
         actionText:{
          study:["藏书阁的光线在午后逐渐偏斜。你伏在书案上，对照前人的批注重新走了一遍吐纳路线。那些笔迹有的凌厉、有的娟秀，却都在提醒同一件事：灵气不肯听话时，先别急着责怪自己。", "你在一册泛黄的札记里找到一张被夹住的纸。纸上写着一位旧弟子对突破失败的记录，字里行间没有抱怨，只有一次次重新开始的痕迹。你读完后把纸放回原处，心里却记住了那个没有署名的名字。"],
          catalogue:["一排排借阅册比你想象中沉。你将它们按年份归位时，发现有几页被人小心地黏过，像曾经被撕下又放回。值守弟子说旧书总会有损耗，随即便催你去休息。", "你逐个比对归还日期。大部分名字都只是匆匆一笔，只有少数人的记录异常工整，像有人替他们反复补写过。"],
          brew:["药材在石钵里被碾成细粉。你一开始总把灵火调得太高，药粉很快便有些发黑。重新来过时，你放慢了呼吸，火焰也随之安静下来。最终的回灵散颜色不算完美，却足够清澈。", "炉边的热气让人额头冒汗。你守着药鼎不敢走神，直到最后一味材料融开，才轻轻松了口气。药堂弟子检查后说，这次已经比上回稳定得多。"],
          learnPill:["药堂弟子让你先学看火，不许急着碰药材。你盯着那一点灵焰看了很久，渐渐分辨出它在什么时刻会跳得更急、什么时刻又会缩成安静的圆。", "你照着药方背诵材料，玉面婆婆从门外经过，远远夸你记性好。她没有进来，只留下比平日更浓的药香。"],
          mission:["你接到的是一桩普通的灵田除虫委托。任务堂的执事把木牌交给你时，特意问你是否需要有人同行。你还没回答，身后已经有人说可以陪你去。", "这次委托是替山下商户送一封信。信封封得很严，你一路都没有拆开。送达后，收信人看见你的弟子牌，神情短暂地僵了一下，随后又热情地招待你喝茶。"],
          askRumor:["旧案柜里有一份写到一半的记录：某位弟子离山历练后再未归来，宗门给出的结论是自愿云游。可最下面还有一行极浅的补记，像有人写到一半又不敢继续。", "你从不同的委托里拼出一些零散传闻。苍玄宗在山下名声很好，常常救人、施药、收留有灵根的孩子。只是每当有人问起旧弟子，话题总会被很自然地带开。"],
          travel:["下山的路比想象中长。沈惊澜走在你身侧，遇到难走的石阶便提醒你小心。到了山下，他给你买了糖画，又说别走太远，街上人多，跟紧些总不会错。", "你第一次独立完成部分山下任务。人群的声音、摊贩的叫卖与山门里的钟声完全不同。回头时，沈惊澜仍站在不远处，像从一开始就没有离开过你的视线。"],
          patrol:["告示栏上贴着许多层旧纸。你帮忙压平被风吹起的一角，忽然看见底下露出一截褪色的寻人画像。等你再想看清，风却把纸吹回了原处。", "驿道边的传讯石有一块失了灵。你俯身检查时，发现石座背面被刻过几道很浅的痕迹，像某个人在等待消息时无意识留下的。"]
         },
         explore:{
          library:[
           ["旧借阅册","你在最下层书架后发现一本未归档的借阅册。纸边已经卷起，最近一页却写着很新的墨迹。某个名字连续借走《清心吐纳诀》很多次，最后一次归还日期被人用浓墨涂掉。",[["记下那个名字","你把名字与日期抄进自己的见闻册。离开前，你又回头看了一眼那处浓墨，觉得它像覆盖得太用力了。",{insight:2,item:"note"}],["把借阅册交给值守弟子","对方接过后神色一顿，随即笑着说会替你归档。那本册子很快被放进了你够不到的高处。",{mood:1,aff:{master:1}}]]],
           ["夹在书中的书签","一本旧剑诀里夹着青色书签，背面写着一句很小的字：‘别在夜里读这一页。’你翻到书签所在处，内容却只是普通的行气法门。",[["带走书签","你将书签夹进自己的见闻册。它摸上去比纸厚一些，像夹着第二层东西。",{item:"note",insight:2}],["放回原处","你决定不碰不属于自己的东西。书页在你合上后自行滑回原来的位置。",{mood:1}]]]
          ],
          alchemy:[
           ["被涂掉的药方","炼制解毒散时，你发现药方最后一味被整齐涂黑。旁边写着‘旧方误录，无须理会’，字迹与整张药方不同。",[["记下被涂掉的位置","你将药方结构画进纸上，想着也许能在别处找到完整版本。",{insight:2,item:"note"}],["询问药堂弟子","对方说旧方常有错误，不必让新弟子费心。说完便主动替你换了一张新药方。",{mood:1,aff:{sister:1}}]]],
           ["不属于药材的残渣","你清理炉底时发现一小块无法辨认的暗色残渣。它不像普通药材，碰到灵火后没有燃尽，只是散出一点甜腥味。",[["用纸包好","你把残渣小心收起，没让任何人看见。",{item:"note",insight:3}],["丢进药渣桶","你告诉自己这或许只是炉底陈年积垢。可离开时，药渣桶里似乎传来很轻的碰撞声。",{mood:1}]]]
          ],
          hall:[
           ["被撕掉的任务令","任务墙上残留着半张被撕下的任务令，只能看见‘寻……弟子’与一个模糊的日期。执事师兄说那是很久以前的旧委托，早已不用在意。",[["抄下残余内容","你把能看清的字一一记下，纸边有一枚很浅的宗门印。",{insight:2,item:"note"}],["相信执事师兄","你把那半张纸压回木板下。任务墙很快又被新的委托盖住。",{mood:1}]]],
           ["不该出现的委托","你看见一块写着主角名字的任务牌，内容是‘前往后山入口取回遗失物’。可当你伸手去拿，木牌上的字忽然变成了普通的采药委托。",[["记住刚才的内容","你不再伸手，只把那几个字反复记在心里。",{insight:3}],["接取普通采药委托","你告诉自己可能是眼花。木牌摸上去冰凉，和其他任务牌没有不同。",{mood:1}]]]
          ],
          road:[
           ["寻人告示残片","驿道边的告示栏被雨水泡得发白。一张泛黄的寻人纸露出半张脸，眉眼与你有几分相似。你还没来得及看名字，风便吹起纸角。",[["撕下残片","你把残片塞进袖中。纸背写着一个地址，却只剩下半行。",{item:"note",insight:3}],["让它留在原处","你没有伸手。等风停时，告示已被别的纸盖得严严实实。",{mood:1}]]],
           ["山下人的欲言又止","一位卖茶的老人看见你的弟子牌后，先夸苍玄宗待人好，随后又像想起什么似的闭了嘴。你追问时，他只说山里路远，早点回去总是好的。",[["继续追问","老人摇头不肯多说，只将一包晒干的茶叶塞进你手里，让你路上喝。",{item:"herb",insight:2}],["向他道谢离开","他看着你走远，叹气声轻得像风。",{mood:1}]]]
          ]
         },
         quests:{cult:{title:"夏季修习",target:4,unit:"次功法研习",desc:"完成四次功法修习，让境界稳固在更高层次。",reward:"修习所获：夏日观想札记。"},sword:{title:"完整剑法",target:3,unit:"次剑术演练",desc:"完成三次完整剑术演练，掌握一套基础剑法。",reward:"修习所获：完整剑诀抄本。"},alchemy:{title:"药堂习作",target:3,unit:"次丹术练习",desc:"完成三次炼丹或控火练习，学会处理基础药材。",reward:"修习所获：药堂火候册。"},mission:{title:"外门历练",target:5,unit:"次任务记录",desc:"完成五次任务堂或驿道行动，积累真正的山门外经验。",reward:"修习所获：外门通行牌。"},clue:{title:"宗门见闻",target:5,unit:"条异常记录",desc:"在藏书、药堂、任务堂与驿道间保留五条不能轻易忽略的见闻。",reward:"修习所获：封存的见闻卷。"}},
         days:{2:["新课表","第二个月的第一天，弟子玉册上多出新的课表：藏书阁、炼丹房、外门任务堂与短途历练。清玄真人说，你已经不该只在新弟子居附近活动了。","开始夏日修行"],6:["师尊的安排","师尊替你勾去了任务堂上一块较远的委托，只说那地方不适合你现在去。新的委托已经放在你桌上，内容更轻松，也更安全。","收下任务"],10:["雨夜传讯","夜里，一张无署名传讯符飞到窗前。符上只有一句话：‘别去后山。’等你再看第二遍，墨迹已经散了。","收好符纸"],14:["第一次下山","任务堂批准了你的短途下山许可。山门外的风比你想象中更热，也更自由。有人提前替你准备好了干粮、雨具与回程符。","踏上驿道"],18:["失踪的借阅者","藏书阁值守弟子不小心提到一个名字，随后立刻改口。那正是你在旧借阅册上见过的名字。对方说自己记错了，却没有再看你的眼睛。","记住这个名字"],22:["月末清点","宗门开始统计夏季修习成果。每位弟子都要整理任务记录、修行札记与丹术成果。你发现自己收集的见闻比想象中多。","整理玉册"],26:["夏宴前夕","回廊挂起了金色灯笼。青黛送来新衣，沈惊澜问你明日是否同行，阿九替你把灯点亮。师尊则让人送来一句话：‘明日早些到。’","准备夏宴"],28:["夏宴·空席","夏宴在浓密的夏夜里开始。灯火很暖，桌上摆满灵食。可主角总忍不住注意到角落里那张无人落座的桌席——碗筷齐全，像有人只是暂时离开。","举杯"]}
        };
        
        Object.assign(CH2.places,{swordfield:["外门练剑场","剑","大片青石铺成的练剑场在夏日里微微发烫，剑风与喝彩声从不同方向传来。"],spring:["灵泉静室","泉","半掩在竹影后的静室临着一眼灵泉，水声很轻，连呼吸都显得格外清楚。"],market:["山下晨市","市","下山后的晨市刚刚散去热气，香料、符纸和各色小物在摊位间铺开。"]});
        Object.assign(CH2.actions,{spar:["外门对练","swordfield",2,-3,"你与外门弟子隔着三步举起木剑。对方并没有轻视你，却也没有刻意放慢招式。数次交锋后，你终于在对方收势前看出了破绽。", "senior"],watch:["观摩剑意","swordfield",1,-1,"你坐在练剑场边，看高年级弟子演练完整剑法。剑招快得几乎看不清，唯有最后收剑时，所有声音都像被一起按住。",null],meditate2:["灵泉观想","spring",3,-2,"灵泉水汽绕在静室四周。你将心神沉入一呼一吸之间，原本散乱的灵气慢慢有了清晰的方向。", "master"],restSpring:["调息养神","spring",0,2,"你坐在泉边听了一会儿水声。没有人催促，也没有功课需要立刻完成，心境在短暂的安静里缓缓平复。",null],shop:["采购修行材料","market",0,-1,"你在晨市摊位间比较符纸、药瓶和便宜的灵草。摊主见你穿着苍玄宗弟子服，总会多送一点不值钱的小物。",null],marketTask:["打听山下消息","market",0,-1,"你在茶摊和杂货铺之间听到许多零碎消息。大多数都只是夏日闲谈，偶尔却会有人在提到苍玄宗时突然压低声音。",null]});
        Object.assign(CH2.actionText,{spar:["木剑相击时，震动顺着手腕一路传上来。你本能地想后退，却想起沈惊澜教过的重心，硬是稳住了脚步。对练结束后，对方夸你比看上去更能吃苦。", "练剑场的太阳很烈，汗水顺着额角往下滴。你一次次重新起势，终于把最不熟的那一招连得顺畅了一些。远处有人替你鼓掌，你没有看清是谁。"],watch:["外门弟子的剑意在青石上划出一道浅痕。你看不懂全部，却看得出他们每一次停顿都有原因。你把最印象深刻的一招画进自己的册子，想等以后再慢慢琢磨。"],meditate2:["灵泉边的空气比别处更凉。你闭上眼时，仿佛能听见灵气从石缝与竹叶间慢慢流过。收功后，你的丹田并没有立刻变得充盈，却多了一种久违的清明。"],restSpring:["你把脚边的碎石一颗颗排好，又看它们被泉水溅湿。这样的安静很短，却足够让你重新记起自己原本想成为什么样的人。"],shop:["一位卖符纸的老人夸你眼光好，又偷偷告诉你，真正的隐息符不会在大街上卖。你记下了这句话，连同他摊位角落那串从未点亮的风铃。"],marketTask:["茶摊的客人提到苍玄宗时，先说那里的人最会救人。可当另一个人问起山里那些久不下山的弟子，桌上忽然静了片刻，随后有人笑着把话题转到了天气。"]});
        CH2.explore.swordfield=[["断掉的剑穗","练剑场角落有一枚断掉的剑穗，丝线末端沾着一点已经干掉的深色痕迹。旁边弟子说那只是旧伤留下的污渍，却没有人愿意伸手捡。",[["收进包裹","你将剑穗用纸包好。它比看上去更沉，像吸过很多雨水。",{item:"note",insight:2}],["交给值守弟子","值守弟子很快把它收走，笑着说会有人来认领。你回头时，剑穗已经不见了。",{mood:1}]]],["没有名字的剑谱","兵器架后夹着半页剑谱，开头没有名字，最后一式却被人反复描粗。你看着那一招，莫名觉得它像是为了防止谁离开而写的。",[["抄下最后一式","你把剑招的走向记在册子里，准备以后请教。",{insight:2,item:"note"}],["放回原处","你不愿碰来历不明的东西。风吹过时，纸页仍停在那一式上。",{mood:1}]]]];
        CH2.explore.spring=[["泉底的铜片","灵泉边有一小片铜色反光。你捞起后发现那是一枚磨损的旧弟子牌碎片，只剩下宗门云纹的一角。",[["留下碎片","你将碎片收进袖中。它的边缘被磨得很圆，像曾被人反复摩挲。",{item:"note",insight:3}],["交给静室值守","值守弟子接过后说会处理，却没有问你在哪里找到。",{mood:1,aff:{master:1}}]]],["不该响起的铃声","静室四周并没有风铃，可你观想结束时，分明听见很轻的一声铃响。你睁开眼，只有竹影在水面上摇。",[["循着声音查看","你在后墙发现一道被藤蔓遮住的小门，门上没有锁，也没有通往何处的标记。",{insight:3}],["继续观想","你告诉自己静室太安静，偶尔听错也很正常。",{mood:2}]]]];
        CH2.explore.market=[["旧画像摊","晨市角落有个卖旧书画的摊子。你翻到一张褪色的半身画像，画中人穿着苍玄宗弟子服，眉眼与你有些相似。摊主说这是从旧宅收来的，不知道来历。",[["买下画像","你用不多的灵石换下它。画像背后写着一个模糊的年份。",{item:"note",insight:3}],["询问画中人","摊主想了很久，只说有人曾来找过这张画，后来又匆匆离开。",{insight:2}]]],["不肯多说的行商","一名行商看见你的弟子牌后，主动问你是不是刚从苍玄宗下来。你点头后，他的笑容短暂地停住，随后又塞给你一小包干粮。",[["问他为何沉默","他摇头说只是想起旧事，又低声补了一句：‘若有人让你别回头，千万别立刻照做。’",{insight:3,item:"herb"}],["收下干粮离开","你没再追问，只把那句话记在心里。",{mood:1,insight:1}]]]];
        CH2.days[8]=["剑场邀约","沈惊澜说外门练剑场今日有公开对练，问你要不要一起去看看。他说那里的人剑招更快，也更不讲情面，但看一看总是好的。","前往练剑场"];
        CH2.days[12]=["灵泉开放","夏日灵泉在午后开放半日。清玄真人让人送来静室令牌，说你近来心境不稳，可以去那里调息。令牌背面刻着你的名字，像早就准备好了。","前往静室"];
        CH2.days[16]=["晨市许可","任务堂批下了半日晨市许可。阿九提前将干粮与零钱放在你桌上，纸条上写着：‘别买太重的东西，回山路远。’","下山看看"];
        CH2.days[20]=["剑谱缺页","练剑场值守弟子发现一册剑谱少了半页。沈惊澜问过所有人后，最后看向你，说并不是怀疑，只是想确认你有没有见过异常的纸页。","回想经过"];
        
        CH2.places.reargate=["后山入口","禁","封山石碑后的林路被浓雾遮住，路牌上只写着‘新弟子止步’。风从里面吹来时，偶尔会带出一声不像鸟鸣的轻响。"];
        CH2.actions.nightWatch=["协助夜巡","hall",0,-2,"任务堂在夜里挂出一枚临时木牌：协助检查回廊、传讯石与山门灯火。执事师兄说只是简单差事，却把任务令交得很快。", "senior"];
        CH2.actions.observeGate=["查看封山碑","reargate",0,-1,"你站在封山石碑前辨认上面的旧字。大部分禁令都很普通，只有最下方一行被人用新刻痕补过：‘闻铃勿入。’",null];
        CH2.actions.listenGate=["静听林风","reargate",1,-1,"你没有越过石碑，只在原地闭上眼听风。林中树叶相互摩擦，像有许多人压低声音说话，又像只是夏夜太长。",null];
        CH2.actionText.nightWatch=["回廊的灯一盏盏亮起来，夜巡比白天安静得多。你跟着沈惊澜检查传讯石时，发现有一块石头表面还残留着刚刚熄灭的灵光。可今日的夜巡记录上，并没有任何人使用过它。", "你提着灯走过新弟子居外的长廊。每一扇门后都很安静，只有最尽头那盏灯不管怎么添油都亮得格外微弱。沈惊澜说那是旧灯，明日便会换掉。"];
        CH2.actionText.observeGate=["封山碑的边缘长着一层薄苔。你用袖口擦去一点，发现石碑上曾有更长的一段文字被人削平，只留下零碎笔画。那些笔画不像警告，更像是某个人留下的名字。"];
        CH2.actionText.listenGate=["你听见第二声铃响时，风已经停了。声音很轻，却像从很近的地方传来。等你睁眼，石碑后的雾仍然没有散，连脚印也没有。"];
        CH2.explore.reargate=[["石碑后的脚印","雨后泥土很软，封山碑旁却有一串新鲜脚印从雾里走出来，在石碑前停了很久。脚印没有再往任何方向延伸，像来人只是站在那里等过什么。",[["用树枝量一量脚印","脚印的大小与你差不多。你把长度记进册子，手心却莫名有些发凉。",{insight:3,item:"note"}],["不再靠近","你退回阳光照得到的地方。回头时，那串脚印已经被风吹落的叶子盖住。",{mood:1}]]],["藏在草里的铃铛","石碑附近的草丛里有一只很小的铜铃，表面磨得发暗，系铃的红线却像刚换过。你碰它时没有声音，松手后却听见极轻的一响。",[["把铃铛收起来","你用布包住铃铛放进包裹。布料隔着掌心，仍能感觉到一点不该有的凉意。",{item:"note",insight:3}],["挂回树枝","你将它挂在离石碑较远的树枝上，告诉自己别把别人的东西带走。",{mood:1,insight:1}]]]];
        CH2.missionEvents=[
         {id:"field-scare",keys:["mission"],title:"灵田边的孩子",text:"除虫委托结束时，你看见灵田边蹲着一个山下孩子。他盯着你的弟子牌看了很久，忽然问：‘你是从那座山里出来的吗？那你见过我姐姐吗？’他还没说完，远处的大人便急忙把他拉走，连声说孩子认错人了。",choices:[["追问姐姐的名字","大人脸色发白，说只是一个早已离家的亲戚。可那孩子仍回头看着你，嘴唇无声地重复了一个名字。",{insight:3,item:"note"}],["把糖递给孩子","孩子接过糖，却没有笑。他只小声说：‘她也喜欢甜的。’",{mood:1,insight:2}]]},
         {id:"letter-scare",keys:["mission","travel"],title:"送错的信",text:"送信任务结束后，收信人没有立刻接过信封，而是先问你是哪一位长老门下。听见清玄真人的名字后，他的手指明显收紧。临走前，他忽然叫住你，说这封信本不该由你送来。",choices:[["问他是什么意思","他摇头不肯解释，只把信塞回袖中，低声说：‘你还是快回山吧。’",{insight:3}],["记下他的反应","你没有追问，却把那人说话时反复望向山门的样子记了下来。",{insight:2,item:"note"}]]},
         {id:"night-scare",keys:["nightWatch"],title:"回廊尽头的门",text:"夜巡时，你发现回廊尽头那扇平日紧闭的门开了一道缝。里面没有灯，却传出像翻书一样的细响。沈惊澜在远处叫你，说那边不归新弟子负责。",choices:[["靠近门缝看一眼","门内只有一排整齐的屏风。最靠近门口的屏风后，似乎挂着一件与你弟子服颜色相同的旧衣。",{insight:3,item:"note"}],["立刻回到沈惊澜身边","他看见你回来，明显松了口气，又像什么也没发生般让你继续检查下一盏灯。",{mood:1,aff:{senior:1}}]]},
         {id:"market-scare",keys:["marketTask","shop"],title:"会说错话的行商",text:"晨市里一名行商看见你时，先叫出了一个陌生名字。你纠正他后，他盯着你的脸看了很久，才仓促道歉，说是自己年纪大、认错了人。可他离开前又低声说：‘这次……比上次像得多。’",choices:[["拦住他追问","行商慌忙摆手，说自己只是胡言乱语。等你再转身时，他的摊位已经收得干干净净。",{insight:3}],["假装没有听见","你继续往前走，却发现自己再也无法专心挑选符纸。",{mood:-1,insight:1}]]}
        ];
        CH2.days[11]=["回廊夜巡","任务堂临时增加了夜巡委托。有人说只是夏日湿气重，传讯石容易失灵；也有人说最近总有人半夜听见后山方向的铃声。","接下夜巡"];
        CH2.days[21]=["封山石碑","一名新弟子从后山入口附近回来后病倒了。他说自己只是想捡回被风吹走的纸页，却怎么也说不清后来发生了什么。宗门很快封了那段路，只留下石碑外一小片可供查看的地方。","去看看"];
        
        
        /* chapter2-expanded.js */
        CH2.actionText.study.push(
         "午后的藏书阁静得只剩翻页声。你将吐纳口诀拆成几段，照着注解一遍遍试行，直到窗棂上的光从书页左侧慢慢移到右侧。离开前，值守弟子替你收好书卷，笑说你比许多新弟子都更有耐性。",
         "你借来一部讲灵脉运行的旧书，里面夹着前人留下的叶书签。书签背面写着：‘若觉得路不对，先停下来听听自己。’字迹已经褪色，却被人反复摩挲得很平整。",
         "深夜的书架间仍有淡淡灵光。你原本只想抄完一页心法，最后却顺着旁注找到了三种不同的运气方式。它们没有谁绝对正确，只是都提醒你，修行并非只有一条被指定的路。"
        );
        CH2.actionText.catalogue.push(
         "借阅册的纸边被夏天的潮气卷起。你逐本核对归位，发现一名旧弟子连续七年都借过同一册《山门志》。值守弟子接过册子时，手指在那个名字上停了一瞬，随后自然地翻到了下一页。",
         "你给一批旧卷换上新签。最底层有一本书的还书日期被盖过三次，最后一次的墨印还很新。有人在你身后轻声说别太费眼睛，你回头时，走廊里只剩一扇半开的窗。",
         "整理到傍晚，你把最后一册书放回高架。书脊后掉出一张借书条，上面只写着‘归还人：本人’。没有名字、没有日期，值守弟子却很快将它收走，说这是旧规矩留下的空白条。"
        );
        CH2.actionText.brew.push(
         "你将宁神草按叶片大小分开，再用玉匙一点点压碎。药香渐渐在炉边散开，连呼吸都像被放慢了。成药出炉时，青黛路过看了一眼，说这次的火候已经很会照顾药性。",
         "药鼎里的灵液先是浑浊，随后在你调低灵火后慢慢澄清。你没有急着开盖，而是等它自己安静下来。药堂里有人夸你稳得住，仿佛这比炼成丹药本身更值得高兴。",
         "夏日雷雨压得天色很低。你守着炉火，听见窗外雨声一阵紧过一阵，反而把每一步都做得更仔细。最后收进玉瓶的回灵散泛着柔和光泽，让人看一眼便觉得心安。"
        );
        CH2.actionText.learnPill.push(
         "控火练到手腕发酸时，青黛递来一杯温茶，让你先看看火焰边缘最细的变化。你照她说的去做，果然发现灵火并非静止，而像有自己的呼吸。",
         "药堂今日在讲相冲药性。你记下许多看似琐碎的禁忌，忽然明白为什么一副药里总要留一味缓和之材：并非所有猛烈的东西都要更猛烈地解决。",
         "你跟着药堂弟子辨认晒架上的药材。阳光穿过薄薄的叶脉，投下细碎阴影。玉面婆婆从远处看了你一会儿，笑着说你这双手以后很适合做细致活。"
        );
        CH2.actionText.mission.push(
         "任务堂今日人很多。你从一排木牌中挑出最合适的一块，执事还特意替你核对了路线与时辰。离开时他提醒，若在山下遇见不愿说话的人，不必勉强，苍玄宗向来不让弟子为难。",
         "你接下一桩帮山民修补灵渠的委托。木牌上画着简陋的水纹，背面却刻有一枚很浅的印记。任务堂执事说那只是旧制，可你记得自己曾在另一块失效任务牌上见过同样的图样。",
         "有人拜托你将一只走失的灵雀送回山下。委托很轻，报酬也不多，但灵雀一路都在笼中撞羽。等它看见村口时才终于安静，像那里才是它唯一愿意承认的归处。"
        );
        CH2.actionText.askRumor.push(
         "你把零散的旧案按地点分类，发现许多‘自愿云游’的记录都集中在同一段年份。任务堂的阳光明明很亮，那一摞纸却总像比别处更凉。",
         "一名年长杂役替你搬来新的案卷，说这些东西没人爱看，都是旧事。你顺口问起其中一个名字，他愣了愣，随即笑说自己耳背，什么也没听清。",
         "旧案里夹着一张从未寄出的家书。写信的人说自己在宗门过得很好，字迹却在最后一行突然变得凌乱：‘若你收到这封信，不要来找我。’后面被整齐裁掉了。"
        );
        CH2.actionText.travel.push(
         "下山时，山风把你的衣摆吹得很轻。沈惊澜替你挡开迎面而来的担货人，又在你回头时若无其事地松开手。街边的糖人摊热气腾腾，他问你要不要挑一个最喜欢的。",
         "你们替一户人家送回遗落的药包。老人接过包时连声道谢，又看着沈惊澜的弟子牌感慨苍玄宗果然最会照顾人。沈惊澜没有多解释，只把你往自己身侧带了半步。",
         "归山的石阶在黄昏里显得很长。沈惊澜说今日做得不错，随后将一枚路边买来的小护符塞进你掌心，理由是山下人多事杂，带着总比不带好。"
        );
        CH2.actionText.patrol.push(
         "你沿驿道一块块检查传讯石。大多数都亮得稳定，只有山门外那块总比别处慢半拍回应。你记录下来，负责的弟子却说夏日雷气重，明天自然会好。",
         "路标旁长出几簇野花。你蹲下清理被雨水冲歪的石基，发现有人在背面刻了很小的箭头，方向不是山下，而是回到苍玄宗。你把它擦干净，心里却记住了。",
         "巡查结束时，远处传来一阵铃声。附近没有商队，也没有别的弟子。你循声看去，只见一只白鸟从林间飞起，翅膀掠过山门上方的云。"
        );
        CH2.actionText.spar.push(
         "练剑场的风把尘土吹得很低。你与同门拆了十余招，最后虽被逼退半步，却终于没有像从前那样慌张。沈惊澜在场边点了点头，说这一剑比赢更重要。",
         "你练习收剑时总慢一息，便把动作拆开重来。汗水顺着掌心滑到剑柄上，你却渐渐找到了力道最稳的地方。剑不是为了让人一直向前冲，也该知道何时停下。",
         "黄昏时练剑场的人渐渐散了。你独自把一套基础剑诀走完，最后一式收得很轻，远处却有人替你鼓掌。等你回头，那道身影已经绕到另一边去了。"
        );
        CH2.actionText.watch.push(
         "你坐在练剑场边看同门对招。有人招式华丽，有人只求稳妥，剑光在夏日里一闪一闪。看得久了，你开始分辨每个人在紧张时会露出的细小破绽。",
         "沈惊澜替两名新弟子纠正步法，语气耐心得几乎挑不出错。等人散去，他才问你看懂多少。你说了一处细节，他便笑了一下，像这回答比什么都让他满意。",
         "练剑场外有个年幼弟子反复练同一招。你看他练到手腕发抖，便上前提醒歇一歇。他抬头看你，忽然问：‘师兄师姐是不是都会去很远的地方？’"
        );
        CH2.actionText.meditate2.push(
         "灵泉静室的水声很轻。你坐在石台上调息，直到心跳慢慢和水滴落下的节奏重合。睁眼时，泉面映出你的影子，安静得像从未被任何事惊扰过。",
         "你将杂乱的呼吸一点点拉回正轨。静室外有人路过，却没有进来打扰。那种被尊重的安静原本很舒服，久了却让你想确认：自己究竟独处了多久。",
         "泉雾漫上衣袖时，你忽然想起师尊说过的‘心静则明’。你努力让念头沉下去，却发现有些问题一旦被压住，反而在水声最轻的地方变得更清楚。"
        );
        CH2.actionText.restSpring.push(
         "你在灵泉边泡了一会儿脚，热意从脚踝慢慢往上漫。山风带来草木清气，连肩颈的紧绷也一点点散开。今天不必证明什么，能好好休息也算修行。",
         "泉边放着一只干净木篮，里面有叠好的布巾和一盏温灵茶。没有署名，像是静室一直就会为每个来这里的人准备好。你喝完茶，心情莫名安定下来。",
         "你靠在泉石旁闭目养神。半梦半醒间似乎听见有人在远处叫你的名字，睁眼后却只剩水汽与日光。你没有追出去，只把这件事当成太累后的错觉。"
        );
        CH2.actionText.shop.push(
         "晨市里的摊贩记得你上次买过什么，提前替你留了一束晒好的药草。对方笑说苍玄宗弟子总是好说话，你也被这份熟稔感染，挑了几样实用物件。",
         "你在符纸摊前比了很久。摊主给你讲不同墨料的用途，又悄悄塞来一张折扣符，说是给勤快小修士的添头。纸背却印着一枚很淡的苍玄纹。",
         "买完东西回山时，包裹比来时沉了许多。你翻出一颗被放在角落里的糖，想不起是谁什么时候塞进去的，只好先收好。"
        );
        CH2.actionText.marketTask.push(
         "你替晨市药铺核过一批灵草。掌柜一边夸你细心，一边抱怨近来总有人来问旧货的去向。说到这里他立刻改口，笑着让你多拿一包蜜饯。",
         "一名小贩请你帮忙找回被灵猫叼走的钱袋。你在屋檐上追了半条街，最后从猫爪下救回钱袋。小贩道谢时偷偷问你，苍玄宗是不是也会收没有灵根的孩子。",
         "晨市有户人家请你给病弱老人送药。老人闻到药香后说自己从前也受过苍玄宗照拂，随即又像想起什么似的沉默很久，最后只让你路上小心。"
        );
        CH2.actionText.nightWatch.push(
         "夜巡的灯笼被风吹得轻轻摇晃。沈惊澜走在前面，偶尔回头确认你是否跟上。走到最暗的一段回廊时，他忽然放慢脚步，让自己的影子正好盖住你的。",
         "你们检查到弟子居旁的传讯石时，石面浮起一行短暂的蓝光，像有人刚刚传来一句话。等你看清，上面只剩空白。沈惊澜沉默片刻，说也许是灵力余波。",
         "夜色让熟悉的宗门变得陌生。你听见远处有人轻轻哼歌，旋律却被风切得断断续续。沈惊澜问你有没有听见，你说有，他只说别回头。"
        );
        CH2.actionText.observeGate.push(
         "你绕着封山碑走了一圈，发现碑前摆着一束新鲜白花。花枝上没有名字，也没有祭奠用的纸钱，仿佛送花的人不愿承认自己是在祭谁。",
         "石碑缝隙里夹着半张被雨泡软的符纸。你不敢用力抽，只能把露出的笔画描进册子。那像是一道安神符，却在最末端多了一笔向内收拢的锁。"
        );
        CH2.actionText.listenGate.push(
         "你坐在封山碑外听风，起初只听见虫鸣。过了很久，雾里传来极轻的脚步，停在离你几步远的位置。你没有睁眼，直到那脚步像从未存在过般消失。",
         "第二声铃响之后，石碑上的苔藓似乎动了一下。你屏住呼吸，尝试辨认雾中的灵力流向，却只感到一阵熟悉的、像曾在静室里闻过的安神香。"
        );
        
        CH2.explore.library.push(
         ["夹在批注里的花笺","一本功法注解里夹着一张压平的夏花花笺。背面写着一句很轻的鼓励，末尾却没有署名。你分不清它是赠给谁的，也分不清为什么会被夹在这里。",[["将花笺收好","你把花笺夹进自己的小册子。纸上残留一点淡淡香气。",{item:"note",mood:1}], ["照原样放回","你没有打乱原本的位置，只在心里记下书名。",{insight:2}]]],
         ["高架后的空位","你挪开一摞旧卷，发现书架最里层留着一个刚好能放下一册书的空位。旁边灰尘很厚，唯独这里干干净净，像有人最近才取走过什么。",[["记下索书号","你将附近书卷的编号记下，准备以后再查。",{insight:3,item:"note"}], ["不去碰它","你把书卷推回原处，告诉自己不该随便翻动。",{mood:1}]]]
        );
        CH2.explore.alchemy.push(
         ["熄火后的药鼎","一只无人看守的药鼎仍有余温，鼎底留着一圈极细的白色结晶。你闻不出它属于哪味药材，只觉得香气干净得近乎没有人气。",[["刮下一点结晶","你用纸包好样本，打算找机会辨认。",{item:"note",insight:3}], ["替人盖好鼎盖","你不愿擅动别人的药鼎，只把火口收好。",{mood:1,aff:{sister:1}}]]],
         ["药柜最底层","整理药柜时，你在最底层看见一只没有标签的陶罐。罐口封得很严，旁边却摆着新换的干布。",[["查看封口纹路","封口上有很细的阵纹，不像普通储药用的。",{insight:3,item:"note"}], ["不去打开","你将陶罐放回原处，手指却在衣袖里握紧。",{mood:1}]]]
        );
        CH2.explore.hall.push(
         ["重复的任务牌","任务墙最下方有两块内容完全相同的木牌，连报酬与地点都一字不差。可其中一块的领取日期，比另一块早了整整三年。",[["把日期抄下","你将两块木牌的细节都记下。",{insight:3,item:"note"}], ["交给执事处理","执事接过木牌时笑容没有变，只说旧牌偶尔会没收干净。",{mood:1,aff:{master:1}}]]],
         ["无人认领的包裹","任务堂角落放着一只旧包裹，外面写着一个被划掉的名字。值守弟子说它已经放了很久，却又不许任何人打开。",[["记住名字","你把划痕下残留的笔画记了下来。",{insight:3,item:"note"}], ["问是谁留下的","值守弟子沉默片刻，说那只是一次普通的遗失。",{mood:-1,insight:1}]]]
        );
        CH2.explore.road.push(
         ["山道边的伞","山道旁靠着一把干净的油纸伞，伞柄刻着苍玄宗的云纹。夏日明明无雨，伞面却还沾着新鲜水珠。",[["带回任务堂","你将伞交给执事登记，对方说会替失主保管。",{mood:1,aff:{senior:1}}], ["看一眼伞柄","云纹下还刻着半个被磨平的名字。",{insight:3,item:"note"}]]],
         ["反向的脚印","泥地上有一串脚印从山门方向一路延伸向山下，奇怪的是每一步的鞋尖都朝着山门。",[["沿着脚印走几步","脚印在拐角处忽然中断，像人从那里被直接提走。",{insight:3}], ["记下位置","你在路边做了只有自己看得懂的小记号。",{item:"note",insight:2}]]]
        );
        CH2.explore.swordfield.push(
         ["无人认领的木剑","练剑场边放着一把磨损严重的木剑，剑柄上缠着褪色红绳。没人认领它，却有人每天替它擦去灰。",[["试着握一握","木剑比想象中沉，掌心一瞬间像被陌生人的执念刺痛。",{insight:2,item:"note"}], ["将它放回","你郑重把它摆好，不愿破坏那份无名的等待。",{mood:1}]]],
         ["练剑场的回声","傍晚练剑场空无一人。你挥出一剑，回声却在片刻后从另一侧响起，像有人用同样的招式回应你。",[["再挥一次","第二次回声没有出现，只剩风从剑架间穿过。",{insight:3}], ["离开练剑场","你收剑离开，背后却一直有极轻的脚步声。",{mood:-1}]]]
        );
        CH2.explore.spring.push(
         ["水面上的纸船","灵泉边漂着一只折得很小的纸船。纸上没有字，只画着一扇门和一个朝内的箭头。",[["将纸船捞起","纸船内侧有一枚很淡的传讯印。",{item:"note",insight:3}], ["让它漂走","纸船绕着泉眼转了一圈，最后沉进水里。",{mood:1,insight:1}]]],
         ["被擦掉的刻字","静室石壁上有一块比别处更白的痕迹，像是最近才被打磨过。斜着看时，仍能辨认出半句：‘请不要……’",[["拓下残字","你用炭条拓下残留的纹路。",{item:"note",insight:3}], ["不再细看","你闭上眼继续调息，却总觉得石壁后还有人呼吸。",{mood:-1}]]]
        );
        CH2.explore.market.push(
         ["熟悉的陌生人","卖旧书的老人一见你便说你这次气色好多了。你从未见过他，他却很自然地报出你早已不用的乳名。",[["追问他何时见过你","老人愣住，随即把摊布一卷，说自己只是认错人。",{insight:3}], ["买下旧书","旧书扉页写着一句被划掉的话：‘她又回来了。’",{item:"note",insight:3}]]],
         ["不会融化的糖画","一个孩子递给你一支糖画，说是有人早就替你买好。夏日热得厉害，它却始终没有融化。",[["收下糖画","糖画背面压着一枚很浅的云纹。",{mood:1,item:"note"}], ["问是谁买的","孩子指向人群，那里只剩一片被阳光照亮的空地。",{insight:3}]]]
        );
        
        CH2.missionEvents.push(
         {id:"canal-scare",keys:["mission","patrol"],title:"灵渠里的倒影",text:"修补灵渠时，水面映出你和同行人的影子。可当你低头看去，水里的你比现实慢了一拍抬头，还朝你笑了一下。旁人什么也没看见，只问你为何突然不说话。",choices:[["用手搅乱水面","水纹散开后，一张湿透的任务纸被冲到岸边。",{insight:3,item:"note"},"你把湿纸夹进册子，心里却很难平静。"],["说自己只是走神","同行人笑着让你别太累，随后替你接过一半工具。",{mood:1},"对方的体贴让你无从解释刚才的恐惧。"]]},
         {id:"sleepless-scare",keys:["askRumor","catalogue"],title:"没有写完的名单",text:"你在两份记录中找到同一张名单。第一份的末尾写着‘已妥善安置’，第二份却写着‘仍在等待’。两张纸的墨迹新旧不同，落款却都是同一个人。",choices:[["抄下两份落款","你把细节记进册子，连纸张纤维的颜色都没有放过。",{insight:3,item:"note"},"你决定以后再比对更多旧档。"],["交给值守弟子","对方接过纸张时表情很温和，说会替你查清。",{mood:1,aff:{master:1}},"他把两份记录叠好，收进了你再也看不到的柜中。"]]},
         {id:"herb-scare",keys:["brew","learnPill"],title:"药香之外",text:"炼药结束后，你闻到一缕不属于任何药材的甜香。它从最里侧的药柜飘来，像刚晒过的被褥，又像雨后潮湿的头发。青黛恰好推门进来，问你是不是又忘了休息。",choices:[["告诉青黛自己闻到了什么","她沉默了一瞬，随即替你打开窗，说炉火太久热气会让人闻错味道。",{insight:2,aff:{sister:1}},"她的解释很合理，可她关窗时动作比平日快。"],["假装什么都没闻到","你顺着她的话点头，暗中记住了药柜的位置。",{insight:3,item:"note"},"那缕甜香直到夜里仍像停在衣袖上。"]]},
         {id:"sword-scare",keys:["spar","watch"],title:"缺席的对手",text:"练剑场登记簿上写着今日有一场切磋。你等到日影偏西，也没有等到对手。负责弟子翻了翻簿子，疑惑地说这名字早在三年前便已离山。",choices:[["问他为何还在簿上","负责弟子立刻将簿子合起，说旧页没有抽干净。",{insight:3,item:"note"},"他离开时把簿子抱得很紧。"],["代替对手完成一套剑诀","你独自走完约定的招式，最后一剑落下时，场边传来极轻的一声喝彩。",{mood:-1,insight:2},"你回头时，练剑场仍空无一人。"]]},
         {id:"spring-scare",keys:["meditate2","restSpring"],title:"静室里的第二个人",text:"你在灵泉静室调息时，水声之外忽然传来另一道均匀呼吸。屏风后没有人，门外也没有脚步，只有石台另一侧留着一处尚未散尽的温度。",choices:[["检查石台","你在石缝里找到半截被压扁的弟子牌穗子。",{insight:3,item:"note"},"穗子上的颜色与你如今佩戴的弟子牌很像。"],["继续调息","你强迫自己闭上眼，却总觉得有人在学着你的呼吸频率。",{mood:-1,insight:2},"离开静室时，门外阳光亮得让人恍惚。"]]},
         {id:"road-scare",keys:["travel","marketTask"],title:"认错人的母亲",text:"山下妇人忽然拉住你的手，叫出一个陌生名字。她说自己的孩子也曾穿着苍玄宗弟子服回家，后来却再也不记得家门在哪里。同行人连忙安慰她，说你只是长得相像。",choices:[["记下她说的话","妇人松手后一直望着你，像想说更多，却被家人扶走。",{insight:3,item:"note"},"你将她的话一字不漏写进册子。"],["替她倒一杯水","她喝水时不断道歉，说自己不该让仙门弟子为难。",{mood:1,insight:2},"那句‘为难’让你心里很不是滋味。"]]}
        );
        
        CH2.npcEvents={
         master:[
          {id:"master-schedule",day:4,title:"被替换的委托",text:"清玄真人将一枚新的任务牌放到你桌上，说原本那块太远，不适合你独自前往。他已经替你换成更轻松的委托，连同行人选都考虑好了。",choices:[["追问原委","你没有立刻接受，只把原委仔细问清。",{insight:2,aff:{master:1}},"清玄真人温和地说：‘为师并非不信你，只是不想让你受不必要的苦。’"],["接受安排","你收下新木牌，谢过师尊的周全。",{mood:1,aff:{master:3},obs:{master:2}},"他点头微笑，像终于放下了一件牵挂。"]]},
          {id:"master-rain",day:10,title:"雨夜的灯",text:"夏雨突至，清玄真人命人送来一盏能安神的长明灯。他说你近日心绪起伏，夜里若听见不该听见的声音，不必强迫自己记住。",choices:[["问什么叫不该听见","他看着雨帘沉默片刻，说修行人最怕执念化相。",{insight:3},"他替你拨正灯芯：‘有些声音，本就不该被留住。’"],["收下长明灯","灯光一亮，屋里果然显得安稳许多。",{mood:2,aff:{master:2}},"可那夜你梦见有人隔着门轻轻敲了很久。"]]},
          {id:"master-letter",day:16,title:"未寄出的家书",text:"师尊让你替他誊抄几封寄往山下的回信。其中一封没有收件人，内容却写着‘令爱在山中一切安好’。你还未看完，他便自然地收走了那张纸。",choices:[["问这封信寄给谁","他笑说是旧年模板，不必放在心上。",{insight:3},"他的语气平静得像你只是问了一句天气。"],["低头继续誊抄","你没有再看，却记住了那行工整的字。",{aff:{master:1},item:"note"},"他夸你知分寸，目光却停得比平时久。"]]},
          {id:"master-autumn",day:24,title:"提前的嘉奖",text:"距离夏宴尚有数日，清玄真人却先赐下一枚内门候选令牌。他说你已做得足够好，不必再把自己逼得太紧。",choices:[["询问是否能晚些接受","他并不生气，只问你是不是还想去那些危险的地方。",{insight:3},"那一刻你忽然觉得，这块令牌比想象中更沉。"],["郑重收下","令牌灵光温润，握在掌心很让人安心。",{mood:2,aff:{master:3},obs:{master:2}},"师尊说，苍玄宗永远会给你留位置。"]]}
         ],
         senior:[
          {id:"senior-sugar",day:5,title:"山下的糖画",text:"完成驿道任务后，沈惊澜在摊前停下，替你买了一支糖画。他说山下人多，别走散了，随后又像只是顺手般替你收好任务令。",choices:[["问他为何记得","他笑了一下，说只是看你每次路过都会多看两眼。",{mood:1,aff:{senior:3}},"他把糖画递给你时，指尖避得很克制。"],["自己收好任务令","你接回木牌，说下次会更留心。",{insight:2,aff:{senior:1}},"沈惊澜没有坚持，只说那便更要记得叫他同行。"]]},
          {id:"senior-night",day:12,title:"夜练后的回廊",text:"夜巡结束后，沈惊澜没有立刻离开。他说你今日在回廊前停得太久，若真觉得不安，可以再陪你走一遍。灯影把你们的影子拉得很长。",choices:[["请他陪自己去","他一路都走在你外侧，直到那扇门前才停下。",{mood:1,aff:{senior:3},insight:2},"他说：‘你要看，我就在这里。’"],["说自己已经没事","他看了你一会儿，最后只将灯笼交给你。",{aff:{senior:1}},"灯笼很暖，像刚被人握了很久。"]]},
          {id:"senior-sword",day:18,title:"剑穗上的旧痕",text:"沈惊澜替你换剑穗时，袖口滑下一截旧红绳。那绳结与练剑场无人认领木剑上的一模一样。他很快收起，说只是旧物。",choices:[["追问红绳的来历","他沉默很久，只说那是一个没能回来的人留下的。",{insight:3,aff:{senior:1}},"他抬眼看你：‘别再像他那样一个人往前走。’"],["不再追问","你替他把袖口整理好，假装没有看见。",{mood:1,aff:{senior:2}},"沈惊澜道谢时，声音比平时低。"]]},
          {id:"senior-rain",day:25,title:"雨中的伞",text:"回山时骤雨落下，沈惊澜将伞偏向你，自己半边肩膀很快湿透。他说剑修没那么娇贵，等你想把伞推回去，他却握住伞柄不肯让。",choices:[["靠近一些","你们在伞下走得很近，雨声把许多没说出口的话都盖住。",{mood:2,aff:{senior:3}},"他低声说：‘这样就够了。’"],["坚持把伞分好","他看着你笑，说你总有自己的坚持。",{insight:2,aff:{senior:1}},"回到山门时，你仍发现他衣袖上有雨水未干。"]]}
         ],
         sister:[
          {id:"sister-sachet",day:6,title:"夏日香囊",text:"青黛替你配好一只新香囊，里面的花草都是她按你的习惯挑的。她说你近来修行辛苦，连睡觉时也该闻些让人安心的味道。",choices:[["问她为何知道习惯","她笑说照看人久了，自然会知道。",{mood:1,aff:{sister:3}},"她替你系好香囊：‘我知道什么最适合你。’"],["先收进包裹","你谢过她，说想自己挑时间佩戴。",{insight:2,aff:{sister:1}},"青黛没有勉强，只问你夜里若睡不好要记得来找她。"]]},
          {id:"sister-potion",day:13,title:"不在药典里的方子",text:"青黛请你协助试一副新方。药汤颜色很淡，闻起来却让人想起雨后的草木。她说只是用来安神，问你愿不愿意先尝一口。",choices:[["先问清药材","她耐心列出大部分药材，却在最后一味时停顿了一下。",{insight:3,aff:{sister:1}},"她轻声说：‘那一味对你不会有害。’"],["相信她喝下","药汤入口微甜，心绪很快平静下来。",{mood:2,aff:{sister:3},obs:{sister:2}},"醒来时，窗外已经换了灯。"]]},
          {id:"sister-burn",day:20,title:"炉火旁的手",text:"你帮青黛收炉时不慎被烫到。她立刻握住你的手腕，灵力一点点压下灼痛。她的动作很轻，却始终没有立刻松开。",choices:[["让她继续","药香与炉火的热意将疼痛慢慢压下。",{mood:2,aff:{sister:3}},"她低声说以后别一个人做太危险的事。"],["说自己可以处理","她替你包好伤处，笑着说你总是太逞强。",{insight:2,aff:{sister:1}},"你转身时，仍能感觉到手腕上残留的温度。"]]},
          {id:"sister-sleep",day:26,title:"药庐的午后",text:"青黛说你近来眼下有些青，执意让你在药庐歇一会儿。窗外蝉鸣很长，她在不远处研药，像是在守着你入睡。",choices:[["安心睡下","你醒来时她仍在原处，桌上多了一碗温热的粥。",{mood:2,aff:{sister:3}},"她说幸好你这次没有做噩梦。"],["坚持不睡","她没有再劝，只把窗打开一些，让风吹散药香。",{insight:3,aff:{sister:1}},"你看见她将一只无标签药瓶悄悄收进柜中。"]]}
         ],
         ajiu:[
          {id:"ajiu-notice",day:7,title:"被撕掉的告示",text:"阿九在驿道边看见你时，手里正攥着一张被撕下的旧告示。他很快将纸藏到身后，说只是无用的废纸，不想让你沾上灰。",choices:[["请他给自己看","他迟疑很久，最后只让你看见一个被划掉的名字。",{insight:3,aff:{ajiu:1},item:"note"},"阿九说：‘看了也别急着信。’"],["接受他的好意","你说自己不想为旧纸烦心。",{mood:1,aff:{ajiu:3},obs:{ajiu:2}},"他把纸撕得更碎，却没有立刻扔掉。"]]},
          {id:"ajiu-lantern",day:14,title:"廊下留灯",text:"夜里回房时，阿九在廊下留了一盏小灯。他说这段路最近总有人说看不清，便顺手多添了些灯油。灯罩内侧贴着一张极小的避影符。",choices:[["问避影符从何而来","他低头说是以前学来的小把戏，不值一提。",{insight:3,aff:{ajiu:1}},"他说完便催你快些回房，像怕灯火熄灭。"],["收下小灯","你把灯提回房，灯光一直亮到天明。",{mood:2,aff:{ajiu:3}},"第二天阿九问你睡得可好，像一夜都在等答案。"]]},
          {id:"ajiu-key",day:21,title:"旧屋的钥匙",text:"阿九在后山入口等你，递来一枚锈旧钥匙。他说若哪天你真的想知道那些告示写了什么，这把钥匙也许能打开一点答案。",choices:[["立刻收下钥匙","钥匙冰凉，握久了却像有一点微弱温度。",{insight:3,aff:{ajiu:3},item:"note"},"阿九说别让任何人看见它，尤其别让师尊知道。"],["问他为什么相信自己","他笑得很淡，说因为你还会问为什么。",{mood:1,aff:{ajiu:2}},"那句话比钥匙更让你难以忘记。"]]},
          {id:"ajiu-storm",day:27,title:"风暴前的约定",text:"封山碑附近的风忽然大起来。阿九替你按住被吹乱的册页，说若哪天所有人都劝你留下，你也该记得自己原本想去哪里。",choices:[["答应会记住","他看着你，像终于松了一口气。",{mood:1,aff:{ajiu:3},insight:2},"他把你的册页一张张压平，动作很慢。"],["问他会不会一起走","阿九没有立刻回答，只说你先别轻易相信任何承诺。",{insight:3,aff:{ajiu:1}},"远处山门钟响了一声，像在替谁打断谈话。"]]}
         ]
        };
        
        CH2.npcDialogue={
         master:["清玄真人问你今日课业是否顺利，又说修行不该只靠苦熬，若心中有事尽可来问他。","师尊替你看过玉册，夸你近来进境稳妥。他没有问你为何常去任务堂，只提醒后山近日风大。","清玄真人让人送来新抄的心法，说其中几页特意按你的灵根做了标记。那份周全让人很难拒绝。"],
         senior:["沈惊澜问你今日要不要去练剑场。他说自己正好有空，若你想下山也可以一道。","大师兄从任务堂出来，顺手替你接住被风吹走的任务纸。他看了一眼内容，问你是否需要同行。","沈惊澜说你近来总往藏书阁跑，别把眼睛看坏了。说完便递来一包山下买的清凉糖。"],
         sister:["青黛看了看你的脸色，问你是不是又忘了按时休息。她说药庐今日炖了清暑汤。","师姐替你理好被风吹乱的衣领，笑说山下尘气重，回来后最好先换一身衣裳。","青黛问你最近有没有做怪梦，语气很轻，像只是例行问诊。"],
         ajiu:["阿九把一叠符纸放在廊下，说领多了，放着也是浪费。","他问你今晚是否还要去任务堂，随后又补充说那里最近收得早，别太晚回来。","阿九说后山的路被雨冲坏了一段，若你非去不可，最好先来找他认路。"]
        };
        
        Object.assign(CH2.days,{
         3:["夏日课表","内门讲堂贴出新的夏日课表。剑、丹、符、体四类修习排得很满，师兄师姐都说这是为了让你尽快找到适合自己的路。","查看课表"],
         5:["山下小市","任务堂传来消息，山下晨市要办小集，弟子可趁空闲补齐修行物资。沈惊澜说若你想去，他正好也有任务在那一带。","前往晨市"],
         7:["夜雨","傍晚突降夏雨。弟子居外的灯一盏盏亮起，有人说这样的夜最适合静修，也有人说最好别一个人走太远。","留意夜色"],
         9:["剑场比试","外门练剑场举行小比，胜负不记入正式考核，却能让人看见自己这段时日究竟学会了什么。","去看看"],
         13:["药庐试方","炼丹房公开征集试方助手。青黛托人问你要不要来，说只是些安神温补的药，不会太累。","前往药庐"],
         15:["借阅册清点","藏书阁要清点一批多年无人归还的旧卷。值守弟子说只是例行整理，语气却比平时更希望大家别多问。","协助清点"],
         17:["灵泉静修","连续高温让不少弟子心浮气躁，宗门开放灵泉静室供人静修。清玄真人特意叮嘱你，不必把每件事都想得太明白。","前往静室"],
         19:["驿道急信","山下送来一封急信，需要弟子尽快送到晨市。阿九说自己知道一条更快的路，但那条路不在平常地图上。","准备出发"],
         23:["夏夜灯会","宗门在回廊挂起灯笼，让弟子们暂歇半日。每个人都说这是难得的轻松时刻，偏偏最尽头那盏灯始终没有点亮。","去看灯"],
         25:["雨后封径","后山入口的石碑被雨洗得格外干净。有人说那里不久前出现过陌生脚印，宗门却只让弟子绕路。","远远看看"],
         27:["夏宴预备","夏宴将近，任务堂开始整理本月修行记录。你被提醒尽快补齐课业，也有人悄悄问你是否还保留着不该留的纸片。","整理玉册"]
        });
        
        /* chapter3-data.js */
        const CH3={
         title:"第三章 · 秋隐",
         places:{
          lecture:["内门讲法台","讲","秋日的讲法台前坐满候选弟子。每一句教诲都温和、正确，像早已替你写好答案。"],
          sword:["剑冢外环","剑","残剑埋在枯叶与石缝间。风经过时，剑鸣像有人在很远处压低声音呼唤。"],
          herb:["百草园深处","药","草木在秋霜前仍旺盛得不合时宜。药圃尽头有一排从不对弟子开放的暖棚。"],
          talisman:["符阁偏室","符","偏室堆着旧阵图与退还的符纸。墙上的符灯总比别处暗半分。"],
          array:["阵枢台","阵","护山阵的灵线汇聚于此，像一张覆盖整座山门、缓慢收紧的网。"],
          rear:["后山封径","封","封山碑后的雾比夏日更浓。每次走近，你都觉得有人刚从雾中退回去。"]
         },
         actions:{
          lecture:["听讲记要","lecture",1,-1,"你将讲法台上的重点一一记下。每个人都说，只要遵循前人的路，便不会走错。"],
          debate:["秋试答辩","lecture",1,-2,"你在众目注视下解释自己的修行理解。问题并不难，难的是每个答案似乎都已有标准。"],
          spar:["剑冢试剑","sword",1,-2,"你在残剑之间练习收放剑意。剑鸣时近时远，像在替谁回答。"],
          trace:["辨认剑痕","sword",0,-1,"你沿着石壁辨认旧剑痕，试着从被磨去的笔画里找回名字。"],
          forage:["辨药入册","herb",1,-2,"你将秋季药材按性状入册，暖棚方向始终飘来一缕不该存在的甜香。"],
          refine:["协助炼丹","herb",1,-2,"药炉里火候平稳，青黛却让你记住每一味药的来处。"],
          copy:["誊抄旧符","talisman",1,-1,"符纸上的线条反复回折，像有人想把一扇门严丝合缝地封住。"],
          archive:["检索旧档","talisman",0,-1,"你在封存的旧档里检索被退回的阵图和无人认领的弟子牌。"],
          tune:["推演阵线","array",1,-2,"你沿阵枢灵线推演，发现每一条线最终都回到同一个看不见的中心。"],
          mask:["遮掩行踪","array",0,-2,"你用符与阵的间隙掩去自己的足迹。短暂自由总要付出代价。"],
          investigate:["夜探封径","rear",0,-3,"你在宵禁后靠近封山碑，雾里传来与你步伐完全同步的脚步声。"],
          rest:["静坐收心","rear",0,2,"你在离雾较远的石阶上静坐，提醒自己先分清恐惧与直觉。"]
         },
         actionText:{
          lecture:["讲法台上讲的是最基础的心法，可台下每个人都听得格外认真。你忽然意识到，众人并非在听如何修行，而是在听如何成为一个被认可的弟子。","散课时，清玄真人夸你记得仔细。风吹起纸页，你看见自己写下的最后一句话是：‘不要偏离。’你不记得何时写过它。","你将今日笔记誊清，发现同一道问题被三位讲师给出同一种答案。那答案没有错，只是太像早已准备好。"],
          debate:["有人问你何为道心。你回答应当由自己选择，台上长老沉默片刻，随即笑着说这是很有朝气的答案。","答辩结束后，负责记录的弟子替你补齐了几句措辞。字更工整，也更像宗门想听见的内容。","你在辩题中提到后山，场内一瞬安静。随后长老换了话题，仿佛那两个字从未被说出口。"],
          spar:["残剑映着薄阳。你一式式练到掌心发热，忽然有一道陌生剑意替你补全收势。回头时，枯叶间没有人。","沈惊澜站在剑冢边替你看招，夸你比夏日稳得多。可他说完又补了一句：稳一点，才不会走到回不来的地方。","你从石缝拔出半截断剑，剑身刻着模糊名字。它在你手中震了片刻，像终于等到有人认出它。"],
          trace:["剑痕被风霜磨浅，只有最用力的几笔仍留在石上。你描出一个名字的偏旁，却发现它与任务堂旧档中的笔迹相同。","你在残剑旁找到一条褪色红绳。它与沈惊澜袖口藏着的那截很像，只是结打得更紧。","有些剑痕并非练剑留下，而像有人在被拖走时拼命用剑尖刻下。你没有告诉旁人这个判断。"],
          forage:["百草园的秋露沾湿鞋面。你辨认出几味常见药草，却总觉得暖棚里那股甜香在跟着你。","一株药草的叶片上覆着极细的白霜，明明还未到霜降。青黛说这是灵气所致，随后亲手将它剪下收走。","你将药材编号记入册子，发现其中一项的供给量远超过公开炼丹所需。账册最末只写着：‘静修用。’"],
          refine:["炉火映在青黛眼里。她让你别急着看结果，先学会等药性自己归位。可你在等待时听见炉内像有人轻轻叹气。","成丹后，青黛替你擦去指尖药灰。她问你昨夜是否又做梦，语气自然得像早就知道答案。","你从药渣里辨出一味未写进方子的材料。青黛没有否认，只说那一味只会让人睡得更安稳。"],
          copy:["旧符的笔势细密得近乎苛刻。你写到最后一笔时，纸面忽然多出一道向内收拢的锁纹。","符阁偏室没有窗，时间在这里变得很慢。你抬头时，墙上符灯已经换过一次，却不记得是谁进来换的。","一张退还符纸背后写着一串日期，间隔恰好都是七日。最后一个日期，正是今天。"],
          archive:["旧档里夹着被退回的弟子牌。每一块牌都说持有人自愿离山，可背面的阵纹却还在微弱发亮。","你找到一册被撤回的阵图，批注写着：‘对象稳定，记忆可复位。’后半句被整齐裁掉。","值守弟子看见你手里的旧档，笑着替你换来一摞更适合秋试的书。他没有问你想不想换。"],
          tune:["阵枢台的灵线像无数细丝缠上指尖。你每推演一步，远处山门的钟便轻响一声。","你发现护山阵并不只向外防御，有几条灵线正缓慢朝内收缩。阵师说那是稳定灵气的必要措施。","阵盘中央映出一行短暂光字：‘归位。’你眨眼后，那两个字便被正常阵纹覆盖。"],
          mask:["你将自己的灵力痕迹藏进阵线空隙。短暂的安静令你松了口气，也让你更清楚自己平时被看得多么清楚。","符纸燃尽后，阵枢台上的记录少了一行。你知道这会让人起疑，却还是将那份旧档藏进衣内。","你学会把足迹折回原处。回头时，地上却还有一串不属于你的脚印，正好叠在你留下的路径上。"],
          investigate:["雾里有一扇不该存在的门。你靠近时，它已经半掩着，门内传来熟悉的讲法声，像讲法台仍在上课。","封山碑后留下新鲜花束。花下压着一张字条：‘别再来。’笔迹与你自己的很像。","你在雾中听见有人叫你的乳名。那是你入山前才有人会叫的名字，声音却来自苍玄宗深处。"],
          rest:["你闭目调息，强迫自己数清每一次呼吸。数到第十次时，远处有人也跟着数到了十。","雾没有靠近。正因如此，你才更不安：它像知道你希望它不要靠近。","你把今日见闻重新整理，删去了最像梦的一句。可册页翻回去时，那句话又出现在原处。"]
         },
         explore:{
          lecture:[["被改写的答卷","一份旧秋试答卷夹在讲义里。原本的回答被墨线划去，旁边用更端正的字改成了另一种说法。",[["抄下两种答案","你把差异记进证据册。",{insight:2,item:"note"}],["交回讲义","讲师称赞你知规矩，顺手收走了整份答卷。",{mood:1,attention:1}]]]],
          sword:[["刻到一半的名字","剑冢石壁上有个名字只刻到一半，最后一道笔画像被人强行掐断。",[["拓下剑痕","炭纸上浮出一道与任务牌相同的纹样。",{insight:3,item:"note"}],["请沈惊澜辨认","他沉默许久，只说别在这里久留。",{aff:{senior:2},attention:1}]]]],
          herb:[["暖棚里的花","封闭暖棚里开着一丛不合时令的白花，花瓣边缘泛着与弟子牌相同的微光。",[["取一片花瓣","花瓣碰到掌心后很快化成一点温热灵光。",{insight:3,item:"note"}],["把门重新合好","你不想惊动看守，只记下暖棚位置。",{insight:2}]]]],
          talisman:[["封存名单","符阁柜底有一份封存名单，最下方的名字被黑符覆盖。",[["用灵力照出字迹","黑符下露出半个熟悉的姓氏。",{insight:3,item:"note"}],["不破坏封符","你将柜门合上，记住了封符走向。",{insight:2}]]]],
          array:[["向内的阵线","阵枢台下有一条灵线没有向外延伸，而是穿过石阶，通往弟子居方向。",[["描下阵线","你把走向压进证据册。",{insight:3,item:"note"}],["假装没看见","阵师朝你点头，像在感谢你的体贴。",{mood:1,attention:-1}]]]],
          rear:[["雾中的弟子牌","你在雾边捡到半块旧弟子牌，牌上名字被磨去，背面却还温热。",[["收进证据册","你把牌用符纸包好。",{insight:3,item:"note",attention:1}],["放回原处","你退开几步，雾里随即传来一声极轻的叹息。",{mood:-1,fracture:1}]]]]
         },
         quests:{trial:{title:"秋试课业",target:7,unit:"次",desc:"完成讲法、答辩与基础修行。",reward:"获得秋试资格"},specialty:{title:"道途专精",target:9,unit:"次",desc:"在剑、丹、符、阵四项中留下自己的理解。",reward:"专精评价提升"},evidence:{title:"证据整理",target:6,unit:"份",desc:"取得并保留可信物证。",reward:"证据板完整度提升"},stealth:{title:"隐秘行动",target:4,unit:"次",desc:"在不惊动师门的情况下完成调查。",reward:"降低暴露风险"}},
         npcEvents:{
          master:[{id:"master-3-1",day:5,title:"提前写好的评语",text:"清玄真人将你的秋试评语递来，让你先看。他说只是鼓励，可其中连你尚未完成的答辩结果都已写得清清楚楚。",choices:[["问为何会提前写好","他温和地说好弟子的路本就不难预见。",{insight:3,attention:1},"他收回玉册，像没有察觉你的迟疑。"],["收下评语","你得到一份几乎完美的评价。",{mood:2,aff:{master:3},attention:2},"纸上的字漂亮得让人安心。"]]}],
          senior:[{id:"senior-3-1",day:8,title:"剑冢的旧红绳",text:"沈惊澜在剑冢边找到那截旧红绳，终于承认它属于一位离山的师兄。他却不肯说那人为何离开。",choices:[["坚持追问","他低声说：‘知道得太多，不会让你更自由。’",{insight:3,aff:{senior:1}},"他的手指将红绳攥得很紧。"],["暂且放下","你没有逼他，只说等他愿意时再讲。",{mood:1,aff:{senior:3}},"他看你的目光更复杂了。"]]}],
          sister:[{id:"sister-3-1",day:12,title:"暖棚外的药香",text:"青黛在暖棚外拦住你，说里面的药材尚未稳定，不该让你靠近。她袖口沾着与你在棚外闻到的一模一样的甜香。",choices:[["请她说实话","她安静了很久，最后只说有些药是为了让人忘记疼。",{insight:3,aff:{sister:1}},"她的声音很轻，像在求你不要再问。"],["相信她的照顾","她替你理好衣领，带你离开暖棚。",{mood:2,aff:{sister:3},attention:1},"你回头时，看见暖棚里似乎站着一个人影。"]]}],
          ajiu:[{id:"ajiu-3-1",day:16,title:"不在地图上的门",text:"阿九带你绕到后山一扇石门前，说这条路不是第一次出现，却每次都只让少数人看见。门后传来宗门钟声，方向却与山门相反。",choices:[["和他一起记下位置","阿九将门缝里的灰拓进你的册子。",{insight:3,aff:{ajiu:3},item:"note"},"他说别把这页交给任何人。"],["劝他先离开","他点头，却在转身时将钥匙塞进你掌心。",{mood:1,aff:{ajiu:2}},"钥匙上有新鲜的温度。"]]}]
         },
         days:{4:["秋试名单","内门公布秋试名单。你的名字被排在前列，旁边还有一行小字：‘已获特别留意。’","查看名单"],9:["封存档案","符阁临时封存一批旧档，值守弟子说只是为秋试腾出地方。","前往符阁"],15:["阵枢异响","夜里护山阵忽然连响三次。第二天所有人都说只是秋雷。","前往阵枢台"],22:["后山宵禁","后山提前宵禁，阿九却托人带来一句话：今晚的雾不一样。","留意封径"],29:["秋试终场","最后一轮秋试开始。宗门希望你交出所有不合规记录，以换取一份没有瑕疵的未来。","整理证据"]}
        };
        
        /* chapter3-expanded.js */
        CH3.actionText.lecture.push("秋风掠过讲法台下的席位，空出来的那一张始终没有人坐。讲师讲到‘守心’时，所有弟子一同低头记笔记，整齐得让你觉得像某种练习。", "散课后，有人将你的答辩提纲送回。纸上多出一行批注：‘此处不必展开。’你分明没有把那一段交给任何人。\n");
        CH3.actionText.debate.push("长老问你若发现宗门旧制有误，会如何处置。你刚说出‘先求证’，台上便有人替你补全后半句：‘再交由宗门定夺。’掌声来得很及时。", "轮到最后一题时，窗外有落叶撞上窗纸。你忽然想起后山石门，停顿得比该有的更久。记录弟子落笔时，将这段停顿写成了‘心境澄明’。\n");
        CH3.actionText.spar.push("枯叶被剑气卷起，又在你收势时落回原处。你练到第三遍，石壁上的旧剑痕像忽然亮了一下，仿佛有人隔着很多年纠正你最后一招。", "一名候选弟子向你请教剑诀。他夸你进境极快，随后小声问你是否也觉得夜里练剑场总有人。等你追问，他却笑说只是玩笑。\n");
        CH3.actionText.trace.push("你用指腹沿着剑痕轻触，摸到一道藏在石缝里的阵纹。它不是保护剑冢的阵法，而像专门用来让某些刻痕逐渐消失。", "残剑间有一块石碑被人擦得很干净，碑上没有名字，只有一句‘已得善终’。你站了很久，也没想明白谁会替别人写下这句话。\n");
        CH3.actionText.forage.push("你将采来的药材平码进竹篮。暖棚方向传来极轻的咳嗽，等你回头，只见青黛正站在棚门外，问你是不是听错了。", "一只灵蝶停在白花上，翅膀边缘泛着弟子牌的微光。它飞进暖棚后再也没有出来，像被里面的温度吞没。\n");
        CH3.actionText.refine.push("药液在鼎中慢慢收束，表面映出你与青黛的影子。影子里的她比现实更早抬头，像已经知道你要问什么。", "青黛让你把成丹送去静修院。门口弟子接过丹瓶时没有看标签，只看了一眼你的脸，随后很快把门合上。\n");
        CH3.actionText.copy.push("符纸堆里有一张废符反复被人折过。你展开时看见上面画的不是门锁，而是一双闭上的眼睛。", "你写到最后一笔，桌上的符灯忽然齐齐暗了一下。再亮起时，刚完成的符纸已经被人替你压进了封存盒。\n");
        CH3.actionText.archive.push("旧档的页码被人重新编过。你比对了半日，发现缺掉的部分正好对应几位‘自愿云游’弟子的最后记录。", "值守弟子给你端来热茶，说查旧档太伤神。茶香很熟悉，像夏日药庐里那种让人一觉睡到天亮的药。\n");
        CH3.actionText.tune.push("阵盘上每一条灵线都在震动，只有一条安静得不合常理。你顺着它推演，尽头落在自己弟子居的方向。", "你试着逆转一小段阵线，脚下石台便传来极低的回响。像整座山都在提醒你，不要擅自改动它早已安排好的东西。\n");
        CH3.actionText.mask.push("你把符纸烧成灰，灰烬沿阵线缝隙飘散。片刻后，自己的记录真的从阵盘上消失了，可旁边多出一条陌生的空白。", "遮掩结束时，阿九在远处等你。他没问你做了什么，只说今晚别回弟子居太早，有人正在逐间查灯。\n");
        CH3.actionText.investigate.push("雾中石门的缝隙比昨日更宽。你听见里面有人平静地念着你的名字，一遍遍念到与自己的心跳重合。", "你在封径边发现一盏刚熄灭的灯。灯油尚温，灯罩内却贴着一张写有你生辰的避影符。\n");
        CH3.actionText.rest.push("你把证据册摊在膝头，逐条检查哪些是亲眼所见、哪些来自别人转述。越整理，越发现某些最关键的句子没有任何来源。", "夜风将远处钟声吹得断断续续。你告诉自己明日再查，可手指却在无意识间把石门的位置写在了掌心。\n");
        
        CH3.explore.lecture.push(["无人坐过的席位","讲法台最前排有一张席位比旁边都新，蒲团却已被压出长久有人跪坐的痕迹。",[["查看席下","你摸到一枚被磨平的弟子牌角。",{item:"note",insight:3}],["不惊动旁人","你记下席位位置，听见身后有人轻轻叹气。",{insight:2,fracture:1}]]]);
        CH3.explore.sword.push(["风里的应答","你在剑冢试着念出残剑上的名字，远处竟有剑鸣回应。",[["追着剑鸣走","你找到一截被埋进枯叶的红绳。",{item:"note",insight:3}],["立刻停下","沈惊澜很快出现，问你刚才叫了谁的名字。",{attention:1,aff:{senior:1}}]]]);
        CH3.explore.herb.push(["暖棚后的水沟","暖棚后的水沟流着微温的水，水面浮着几片褪色符纸。",[["捞起符纸","符纸上写着模糊的静修编号。",{item:"note",insight:3}],["洗净手离开","水温让你想起药汤入口的甜味。",{fracture:1,mood:-1}]]]);
        CH3.explore.talisman.push(["被封起的回信","符阁偏室的夹层里有一封未寄出的回信，封口落着师尊印记。",[["拓下封印","你记住了印记和收信地址。",{item:"note",insight:3}],["放回原处","封口在你松手后自行贴紧。",{attention:-1,insight:1}]]]);
        CH3.explore.array.push(["阵盘里的影子","阵盘表面没有映出天空，映出的却是弟子居一扇扇紧闭的门。",[["记录画面","其中一扇门上浮出你的名字。",{item:"note",insight:3,fracture:1}],["关闭阵盘","画面熄灭前，你看见有人从门内抬头。",{mood:-1,fracture:1}]]]);
        CH3.explore.rear.push(["门后的课表","石门缝里飘出一张新的课表，上面写着你未来三年的每一日安排。",[["将课表藏起","纸上最后一页写着：‘不再外出。’",{item:"note",insight:3,attention:1}],["让风吹走","纸张被雾吞没，像从未存在过。",{fracture:1,insight:1}]]]);
        
        CH3.npcEvents.master.push({id:"master-3-2",day:20,title:"静修院的空床",text:"清玄真人带你经过静修院，主动说那里只收心境不稳的弟子。你却透过半开的门看见一张铺得整整齐齐的空床，床头挂着一块和你一模一样的弟子牌。",choices:[["询问那是谁的床","他替你关上门，说那只是为每位弟子预备的安心处。",{insight:3,attention:1},"门合上时，里面传来很轻的一声铃。"],["说自己想先离开","他没有阻拦，只问你是否真的休息够了。",{aff:{master:1},fracture:1},"他的温和让你几乎觉得是自己太多疑。"]]});
        CH3.npcEvents.senior.push({id:"senior-3-2",day:21,title:"不肯出鞘的剑",text:"沈惊澜将一把旧剑交给你，剑却始终无法出鞘。他说这把剑认得一位离山的人，也许你能让它记起更多。",choices:[["尝试以灵力唤醒","剑鞘里传来一句极轻的话：‘别信他。’",{insight:3,item:"note",aff:{senior:1}},"沈惊澜的脸色在那一瞬变得很白。"],["把剑还给他","他收剑时说你做得对，别让旧物牵着走。",{mood:1,aff:{senior:3}},"他看起来像松了口气。"]]});
        CH3.npcEvents.sister.push({id:"sister-3-2",day:23,title:"忘梦的药",text:"青黛坦白药庐确有一种能让人忘记噩梦的药。她说自己从未想用在你身上，除非你亲口求她。",choices:[["问她是否给别人用过","她没有否认，只说有些人宁愿忘记。",{insight:3,aff:{sister:1}},"她的指尖在药瓶上停得很久。"],["请她把药收好","她点头，将药瓶放回最深的柜中。",{mood:1,aff:{sister:3}},"你却记住了柜门合拢时的声音。"]]});
        CH3.npcEvents.ajiu.push({id:"ajiu-3-2",day:25,title:"雾里来信",text:"阿九在雾边等你，递来一封没有署名的信。信里只有一句：‘带着证据的人，会被送去最安静的地方。’",choices:[["与他一起藏好信","你们将信拆成两半，各自收起。",{insight:3,item:"note",aff:{ajiu:3}},"阿九说这样至少不会有人一次拿走全部。"],["问他要不要一起离开","他看着雾，很久才说等你真的准备好。",{mood:1,aff:{ajiu:2}},"他没有答应，也没有拒绝。"]]});
        
        Object.assign(CH3.days,{6:["剑冢落叶","剑冢外环落叶堆得很厚，负责清扫的弟子说今年总有剑从土里自己露出来。","前往剑冢"],11:["暖棚封锁","百草园深处临时封锁，青黛说只是药性不稳，别靠近。","远望暖棚"],18:["答辩重写","秋试答辩记录被退回，要求你用更‘妥当’的措辞重写。","查看评语"],26:["雾线北移","后山雾线越过封山碑，弟子居外也开始有人听见不属于自己的脚步声。","留意夜色"]});

        CH3.npcDialogue={
         master:["清玄真人翻看你的秋试玉册，说你近来总把心思放在太细碎的地方。随后他又笑着补充，细心并非坏事，只要别让它变成执念。","师尊问你是否需要再调一次课表。他已经替你列出三种更轻松的安排，每一种都恰好避开后山与符阁偏室。","清玄真人说秋风伤神，特意赐下一盏长明灯。灯光很稳，稳到你几乎听不见窗外的风。","他问你是否还记得入门那日说过的话。你说记得，他便温和地点头，仿佛这比秋试成绩更重要。"],
         senior:["沈惊澜在剑冢外环擦剑。他没有抬头，只问你今天是不是又去了不该去的地方。","大师兄将一片枯叶从你肩上拂下，说最近山风乱，别总一个人走远。说完却没有问你要去哪里。","他把一张新画的剑诀递给你，角落里藏着一句很小的批注：‘若想问，就来找我。’","沈惊澜说自己最近总梦见有人在剑冢叫他的名字。你还没问是谁，他便先说那只是旧伤未愈。"],
         sister:["青黛替你换掉凉掉的茶，说秋日最容易心浮。她问你昨夜有没有睡好，像例行问诊，也像在确认别的事。","师姐将一盒安神丸推到你面前，说若不想吃也不必勉强。她说这句话时，手指却一直压着盒盖。","青黛说暖棚已经解封，但里面仍不适合久待。她看着你，像在等你告诉她自己究竟看见了什么。","她闻到你衣袖上的雾气，沉默片刻后替你点燃一炉清香。香气很淡，却让人想立刻忘记刚才的话题。"],
         ajiu:["阿九在廊下修一盏旧灯，灯芯烧得很短。他说最近有人总在半夜把灯吹灭，像不想让谁看清路。","他问你证据册还在不在身上，随后又说只是随口问问。可你回答后，他明显松了一口气。","阿九说自己看见任务堂有人在找你，便先绕来提醒。他没有说那人是谁，只让你今天别太早回房。","他将一片沾着雾水的枯叶夹进你的册子，说如果石门再出现，叶子会先变冷。"]
        };
        Object.assign(CH3.actions,{
         examineLecture:["核对评语底稿","lecture",0,-1,"你比对答辩原稿与发回的评语，试着找出是谁替你改过措辞。"],
         retrieveRelic:["寻回断剑残片","sword",1,-2,"你沿剑冢旧痕寻找被枯叶掩埋的断剑残片。"],
         countVials:["清点静修药瓶","herb",0,-1,"你协助整理药庐送往静修院的药瓶，账目比公开记录多出一页。"],
         decodeSeal:["破译封符","talisman",1,-2,"你用旧符纸拆解封存阵纹，寻找被藏起的收信人与日期。"],

        });
        Object.assign(CH3.actionText,{
         examineLecture:["你将三份评语逐句摊开。不同弟子的用词几乎一模一样，连‘仍有可塑之处’的停顿都写在同一行。","底稿边缘压着很浅的指印。你用灵光照过，发现有人删去的不是错误答案，而是每个人提出的第一个问题。","讲师路过时问你是否需要帮助。你把底稿合上，说只是温习，他便笑着夸你终于懂得把时间用在正事上。"],
         retrieveRelic:["枯叶下埋着一截剑尖，断口仍残留着没有散尽的剑意。它贴近掌心时，你听见有人说‘别替我忘记。’","你在石缝间找到一枚旧剑匣扣，背面刻着模糊日期。那日期比夏宴空席对应的记录早了一年。","断剑残片被雨水洗得很亮。沈惊澜远远看见后没有阻止你，只说把它收好，别让任何人先替你解释。"],
         countVials:["药瓶编号从一百七十排到一百九十九，中间却缺了七个。青黛说那是损耗，可每个空位都被人郑重地擦得很干净。","静修院的药瓶颜色比普通安神丸深一些。你贴近闻，甜香里混着一点很淡的金属味，像阵纹烧灼后的余温。","账簿最后有一页被整齐撕去。纸边留下的压痕显示那页写得很满，绝不是普通出入记录。"],
         decodeSeal:["你将封符拆成数十道笔画，发现它并非单纯封存，而是在反复确认被封之物是否仍记得自己的名字。","符纸烧到最后，灰烬在桌上排成一个地址。那是山下，却被护山阵标记为‘不可抵达’。","一张旧封符里藏着师尊的批注：‘待其心定，再还。’你不知道这里的‘其’指谁。"],
         reverseLine:["你逆着阵线推演，看到阵法最初并没有向内收缩。后来有人在每一个出口旁补上了同一种温和的回环。","阵线终点不是后山，而是静修院地底。你停下推演时，阵盘上方正好响起一声很轻的门锁声。","逆推后的阵纹像一只收拢的手。你想起师尊说过，握紧并不总是为了伤人，有时也可以是保护。"],
         followMist:["雾里脚印时而朝前、时而朝后。你跟到最后才发现它们并非在带路，而是在反复把你引回封山碑前。","一片雾从你肩侧掠过，留下与弟子服相同的熏香。你回头时，石门外侧多出一个刚刚写下的名字。","你在雾里看见自己的背影先一步走远。它没有回头，只把证据册夹在腋下，像已经知道出口在哪里。"]
        });
        CH3.explore.lecture.push(["被撕下的问题","讲义末页被撕去一角，残留的问题只有半句：‘若所见与师命相悖……’",[["补全问题","你把残句与旧评语一同夹入证据册。",{item:"note",insight:3}],["交给讲师","讲师替你收走纸页，称赞你没有自作主张。",{attention:1,mood:1}]]]);
        CH3.explore.sword.push(["剑匣里的纸条","一只空剑匣底部贴着纸条：‘我没有离山。’墨迹被雨水晕开，仍能看清最后一个字。",[["收下纸条","纸条背面有静修院的药瓶编号。",{item:"note",insight:3}],["寻找留下者","剑冢只剩风声，沈惊澜却比你更早赶来。",{aff:{senior:1},attention:1}]]]);
        CH3.explore.herb.push(["缺失的药方","药柜夹层藏着一张缺了药名的方子，作用写得很清楚：‘安神，定忆，归静。’",[["拓下方子","你将残方与药瓶编号并列收好。",{item:"note",insight:3}],["放回夹层","你合上药柜时，里面传来瓷瓶轻轻相碰的声音。",{fracture:1}]]]);
        CH3.explore.talisman.push(["返还印","一枚被退回的传讯符反复亮起，内容只有一句：‘请让我回家。’",[["记录传讯频率","它每隔七日亮一次，与旧档日期一致。",{item:"note",insight:3}],["熄灭符光","符光灭下去前，像有人在另一端松了口气。",{mood:-1,fracture:1}]]]);
        CH3.explore.array.push(["阵枢回环","阵线在静修院下方形成一个完整回环，所有离开的路径最终都被导回原处。",[["描下回环","你在纸上画出没有出口的阵图。",{item:"note",insight:3}],["撤去灵力","阵盘恢复平静，像刚才什么也没显示。",{attention:-1,insight:1}]]]);
        CH3.explore.rear.push(["石门后的席位","雾中石门短暂打开，你看见里面摆着许多面向墙壁的席位，每张席位前都放着一盏长明灯。",[["记住席位编号","其中一盏灯下压着与你相同的玉册封皮。",{item:"note",insight:3,fracture:1}],["立刻离开","雾在你身后缓缓合拢，像有人替你关门。",{mood:-1,attention:-1}]]]);

        CH3.npcEvents.master.push(
         {id:"master-3-3",day:27,title:"替你收好的证据",text:"清玄真人将一本整理好的证据册放到你面前。里面每一页都比你原本的记录更工整，也更少了一句最关键的话。他说为师只是替你删去了会让你痛苦的部分。",choices:[["指出缺失的句子","他没有否认，只问你是否愿意为一句话毁掉多年安稳。",{insight:3,attention:1},"他把册子推回你面前，像在等你亲手撕掉剩下的页。"],["先收下册子","你接过它，发现页码被重新编过。",{aff:{master:2},item:"note"},"师尊说，懂得取舍也是长大。"]]},
         {id:"master-3-4",day:31,title:"最后的课",text:"秋试前夜，师尊单独为你讲了一堂课。他说真正的自由不是离开，而是终于不再想离开。",choices:[["反问谁替人决定自由","他静静看了你一会儿，随后笑说你还是太年轻。",{insight:3,fracture:1},"窗外的钟响了七次，像在替谁做结论。"],["沉默听完","他替你倒了一盏茶，语气温和得像从前每一次课后。",{mood:2,attention:1},"你喝不出茶里有什么，只觉得很困。"]]}
        );
        CH3.npcEvents.senior.push(
         {id:"senior-3-3",day:26,title:"不替你回答",text:"沈惊澜拦住你，说今晚若有人问你是否愿意静修，不要先看任何人的脸。他说这一次，他不会替你回答。",choices:[["请他说明白","他递来断剑残片，说答案藏在那些被磨掉的名字里。",{insight:3,aff:{senior:3},item:"note"},"他低声说：‘你得先记住自己想说什么。’"],["问他会不会一起走","他没有承诺，只把剑穗系在你腕上。",{mood:1,aff:{senior:3}},"他说这不是束缚，是让你别忘记回来的路。"]]},
         {id:"senior-3-4",day:30,title:"剑冢的门",text:"剑冢深处出现一道只容一人通过的裂缝。沈惊澜说里面可能有旧弟子的最后记录，也可能什么都没有。",choices:[["独自进去","他没有拦，只站在裂缝外替你守着。",{insight:3,fracture:1},"你听见他在外面一遍遍叫你的名字。"],["请他同行","他握紧剑柄，最后却说两个人进去太容易被发现。",{aff:{senior:2},attention:-1},"他把一盏灯交给你，说灯灭前一定回来。"]]}
        );
        CH3.npcEvents.sister.push(
         {id:"sister-3-3",day:28,title:"药瓶上的名字",text:"青黛终于让你看一页药庐底册。上面每只安神药瓶都对应一个名字，而其中几个名字正来自你收集的旧档。",choices:[["问她为何还留着","她说若连记录都烧掉，就真的没有人记得他们来过。",{insight:3,aff:{sister:3},item:"note"},"她将底册合上，像在替谁守灵。"],["问她是否参与过","她很久没有回答，只说自己那时也只是弟子。",{mood:-1,aff:{sister:1},fracture:1},"药香忽然浓得让你想离开。"]]},
         {id:"sister-3-4",day:32,title:"醒着的选择",text:"青黛把一瓶无色药液放在你面前，说它能让人睡得很沉，也能让人整夜清醒。她不会替你选。",choices:[["选择清醒","药液苦得发涩，你却觉得脑中从未如此清楚。",{insight:3,fracture:1},"青黛垂下眼，说希望你明天仍能这样说。"],["选择沉睡","她替你收好证据册，说醒来后再决定也不迟。",{mood:2,attention:1},"你不记得自己是何时睡着的。"]]}
        );
        CH3.npcEvents.ajiu.push(
         {id:"ajiu-3-3",day:29,title:"两份路线",text:"阿九画了两条离山路线。一条通向山门正门，一条通向雾中石门。他说前者会被看见，后者会让你不知道自己还能不能回来。",choices:[["选择雾中石门","他将冷叶夹入你掌心，说别相信门后的第一句话。",{insight:3,aff:{ajiu:3},item:"note"},"阿九说那条路不会替任何人保密。"],["选择正门","他点头，却将地图背面折起来不让你看。",{mood:1,aff:{ajiu:1},attention:1},"你知道他仍留了一条路没有告诉你。"]]},
         {id:"ajiu-3-4",day:33,title:"最后一盏灯",text:"阿九在后山留下一盏灯，说它会在你决定离开时熄灭。若它一直亮着，便说明你还没有真正下定决心。",choices:[["守着灯等它熄灭","灯焰摇晃很久，最后在你说出名字时熄灭。",{insight:3,aff:{ajiu:3}},"雾里传来一声很轻的门响。"],["立刻吹灭灯","灯灭后，远处弟子居的灯却同时亮了起来。",{attention:2,fracture:1},"阿九脸色变了，说你不该这么做。"]]}
        );
        
        Object.entries(CH3.npcDialogue).forEach(([key,lines])=>lines.push(
         key==="master"?"清玄真人看着你证据册边角的墨痕，问你近日是否总睡不安稳。他说静室的门永远为你开着。":key==="senior"?"沈惊澜说你手腕上的剑穗松了，替你重新系紧。系完后他停了一下，问你是否还记得是谁送的。":key==="sister"?"青黛将一页药方压在你手下，说若有人问起，就说你今天从未来过药庐。": "阿九低声说后山的门又出现了，但这次门外站着一个和你很像的人。",
         key==="master"?"师尊让你把秋试后的愿望写在纸上。他没有看，只将纸折好放进一只没有钥匙的匣子。":key==="senior"?"沈惊澜问你会不会后悔知道这么多。还没等你回答，他先说自己会。":key==="sister"?"青黛递来一只空药瓶，说若你愿意，她可以教你辨出里面残留的每一种药。": "阿九说他听见静修院有人在背你的名字，背得比任何人都熟。"
        ));
        Object.assign(CH3.days,{7:["弟子牌清点","宗门要求所有候选弟子上交旧弟子牌做例行清点。你包裹里的残牌忽然变得很烫。","整理包裹"],14:["旧案听证","任务堂公开说明一批旧案，主持人说这是为了消除弟子疑虑。可名单里没有任何一个你查过的名字。","前往任务堂"],24:["封山风声","山下有人传来封山消息，宗门却说只是秋猎期间的普通防护。","留意山门"],34:["钟声未停","夜里钟响超过平日次数。没人承认听见，只有证据册上的墨迹缓慢洇开。","整理记录"]});
        
        CH3.deductionCases=[
         {id:"revised-path",title:"被替换的答案",need:["rewritten-paper","missing-question","sealed-reply"],desc:"秋试并不只评判修为，也在筛选谁愿意用宗门给出的语言替换自己的问题。",reward:"你确认了讲法台的真正作用：不是教导，而是修正。"},
         {id:"quiet-house",title:"静修院的去向",need:["quiet-number","return-formula","returning-badge","sword-box-note"],desc:"药瓶、残方与仍发亮的弟子牌指向同一处：所谓离山的人，可能从未离开。",reward:"你找到了静修院与旧弟子记录之间的第一条完整链条。"},
         {id:"inner-net",title:"护山阵的另一面",need:["inward-line","closed-loop","future-schedule","facing-wall"],desc:"护山阵将离开的路导回静修院，石门后的席位则等待被带回来的人。",reward:"你不再把护山阵当作单纯的守护。"},
         {id:"seven-days",title:"七日回环",need:["return-signal","half-name","red-cord"],desc:"失踪记录、返还印与剑冢遗物都以七日为周期，像一场被反复执行的校正。",reward:"你记住了下一个回环发生的时刻。"}
        ];
        CH3.invites={
         senior:[
          {id:"invite-senior-sword",day:17,title:"剑冢夜练",text:"夜色压在剑冢的残碑上。沈惊澜没有带剑谱，只带了一盏灯。他说今晚不必练到赢，只想问你愿不愿意和他一起把那道总收不住的剑势走完。",choices:[["赴约练剑","你们在落叶间一遍遍拆招。最后一式收住时，他没有立刻松开替你稳住剑柄的手。",{mood:2,aff:{senior:3},bond:{senior:1}},"沈惊澜低声说，和你并肩时，他第一次觉得剑冢没有那么冷。"],["婉拒邀约","你说今夜还有别的事要做。他点头，替你把灯往回廊方向提了提。",{aff:{senior:1}},"他没有追问，只说下次仍会等你。"]]},
          {id:"dual-senior",day:24,title:"剑意同调",text:"沈惊澜在剑冢裂缝前停下，先问你是否愿意与他合修。他说剑意相抵时很容易伤到彼此，只有你们都愿意，才该继续。",choices:[["明确同意合修","你们在阵外并肩坐下，以呼吸与剑意慢慢校准彼此。灵力交汇的瞬间，你看见他守着一盏旧灯等人归来的记忆。",{cult:3,mood:2,insight:2,aff:{senior:4},bond:{senior:2}},"合修结束后，他先松开手，认真问你是否还好。"],["请他停在这里","他立刻收回剑意，没有让你为拒绝解释。",{aff:{senior:2},bond:{senior:1}},"他说能被你信任到这里，已经足够。"]]}
         ],
         sister:[
          {id:"invite-sister-lamp",day:18,title:"药庐晚灯",text:"青黛留了一盏晚灯，说药庐今日无人值夜。她想请你帮她辨一味新药，也想在炉火熄灭前听你说说最近真正害怕的事。",choices:[["留下陪她","你们守着药炉说了很久。她没有急着给答案，只在你停下时替你添一杯温茶。",{mood:2,aff:{sister:3},bond:{sister:1}},"青黛说，能让你愿意留下来聊天，比任何药都难得。"],["礼貌告辞","她替你包好一小瓶清心药，说若夜里难受就来找她。",{aff:{sister:1}},"药瓶在掌心微微发暖。"]]},
          {id:"dual-sister",day:25,title:"灵息调和",text:"青黛在药庐布下安静的隔音阵，先说明合修会让彼此感知更敏锐，任何不适都可以立刻停下。她等待你的回答，没有靠近。",choices:[["同意灵息调和","你主动伸手。灵力在掌心之间缓慢流转，药香、炉火与彼此的呼吸逐渐落在同一节奏。你看见她曾守着药瓶整夜未眠的记忆。",{cult:2,mood:3,insight:2,aff:{sister:4},bond:{sister:2}},"青黛替你收好衣袖上的药灰，轻声问你是否要再坐一会儿。"],["只一起守炉","她没有失望，只把阵法改成最普通的保温阵。",{mood:2,aff:{sister:2},bond:{sister:1}},"炉火很安静，你们也都没有再强求什么。"]]}
         ],
         ajiu:[
          {id:"invite-ajiu-lantern",day:20,title:"后山看灯",text:"阿九约你在封山碑外看灯。他说今晚雾线很低，站得远些也能看见石门后偶尔亮起的光。你到了才发现他带了两盏一模一样的小灯。",choices:[["与他一同守灯","你们并肩坐在石阶上，谁也没有急着说话。阿九把其中一盏灯交给你，说这样以后不管谁先迷路，另一个人都能认出来。",{mood:2,aff:{ajiu:3},bond:{ajiu:1}},"雾里没有出现石门，灯却一直亮到很晚。"],["改日再约","他将灯罩好，说没关系，雾不会只来一次。",{aff:{ajiu:1}},"你离开时，仍能看见他坐在原处。"]]},
          {id:"dual-ajiu",day:27,title:"雾中共修",text:"阿九带你避开巡查，来到雾中一块尚未被阵线覆盖的石台。他说这里能短暂切断山门的窥视，但也因此更需要你亲口确认是否愿意与他共修。",choices:[["同意共修","你们将灵力交给彼此感知，而非彼此掌控。雾散开的一瞬，你看见阿九曾无数次走到石门前又折返的记忆。",{cult:2,mood:2,insight:3,aff:{ajiu:4},bond:{ajiu:2}},"他先收回灵力，问你是否还愿意继续留在这里看一会儿雾。"],["保留距离","阿九立即撤去阵法，陪你从原路离开。",{aff:{ajiu:2},bond:{ajiu:1}},"他说距离也可以是一种信任。"]]}
         ]
        };
        
        
        /* chapter3-invites-expanded-v2 */
        CH3.actionText.lecture.push("清晨的讲堂比往日安静。讲师让众人默写《静心篇》，你却在自己的纸页背面看见极浅的压痕，像有人曾反复写下同一句话：不要替我说我愿意。", "讲到灵台自省时，窗外的风把经幡吹得彼此相碰。你忽然意识到，堂中每个人停笔与抬眼的时机都近乎一致，只有你迟了一瞬。那一瞬被讲师温和地记在了名册边上。");
        CH3.actionText.debate.push("你提出旧制中的一处矛盾，原本嘈杂的辩席忽然静下来。主持长老没有反驳，只夸你观察细致，并请旁人替你把问题改写得更温顺。等记录送到你手里，问题已经不再像你问过的那个。", "散席后，一位低年级弟子追上来向你道谢，说你刚才替大家说出了不敢说的话。可他转眼就忘了自己具体害怕什么，只攥着衣角，反复问你：我是不是本来就该觉得安心？");
        CH3.actionText.spar.push("与同门拆招时，你故意留了一处破绽。对方的剑尖却在触及衣角前自行偏开，仿佛有一只看不见的手替你们把结果修得圆满。众人都说这是你们配合得好，只有你记得那并不是你的剑路。", "练剑结束后，沈惊澜替你擦去剑柄上的霜。他说秋夜的剑意最容易黏在人身上，若觉得心浮便来找他走一遍剑。他说得很自然，像是早已替你留好了位置。");
        CH3.actionText.trace.push("你在断碑背后找到一道被新泥遮住的刻痕。刻痕记着一个日期，正是宗门庆典那日；可按照旧档，那天本该没有任何弟子进入剑冢。指尖拂过最后一笔时，泥土里传来一声极轻的叹息。", "一柄无主残剑在你靠近时发出低鸣。它并不指向敌人，而是指向通往弟子居的山路。你顺着它看去，只看见暮色里整齐亮起的灯，像许多人同时在等一个迟归的人。");
        CH3.actionText.forage.push("药圃边的露水带着淡淡甜味。你采到第三篓时，发现每一株安魂草的根部都系着细线，线的另一端没入地底。青黛说那是防虫的小阵，可你记得春日里这里还没有这些线。", "你在石缝里捡到一枚失主的弟子牌，背面被磨得发白。把它交去登记时，值守弟子礼貌地笑了笑，说这块牌从未发过；可当夜你经过回廊，分明看见有人佩着同样的牌从雾里走过。");
        CH3.actionText.refine.push("药炉的火候忽高忽低，丹液却始终稳定得近乎完美。青黛让你别多想，说有些阵法会替初学者分担失误。你看着炉壁里自己的倒影，倒影却比你早一步点头同意了。", "一炉清心丹成形时，其中一枚裂成两半，露出极细的黑色丝线。青黛沉默片刻，将它收进白瓷盒，只说这一枚不宜服用。她的指尖很稳，像早已见过许多次。");
        CH3.actionText.copy.push("你誊写的护身符在末笔处自己多出一道弯钩，像合拢的眼睑。你试着擦去它，纸上的墨却一点点渗回原处。隔壁弟子探头看了一眼，只说这张符看起来比从前更听话。", "夜课的符纸不够，管事递给你一叠旧纸。纸背有许多被洗去的名字，在灯下才渐渐显形。你没有立刻追问，只把其中一张悄悄夹进袖里，指腹却沾上洗不掉的墨香。");
        CH3.actionText.archive.push("查到深夜，书架最底层滑出一本没有编号的薄册。里面记着弟子们的‘安心回访’，每一页都写着相似的结论：已恢复安稳，愿继续留山。只有最后一页被人撕走了。", "守档人替你换茶时问起近来睡得好不好。他的语气关切得毫无破绽，甚至记得你上次说过怕冷。可你从未与他说过那句话，连你自己都不确定那是不是你的记忆。");
        CH3.actionText.tune.push("你沿着阵纹推演，发现主阵并非只在守山。它把每一座院落的灯火、每一次晚钟都连进同一个回路。阵盘边缘刻着一句极小的注记：让归处永远比远方明亮。", "校阵时，一处灵石忽然裂开，里面藏着半枚指甲大小的留影石。留影里有人正隔着雾向你招手，画面却在你看清那张脸之前被阵光抹平，只余下一句轻声的‘回来吧’。");
        CH3.actionText.mask.push("你按阿九教的方法遮住行迹，经过巡查弟子身边时，对方竟对你微笑点头，像根本没看见你。走出很远后，你才意识到他点头的方向并不是你，而是你身后某个同样安静的影子。", "藏匿结束时，你在袖口发现一粒白色香丸。它能掩去灵息，也能让人更容易放松。你把它收进包裹，没有服下；可回到房间后，枕边已经有一缕极淡的同样香气。");
        CH3.actionText.investigate.push("你顺着夜里断续的脚步声走到廊尽头，那里只有一扇上锁的空房。门缝下压着一张纸条：这里没有任何需要被找回的人。纸条背面却留着新鲜的指印。", "调查到后半夜，远处传来几声压低的笑。等你循声过去，亭中只剩四只温热的茶盏，仿佛有人刚刚散席。他们谈论的名字被风吹散，只有你的名字清清楚楚留在最后一句里。");
        CH3.actionText.rest.push("你本想早些睡下，窗外却有人轻轻哼着小时候听过的摇篮调。曲子唱到一半便停了，随后传来极轻的敲门声。门外没有人，只有一盏替你留好的温茶。", "静坐时，心神裂隙短暂安静下来。你看见一条很长的山路，路边每一盏灯都有人在等你回头。你没有回头，梦境便像被谁温柔地合上了书页。");
        
        CH3.invites.senior.push({id:"invite-senior-rain",day:29,title:"雨廊分灯",text:"秋雨封住了通往剑冢的小径。沈惊澜在回廊尽头等你，手里提着两盏避雨灯。他没有急着说修行，只说这几日你总在躲人，想陪你走一段不必解释的路。",choices:[["接过另一盏灯","你们沿着长廊慢慢走。雨声替你们遮住沉默，他将步子放得很慢，始终等你自己靠近。走到尽头时，他问你今夜是否感到安全。",{mood:3,insight:1,aff:{senior:4},bond:{senior:2}},"沈惊澜笑了笑，说以后若你不想说话，也可以只来借一盏灯。"],["说明想独处","你坦白自己需要一点安静。他没有挽留，只把灯塞进你手里，转身替你挡住斜风。",{mood:1,aff:{senior:2},bond:{senior:1}},"他告诉你，独处不是把人推开；你想回来时，他仍会在。"]]},{id:"dual-senior-second",day:33,title:"剑心相照",text:"沈惊澜约你到一处废弃剑坪，将阵法一寸寸检查给你看。确认这里没有窥探的阵眼后，他才问：若你仍愿意，能否再与他合修一次？这一次不为破境，只为让彼此的剑意学会在靠近时不伤人。",choices:[["在清醒中答应","你先说出自己的界限，他逐一应下。随后你们隔着一臂的距离运转心法，待灵息自然相合才缓缓靠近。剑意交织得克制而明亮，你们都没有试图替对方决定任何事。",{cult:4,mood:3,insight:3,aff:{senior:5},bond:{senior:3}},"结束时，沈惊澜郑重向你道谢，说被允许靠近从来不是理所当然。"],["改为并肩坐修","他立刻收起阵诀，与你一同面对山风调息。",{cult:2,mood:2,aff:{senior:3},bond:{senior:2}},"他说并肩也很好，只要这是你选择的距离。"]]});
        CH3.invites.sister.push({id:"invite-sister-herbs",day:30,title:"药香与旧信",text:"青黛整理药柜时找出一封没有署名的旧信。她没有拆开，只问你愿不愿意陪她把一批安神香分装完。她说两个人做慢事时，心里那些不肯开口的念头也许会自己浮出来。",choices:[["陪她整理到深夜","你们把香丸一颗颗装进小瓶，青黛说起自己也曾害怕被‘照顾得太好’。她没有逼你回应，只将选择权一直留在你手里。",{mood:3,insight:2,aff:{sister:4},bond:{sister:2}},"她把一只写着你名字的香囊交给你，说它只在你愿意时才会起效。"],["请她先拆那封信","她看了信封很久，最后摇头说还没准备好。",{insight:1,aff:{sister:2},bond:{sister:1}},"青黛感谢你没有替她做决定，并约你等她准备好再一起看。"]]},{id:"dual-sister-second",day:34,title:"同息安神",text:"药庐的雨棚被风吹得轻响。青黛提前把安神阵的阵眼、停止的手诀和出口位置全告诉你。她说若你愿意，今晚的合修可以只停在最初的灵息相触；任何时候想离开，她都会先替你开门。",choices:[["按自己的节奏合修","你们面对面坐下，先以一句句确认代替猜测。灵息相触时，药香与体温都被阵法放得很轻，你始终能清楚地感到自己仍握着选择。",{cult:4,mood:4,insight:2,aff:{sister:5},bond:{sister:3}},"青黛等你收功后才靠近，笑着问你想喝茶、想说话，还是想一个人静一会儿。"],["只借阵法静坐","她撤去多余的阵纹，将距离留得恰到好处。",{mood:3,cult:1,aff:{sister:3},bond:{sister:2}},"她说修行可以很亲近，也可以只是一起把夜熬过去。"]]});
        CH3.invites.ajiu.push({id:"invite-ajiu-paperboat",day:31,title:"雾河纸舟",text:"阿九在后山浅溪放了几只纸舟，每只都装着一粒会发光的灵砂。他说雾太大时，人容易把方向认错；若你愿意，可以和他一起看纸舟最终流向哪里。",choices:[["与他一起追纸舟","你们踩着湿石沿溪而下。阿九几次想伸手扶你，都先停下来等你点头。最后一只纸舟停在石门下，他把自己的外袍披到你肩上，却没有追问你看见了什么。",{mood:3,insight:2,aff:{ajiu:4},bond:{ajiu:2}},"阿九说，方向可以慢慢找，重要的是别让你一个人被雾吞掉。"],["请他陪你回去","他将纸舟一一收起，陪你沿最亮的路回山。",{mood:2,aff:{ajiu:2},bond:{ajiu:1}},"他说今晚的雾不适合逞强，明天再看也来得及。"]]},{id:"dual-ajiu-second",day:34,title:"雾息相依",text:"阿九带你到雾线之外的一块小台地，先将退路和传讯符放到你手边。他说共修会让人看见彼此最不愿承认的恐惧，所以只有在你确信想要时才开始；你若摇头，他会立刻送你回去。",choices:[["亲口确认愿意","你说出愿意，也说出不愿被触碰的部分。他认真记下，才与你并肩入定。灵息在雾里相互照见，却不相互侵占；你看见他一次次折返石门前的犹豫，也让他看见你仍想离开的决心。",{cult:4,mood:3,insight:4,aff:{ajiu:5},bond:{ajiu:3}},"阿九收功后把传讯符仍放在你掌心，说无论雾里还是雾外，你都可以随时叫他。"],["把今晚留给交谈","他没有失落，只点亮了那盏小灯。",{mood:3,insight:2,aff:{ajiu:3},bond:{ajiu:2}},"他陪你坐到天色发白，听你把不安说完。"]]});
