<style>

        .app { position: relative; z-index: 1; width: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 12px; flex: 1; min-height: 0; }

        /* Help mode (the ? top left, the app's): controls glow; tapping one

        .foot .more { margin: 0; font-size: 13px; color: var(--ink); text-align: center; line-height: 1.5; }
