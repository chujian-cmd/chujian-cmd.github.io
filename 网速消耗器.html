<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网速消耗器 · 带宽压力测试</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }
    body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(145deg, #0b0f1a 0%, #1a1f2f 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: rgba(18, 24, 38, 0.9);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(74, 144, 226, 0.3);
      border-radius: 42px;
      padding: 32px 28px;
      max-width: 620px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(0, 255, 255, 0.1) inset;
      transition: all 0.2s;
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin: 0 0 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #e2e9ff;
      letter-spacing: -0.5px;
      text-shadow: 0 0 10px rgba(0, 200, 255, 0.4);
    }
    .sub {
      color: #8d9fc9;
      font-size: 0.95rem;
      margin-bottom: 28px;
      border-left: 3px solid #2e6bff;
      padding-left: 12px;
    }
    .speed-panel {
      background: #0c101c;
      border-radius: 32px;
      padding: 24px 22px;
      margin-bottom: 28px;
      border: 1px solid #2b3555;
      box-shadow: 0 4px 12px #00000055, inset 0 0 12px #00000033;
    }
    .speed-label {
      display: flex;
      justify-content: space-between;
      color: #b7c8ff;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      margin-bottom: 8px;
    }
    .speed-value {
      font-size: 3.4rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #7ff0ff;
      text-shadow: 0 0 16px #00c8ff;
      line-height: 1;
      margin-bottom: 4px;
      letter-spacing: 1px;
      word-break: break-word;
      transition: color 0.1s;
    }
    .speed-unit {
      font-size: 1rem;
      color: #8d9fc9;
      letter-spacing: 1px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
    }
    .usage-stats {
      display: flex;
      gap: 24px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed #2b3555;
    }
    .stat {
      flex: 1;
    }
    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #5e6f9a;
      letter-spacing: 1px;
      font-weight: 600;
    }
    .stat-number {
      font-size: 1.8rem;
      font-weight: 700;
      color: #c6d9ff;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }
    .stat-desc {
      font-size: 0.7rem;
      color: #4f6088;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-bottom: 14px;
    }
    .btn {
      background: #1a2440;
      border: 1px solid #2f4375;
      padding: 12px 28px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      color: #cddbff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s;
      box-shadow: 0 4px 8px #00000033;
      flex: 1 1 auto;
      min-width: 140px;
      letter-spacing: 0.3px;
    }
    .btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      stroke: none;
      flex-shrink: 0;
    }
    .btn-primary {
      background: linear-gradient(145deg, #0d47a1, #0b3d91);
      border-color: #3a7eff;
      color: white;
      text-shadow: 0 1px 2px black;
      box-shadow: 0 4px 12px #0b3d91aa, 0 0 0 1px #3a7eff55 inset;
    }
    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(145deg, #1155c9, #0c47a8);
      border-color: #6b9fff;
      box-shadow: 0 6px 16px #0b3d91, 0 0 0 1px #8bb1ff inset;
    }
    .btn-danger {
      background: #381a2a;
      border-color: #b33b5b;
      color: #ffb8cb;
      text-shadow: 0 0 6px #ff4d7a77;
    }
    .btn-danger:hover:not(:disabled) {
      background: #4f1e33;
      border-color: #e65a7f;
      color: #ffd0dd;
    }
    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      filter: grayscale(0.6);
      box-shadow: none;
    }
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 0.85rem;
      color: #93a9dd;
      background: #0e1322;
      padding: 10px 20px;
      border-radius: 60px;
      margin-top: 22px;
      border: 1px solid #1e2942;
      transition: all 0.2s;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-active {
      background: #00a86b;
      color: #e0ffe8;
      box-shadow: 0 0 10px #00c853;
    }
    .badge-stop {
      background: #4b3040;
      color: #ddb0c0;
    }
    .badge-wait {
      background: #353c66;
      color: #c0d0ff;
    }
    .footer-note {
      font-size: 0.7rem;
      text-align: center;
      color: #4c5c82;
      margin-top: 18px;
    }
    /* 确保SVG图标垂直居中 */
    .icon-title {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
    }
    .icon-title svg {
      width: 100%;
      height: 100%;
      fill: #7ff0ff;
      filter: drop-shadow(0 0 6px #00c8ff88);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>
      <span class="icon-title">
        <!-- 闪电图标 (替换⚡) -->
        <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
          <path d="M13 2L3 14h7l-2 8 10-12h-7l2-8z" />
        </svg>
      </span>
      <span>网速消耗器</span>
    </h1>
    <div class="sub">实时下载压力测试 · 消耗带宽</div>

    <!-- 速度展示区 -->
    <div class="speed-panel">
      <div class="speed-label">
        <span>当前下载速度</span>
        <span id="speedHint">待机</span>
      </div>
      <div class="speed-value" id="speedDisplay">0.00</div>
      <div class="speed-unit">
        <span>Mbps</span>
        <span id="speedByteHint">0 B/s</span>
      </div>
      <div class="usage-stats">
        <div class="stat">
          <div class="stat-label">已消耗流量</div>
          <div class="stat-number" id="totalMB">0.00</div>
          <div class="stat-desc">MB (兆字节)</div>
        </div>
        <div class="stat">
          <div class="stat-label">请求次数</div>
          <div class="stat-number" id="requestCount">0</div>
          <div class="stat-desc">次下载</div>
        </div>
      </div>
    </div>

    <!-- 控制按钮 - 使用SVG替代emoji -->
    <div class="controls">
      <button class="btn btn-primary" id="startBtn" autofocus>
        <!-- 播放(开始)图标 -->
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path d="M8 5v14l11-7L8 5z" fill="currentColor" />
        </svg>
        开始消耗
      </button>
      <button class="btn btn-danger" id="stopBtn" disabled>
        <!-- 停止图标 -->
        <svg viewBox="0 0 24 24" width="20" height="20">
          <rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor" />
        </svg>
        停止
      </button>
    </div>

    <!-- 运行状态 -->
    <div class="status" id="statusBar">
      <span id="statusBadge" class="badge badge-wait">待机</span>
      <span id="statusText">点击“开始消耗”以占用带宽</span>
    </div>
    <div class="footer-note">
      持续下载大文件以消耗带宽 · 速度受服务器及网络影响
    </div>
  </div>

  <script>
    (function() {
      // ---------- 配置参数 ----------
      const CHUNK_SIZE = 10 * 1024 * 1024;        // 10 MB 每块
      const CONCURRENCY = 3;                      // 同时进行3个下载任务（并发消耗）
      const UPDATE_INTERVAL_MS = 200;             // 速度更新间隔 (ms)
      const TEST_FILE_URL = 'https://speed.cloudflare.com/__down?bytes='; // Cloudflare 测速端点

      // ---------- 状态变量 ----------
      let isRunning = false;                      // 是否处于消耗状态
      let totalBytes = 0;                         // 累计下载字节数 (用于统计总流量)
      let requestCount = 0;                       // 累计完成的请求次数

      // 实时速度计算相关 (滑动窗口)
      let speedBuffer = [];                       // 存储近期 { timestamp, bytes } 用于计算速度
      let lastUpdateTime = 0;                     // 上次UI更新时间
      let lastTotalBytes = 0;                     // 上次统计的总字节 (用于计算瞬时速度)

      // 定时器句柄
      let updateTimer = null;
      let activeControllers = new Set();          // 存放当前的 AbortController, 用于停止

      // DOM 元素
      const speedDisplay = document.getElementById('speedDisplay');
      const speedByteHint = document.getElementById('speedByteHint');
      const totalMBEl = document.getElementById('totalMB');
      const requestCountEl = document.getElementById('requestCount');
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const statusBadge = document.getElementById('statusBadge');
      const statusText = document.getElementById('statusText');
      const speedHint = document.getElementById('speedHint');

      // ---------- 辅助函数 ----------
      // 格式化字节为易读单位 (仅用于字节速度显示)
      function formatBytes(bytes, decimals = 2) {
        if (bytes === 0) return '0 B/s';
        const k = 1024;
        const dm = decimals < 0 ? 0 : decimals;
        const sizes = ['B/s', 'KB/s', 'MB/s', 'GB/s'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
      }

      // 格式化总流量 MB
      function formatMB(bytes) {
        return (bytes / (1024 * 1024)).toFixed(2);
      }

      // 更新UI速度及统计信息
      function updateUI() {
        // 1. 计算瞬时速度 (基于最近两次更新之间的字节差)
        const now = performance.now();
        const totalBytesNow = totalBytes;

        // 如果距离上次更新小于20ms，跳过避免速度抖动 (但定时器一般不会)
        if (now - lastUpdateTime < 20 && lastUpdateTime !== 0) {
          return;
        }

        const timeDiffSec = (now - lastUpdateTime) / 1000; // 转为秒
        let instantBytesPerSec = 0;

        if (lastUpdateTime !== 0 && timeDiffSec > 0.001) {
          const byteDiff = totalBytesNow - lastTotalBytes;
          instantBytesPerSec = byteDiff / timeDiffSec;
        }

        // 滑动窗口平滑速度 (只保留最近5个采样点)
        if (timeDiffSec > 0.001) {
          speedBuffer.push({ timestamp: now, bytesPerSec: instantBytesPerSec });
          // 保留最近8个点 (大约1.6秒的数据)
          if (speedBuffer.length > 8) speedBuffer.shift();
        }

        // 计算最近窗口的平均速度 (更稳定)
        let avgBytesPerSec = 0;
        if (speedBuffer.length > 1) {
          const first = speedBuffer[0];
          const last = speedBuffer[speedBuffer.length - 1];
          const windowSeconds = (last.timestamp - first.timestamp) / 1000;
          if (windowSeconds > 0.05) {
            const sum = speedBuffer.reduce((acc, cur) => acc + cur.bytesPerSec, 0);
            avgBytesPerSec = sum / speedBuffer.length;
          } else {
            avgBytesPerSec = instantBytesPerSec;
          }
        } else if (speedBuffer.length === 1) {
          avgBytesPerSec = speedBuffer[0].bytesPerSec;
        } else {
          avgBytesPerSec = instantBytesPerSec;
        }

        // 避免出现负值或者异常
        if (avgBytesPerSec < 0) avgBytesPerSec = 0;

        // 转换 Mbps (1 byte = 8 bits, 1M bit = 1,000,000 bits)
        const mbps = (avgBytesPerSec * 8) / 1_000_000;

        // 更新DOM
        speedDisplay.textContent = mbps.toFixed(2);
        speedByteHint.textContent = formatBytes(avgBytesPerSec, 2);
        totalMBEl.textContent = formatMB(totalBytes);
        requestCountEl.textContent = requestCount;

        // 速度指示器颜色 (速度越快越偏绿/蓝)
        if (mbps > 50) {
          speedDisplay.style.color = '#7ff0ff';
          speedDisplay.style.textShadow = '0 0 20px #00e0ff';
        } else if (mbps > 10) {
          speedDisplay.style.color = '#a0e0ff';
          speedDisplay.style.textShadow = '0 0 12px #0099ff';
        } else if (mbps > 0.5) {
          speedDisplay.style.color = '#b0c8ff';
          speedDisplay.style.textShadow = '0 0 8px #2a6eff';
        } else {
          speedDisplay.style.color = '#8d9fc9';
          speedDisplay.style.textShadow = 'none';
        }

        // 更新状态文字中的速度提示
        if (isRunning) {
          if (mbps > 0.01) {
            speedHint.textContent = '消耗中';
          } else {
            speedHint.textContent = '连接中';
          }
        } else {
          speedHint.textContent = '待机';
        }

        // 记录本次更新状态
        lastUpdateTime = now;
        lastTotalBytes = totalBytesNow;
      }

      // 重置所有统计 (停止时不会自动重置，但新开始会重置，这里用于初始化)
      function resetStats() {
        totalBytes = 0;
        requestCount = 0;
        speedBuffer = [];
        lastUpdateTime = 0;
        lastTotalBytes = 0;
        updateUI();
        // 强制显示0
        speedDisplay.textContent = '0.00';
        speedByteHint.textContent = '0 B/s';
        totalMBEl.textContent = '0.00';
        requestCountEl.textContent = '0';
      }

      // 更新界面状态（按钮/徽章/文字）
      function setRunningState(running) {
        isRunning = running;
        if (running) {
          startBtn.disabled = true;
          stopBtn.disabled = false;
          statusBadge.className = 'badge badge-active';
          statusBadge.textContent = '运行中';
          statusText.textContent = '正在消耗带宽 … 点击停止按钮结束';
          speedHint.textContent = '消耗中';
        } else {
          startBtn.disabled = false;
          stopBtn.disabled = true;
          statusBadge.className = 'badge badge-stop';
          statusBadge.textContent = '已停止';
          statusText.textContent = '已停止消耗，可重新开始';
          speedHint.textContent = '待机';
        }
      }

      // ---------- 核心下载任务 ----------
      async function downloadChunk() {
        if (!isRunning) return; // 停止状态下不再发起新请求

        const controller = new AbortController();
        activeControllers.add(controller);

        // 构建请求url，指向一个返回固定大小数据的测速端点 (Cloudflare)
        // 请求 CHUNK_SIZE 字节 (约10MB) 的数据
        const url = `${TEST_FILE_URL}${CHUNK_SIZE}`;

        try {
          const response = await fetch(url, {
            signal: controller.signal,
            cache: 'no-store', // 绕过缓存
            headers: { 'Cache-Control': 'no-cache' }
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          // 以流式读取响应，逐块累加字节数，这样速度计算更实时
          const reader = response.body.getReader();
          let receivedBytes = 0;

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            // 如果中途被停止，清理并退出
            if (!isRunning) {
              await reader.cancel();
              break;
            }

            // 累加字节
            const chunkLength = value.byteLength;
            receivedBytes += chunkLength;
            totalBytes += chunkLength;

            // 在收到数据后立即更新UI速度 (让速度显示更即时)
            const now = performance.now();
            if (now - lastUpdateTime > 15) {
              updateUI();
            }
          }

          // 该请求成功完成，增加请求计数
          if (isRunning) {
            requestCount++;
          }

        } catch (err) {
          // 如果是因为中止而抛出的 AbortError，忽略
          if (err.name === 'AbortError') {
            // 主动中止，不视为错误
          } else if (isRunning) {
            // 其他错误在网络波动时会发生，不影响整体，可以忽略或记日志
            console.warn('下载出错 (可能网络波动):', err.message);
          }
        } finally {
          activeControllers.delete(controller);
          // 只要还在运行且未被中止，就再次发起新请求（循环）
          if (isRunning) {
            setTimeout(() => {
              if (isRunning) downloadChunk();
            }, 0);
          }
        }
      }

      // 启动并发下载任务
      function startConsuming() {
        if (isRunning) return;

        // 重置统计数据 (让每次开始都从0算起，更直观)
        resetStats();

        // 先更新状态
        setRunningState(true);

        // 记录起始时间
        lastUpdateTime = performance.now();
        lastTotalBytes = 0;   // 重置计数基准
        speedBuffer = [];     // 清空速度窗口

        // 启动定时器更新速度显示 (即使没有数据，也保持界面刷新)
        if (updateTimer) clearInterval(updateTimer);
        updateTimer = setInterval(() => {
          if (isRunning) {
            updateUI();
          }
        }, UPDATE_INTERVAL_MS);

        // 启动 CONCURRENCY 个并发的下载循环
        for (let i = 0; i < CONCURRENCY; i++) {
          downloadChunk();  // 内部会检查 isRunning
        }
      }

      // 停止消耗
      function stopConsuming() {
        if (!isRunning) return;

        // 先设置状态为停止，这样所有循环会退出
        isRunning = false;

        // 中止所有正在进行的fetch请求
        for (let controller of activeControllers) {
          try {
            controller.abort();
          } catch (e) {}
        }
        activeControllers.clear();

        // 清除定时器
        if (updateTimer) {
          clearInterval(updateTimer);
          updateTimer = null;
        }

        // 更新界面状态
        setRunningState(false);

        // 最后再更新一次速度显示(强制显示为0)
        speedDisplay.textContent = '0.00';
        speedByteHint.textContent = '0 B/s';
        speedHint.textContent = '待机';
      }

      // ---------- 事件绑定 ----------
      startBtn.addEventListener('click', startConsuming);
      stopBtn.addEventListener('click', stopConsuming);

      // 页面关闭前停止所有请求 (防止后台消耗)
      window.addEventListener('beforeunload', () => {
        if (isRunning) {
          stopConsuming();
        }
      });

      // 初始化界面 (设置初始状态)
      setRunningState(false);
      resetStats();
    })();
  </script>
</body>
</html>
