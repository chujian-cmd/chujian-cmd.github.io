<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>曼德拉效应 · 程序自己记错</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#000; color:#fff;
    font-family:'Courier New', monospace;
    min-height:100vh;
    display:flex; justify-content:center; align-items:center;
    padding:20px;
  }
  .terminal {
    width:100%; max-width:820px;
    border:1px solid #333;
    padding:24px;
  }
  .bar {
    display:flex; justify-content:space-between;
    font-size:.75rem; color:#666;
    border-bottom:1px solid #222;
    padding-bottom:8px; margin-bottom:20px;
    letter-spacing:2px; text-transform:uppercase;
  }
  .bar .dot { color:#fff; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.15} }

  canvas {
    display:block; width:100%; height:auto;
    background:#000; border:1px solid #1e1e1e;
    margin-bottom:16px;
  }

  .state {
    font-size:.8rem; color:#888;
    letter-spacing:1px; padding:8px 0;
    border-bottom:1px dashed #222;
    margin-bottom:16px;
    line-height:1.9;
  }
  .state .val { color:#fff; font-weight:600; }
  .state .truth { color:#666; }

  .controls { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  button {
    flex:1; min-width:120px;
    background:#000; border:1px solid #444; color:#fff;
    padding:11px 20px; font-family:inherit;
    font-size:.85rem; letter-spacing:2px;
    text-transform:uppercase; cursor:pointer;
    transition:.08s;
  }
  button:hover { background:#111; border-color:#777; }
  button:active { transform:translateY(1px); }
  button:disabled { opacity:.3; pointer-events:none; }

  .log {
    border:1px solid #1e1e1e;
    padding:12px;
    max-height:220px; overflow-y:auto;
    font-size:.78rem;
    scrollbar-width:thin;
    scrollbar-color:#333 #000;
  }
  .log::-webkit-scrollbar { width:5px; }
  .log::-webkit-scrollbar-thumb { background:#333; }

  .log-line {
    padding:4px 0;
    border-bottom:1px solid #111;
    color:#aaa;
    animation:fade .15s ease;
    font-family:'Courier New', monospace;
  }
  .log-line:last-child { border-bottom:none; }
  .log-line .tag { color:#666; margin-right:8px; }
  .log-line .before { color:#888; }
  .log-line .after { color:#fff; }
  .log-line .diff { color:#555; }
  .log-line .warn { color:#777; font-style:italic; }
  @keyframes fade { from{opacity:0;transform:translateX(-4px)} to{opacity:1;transform:none} }

  .note {
    font-size:.7rem; color:#3a3a3a;
    margin-top:12px; letter-spacing:1px;
    text-align:right;
  }
</style>
</head>
<body>
<div class="terminal">

  <div class="bar">
    <span><span class="dot">●</span> MEMORY DAEMON</span>
    <span id="driftLabel">DRIFT: 0%</span>
  </div>

  <canvas id="c" width="800" height="160"></canvas>

  <div class="state">
    程序当前记忆：<span class="val" id="beliefText">123</span><br>
    外部真相（程序看不到）：<span class="truth" id="truthText">123</span>
  </div>

  <div class="controls">
    <button id="tickBtn">▸ 回忆一次</button>
    <button id="autoBtn">▸ 自动回忆</button>
    <button id="resetBtn" style="flex:0 0 auto; min-width:90px;">⟲ 重置记忆</button>
  </div>

  <div class="log" id="log"></div>

  <div class="note">每次"回忆"都会对记忆做一次随机微调，程序不知道原版是什么。</div>
</div>

<script>
(function(){
  // ============================================================
  // 核心状态
  // ============================================================
  // 外部真相——永远不变，程序无法访问
  const TRUTH = "1234567890";

  // 程序当前记忆——会被自己的"回忆"过程篡改
  let memory = TRUTH;

  // 累计漂移量（用于模糊度）
  let drift = 0;

  // 日志
  let logs = [];

  // 自动定时器
  let autoTimer = null;

  // ============================================================
  // 字符变换：程序"回忆"时会随机用这些规则篡改字符
  // ============================================================
  // 每个函数接受一个字符，返回替换结果（可能相同，表示没变）
  const MUTATORS = [
    // 数字 -> 相似形状的数字
    c => { const m = {'1':'7','2':'Z','3':'8','4':'A','5':'S','6':'G','7':'1','8':'B','9':'g','0':'O'}; return m[c] || c; },
    // 数字 -> 字母
    c => { const m = {'1':'l','2':'Z','3':'E','4':'A','5':'S','6':'G','7':'T','8':'B','9':'q','0':'O'}; return m[c] || c; },
    // 字母 -> 相似字母
    c => { const m = {'Z':'2','O':'0','l':'1','S':'5','B':'8','G':'6','A':'4','E':'3','T':'7','q':'9'}; return m[c] || c; },
    // 删除一个字符（会单独处理）
  ];

  // 字符池（用于偶尔插入/替换成完全无关字符）
  const NOISE_CHARS = '!@#$%^&*?~';

  // ============================================================
  // 核心：对当前记忆做一次随机微调
  // 返回 { newMemory, changes }
  // ============================================================
  function perturbMemory(mem) {
    if (mem.length === 0) return { newMemory: '?', changes: [] };

    // 把字符串拆成数组，方便操作
    let chars = mem.split('');
    const changes = [];   // 记录改动：{ pos, from, to }

    // ---- 决定这次做几次微调（1~2次，偶尔3次）----
    let ops = 1;
    const r = Math.random();
    if (r > 0.7) ops = 2;
    if (r > 0.92) ops = 3;

    for (let op = 0; op < ops; op++) {
      // 随机选一种操作类型
      const type = Math.floor(Math.random() * 5); // 0-4

      // 随机位置
      const pos = Math.floor(Math.random() * chars.length);
      const oldChar = chars[pos];

      let newChar = oldChar;

      switch (type) {
        case 0: {
          // 用形状相似规则替换
          const mutator = MUTATORS[Math.floor(Math.random() * MUTATORS.length)];
          newChar = mutator(oldChar);
          break;
        }
        case 1: {
          // 用乱码字符替换
          newChar = NOISE_CHARS[Math.floor(Math.random() * NOISE_CHARS.length)];
          break;
        }
        case 2: {
          // 删除这个字符（如果长度>2）
          if (chars.length > 2) {
            chars.splice(pos, 1);
            changes.push({ pos, from: oldChar, to: '(删除)' });
            continue; // 跳过后面的赋值
          }
          // 太短了就不删，改成替换
          newChar = NOISE_CHARS[Math.floor(Math.random() * NOISE_CHARS.length)];
          break;
        }
        case 3: {
          // 交换相邻两个字符
          if (chars.length > 1) {
            const other = pos === chars.length - 1 ? pos - 1 : pos + 1;
            const tmp = chars[pos];
            chars[pos] = chars[other];
            chars[other] = tmp;
            changes.push({ pos, from: oldChar, to: chars[pos] });
            continue;
          }
          newChar = NOISE_CHARS[Math.floor(Math.random() * NOISE_CHARS.length)];
          break;
        }
        case 4: {
          // 重复这个字符（如果长度<16）
          if (chars.length < 16) {
            chars.splice(pos, 0, oldChar);
            changes.push({ pos, from: oldChar, to: oldChar + oldChar });
            continue;
          }
          newChar = NOISE_CHARS[Math.floor(Math.random() * NOISE_CHARS.length)];
          break;
        }
      }

      // 如果字符变了，记录
      if (newChar !== oldChar) {
        chars[pos] = newChar;
        changes.push({ pos, from: oldChar, to: newChar });
      }
    }

    return { newMemory: chars.join(''), changes };
  }

  // ============================================================
  // DOM
  // ============================================================
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const beliefText = document.getElementById('beliefText');
  const truthText = document.getElementById('truthText');
  const logEl = document.getElementById('log');
  const driftLabel = document.getElementById('driftLabel');
  const tickBtn = document.getElementById('tickBtn');
  const autoBtn = document.getElementById('autoBtn');
  const resetBtn = document.getElementById('resetBtn');

  // ============================================================
  // Canvas 绘制（模糊度随 drift 增加）
  // ============================================================
  function draw(text, blurLevel) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 字号自适应
    let fontSize = 56;
    ctx.font = `bold ${fontSize}px 'Courier New', monospace`;
    let m = ctx.measureText(text);
    const maxW = canvas.width - 80;
    if (m.width > maxW) {
      fontSize = Math.floor(fontSize * maxW / m.width);
      ctx.font = `bold ${fontSize}px 'Courier New', monospace`;
    }

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    // 基础文字
    ctx.fillStyle = '#fff';
    ctx.fillText(text, cx, cy);

    // 重影
    const ghostCount = Math.floor(blurLevel * 20);
    ctx.globalAlpha = 0.1 + blurLevel * 0.15;
    for (let i = 0; i < ghostCount; i++) {
      const dx = (Math.random() - 0.5) * 10 * blurLevel;
      const dy = (Math.random() - 0.5) * 10 * blurLevel;
      ctx.fillText(text, cx + dx, cy + dy);
    }

    // 噪点
    ctx.globalAlpha = 0.03 + blurLevel * 0.1;
    ctx.fillStyle = '#fff';
    const dots = Math.floor(200 + blurLevel * 2000);
    for (let i = 0; i < dots; i++) {
      ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height,
                   Math.random() * 1.8 + 0.4, Math.random() * 1.8 + 0.4);
    }

    // 扫描线
    ctx.globalAlpha = 0.05;
    for (let y = 0; y < canvas.height; y += 3) {
      ctx.fillRect(0, y, canvas.width, 1);
    }

    ctx.restore();
  }

  // ============================================================
  // 核心：回忆一次
  // ============================================================
  function tick() {
    const before = memory;

    // 对当前记忆做随机微调
    const { newMemory, changes } = perturbMemory(before);

    // 更新记忆
    memory = newMemory;

    // 累计漂移量：根据这次改动大小增加
    if (changes.length > 0) {
      drift = Math.min(100, drift + changes.length * 4 + Math.random() * 5);
    } else {
      drift = Math.min(100, drift + 1);
    }

    // ---- 写日志 ----
    const time = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    if (changes.length > 0) {
      // 把改动描述成字符串
      const changeDesc = changes.map(c => `${c.from}→${c.to}`).join('，');
      logs.push({
        time,
        before,
        after: newMemory,
        changeDesc,
        drift: Math.floor(drift),
        type: 'change'
      });
    } else {
      logs.push({
        time,
        before,
        after: newMemory,
        changeDesc: '（无变化）',
        drift: Math.floor(drift),
        type: 'stable'
      });
    }

    if (logs.length > 80) logs = logs.slice(-80);

    render();
  }

  // ============================================================
  // 渲染
  // ============================================================
  function render() {
    const blurLevel = drift / 100;

    draw(memory, blurLevel);
    beliefText.textContent = memory;
    truthText.textContent = TRUTH;

    driftLabel.textContent = `DRIFT: ${Math.floor(drift)}%`;
    driftLabel.style.color = drift > 70 ? '#fff' : '#666';

    logEl.innerHTML = '';
    for (let i = logs.length - 1; i >= 0; i--) {
      const L = logs[i];
      const div = document.createElement('div');
      div.className = 'log-line';

      if (L.type === 'change') {
        div.innerHTML = `<span class="tag">[${L.time}]</span>
          <span class="before">${escapeHtml(L.before)}</span>
          <span class="diff"> → </span>
          <span class="after">${escapeHtml(L.after)}</span>
          <span class="tag" style="float:right">${escapeHtml(L.changeDesc)} · drift ${L.drift}%</span>`;
      } else {
        div.innerHTML = `<span class="tag">[${L.time}]</span>
          <span class="before">${escapeHtml(L.before)}</span>
          <span class="warn">（回忆了一次，没变）</span>
          <span class="tag" style="float:right">drift ${L.drift}%</span>`;
      }
      logEl.appendChild(div);
    }

    autoBtn.textContent = autoTimer ? '▸ 停止' : '▸ 自动回忆';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  // ============================================================
  // 自动运行 / 重置
  // ============================================================
  function toggleAuto() {
    if (autoTimer) {
      clearInterval(autoTimer);
      autoTimer = null;
      render();
    } else {
      autoTimer = setInterval(tick, 700);
      render();
    }
  }

  function reset() {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    memory = TRUTH;
    drift = 0;
    logs = [];
    render();
  }

  // ============================================================
  // 初始化
  // ============================================================
  function init() {
    reset();
  }

  // ============================================================
  // 事件
  // ============================================================
  tickBtn.addEventListener('click', tick);
  autoBtn.addEventListener('click', toggleAuto);
  resetBtn.addEventListener('click', reset);

  window.addEventListener('keydown', e => {
    if (e.key === 's' || e.key === 'S') { e.preventDefault(); tick(); }
    if (e.key === 'a' || e.key === 'A') { e.preventDefault(); toggleAuto(); }
  });

  init();
})();
</script>
</body>
</html>
