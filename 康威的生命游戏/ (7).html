<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    // 配置: 速度(ms)
    window.CONFIG = { speed: 150 };
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生命游戏 · 极简黑白</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #FFFFFF;
      --fg: #000000;
      --fg-secondary: #666666;
      --border: #E5E5E5;
      --panel-bg: #FFFFFF;
      --alive: #000000;
      --dead: #FFFFFF;
      --ripple: rgba(0, 0, 0, 0.6);
      --ripple-secondary: rgba(0, 0, 0, 0.3);
      --slider-track: #E5E5E5;
    }

    [data-theme="dark"] {
      --bg: #000000;
      --fg: #FFFFFF;
      --fg-secondary: #999999;
      --border: #333333;
      --panel-bg: #000000;
      --alive: #FFFFFF;
      --dead: #000000;
      --ripple: rgba(255, 255, 255, 0.6);
      --ripple-secondary: rgba(255, 255, 255, 0.3);
      --slider-track: #333333;
    }

    body {
      background: var(--bg);
      font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.3s cubic-bezier(0.4, 0, 0.2, 1), color 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .panel {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: var(--panel-bg);
      border-radius: 24px;
      padding: 24px 20px 28px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transition: background 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--fg);
      margin-bottom: 4px;
      text-align: center;
      transition: color 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .subtitle {
      font-size: 14px;
      color: var(--fg-secondary);
      margin-bottom: 20px;
      text-align: center;
      font-weight: 400;
      letter-spacing: 0.01em;
      transition: color 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 主题切换按钮 */
    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: transparent;
      border: 1.5px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
      padding: 0;
      overflow: hidden;
    }

    .theme-toggle:active {
      transform: scale(0.96);
      background: var(--fg);
    }

    .theme-toggle:active canvas {
      filter: invert(1);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 2px;
    }

    .theme-toggle canvas {
      width: 22px;
      height: 22px;
      display: block;
      transition: filter 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Canvas 容器 */
    .canvas-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      border-radius: 16px;
      overflow: hidden;
      border: 1.5px solid var(--border);
      background: var(--dead);
      transition: border-color 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #lifeCanvas {
      display: block;
      width: 100%;
      height: auto;
      max-width: 400px;
      aspect-ratio: 1 / 1;
      cursor: pointer;
      touch-action: manipulation;
      background: var(--dead);
      transition: background 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .button-row {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-bottom: 18px;
    }

    .btn {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      background-color: var(--fg);
      color: var(--bg);
      border: 1.5px solid var(--fg);
      border-radius: 50px;
      padding: 12px 0;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: center;
      touch-action: manipulation;
      outline: none;
      font-family: inherit;
    }

    .btn.secondary {
      background-color: var(--bg);
      color: var(--fg);
      border-color: var(--fg);
    }

    .btn:active {
      transform: scale(0.96);
      background-color: var(--bg);
      color: var(--fg);
    }

    .btn.secondary:active {
      transform: scale(0.96);
      background-color: var(--fg);
      color: var(--bg);
    }

    .btn:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 2px;
    }

    .slider-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 6px;
    }

    .slider-label {
      font-size: 14px;
      color: var(--fg-secondary);
      white-space: nowrap;
      font-weight: 500;
      transition: color 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 1.5px;
      background: var(--slider-track);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
      transition: background 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      touch-action: manipulation;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      background: var(--fg);
      border-radius: 50%;
      border: none;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 0 1.5px var(--bg), 0 0 0 3px var(--fg);
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      background: var(--fg);
      border-radius: 50%;
      border: 1.5px solid var(--bg);
      box-shadow: 0 0 0 1.5px var(--fg);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    input[type="range"]:active::-webkit-slider-thumb {
      transform: scale(1.25);
      background: var(--fg-secondary);
    }

    input[type="range"]:active::-moz-range-thumb {
      transform: scale(1.25);
      background: var(--fg-secondary);
    }

    input[type="range"]:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 4px;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .panel > * {
      animation: fadeInUp 0.4s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    .panel > *:nth-child(1) { animation-delay: 0.02s; }
    .panel > *:nth-child(2) { animation-delay: 0.06s; }
    .panel > *:nth-child(3) { animation-delay: 0.10s; }
    .panel > *:nth-child(4) { animation-delay: 0.14s; }
    .panel > *:nth-child(5) { animation-delay: 0.18s; }
    .panel > *:nth-child(6) { animation-delay: 0.22s; }

    @media (max-width: 420px) {
      .panel {
        padding: 20px 16px 24px;
      }
      h1 {
        font-size: 22px;
      }
      .btn {
        padding: 10px 0;
        font-size: 14px;
      }
      .theme-toggle {
        top: 16px;
        right: 16px;
        width: 32px;
        height: 32px;
      }
      .theme-toggle canvas {
        width: 20px;
        height: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="panel">
    <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
      <canvas id="morphCanvas" width="88" height="88"></canvas>
    </button>

    <h1>生命游戏</h1>
    <div class="subtitle">Conway's Game of Life · 点击格子切换状态</div>

    <div class="canvas-wrap">
      <canvas id="lifeCanvas" width="400" height="400"></canvas>
    </div>

    <div class="button-row">
      <button class="btn" id="playPauseBtn">暂停</button>
      <button class="btn secondary" id="randomBtn">随机</button>
      <button class="btn secondary" id="clearBtn">清空</button>
    </div>

    <div class="slider-container">
      <span class="slider-label">速度</span>
      <input type="range" id="speedSlider" min="40" max="500" value="150" step="10">
    </div>
  </div>

  <script>
    (function(){
      const CONFIG = window.CONFIG || { speed: 150 };

      function getThemeColors() {
        const style = getComputedStyle(document.documentElement);
        return {
          alive: style.getPropertyValue('--alive').trim() || '#000000',
          dead: style.getPropertyValue('--dead').trim() || '#FFFFFF',
          ripple: style.getPropertyValue('--ripple').trim() || 'rgba(0, 0, 0, 0.6)',
          rippleSecondary: style.getPropertyValue('--ripple-secondary').trim() || 'rgba(0, 0, 0, 0.3)',
          border: style.getPropertyValue('--border').trim() || '#E5E5E5',
          fg: style.getPropertyValue('--fg').trim() || '#000000'
        };
      }

      const canvas = document.getElementById('lifeCanvas');
      const ctx = canvas.getContext('2d');
      const COLS = 40;
      const ROWS = 40;
      const CELL_SIZE = canvas.width / COLS;

      let grid = new Array(ROWS).fill(0).map(() => new Array(COLS).fill(0));
      let isPlaying = true;
      let intervalId = null;
      let currentSpeed = CONFIG.speed;
      let ripples = [];

      const speedSlider = document.getElementById('speedSlider');
      const playPauseBtn = document.getElementById('playPauseBtn');
      const themeToggle = document.getElementById('themeToggle');

      speedSlider.value = currentSpeed;

      function randomizeGrid() {
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            grid[r][c] = Math.random() < 0.3 ? 1 : 0;
          }
        }
      }

      function clearGrid() {
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            grid[r][c] = 0;
          }
        }
      }

      function draw() {
        const colors = getThemeColors();
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            ctx.fillStyle = grid[r][c] === 1 ? colors.alive : colors.dead;
            ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE - 0.5, CELL_SIZE - 0.5);
          }
        }

        ctx.strokeStyle = colors.border;
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= COLS; i++) {
          ctx.beginPath();
          ctx.moveTo(i * CELL_SIZE, 0);
          ctx.lineTo(i * CELL_SIZE, canvas.height);
          ctx.stroke();
        }
        for (let i = 0; i <= ROWS; i++) {
          ctx.beginPath();
          ctx.moveTo(0, i * CELL_SIZE);
          ctx.lineTo(canvas.width, i * CELL_SIZE);
          ctx.stroke();
        }

        for (let i = ripples.length - 1; i >= 0; i--) {
          const rp = ripples[i];
          const progress = (performance.now() - rp.startTime) / rp.duration;
          if (progress >= 1) {
            ripples.splice(i, 1);
            continue;
          }
          const radius = rp.maxRadius * progress;
          const alpha = 1 - progress;
          ctx.beginPath();
          ctx.arc(rp.x, rp.y, radius, 0, Math.PI * 2);
          const rgb = colors.ripple.replace(/rgba?\(|\)/g, '').split(',').slice(0, 3).join(',');
          ctx.strokeStyle = `rgba(${rgb}, ${alpha * 0.6})`;
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(rp.x, rp.y, radius * 0.7, 0, Math.PI * 2);
          const rgb2 = colors.rippleSecondary.replace(/rgba?\(|\)/g, '').split(',').slice(0, 3).join(',');
          ctx.strokeStyle = `rgba(${rgb2}, ${alpha * 0.3})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      function step() {
        const newGrid = new Array(ROWS).fill(0).map(() => new Array(COLS).fill(0));
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            let neighbors = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                if (dr === 0 && dc === 0) continue;
                const nr = (r + dr + ROWS) % ROWS;
                const nc = (c + dc + COLS) % COLS;
                neighbors += grid[nr][nc];
              }
            }
            if (grid[r][c] === 1) {
              newGrid[r][c] = (neighbors === 2 || neighbors === 3) ? 1 : 0;
            } else {
              newGrid[r][c] = (neighbors === 3) ? 1 : 0;
            }
          }
        }
        grid = newGrid;
        draw();
      }

      function startEvolution() {
        if (intervalId) clearInterval(intervalId);
        intervalId = setInterval(step, currentSpeed);
      }

      function stopEvolution() {
        if (intervalId) {
          clearInterval(intervalId);
          intervalId = null;
        }
      }

      function updatePlayPauseUI() {
        if (isPlaying) {
          playPauseBtn.textContent = '暂停';
          playPauseBtn.classList.remove('secondary');
        } else {
          playPauseBtn.textContent = '播放';
          playPauseBtn.classList.add('secondary');
        }
      }

      function togglePlay() {
        isPlaying = !isPlaying;
        if (isPlaying) {
          startEvolution();
        } else {
          stopEvolution();
        }
        updatePlayPauseUI();
      }

      function handleCanvasClick(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mouseX = (e.clientX - rect.left) * scaleX;
        const mouseY = (e.clientY - rect.top) * scaleY;
        const col = Math.floor(mouseX / CELL_SIZE);
        const row = Math.floor(mouseY / CELL_SIZE);
        if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
          grid[row][col] = grid[row][col] === 1 ? 0 : 1;
          const cx = col * CELL_SIZE + CELL_SIZE / 2;
          const cy = row * CELL_SIZE + CELL_SIZE / 2;
          ripples.push({
            x: cx,
            y: cy,
            startTime: performance.now(),
            duration: 350,
            maxRadius: 30
          });
          draw();
        }
      }

      let rafId = null;
      function animationLoop() {
        if (ripples.length > 0) {
          draw();
        }
        rafId = requestAnimationFrame(animationLoop);
      }
      animationLoop();

      randomizeGrid();
      draw();
      if (isPlaying) {
        startEvolution();
      }
      updatePlayPauseUI();

      canvas.addEventListener('click', handleCanvasClick);
      playPauseBtn.addEventListener('click', togglePlay);
      document.getElementById('randomBtn').addEventListener('click', function() {
        randomizeGrid();
        draw();
      });
      document.getElementById('clearBtn').addEventListener('click', function() {
        clearGrid();
        draw();
      });
      speedSlider.addEventListener('input', function(e) {
        currentSpeed = parseInt(e.target.value, 10);
        if (isPlaying && intervalId) {
          stopEvolution();
          startEvolution();
        }
      });

      window.addEventListener('beforeunload', function() {
        if (rafId) cancelAnimationFrame(rafId);
        stopEvolution();
      });

      /* ============================================================
         主题切换按钮：Canvas 多子路径 Morphing（太阳 ↔ 月亮）
         基于测试文件的 SVG 采样 + 重采样 + 弧长参数化技术
         ============================================================ */

      const morphCanvas = document.getElementById('morphCanvas');
      const mCtx = morphCanvas.getContext('2d');
      const MW = morphCanvas.width, MH = morphCanvas.height;
      const MCX = MW/2, MCY = MH/2, MR = 36;
      const MN = 60;
      const MSPEED = 0.025;

      const easeMorph = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;

      // 太阳形状：圆形 + 8条光芒线（作为多个子路径）
      function buildSunSubPaths(){
        const subs = [];
        // 核心圆
        const circlePts = [];
        for (let i = 0; i < MN; i++){
          const a = (i/MN)*Math.PI*2;
          circlePts.push({x: MCX + Math.cos(a)*MR*0.42, y: MCY + Math.sin(a)*MR*0.42});
        }
        subs.push({points: circlePts, closed: true});
        // 8条光芒
        const innerR = MR*0.58, outerR = MR;
        for (let k = 0; k < 8; k++){
          const a = -Math.PI/2 + k*Math.PI/4;
          const x1 = MCX + Math.cos(a)*innerR;
          const y1 = MCY + Math.sin(a)*innerR;
          const x2 = MCX + Math.cos(a)*outerR;
          const y2 = MCY + Math.sin(a)*outerR;
          const pts = [];
          for (let i = 0; i < MN; i++){
            const t = i/MN;
            pts.push({x: x1 + (x2-x1)*t, y: y1 + (y2-y1)*t});
          }
          subs.push({points: pts, closed: false});
        }
        return subs;
      }

      // 月亮形状：月牙轮廓（外圆弧 + 内弧咬合）
      function buildMoonSubPaths(){
        const subs = [];
        // 外圆
        const outerPts = [];
        const outerR = MR*0.85;
        for (let i = 0; i < MN; i++){
          const a = (i/MN)*Math.PI*2 - Math.PI/2;
          outerPts.push({x: MCX + Math.cos(a)*outerR, y: MCY + Math.sin(a)*outerR});
        }
        // 内弧：从右上方向内咬掉，形成月牙
        // 使用参数化曲线生成内弧点集，从外圆上方某点开始向右下方弯曲
        const innerPts = [];
        const biteR = MR*0.95;
        const biteCx = MCX + MR*0.55;
        const biteCy = MCY - MR*0.35;
        const startAngle = -Math.PI*0.85;
        const endAngle = Math.PI*0.15;
        const steps = MN;
        for (let i = 0; i < steps; i++){
          const t = i/(steps-1);
          const a = startAngle + (endAngle - startAngle)*t;
          // 内弧半径随角度变化，产生月牙咬合感
          const r = biteR * (0.7 + 0.3*Math.sin(t*Math.PI));
          innerPts.push({x: biteCx + Math.cos(a)*r, y: biteCy + Math.sin(a)*r});
        }
        // 组合：外圆 + 内弧（开口连接）
        const combined = outerPts.concat(innerPts);
        // 重采样到统一数量
        const resampled = resampleClosedMorph(combined, MN);
        subs.push({points: resampled, closed: true});
        return subs;
      }

      // 重采样（闭合）
      function resampleClosedMorph(pts, n){
        if (pts.length < 2) return pts;
        const closed = pts.concat([{...pts[0]}]);
        let total = 0;
        for (let i = 1; i < closed.length; i++){
          total += Math.hypot(closed[i].x-closed[i-1].x, closed[i].y-closed[i-1].y);
        }
        if (total === 0) return Array.from({length:n}, () => ({...pts[0]}));
        const step = total/n;
        const out = [{x: closed[0].x, y: closed[0].y}];
        let segIdx = 0, segStart = closed[0], segEnd = closed[1];
        let segLen = Math.hypot(segEnd.x-segStart.x, segEnd.y-segStart.y);
        let segDone = 0;
        for (let i = 1; i < n; i++){
          const target = i*step;
          let ok = false;
          while (segIdx < closed.length-1){
            if (segDone+segLen >= target-1e-9){
              const t = segLen === 0 ? 0 : (target-segDone)/segLen;
              out.push({x: segStart.x+(segEnd.x-segStart.x)*t, y: segStart.y+(segEnd.y-segStart.y)*t});
              ok = true; break;
            }
            segDone += segLen; segIdx++;
            if (segIdx >= closed.length-1) break;
            segStart = closed[segIdx]; segEnd = closed[segIdx+1];
            segLen = Math.hypot(segEnd.x-segStart.x, segEnd.y-segStart.y);
          }
          if (!ok) out.push({...closed[closed.length-1]});
        }
        return out.slice(0, n);
      }

      // 子路径匹配：将月亮子路径与太阳子路径配对
      function buildMorphPairs(){
        const sun = buildSunSubPaths();
        const moon = buildMoonSubPaths();

        // 太阳：1个圆 + 8条线 = 9个子路径
        // 月亮：1个闭合月牙 = 1个子路径
        // 配对策略：月牙与太阳核心圆配对；多余的光芒线收缩到月牙上
        const pairs = [];
        const moonMain = moon[0];

        // 核心圆 -> 月牙
        pairs.push({
          start: sun[0].points,
          end: prepareEndMorph(sun[0].points, moonMain.points, true),
          closed: true
        });

        // 8条光芒 -> 缩到月牙中心附近（形成融化效果）
        for (let i = 1; i < sun.length; i++){
          const ray = sun[i];
          // 终点：缩到月牙中心的一个极短线段
          const cx = MCX + MR*0.15, cy = MCY - MR*0.1;
          const tinyEnd = [];
          for (let j = 0; j < MN; j++){
            const t = j/MN;
            tinyEnd.push({x: cx + (t-0.5)*2, y: cy + (t-0.5)*2});
          }
          const prepared = prepareEndMorph(ray.points, tinyEnd, false);
          pairs.push({
            start: ray.points,
            end: prepared,
            closed: false
          });
        }
        return pairs;
      }

      function prepareEndMorph(startPoints, targetPoints, targetClosed){
        let endSamples = targetClosed
          ? resampleClosedMorph(targetPoints, MN)
          : resampleOpenMorph(targetPoints, MN);

        const first = startPoints[0];
        // 寻找最近点作为起点
        let bestIdx = 0, bestDist = Infinity;
        for (let i = 0; i < endSamples.length; i++){
          const d = Math.hypot(endSamples[i].x-first.x, endSamples[i].y-first.y);
          if (d < bestDist){ bestDist = d; bestIdx = i; }
        }
        if (bestIdx !== 0){
          endSamples = endSamples.slice(bestIdx).concat(endSamples.slice(0, bestIdx));
          if (targetClosed) endSamples[endSamples.length-1] = {...endSamples[0]};
        }
        // 检查方向
        const dF = Math.hypot(endSamples[0].x-first.x, endSamples[0].y-first.y);
        const dR = Math.hypot(endSamples[endSamples.length-1].x-first.x, endSamples[endSamples.length-1].y-first.y);
        if (dR < dF){
          endSamples.reverse();
          if (targetClosed) endSamples[endSamples.length-1] = {...endSamples[0]};
        }
        return endSamples;
      }

      function resampleOpenMorph(pts, n){
        if (pts.length < 2) return Array.from({length:n}, () => ({...pts[0]}));
        let total = 0;
        for (let i = 1; i < pts.length; i++){
          total += Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
        }
        if (total === 0) return Array.from({length:n}, () => ({...pts[0]}));
        const step = total/(n-1);
        const out = [{x: pts[0].x, y: pts[0].y}];
        let segIdx = 0, segStart = pts[0], segEnd = pts[1];
        let segLen = Math.hypot(segEnd.x-segStart.x, segEnd.y-segStart.y);
        let segDone = 0;
        for (let i = 1; i < n; i++){
          const target = i*step;
          let ok = false;
          while (segIdx < pts.length-1){
            if (segDone+segLen >= target-1e-9){
              const t = segLen === 0 ? 0 : (target-segDone)/segLen;
              out.push({x: segStart.x+(segEnd.x-segStart.x)*t, y: segStart.y+(segEnd.y-segStart.y)*t});
              ok = true; break;
            }
            segDone += segLen; segIdx++;
            if (segIdx >= pts.length-1) break;
            segStart = pts[segIdx]; segEnd = pts[segIdx+1];
            segLen = Math.hypot(segEnd.x-segStart.x, segEnd.y-segStart.y);
          }
          if (!ok) out.push({...pts[pts.length-1]});
        }
        return out.slice(0, n);
      }

      let morphPairs = null;
      let morphProgress = 0;
      let morphTarget = 0; // 0 = 太阳, 1 = 月亮
      let morphAnimating = false;
      let morphRAF = null;

      function buildMorph(){
        morphPairs = buildMorphPairs();
      }

      function drawMorph(){
        const colors = getThemeColors();
        mCtx.clearRect(0, 0, MW, MH);
        if (!morphPairs) return;

        const t = easeMorph(morphProgress);
        mCtx.strokeStyle = colors.fg;
        mCtx.lineWidth = 3.2;
        mCtx.lineCap = 'round';
        mCtx.lineJoin = 'round';

        for (const pair of morphPairs){
          mCtx.beginPath();
          for (let i = 0; i < MN; i++){
            const a = pair.start[i], b = pair.end[i];
            const x = a.x + (b.x-a.x)*t;
            const y = a.y + (b.y-a.y)*t;
            if (i === 0) mCtx.moveTo(x, y); else mCtx.lineTo(x, y);
          }
          if (pair.closed) mCtx.closePath();
          mCtx.stroke();
        }
      }

      function animateMorph(){
        const diff = morphTarget - morphProgress;
        if (Math.abs(diff) < 0.005){
          morphProgress = morphTarget;
          drawMorph();
          morphAnimating = false;
          return;
        }
        morphProgress += diff * 0.18;
        drawMorph();
        morphRAF = requestAnimationFrame(animateMorph);
      }

      function toggleTheme(){
        const current = document.documentElement.getAttribute('data-theme');
        if (current === 'dark'){
          document.documentElement.removeAttribute('data-theme');
          morphTarget = 0;
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
          morphTarget = 1;
        }
        draw(); // 同步生命游戏 Canvas 颜色
        if (!morphAnimating){
          morphAnimating = true;
          morphRAF = requestAnimationFrame(animateMorph);
        }
      }

      themeToggle.addEventListener('click', toggleTheme);

      // 初始化 morph
      buildMorph();
      drawMorph();

      // 主题切换时重绘 morph（颜色同步）
      const themeObserver = new MutationObserver(function(){
        drawMorph();
      });
      themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    })();
  </script>
</body>
