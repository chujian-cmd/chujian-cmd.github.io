<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>测试 6 - 排查是否运行</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden; color: #fff;
  }
  #app { position: relative; width: 100%; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>
</div>
<script>
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  let frames = 0;

  function frame() {
    // 每次重绘，背景变一点点颜色，数字不断变大，用来证明循环在跑
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 30px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    ctx.fillText('如果你看到这行字', canvas.width/2, canvas.height/2 - 40);
    ctx.fillText('说明代码在运行', canvas.width/2, canvas.height/2);
    ctx.fillText('帧数: ' + frames, canvas.width/2, canvas.height/2 + 40);

    frames++;
    requestAnimationFrame(frame);
  }
  
  // 启动循环
  frame();
</script>
</body>
</html>
