<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纯净 3D 排查</title>
<style>
  body { margin: 0; background: #000; color: #fff; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

// 1. 强制初始化尺寸
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const ROOM = { w: 8, h: 3.2, d: 10 };
const hx = ROOM.w/2, hz = ROOM.d/2, top = ROOM.h;

// 2. 简单射线检测
function raycast(origin, dir) {
  let bestT = Infinity, bestName = "空";
  
  // 检查四面墙和地板
  if (dir[2] !== 0) {
    let t = (-hz - origin[2]) / dir[2];
    if (t > 0 && t < bestT) { bestT = t; bestName = "后墙"; }
    t = (hz - origin[2]) / dir[2];
    if (t > 0 && t < bestT) { bestT = t; bestName = "前墙"; }
  }
  if (dir[0] !== 0) {
    let t = (-hx - origin[0]) / dir[0];
    if (t > 0 && t < bestT) { bestT = t; bestName = "左墙"; }
    t = (hx - origin[0]) / dir[0];
    if (t > 0 && t < bestT) { bestT = t; bestName = "右墙"; }
  }
  if (dir[1] !== 0) {
    let t = (0 - origin[1]) / dir[1];
    if (t > 0 && t < bestT) { bestT = t; bestName = "地板"; }
  }
  
  return { name: bestName, t: bestT };
}

// 3. 固定相机
const camPos = [0, 1.6, 4.5];
const camDir = [0, 0, -1]; // 笔直看向前方 (-Z)

function render() {
  // 每次都清空屏幕
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.fillStyle = '#00ff00'; // 绿色字，绝对看得见
  ctx.font = 'bold 20px sans-serif';
  ctx.textAlign = 'center';
  
  // 只在屏幕中心画一个十字准星，测试中心点射线
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  
  const hit = raycast(camPos, camDir);
  
  // 屏幕中心显示命中的结果
  ctx.fillText(`命中: ${hit.name}`, cx, cy);
  ctx.fillText(`距离: ${hit.t.toFixed(2)}`, cx, cy + 30);
  ctx.fillText(`坐标: ${camPos}`, cx, cy + 60);
  
  requestAnimationFrame(render);
}

render();
</script>
</body>
</html>
