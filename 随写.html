<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粒子星空 · 时钟</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #0d2036 0%, #060b14 55%, #02040a 100%);
  }

  canvas {
    position: fixed;
    inset: 0;
    display: block;
  }

  .clock {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #eaf6ff;
    user-select: none;
  }

  #time {
    font-size: clamp(52px, 13vw, 150px);
    font-weight: 200;
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 40px rgba(90, 180, 255, 0.5);
    background: linear-gradient(180deg, #ffffff 0%, #8ecbff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  #date {
    margin-top: 10px;
    font-size: clamp(12px, 1.6vw, 17px);
    letter-spacing: 0.35em;
    opacity: 0.55;
  }

  .hint {
    position: fixed;
    bottom: 26px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.25em;
    color: #7fb6e0;
    opacity: 0.45;
    font-family: system-ui, sans-serif;
    pointer-events: none;
    animation: breathe 3s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 0.6; }
  }
</style>
</head>
<body>

  <canvas id="scene"></canvas>

  <div class="clock">
    <div id="time">--:--:--</div>
    <div id="date">加载中…</div>
  </div>

  <div class="hint">移动鼠标 / 滑动屏幕</div>

<script>
(() => {
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const timeEl = document.getElementById('time');
  const dateEl = document.getElementById('date');

  let W = 0, H = 0;
  const mouse = { x: -9999, y: -9999 };

  // ---------- 画布尺寸 ----------
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // ---------- 粒子 ----------
  const COUNT = Math.min(110, Math.round(window.innerWidth / 14));
  const LINK_DIST = 130;
  const particles = [];

  for (let i = 0; i < COUNT; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.45,
      vy: (Math.random() - 0.5) * 0.45,
      r: Math.random() * 1.8 + 0.8
    });
  }

  // ---------- 鼠标 / 触摸 ----------
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mouseleave', () => {
    mouse.x = mouse.y = -9999;
  });
  window.addEventListener('touchmove', e => {
    const t = e.touches[0];
    mouse.x = t.clientX;
    mouse.y = t.clientY;
  }, { passive: true });

  // ---------- 动画循环 ----------
  function loop() {
    ctx.clearRect(0, 0, W, H);

    // 更新位置
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;

      // 边界反弹
      if (p.x < 0)      { p.x = 0; p.vx = Math.abs(p.vx); }
      if (p.x > W)      { p.x = W; p.vx = -Math.abs(p.vx); }
      if (p.y < 0)      { p.y = 0; p.vy = Math.abs(p.vy); }
      if (p.y > H)      { p.y = H; p.vy = -Math.abs(p.vy); }

      // 鼠标斥力
      const dx = p.x - mouse.x;
      const dy = p.y - mouse.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < 16000 && d2 > 0.5) {
        const d = Math.sqrt(d2);
        const force = (1 - d / 126) * 0.9;
        p.x += (dx / d) * force;
        p.y += (dy / d) * force;
      }
    }

    // 连线
    for (let i = 0; i < particles.length; i++) {
      const a = particles[i];
      for (let j = i + 1; j < particles.length; j++) {
        const b = particles[j];
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < LINK_DIST * LINK_DIST) {
          const alpha = (1 - Math.sqrt(d2) / LINK_DIST) * 0.32;
          ctx.strokeStyle = `rgba(110, 195, 255, ${alpha})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    // 画点
    for (const p of particles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(175, 225, 255, 0.9)';
      ctx.fill();
    }

    requestAnimationFrame(loop);
  }
  loop();

  // ---------- 时钟 ----------
  const WEEK = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

  function tick() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    timeEl.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    dateEl.textContent =
      `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日 · ${WEEK[d.getDay()]}`;
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
