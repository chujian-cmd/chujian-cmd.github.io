<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111">
<title>影子物理 · 手机版</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;
    font-family:system-ui,-apple-system,sans-serif;
    touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
  #stage{position:fixed;inset:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #bg{z-index:1}
  #paintLayer{z-index:2;pointer-events:none;touch-action:none}
  #game{z-index:3;pointer-events:none}

  /* 顶部状态条 */
  #hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);
    left:50%;transform:translateX(-50%);
    color:#fff;font-size:12px;line-height:1.4;text-align:center;
    background:rgba(0,0,0,.45);padding:6px 12px;border-radius:999px;
    pointer-events:none;z-index:20;white-space:nowrap;backdrop-filter:blur(6px)}
  #hud b{color:#7cf}

  /* 控制区 */
  #controls{position:absolute;inset:0;pointer-events:none;z-index:15}

  #joystick{position:absolute;
    left:calc(env(safe-area-inset-left,0px) + 24px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
    width:130px;height:130px;border-radius:50%;
    background:rgba(255,255,255,.08);
    border:2px solid rgba(255,255,255,.18);
    pointer-events:auto;touch-action:none;
    display:flex;align-items:center;justify-content:center}
  #knob{width:56px;height:56px;border-radius:50%;
    background:rgba(255,255,255,.55);
    box-shadow:0 2px 10px rgba(0,0,0,.4);
    transform:translate(0,0);
    transition:transform .06s linear}

  #jumpBtn{position:absolute;
    right:calc(env(safe-area-inset-right,0px) + 28px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 40px);
    width:90px;height:90px;border-radius:50%;
    background:rgba(124,252,255,.22);
    border:2px solid rgba(124,252,255,.5);
    color:#7cf;font-size:15px;font-weight:700;
    pointer-events:auto;touch-action:none;
    display:flex;align-items:center;justify-content:center}

  #sideBtns{position:absolute;
    right:calc(env(safe-area-inset-right,0px) + 8px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 150px);
    display:flex;flex-direction:column;gap:8px;pointer-events:auto}
  .sbtn{width:52px;height:52px;border-radius:50%;border:0;
    background:rgba(255,255,255,.14);color:#fff;font-size:11px;
    display:flex;align-items:center;justify-content:center;
    touch-action:none;line-height:1.1;text-align:center}

  /* 手绘模式下隐藏游戏控件 */
  body.drawing #joystick,
  body.drawing #jumpBtn,
  body.drawing #sideBtns{display:none}

  /* 完成绘制按钮 */
  #doneDraw{position:absolute;z-index:30;
    left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
    padding:14px 32px;border-radius:999px;border:0;
    background:#2a7;color:#fff;font-size:15px;font-weight:700;
    display:none;pointer-events:auto;touch-action:none;
    box-shadow:0 4px 20px rgba(42,170,119,.5)}
  body.drawing #doneDraw{display:block}

  /* 手绘模式提示条 */
  #drawHint{position:absolute;z-index:25;
    top:calc(env(safe-area-inset-top,0px) + 44px);
    left:50%;transform:translateX(-50%);
    color:#fff;font-size:13px;
    background:rgba(42,170,119,.9);padding:8px 16px;border-radius:999px;
    display:none;pointer-events:none;white-space:nowrap}
  body.drawing #drawHint{display:block}

  /* 启动遮罩 */
  #splash{position:fixed;inset:0;z-index:50;background:#0b0f12;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;padding:24px;text-align:center;gap:18px}
  #splash h1{font-size:20px;margin:0}
  #splash p{font-size:13px;color:#9ab;margin:0;line-height:1.6;max-width:340px}
  #splash .btns{display:flex;flex-direction:column;gap:10px;width:min(280px,80vw)}
  #splash button{padding:14px;border-radius:12px;border:0;font-size:15px;
    background:#2a7;color:#fff;font-weight:600}
  #splash button.alt{background:#334}
  #splash .note{font-size:11px;color:#678}
</style>
</head>
<body>
<div id="stage">
  <video id="cam" playsinline muted autoplay style="display:none"></video>
  <canvas id="bg"></canvas>
  <canvas id="paintLayer"></canvas>
  <canvas id="game"></canvas>

  <div id="hud"><b>影子即关卡</b> · 暗区=地面 · 摇杆移动 · 跳</div>
  <div id="drawHint">✏️ 手指画出阴影作为地面</div>

  <div id="controls">
    <div id="joystick"><div id="knob"></div></div>
    <div id="jumpBtn">跳</div>
    <div id="sideBtns">
      <button class="sbtn" id="switchCam">切换<br>摄像头</button>
      <button class="sbtn" id="clearDraw">清空<br>阴影</button>
    </div>
  </div>

  <button id="doneDraw">完成绘制 · 开始游戏</button>
</div>

<div id="splash">
  <h1>影子物理</h1>
  <p>摄像头拍到的<b>暗区</b>会变成碰撞地面，方块能在上面跑跳。<br>没有摄像头？直接<b>手指画阴影</b>也能玩。</p>
  <div class="btns">
    <button id="startCam">用摄像头玩</button>
    <button class="alt" id="startDraw">手指画阴影</button>
  </div>
  <div class="note">建议横屏，效果更好</div>
</div>

<script>
(() => {
  // ---------- 元素 ----------
  const video      = document.getElementById('cam');
  const bg         = document.getElementById('bg');
  const paintLayer = document.getElementById('paintLayer');
  const game       = document.getElementById('game');
  const bgCtx      = bg.getContext('2d', { willReadFrequently:true });
  const paintCtx   = paintLayer.getContext('2d', { willReadFrequently:true });
  const gCtx       = game.getContext('2d');
  const splash     = document.getElementById('splash');
  const joystick   = document.getElementById('joystick');
  const knob       = document.getElementById('knob');
  const jumpBtn    = document.getElementById('jumpBtn');

  // ---------- 性能自适应 ----------
  const isCoarse = matchMedia('(pointer:coarse)').matches;
  const memHint  = navigator.deviceMemory || 4;
  const lowEnd   = isCoarse && memHint <= 4;
  const MAP_W = lowEnd ? 72 : 96;
  const MAP_H = lowEnd ? 40 : 54;

  let W=0, H=0, DPR=1;

  function sizeCanvases() {
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    for (const c of [bg, paintLayer, game]) {
      c.width  = Math.round(W*DPR);
      c.height = Math.round(H*DPR);
    }
    bgCtx.setTransform(DPR,0,0,DPR,0,0);
    paintCtx.setTransform(DPR,0,0,DPR,0,0);
    gCtx.setTransform(DPR,0,0,DPR,0,0);
  }

  function resetPlayer() {
    player.x = W/2; player.y = H/3;
    player.vx = player.vy = 0;
    player.onGround = false;
  }

  function resize() {
    sizeCanvases();
    resetPlayer();
  }

  // ---------- 手绘状态 ----------
  let paintMode = false;
  let painting  = false;

  function enterPaintMode(){
    paintMode = true;
    document.body.classList.add('drawing');
    paintLayer.style.pointerEvents = 'auto';
  }
  function exitPaintMode(){
    paintMode = false;
    document.body.classList.remove('drawing');
    paintLayer.style.pointerEvents = 'none';
    painting = false;
  }
  function clearPaint(){
    paintCtx.clearRect(0,0,W,H);
  }

  function paintAt(clientX, clientY, r=28){
    paintCtx.fillStyle = '#000';
    paintCtx.beginPath();
    paintCtx.arc(clientX, clientY, r, 0, Math.PI*2);
    paintCtx.fill();
  }

  paintLayer.addEventListener('pointerdown', e => {
    if (!paintMode) return;
    painting = true;
    paintLayer.setPointerCapture(e.pointerId);
    paintAt(e.clientX, e.clientY);
    e.preventDefault();
  });
  paintLayer.addEventListener('pointermove', e => {
    if (!paintMode || !painting) return;
    paintAt(e.clientX, e.clientY);
    e.preventDefault();
  });
  const endPaint = () => { painting = false; };
  paintLayer.addEventListener('pointerup', endPaint);
  paintLayer.addEventListener('pointercancel', endPaint);

  // ---------- 摄像头 ----------
  let camReady = false, facing = 'environment', stream = null;

  async function openCam() {
    try {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing, width:{ideal:1280}, height:{ideal:720} },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      camReady = true;
      exitPaintMode();
      splash.style.display = 'none';
    } catch(err) {
      alert('无法打开摄像头：' + err.message + '\n可改用「手指画阴影」模式。');
    }
  }

  // ---------- 碰撞地图 ----------
  const solid     = new Uint8Array(MAP_W*MAP_H);
  const prevSolid = new Uint8Array(MAP_W*MAP_H);

  const tmpCanvas = document.createElement('canvas');
  tmpCanvas.width = MAP_W; tmpCanvas.height = MAP_H;
  const tmpCtx = tmpCanvas.getContext('2d', { willReadFrequently:true });

  function updateCollisionMap(){
    if (camReady && video.videoWidth) {
      // ===== 摄像头模式：亮度阈值 + 滞回 =====
      const vw = video.videoWidth, vh = video.videoHeight;
      const scale = Math.max(W/vw, H/vh);
      const dw = vw*scale, dh = vh*scale;

      bgCtx.clearRect(0,0,W,H);
      bgCtx.drawImage(video, (W-dw)/2, (H-dh)/2, dw, dh);

      tmpCtx.clearRect(0,0,MAP_W,MAP_H);
      tmpCtx.drawImage(bg, 0,0, bg.width, bg.height, 0,0, MAP_W, MAP_H);
      const img = tmpCtx.getImageData(0,0,MAP_W,MAP_H).data;

      const HI = 78, LO = 58;
      for (let i=0,p=0; i<MAP_W*MAP_H; i++,p+=4) {
        const lum = 0.299*img[p] + 0.587*img[p+1] + 0.114*img[p+2];
        let s = prevSolid[i];
        if (lum < LO) s = 1;
        else if (lum > HI) s = 0;
        solid[i] = s;
      }
      prevSolid.set(solid);
    } else {
      // ===== 手绘模式：alpha 通道判定 =====
      bgCtx.clearRect(0,0,W,H);
      bgCtx.fillStyle = '#20262c';
      bgCtx.fillRect(0,0,W,H);

      tmpCtx.clearRect(0,0,MAP_W,MAP_H);
      tmpCtx.drawImage(paintLayer, 0,0, paintLayer.width, paintLayer.height,
                       0,0, MAP_W, MAP_H);
      const img = tmpCtx.getImageData(0,0,MAP_W,MAP_H).data;

      for (let i=0,p=3; i<MAP_W*MAP_H; i++,p+=4) {
        const a = img[p];               // alpha
        let s = prevSolid[i];
        if (a > 40) s = 1;
        else if (a < 10) s = 0;
        solid[i] = s;
      }
      prevSolid.set(solid);
    }
  }

  // ---------- 物理 ----------
  const player = { x:0, y:0, vx:0, vy:0, r:14, onGround:false, face:1 };

  function worldToCell(wx, wy){
    return {
      cx: Math.floor(wx / W * MAP_W),
      cy: Math.floor(wy / H * MAP_H)
    };
  }
  function isSolidCell(cx, cy){
    if (cx < 0 || cy < 0 || cx >= MAP_W || cy >= MAP_H) return false;
    return solid[cy*MAP_W + cx] === 1;
  }
  function circleHitsSolid(wx, wy, r){
    const step = Math.max(2, r*0.6);
    for (let dy=-r; dy<=r; dy+=step)
      for (let dx=-r; dx<=r; dx+=step) {
        if (dx*dx + dy*dy > r*r) continue;
        const c = worldToCell(wx+dx, wy+dy);
        if (isSolidCell(c.cx, c.cy)) return true;
      }
    return false;
  }

  const GRAVITY=2400, ACC=2800, MAX_VX=460, JUMP_V=760, FRICTION=0.84;
  let inputX = 0;
  let jumpHeld = false, jumpQueued = false;

  let last = performance.now();

  function step(now){
    const dt = Math.min((now - last)/1000, 1/30);
    last = now;

    updateCollisionMap();

    // ---- 输入 ----
    if (inputX !== 0) {
      player.vx += inputX * ACC * dt;
      player.face = inputX > 0 ? 1 : -1;
    } else {
      player.vx *= Math.pow(FRICTION, dt*60);
    }
    player.vx = Math.max(-MAX_VX, Math.min(MAX_VX, player.vx));

    if ((jumpHeld || jumpQueued) && player.onGround) {
      player.vy = -JUMP_V;
      player.onGround = false;
      jumpQueued = false;
    }

    player.vy += GRAVITY * dt;

    // ---- X 轴 ----
    const nx = player.x + player.vx*dt;
    if (!circleHitsSolid(nx, player.y, player.r)) {
      player.x = nx;
    } else {
      let slid = false;
      for (let s=1; s<=6; s++) {
        const tx = player.x + (player.vx*dt) * (1 - s/7);
        if (!circleHitsSolid(tx, player.y, player.r)) { player.x = tx; slid = true; break; }
      }
      if (!slid) player.vx = 0;
    }

    // ---- Y 轴 ----
    player.onGround = false;
    const ny = player.y + player.vy*dt;
    if (!circleHitsSolid(player.x, ny, player.r)) {
      player.y = ny;
    } else {
      if (player.vy > 0) player.onGround = true;
      player.vy = 0;
    }

    if (player.y > H + 120) resetPlayer();

    // ---- 渲染 ----
    gCtx.clearRect(0,0,W,H);

    // 碰撞网格可视化
    gCtx.save();
    gCtx.globalAlpha = 0.16;
    gCtx.fillStyle = '#0f8';
    const cw = W/MAP_W, ch = H/MAP_H;
    for (let cy=0; cy<MAP_H; cy++)
      for (let cx=0; cx<MAP_W; cx++)
        if (solid[cy*MAP_W+cx]) gCtx.fillRect(cx*cw, cy*ch, cw+0.6, ch+0.6);
    gCtx.restore();

    // 玩家
    gCtx.save();
    gCtx.translate(player.x, player.y);
    const size = player.r*1.7;
    gCtx.fillStyle = player.onGround ? '#ffd24a' : '#ff8a3d';
    gCtx.strokeStyle = 'rgba(0,0,0,.5)';
    gCtx.lineWidth = 2;
    gCtx.beginPath();
    if (gCtx.roundRect) gCtx.roundRect(-size/2,-size/2,size,size,4);
    else gCtx.rect(-size/2,-size/2,size,size);
    gCtx.fill();
    gCtx.stroke();
    gCtx.fillStyle = '#222';
    gCtx.beginPath();
    gCtx.arc(3*player.face, -3, 2.2, 0, Math.PI*2);
    gCtx.fill();
    gCtx.restore();

    requestAnimationFrame(step);
  }

  // ---------- 摇杆 ----------
  let joyId = null, joyCX = 0, joyCY = 0, joyR = 0;
  joystick.addEventListener('pointerdown', e => {
    if (joyId !== null) return;
    joyId = e.pointerId;
    joystick.setPointerCapture(e.pointerId);
    const r = joystick.getBoundingClientRect();
    joyCX = r.left + r.width/2;
    joyCY = r.top + r.height/2;
    joyR = r.width/2 - 8;
    moveKnob(e.clientX, e.clientY);
    e.preventDefault();
  });
  joystick.addEventListener('pointermove', e => {
    if (e.pointerId !== joyId) return;
    moveKnob(e.clientX, e.clientY);
    e.preventDefault();
  });
  function endJoy(e){
    if (e.pointerId === joyId) {
      joyId = null;
      inputX = 0;
      knob.style.transform = 'translate(0,0)';
    }
  }
  joystick.addEventListener('pointerup', endJoy);
  joystick.addEventListener('pointercancel', endJoy);

  function moveKnob(cx, cy){
    let dx = cx - joyCX, dy = cy - joyCY;
    const d = Math.hypot(dx, dy);
    if (d > joyR) { dx = dx/d*joyR; dy = dy/d*joyR; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    inputX = Math.max(-1, Math.min(1, dx/joyR));
  }

  // ---------- 跳跃按钮 ----------
  jumpBtn.addEventListener('pointerdown', e => {
    e.preventDefault();
    jumpHeld = true;
    jumpQueued = true;
  });
  jumpBtn.addEventListener('pointerup',     () => jumpHeld = false);
  jumpBtn.addEventListener('pointercancel', () => jumpHeld = false);

  // ---------- 键盘（桌面调试） ----------
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k==='arrowleft' || k==='a') inputX = -1;
    if (k==='arrowright'|| k==='d') inputX = 1;
    if (k===' ' || k==='w' || k==='arrowup') {
      jumpHeld = true; jumpQueued = true; e.preventDefault();
    }
  });
  window.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    if (k==='arrowleft'||k==='a'||k==='arrowright'||k==='d') inputX = 0;
    if (k===' '||k==='w'||k==='arrowup') jumpHeld = false;
  });

  // ---------- 启动流程 ----------
  document.getElementById('startCam').onclick = openCam;

  document.getElementById('startDraw').onclick = () => {
    camReady = false;
    splash.style.display = 'none';
    enterPaintMode();
  };

  document.getElementById('doneDraw').onclick = exitPaintMode;

  document.getElementById('clearDraw').onclick = clearPaint;

  document.getElementById('switchCam').onclick = () => {
    if (!camReady) { openCam(); return; }
    facing = facing === 'environment' ? 'user' : 'environment';
    openCam();
  };

  // ---------- 初始化 ----------
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => {
    setTimeout(resize, 200);
  });

  sizeCanvases();
  resetPlayer();
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
