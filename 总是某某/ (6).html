<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>线 · 星</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            cursor: crosshair;
            touch-action: none;
        }
    </style>
</head>
<body>
    <canvas id="c" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const W = 600, H = 400;

        const target = [
            { x: 300, y: 60 },
            { x: 350, y: 160 },
            { x: 460, y: 170 },
            { x: 380, y: 240 },
            { x: 400, y: 350 },
            { x: 300, y: 290 },
            { x: 200, y: 350 },
            { x: 220, y: 240 },
            { x: 140, y: 170 },
            { x: 250, y: 160 }
        ];

        const SAMPLE_COUNT = 120;

        let phase = 'draw';
        let points = [];
        let drawing = false;

        let startSamples = [];
        let endSamples = [];
        let progress = 0;
        let rafId = null;

        function ease(t) {
            return t < 0.5
                ? 4 * t * t * t
                : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function totalLength(pts) {
            let len = 0;
            for (let i = 1; i < pts.length; i++) {
                len += Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
            }
            return len;
        }

        // 开放折线等距采样 n 个点
        function resample(pts, n) {
            if (pts.length === 0) return [];
            if (pts.length === 1) return Array(n).fill().map(() => ({ ...pts[0] }));

            const total = totalLength(pts);
            if (total === 0) return Array(n).fill().map(() => ({ ...pts[0] }));

            const step = total / (n - 1);
            const out = [{ x: pts[0].x, y: pts[0].y }];

            let segIdx = 0;
            let segStart = pts[0];
            let segEnd = pts[1];
            let segLen = Math.hypot(segEnd.x - segStart.x, segEnd.y - segStart.y);
            let segDone = 0;

            for (let i = 1; i < n; i++) {
                const targetDist = i * step;
                let ok = false;

                while (segIdx < pts.length - 1) {
                    if (segDone + segLen >= targetDist) {
                        const t = segLen === 0 ? 0 : (targetDist - segDone) / segLen;
                        out.push({
                            x: segStart.x + (segEnd.x - segStart.x) * t,
                            y: segStart.y + (segEnd.y - segStart.y) * t
                        });
                        ok = true;
                        break;
                    } else {
                        segDone += segLen;
                        segIdx++;
                        if (segIdx >= pts.length - 1) break;
                        segStart = pts[segIdx];
                        segEnd = pts[segIdx + 1];
                        segLen = Math.hypot(segEnd.x - segStart.x, segEnd.y - segStart.y);
                    }
                }

                if (!ok) {
                    const last = pts[pts.length - 1];
                    out.push({ x: last.x, y: last.y });
                }
            }

            while (out.length < n) {
                const last = pts[pts.length - 1];
                out.push({ x: last.x, y: last.y });
            }
            return out.slice(0, n);
        }

        // 闭合折线等距采样 n 个点，最后一个点强制等于第一个点
        function resampleClosed(pts, n) {
            if (pts.length < 2) return [];
            const closed = pts.concat([{ ...pts[0] }]);
            const total = totalLength(closed);
            if (total === 0) return Array(n).fill().map(() => ({ ...pts[0] }));

            // 步长 = total / (n-1)，走完 n-1 步正好回到起点
            const step = total / (n - 1);
            const out = [{ x: pts[0].x, y: pts[0].y }];

            let segIdx = 0;
            let segStart = closed[0];
            let segEnd = closed[1];
            let segLen = Math.hypot(segEnd.x - segStart.x, segEnd.y - segStart.y);
            let segDone = 0;

            for (let i = 1; i < n; i++) {
                const targetDist = i * step;
                let ok = false;

                while (segIdx < closed.length - 1) {
                    if (segDone + segLen >= targetDist - 1e-9) {
                        const t = segLen === 0 ? 0 : (targetDist - segDone) / segLen;
                        out.push({
                            x: segStart.x + (segEnd.x - segStart.x) * t,
                            y: segStart.y + (segEnd.y - segStart.y) * t
                        });
                        ok = true;
                        break;
                    } else {
                        segDone += segLen;
                        segIdx++;
                        if (segIdx >= closed.length - 1) break;
                        segStart = closed[segIdx];
                        segEnd = closed[segIdx + 1];
                        segLen = Math.hypot(segEnd.x - segStart.x, segEnd.y - segStart.y);
                    }
                }

                if (!ok) {
                    const last = closed[closed.length - 1];
                    out.push({ x: last.x, y: last.y });
                }
            }

            // 强制首尾重合
            out[n - 1] = { x: out[0].x, y: out[0].y };
            return out;
        }

        // 重设 endSamples 的首尾重合性质
        function enforceClosed(samples) {
            if (samples.length > 1) {
                samples[samples.length - 1] = { ...samples[0] };
            }
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (phase === 'draw' && points.length > 0) {
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                ctx.stroke();
            }

            if (phase === 'morph') {
                const t = ease(progress);
                ctx.beginPath();
                for (let i = 0; i < startSamples.length; i++) {
                    const s = startSamples[i];
                    const e = endSamples[i];
                    const x = s.x + (e.x - s.x) * t;
                    const y = s.y + (e.y - s.y) * t;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            if (phase === 'done') {
                ctx.beginPath();
                ctx.moveTo(target[0].x, target[0].y);
                for (let i = 1; i < target.length; i++) {
                    ctx.lineTo(target[i].x, target[i].y);
                }
                ctx.closePath();
                ctx.stroke();
            }
        }

        function animate() {
            if (phase !== 'morph') return;

            progress += 0.018;
            if (progress >= 1) {
                progress = 1;
                draw();
                phase = 'done';
                rafId = null;
                return;
            }

            draw();
            rafId = requestAnimationFrame(animate);
        }

        function reset() {
            if (rafId) cancelAnimationFrame(rafId);
            rafId = null;
            phase = 'draw';
            points = [];
            drawing = false;
            progress = 0;
            startSamples = [];
            endSamples = [];
            draw();
        }

        function startMorph() {
            if (points.length < 2) {
                reset();
                return;
            }

            startSamples = resample(points, SAMPLE_COUNT);
            endSamples = resampleClosed(target, SAMPLE_COUNT);

            // 起点对齐
            let bestIdx = 0;
            let bestDist = Infinity;
            const first = startSamples[0];
            for (let i = 0; i < endSamples.length; i++) {
                const d = Math.hypot(endSamples[i].x - first.x, endSamples[i].y - first.y);
                if (d < bestDist) {
                    bestDist = d;
                    bestIdx = i;
                }
            }
            if (bestIdx !== 0) {
                endSamples = endSamples.slice(bestIdx).concat(endSamples.slice(0, bestIdx));
                enforceClosed(endSamples); // 旋转后恢复首尾重合
            }

            // 方向自适应
            const dForward = Math.hypot(
                endSamples[0].x - first.x,
                endSamples[0].y - first.y
            );
            const dReverse = Math.hypot(
                endSamples[endSamples.length - 1].x - first.x,
                endSamples[endSamples.length - 1].y - first.y
            );
            if (dReverse < dForward) {
                endSamples.reverse();
                let bestIdx2 = 0;
                let bestDist2 = Infinity;
                for (let i = 0; i < endSamples.length; i++) {
                    const d = Math.hypot(endSamples[i].x - first.x, endSamples[i].y - first.y);
                    if (d < bestDist2) {
                        bestDist2 = d;
                        bestIdx2 = i;
                    }
                }
                if (bestIdx2 !== 0) {
                    endSamples = endSamples.slice(bestIdx2).concat(endSamples.slice(0, bestIdx2));
                }
                enforceClosed(endSamples); // 反转后恢复首尾重合
            }

            progress = 0;
            phase = 'morph';

            if (rafId) cancelAnimationFrame(rafId);
            rafId = requestAnimationFrame(animate);
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const src = e.touches ? e.touches[0] : e;
            return {
                x: Math.min(Math.max((src.clientX - rect.left) * scaleX, 0), W),
                y: Math.min(Math.max((src.clientY - rect.top) * scaleY, 0), H)
            };
        }

        function down(e) {
            e.preventDefault();
            if (phase !== 'draw') reset();
            drawing = true;
            points = [getPos(e)];
            draw();
        }

        function move(e) {
            if (!drawing || phase !== 'draw') return;
            e.preventDefault();
            const p = getPos(e);
            const last = points[points.length - 1];
            if (Math.hypot(p.x - last.x, p.y - last.y) < 2) return;
            points.push(p);
            draw();
        }

        function up(e) {
            if (!drawing) return;
            e.preventDefault();
            drawing = false;
            if (phase !== 'draw') return;
            if (points.length >= 2) startMorph();
            else reset();
        }

        function leave(e) {
            if (!drawing || phase !== 'draw') return;
            drawing = false;
            if (points.length >= 2) startMorph();
            else reset();
        }

        canvas.addEventListener('mousedown', down);
        canvas.addEventListener('mousemove', move);
        canvas.addEventListener('mouseup', up);
        canvas.addEventListener('mouseleave', leave);

        canvas.addEventListener('touchstart', down, { passive: false });
        canvas.addEventListener('touchmove', move, { passive: false });
        canvas.addEventListener('touchend', up, { passive: false });

        reset();
    </script>
</body>
</html>
