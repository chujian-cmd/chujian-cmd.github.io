<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>线 · 形 · 全屏</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  canvas{
    display:block;
    width:100vw;
    height:100vh;
    cursor:crosshair;
    touch-action:none;
  }

  /* 左上角清空按钮 */
  .clear-btn{
    position:fixed;
    top:16px;
    left:16px;
    width:38px;
    height:38px;
    border-radius:11px;
    border:1px solid #ececec;
    background:#fff;
    color:#a3a3a3;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:all .15s ease;
    z-index:100;
    box-shadow:0 1px 2px rgba(0,0,0,0.04);
  }
  .clear-btn:hover{ color:#171717; border-color:#d4d4d4; }
  .clear-btn:active{ transform:scale(0.94); }
  .clear-btn svg{ width:17px; height:17px; pointer-events:none; }

  /* 右上角选择器 */
  .picker{
    position:fixed;
    top:16px;
    right:16px;
    z-index:100;
  }
  .picker-btn{
    height:38px;
    padding:0 14px;
    border-radius:11px;
    border:1px solid #ececec;
    background:#fff;
    color:#171717;
    font-size:12px;
    font-weight:500;
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    transition:all .15s ease;
    box-shadow:0 1px 2px rgba(0,0,0,0.04);
  }
  .picker-btn:hover{ border-color:#d4d4d4; }
  .picker-btn:active{ transform:scale(0.97); }
  .picker-btn .arrow{
    width:12px; height:12px;
    color:#a3a3a3;
    transition:transform .15s ease;
  }
  .picker-btn.open .arrow{ transform:rotate(180deg); }

  .picker-panel{
    position:absolute;
    top:46px;
    right:0;
    width:300px;
    max-height:70vh;
    overflow-y:auto;
    background:#fff;
    border:1px solid #ececec;
    border-radius:12px;
    box-shadow:0 16px 48px rgba(0,0,0,0.12);
    padding:10px;
    display:none;
    z-index:101;
  }
  .picker-panel.open{ display:block; }
  .picker-panel::-webkit-scrollbar{ width:6px; }
  .picker-panel::-webkit-scrollbar-thumb{ background:#e5e5e5; border-radius:3px; }

  .cat-label{
    font-size:10px;
    font-weight:500;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:#a3a3a3;
    padding:10px 6px 6px;
  }
  .cat-label:first-child{ padding-top:2px; }

  .icon-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:2px;
  }
  .icon-cell{
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    cursor:pointer;
    color:#525252;
    transition:all .12s ease;
  }
  .icon-cell:hover{ background:#f5f5f5; color:#000; }
  .icon-cell.active{ background:#171717; color:#fff; }
  .icon-cell svg{ width:18px; height:18px; pointer-events:none; }

  .hint{
    position:fixed;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
    font-size:11px;
    color:#c0c0c0;
    letter-spacing:0.02em;
    user-select:none;
    pointer-events:none;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<button class="clear-btn" id="clearBtn" title="清空">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>
  </svg>
</button>

<div class="picker">
  <button class="picker-btn" id="pickerBtn">
    <span id="pickerLabel">星形</span>
    <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 9l6 6 6-6"/>
    </svg>
  </button>
  <div class="picker-panel" id="pickerPanel"></div>
</div>

<div class="hint">按住拖拽画线 · 松开变形 · 可连续绘制</div>

/* ============================================================
   从 SVG 提取轮廓点（归一化到单位尺寸）
   ============================================================ */
function svgToOutlinePoints(svgStr) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(svgStr, 'image/svg+xml');
  const svg = doc.querySelector('svg');
  if (!svg) return null;

  const tempSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  tempSvg.setAttribute('viewBox', '0 0 24 24');
  tempSvg.style.position = 'absolute';
  tempSvg.style.width = '0';
  tempSvg.style.height = '0';
  tempSvg.style.overflow = 'hidden';
  tempSvg.style.opacity = '0';
  tempSvg.style.pointerEvents = 'none';
  tempSvg.innerHTML = svg.innerHTML;
  document.body.appendChild(tempSvg);

  const allPoints = [];
  const shapeEls = tempSvg.querySelectorAll('path, circle, rect, line, polyline, polygon, ellipse');
  const SAMPLES_PER_SHAPE = 80;

  shapeEls.forEach(el => {
    try {
      if (el.tagName === 'path') {
        const len = el.getTotalLength();
        if (len === 0) return;
        for (let i = 0; i < SAMPLES_PER_SHAPE; i++) {
          const p = el.getPointAtLength((i / SAMPLES_PER_SHAPE) * len);
          allPoints.push({ x: p.x, y: p.y });
        }
      } else if (el.tagName === 'circle') {
        const cx = parseFloat(el.getAttribute('cx') || 0);
        const cy = parseFloat(el.getAttribute('cy') || 0);
        const r = parseFloat(el.getAttribute('r') || 0);
        for (let i = 0; i < SAMPLES_PER_SHAPE; i++) {
          const a = (i / SAMPLES_PER_SHAPE) * Math.PI * 2;
          allPoints.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
        }
      } else if (el.tagName === 'ellipse') {
        const cx = parseFloat(el.getAttribute('cx') || 0);
        const cy = parseFloat(el.getAttribute('cy') || 0);
        const rx = parseFloat(el.getAttribute('rx') || 0);
        const ry = parseFloat(el.getAttribute('ry') || 0);
        for (let i = 0; i < SAMPLES_PER_SHAPE; i++) {
          const a = (i / SAMPLES_PER_SHAPE) * Math.PI * 2;
          allPoints.push({ x: cx + Math.cos(a) * rx, y: cy + Math.sin(a) * ry });
        }
      } else if (el.tagName === 'rect') {
        const x = parseFloat(el.getAttribute('x') || 0);
        const y = parseFloat(el.getAttribute('y') || 0);
        const w = parseFloat(el.getAttribute('width') || 0);
        const h = parseFloat(el.getAttribute('height') || 0);
        const per = 2 * (w + h);
        const corners = [
          { x, y }, { x: x + w, y }, { x: x + w, y: y + h }, { x, y: y + h }
        ];
        for (let i = 0; i < SAMPLES_PER_SHAPE; i++) {
          const d = (i / SAMPLES_PER_SHAPE) * per;
          let acc = 0;
          for (let j = 0; j < 4; j++) {
            const a = corners[j];
            const b = corners[(j + 1) % 4];
            const segLen = Math.hypot(b.x - a.x, b.y - a.y);
            if (acc + segLen >= d) {
              const t = (d - acc) / segLen;
              allPoints.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
              break;
            }
            acc += segLen;
          }
        }
      } else if (el.tagName === 'polyline' || el.tagName === 'polygon') {
        const pts = el.getAttribute('points').trim().split(/[\s,]+/).map(parseFloat);
        const verts = [];
        for (let i = 0; i < pts.length; i += 2) {
          verts.push({ x: pts[i], y: pts[i+1] });
        }
        if (verts.length < 2) return;
        const closed = el.tagName === 'polygon';
        const vlist = closed ? verts.concat([verts[0]]) : verts;
        const total = vlist.reduce((sum, v, i) => {
          if (i === 0) return 0;
          return sum + Math.hypot(v.x - vlist[i-1].x, v.y - vlist[i-1].y);
        }, 0);
        for (let i = 0; i < SAMPLES_PER_SHAPE; i++) {
          const d = (i / SAMPLES_PER_SHAPE) * total;
          let acc = 0;
          for (let j = 1; j < vlist.length; j++) {
            const a = vlist[j-1];
            const b = vlist[j];
            const segLen = Math.hypot(b.x - a.x, b.y - a.y);
            if (acc + segLen >= d) {
              const t = (d - acc) / segLen;
              allPoints.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
              break;
            }
            acc += segLen;
          }
        }
      }
    } catch (e) {}
  });

  document.body.removeChild(tempSvg);
  if (allPoints.length === 0) return null;

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of allPoints) {
    if (p.x < minX) minX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.x > maxX) maxX = p.x;
    if (p.y > maxY) maxY = p.y;
  }
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  const size = Math.max(maxX - minX, maxY - minY, 0.001);

  return allPoints.map(p => ({
    x: (p.x - cx) / size,
    y: (p.y - cy) / size
  }));
}

/* ============================================================
   星形模板
   ============================================================ */
const STAR_TEMPLATE = [
  { x: 0,     y: -1.00 },
  { x: 0.32,  y: -0.40 },
  { x: 1.00,  y: -0.30 },
  { x: 0.50,  y: 0.15 },
  { x: 0.62,  y: 0.85 },
  { x: 0,     y: 0.50 },
  { x: -0.62, y: 0.85 },
  { x: -0.50, y: 0.15 },
  { x: -1.00, y: -0.30 },
  { x: -0.32, y: -0.40 }
];

/* ============================================================
   主逻辑
   ============================================================ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// 全屏尺寸
let W = window.innerWidth;
let H = window.innerHeight;

function resizeCanvas() {
  W = window.innerWidth;
  H = window.innerHeight;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // 离屏画布也用同样的物理尺寸
  base.width = W * dpr;
  base.height = H * dpr;
  baseCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  morphLayer.width = W * dpr;
  morphLayer.height = H * dpr;
  morphCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  drawLayer.width = W * dpr;
  drawLayer.height = H * dpr;
  drawCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  composite();
}

const base = document.createElement('canvas');
const baseCtx = base.getContext('2d');
const morphLayer = document.createElement('canvas');
const morphCtx = morphLayer.getContext('2d');
const drawLayer = document.createElement('canvas');
const drawCtx = drawLayer.getContext('2d');

const SAMPLE_COUNT = 120;
const MIN_DIST = 3;

let currentTemplate = STAR_TEMPLATE;
let currentTemplateName = '星形';

let drawing = false;
let points = [];
let morphs = [];
let rafId = null;
let needsRender = false;

function ease(t) {
  return t < 0.5
    ? 4 * t * t * t
    : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

/* ---------- 采样 ---------- */
function totalLength(pts) {
  let len = 0;
  for (let i = 1; i < pts.length; i++) {
    len += Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
  }
  return len;
}

function resample(pts, n) {
  if (pts.length === 0) return [];
  if (pts.length === 1) return Array(n).fill().map(() => ({ ...pts[0] }));
  const total = totalLength(pts);
  if (total === 0) return Array(n).fill().map(() => ({ ...pts[0] }));
  const step = total / (n - 1);
  const out = [{ x: pts[0].x, y: pts[0].y }];
  let segIdx = 0, segStart = pts[0], segEnd = pts[1];
  let segLen = Math.hypot(segEnd.x - segStart.x, segEnd.y - segStart.y);
  let segDone = 0;
  for (let i = 1; i < n; i++) {
    const targetDist = i * step;
    let ok = false;
    while (segIdx < pts.length - 1) {
      if (segDone + segLen >= targetDist) {
        const t = segLen === 0 ? 0 : (targetDist - segDone) / segLen;
        out.push({
          x: segStart.x + (segEnd.x - segStart.x) * t,
          y: segStart.y + (segEnd.y - segStart.y) * t
        });
        ok = true;
        break;
      } else {
        segDone += segLen;
        segIdx++;
        if (segIdx >= pts.length - 1) break;
        segStart = pts[segIdx];
        segEnd = pts[segIdx + 1];
        segLen = Math.hypot(segEnd.x - segStart.x, segEnd.y - segStart.y);
      }
    }
    if (!ok) {
      const last = pts[pts.length - 1];
      out.push({ x: last.x, y: last.y });
    }
  }
  while (out.length < n) {
    const last = pts[pts.length - 1];
    out.push({ x: last.x, y: last.y });
  }
  return out.slice(0, n);
}

function resampleClosed(pts, n) {
  if (pts.length < 2) return [];
  const closed = pts.concat([{ ...pts[0] }]);
  const total = totalLength(closed);
  if (total === 0) return Array(n).fill().map(() => ({ ...pts[0] }));
  const step = total / (n - 1);
  const out = [{ x: pts[0].x, y: pts[0].y }];
  let segIdx = 0, segStart = closed[0], segEnd = closed[1];
  let segLen = Math.hypot(segEnd.x - segStart.x, segEnd.y - segStart.y);
  let segDone = 0;
  for (let i = 1; i < n; i++) {
    const targetDist = i * step;
    let ok = false;
    while (segIdx < closed.length - 1) {
      if (segDone + segLen >= targetDist - 1e-9) {
        const t = segLen === 0 ? 0 : (targetDist - segDone) / segLen;
        out.push({
          x: segStart.x + (segEnd.x - segStart.x) * t,
          y: segStart.y + (segEnd.y - segStart.y) * t
        });
        ok = true;
        break;
      } else {
        segDone += segLen;
        segIdx++;
        if (segIdx >= closed.length - 1) break;
        segStart = closed[segIdx];
        segEnd = closed[segIdx + 1];
        segLen = Math.hypot(segEnd.x - segStart.x, segEnd.y - segStart.y);
      }
    }
    if (!ok) {
      const last = closed[closed.length - 1];
      out.push({ x: last.x, y: last.y });
    }
  }
  out[n - 1] = { x: out[0].x, y: out[0].y };
  return out;
}

function enforceClosed(samples) {
  if (samples.length > 1) {
    samples[samples.length - 1] = { ...samples[0] };
  }
}

function buildTargetFromPoints(pts, template) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of pts) {
    if (p.x < minX) minX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.x > maxX) maxX = p.x;
    if (p.y > maxY) maxY = p.y;
  }
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  const bw = maxX - minX;
  const bh = maxY - minY;
  const baseSize = Math.max(bw, bh, 40);
  const scale = baseSize * 0.55;
  return template.map(v => ({
    x: cx + v.x * scale,
    y: cy + v.y * scale
  }));
}

/* ---------- 渲染 ---------- */
function composite() {
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(base, 0, 0, W, H);
  ctx.drawImage(morphLayer, 0, 0, W, H);
  ctx.drawImage(drawLayer, 0, 0, W, H);
}

function renderMorphs() {
  morphCtx.clearRect(0, 0, W, H);
  morphCtx.strokeStyle = '#000';
  morphCtx.lineWidth = 2;
  morphCtx.lineCap = 'round';
  morphCtx.lineJoin = 'round';
  for (const m of morphs) {
    const t = ease(m.progress);
    morphCtx.beginPath();
    for (let i = 0; i < m.startSamples.length; i++) {
      const s = m.startSamples[i];
      const e = m.endSamples[i];
      const x = s.x + (e.x - s.x) * t;
      const y = s.y + (e.y - s.y) * t;
      if (i === 0) morphCtx.moveTo(x, y);
      else morphCtx.lineTo(x, y);
    }
    morphCtx.stroke();
  }
}

function renderDrawLayer() {
  drawCtx.clearRect(0, 0, W, H);
  if (points.length > 0) {
    drawCtx.strokeStyle = '#000';
    drawCtx.lineWidth = 2;
    drawCtx.lineCap = 'round';
    drawCtx.lineJoin = 'round';
    drawCtx.beginPath();
    drawCtx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) {
      drawCtx.lineTo(points[i].x, points[i].y);
    }
    drawCtx.stroke();
  }
}

function bakeToBase(samples) {
  baseCtx.strokeStyle = '#000';
  baseCtx.lineWidth = 2;
  baseCtx.lineCap = 'round';
  baseCtx.lineJoin = 'round';
  baseCtx.beginPath();
  baseCtx.moveTo(samples[0].x, samples[0].y);
  for (let i = 1; i < samples.length; i++) {
    baseCtx.lineTo(samples[i].x, samples[i].y);
  }
  baseCtx.closePath();
  baseCtx.stroke();
}

/* ---------- 动画 ---------- */
function animate() {
  rafId = null;
  let stillMorphing = false;
  for (let i = morphs.length - 1; i >= 0; i--) {
    const m = morphs[i];
    m.progress += 0.018;
    if (m.progress >= 1) {
      m.progress = 1;
      bakeToBase(m.endSamples);
      morphs.splice(i, 1);
    } else {
      stillMorphing = true;
    }
  }
  renderMorphs();
  composite();
  if (stillMorphing) {
    rafId = requestAnimationFrame(animate);
  }
}

function ensureAnimating() {
  if (rafId === null && morphs.length > 0) {
    rafId = requestAnimationFrame(animate);
  }
}

/* ---------- 状态 ---------- */
function startMorph() {
  if (points.length < 2) {
    points = [];
    renderDrawLayer();
    composite();
    return;
  }
  const dynamicTarget = buildTargetFromPoints(points, currentTemplate);
  const startSamples = resample(points, SAMPLE_COUNT);
  let endSamples = resampleClosed(dynamicTarget, SAMPLE_COUNT);

  let bestIdx = 0;
  let bestDist = Infinity;
  const first = startSamples[0];
  for (let i = 0; i < endSamples.length; i++) {
    const d = Math.hypot(endSamples[i].x - first.x, endSamples[i].y - first.y);
    if (d < bestDist) { bestDist = d; bestIdx = i; }
  }
  if (bestIdx !== 0) {
    endSamples = endSamples.slice(bestIdx).concat(endSamples.slice(0, bestIdx));
    enforceClosed(endSamples);
  }

  const dForward = Math.hypot(endSamples[0].x - first.x, endSamples[0].y - first.y);
  const dReverse = Math.hypot(
    endSamples[endSamples.length - 1].x - first.x,
    endSamples[endSamples.length - 1].y - first.y
  );
  if (dReverse < dForward) {
    endSamples.reverse();
    let bestIdx2 = 0;
    let bestDist2 = Infinity;
    for (let i = 0; i < endSamples.length; i++) {
      const d = Math.hypot(endSamples[i].x - first.x, endSamples[i].y - first.y);
      if (d < bestDist2) { bestDist2 = d; bestIdx2 = i; }
    }
    if (bestIdx2 !== 0) {
      endSamples = endSamples.slice(bestIdx2).concat(endSamples.slice(0, bestIdx2));
    }
    enforceClosed(endSamples);
  }

  morphs.push({ startSamples, endSamples, progress: 0 });
  points = [];
  renderDrawLayer();
  composite();
  ensureAnimating();
}

/* ---------- 事件 ---------- */
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return {
    x: src.clientX - rect.left,
    y: src.clientY - rect.top
  };
}

function scheduleRender() {
  if (needsRender) return;
  needsRender = true;
  requestAnimationFrame(() => {
    needsRender = false;
    renderDrawLayer();
    composite();
  });
}

function down(e) {
  e.preventDefault();
  drawing = true;
  points = [getPos(e)];
  renderDrawLayer();
  composite();
}

function move(e) {
  if (!drawing) return;
  e.preventDefault();
  const p = getPos(e);
  const last = points[points.length - 1];
  if (Math.hypot(p.x - last.x, p.y - last.y) < MIN_DIST) return;
  points.push(p);
  scheduleRender();
}

function up(e) {
  if (!drawing) return;
  e.preventDefault();
  drawing = false;
  if (points.length >= 2) startMorph();
  else {
    points = [];
    renderDrawLayer();
    composite();
  }
}

function leave(e) {
  if (!drawing) return;
  drawing = false;
  if (points.length >= 2) startMorph();
  else {
    points = [];
    renderDrawLayer();
    composite();
  }
}

canvas.addEventListener('mousedown', down);
canvas.addEventListener('mousemove', move);
canvas.addEventListener('mouseup', up);
canvas.addEventListener('mouseleave', leave);
canvas.addEventListener('touchstart', down, { passive: false });
canvas.addEventListener('touchmove', move, { passive: false });
canvas.addEventListener('touchend', up, { passive: false });

/* ---------- 清空 ---------- */
document.getElementById('clearBtn').addEventListener('click', () => {
  baseCtx.clearRect(0, 0, W, H);
  morphCtx.clearRect(0, 0, W, H);
  drawCtx.clearRect(0, 0, W, H);
  morphs = [];
  points = [];
  drawing = false;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  composite();
});

/* ---------- 选择器 ---------- */
const pickerBtn = document.getElementById('pickerBtn');
const pickerPanel = document.getElementById('pickerPanel');
const pickerLabel = document.getElementById('pickerLabel');

function buildPicker() {
  pickerPanel.innerHTML = '';

  const starLabel = document.createElement('div');
  starLabel.className = 'cat-label';
  starLabel.textContent = '默认';
  pickerPanel.appendChild(starLabel);

  const starGrid = document.createElement('div');
  starGrid.className = 'icon-grid';
  const starCell = document.createElement('div');
  starCell.className = 'icon-cell' + (currentTemplateName === '星形' ? ' active' : '');
  starCell.innerHTML = L('<path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/>');
  starCell.title = '星形';
  starCell.addEventListener('click', () => {
    currentTemplate = STAR_TEMPLATE;
    currentTemplateName = '星形';
    pickerLabel.textContent = '星形';
    updateActiveCell();
    closePicker();
  });
  starGrid.appendChild(starCell);
  pickerPanel.appendChild(starGrid);

  for (const [cat, svgs] of Object.entries(SVG_DATA)) {
    const label = document.createElement('div');
    label.className = 'cat-label';
    label.textContent = cat;
    pickerPanel.appendChild(label);

    const grid = document.createElement('div');
    grid.className = 'icon-grid';

    svgs.forEach((svgStr, idx) => {
      const cell = document.createElement('div');
      cell.className = 'icon-cell';
      cell.innerHTML = svgStr;
      cell.dataset.cat = cat;
      cell.dataset.idx = idx;
      cell.title = `${cat} #${idx + 1}`;
      cell.addEventListener('click', () => {
        const outline = svgToOutlinePoints(svgStr);
        if (!outline || outline.length < 3) return;
        currentTemplate = outline;
        currentTemplateName = `${cat} #${idx + 1}`;
        pickerLabel.textContent = currentTemplateName;
        updateActiveCell();
        closePicker();
      });
      grid.appendChild(cell);
    });

    pickerPanel.appendChild(grid);
  }
}

function updateActiveCell() {
  pickerPanel.querySelectorAll('.icon-cell').forEach(cell => {
    const cat = cell.dataset.cat;
    const idx = cell.dataset.idx;
    if (cat === undefined) {
      cell.classList.toggle('active', currentTemplateName === '星形');
    } else {
      cell.classList.toggle('active', currentTemplateName === `${cat} #${parseInt(idx) + 1}`);
    }
  });
}

function openPicker() {
  pickerPanel.classList.add('open');
  pickerBtn.classList.add('open');
}
function closePicker() {
  pickerPanel.classList.remove('open');
  pickerBtn.classList.remove('open');
}

pickerBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (pickerPanel.classList.contains('open')) closePicker();
  else openPicker();
});

document.addEventListener('click', (e) => {
  if (!pickerPanel.contains(e.target) && e.target !== pickerBtn && !pickerBtn.contains(e.target)) {
    closePicker();
  }
});

/* ---------- 初始化 ---------- */
buildPicker();
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
</script>
