<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>线 · 星</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            cursor: crosshair;
            touch-action: none;
        }
    </style>
</head>
<body>
    <canvas id="c" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const W = 600;
        const H = 400;

        // 目标星形顶点（10个，闭合）
        const target = [
            { x: 300, y: 60 },
            { x: 350, y: 160 },
            { x: 460, y: 170 },
            { x: 380, y: 240 },
            { x: 400, y: 350 },
            { x: 300, y: 290 },
            { x: 200, y: 350 },
            { x: 220, y: 240 },
            { x: 140, y: 170 },
            { x: 250, y: 160 }
        ];

        let phase = 'draw';       // 'draw' | 'morph' | 'done'
        let points = [];
        let drawing = false;
        let startVerts = [];
        let progress = 0;
        const SPEED = 0.045;
        let rafId = null;

        // ---------- 工具 ----------

        function totalLength(pts) {
            let len = 0;
            for (let i = 1; i < pts.length; i++) {
                len += Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
            }
            return len;
        }

        function resample(pts, n) {
            if (pts.length === 0) return [];
            if (pts.length === 1) return Array(n).fill().map(() => ({ ...pts[0] }));

            const total = totalLength(pts);
            if (total === 0) return Array(n).fill().map(() => ({ ...pts[0] }));

            const step = total / (n - 1);
            const out = [{ x: pts[0].x, y: pts[0].y }];

            let segIdx = 0;
            let segStart = pts[0];
            let segEnd = pts[1];
            let segLen = Math.hypot(segEnd.x - segStart.x, segEnd.y - segStart.y);
            let segDone = 0;

            for (let i = 1; i < n; i++) {
                const targetDist = i * step;
                let ok = false;

                while (segIdx < pts.length - 1) {
                    if (segDone + segLen >= targetDist) {
                        const t = segLen === 0 ? 0 : (targetDist - segDone) / segLen;
                        out.push({
                            x: segStart.x + (segEnd.x - segStart.x) * t,
                            y: segStart.y + (segEnd.y - segStart.y) * t
                        });
                        ok = true;
                        break;
                    } else {
                        segDone += segLen;
                        segIdx++;
                        if (segIdx >= pts.length - 1) break;
                        segStart = pts[segIdx];
                        segEnd = pts[segIdx + 1];
                        segLen = Math.hypot(segEnd.x - segStart.x, segEnd.y - segStart.y);
                    }
                }

                if (!ok) {
                    const last = pts[pts.length - 1];
                    out.push({ x: last.x, y: last.y });
                }
            }

            while (out.length < n) {
                const last = pts[pts.length - 1];
                out.push({ x: last.x, y: last.y });
            }
            return out.slice(0, n);
        }

        // ---------- 渲染 ----------

        function draw() {
            ctx.clearRect(0, 0, W, H);

            if (phase === 'draw' && points.length > 0) {
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            }

            if (phase === 'morph') {
                const verts = startVerts.map((s, i) => ({
                    x: s.x + (target[i].x - s.x) * progress,
                    y: s.y + (target[i].y - s.y) * progress
                }));

                ctx.beginPath();
                ctx.moveTo(verts[0].x, verts[0].y);
                for (let i = 1; i < verts.length; i++) {
                    ctx.lineTo(verts[i].x, verts[i].y);
                }
                ctx.closePath();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.lineJoin = 'round';
                ctx.stroke();
            }

            if (phase === 'done') {
                ctx.beginPath();
                ctx.moveTo(target[0].x, target[0].y);
                for (let i = 1; i < target.length; i++) {
                    ctx.lineTo(target[i].x, target[i].y);
                }
                ctx.closePath();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.lineJoin = 'round';
                ctx.stroke();
            }
        }

        // ---------- 动画 ----------

        function animate() {
            if (phase !== 'morph') return;

            progress += SPEED;
            if (progress >= 1) {
                progress = 1;
                draw();
                phase = 'done';
                rafId = null;
                return;
            }

            draw();
            rafId = requestAnimationFrame(animate);
        }

        // ---------- 状态 ----------

        function reset() {
            if (rafId) cancelAnimationFrame(rafId);
            rafId = null;
            phase = 'draw';
            points = [];
            drawing = false;
            progress = 0;
            startVerts = [];
            draw();
        }

        function startMorph() {
            if (points.length < 2) {
                reset();
                return;
            }

            const n = target.length;
            let sampled = resample(points, n);
            while (sampled.length < n) {
                sampled.push({ ...sampled[sampled.length - 1] });
            }
            sampled = sampled.slice(0, n);

            startVerts = sampled;
            progress = 0;
            phase = 'morph';

            if (rafId) cancelAnimationFrame(rafId);
            rafId = requestAnimationFrame(animate);
        }

        // ---------- 事件 ----------

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const src = e.touches ? e.touches[0] : e;
            return {
                x: Math.min(Math.max((src.clientX - rect.left) * scaleX, 0), W),
                y: Math.min(Math.max((src.clientY - rect.top) * scaleY, 0), H)
            };
        }

        function down(e) {
            e.preventDefault();
            if (phase !== 'draw') reset();
            drawing = true;
            points = [getPos(e)];
            draw();
        }

        function move(e) {
            if (!drawing || phase !== 'draw') return;
            e.preventDefault();
            const p = getPos(e);
            const last = points[points.length - 1];
            if (Math.hypot(p.x - last.x, p.y - last.y) < 2) return;
            points.push(p);
            draw();
        }

        function up(e) {
            if (!drawing) return;
            e.preventDefault();
            drawing = false;
            if (phase !== 'draw') return;
            if (points.length >= 2) startMorph();
            else reset();
        }

        function leave(e) {
            if (!drawing || phase !== 'draw') return;
            drawing = false;
            if (points.length >= 2) startMorph();
            else reset();
        }

        canvas.addEventListener('mousedown', down);
        canvas.addEventListener('mousemove', move);
        canvas.addEventListener('mouseup', up);
        canvas.addEventListener('mouseleave', leave);

        canvas.addEventListener('touchstart', down, { passive: false });
        canvas.addEventListener('touchmove', move, { passive: false });
        canvas.addEventListener('touchend', up, { passive: false });

        reset();
    </script>
</body>
</html>
