<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>线 · 星 · 多</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            cursor: crosshair;
            touch-action: none;
        }
    </style>
</head>
<body>
    <canvas id="c" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const W = 600, H = 400;

        // 离屏画布：累积所有已完成的图形
        const base = document.createElement('canvas');
        base.width = W;
        base.height = H;
        const baseCtx = base.getContext('2d');

        // 离屏画布：当前正在画的线 / 正在变形的过程
        const live = document.createElement('canvas');
        live.width = W;
        live.height = H;
        const liveCtx = live.getContext('2d');

        const target = [
            { x: 300, y: 60 },
            { x: 350, y: 160 },
            { x: 460, y: 170 },
            { x: 380, y: 240 },
            { x: 400, y: 350 },
            { x: 300, y: 290 },
            { x: 200, y: 350 },
            { x: 220, y: 240 },
            { x: 140, y: 170 },
            { x: 250, y: 160 }
        ];

        const SAMPLE_COUNT = 120;
        const MIN_DIST = 3;      // 移动超过这个距离才记录新点

        let phase = 'draw';
        let points = [];
        let drawing = false;

        let startSamples = [];
        let endSamples = [];
        let progress = 0;
        let rafId = null;
        let needsRender = false;

        function ease(t) {
            return t < 0.5
                ? 4 * t * t * t
                : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        // ---------- 采样 ----------

        function totalLength(pts) {
            let len = 0;
            for (let i = 1; i < pts.length; i++) {
                len += Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
            }
            return len;
        }

        function resample(pts, n) {
            if (pts.length === 0) return [];
            if (pts.length === 1) return Array(n).fill().map(() => ({ ...pts[0] }));

            const total = totalLength(pts);
            if (total === 0) return Array(n).fill().map(() => ({ ...pts[0] }));

            const step = total / (n - 1);
            const out = [{ x: pts[0].x, y: pts[0].y }];

            let segIdx = 0;
            let segStart = pts[0];
            let segEnd = pts[1];
            let segLen = Math.hypot(segEnd.x - segStart.x, segEnd.y - segStart.y);
            let segDone = 0;

            for (let i = 1; i < n; i++) {
                const targetDist = i * step;
                let ok = false;

                while (segIdx < pts.length - 1) {
                    if (segDone + segLen >= targetDist) {
                        const t = segLen === 0 ? 0 : (targetDist - segDone) / segLen;
                        out.push({
                            x: segStart.x + (segEnd.x - segStart.x) * t,
                            y: segStart.y + (segEnd.y - segStart.y) * t
                        });
                        ok = true;
                        break;
                    } else {
                        segDone += segLen;
                        segIdx++;
                        if (segIdx >= pts.length - 1) break;
                        segStart = pts[segIdx];
                        segEnd = pts[segIdx + 1];
                        segLen = Math.hypot(segEnd.x - segStart.x, segEnd.y - segStart.y);
                    }
                }

                if (!ok) {
                    const last = pts[pts.length - 1];
                    out.push({ x: last.x, y: last.y });
                }
            }

            while (out.length < n) {
                const last = pts[pts.length - 1];
                out.push({ x: last.x, y: last.y });
            }
            return out.slice(0, n);
        }

        function resampleClosed(pts, n) {
            if (pts.length < 2) return [];
            const closed = pts.concat([{ ...pts[0] }]);
            const total = totalLength(closed);
            if (total === 0) return Array(n).fill().map(() => ({ ...pts[0] }));

            const step = total / (n - 1);
            const out = [{ x: pts[0].x, y: pts[0].y }];

            let segIdx = 0;
            let segStart = closed[0];
            let segEnd = closed[1];
            let segLen = Math.hypot(segEnd.x - segStart.x, segEnd.y - segStart.y);
            let segDone = 0;

            for (let i = 1; i < n; i++) {
                const targetDist = i * step;
                let ok = false;

                while (segIdx < closed.length - 1) {
                    if (segDone + segLen >= targetDist - 1e-9) {
                        const t = segLen === 0 ? 0 : (targetDist - segDone) / segLen;
                        out.push({
                            x: segStart.x + (segEnd.x - segStart.x) * t,
                            y: segStart.y + (segEnd.y - segStart.y) * t
                        });
                        ok = true;
                        break;
                    } else {
                        segDone += segLen;
                        segIdx++;
                        if (segIdx >= closed.length - 1) break;
                        segStart = closed[segIdx];
                        segEnd = closed[segIdx + 1];
                        segLen = Math.hypot(segEnd.x - segStart.x, segEnd.y - segStart.y);
                    }
                }

                if (!ok) {
                    const last = closed[closed.length - 1];
                    out.push({ x: last.x, y: last.y });
                }
            }

            out[n - 1] = { x: out[0].x, y: out[0].y };
            return out;
        }

        function enforceClosed(samples) {
            if (samples.length > 1) {
                samples[samples.length - 1] = { ...samples[0] };
            }
        }

        // ---------- 渲染 ----------

        // 主画布合成：base + live
        function composite() {
            ctx.clearRect(0, 0, W, H);
            ctx.drawImage(base, 0, 0);
            ctx.drawImage(live, 0, 0);
        }

        // 只重绘 live 层（用于画线 / 变形过程）
        function renderLive() {
            liveCtx.clearRect(0, 0, W, H);
            liveCtx.strokeStyle = '#000';
            liveCtx.lineWidth = 2;
            liveCtx.lineCap = 'round';
            liveCtx.lineJoin = 'round';

            if (phase === 'draw' && points.length > 0) {
                liveCtx.beginPath();
                liveCtx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    liveCtx.lineTo(points[i].x, points[i].y);
                }
                liveCtx.stroke();
            }

            if (phase === 'morph') {
                const t = ease(progress);
                liveCtx.beginPath();
                for (let i = 0; i < startSamples.length; i++) {
                    const s = startSamples[i];
                    const e = endSamples[i];
                    const x = s.x + (e.x - s.x) * t;
                    const y = s.y + (e.y - s.y) * t;
                    if (i === 0) liveCtx.moveTo(x, y);
                    else liveCtx.lineTo(x, y);
                }
                liveCtx.stroke();
            }

            composite();
        }

        // 把当前图形烘焙到 base 层
        function bakeToBase() {
            baseCtx.strokeStyle = '#000';
            baseCtx.lineWidth = 2;
            baseCtx.lineCap = 'round';
            baseCtx.lineJoin = 'round';

            if (phase === 'done') {
                baseCtx.beginPath();
                baseCtx.moveTo(target[0].x, target[0].y);
                for (let i = 1; i < target.length; i++) {
                    baseCtx.lineTo(target[i].x, target[i].y);
                }
                baseCtx.closePath();
                baseCtx.stroke();
            }
        }

        // ---------- 动画 ----------

        function animate() {
            if (phase !== 'morph') return;

            progress += 0.018;
            if (progress >= 1) {
                progress = 1;
                renderLive();

                // 变形结束，把星形烘焙到 base
                bakeToBase();
                liveCtx.clearRect(0, 0, W, H);
                composite();

                phase = 'draw';
                points = [];
                drawing = false;
                rafId = null;
                return;
            }

            renderLive();
            rafId = requestAnimationFrame(animate);
        }

        // ---------- 状态 ----------

        function startMorph() {
            if (points.length < 2) {
                points = [];
                liveCtx.clearRect(0, 0, W, H);
                composite();
                return;
            }

            startSamples = resample(points, SAMPLE_COUNT);
            endSamples = resampleClosed(target, SAMPLE_COUNT);

            // 起点对齐
            let bestIdx = 0;
            let bestDist = Infinity;
            const first = startSamples[0];
            for (let i = 0; i < endSamples.length; i++) {
                const d = Math.hypot(endSamples[i].x - first.x, endSamples[i].y - first.y);
                if (d < bestDist) {
                    bestDist = d;
                    bestIdx = i;
                }
            }
            if (bestIdx !== 0) {
                endSamples = endSamples.slice(bestIdx).concat(endSamples.slice(0, bestIdx));
                enforceClosed(endSamples);
            }

            // 方向自适应
            const dForward = Math.hypot(
                endSamples[0].x - first.x,
                endSamples[0].y - first.y
            );
            const dReverse = Math.hypot(
                endSamples[endSamples.length - 1].x - first.x,
                endSamples[endSamples.length - 1].y - first.y
            );
            if (dReverse < dForward) {
                endSamples.reverse();
                let bestIdx2 = 0;
                let bestDist2 = Infinity;
                for (let i = 0; i < endSamples.length; i++) {
                    const d = Math.hypot(endSamples[i].x - first.x, endSamples[i].y - first.y);
                    if (d < bestDist2) {
                        bestDist2 = d;
                        bestIdx2 = i;
                    }
                }
                if (bestIdx2 !== 0) {
                    endSamples = endSamples.slice(bestIdx2).concat(endSamples.slice(0, bestIdx2));
                }
                enforceClosed(endSamples);
            }

            progress = 0;
            phase = 'morph';

            if (rafId) cancelAnimationFrame(rafId);
            rafId = requestAnimationFrame(animate);
        }

        // ---------- 事件 ----------

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const src = e.touches ? e.touches[0] : e;
            return {
                x: Math.min(Math.max((src.clientX - rect.left) * scaleX, 0), W),
                y: Math.min(Math.max((src.clientY - rect.top) * scaleY, 0), H)
            };
        }

        function scheduleRender() {
            if (needsRender) return;
            needsRender = true;
            requestAnimationFrame(() => {
                needsRender = false;
                renderLive();
            });
        }

        function down(e) {
            e.preventDefault();
            // 如果正在变形，忽略
            if (phase === 'morph') return;

            drawing = true;
            points = [getPos(e)];
            renderLive();
        }

        function move(e) {
            if (!drawing) return;
            e.preventDefault();
            const p = getPos(e);
            const last = points[points.length - 1];
            if (Math.hypot(p.x - last.x, p.y - last.y) < MIN_DIST) return;
            points.push(p);
            scheduleRender();
        }

        function up(e) {
            if (!drawing) return;
            e.preventDefault();
            drawing = false;
            if (points.length >= 2) startMorph();
            else {
                points = [];
                liveCtx.clearRect(0, 0, W, H);
                composite();
            }
        }

        function leave(e) {
            if (!drawing) return;
            drawing = false;
            if (points.length >= 2) startMorph();
            else {
                points = [];
                liveCtx.clearRect(0, 0, W, H);
                composite();
            }
        }

        canvas.addEventListener('mousedown', down);
        canvas.addEventListener('mousemove', move);
        canvas.addEventListener('mouseup', up);
        canvas.addEventListener('mouseleave', leave);

        canvas.addEventListener('touchstart', down, { passive: false });
        canvas.addEventListener('touchmove', move, { passive: false });
        canvas.addEventListener('touchend', up, { passive: false });

        composite();
    </script>
</body>
</html>
