<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>文本浏览工具 - 花园明朝版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: '花园明朝', 'HanaMinB', 'HanaMinA', system-ui, -apple-system, 'Segoe UI', 'Roboto', monospace;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9edf2 100%);
            margin: 0;
            min-height: 100vh;
            padding: 24px;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: rgba(255,255,255,0.96);
            border-radius: 28px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.02);
            overflow: hidden;
        }
        .header {
            background: rgba(255,255,255,0.7);
            padding: 20px 28px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        h2 {
            margin: 0 0 6px 0;
            font-size: 1.65rem;
            font-weight: 500;
            letter-spacing: -0.3px;
            color: #1e2a3e;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        h2 span {
            font-size: 0.7rem;
            background: #eef2ff;
            padding: 4px 10px;
            border-radius: 40px;
            font-weight: normal;
        }
        .sub {
            color: #5c6f87;
            font-size: 0.85rem;
            margin-top: 4px;
        }
        .file-area {
            padding: 20px 28px 12px 28px;
            background: #ffffff;
        }
        .info-badge {
            background: #f0f4f9;
            padding: 10px 16px;
            border-radius: 60px;
            font-size: 0.85rem;
            color: #1e3a5f;
            display: inline-block;
            margin-top: 12px;
        }
        .browser {
            padding: 0 28px 28px 28px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin: 20px 0 18px 0;
            padding: 12px 16px;
            background: #f8fafd;
            border-radius: 48px;
        }
        .controls .search-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: white;
            padding: 2px 6px 2px 14px;
            border-radius: 40px;
            border: 1px solid #cbd5e1;
        }
        .controls .search-group input {
            border: none;
            outline: none;
            padding: 6px 4px;
            width: 120px;
            font-size: 0.85rem;
            background: transparent;
            font-family: inherit;
        }
        .controls .search-group input:focus {
            outline: none;
        }
        .controls .search-group .search-badge {
            font-size: 0.7rem;
            color: #64748b;
            min-width: 40px;
            text-align: center;
        }
        .controls .search-group button {
            border: none;
            background: transparent;
            padding: 4px 8px;
            font-size: 0.85rem;
            cursor: pointer;
            color: #475569;
            border-radius: 40px;
        }
        .controls .search-group button:hover {
            background: #eef2ff;
        }
        button, select, input[type="number"] {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            font-family: '花园明朝', 'HanaMinB', 'HanaMinA', sans-serif;
            color: #1e2a3e;
        }
        button:hover {
            background: #eef2ff;
            border-color: #94a3b8;
        }
        .page-info {
            background: white;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        input#pageNum, input#scale {
            width: 70px;
            text-align: center;
            padding: 6px 8px;
        }
        .preview-box {
            background: #0d1117;
            border-radius: 24px;
            padding: 0;
            max-height: 70vh;
            overflow: auto;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05), 0 4px 12px rgba(0,0,0,0.1);
        }
        .preview-box pre {
            font-family: 'JetBrains Mono', 'Fira Code', '花园明朝', 'HanaMinB', monospace;
            font-size: 14px;
            line-height: 2.0 !important;
            color: #e2e8f0;
            white-space: pre-wrap !important;
            word-break: break-word !important;
            overflow-wrap: break-word !important;
            margin: 0;
            background: transparent;
            border: none;
            padding: 20px;
        }
        .preview-box pre code {
            font-family: inherit;
            background: transparent;
            padding: 0;
            white-space: pre-wrap !important;
            word-break: break-word !important;
            overflow-wrap: break-word !important;
            line-height: 2.0 !important;
        }
        .search-highlight {
            background: #fbbf24;
            color: #0d1117;
            border-radius: 2px;
            padding: 0 2px;
        }
        .search-highlight.current {
            background: #f59e0b;
            color: #0d1117;
            box-shadow: 0 0 0 2px #f59e0b;
        }
        .preview-box img, .preview-box video, .preview-box audio {
            max-width: 100%;
            max-height: 60vh;
            border-radius: 12px;
            display: block;
            margin: 0 auto;
            background: #18202b;
        }
        .preview-box iframe, .preview-box embed, .preview-box object {
            width: 100%;
            height: 65vh;
            border-radius: 12px;
            border: none;
            background: #fff;
            display: block;
        }
        .preview-box .fallback {
            color: #b3c7dd;
            font-size: 0.95rem;
            padding: 20px 0;
            text-align: center;
        }
        .media-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            padding: 20px;
            width: 100%;
        }
        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            border-top-color: #3b82f6;
            animation: spin 0.7s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-msg { display: flex; align-items: center; gap: 8px; color: #3b6e9e; }
        footer {
            font-size: 0.7rem;
            text-align: center;
            padding: 16px;
            color: #7e8b9c;
            border-top: 1px solid #eef2f6;
            background: rgba(255,255,255,0.6);
        }
        .hidden { display: none !important; }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-box {
            background: white;
            border-radius: 28px;
            padding: 32px 40px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 24px 48px rgba(0,0,0,0.2);
            text-align: center;
        }
        .modal-box h3 {
            font-size: 1.3rem;
            font-weight: 500;
            margin-top: 0;
            color: #1e2a3e;
        }
        .modal-box p {
            color: #3d5575;
            font-size: 0.95rem;
            margin: 12px 0 24px 0;
            word-break: break-all;
        }
        .modal-box .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .modal-box .btn-group button {
            padding: 10px 28px;
            font-size: 0.95rem;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }
        .modal-box .btn-run {
            background: #1e3a5f;
            color: white;
        }
        .modal-box .btn-run:hover {
            background: #2b4d7a;
        }
        .modal-box .btn-cancel {
            background: #eef2f6;
            color: #1e2a3e;
        }
        .modal-box .btn-cancel:hover {
            background: #dce2ea;
        }
        .html-embed-wrapper {
            width: 100%;
            height: 65vh;
            background: #1c2333;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
        }
        .html-embed-wrapper .browser-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: #161e2c;
            border-bottom: 1px solid #2a3346;
            flex-shrink: 0;
            user-select: none;
        }
        .html-embed-wrapper .browser-bar .dots {
            display: flex;
            gap: 6px;
        }
        .html-embed-wrapper .browser-bar .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .html-embed-wrapper .browser-bar .dot.red { background: #ff5f56; }
        .html-embed-wrapper .browser-bar .dot.yellow { background: #ffbd2e; }
        .html-embed-wrapper .browser-bar .dot.green { background: #27c93f; }
        .html-embed-wrapper .browser-bar .url-bar {
            flex: 1;
            background: #0d1320;
            border-radius: 20px;
            padding: 4px 16px;
            color: #8ba0c0;
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 1px solid #2a3346;
            text-align: center;
        }
        .html-embed-wrapper .browser-bar .url-bar .lock {
            margin-right: 6px;
            opacity: 0.6;
        }
        .html-embed-wrapper .browser-bar .badge-html {
            background: #2d4a6a;
            color: #8bb9e6;
            font-size: 0.6rem;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .html-embed-wrapper iframe {
            flex: 1;
            width: 100%;
            border: none;
            display: block;
            background: white;
        }
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 28px;
            padding: 8px 20px;
            background: #161f2e;
            border-radius: 12px;
            margin-top: 12px;
            color: #9aaec9;
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
        }
        .stats-bar .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stats-bar .stat-item .num {
            color: #e2e8f0;
            font-weight: 600;
        }
        .stats-bar .stat-item .label {
            color: #6b85a0;
        }
        .btn-download {
            background: #1e3a5f !important;
            color: white !important;
            border-color: #1e3a5f !important;
        }
        .btn-download:hover {
            background: #2b4d7a !important;
            border-color: #2b4d7a !important;
        }
        .pdf-loading {
            color: #9aaec9;
            font-size: 0.9rem;
            text-align: center;
            padding: 40px;
        }
        .pdf-loading .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #2a3346;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>📄 文本浏览工具 <span>花园明朝版 · 纯离线 PDF</span></h2>
        <div class="sub">轻量阅读 · 语法高亮 · 关键词搜索 · 文件统计 · HTML内嵌 · 纯离线PDF</div>
    </div>
    <div class="file-area">
        <input type="file" id="fileInput" accept="*/*" style="border-radius:40px;padding:10px 18px;" />
        <div id="fileInfo" class="info-badge">✨ 选择一个文件开始 (txt/csv/log/md/代码/图片/视频/PDF/HTML…)</div>
    </div>
    <div id="browser" class="browser">
        <div class="controls" id="browserControls">
            <button id="firstBtn">⏮</button>
            <button id="prevBtn">◀</button>
            <span class="page-info">
                第 <input type="number" id="pageNum" min="1" /> / <span id="totalPages">?</span> 页
            </span>
            <button id="nextBtn">▶</button>
            <button id="lastBtn">⏭</button>
            <select id="pageSize">
                <option value="100">100行</option>
                <option value="500">500</option>
                <option value="1000" selected>1000</option>
                <option value="5000">5000</option>
            </select>
            <button id="goBtn">跳转</button>
            <span class="page-info">缩放</span>
            <input type="number" id="scale" step="0.1" value="1" />
            <button id="setScale">应用</button>
            <button id="resetScale">重置</button>
            <button id="downloadBtn" class="btn-download">⬇ 导出</button>
            <div class="search-group" id="searchGroup">
                <input type="text" id="searchInput" placeholder="🔍 搜索..." />
                <span class="search-badge" id="searchBadge">0/0</span>
                <button id="searchPrev" title="上一个">↑</button>
                <button id="searchNext" title="下一个">↓</button>
                <button id="searchClear" title="清除">✕</button>
            </div>
        </div>
        <div id="loading" class="status-msg" style="color:#3b6e9e;"><span class="loading"></span> 载入段落中...</div>
        <div class="preview-box" id="previewBox">
            <pre id="content"><code id="codeBlock">── 等待加载 ──</code></pre>
        </div>
        <div class="stats-bar" id="statsBar">
            <span class="stat-item"><span class="label">行数</span> <span class="num" id="statLines">-</span></span>
            <span class="stat-item"><span class="label">字符数</span> <span class="num" id="statChars">-</span></span>
            <span class="stat-item"><span class="label">单词数</span> <span class="num" id="statWords">-</span></span>
            <span class="stat-item"><span class="label">文件大小</span> <span class="num" id="statSize">-</span></span>
            <span class="stat-item"><span class="label">语言</span> <span class="num" id="statLang">-</span></span>
        </div>
    </div>
    <footer>doubaoanddeepseek.html · 本地数据 · 花园明朝加持 · 纯离线 PDF 预览</footer>
</div>

<script>
    (function() {
        // DOM 引用
        const fileInput = document.getElementById('fileInput');
        const fileInfoDiv = document.getElementById('fileInfo');
        const loadingSpan = document.getElementById('loading');
        const previewBox = document.getElementById('previewBox');
        const contentPre = document.getElementById('content');
        let codeBlock = document.getElementById('codeBlock');
        const controlsDiv = document.getElementById('browserControls');

        const searchInput = document.getElementById('searchInput');
        const searchBadge = document.getElementById('searchBadge');
        const searchPrev = document.getElementById('searchPrev');
        const searchNext = document.getElementById('searchNext');
        const searchClear = document.getElementById('searchClear');

        const statLines = document.getElementById('statLines');
        const statChars = document.getElementById('statChars');
        const statWords = document.getElementById('statWords');
        const statSize = document.getElementById('statSize');
        const statLang = document.getElementById('statLang');

        const firstBtn = document.getElementById('firstBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const lastBtn = document.getElementById('lastBtn');
        const goBtn = document.getElementById('goBtn');
        const pageNum = document.getElementById('pageNum');
        const totalPagesSpan = document.getElementById('totalPages');
        const pageSizeSelect = document.getElementById('pageSize');
        const scaleInput = document.getElementById('scale');
        const setScaleBtn = document.getElementById('setScale');
        const resetScaleBtn = document.getElementById('resetScale');
        const downloadBtn = document.getElementById('downloadBtn');

        // 状态
        let currentFile = null;
        let fileType = 'text';
        let totalLines = 0;
        let totalPages = 0;
        let currentPage = 1;
        let pageSize = 1000;
        let lineOffsets = [0];
        const BASE_FONT_SIZE = 14;
        const BASE_LINE_HEIGHT = 2.0;
        let highlightEnabled = true;
        let currentRawText = '';
        let searchMatches = [];
        let searchIndex = -1;

        // ========== 导出功能 ==========
        function exportCurrentContent() {
            if (!currentFile) {
                alert('没有文件可导出');
                return;
            }

            let textToExport = '';
            const codeEl = codeBlock || document.getElementById('codeBlock');

            if (fileType === 'text' && codeEl) {
                textToExport = codeEl.textContent || '';
            } else if (fileType === 'text' && contentPre) {
                textToExport = contentPre.textContent || '';
            } else {
                const el = previewBox.querySelector('pre') || previewBox;
                textToExport = el.textContent || '当前内容不支持导出为文本';
            }

            if (!textToExport || textToExport.trim() === '') {
                alert('当前页面没有可导出的内容');
                return;
            }

            const baseName = currentFile.name.replace(/\.[^.]+$/, '') || 'export';
            const fileName = `${baseName}_page${currentPage}.txt`;

            const blob = new Blob([textToExport], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            updateStatus(`✅ 已导出: ${fileName} (${(blob.size / 1024).toFixed(1)} KB)`, false);
        }

        // ========== 统计 ==========
        function updateStats(text, file, lang) {
            const lines = text.split('\n').length;
            const chars = text.length;
            const words = text.replace(/\s+/g, ' ').trim().split(' ').filter(w => w.length > 0).length;
            const size = file ? (file.size / 1024).toFixed(1) + ' KB' : '-';
            statLines.textContent = lines.toLocaleString();
            statChars.textContent = chars.toLocaleString();
            statWords.textContent = words.toLocaleString();
            statSize.textContent = size;
            statLang.textContent = lang || 'text';
        }

        function getLanguageName(ext) {
            const map = {
                'py': 'Python', 'js': 'JavaScript', 'ts': 'TypeScript', 'jsx': 'React JSX', 'tsx': 'React TSX',
                'java': 'Java', 'c': 'C', 'cpp': 'C++', 'cxx': 'C++', 'cc': 'C++', 'h': 'C/C++', 'hpp': 'C++',
                'go': 'Go', 'rs': 'Rust', 'rb': 'Ruby', 'php': 'PHP', 'swift': 'Swift', 'kt': 'Kotlin',
                'scala': 'Scala', 'dart': 'Dart', 'lua': 'Lua', 'r': 'R', 'sql': 'SQL',
                'sh': 'Shell', 'bash': 'Bash', 'zsh': 'Zsh',
                'html': 'HTML', 'htm': 'HTML', 'css': 'CSS', 'scss': 'SCSS', 'sass': 'Sass', 'less': 'Less',
                'json': 'JSON', 'xml': 'XML', 'yaml': 'YAML', 'yml': 'YAML', 'toml': 'TOML',
                'md': 'Markdown', 'txt': 'Text', 'csv': 'CSV', 'log': 'Log',
                'vue': 'Vue', 'svelte': 'Svelte',
                'pl': 'Perl', 'pm': 'Perl',
                'jl': 'Julia', 'ex': 'Elixir', 'exs': 'Elixir', 'erl': 'Erlang',
                'fs': 'F#', 'fsx': 'F#', 'clj': 'Clojure', 'cljs': 'ClojureScript',
                'groovy': 'Groovy', 'gradle': 'Gradle',
                'tf': 'Terraform', 'hcl': 'HCL',
                'dockerfile': 'Dockerfile', 'makefile': 'Makefile', 'cmake': 'CMake',
                'ps1': 'PowerShell', 'psm1': 'PowerShell',
                'v': 'V', 'nim': 'Nim', 'crystal': 'Crystal'
            };
            return map[ext] || ext || 'Text';
        }

        // ========== 搜索 ==========
        function performSearch(query) {
            const container = document.getElementById('previewBox');
            const highlighted = container.querySelectorAll('.search-highlight');
            highlighted.forEach(el => {
                const parent = el.parentNode;
                parent.replaceChild(document.createTextNode(el.textContent), el);
                parent.normalize();
            });

            searchMatches = [];
            searchIndex = -1;
            searchBadge.textContent = '0/0';

            if (!query || query.trim() === '') return;

            const target = container.querySelector('pre') || container;
            const textNodes = [];
            const walker = document.createTreeWalker(target, NodeFilter.SHOW_TEXT, {
                acceptNode: function(node) {
                    if (node.parentElement && node.parentElement.closest('.search-highlight')) return NodeFilter.FILTER_REJECT;
                    if (node.parentElement && node.parentElement.tagName === 'SCRIPT') return NodeFilter.FILTER_REJECT;
                    if (node.textContent.trim() === '') return NodeFilter.FILTER_REJECT;
                    return NodeFilter.FILTER_ACCEPT;
                }
            });

            let node;
            const q = query.toLowerCase();
            while (node = walker.nextNode()) {
                const text = node.textContent;
                const lower = text.toLowerCase();
                let idx = lower.indexOf(q);
                if (idx === -1) continue;
                const fragment = document.createDocumentFragment();
                let lastIdx = 0;
                while (idx !== -1) {
                    if (idx > lastIdx) {
                        fragment.appendChild(document.createTextNode(text.substring(lastIdx, idx)));
                    }
                    const span = document.createElement('span');
                    span.className = 'search-highlight';
                    span.textContent = text.substring(idx, idx + q.length);
                    fragment.appendChild(span);
                    searchMatches.push(span);
                    lastIdx = idx + q.length;
                    idx = lower.indexOf(q, lastIdx);
                }
                if (lastIdx < text.length) {
                    fragment.appendChild(document.createTextNode(text.substring(lastIdx)));
                }
                node.parentNode.replaceChild(fragment, node);
            }

            if (searchMatches.length > 0) {
                searchIndex = 0;
                searchMatches[0].classList.add('current');
                searchMatches[0].scrollIntoView({ block: 'center', behavior: 'smooth' });
            }
            searchBadge.textContent = searchMatches.length > 0 ? `1/${searchMatches.length}` : '0/0';
        }

        function navigateSearch(direction) {
            if (searchMatches.length === 0) return;
            if (searchIndex >= 0 && searchIndex < searchMatches.length) {
                searchMatches[searchIndex].classList.remove('current');
            }
            searchIndex = (searchIndex + direction + searchMatches.length) % searchMatches.length;
            searchMatches[searchIndex].classList.add('current');
            searchMatches[searchIndex].scrollIntoView({ block: 'center', behavior: 'smooth' });
            searchBadge.textContent = `${searchIndex + 1}/${searchMatches.length}`;
        }

        function clearSearch() {
            searchInput.value = '';
            performSearch('');
            searchBadge.textContent = '0/0';
            searchIndex = -1;
            searchMatches = [];
        }

        // ========== 显示 ==========
        function updateStatus(text, isLoading = false) {
            loadingSpan.innerHTML = (isLoading ? '<span class="loading"></span> ' : '') + text;
            loadingSpan.style.display = 'flex';
        }

        function displayText(text, startLine = 0, lang = 'text') {
            const children = previewBox.children;
            for (let i = children.length - 1; i >= 0; i--) {
                const child = children[i];
                if (child.id !== 'content') {
                    previewBox.removeChild(child);
                }
            }
            
            contentPre.style.display = 'block';
            contentPre.style.padding = '20px';
            contentPre.style.margin = '0';
            contentPre.innerHTML = '';
            
            const newCode = document.createElement('code');
            newCode.id = 'codeBlock';
            
            const lines = text.split('\n');
            let numbered = '';
            for (let i = 0; i < lines.length; i++) {
                numbered += (startLine + i + 1) + '· ' + lines[i] + '\n';
            }
            
            const shouldHighlight = highlightEnabled && lang !== 'text' && lang !== 'log' && lang !== 'csv' && lang !== 'txt';
            
            if (shouldHighlight) {
                newCode.className = `language-${lang}`;
                newCode.textContent = numbered;
                contentPre.appendChild(newCode);
                try {
                    hljs.highlightElement(newCode);
                } catch(e) {
                    newCode.textContent = numbered;
                }
            } else {
                newCode.className = '';
                newCode.textContent = numbered;
                contentPre.appendChild(newCode);
            }
            
            codeBlock = document.getElementById('codeBlock');
            applyScaleInternal();
            updateStats(text, currentFile, getLanguageName(lang));
            
            const query = searchInput.value.trim();
            if (query) {
                setTimeout(() => performSearch(query), 100);
            }
        }

        // ========== 纯离线 PDF 预览 ==========
        function displayPDF(file) {
            // 清空预览区
            const children = previewBox.children;
            for (let i = children.length - 1; i >= 0; i--) {
                const child = children[i];
                if (child.id !== 'content') {
                    previewBox.removeChild(child);
                }
            }
            contentPre.style.display = 'none';

            // 显示加载中
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'pdf-loading';
            loadingDiv.innerHTML = `<div class="spinner"></div>⏳ 正在加载 PDF ...`;
            previewBox.appendChild(loadingDiv);

            const reader = new FileReader();
            reader.onload = function(e) {
                // 移除加载提示
                if (loadingDiv.parentNode) loadingDiv.remove();
                
                const base64Data = e.target.result; // data:application/pdf;base64,xxxxx
                const iframe = document.createElement('iframe');
                iframe.src = base64Data;
                iframe.style.width = '100%';
                iframe.style.height = '65vh';
                iframe.style.border = 'none';
                iframe.style.borderRadius = '12px';
                iframe.style.display = 'block';
                iframe.style.background = '#fff';
                previewBox.appendChild(iframe);
                
                statLines.textContent = '-';
                statChars.textContent = '-';
                statWords.textContent = '-';
                statSize.textContent = (file.size / 1024).toFixed(1) + ' KB';
                statLang.textContent = 'PDF (纯离线)';
                updateStatus(`✅ PDF 已加载: ${file.name}`, false);
            };
            reader.onerror = function() {
                if (loadingDiv.parentNode) loadingDiv.remove();
                const fallback = document.createElement('div');
                fallback.className = 'fallback';
                fallback.textContent = '❌ PDF 加载失败，请尝试其他浏览器';
                previewBox.appendChild(fallback);
                updateStatus('❌ PDF 加载失败', false);
            };
            reader.readAsDataURL(file);
        }

        function displayMedia(url, type) {
            const children = previewBox.children;
            for (let i = children.length - 1; i >= 0; i--) {
                const child = children[i];
                if (child.id !== 'content') {
                    previewBox.removeChild(child);
                }
            }
            contentPre.style.display = 'none';
            
            const wrapper = document.createElement('div');
            wrapper.className = 'media-wrapper';

            let el;
            if (type === 'image') {
                el = document.createElement('img');
                el.src = url;
                el.alt = '图片预览';
                el.style.maxWidth = '100%';
                el.style.maxHeight = '60vh';
                el.style.borderRadius = '12px';
            } else if (type === 'video') {
                el = document.createElement('video');
                el.src = url;
                el.controls = true;
                el.style.maxWidth = '100%';
                el.style.maxHeight = '60vh';
                el.style.borderRadius = '12px';
                el.autoplay = false;
            } else if (type === 'audio') {
                el = document.createElement('audio');
                el.src = url;
                el.controls = true;
                el.style.width = '100%';
                el.style.maxWidth = '500px';
                el.style.margin = '0 auto';
                el.style.display = 'block';
            } else {
                const fallback = document.createElement('div');
                fallback.className = 'fallback';
                fallback.textContent = '🔍 预览不支持此格式，但文件已加载';
                wrapper.appendChild(fallback);
                previewBox.appendChild(wrapper);
                return;
            }
            if (el) wrapper.appendChild(el);
            previewBox.appendChild(wrapper);
            statLines.textContent = '-';
            statChars.textContent = '-';
            statWords.textContent = '-';
            statSize.textContent = currentFile ? (currentFile.size / 1024).toFixed(1) + ' KB' : '-';
            statLang.textContent = type;
        }

        // ========== HTML 内嵌 ==========
        function embedHtmlInPage(file) {
            const children = previewBox.children;
            for (let i = children.length - 1; i >= 0; i--) {
                const child = children[i];
                if (child.id !== 'content') {
                    previewBox.removeChild(child);
                }
            }
            contentPre.style.display = 'none';

            const wrapper = document.createElement('div');
            wrapper.className = 'html-embed-wrapper';

            const bar = document.createElement('div');
            bar.className = 'browser-bar';
            bar.innerHTML = `
                <div class="dots">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <div class="url-bar">
                    <span class="lock">🔒</span>
                    ${file.name}
                </div>
                <span class="badge-html">● HTML</span>
            `;
            wrapper.appendChild(bar);

            const iframe = document.createElement('iframe');
            iframe.sandbox = 'allow-scripts allow-same-origin allow-forms allow-modals';
            iframe.style.flex = '1';
            iframe.style.width = '100%';
            iframe.style.border = 'none';
            iframe.style.display = 'block';
            iframe.style.background = 'white';

            const reader = new FileReader();
            reader.onload = function(e) {
                iframe.srcdoc = e.target.result;
                wrapper.appendChild(iframe);
                previewBox.appendChild(wrapper);
                updateStatus(`✅ 已内嵌运行: ${file.name}`, false);
                controlsDiv.style.display = 'none';
                statLines.textContent = '-';
                statChars.textContent = '-';
                statWords.textContent = '-';
                statSize.textContent = (file.size / 1024).toFixed(1) + ' KB';
                statLang.textContent = 'HTML';
            };
            reader.readAsText(file, 'UTF-8');
        }

        function showHtmlConfirm(file) {
            const old = document.querySelector('.modal-overlay');
            if (old) old.remove();

            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal-box">
                    <h3>🌐 检测到 HTML 文件</h3>
                    <p><strong>${file.name}</strong><br>是否在页面内直接运行？</p>
                    <div class="btn-group">
                        <button class="btn-run" id="modalRunBtn">✅ 内嵌运行</button>
                        <button class="btn-cancel" id="modalCancelBtn">❌ 取消 (文本预览)</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            document.getElementById('modalRunBtn').onclick = function() {
                overlay.remove();
                embedHtmlInPage(file);
            };

            document.getElementById('modalCancelBtn').onclick = function() {
                overlay.remove();
                const reader = new FileReader();
                reader.onload = function(e) {
                    const text = e.target.result;
                    const preview = text.slice(0, 3000) + (text.length > 3000 ? '\n... (截断)' : '');
                    displayText(preview, 0, 'html');
                    contentPre.style.fontSize = `${BASE_FONT_SIZE}px`;
                    contentPre.style.lineHeight = `${BASE_LINE_HEIGHT}px`;
                    updateStatus(`已取消运行，以文本预览 (${file.name})`, false);
                    controlsDiv.style.display = 'none';
                };
                reader.readAsText(file.slice(0, 4096), 'UTF-8');
            };
        }

        // ========== 文件处理 ==========
        function detectFileType(file) {
            const mime = file.type;
            const name = file.name.toLowerCase();
            if (mime.startsWith('image/')) return 'image';
            if (mime.startsWith('video/')) return 'video';
            if (mime.startsWith('audio/')) return 'audio';
            if (mime === 'application/pdf') return 'pdf';
            const ext = name.split('.').pop();
            if (ext === 'html' || ext === 'htm') return 'html';
            const imgExts = ['jpg','jpeg','png','gif','bmp','webp','svg','avif','tiff','ico'];
            const vidExts = ['mp4','webm','mov','avi','mkv','flv','wmv','m4v','3gp'];
            const audExts = ['mp3','wav','aac','flac','ogg','wma','m4a'];
            if (imgExts.includes(ext)) return 'image';
            if (vidExts.includes(ext)) return 'video';
            if (audExts.includes(ext)) return 'audio';
            if (ext === 'pdf') return 'pdf';
            return 'text';
        }

        function getFileLang(file) {
            const name = file.name.toLowerCase();
            const ext = name.split('.').pop();
            return ext;
        }

        function buildLineIndex(file, callback) {
            const chunkSize = 1024 * 1024;
            let offset = 0;
            let remainder = '';
            lineOffsets = [0];

            function readChunk() {
                const end = Math.min(offset + chunkSize, file.size);
                const blob = file.slice(offset, end);
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const text = remainder + ev.target.result;
                    let searchStart = 0, newlinePos;
                    while ((newlinePos = text.indexOf('\n', searchStart)) !== -1) {
                        searchStart = newlinePos + 1;
                        lineOffsets.push(offset + newlinePos + 1);
                    }
                    remainder = text.substring(searchStart);
                    offset = end;
                    if (offset < file.size) {
                        readChunk();
                    } else {
                        totalLines = lineOffsets.length;
                        if (remainder.length > 0) totalLines++;
                        callback();
                    }
                };
                reader.readAsText(blob, 'UTF-8');
            }
            readChunk();
        }

        function loadTextPage(page) {
            if (!currentFile || fileType !== 'text') return;
            if (page < 1) page = 1;
            if (page > totalPages) page = totalPages;
            currentPage = page;
            pageNum.value = page;
            updateStatus(`加载第 ${page} / ${totalPages} 页 ...`, true);

            const startLine = (page - 1) * pageSize;
            const endLine = Math.min(startLine + pageSize, totalLines);
            const startOffset = lineOffsets[startLine];
            const endOffset = (endLine < lineOffsets.length) ? lineOffsets[endLine] : currentFile.size;

            const blob = currentFile.slice(startOffset, endOffset);
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lang = getFileLang(currentFile);
                displayText(text, startLine, lang);
                updateStatus(`第 ${currentPage} 页 · 共 ${totalPages} 页 · ${totalLines.toLocaleString()} 行`, false);
                totalPagesSpan.textContent = totalPages;
            };
            reader.readAsText(blob, 'UTF-8');
        }

        function applyScaleInternal() {
            const scale = parseFloat(scaleInput.value);
            if (!scale || scale < 0.01) return;
            contentPre.style.fontSize = `${BASE_FONT_SIZE * scale}px`;
            contentPre.style.lineHeight = `${BASE_LINE_HEIGHT * scale}`;
        }

        function loadFile(file) {
            currentFile = file;
            const type = detectFileType(file);
            fileType = type;
            const sizeMB = (file.size / 1024 / 1024).toFixed(2);
            fileInfoDiv.innerHTML = `📄 ${file.name} (${type}) · ${sizeMB} MB`;

            if (type === 'html') {
                showHtmlConfirm(file);
                return;
            }

            if (type === 'text') {
                controlsDiv.style.display = 'flex';
                updateStatus(`扫描文本索引 ...`, true);
                buildLineIndex(file, () => {
                    totalPages = Math.ceil(totalLines / pageSize);
                    totalPagesSpan.textContent = totalPages;
                    pageNum.max = totalPages;
                    pageNum.value = 1;
                    loadTextPage(1);
                });
                return;
            }

            controlsDiv.style.display = 'none';
            const url = URL.createObjectURL(file);
            if (type === 'pdf') {
                displayPDF(file);
                return;
            } else if (type === 'image') {
                displayMedia(url, 'image');
            } else if (type === 'video') {
                displayMedia(url, 'video');
            } else if (type === 'audio') {
                displayMedia(url, 'audio');
            } else {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const text = e.target.result;
                    const preview = text.slice(0, 2000) + (text.length > 2000 ? '\n... (截断)' : '');
                    displayText(preview, 0, 'text');
                    contentPre.style.fontSize = `${BASE_FONT_SIZE}px`;
                    contentPre.style.lineHeight = `${BASE_LINE_HEIGHT}px`;
                    updateStatus(`已加载 (${type}) 预览`, false);
                };
                reader.readAsText(file.slice(0, 4096), 'UTF-8');
            }
            if (type !== 'text' && type !== 'other' && type !== 'pdf') {
                updateStatus(`✅ ${type} 已加载`, false);
            }
        }

        // ========== 事件绑定 ==========
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const old = document.querySelector('.modal-overlay');
            if (old) old.remove();
            clearSearch();
            loadFile(file);
        });

        downloadBtn.addEventListener('click', exportCurrentContent);

        searchInput.addEventListener('input', function() {
            const query = this.value.trim();
            if (query === '') {
                clearSearch();
                if (currentFile && fileType === 'text') {
                    loadTextPage(currentPage);
                }
                return;
            }
            performSearch(query);
        });

        searchPrev.addEventListener('click', () => navigateSearch(-1));
        searchNext.addEventListener('click', () => navigateSearch(1));
        searchClear.addEventListener('click', () => {
            clearSearch();
            if (currentFile && fileType === 'text') {
                loadTextPage(currentPage);
            }
        });

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (e.shiftKey) {
                    navigateSearch(-1);
                } else {
                    navigateSearch(1);
                }
            }
            if (e.key === 'Escape') {
                clearSearch();
                if (currentFile && fileType === 'text') {
                    loadTextPage(currentPage);
                }
                this.blur();
            }
        });

        firstBtn.onclick = () => { if (fileType === 'text') { clearSearch(); loadTextPage(1); } };
        prevBtn.onclick = () => { if (fileType === 'text') { clearSearch(); loadTextPage(currentPage - 1); } };
        nextBtn.onclick = () => { if (fileType === 'text') { clearSearch(); loadTextPage(currentPage + 1); } };
        lastBtn.onclick = () => { if (fileType === 'text') { clearSearch(); loadTextPage(totalPages); } };
        goBtn.onclick = () => { if (fileType === 'text') { clearSearch(); loadTextPage(parseInt(pageNum.value) || 1); } };
        pageSizeSelect.onchange = (e) => {
            if (fileType !== 'text') return;
            pageSize = parseInt(e.target.value);
            totalPages = Math.ceil(totalLines / pageSize);
            totalPagesSpan.textContent = totalPages;
            pageNum.max = totalPages;
            clearSearch();
            loadTextPage(1);
        };
        setScaleBtn.onclick = applyScaleInternal;
        resetScaleBtn.onclick = () => {
            scaleInput.value = 1;
            contentPre.style.fontSize = `${BASE_FONT_SIZE}px`;
            contentPre.style.lineHeight = `${BASE_LINE_HEIGHT}px`;
        };

        // 初始化
        controlsDiv.style.display = 'none';
        loadingSpan.style.display = 'flex';
        loadingSpan.innerHTML = '✨ 选择文件开始浏览';
    })();
</script>
</body>
</html>
