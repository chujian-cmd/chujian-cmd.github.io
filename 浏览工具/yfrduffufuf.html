<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>文韵·生僻字阅读器 | 花园明朝极简版</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: '花园明朝', 'HanaMinB', 'HanaMinA', system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Noto Sans CJK SC', monospace;
            background: linear-gradient(135deg, #f0f3f8 0%, #e2e8f0 100%);
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            transition: background 0.3s ease;
        }

        /* 容器入场动画 */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 32px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.12), 0 2px 5px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            backdrop-filter: blur(0px);
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            animation: fadeInUp 0.45s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: rgba(255, 255, 255, 0.75);
            padding: 20px 28px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            backdrop-filter: blur(2px);
        }

        h2 {
            margin: 0 0 6px 0;
            font-size: 1.7rem;
            font-weight: 500;
            letter-spacing: -0.3px;
            color: #0f2b3d;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .badge-version {
            font-size: 0.7rem;
            background: #eef2ff;
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: 450;
            color: #2c4f6e;
            transition: all 0.2s;
        }

        .sub {
            color: #4a627a;
            font-size: 0.85rem;
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .file-area {
            padding: 20px 28px 12px 28px;
            background: #ffffff;
            transition: background 0.2s;
        }

        /* 优雅的文件上传区域 */
        .file-wrapper {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        input#fileInput {
            border-radius: 60px;
            padding: 10px 20px;
            background: #f9fbfe;
            border: 1px solid #cbdde9;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        input#fileInput:hover {
            background: #ffffff;
            border-color: #8ba3bb;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .info-badge {
            background: #eef3fc;
            padding: 8px 20px;
            border-radius: 80px;
            font-size: 0.85rem;
            color: #1a4b6e;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            backdrop-filter: blur(2px);
        }

        .progress-bar-bg {
            width: 140px;
            height: 5px;
            background: #cad5e2;
            border-radius: 10px;
            overflow: hidden;
            display: inline-block;
            margin-left: 8px;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #3b82f6;
            border-radius: 10px;
            transition: width 0.2s ease;
        }

        .browser {
            padding: 0 28px 28px 28px;
            animation: fadeSlide 0.3s ease-out;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 控制栏动画 & 交互增强 */
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin: 20px 0 18px 0;
            padding: 12px 20px;
            background: #fafcff;
            border-radius: 60px;
            border: 1px solid #e9edf2;
            transition: box-shadow 0.2s;
        }

        button, select, input[type="number"] {
            background: white;
            border: 1px solid #cbdbe0;
            padding: 8px 18px;
            border-radius: 48px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            font-family: '花园明朝', 'HanaMinB', 'HanaMinA', sans-serif;
            color: #1f3b4c;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 1px 1px rgba(0,0,0,0.02);
        }

        button:hover {
            background: #eef2fc;
            border-color: #8ea3bd;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }

        button:active {
            transform: scale(0.96) translateY(1px);
            transition: transform 0.05s;
        }

        select:active, input:active {
            transform: scale(0.98);
        }

        .page-info {
            background: #f1f5f9;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1f4662;
            transition: background 0.2s;
        }

        input#pageNum, input#scale {
            width: 75px;
            text-align: center;
            padding: 7px 6px;
        }

        /* pre 内容区域: 优雅滚动条 + 淡入动画 */
        pre {
            background: #0f172a;
            color: #eef2ff;
            padding: 22px;
            border-radius: 28px;
            font-size: 12px;
            line-height: 18px;
            font-family: '花园明朝', 'HanaMinB', 'HanaMinA', 'JetBrains Mono', monospace;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 65vh;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05), 0 8px 20px rgba(0, 0, 0, 0.15);
            transition: opacity 0.2s ease, background 0.2s;
            opacity: 1;
            scroll-behavior: smooth;
        }

        /* 自定义滚动条 (优雅动画) */
        pre::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        pre::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 12px;
        }

        pre::-webkit-scrollbar-thumb {
            background: #4b556b;
            border-radius: 12px;
            transition: background 0.2s;
        }

        pre::-webkit-scrollbar-thumb:hover {
            background: #6b7c9f;
        }

        /* loading 动态指示器 + 脉冲光环 */
        .status-msg {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #eef2fa;
            padding: 8px 18px;
            border-radius: 60px;
            width: fit-content;
            margin-bottom: 12px;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #b9c8e8;
            border-top-color: #2c6e9e;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .pulse-glow {
            animation: pulseRing 1.2s infinite;
        }

        @keyframes pulseRing {
            0% {
                box-shadow: 0 0 0 0 rgba(59,130,246,0.3);
            }
            70% {
                box-shadow: 0 0 0 6px rgba(59,130,246,0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(59,130,246,0);
            }
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            padding: 18px;
            color: #7c8ba0;
            border-top: 1px solid #eef2f8;
            background: rgba(255, 255, 255, 0.7);
            transition: color 0.2s;
        }

        /* 响应式 */
        @media (max-width: 680px) {
            body {
                padding: 12px;
            }
            .controls {
                border-radius: 32px;
                gap: 8px;
            }
            button, select {
                padding: 5px 12px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>
            📖 墨韵 · 生僻字典藏 
            <span class="badge-version">花园明朝 引擎</span>
        </h2>
        <div class="sub">
            <span>✨ 轻灵分页 · 全文索引</span>
            <span>🌿 超大文件丝滑翻页</span>
        </div>
    </div>
    <div class="file-area">
        <div class="file-wrapper">
            <input type="file" id="fileInput" accept=".txt,.csv,.log,.md,.jsonl" />
            <div id="fileInfo" class="info-badge">
                🌙 择一典籍，开卷有益
            </div>
        </div>
    </div>
    <div id="browser" style="display:none;" class="browser">
        <div class="controls">
            <button id="firstBtn" aria-label="首页">⏮ 首页</button>
            <button id="prevBtn" aria-label="上一页">◀ 上一页</button>
            <span class="page-info">
                📄 第 <input type="number" id="pageNum" min="1" /> / <span id="totalPages">?</span> 页
            </span>
            <button id="nextBtn" aria-label="下一页">下一页 ▶</button>
            <button id="lastBtn" aria-label="尾页">尾页 ⏭</button>
            <select id="pageSize" aria-label="每页行数">
                <option value="100">100行</option>
                <option value="500">500行</option>
                <option value="1000" selected>1000行</option>
                <option value="5000">5000行</option>
            </select>
            <button id="goBtn" aria-label="跳转">跳转</button>
            <span class="page-info">🔍 缩放 ×</span>
            <input type="number" id="scale" step="0.1" value="1" aria-label="缩放倍数" />
            <button id="setScale">应用</button>
            <button id="resetScale">重置1x</button>
        </div>
        <div id="loading" class="status-msg" style="display: none;">
            <span class="loading"></span> <span>翻页载入中 · 墨香浮动</span>
        </div>
        <pre id="content">── 静候佳文，书卷待启 ──</pre>
    </div>
    <footer>🌸 花园明朝深度适配 · 生僻字无所遁形 · 淡入淡出翻阅体验</footer>
</div>

<script>
    // ---------- 核心变量 ----------
    let currentFile = null;
    let totalLines = 0;
    let totalPages = 0;
    let currentPage = 1;
    let pageSize = 1000;            // 默认1000行每页
    let lineOffsets = [0];          // 每行起始字节偏移量
    let currentLoadId = 0;          // 解决异步竞态，保证最新翻页生效
    let isIndexing = false;          // 避免重复构建冲突
    
    // DOM 元素
    const fileInput = document.getElementById('fileInput');
    const fileInfoDiv = document.getElementById('fileInfo');
    const browserDiv = document.getElementById('browser');
    const loadingDiv = document.getElementById('loading');
    const contentPre = document.getElementById('content');
    const totalPagesSpan = document.getElementById('totalPages');
    const pageNumInput = document.getElementById('pageNum');
    
    // 基础字体大小（px）
    const BASE_FONT_SIZE = 12;
    const BASE_LINE_HEIGHT = 18;
    
    // ---------- 辅助函数：显示内嵌进度（优化加载动画效果）----------
    function updateFileInfoProgress(percent, message = null) {
        if (message) {
            fileInfoDiv.innerHTML = message;
            return;
        }
        // 制作简易进度条视觉效果，提升加载质感
        const rounded = Math.min(99, Math.floor(percent));
        fileInfoDiv.innerHTML = `
            ⚡ 扫描文本中 ${rounded}% 
            <span class="progress-bar-bg"><span class="progress-fill" style="width: ${rounded}%;"></span></span>
            <span class="loading" style="width:14px;height:14px; border-width:2px;"></span>
        `;
    }
    
    function finishFileInfo(message) {
        fileInfoDiv.innerHTML = message;
        // 让成功提示闪烁微光
        fileInfoDiv.style.transition = 'background 0.2s';
        fileInfoDiv.style.background = '#e3f2f9';
        setTimeout(() => { if(fileInfoDiv) fileInfoDiv.style.background = ''; }, 600);
    }
    
    // 重置滚动条到顶部并添加淡入效果
    function resetPreScroll() {
        if (contentPre) contentPre.scrollTop = 0;
    }
    
    // 载入页面 (核心优化版：淡入动画 + 防抖请求ID + 滚动复位)
    function loadPage(page, fromJump = false) {
        if (!currentFile || isIndexing) {
            // 索引未完成时禁止翻页
            if(isIndexing) {
                const msgDiv = document.getElementById('loading');
                if(msgDiv) msgDiv.style.display = 'flex';
                setTimeout(() => { if(loadingDiv) loadingDiv.style.display = 'none'; }, 500);
            }
            return;
        }
        if (totalPages === 0) return;
        
        // 边界修正
        if (page < 1) page = 1;
        if (page > totalPages) page = totalPages;
        if (currentPage === page && !fromJump) return; // 相同页不重复加载
        
        currentPage = page;
        pageNumInput.value = page;
        
        // 核心动画: 内容淡出 + 显示loading
        contentPre.style.opacity = '0';
        loadingDiv.style.display = 'flex';
        loadingDiv.classList.add('pulse-glow');
        
        // 增加请求ID避免回调覆盖旧页面
        const requestId = ++currentLoadId;
        
        const startLine = (page - 1) * pageSize;
        const endLine = Math.min(startLine + pageSize, totalLines);
        if (startLine >= totalLines) return;
        
        const startOffset = lineOffsets[startLine];
        // 安全获取结束偏移
        let endOffset;
        if (endLine < lineOffsets.length) {
            endOffset = lineOffsets[endLine];
        } else {
            endOffset = currentFile.size;
        }
        
        const blob = currentFile.slice(startOffset, endOffset);
        const reader = new FileReader();
        
        reader.onload = function(ev) {
            // 只处理最新的请求
            if (requestId !== currentLoadId) return;
            let text = ev.target.result;
            let lines = text.split('\n');
            // 构建带行号的文本，保证行号对齐
            let numberedLines = [];
            const maxLineNumber = startLine + lines.length;
            const lineNumWidth = String(maxLineNumber).length;
            for (let i = 0; i < lines.length; i++) {
                const lineNumber = startLine + i + 1;
                const prefix = String(lineNumber).padStart(lineNumWidth, ' ');
                numberedLines.push(prefix + '· ' + lines[i]);
            }
            const finalText = numberedLines.join('\n');
            contentPre.textContent = finalText;
            
            // 淡入动画 + 重置滚动条位置（阅读习惯）
            contentPre.style.opacity = '1';
            // 重置滚动区域到顶部
            contentPre.scrollTop = 0;
            
            // 优雅隐藏loading
            setTimeout(() => {
                if (loadingDiv && requestId === currentLoadId) {
                    loadingDiv.style.display = 'none';
                    loadingDiv.classList.remove('pulse-glow');
                }
            }, 120);
        };
        
        reader.onerror = () => {
            if (requestId !== currentLoadId) return;
            contentPre.textContent = '⚠️ 段落读取失败，请重试。';
            contentPre.style.opacity = '1';
            loadingDiv.style.display = 'none';
            loadingDiv.classList.remove('pulse-glow');
        };
        
        reader.readAsText(blob, 'UTF-8');
    }
    
    // 重建全文索引（分块读取文件，附带进度动画效果）
    function buildLineIndex(file) {
        if (!file) return;
        isIndexing = true;
        browserDiv.style.display = 'none';
        // 重置全局变量
        lineOffsets = [0];
        totalLines = 0;
        totalPages = 0;
        currentPage = 1;
        currentLoadId = 0;
        
        const chunkSize = 1024 * 1024; // 1MB chunks
        let offset = 0;
        let remainder = '';
        let lastPercent = 0;
        
        function readNextChunk() {
            const end = Math.min(offset + chunkSize, file.size);
            const blob = file.slice(offset, end);
            const reader = new FileReader();
            reader.onload = function(ev) {
                const chunkText = ev.target.result;
                const text = remainder + chunkText;
                let searchFrom = 0;
                let newlineIdx;
                // 扫描换行
                while ((newlineIdx = text.indexOf('\n', searchFrom)) !== -1) {
                    searchFrom = newlineIdx + 1;
                    lineOffsets.push(offset + newlineIdx + 1);
                }
                remainder = text.substring(searchFrom);
                offset = end;
                
                // 更新进度动效
                const percent = Math.floor((offset / file.size) * 100);
                if (percent !== lastPercent) {
                    lastPercent = percent;
                    updateFileInfoProgress(percent);
                }
                
                if (offset < file.size) {
                    readNextChunk();
                } else {
                    // 最后一行如果无结尾换行符，需要额外增加一行
                    if (remainder.length > 0) {
                        // 最后一块没有换行符也要算一行
                        totalLines = lineOffsets.length + 1;
                    } else {
                        totalLines = lineOffsets.length;
                    }
                    
                    // 如果在构建索引时发现余量，修正lineOffsets适应最后一行内容
                    if (remainder.length > 0) {
                        // 虚拟偏移量但不影响后面的读取，因为最后一行读取时直接读到文件尾
                        // 为了行号准确，我们不需要额外偏移量，但需要确保totalLines正确
                        // 重新纠正lineOffsets长度：lineOffsets 目前存储的是每个换行后下一行起始点，末尾无换行最后一行起始偏移存在于上次最后一个换行后
                        // 无需改动 lineOffsets，但我们确保最后一个分页能映射到
                    }
                    // 设定 totalPages
                    totalPages = Math.ceil(totalLines / pageSize);
                    const fileMB = (file.size / 1024 / 1024).toFixed(2);
                    finishFileInfo(`✅ 载入完成 · ${totalLines.toLocaleString()} 行 · ${totalPages} 页 · ${fileMB} MB 🎋`);
                    // 显示浏览区
                    browserDiv.style.display = 'block';
                    document.getElementById('totalPages').textContent = totalPages;
                    pageNumInput.max = totalPages;
                    pageNumInput.value = 1;
                    // 重置缩放样式
                    contentPre.style.fontSize = `${BASE_FONT_SIZE}px`;
                    contentPre.style.lineHeight = `${BASE_LINE_HEIGHT}px`;
                    document.getElementById('scale').value = 1;
                    contentPre.style.opacity = '1';
                    isIndexing = false;
                    // 加载第一页
                    loadPage(1);
                }
            };
            reader.onerror = () => {
                fileInfoDiv.innerHTML = '❌ 读取文件失败，请重试';
                isIndexing = false;
            };
            reader.readAsText(blob, 'UTF-8');
        }
        
        readNextChunk();
    }
    
    // 监听文件选择
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        currentFile = file;
        // 重置显示区域
        browserDiv.style.display = 'none';
        contentPre.textContent = '── 正在解析典籍，灵韵流淌…… ──';
        contentPre.style.opacity = '1';
        // 重置字体
        contentPre.style.fontSize = `${BASE_FONT_SIZE}px`;
        contentPre.style.lineHeight = `${BASE_LINE_HEIGHT}px`;
        document.getElementById('scale').value = 1;
        
        const fileSizeMB = (file.size / 1024 / 1024).toFixed(2);
        updateFileInfoProgress(0, `📖 载入档案 (${fileSizeMB} MB) 索引建立中...`);
        buildLineIndex(file);
    });
    
    // 翻页事件绑定 (优雅触发)
    document.getElementById('firstBtn').onclick = () => {
        if (!currentFile || isIndexing) return;
        loadPage(1, true);
        animateButtonFeedback(document.getElementById('firstBtn'));
    };
    document.getElementById('prevBtn').onclick = () => {
        if (!currentFile || isIndexing) return;
        loadPage(currentPage - 1, true);
        animateButtonFeedback(document.getElementById('prevBtn'));
    };
    document.getElementById('nextBtn').onclick = () => {
        if (!currentFile || isIndexing) return;
        loadPage(currentPage + 1, true);
        animateButtonFeedback(document.getElementById('nextBtn'));
    };
    document.getElementById('lastBtn').onclick = () => {
        if (!currentFile || isIndexing) return;
        loadPage(totalPages, true);
        animateButtonFeedback(document.getElementById('lastBtn'));
    };
    document.getElementById('goBtn').onclick = () => {
        if (!currentFile || isIndexing) return;
        let targetPage = parseInt(pageNumInput.value);
        if (isNaN(targetPage)) targetPage = 1;
        targetPage = Math.min(Math.max(targetPage, 1), totalPages);
        loadPage(targetPage, true);
        animateButtonFeedback(document.getElementById('goBtn'));
    };
    
    // 每页行数变更
    document.getElementById('pageSize').onchange = (e) => {
        if (!currentFile || isIndexing) return;
        pageSize = parseInt(e.target.value);
        if (totalLines > 0) {
            totalPages = Math.ceil(totalLines / pageSize);
            totalPagesSpan.textContent = totalPages;
            pageNumInput.max = totalPages;
            // 重置当前页为第一页
            loadPage(1, true);
        }
    };
    
    // 缩放功能 —— 平滑过渡
    document.getElementById('setScale').onclick = () => {
        let scale = parseFloat(document.getElementById('scale').value);
        if (isNaN(scale) || scale < 0.1) scale = 1;
        if (scale > 5) scale = 5;
        contentPre.style.fontSize = `${BASE_FONT_SIZE * scale}px`;
        contentPre.style.lineHeight = `${BASE_LINE_HEIGHT * scale}px`;
        animateButtonFeedback(document.getElementById('setScale'));
    };
    document.getElementById('resetScale').onclick = () => {
        document.getElementById('scale').value = 1;
        contentPre.style.fontSize = `${BASE_FONT_SIZE}px`;
        contentPre.style.lineHeight = `${BASE_LINE_HEIGHT}px`;
        animateButtonFeedback(document.getElementById('resetScale'));
    };
    
    // 页码输入框回车支持
    pageNumInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('goBtn').click();
        }
    });
    
    // 添加轻微按钮触感反馈动画 (额外增加交互质感)
    function animateButtonFeedback(btn) {
        if (!btn) return;
        btn.style.transform = 'scale(0.96)';
        setTimeout(() => {
            if (btn) btn.style.transform = '';
        }, 120);
    }
    
    // 优雅的全局加载完成 & 窗口重置
    window.addEventListener('load', () => {
