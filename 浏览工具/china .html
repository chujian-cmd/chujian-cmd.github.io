<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>文本浏览工具 - 花园明朝版</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: '花园明朝', 'HanaMinB', 'HanaMinA', system-ui, -apple-system, 'Segoe UI', 'Roboto', monospace;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9edf2 100%);
            margin: 0;
            min-height: 100vh;
            padding: 24px;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: rgba(255,255,255,0.96);
            border-radius: 28px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.02);
            overflow: hidden;
        }
        .header {
            background: rgba(255,255,255,0.7);
            padding: 20px 28px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        h2 {
            margin: 0 0 6px 0;
            font-size: 1.65rem;
            font-weight: 500;
            letter-spacing: -0.3px;
            color: #1e2a3e;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sub {
            color: #5c6f87;
            font-size: 0.85rem;
            margin-top: 4px;
        }
        .file-area {
            padding: 20px 28px 12px 28px;
            background: #ffffff;
        }
        .info-badge {
            background: #f0f4f9;
            padding: 10px 16px;
            border-radius: 60px;
            font-size: 0.85rem;
            color: #1e3a5f;
            display: inline-block;
            margin-top: 12px;
        }
        .browser {
            padding: 0 28px 28px 28px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin: 20px 0 18px 0;
            padding: 12px 16px;
            background: #f8fafd;
            border-radius: 48px;
        }
        button, select, input[type="number"] {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            font-family: '花园明朝', 'HanaMinB', 'HanaMinA', sans-serif;
            color: #1e2a3e;
        }
        button:hover {
            background: #eef2ff;
            border-color: #94a3b8;
        }
        .page-info {
            background: white;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        input#pageNum, input#scale {
            width: 70px;
            text-align: center;
            padding: 6px 8px;
        }
        pre {
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
            border-radius: 24px;
            /* 基础字号和行高用px写死，避免缩放失效 */
            font-size: 12px;
            line-height: 18px;
            font-family: '花园明朝', 'HanaMinB', 'HanaMinA', 'JetBrains Mono', monospace;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 65vh;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05), 0 4px 12px rgba(0,0,0,0.1);
        }
        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            border-top-color: #3b82f6;
            animation: spin 0.7s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-msg { display: flex; align-items: center; gap: 8px; }
        footer {
            font-size: 0.7rem;
            text-align: center;
            padding: 16px;
            color: #7e8b9c;
            border-top: 1px solid #eef2f6;
            background: rgba(255,255,255,0.6);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>📄 文本浏览工具 <span style="font-size:0.7rem;background:#eef2ff;padding:4px 10px;border-radius:40px;font-weight:normal;">花园明朝版</span></h2>
        <div class="sub">轻量阅读 · 生僻字无敌</div>
    </div>
    <div class="file-area">
        <input type="file" id="fileInput" accept=".txt,.csv,.log,.md" style="border-radius:40px;padding:10px 18px;" />
        <div id="fileInfo" class="info-badge">✨ 选择一个文本文件开始</div>
    </div>
    <div id="browser" style="display:none;" class="browser">
        <div class="controls">
            <button id="firstBtn">⏮ 首页</button>
            <button id="prevBtn">◀ 上一页</button>
            <span class="page-info">
                第 <input type="number" id="pageNum" min="1" /> / <span id="totalPages">?</span> 页
            </span>
            <button id="nextBtn">下一页 ▶</button>
            <button id="lastBtn">尾页 ⏭</button>
            <select id="pageSize">
                <option value="100">100行</option>
                <option value="500">500</option>
                <option value="1000" selected>1000</option>
                <option value="5000">5000</option>
            </select>
            <button id="goBtn">跳转</button>
            <span class="page-info">缩放倍数</span>
            <input type="number" id="scale" step="0.1" value="1" />
            <button id="setScale">应用缩放</button>
            <button id="resetScale">重置1倍</button>
        </div>
        <div id="loading" class="status-msg" style="color:#3b6e9e;"><span class="loading"></span> 载入段落中...</div>
        <pre id="content">── 等待加载 ──</pre>
    </div>
    <footer>doubaoanddeepseek.html · 本地数据 · 花园明朝加持 · 生僻字全显示</footer>
</div>
<script>
    let currentFile = null;
    let totalLines = 0;
    let totalPages = 0;
    let currentPage = 1;
    let pageSize = 1000;
    let lineOffsets = [0];
    // 固定基础字号和行高（用px写死，缩放时按倍数计算）
    const baseFontSize = 12;
    const baseLineHeight = 18;

    const fileInput = document.getElementById('fileInput');
    const fileInfoDiv = document.getElementById('fileInfo');
    const browserDiv = document.getElementById('browser');
    const loadingSpan = document.getElementById('loading');
    const contentPre = document.getElementById('content');
    
    fileInput.addEventListener('change', function(e) {
        currentFile = e.target.files[0];
        if (!currentFile) return;
        fileInfoDiv.innerHTML = `⏳ 扫描文件中 · 稍等片刻 <span class="loading" style="width:14px;height:14px;"></span> (${(currentFile.size/1024/1024).toFixed(2)} MB)`;
        browserDiv.style.display = 'none';
        buildLineIndex(currentFile);
    });
    
    function buildLineIndex(file) {
        const chunkSize = 1024 * 1024;
        let offset = 0;
        let remainder = '';
        lineOffsets = [0];
        
        function readChunk() {
            const end = Math.min(offset + chunkSize, file.size);
            const blob = file.slice(offset, end);
            const reader = new FileReader();
            reader.onload = function(ev) {
                const text = remainder + ev.target.result;
                let searchStart = 0, newlinePos;
                while ((newlinePos = text.indexOf('\n', searchStart)) !== -1) {
                    searchStart = newlinePos + 1;
                    lineOffsets.push(offset + newlinePos + 1);
                }
                remainder = text.substring(searchStart);
                offset = end;
                if (offset < file.size) {
                    readChunk();
                } else {
                    totalLines = lineOffsets.length;
                    if (remainder.length > 0) totalLines++;
                    totalPages = Math.ceil(totalLines / pageSize);
                    fileInfoDiv.innerHTML = `✅ 就绪 · ${totalLines.toLocaleString()} 行 · 共 ${totalPages} 页 <span style="font-size:0.75rem;">🎯</span>`;
                    browserDiv.style.display = 'block';
                    document.getElementById('totalPages').textContent = totalPages;
                    document.getElementById('pageNum').max = totalPages;
                    loadPage(1);
                }
            };
            reader.readAsText(blob, 'UTF-8');
        }
        readChunk();
    }
    
    function loadPage(page) {
        if (!currentFile) return;
        if (page < 1) page = 1;
        if (page > totalPages) page = totalPages;
        currentPage = page;
        document.getElementById('pageNum').value = page;
        loadingSpan.style.display = 'flex';
        contentPre.textContent = '　';
        
        const startLine = (page - 1) * pageSize;
        const endLine = Math.min(startLine + pageSize, totalLines);
        const startOffset = lineOffsets[startLine];
        const endOffset = (endLine < lineOffsets.length) ? lineOffsets[endLine] : currentFile.size;
        
        const blob = currentFile.slice(startOffset, endOffset);
        const reader = new FileReader();
        reader.onload = function(e) {
            let text = e.target.result;
            let lines = text.split('\n');
            let numbered = '';
            for (let i = 0; i < lines.length; i++) {
                numbered += (startLine + i + 1) + '· ' + lines[i] + '\n';
            }
            contentPre.textContent = numbered;
            setTimeout(() => { loadingSpan.style.display = 'none'; }, 60);
        };
        reader.readAsText(blob, 'UTF-8');
    }
    
    document.getElementById('firstBtn').onclick = () => loadPage(1);
    document.getElementById('prevBtn').onclick = () => loadPage(currentPage - 1);
    document.getElementById('nextBtn').onclick = () => loadPage(currentPage + 1);
    document.getElementById('lastBtn').onclick = () => loadPage(totalPages);
    document.getElementById('goBtn').onclick = () => loadPage(parseInt(document.getElementById('pageNum').value));
    document.getElementById('pageSize').onchange = (e) => {
        pageSize = parseInt(e.target.value);
        totalPages = Math.ceil(totalLines / pageSize);
        document.getElementById('totalPages').textContent = totalPages;
        document.getElementById('pageNum').max = totalPages;
        loadPage(1);
    };

    // 修复核心：用px直接计算缩放后的字号和行高
    document.getElementById('setScale').onclick = () => {
        const scale = parseFloat(document.getElementById('scale').value);
        if (!scale || scale < 0.01) return;
        contentPre.style.fontSize = `${baseFontSize * scale}px`;
        contentPre.style.lineHeight = `${baseLineHeight * scale}px`;
    };

    // 加了一键重置按钮，点一下就回到1倍
    document.getElementById('resetScale').onclick = () => {
        document.getElementById('scale').value = 1;
        contentPre.style.fontSize = `${baseFontSize}px`;
        contentPre.style.lineHeight = `${baseLineHeight}px`;
    };
</script>
</body>
</html>
