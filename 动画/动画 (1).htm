            ctx.fillRect(0,0,w,h);
            const text = '3D';
            ctx.font = 'bold 90px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const angle = t * 0.5;
            const offset = 20 * Math.sin(angle);
            ctx.fillStyle = '#ff8866';
            ctx.fillText(text, w/2 + offset, h/2 - 5);
            ctx.fillStyle = '#66ccff';
            ctx.fillText(text, w/2 - offset, h/2 + 5);
            ctx.fillStyle = '#fff';
            ctx.fillText(text, w/2, h/2);
        }

        // ---- 45. 文字粒子消散 ----
        function render_textDissolve(t, ctx, w, h) {
            ctx.fillStyle = 'rgba(13, 18, 30, 0.1)';
            ctx.fillRect(0,0,w,h);
            const text = '✨';
            ctx.font = '100px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const off = document.createElement('canvas');
            off.width = w; off.height = h;
            const octx = off.getContext('2d');
            octx.fillStyle = '#fff';
            octx.font = '100px sans-serif';
            octx.textAlign = 'center';
            octx.textBaseline = 'middle';
            octx.fillText(text, w/2, h/2);
            const imgData = octx.getImageData(0, 0, w, h);
            const data = imgData.data;
            const pts = [];
            for (let y = 0; y < h; y+=5) {
                for (let x = 0; x < w; x+=5) {
                    const i = (y * w + x) * 4;
                    if (data[i] > 128) pts.push({x, y});
                }
            }
            const progress = Math.min(1, t * 0.08);
            const count = Math.floor(progress * pts.length);
            for (let i = 0; i < Math.min(count, pts.length); i++) {
                const p = pts[i];
                const angle = i * 0.1 + t * 0.2;
                const r = 30 * (1 - progress) * (0.5 + 0.5 * Math.sin(t + i));
                const x = p.x + Math.cos(angle) * r;
                const y = p.y + Math.sin(angle) * r * 0.5;
                ctx.fillStyle = hsl(i * 0.2 + t * 20, 80, 55);
                ctx.beginPath();
                ctx.arc(x, y, 2 + 2 * Math.sin(t + i*0.02), 0, Math.PI*2);
                ctx.fill();
            }
        }

        // ---- 46. 渐变文字流动 ----
        function render_gradientText(t, ctx, w, h) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const text = 'FLOW';
            ctx.font = 'bold 80px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const grad = ctx.createLinearGradient(0, 0, w, h);
            for (let i = 0; i <= 10; i++) {
                const pos = i / 10;
                const hue = pos * 360 + t * 60;
                grad.addColorStop(pos, `hsl(${hue%360}, 80%, 60%)`);
            }
            ctx.fillStyle = grad;
            ctx.fillText(text, w/2, h/2);
        }

        // ---- 47. 文字跳跃弹动 ----
        function render_bouncingText(t, ctx, w, h) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const text = 'BOUNCE';
            ctx.font = 'bold 70px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const chars = text.split('');
            let x = w/2 - 130;
            chars.forEach((ch, i) => {
                const y = h/2 + 30 * Math.abs(Math.sin(t * 2 + i * 0.7));
                ctx.fillStyle = hsl(i * 30 + t * 30, 80, 60);
                ctx.fillText(ch, x + i * 45, y);
            });
        }

        // ---- 48. 文字描边发光 ----
        function render_glowText(t, ctx, w, h) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const text = 'GLOW';
            ctx.font = 'bold 80px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const alpha = 0.5 + 0.5 * Math.sin(t * 1.5);
            ctx.shadowColor = `rgba(100, 200, 255, ${alpha})`;
            ctx.shadowBlur = 40;
            ctx.strokeStyle = `rgba(255,255,255,${0.3+0.3*alpha})`;
            ctx.lineWidth = 3;
            ctx.strokeText(text, w/2, h/2);
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.fillText(text, w/2, h/2);
        }

        // ---- 49. 文字镜像倒影 ----
        function render_mirrorText(t, ctx, w, h) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const text = 'MIRROR';
            ctx.font = 'bold 60px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#8bb3ff';
            ctx.fillText(text, w/2, h/2 - 40);
            ctx.save();
            ctx.translate(w/2, h/2 + 40);
            ctx.scale(1, -0.5);
            ctx.globalAlpha = 0.3;
            ctx.fillStyle = '#8bb3ff';
            ctx.fillText(text, 0, 0);
            ctx.restore();
        }

        // ---- 50. 文字随机变色 ----
        function render_colorText(t, ctx, w, h) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const text = 'COLOR';
            ctx.font = 'bold 80px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const chars = text.split('');
            let x = w/2 - 120;
            chars.forEach((ch, i) => {
                const hue = (i * 60 + t * 80) % 360;
                ctx.fillStyle = `hsl(${hue}, 90%, 60%)`;
                ctx.fillText(ch, x + i * 60, h/2);
            });
        }

        // ---- 51. 文字渐隐渐现 ----
        function render_fadeText(t, ctx, w, h) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const text = 'FADE';
            ctx.font = 'bold 80px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const alpha = 0.5 + 0.5 * Math.sin(t * 1.2);
            ctx.fillStyle = `rgba(139, 179, 255, ${alpha})`;
            ctx.fillText(text, w/2, h/2);
        }

        // ---- 52. 文字拉伸变形 ----
        function render_stretchText(t, ctx, w, h) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const text = 'STRETCH';
            ctx.font = 'bold 70px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const scaleX = 1 + 0.3 * Math.sin(t * 0.8);
            const scaleY = 1 - 0.2 * Math.sin(t * 0.8);
            ctx.save();
            ctx.translate(w/2, h/2);
            ctx.scale(scaleX, scaleY);
            ctx.fillStyle = hsl(t * 50, 80, 60);
            ctx.fillText(text, 0, 0);
            ctx.restore();
        }

        // ---- 53. 文字环绕旋转 ----
        function render_spiralText(t, ctx, w, h) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const text = 'SPIRAL';
            ctx.font = 'bold 40px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const chars = text.split('');
            const total = chars.length;
            chars.forEach((ch, i) => {
                const angle = (i / total) * Math.PI * 2 + t * 0.3;
                const r = 80 + 30 * Math.sin(t * 0.5 + i);
                const x = w/2 + Math.cos(angle) * r;
                const y = h/2 + Math.sin(angle) * r * 0.5;
                ctx.fillStyle = hsl(i * 40 + t * 30, 80, 60);
                ctx.fillText(ch, x, y);
            });
        }

        // ---- 54. 文字碎片重组 ----
        function render_textRecombine(t, ctx, w, h) {
            ctx.fillStyle = 'rgba(13, 18, 30, 0.1)';
            ctx.fillRect(0,0,w,h);
            const text = 'RE';
            ctx.font = 'bold 100px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const off = document.createElement('canvas');
            off.width = w; off.height = h;
            const octx = off.getContext('2d');
            octx.fillStyle = '#fff';
            octx.font = 'bold 100px sans-serif';
            octx.textAlign = 'center';
            octx.textBaseline = 'middle';
            octx.fillText(text, w/2, h/2);
            const imgData = octx.getImageData(0, 0, w, h);
            const data = imgData.data;
            const pts = [];
            for (let y = 0; y < h; y+=5) {
                for (let x = 0; x < w; x+=5) {
                    const i = (y * w + x) * 4;
                    if (data[i] > 128) pts.push({x, y});
                }
            }
            const progress = (Math.sin(t * 0.2) + 1) / 2;
            const count = Math.floor(progress * pts.length);
            for (let i = 0; i < Math.min(count, pts.length); i++) {
                const p = pts[i];
                const angle = i * 0.5 + t;
                const r = 20 * (1 - progress) * Math.sin(t + i * 0.01);
                const x = p.x + Math.cos(angle) * r;
                const y = p.y + Math.sin(angle) * r * 0.3;
                ctx.fillStyle = hsl(i * 0.2 + t * 20, 80, 55);
                ctx.beginPath();
                ctx.arc(x, y, 2 + 2 * Math.sin(t + i*0.01), 0, Math.PI*2);
                ctx.fill();
            }
        }

        // ---- 55. 文字雨下落 ----
        function render_rainText(t, ctx, w, h) {
            ctx.fillStyle = 'rgba(13, 18, 30, 0.1)';
            ctx.fillRect(0,0,w,h);
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            for (let i = 0; i < 60; i++) {
                const x = (i * 23 + t * 10) % w;
                const y = (i * 37 + t * 80) % h;
                const ch = chars[Math.floor((i + t * 2) % chars.length)];
                ctx.fillStyle = `hsla(${i*6 + t*30}, 80%, 60%, ${0.2+0.3*Math.sin(t+i)})`;
                ctx.font = `${12 + 8*Math.sin(t+i)}px monospace`;
                ctx.textAlign = 'center';
                ctx.fillText(ch, x, y);
            }
        }

        // ---- 56. 重力弹跳小球 ----
        function render_gravityBalls(t, ctx, w, h) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const balls = [
                {x: 150, y: 100, vx: 2, vy: 0, r: 20, color: '#ff6b6b'},
                {x: 450, y: 200, vx: -1.5, vy: 0, r: 25, color: '#4ecdc4'},
                {x: 300, y: 50, vx: 1, vy: 0, r: 18, color: '#ffe66d'}
            ];
            const dt = 0.02;
            balls.forEach(b => {
                b.vy += 300 * dt;
                b.x += b.vx * dt * 60;
                b.y += b.vy * dt * 60;
                if (b.y + b.r > h) { b.y = h - b.r; b.vy *= -0.7; }
                if (b.x - b.r < 0) { b.x = b.r; b.vx *= -0.8; }
                if (b.x + b.r > w) { b.x = w - b.r; b.vx *= -0.8; }
                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
                ctx.fill();
            });
        }

        // ---- 57. 钟摆摆动 ----
        function render_pendulum(t, ctx, w, h) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const cx = w/2, cy = 80;
            const len = 200;
            const angle = 0.5 * Math.sin(t * 1.5);
            const x = cx + Math.sin(angle) * len;
            const y = cy + Math.cos(angle) * len;
            ctx.strokeStyle = '#8899bb';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.fillStyle = '#ff8866';
            ctx.beginPath();
            ctx.arc(x, y, 18, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(cx, cy, 8, 0, Math.PI*2);
            ctx.fill();
        }

        // ---- 58. 弹簧振子 ----
        function render_spring(t, ctx, w, h) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const cx = w/2, cy = 100;
            const amplitude = 100;
            const offset = amplitude * Math.sin(t * 1.2);
            // 弹簧
            ctx.strokeStyle = '#66ccff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            const steps = 20;
            for (let i = 0; i <= steps; i++) {
                const frac = i / steps;
                const x = cx + offset * (1 - frac);
                const y = cy + frac * 300;
                const wiggle = 10 * Math.sin(i * 0.8 + t * 3);
                const px = x + wiggle * (1 - frac);
                i === 0 ? ctx.moveTo(px, y) : ctx.lineTo(px, y);
            }
            ctx.stroke();
            // 小球
            const bx = cx + 5 * Math.sin(t * 3);
            const by = cy + 300;
            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();
            ctx.arc(bx, by, 20, 0, Math.PI*2);
            ctx.fill();
        }

        // ---- 59. 碰撞彩色球体 ----
        function render_collisionBalls(t, ctx, w, h) {
            ctx.fillStyle = 'rgba(13, 18, 30, 0.2)';
            ctx.fillRect(0,0,w,h);
            const balls = [
                {x: 180, y: 200, vx: 80, vy: 60, r: 25, color: '#ff6b6b'},
                {x: 420, y: 300, vx: -70, vy: -40, r: 30, color: '#4ecdc4'},
                {x: 300, y: 100, vx: 50, vy: -80, r: 22, color: '#ffe66d'}
            ];
            const dt = 0.005;
            balls.forEach(b => {
                b.x += b.vx * dt * 60;
                b.y += b.vy * dt * 60;
                if (b.x - b.r < 0 || b.x + b.r > w) b.vx *= -0.9;
                if (b.y - b.r < 0 || b.y + b.r > h) b.vy *= -0.9;
                b.x = Math.max(b.r, Math.min(w - b.r, b.x));
                b.y = Math.max(b.r, Math.min(h - b.r, b.y));
                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
                ctx.fill();
            });
            // 简单碰撞
            for (let i = 0; i < balls.length; i++) {
                for (let j = i+1; j < balls.length; j++) {
                    const d = dist(balls[i].x, balls[i].y, balls[j].x, balls[j].y);
                    if (d < balls[i].r + balls[j].r) {
                        const tmp = balls[i].vx;
                        balls[i].vx = balls[j].vx;
                        balls[j].vx = tmp;
                        const tmp2 = balls[i].vy;
                        balls[i].vy = balls[j].vy;
                        balls[j].vy = tmp2;
                    }
                }
            }
        }

        // ---- 60. 水面涟漪 ----
        function render_ripple(t, ctx, w, h) {
            ctx.fillStyle = '#0a1420';
            ctx.fillRect(0,0,w,h);
            const cx = w/2, cy = h/2;
            for (let i = 0; i < 8; i++) {
                const r = 30 + i * 20 + 15 * Math.sin(t * 1.2 + i * 0.5);
                const alpha = 0.1 + 0.2 * (0.5 + 0.5 * Math.sin(t * 0.8 + i));
                ctx.strokeStyle = `rgba(100, 200, 255, ${alpha})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI*2);
                ctx.stroke();
            }
        }

        // ---- 61. 布匹飘动 ----
        function render_cloth(t, ctx, w, h) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const cols = 15, rows = 12;
            const spacing = 25;
            for (let row = 0; row < rows; row++) {
                ctx.beginPath();
                for (let col = 0; col < cols; col++) {
                    const x = 50 + col * spacing + 10 * Math.sin(t * 0.5 + row * 0.3 + col * 0.1);
                    const y = 50 + row * spacing + 15 * Math.sin(t * 0.7 + col * 0.2 + row * 0.15);
                    const alpha = 0.4 + 0.3 * (0.5 + 0.5 * Math.sin(t + row + col));
                    ctx.strokeStyle = `hsla(${col*15 + t*20}, 70%, 60%, ${alpha})`;
                    ctx.lineWidth = 1.5;
                    col === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
        }

        // ---- 62. 链条摆动 ----
        function render_chain(t, ctx, w, h) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const count = 12;
            const cx = w/2 - 100;
            const cy = 80;
            for (let i = 0; i < count; i++) {
                const angle = 0.3 * Math.sin(t * 1.2 + i * 0.2);
                const x = cx + i * 18 + 30 * Math.sin(t * 0.8 + i * 0.15);
                const y = cy + i * 22 + 20 * Math.sin(t * 0.6 + i * 0.25);
                ctx.fillStyle = `hsl(${i*20 + t*30}, 70%, 60%)`;
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI*2);
                ctx.fill();
                if (i > 0) {
                    ctx.strokeStyle = '#667788';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(x - 6 * Math.cos(angle), y - 6 * Math.sin(angle));
                    const prev = {x: cx + (i-1)*18 + 30*Math.sin(t*0.8+(i-1)*0.15), y: cy + (i-1)*22 + 20*Math.sin(t*0.6+(i-1)*0.25)};
                    ctx.lineTo(prev.x + 6 * Math.cos(angle), prev.y + 6 * Math.sin(angle));
                    ctx.stroke();
                }
            }
        }

        // ---- 63. 落体反弹 ----
        function render_bounce(t, ctx, w, h) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const y = 80 + 300 * (0.5 + 0.5 * Math.sin(t * 1.8));
            const x = w/2 + 80 * Math.sin(t * 0.5);
            ctx.fillStyle = '#ff8866';
            ctx.beginPath();
            ctx.arc(x, y, 25, 0, Math.PI*2);
            ctx.fill();
            // 影子
            ctx.fillStyle = 'rgba(255,255,255,0.05)';
            ctx.beginPath();
            ctx.ellipse(x, h-10, 30 - y/20, 8, 0, 0, Math.PI*2);
            ctx.fill();
        }

        // ---- 64. 行星公转 ----
        function render_planets(t, ctx, w, h) {
            ctx.fillStyle = '#0a0f18';
            ctx.fillRect(0,0,w,h);
            const cx = w/2, cy = h/2;
            ctx.fillStyle = '#ffcc44';
            ctx.beginPath();
            ctx.arc(cx, cy, 25, 0, Math.PI*2);
            ctx.fill();
            const planets = [
                {r: 80, speed: 0.8, size: 8, color: '#66ccff'},
                {r: 140, speed: 0.4, size: 12, color: '#ff8866'},
                {r: 200, speed: 0.25, size: 16, color: '#88ff88'}
            ];
            planets.forEach(p => {
                const angle = t * p.speed;
                const x = cx + Math.cos(angle) * p.r;
                const y = cy + Math.sin(angle) * p.r * 0.6;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(x, y, p.size, 0, Math.PI*2);
                ctx.fill();
                // 轨道
                ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.ellipse(cx, cy, p.r, p.r * 0.6, 0, 0, Math.PI*2);
                ctx.stroke();
            });
        }

        // ---- 65. 磁铁吸引粒子 ----
        function render_magnet(t, ctx, w, h, mouse) {
            ctx.fillStyle = 'rgba(13, 18, 30, 0.1)';
            ctx.fillRect(0,0,w,h);
            const mx = mouse.x || w/2, my = mouse.y || h/2;
            for (let i = 0; i < 80; i++) {
                const angle = i * 0.5 + t * 0.1;
                const r = 30 + i * 1.5;
                let x = w/2 + Math.cos(angle) * (r % 200);
                let y = h/2 + Math.sin(angle) * (r % 200) * 0.5;
                const d = dist(x, y, mx, my);
                if (d < 120) {
                    const force = 0.02 * (120 - d) / 120;
                    x += (mx - x) * force;
                    y += (my - y) * force;
                }
                ctx.fillStyle = hsl(i * 2 + t * 20, 80, 55);
                ctx.beginPath();
                ctx.arc(x, y, 2 + 3 * Math.sin(t + i*0.02), 0, Math.PI*2);
                ctx.fill();
            }
        }

        // ---- 66. 摩擦力减速 ----
        function render_friction(t, ctx, w, h) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const speed = Math.max(0, 1 - t * 0.02);
            const x = 100 + speed * 300;
            const y = h/2 + 50 * Math.sin(t * 2 * speed);
            ctx.fillStyle = '#66ccff';
            ctx.beginPath();
            ctx.arc(x, y, 20, 0, Math.PI*2);
            ctx.fill();
            // 轨迹
            ctx.fillStyle = 'rgba(255,255,255,0.05)';
            for (let i = 0; i < 20; i++) {
                const sx = 100 + i * 15 * speed;
                const sy = h/2 + 50 * Math.sin(i * 0.3 + t * 0.5);
                ctx.beginPath();
                ctx.arc(sx, sy, 3, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // ---- 67. 抛体运动轨迹 ----
        function render_projectile(t, ctx, w, h) {
            ctx.fillStyle = 'rgba(13, 18, 30, 0.1)';
            ctx.fillRect(0,0,w,h);
            const g = 300;
            const vx = 150, vy = -200;
            const t0 = t % 3;
            const x = 50 + vx * t0;
            const y = h - 50 + vy * t0 + 0.5 * g * t0 * t0;
            if (y < h - 50) {
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.arc(x, y, 12, 0, Math.PI*2);
                ctx.fill();
                // 轨迹
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let i = 0; i < 30; i++) {
                    const tt = i * 0.05;
                    const px = 50 + vx * tt;
                    const py = h - 50 + vy * tt + 0.5 * g * tt * tt;
                    if (py > h) break;
                    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                }
                ctx.stroke();
            }
        }

        // ---- 68. 双摆混沌 ----
        function render_doublePendulum(t, ctx, w, h) {
            ctx.fillStyle = 'rgba(13, 18, 30, 0.1)';
            ctx.fillRect(0,0,w,h);
            const cx = w/2, cy = 100;
            const l1 = 120, l2 = 100;
            const a1 = 0.8 * Math.sin(t * 1.1);
            const a2 = 0.9 * Math.sin(t * 1.7 + 0.5);
            const x1 = cx + Math.sin(a1) * l1;
            const y1 = cy + Math.cos(a1) * l1;
            const x2 = x1 + Math.sin(a2) * l2;
            const y2 = y1 + Math.cos(a2) * l2;
            ctx.strokeStyle = '#667788';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(x1, y1);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.fillStyle = '#ff8866';
            ctx.beginPath();
            ctx.arc(x1, y1, 10, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#66ccff';
            ctx.beginPath();
            ctx.arc(x2, y2, 12, 0, Math.PI*2);
            ctx.fill();
        }

        // ---- 69. 流体模拟 (简化) ----
        function render_fluid(t, ctx, w, h) {
            ctx.fillStyle = 'rgba(13, 18, 30, 0.05)';
            ctx.fillRect(0,0,w,h);
            for (let i = 0; i < 80; i++) {
                const x = (i * 43 + t * 20) % w;
                const y = (i * 71 + t * 15 + 20 * Math.sin(t * 0.3 + i * 0.2)) % h;
                const size = 3 + 6 * (0.5 + 0.5 * Math.sin(t * 0.5 + i * 0.1));
                ctx.fillStyle = `hsla(${i*3 + t*20}, 60%, 50%, ${0.2+0.2*Math.sin(t+i)})`;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // ---- 70. 沙粒堆积 ----
        function render_sandpile(t, ctx, w, h) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const cx = w/2, cy = h - 50;
            const count = 200;
            for (let i = 0; i < count; i++) {
                const angle = i * 0.3 + t * 0.02;
                const r = 20 + i * 0.5 + 10 * Math.sin(t * 0.2 + i * 0.02);
                const x = cx + Math.cos(angle) * (r % 160);
                const y = cy - Math.sin(angle) * (r % 160) * 0.3 - 10;
                const size = 1 + 2 * (0.5 + 0.5 * Math.sin(t + i * 0.02));
                ctx.fillStyle = `hsl(40, ${30+20*Math.sin(t+i*0.02)}%, ${50+20*Math.sin(t+i*0.01)}%)`;
                ctx.fillRect(x, y, size, size);
            }
        }

        // ---- 71. 鼠标拖尾光点 ----
        function render_trail(t, ctx, w, h, mouse) {
            ctx.fillStyle = 'rgba(13, 18, 30, 0.08)';
            ctx.fillRect(0,0,w,h);
            const mx = mouse.x || w/2, my = mouse.y || h/2;
            for (let i = 0; i < 30; i++) {
                const angle = i * 0.5 + t * 0.2;
                const r = 10 + i * 2 + 10 * Math.sin(t + i);
                const x = mx + Math.cos(angle) * r;
                const y = my + Math.sin(angle) * r * 0.5;
                const alpha = 0.1 + 0.3 * (1 - i / 30);
                ctx.fillStyle = `rgba(255, 200, 100, ${alpha})`;
                ctx.beginPath();
                ctx.arc(x, y, 2 + 2 * (1 - i/30), 0, Math.PI*2);
                ctx.fill();
            }
        }

        // ---- 72. 点击产生波纹 ----
        function render_clickRipple(t, ctx, w, h, mouse) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const cx = mouse.x || w/2, cy = mouse.y || h/2;
            for (let i = 0; i < 6; i++) {
                const r = 20 + i * 25 + 30 * (0.5 + 0.5 * Math.sin(t * 2 + i * 0.5));
                const alpha = 0.05 + 0.15 * (0.5 + 0.5 * Math.sin(t * 2 + i));
                ctx.strokeStyle = `rgba(100, 200, 255, ${alpha})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI*2);
                ctx.stroke();
            }
        }

        // ---- 73. 鼠标控制方块 ----
        function render_mouseBlock(t, ctx, w, h, mouse) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const mx = mouse.x || w/2, my = mouse.y || h/2;
            const size = 40 + 20 * Math.sin(t * 0.5);
            ctx.fillStyle = `hsl(${t*50}, 80%, 60%)`;
            ctx.fillRect(mx - size/2, my - size/2, size, size);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(mx - size/2, my - size/2, size, size);
        }

        // ---- 74. 悬停放大效果 ----
        function render_hoverZoom(t, ctx, w, h, mouse) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const mx = mouse.x || w/2, my = mouse.y || h/2;
            const gridSize = 40;
            for (let row = 0; row < 15; row++) {
                for (let col = 0; col < 15; col++) {
                    const x = col * gridSize + 20;
                    const y = row * gridSize + 20;
                    const d = dist(x + gridSize/2, y + gridSize/2, mx, my);
                    const scale = d < 80 ? 1 + 0.5 * (1 - d/80) : 1;
                    const cx = x + gridSize/2, cy = y + gridSize/2;
                    const s = gridSize * 0.8 * scale;
                    ctx.fillStyle = `hsl(${col*10 + row*5 + t*20}, 70%, ${40 + 20*scale}%)`;
                    ctx.fillRect(cx - s/2, cy - s/2, s, s);
                }
            }
        }

        // ---- 75. 鼠标绘制彩虹 ----
        function render_rainbowDraw(t, ctx, w, h, mouse) {
            ctx.fillStyle = 'rgba(13, 18, 30, 0.02)';
            ctx.fillRect(0,0,w,h);
            const mx = mouse.x || w/2, my = mouse.y || h/2;
            const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#9b59b6'];
            for (let i = 0; i < 30; i++) {
                const angle = i * 0.3 + t * 0.1;
                const r = 10 + i * 4;
                const x = mx + Math.cos(angle) * r;
                const y = my + Math.sin(angle) * r * 0.6;
                ctx.fillStyle = colors[i % colors.length] + '66';
                ctx.beginPath();
                ctx.arc(x, y, 4 + 2 * Math.sin(t + i), 0, Math.PI*2);
                ctx.fill();
            }
        }

        // ---- 76. 跟随鼠标眼睛 ----
        function render_followEyes(t, ctx, w, h, mouse) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const mx = mouse.x || w/2, my = mouse.y || h/2;
            const eyes = [
                {x: w/2 - 60, y: h/2 - 30},
                {x: w/2 + 60, y: h/2 - 30}
            ];
            eyes.forEach(e => {
                const dx = mx - e.x, dy = my - e.y;
                const d = Math.hypot(dx, dy);
                const look = Math.min(1, d / 60);
                const lx = e.x + (dx / (d || 1)) * 15 * look;
                const ly = e.y + (dy / (d || 1)) * 15 * look;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.ellipse(e.x, e.y, 30, 35, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#222';
                ctx.beginPath();
                ctx.arc(lx, ly, 14, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(lx - 4, ly - 4, 5, 0, Math.PI*2);
                ctx.fill();
            });
        }

        // ---- 77. 点击爆炸烟花 ----
        function render_clickFirework(t, ctx, w, h, mouse) {
            ctx.fillStyle = 'rgba(13, 18, 30, 0.15)';
            ctx.fillRect(0,0,w,h);
            const cx = mouse.x || w/2, cy = mouse.y || h/2;
            for (let i = 0; i < 80; i++) {
                const angle = i * 0.5 + t * 0.3;
                const r = 20 + 70 * (0.5 + 0.5 * Math.sin(t * 0.4 + i * 0.1));
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r * 0.5;
                const size = 2 + 4 * (0.5 + 0.5 * Math.sin(t + i * 0.05));
                ctx.fillStyle = hsl(i * 4 + t * 30, 90, 55);
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // ---- 78. 鼠标引力吸引 ----
        function render_magnetAttract(t, ctx, w, h, mouse) {
            ctx.fillStyle = 'rgba(13, 18, 30, 0.08)';
            ctx.fillRect(0,0,w,h);
            const mx = mouse.x || w/2, my = mouse.y || h/2;
            for (let i = 0; i < 60; i++) {
                const angle = i * 0.2 + t * 0.05;
                const r = 30 + i * 2 + 20 * Math.sin(t + i * 0.02);
                let x = w/2 + Math.cos(angle) * (r % 180);
                let y = h/2 + Math.sin(angle) * (r % 180) * 0.4;
                const d = dist(x, y, mx, my);
                if (d < 150) {
                    const force = 0.03 * (150 - d) / 150;
                    x += (mx - x) * force;
                    y += (my - y) * force;
                }
                ctx.fillStyle = hsl(i * 2 + t * 20, 80, 55);
                ctx.beginPath();
                ctx.arc(x, y, 2 + 3 * Math.sin(t + i*0.01), 0, Math.PI*2);
                ctx.fill();
            }
        }

        // ---- 79. 触摸变色画板 ----
        function render_touchColor(t, ctx, w, h, mouse) {
            ctx.fillStyle = 'rgba(13, 18, 30, 0.01)';
            ctx.fillRect(0,0,w,h);
            const mx = mouse.x || w/2, my = mouse.y || h/2;
            if (mouse.down) {
                const r = 30 + 20 * Math.sin(t);
                const grad = ctx.createRadialGradient(mx, my, 0, mx, my, r);
                grad.addColorStop(0, `hsl(${t*60}, 90%, 60%)`);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(mx, my, r, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // ---- 80. 鼠标控制旋转 ----
        function render_mouseRotate(t, ctx, w, h, mouse) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const mx = mouse.x || w/2, my = mouse.y || h/2;
            const angle = Math.atan2(my - h/2, mx - w/2);
            ctx.save();
            ctx.translate(w/2, h/2);
            ctx.rotate(angle);
            for (let i = 0; i < 8; i++) {
                const a = (i / 8) * Math.PI*2;
                const r = 60 + 20 * Math.sin(t + i);
                const x = Math.cos(a) * r;
                const y = Math.sin(a) * r * 0.5;
                ctx.fillStyle = hsl(i * 30 + t * 30, 80, 60);
                ctx.beginPath();
                ctx.arc(x, y, 10 + 5 * Math.sin(t + i), 0, Math.PI*2);
                ctx.fill();
            }
            ctx.restore();
        }

        // ---- 81. 拖拽弹性变形 ----
        function render_dragElastic(t, ctx, w, h, mouse) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const mx = mouse.x || w/2, my = mouse.y || h/2;
            const cx = w/2, cy = h/2;
            const dx = mx - cx, dy = my - cy;
            const d = Math.hypot(dx, dy);
            const stretch = Math.min(1, d / 100);
            const nx = cx + dx * (1 + stretch * 0.3);
            const ny = cy + dy * (1 + stretch * 0.3);
            ctx.fillStyle = `hsl(${t*50}, 80%, 60%)`;
            ctx.beginPath();
            ctx.ellipse(nx, ny, 40 + 20 * stretch, 40 - 10 * stretch, 0, 0, Math.PI*2);
            ctx.fill();
            // 弹簧线
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(nx, ny);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // ---- 82. 点击生成花瓣 ----
        function render_clickPetals(t, ctx, w, h, mouse) {
            ctx.fillStyle = 'rgba(13, 18, 30, 0.05)';
            ctx.fillRect(0,0,w,h);
            const cx = mouse.x || w/2, cy = mouse.y || h/2;
            for (let i = 0; i < 12; i++) {
                const angle = i * 0.5 + t * 0.2;
                const r = 20 + 40 * (0.5 + 0.5 * Math.sin(t * 0.3 + i));
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r * 0.5;
                ctx.fillStyle = `hsla(340, 80%, 70%, ${0.3+0.3*Math.sin(t+i)})`;
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(t + i);
                ctx.beginPath();
                ctx.ellipse(0, 0, 8 + 4 * Math.sin(t + i), 5 + 3 * Math.sin(t + i*0.5), 0, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            }
        }

        // ---- 83. 鼠标扫描探照灯 ----
        function render_spotlight(t, ctx, w, h, mouse) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const mx = mouse.x || w/2, my = mouse.y || h/2;
            // 暗处
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0,0,w,h);
            // 光锥
            const grad = ctx.createRadialGradient(mx, my, 0, mx, my, 120);
            grad.addColorStop(0, 'rgba(255,255,200,0.3)');
            grad.addColorStop(0.5, 'rgba(255,255,200,0.1)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(mx, my, 120, 0, Math.PI*2);
            ctx.fill();
            // 中心亮点
            ctx.fillStyle = 'rgba(255,255,220,0.2)';
            ctx.beginPath();
            ctx.arc(mx, my, 20, 0, Math.PI*2);
            ctx.fill();
        }

        // ---- 84. 跟随鼠标星星 ----
        function render_followStars(t, ctx, w, h, mouse) {
            ctx.fillStyle = 'rgba(13, 18, 30, 0.1)';
            ctx.fillRect(0,0,w,h);
            const mx = mouse.x || w/2, my = mouse.y || h/2;
            for (let i = 0; i < 50; i++) {
                const angle = i * 0.4 + t * 0.1;
                const r = 15 + i * 1.5 + 10 * Math.sin(t + i * 0.02);
                const x = mx + Math.cos(angle) * (r % 100);
                const y = my + Math.sin(angle) * (r % 100) * 0.4;
                const size = 2 + 3 * (0.5 + 0.5 * Math.sin(t + i * 0.02));
                ctx.fillStyle = hsl(i * 3 + t * 30, 90, 70);
                // 星形
                ctx.beginPath();
                for (let j = 0; j < 5; j++) {
                    const a = (j / 5) * Math.PI*2 - Math.PI/2 + t * 0.1;
                    const sr = j % 2 === 0 ? size : size * 0.4;
                    const px = x + Math.cos(a) * sr;
                    const py = y + Math.sin(a) * sr;
                    j === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
            }
        }

        // ---- 85. 点击切换颜色 ----
        function render_clickColor(t, ctx, w, h, mouse) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const hue = (t * 20) % 360;
            const cx = w/2, cy = h/2;
            const r = 80 + 20 * Math.sin(t * 0.5);
            ctx.fillStyle = `hsl(${hue}, 90%, 60%)`;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = '24px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('点击切换', cx, cy);
        }

        // ---- 86. 曼德博集合缩放 ----
        function render_mandelbrot(t, ctx, w, h) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const zoom = 1 + 0.5 * Math.sin(t * 0.1);
            const cx = -0.5, cy = 0;
            const scale = 200 * zoom;
            const maxIter = 40;
            const imageData = ctx.getImageData(0, 0, w, h);
            const data = imageData.data;
            for (let py = 0; py < h; py++) {
                for (let px = 0; px < w; px++) {
                    const x = cx + (px - w/2) / scale;
                    const y = cy + (py - h/2) / scale;
                    let zx = 0, zy = 0;
                    let iter = 0;
                    while (zx*zx + zy*zy < 4 && iter < maxIter) {
                        const tmp = zx*zx - zy*zy + x;
                        zy = 2*zx*zy + y;
                        zx = tmp;
                        iter++;
                    }
                    const idx = (py * w + px) * 4;
                    const color = iter / maxIter;
                    data[idx] = 30 + 180 * color;
                    data[idx+1] = 50 + 150 * (1 - color);
                    data[idx+2] = 80 + 160 * (0.5 + 0.5 * Math.sin(color * 5));
                    data[idx+3] = 255;
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        // ---- 87. 彩色噪声流动 ----
        function render_noiseFlow(t, ctx, w, h) {
            const imageData = ctx.getImageData(0, 0, w, h);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const x = (i/4) % w, y = Math.floor((i/4) / w);
                const v = 0.5 + 0.5 * Math.sin(x * 0.05 + y * 0.03 + t * 0.5);
                const v2 = 0.5 + 0.5 * Math.sin(x * 0.07 - y * 0.04 + t * 0.4 + 1);
                data[i] = 80 + 160 * v;
                data[i+1] = 60 + 180 * v2;
                data[i+2] = 100 + 150 * (0.5 + 0.5 * Math.sin(x * 0.02 + y * 0.06 + t * 0.3));
                data[i+3] = 255;
            }
            ctx.putImageData(imageData, 0, 0);
        }

        // ---- 88. 旋转色彩轮 ----
        function render_colorWheel(t, ctx, w, h) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const cx = w/2, cy = h/2;
            const r = 180;
            for (let i = 0; i < 360; i++) {
                const angle = (i / 360) * Math.PI*2 + t * 0.1;
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r * 0.7;
                ctx.fillStyle = `hsl(${i + t*30}, 80%, 60%)`;
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // ---- 89. 梦幻光晕叠加 ----
        function render_glowOverlay(t, ctx, w, h) {
            ctx.fillStyle = '#0a0f18';
            ctx.fillRect(0,0,w,h);
            const cx = w/2, cy = h/2;
            for (let i = 0; i < 6; i++) {
                const angle = i * 1.2 + t * 0.1;
                const r = 80 + i * 30 + 20 * Math.sin(t * 0.5 + i);
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r * 0.5;
                const grad = ctx.createRadialGradient(x, y, 0, x, y, 50 + 20 * Math.sin(t + i));
                grad.addColorStop(0, `hsla(${i*60 + t*30}, 80%, 70%, 0.15)`);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y, 60, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // ---- 90. 分形树生长 ----
        function render_fractalTree(t, ctx, w, h) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const cx = w/2, cy = h - 30;
            const progress = Math.min(1, t * 0.08);
            function drawTree(x, y, len, angle, depth, maxDepth) {
                if (depth > maxDepth || len < 3) return;
                const endX = x + Math.cos(angle) * len;
                const endY = y - Math.sin(angle) * len;
                ctx.strokeStyle = `hsl(${30 - depth*5}, 80%, ${40 + depth*5}%)`;
                ctx.lineWidth = Math.max(1, 4 - depth * 0.3);
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(endX, endY);
                ctx.stroke();
                if (depth < progress * 6) {
                    const branchLen = len * 0.7;
                    drawTree(endX, endY, branchLen, angle + 0.4, depth+1, maxDepth);
                    drawTree(endX, endY, branchLen, angle - 0.4, depth+1, maxDepth);
                }
            }
            drawTree(cx, cy, 80, Math.PI/2, 0, 8);
        }

        // ---- 91. 彩色条纹旋转 ----
        function render_stripeRotate(t, ctx, w, h) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const cx = w/2, cy = h/2;
            for (let i = 0; i < 30; i++) {
                const angle = (i / 30) * Math.PI*2 + t * 0.15;
                const r1 = 20 + i * 8;
                const r2 = r1 + 6;
                ctx.fillStyle = `hsla(${i*12 + t*30}, 80%, 60%, ${0.2+0.3*Math.sin(t+i)})`;
                ctx.beginPath();
                ctx.arc(cx, cy, r2, angle, angle + 0.3);
                ctx.arc(cx, cy, r1, angle + 0.3, angle, true);
                ctx.closePath();
                ctx.fill();
            }
        }

        // ---- 92. 水彩扩散效果 ----
        function render_watercolor(t, ctx, w, h) {
            ctx.fillStyle = 'rgba(13, 18, 30, 0.02)';
            ctx.fillRect(0,0,w,h);
            for (let i = 0; i < 20; i++) {
                const x = 50 + i * 30 + 40 * Math.sin(t * 0.2 + i);
                const y = 50 + i * 20 + 30 * Math.cos(t * 0.3 + i * 0.5);
                const r = 20 + 30 * (0.5 + 0.5 * Math.sin(t * 0.4 + i));
                const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
                grad.addColorStop(0, `hsla(${i*30 + t*20}, 70%, 60%, 0.15)`);
                grad.addColorStop(1, `hsla(${i*30 + t*20 + 40}, 70%, 50%, 0.02)`);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // ---- 93. 万花筒镜面反射 ----
        function render_kaleidoscopeMirror(t, ctx, w, h) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const cx = w/2, cy = h/2;
            const segments = 10;
            for (let i = 0; i < segments; i++) {
                const angle = (i / segments) * Math.PI*2 + t * 0.05;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);
                for (let j = 0; j < 4; j++) {
                    const r = 30 + j * 35 + 15 * Math.sin(t * 0.8 + i + j);
                    const x = r * 0.5;
                    const y = r * 0.3 * Math.sin(t * 0.5 + j);
                    ctx.fillStyle = `hsla(${i*30 + j*20 + t*20}, 80%, 60%, 0.6)`;
                    ctx.beginPath();
                    ctx.arc(x, y, 5 + 4 * Math.sin(t + i + j), 0, Math.PI*2);
                    ctx.fill();
                    // 镜像
                    ctx.fillStyle = `hsla(${i*30 + j*20 + t*20 + 180}, 80%, 60%, 0.3)`;
                    ctx.beginPath();
                    ctx.arc(-x, y, 5 + 4 * Math.sin(t + i + j + 0.5), 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        // ---- 94. 炫光耀斑 ----
        function render_lensFlare(t, ctx, w, h) {
            ctx.fillStyle = '#0a0f18';
            ctx.fillRect(0,0,w,h);
            const cx = w/2 + 80 * Math.sin(t * 0.2);
            const cy = h/2 + 60 * Math.cos(t * 0.25);
            for (let i = 0; i < 8; i++) {
                const angle = i * 0.8 + t * 0.1;
                const r = 30 + i * 25 + 20 * Math.sin(t * 0.5 + i);
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r * 0.4;
                const grad = ctx.createRadialGradient(x, y, 0, x, y, 30 + 10 * Math.sin(t + i));
                grad.addColorStop(0, `hsla(${i*40 + t*30}, 90%, 70%, 0.2)`);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y, 40, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // ---- 95. 旋转彩色环 ----
        function render_colorRings(t, ctx, w, h) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const cx = w/2, cy = h/2;
            for (let i = 0; i < 12; i++) {
                const r = 30 + i * 22 + 10 * Math.sin(t * 0.5 + i);
                ctx.strokeStyle = `hsla(${i*30 + t*20}, 80%, 60%, ${0.3+0.3*Math.sin(t+i)})`;
                ctx.lineWidth = 2 + 2 * Math.sin(t * 0.7 + i);
                ctx.beginPath();
                ctx.arc(cx, cy, r, t * 0.2 + i * 0.1, t * 0.2 + i * 0.1 + 1.8);
                ctx.stroke();
            }
        }

        // ---- 96. 动态网格变形 ----
        function render_gridDeform(t, ctx, w, h) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const step = 30;
            for (let row = 0; row < 20; row++) {
                for (let col = 0; col < 20; col++) {
                    const x = col * step + 15;
                    const y = row * step + 15;
                    const dx = 8 * Math.sin(x * 0.05 + y * 0.03 + t * 1.5);
                    const dy = 8 * Math.cos(x * 0.04 - y * 0.06 + t * 1.2);
                    ctx.fillStyle = `hsl(${col*10 + row*8 + t*30}, 70%, 50%)`;
                    ctx.fillRect(x + dx - 3, y + dy - 3, 6, 6);
                }
            }
        }

        // ---- 97. 彩色频谱条 ----
        function render_spectrum(t, ctx, w, h) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const count = 40;
            for (let i = 0; i < count; i++) {
                const x = i * (w / count);
                const hh = 30 + 100 * (0.5 + 0.5 * Math.sin(i * 0.3 + t * 2));
                ctx.fillStyle = `hsl(${i*9 + t*30}, 80%, 60%)`;
                ctx.fillRect(x, h - hh - 20, w/count - 2, hh);
            }
        }

        // ---- 98. 梦幻气泡 ----
        function render_dreamBubbles(t, ctx, w, h) {
            ctx.fillStyle = 'rgba(13, 18, 30, 0.05)';
            ctx.fillRect(0,0,w,h);
            for (let i = 0; i < 30; i++) {
                const x = 50 + i * 25 + 40 * Math.sin(t * 0.2 + i * 0.5);
                const y = 50 + i * 15 + 30 * Math.cos(t * 0.3 + i * 0.4);
                const r = 8 + 18 * (0.5 + 0.5 * Math.sin(t * 0.5 + i));
                const grad = ctx.createRadialGradient(x - r*0.3, y - r*0.3, 0, x, y, r);
                grad.addColorStop(0, `hsla(${i*30 + t*20}, 80%, 70%, 0.15)`);
                grad.addColorStop(0.6, `hsla(${i*30 + t*20 + 40}, 70%, 60%, 0.08)`);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI*2);
                ctx.fill();
                ctx.strokeStyle = `hsla(200, 60%, 70%, 0.05)`;
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI*2);
                ctx.stroke();
            }
        }

        // ---- 99. 极光飘动 ----
        function render_aurora(t, ctx, w, h) {
            ctx.fillStyle = '#0a0f18';
            ctx.fillRect(0,0,w,h);
            for (let i = 0; i < 30; i++) {
                ctx.beginPath();
                for (let x = 0; x < w; x += 3) {
                    const y = 50 + i * 12 + 30 * Math.sin(x * 0.02 + t * 0.5 + i * 0.3);
                    const alpha = 0.05 + 0.12 * (0.5 + 0.5 * Math.sin(x * 0.01 + t * 0.2 + i));
                    ctx.strokeStyle = `hsla(${i*8 + 180 + t*10}, 80%, 60%, ${alpha})`;
                    ctx.lineWidth = 1.5;
                    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
        }

        // ---- 100. 无限缩放隧道 ----
        function render_tunnel(t, ctx, w, h) {
            ctx.fillStyle = '#0d121e';
            ctx.fillRect(0,0,w,h);
            const cx = w/2, cy = h/2;
            const rings = 30;
            for (let i = 0; i < rings; i++) {
                const r = 20 + i * 12 + 8 * Math.sin(t * 0.5 + i * 0.3);
                const alpha = 0.1 + 0.2 * (0.5 + 0.5 * Math.sin(t * 0.3 + i * 0.1));
                ctx.strokeStyle = `hsla(${i*12 + t*20}, 80%, 60%, ${alpha})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(cx, cy, r % 300, 0, Math.PI*2);
                ctx.stroke();
            }
            // 中心点
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.arc(cx, cy, 5 + 3 * Math.sin(t), 0, Math.PI*2);
            ctx.fill();
        }

        // ============================================================
        // 9. 初始化
        // ============================================================
        renderCards();
        setupMouseEvents();

        // 默认打开第一个动画 (可选)
        // openPlayer(25, '粒子汇聚文字', '✏️');

        console.log('✅ 100个动画已加载，点击卡片即可预览');
    })();
