<!doctype html><body style="margin:0;overflow:hidden;background:#222;touch-action:none"><canvas id=c><script>C=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,PX=W/2,SC=0,E=[],T=0;ontouchmove=e=>{e.preventDefault();if(e.touches[0])PX=e.touches[0].clientX};setInterval(_=>{T++;C.fillStyle='#222';C.fillRect(0,0,W,H);C.fillStyle='#fff';C.fillRect(W/2-2,0,4,H);C.fillStyle='#fff';for(i=0;i<H;i+=50){C.fillRect(W/2-2,(i+T*4)%H,4,20)}C.fillStyle='#3bf';C.fillRect(PX-20,H-60,40,50);if(T%20==0)E.push([Math.random()*(W-60)+30,-50]);C.fillStyle='#f43';for(i=E.length-1;i>=0;i--){e=E[i];e[1]+=3+SC/50;C.fillRect(e[0]-20,e[1],40,50);if(Math.abs(e[0]-PX)<35&&Math.abs(e[1]-(H-60))<40){SC=0;E=[];break}if(e[1]>H){E.splice(i,1);SC+=10}}C.fillStyle='#fff';C.font='20px sans-serif';C.fillText('SC:'+SC,10,30)},30)</script>
