<!doctype html><body style="margin:0;overflow:hidden;background:#050510;touch-action:none"><canvas id=c><script>C=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,P=[],MX=-99,MY=-99,R=Math.random;ontouchstart=ontouchmove=function(e){e.preventDefault();var t=e.touches[0];if(t){MX=t.clientX;MY=t.clientY;for(var i=0;i<5;i++){var a=R()*6.28,s=R()*4+2;P.push({x:MX,y:MY,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c:'hsl('+R()*360+',100%,60%)',l:1})}}};setInterval(function(){C.fillStyle='rgba(5,5,16,0.2)';C.fillRect(0,0,W,H);for(var i=P.length-1;i>=0;i--){var p=P[i],dx=W/2-p.x,dy=H/2-p.y,d=Math.sqrt(dx*dx+dy*dy);if(d<30){P.splice(i,1);continue}p.vx+=dx/d*0.5;p.vy+=dy/d*0.5;p.x+=p.vx;p.y+=p.vy;p.l-=.01;if(p.l<=0){P.splice(i,1);continue}C.globalAlpha=p.l;C.fillStyle=p.c;C.beginPath();C.arc(p.x,p.y,3,0,7);C.fill()}},30)</script>
