<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>泡泡测试</title>
<style>
  body { margin: 0; overflow: hidden; background: #001; touch-action: none; }
  canvas { display: block; }
  #msg { position: fixed; top: 10px; left: 10px; color: #fff; font-family: sans-serif; font-size: 14px; z-index: 99; background: rgba(0,0,0,0.5); padding: 4px; }
</style>
</head>
<body>
<div id="msg">正在加载...</div>
<canvas id="myCanvas"></canvas>
<script>
  var msg = document.getElementById('msg');
  var canvas = document.getElementById('myCanvas');
  var ctx = canvas.getContext('2d');
  var W = canvas.width = window.innerWidth;
  var H = canvas.height = window.innerHeight;
  var bubbles = [];

  // 提示加载成功
  msg.innerText = "加载成功！请滑动屏幕";

  // 绑定触摸事件（加了双保险）
  document.addEventListener('touchmove', function(e) {
    e.preventDefault(); // 阻止页面滚动
    msg.innerText = "正在滑动...";
    for (var i = 0; i < e.touches.length; i++) {
      var t = e.touches[i];
      // 每次滑动生成2个泡泡
      for (var j = 0; j < 2; j++) {
        bubbles.push({
          x: t.clientX + (Math.random() - 0.5) * 20,
          y: t.clientY + (Math.random() - 0.5) * 20,
          vx: (Math.random() - 0.5) * 2,
          vy: -Math.random() * 2 - 1,
          r: Math.random() * 20 + 10,
          color: 'hsl(' + Math.random() * 360 + ', 80%, 70%)',
          alpha: 1
        });
      }
    }
  }, { passive: false });

  // 动画循环
  function animate() {
    ctx.clearRect(0, 0, W, H);
    
    for (var i = bubbles.length - 1; i >= 0; i--) {
      var b = bubbles[i];
      b.x += b.vx;
      b.y += b.vy;
      b.alpha *= 0.98;
      
      ctx.globalAlpha = b.alpha;
      ctx.strokeStyle = b.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * b.alpha, 0, Math.PI * 2);
      ctx.stroke();

      // 如果泡泡飞出屏幕或者透明了，就删掉
      if (b.y < -50 || b.alpha < 0.05) {
        bubbles.splice(i, 1);
      }
    }
    requestAnimationFrame(animate);
  }
  
  // 启动动画
  animate();
</script>
</body>
</html>
