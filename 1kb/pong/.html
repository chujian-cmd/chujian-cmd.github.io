<!doctype html><body style=margin:0;overflow:hidden;background:#111;touch-action:none><canvas id=c><script>
C=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,PY=H/2,AY=H/2,BX=W/2,BY=H/2,VX=5,VY=3,PS=0,AS=0;
ontouchmove=e=>{e.preventDefault();PY=e.touches[0].clientY;PY=PY<40?40:PY>H-40?H-40:PY};
setInterval(()=>{
C.fillStyle='#111';C.fillRect(0,0,W,H);
BX+=VX;BY+=VY;
if(BY<8||BY>H-8)VY=-VY;
AY+=(BY-AY)*.1;
AY=AY<40?40:AY>H-40?H-40:AY;
if(BX<30&&BX>15&&BY>PY-40&&BY<PY+40&&VX<0)VX=-VX;
if(BX>W-30&&BX<W-15&&BY>AY-40&&BY<AY+40&&VX>0)VX=-VX;
if(BX<0){AS++;BX=W/2;BY=H/2;VX=5}
if(BX>W){PS++;BX=W/2;BY=H/2;VX=-5}
C.fillStyle='#fff';
C.fillRect(10,PY-40,10,80);
C.fillRect(W-20,AY-40,10,80);
C.beginPath();C.arc(BX,BY,8,0,7);C.fill();
C.font='40px sans-serif';C.fillText(PS,W/2-60,60);C.fillText(AS,W/2+20,60);
},16)
</script>
