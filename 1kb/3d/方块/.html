<!doctype html><body style=margin:0;overflow:hidden;background:#000;touch-action:none><canvas id=c><script>C=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,R=Math.random,S=[],X=Y=l=m=0,u=0,t=0;for(i=0;i<400;i++)S.push({x:(R()-.5)*400,y:(R()-.5)*400,z:(R()-.5)*400,c:R()*360});ontouchstart=e=>{u=1;l=e.touches[0].clientX;m=e.touches[0].clientY};ontouchmove=e=>{e.preventDefault();if(u){X+=(e.touches[0].clientX-l)*.005;Y+=(e.touches[0].clientY-m)*.005;l=e.touches[0].clientX;m=e.touches[0].clientY}};ontouchend=e=>u=0;setInterval(_=>{C.fillStyle='rgba(0,0,0,0.3)';C.fillRect(0,0,W,H);if(!u)X+=.01,Y+=.01;t+=.05;let w=Math.sin(t)*1.5+1.5;for(i=0;i<400;i++){s=S[i];let px=s.x*w,py=s.y*w,pz=s.z*w;let a=px*Math.cos(X)-py*Math.sin(X),b=px*Math.sin(X)+py*Math.cos(X),c=pz*Math.cos(Y)-a*Math.sin(Y),d=pz*Math.sin(Y)+a*Math.cos(Y),f=600/(c+600);if(f>0){C.fillStyle=`hsl(${s.c},100%,${50+f*10}%)`;C.beginPath();C.arc(W/2+d*f,H/2+b*f,f*2,0,7);C.fill()}}},16)</script>
