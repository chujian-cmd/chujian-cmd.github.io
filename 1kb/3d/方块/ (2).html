<!doctype html><body style=margin:0;overflow:hidden;background:#000;touch-action:none><canvas id=c><script>C=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,R=Math.random,S=[],X=Y=l=m=0,u=0;for(i=0;i<1200;i++){let edge=i%12,t=(R()-.5)*600,cx,cy,cz;if(edge==0||edge==1)cx=t,cy=-300+edge*600,cz=-300;else if(edge==2||edge==3)cx=t,cy=-300+edge%2*600,cz=300;else if(edge==4||edge==5)cy=t,cx=-300+edge%2*600,cz=-300;else if(edge==6||edge==7)cy=t,cx=-300+edge%2*600,cz=300;else if(edge==8||edge==9)cz=t,cx=-300+edge%2*600,cy=-300;else cz=t,cx=-300+edge%2*600,cy=300;S.push({x:cx,y:cy,z:cz,c:i%360})}ontouchstart=e=>{u=1;l=e.touches[0].clientX;m=e.touches[0].clientY};ontouchmove=e=>{e.preventDefault();if(u){X+=(e.touches[0].clientY-m)*.005;Y+=(e.touches[0].clientX-l)*.005;l=e.touches[0].clientX;m=e.touches[0].clientY}};ontouchend=e=>u=0;setInterval(_=>{C.fillStyle='#000';C.fillRect(0,0,W,H);if(!u){X+=.005;Y+=.008}for(i=0;i<1200;i++){s=S[i];let y1=s.y*Math.cos(X)-s.z*Math.sin(X),z1=s.y*Math.sin(X)+s.z*Math.cos(X);let x2=s.x*Math.cos(Y)-z1*Math.sin(Y),z2=s.x*Math.sin(Y)+z1*Math.cos(Y);let f=500/(z2+800);if(f>0){let r=Math.max(0.5,f*3);C.fillStyle=`hsl(${s.c},100%,${50+f*20}%)`;C.beginPath();C.arc(W/2+x2*f,H/2+y1*f,r,0,7);C.fill()}}},16)</script>
