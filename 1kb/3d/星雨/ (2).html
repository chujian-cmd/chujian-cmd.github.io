<!doctype html><body style="margin:0;overflow:hidden;background:#000;touch-action:none"><canvas id=c><script>C=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,R=Math.random,S=[],AX=0,AY=0,lx=0,ly=0,hasTouch=false;for(i=0;i<400;i++)S.push({x:(R()-.5)*800,y:(R()-.5)*800,z:R()*1000,c:R()*360});ontouchstart=e=>{e.preventDefault();hasTouch=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY};ontouchmove=e=>{e.preventDefault();if(hasTouch){AX+=(e.touches[0].clientX-lx)*.005;AY+=(e.touches[0].clientY-ly)*.005;lx=e.touches[0].clientX;ly=e.touches[0].clientY}};ontouchend=e=>{hasTouch=false};setInterval(_=>{C.fillStyle='rgba(0,0,0,0.3)';C.fillRect(0,0,W,H);if(!hasTouch){AX*=.95;AY*=.95}for(i=0;i<400;i++){s=S[i];s.z-=8;if(s.z<10){s.z=1000;s.x=(R()-.5)*800;s.y=(R()-.5)*800;s.c=R()*360}let x1=s.x*Math.cos(AX)-s.y*Math.sin(AX);let y1=s.x*Math.sin(AX)+s.y*Math.cos(AX);let z1=s.z*Math.cos(AY)-x1*Math.sin(AY);let x2=s.z*Math.sin(AY)+x1*Math.cos(AY);let f=600/z1;if(f>0&&f<10){C.fillStyle=`hsl(${s.c},100%,${50+f*5}%)`;C.beginPath();C.arc(W/2+x2*f,H/2+y1*f,f*1.5,0,7);C.fill()}}},16)</script>
