<!doctype html><body style=margin:0;overflow:hidden;background:#000;touch-action:none><canvas id=c><script>C=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,R=Math.random,S=[],X=Y=l=u=0;for(i=0;i<400;i++)S.push({x:(R()-.5)*800,y:(R()-.5)*800,z:R()*1000,c:R()*360});ontouchstart=e=>{u=1;l=e.touches[0].clientX;m=e.touches[0].clientY};ontouchmove=e=>{e.preventDefault();if(u){X+=(e.touches[0].clientX-l)*.005;Y+=(e.touches[0].clientY-m)*.005;l=e.touches[0].clientX;m=e.touches[0].clientY}};ontouchend=e=>u=0;setInterval(_=>{C.fillStyle='rgba(0,0,0,0.3)';C.fillRect(0,0,W,H);if(!u)X*=.95,Y*=.95;for(i=0;i<400;i++){s=S[i];s.z-=8;if(s.z<10){s.z=1000;s.x=(R()-.5)*800;s.y=(R()-.5)*800;s.c=R()*360}let a=s.x*Math.cos(X)-s.y*Math.sin(X),b=s.x*Math.sin(X)+s.y*Math.cos(X),c=s.z*Math.cos(Y)-a*Math.sin(Y),d=s.z*Math.sin(Y)+a*Math.cos(Y),f=600/c;if(f>0&&f<10){C.fillStyle=`hsl(${s.c},100%,${50+f*5}%)`;C.beginPath();C.arc(W/2+d*f,H/2+b*f,f*1.5,0,7);C.fill()}}},16)</script>
