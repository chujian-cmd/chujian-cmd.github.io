<!DOCTYPE html><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>✨</title><style>body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style><canvas id=c></canvas><script>C=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,A=[],onresize=_=>{W=c.width=innerWidth,H=c.height=innerHeight},onclick=e=>{for(i=0;i<60;i++)r=Math.random()*6.28,s=Math.random()*6+1,A.push([e.clientX,e.clientY,Math.cos(r)*s,Math.sin(r)*s,`hsl(${Math.random()*360},100%,60%)`])},setInterval(_=>{C.fillStyle='#0003',C.fillRect(0,0,W,H);A=A.filter(p=>{p[0]+=p[2],p[1]+=p[3],p[3]+=.15,p[2]*=.99,p[3]*=.99,C.fillStyle=p[4],C.fillRect(p[0],p[1],2,2);return p[1]<H})},16)</script>
