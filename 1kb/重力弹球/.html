<!doctype html><body style="margin:0;overflow:hidden;background:#111;touch-action:none"><canvas id=c><script>C=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,B=[],L=[],S=0,MX=0,MY=0;ontouchstart=ontouchmove=function(e){e.preventDefault();if(e.touches[0]){MX=e.touches[0].clientX;MY=e.touches[0].clientY;L.push({x:MX,y:MY,t:10})}};setInterval(function(){C.fillStyle='#111';C.fillRect(0,0,W,H);if(Math.random()<.03)B.push({x:Math.random()*W,y:-20,vx:(Math.random()-.5)*4,vy:2,c:'hsl('+Math.random()*360+',80%,60%)'});C.fillStyle='#fff';for(i=L.length-1;i>=0;i--){l=L[i];l.t--;if(l.t<=0){L.splice(i,1);continue}C.beginPath();C.arc(l.x,l.y,4,0,7);C.fill()}for(i=B.length-1;i>=0;i--){b=B[i];b.x+=b.vx;b.y+=b.vy;if(b.x<10||b.x>W-10)b.vx=-b.vx;for(j=0;j<L.length;j++){l=L[j];if(Math.abs(b.x-l.x)<15&&Math.abs(b.y-l.y)<15){b.vy=-Math.abs(b.vy);b.vx+=(b.x-l.x)*.1;S+=1;break}}if(b.y>H){B.splice(i,1);continue}C.fillStyle=b.c;C.beginPath();C.arc(b.x,b.y,10,0,7);C.fill()}C.fillStyle='#fff';C.font='20px sans-serif';C.fillText('SC:'+S,20,30)},16)</script>
