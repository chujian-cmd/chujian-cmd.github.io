<!doctype html><body style="margin:0;overflow:hidden;background:#000;touch-action:none"><canvas id=c><script>C=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,P=[],R=Math.random;function boom(x,y){for(var i=0;i<30;i++){var a=R()*6.28,s=R()*8+2;P.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c:'hsl('+R()*360+',100%,60%)',l:1})}}ontouchstart=ontouchmove=function(e){e.preventDefault();for(var i=0;i<e.touches.length;i++)boom(e.touches[i].clientX,e.touches[i].clientY)};setInterval(function(){C.fillStyle='rgba(0,0,0,0.15)';C.fillRect(0,0,W,H);for(var i=P.length-1;i>=0;i--){var p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.vx*=.98;p.vy*=.98;p.l-=.02;if(p.l<=0){P.splice(i,1);continue}C.globalAlpha=p.l;C.fillStyle=p.c;C.beginPath();C.arc(p.x,p.y,3,0,7);C.fill()}},30)</script>
