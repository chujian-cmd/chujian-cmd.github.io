<!doctype html><body style="margin:0;overflow:hidden;background:#111;touch-action:none"><canvas id=c><script>C=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,SC=0,LV=3,MX=-99,MY=-99,X=0,Y=0;function spawn(){X=Math.random()*(W-80)+40;Y=Math.random()*(H-80)+40;if(SC>10)Y+=Math.sin(Date.now()/500)*30}spawn();ontouchstart=function(e){e.preventDefault();MX=e.touches[0].clientX;MY=e.touches[0].clientY};setInterval(function(){C.clearRect(0,0,W,H);C.fillStyle='#3b82f6';C.beginPath();C.arc(X,Y,30,0,7);C.fill();if(MX>X-40&&MX<X+40&&MY>Y-40&&MY<Y+40){SC++;spawn()}else if(MX!=-99){LV--;MX=-99;if(LV<=0){SC=0;LV=3}spawn()}C.fillStyle='#fff';C.font='18px sans-serif';C.fillText('分数:'+SC+' 生命:'+LV,20,40)},30)</script>
