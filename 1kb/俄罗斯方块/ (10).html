<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>body{margin:0;overflow:hidden;background:#111;touch-action:none}canvas{display:block}</style></head><body><canvas id="c"></canvas><script>c=document.getElementById('c'),C=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,G=20,GW=200,O=(W-GW)/2,S=[],X=4,Y=0,tx=0,ty=0;r=function(){X=4,Y=0,t=~~(Math.random()*4),P=[[1,1],[1,1]];if(t==1)P=[[1,1,1,1]];if(t==2)P=[[1,0],[1,0],[1,1]];if(t==3)P=[[0,1],[0,1],[1,1]]};h=function(px,py){if(px<0||px+P[0].length>10)return 1;for(i=0;i<P.length;i++)for(j=0;j<P[i].length;j++)if(P[i][j]&&(py+i>=H/G||S[py+i]&&S[py+i][px+j]))return 1;return 0};r();ontouchstart=function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY};ontouchmove=function(e){x=e.touches[0].clientX;y=e.touches[0].clientY;dx=x-tx;if(y-ty>30){for(k=0;k<30;k++){if(h(X,Y+1))break;Y++}ty=y}else if(dx>20&&!h(X+1,Y))X++,tx=x,ty=y;else if(dx<-20&&!h(X-1,Y))X--,tx=x,ty=y};setInterval(function(){if(!h(X,Y+1))Y++;else{for(i=0;i<P.length;i++)for(j=0;j<P[i].length;j++)if(P[i][j]){if(!S[Y+i])S[Y+i]=[];S[Y+i][X+j]=1}for(i=0;i<S.length;i++){n=0;for(j=0;j<10;j++)if(S[i][j])n++;if(n==10){S.splice(i,1);S.unshift([]);i--}}r()}C.clearRect(0,0,W,H);C.fillStyle='#333';C.fillRect(O,0,GW,H);C.fillStyle='#f43';for(i=0;i<S.length;i++)for(j=0;j<10;j++)if(S[i][j])C.fillRect(O+j*G,i*G,G-1,G-1);C.fillStyle='#3bf';for(i=0;i<P.length;i++)for(j=0;j<P[i].length;j++)if(P[i][j])C.fillRect(O+(X+j)*G,(Y+i)*G,G-1,G-1)},400)</script>
