<!DOCTYPE html><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>1K</title><style>*{margin:0;box-sizing:border-box}body{min-height:100vh;display:grid;place-items:center;background:#0a0f1e;font-family:system-ui;transition:.3s}.c{background:#141e32aa;backdrop-filter:blur(12px);border-radius:2rem;padding:2rem;text-align:center;color:#eef5ff;box-shadow:0 0 0 1px #fff1 inset,0 25px 40px -10px #0009}#t{font-size:clamp(2.5rem,14vw,6rem);font-weight:600;letter-spacing:4px;font-variant-numeric:tabular-nums}#d{margin-top:.5rem;opacity:.8;border-top:1px solid #fff3;padding-top:.8rem}</style><div class=c><div id=t></div><div id=d></div></div><script>let T=t,D=d,B=document.body,C=document.querySelector('.c'),W='日一二三四五六',p=n=>n<10?'0'+n:n,U=()=>{let n=new Date,h=n.getHours(),m=n.getMinutes(),s=n.getSeconds(),x=(h*30+m*.5)%360;T.textContent=p(h)+':'+p(m)+':'+p(s);D.textContent=n.getFullYear()+'.'+p(n.getMonth()+1)+'.'+p(n.getDate())+' 周'+W[n.getDay()];B.style.background=`radial-gradient(circle at 30% 20%,hsl(${x} 60% 12%),hsl(${x} 70% 5%))`;C.style.color=`hsl(${x} 80% 85%)`;T.style.color=`hsl(${x} 90% 75%)`};U();setInterval(U,1000)</script>
