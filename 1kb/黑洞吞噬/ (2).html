<!doctype html><body style="margin:0;overflow:hidden;background:#000;touch-action:none"><canvas id=c><script>C=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,BX=W/2,BY=H/2,R=15,SC=0,MX=-99,MY=-99,ST=[];ontouchstart=ontouchmove=function(e){e.preventDefault();var t=e.touches[0];if(t){MX=t.clientX;MY=t.clientY}};setInterval(function(){if(MX!=-99){BX+=(MX-BX)*.5;BY+=(MY-BY)*.5}if(Math.random()<.1)ST.push({x:Math.random()*W,y:-10,s:Math.random()*4+2});C.clearRect(0,0,W,H);C.fillStyle='#f43';C.beginPath();C.arc(BX,BY,R,0,7);C.fill();for(var i=ST.length-1;i>=0;i--){var s=ST[i];s.y+=3;if(s.y>BY-R&&s.y<BY+R&&s.x>BX-R&&s.x<BX+R){SC+=10;if(R<60)R+=0.5;ST.splice(i,1);continue}if(s.y>H){ST.splice(i,1);continue}C.fillStyle='#fff';C.fillRect(s.x,s.y,s.s,s.s)}C.fillStyle='#fff';C.font='20px sans-serif';C.fillText('SC:'+SC,20,40)},30)</script>
