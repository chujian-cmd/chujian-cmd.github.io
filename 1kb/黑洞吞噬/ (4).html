<!doctype html><body style="margin:0;overflow:hidden;background:#000;touch-action:none"><canvas id=c><script>C=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,BX=W/2,BY=H/2,R=30,SC=0,MX=-99,MY=-99,ST=[];ontouchstart=ontouchmove=function(e){e.preventDefault();var t=e.touches[0];if(t){MX=t.clientX;MY=t.clientY}};setInterval(function(){if(MX!=-99){BX+=(MX-BX)*.15;BY+=(MY-BY)*.15}if(Math.random()<.1)ST.push({x:Math.random()*W,y:-20,vx:0,vy:2,s:Math.random()*6+6});C.clearRect(0,0,W,H);for(var i=ST.length-1;i>=0;i--){var s=ST[i],dx=BX-s.x,dy=BY-s.y,d=Math.sqrt(dx*dx+dy*dy);if(d<R){SC+=10;if(R<80)R+=0.5;ST.splice(i,1);continue}if(d<300){s.vx+=dx/d*0.5;s.vy+=dy/d*0.5}if(s.y>H+50){ST.splice(i,1);continue}s.x+=s.vx;s.y+=s.vy;C.fillStyle='#fff';C.beginPath();C.arc(s.x,s.y,s.s,0,7);C.fill()}C.fillStyle='#000';C.beginPath();C.arc(BX,BY,R,0,7);C.fill();C.strokeStyle='#f43';C.lineWidth=4;C.stroke();C.fillStyle='#fff';C.font='20px sans-serif';C.fillText('SC:'+SC,20,40)},30)</script>
