<!doctype html><body style="margin:0;overflow:hidden;background:#0f172a;touch-action:none"><canvas id=c><script>C=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,P=[],MX=0,MY=0;function r(){return Math.random()}ontouchstart=ontouchmove=function(e){e.preventDefault();var t=e.touches[0];if(t){MX=t.clientX;MY=t.clientY;for(var i=0;i<5;i++)P.push({x:MX+(r()-.5)*20,y:MY+(r()-.5)*20,vx:(r()-.5)*6,vy:(r()-.5)*6,c:'hsl('+r()*360+',80%,60%)',s:r()*3+2})}};setInterval(function(){C.clearRect(0,0,W,H);if(r()<.5)P.push({x:r()*W,y:H+10,vx:(r()-.5)*2,vy:-r()*2-1,c:'hsl('+r()*360+',80%,60%)',s:r()*4+2});for(var i=P.length-1;i>=0;i--){var p=P[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.98;p.vy+=.05;p.vy*=.98;if(p.y>H+20){P.splice(i,1);continue}C.fillStyle=p.c;C.beginPath();C.arc(p.x,p.y,p.s,0,7);C.fill()}},30)</script>
