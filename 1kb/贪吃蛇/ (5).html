<!DOCTYPE html><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><body style="margin:0;background:#111;touch-action:none"><canvas id=c><script>
C=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,G=20,F=[];
r=_=>F=[~~(Math.random()*W/G),~~(Math.random()*H/G)];
R=_=>(S=[[5,5],[4,5],[3,5]],D=[1,0],r());R();
ontouchstart=e=>u=e.touches[0].clientX,v=e.touches[0].clientY;
ontouchmove=e=>{
  e.preventDefault();let x=e.touches[0].clientX-u,y=e.touches[0].clientY-v;
  if(x*x>y*y){
    if(x*x>225&&D[0]!=(x>0?-1:1))D=[x>0?1:-1,0],u+=x
  }else{
    if(y*y>225&&D[1]!=(y>0?-1:1))D=[0,y>0?1:-1],v+=y
  }
};
setInterval(_=>{
  h=[S[0][0]+D[0],S[0][1]+D[1]];
  if(h[0]<0||h[0]>=W/G||h[1]<0||h[1]>=H/G||S.some(p=>p+''==h+'')){R();return}
  S.unshift(h);
  h+''==F+''?r():S.pop();
  c.width=W;
  C.fillStyle='#f43';C.fillRect(F[0]*G,F[1]*G,18,18);
  C.fillStyle='#3bf';for(i of S)C.fillRect(i[0]*G,i[1]*G,18,18)
},100);
</script>
