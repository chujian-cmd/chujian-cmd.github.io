<!DOCTYPE html><meta charset="UTF-8"><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><style>body{margin:0;overflow:hidden;background:#111;touch-action:none}canvas{display:block}</style><canvas id=c></canvas><script>
C=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,G=20,lx=0,ly=0,S=[],D=[],F=[];
R=_=>{S=[[5,5],[4,5],[3,5]],D=[1,0]};r=_=>{F=[~~(Math.random()*W/G),~~(Math.random()*H/G)]};
R();r();
document.addEventListener('touchstart',e=>{lx=e.touches[0].clientX;ly=e.touches[0].clientY});
document.addEventListener('touchmove',e=>{
  e.preventDefault();let x=e.touches[0].clientX-lx,y=e.touches[0].clientY-ly;
  if(Math.abs(x)>Math.abs(y)){
    if(Math.abs(x)>15&&D[0]!=-Math.sign(x)){D=[Math.sign(x),0];lx+=x}
  }else{
    if(Math.abs(y)>15&&D[1]!=-Math.sign(y)){D=[0,Math.sign(y)];ly+=y}
  }
},{passive:0});
setInterval(_=>{
  let h=[S[0][0]+D[0],S[0][1]+D[1]];
  if(h[0]<0||h[0]>=W/G||h[1]<0||h[1]>=H/G||S.some(p=>p[0]==h[0]&&p[1]==h[1])){
    R();r();return;
  }
  S.unshift(h);
  if(h[0]==F[0]&&h[1]==F[1])r();else S.pop();
  C.fillStyle='#111';C.fillRect(0,0,W,H);
  C.fillStyle='#f43';C.fillRect(F[0]*G,F[1]*G,G-2,G-2);
  C.fillStyle='#3bf';S.forEach(p=>C.fillRect(p[0]*G,p[1]*G,G-2,G-2));
},120);
</script>
