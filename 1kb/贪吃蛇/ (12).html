<!DOCTYPE html><meta charset="UTF-8"><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><body style="margin:0;overflow:hidden;background:#111;touch-action:none"><canvas id="c"></canvas><script>
var C=document.getElementById('c').getContext('2d'),W=C.canvas.width=innerWidth,H=C.canvas.height=innerHeight,G=20,sx=0,sy=0,F,S,D;
var r=function(){F=[~~(Math.random()*W/G),~~(Math.random()*H/G)]};
var R=function(){S=[[5,5],[4,5],[3,5]];D=[1,0];r()};R();
document.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY});
document.addEventListener('touchmove',function(e){
  e.preventDefault();
  var x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy;
  if(Math.abs(x)>Math.abs(y)){
    if(x>15&&D[0]!=-1){D=[1,0];sx+=x}
    if(x<-15&&D[0]!=1){D=[-1,0];sx+=x}
  }else{
    if(y>15&&D[1]!=-1){D=[0,1];sy+=y}
    if(y<-15&&D[1]!=1){D=[0,-1];sy+=y}
  }
},{passive:false});
setInterval(function(){
  var hx=S[0][0]+D[0],hy=S[0][1]+D[1],e=(hx==F[0]&&hy==F[1]);
  if(hx<0||hx>=W/G||hy<0||hy>=H/G){R();return}
  for(var i=0;i<S.length-!e;i++){if(S[i][0]==hx&&S[i][1]==hy){R();return}}
  S.unshift([hx,hy]);
  if(e){r()}else{S.pop()}
  C.fillStyle='#111';C.fillRect(0,0,W,H);
  C.fillStyle='#f43';C.fillRect(F[0]*G,F[1]*G,18,18);
  C.fillStyle='#3bf';for(var j=0;j<S.length;j++){C.fillRect(S[j][0]*G,S[j][1]*G,18,18)}
},100);
</script>
