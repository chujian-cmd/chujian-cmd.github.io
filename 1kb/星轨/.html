<!doctype html><body style="margin:0;overflow:hidden;background:#050510;touch-action:none"><canvas id=c><script>C=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,P=[];ontouchstart=ontouchmove=function(e){e.preventDefault();for(var i=0;i<e.touches.length;i++){var t=e.touches[i];for(var j=0;j<3;j++)P.push({x:t.clientX+(Math.random()-.5)*10,y:t.clientY+(Math.random()-.5)*10,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,l:1,c:'hsl('+(Math.random()*360)+',100%,60%)'})}};setInterval(function(){C.globalCompositeOperation='source-over';C.fillStyle='rgba(5,5,16,0.2)';C.fillRect(0,0,W,H);C.globalCompositeOperation='lighter';for(var i=P.length-1;i>=0;i--){var p=P[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy*=.95;p.l-=.02;if(p.l<=0){P.splice(i,1);continue}C.fillStyle=p.c;C.globalAlpha=p.l;C.beginPath();C.arc(p.x,p.y,3,0,7);C.fill()}},30)</script>
