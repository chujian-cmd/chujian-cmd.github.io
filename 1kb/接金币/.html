<!doctype html><body style="margin:0;overflow:hidden;background:#1a1a2e;touch-action:none"><canvas id=c><script>C=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,BX=W/2,SC=0,LV=3;GY=0,GX=0;function spawn(){GX=Math.random()*(W-20)+10;GY=-20}spawn();ontouchmove=function(e){e.preventDefault();var t=e.touches[0];if(t)BX=t.clientX};setInterval(function(){C.clearRect(0,0,W,H);GY+=4;if(GY>H-60&&GY<H-30&&GX>BX-30&&GX<BX+30){SC++;spawn()}if(GY>H){LV--;if(LV<=0){SC=0;LV=3}spawn()}C.fillStyle='#0f3460';C.fillRect(0,H-20,W,20);C.fillStyle='#e94560';C.fillRect(GX,GY,16,16);C.fillStyle='#fff';C.fillRect(BX-25,H-60,50,20);C.font='16px sans-serif';C.fillText('分数:'+SC+' 生命:'+LV,10,25)},100)</script>
